<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시화 - Quota 해결 + 오프라인 폴백</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#e8e8e8;min-height:100vh;padding:30px 16px;line-height:1.7}
.container{max-width:980px;margin:0 auto}
h1{font-family:'Noto Serif KR',serif;text-align:center;font-size:2.15rem;letter-spacing:2px}
.subtitle{text-align:center;color:#a0aec0;margin-bottom:24px;font-size:.9rem}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;margin-bottom:20px;backdrop-filter:blur(10px)}
.card-title{font-size:.9rem;font-weight:600;color:#90cdf4;margin-bottom:12px}
.control-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:12px}
.control-group{flex:1;min-width:170px}
label{display:block;font-size:.78rem;color:#a0aec0;margin-bottom:6px;font-weight:500}
select,input[type=file],input[type=password]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#e8e8e8;font-size:.86rem;outline:none}
select:focus,input:focus{border-color:#63b3ed}
select option{background:#1a1a2e}
audio{width:100%;margin-top:8px;border-radius:10px}

.primary{background:linear-gradient(135deg,#3182ce,#2b6cb0);color:#fff}

.secondary{background:rgba(255,255,255,.1);color:#e2e8f0;border:1px solid rgba(255,255,255,.15)}

.image-area img{width:100%;height:auto;display:block;border-radius:12px}

canvas#videoCanvas{display:none;width:1280px;height:720px}

.quota-box a{color:#90cdf4;text-decoration:underline}

<body>
<div class="container">

</div>
<div class="card">
<div class="card-title">음악 업로드</div>
<div class="control-row"><div class="control-group"><label>음악 파일 (mp3/wav/m4a)</label><input type="file" id="audioInput" accept="audio/*"></div></div>
<audio id="audioPlayer" controls style="display:none"></audio>

</div>

<div class="analysis-box" id="analysisBox"></div>
<div class="video-result" id="videoResult"><video id="resultVideo" controls playsinline></video><div class="btn-row"><a id="downloadLink" class="secondary" style="text-decoration:none;padding:10px 16px;border-radius:10px;display:inline-block" download="sihwa_video.webm">영상 다운로드</a></div></div>
</div>
<div id="versesContainer"><div class="empty-state" id="emptyState"><span>🎵</span>음악 올리면 오프라인 분석으로도 시와 프롬프트가 바로 생겨</div></div>
<canvas id="videoCanvas" width="1280" height="720"></canvas>
</div>
<script>
const NEW_AUDIO = ['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3-flash-preview','gemini-flash-latest'];
const NEW_IMAGE = ['gemini-3-pro-image-preview','gemini-3-pro-image','gemini-3.1-flash-image-preview','gemini-3.1-flash-image','gemini-2.5-flash-image','gemini-nano-banana-2.1'];
const styleSuffix={
  watercolor:"delicate watercolor painting, soft wet-on-wet, paper texture, muted autumn palette",
  korean:"traditional Korean painting, hanji texture, elegant brushwork",
  ink:"ink wash sumi-e, expressive brush, rice paper, minimalist",
  oil:"classical oil painting, impasto, warm chiaroscuro",
  dreamy:"dreamy illustration, soft glowing light, ethereal, cinematic",
  anime:"anime aesthetic, Makoto Shinkai background, beautiful lighting"
};
const audioInput=document.getElementById('audioInput'), audioPlayer=document.getElementById('audioPlayer');
const apiKeyInput=document.getElementById('apiKeyInput'), saveKeyBtn=document.getElementById('saveKeyBtn');
const audioModelSelect=document.getElementById('audioModelSelect'), imageModelSelect=document.getElementById('imageModelSelect'), styleSelect=document.getElementById('styleSelect');
const analyzeBtn=document.getElementById('analyzeBtn'), offlineBtn=document.getElementById('offlineBtn'), generateAllBtn=document.getElementById('generateAllBtn'), makeVideoBtn=document.getElementById('makeVideoBtn');
const versesContainer=document.getElementById('versesContainer'), emptyState=document.getElementById('emptyState');
const mainStatus=document.getElementById('mainStatus'), apiStatus=document.getElementById('apiStatus'), analysisBox=document.getElementById('analysisBox'), quotaBox=document.getElementById('quotaBox');
const videoCanvas=document.getElementById('videoCanvas'), ctx=videoCanvas.getContext('2d');
let currentFile=null, currentAnalysis=null, generatedImages={};
function populate(){
  NEW_AUDIO.forEach(m=>{ const o=document.createElement('option');o.value=m;o.textContent=m; if(m==='gemini-3.8-flash') o.selected=true; audioModelSelect.appendChild(o); });
  NEW_IMAGE.forEach(m=>{ const o=document.createElement('option');o.value=m;o.textContent=m; if(m==='gemini-3-pro-image-preview') o.selected=true; imageModelSelect.appendChild(o); });
}
populate();
function loadKey(){ const k=localStorage.getItem('gemini_api_key'); if(k){ apiKeyInput.value=k; apiStatus.textContent='저장된 키 불러옴'; } }
loadKey();
function getKey(){ return apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key') || ''; }
saveKeyBtn.onclick=async()=>{
  const k=apiKeyInput.value.trim(); if(!k){ apiStatus.textContent='키 입력 필요'; return; }
  localStorage.setItem('gemini_api_key',k); apiStatus.textContent='키 저장됨, 모델 조회 중...';
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${k}`);
    const j=await r.json();
    if(j.models){ const names=j.models.map(m=>m.name.replace('models/','')); apiStatus.textContent=`모델 ${names.length}개 확인. 사용 가능: ${names.slice(0,8).join(', ')}`; const first=NEW_AUDIO.find(m=>names.includes(m)); if(first) audioModelSelect.value=first; }
    else apiStatus.textContent='조회 실패: '+(j.error?.message||'');
  }catch(e){ apiStatus.textContent='조회 실패: '+e.message; }
};
audioInput.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; currentFile=f; const url=URL.createObjectURL(f); audioPlayer.src=url; audioPlayer.style.display='block'; analyzeBtn.disabled=false; offlineBtn.disabled=false; mainStatus.textContent=`${f.name} ${(f.size/1024/1024).toFixed(2)}MB 로드됨. 무료 티어라면 오른쪽 오프라인 버튼 추천`; mainStatus.className='status ok';
});
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function trimAudioTo30s(file){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const ab=await file.arrayBuffer();
    const decoded=await ac.decodeAudioData(ab.slice(0));
    const maxDur=30;
    const dur=Math.min(decoded.duration,maxDur);
    const sampleRate=16000;
    const offline=new OfflineAudioContext(1, dur*sampleRate, sampleRate);
    const src=offline.createBufferSource(); src.buffer=decoded;
    src.connect(offline.destination); src.start(0);
    const rendered=await offline.startRendering();
    // encode to wav base64 roughly - we will just re-encode as base64 of original slice? simpler: return original base64 but trimmed via duration param in API? We'll slice file bytes roughly for mp3 it's not precise but reduces tokens.
    // For simplicity, if file > 1.5MB, we slice first 30 sec via webm? We'll just use rendered buffer to create wav blob
    const wavBlob=audioBufferToWavBlob(rendered);
    const b64=await fileToBase64(wavBlob);
    return {b64, mime:'audio/wav', trimmed:true, duration:dur};
  }catch(e){ console.warn('trim fail',e); const b64=await fileToBase64(file); return {b64, mime:file.type||'audio/mp3', trimmed:false}; }
}
function audioBufferToWavBlob(buffer){
  const numChannels=1; const sampleRate=buffer.sampleRate;
  const format=1; const bitDepth=16;
  const data=buffer.getChannelData(0);
  const dataLength=data.length * (bitDepth/8);
  const headerLength=44; const arrayBuffer=new ArrayBuffer(headerLength+dataLength); const view=new DataView(arrayBuffer);
  function writeString(offset,str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i,str.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4,36+dataLength,true); writeString(8,'WAVE'); writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,format,true); view.setUint16(22,numChannels,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*numChannels*bitDepth/8,true); view.setUint16(32,numChannels*bitDepth/8,true); view.setUint16(34,bitDepth,true); writeString(36,'data'); view.setUint32(40,dataLength,true);
  let offset=44; for(let i=0;i<data.length;i++,offset+=2){ const s=Math.max(-1,Math.min(1,data[i])); view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true); }
  return new Blob([view],{type:'audio/wav'});
}
// --- OFFLINE ANALYSIS ---
async function analyzeOffline(){
  if(!currentFile){ mainStatus.textContent='파일 먼저 선택'; return; }
  offlineBtn.disabled=true; mainStatus.textContent='오프라인 분석 중 (Web Audio API)...'; mainStatus.className='status';
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const ab=await currentFile.arrayBuffer();
    const decoded=await ac.decodeAudioData(ab.slice(0));
    const duration=decoded.duration;
    const channel=decoded.getChannelData(0);
    // RMS energy
    let sum=0; for(let i=0;i<channel.length;i+=100) sum+=channel[i]*channel[i];
    const rms=Math.sqrt(sum/(channel.length/100));
    const energy = rms>0.15?'high':rms>0.06?'medium':'low';
    // zero crossing rate approx for tempo feel
    let zcr=0; for(let i=1;i<channel.length;i+=1000){ if((channel[i-1000]>=0)!==(channel[i]>=0)) zcr++; }
    const tempoEst = zcr>120?'fast':zcr>60?'medium':'slow';
    const moodMap={
      'low_slow':{mood:'서정적이며 고요한 가을밤',colors:['muted blue','soft gray','warm amber'],keywords:['빗소리','그리움','고요']},
      'low_medium':{mood:'잔잔하고 몽환적인 새벽',colors:['pale lavender','misty blue','warm beige'],keywords:['안개','기억','속삭임']},
      'medium_slow':{mood:'따뜻하고 쓸쓸한 노을',colors:['dusty rose','amber','olive'],keywords:['노을','편지','시간']},
      'medium_medium':{mood:'담담한 일상 속 위로',colors:['sage green','cream','soft brown'],keywords:['찻잔','창문','바람']},
      'high_fast':{mood:'희망적이고 밝은 아침',colors:['sky blue','sunlight yellow','white'],keywords:['햇살','웃음','출발']},
      'high_medium':{mood:'벅차오르는 감정의 파도',colors:['deep indigo','crimson','gold'],keywords:['파도','심장','울림']}
    };
    const key=`${energy}_${tempoEst}`; const meta=moodMap[key]||moodMap['low_slow'];
    // generate 4 verses based on mood
    const templates={
      '서정적이며 고요한 가을밤':[
        ["창문에 맺힌 빗방울이","가을 저녁을 길게 늘어뜨린다"],
        ["네가 남긴 찻잔 자리","아직 따뜻한 자국이 남아"],
        ["기억은 수채화처럼 번지고","얼굴은 점점 흐려지는데"],
        ["언젠가는 이 비도 그치고","창문은 다시 맑아지겠지"]
      ],
      '잔잔하고 몽환적인 새벽':[
        ["안개 속에 잠긴 거리","발자국 소리만 남아 있다"],
        ["희미한 가로등 아래","오래된 노래가 흐른다"],
        ["잠들지 못한 마음이","새벽을 천천히 적신다"],
        ["이윽고 해가 뜨면","모든 꿈은 흰 종이가 되겠지"]
      ],
      '따뜻하고 쓸쓸한 노을':[
        ["노을이 벽을 물들일 때","네 목소리가 겹쳐 들린다"],
        ["식탁 위 빈 의자 하나","아직도 네 자리를 지킨다"],
        ["바람은 커튼 끝만 들어올리고","시간은 조용히 식어간다"],
        ["내일은 조금 더 웃으며","이 저녁을 추억할 수 있을까"]
      ]
    };
    const chosen = templates[meta.mood] || templates['서정적이며 고요한 가을밤'];
    const verses=chosen.map(pair=>({
      ko: pair.join('\n'),
      base_en: `${pair.join(' ')}, ${meta.keywords.join(', ')}, ${meta.mood} mood, ${energy} energy, ${tempoEst} tempo, ${meta.colors.join(', ')} palette, poetic still life, soft cinematic lighting, highly detailed, emotional atmosphere, autumn, rain, nostalgic`
    }));
    const analysis={mood:meta.mood, tempo:tempoEst+` (~${Math.round(duration)}s)`, energy, instruments:['piano','ambient pad'], colors:meta.colors, keywords:meta.keywords, verses};
    currentAnalysis=analysis;
    analysisBox.style.display='block';
    analysisBox.innerHTML=`<b>오프라인 분석 (무료)</b><br><b>Mood:</b> ${analysis.mood}<br><b>Tempo:</b> ${analysis.tempo} / <b>Energy:</b> ${analysis.energy}<br><b>Colors:</b> ${analysis.colors.join(', ')}<br><b>Duration:</b> ${duration.toFixed(1)}s`;
    renderVerses(verses);
    generateAllBtn.disabled=false;
    mainStatus.textContent=`오프라인 분석 완료 ✓ 에너지 ${energy} / 템포 ${tempoEst}. 이제 이미지 생성 가능`; mainStatus.className='status ok';
  }catch(e){
    console.error(e); mainStatus.textContent='오프라인 분석 실패: '+e.message; mainStatus.className='status error';
  }finally{ offlineBtn.disabled=false; }
}
async function callGeminiWithFallback(apiKey, preferred, fallbacks, payload){
  const list=[preferred,...fallbacks.filter(m=>m!==preferred)];
  let last='';
  for(const model of list){
    try{
      mainStatus.textContent=`${model} 시도 중... (30초 트림 적용)`; mainStatus.className='status';
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!resp.ok){
        const txt=await resp.text(); last=`${model} ${resp.status}: ${txt.slice(0,800)}`;
        if(resp.status===404 || resp.status===429 || txt.includes('NOT_FOUND') || txt.includes('no longer available') || txt.includes('Quota')){ 
          if(resp.status===429){
            quotaBox.style.display='block';
            quotaBox.innerHTML=`<b>429 할당량 초과</b><br>${txt.slice(0,500)}<br><br>무료 티어는 오디오 토큰이 0으로 제한된 경우가 많습니다.<br>해결: <a href='https://aistudio.google.com/app/apikey' target='_blank'>AI Studio 결제 활성화</a> 또는 <b>오프라인 분석 버튼</b>으로 계속 진행하세요.<br><a href='https://ai.google.dev/gemini-api/docs/rate-limits' target='_blank'>Rate limits 문서</a> | <a href='https://ai.dev/rate-limit' target='_blank'>사용량 확인</a>`;
          }
          continue; 
        }
        throw new Error(last);
      }
      const data=await resp.json(); return {data, modelUsed:model};
    }catch(e){ last=e.message; continue; }
  }
  throw new Error('모든 모델 실패. 마지막: '+last);
}
async function analyzeWithGemini(){
  const apiKey=getKey(); if(!apiKey){ mainStatus.textContent='키 없어서 Gemini 분석 불가, 오프라인 버튼 눌러'; mainStatus.className='status error'; return; }
  if(!currentFile){ mainStatus.textContent='파일 선택 필요'; return; }
  analyzeBtn.disabled=true; quotaBox.style.display='none';
  try{
    mainStatus.textContent='오디오 30초로 트리밍 중 (토큰 절약)...';
    const {b64,mime,trimmed}=await trimAudioTo30s(currentFile);
    const prompt=`Analyze this audio (first 30 seconds). Return ONLY valid JSON, no markdown. {"mood":"Korean","tempo":"slow/medium/fast","energy":"low/medium/high","instruments":["piano"],"colors":["muted blue"],"keywords":["rain"],"verses":[{"ko":"한글시 두줄\\n두번째줄","base_en":"detailed English prompt 35+ words"},{"ko":"...","base_en":"..."},{"ko":"...","base_en":"..."},{"ko":"...","base_en":"..."}]} 4 verses, Korean poetic, English vivid 35+ words.`;
    const payload={contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime,data:b64}}]}],generationConfig:{temperature:0.8,maxOutputTokens:2500}};
    const fallbacks=[...NEW_AUDIO];
    const {data,modelUsed}=await callGeminiWithFallback(apiKey,audioModelSelect.value,fallbacks,payload);
    const text=data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';
    const m=text.match(/\{[\s\S]*\}/); if(!m) throw new Error('JSON 파싱 실패: '+text.slice(0,600));
    const parsed=JSON.parse(m[0]);
    currentAnalysis=parsed;
    analysisBox.style.display='block';
    analysisBox.innerHTML=`<b>Gemini 성공 (${modelUsed} ${trimmed?'/ 30s trim':''})</b><br><b>Mood:</b> ${parsed.mood} / <b>Tempo:</b> ${parsed.tempo}<br><b>Instruments:</b> ${(parsed.instruments||[]).join(', ')}<br><b>Colors:</b> ${(parsed.colors||[]).join(', ')}`;
    renderVerses(parsed.verses); generateAllBtn.disabled=false;
    mainStatus.textContent=`Gemini 분석 성공 (${modelUsed}) ✓`; mainStatus.className='status ok';
  }catch(e){
    console.error(e); mainStatus.textContent='분석 실패: '+e.message+'\n→ 오프라인 분석 버튼으로 계속 가능'; mainStatus.className='status error';
  }finally{ analyzeBtn.disabled=false; }
}
function getFullPrompt(base_en,style){ return `${base_en}, ${styleSuffix[style]}, masterpiece, best quality, highly detailed, 8k, soft cinematic lighting, poetic`; }
function renderVerses(verses){
  versesContainer.innerHTML='';
  verses.forEach((verse,i)=>{
    const div=document.createElement('div');div.className='verse';div.id=`verse-${i}`;
    const prompt=getFullPrompt(verse.base_en, styleSelect.value);
    div.innerHTML=`<div class="verse-number">VERSE ${String(i+1).padStart(2,'0')}</div><div class="poem-text">${verse.ko}</div><div class="prompt-box"><div class="prompt-label"><span>ComfyUI Prompt</span><div><button class="copy-btn" data-i="${i}">복사</button><button class="gen-one-btn" data-i="${i}">생성</button></div></div><div class="prompt-text" id="prompt-${i}">${prompt}</div></div><div class="image-area" id="image-area-${i}"><div class="image-placeholder">이미지 대기</div></div>`;
    versesContainer.appendChild(div);
  });
  versesContainer.querySelectorAll('.copy-btn').forEach(b=>{ b.onclick=()=>{ const t=document.getElementById(`prompt-${b.dataset.i}`).innerText; navigator.clipboard.writeText(t); b.textContent='복사됨'; setTimeout(()=>b.textContent='복사',900); }; });
  versesContainer.querySelectorAll('.gen-one-btn').forEach(b=>{ b.onclick=()=>generateOne(parseInt(b.dataset.i)); });
  document.querySelectorAll('.verse').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'), i*150));
}
styleSelect.addEventListener('change',()=>{ if(currentAnalysis?.verses) renderVerses(currentAnalysis.verses); });
function pollinationsGenerate(prompt, area){
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=768&nologo=true&seed=${Math.floor(Math.random()*100000)}`;
  return new Promise((res,rej)=>{
    area.innerHTML=`<div class="loading-spinner"></div>`;
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{ area.innerHTML=''; area.appendChild(img); const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); res({dataUrl:c.toDataURL('image/png'), element:img, url}); };
    img.onerror=()=>{ area.innerHTML=`<div class="image-placeholder">실패</div>`; rej(new Error('pollinations fail')); };
    img.src=url;
  });
}
async function generateOne(index){
  const prompt=document.getElementById(`prompt-${index}`)?.innerText; if(!prompt) return;
  const area=document.getElementById(`image-area-${index}`); const apiKey=getKey(); const model=imageModelSelect.value;
  area.innerHTML=`<div class="loading-spinner"></div>`;
  try{
    if(apiKey){
      const payload={contents:[{parts:[{text:prompt}]}],generationConfig:{responseModalities:["TEXT","IMAGE"]}};
      const fallbacks=[...NEW_IMAGE];
      let last=''; let dataUrl=null; let modelUsed=model;
      for(const m of [model,...fallbacks.filter(x=>x!==model)]){
        try{
          const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          if(!resp.ok){ last=await resp.text(); if(resp.status===429 || resp.status===404) continue; throw new Error(last.slice(0,400)); }
          const data=await resp.json(); const parts=data.candidates?.[0]?.content?.parts||[];
          for(const p of parts){ if(p.inlineData?.data){ dataUrl=`data:${p.inlineData.mimeType||'image/png'};base64,${p.inlineData.data}`; modelUsed=m; break; } if(p.inline_data?.data){ dataUrl=`data:${p.inline_data.mime_type||'image/png'};base64,${p.inline_data.data}`; modelUsed=m; break; } }
          if(dataUrl) break;
        }catch(e){ last=e.message; continue; }
      }
      if(!dataUrl) throw new Error('Gemini 이미지 실패, 폴백으로 전환: '+last.slice(0,200));
      area.innerHTML=`<img src="${dataUrl}"><div style="position:absolute;bottom:6px;right:8px;font-size:.6rem;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px">${modelUsed}</div>`; area.style.position='relative';
      generatedImages[index]={dataUrl, element:area.querySelector('img'), url:dataUrl};
    }else{
      const r=await pollinationsGenerate(prompt, area); generatedImages[index]=r;
    }
    checkReady();
  }catch(e){
    console.warn(e);
    try{ const r=await pollinationsGenerate(prompt, area); generatedImages[index]=r; checkReady(); }
    catch(e2){ area.innerHTML=`<div class="image-placeholder">실패: ${e.message.slice(0,180)}</div>`; }
  }
}
async function generateAll(){ if(!currentAnalysis) return; generateAllBtn.disabled=true; generateAllBtn.textContent='생성 중...'; generatedImages={}; for(let i=0;i<currentAnalysis.verses.length;i++){ await generateOne(i); await new Promise(r=>setTimeout(r,600)); } generateAllBtn.disabled=false; generateAllBtn.textContent='2. 이미지 전체 생성'; }
function checkReady(){ if(currentAnalysis && Object.keys(generatedImages).length===currentAnalysis.verses.length){ makeVideoBtn.disabled=false; mainStatus.textContent='이미지 완료! 영상 만들기 가능'; mainStatus.className='status ok'; } }
async function makeVideo(){
  if(!currentAnalysis) return; const total=currentAnalysis.verses.length; if(Object.keys(generatedImages).length<total){ mainStatus.textContent='이미지 아직 다 안됨'; return; }
  mainStatus.textContent='시화영상 인코딩 중...'; makeVideoBtn.disabled=true;
  const durationPer=4, totalDuration=durationPer*total, fps=30; const imgs=[];
  for(let i=0;i<total;i++){ const g=generatedImages[i]; const img=new Image(); img.crossOrigin='anonymous'; img.src=g.dataUrl; await new Promise(r=>{ img.onload=r; img.onerror=r; }); imgs.push(img); }
  const canvasStream=videoCanvas.captureStream(fps); let combined=canvasStream;
  try{ let aStream=null; if(audioPlayer.captureStream) aStream=audioPlayer.captureStream(); else if(audioPlayer.mozCaptureStream) aStream=audioPlayer.mozCaptureStream(); if(aStream && aStream.getAudioTracks().length>0) combined=new MediaStream([...canvasStream.getVideoTracks(),...aStream.getAudioTracks()]); }catch{}
  const recorder=new MediaRecorder(combined,{mimeType:'video/webm;codecs=vp9'}); const chunks=[]; recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); }; const done=new Promise(r=>recorder.onstop=r); recorder.start(100);
  const start=performance.now(); let frame=0; const totalFrames=totalDuration*fps;
  function draw(now){ const elapsed=(now-start)/1000; if(elapsed>=totalDuration) return; const idx=Math.min(Math.floor(elapsed/durationPer),total-1); const prog=(elapsed%durationPer)/durationPer; const img=imgs[idx]; const poem=currentAnalysis.verses[idx].ko; const zoom=1+prog*0.08; ctx.fillStyle='#000'; ctx.fillRect(0,0,1280,720); if(img){ const scale=Math.max(1280/img.width,720/img.height)*zoom; const w=img.width*scale,h=img.height*scale; const x=(1280-w)/2+Math.sin(prog*Math.PI)*16; const y=(720-h)/2; ctx.drawImage(img,x,y,w,h); } const grad=ctx.createLinearGradient(0,500,0,720); grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,.7)'); ctx.fillStyle=grad; ctx.fillRect(0,0,1280,720); ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(0,0,1280,720); const alpha=prog<0.15?prog/0.15:prog>0.85?(1-prog)/0.15:1; ctx.globalAlpha=alpha; ctx.fillStyle='#fff'; ctx.font='600 44px "Noto Serif KR", serif'; ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=18; poem.split('\n').forEach((line,j)=>ctx.fillText(line,640,520+j*60)); ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.fillStyle='rgba(144,205,244,.85)'; ctx.font='500 16px "Noto Sans KR"'; ctx.textAlign='left'; ctx.fillText(`VERSE ${String(idx+1).padStart(2,'0')} / ${total}`,36,44); frame++; if(frame<totalFrames) requestAnimationFrame(draw); }
  requestAnimationFrame(draw); if(audioPlayer.src){ audioPlayer.currentTime=0; audioPlayer.play().catch(()=>{}); }
  setTimeout(()=>{ recorder.stop(); audioPlayer.pause(); }, totalDuration*1000+300); await done;
  const blob=new Blob(chunks,{type:'video/webm'}); const url=URL.createObjectURL(blob); const resultVideo=document.getElementById('resultVideo'); const downloadLink=document.getElementById('downloadLink'); const videoResult=document.getElementById('videoResult'); resultVideo.src=url; downloadLink.href=url; videoResult.style.display='block'; mainStatus.textContent='시화영상 완성!'; mainStatus.className='status ok'; makeVideoBtn.disabled=false; videoResult.scrollIntoView({behavior:'smooth'});
}
analyzeBtn.addEventListener('click', analyzeWithGemini);
offlineBtn.addEventListener('click', analyzeOffline);
generateAllBtn.addEventListener('click', generateAll);
makeVideoBtn.addEventListener('click', makeVideo);
</script>
