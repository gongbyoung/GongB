<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시화 - 음악과 함께하는 그림 시 (Gemini Complete)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.7;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 {
      font-family: 'Noto Serif KR', serif;
      text-align: center;
      font-size: 2.3rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f5f5f5;
      letter-spacing: 2px;
    }
    .subtitle { text-align: center; color: #a0aec0; margin-bottom: 30px; font-size: 0.95rem; }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }
    .card-title { font-size: 0.95rem; font-weight: 600; color: #90cdf4; margin-bottom: 16px; letter-spacing: 0.5px; }
    .control-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; margin-bottom: 18px; }
    .control-group { flex: 1; min-width: 180px; }
    label { display: block; font-size: 0.82rem; color: #a0aec0; margin-bottom: 8px; font-weight: 500; }
    select, input[type="file"], input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35); color: #e8e8e8; font-size: 0.9rem; outline: none;
    }
    select:focus, input:focus { border-color: #63b3ed; }
    select option { background: #1a1a2e; }
    audio { width: 100%; margin-top: 12px; border-radius: 10px; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    button {
      border: none; padding: 11px 20px; border-radius: 10px;
      font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .primary { background: linear-gradient(135deg, #3182ce, #2b6cb0); color: white; }
    .primary:hover { filter: brightness(1.15); }
    .secondary { background: rgba(255,255,255,0.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15); }
    .secondary:hover { background: rgba(255,255,255,0.15); }
    button:disabled { background: #4a5568; cursor: not-allowed; filter: none; opacity: 0.6; }
    .hint { font-size: 0.78rem; color: #718096; margin-top: 12px; line-height: 1.6; }
    .status { font-size: 0.85rem; color: #fbd38d; margin-top: 12px; min-height: 20px; white-space: pre-wrap; }
    .analysis-box {
      background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px;
      font-size: 0.85rem; color: #cbd5e0; display: none; margin-top: 14px;
    }
    .analysis-box b { color: #90cdf4; }
    .verse {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 26px; margin-bottom: 26px;
      opacity: 0; transform: translateY(20px); transition: all 0.55s ease; display: none;
    }
    .verse.visible { display: block; opacity: 1; transform: translateY(0); }
    .verse-number { font-size: 0.78rem; color: #63b3ed; letter-spacing: 2px; margin-bottom: 12px; font-weight: 500; }
    .poem-text { font-family: 'Noto Serif KR', serif; font-size: 1.2rem; line-height: 1.9; color: #f0f0f0; margin-bottom: 18px; white-space: pre-line; }
    .prompt-box { background: rgba(0, 0, 0, 0.35); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
    .prompt-label { font-size: 0.72rem; color: #a0aec0; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .prompt-text { font-family: 'Courier New', monospace; font-size: 0.82rem; color: #90cdf4; line-height: 1.5; word-break: break-word; }
    .copy-btn, .gen-one-btn { background: rgba(99, 179, 237, 0.2); border: 1px solid rgba(99, 179, 237, 0.4); color: #90cdf4; padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; margin-left: 6px; }
    .image-area {
      width: 100%; min-height: 300px; background: rgba(0, 0, 0, 0.25); border-radius: 12px;
      display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
    }
    .image-area img { width: 100%; height: auto; display: block; border-radius: 12px; }
    .image-placeholder { color: #718096; font-size: 0.88rem; text-align: center; padding: 40px 20px; }
    .loading-spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #63b3ed; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 70px 20px; color: #718096; font-size: 1rem; }
    .empty-state span { display: block; font-size: 2.2rem; margin-bottom: 14px; }
    canvas#videoCanvas { display:none; width: 1280px; height: 720px; }
    .video-result { margin-top: 16px; display:none; }
    .video-result video { width:100%; border-radius: 12px; background: #000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>시화</h1>
    <p class="subtitle">음악을 분석해 시를 짓고, Comfy용 영문 프롬프트로 그림을 그려 시화 영상을 만듭니다</p>
    <div class="card">
      <div class="card-title">API 설정</div>
      <div class="control-row">
        <div class="control-group">
          <label>Gemini API Key</label>
          <input type="password" id="apiKeyInput" placeholder="AIza...">
        </div>
        <div class="control-group" style="flex:0.5">
          <label>&nbsp;</label>
          <button class="secondary" id="saveKeyBtn" style="width:100%">저장</button>
        </div>
      </div>
      <div class="control-row">
        <div class="control-group">
          <label>음악 분석 모델</label>
          <select id="audioModelSelect"></select>
        </div>
        <div class="control-group">
          <label>이미지 생성 모델</label>
          <select id="imageModelSelect"></select>
        </div>
        <div class="control-group">
          <label>그림 스타일</label>
          <select id="styleSelect">
            <option value="watercolor">수채화 (Watercolor)</option>
            <option value="korean">한국화 (Korean Traditional)</option>
            <option value="ink">수묵화 (Ink Wash)</option>
            <option value="oil">유화 (Oil Painting)</option>
            <option value="dreamy">몽환 일러스트 (Dreamy Illustration)</option>
            <option value="anime">애니메이션 감성 (Anime Aesthetic)</option>
          </select>
        </div>
      </div>
      <div class="status" id="apiStatus"></div>
      <p class="hint">API 키는 브라우저 localStorage에만 저장됩니다. 모델은 네가 준 리스트 기반으로 채워 넣었음. 분석은 gemini-2.5-flash, 이미지는 gemini-3-pro-image-preview / gemini-2.5-flash-image 추천</p>
    </div>
    <div class="card">
      <div class="card-title">음악 업로드 & 분석</div>
      <div class="control-row">
        <div class="control-group">
          <label>음악 파일 (mp3, wav, m4a... 20MB 이하 권장)</label>
          <input type="file" id="audioInput" accept="audio/*">
        </div>
      </div>
      <audio id="audioPlayer" controls style="display:none"></audio>
      <div class="btn-row">
        <button class="primary" id="analyzeBtn" disabled>1. 음악 분석 + 시/프롬프트 생성</button>
        <button class="secondary" id="generateAllBtn" disabled>2. 이미지 전체 생성</button>
        <button class="primary" id="makeVideoBtn" disabled>3. 시화영상 만들기 (MP4)</button>
      </div>
      <div class="status" id="mainStatus"></div>
      <div class="analysis-box" id="analysisBox"></div>
      <div class="video-result" id="videoResult">
        <video id="resultVideo" controls playsinline></video>
        <div class="btn-row"><a id="downloadLink" class="secondary" style="text-decoration:none; padding:11px 20px; border-radius:10px; display:inline-block;" download="sihwa_video.webm">영상 다운로드</a></div>
      </div>
    </div>
    <div id="versesContainer">
      <div class="empty-state" id="emptyState">
        <span>🎵</span>
        음악 파일을 올리고 분석을 누르면<br>AI가 쓴 시와 영문 프롬프트가 여기에 나타납니다
      </div>
    </div>
    <canvas id="videoCanvas" width="1280" height="720"></canvas>
  </div>
<script>
const AVAILABLE_MODELS = [
  'gemini-2.5-flash','gemini-2.5-pro','gemini-2.5-flash-preview-tts','gemini-2.5-pro-preview-tts',
  'gemma-4-26b-a4b-it','gemma-4-31b-it','gemini-flash-latest','gemini-flash-lite-latest','gemini-pro-latest',
  'gemini-2.5-flash-lite','gemini-2.5-flash-image','gemini-3-flash-preview','gemini-3.1-pro-preview',
  'gemini-3.1-pro-preview-customtools','gemini-3.1-flash-lite-preview','gemini-3.1-flash-lite',
  'gemini-3-pro-image-preview','gemini-3-pro-image','nano-banana-pro-preview','gemini-3.1-flash-image-preview',
  'gemini-3.1-flash-image','gemini-3.1-flash-lite-image','gemini-nano-banana-2.1','gemini-3.5-flash',
  'gemini-3.5-flash-lite','gemini-omni-flash-preview','gemini-omni-1.1-flash','gemini-3.5-transcribe',
  'gemini-3.6-flash','gemini-3.7-flash','gemini-3.8-flash','gemini-4-argon','lyria-3-clip-preview',
  'lyria-3-pro-preview','lyria-3.5','gemini-3.1-flash-tts-preview','gemini-3.8-flash-tts','gemini-3.8-flash-lite-tts',
  'gemini-robotics-er-2-preview','gemini-2.5-computer-use-preview-10-2025'
];
const styleSuffix = {
  watercolor: "delicate watercolor painting, soft wet-on-wet technique, transparent layers, gentle color bleeding, paper texture, muted autumn palette",
  korean: "traditional Korean painting style, elegant ink and light color, hanji paper texture, refined brushwork, subdued natural tones, classical East Asian aesthetic",
  ink: "traditional East Asian ink wash painting, sumi-e style, expressive brush strokes, monochrome with subtle gray tones, rice paper texture, minimalist contemplative",
  oil: "classical oil painting, rich impasto texture, warm subdued colors, soft chiaroscuro lighting, museum quality fine art",
  dreamy: "dreamy illustration, soft glowing light, ethereal atmosphere, pastel tones mixed with deep shadows, cinematic emotional, highly detailed digital painting",
  anime: "anime aesthetic, soft film grain, beautiful lighting, Makoto Shinkai style background, emotional atmosphere"
};
const audioInput = document.getElementById('audioInput');
const audioPlayer = document.getElementById('audioPlayer');
const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn = document.getElementById('saveKeyBtn');
const audioModelSelect = document.getElementById('audioModelSelect');
const imageModelSelect = document.getElementById('imageModelSelect');
const styleSelect = document.getElementById('styleSelect');
const analyzeBtn = document.getElementById('analyzeBtn');
const generateAllBtn = document.getElementById('generateAllBtn');
const makeVideoBtn = document.getElementById('makeVideoBtn');
const versesContainer = document.getElementById('versesContainer');
const emptyState = document.getElementById('emptyState');
const mainStatus = document.getElementById('mainStatus');
const apiStatus = document.getElementById('apiStatus');
const analysisBox = document.getElementById('analysisBox');
const videoCanvas = document.getElementById('videoCanvas');
const ctx = videoCanvas.getContext('2d');
let currentFile = null;
let currentAnalysis = null; // {mood, verses: [{ko, base_en}]}
let generatedImages = {}; // index -> {url, dataUrl}
function populateModels() {
  const audioModels = AVAILABLE_MODELS.filter(m => !m.includes('image') && !m.includes('lyria') && !m.includes('transcribe') && !m.includes('tts') && !m.includes('robotics'));
  const imageModels = AVAILABLE_MODELS.filter(m => m.includes('image') || m.includes('banana'));
  audioModels.forEach(m => {
    const o = document.createElement('option'); o.value = m; o.textContent = m;
    if (m === 'gemini-2.5-flash') o.selected = true;
    audioModelSelect.appendChild(o);
  });
  imageModels.forEach(m => {
    const o = document.createElement('option'); o.value = m; o.textContent = m;
    if (m === 'gemini-3-pro-image-preview') o.selected = true;
    imageModelSelect.appendChild(o);
  });
  // fallback if empty
  if (imageModelSelect.options.length === 0) {
    ['gemini-2.5-flash-image','gemini-3-pro-image-preview'].forEach(m=>{
      const o=document.createElement('option'); o.value=m; o.textContent=m; imageModelSelect.appendChild(o);
    })
  }
}
populateModels();
function loadSavedKey() {
  const k = localStorage.getItem('gemini_api_key');
  if (k) { apiKeyInput.value = k; apiStatus.textContent = '저장된 키 불러옴'; }
}
loadSavedKey();
saveKeyBtn.onclick = () => {
  const v = apiKeyInput.value.trim();
  if (!v) { apiStatus.textContent = '키를 입력해줘'; return; }
  localStorage.setItem('gemini_api_key', v);
  apiStatus.textContent = 'API 키 저장됨 ✓';
};
function getApiKey() { return apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key') || ''; }
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => {
      const b64 = reader.result.split(',')[1];
      res(b64);
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}
audioInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  currentFile = file;
  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.style.display = 'block';
  analyzeBtn.disabled = false;
  mainStatus.textContent = `${file.name} (${(file.size/1024/1024).toFixed(2)}MB) 로드됨. 분석 버튼을 눌러줘`;
});
async function analyzeMusic() {
  const apiKey = getApiKey();
  if (!apiKey) { mainStatus.textContent = 'API 키 먼저 입력해줘'; return; }
  if (!currentFile) { mainStatus.textContent = '음악 파일 먼저 선택해줘'; return; }
  const model = audioModelSelect.value;
  mainStatus.textContent = `${model}로 음악 분석 중... (30초 정도 걸릴 수 있어)`;
  analyzeBtn.disabled = true;
  try {
    const b64 = await fileToBase64(currentFile);
    const mime = currentFile.type || 'audio/mp3';
    const prompt = `You are a Korean music director and poet. Analyze this audio file.
Return ONLY valid JSON, no markdown, no explanation.
Requirements:
1. Analyze mood, tempo, energy, instruments, emotion, color palette.
2. Write 4 short Korean poem verses (each 2 lines, like "창문에 맺힌 빗방울이\\n가을 저녁을 길게 늘어뜨린다"). Each verse must match the music's emotional arc from intro to outro.
3. For each verse, write a detailed English image prompt for ComfyUI / Stable Diffusion. It must be vivid, 30+ words, include scene, lighting, atmosphere, composition.
4. Keep poems melancholic, nostalgic, poetic, suitable for sihwa (poem-painting).
Output JSON schema:
{
  "mood": "overall mood in Korean",
  "tempo": "slow/medium/fast + BPM guess",
  "energy": "low/medium/high",
  "instruments": ["piano", "strings"],
  "colors": ["muted blue", "warm amber"],
  "keywords": ["rain", "loneliness", "autumn"],
  "verses": [
    {"ko": "한글시\\n두줄", "base_en": "detailed English visual prompt, 30+ words"},
    {"ko": "...", "base_en": "..."},
    {"ko": "...", "base_en": "..."},
    {"ko": "...", "base_en": "..."}
  ]
}`;
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{ parts: [{text: prompt}, {inline_data: {mime_type: mime, data: b64}}]}],
        generationConfig: { temperature: 0.8, maxOutputTokens: 3000 }
      })
    });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`Gemini API 오류 ${resp.status}: ${err.slice(0,600)}`);
    }
    const data = await resp.json();
    const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '';
    // Extract JSON
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('JSON 파싱 실패, 응답: ' + text.slice(0,500));
    const parsed = JSON.parse(jsonMatch[0]);
    currentAnalysis = parsed;
    renderAnalysisBox(parsed);
    renderVerses(parsed.verses);
    generateAllBtn.disabled = false;
    mainStatus.textContent = `분석 완료 ✓ ${parsed.mood} / ${parsed.tempo}. 이제 이미지 생성 버튼을 눌러줘`;
  } catch (e) {
    console.error(e);
    mainStatus.textContent = '분석 실패: ' + e.message;
    // fallback verses
    const fallback = {
      mood: '서정적 가을',
      verses: [
        {ko: "창문에 맺힌 빗방울이\n가을 저녁을 길게 늘어뜨린다", base_en: "A quiet autumn evening rain, water droplets clinging to window glass, distant train, old letter on wooden desk, melancholic nostalgic, soft diffused light"},
        {ko: "네가 남긴 찻잔 자리\n아직 따뜻한 자국이 남아", base_en: "Empty teacup on wooden table, faint warm mark, light breeze lifting curtain edge, soft indoor light, lingering loneliness"},
        {ko: "기억은 수채화처럼 번지고\n얼굴은 점점 흐려지는데", base_en: "Memories dissolving like watercolor, blurred face fading into rain, clear voice in rain sound, emotional poetic, soft bleeding"},
        {ko: "언젠가는 이 비도 그치고\n창문은 다시 맑아지겠지", base_en: "After rain clear window looking to calm autumn sky, hopeful light breaking through clouds, bittersweet peaceful atmosphere"}
      ]
    };
    currentAnalysis = fallback;
    renderVerses(fallback.verses);
    generateAllBtn.disabled = false;
  } finally {
    analyzeBtn.disabled = false;
  }
}
function renderAnalysisBox(data) {
  analysisBox.style.display = 'block';
  analysisBox.innerHTML = `<b>Mood:</b> ${data.mood || ''} / <b>Tempo:</b> ${data.tempo || ''} / <b>Energy:</b> ${data.energy || ''}<br>
  <b>Instruments:</b> ${(data.instruments||[]).join(', ')}<br>
  <b>Colors:</b> ${(data.colors||[]).join(', ')}<br>
  <b>Keywords:</b> ${(data.keywords||[]).join(', ')}`;
}
function getFullPrompt(base_en, style) {
  return `${base_en}, ${styleSuffix[style] || styleSuffix.watercolor}, masterpiece, best quality, highly detailed, 8k, soft cinematic lighting, poetic composition`;
}
function renderVerses(verses) {
  versesContainer.innerHTML = '';
  verses.forEach((verse, index) => {
    const div = document.createElement('div');
    div.className = 'verse';
    div.id = `verse-${index}`;
    const prompt = getFullPrompt(verse.base_en, styleSelect.value);
    div.innerHTML = `
      <div class="verse-number">VERSE ${String(index+1).padStart(2,'0')}</div>
      <div class="poem-text">${verse.ko}</div>
      <div class="prompt-box">
        <div class="prompt-label">
          <span>ComfyUI / Gemini Prompt (EN)</span>
          <div>
            <button class="copy-btn" data-i="${index}">복사</button>
            <button class="gen-one-btn" data-i="${index}">이 장면만 생성</button>
          </div>
        </div>
        <div class="prompt-text" id="prompt-${index}">${prompt}</div>
      </div>
      <div class="image-area" id="image-area-${index}">
        <div class="image-placeholder">Generate 버튼을 누르면 이미지가 여기에 나타납니다</div>
      </div>
    `;
    versesContainer.appendChild(div);
  });
  // bind copy/generate
  versesContainer.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.onclick = () => {
      const i = btn.getAttribute('data-i');
      const t = document.getElementById(`prompt-${i}`).innerText;
      navigator.clipboard.writeText(t);
      btn.textContent = '복사됨'; setTimeout(()=>btn.textContent='복사',1200);
    };
  });
  versesContainer.querySelectorAll('.gen-one-btn').forEach(btn=>{
    btn.onclick = () => generateOne(parseInt(btn.getAttribute('data-i')));
  });
  document.querySelectorAll('.verse').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'), i*250));
}
styleSelect.addEventListener('change', () => {
  if (currentAnalysis?.verses) renderVerses(currentAnalysis.verses);
});
async function generateImageWithGemini(prompt, apiKey, imageModel) {
  // Gemini image generation
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${imageModel}:generateContent?key=${apiKey}`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      contents: [{ parts: [{text: prompt}] }],
      generationConfig: { responseModalities: ["TEXT","IMAGE"] }
    })
  });
  if (!resp.ok) {
    const txt = await resp.text();
    throw new Error(`Image model ${resp.status}: ${txt.slice(0,500)}`);
  }
  const data = await resp.json();
  // find inline_data
  const parts = data.candidates?.[0]?.content?.parts || [];
  for (const p of parts) {
    if (p.inlineData?.data) {
      return `data:${p.inlineData.mimeType || 'image/png'};base64,${p.inlineData.data}`;
    }
    if (p.inline_data?.data) {
      return `data:${p.inline_data.mime_type || 'image/png'};base64,${p.inline_data.data}`;
    }
  }
  throw new Error('이미지 데이터 없음, 응답: ' + JSON.stringify(data).slice(0,500));
}
function generateImagePollinations(prompt, targetElement) {
  const encoded = encodeURIComponent(prompt);
  const imageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=768&nologo=true&seed=${Math.floor(Math.random()*100000)}`;
  return new Promise((resolve, reject)=>{
    targetElement.innerHTML = `<div class="loading-spinner"></div>`;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      targetElement.innerHTML = ''; targetElement.appendChild(img);
      // create dataUrl via canvas for video export
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      resolve({url: imageUrl, dataUrl: c.toDataURL('image/png'), element: img});
    };
    img.onerror = () => {
      targetElement.innerHTML = `<div class="image-placeholder">생성 실패, 다시 시도</div>`;
      reject(new Error('pollinations failed'));
    };
    img.src = imageUrl;
  });
}
async function generateOne(index) {
  const promptEl = document.getElementById(`prompt-${index}`);
  if (!promptEl) return;
  const prompt = promptEl.innerText;
  const area = document.getElementById(`image-area-${index}`);
  const apiKey = getApiKey();
  const imageModel = imageModelSelect.value;
  area.innerHTML = `<div class="loading-spinner"></div>`;
  try {
    if (apiKey && (imageModel.includes('image') || imageModel.includes('banana'))) {
      const dataUrl = await generateImageWithGemini(prompt, apiKey, imageModel);
      area.innerHTML = `<img src="${dataUrl}" crossorigin="anonymous">`;
      generatedImages[index] = {url: dataUrl, dataUrl: dataUrl, element: area.querySelector('img')};
    } else {
      const res = await generateImagePollinations(prompt, area);
      generatedImages[index] = res;
    }
    checkAllImagesReady();
  } catch (e) {
    console.warn('Gemini image failed, fallback pollinations', e);
    try {
      const res = await generateImagePollinations(prompt, area);
      generatedImages[index] = res;
      checkAllImagesReady();
    } catch (e2) {
      area.innerHTML = `<div class="image-placeholder">실패: ${e.message}</div>`;
    }
  }
}
async function generateAll() {
  if (!currentAnalysis) return;
  generateAllBtn.disabled = true;
  generateAllBtn.textContent = '생성 중...';
  generatedImages = {};
  for (let i=0;i<currentAnalysis.verses.length;i++) {
    await generateOne(i);
    await new Promise(r=>setTimeout(r, 800)); // rate limit
  }
  generateAllBtn.disabled = false;
  generateAllBtn.textContent = '2. 이미지 전체 생성';
}
function checkAllImagesReady() {
  if (currentAnalysis && Object.keys(generatedImages).length === currentAnalysis.verses.length) {
    makeVideoBtn.disabled = false;
    mainStatus.textContent = '모든 이미지 생성 완료! 이제 시화영상 만들기 가능';
  }
}
// Video creation
async function makeVideo() {
  if (!currentAnalysis) return;
  const totalImages = currentAnalysis.verses.length;
  if (Object.keys(generatedImages).length < totalImages) {
    mainStatus.textContent = '이미지가 아직 다 안 만들어졌어';
    return;
  }
  mainStatus.textContent = '시화영상 인코딩 중... Chrome 권장';
  makeVideoBtn.disabled = true;
  const durationPerVerse = 4; // seconds per verse
  const totalDuration = durationPerVerse * totalImages;
  const fps = 30;
  // preload images as HTMLImageElement with dataUrl
  const imgs = [];
  for (let i=0;i<totalImages;i++) {
    const g = generatedImages[i];
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = g.dataUrl;
    await new Promise(r=>{ img.onload=r; img.onerror=r; });
    imgs.push(img);
  }
  const canvasStream = videoCanvas.captureStream(fps);
  // try get audio track from audioPlayer
  let combinedStream = canvasStream;
  try {
    let audioStream = null;
    if (audioPlayer.captureStream) audioStream = audioPlayer.captureStream();
    else if (audioPlayer.mozCaptureStream) audioStream = audioPlayer.mozCaptureStream();
    if (audioStream && audioStream.getAudioTracks().length > 0) {
      combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioStream.getAudioTracks()]);
    }
  } catch(e){ console.warn(e); }
  const recorder = new MediaRecorder(combinedStream, {mimeType: 'video/webm;codecs=vp9'});
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size>0) chunks.push(e.data); };
  const donePromise = new Promise(res=>{ recorder.onstop = res; });
  recorder.start(100);
  // Render loop
  const start = performance.now();
  let frame = 0;
  const totalFrames = totalDuration * fps;
  function drawFrame(now) {
    const elapsed = (now - start)/1000;
    if (elapsed >= totalDuration) return;
    const verseIndex = Math.min(Math.floor(elapsed / durationPerVerse), totalImages-1);
    const verseProgress = (elapsed % durationPerVerse) / durationPerVerse; // 0-1
    const img = imgs[verseIndex];
    const poem = currentAnalysis.verses[verseIndex].ko;
    // ken burns zoom
    const zoom = 1 + verseProgress * 0.08;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,1280,720);
    if (img) {
      const iw = img.width, ih = img.height;
      const scale = Math.max(1280/iw, 720/ih) * zoom;
      const w = iw*scale, h = ih*scale;
      const x = (1280 - w)/2 + Math.sin(verseProgress*Math.PI)*20;
      const y = (720 - h)/2;
      ctx.drawImage(img, x, y, w, h);
    }
    // gradient overlay
    const grad = ctx.createLinearGradient(0, 500, 0, 720);
    grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = grad; ctx.fillRect(0,0,1280,720);
    // vignette
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(0,0,1280,720);
    // poem text with fade
    const alpha = verseProgress < 0.15 ? verseProgress/0.15 : verseProgress > 0.85 ? (1-verseProgress)/0.15 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.font = '600 46px "Noto Serif KR", serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 18;
    const lines = poem.split('\n');
    lines.forEach((line, idx)=>{
      ctx.fillText(line, 640, 520 + idx*62);
    });
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    // verse number
    ctx.fillStyle = 'rgba(144,205,244,0.8)';
    ctx.font = '500 18px "Noto Sans KR", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`VERSE ${String(verseIndex+1).padStart(2,'0')} / ${totalImages}`, 36, 46);
    frame++;
    if (frame < totalFrames) {
      requestAnimationFrame(drawFrame);
    }
  }
  requestAnimationFrame(drawFrame);
  // Also play audio if available
  if (audioPlayer.src) {
    audioPlayer.currentTime = 0;
    audioPlayer.play().catch(()=>{});
  }
  // stop after totalDuration
  setTimeout(()=>{
    recorder.stop();
    if (audioPlayer) audioPlayer.pause();
  }, totalDuration*1000 + 300);
  await donePromise;
  const blob = new Blob(chunks, {type: 'video/webm'});
  const url = URL.createObjectURL(blob);
  const videoResult = document.getElementById('videoResult');
  const resultVideo = document.getElementById('resultVideo');
  const downloadLink = document.getElementById('downloadLink');
  resultVideo.src = url;
  downloadLink.href = url;
  videoResult.style.display = 'block';
  mainStatus.textContent = '시화영상 완성! 아래에서 미리보기 및 다운로드 가능 (음악 포함된 webm)';
  makeVideoBtn.disabled = false;
  videoResult.scrollIntoView({behavior:'smooth'});
}
analyzeBtn.addEventListener('click', analyzeMusic);
generateAllBtn.addEventListener('click', generateAll);
makeVideoBtn.addEventListener('click', makeVideo);
