<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시화 - 음악과 함께하는 그림 시</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Noto Serif KR', serif;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f5f5f5;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #a0aec0;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    .controls {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 40px;
      backdrop-filter: blur(10px);
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    .control-group {
      flex: 1;
      min-width: 200px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #a0aec0;
      margin-bottom: 8px;
      font-weight: 500;
    }

    select, input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: #e8e8e8;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="file"]:focus {
      border-color: #63b3ed;
    }

    select option {
      background: #1a1a2e;
      color: #e8e8e8;
    }

    audio {
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
    }

    .hint {
      font-size: 0.8rem;
      color: #718096;
      margin-top: 12px;
    }

    .verse {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
      display: none;
    }

    .verse.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .verse-number {
      font-size: 0.8rem;
      color: #63b3ed;
      letter-spacing: 2px;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .poem-text {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.25rem;
      line-height: 1.9;
      color: #f0f0f0;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    .prompt-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
    }

    .prompt-label {
      font-size: 0.75rem;
      color: #a0aec0;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .prompt-text {
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      color: #90cdf4;
      line-height: 1.6;
      word-break: break-word;
    }

    .copy-btn {
      background: rgba(99, 179, 237, 0.2);
      border: 1px solid rgba(99, 179, 237, 0.4);
      color: #90cdf4;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: rgba(99, 179, 237, 0.35);
    }

    .copy-btn.copied {
      background: rgba(72, 187, 120, 0.3);
      border-color: rgba(72, 187, 120, 0.5);
      color: #9ae6b4;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #718096;
      font-size: 1.05rem;
    }

    .empty-state span {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>시화</h1>
    <p class="subtitle">음악을 불러오면 구절과 영문 프롬프트가 나타납니다</p>

    <div class="controls">
      <div class="control-row">
        <div class="control-group">
          <label>그림 스타일 선택</label>
          <select id="styleSelect">
            <option value="watercolor">수채화 (Watercolor)</option>
            <option value="korean">한국화 (Korean Traditional)</option>
            <option value="ink">수묵화 (Ink Wash)</option>
            <option value="oil">유화 (Oil Painting)</option>
            <option value="dreamy">몽환 일러스트 (Dreamy Illustration)</option>
          </select>
        </div>
        <div class="control-group">
          <label>음악 파일 불러오기</label>
          <input type="file" id="audioInput" accept="audio/*">
        </div>
      </div>
      <audio id="audioPlayer" controls style="display:none;"></audio>
      <p class="hint">※ 스타일을 바꾸면 프롬프트가 즉시 업데이트됩니다. 음악을 불러오면 구절이 순서대로 나타납니다.</p>
    </div>

    <div id="versesContainer">
      <div class="empty-state" id="emptyState">
        <span>🎵</span>
        음악 파일을 불러오면<br>시와 영문 프롬프트가 여기에 나타납니다
      </div>
    </div>
  </div>

  <script>
    // ========== 시 데이터 ==========
    const verses = [
      {
        ko: "창문에 맺힌 빗방울이\n가을 저녁을 길게 늘어뜨린다\n멀리서 들리는 기차 소리에\n오래된 편지가 열린다",
        base: "A quiet autumn evening rain, water droplets clinging to a window glass, soft distant train sound implied, an old letter slightly opened on a wooden desk, melancholic and nostalgic atmosphere, soft diffused light"
      },
      {
        ko: "네가 남긴 찻잔 자리\n아직 따뜻한 자국이 남아\n바람은 커튼 끝만 살짝 들어올리고\n시간은 천천히 식을 뿐이다",
        base: "An empty teacup left on a wooden table, faint warm mark still visible, a light breeze gently lifting the edge of a curtain, soft indoor light, quiet and lingering loneliness, shallow depth of field"
      },
      {
        ko: "기억은 수채화처럼 번지고\n얼굴은 점점 흐려지는데\n목소리만은 아직도\n빗소리 속에 또렷하다",
        base: "Memories dissolving like watercolor, a blurred human face fading into rain, only a clear voice remaining in the sound of rain, emotional and poetic atmosphere, soft edges, gentle color bleeding"
      },
      {
        ko: "언젠가는 이 비도 그치고\n창문은 다시 맑아지겠지\n그때는 웃으며\n이 저녁을 추억할 수 있을까",
        base: "After the rain, a clear window looking out to a calm autumn sky, soft hopeful light breaking through clouds, quiet reflection, bittersweet and gentle mood, peaceful atmosphere"
      }
    ];

    // ========== 스타일별 프롬프트 접미사 ==========
    const styleSuffix = {
      watercolor: "delicate watercolor painting, soft wet-on-wet technique, transparent layers, gentle color bleeding, paper texture, muted autumn palette, artistic and poetic",
      korean: "traditional Korean painting style, elegant ink and light color, hanji paper texture, refined brushwork, subdued natural tones, classical East Asian aesthetic, serene and refined",
      ink: "traditional East Asian ink wash painting, sumi-e style, expressive brush strokes, monochrome with subtle gray tones, rice paper texture, minimalist and contemplative atmosphere",
      oil: "classical oil painting, rich impasto texture, warm subdued colors, soft chiaroscuro lighting, detailed yet atmospheric, museum quality fine art",
      dreamy: "dreamy illustration, soft glowing light, ethereal atmosphere, gentle pastel tones mixed with deep shadows, cinematic and emotional, highly detailed digital painting"
    };

    // ========== DOM 요소 ==========
    const styleSelect = document.getElementById('styleSelect');
    const audioInput = document.getElementById('audioInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const versesContainer = document.getElementById('versesContainer');
    const emptyState = document.getElementById('emptyState');

    let musicLoaded = false;

    // ========== 프롬프트 생성 ==========
    function getPrompt(base, style) {
      return `${base}, ${styleSuffix[style]}, masterpiece, best quality, highly detailed`;
    }

    // ========== 구절 렌더링 ==========
    function renderVerses() {
      const style = styleSelect.value;
      versesContainer.innerHTML = '';

      verses.forEach((verse, index) => {
        const div = document.createElement('div');
        div.className = 'verse';
        div.id = `verse-${index}`;

        const prompt = getPrompt(verse.base, style);

        div.innerHTML = `
          <div class="verse-number">VERSE ${String(index + 1).padStart(2, '0')}</div>
          <div class="poem-text">${verse.ko}</div>
          <div class="prompt-box">
            <div class="prompt-label">
              <span>ComfyUI Prompt</span>
              <button class="copy-btn" onclick="copyPrompt(this, ${index})">복사</button>
            </div>
            <div class="prompt-text" id="prompt-${index}">${prompt}</div>
          </div>
        `;

        versesContainer.appendChild(div);
      });
    }

    // ========== 프롬프트 복사 ==========
    function copyPrompt(btn, index) {
      const text = document.getElementById(`prompt-${index}`).innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '복사됨';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '복사';
          btn.classList.remove('copied');
        }, 1800);
      });
    }

    // ========== 구절 순차 등장 ==========
    function showVersesSequentially() {
      const verseEls = document.querySelectorAll('.verse');
      verseEls.forEach((el, i) => {
        setTimeout(() => {
          el.classList.add('visible');
        }, i * 400);
      });
    }

    // ========== 이벤트 ==========
    styleSelect.addEventListener('change', () => {
      if (musicLoaded) {
        renderVerses();
        showVersesSequentially();
      }
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      audioPlayer.src = url;
      audioPlayer.style.display = 'block';
      audioPlayer.play().catch(() => {});

      musicLoaded = true;
      emptyState.style.display = 'none';
      renderVerses();
      showVersesSequentially();
    });
  </script>
</body>
</html>
