<script>
const styleSuffix={
  korean:"traditional Korean painting style, hanji paper texture, elegant ink and light color, Korean hanbok woman Chunhyang, Namwon Gwanghallu pavilion, soft moonlight, classical East Asian aesthetic, refined brushwork, muted natural tones, masterpiece",
  watercolor:"delicate watercolor painting, soft wet-on-wet, paper texture, muted palette, poetic still life, Korean traditional house",
  ink:"ink wash sumi-e painting, expressive brush strokes, rice paper texture, minimalist, Korean traditional beauty, Chunhyang theme",
  oil:"classical oil painting, impasto texture, warm chiaroscuro lighting, museum quality, Korean traditional hanbok portrait",
  dreamy:"dreamy illustration, soft glowing volumetric light, ethereal atmosphere, pastel deep shadows, cinematic highly detailed, Korean hanbok girl under moonlight",
  anime:"anime aesthetic, Makoto Shinkai background, beautiful lighting, soft film grain, emotional, Korean hanbok",
  photo:"cinematic photo, 35mm film, soft bokeh, natural light, highly detailed, emotional mood, Korean traditional"
};
const NEW_AUDIO=['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3-flash-preview','gemini-flash-latest'];
const NEW_IMAGE=['gemini-3-pro-image-preview','gemini-3-pro-image','gemini-3.1-flash-image-preview','gemini-3.1-flash-image','gemini-2.5-flash-image'];
const MOOD_DATA={
  "고요한 가을밤":{colors:["muted blue","soft gray","warm amber"],keywords:["빗소리","그리움","고요","달빛","한복"]},
  "쓸쓸한 노을":{colors:["dusty rose","amber","burnt orange"],keywords:["노을","기다림","정절","광한루"]},
  "몽환적 새벽":{colors:["pale lavender","misty blue","fog gray"],keywords:["안개","꿈","새벽","달빛"]},
  "따뜻한 위로":{colors:["sage green","cream","soft brown"],keywords:["매화","정절","사랑","기다림"]},
  "희망찬 아침":{colors:["sky blue","sunlight yellow","white"],keywords:["햇살","약속","재회"]},
  "격정적 파도":{colors:["deep indigo","crimson","gold"],keywords:["파도","절개","눈물","한"]}
};
const audioInput=document.getElementById('audioInput'), poemFileInput=document.getElementById('poemFileInput'), poemTextarea=document.getElementById('poemTextarea');
const audioPlayer=document.getElementById('audioPlayer'), styleSelect=document.getElementById('styleSelect'), apiKeyInput=document.getElementById('apiKeyInput');
const audioModelSelect=document.getElementById('audioModelSelect'), imageModelSelect=document.getElementById('imageModelSelect');
const reviewBtn=document.getElementById('reviewBtn'), generateAllBtn=document.getElementById('generateAllBtn'), makeVideoBtn=document.getElementById('makeVideoBtn');
const mainStatus=document.getElementById('mainStatus'), analysisBox=document.getElementById('analysisBox'), versesContainer=document.getElementById('versesContainer');
const videoCanvas=document.getElementById('videoCanvas'), ctx=videoCanvas.getContext('2d');
let currentFile=null, currentAnalysis=null, generatedImages={};
function populate(){
  NEW_AUDIO.forEach(m=>{ const o=document.createElement('option');o.value=m;o.textContent=m; if(m==='gemini-3.8-flash') o.selected=true; audioModelSelect.appendChild(o); });
  NEW_IMAGE.forEach(m=>{ const o=document.createElement('option');o.value=m;o.textContent=m; if(m==='gemini-3-pro-image-preview') o.selected=true; imageModelSelect.appendChild(o); });
}
populate();
function getKey(){ return apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key') || ''; }
apiKeyInput.value=localStorage.getItem('gemini_api_key')||'';
apiKeyInput.addEventListener('change',()=>{ const v=apiKeyInput.value.trim(); if(v) localStorage.setItem('gemini_api_key',v); });
audioInput.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; currentFile=f; const url=URL.createObjectURL(f); audioPlayer.src=url; audioPlayer.style.display='block'; mainStatus.textContent=`음악 ${f.name} 로드됨`; mainStatus.className='status ok';
});
poemFileInput.addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return; const text=await f.text(); poemTextarea.value=text; mainStatus.textContent=`시 파일 ${f.name} 로드됨`; mainStatus.className='status ok';
});
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function trimAudioTo30s(file){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const ab=await file.arrayBuffer();
    const decoded=await ac.decodeAudioData(ab.slice(0));
    const dur=Math.min(decoded.duration,30);
    const sampleRate=16000;
    const offline=new OfflineAudioContext(1, dur*sampleRate, sampleRate);
    const src=offline.createBufferSource(); src.buffer=decoded; src.connect(offline.destination); src.start(0);
    const rendered=await offline.startRendering();
    const wavBlob=audioBufferToWavBlob(rendered);
    const b64=await fileToBase64(wavBlob);
    return {b64, mime:'audio/wav', duration:dur, fullDuration:decoded.duration};
  }catch(e){ const b64=await fileToBase64(file); return {b64, mime:file.type||'audio/mp3', duration:30, fullDuration:0}; }
}
function audioBufferToWavBlob(buffer){
  const numChannels=1; const sampleRate=buffer.sampleRate; const bitDepth=16; const data=buffer.getChannelData(0);
  const dataLength=data.length*(bitDepth/8); const headerLength=44; const arrayBuffer=new ArrayBuffer(headerLength+dataLength); const view=new DataView(arrayBuffer);
  function writeString(o,s){ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4,36+dataLength,true); writeString(8,'WAVE'); writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,numChannels,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*numChannels*bitDepth/8,true); view.setUint16(32,numChannels*bitDepth/8,true); view.setUint16(34,bitDepth,true); writeString(36,'data'); view.setUint32(40,dataLength,true);
  let offset=44; for(let i=0;i<data.length;i++,offset+=2){ const s=Math.max(-1,Math.min(1,data[i])); view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true); }
  return new Blob([view],{type:'audio/wav'});
}
function parsePoem(raw){
  if(!raw.trim()) return [];
  const chunks=raw.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(chunks.length>=3) return chunks.slice(0,6).map(c=>{ const lines=c.split('\n').filter(l=>l.trim()); return lines.slice(0,2).join('\n'); });
  const lines=raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const verses=[]; for(let i=0;i<lines.length;i+=2){ verses.push(lines.slice(i,i+2).join('\n')); if(verses.length>=6) break; }
  return verses;
}
function offlineReviewPoem(poemVerses, musicMood){
  const moodInfo=MOOD_DATA[musicMood.moodLabel]||MOOD_DATA["고요한 가을밤"];
  const refined=poemVerses.map((orig)=>{
    const lines=orig.split('\n'); let l1=lines[0]||'', l2=lines[1]||'';
    // 춘향 테마 보정
    if(l1.includes('괄세')||l1.includes('행여')){ l1='행여 나 없다 괄세 말고'; l2='도련님께 부디 잘해 드려라'; }
    if(l1.includes('무릇 여인')||l1.includes('여인 중')){ l1='무릇 여인 중 너는'; l2='사랑할 줄 아는 오직 하나의 여인이었다'; }
    const refinedText=l1+'\n'+l2;
    const base_en=`${refinedText.replace(/\n/g,' ')}, Korean traditional Chunhyang story, hanbok woman waiting, Namwon Gwanghallu pavilion moonlight, ${moodInfo.keywords.join(', ')}, ${musicMood.moodLabel} mood, ${moodInfo.colors.join(', ')} palette, poetic still life, soft cinematic lighting, highly detailed, emotional, traditional Korean painting`;
    return {orig, refined:refinedText, base_en};
  });
  while(refined.length<4){
    refined.push({orig:'(보충)', refined:'춘향의 마음은 매화처럼\n추운 겨울을 견디고 피어난다', base_en:'Chunhyang heart like plum blossom enduring winter, Korean traditional painting, hanji texture, moonlight, emotional'});
  }
  return refined;
}
async function analyzeMusicOffline(file){
  if(!file) return {energy:'medium',tempo:'slow',moodLabel:'쓸쓸한 노을',duration:0};
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const ab=await file.arrayBuffer();
  const decoded=await ac.decodeAudioData(ab.slice(0));
  const ch=decoded.getChannelData(0);
  let sum=0; for(let i=0;i<ch.length;i+=200) sum+=ch[i]*ch[i];
  const rms=Math.sqrt(sum/(ch.length/200));
  const energy=rms>0.12?'high':rms>0.05?'medium':'low';
  let zcr=0; for(let i=1;i<ch.length;i+=2000){ if((ch[i-2000]>=0)!==(ch[i]>=0)) zcr++; }
  const tempo=zcr>140?'fast':zcr>70?'medium':'slow';
  let moodLabel;
  if(energy==='low' && tempo==='slow') moodLabel='고요한 가을밤';
  else if(energy==='low') moodLabel='몽환적 새벽';
  else if(energy==='medium' && tempo==='slow') moodLabel='쓸쓸한 노을';
  else if(energy==='medium') moodLabel='따뜻한 위로';
  else if(energy==='high' && tempo==='fast') moodLabel='희망찬 아침';
  else moodLabel='격정적 파도';
  // 춘향 노래면 노을/가을밤으로 보정
  if(file && file.name.includes('춘향')) moodLabel='쓸쓸한 노을';
  return {energy, tempo, moodLabel, duration:decoded.duration, rms, zcr};
}
async function reviewWithGeminiIfPossible(musicFile, poemRaw, musicOfflineInfo){
  const apiKey=getKey(); if(!apiKey || !musicFile) return null;
  try{
    const trimmed=await trimAudioTo30s(musicFile);
    const promptText = 'You are a Korean poet and director for Chunhyang story. Audio is first 30s of Chunhyang song, poem is No Cheonmyeong Chunhyang. Tasks: 1. Review poem keep original voice, adapt to music mood. 2. Keep 4 verses each 2 lines Korean, poetic. 3. For each verse English prompt for Korean traditional painting ComfyUI 35+ words, include hanbok, Gwanghallu, moonlight. 4. Return ONLY JSON: {"music_mood":"...","poem_analysis":"...","improvements":"...","verses":[{"orig":"...","refined":"...","base_en":"..."}]}. Poem raw: ' + poemRaw.slice(0,3000) + ' Music info: energy=' + musicOfflineInfo.energy + ' tempo=' + musicOfflineInfo.tempo + ' mood=' + musicOfflineInfo.moodLabel;
    const payload = {
      contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: trimmed.mime, data: trimmed.b64 } }] }],
      generationConfig: { temperature: 0.8, maxOutputTokens: 2500 }
    };
    const models=[audioModelSelect.value].concat(NEW_AUDIO);
    for(let m of models){
      try{
        const resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent?key=' + apiKey, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        if(!resp.ok){ const txt=await resp.text(); if(resp.status===429 || resp.status===404) continue; throw new Error(txt.slice(0,500)); }
        const data=await resp.json();
        const txt=data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts ? data.candidates[0].content.parts.map(p=>p.text).join('') : '';
        const match=txt.match(/\{[\s\S]*\}/); if(!match) continue;
        const parsed=JSON.parse(match[0]); parsed.modelUsed=m; return parsed;
      }catch(e){ console.warn('gemini fail', e); continue; }
    }
    return null;
  }catch(e){ console.warn(e); return null; }
}
async function handleReview(){
  const poemRaw=poemTextarea.value.trim();
  if(!poemRaw){ mainStatus.textContent='시 내용을 넣어줘'; mainStatus.className='status error'; return; }
  reviewBtn.disabled=true; mainStatus.textContent='춘향 노래 + 노천명 시 함께 검토 중...'; mainStatus.className='status';
  try{
    let musicInfo={energy:'medium',tempo:'slow',moodLabel:'쓸쓸한 노을',duration:0};
    if(currentFile) musicInfo=await analyzeMusicOffline(currentFile);
    const poemVerses=parsePoem(poemRaw);
    if(poemVerses.length===0){ mainStatus.textContent='시 파싱 실패'; mainStatus.className='status error'; reviewBtn.disabled=false; return; }
    let geminiResult=null;
    if(getKey() && currentFile){
      mainStatus.textContent='음악 분석 완료 (' + musicInfo.moodLabel + '). Gemini로 시 검토 시도 중...';
      geminiResult=await reviewWithGeminiIfPossible(currentFile, poemRaw, musicInfo);
    }
    let finalVerses;
    if(geminiResult && geminiResult.verses){
      finalVerses=geminiResult.verses;
      analysisBox.style.display='block';
      analysisBox.innerHTML='<b>Gemini 검토 성공 (' + geminiResult.modelUsed + ')</b><br><b>음악:</b> ' + musicInfo.moodLabel + ' / ' + musicInfo.energy + ' / ' + musicInfo.tempo + '<br><b>원시 분석:</b> ' + (geminiResult.poem_analysis||'') + '<br><b>개선점:</b> ' + (geminiResult.improvements||'');
      currentAnalysis={mood:geminiResult.music_mood||musicInfo.moodLabel, energy:musicInfo.energy, tempo:musicInfo.tempo, verses:finalVerses.map(v=>({ko:v.refined, base_en:v.base_en, orig:v.orig})), musicInfo};
    }else{
      const offlineRefined=offlineReviewPoem(poemVerses, musicInfo);
      finalVerses=offlineRefined;
      analysisBox.style.display='block';
      analysisBox.innerHTML='<b>오프라인 검토 - 춘향 테마</b><br><b>음악:</b> ' + musicInfo.moodLabel + ' / ' + musicInfo.energy + ' / ' + musicInfo.tempo + (musicInfo.duration?' / ' + musicInfo.duration.toFixed(1)+'초':'' ) + '<br><b>원본 ' + poemVerses.length + '연</b> → 한국화 춘향 프롬프트로 재구성<br>API 키가 있으면 Gemini가 더 정교하게 다듬어줍니다.';
      currentAnalysis={mood:musicInfo.moodLabel, energy:musicInfo.energy, tempo:musicInfo.tempo, verses:finalVerses.map(v=>({ko:v.refined, base_en:v.base_en, orig:v.orig})), musicInfo};
    }
    renderVerses(currentAnalysis.verses);
    generateAllBtn.disabled=false;
    mainStatus.textContent='검토 완료 ✓ ' + currentAnalysis.verses.length + '연. 이미지 생성 가능'; mainStatus.className='status ok';
  }catch(e){ console.error(e); mainStatus.textContent='검토 실패: '+e.message; mainStatus.className='status error'; }
  finally{ reviewBtn.disabled=false; }
}
function getFullPrompt(base_en,style){ return base_en + ', ' + (styleSuffix[style]||styleSuffix.korean) + ', masterpiece, best quality, 8k'; }
function renderVerses(verses){
  versesContainer.innerHTML='';
  verses.forEach((v,i)=>{
    const fullPrompt=getFullPrompt(v.base_en, styleSelect.value);
    const div=document.createElement('div'); div.className='verse'; div.id='verse-'+i;
    div.innerHTML='<div class="verse-number">VERSE ' + String(i+1).padStart(2,'0') + ' - 춘향</div><div class="orig-vs-new"><div class="orig-box"><b>원본</b>\n' + (v.orig||'') + '</div><div class="new-box" contenteditable="true" id="poem-' + i + '"><b>다듬은 시</b>\n' + v.ko + '</div></div><div class="prompt-box"><div class="prompt-label"><span>ComfyUI Prompt (한국화 최적화)</span><div><button class="copy-btn" data-i="' + i + '">복사</button><button class="gen-one-btn" data-i="' + i + '">이미지 생성</button></div></div><div class="prompt-text" contenteditable="true" id="prompt-' + i + '">' + fullPrompt + '</div></div><div class="image-area" id="image-area-' + i + '"><div class="image-placeholder">이미지 대기 - 한국화 스타일</div></div>';
    versesContainer.appendChild(div);
  });
  versesContainer.querySelectorAll('.copy-btn').forEach(b=>{ b.onclick=()=>{ const t=document.getElementById('prompt-'+b.dataset.i).innerText; navigator.clipboard.writeText(t); b.textContent='복사됨'; setTimeout(()=>b.textContent='복사',900); }; });
  versesContainer.querySelectorAll('.gen-one-btn').forEach(b=>{ b.onclick=()=>generateOne(parseInt(b.dataset.i)); });
  document.querySelectorAll('.verse').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'), i*120));
}
styleSelect.addEventListener('change',()=>{
  if(!currentAnalysis) return;
  currentAnalysis.verses.forEach((v,i)=>{
    const el=document.getElementById('prompt-'+i);
    if(el) el.textContent=getFullPrompt(v.base_en, styleSelect.value);
  });
});
function pollinationsGenerate(prompt, area){
  const seed=Math.floor(Math.random()*1000000);
  const url='https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=1024&height=768&nologo=true&seed=' + seed + '&model=flux';
  return new Promise((res,rej)=>{
    area.innerHTML='<div class="loading-spinner"></div><div style="position:absolute;bottom:10px;font-size:.68rem;color:#8a9ab0">한국화 생성 중 seed ' + seed + '</div>'; area.style.position='relative';
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{ area.innerHTML=''; area.appendChild(img); const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); res({dataUrl:c.toDataURL('image/png'), element:img, url}); };
    img.onerror=()=>{ area.innerHTML='<div class="image-placeholder">실패</div>'; rej(new Error('pollinations fail')); };
    img.src=url;
  });
}
async function generateOne(index){
  const prompt=document.getElementById('prompt-'+index)?.innerText; const poem=document.getElementById('poem-'+index)?.innerText?.split('\n').slice(1).join('\n').trim();
  if(!prompt) return;
  const area=document.getElementById('image-area-'+index);
  if(poem && currentAnalysis) currentAnalysis.verses[index].ko=poem;
  area.innerHTML='<div class="loading-spinner"></div>';
  try{
    const apiKey=getKey();
    let dataUrl=null; let modelUsed='pollinations-flux';
    if(apiKey){
      const payload={contents:[{parts:[{text:prompt}]}],generationConfig:{responseModalities:["TEXT","IMAGE"]}};
      for(let m of [imageModelSelect.value].concat(NEW_IMAGE)){
        try{
          const resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent?key=' + apiKey, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          if(!resp.ok){ if(resp.status===429 || resp.status===404) continue; const t=await resp.text(); throw new Error(t.slice(0,400)); }
          const data=await resp.json(); const parts=data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts ? data.candidates[0].content.parts : [];
          for(let p of parts){ if(p.inlineData && p.inlineData.data){ dataUrl='data:' + (p.inlineData.mimeType||'image/png') + ';base64,' + p.inlineData.data; modelUsed=m; break; } if(p.inline_data && p.inline_data.data){ dataUrl='data:' + (p.inline_data.mime_type||'image/png') + ';base64,' + p.inline_data.data; modelUsed=m; break; } }
          if(dataUrl) break;
        }catch(e){ continue; }
      }
    }
    if(!dataUrl){ const r=await pollinationsGenerate(prompt, area); generatedImages[index]=r; checkReady(); return; }
    area.innerHTML='<img src="' + dataUrl + '"><div style="position:absolute;bottom:6px;right:8px;font-size:.6rem;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px">' + modelUsed + '</div>'; area.style.position='relative';
    generatedImages[index]={dataUrl, element:area.querySelector('img'), url:dataUrl};
    checkReady();
  }catch(e){
    try{ const r=await pollinationsGenerate(prompt, area); generatedImages[index]=r; checkReady(); }
    catch(e2){ area.innerHTML='<div class="image-placeholder">실패: ' + e.message.slice(0,180) + '</div>'; }
  }
}
async function generateAll(){ if(!currentAnalysis) return; generateAllBtn.disabled=true; generateAllBtn.textContent='생성 중...'; generatedImages={}; for(let i=0;i<currentAnalysis.verses.length;i++){ await generateOne(i); await new Promise(r=>setTimeout(r,600)); } generateAllBtn.disabled=false; generateAllBtn.textContent='2. 이미지 전체 생성'; }
function checkReady(){ if(currentAnalysis && Object.keys(generatedImages).length===currentAnalysis.verses.length){ makeVideoBtn.disabled=false; mainStatus.textContent='이미지 ' + Object.keys(generatedImages).length + '장 완료! 영상 만들기 가능'; mainStatus.className='status ok'; } }
async function makeVideo(){
  if(!currentAnalysis) return; const total=currentAnalysis.verses.length; if(Object.keys(generatedImages).length<total){ mainStatus.textContent='이미지 아직 다 안됨'; return; }
  mainStatus.textContent='시화영상 인코딩 중...'; makeVideoBtn.disabled=true;
  const durationPer=4, totalDuration=durationPer*total, fps=30; const imgs=[];
  for(let i=0;i<total;i++){ const g=generatedImages[i]; const img=new Image(); img.crossOrigin='anonymous'; img.src=g.dataUrl; await new Promise(r=>{ img.onload=r; img.onerror=r; }); imgs.push(img); }
  const canvasStream=videoCanvas.captureStream(fps); let combined=canvasStream;
  try{ let aStream=null; if(audioPlayer.captureStream) aStream=audioPlayer.captureStream(); else if(audioPlayer.mozCaptureStream) aStream=audioPlayer.mozCaptureStream(); if(aStream && aStream.getAudioTracks().length>0) combined=new MediaStream([...canvasStream.getVideoTracks(),...aStream.getAudioTracks()]); }catch{}
  const recorder=new MediaRecorder(combined,{mimeType:'video/webm;codecs=vp9'}); const chunks=[]; recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); }; const done=new Promise(r=>recorder.onstop=r); recorder.start(100);
  const start=performance.now(); let frame=0; const totalFrames=totalDuration*fps;
  function draw(now){
    const elapsed=(now-start)/1000; if(elapsed>=totalDuration) return;
    const idx=Math.min(Math.floor(elapsed/durationPer),total-1); const prog=(elapsed%durationPer)/durationPer; const img=imgs[idx]; const poemEl=document.getElementById('poem-'+idx); const poemText=poemEl?poemEl.innerText.split('\n').slice(1).join('\n').trim():currentAnalysis.verses[idx].ko;
    const zoom=1+prog*0.07; ctx.fillStyle='#000'; ctx.fillRect(0,0,1280,720);
    if(img){ const scale=Math.max(1280/img.width,720/img.height)*zoom; const w=img.width*scale,h=img.height*scale; const x=(1280-w)/2+Math.sin(prog*Math.PI)*18; const y=(720-h)/2; ctx.drawImage(img,x,y,w,h); }
    const grad=ctx.createLinearGradient(0,480,0,720); grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,.72)'); ctx.fillStyle=grad; ctx.fillRect(0,0,1280,720);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(0,0,1280,720);
    const alpha=prog<0.18?prog/0.18:prog>0.82?(1-prog)/0.18:1; ctx.globalAlpha=alpha; ctx.fillStyle='#fff'; ctx.font='600 42px "Noto Serif KR", serif'; ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=20; poemText.split('\n').forEach((line,j)=>ctx.fillText(line,640,520+j*58)); ctx.shadowBlur=0; ctx.globalAlpha=1;
    ctx.fillStyle='rgba(140,180,255,.9)'; ctx.font='500 14px "Noto Sans KR"'; ctx.textAlign='left'; ctx.fillText('VERSE ' + String(idx+1).padStart(2,'0') + ' / ' + total + ' · ' + currentAnalysis.mood + ' · 춘향',36,42);
    frame++; if(frame<totalFrames) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw); if(audioPlayer.src){ audioPlayer.currentTime=0; audioPlayer.play().catch(()=>{}); }
  setTimeout(()=>{ recorder.stop(); audioPlayer.pause(); }, totalDuration*1000+400); await done;
  const blob=new Blob(chunks,{type:'video/webm'}); const url=URL.createObjectURL(blob);
  const resultVideo=document.getElementById('resultVideo'); const downloadLink=document.getElementById('downloadLink'); const videoResult=document.getElementById('videoResult');
  resultVideo.src=url; downloadLink.href=url; videoResult.style.display='block'; mainStatus.textContent='시화영상 완성! 춘향 테마'; mainStatus.className='status ok'; makeVideoBtn.disabled=false; videoResult.scrollIntoView({behavior:'smooth'});
}
reviewBtn.addEventListener('click', async ()=>{

      currentAnalysis={mood:geminiResult.music_mood||musicInfo.moodLabel, energy:musicInfo.energy, tempo:musicInfo.tempo, verses:finalVerses.map(v=>({ko:v.refined, base_en:v.base_en, orig:v.orig}))};
    }else{

      currentAnalysis={mood:musicInfo.moodLabel, energy:musicInfo.energy, tempo:musicInfo.tempo, verses:offline.map(v=>({ko:v.refined, base_en:v.base_en, orig:v.orig}))};
    }

    mainStatus.textContent='검토 완료 ✓ ' + currentAnalysis.verses.length + '연'; mainStatus.className='status ok';
  }catch(e){ mainStatus.textContent='실패: '+e.message; mainStatus.className='status error'; console.error(e); }
  finally{ reviewBtn.disabled=false; }
});
generateAllBtn.addEventListener('click', generateAll);
