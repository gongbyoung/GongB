<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시화 - Gemini 3.8 Fixed</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#e8e8e8;min-height:100vh;padding:32px 18px;line-height:1.7}
    .container{max-width:980px;margin:0 auto}
    h1{font-family:'Noto Serif KR',serif;text-align:center;font-size:2.2rem;font-weight:600;margin-bottom:6px;letter-spacing:2px}
    .subtitle{text-align:center;color:#a0aec0;margin-bottom:28px;font-size:.92rem}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:22px;margin-bottom:22px;backdrop-filter:blur(10px)}
    .card-title{font-size:.92rem;font-weight:600;color:#90cdf4;margin-bottom:14px}
    .control-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:14px}
    .control-group{flex:1;min-width:180px}
    label{display:block;font-size:.8rem;color:#a0aec0;margin-bottom:7px;font-weight:500}
    select,input[type=file],input[type=password],input[type=text]{width:100%;padding:10px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#e8e8e8;font-size:.88rem;outline:none}
    select:focus,input:focus{border-color:#63b3ed}
    select option{background:#1a1a2e}
    audio{width:100%;margin-top:10px;border-radius:10px}
    .btn-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
    button{border:none;padding:10px 18px;border-radius:10px;font-size:.88rem;font-weight:500;cursor:pointer;transition:.2s}
    .primary{background:linear-gradient(135deg,#3182ce,#2b6cb0);color:#fff}
    .primary:hover{filter:brightness(1.15)}
    .secondary{background:rgba(255,255,255,.1);color:#e2e8f0;border:1px solid rgba(255,255,255,.15)}
    .secondary:hover{background:rgba(255,255,255,.15)}
    button:disabled{background:#4a5568;cursor:not-allowed;opacity:.6}
    .hint{font-size:.76rem;color:#718096;margin-top:10px;line-height:1.6}
    .status{font-size:.84rem;color:#fbd38d;margin-top:10px;min-height:18px;white-space:pre-wrap;word-break:break-all}
    .analysis-box{background:rgba(0,0,0,.32);border-radius:12px;padding:14px;font-size:.84rem;color:#cbd5e0;display:none;margin-top:12px}
    .analysis-box b{color:#90cdf4}
    .verse{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;margin-bottom:24px;opacity:0;transform:translateY(18px);transition:.5s;display:none}
    .verse.visible{display:block;opacity:1;transform:translateY(0)}
    .verse-number{font-size:.76rem;color:#63b3ed;letter-spacing:2px;margin-bottom:10px;font-weight:500}
    .poem-text{font-family:'Noto Serif KR',serif;font-size:1.18rem;line-height:1.9;color:#f0f0f0;margin-bottom:16px;white-space:pre-line}
    .prompt-box{background:rgba(0,0,0,.35);border-radius:12px;padding:12px 14px;margin-bottom:14px}
    .prompt-label{font-size:.7rem;color:#a0aec0;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
    .prompt-text{font-family:'Courier New',monospace;font-size:.8rem;color:#90cdf4;line-height:1.5;word-break:break-word}
    .copy-btn,.gen-one-btn{background:rgba(99,179,237,.2);border:1px solid rgba(99,179,237,.4);color:#90cdf4;padding:3px 9px;border-radius:6px;font-size:.7rem;cursor:pointer;margin-left:5px}
    .image-area{width:100%;min-height:300px;background:rgba(0,0,0,.25);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .image-area img{width:100%;height:auto;display:block;border-radius:12px}
    .image-placeholder{color:#718096;font-size:.86rem;text-align:center;padding:36px 18px}
    .loading-spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.15);border-top-color:#63b3ed;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{text-align:center;padding:68px 20px;color:#718096;font-size:.95rem}
    .empty-state span{display:block;font-size:2.1rem;margin-bottom:12px}
    canvas#videoCanvas{display:none;width:1280px;height:720px}
    .video-result{margin-top:14px;display:none}
    .video-result video{width:100%;border-radius:12px;background:#000}
    .badge{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:999px;background:rgba(99,179,237,.2);border:1px solid rgba(99,179,237,.3);color:#90cdf4;margin-left:6px}
  </style>
</head>
<body>
<div class="container">
  <h1>시화 <span class="badge">Gemini 3.8 Fixed</span></h1>
  <p class="subtitle">404 에러 수정 - 자동 모델 폴백 / 최신 모델 기본값</p>
  <div class="card">
    <div class="card-title">API 설정</div>
    <div class="control-row">
      <div class="control-group">
        <label>Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIza...">
      </div>
      <div class="control-group" style="flex:0.45">
        <label>&nbsp;</label>
        <button class="secondary" id="saveKeyBtn" style="width:100%">저장 & 키로 사용가능 모델 조회</button>
      </div>
    </div>
    <div class="control-row">
      <div class="control-group">
        <label>음악 분석 모델 (3.8 우선)</label>
        <select id="audioModelSelect"></select>
      </div>
      <div class="control-group">
        <label>이미지 생성 모델</label>
        <select id="imageModelSelect"></select>
      </div>
      <div class="control-group">
        <label>그림 스타일</label>
        <select id="styleSelect">
          <option value="watercolor">수채화</option>
          <option value="korean">한국화</option>
          <option value="ink">수묵화</option>
          <option value="oil">유화</option>
          <option value="dreamy" selected>몽환 일러스트</option>
          <option value="anime">애니 감성</option>
        </select>
      </div>
    </div>
    <div class="status" id="apiStatus"></div>
    <div class="hint">에러 메시지: models/gemini-2.5-flash is no longer available → 이제 gemini-3.8-flash 계열로 자동 전환되게 수정함. 저장 버튼 누르면 내 키로 실제 사용 가능한 모델 리스트도 조회해서 알려줌.</div>
  </div>
  <div class="card">
    <div class="card-title">음악 업로드 & 분석</div>
    <div class="control-row">
      <div class="control-group">
        <label>음악 파일 (mp3/wav/m4a, 20MB 이하 권장)</label>
        <input type="file" id="audioInput" accept="audio/*">
      </div>
    </div>
    <audio id="audioPlayer" controls style="display:none"></audio>
    <div class="btn-row">
      <button class="primary" id="analyzeBtn" disabled>1. 음악 분석 + 시/프롬프트 생성</button>
      <button class="secondary" id="generateAllBtn" disabled>2. 이미지 전체 생성</button>
      <button class="primary" id="makeVideoBtn" disabled>3. 시화영상 만들기</button>
    </div>
    <div class="status" id="mainStatus"></div>
    <div class="analysis-box" id="analysisBox"></div>
    <div class="video-result" id="videoResult">
      <video id="resultVideo" controls playsinline></video>
      <div class="btn-row"><a id="downloadLink" class="secondary" style="text-decoration:none;padding:10px 18px;border-radius:10px;display:inline-block" download="sihwa_video.webm">영상 다운로드</a></div>
    </div>
  </div>
  <div id="versesContainer">
    <div class="empty-state" id="emptyState"><span>🎵</span>음악 올리고 분석 누르면 AI 시와 프롬프트가 생깁니다</div>
  </div>
  <canvas id="videoCanvas" width="1280" height="720"></canvas>
</div>
<script>
const NEW_AUDIO_MODELS = ['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3-flash-preview','gemini-flash-latest','gemini-pro-latest'];
const NEW_IMAGE_MODELS = ['gemini-3-pro-image-preview','gemini-3-pro-image','gemini-3.1-flash-image-preview','gemini-3.1-flash-image','gemini-2.5-flash-image','gemini-3.1-flash-lite-image','gemini-nano-banana-2.1','nano-banana-pro-preview'];
const OLD_FALLBACK = ['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.5-pro'];
const styleSuffix = {
  watercolor:"delicate watercolor painting, soft wet-on-wet, transparent layers, paper texture, muted autumn palette",
  korean:"traditional Korean painting, hanji texture, elegant brushwork, subdued natural tones",
  ink:"East Asian ink wash sumi-e, expressive brush strokes, rice paper, minimalist",
  oil:"classical oil painting, impasto texture, warm chiaroscuro, museum quality",
  dreamy:"dreamy illustration, soft glowing light, ethereal atmosphere, pastel deep shadows, cinematic",
  anime:"anime aesthetic, Makoto Shinkai background, beautiful lighting, soft film grain"
};
const audioInput=document.getElementById('audioInput');
const audioPlayer=document.getElementById('audioPlayer');
const apiKeyInput=document.getElementById('apiKeyInput');
const saveKeyBtn=document.getElementById('saveKeyBtn');
const audioModelSelect=document.getElementById('audioModelSelect');
const imageModelSelect=document.getElementById('imageModelSelect');
const styleSelect=document.getElementById('styleSelect');
const analyzeBtn=document.getElementById('analyzeBtn');
const generateAllBtn=document.getElementById('generateAllBtn');
const makeVideoBtn=document.getElementById('makeVideoBtn');
const versesContainer=document.getElementById('versesContainer');
const emptyState=document.getElementById('emptyState');
const mainStatus=document.getElementById('mainStatus');
const apiStatus=document.getElementById('apiStatus');
const analysisBox=document.getElementById('analysisBox');
const videoCanvas=document.getElementById('videoCanvas');
const ctx=videoCanvas.getContext('2d');
let currentFile=null;
let currentAnalysis=null;
let generatedImages={};
function populate() {
  NEW_AUDIO_MODELS.forEach(m=>{
    const o=document.createElement('option');o.value=m;o.textContent=m;
    if(m==='gemini-3.8-flash') o.selected=true;
    audioModelSelect.appendChild(o);
  });
  OLD_FALLBACK.forEach(m=>{
    const o=document.createElement('option');o.value=m;o.textContent=m+' (legacy - may 404)';audioModelSelect.appendChild(o);
  });
  NEW_IMAGE_MODELS.forEach(m=>{
    const o=document.createElement('option');o.value=m;o.textContent=m;
    if(m==='gemini-3-pro-image-preview') o.selected=true;
    imageModelSelect.appendChild(o);
  });
}
populate();
function loadKey(){ const k=localStorage.getItem('gemini_api_key'); if(k){ apiKeyInput.value=k; apiStatus.textContent='저장된 키 불러옴'; } }
loadKey();
function getKey(){ return apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key') || ''; }
saveKeyBtn.onclick = async ()=>{
  const k=apiKeyInput.value.trim();
  if(!k){ apiStatus.textContent='키 입력 필요'; return; }
  localStorage.setItem('gemini_api_key',k);
  apiStatus.textContent='키 저장됨, 사용 가능 모델 조회 중...';
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${k}`);
    const j=await r.json();
    if(j.models){
      const names=j.models.map(m=>m.name.replace('models/',''));
      const audioAvail=names.filter(n=>!n.includes('image') && !n.includes('tts') && !n.includes('transcribe') && !n.includes('lyria'));
      const imageAvail=names.filter(n=>n.includes('image') || n.includes('banana'));
      apiStatus.textContent=`조회 성공! 내 계정 사용 가능: Audio[${audioAvail.slice(0,6).join(', ')}] / Image[${imageAvail.slice(0,6).join(', ')}]\n전체 ${names.length}개 모델 확인`;
      // auto select first available that matches our list
      const firstAudio=NEW_AUDIO_MODELS.find(m=>names.includes(m));
      if(firstAudio){ audioModelSelect.value=firstAudio; }
    } else {
      apiStatus.textContent='모델 조회 실패: '+(j.error?.message||JSON.stringify(j).slice(0,300));
    }
  }catch(e){ apiStatus.textContent='모델 조회 실패: '+e.message; }
};
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
audioInput.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  currentFile=f;
  const url=URL.createObjectURL(f);
  audioPlayer.src=url; audioPlayer.style.display='block';
  analyzeBtn.disabled=false;
  mainStatus.textContent=`${f.name} (${(f.size/1024/1024).toFixed(2)}MB) 로드됨. 분석 버튼 눌러`;
});
async function callGeminiWithFallback(apiKey, preferredModel, fallbackList, payload){
  const modelsToTry=[preferredModel, ...fallbackList.filter(m=>m!==preferredModel)];
  let lastErr='';
  for(const model of modelsToTry){
    try{
      mainStatus.textContent=`${model} 시도 중...`;
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
      });
      if(!resp.ok){
        const txt=await resp.text();
        lastErr=`${model} ${resp.status}: ${txt.slice(0,500)}`;
        if(resp.status===404 || txt.includes('NOT_FOUND') || txt.includes('no longer available')){
          console.warn('try next model',lastErr);
          continue;
        } else {
          throw new Error(lastErr);
        }
      }
      const data=await resp.json();
      return {data, modelUsed:model};
    }catch(e){
      lastErr=e.message;
      if(e.message.includes('404') || e.message.includes('NOT_FOUND') || e.message.includes('no longer available')) continue;
      // for other errors still try next if it's model-related
      if(modelsToTry.indexOf(preferredModel) < modelsToTry.length-1) continue;
      throw e;
    }
  }
  throw new Error('모든 모델 실패. 마지막 에러: '+lastErr);
}
async function analyzeMusic(){
  const apiKey=getKey();
  if(!apiKey){ mainStatus.textContent='API 키 먼저 입력'; return; }
  if(!currentFile){ mainStatus.textContent='음악 파일 선택 필요'; return; }
  analyzeBtn.disabled=true;
  mainStatus.textContent='음악 분석 중...';
  try{
    const b64=await fileToBase64(currentFile);
    const mime=currentFile.type||'audio/mp3';
    const prompt=`You are a Korean music director and poet. Analyze this audio file.
Return ONLY valid JSON, no markdown.
{
  "mood":"overall mood in Korean",
  "tempo":"slow/medium/fast + BPM guess",
  "energy":"low/medium/high",
  "instruments":["piano","strings"],
  "colors":["muted blue","warm amber"],
  "keywords":["rain","loneliness"],
  "verses":[
    {"ko":"한글시 두줄\\n두번째줄","base_en":"detailed English visual prompt for ComfyUI, 35+ words, scene, lighting, atmosphere"},
    {"ko":"...","base_en":"..."},
    {"ko":"...","base_en":"..."},
    {"ko":"...","base_en":"..."}
  ]
}
Requirements: 4 verses, Korean poem melancholic poetic, English prompt vivid, 35+ words each.`;
    const payload={
      contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime,data:b64}}]}],
      generationConfig:{temperature:0.8,maxOutputTokens:3000}
    };
    const fallbackAudio=[...NEW_AUDIO_MODELS,'gemini-flash-latest','gemini-pro-latest'];
    const {data, modelUsed}=await callGeminiWithFallback(apiKey, audioModelSelect.value, fallbackAudio, payload);
    const text=data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';
    const match=text.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('JSON 파싱 실패: '+text.slice(0,600));
    const parsed=JSON.parse(match[0]);
    currentAnalysis=parsed;
    analysisBox.style.display='block';
    analysisBox.innerHTML=`<b>사용된 모델:</b> ${modelUsed}<br><b>Mood:</b> ${parsed.mood} / <b>Tempo:</b> ${parsed.tempo}<br><b>Instruments:</b> ${(parsed.instruments||[]).join(', ')}<br><b>Colors:</b> ${(parsed.colors||[]).join(', ')}<br><b>Keywords:</b> ${(parsed.keywords||[]).join(', ')}`;
    renderVerses(parsed.verses);
    generateAllBtn.disabled=false;
    mainStatus.textContent=`분석 성공 (${modelUsed}) ✓ 이제 이미지 생성`;
  }catch(e){
    console.error(e);
    mainStatus.textContent='분석 실패: '+e.message+'\n\n폴백 시로 임시 표시';
    const fallback={mood:'서정적 가을',verses:[
      {ko:"창문에 맺힌 빗방울이\n가을 저녁을 길게 늘어뜨린다",base_en:"quiet autumn evening rain, water droplets clinging to window glass, distant train implied, old letter on wooden desk, melancholic nostalgic atmosphere, soft diffused light, cinematic composition"},
      {ko:"네가 남긴 찻잔 자리\n아직 따뜻한 자국이 남아",base_en:"empty teacup on wooden table, faint warm mark, light breeze lifting curtain edge, soft indoor light, quiet lingering loneliness, shallow depth of field, poetic still life"},
      {ko:"기억은 수채화처럼 번지고\n얼굴은 점점 흐려지는데",base_en:"memories dissolving like watercolor, blurred human face fading into rain, clear voice remaining in rain sound, emotional poetic atmosphere, soft edges, color bleeding"},
      {ko:"언젠가는 이 비도 그치고\n창문은 다시 맑아지겠지",base_en:"after rain clear window looking to calm autumn sky, hopeful light breaking through clouds, bittersweet gentle mood, peaceful atmosphere, soft sunrise"}
    ]};
    currentAnalysis=fallback;
    renderVerses(fallback.verses);
    generateAllBtn.disabled=false;
  }finally{ analyzeBtn.disabled=false; }
}
function getFullPrompt(base_en, style){ return `${base_en}, ${styleSuffix[style]}, masterpiece, best quality, highly detailed, 8k, soft cinematic lighting, poetic composition`; }
function renderVerses(verses){
  versesContainer.innerHTML='';
  verses.forEach((verse,i)=>{
    const div=document.createElement('div');div.className='verse';div.id=`verse-${i}`;
    const prompt=getFullPrompt(verse.base_en, styleSelect.value);
    div.innerHTML=`<div class="verse-number">VERSE ${String(i+1).padStart(2,'0')}</div>
      <div class="poem-text">${verse.ko}</div>
      <div class="prompt-box"><div class="prompt-label"><span>ComfyUI / Gemini Prompt</span><div><button class="copy-btn" data-i="${i}">복사</button><button class="gen-one-btn" data-i="${i}">생성</button></div></div><div class="prompt-text" id="prompt-${i}">${prompt}</div></div>
      <div class="image-area" id="image-area-${i}"><div class="image-placeholder">Generate 대기 중</div></div>`;
    versesContainer.appendChild(div);
  });
  versesContainer.querySelectorAll('.copy-btn').forEach(b=>{
    b.onclick=()=>{ const t=document.getElementById(`prompt-${b.dataset.i}`).innerText; navigator.clipboard.writeText(t); b.textContent='복사됨'; setTimeout(()=>b.textContent='복사',1000); };
  });
  versesContainer.querySelectorAll('.gen-one-btn').forEach(b=>{ b.onclick=()=>generateOne(parseInt(b.dataset.i)); });
  document.querySelectorAll('.verse').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'), i*200));
}
styleSelect.addEventListener('change',()=>{ if(currentAnalysis?.verses) renderVerses(currentAnalysis.verses); });
async function generateImageWithFallback(prompt, apiKey, preferredModel){
  const payload={ contents:[{parts:[{text:prompt}]}], generationConfig:{responseModalities:["TEXT","IMAGE"]} };
  const fallbacks=[...NEW_IMAGE_MODELS];
  return await callGeminiWithFallback(apiKey, preferredModel, fallbacks, payload);
}
function pollinationsGenerate(prompt, area){
  const encoded=encodeURIComponent(prompt);
  const url=`https://image.pollinations.ai/prompt/${encoded}?width=1024&height=768&nologo=true&seed=${Math.floor(Math.random()*100000)}`;
  return new Promise((res,rej)=>{
    area.innerHTML=`<div class="loading-spinner"></div>`;
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{
      area.innerHTML=''; area.appendChild(img);
      const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      res({dataUrl:c.toDataURL('image/png'), element:img, url});
    };
    img.onerror=()=>{ area.innerHTML=`<div class="image-placeholder">실패</div>`; rej(new Error('pollinations fail')); };
    img.src=url;
  });
}
async function generateOne(index){
  const prompt=document.getElementById(`prompt-${index}`)?.innerText; if(!prompt) return;
  const area=document.getElementById(`image-area-${index}`);
  const apiKey=getKey();
  const model=imageModelSelect.value;
  area.innerHTML=`<div class="loading-spinner"></div>`;
  try{
    if(apiKey){
      const {data, modelUsed}=await generateImageWithFallback(prompt, apiKey, model);
      const parts=data.candidates?.[0]?.content?.parts||[];
      let dataUrl=null;
      for(const p of parts){ if(p.inlineData?.data){ dataUrl=`data:${p.inlineData.mimeType||'image/png'};base64,${p.inlineData.data}`; break; } if(p.inline_data?.data){ dataUrl=`data:${p.inline_data.mime_type||'image/png'};base64,${p.inline_data.data}`; break; } }
      if(!dataUrl) throw new Error('이미지 데이터 없음');
      area.innerHTML=`<img src="${dataUrl}" crossorigin="anonymous"><div style="position:absolute;bottom:6px;right:8px;font-size:.65rem;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px">${modelUsed}</div>`;
      area.style.position='relative';
      generatedImages[index]={dataUrl, element:area.querySelector('img'), url:dataUrl};
    }else{
      const r=await pollinationsGenerate(prompt, area); generatedImages[index]=r;
    }
    checkReady();
  }catch(e){
    console.warn(e);
    try{ const r=await pollinationsGenerate(prompt, area); generatedImages[index]=r; checkReady(); }
    catch(e2){ area.innerHTML=`<div class="image-placeholder">실패: ${e.message.slice(0,200)}</div>`; }
  }
}
async function generateAll(){
  if(!currentAnalysis) return;
  generateAllBtn.disabled=true; generateAllBtn.textContent='생성 중...'; generatedImages={};
  for(let i=0;i<currentAnalysis.verses.length;i++){ await generateOne(i); await new Promise(r=>setTimeout(r,700)); }
  generateAllBtn.disabled=false; generateAllBtn.textContent='2. 이미지 전체 생성';
}
function checkReady(){
  if(currentAnalysis && Object.keys(generatedImages).length===currentAnalysis.verses.length){
    makeVideoBtn.disabled=false; mainStatus.textContent='모든 이미지 완료! 시화영상 만들기 가능';
  }
}
async function makeVideo(){
  if(!currentAnalysis) return;
  const total=currentAnalysis.verses.length;
  if(Object.keys(generatedImages).length<total){ mainStatus.textContent='이미지 아직 다 안됨'; return; }
  mainStatus.textContent='시화영상 인코딩 중...'; makeVideoBtn.disabled=true;
  const durationPer=4, totalDuration=durationPer*total, fps=30;
  const imgs=[];
  for(let i=0;i<total;i++){
    const g=generatedImages[i]; const img=new Image(); img.crossOrigin='anonymous'; img.src=g.dataUrl; await new Promise(r=>{ img.onload=r; img.onerror=r; }); imgs.push(img);
  }
  const canvasStream=videoCanvas.captureStream(fps);
  let combined=canvasStream;
  try{ let aStream=null; if(audioPlayer.captureStream) aStream=audioPlayer.captureStream(); else if(audioPlayer.mozCaptureStream) aStream=audioPlayer.mozCaptureStream(); if(aStream && aStream.getAudioTracks().length>0){ combined=new MediaStream([...canvasStream.getVideoTracks(),...aStream.getAudioTracks()]); } }catch{}
  const recorder=new MediaRecorder(combined,{mimeType:'video/webm;codecs=vp9'}); const chunks=[]; recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); }; const done=new Promise(r=>recorder.onstop=r); recorder.start(100);
  const start=performance.now(); let frame=0; const totalFrames=totalDuration*fps;
  function draw(now){
    const elapsed=(now-start)/1000; if(elapsed>=totalDuration) return;
    const idx=Math.min(Math.floor(elapsed/durationPer), total-1); const prog=(elapsed%durationPer)/durationPer;
    const img=imgs[idx]; const poem=currentAnalysis.verses[idx].ko;
    const zoom=1+prog*0.08; ctx.fillStyle='#000'; ctx.fillRect(0,0,1280,720);
    if(img){ const scale=Math.max(1280/img.width,720/img.height)*zoom; const w=img.width*scale,h=img.height*scale; const x=(1280-w)/2+Math.sin(prog*Math.PI)*18; const y=(720-h)/2; ctx.drawImage(img,x,y,w,h); }
    const grad=ctx.createLinearGradient(0,500,0,720); grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,.7)'); ctx.fillStyle=grad; ctx.fillRect(0,0,1280,720);
    ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(0,0,1280,720);
    const alpha=prog<0.15?prog/0.15:prog>0.85?(1-prog)/0.15:1; ctx.globalAlpha=alpha; ctx.fillStyle='#fff'; ctx.font='600 44px "Noto Serif KR", serif'; ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=18; poem.split('\n').forEach((line,j)=>{ ctx.fillText(line,640,520+j*60); }); ctx.shadowBlur=0; ctx.globalAlpha=1;
    ctx.fillStyle='rgba(144,205,244,.85)'; ctx.font='500 16px "Noto Sans KR", sans-serif'; ctx.textAlign='left'; ctx.fillText(`VERSE ${String(idx+1).padStart(2,'0')} / ${total}`,36,44);
    frame++; if(frame<totalFrames) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  if(audioPlayer.src){ audioPlayer.currentTime=0; audioPlayer.play().catch(()=>{}); }
  setTimeout(()=>{ recorder.stop(); audioPlayer.pause(); }, totalDuration*1000+300);
  await done;
  const blob=new Blob(chunks,{type:'video/webm'}); const url=URL.createObjectURL(blob);
  const resultVideo=document.getElementById('resultVideo'); const downloadLink=document.getElementById('downloadLink'); const videoResult=document.getElementById('videoResult');
  resultVideo.src=url; downloadLink.href=url; videoResult.style.display='block';
  mainStatus.textContent='시화영상 완성!'; makeVideoBtn.disabled=false; videoResult.scrollIntoView({behavior:'smooth'});
}
analyzeBtn.addEventListener('click', analyzeMusic);
generateAllBtn.addEventListener('click', generateAll);
makeVideoBtn.addEventListener('click', makeVideo);
</script>
