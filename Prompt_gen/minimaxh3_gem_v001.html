<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>H3 Prompt Studio</title>
  <style>
    :root { --bg:#0b0d12; --panel:#151924; --line:#2b3344; --ink:#f3f6fb; --muted:#a9b2c2; --accent:#83f7c8; --accent2:#a390ff; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 80% 0,#252049 0,transparent 34%),var(--bg); color:var(--ink); font-family:Inter, Pretendard, Arial,sans-serif; }
    main { max-width:1200px; margin:auto; padding:44px 22px 64px; } header { margin-bottom:28px; } .eyebrow { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.14em; } h1 { margin:8px 0; font-size:clamp(30px,5vw,52px); letter-spacing:-.06em; } header p { margin:0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:1.05fr .95fr; gap:18px; } .card { background:rgba(21,25,36,.92); border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:0 18px 45px #0003; }
    .form { display:grid; gap:15px; } label { display:grid; gap:7px; font-size:13px; font-weight:700; } input, textarea, select { width:100%; background:#0e121b; border:1px solid #30394b; color:var(--ink); border-radius:10px; padding:12px; font:inherit; outline:none; } input:focus,textarea:focus,select:focus { border-color:var(--accent); } textarea { min-height:82px; resize:vertical; } #story { min-height:130px; } .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .api { border:1px solid #30394b; background:#10151f; border-radius:12px; padding:13px; display:grid; gap:10px; } .api small { color:var(--muted); line-height:1.4; }
    button { border:0; cursor:pointer; border-radius:11px; padding:13px 16px; font-weight:800; font-size:14px; } .generate { background:var(--accent); color:#082119; } .secondary { background:#252d3e; color:var(--ink); } .actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:4px; }
    .output { min-height:420px; display:flex; flex-direction:column; } .output h2 { margin:0 0 12px; font-size:17px; } pre { white-space:pre-wrap; word-break:keep-all; line-height:1.75; color:#e7ecf5; margin:0; font:14px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace; flex:1; background:#0e121b; padding:16px; border-radius:12px; border:1px solid #293143; } .hint { color:var(--muted); font-size:12px; margin:12px 0 0; } .tags { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:15px; } .tag { border:1px solid #46506a; color:#cbd4e4; background:transparent; padding:7px 10px; font-size:12px; } .tag:hover { border-color:var(--accent2); color:white; } .output-tabs { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; } .output-tabs button { background:#222a3a; color:#cbd4e4; padding:8px 10px; font-size:12px; } .output-tabs button.active { background:var(--accent2); color:white; }
    @media(max-width:820px){ .grid{grid-template-columns:1fr} main{padding-top:28px}.two{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <header><div class="eyebrow">MINIMAX H3 · VIDEO PROMPT MAKER</div><h1>H3 Prompt Studio</h1><p>원하는 장면을 입력하면 영상 생성용 영문 프롬프트를 깔끔하게 조합합니다.</p></header>
  <section class="grid">
    <div class="card"><div class="api"><div class="two"><label>AI 제공자<select id="provider"><option value="gemini">Gemini</option><option value="deepseek">DeepSeek</option></select></label><label>모델명<input id="model" value="gemini-3.7-flash" /></label></div><label>API 키<input id="apiKey" type="password" autocomplete="off" placeholder="이 브라우저에서만 사용되며 저장하지 않습니다" /></label><small>키는 어디에도 저장하거나 전송하지 않고, 선택한 AI 제공자의 공식 API 호출에만 사용합니다. GitHub 공개 페이지에는 키를 넣어 올리지 마세요.</small></div><div class="tags"><button class="tag" data-preset="A cinematic fashion film of a woman walking through neon-lit Seoul at night">네온 서울</button><button class="tag" data-preset="A cozy miniature cafe inside a rainy glass terrarium">미니어처 카페</button><button class="tag" data-preset="A majestic white tiger walking through a misty ancient forest">백호 숲</button></div>
      <div class="form">
        <label>이야기 / 아이디어 <textarea id="story" placeholder="예: 10년 만에 고향에 돌아온 여성이 비 오는 버스정류장에서 어린 시절의 자신과 닮은 소녀를 본다. 그 순간 멈춰 서서 미소 짓는다."></textarea></label>
        <label>주인공 / 소재<input id="subject" placeholder="예: 붉은 우산을 든 20대 여성" /></label>
        <label>행동과 순간<input id="action" placeholder="예: 비 내리는 골목을 천천히 걷는다" /></label>
        <label>장소와 배경<textarea id="setting" placeholder="예: 밤의 서울, 젖은 아스팔트에 네온사인이 반사되는 골목"></textarea></label>
        <div class="two"><label>연출 의도 / 분위기<select id="mood"><option>quietly hopeful and intimate</option><option>mysterious and suspenseful</option><option>bold, energetic, and aspirational</option><option>nostalgic and melancholic</option><option>playful and charming</option></select></label><label>구도<select id="composition"><option>medium-wide hero composition</option><option>close-up portrait with environmental context</option><option>wide establishing composition</option><option>low-angle, powerful composition</option><option>over-the-shoulder storytelling composition</option></select></label></div>
        <div class="two"><label>카메라<select id="camera"><option>slow cinematic dolly-in</option><option>handheld tracking shot</option><option>smooth orbiting camera move</option><option>static wide shot</option><option>dramatic low-angle close-up</option></select></label><label>화면 비율<select id="ratio"><option>16:9 landscape</option><option>9:16 vertical</option><option>1:1 square</option></select></label></div>
        <div class="two"><label>스타일<select id="style"><option>cinematic, photorealistic</option><option>dreamy editorial film</option><option>high-end commercial</option><option>anime-inspired, detailed</option><option>documentary realism</option></select></label><label>조명<select id="light"><option>soft golden-hour light</option><option>moody neon lighting</option><option>overcast diffused light</option><option>dramatic chiaroscuro lighting</option><option>warm practical lights</option></select></label></div>
        <label>추가 디테일 <input id="details" placeholder="예: 바람에 머리카락이 흩날리고, 자연스러운 표정" /></label>
        <div class="actions"><button class="generate" id="generate">AI로 프롬프트 만들기</button><button class="secondary" id="reset">초기화</button></div>
      </div>
    </div>
    <div class="card output"><h2>생성된 프롬프트</h2><div class="output-tabs"><button class="active" data-output="h3">MiniMax H3 · 영상</button><button data-output="krea">Krea 2 · 이미지</button><button data-output="turbo">Turbo Z · 이미지</button></div><pre id="result">왼쪽에 장면을 입력한 뒤 ‘프롬프트 만들기’를 눌러주세요.</pre><div class="actions"><button class="generate" id="copy">복사하기</button></div><p class="hint" id="hint">MiniMax H3에 그대로 붙여넣은 뒤, 필요하면 길이·해상도 설정만 조절하세요.</p></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id); let prompts={}, active='h3';
const models={gemini:'gemini-3.7-flash',deepseek:'deepseek-v4-flash'};
function render(){ $('result').textContent=prompts[active]||'왼쪽에 장면을 입력한 뒤 ‘프롬프트 만들기’를 눌러주세요.'; $('hint').textContent=active==='h3'?'MiniMax H3에 그대로 붙여넣은 뒤, 필요하면 길이·해상도 설정만 조절하세요.':active==='krea'?'Krea 2의 이미지 생성 입력창에 그대로 붙여넣으세요.':'Turbo Z의 이미지 생성 입력창에 그대로 붙여넣으세요.'; }
function brief(){return `USER STORY (interpret this faithfully; it may be Korean): ${$('story').value.trim()||'No story given — build from the fields below.'}\nSubject: ${$('subject').value.trim()||'not specified'}\nMoment/action: ${$('action').value.trim()||'not specified'}\nSetting: ${$('setting').value.trim()||'not specified'}\nMood: ${$('mood').value}\nComposition: ${$('composition').value}\nCamera preference: ${$('camera').value}\nStyle: ${$('style').value}\nLighting: ${$('light').value}\nAspect ratio: ${$('ratio').value}\nExtra detail: ${$('details').value.trim()||'none'}`}
async function callAI(instruction){const key=$('apiKey').value.trim(), provider=$('provider').value, model=$('model').value.trim(); if(!key) throw new Error('API 키를 입력해주세요.'); if(provider==='gemini'){const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:instruction}]}],generationConfig:{responseMimeType:'application/json',temperature:.8}})}); const data=await res.json(); if(!res.ok) throw new Error(data.error?.message||'Gemini 호출에 실패했습니다.'); return data.candidates?.[0]?.content?.parts?.map(x=>x.text).join('')||'';} const res=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model,messages:[{role:'system',content:'You are an elite prompt director. Return only valid JSON.'},{role:'user',content:instruction}],response_format:{type:'json_object'},temperature:.8,max_tokens:1800,thinking:{type:'disabled'}})}); const data=await res.json(); if(!res.ok) throw new Error(data.error?.message||'DeepSeek 호출에 실패했습니다.'); return data.choices?.[0]?.message?.content||'';}
async function make(){const instruction=`Turn the following creative brief into three distinct, polished English generation prompts. Do not merely list keywords: infer the visual story, a decisive moment, emotional subtext, composition, lighting, materials, and visual continuity. Respect every user-specified detail. H3 is a moving video prompt with purposeful camera/action and motion safeguards. Krea 2 is a single editorial image prompt. Turbo Z is a high-impact premium campaign still. Include relevant negatives in each. Return ONLY JSON with exactly these string keys: h3, krea, turbo.\n\n${brief()}`; const btn=$('generate'); btn.disabled=true; btn.textContent='이야기를 해석하는 중…'; $('result').textContent='AI가 이야기를 장면과 연출로 풀어내고 있습니다…'; try {let raw=await callAI(instruction); raw=raw.replace(/^```json\s*|\s*```$/g,'').trim(); const data=JSON.parse(raw); if(!data.h3||!data.krea||!data.turbo) throw new Error('완전한 3개 프롬프트를 받지 못했습니다. 다시 시도해주세요.'); prompts=data; render();} catch(e){$('result').textContent=`오류: ${e.message}`;} finally {btn.disabled=false;btn.textContent='AI로 프롬프트 만들기';}}
$('generate').onclick=make; $('provider').onchange=()=>{$('model').value=models[$('provider').value]}; $('copy').onclick=async()=>{await navigator.clipboard.writeText($('result').textContent); $('copy').textContent='복사 완료!'; setTimeout(()=>$('copy').textContent='복사하기',1500)}; $('reset').onclick=()=>{document.querySelectorAll('input:not(#model),textarea').forEach(x=>x.value=''); prompts={}; render()}; document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{$('setting').value=b.dataset.preset; $('story').value=b.dataset.preset;}); document.querySelectorAll('[data-output]').forEach(b=>b.onclick=()=>{active=b.dataset.output; document.querySelectorAll('[data-output]').forEach(x=>x.classList.toggle('active',x===b)); render()});
</script>
</body></html>
