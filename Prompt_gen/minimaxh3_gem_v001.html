<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>H3 Prompt Studio</title>
  <style>
    :root { --bg:#0b0d12; --panel:#151924; --line:#2b3344; --ink:#f3f6fb; --muted:#a9b2c2; --accent:#83f7c8; --accent2:#a390ff; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 80% 0,#252049 0,transparent 34%),var(--bg); color:var(--ink); font-family:Inter, Pretendard, Arial,sans-serif; }
    main { max-width:1200px; margin:auto; padding:44px 22px 64px; } header { margin-bottom:28px; } .eyebrow { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.14em; } h1 { margin:8px 0; font-size:clamp(30px,5vw,52px); letter-spacing:-.06em; } header p { margin:0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:1.05fr .95fr; gap:18px; } .card { background:rgba(21,25,36,.92); border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:0 18px 45px #0003; }
    .form { display:grid; gap:15px; } label { display:grid; gap:7px; font-size:13px; font-weight:700; } input, textarea, select { width:100%; background:#0e121b; border:1px solid #30394b; color:var(--ink); border-radius:10px; padding:12px; font:inherit; outline:none; } input:focus,textarea:focus,select:focus { border-color:var(--accent); } textarea { min-height:82px; resize:vertical; } .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button { border:0; cursor:pointer; border-radius:11px; padding:13px 16px; font-weight:800; font-size:14px; } .generate { background:var(--accent); color:#082119; } .secondary { background:#252d3e; color:var(--ink); } .actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:4px; }
    .output { min-height:420px; display:flex; flex-direction:column; } .output h2 { margin:0 0 12px; font-size:17px; } pre { white-space:pre-wrap; word-break:keep-all; line-height:1.75; color:#e7ecf5; margin:0; font:14px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace; flex:1; background:#0e121b; padding:16px; border-radius:12px; border:1px solid #293143; } .hint { color:var(--muted); font-size:12px; margin:12px 0 0; } .tags { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:15px; } .tag { border:1px solid #46506a; color:#cbd4e4; background:transparent; padding:7px 10px; font-size:12px; } .tag:hover { border-color:var(--accent2); color:white; } .output-tabs { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; } .output-tabs button { background:#222a3a; color:#cbd4e4; padding:8px 10px; font-size:12px; } .output-tabs button.active { background:var(--accent2); color:white; }
    @media(max-width:820px){ .grid{grid-template-columns:1fr} main{padding-top:28px}.two{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <header><div class="eyebrow">MINIMAX H3 · VIDEO PROMPT MAKER</div><h1>H3 Prompt Studio</h1><p>원하는 장면을 입력하면 영상 생성용 영문 프롬프트를 깔끔하게 조합합니다.</p></header>
  <section class="grid">
    <div class="card"><div class="tags"><button class="tag" data-preset="A cinematic fashion film of a woman walking through neon-lit Seoul at night">네온 서울</button><button class="tag" data-preset="A cozy miniature cafe inside a rainy glass terrarium">미니어처 카페</button><button class="tag" data-preset="A majestic white tiger walking through a misty ancient forest">백호 숲</button></div>
      <div class="form">
        <label>주인공 / 소재<input id="subject" placeholder="예: 붉은 우산을 든 20대 여성" /></label>
        <label>행동<input id="action" placeholder="예: 비 내리는 골목을 천천히 걷는다" /></label>
        <label>장소와 배경<textarea id="setting" placeholder="예: 밤의 서울, 젖은 아스팔트에 네온사인이 반사되는 골목"></textarea></label>
        <div class="two"><label>카메라<select id="camera"><option>slow cinematic dolly-in</option><option>handheld tracking shot</option><option>smooth orbiting camera move</option><option>static wide shot</option><option>dramatic low-angle close-up</option></select></label><label>화면 비율<select id="ratio"><option>16:9 landscape</option><option>9:16 vertical</option><option>1:1 square</option></select></label></div>
        <div class="two"><label>스타일<select id="style"><option>cinematic, photorealistic</option><option>dreamy editorial film</option><option>high-end commercial</option><option>anime-inspired, detailed</option><option>documentary realism</option></select></label><label>조명<select id="light"><option>soft golden-hour light</option><option>moody neon lighting</option><option>overcast diffused light</option><option>dramatic chiaroscuro lighting</option><option>warm practical lights</option></select></label></div>
        <label>추가 디테일 <input id="details" placeholder="예: 바람에 머리카락이 흩날리고, 자연스러운 표정" /></label>
        <div class="actions"><button class="generate" id="generate">프롬프트 만들기</button><button class="secondary" id="reset">초기화</button></div>
      </div>
    </div>
    <div class="card output"><h2>생성된 프롬프트</h2><div class="output-tabs"><button class="active" data-output="h3">MiniMax H3 · 영상</button><button data-output="krea">Krea 2 · 이미지</button><button data-output="turbo">Turbo Z · 이미지</button></div><pre id="result">왼쪽에 장면을 입력한 뒤 ‘프롬프트 만들기’를 눌러주세요.</pre><div class="actions"><button class="generate" id="copy">복사하기</button></div><p class="hint" id="hint">MiniMax H3에 그대로 붙여넣은 뒤, 필요하면 길이·해상도 설정만 조절하세요.</p></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id); let prompts={}, active='h3';
function render(){ $('result').textContent=prompts[active]||'왼쪽에 장면을 입력한 뒤 ‘프롬프트 만들기’를 눌러주세요.'; $('hint').textContent=active==='h3'?'MiniMax H3에 그대로 붙여넣은 뒤, 필요하면 길이·해상도 설정만 조절하세요.':active==='krea'?'Krea 2의 이미지 생성 입력창에 그대로 붙여넣으세요.':'Turbo Z의 이미지 생성 입력창에 그대로 붙여넣으세요.'; }
function make(){const s=$('subject').value.trim()||'A compelling main subject'; const a=$('action').value.trim()||'moves naturally through the scene'; const set=$('setting').value.trim()||'in a visually rich environment'; const d=$('details').value.trim(); const common=`${s}, ${a}, ${set}, ${$('style').value}, ${$('light').value}${d?', '+d:''}`; prompts={h3:`Create a ${$('style').value} video: ${s} ${a}, ${set}. ${$('camera').value}. ${$('light').value}. ${d?d+'. ':''}Natural motion, coherent anatomy and physics, detailed textures, subtle depth of field, polished color grading. Format: ${$('ratio').value}. No text, captions, logos, watermarks, flicker, distortion, or jump cuts.`, krea:`${common}. Editorial composition, intentional framing, rich material detail, dimensional lighting, refined color palette, crisp focus on the main subject, premium visual storytelling. Aspect ratio ${$('ratio').value}. No text, typography, watermark, logo, distorted hands, extra limbs, blur, or low-detail background.`, turbo:`${common}. High-impact cinematic still, clear focal point, beautifully balanced composition, highly detailed textures, controlled highlights and shadows, clean edges, premium commercial image quality, ultra-detailed. Aspect ratio ${$('ratio').value}. Exclude text, letters, logos, watermark, duplicated objects, malformed anatomy, artifacts, and noise.`}; render();}
$('generate').onclick=make; $('copy').onclick=async()=>{await navigator.clipboard.writeText($('result').textContent); $('copy').textContent='복사 완료!'; setTimeout(()=>$('copy').textContent='복사하기',1500)}; $('reset').onclick=()=>{document.querySelectorAll('input,textarea').forEach(x=>x.value=''); prompts={}; render()}; document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{$('setting').value=b.dataset.preset; make()}); document.querySelectorAll('[data-output]').forEach(b=>b.onclick=()=>{active=b.dataset.output; document.querySelectorAll('[data-output]').forEach(x=>x.classList.toggle('active',x===b)); render()});
</script>
</body></html>
