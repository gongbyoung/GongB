<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimax H3 Video Prompt Generator</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2b2b2b;
            --border-color: #444;
            --accent-color: #4CAF50;
            --text-main: #eeeeee;
            --text-muted: #aaaaaa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #fff;
        }
        .header p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        textarea, input[type="text"], input[type="password"] {
            width: 100%;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: monospace;
        }
        textarea {
            resize: vertical;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .secondary-btn {
            background-color: #555;
        }
        .secondary-btn:hover {
            background-color: #666;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .scene-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .scene-card {
            background-color: #222;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            padding: 15px;
            position: relative;
        }
        .scene-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }
        .scene-time {
            font-weight: bold;
            color: var(--accent-color);
        }
        .scene-source {
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-size: 13px;
        }
        .scene-prompt {
            background: #111;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
            padding-bottom: 30px; /* Copy 버튼 공간 확보 */
        }
        .copy-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            padding: 6px 12px;
            font-size: 12px;
        }
        #loading {
            display: none;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Minimax H3 Prompt Generator</h1>
        <p>시나 스토리를 분석하여 ComfyUI Video 생성(5초 단위)에 일관성을 부여하는 영문 프롬프트 추출기</p>
    </div>

    <div class="panel">
        <label for="apiKey">Gemini API Key (분석 자동화를 위해 필요)</label>
        <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API 키 입력 (입력된 키는 로컬 브라우저에서만 처리됩니다)">
        
        <label for="storyInput">원문 텍스트 (시 / 스토리)</label>
        <textarea id="storyInput" rows="12">산 위에 올라서서 바라다보면
가로막힌 바다를 마주 건너서
님 계시는 마을이 내 눈앞으로
꿈 하늘 하늘같이 떠오릅니다

흰 모래 모래 비낀 선창가에는
한가한 뱃노래가 멀리 잦으며
날 저물고 안개는 깊이 덮여서
흩어지는 물꽃뿐 아득합니다

이윽고 밤 어두운 물새가 울면
물결조차 하나둘 배는 떠나서
저 멀리 한바다로 아주 바다로
마치 가랑잎같이 떠나갑니다</textarea>

        <label for="baseStyle">일관된 아트 스타일 및 카메라 기본 설정 (Global Prompt)</label>
        <input type="text" id="baseStyle" value="masterpiece, best quality, ultra-detailed, cinematic lighting, moody atmosphere, slow motion, highly detailed textures, smooth camera movement">
        
        <div class="button-group">
            <button id="generateBtn" onclick="generatePrompts()">AI 스토리 분석 및 프롬프트 생성</button>
            <button class="secondary-btn" onclick="copySystemPrompt()">수동용 LLM 프롬프트 복사</button>
        </div>
        <div id="loading">AI가 문맥을 분석하여 시퀀스를 구성 중입니다... (최대 10~20초 소요)</div>
    </div>

    <div class="panel" id="resultPanel" style="display: none;">
        <h2>생성된 씬 시퀀스 (5초 단위)</h2>
        <div id="sceneList" class="scene-list">
            <!-- 씬 카드가 동적으로 추가됩니다 -->
        </div>
    </div>
</div>

<script>
    function copySystemPrompt() {
        const story = document.getElementById('storyInput').value;
        const style = document.getElementById('baseStyle').value;
        
        const manualPrompt = `다음 한국어 시/스토리를 분석하여 비디오 AI 생성용(ComfyUI Minimax H3 모델) 5초 단위 영문 프롬프트 시퀀스로 나누어주세요.

[작업 조건]
1. 원문의 의미와 은유를 시각적인 영상 묘사로 변환할 것.
2. 각 씬은 5초 단위의 클립으로 가정하여 일관된 톤앤매너와 분위기를 유지할 것.
3. 모든 영문 프롬프트 끝에 다음 기본 스타일을 반드시 포함할 것: ", ${style}"
4. 피사체의 구체적인 모습, 빛의 방향, 안개나 물보라 같은 환경 요소, 카메라의 움직임(예: slow pan right, slight zoom in)을 명확하게 포함할 것.
5. 화자(나)가 서 있는 산 위, 바다 건너 마을, 선창가, 밤바다 등 공간의 이동과 시간의 흐름(저녁->밤)을 반영할 것.

[원본 텍스트]
${story}

출력은 반드시 각 씬별로 "원문 구절"과 "영문 프롬프트"가 구분되도록 작성해주세요.`;

        navigator.clipboard.writeText(manualPrompt).then(() => {
            alert('ChatGPT, Claude 또는 Gemini에 붙여넣을 수 있는 지시문이 클립보드에 복사되었습니다.');
        });
    }

    async function generatePrompts() {
        const apiKey = document.getElementById('apiKey').value;
        const story = document.getElementById('storyInput').value;
        const style = document.getElementById('baseStyle').value;
        const btn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultPanel = document.getElementById('resultPanel');
        const sceneList = document.getElementById('sceneList');

        if (!apiKey) {
            alert('API 키를 입력해주세요. 없으시다면 우측의 "수동용 LLM 프롬프트 복사" 기능을 이용해 다른 AI 챗봇에서 생성하신 후 사용할 수 있습니다.');
            return;
        }

        btn.disabled = true;
        loading.style.display = 'block';
        resultPanel.style.display = 'none';
        sceneList.innerHTML = '';

        const systemInstruction = `You are an expert video prompt engineer for the Minimax H3 Video generation model in ComfyUI.
Task: Break down the provided Korean poem into a sequence of continuous 5-second video scenes.
For each scene, translate the original text's mood into a highly descriptive visual English prompt.
Crucial: Append this exact base style string to the END of EVERY generated prompt: ", ${style}".
Ensure visual consistency across scenes, tracking the progression of time (sunset to deep night) and location (mountain top looking at the sea, misty dock, dark ocean).
Include specific camera movements (e.g., slow pan over the ocean, slow zoom out, static wide shot).

Return ONLY a valid JSON array of objects with the following format:
[
  {
    "time": "0s - 5s",
    "korean_text": "원문 한 줄 또는 연",
    "prompt": "Highly detailed english visual description of the scene, camera movement, lighting, ${style}"
  }
]`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: systemInstruction + "\n\n[Poem]\n" + story
                        }]
                    }],
                    generationConfig: {
                        response_mime_type: "application/json"
                    }
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            const responseText = data.candidates[0].content.parts[0].text;
            const scenes = JSON.parse(responseText);

            scenes.forEach((scene, index) => {
                const card = document.createElement('div');
                card.className = 'scene-card';
                card.innerHTML = \`
                    <div class="scene-header">
                        <span class="scene-time">Scene \${index + 1} [\${scene.time}]</span>
                    </div>
                    <div class="scene-source">"\${scene.korean_text}"</div>
                    <div class="scene-prompt" id="prompt-\${index}">\${scene.prompt}</div>
                    <button class="copy-btn" onclick="copyPrompt('prompt-\${index}')">프롬프트 복사</button>
                \`;
                sceneList.appendChild(card);
            });

            resultPanel.style.display = 'block';

        } catch (error) {
            alert('오류가 발생했습니다: API 키가 올바른지, 또는 네트워크 상태를 확인해주세요.\n상세 오류: ' + error.message);
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }

    function copyPrompt(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector(\`#\${elementId}\`).nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = '복사 완료!';
            btn.style.backgroundColor = '#45a049';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = 'var(--accent-color)';
            }, 1500);
        });
    }
</script>

</body>
</html>
