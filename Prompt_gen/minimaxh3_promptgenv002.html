<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimax H3 Prompt Generator (오프라인 지원)</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2b2b2b;
            --border-color: #444;
            --accent-color: #4CAF50;
            --text-main: #eeeeee;
            --text-muted: #aaaaaa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 10px;
        }
        .header h1 { margin: 0; font-size: 24px; color: #fff; }
        .header p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px; }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        select, textarea, input[type="text"], input[type="password"] {
            width: 100%;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: monospace;
        }
        select { font-family: 'Segoe UI', sans-serif; cursor: pointer; }
        textarea { resize: vertical; min-height: 200px; }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .secondary-btn { background-color: #555; }
        .secondary-btn:hover { background-color: #666; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .scene-list { display: flex; flex-direction: column; gap: 15px; }
        .scene-card {
            background-color: #222;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            padding: 15px;
            position: relative;
        }
        .scene-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }
        .scene-time { font-weight: bold; color: var(--accent-color); }
        .scene-source {
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-size: 13px;
        }
        .scene-prompt {
            background: #111;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
            word-wrap: break-word;
            padding-bottom: 35px;
            white-space: pre-wrap;
        }
        .copy-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            padding: 6px 12px;
            font-size: 12px;
        }
        #loading {
            display: none;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 10px;
        }
        .api-note {
            font-size: 12px;
            color: #ff9800;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
        .mode-hint {
            background: #1a2a3a;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #ff9800;
            margin-bottom: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎬 Minimax H3 Prompt Generator</h1>
        <p>Gemini / DeepSeek API 또는 <strong>완전 오프라인 분석</strong>으로 스토리에서 5초 단위 비디오 프롬프트를 추출합니다.</p>
    </div>

    <div class="panel">
        <label for="apiProvider">AI 모델 선택</label>
        <select id="apiProvider" onchange="toggleApiInfo()">
            <option value="offline">🛠️ 오프라인 분석 (API 없음, 즉시 실행)</option>
            <option value="gemini">Google Gemini (API 키 필요)</option>
            <option value="deepseek">DeepSeek (API 키 필요, CORS 주의)</option>
        </select>

        <div id="apiKeyArea">
            <label for="apiKey" id="apiKeyLabel">API Key</label>
            <input type="password" id="apiKey" placeholder="API 키를 입력하세요 (오프라인 모드에서는 무시됨)">
        </div>
        
        <div id="deepseekNote" class="api-note">
            * DeepSeek API는 브라우저 CORS 제한이 있을 수 있습니다. (에러 시 오프라인 모드 권장)
        </div>

        <div class="mode-hint" id="modeHint">
            ✅ 현재 <strong>오프라인 분석</strong> 모드입니다. 시의 키워드를 분석하여 자동으로 프롬프트를 생성합니다. API 키가 필요 없습니다.
        </div>

        <label for="storyInput">원문 텍스트 (시 / 스토리)</label>
        <textarea id="storyInput">산 위에 올라서서 바라다보면
가로막힌 바다를 마주 건너서
님 계시는 마을이 내 눈앞으로
꿈 하늘 하늘같이 떠오릅니다

흰 모래 모래 비낀 선창가에는
한가한 뱃노래가 멀리 잦으며
날 저물고 안개는 깊이 덮여서
흩어지는 물꽃뿐 아득합니다

이윽고 밤 어두운 물새가 울면
물결조차 하나둘 배는 떠나서
저 멀리 한바다로 아주 바다로
마치 가랑잎같이 떠나갑니다</textarea>

        <label for="baseStyle">일관된 아트 스타일 및 카메라 기본 설정 (Global Prompt)</label>
        <input type="text" id="baseStyle" value="masterpiece, best quality, ultra-detailed, cinematic lighting, moody atmosphere, slow motion, highly detailed textures, smooth camera movement">
        
        <div class="button-group">
            <button id="generateBtn" onclick="generatePrompts()">🚀 프롬프트 생성</button>
            <button class="secondary-btn" onclick="copySystemPrompt()">📋 수동용 지시문 복사</button>
        </div>
        <div id="loading">⏳ 분석 중입니다... (잠시만 기다려주세요)</div>
    </div>

    <div class="panel" id="resultPanel" style="display: none;">
        <h2>🎞️ 생성된 씬 시퀀스 (5초 단위)</h2>
        <div id="sceneList" class="scene-list"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. UI 토글 및 헬퍼 함수
    // ==========================================
    function toggleApiInfo() {
        const provider = document.getElementById('apiProvider').value;
        const label = document.getElementById('apiKeyLabel');
        const note = document.getElementById('deepseekNote');
        const keyArea = document.getElementById('apiKeyArea');
        const hint = document.getElementById('modeHint');

        if (provider === 'offline') {
            keyArea.style.display = 'none';
            note.style.display = 'none';
            hint.innerHTML = '✅ 현재 <strong>오프라인 분석</strong> 모드입니다. 시의 키워드를 분석하여 자동으로 프롬프트를 생성합니다. API 키가 필요 없습니다.';
            hint.style.borderLeftColor = '#4CAF50';
        } else if (provider === 'gemini') {
            keyArea.style.display = 'block';
            label.innerText = 'Google Gemini API Key';
            note.style.display = 'none';
            hint.innerHTML = '🔑 <strong>Gemini API</strong> 모드입니다. 정확한 분석을 위해 AI가 시를 해석합니다. API 키가 필요합니다.';
            hint.style.borderLeftColor = '#3b82f6';
        } else {
            keyArea.style.display = 'block';
            label.innerText = 'DeepSeek API Key';
            note.style.display = 'block';
            hint.innerHTML = '🔑 <strong>DeepSeek API</strong> 모드입니다. 뛰어난 추론 능력으로 분석하지만, 브라우저 CORS 제한이 있을 수 있습니다.';
            hint.style.borderLeftColor = '#f97316';
        }
    }

    function copySystemPrompt() {
        const story = document.getElementById('storyInput').value;
        const style = document.getElementById('baseStyle').value;
        const manualPrompt = `다음 한국어 시/스토리를 분석하여 비디오 AI 생성용(Minimax H3) 5초 단위 영문 프롬프트 시퀀스로 나누어주세요.

[조건]
1. 각 씬은 5초 단위 클립.
2. 모든 프롬프트 끝에 다음 스타일 포함: ", ${style}"
3. 피사체, 조명, 환경, 카메라 움직임 구체적으로 서술.
4. 출력은 JSON 배열: [{"time": "0s-5s", "korean_text": "...", "prompt": "..."}]

[원문]
${story}`;
        navigator.clipboard.writeText(manualPrompt).then(() => alert('클립보드에 복사되었습니다. (수동으로 API에 붙여넣기 하세요)'));
    }

    function copyPrompt(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector(`#${elementId}`).nextElementSibling;
            const original = btn.innerText;
            btn.innerText = '✅ 복사됨!';
            btn.style.backgroundColor = '#45a049';
            setTimeout(() => { btn.innerText = original; btn.style.backgroundColor = ''; }, 1500);
        });
    }

    // ==========================================
    // 2. 오프라인 분석 엔진 (키워드 기반)
    // ==========================================
    function offlineAnalyze(story, style) {
        // 연(문단) 단위로 분할 (빈 줄 기준)
        const stanzas = story.split(/\n\s*\n/).filter(s => s.trim().length > 0);
        if (stanzas.length === 0) {
            // 빈 줄이 없으면 라인 단위로 분할
            const lines = story.split('\n').filter(s => s.trim().length > 0);
            if (lines.length === 0) return [];
            // 4줄씩 묶어서 연으로 처리
            for (let i = 0; i < lines.length; i += 4) {
                stanzas.push(lines.slice(i, i + 4).join('\n'));
            }
        }

        // 키워드 -> 시각적 묘사 매핑
        const keywordMap = {
            '산': 'towering mountain peaks, rugged rocky terrain, misty valleys, ancient pine trees silhouetted against the sky',
            '바다': 'vast open ocean, deep blue rolling waves, infinite horizon, dramatic sea cliffs, sparkling water surface',
            '배': 'traditional wooden boat, gently drifting on the water, warm lantern light reflecting on the hull, creaking ropes',
            '물새': 'solitary dark water bird, sleek silhouette, long neck, floating motionless on the glassy surface, echoing cry',
            '밤': 'deep dark night sky, moonless, starry canopy, deep shadows, mysterious twilight glow',
            '안개': 'thick rolling fog, mysterious atmosphere, obscured distant shapes, soft diffused light, ethereal mist',
            '물결': 'gentle ripples, soft waves lapping against the shore, fluid continuous motion, shimmering reflections',
            '노래': 'distant melody, haunting vocal harmony, echoing across the water, emotional resonance',
            '마을': 'quaint coastal village, warm glowing windows, clustered houses, peaceful harbor',
            '하늘': 'expansive sky, soft clouds drifting, celestial gradient from deep blue to warm twilight',
            '꿈': 'dreamlike quality, surreal atmosphere, soft focus, floating ethereal imagery',
            '가랑잎': 'dry fallen leaf, drifting on the water, fragile and solitary, spinning slowly in the current'
        };

        // 카메라 움직임 풀
        const cameraMoves = [
            'The camera slowly pushes in with small amplitude toward the main subject.',
            'The camera pans left with medium amplitude at slow speed, revealing the expansive landscape.',
            'The camera trucks right smoothly, following the movement of the subject.',
            'A slow tracking shot follows the subject as it drifts across the frame.',
            'The camera pulls out with large amplitude at slow speed, emphasizing the vastness of the scene.',
            'The camera holds a static wide shot, allowing the atmosphere to settle.',
            'The camera tilts up slowly, revealing the sky and distant horizon.',
            'The camera arcs around the subject, capturing it from multiple angles.'
        ];

        const scenes = [];
        let currentTime = 0;
        const duration = 5; // 5초 단위

        stanzas.forEach((stanza, idx) => {
            const lines = stanza.split('\n').filter(l => l.trim().length > 0);
            const combined = lines.join(' ');
            
            // 키워드 추출 및 시각화
            let visualDesc = [];
            let foundKeywords = [];
            for (const [keyword, desc] of Object.entries(keywordMap)) {
                if (combined.includes(keyword)) {
                    visualDesc.push(desc);
                    foundKeywords.push(keyword);
                }
            }

            // 키워드가 하나도 없으면 일반적인 분위기 설명
            if (visualDesc.length === 0) {
                visualDesc.push('a serene and melancholic natural landscape, quiet and introspective atmosphere, soft muted colors');
            }

            // 카메라 움직임 선택 (순환)
            const cam = cameraMoves[idx % cameraMoves.length];

            // 분위기 추론 (키워드 기반)
            let mood = 'melancholic, serene, poetic, reflective';
            if (foundKeywords.some(k => ['밤', '어두운', '안개'].includes(k))) mood = 'dark, mysterious, atmospheric, hauntingly beautiful';
            if (foundKeywords.some(k => ['배', '물결', '바다'].includes(k))) mood = 'fluid, drifting, boundless, contemplative';
            if (foundKeywords.some(k => ['산', '하늘'].includes(k))) mood = 'epic, vast, majestic, awe-inspiring';

            // 시간 포맷
            const startTime = currentTime;
            const endTime = currentTime + duration;
            const timeStr = `${startTime}s - ${endTime}s`;
            currentTime += duration;

            // 프롬프트 조합 (영문)
            const visualText = visualDesc.slice(0, 2).join('. ') + '.';
            const prompt = `[Shot ${idx+1}] A cinematic, live-action shot. ${visualText} ${cam} The scene embodies a ${mood} mood. Soft, diffused lighting enhances the texture of the environment. ${style}`;

            scenes.push({
                time: timeStr,
                korean_text: combined.length > 50 ? combined.substring(0, 50) + '...' : combined,
                prompt: prompt
            });
        });

        return scenes;
    }

    // ==========================================
    // 3. 메인 생성 함수 (API + 오프라인)
    // ==========================================
    async function generatePrompts() {
        const provider = document.getElementById('apiProvider').value;
        const apiKey = document.getElementById('apiKey').value;
        const story = document.getElementById('storyInput').value;
        const style = document.getElementById('baseStyle').value;
        const btn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultPanel = document.getElementById('resultPanel');
        const sceneList = document.getElementById('sceneList');

        if (!story.trim()) {
            alert('원문 텍스트를 입력해주세요.');
            return;
        }

        btn.disabled = true;
        loading.style.display = 'block';
        resultPanel.style.display = 'none';
        sceneList.innerHTML = '';

        try {
            let scenes = [];

            // ========== 오프라인 모드 ==========
            if (provider === 'offline') {
                await new Promise(resolve => setTimeout(resolve, 500)); // 약간의 딜레이 (UX)
                scenes = offlineAnalyze(story, style);
                if (scenes.length === 0) throw new Error('오프라인 분석 실패: 텍스트를 인식할 수 없습니다.');
            }

            // ========== Gemini API ==========
            else if (provider === 'gemini') {
                if (!apiKey) throw new Error('Gemini API 키를 입력해주세요.');

                const systemInstruction = `You are an expert video prompt engineer for Minimax H3.
Follow the VIDEO_PROMPT_WRITING_GUIDE strictly.
Break down the Korean poem into 5-second video scenes.
Each prompt must be in English, highly descriptive (visuals, camera movement, lighting, mood).
Append this exact style to EVERY prompt: ", ${style}".
Return ONLY a valid JSON array: [{"time": "0s-5s", "korean_text": "...", "prompt": "..."}]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemInstruction + "\n\n[Poem]\n" + story }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`HTTP ${response.status}: ${err}`);
                }

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                const raw = data.candidates[0].content.parts[0].text;
                scenes = JSON.parse(raw);
                if (!Array.isArray(scenes)) throw new Error('응답이 배열이 아닙니다.');
            }

            // ========== DeepSeek API ==========
            else if (provider === 'deepseek') {
                if (!apiKey) throw new Error('DeepSeek API 키를 입력해주세요.');

                const systemInstruction = `You are an expert video prompt engineer for Minimax H3.
Follow the VIDEO_PROMPT_WRITING_GUIDE strictly.
Break down the Korean poem into 5-second video scenes.
Each prompt must be in English, highly descriptive (visuals, camera movement, lighting, mood).
Append this exact style to EVERY prompt: ", ${style}".
Return ONLY a valid JSON array: [{"time": "0s-5s", "korean_text": "...", "prompt": "..."}]`;

                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: "[Poem]\n" + story }
                        ],
                        response_format: { type: "json_object" }
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`HTTP ${response.status}: ${err}`);
                }

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let temp = data.choices[0].message.content;
                temp = temp.replace(/```json/g, '').replace(/```/g, '').trim();
                let parsed = JSON.parse(temp);
                
                if (!Array.isArray(parsed) && typeof parsed === 'object') {
                    const keys = Object.keys(parsed);
                    if (keys.length > 0 && Array.isArray(parsed[keys[0]])) {
                        parsed = parsed[keys[0]];
                    } else {
                        parsed = [parsed];
                    }
                }
                scenes = parsed;
                if (!Array.isArray(scenes)) throw new Error('응답이 배열이 아닙니다.');
            }

            // ========== 결과 렌더링 ==========
            if (!scenes || scenes.length === 0) throw new Error('생성된 씬이 없습니다.');

            scenes.forEach((scene, index) => {
                const card = document.createElement('div');
                card.className = 'scene-card';
                
                // 프롬프트 내부의 ${style} 치환 (혹시 남아있을 경우)
                let finalPrompt = scene.prompt;
                finalPrompt = finalPrompt.replace(/\$\{style\}/g, style);
                
                card.innerHTML = `
                    <div class="scene-header">
                        <span class="scene-time">🎬 Scene ${index + 1} [${scene.time}]</span>
                    </div>
                    <div class="scene-source">📝 "${scene.korean_text}"</div>
                    <div class="scene-prompt" id="prompt-${index}">${finalPrompt}</div>
                    <button class="copy-btn" onclick="copyPrompt('prompt-${index}')">📋 프롬프트 복사</button>
                `;
                sceneList.appendChild(card);
            });

            resultPanel.style.display = 'block';

        } catch (error) {
            alert('❌ 오류 발생:\n\n' + error.message + '\n\n💡 오프라인 모드로 전환하거나, 텍스트를 확인해보세요.');
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }

    // 페이지 로드 시 초기화
    window.onload = function() {
        toggleApiInfo();
    };
</script>

</body>
</html>
