<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📐 글 분석 기반 블렌더 설계도 생성기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f1219;
            color: #e8edf5;
            font-family: 'Segoe UI', 'Nanum Gothic', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* 헤더 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b27a, #7fb3d5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #8b98aa;
            margin-top: 8px;
            font-size: 1.05rem;
        }
        .badge {
            background: #1e2632;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #b0c4de;
            border: 1px solid #364153;
            display: inline-block;
            margin-top: 5px;
        }

        /* 입력창 */
        .input-box {
            background: #181f2b;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #2a3442;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%;
            height: 180px;
            background: #0b0f16;
            border: 1px solid #2f3b4b;
            border-radius: 14px;
            color: #e8edf5;
            font-size: 1rem;
            padding: 18px;
            resize: vertical;
            line-height: 1.8;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #7fb3d5;
            box-shadow: 0 0 0 3px rgba(127, 179, 213, 0.2);
        }
        .btn-area {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 34px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            background: #2a3442;
            color: #c8d0dc;
            border: 1px solid #3f4c5e;
        }
        .btn-primary {
            background: #2a4d6e;
            border-color: #4a7a9c;
            color: white;
        }
        .btn-primary:hover {
            background: #3a6a8e;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(74, 122, 156, 0.3);
        }
        .btn-secondary {
            background: #2a2220;
            border-color: #6b4a3c;
            color: #f0b27a;
        }
        .btn-secondary:hover {
            background: #3d2d28;
        }

        /* 분석 결과 (설계도) */
        #blueprintOutput {
            background: #181f2b;
            border-radius: 20px;
            padding: 30px 30px 40px;
            border: 1px solid #2a3442;
            min-height: 200px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .placeholder {
            text-align: center;
            color: #4d5b6e;
            padding: 50px 0;
            font-size: 1.1rem;
        }
        .placeholder span {
            display: block;
            font-size: 3rem;
            margin-bottom: 15px;
        }

        /* 설계도 스타일 (결과물) */
        .blueprint {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .blueprint .section {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #26303e;
        }
        .blueprint .section:last-child {
            border-bottom: none;
        }
        .blueprint h3 {
            font-size: 1.4rem;
            color: #f0b27a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .blueprint h4 {
            font-size: 1.05rem;
            color: #7fb3d5;
            margin: 16px 0 8px;
        }
        .blueprint p, .blueprint li {
            color: #c8d2df;
            line-height: 1.8;
            font-size: 1rem;
        }
        .blueprint ul {
            list-style: none;
            padding-left: 8px;
        }
        .blueprint ul li::before {
            content: "▸ ";
            color: #f0b27a;
            font-weight: bold;
        }
        .keyword-tag {
            display: inline-block;
            background: #1e2a3a;
            padding: 4px 16px;
            border-radius: 30px;
            margin: 4px 8px 4px 0;
            border: 1px solid #3f5066;
            color: #e8edf5;
            font-weight: 500;
        }
        .highlight-box {
            background: #0e141e;
            border-left: 4px solid #f0b27a;
            padding: 16px 22px;
            border-radius: 8px;
            margin: 12px 0;
        }
        .color-swatch {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid #4a5b6e;
            margin-right: 8px;
            vertical-align: middle;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #4a5b6e;
            font-size: 0.9rem;
            border-top: 1px solid #1e2632;
            padding-top: 25px;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .blueprint h3 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 헤더 -->
    <div class="header">
        <h1>🧠 글 분석 → 블렌더 설계도</h1>
        <p>시/소설을 입력하면 핵심 키워드와 분위기를 분석하여 <strong>블렌더 제작을 위한 맞춤형 가이드</strong>를 생성합니다.</p>
        <span class="badge">✦ 블렌더 코드 제외 · 순수 작업 설계 명세서 ✦</span>
    </div>

    <!-- 입력 -->
    <div class="input-box">
        <textarea id="textInput" placeholder="분석할 시나 소설을 붙여넣으세요...">푸른 하늘 아래 펼쳐진 광야,
바람이 불어오고 나무가 흔들린다.
저 멀리 산이 보이고 호수가 반짝인다.
바람은 다시 불고, 나무는 다시 흔들린다.
광야는 영원히 푸르다.</textarea>
        <div class="btn-area">
            <button class="btn btn-primary" onclick="generateBlueprint()">🎨 블렌더 설계도 생성</button>
            <button class="btn btn-secondary" onclick="clearOutput()">🗑️ 초기화</button>
        </div>
    </div>

    <!-- 출력 -->
    <div id="blueprintOutput">
        <div class="placeholder" id="defaultPlaceholder">
            <span>📄</span>
            텍스트를 입력하고 <strong>'블렌더 설계도 생성'</strong>을 누르세요.<br>
            분석된 키워드, 추천 카메라 앵글, 조명, 재질 가이드가 생성됩니다.
        </div>
    </div>

    <div class="footer">
        ⚡ 분석 로직: TF-IDF 유사 빈도 분석 + 감성/공간 어휘 분류 · 블렌더 3.6+ 작업 환경 권장
    </div>
</div>

<script>
    // ============================================================
    // 1. 한글 불용어(Stopwords) 및 감정/공간 사전
    // ============================================================
    const STOPWORDS = new Set([
        '은', '는', '이', '가', '을', '를', '에', '의', '로', '으로', '와', '과', '도', '만',
        '에서', '에게', '한테', '께', '부터', '까지', '조차', '마저', '나', '내', '너', '네',
        '저', '제', '그', '그녀', '그들', '우리', '당신', '것', '거', '게', '수', '등', '등등',
        '있다', '없다', '하다', '되다', '지다', '보다', '같다', '아니다', '때', '곳', '데'
    ]);

    // 감정 단어 사전 (가중치)
    const WARM_WORDS = ['푸르', '따뜻', '봄', '꽃', '해', '태양', '빛', '반짝', '사랑', '기쁨', '평화', '포근', '화창', '눈부시', '아름답'];
    const COOL_WORDS = ['차갑', '겨울', '밤', '달', '어둠', '그늘', '눈물', '슬픔', '고독', '쓸쓸', '냉', '암', '회색', '우울', '고요'];

    const LANDSCAPE_WORDS = ['하늘', '땅', '산', '바다', '광야', '강', '호수', '숲', '들판', '계곡', '평원', '구름', '바람'];
    const INDOOR_WORDS = ['방', '창문', '거울', '책상', '탁자', '집', '지붕', '벽', '바닥', '의자', '침대', '문'];

    // ============================================================
    // 2. 핵심 분석 엔진
    // ============================================================
    function analyzeText(text) {
        // 1) 토큰화 (한글/영문/숫자만)
        const tokens = text.match(/[가-힣a-zA-Z0-9]+/g) || [];
        const filtered = tokens.map(t => t.toLowerCase()).filter(t => t.length > 1 && !STOPWORDS.has(t));

        // 2) 빈도수 계산
        const freqMap = {};
        for (const token of filtered) {
            freqMap[token] = (freqMap[token] || 0) + 1;
        }
        // 상위 7개 키워드
        const sorted = Object.entries(freqMap).sort((a, b) => b[1] - a[1]);
        const topKeywords = sorted.slice(0, 7).map(item => item[0]);

        // 3) 감정 분석 (Warm / Cool 점수)
        let warmScore = 0, coolScore = 0;
        let landScore = 0, indoorScore = 0;
        for (const token of filtered) {
            if (WARM_WORDS.some(w => token.includes(w) || w.includes(token))) warmScore++;
            if (COOL_WORDS.some(w => token.includes(w) || w.includes(token))) coolScore++;
            if (LANDSCAPE_WORDS.some(w => token.includes(w) || w.includes(token))) landScore++;
            if (INDOOR_WORDS.some(w => token.includes(w) || w.includes(token))) indoorScore++;
        }

        // 4) 분위기 결정
        let mood = 'neutral';
        if (warmScore > coolScore * 1.2) mood = 'warm';
        else if (coolScore > warmScore * 1.2) mood = 'cool';
        else mood = 'balanced';

        // 5) 공간 스케일 결정 (광활 vs 밀실)
        let scale = 'medium';
        if (landScore > indoorScore * 1.5) scale = 'vast'; // 광활
        else if (indoorScore > landScore * 1.5) scale = 'intimate'; // 밀실/클로즈업
        else scale = 'medium';

        return {
            keywords: topKeywords,
            freqMap: freqMap,
            mood: mood,
            scale: scale,
            warmScore,
            coolScore,
            landScore,
            indoorScore,
            totalTokens: filtered.length
        };
    }

    // ============================================================
    // 3. 블렌더 설계도 (텍스트) 생성기
    // ============================================================
    function generateBlueprintText(analysis, rawText) {
        const { keywords, mood, scale, warmScore, coolScore, landScore, indoorScore } = analysis;
        const kws = keywords.length > 0 ? keywords : ['(분석된 핵심어가 없습니다)'];

        // --- 카메라 앵글 ---
        let cameraGuide = '';
        if (scale === 'vast') {
            cameraGuide = `🌄 **광활한 스케일 (Wide Shot)**  
            - 카메라: **광각 렌즈 (FOV 60~75°)** 사용.  
            - 앵글: **로우 앵글(Low Angle)** 또는 **버즈 아이 뷰(Bird's-eye)**를 추천하여 광야/하늘의 웅장함을 강조하세요.  
            - 움직임: **느린 달리(Dolly)** 또는 **크레인 업/다운**으로 공간의 깊이를 보여줍니다.`;
        } else if (scale === 'intimate') {
            cameraGuide = `🕯️ **밀실/클로즈업 (Intimate Shot)**  
            - 카메라: **표준~망원 렌즈 (FOV 30~45°)** 사용.  
            - 앵글: **아이 레벨(Eye-level)** 또는 **탑 샷(Top shot)**으로 피사체에 집중.  
            - 움직임: **극히 느린 팬(Pan)** 또는 **고정 샷**으로 정적인 감정을 표현하세요.`;
        } else {
            cameraGuide = `🌿 **중간 스케일 (Medium Shot)**  
            - 카메라: **표준 렌즈 (FOV 45~55°)** 사용.  
            - 앵글: **아이 레벨**과 **로우 앵글**을 혼합하여 자연스러운 시선을 유도.  
            - 움직임: **부드러운 트래킹** 또는 **원형 궤도(Orbit)**로 입체감을 줍니다.`;
        }

        // --- 조명 및 색감 ---
        let colorGuide = '';
        let primaryColor = '', secondaryColor = '', accentColor = '';
        if (mood === 'warm') {
            primaryColor = '#FF9F43 (따뜻한 오렌지)';
            secondaryColor = '#FECA57 (선명한 노랑)';
            accentColor = '#EE5A24 (강한 적색 액센트)';
            colorGuide = `☀️ **따뜻한 톤 (Warm Tone)**  
            - **Key Light**: 오렌지/골드 계열 (색온도 3200K)로 주조명 설정.  
            - **Fill Light**: 부드러운 노랑 또는 아이보리로 그림자 완화.  
            - **Rim Light**: 붉은 톤으로 실루엣 강조.  
            - 배경은 크림색 또는 연한 주황 그라데이션을 추천합니다.`;
        } else if (mood === 'cool') {
            primaryColor = '#54A0FF (차가운 블루)';
            secondaryColor = '#5F27CD (딥 바이올렛)';
            accentColor = '#01CBC6 (청록 액센트)';
            colorGuide = `🌙 **차가운 톤 (Cool Tone)**  
            - **Key Light**: 블루/시안 계열 (색온도 7000K)로 신비롭고 쓸쓸한 분위기 연출.  
            - **Fill Light**: 퍼플 또는 딥 블루로 깊이감 추가.  
            - **Rim Light**: 화이트 또는 라벤더로 오브젝트 경계선을 또렷하게.  
            - 배경은 다크 네이비 또는 그라데이션 블루를 추천합니다.`;
        } else {
            primaryColor = '#A29BFE (라벤더) & #FDCB6E (머스타드)';
            secondaryColor = '#74B9FF (스카이 블루)';
            accentColor = '#FF7675 (핑크 레드)';
            colorGuide = `⚖️ **밸런스드 톤 (Balanced / Teal & Orange)**  
            - **Key Light**: 중성 백색광 (5500K)에 약간의 오렌지 필터.  
            - **Fill Light**: 시안 블루로 대비(Contrast)를 극대화.  
            - **Rim Light**: 퍼플 또는 핑크로 감각적인 분위기 추가.  
            - 영화 '블레이드 러너 2049' 스타일의 그레이딩을 참고하세요.`;
        }

        // --- 쉐이더/재질 가이드 ---
        let shaderGuide = `🔧 **추천 재질 (Shader)**  
        - 핵심 오브젝트 (${kws.slice(0,3).join(', ')}): **거칠기(Roughness) 0.2~0.4**로 부드러운 광택을 주거나, **Emission**을 0.1~0.3 정도로 미세하게 발광시켜 몽환감을 연출하세요.  
        - 배경 요소: **Roughness 0.7~0.9**의 매트한 질감으로 심플하게 처리하여 핵심 오브젝트에 집중시키는 것이 좋습니다.  
        - 특수 효과: 물/호수 요소가 있다면 **Transmission 0.8~1.0**과 **IOR 1.33**을 설정하여 사실적인 굴절을 구현하세요.`;

        // --- 애니메이션/모션 ---
        let motionGuide = `🎬 **추천 애니메이션 (Motion)**  
        - 전체적인 템포: ${mood === 'warm' ? '밝고 경쾌한 0.5~1초 사이클' : mood === 'cool' ? '느리고 몽환적인 2~3초 사이클' : '중간 템포의 1~1.5초 사이클'}로 설정.  
        - 오브젝트 움직임: 핵심 키워드 ${kws[0] || '오브젝트'}는 **상하 부유(Floating)** 또는 **자전(Slow Spin)** 애니메이션을 적용하여 생동감을 줍니다.  
        - 카메라: 위에서 추천한 카메라 움직임에 **사인파(Sine wave)** 기반의 미세한 떨림(Handheld Shake)을 추가하면 더욱 영화적인 느낌이 납니다.`;

        // --- 핵심 오브젝트 리스트 ---
        const objectList = kws.map(kw => `   - **${kw}**: 블렌더 기본 오브젝트(구/원통/평면)에 Subdivision 적용 후, 감정에 따라 왜곡(Displace) 추가.`).join('\n');

        // 최종 설계도 조립
        return `
        <div class="blueprint">
            <div class="section">
                <h3>📊 1. 텍스트 분석 요약</h3>
                <p><strong>▶ 핵심 키워드 (Top ${keywords.length})</strong><br>
                ${keywords.map(k => `<span class="keyword-tag">#${k}</span>`).join(' ')}</p>
                <p><strong>▶ 감정 분위기:</strong> ${mood === 'warm' ? '☀️ 따뜻함' : mood === 'cool' ? '🌙 차가움' : '⚖️ 중립/밸런스'} 
                (따뜻함 ${warmScore}점, 차가움 ${coolScore}점)</p>
                <p><strong>▶ 공간 스케일:</strong> ${scale === 'vast' ? '🏞️ 광활(자연/야외)' : scale === 'intimate' ? '🛋️ 밀실(실내/클로즈업)' : '🌳 중간(혼합)'} 
                (자연어휘 ${landScore}개, 실내어휘 ${indoorScore}개)</p>
            </div>

            <div class="section">
                <h3>🎨 2. 블렌더 비주얼 설계 (Visual Guide)</h3>
                
                <h4>① 카메라 & 앵글</h4>
                <div class="highlight-box">${cameraGuide.replace(/\n/g, '<br>')}</div>

                <h4>② 조명 & 색감 팔레트</h4>
                <div class="highlight-box">
                    <span class="color-swatch" style="background:${primaryColor.split('(')[0].trim() || '#FF9F43'}"></span> 메인: ${primaryColor}<br>
                    <span class="color-swatch" style="background:${secondaryColor.split('(')[0].trim() || '#FECA57'}"></span> 서브: ${secondaryColor}<br>
                    <span class="color-swatch" style="background:${accentColor.split('(')[0].trim() || '#EE5A24'}"></span> 액센트: ${accentColor}
                    <br><br>${colorGuide.replace(/\n/g, '<br>')}
                </div>
            </div>

            <div class="section">
                <h3>🧊 3. 오브젝트 & 재질 구성 (Asset List)</h3>
                <p><strong>▶ 필수 제작 오브젝트</strong></p>
                <ul>
                    ${objectList}
                </ul>
                <br>
                ${shaderGuide.replace(/\n/g, '<br>')}
            </div>

            <div class="section">
                <h3>🎞️ 4. 애니메이션 & 카메라 워크</h3>
                ${motionGuide.replace(/\n/g, '<br>')}
            </div>

            <div class="section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                <h3>📌 5. 총평 (Director's Note)</h3>
                <div class="highlight-box" style="border-left-color: #7fb3d5;">
                    <p style="font-style: italic;">
                    "${rawText.slice(0, 30)}..." 이 텍스트는 <strong>${keywords.slice(0,3).join(', ')}</strong>을(를) 중심으로 전개됩니다. 
                    ${scale === 'vast' ? '드넓은 공간감을 활용한 롱테이크(Long Take)' : scale === 'intimate' ? '미세한 떨림과 클로즈업을 통한 심리적 묘사' : '공간과 밀실을 오가는 다이내믹한 연출'}가 어울립니다. 
                    위 설계도를 기반으로 블렌더에서 씬을 구성하시면, 텍스트가 가진 고유한 분위기를 3D로 완벽하게 살릴 수 있습니다.
                    </p>
                </div>
            </div>
        </div>
        `;
    }

    // ============================================================
    // 4. UI 실행 함수
    // ============================================================
    function generateBlueprint() {
        const input = document.getElementById('textInput').value;
        if (!input.trim()) {
            alert('분석할 텍스트를 입력해주세요.');
            return;
        }

        const analysis = analyzeText(input);
        const html = generateBlueprintText(analysis, input);

        const output = document.getElementById('blueprintOutput');
        output.innerHTML = html;
    }

    function clearOutput() {
        document.getElementById('blueprintOutput').innerHTML = `
            <div class="placeholder" id="defaultPlaceholder">
                <span>📄</span>
                텍스트를 입력하고 <strong>'블렌더 설계도 생성'</strong>을 누르세요.<br>
                분석된 키워드, 추천 카메라 앵글, 조명, 재질 가이드가 생성됩니다.
            </div>
        `;
    }

    // 페이지 로드시 샘플 자동 실행
    window.onload = function() {
        generateBlueprint();
    };
</script>
</body>
</html>
