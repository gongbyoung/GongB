<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>텍스트 → 3D 씬 생성 (Three.js)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #controls { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; color: white; z-index: 10; }
        textarea { width: 300px; height: 100px; display: block; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="controls">
        <h3>시/소설 입력</h3>
        <textarea id="textInput">푸른 하늘 아래 광야, 나무와 산, 호수가 반짝인다.</textarea>
        <button id="generateBtn">씬 생성</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        // ----- 씬 설정 -----
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 기본 조명
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffaa88, 0.5);
        backLight.position.set(-5, 0, 5);
        scene.add(backLight);

        // 바닥
        const floorGeom = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI/2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // 키워드-오브젝트 맵 (생성 함수)
        function createTree(pos) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.5), trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            group.add(trunk);
            const crownMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const crown = new THREE.Mesh(new THREE.SphereGeometry(0.8), crownMat);
            crown.position.y = 1.8;
            crown.castShadow = true;
            group.add(crown);
            group.position.copy(pos);
            scene.add(group);
            return group;
        }

        function createMountain(pos) {
            const mat = new THREE.MeshStandardMaterial({ color: 0x7F8C8D });
            const mesh = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.5, 8), mat);
            mesh.position.copy(pos);
            mesh.position.y = 1.25;
            mesh.castShadow = true;
            scene.add(mesh);
            return mesh;
        }

        function createWater(pos) {
            const mat = new THREE.MeshStandardMaterial({
                color: 0x2980B9,
                transparent: true,
                opacity: 0.6,
                roughness: 0.1,
                metalness: 0.3
            });
            const mesh = new THREE.Mesh(new THREE.CircleGeometry(1.5, 16), mat);
            mesh.position.copy(pos);
            mesh.position.y = -0.4;
            mesh.rotation.x = -Math.PI/2;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        const keywordMap = {
            '나무': createTree, 'tree': createTree,
            '산': createMountain, 'mountain': createMountain,
            '물': createWater, 'water': createWater, '호수': createWater, 'lake': createWater
        };

        // ----- 씬 생성 함수 -----
        function generateScene(text) {
            // 기존 오브젝트 제거 (바닥과 조명은 유지)
            const toRemove = [];
            scene.children.forEach(child => {
                if (child.type === 'Group' || child.type === 'Mesh') {
                    if (child !== floor) {
                        toRemove.push(child);
                    }
                }
            });
            toRemove.forEach(child => scene.remove(child));

            // 텍스트 토큰화
            const words = text.toLowerCase().replace(/[^가-힣a-z\s]/g, '').split(/\s+/);
            const found = words.filter(w => keywordMap[w] !== undefined);
            // 중복 제거 (원하면 제거)
            const unique = [...new Set(found)];

            // 배치 위치 (그리드)
            const positions = [
                new THREE.Vector3(-2, 0, 0),
                new THREE.Vector3(2, 0, 0),
                new THREE.Vector3(0, 0, -2),
                new THREE.Vector3(0, 0, 2),
                new THREE.Vector3(-3, 0, -3),
                new THREE.Vector3(3, 0, 3)
            ];
            // 감정 분석 (단순)
            let sentiment = 0;
            const posWords = ['푸른','반짝','아름','행복','평화','밝은'];
            const negWords = ['어둠','슬픔','고통','절망','우울'];
            words.forEach(w => {
                if (posWords.includes(w)) sentiment++;
                if (negWords.includes(w)) sentiment--;
            });
            // 조명 색상 변경
            if (sentiment >= 0) {
                dirLight.color.setHex(0xffdd99);
                ambientLight.color.setHex(0x406080);
            } else {
                dirLight.color.setHex(0x88aaff);
                ambientLight.color.setHex(0x334466);
            }

            // 오브젝트 생성
            const count = Math.min(unique.length, positions.length);
            for (let i = 0; i < count; i++) {
                const kw = unique[i];
                const func = keywordMap[kw];
                if (func) {
                    func(positions[i]);
                }
            }

            // 애니메이션: 간단히 회전 (requestAnimationFrame에서 처리)
        }

        // UI 버튼 이벤트
        document.getElementById('generateBtn').addEventListener('click', () => {
            const text = document.getElementById('textInput').value;
            generateScene(text);
        });

        // 초기 생성
        generateScene(document.getElementById('textInput').value);

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            // 오브젝트들이 살짝 떠오르거나 회전 (뮤직비디오 느낌)
            scene.children.forEach(child => {
                if (child.isGroup) {
                    child.rotation.y += 0.005;
                } else if (child.isMesh && child !== floor) {
                    // 물결 애니메이션 (선택)
                }
            });
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 창 크기 조정
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
