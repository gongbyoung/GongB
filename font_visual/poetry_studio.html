<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>획 단위 먹물 농담 002</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.92);
      --border-color: #2a303f;
      --accent-color: #6366f1;
      --save-btn: #38bdf8;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

    header h1 {
      font-size: 1.25rem; font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .main-container {
      display: flex; flex: 1; gap: 24px; padding: 24px; max-width: 1600px; width: 100%; margin: 0 auto;
    }

    .control-panel {
      width: 440px; flex-shrink: 0; background: var(--panel-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto;
    }

    .section-title {
      font-size: 0.92rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; }
    .value-badge { color: var(--accent-color); font-weight: 700; }

    input[type="text"], input[type="number"], input[type="file"], textarea, select {
      width: 100%; background: #090a0f; border: 1px solid var(--border-color); border-radius: 8px;
      padding: 8px 12px; color: #fff; font-size: 0.875rem; outline: none;
    }

    .num-direct {
      width: 75px !important; background: #090a0f; color: #38bdf8 !important;
      border: 1px solid var(--accent-color) !important; text-align: center;
      font-weight: bold; padding: 4px 6px !important;
    }

    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    .range-group { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent-color); height: 4px; cursor: pointer; }
    
    input[type="color"] { -webkit-appearance: none; border: 1px solid var(--border-color); width: 100%; height: 36px; border-radius: 8px; cursor: pointer; background: #090a0f; }

    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }

    .btn {
      width: 100%; padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 0.95rem;
      border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-save { background: var(--save-btn); color: #0f172a; }
    .btn-start { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }

    #progressBox {
      display: none; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981;
      padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; font-weight: bold;
    }

    .preview-area {
      flex: 1; display: flex; align-items: center; justify-content: center; background: var(--panel-bg);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; position: relative;
    }

    .canvas-wrapper {
      position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border-radius: 8px; overflow: hidden;
      max-width: 100%; max-height: calc(100vh - 160px); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    }

    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>🖌️ 획(Stroke) 단위 정밀 먹물 농담 스튜디오</h1>
    <div style="font-size:0.85rem; color:var(--text-muted);">클리핑 마스크 기반 획 내부 투명도 셰이더</div>
  </header>

  <div class="main-container">
    <div class="control-panel">
      
      <!-- 1. 시 구절 입력 -->
      <div class="form-group">
        <label style="color:#a5b4fc; font-weight:bold;">📜 시 구절 (Text)</label>
        <textarea id="poemInput">얼굴 하나 야위어 가오.
달이 차오르는 밤이면
호수 같은 마음이 흔들리옵니다.</textarea>
      </div>

      <!-- 2. 배경 설정 -->
      <div class="section-title">🖼️ 배경 및 로컬 파일</div>
      <div class="form-group">
        <label>로컬 배경 이미지 로드 (선택)</label>
        <input type="file" id="bgFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>로컬 폰트 선택 (.ttf, .otf)</label>
        <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2">
      </div>

      <!-- 3. 획 단위 농담 제어 UI -->
      <div class="section-title">🖌️ 획(Stroke) 농담 & 번짐 제어</div>
      
      <div class="form-row">
        <div class="form-group">
          <label>획 테두리 굵기/선명도 <span id="strokeVal" class="value-badge">3px</span></label>
          <input type="range" id="strokeWidth" min="1" max="12" step="0.5" value="3.0">
        </div>
        <div class="form-group">
          <label>획 내부 투명도 (중간 연함) <span id="coreVal" class="value-badge">30%</span></label>
          <input type="range" id="strokeCore" min="0" max="100" value="30">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>먹물 번짐 (Spread)</label>
          <input type="range" id="bleed" min="0" max="30" value="8">
        </div>
        <div class="form-group">
          <label>번짐 은은함 (Blur)</label>
          <input type="range" id="blur" min="0" max="15" step="0.5" value="3.0">
        </div>
      </div>

      <!-- 4. 위치 및 스타일 제어 -->
      <div class="section-title">📍 위치 & 스타일 설정</div>
      <div class="form-row">
        <div class="form-group">
          <label>글자 크기 (<span id="sizeVal" class="value-badge">56px</span>)</label>
          <input type="range" id="fontSize" min="20" max="150" value="56">
        </div>
        <div class="form-group">
          <label>폰트 선택</label>
          <select id="fontSelect">
            <option value="'Nanum Myeongjo', serif">나눔명조</option>
            <option value="'Gowun Batang', serif">고운바탕</option>
            <option value="'Noto Sans KR', sans-serif">노토산스</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>가로 위치 (X Shift)</label>
          <input type="range" id="offsetX" min="-400" max="400" value="0">
        </div>
        <div class="form-group">
          <label>세로 위치 (Y Shift)</label>
          <input type="range" id="offsetY" min="-400" max="400" value="0">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>먹물 색상</label>
          <input type="color" id="inkColor" value="#121218">
        </div>
        <div class="form-group">
          <label>한지/배경 색상</label>
          <input type="color" id="bgColor" value="#f3eee6">
        </div>
      </div>

      <!-- 5. 모션 및 시간 제어 -->
      <div class="form-group">
        <label>⏱️ 써지는 시간 (1초 ~ 600초)</label>
        <div class="range-group">
          <input type="range" id="duration" min="1" max="600" value="10">
          <input type="number" id="durationNum" class="num-direct" min="1" max="600" value="10">
          <span style="font-size:0.85rem; color:var(--text-muted);">초</span>
        </div>
      </div>

      <div class="form-group">
        <label>글쓰기 방향</label>
        <select id="textDir">
          <option value="horizontal">가로 쓰기</option>
          <option value="vertical">세로 쓰기 (우→좌)</option>
        </select>
      </div>

      <!-- 액션 버튼 -->
      <div class="btn-group">
        <button class="btn btn-start" id="startBtn">▶️ 먹 번짐 모션 시작 & MP4 녹화</button>
        <button class="btn btn-save" id="saveBtn">💾 완성 시화 PNG 저장</button>
      </div>

      <div id="progressBox">
        ⏳ 획 단위 정밀 렌더링 및 MP4 녹화 중... <span id="progressPercent">0%</span>
      </div>

    </div>

    <!-- 캔버스 실시간 프리뷰 -->
    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // 3단계 오프스크린 캔버스 레이어
    const fillCanvas = document.createElement('canvas'); // 연한 내부 채움용
    const fillCtx = fillCanvas.getContext('2d');
    
    const strokeCanvas = document.createElement('canvas'); // 짙은 테두리용
    const strokeCtx = strokeCanvas.getContext('2d');
    
    const bleedCanvas = document.createElement('canvas'); // 먹물 번짐용
    const bleedCtx = bleedCanvas.getContext('2d');

    let bgImg = null;
    let customFontName = null;

    const poemInput = document.getElementById('poemInput');
    const bgFile = document.getElementById('bgFile');
    const fontFile = document.getElementById('fontFile');
    const strokeWidth = document.getElementById('strokeWidth');
    const strokeCore = document.getElementById('strokeCore');
    const bleed = document.getElementById('bleed');
    const blur = document.getElementById('blur');
    const fontSize = document.getElementById('fontSize');
    const fontSelect = document.getElementById('fontSelect');
    const offsetX = document.getElementById('offsetX');
    const offsetY = document.getElementById('offsetY');
    const inkColor = document.getElementById('inkColor');
    const bgColor = document.getElementById('bgColor');
    const duration = document.getElementById('duration');
    const durationNum = document.getElementById('durationNum');
    const textDir = document.getElementById('textDir');

    const startBtn = document.getElementById('startBtn');
    const saveBtn = document.getElementById('saveBtn');
    const progressBox = document.getElementById('progressBox');
    const progressPercent = document.getElementById('progressPercent');

    let isRecording = false;

    // 슬라이더 동기화
    duration.addEventListener('input', () => durationNum.value = duration.value);
    durationNum.addEventListener('input', () => {
      let val = parseInt(durationNum.value);
      if (isNaN(val)) return;
      if (val < 1) val = 1;
      if (val > 600) val = 600;
      duration.value = val;
    });

    // 배경 이미지 로딩
    bgFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          bgImg = img; canvas.width = img.width; canvas.height = img.height; render(1.0);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 로컬 폰트 로딩
    fontFile.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const fontBuffer = await file.arrayBuffer();
      const fontFace = new FontFace(fontName, fontBuffer);
      await fontFace.load();
      document.fonts.add(fontFace);
      customFontName = fontName;
      render(1.0);
    });

    // 실시간 이벤트 바인딩
    const inputs = [poemInput, strokeWidth, strokeCore, bleed, blur, fontSize, fontSelect, offsetX, offsetY, inkColor, bgColor, textDir];
    inputs.forEach(el => el.addEventListener('input', () => {
      document.getElementById('sizeVal').textContent = fontSize.value + 'px';
      document.getElementById('strokeVal').textContent = strokeWidth.value + 'px';
      document.getElementById('coreVal').textContent = strokeCore.value + '%';
      render(1.0);
    }));

    // 💡 재설계된 획(Stroke) 농담 서브트랙션 셰이더 엔진
    function render(progress = 1.0) {
      if (isRecording && progress === 1.0) return;

      const W = canvas.width, H = canvas.height;

      // 1. 배경 렌더링
      if (bgImg) {
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(bgImg, 0, 0, W, H);
      } else {
        ctx.fillStyle = bgColor.value;
        ctx.fillRect(0, 0, W, H);
      }

      const text = poemInput.value.trim();
      if (!text) return;

      // 오프스크린 캔버스 초기화
      [fillCanvas, strokeCanvas, bleedCanvas].forEach(c => { c.width = W; c.height = H; });
      fillCtx.clearRect(0, 0, W, H);
      strokeCtx.clearRect(0, 0, W, H);
      bleedCtx.clearRect(0, 0, W, H);

      const fSize = parseInt(fontSize.value);
      const offX = parseInt(offsetX.value);
      const offY = parseInt(offsetY.value);
      const activeFont = customFontName ? `"${customFontName}"` : fontSelect.value;
      const lines = text.split('\n');

      const fontStr = `${fSize}px ${activeFont}`;
      fillCtx.font = fontStr; 
      strokeCtx.font = fontStr;
      
      let allChars = [];
      const lineHeight = fSize * 1.55;

      if (textDir.value === 'horizontal') {
        fillCtx.textAlign = 'center'; fillCtx.textBaseline = 'middle';
        strokeCtx.textAlign = 'center'; strokeCtx.textBaseline = 'middle';
        const startY = (H / 2) - ((lines.length - 1) * lineHeight / 2) + offY;

        lines.forEach((line, lIdx) => {
          const chars = line.split('');
          const totalW = fillCtx.measureText(line).width;
          let currX = (W / 2) - (totalW / 2) + offX;

          chars.forEach(ch => {
            const chW = fillCtx.measureText(ch).width;
            allChars.push({ char: ch, x: currX + chW/2, y: startY + (lIdx * lineHeight) });
            currX += chW;
          });
        });
      } else {
        fillCtx.textAlign = 'center'; fillCtx.textBaseline = 'middle';
        strokeCtx.textAlign = 'center'; strokeCtx.textBaseline = 'middle';
        const totalW = lines.length * lineHeight;
        let startX = (W / 2) + (totalW / 2) - (lineHeight / 2) + offX;

        lines.forEach((line, lIdx) => {
          const chars = line.split('');
          const startY = (H / 2) - ((chars.length - 1) * (fSize * 1.1) / 2) + offY;

          chars.forEach((ch, cIdx) => {
            allChars.push({ char: ch, x: startX - (lIdx * lineHeight), y: startY + (cIdx * fSize * 1.1) });
          });
        });
      }

      const drawCount = Math.floor(progress * allChars.length);
      const sWidth = parseFloat(strokeWidth.value);
      const coreAlpha = parseInt(strokeCore.value) / 100.0;

      // --- A. 획 내부 (Fill Canvas) - 연한 투명 채움 ---
      fillCtx.fillStyle = inkColor.value;
      fillCtx.globalAlpha = coreAlpha; // 핵심: 조절되는 투명도 적용!
      for (let i = 0; i < drawCount; i++) {
        fillCtx.fillText(allChars[i].char, allChars[i].x, allChars[i].y);
      }

      // --- B. 획 테두리 (Stroke Canvas) - 펀치 오려내기 방식 ---
      // 1) 윤곽선을 굵게 칠함
      strokeCtx.strokeStyle = inkColor.value;
      strokeCtx.lineWidth = sWidth * 2;
      strokeCtx.lineJoin = 'round';
      for (let i = 0; i < drawCount; i++) {
        strokeCtx.strokeText(allChars[i].char, allChars[i].x, allChars[i].y);
      }
      
      // 2) [핵심 로직] 테두리가 안쪽 살집을 덮지 못하도록 획 안쪽을 구멍 뚫어냄 (destination-out)
      strokeCtx.globalCompositeOperation = 'destination-out';
      strokeCtx.fillStyle = '#000000';
      for (let i = 0; i < drawCount; i++) {
        strokeCtx.fillText(allChars[i].char, allChars[i].x, allChars[i].y);
      }
      strokeCtx.globalCompositeOperation = 'source-over'; // 원복

      // --- C. 먹물 번짐 (Bleed Layer) ---
      const bleedVal = parseInt(bleed.value);
      const blurVal = parseFloat(blur.value);

      if (bleedVal > 0 && drawCount > 0) {
        bleedCtx.save();
        bleedCtx.filter = `blur(${blurVal}px)`;
        bleedCtx.drawImage(strokeCanvas, 0, 0); // 오직 굵은 테두리 윤곽선만 아련하게 번지게 처리
        bleedCtx.restore();

        ctx.save();
        ctx.globalAlpha = 0.4;
        ctx.drawImage(bleedCanvas, -bleedVal/2, 0, W + bleedVal, H);
        ctx.drawImage(bleedCanvas, bleedVal/2, 0, W - bleedVal, H);
        ctx.drawImage(bleedCanvas, 0, -bleedVal/2, W, H + bleedVal);
        ctx.drawImage(bleedCanvas, 0, bleedVal/2, W, H - bleedVal);
        ctx.restore();
      }

      // --- D. 최종 합성 (배경 -> 연한 획 내부 -> 오려진 짙은 외곽선) ---
      ctx.drawImage(fillCanvas, 0, 0);   // 1. 안쪽 살집 (투명도 0%~100% 조절됨)
      ctx.drawImage(strokeCanvas, 0, 0); // 2. 안쪽이 뚫리고 외곽선만 남은 짙은 테두리
    }

    // PNG 저장
    saveBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = '획농담_먹물시화_결과물.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // MP4 비디오 녹화
    startBtn.addEventListener('click', async () => {
      if (isRecording) return;
      isRecording = true;
      progressBox.style.display = 'block';

      const dur = parseFloat(duration.value);
      const totalMs = dur * 1000;

      const stream = canvas.captureStream(30);
      let mimeType = 'video/mp4;codecs=avc1';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `획농담_먹물시화_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
        link.href = url;
        link.click();

        isRecording = false;
        progressBox.style.display = 'none';
        render(1.0);
      };

      recorder.start();
      const startTime = performance.now();

      function drawFrame(now) {
        const elapsed = now - startTime;
        let progress = elapsed / totalMs;
        if (progress > 1.0) progress = 1.0;

        progressPercent.textContent = `${Math.floor(progress * 100)}%`;
        render(progress);

        if (progress < 1.0) {
          requestAnimationFrame(drawFrame);
        } else {
          setTimeout(() => recorder.stop(), 1000);
        }
      }

      requestAnimationFrame(drawFrame);
    });

    render(1.0);
  </script>
</body>
</html>
