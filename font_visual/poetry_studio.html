<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>004변칙 먹물 번짐 & 획 농담 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.92);
      --border-color: #2a303f;
      --accent-color: #6366f1;
      --save-btn: #38bdf8;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

    header h1 {
      font-size: 1.25rem; font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .main-container {
      display: flex; flex: 1; gap: 24px; padding: 24px; max-width: 1600px; width: 100%; margin: 0 auto;
    }

    .control-panel {
      width: 440px; flex-shrink: 0; background: var(--panel-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto;
    }

    .section-title {
      font-size: 0.92rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; }
    .value-badge { color: var(--accent-color); font-weight: 700; }

    input[type="text"], input[type="number"], input[type="file"], textarea, select {
      width: 100%; background: #090a0f; border: 1px solid var(--border-color); border-radius: 8px;
      padding: 8px 12px; color: #fff; font-size: 0.875rem; outline: none;
    }

    .num-direct {
      width: 75px !important; background: #090a0f; color: #38bdf8 !important;
      border: 1px solid var(--accent-color) !important; text-align: center;
      font-weight: bold; padding: 4px 6px !important;
    }

    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    .range-group { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent-color); height: 4px; cursor: pointer; }
    
    input[type="color"] { -webkit-appearance: none; border: 1px solid var(--border-color); width: 100%; height: 36px; border-radius: 8px; cursor: pointer; background: #090a0f; }

    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }

    .btn {
      width: 100%; padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 0.95rem;
      border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-save { background: var(--save-btn); color: #0f172a; }
    .btn-start { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }

    #progressBox {
      display: none; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981;
      padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; font-weight: bold;
    }

    .preview-area {
      flex: 1; display: flex; align-items: center; justify-content: center; background: var(--panel-bg);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; position: relative;
    }

    .canvas-wrapper {
      position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border-radius: 8px; overflow: hidden;
      max-width: 100%; max-height: calc(100vh - 160px); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    }

    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>🖌️ 먹물 번짐 & 획 중간 농담 정밀 스튜디오</h1>
    <div style="font-size:0.85rem; color:var(--text-muted);">경계 밀착 위치 이동 & 획 중심부 농담 감쇄 셰이더</div>
  </header>

  <div class="main-container">
    <div class="control-panel">
      
      <!-- 1. 시 구절 입력 -->
      <div class="form-group">
        <label style="color:#a5b4fc; font-weight:bold;">📜 시 구절 (Text)</label>
        <textarea id="poemInput">물 구슬의 봄 새벽 아늑한 길
하늘이며 들 사이에 넣은 숲</textarea>
      </div>

      <!-- 2. 배경 설정 -->
      <div class="section-title">🖼️ 배경 및 로컬 파일</div>
      <div class="form-group">
        <label>로컬 배경 이미지 로드 (선택)</label>
        <input type="file" id="bgFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>로컬 폰트 선택 (.ttf, .otf)</label>
        <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2">
      </div>

      <!-- 3. 획 중간 연함(농담) 제어 UI -->
      <div class="section-title">✒️ 획 중간 농담(濃淡) 제어</div>
      <div class="form-row">
        <div class="form-group">
          <label>획 중간 연함 (Mid Fade) <span id="midVal" class="value-badge">50%</span></label>
          <input type="range" id="midFade" min="0" max="100" value="50">
        </div>
        <div class="form-group">
          <label>획 테두리/끝 짙음</label>
          <input type="range" id="edgeDensity" min="10" max="100" value="100">
        </div>
      </div>

      <!-- 4. 먹물 번짐 제어 -->
      <div class="section-title">🌊 먹물 확산 (Hydro Spread)</div>
      <div class="form-row">
        <div class="form-group">
          <label>확산 범주 (0 ~ 300px) <span id="bleedVal" class="value-badge">12px</span></label>
          <input type="range" id="bleedRadius" min="0" max="300" value="12">
        </div>
        <div class="form-group">
          <label>방사형 섬유 결</label>
          <input type="range" id="radialRays" min="0" max="100" value="50">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>먹물 경계 맺힘</label>
          <input type="range" id="edgeRim" min="0" max="100" value="50">
        </div>
        <div class="form-group">
          <label>은은한 흐림 (Blur)</label>
          <input type="range" id="blur" min="0" max="30" step="0.5" value="4.0">
        </div>
      </div>

      <!-- 5. 위치 및 스타일 제어 (위치 이동 범위 -1000 ~ +1000px 로 확장) -->
      <div class="section-title">📍 위치 & 스타일 설정</div>
      <div class="form-row">
        <div class="form-group">
          <label>글자 크기 (<span id="sizeVal" class="value-badge">56px</span>)</label>
          <input type="range" id="fontSize" min="20" max="150" value="56">
        </div>
        <div class="form-group">
          <label>폰트 선택</label>
          <select id="fontSelect">
            <option value="'Nanum Myeongjo', serif">나눔명조</option>
            <option value="'Gowun Batang', serif">고운바탕</option>
            <option value="'Noto Sans KR', sans-serif">노토산스</option>
          </select>
        </div>
      </div>

      <!-- 💡 가로/세로 위치를 경계 끝까지 붙일 수 있도록 조절 수치 확장 -->
      <div class="form-row">
        <div class="form-group">
          <label>가로 위치 (X Shift) <span id="xVal" class="value-badge">0px</span></label>
          <input type="range" id="offsetX" min="-1000" max="1000" value="0">
        </div>
        <div class="form-group">
          <label>세로 위치 (Y Shift) <span id="yVal" class="value-badge">0px</span></label>
          <input type="range" id="offsetY" min="-1000" max="1000" value="0">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>먹물 색상</label>
          <input type="color" id="inkColor" value="#121218">
        </div>
        <div class="form-group">
          <label>한지/배경 색상</label>
          <input type="color" id="bgColor" value="#f3eee6">
        </div>
      </div>

      <!-- 6. 모션 및 시간 제어 -->
      <div class="form-group">
        <label>⏱️ 써지는 시간 (1초 ~ 600초)</label>
        <div class="range-group">
          <input type="range" id="duration" min="1" max="600" value="10">
          <input type="number" id="durationNum" class="num-direct" min="1" max="600" value="10">
          <span style="font-size:0.85rem; color:var(--text-muted);">초</span>
        </div>
      </div>

      <div class="form-group">
        <label>글쓰기 방향</label>
        <select id="textDir">
          <option value="horizontal">가로 쓰기</option>
          <option value="vertical" selected>세로 쓰기 (우→좌)</option>
        </select>
      </div>

      <!-- 액션 버튼 -->
      <div class="btn-group">
        <button class="btn btn-start" id="startBtn">▶️ 먹 번짐 모션 시작 & MP4 녹화</button>
        <button class="btn btn-save" id="saveBtn">💾 완성 시화 PNG 저장</button>
      </div>

      <div id="progressBox">
        ⏳ 획 농담 연산 및 MP4 녹화 중... <span id="progressPercent">0%</span>
      </div>

    </div>

    <!-- 캔버스 실시간 프리뷰 -->
    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // 오프스크린 레이어
    const txtCanvas = document.createElement('canvas');
    const txtCtx = txtCanvas.getContext('2d');
    
    const coreCanvas = document.createElement('canvas');
    const coreCtx = coreCanvas.getContext('2d');

    const spreadCanvas = document.createElement('canvas');
    const spreadCtx = spreadCanvas.getContext('2d');

    let bgImg = null;
    let customFontName = null;

    const poemInput = document.getElementById('poemInput');
    const bgFile = document.getElementById('bgFile');
    const fontFile = document.getElementById('fontFile');
    const midFade = document.getElementById('midFade');
    const edgeDensity = document.getElementById('edgeDensity');
    const bleedRadius = document.getElementById('bleedRadius');
    const radialRays = document.getElementById('radialRays');
    const edgeRim = document.getElementById('edgeRim');
    const blur = document.getElementById('blur');
    const fontSize = document.getElementById('fontSize');
    const fontSelect = document.getElementById('fontSelect');
    const offsetX = document.getElementById('offsetX');
    const offsetY = document.getElementById('offsetY');
    const inkColor = document.getElementById('inkColor');
    const bgColor = document.getElementById('bgColor');
    const duration = document.getElementById('duration');
    const durationNum = document.getElementById('durationNum');
    const textDir = document.getElementById('textDir');

    const startBtn = document.getElementById('startBtn');
    const saveBtn = document.getElementById('saveBtn');
    const progressBox = document.getElementById('progressBox');
    const progressPercent = document.getElementById('progressPercent');

    let isRecording = false;

    // 슬라이더 동기화
    duration.addEventListener('input', () => durationNum.value = duration.value);
    durationNum.addEventListener('input', () => {
      let val = parseInt(durationNum.value);
      if (isNaN(val)) return;
      if (val < 1) val = 1;
      if (val > 600) val = 600;
      duration.value = val;
    });

    // 배경 이미지 로딩
    bgFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          bgImg = img; canvas.width = img.width; canvas.height = img.height; render(1.0);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 로컬 폰트 로딩
    fontFile.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const fontBuffer = await file.arrayBuffer();
      const fontFace = new FontFace(fontName, fontBuffer);
      await fontFace.load();
      document.fonts.add(fontFace);
      customFontName = fontName;
      render(1.0);
    });

    // 실시간 이벤트 바인딩
    const inputs = [poemInput, midFade, edgeDensity, bleedRadius, radialRays, edgeRim, blur, fontSize, fontSelect, offsetX, offsetY, inkColor, bgColor, textDir];
    inputs.forEach(el => el.addEventListener('input', () => {
      document.getElementById('sizeVal').textContent = fontSize.value + 'px';
      document.getElementById('bleedVal').textContent = bleedRadius.value + 'px';
      document.getElementById('midVal').textContent = midFade.value + '%';
      document.getElementById('xVal').textContent = offsetX.value + 'px';
      document.getElementById('yVal').textContent = offsetY.value + 'px';
      render(1.0);
    }));

    // 💡 핵심: 획 중간 감쇄(Mid Fade) & 번짐 결합 렌더링 엔진
    function render(progress = 1.0) {
      if (isRecording && progress === 1.0) return;

      const W = canvas.width, H = canvas.height;

      // 1. 배경 준비
      if (bgImg) {
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(bgImg, 0, 0, W, H);
      } else {
        ctx.fillStyle = bgColor.value;
        ctx.fillRect(0, 0, W, H);
      }

      const text = poemInput.value.trim();
      if (!text) return;

      [txtCanvas, coreCanvas, spreadCanvas].forEach(c => { c.width = W; c.height = H; });
      txtCtx.clearRect(0, 0, W, H);
      coreCtx.clearRect(0, 0, W, H);
      spreadCtx.clearRect(0, 0, W, H);

      const fSize = parseInt(fontSize.value);
      const offX = parseInt(offsetX.value);
      const offY = parseInt(offsetY.value);
      const activeFont = customFontName ? `"${customFontName}"` : fontSelect.value;
      const lines = text.split('\n');

      txtCtx.font = `${fSize}px ${activeFont}`;
      txtCtx.fillStyle = inkColor.value;
      
      let allChars = [];
      const lineHeight = fSize * 1.55;

      if (textDir.value === 'horizontal') {
        txtCtx.textAlign = 'center'; txtCtx.textBaseline = 'middle';
        const startY = (H / 2) - ((lines.length - 1) * lineHeight / 2) + offY;

        lines.forEach((line, lIdx) => {
          const chars = line.split('');
          const totalW = txtCtx.measureText(line).width;
          let currX = (W / 2) - (totalW / 2) + offX;

          chars.forEach(ch => {
            const chW = txtCtx.measureText(ch).width;
            allChars.push({ char: ch, x: currX + chW/2, y: startY + (lIdx * lineHeight) });
            currX += chW;
          });
        });
      } else {
        txtCtx.textAlign = 'center'; txtCtx.textBaseline = 'middle';
        const totalW = lines.length * lineHeight;
        let startX = (W / 2) + (totalW / 2) - (lineHeight / 2) + offX;

        lines.forEach((line, lIdx) => {
          const chars = line.split('');
          const startY = (H / 2) - ((chars.length - 1) * (fSize * 1.1) / 2) + offY;

          chars.forEach((ch, cIdx) => {
            allChars.push({ char: ch, x: startX - (lIdx * lineHeight), y: startY + (cIdx * fSize * 1.1) });
          });
        });
      }

      const drawCount = Math.floor(progress * allChars.length);

      // A. 원본 전체 획 그리기
      for (let i = 0; i < drawCount; i++) {
        txtCtx.fillText(allChars[i].char, allChars[i].x, allChars[i].y);
      }

      // B. 💡 [핵심] 획 중간 영역(Mid Core) 오려내서 연하게 만들기
      const fadeVal = parseInt(midFade.value) / 100.0;
      if (fadeVal > 0 && drawCount > 0) {
        coreCtx.drawImage(txtCanvas, 0, 0);
        
        // 획의 중심부를 가우시안 축소 마스크로 추출
        coreCtx.globalCompositeOperation = 'destination-out';
        coreCtx.lineWidth = Math.max(2, fSize * 0.25);
        coreCtx.strokeStyle = '#000000';
        coreCtx.font = `${fSize}px ${activeFont}`;
        coreCtx.textAlign = txtCtx.textAlign;
        coreCtx.textBaseline = txtCtx.textBaseline;

        for (let i = 0; i < drawCount; i++) {
          coreCtx.strokeText(allChars[i].char, allChars[i].x, allChars[i].y);
        }
        
        // 오려낸 중심 영역에 투명도(Fade) 적용
        txtCtx.save();
        txtCtx.globalCompositeOperation = 'destination-out';
        txtCtx.globalAlpha = fadeVal * 0.85; // 수치만큼 획 중간을 깎아냄
        txtCtx.drawImage(coreCtx, 0, 0);
        txtCtx.restore();
      }

      // C. 먹물 번짐 (Spread) 연산
      const radius = parseInt(bleedRadius.value);
      const rayFactor = parseInt(radialRays.value) / 100.0;
      const rimFactor = parseInt(edgeRim.value) / 100.0;
      const blurVal = parseFloat(blur.value);

      if (radius > 0 && drawCount > 0) {
        spreadCtx.save();
        spreadCtx.fillStyle = inkColor.value;
        spreadCtx.filter = `blur(${blurVal}px)`;

        const layers = 12;
        for (let l = 1; l <= layers; l++) {
          const rRatio = l / layers;
          const currentR = radius * rRatio;

          const numRays = 16 + Math.floor(rayFactor * 24);
          for (let ray = 0; ray < numRays; ray++) {
            const angle = (ray / numRays) * Math.PI * 2;
            const dist = currentR * (Math.sin(angle * 5 + l) * 0.3 + 0.7);

            const dx = Math.cos(angle) * dist;
            const dy = Math.sin(angle) * dist;

            let alpha = (1.0 - rRatio * 0.7) / layers;
            if (l === layers && rimFactor > 0) alpha *= (1.0 + rimFactor * 2.0);

            spreadCtx.globalAlpha = alpha;
            spreadCtx.drawImage(txtCanvas, dx, dy);
          }
        }
        spreadCtx.restore();

        ctx.save();
        ctx.drawImage(spreadCanvas, 0, 0);
        ctx.restore();
      }

      // D. 최종 획 덮기
      ctx.drawImage(txtCanvas, 0, 0);
    }

    // PNG 저장
    saveBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = '획농담_먹물시화_결과물.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // MP4 비디오 녹화
    startBtn.addEventListener('click', async () => {
      if (isRecording) return;
      isRecording = true;
      progressBox.style.display = 'block';

      const dur = parseFloat(duration.value);
      const totalMs = dur * 1000;

      const stream = canvas.captureStream(30);
      let mimeType = 'video/mp4;codecs=avc1';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `획농담_먹물시화_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
        link.href = url;
        link.click();

        isRecording = false;
        progressBox.style.display = 'none';
        render(1.0);
      };

      recorder.start();
      const startTime = performance.now();

      function drawFrame(now) {
        const elapsed = now - startTime;
        let progress = elapsed / totalMs;
        if (progress > 1.0) progress = 1.0;

        progressPercent.textContent = `${Math.floor(progress * 100)}%`;
        render(progress);

        if (progress < 1.0) {
          requestAnimationFrame(drawFrame);
        } else {
          setTimeout(() => recorder.stop(), 1000);
        }
      }

      requestAnimationFrame(drawFrame);
    });

    render(1.0);
  </script>
</body>
</html>
