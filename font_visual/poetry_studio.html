<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 시화 & 먹물 번짐 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.92);
      --border-color: #2a303f;
      --accent-color: #6366f1;
      --save-btn: #38bdf8;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

    header h1 {
      font-size: 1.2rem; font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .tab-group {
      display: flex; gap: 8px; background: #090a0f; padding: 4px; border-radius: 10px; border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 8px 16px; border: none; background: transparent; color: var(--text-muted);
      font-weight: 600; font-size: 0.88rem; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }

    .tab-btn.active { background: var(--accent-color); color: #fff; }

    .main-container {
      display: flex; flex: 1; gap: 24px; padding: 24px; max-width: 1600px; width: 100%; margin: 0 auto;
    }

    .control-panel {
      width: 440px; flex-shrink: 0; background: var(--panel-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto;
    }

    .tab-content { display: none; flex-direction: column; gap: 14px; }
    .tab-content.active { display: flex; }

    .section-title {
      font-size: 0.92rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; }
    .value-badge { color: var(--accent-color); font-weight: 700; }

    input[type="text"], input[type="file"], textarea, select {
      width: 100%; background: #090a0f; border: 1px solid var(--border-color); border-radius: 8px;
      padding: 8px 12px; color: #fff; font-size: 0.875rem; outline: none;
    }

    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    .range-group { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent-color); height: 4px; cursor: pointer; }
    
    input[type="color"] { -webkit-appearance: none; border: 1px solid var(--border-color); width: 100%; height: 36px; border-radius: 8px; cursor: pointer; background: #090a0f; }

    .btn {
      width: 100%; padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 0.95rem;
      border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-save { background: var(--save-btn); color: #0f172a; }
    .btn-start { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }

    #progressBox {
      display: none; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981;
      padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; font-weight: bold;
    }

    .preview-area {
      flex: 1; display: flex; align-items: center; justify-content: center; background: var(--panel-bg);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; position: relative;
    }

    .canvas-wrapper {
      position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border-radius: 8px; overflow: hidden;
      max-width: 100%; max-height: calc(100vh - 160px); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    }

    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>🎨 통합 시화 & 먹물 번짐 스튜디오</h1>
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('m1_tab', this)">🖼️ 1. 이미지 시화</button>
      <button class="tab-btn" onclick="switchTab('m2_tab', this)">🖌️ 2. 먹물 번짐 타이포 (MP4)</button>
    </div>
  </header>

  <div class="main-container">
    <div class="control-panel">
      
      <!-- 공통 시 구절 입력 -->
      <div class="form-group">
        <label style="color:#a5b4fc; font-weight:bold;">📜 공통 시 구절</label>
        <textarea id="globalPoem">얼굴 하나 야위어 가오.
달이 차오르는 밤이면
호수 같은 마음이 흔들리옵니다.</textarea>
      </div>

      <!-- MODE 1: 이미지 배경 시화 -->
      <div id="m1_tab" class="tab-content active">
        <div class="section-title">🖼️ 배경 이미지 & 폰트</div>
        <div class="form-group">
          <label>로컬 배경 이미지</label>
          <input type="file" id="m1_bgFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>로컬 폰트 (.ttf, .otf)</label>
          <input type="file" id="m1_fontFile" accept=".ttf,.otf,.woff,.woff2">
        </div>

        <div class="section-title">📍 글자 크기 및 위치 조정</div>
        <div class="form-row">
          <div class="form-group">
            <label>글자 크기 (<span id="m1_sizeVal">60px</span>)</label>
            <input type="range" id="m1_size" min="20" max="200" value="60">
          </div>
          <div class="form-group">
            <label>글자 색상</label>
            <input type="color" id="m1_color" value="#ffffff">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>가로 위치 (X Offset)</label>
            <input type="range" id="m1_offsetX" min="-400" max="400" value="0">
          </div>
          <div class="form-group">
            <label>세로 위치 (Y Offset)</label>
            <input type="range" id="m1_offsetY" min="-400" max="400" value="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>줄 간격</label>
            <input type="range" id="m1_lineHeight" min="1.0" max="3.0" step="0.1" value="1.5">
          </div>
          <div class="form-group">
            <label>글자 간격 (px)</label>
            <input type="range" id="m1_letterSpacing" min="-20" max="50" value="0">
          </div>
        </div>

        <div class="form-group">
          <label>글쓰기 방향 및 정렬</label>
          <div class="form-row">
            <select id="m1_dir">
              <option value="horizontal">가로 쓰기</option>
              <option value="vertical">세로 쓰기</option>
            </select>
            <select id="m1_alignX">
              <option value="left">왼쪽</option>
              <option value="center" selected>가운데</option>
              <option value="right">오른쪽</option>
            </select>
          </div>
        </div>

        <button class="btn btn-save" id="m1_saveBtn">💾 고해상도 시화 PNG 저장</button>
      </div>

      <!-- MODE 2: 먹물 번짐 타이포그래피 (정밀 연산) -->
      <div id="m2_tab" class="tab-content">
        <div class="section-title">🖌️ 먹물 번짐 (Bleed Noise) 제어</div>
        
        <div class="form-row">
          <div class="form-group">
            <label>번짐 정도 (Spread) <span id="m2_bleedVal" class="value-badge">12</span></label>
            <input type="range" id="m2_bleed" min="0" max="30" value="12">
          </div>
          <div class="form-group">
            <label>한지 섬유 번짐 (Fiber Noise)</label>
            <input type="range" id="m2_noiseScale" min="1" max="50" value="20">
          </div>
        </div>

        <div class="section-title">📍 위치 및 레이아웃 설정</div>
        <div class="form-row">
          <div class="form-group">
            <label>글자 크기 (<span id="m2_sizeVal">56px</span>)</label>
            <input type="range" id="m2_size" min="20" max="120" value="56">
          </div>
          <div class="form-group">
            <label>폰트 선택</label>
            <select id="m2_font">
              <option value="'Nanum Myeongjo', serif">나눔명조</option>
              <option value="'Gowun Batang', serif">고운바탕</option>
              <option value="'Noto Sans KR', sans-serif">노토산스</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>가로 위치 (X Shift)</label>
            <input type="range" id="m2_offsetX" min="-400" max="400" value="0">
          </div>
          <div class="form-group">
            <label>세로 위치 (Y Shift)</label>
            <input type="range" id="m2_offsetY" min="-400" max="400" value="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>먹물 색상</label>
            <input type="color" id="m2_inkColor" value="#121218">
          </div>
          <div class="form-group">
            <label>한지 배경 색상</label>
            <input type="color" id="m2_bgColor" value="#f3eee6">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>⏱️ 써지는 시간 (초)</label>
            <input type="range" id="m2_duration" min="2" max="60" value="10">
          </div>
          <div class="form-group">
            <label>글쓰기 방향</label>
            <select id="m2_dir">
              <option value="horizontal">가로 쓰기</option>
              <option value="vertical">세로 쓰기 (우→좌)</option>
            </select>
          </div>
        </div>

        <button class="btn btn-start" id="m2_startBtn">▶️ 먹 번짐 모션 시작 & MP4 녹화</button>
      </div>

      <div id="progressBox">
        ⏳ 먹물 픽셀 번짐 연산 및 MP4 녹화 중... <span id="progressPercent">0%</span>
      </div>

    </div>

    <!-- 캔버스 실시간 프리뷰 -->
    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    let activeTab = 'm1_tab';
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // 오프스크린 캔버스 (먹물 픽셀 번짐 연산용)
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');

    const globalPoem = document.getElementById('globalPoem');

    // --- Mode 1 Elements ---
    let m1_bgImg = null;
    let m1_fontName = 'Malgun Gothic';
    const m1_bgFile = document.getElementById('m1_bgFile');
    const m1_fontFile = document.getElementById('m1_fontFile');
    const m1_size = document.getElementById('m1_size');
    const m1_color = document.getElementById('m1_color');
    const m1_offsetX = document.getElementById('m1_offsetX');
    const m1_offsetY = document.getElementById('m1_offsetY');
    const m1_lineHeight = document.getElementById('m1_lineHeight');
    const m1_letterSpacing = document.getElementById('m1_letterSpacing');
    const m1_dir = document.getElementById('m1_dir');
    const m1_alignX = document.getElementById('m1_alignX');

    // --- Mode 2 Elements ---
    const m2_bleed = document.getElementById('m2_bleed');
    const m2_noiseScale = document.getElementById('m2_noiseScale');
    const m2_size = document.getElementById('m2_size');
    const m2_font = document.getElementById('m2_font');
    const m2_offsetX = document.getElementById('m2_offsetX');
    const m2_offsetY = document.getElementById('m2_offsetY');
    const m2_inkColor = document.getElementById('m2_inkColor');
    const m2_bgColor = document.getElementById('m2_bgColor');
    const m2_duration = document.getElementById('m2_duration');
    const m2_dir = document.getElementById('m2_dir');

    const progressBox = document.getElementById('progressBox');
    const progressPercent = document.getElementById('progressPercent');

    let isRecording = false;

    // 탭 전환
    function switchTab(tabId, btn) {
      activeTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if (tabId === 'm1_tab' && m1_bgImg) {
        canvas.width = m1_bgImg.width; canvas.height = m1_bgImg.height;
      } else {
        canvas.width = 1080; canvas.height = 1080;
      }
      render();
    }

    // 파일 로딩
    m1_bgFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          m1_bgImg = img; canvas.width = img.width; canvas.height = img.height; render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    m1_fontFile.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const fontBuffer = await file.arrayBuffer();
      const fontFace = new FontFace(fontName, fontBuffer);
      await fontFace.load();
      document.fonts.add(fontFace);
      m1_fontName = fontName;
      render();
    });

    // 실시간 이벤트 바인딩
    const inputs = [globalPoem, m1_size, m1_color, m1_offsetX, m1_offsetY, m1_lineHeight, m1_letterSpacing, m1_dir, m1_alignX,
                    m2_bleed, m2_noiseScale, m2_size, m2_font, m2_offsetX, m2_offsetY, m2_inkColor, m2_bgColor, m2_dir];
    inputs.forEach(el => el.addEventListener('input', () => {
      document.getElementById('m1_sizeVal').textContent = m1_size.value + 'px';
      document.getElementById('m2_sizeVal').textContent = m2_size.value + 'px';
      document.getElementById('m2_bleedVal').textContent = m2_bleed.value;
      render();
    }));

    function render() {
      if (isRecording) return;
      if (activeTab === 'm1_tab') renderMode1();
      else renderMode2(1.0);
    }

    // --- Mode 1: 정적 시화 ---
    function renderMode1() {
      if (!m1_bgImg) {
        ctx.fillStyle = '#1c1c24'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(m1_bgImg, 0, 0);
      }

      const text = globalPoem.value;
      if (!text.trim()) return;

      const fontSize = parseInt(m1_size.value);
      const lineHeight = parseFloat(m1_lineHeight.value);
      const letterSpacing = parseInt(m1_letterSpacing.value);
      const dir = m1_dir.value;
      const alignX = m1_alignX.value;
      const offX = parseInt(m1_offsetX.value);
      const offY = parseInt(m1_offsetY.value);

      ctx.font = `${fontSize}px "${m1_fontName}"`;
      ctx.fillStyle = m1_color.value;

      const lines = text.split('\n');

      if (dir === 'horizontal') {
        ctx.textAlign = alignX; ctx.textBaseline = "top";
        const blockH = lines.length * (fontSize * lineHeight);
        let startY = (canvas.height - blockH) / 2 + offY;
        let startX = canvas.width / 2 + offX;
        if (alignX === 'left') startX = 100 + offX;
        if (alignX === 'right') startX = canvas.width - 100 + offX;

        lines.forEach((line, i) => {
          ctx.fillText(line, startX, startY + (i * fontSize * lineHeight));
        });
      } else {
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const blockW = lines.length * (fontSize * lineHeight);
        let maxLen = 0; lines.forEach(l => { if (l.length > maxLen) maxLen = l.length; });
        const blockH = maxLen * (fontSize + letterSpacing);

        let startX = (canvas.width / 2) + (blockW / 2) - (fontSize/2) + offX;
        let startY = (canvas.height - blockH) / 2 + (fontSize/2) + offY;

        lines.forEach((line, i) => {
          const x = startX - (i * fontSize * lineHeight);
          for(let j = 0; j < line.length; j++) {
            ctx.fillText(line[j], x, startY + (j * (fontSize + letterSpacing)));
          }
        });
      }
    }

    // --- Mode 2: 정밀 노이즈 먹물 번짐 (Perlin-like Pixel Bleed Engine) ---
    function renderMode2(progress = 1.0) {
      const W = canvas.width, H = canvas.height;
      
      // 1. 한지 질감 배경
      ctx.fillStyle = m2_bgColor.value;
      ctx.fillRect(0, 0, W, H);

      const text = globalPoem.value.trim();
      if (!text) return;

      offCanvas.width = W; offCanvas.height = H;
      offCtx.clearRect(0, 0, W, H);

      const fSize = parseInt(m2_size.value);
      const offX = parseInt(m2_offsetX.value);
      const offY = parseInt(m2_offsetY.value);
      const lines = text.split('\n');

      offCtx.font = `${fSize}px ${m2_font.value}`;
      offCtx.fillStyle = m2_inkColor.value;

      let allChars = [];
      const lineHeight = fSize * 1.55;

      if (m2_dir.value === 'horizontal') {
        offCtx.textAlign = 'center'; offCtx.textBaseline = 'middle';
        const startY = (H / 2) - ((lines.length - 1) * lineHeight / 2) + offY;

        lines.forEach((line, lIdx) => {
          const chars = line.split('');
          const totalW = offCtx.measureText(line).width;
          let currX = (W / 2) - (totalW / 2) + offX;

          chars.forEach(ch => {
            const chW = offCtx.measureText(ch).width;
            allChars.push({ char: ch, x: currX + chW/2, y: startY + (lIdx * lineHeight) });
            currX += chW;
          });
        });
      } else {
        offCtx.textAlign = 'center'; offCtx.textBaseline = 'middle';
        const totalW = lines.length * lineHeight;
        let startX = (W / 2) + (totalW / 2) - (lineHeight / 2) + offX;

        lines.forEach((line, lIdx) => {
          const chars = line.split('');
          const startY = (H / 2) - ((chars.length - 1) * (fSize * 1.1) / 2) + offY;

          chars.forEach((ch, cIdx) => {
            allChars.push({ char: ch, x: startX - (lIdx * lineHeight), y: startY + (cIdx * fSize * 1.1) });
          });
        });
      }

      const drawCount = Math.floor(progress * allChars.length);
      for (let i = 0; i < drawCount; i++) {
        offCtx.fillText(allChars[i].char, allChars[i].x, allChars[i].y);
      }

      // 2. 픽셀 레벨 먹물 번짐 연산 (Pixel Displacement & Bleed)
      const bleedAmt = parseInt(m2_bleed.value);
      if (bleedAmt > 0 && drawCount > 0) {
        const srcData = offCtx.getImageData(0, 0, W, H);
        const srcPixels = srcData.data;
        
        const bleedImgData = ctx.createImageData(W, H);
        const destPixels = bleedImgData.data;

        const noiseScale = parseInt(m2_noiseScale.value) * 0.005;

        // 노이즈 오프셋 연산을 통한 먹물 번짐
        for (let y = 0; y < H; y += 2) { // 성능 최적화를 위한 2px 스텝
          for (let x = 0; x < W; x += 2) {
            const idx = (y * W + x) * 4;
            const alpha = srcPixels[idx + 3];

            if (alpha > 20) {
              // 먹물 테두리 근처 픽셀 불규칙 분산 연산
              const angle = (Math.sin(x * noiseScale) + Math.cos(y * noiseScale)) * Math.PI;
              const dist = (Math.random() * 0.6 + 0.4) * bleedAmt;

              const nx = Math.floor(x + Math.cos(angle) * dist);
              const ny = Math.floor(y + Math.sin(angle) * dist);

              if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                const targetIdx = (ny * W + nx) * 4;
                destPixels[targetIdx] = srcPixels[idx];
                destPixels[targetIdx + 1] = srcPixels[idx + 1];
                destPixels[targetIdx + 2] = srcPixels[idx + 2];
                destPixels[targetIdx + 3] = Math.floor(alpha * 0.45); // 스머징 먹물 투명도
              }
            }
          }
        }
        ctx.putImageData(bleedImgData, 0, 0);
      }

      // 짙은 붓글씨 원본 오버레이
      ctx.drawImage(offCanvas, 0, 0);
    }

    // PNG 저장
    document.getElementById('m1_saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = '시화_결과물.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // MP4 내보내기 및 녹화
    document.getElementById('m2_startBtn').addEventListener('click', async () => {
      if (isRecording) return;
      isRecording = true;
      progressBox.style.display = 'block';

      const duration = parseFloat(m2_duration.value);
      const totalMs = duration * 1000;

      const stream = canvas.captureStream(30);
      let mimeType = 'video/mp4;codecs=avc1';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `먹물번짐_시화_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
        link.href = url;
        link.click();

        isRecording = false;
        progressBox.style.display = 'none';
        render();
      };

      recorder.start();
      const startTime = performance.now();

      function drawFrame(now) {
        const elapsed = now - startTime;
        let progress = elapsed / totalMs;
        if (progress > 1.0) progress = 1.0;

        progressPercent.textContent = `${Math.floor(progress * 100)}%`;
        renderMode2(progress);

        if (progress < 1.0) {
          requestAnimationFrame(drawFrame);
        } else {
          setTimeout(() => recorder.stop(), 1000);
        }
      }

      requestAnimationFrame(drawFrame);
    });

    render();
  </script>
</body>
</html>
