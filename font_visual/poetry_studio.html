<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>먹 번짐 수채화 타이포그래피 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.9);
      --border-color: #2a303f;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-container {
      display: flex;
      flex: 1;
      gap: 24px;
      padding: 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .control-panel {
      width: 420px;
      flex-shrink: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; }
    .value-badge { color: var(--accent-color); font-weight: 700; }

    input[type="text"], input[type="file"], textarea, select {
      width: 100%;
      background: #090a0f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.875rem;
      outline: none;
    }

    textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

    .range-group { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent-color); height: 5px; cursor: pointer; }
    
    input[type="color"] { -webkit-appearance: none; border: 1px solid var(--border-color); width: 100%; height: 38px; border-radius: 8px; cursor: pointer; background: #090a0f; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    .btn-start:hover { transform: translateY(-1px); background: linear-gradient(135deg, #059669, #047857); }

    .btn-preview { background: #3b82f6; color: #fff; }
    .btn-preview:hover { background: #2563eb; }

    #progressBox {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: bold;
    }

    .preview-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: hidden;
      max-width: 100%;
      max-height: calc(100vh - 160px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>🖌️ 수채화 먹 번짐 타이포그래피 스튜디오</h1>
    <div style="font-size: 0.85rem; color: var(--text-muted);">한지 질감 및 먹물 스며듦 픽셀 셰이더 엔진</div>
  </header>

  <div class="main-container">
    <div class="control-panel">
      
      <!-- 1. 시 구절 및 폰트 -->
      <div class="section">
        <div class="section-title">📜 1. 시 구절 & 폰트 설정</div>
        <div class="form-group">
          <label>시 내용</label>
          <textarea id="poemText">얼굴 하나 야위어 가오.
달이 차오르는 밤이면
호수 같은 마음이 흔들리옵니다.</textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>폰트 선택</label>
            <select id="fontSelect">
              <option value="'Nanum Myeongjo', serif">나눔명조</option>
              <option value="'Gowun Batang', serif">고운바탕</option>
              <option value="'Noto Sans KR', sans-serif">노토산스</option>
            </select>
          </div>
          <div class="form-group">
            <label>글자 크기 (<span id="fontSizeVal" class="value-badge">52px</span>)</label>
            <input type="range" id="fontSize" min="20" max="100" value="52">
          </div>
        </div>
      </div>

      <!-- 2. 먹 번짐 (Bleeding Shader) 핵심 설정 UI -->
      <div class="section">
        <div class="section-title">💧 2. 먹 번짐 & 텍스처 제어</div>
        
        <div class="form-group">
          <label>먹물 번짐 강도 (Bleed Radius) <span id="bleedVal" class="value-badge">8.0</span></label>
          <div class="range-group">
            <input type="range" id="bleedRadius" min="0" max="25" step="0.5" value="8.0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>번짐 은은함 (Feather Blur)</label>
            <input type="range" id="bleedSoftness" min="0" max="15" step="0.5" value="6.0">
          </div>
          <div class="form-group">
            <label>한지 결 농도 (Paper Texture)</label>
            <input type="range" id="paperGrain" min="0" max="100" value="35">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>먹물 색상</label>
            <input type="color" id="inkColor" value="#111116">
          </div>
          <div class="form-group">
            <label>한지/배경 색상</label>
            <input type="color" id="bgColor" value="#f4f0ea">
          </div>
        </div>
      </div>

      <!-- 3. 모션 및 비디오 설정 -->
      <div class="section">
        <div class="section-title">🎬 3. 모션 & 영상 내보내기</div>
        
        <div class="form-row">
          <div class="form-group">
            <label>⏱️ 써지는 시간 (초)</label>
            <input type="range" id="animDuration" min="2" max="60" value="10">
          </div>
          <div class="form-group">
            <label>글쓰기 방향</label>
            <select id="textDir">
              <option value="horizontal">가로 쓰기</option>
              <option value="vertical">세로 쓰기 (우→좌)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 버튼 영역 -->
      <div class="btn-group">
        <button class="btn btn-start" id="startBtn">▶️ 먹 번짐 모션 시작 & MP4 녹화</button>
        <button class="btn btn-preview" id="previewBtn">👁️ 완성 상태 미리보기</button>
      </div>

      <div id="progressBox">
        ⏳ 렌더링 및 MP4 녹화 진행 중... <span id="progressPercent">0%</span>
      </div>

    </div>

    <!-- 캔버스 영역 -->
    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // 오프스크린 캔버스 (먹물 오리지널 텍스트용 / 번짐 연산용)
    const txtCanvas = document.createElement('canvas');
    const txtCtx = txtCanvas.getContext('2d');
    const bleedCanvas = document.createElement('canvas');
    const bleedCtx = bleedCanvas.getContext('2d');

    // DOM Elements
    const poemText = document.getElementById('poemText');
    const fontSelect = document.getElementById('fontSelect');
    const fontSize = document.getElementById('fontSize');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const bleedRadius = document.getElementById('bleedRadius');
    const bleedVal = document.getElementById('bleedVal');
    const bleedSoftness = document.getElementById('bleedSoftness');
    const paperGrain = document.getElementById('paperGrain');
    const inkColor = document.getElementById('inkColor');
    const bgColor = document.getElementById('bgColor');
    const animDuration = document.getElementById('animDuration');
    const textDir = document.getElementById('textDir');

    const startBtn = document.getElementById('startBtn');
    const previewBtn = document.getElementById('previewBtn');
    const progressBox = document.getElementById('progressBox');
    const progressPercent = document.getElementById('progressPercent');

    let isRecording = false;

    // 슬라이더 바인딩
    fontSize.addEventListener('input', () => { fontSizeVal.textContent = fontSize.value + 'px'; renderPreview(); });
    bleedRadius.addEventListener('input', () => { bleedVal.textContent = bleedRadius.value; renderPreview(); });
    [bleedSoftness, paperGrain, inkColor, bgColor, textDir, fontSelect, poemText].forEach(el => {
      el.addEventListener('input', () => renderPreview());
    });

    // 한지 바탕 질감 렌더링
    function drawPaperTexture(targetCtx, width, height) {
      targetCtx.fillStyle = bgColor.value;
      targetCtx.fillRect(0, 0, width, height);

      const grainAmount = parseInt(paperGrain.value);
      if (grainAmount <= 0) return;

      const imgData = targetCtx.getImageData(0, 0, width, height);
      const pixels = imgData.data;
      const factor = grainAmount * 0.15;

      for (let i = 0; i < pixels.length; i += 4) {
        const noise = (Math.random() - 0.5) * factor * 10;
        pixels[i] = Math.min(255, Math.max(0, pixels[i] + noise));
        pixels[i+1] = Math.min(255, Math.max(0, pixels[i+1] + noise - 2));
        pixels[i+2] = Math.min(255, Math.max(0, pixels[i+2] + noise - 5));
      }
      targetCtx.putImageData(imgData, 0, 0);
    }

    // 먹물 번짐 (Bleeding Shader) 합성 메타 알고리즘
    function drawInkWithBleed(targetCtx, progress = 1.0) {
      const W = canvas.width;
      const H = canvas.height;

      txtCanvas.width = W; txtCanvas.height = H;
      bleedCanvas.width = W; bleedCanvas.height = H;

      txtCtx.clearRect(0, 0, W, H);
      bleedCtx.clearRect(0, 0, W, H);

      const fSize = parseInt(fontSize.value);
      const lines = poemText.value.split('\n');
      const bRadius = parseFloat(bleedRadius.value);
      const bSoftness = parseFloat(bleedSoftness.value);

      txtCtx.font = `${fSize}px ${fontSelect.value}`;
      txtCtx.fillStyle = inkColor.value;

      // 전체 글자 리스트 추출
      let allChars = [];
      const dir = textDir.value;
      const lineHeight = fSize * 1.6;

      if (dir === 'horizontal') {
        txtCtx.textAlign = 'center';
        txtCtx.textBaseline = 'middle';
        const startY = (H / 2) - ((lines.length - 1) * lineHeight / 2);

        lines.forEach((line, lineIdx) => {
          const chars = line.split('');
          const totalW = txtCtx.measureText(line).width;
          let currentX = (W / 2) - (totalW / 2);

          chars.forEach(ch => {
            const chW = txtCtx.measureText(ch).width;
            allChars.push({ char: ch, x: currentX + chW / 2, y: startY + (lineIdx * lineHeight), align: 'center' });
            currentX += chW;
          });
        });
      } else {
        txtCtx.textAlign = 'center';
        txtCtx.textBaseline = 'middle';
        const totalBlockW = lines.length * lineHeight;
        let startX = (W / 2) + (totalBlockW / 2) - (lineHeight / 2);

        lines.forEach((line, lineIdx) => {
          const chars = line.split('');
          const startY = (H / 2) - ((chars.length - 1) * (fSize * 1.1) / 2);

          chars.forEach((ch, chIdx) => {
            allChars.push({ char: ch, x: startX - (lineIdx * lineHeight), y: startY + (chIdx * fSize * 1.1), align: 'center' });
          });
        });
      }

      // 진행도에 맞춰 그릴 글자 수 결정
      const drawCount = Math.floor(progress * allChars.length);

      // 1. 오프스크린 텍스트 캔버스에 선명한 텍스트 그리기
      for (let i = 0; i < drawCount; i++) {
        const item = allChars[i];
        txtCtx.textAlign = item.align;
        txtCtx.fillText(item.char, item.x, item.y);
      }

      // 2. 먹 번짐 층 (Bleed Layer) 연산
      if (bRadius > 0 && drawCount > 0) {
        bleedCtx.filter = `blur(${bSoftness}px)`;
        bleedCtx.drawImage(txtCanvas, 0, 0);
        bleedCtx.filter = 'none';

        // 한지 바탕 위에 은은한 번짐 오버레이 (Multiply 또는 Alpha Blend)
        targetCtx.save();
        targetCtx.globalAlpha = 0.45;
        targetCtx.drawImage(bleedCanvas, -bRadius/2, -bRadius/2, W + bRadius, H + bRadius);
        targetCtx.globalAlpha = 0.25;
        targetCtx.drawImage(bleedCanvas, bRadius/2, bRadius/2, W - bRadius, H - bRadius);
        targetCtx.restore();
      }

      // 3. 중앙의 짙은 먹선 레이어 겹치기
      targetCtx.drawImage(txtCanvas, 0, 0);
    }

    // 전체 프레임 미리보기
    function renderPreview() {
      if (isRecording) return;
      drawPaperTexture(ctx, canvas.width, canvas.height);
      drawInkWithBleed(ctx, 1.0);
    }

    // 애니메이션 실행 및 MP4 (H.264) 녹화
    async function startRecording() {
      if (isRecording) return;
      isRecording = true;

      startBtn.disabled = true;
      previewBtn.disabled = true;
      progressBox.style.display = 'block';

      const durationSec = parseFloat(animDuration.value);
      const totalMs = durationSec * 1000;

      // MP4 H.264 코덱 호환성 체크
      const stream = canvas.captureStream(30);
      let mimeType = 'video/mp4;codecs=avc1';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
          mimeType = 'video/webm;codecs=h264';
        } else {
          mimeType = 'video/webm';
        }
      }

      const recorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 10000000 // 10Mbps 고화질
      });

      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        link.download = `ink_bleed_poem_${Date.now()}.${ext}`;
        link.href = url;
        link.click();

        isRecording = false;
        startBtn.disabled = false;
        previewBtn.disabled = false;
        progressBox.style.display = 'none';
        renderPreview();
      };

      recorder.start();
      const startTime = performance.now();

      function drawFrame(now) {
        const elapsed = now - startTime;
        let progress = elapsed / totalMs;
        if (progress > 1.0) progress = 1.0;

        progressPercent.textContent = `${Math.floor(progress * 100)}%`;

        // 캔버스 재렌더링
        drawPaperTexture(ctx, canvas.width, canvas.height);
        drawInkWithBleed(ctx, progress);

        if (progress < 1.0) {
          requestAnimationFrame(drawFrame);
        } else {
          setTimeout(() => recorder.stop(), 1000); // 완성 후 1초 대기 후 다운로드
        }
      }

      requestAnimationFrame(drawFrame);
    }

    startBtn.addEventListener('click', startRecording);
    previewBtn.addEventListener('click', renderPreview);

    document.fonts.ready.then(() => renderPreview());
  </script>
</body>
</html>
