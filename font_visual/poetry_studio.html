<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 시화 & 타이포그래피 스튜디오</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.9);
      --border-color: #2a303f;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --save-btn: #38bdf8;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 헤더 및 탭 통합 */
    header {
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tab-group {
      display: flex;
      gap: 8px;
      background: #090a0f;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* 메인 레이아웃 */
    .main-container {
      display: flex;
      flex: 1;
      gap: 24px;
      padding: 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .control-panel {
      width: 440px;
      flex-shrink: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }

    .tab-content { display: none; flex-direction: column; gap: 16px; }
    .tab-content.active { display: flex; }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; }
    
    input[type="text"], input[type="file"], textarea, select {
      width: 100%;
      background: #090a0f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.875rem;
      outline: none;
    }

    textarea { resize: vertical; min-height: 100px; line-height: 1.5; }

    .range-group { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent-color); height: 4px; }
    .range-val { font-size: 0.8rem; color: var(--text-muted); width: 36px; text-align: right; }
    
    input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 36px; border-radius: 8px; cursor: pointer; background: transparent; }

    .btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-save { background: var(--save-btn); color: #0f172a; }
    .btn-start { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .btn-autofit { background: #312e81; color: #c7d2fe; border: 1px solid #4338ca; }

    /* 프리뷰 영역 */
    .preview-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: hidden;
      max-width: 100%;
      max-height: calc(100vh - 160px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>🎨 시화 & 타이포그래피 통합 스튜디오</h1>
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchMode('imageMode')">🖼️ 1. 이미지 글그림 시화</button>
      <button class="tab-btn" onclick="switchMode('typographyMode')">🎬 2. 타이포그래피 비디오</button>
    </div>
  </header>

  <div class="main-container">
    <div class="control-panel">
      
      <!-- 공통 시 구절 입력 -->
      <div class="form-group">
        <label style="color:#a5b4fc; font-weight:bold;">📜 공통 시 구절 (모드 공용)</label>
        <textarea id="globalPoem">그대는 이 밤에 안식하시옵니까. 홀로 속삭이는 목소리로 그대의 안부를 여쭐지라도, 어찌 이 가벼운 입술로 다 전할 수 있으리오. 그대에게 마땅한 더 높은 언사가 어디 없으리까.</textarea>
      </div>

      <!-- MODE 1: 이미지 글그림 시화 컨트롤 -->
      <div id="imageMode" class="tab-content active">
        <div class="section-title">🖼️ 로컬 배경 & 폰트 설정</div>
        <div class="form-group">
          <label>로컬 배경 이미지 선택</label>
          <input type="file" id="m1_bgFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>로컬 폰트 선택 (.ttf, .otf)</label>
          <input type="file" id="m1_fontFile" accept=".ttf,.otf,.woff,.woff2">
        </div>

        <div class="section-title">✏️ 텍스트 배치 제어</div>
        <div class="form-row">
          <div class="form-group">
            <label>글자 크기 (<span id="m1_sizeVal">60</span>px)</label>
            <input type="range" id="m1_size" min="20" max="200" value="60">
          </div>
          <div class="form-group">
            <label>글자 색상</label>
            <input type="color" id="m1_color" value="#ffffff">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>줄 간격</label>
            <input type="range" id="m1_lineHeight" min="1.0" max="3.0" step="0.1" value="1.5">
          </div>
          <div class="form-group">
            <label>글자 간격 (px)</label>
            <input type="range" id="m1_letterSpacing" min="-20" max="50" value="0">
          </div>
        </div>

        <div class="form-group">
          <label>글쓰기 방향</label>
          <select id="m1_dir">
            <option value="horizontal">가로 쓰기</option>
            <option value="vertical">세로 쓰기 (우→좌 진행)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>가로 정렬</label>
            <select id="m1_alignX">
              <option value="left">왼쪽</option>
              <option value="center" selected>가운데</option>
              <option value="right">오른쪽</option>
            </select>
          </div>
          <div class="form-group">
            <label>세로 정렬</label>
            <select id="m1_alignY">
              <option value="top">위</option>
              <option value="center" selected>중간</option>
              <option value="bottom">아래</option>
            </select>
          </div>
        </div>

        <button class="btn btn-save" id="m1_saveBtn">💾 고해상도 시화 PNG 저장</button>
      </div>

      <!-- MODE 2: 타이포그래피 비디오 컨트롤 -->
      <div id="typographyMode" class="tab-content">
        <div class="section-title">1. 틀 글자 (마스크) 설정</div>
        <div class="form-row">
          <div class="form-group">
            <label>첫째 줄 글자</label>
            <input type="text" id="m2_text1" value="슬픈">
          </div>
          <div class="form-group">
            <label>둘째 줄 글자</label>
            <input type="text" id="m2_text2" value="우상">
          </div>
        </div>

        <div class="form-group">
          <label>틀 글자 폰트</label>
          <select id="m2_maskFont">
            <option value="'Black Han Sans', sans-serif">블랙한산</option>
            <option value="'Noto Sans KR', sans-serif">노토산스</option>
            <option value="'Nanum Myeongjo', serif">나눔명조</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>내부 글자 크기 (px)</label>
            <input type="range" id="m2_fontSize" min="5" max="40" step="0.5" value="16.0">
          </div>
          <div class="form-group">
            <label>⏱️ 애니메이션 (초)</label>
            <input type="range" id="m2_duration" min="1" max="60" value="12">
          </div>
        </div>

        <button class="btn btn-autofit" id="m2_autoFitBtn">✨ 시 크기 자동 맞춤 (Auto-Fit)</button>
        <button class="btn btn-start" id="m2_startBtn">▶️ 모션 시작 & MP4 녹화</button>
      </div>

    </div>

    <!-- 우측 공용 캔버스 영역 -->
    <div class="preview-area">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'imageMode';
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // 공통 시 구절 입력 요소
    const globalPoem = document.getElementById('globalPoem');

    // --- Mode 1 Variables ---
    let m1_bgImage = null;
    let m1_customFont = 'Malgun Gothic';
    const m1_bgFile = document.getElementById('m1_bgFile');
    const m1_fontFile = document.getElementById('m1_fontFile');
    const m1_size = document.getElementById('m1_size');
    const m1_color = document.getElementById('m1_color');
    const m1_lineHeight = document.getElementById('m1_lineHeight');
    const m1_letterSpacing = document.getElementById('m1_letterSpacing');
    const m1_dir = document.getElementById('m1_dir');
    const m1_alignX = document.getElementById('m1_alignX');
    const m1_alignY = document.getElementById('m1_alignY');

    // Mode 1 Event Listeners
    m1_bgFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          m1_bgImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    m1_fontFile.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const fontBuffer = await file.arrayBuffer();
      const fontFace = new FontFace(fontName, fontBuffer);
      await fontFace.load();
      document.fonts.add(fontFace);
      m1_customFont = fontName;
      render();
    });

    // --- Mode 2 Variables ---
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');
    const m2_text1 = document.getElementById('m2_text1');
    const m2_text2 = document.getElementById('m2_text2');
    const m2_maskFont = document.getElementById('m2_maskFont');
    const m2_fontSize = document.getElementById('m2_fontSize');
    const m2_duration = document.getElementById('m2_duration');

    // 탭 전환 함수
    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (mode === 'imageMode') {
        event.target.classList.add('active');
        document.getElementById('imageMode').classList.add('active');
        if (m1_bgImage) {
          canvas.width = m1_bgImage.width;
          canvas.height = m1_bgImage.height;
        } else {
          canvas.width = 1080; canvas.height = 1080;
        }
      } else {
        event.target.classList.add('active');
        document.getElementById('typographyMode').classList.add('active');
        canvas.width = 1080; canvas.height = 1080;
      }
      render();
    }

    // 공용 이벤트 리스너 갱신
    [globalPoem, m1_size, m1_color, m1_lineHeight, m1_letterSpacing, m1_dir, m1_alignX, m1_alignY,
     m2_text1, m2_text2, m2_maskFont, m2_fontSize, m2_duration].forEach(el => {
      el.addEventListener('input', () => render());
    });

    // 메인 통합 렌더링 함수
    function render() {
      if (currentMode === 'imageMode') {
        renderMode1();
      } else {
        renderMode2();
      }
    }

    // Mode 1: 이미지 글그림 렌더링
    function renderMode1() {
      if (!m1_bgImage) {
        ctx.fillStyle = '#1c1c24';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(m1_bgImage, 0, 0);
      }

      const text = globalPoem.value;
      if (!text.trim()) return;

      const fontSize = parseInt(m1_size.value);
      const lineHeight = parseFloat(m1_lineHeight.value);
      const letterSpacing = parseInt(m1_letterSpacing.value);
      const alignX = m1_alignX.value;
      const alignY = m1_alignY.value;
      const dir = m1_dir.value;
      const padding = Math.min(canvas.width, canvas.height) * 0.08;

      ctx.font = `${fontSize}px "${m1_customFont}"`;
      ctx.fillStyle = m1_color.value;

      const lines = text.split('\n');

      if (dir === 'horizontal') {
        ctx.textAlign = alignX; ctx.textBaseline = "top";
        const blockHeight = lines.length * (fontSize * lineHeight);
        let startY = padding;
        if (alignY === 'center') startY = (canvas.height - blockHeight) / 2;
        if (alignY === 'bottom') startY = canvas.height - blockHeight - padding;

        let startX = padding;
        if (alignX === 'center') startX = canvas.width / 2;
        if (alignX === 'right') startX = canvas.width - padding;

        lines.forEach((line, i) => {
          const y = startY + (i * fontSize * lineHeight);
          ctx.fillText(line, startX, y);
        });
      } else {
        // 세로 쓰기
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const blockWidth = lines.length * (fontSize * lineHeight);
        let maxLen = 0;
        lines.forEach(l => { if (l.length > maxLen) maxLen = l.length; });
        const blockHeight = maxLen * (fontSize + letterSpacing);

        let startX = (canvas.width / 2) + (blockWidth / 2) - (fontSize/2);
        let startY = (canvas.height - blockHeight) / 2 + (fontSize/2);

        lines.forEach((line, i) => {
          const x = startX - (i * fontSize * lineHeight);
          for(let j = 0; j < line.length; j++) {
            ctx.fillText(line[j], x, startY + (j * (fontSize + letterSpacing)));
          }
        });
      }
    }

    // Mode 2: 타이포그래피 정적 렌더링
    function renderMode2() {
      ctx.fillStyle = '#0b0d14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const W = canvas.width, H = canvas.height;
      const mFontSize = 380;
      ctx.font = `900 ${mFontSize}px ${m2_maskFont.value}`;
      ctx.strokeStyle = '#818cf8';
      ctx.lineWidth = 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.strokeText(m2_text1.value, W / 2, H / 2 - 160);
      ctx.strokeText(m2_text2.value, W / 2, H / 2 + 160);
    }

    // 모드 1 PNG 저장
    document.getElementById('m1_saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = '시화_결과물.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 초기 실행
    render();
  </script>
</body>
</html>
