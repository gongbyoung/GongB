<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자모 LED 키네틱 타이포그래피</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🎵 자모 LED 키네틱 타이포</h1>
        <input type="file" id="srtFile" accept=".srt">
        <input type="file" id="audioFile" accept="audio/*">
        <button id="loadSample">샘플 SRT</button>
        <div class="controls">
            <button id="playBtn">▶ 재생</button>
            <button id="stopBtn">⏹ 정지</button>
            <input type="range" id="timeline" min="0" max="100" step="0.01" value="0">
            <span class="time-display" id="timeDisplay">00:00.00</span>

            <select id="aspectRatio">
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
            </select>

            <select id="colorStyle">
                <option value="harmony">🌟 추천 (하모니)</option>
                <option value="monochrome">⚫ 흑백</option>
                <option value="pastel">🎀 파스텔톤</option>
                <option value="neon">💡 네온컬러</option>
                <option value="primary">🔴 원색계열</option>
            </select>

            <select id="styleSelect">
                <option value="">-- 타이포 스타일 선택 --</option>
                <option value="ledkinetictypo001">LED 키네틱 타이포 001</option>
                <option value="drive001">드라이브</option>
                <option value="dance001">댄스</option>
                <option value="ballad001">발라드</option>
                <option value="rock001">락</option>
                <option value="newage001">뉴에이지</option>
                <option value="traditional001">국악</option>
                <option value="sleeping001">수면</option>
                <option value="you001">현대시_고요</option>    
                <option value="you002">한글 글쓰기</option>    
            </select>

            <select id="presetSelect" disabled>
                <option value="">-- 모션 선택 --</option>
            </select>

            <div class="font-picker-row">
                <select id="fontSelect">
                    <option value="'Noto Sans KR', 'Malgun Gothic', sans-serif">Noto Sans KR</option>
                    <option value="'Malgun Gothic', sans-serif">맑은 고딕</option>
                    <option value="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">Apple Gothic</option>
                    <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                    <option value="'Gulim', sans-serif">굴림</option>
                    <option value="'Arial', sans-serif">Arial</option>
                </select>
                <input type="text" id="customFont" placeholder="폰트 이름 입력" style="width:120px;">
                <button id="applyFontBtn">적용</button>
                <button id="systemFontsBtn">🔍 시스템 폰트</button>
            </div>

            <div class="slider-container">
                <label for="scatterSlider">흩어짐:</label>
                <input type="range" id="scatterSlider" min="0" max="100" value="50" step="1">
                <span id="scatterValue">50</span>
            </div>
            <div class="slider-container">
                <label for="fontSizeSlider">글자 크기:</label>
                <input type="range" id="fontSizeSlider" min="20" max="120" value="80" step="1">
                <span id="fontSizeValue">80</span>
            </div>

            <button id="shuffleBtn">🔀 셔플</button>
            <button id="saveBtn" style="background:#2ecc71; border-color:#2ecc71; color:#000; font-weight:bold;">💾 MP4 저장</button>
        </div>
    </header>

    <div class="main-area">
        <div class="log-panel" id="logPanel">
            <h3>📋 로그</h3>
            <div id="logContent"></div>
        </div>
        <div class="canvas-container">
            <canvas id="canvas" width="1280" height="720"></canvas>
            <div class="current-sentence" id="currentSentence"></div>
        </div>
        <div class="status-panel" id="statusPanel">
            <h3>📊 현재 상태</h3>
            <div id="statusContent"></div>
        </div>
    </div>

    <audio id="audio" style="display:none;"></audio>

    <!-- 공통 유틸리티 먼저 로드 -->
    <script src="js/utils.js"></script>
    <script src="js/colorStyles.js"></script>
    <script src="js/recorder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
