<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>골격 기반 캘리그라피 렌더러</title>
  <style>
    body {
      background: #eee9df;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      font-family: sans-serif;
    }
    .box {
      background: #fcf9f2;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    canvas {
      display: block;
      background: #fcf9f2;
      border: 1px solid #e0dacf;
      margin-top: 15px;
    }
    button {
      padding: 8px 18px;
      font-size: 15px;
      cursor: pointer;
      border: 1px solid #999;
      background: #fff;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="box">
    <button onclick="drawCalligraphy()">'한글' 캘리그라피 필순으로 자동 쓰기</button>
    <canvas id="cv" width="600" height="300"></canvas>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    // 글자의 "1선 뼈대(Skeleton)" 벡터 데이터 (x, y, 굵기 가중치 w)
    // 활자 외곽선이 아니라, 붓이 지나가는 길과 필압 포인트입니다.
    const charStrokes = {
      '한': [
        // 초성 ㅎ 점
        [{x: 90, y: 70, w: 5}, {x: 105, y: 75, w: 12}, {x: 115, y: 85, w: 4}],
        // 초성 ㅎ 가로획
        [{x: 65, y: 105, w: 6}, {x: 105, y: 100, w: 14}, {x: 145, y: 105, w: 5}],
        // 초성 ㅎ 동그라미 (시계방향)
        [{x: 105, y: 120, w: 8}, {x: 130, y: 135, w: 11}, {x: 105, y: 155, w: 6}, {x: 80, y: 135, w: 12}, {x: 105, y: 120, w: 8}],
        // 중성 ㅏ 세로획 (힘차게 내리긋기)
        [{x: 185, y: 55, w: 14}, {x: 188, y: 130, w: 9}, {x: 185, y: 220, w: 16}, {x: 182, y: 245, w: 3}],
        // 중성 ㅏ 짧은 가로획
        [{x: 188, y: 135, w: 10}, {x: 215, y: 138, w: 13}, {x: 230, y: 140, w: 4}],
        // 종성 ㄴ (꺾임에서 두꺼워짐)
        [{x: 80, y: 195, w: 10}, {x: 82, y: 235, w: 18}, {x: 150, y: 230, w: 11}, {x: 165, y: 215, w: 4}]
      ],
      '글': [
        // 초성 ㄱ (기필 -> 가늘어짐 -> 꺾임에서 강한 필압 -> 삐침)
        [{x: 340, y: 75, w: 12}, {x: 400, y: 70, w: 7}, {x: 420, y: 80, w: 20}, {x: 410, y: 125, w: 10}, {x: 395, y: 140, w: 3}],
        // 중성 ㅡ
        [{x: 320, y: 165, w: 11}, {x: 385, y: 160, w: 7}, {x: 450, y: 168, w: 13}, {x: 465, y: 166, w: 4}],
        // 종성 ㄹ (복합 꺾임)
        [{x: 350, y: 195, w: 9}, {x: 415, y: 190, w: 13}, {x: 415, y: 210, w: 7}, 
         {x: 350, y: 215, w: 12}, {x: 350, y: 235, w: 8}, {x: 425, y: 230, w: 14}, {x: 440, y: 220, w: 3}]
      ]
    };

    function clear() {
      ctx.fillStyle = '#fcf9f2';
      ctx.fillRect(0, 0, cv.width, cv.height);
    }
    clear();

    // 두 점 사이를 부드러운 가변 굵기 붓으로 잇는 함수
    function drawSegment(p1, p2, progress) {
      const x = p1.x + (p2.x - p1.x) * progress;
      const y = p1.y + (p2.y - p1.y) * progress;
      const w = p1.w + (p2.w - p1.w) * progress;

      // 먹물 다발 효과
      for (let i = 0; i < 12; i++) {
        const ox = (Math.random() - 0.5) * w;
        const oy = (Math.random() - 0.5) * w;
        ctx.fillStyle = 'rgba(25, 25, 25, 0.25)';
        ctx.beginPath();
        ctx.arc(x + ox, y + oy, (w * 0.35) * Math.random(), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 획 하나를 애니메이션으로 그리기
    function animateStroke(points, onComplete) {
      let segIndex = 0;
      let progress = 0;

      function step() {
        if (segIndex >= points.length - 1) {
          onComplete();
          return;
        }

        const p1 = points[segIndex];
        const p2 = points[segIndex + 1];

        drawSegment(p1, p2, progress);

        progress += 0.12; // 그리는 속도
        if (progress >= 1) {
          progress = 0;
          segIndex++;
        }
        requestAnimationFrame(step);
      }
      step();
    }

    // 전체 글자 연속 재생
    function drawCalligraphy() {
      clear();
      const allStrokes = [...charStrokes['한'], ...charStrokes['글']];
      let strokeIdx = 0;

      function next() {
        if (strokeIdx < allStrokes.length) {
          animateStroke(allStrokes[strokeIdx], () => {
            strokeIdx++;
            setTimeout(next, 40); // 획과 획 사이 간격
          });
        }
      }
      next();
    }

    // 초기 1회 실행
    drawCalligraphy();
  </script>
</body>
</html>
