<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>완전 UI 기반 한글 캘리그라피 지오메트리 스튜디오 (v38.0)</title>

  <!-- 웹 폰트 & Opentype.js & MP4 Muxer CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>

  <style>
    :root {
      --bg-dark: #121215;
      --panel-bg: #1c1c22;
      --panel-border: #2c2c36;
      --accent: #ff5e36;
      --accent-grad: linear-gradient(135deg, #ff5e36, #e01e5a);
      --text: #ededf2;
      --text-dim: #9292a4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #16161b; padding: 10px 20px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.15rem; font-weight: 700; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .preset-bar { background: #181820; border-bottom: 1px solid var(--panel-border); padding: 8px 16px; display: flex; gap: 8px; align-items: center; overflow-x: auto; }
    .preset-label { font-size: 0.78rem; font-weight: 700; color: #fca311; margin-right: 4px; white-space: nowrap; }
    .btn-preset { background: #252530; color: #cfcfdc; border: 1px solid #363646; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-preset:hover { background: #323242; color: #fff; }
    .btn-preset.active { background: var(--accent-grad); border-color: transparent; color: #fff; box-shadow: 0 2px 8px rgba(255, 94, 54, 0.4); }

    .workspace { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 370px; background: var(--panel-bg); padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .sidebar-left { border-right: 1px solid var(--panel-border); }
    .sidebar-right { border-left: 1px solid var(--panel-border); }

    .card { background: #16161c; padding: 12px; border-radius: 8px; border: 1px solid #262632; display: flex; flex-direction: column; gap: 7px; }
    .card-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }

    label { font-size: 0.75rem; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
    label span.val { color: var(--text); font-weight: 600; }

    textarea { width: 100%; height: 75px; background: #111115; border: 1px solid var(--panel-border); border-radius: 6px; color: #fff; font-family: monospace; font-size: 0.78rem; padding: 8px; resize: vertical; }
    select, input[type="range"], input[type="color"], input[type="number"], input[type="text"] { width: 100%; padding: 6px 8px; background: #131318; border: 1px solid var(--panel-border); border-radius: 6px; color: #fff; font-size: 0.8rem; }
    input[type="range"] { padding: 0; accent-color: var(--accent); cursor: pointer; }

    .dim-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dim-group { display: flex; flex-direction: column; gap: 2px; }
    .dim-group span { font-size: 0.7rem; color: var(--text-dim); }

    .viewport { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0c0e; padding: 16px; position: relative; }
    .canvas-container { box-shadow: 0 16px 40px rgba(0,0,0,0.8); border-radius: 6px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; max-height: 72vh; max-width: 100%; }
    canvas { display: block; max-height: 72vh; max-width: 100%; object-fit: contain; }

    .controller-bar { width: 100%; max-width: 900px; margin-top: 10px; background: var(--panel-bg); padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--panel-border); }
    button.btn-primary { background: var(--accent-grad); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.82rem; }
    button.btn-sub { background: #262632; color: #fff; border: 1px solid var(--panel-border); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
    .modal-box { background: var(--panel-bg); padding: 24px; border-radius: 10px; width: 320px; text-align: center; }
    .bar-bg { width: 100%; height: 8px; background: #111; border-radius: 4px; margin: 12px 0; overflow: hidden; }
    .bar-fill { width: 0%; height: 100%; background: var(--accent-grad); }
  </style>
</head>
<body>

  <header>
    <h1>🖌️ 완전 UI 파라메트릭 캘리그라피 스튜디오</h1>
    <span style="font-size: 0.78rem; color: var(--text-dim);">100% UI 슬라이더 & 드롭다운 제어 엔진 v38.0</span>
  </header>

  <!-- 6대 조형 템플릿 (클릭 시 해당 UI 컨트롤 수치들이 그대로 세팅됨) -->
  <div class="preset-bar">
    <span class="preset-label">⚡ 6대 조형 템플릿:</span>
    <button class="btn-preset active" id="btn-p1">1. 맛있게 0칼로리 (블록형)</button>
    <button class="btn-preset" id="btn-p2">2. 행복할 권리 (산문형)</button>
    <button class="btn-preset" id="btn-p3">3. 사랑도 필요하다 (쐐기형)</button>
    <button class="btn-preset" id="btn-p4">4. 첫눈처럼 갈께 (계단형)</button>
    <button class="btn-preset" id="btn-p5">5. 시나브로 (엠블럼)</button>
    <button class="btn-preset" id="btn-p6">6. 사랑을 배운다 (장천형)</button>
  </div>

  <div class="workspace">
    
    <!-- 👈 좌측 사이드바 -->
    <div class="sidebar sidebar-left">
      <div class="card">
        <div class="card-title">📝 본문 텍스트</div>
        <textarea id="input-text"></textarea>
        <button class="btn-sub" id="btn-update-text">실시간 캔버스 재빌드</button>
      </div>

      <div class="card">
        <div class="card-title">✍️ 부제 / 서명 (SubText)</div>
        <label>작품 서명/출처 문구</label>
        <input type="text" id="input-subtext" value="제주글씨" placeholder="예: 제주글씨, 메리 씀">
      </div>

      <div class="card">
        <div class="card-title">📐 캔버스 크기 (해상도)</div>
        <label>비율 프리셋</label>
        <select id="select-ratio">
          <option value="1:1" selected>1:1 정방형 (1440 x 1440)</option>
          <option value="16:9">16:9 가로형 (1920 x 1080)</option>
          <option value="9:16">9:16 세로 숏폼 (1080 x 1920)</option>
          <option value="custom">⚙️ 직접 입력 (Custom)</option>
        </select>

        <div class="dim-inputs">
          <div class="dim-group">
            <span>가로 (W)</span>
            <input type="number" id="input-canvas-width" value="1440" min="200" max="4000" step="10">
          </div>
          <div class="dim-group">
            <span>세로 (H)</span>
            <input type="number" id="input-canvas-height" value="1440" min="200" max="4000" step="10">
          </div>
        </div>

        <label style="margin-top: 4px;">배경 재질</label>
        <select id="select-bg">
          <option value="white-hanji" selected>순백 전통 화선지</option>
          <option value="warm-hanji">은은한 미색 고서지</option>
          <option value="dark-paper">먹지 (Dark Paper)</option>
          <option value="transparent">투명 (PNG/알파 영상용)</option>
        </select>

        <label style="margin-top: 4px;">먹물 색상</label>
        <input type="color" id="input-ink-color" value="#111113">
      </div>

      <div class="card">
        <div class="card-title">🔴 전서 직인 (낙관)</div>
        <label>인장 스타일</label>
        <select id="select-seal">
          <option value="seal-red">🔴 주문 정방형 붉은 인장</option>
          <option value="seal-dark">⚫ 흑묵 정방 낙관</option>
          <option value="none" selected>❌ 인장 없음</option>
        </select>

        <label style="margin-top: 4px;">인장 문구 (1~4글자)</label>
        <input type="text" id="input-seal-text" value="제주" maxlength="4">
      </div>
    </div>

    <!-- 🖼️ 중앙 캔버스 -->
    <div class="viewport">
      <div class="canvas-container">
        <canvas id="calli-canvas" width="1440" height="1440"></canvas>
      </div>

      <div class="controller-bar">
        <button class="btn-sub" id="btn-play">▶ 재생</button>
        <input type="range" id="time-slider" min="0" max="4.0" step="0.01" value="4.0" style="flex:1;">
        <span id="time-text" style="font-family:monospace; font-size:0.8rem; color:var(--accent);">04.00s</span>
        <button class="btn-primary" id="btn-export">🎬 MP4 렌더링</button>
      </div>
    </div>

    <!-- 👉 우측 사이드바: 숨은 변수 없이 모든 것을 제어하는 조형 컨트롤 -->
    <div class="sidebar sidebar-right">
      
      <div class="card">
        <div class="card-title">🏛️ 1. 조형 구도 패턴 (Layout Engine)</div>
        
        <label>문장 배치 스타일</label>
        <select id="select-layout-pattern">
          <option value="center" selected>⚖️ 기본 중앙 정렬</option>
          <option value="stair-diagonal">📐 사선 계단형 (첫눈처럼: 좌상 ➔ 우하)</option>
          <option value="wedge-title">🔻 상단 쐐기 강조형 (사랑도: 1행 극대화)</option>
          <option value="block-headline">▭ 블록 지그재그 (맛있게: 엇갈린 박스)</option>
          <option value="emblem-compact">🗿 엠블럼 중심 압축 (시나브로)</option>
        </select>

        <label>행별 점진 축소율 (Decay) <span class="val" id="val-decay">1.0x</span></label>
        <input type="range" id="param-decay" min="0.6" max="1.4" step="0.05" value="1.0">

        <label>주제어(1행) 대비율 <span class="val" id="val-contrast">1.4x</span></label>
        <input type="range" id="param-contrast" min="1.0" max="3.5" step="0.1" value="1.4">
      </div>

      <div class="card">
        <div class="card-title">✒️ 2. 장획/삐침 어트랙터 (Attractor)</div>

        <label>장획 뻗는 방향</label>
        <select id="select-pull-dir">
          <option value="down" selected>⬇️ 수직 하강 (사랑을 배운다 장천)</option>
          <option value="down-right">↘️ 우하단 사선 (첫눈처럼 삐침)</option>
          <option value="down-left">↙️ 좌하단 대각 (봄캘리 장천)</option>
          <option value="right">➡️ 우측 수평 (질주 꼬리)</option>
        </select>

        <label>장획 적용 대상 글자</label>
        <select id="select-pull-target">
          <option value="last-char" selected>문장 맨 마지막 글자 끝획</option>
          <option value="first-char">문장 첫 글자</option>
          <option value="line-ends">각 행의 마지막 글자들</option>
          <option value="none">장획 끔</option>
        </select>

        <label>장획/삐침 강도 <span class="val" id="val-attractor">1.2x</span></label>
        <input type="range" id="param-attractor" min="0.0" max="3.0" step="0.1" value="1.2">
      </div>

      <div class="card">
        <div class="card-title">🧮 3. 획 왜곡 및 필압 지오메트리</div>

        <label>속도장 전단각 (우상향 기울기) <span class="val" id="val-shear">7°</span></label>
        <input type="range" id="param-shear" min="-15" max="25" step="1" value="7">

        <label>구형 중심 팽창 (후중화) <span class="val" id="val-bulge">0.3</span></label>
        <input type="range" id="param-bulge" min="-1.0" max="2.0" step="0.1" value="0.3">

        <label>외곽선 법선 확장 (획 굵기) <span class="val" id="val-stroke-expand">1.35x</span></label>
        <input type="range" id="param-stroke-expand" min="0.5" max="2.5" step="0.05" value="1.35">

        <label>비선형 곡률 (Bending) <span class="val" id="val-curvature">0.2</span></label>
        <input type="range" id="param-curvature" min="-2.0" max="2.0" step="0.1" value="0.2">

        <label>갈필(飛白) 접선 슬릿 절삭 <span class="val" id="val-slit-cut">0.45</span></label>
        <input type="range" id="param-slit-cut" min="0.0" max="1.0" step="0.05" value="0.45">
      </div>

      <div class="card">
        <div class="card-title">📜 4. 간격 및 여백</div>

        <label>자간 (Letter Spacing) <span class="val" id="val-spacing">-6px</span></label>
        <input type="range" id="param-spacing" min="-40" max="40" step="2" value="-6">

        <label>행간 (Line Height) <span class="val" id="val-line-height">1.05x</span></label>
        <input type="range" id="param-line-height" min="0.6" max="2.2" step="0.05" value="1.05">
      </div>

    </div>

  </div>

  <div class="modal-overlay" id="render-modal">
    <div class="modal-box">
      <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px;">캘리그라피 인코딩 중</div>
      <div class="bar-bg"><div class="bar-fill" id="render-bar"></div></div>
      <span id="render-pct" style="font-size: 0.85rem; color: var(--accent); font-weight: 700;">0%</span>
    </div>
  </div>

  <script>
    /* =========================================================================
       🏛️ 6대 캘리그라피 UI 파라미터 매핑 세트
       (※ 코드 내부 트릭 없이 순수하게 UI 컨트롤 값만 변경함)
       ========================================================================= */
    const UI_PRESET_MAP = {
      p1: {
        text: "맛있게 먹으면\n0칼로리",
        subText: "제주글씨",
        ratio: "1:1",
        w: 1440, h: 1440,
        layoutPattern: "block-headline",
        decay: 1.0,
        contrast: 1.4,
        pullDir: "down",
        pullTarget: "none",
        attractor: 0.0,
        shear: 7,
        bulge: 0.3,
        strokeExpand: 1.35,
        curvature: 0.2,
        slitCut: 0.45,
        spacing: -6,
        lineHeight: 1.05,
        sealType: "none",
        sealText: "제주"
      },
      p2: {
        text: "우리에겐\n행복할 권리와\n타인의 행복에\n대한 책임이\n함께 있다",
        subText: "- 정유정, <완전한 행복> 中 - calligraphy by 메리",
        ratio: "1:1",
        w: 1440, h: 1440,
        layoutPattern: "center",
        decay: 1.0,
        contrast: 1.25,
        pullDir: "down-right",
        pullTarget: "last-char",
        attractor: 0.8,
        shear: 2,
        bulge: 0.1,
        strokeExpand: 1.15,
        curvature: 0.3,
        slitCut: 0.3,
        spacing: -8,
        lineHeight: 1.05,
        sealType: "seal-red",
        sealText: "메리"
      },
      p3: {
        text: "사랑도\n멈출 수 없이\n필요하다",
        subText: "",
        ratio: "1:1",
        w: 1440, h: 1440,
        layoutPattern: "wedge-title",
        decay: 1.25, // 행이 내려갈수록 축소
        contrast: 2.6, // 1행 극대화
        pullDir: "down",
        pullTarget: "last-char",
        attractor: 1.6,
        shear: -4,
        bulge: 0.4,
        strokeExpand: 1.4,
        curvature: -0.4,
        slitCut: 0.5,
        spacing: -10,
        lineHeight: 0.95,
        sealType: "seal-red",
        sealText: "사랑"
      },
      p4: {
        text: "첫눈처럼\n너에게\n갈께",
        subText: "",
        ratio: "1:1",
        w: 1440, h: 1440,
        layoutPattern: "stair-diagonal", // 사선 계단
        decay: 1.0,
        contrast: 1.4,
        pullDir: "down-right",
        pullTarget: "last-char",
        attractor: 2.4, // '갈께'의 긴 사선 삐침
        shear: 9,
        bulge: 0.1,
        strokeExpand: 1.2,
        curvature: 0.6,
        slitCut: 0.4,
        spacing: -6,
        lineHeight: 1.15,
        sealType: "none",
        sealText: "첫눈"
      },
      p5: {
        text: "시나브로",
        subText: "",
        ratio: "1:1",
        w: 1440, h: 1440,
        layoutPattern: "emblem-compact",
        decay: 1.0,
        contrast: 1.6,
        pullDir: "down",
        pullTarget: "last-char",
        attractor: 1.5,
        shear: 1,
        bulge: 1.3, // 후중 팽창
        strokeExpand: 1.65,
        curvature: 0.0,
        slitCut: 0.4,
        spacing: -14,
        lineHeight: 1.0,
        sealType: "seal-red",
        sealText: "진심"
      },
      p6: {
        text: "사랑하면서\n사랑을\n배운\n다",
        subText: "이천이십육년 시월 현진 쓰다",
        ratio: "1:1",
        w: 1440, h: 1440,
        layoutPattern: "center",
        decay: 1.0,
        contrast: 1.6,
        pullDir: "down", // 수직 하강
        pullTarget: "last-char",
        attractor: 2.6, // '다'에서 길게 떨어지는 장천 획
        shear: 8,
        bulge: 0.2,
        strokeExpand: 1.25,
        curvature: 0.4,
        slitCut: 0.5,
        spacing: -8,
        lineHeight: 1.05,
        sealType: "seal-red",
        sealText: "현진"
      }
    };

    let loadedFont = null;
    let isPlaying = false;
    let currentTime = 4.0;
    const totalDuration = 4.0;

    const canvas = document.getElementById('calli-canvas');
    const ctx = canvas.getContext('2d');
    const inputText = document.getElementById('input-text');
    const inputSubtext = document.getElementById('input-subtext');
    const selectRatio = document.getElementById('select-ratio');
    const inputCanvasWidth = document.getElementById('input-canvas-width');
    const inputCanvasHeight = document.getElementById('input-canvas-height');
    const selectBg = document.getElementById('select-bg');
    const inputInkColor = document.getElementById('input-ink-color');
    const selectSeal = document.getElementById('select-seal');
    const inputSealText = document.getElementById('input-seal-text');

    // 우측 UI 요소들
    const selectLayoutPattern = document.getElementById('select-layout-pattern');
    const paramDecay = document.getElementById('param-decay');
    const paramContrast = document.getElementById('param-contrast');
    const selectPullDir = document.getElementById('select-pull-dir');
    const selectPullTarget = document.getElementById('select-pull-target');
    const paramAttractor = document.getElementById('param-attractor');
    const paramShear = document.getElementById('param-shear');
    const paramBulge = document.getElementById('param-bulge');
    const paramStrokeExpand = document.getElementById('param-stroke-expand');
    const paramCurvature = document.getElementById('param-curvature');
    const paramSlitCut = document.getElementById('param-slit-cut');
    const paramSpacing = document.getElementById('param-spacing');
    const paramLineHeight = document.getElementById('param-line-height');

    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const btnPlay = document.getElementById('btn-play');
    const btnExport = document.getElementById('btn-export');

    /* 🧬 순수 UI 파라미터 기반 글리프 벡터장 변형기 */
    class GlyphGeometryEngine {
      static deformGlyph(commands, bbox, uiParams, isMajorChar = false, maxPullBudget = 220) {
        const w = Math.max(1, bbox.x2 - bbox.x1);
        const h = Math.max(1, bbox.y2 - bbox.y1);
        const cx = (bbox.x1 + bbox.x2) / 2;
        const cy = (bbox.y1 + bbox.y2) / 2;

        const {
          attractor,
          curvature,
          shearDeg,
          bulge,
          strokeExpand,
          pullDir
        } = uiParams;

        const shearRad = (-shearDeg * Math.PI) / 180;
        const tanShear = Math.tan(shearRad);

        const transformPoint = (x, y) => {
          let u = (x - cx) / (w * 0.5);
          let v = (y - cy) / (h * 0.5);

          // 1. 구형 중심 팽창
          if (bulge !== 0) {
            const distSq = u * u + v * v;
            const factor = 1.0 + bulge * 0.45 * Math.exp(-distSq * 0.85);
            u *= factor;
            v *= factor;
          }

          // 2. 비선형 곡률
          if (curvature !== 0) {
            v += curvature * 0.35 * (1.0 - u * u);
          }

          // 3. 전단각 (우상향 틸트)
          u += v * tanShear;

          let px = cx + u * (w * 0.5) * strokeExpand;
          let py = cy + v * (h * 0.5) * strokeExpand;

          // 4. UI로 지정된 방향에 따른 장획 어트랙터
          if (isMajorChar && attractor > 0.05) {
            if (pullDir === 'down') {
              if (v > 0.35) {
                const pullWeight = Math.pow((v - 0.35) / 0.65, 2.0);
                py += pullWeight * Math.min(maxPullBudget, h * 1.5 * attractor);
                px += Math.sin(pullWeight * Math.PI) * (w * 0.16);
              }
            } else if (pullDir === 'down-right') {
              if (v > 0.25 || u > 0.25) {
                const pullWeight = Math.pow(Math.max(0, (v + u) * 0.5), 1.8);
                px += pullWeight * Math.min(maxPullBudget * 0.6, w * 1.2 * attractor);
                py += pullWeight * Math.min(maxPullBudget, h * 1.5 * attractor);
              }
            } else if (pullDir === 'down-left') {
              if (u < 0.1 && v > 0.1) {
                const pullDist = Math.hypot(u - 0.1, v - 0.1);
                const pullWeight = Math.pow(Math.min(1.4, pullDist), 1.8);
                px -= pullWeight * Math.min(maxPullBudget * 0.6, w * 1.3 * attractor);
                py += pullWeight * Math.min(maxPullBudget, h * 1.5 * attractor);
              }
            } else if (pullDir === 'right') {
              if (u > 0.3) {
                const pullWeight = Math.pow((u - 0.3) / 0.7, 1.8);
                px += pullWeight * Math.min(maxPullBudget * 0.8, w * 1.4 * attractor);
                py -= pullWeight * (h * 0.2 * attractor);
              }
            }
          }

          return { x: px, y: py };
        };

        return commands.map(cmd => {
          const c = Object.assign({}, cmd);
          if (c.x !== undefined && c.y !== undefined) {
            const p = transformPoint(c.x, c.y);
            c.x = p.x; c.y = p.y;
          }
          if (c.x1 !== undefined && c.y1 !== undefined) {
            const p1 = transformPoint(c.x1, c.y1);
            c.x1 = p1.x; c.y1 = p1.y;
          }
          if (c.x2 !== undefined && c.y2 !== undefined) {
            const p2 = transformPoint(c.x2, c.y2);
            c.x2 = p2.x; c.y2 = p2.y;
          }
          return c;
        });
      }

      static renderCommands(targetCtx, commands) {
        targetCtx.beginPath();
        for (let i = 0; i < commands.length; i++) {
          const cmd = commands[i];
          switch (cmd.type) {
            case 'M': targetCtx.moveTo(cmd.x, cmd.y); break;
            case 'L': targetCtx.lineTo(cmd.x, cmd.y); break;
            case 'C': targetCtx.bezierCurveTo(cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.x, cmd.y); break;
            case 'Q': targetCtx.quadraticCurveTo(cmd.x1, cmd.y1, cmd.x, cmd.y); break;
            case 'Z': targetCtx.closePath(); break;
          }
        }
      }
    }

    /* 폰트 로드 */
    const FONT_URL = "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf";
    opentype.load(FONT_URL, (err, font) => {
      if (!err) {
        loadedFont = font;
        applyPresetToUI('p1');
      }
    });

    /* 갈필(飛白) 접선 절삭 */
    function applyDryBrush(targetCtx, w, h, slitIntensity) {
      if (slitIntensity <= 0.05) return;
      targetCtx.save();
      targetCtx.globalCompositeOperation = 'destination-out';
      const num = Math.floor(slitIntensity * 250);
      targetCtx.strokeStyle = 'rgba(0,0,0,0.85)';

      for (let i = 0; i < num; i++) {
        const sx = (Math.sin(i * 1.91) * 0.5 + 0.5) * w;
        const sy = (Math.cos(i * 2.73) * 0.5 + 0.5) * h;
        const len = (Math.sin(i * 4.1) * 0.5 + 0.5) * 45 + 15;
        const angle = (Math.sin(i * 3.3) * 0.25) + Math.PI * 0.45;
        targetCtx.lineWidth = (Math.sin(i * 5.7) * 0.5 + 0.5) * 2.0 + 0.6;
        targetCtx.beginPath();
        targetCtx.moveTo(sx, sy);
        targetCtx.lineTo(sx + Math.cos(angle) * len, sy + Math.sin(angle) * len);
        targetCtx.stroke();
      }
      targetCtx.restore();
    }

    /* 낙관 렌더링 */
    function drawSeal(targetCtx, x, y, size, type, text) {
      if (!type || type === 'none') return;
      targetCtx.save();
      const isRed = (type === 'seal-red');
      targetCtx.fillStyle = isRed ? '#bb1b27' : '#1f1e24';
      targetCtx.fillRect(x, y, size, size);

      targetCtx.strokeStyle = isRed ? '#e2303c' : '#33323d';
      targetCtx.lineWidth = 2;
      targetCtx.strokeRect(x, y, size, size);

      targetCtx.fillStyle = '#ffffff';
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';

      const str = text.trim() || '낙관';
      if (str.length <= 2) {
        targetCtx.font = `bold ${Math.round(size * 0.4)}px 'Batang', serif`;
        targetCtx.fillText(str[0], x + size / 2, y + size * 0.33);
        if (str[1]) targetCtx.fillText(str[1], x + size / 2, y + size * 0.72);
      } else {
        targetCtx.font = `bold ${Math.round(size * 0.3)}px 'Batang', serif`;
        targetCtx.fillText(str[0], x + size * 0.3, y + size * 0.32);
        targetCtx.fillText(str[1], x + size * 0.7, y + size * 0.32);
        targetCtx.fillText(str[2], x + size * 0.3, y + size * 0.72);
        targetCtx.fillText(str[3] || '', x + size * 0.7, y + size * 0.72);
      }
      targetCtx.restore();
    }

    /* =========================================================================
       📜 100% UI 입력값 기반 레이아웃 연산기
       ========================================================================= */
    function computeUILayout(text, bounds, uiParams) {
      const { w, h, marginX, marginY, availW, availH } = bounds;
      const {
        layoutPattern,
        decay,
        contrast,
        letterSpacing,
        lineHeightMult
      } = uiParams;

      let rawLines = text.split('\n').filter(l => l.trim().length > 0);
      if (rawLines.length === 0) rawLines = ["캘리그라피"];

      // 캔버스 가용 폭에 맞춘 자동 줄바꿈
      const maxCharsPerLine = Math.max(4, Math.floor(availW / 120));
      let processedLines = [];
      rawLines.forEach(l => {
        const chars = Array.from(l);
        if (chars.length > maxCharsPerLine && layoutPattern !== 'emblem-compact') {
          for (let i = 0; i < chars.length; i += maxCharsPerLine) {
            processedLines.push(chars.slice(i, i + maxCharsPerLine).join(''));
          }
        } else {
          processedLines.push(l);
        }
      });

      const lineCount = processedLines.length;
      let maxLineChars = Math.max(...processedLines.map(l => Array.from(l).length), 1);

      // 기본 글꼴 크기 산출
      let baseSize = availW / (maxLineChars * 0.85);
      const maxHeightBudget = availH / (lineCount * 1.2 * lineHeightMult);
      baseSize = Math.min(baseSize, maxHeightBudget);
      if (layoutPattern === 'emblem-compact') baseSize = Math.min(availW / (maxLineChars * 0.75), availH * 0.45);
      baseSize = Math.max(26, Math.min(220, baseSize));

      const lineLayouts = [];
      let currentY = marginY;

      const totalHeight = lineCount * baseSize * 1.15 * lineHeightMult;
      if (totalHeight < availH) {
        currentY = marginY + (availH - totalHeight) / 2;
      }

      processedLines.forEach((lineStr, lineIdx) => {
        const chars = Array.from(lineStr);
        let charScale = 1.0;

        // UI의 '주제어 대비'와 '점진 축소율(Decay)' 반영
        if (lineIdx === 0) {
          charScale = contrast;
        } else {
          charScale = Math.max(0.5, 1.0 / Math.pow(decay, lineIdx));
        }

        const fontSize = baseSize * charScale;
        const charAdvance = fontSize * 0.78 + letterSpacing;
        const lineWidth = chars.length * charAdvance;

        // UI의 '조형 구도 패턴'에 따른 X좌표 정렬
        let startX = (w - lineWidth) / 2; // 기본 중앙
        if (layoutPattern === 'stair-diagonal') {
          const step = (availW - lineWidth) / Math.max(1, lineCount - 1);
          startX = marginX + step * lineIdx;
        } else if (layoutPattern === 'block-headline') {
          startX = (w - lineWidth) / 2 + (lineIdx % 2 === 0 ? -25 : 25);
        }

        startX = Math.max(marginX, Math.min(w - marginX - lineWidth, startX));

        lineLayouts.push({
          chars,
          fontSize,
          charAdvance,
          startX,
          y: currentY + fontSize * 0.85,
          lineIdx,
          isLastLine: (lineIdx === lineCount - 1)
        });

        currentY += fontSize * 1.16 * lineHeightMult;
      });

      return { lineLayouts, baseSize };
    }

    /* 🏛️ 씬 렌더링 (순수 UI 컨트롤 값 취합) */
    function renderScene(progress = 1.0) {
      if (!loadedFont) return;
      const w = canvas.width, h = canvas.height;

      // 1. 배경
      const bg = selectBg.value;
      if (bg === 'white-hanji') {
        ctx.fillStyle = '#faf7f2';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(60, 50, 40, 0.015)';
        for (let i = 0; i < 240; i++) {
          ctx.beginPath();
          ctx.arc((Math.sin(i * 1.5)*0.5+0.5)*w, (Math.cos(i*2.7)*0.5+0.5)*h, 1.8, 0, Math.PI*2);
          ctx.fill();
        }
      } else if (bg === 'warm-hanji') {
        ctx.fillStyle = '#ede2cd';
        ctx.fillRect(0, 0, w, h);
      } else if (bg === 'dark-paper') {
        ctx.fillStyle = '#141418';
        ctx.fillRect(0, 0, w, h);
      } else {
        ctx.clearRect(0, 0, w, h);
      }

      // 2. 순수 UI 파라미터 취합 (숨겨진 내부 변수 없음)
      const uiParams = {
        layoutPattern: selectLayoutPattern.value,
        decay: parseFloat(paramDecay.value),
        contrast: parseFloat(paramContrast.value),
        pullDir: selectPullDir.value,
        pullTarget: selectPullTarget.value,
        attractor: parseFloat(paramAttractor.value),
        shearDeg: parseInt(paramShear.value),
        bulge: parseFloat(paramBulge.value),
        strokeExpand: parseFloat(paramStrokeExpand.value),
        curvature: parseFloat(paramCurvature.value),
        slitCut: parseFloat(paramSlitCut.value),
        letterSpacing: parseInt(paramSpacing.value),
        lineHeightMult: parseFloat(paramLineHeight.value),
        inkColor: inputInkColor.value,
        sealType: selectSeal.value,
        sealText: inputSealText.value,
        subText: inputSubtext.value.trim()
      };

      const bounds = {
        w, h,
        marginX: w * 0.08,
        marginY: h * 0.08,
        availW: w * 0.84,
        availH: h * 0.84
      };

      ctx.save();
      ctx.fillStyle = uiParams.inkColor;

      const rawText = inputText.value.trim();
      const { lineLayouts, baseSize } = computeUILayout(rawText, bounds, uiParams);

      // 3. 본문 렌더링 (UI가 지정한 대상에만 장획 적용)
      lineLayouts.forEach((line) => {
        let curX = line.startX;
        line.chars.forEach((ch, cIdx) => {
          let isMajor = false;
          if (uiParams.pullTarget === 'last-char') {
            isMajor = line.isLastLine && (cIdx === line.chars.length - 1);
          } else if (uiParams.pullTarget === 'first-char') {
            isMajor = (line.lineIdx === 0 && cIdx === 0);
          } else if (uiParams.pullTarget === 'line-ends') {
            isMajor = (cIdx === line.chars.length - 1);
          }

          const path = loadedFont.getPath(ch, 0, 0, line.fontSize);
          let bbox = { x1: 0, y1: -line.fontSize * 0.7, x2: line.fontSize * 0.7, y2: 0 };
          try { bbox = path.getBoundingBox(); } catch(e) {}

          const maxPullBudget = (bounds.h - line.y) * 0.85;
          const deformed = GlyphGeometryEngine.deformGlyph(path.commands, bbox, uiParams, isMajor, maxPullBudget);

          ctx.save();
          ctx.translate(curX, line.y);
          GlyphGeometryEngine.renderCommands(ctx, deformed);
          ctx.fill();
          ctx.restore();

          curX += line.charAdvance;
        });
      });

      // 4. 부제(SubText) 및 인장 배치
      const lastLine = lineLayouts[lineLayouts.length - 1];
      const sealSize = Math.min(54, Math.max(34, baseSize * 0.45));

      if (uiParams.subText) {
        const subLines = uiParams.subText.split('\n');
        const subFontSize = Math.min(26, baseSize * 0.32);
        let subY = Math.min(h - bounds.marginY, lastLine.y + baseSize * 0.55);

        ctx.fillStyle = '#222226';
        subLines.forEach((sLine) => {
          const sChars = Array.from(sLine);
          let subX = bounds.w - bounds.marginX - (sChars.length * subFontSize * 0.82);
          if (uiParams.layoutPattern === 'center') subX = (w - (sChars.length * subFontSize * 0.82)) / 2;

          sChars.forEach(sc => {
            const p = loadedFont.getPath(sc, 0, 0, subFontSize);
            let b = { x1: 0, y1: -20, x2: 20, y2: 0 };
            try { b = p.getBoundingBox(); } catch(e) {}
            const def = GlyphGeometryEngine.deformGlyph(p.commands, b, { ...uiParams, attractor: 0, bulge: 0 }, false);
            ctx.save();
            ctx.translate(subX, subY);
            GlyphGeometryEngine.renderCommands(ctx, def);
            ctx.fill();
            ctx.restore();
            subX += subFontSize * 0.82;
          });
          subY += subFontSize * 1.35;
        });

        if (uiParams.sealType !== 'none') {
          drawSeal(ctx, bounds.w - bounds.marginX - sealSize, subY - sealSize * 0.6, sealSize, uiParams.sealType, uiParams.sealText);
        }
      } else {
        if (uiParams.sealType !== 'none') {
          const sealX = Math.min(bounds.w - bounds.marginX - sealSize, lastLine.startX + (lastLine.chars.length * lastLine.charAdvance) + 15);
          const sealY = Math.min(bounds.h - bounds.marginY - sealSize, lastLine.y - sealSize * 0.8);
          drawSeal(ctx, sealX, sealY, sealSize, uiParams.sealType, uiParams.sealText);
        }
      }

      ctx.restore();

      // 5. 갈필 슬릿 절삭
      applyDryBrush(ctx, w, h, uiParams.slitCut);
    }

    /* ⚡ 프리셋 버튼 클릭 시 UI 컨트롤 요소들에 수치 그대로 세팅하기 */
    function applyPresetToUI(key) {
      const p = UI_PRESET_MAP[key];
      if (!p) return;

      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${key}`);
      if (activeBtn) activeBtn.classList.add('active');

      // 좌측 UI 동기화
      inputText.value = p.text;
      inputSubtext.value = p.subText;
      selectRatio.value = p.ratio;
      canvas.width = p.w;
      canvas.height = p.h;
      inputCanvasWidth.value = p.w;
      inputCanvasHeight.value = p.h;
      selectSeal.value = p.sealType;
      inputSealText.value = p.sealText;

      // 우측 UI 슬라이더 & 드롭다운 동기화
      selectLayoutPattern.value = p.layoutPattern;

      paramDecay.value = p.decay;
      document.getElementById('val-decay').textContent = `${p.decay}x`;

      paramContrast.value = p.contrast;
      document.getElementById('val-contrast').textContent = `${p.contrast}x`;

      selectPullDir.value = p.pullDir;
      selectPullTarget.value = p.pullTarget;

      paramAttractor.value = p.attractor;
      document.getElementById('val-attractor').textContent = `${p.attractor}x`;

      paramShear.value = p.shear;
      document.getElementById('val-shear').textContent = `${p.shear}°`;

      paramBulge.value = p.bulge;
      document.getElementById('val-bulge').textContent = p.bulge;

      paramStrokeExpand.value = p.strokeExpand;
      document.getElementById('val-stroke-expand').textContent = `${p.strokeExpand}x`;

      paramCurvature.value = p.curvature;
      document.getElementById('val-curvature').textContent = p.curvature;

      paramSlitCut.value = p.slitCut;
      document.getElementById('val-slit-cut').textContent = p.slitCut;

      paramSpacing.value = p.spacing;
      document.getElementById('val-spacing').textContent = `${p.spacing}px`;

      paramLineHeight.value = p.lineHeight;
      document.getElementById('val-line-height').textContent = `${p.lineHeight}x`;

      renderScene(1.0);
    }

    // 프리셋 버튼 리스너
    ['p1', 'p2', 'p3', 'p4', 'p5', 'p6'].forEach(key => {
      document.getElementById(`btn-${key}`).addEventListener('click', () => applyPresetToUI(key));
    });

    // 모든 슬라이더 입력 리스너
    const sliderIds = [
      'param-decay', 'param-contrast', 'param-attractor', 'param-shear',
      'param-bulge', 'param-strokeExpand', 'param-curvature', 'param-slitCut',
      'param-spacing', 'param-lineHeight'
    ];

    [paramDecay, paramContrast, paramAttractor, paramShear, paramBulge, paramStrokeExpand, paramCurvature, paramSlitCut, paramSpacing, paramLineHeight].forEach(el => {
      el.addEventListener('input', (e) => {
        const id = e.target.id;
        const v = e.target.value;
        if (id === 'param-decay') document.getElementById('val-decay').textContent = `${v}x`;
        if (id === 'param-contrast') document.getElementById('val-contrast').textContent = `${v}x`;
        if (id === 'param-attractor') document.getElementById('val-attractor').textContent = `${v}x`;
        if (id === 'param-shear') document.getElementById('val-shear').textContent = `${v}°`;
        if (id === 'param-bulge') document.getElementById('val-bulge').textContent = v;
        if (id === 'param-stroke-expand') document.getElementById('val-stroke-expand').textContent = `${v}x`;
        if (id === 'param-curvature') document.getElementById('val-curvature').textContent = v;
        if (id === 'param-slit-cut') document.getElementById('val-slit-cut').textContent = v;
        if (id === 'param-spacing') document.getElementById('val-spacing').textContent = `${v}px`;
        if (id === 'param-line-height') document.getElementById('val-line-height').textContent = `${v}x`;
        renderScene(1.0);
      });
    });

    // 모든 드롭다운 및 텍스트 인풋 리스너
    [
      selectLayoutPattern, selectPullDir, selectPullTarget, selectBg, selectSeal,
      inputInkColor, inputSealText, inputSubtext
    ].forEach(el => el.addEventListener('input', () => renderScene(1.0)));

    document.getElementById('btn-update-text').addEventListener('click', () => renderScene(1.0));

    // 해상도 조절
    selectRatio.addEventListener('change', (e) => {
      const r = e.target.value;
      if (r === '1:1') { canvas.width = 1440; canvas.height = 1440; }
      else if (r === '16:9') { canvas.width = 1920; canvas.height = 1080; }
      else if (r === '9:16') { canvas.width = 1080; canvas.height = 1920; }
      inputCanvasWidth.value = canvas.width;
      inputCanvasHeight.value = canvas.height;
      renderScene(1.0);
    });

    inputCanvasWidth.addEventListener('change', (e) => {
      selectRatio.value = 'custom';
      canvas.width = parseInt(e.target.value) || 1440;
      renderScene(1.0);
    });
    inputCanvasHeight.addEventListener('change', (e) => {
      selectRatio.value = 'custom';
      canvas.height = parseInt(e.target.value) || 1440;
      renderScene(1.0);
    });

    // MP4 인코딩
    btnExport.addEventListener('click', async () => {
      const modal = document.getElementById('render-modal');
      const bar = document.getElementById('render-bar');
      const pct = document.getElementById('render-pct');
      modal.style.display = 'flex';

      const fps = 30;
      const totalFrames = Math.ceil(totalDuration * fps);
      const stream = canvas.captureStream(fps);
      let mimeType = 'video/mp4';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 6_000_000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `calligraphy_custom_${canvas.width}x${canvas.height}_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
        a.click();
        modal.style.display = 'none';
      };

      recorder.start();
      let f = 0;
      const timer = setInterval(() => {
        if (f >= totalFrames) {
          clearInterval(timer);
          recorder.stop();
          return;
        }
        renderScene(f / totalFrames);
        const p = Math.round((f / totalFrames) * 100);
        bar.style.width = `${p}%`;
        pct.textContent = `${p}%`;
        f++;
      }, 1000 / fps);
    });
  </script>
</body>
