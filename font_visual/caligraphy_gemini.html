<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>캘리그램 패킹 생성기</title>
  <!-- Opentype.js 최신 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { margin: 0 0 16px 0; font-size: 22px; }
    .status-badge {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #27272a;
      color: #fbbf24;
      margin-bottom: 14px;
    }
    .status-badge.ready {
      background: #14532d;
      color: #4ade80;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    input, select, button {
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    button {
      background: #4f46e5;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #52525b; cursor: not-allowed; }
    .canvas-container {
      display: flex;
      gap: 20px;
      background: #09090b;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #27272a;
    }
    canvas {
      border: 1px solid #27272a;
      border-radius: 8px;
      background: #ffffff;
    }
    .label {
      text-align: center;
      margin-bottom: 8px;
      color: #a1a1aa;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h2>실루엣 마스크 캘리그라피 패킹</h2>
  <div id="status" class="status-badge">⏳ 폰트 리소스 로딩 중...</div>

  <div class="controls">
    <select id="fontSelect">
      <option value="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/otf/SUIT-ExtraBold.otf">SUIT 볼드체</option>
      <option value="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff">Gmarket 산스체</option>
    </select>
    <select id="shapeSelect">
      <option value="circle">원형 (Circle)</option>
      <option value="heart">하트 (Heart)</option>
      <option value="star">별 (Star)</option>
    </select>
    <input type="text" id="textInput" value="달빛 바람 소리 꽃잎 구름 새벽 별빛 침묵 바다 사랑 봄날 기억 흔적 고요 시간 울림" style="width: 380px;" />
    <button id="btnRun" disabled>패킹 시작</button>
  </div>

  <div class="canvas-container">
    <div>
      <div class="label">마스크 실루엣</div>
      <canvas id="maskCanvas" width="500" height="500"></canvas>
    </div>
    <div>
      <div class="label">캘리그램 패킹 결과</div>
      <canvas id="mainCanvas" width="500" height="500"></canvas>
    </div>
  </div>

<script>
const WIDTH = 500;
const HEIGHT = 500;

const maskCanvas = document.getElementById('maskCanvas');
const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

const mainCanvas = document.getElementById('mainCanvas');
const mainCtx = mainCanvas.getContext('2d');

const statusEl = document.getElementById('status');
const btnRun = document.getElementById('btnRun');
const fontSelect = document.getElementById('fontSelect');
const shapeSelect = document.getElementById('shapeSelect');

let loadedFont = null;
let occupancyGrid = null;

// 1. ArrayBuffer 방식으로 폰트 안전 로드 (CORS 문제 방지)
async function loadFontAuto(url) {
  statusEl.className = 'status-badge';
  statusEl.textContent = '⏳ 폰트 다운로드 및 파싱 중...';
  btnRun.disabled = true;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
    const buffer = await res.arrayBuffer();
    loadedFont = opentype.parse(buffer);

    statusEl.className = 'status-badge ready';
    statusEl.textContent = '✓ 폰트 준비 완료';
    btnRun.disabled = false;

    drawMask();
    runPacking();
  } catch (err) {
    console.error('폰트 로드 실패:', err);
    statusEl.textContent = '❌ 폰트 로드 실패. 다른 폰트를 선택해보세요.';
  }
}

// 2. 실루엣 마스크 드로잉
function drawMask() {
  maskCtx.fillStyle = '#ffffff';
  maskCtx.fillRect(0, 0, WIDTH, HEIGHT);
  maskCtx.fillStyle = '#000000';

  const shape = shapeSelect.value;
  maskCtx.beginPath();

  if (shape === 'heart') {
    maskCtx.moveTo(250, 420);
    maskCtx.bezierCurveTo(250, 390, 80, 270, 80, 170);
    maskCtx.bezierCurveTo(80, 80, 180, 80, 250, 160);
    maskCtx.bezierCurveTo(320, 80, 420, 80, 420, 170);
    maskCtx.bezierCurveTo(420, 270, 250, 390, 250, 420);
  } else if (shape === 'circle') {
    maskCtx.arc(250, 250, 190, 0, Math.PI * 2);
  } else if (shape === 'star') {
    const cx = 250, cy = 250, spikes = 5, outerRadius = 200, innerRadius = 90;
    let rot = Math.PI / 2 * 3;
    let x = cx, y = cy;
    const step = Math.PI / spikes;

    maskCtx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerRadius;
      y = cy + Math.sin(rot) * outerRadius;
      maskCtx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      maskCtx.lineTo(x, y);
      rot += step;
    }
    maskCtx.lineTo(cx, cy - outerRadius);
  }
  maskCtx.closePath();
  maskCtx.fill();

  initOccupancyGrid();
}

// 3. 점유 격자 맵 초기화
function initOccupancyGrid() {
  const imgData = maskCtx.getImageData(0, 0, WIDTH, HEIGHT);
  const data = imgData.data;
  occupancyGrid = new Uint8Array(WIDTH * HEIGHT);

  for (let i = 0; i < data.length; i += 4) {
    const isInside = data[i] < 128 && data[i+1] < 128 && data[i+2] < 128;
    occupancyGrid[i / 4] = isInside ? 1 : 0;
  }
}

// 4. 배치 영역 충돌 판별
function canPlaceWord(x, y, bbox) {
  const minX = Math.floor(x + bbox.x1);
  const maxX = Math.ceil(x + bbox.x2);
  const minY = Math.floor(y + bbox.y1);
  const maxY = Math.ceil(y + bbox.y2);

  if (minX < 0 || maxX >= WIDTH || minY < 0 || maxY >= HEIGHT) {
    return false;
  }

  // 글자 바운딩 박스 내부 픽셀 검사
  const step = 2;
  for (let py = minY; py <= maxY; py += step) {
    for (let px = minX; px <= maxX; px += step) {
      if (occupancyGrid[py * WIDTH + px] !== 1) {
        return false;
      }
    }
  }
  return true;
}

// 5. 점유 영역 마킹
function markOccupied(x, y, bbox) {
  const pad = 2;
  const minX = Math.max(0, Math.floor(x + bbox.x1) - pad);
  const maxX = Math.min(WIDTH - 1, Math.ceil(x + bbox.x2) + pad);
  const minY = Math.max(0, Math.floor(y + bbox.y1) - pad);
  const maxY = Math.min(HEIGHT - 1, Math.ceil(y + bbox.y2) + pad);

  for (let py = minY; py <= maxY; py++) {
    for (let px = minX; px <= maxX; px++) {
      occupancyGrid[py * WIDTH + px] = 2;
    }
  }
}

// 6. 패킹 실행
function runPacking() {
  if (!loadedFont || !occupancyGrid) return;

  mainCtx.fillStyle = '#ffffff';
  mainCtx.fillRect(0, 0, WIDTH, HEIGHT);

  const rawText = document.getElementById('textInput').value;
  const words = rawText.split(/\s+/).filter(w => w.trim().length > 0);
  const fontSizes = [56, 44, 34, 26, 20, 15, 12];

  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    let placed = false;

    for (let s = 0; s < fontSizes.length; s++) {
      const fontSize = fontSizes[s];
      const path = loadedFont.getPath(word, 0, 0, fontSize);
      const bbox = path.getBoundingBox();

      const centerX = WIDTH / 2;
      const centerY = HEIGHT / 2;
      const maxRadius = Math.min(WIDTH, HEIGHT) / 2;

      // 나선형 좌표 스캔
      for (let r = 0; r < maxRadius; r += 5) {
        for (let theta = 0; theta < Math.PI * 2; theta += 0.3) {
          const testX = Math.round(centerX + r * Math.cos(theta));
          const testY = Math.round(centerY + r * Math.sin(theta));

          if (canPlaceWord(testX, testY, bbox)) {
            loadedFont.draw(mainCtx, word, testX, testY, fontSize, { fill: '#18181b' });
            markOccupied(testX, testY, bbox);
            placed = true;
            break;
          }
        }
        if (placed) break;
      }
      if (placed) break;
    }
  }

  fillGaps();
}

// 7. 남은 잔여 공간 점 찍기
function fillGaps() {
  mainCtx.fillStyle = '#27272a';
  for (let y = 10; y < HEIGHT - 10; y += 7) {
    for (let x = 10; x < WIDTH - 10; x += 7) {
      const idx = y * WIDTH + x;
      if (occupancyGrid[idx] === 1) {
        mainCtx.beginPath();
        mainCtx.arc(x, y, Math.random() * 1.5 + 0.8, 0, Math.PI * 2);
        mainCtx.fill();
        occupancyGrid[idx] = 2;
      }
    }
  }
}

// 이벤트 바인딩
btnRun.addEventListener('click', () => {
  drawMask();
  runPacking();
});

shapeSelect.addEventListener('change', () => {
  drawMask();
  runPacking();
});

fontSelect.addEventListener('change', (e) => {
  loadFontAuto(e.target.value);
});

// 초기 실행
loadFontAuto(fontSelect.value);
</script>
</body>
</html>
