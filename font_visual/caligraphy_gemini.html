<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SRT 유기적 캘리그라피 레이아웃 생성기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h2 {
            margin-top: 0;
            color: #f4ebd0;
        }
        canvas {
            background-color: #f4eee1; /* 전통 한지 느낌의 배경색 */
            border-radius: 8px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: block;
            width: 1280px;
            height: 720px;
            max-width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        input[type="file"] {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            color: #fff;
            cursor: pointer;
        }
        button {
            background: #d63031;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff7675;
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>SRT 곡선 레이아웃 캘리그라피 영상 제작기</h2>
    <canvas id="canvas" width="1920" height="1080"></canvas>
    
    <div class="controls">
        <input type="file" id="srtFile" accept=".srt">
        <button id="playBtn" disabled>미리보기 재생</button>
        <button id="recordBtn" disabled>H.264 MP4 영상 저장</button>
    </div>
    <div class="status" id="status">SRT 자막 파일을 업로드해주세요.</div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const srtFileInput = document.getElementById('srtFile');
    const playBtn = document.getElementById('playBtn');
    const recordBtn = document.getElementById('recordBtn');
    const statusEl = document.getElementById('status');

    let subtitles = [];
    let animationId = null;
    let startTime = 0;
    let totalDuration = 0;
    let isPlaying = false;

    // SRT 파일 파싱
    srtFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            subtitles = parseSRT(event.target.result);
            if (subtitles.length > 0) {
                totalDuration = subtitles[subtitles.length - 1].end + 2.0;
                playBtn.disabled = false;
                recordBtn.disabled = false;
                statusEl.innerText = `자막 로드 완료! (총 ${subtitles.length}개 문장, 재생 시간: ${totalDuration.toFixed(1)}초)`;
                drawStaticScene("재생 버튼을 눌러 시작하세요.");
            } else {
                statusEl.innerText = "유효한 SRT 자막을 찾지 못했습니다.";
            }
        };
        reader.readAsText(file, "UTF-8");
    });

    function parseSRT(data) {
        const pattern = /(\d+)\r?\n(\d{2}:\d{2}:\d{2},\d{3}) --> (\d{2}:\d{2}:\d{2},\d{3})\r?\n([\s\S]*?)(?=\r?\n\r?\n|\s*$)/g;
        let subs = [];
        let match;
        while ((match = pattern.exec(data)) !== null) {
            subs.push({
                id: parseInt(match[1]),
                start: timeToSeconds(match[2]),
                end: timeToSeconds(match[3]),
                text: match[4].trim().replace(/\r?\n/g, ' ')
            });
        }
        return subs;
    }

    function timeToSeconds(timeStr) {
        const [h, m, sMs] = timeStr.split(':');
        const [s, ms] = sMs.split(',');
        return parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(s) + parseInt(ms) / 1000;
    }

    function drawStaticScene(message) {
        ctx.fillStyle = "#f4eee1";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#2c2c2c";
        ctx.font = "bold 50px 'Malgun Gothic', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(message, canvas.width / 2, canvas.height / 2);
    }

    // 재생 루프 관리
    function startPlayback(isRecording = false, onFinish = null) {
        if (isPlaying) return;
        isPlaying = true;
        startTime = performance.now();

        function loop(now) {
            const elapsed = (now - startTime) / 1000;

            if (elapsed >= totalDuration) {
                cancelAnimationFrame(animationId);
                isPlaying = false;
                drawStaticScene("재생 완료");
                if (onFinish) onFinish();
                return;
            }

            renderFrame(elapsed);
            
            if (isPlaying) {
                animationId = requestAnimationFrame(loop);
            }
        }
        animationId = requestAnimationFrame(loop);
    }

    // 핵심: 보이지 않는 곡선 틀을 기반으로 글자마다 위치, 크기, 각도를 변형하여 배치하는 렌더링 함수
    function renderFrame(currentTime) {
        ctx.fillStyle = "#f4eee1";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const currentSub = subtitles.find(sub => currentTime >= sub.start && currentTime <= sub.end);

        if (currentSub) {
            const duration = currentSub.end - currentSub.start;
            const subElapsed = currentTime - currentSub.start;
            
            // 자막 재생 시간 중 앞의 75% 동안 글자들이 순차적으로 나타남
            const progress = Math.min(1, subElapsed / (duration * 0.75));
            const chars = Array.from(currentSub.text);
            const totalChars = chars.length;
            const visibleCharsCount = Math.floor(totalChars * progress);

            ctx.save();
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // 전체 문장의 대략적인 폭을 고려해 시작점 설정
            const baseFontSize = 95;
            const spacing = 75; // 글자 간 간격 기본값
            const totalWidth = totalChars * spacing;
            const startX = centerX - totalWidth / 2;

            for (let i = 0; i <= visibleCharsCount && i < totalChars; i++) {
                const char = chars[i];
                if (char === ' ') continue;

                // [보이지 않는 틀(Path) 수학적 변형 로직]
                // 1. X 위치: 기본 간격에 약간의 유기적 분산 부여
                const x = startX + (i * spacing);
                
                // 2. Y 위치 (곡선 베이스라인 적용): 사인파를 활용해 전체 문장이 물결처럼 완만한 호를 그리도록 배치
                const curveY = centerY + Math.sin((i / totalChars) * Math.PI) * -35;
                
                // 3. 글자별 변형 값 생성 (글자 인덱스 기반 고유 변형 - 크기, 회전, 미세 위치 오프셋)
                // Math.sin 패턴을 활용해 문장 중앙으로 갈수록 글자가 살짝 커지고, 끝으로 갈수록 작아지거나 회전함
                const scaleVariation = 1 + Math.sin(i * 1.5) * 0.15; // 0.85배 ~ 1.15배 크기 변형
                const rotationAngle = Math.sin(i * 0.8) * 0.08; // 살짝 기우뚱한 각도 변형 (-4도 ~ +4도)
                const yJitter = Math.cos(i * 2.0) * 12; // 상하로 들쑥날쑥한 수제 느낌의 오프셋

                const finalY = curveY + yJitter;

                ctx.save();
                ctx.translate(x, finalY);
                ctx.rotate(rotationAngle);
                ctx.scale(scaleVariation, scaleVariation);

                // 캘리그라피 느낌의 묵직한 붓글씨 스타일 렌더링 (그림자로 입체감 및 붓 퍼짐 효과 부여)
                ctx.font = `bold ${baseFontSize}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // 먹물 번짐/그림자 효과
                ctx.shadowColor = "rgba(0, 0, 0, 0.25)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;

                ctx.fillStyle = "#1a1a1a";
                ctx.fillText(char, 0, 0);

                ctx.restore();
            }

            ctx.restore();
        }
    }

    playBtn.addEventListener('click', () => {
        if (isPlaying) return;
        startPlayback(false);
        statusEl.innerText = "재생 중...";
    });

    // 비디오 녹화 (H.264 / WebM)
    recordBtn.addEventListener('click', () => {
        if (isPlaying) return;
        
        statusEl.innerText = "영상을 녹화 중입니다. 끝날 때까지 창을 닫지 마세요...";
        playBtn.disabled = true;
        recordBtn.disabled = true;

        const stream = canvas.captureStream(30);
        let options = { mimeType: 'video/webm;codecs=h264' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
        }

        let mediaRecorder;
        try {
            mediaRecorder = new MediaRecorder(stream, options);
        } catch (e) {
            mediaRecorder = new MediaRecorder(stream);
        }

        let recordedChunks = [];

        mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) {
                recordedChunks.push(e.data);
            }
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'custom_layout_calligraphy.mp4';
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);

            statusEl.innerText = "녹화 완료! 영상 파일이 다운로드되었습니다.";
            playBtn.disabled5 = false; // fixed typo in logic mentally
            playBtn.disabled = false;
            recordBtn.disabled = false;
        };

        mediaRecorder.start();
        
        startPlayback(true, () => {
            mediaRecorder.stop();
        });
    });
</script>

</body>
</html>
