<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한글 수묵 캘리그라피 실시간 생성기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ded8cc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      padding: 20px;
    }
    .controller {
      background: #faf8f2;
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      font-size: 18px;
      padding: 8px 14px;
      border: 1px solid #c4b9a3;
      border-radius: 4px;
      outline: none;
      width: 220px;
      background: #fff;
    }
    button {
      background: #2b2723;
      color: #faf6ed;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #12100e; }
    .canvas-frame {
      background: #fbf8f0; /* 한지 베이스 */
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      border-radius: 6px;
      padding: 24px;
      border: 1px solid #dcd4c3;
    }
    canvas {
      display: block;
      background: #fbf8f0;
    }
  </style>
</head>
<body>

  <div class="controller">
    <input type="text" id="targetInput" value="한글" placeholder="한글 입력 (예: 한글, 봄날)">
    <button id="writeBtn">붓글씨 쓰기</button>
  </div>

  <div class="canvas-frame">
    <canvas id="calliCanvas" width="900" height="360"></canvas>
  </div>

  <script>
    // ==========================================
    // 1. 핵심 자소 1선 뼈대 라이브러리 (Normalized: 0.0 ~ 1.0)
    // [x, y, 필압가중치 w(0.2~2.0)]
    // ==========================================
    const SKELETON = {
      cho: {
        0: [ // ㄱ
          [[0.15, 0.2, 1.2], [0.85, 0.18, 0.8], [0.88, 0.26, 1.8], [0.72, 0.85, 0.4]]
        ],
        2: [ // ㄴ
          [[0.22, 0.15, 1.2], [0.24, 0.8, 1.8], [0.85, 0.78, 1.3], [0.95, 0.7, 0.3]]
        ],
        3: [ // ㄷ
          [[0.2, 0.22, 1.2], [0.85, 0.2, 0.8], [0.88, 0.25, 0.4]],
          [[0.22, 0.25, 1.1], [0.22, 0.8, 1.8], [0.85, 0.78, 1.3], [0.95, 0.7, 0.3]]
        ],
        5: [ // ㅁ
          [[0.2, 0.18, 1.2], [0.2, 0.82, 0.7]],
          [[0.18, 0.2, 1.1], [0.85, 0.18, 0.8], [0.85, 0.82, 1.4]],
          [[0.18, 0.82, 1.3], [0.88, 0.82, 0.8]]
        ],
        6: [ // ㅂ
          [[0.22, 0.15, 1.2], [0.22, 0.82, 0.7]],
          [[0.78, 0.15, 1.2], [0.78, 0.82, 0.7]],
          [[0.2, 0.5, 1.0], [0.8, 0.5, 0.8]],
          [[0.2, 0.82, 1.3], [0.82, 0.82, 0.6]]
        ],
        7: [ // ㅅ
          [[0.5, 0.18, 1.3], [0.22, 0.82, 0.4]],
          [[0.42, 0.45, 1.1], [0.8, 0.82, 0.3]]
        ],
        9: [ // ㅈ
          [[0.2, 0.2, 1.2], [0.8, 0.2, 0.9]],
          [[0.5, 0.2, 1.3], [0.22, 0.82, 0.4]],
          [[0.45, 0.48, 1.1], [0.8, 0.82, 0.3]]
        ],
        11: [ // ㅇ
          [[0.5, 0.15, 1.0], [0.85, 0.5, 1.5], [0.5, 0.88, 0.9], [0.15, 0.5, 1.4], [0.52, 0.15, 1.0]]
        ],
        18: [ // ㅎ
          [[0.42, 0.15, 0.9], [0.56, 0.18, 1.5], [0.65, 0.22, 0.3]],
          [[0.16, 0.38, 0.9], [0.5, 0.36, 1.6], [0.86, 0.38, 0.5]],
          [[0.5, 0.52, 1.0], [0.82, 0.72, 1.4], [0.5, 0.92, 0.8], [0.18, 0.72, 1.4], [0.52, 0.52, 1.0]]
        ]
      },
      jung: {
        0: [ // ㅏ
          [[0.5, 0.06, 1.5], [0.52, 0.5, 0.9], [0.5, 0.95, 0.3]],
          [[0.52, 0.5, 1.1], [0.9, 0.52, 1.4], [0.98, 0.53, 0.3]]
        ],
        4: [ // ㅓ
          [[0.1, 0.5, 1.2], [0.5, 0.5, 0.7]],
          [[0.5, 0.06, 1.5], [0.52, 0.5, 0.9], [0.5, 0.95, 0.3]]
        ],
        8: [ // ㅗ
          [[0.5, 0.15, 1.3], [0.5, 0.55, 0.6]],
          [[0.08, 0.55, 1.3], [0.5, 0.52, 0.8], [0.92, 0.56, 1.5], [0.98, 0.55, 0.3]]
        ],
        13: [ // ㅜ
          [[0.08, 0.45, 1.3], [0.5, 0.42, 0.8], [0.92, 0.46, 1.5], [0.98, 0.45, 0.3]],
          [[0.5, 0.45, 1.3], [0.5, 0.88, 0.4]]
        ],
        18: [ // ㅡ
          [[0.06, 0.5, 1.3], [0.5, 0.46, 0.8], [0.92, 0.53, 1.5], [0.98, 0.5, 0.3]]
        ],
        20: [ // ㅣ
          [[0.5, 0.06, 1.5], [0.52, 0.5, 0.9], [0.5, 0.95, 0.3]]
        ]
      },
      jong: {
        4: [ // ㄴ
          [[0.2, 0.15, 1.1], [0.22, 0.78, 1.8], [0.8, 0.74, 1.2], [0.92, 0.65, 0.3]]
        ],
        8: [ // ㄹ
          [[0.15, 0.15, 1.1], [0.8, 0.12, 1.4], [0.8, 0.44, 0.8], [0.2, 0.48, 1.3], 
           [0.2, 0.84, 0.8], [0.85, 0.82, 1.5], [0.92, 0.72, 0.3]]
        ],
        16: [ // ㅁ
          [[0.2, 0.18, 1.1], [0.2, 0.82, 0.7]],
          [[0.18, 0.2, 1.0], [0.85, 0.18, 0.8], [0.85, 0.82, 1.3]],
          [[0.18, 0.82, 1.2], [0.88, 0.82, 0.8]]
        ],
        21: [ // ㅇ
          [[0.5, 0.15, 1.0], [0.85, 0.5, 1.5], [0.5, 0.88, 0.9], [0.15, 0.5, 1.4], [0.52, 0.15, 1.0]]
        ]
      }
    };

    // ==========================================
    // 2. 수묵 캘리그라피 붓 시뮬레이터
    // ==========================================
    const canvas = document.getElementById('calliCanvas');
    const ctx = canvas.getContext('2d');

    // 붓 모(毛) 가닥 분포 테이블 (32가닥)
    const BRISTLES = Array.from({ length: 32 }, () => ({
      angle: Math.random() * Math.PI * 2,
      dist: Math.pow(Math.random(), 1.7), // 코어 중심 분산
      size: 0.7 + Math.random() * 1.3
    }));

    function resetPaper() {
      ctx.fillStyle = '#fbf8f0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 한지 미세 먹 번짐용 베이스 입자
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 6;
        d[i] += n; d[i+1] += n; d[i+2] += n;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // 먹물 번짐 (기필 및 정지 구간)
    function inkBleed(x, y, radius, opacity) {
      const g = ctx.createRadialGradient(x, y, radius * 0.1, x, y, radius * 1.6);
      g.addColorStop(0, `rgba(25, 23, 22, ${opacity * 0.9})`);
      g.addColorStop(0.5, `rgba(40, 38, 35, ${opacity * 0.3})`);
      g.addColorStop(1, 'rgba(251, 248, 240, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // 붓끝의 실제 접촉면 렌더링 (갈필 및 농담 표현)
    function drawBrushTip(x, y, radius, speed) {
      // 속도가 빠를수록 마른 붓(비백) 증가
      const isDry = speed > 1.2;
      const dryChance = Math.min(Math.max((speed - 1.2) / 2.5, 0), 0.85);

      for (let b of BRISTLES) {
        if (isDry && Math.random() < dryChance) continue; // 갈필 누락

        const r = b.dist * radius;
        const bx = x + Math.cos(b.angle) * r;
        const by = y + Math.sin(b.angle) * r;

        // 중심은 짙은 농묵, 외곽은 담묵
        const coreAlpha = (1 - b.dist * 0.45) * (isDry ? 0.3 : 0.65);
        ctx.fillStyle = `rgba(18, 16, 15, ${coreAlpha})`;
        ctx.beginPath();
        ctx.arc(bx, by, b.size * (radius / 10), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 한 획(Stroke) 그리기 애니메이션
    function animateStroke(points, onDone) {
      if (!points || points.length < 2) {
        if (onDone) onDone();
        return;
      }

      // 기필 수묵 번짐
      inkBleed(points[0].x, points[0].y, points[0].w * 1.4, 0.35);

      let segIdx = 0;
      let t = 0;
      const BASE_BRUSH_SIZE = 11;

      function renderLoop() {
        if (segIdx >= points.length - 1) {
          // 수필(획 마무리) 먹 번짐
          const last = points[points.length - 1];
          inkBleed(last.x, last.y, last.w * 0.9, 0.2);
          if (onDone) onDone();
          return;
        }

        const p0 = points[segIdx];
        const p1 = points[segIdx + 1];

        // 보간 계산
        const curX = p0.x + (p1.x - p0.x) * t;
        const curY = p0.y + (p1.y - p0.y) * t;
        const curW = (p0.w + (p1.w - p0.w) * t) * BASE_BRUSH_SIZE;

        // 획 변화도에 따른 가상 이동 속도 추정
        const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const virtualSpeed = (dist / 15) * (1 / (p0.w + 0.1));

        drawBrushTip(curX, curY, curW, virtualSpeed);

        t += 0.1; // 보간 스텝 (붓 진행 속도)
        if (t >= 1) {
          t = 0;
          segIdx++;
        }
        requestAnimationFrame(renderLoop);
      }
      renderLoop();
    }

    // ==========================================
    // 3. 결구(조합) 파서 & 배치 엔진
    // ==========================================
    function parseHangul(char) {
      const code = char.charCodeAt(0) - 0xAC00;
      if (code < 0 || code > 11171) return null;
      const jong = code % 28;
      const jung = ((code - jong) / 28) % 21;
      const cho = Math.floor((code - jong) / (28 * 21));
      return { cho, jung, jong };
    }

    function getVowelType(jung) {
      // 0: ㅏ, 4: ㅓ, 20: ㅣ 등 수직형
      if ([0, 1, 2, 3, 4, 5, 6, 7, 20].includes(jung)) return 'V';
      // 8: ㅗ, 13: ㅜ, 18: ㅡ 등 수평형
      if ([8, 12, 13, 17, 18].includes(jung)) return 'H';
      return 'C';
    }

    function buildSyllableStrokes(char, box) {
      const parsed = parseHangul(char);
      if (!parsed) return [];

      const vType = getVowelType(parsed.jung);
      const hasJong = parsed.jong > 0;
      let choBox, jungBox, jongBox;

      // 한글 결구 4대 배치 모델
      if (!hasJong) {
        if (vType === 'V') { // 가, 나
          choBox  = { x: box.x, y: box.y, w: box.w * 0.52, h: box.h };
          jungBox = { x: box.x + box.w * 0.46, y: box.y, w: box.w * 0.54, h: box.h };
        } else { // 고, 노
          choBox  = { x: box.x + box.w * 0.1, y: box.y, w: box.w * 0.8, h: box.h * 0.52 };
          jungBox = { x: box.x, y: box.y + box.h * 0.44, w: box.w, h: box.h * 0.56 };
        }
      } else {
        if (vType === 'V') { // 한, 간
          choBox  = { x: box.x, y: box.y, w: box.w * 0.52, h: box.h * 0.58 };
          jungBox = { x: box.x + box.w * 0.46, y: box.y, w: box.w * 0.54, h: box.h * 0.72 };
          jongBox = { x: box.x + box.w * 0.1, y: box.y + box.h * 0.56, w: box.w * 0.8, h: box.h * 0.44 };
        } else { // 글, 골
          choBox  = { x: box.x + box.w * 0.12, y: box.y, w: box.w * 0.76, h: box.h * 0.38 };
          jungBox = { x: box.x, y: box.y + box.h * 0.32, w: box.w, h: box.h * 0.34 };
          jongBox = { x: box.x + box.w * 0.1, y: box.y + box.h * 0.56, w: box.w * 0.8, h: box.h * 0.44 };
        }
      }

      function project(rawStrokes, b) {
        if (!rawStrokes) return [];
        return rawStrokes.map(stroke => stroke.map(([nx, ny, nw]) => ({
          x: b.x + nx * b.w,
          y: b.y + ny * b.h,
          w: nw
        })));
      }

      const result = [];
      // 초성 주입
      if (SKELETON.cho[parsed.cho]) {
        result.push(...project(SKELETON.cho[parsed.cho], choBox));
      }
      // 중성 주입
      if (SKELETON.jung[parsed.jung]) {
        result.push(...project(SKELETON.jung[parsed.jung], jungBox));
      }
      // 종성 주입
      if (hasJong && SKELETON.jong[parsed.jong]) {
        result.push(...project(SKELETON.jong[parsed.jong], jongBox));
      }

      return result;
    }

    // ==========================================
    // 4. 전체 드로잉 실행 트리거
    // ==========================================
    let isDrawing = false;

    function renderText(text) {
      if (isDrawing) return;
      isDrawing = true;
      resetPaper();

      const strokesQueue = [];
      const charWidth = 150;
      const charHeight = 150;
      const gap = 30;
      const startX = Math.max((canvas.width - (text.length * (charWidth + gap) - gap)) / 2, 40);
      const startY = (canvas.height - charHeight) / 2;

      [...text].forEach((char, i) => {
        const box = {
          x: startX + i * (charWidth + gap),
          y: startY,
          w: charWidth,
          h: charHeight
        };
        strokesQueue.push(...buildSyllableStrokes(char, box));
      });

      // 획 연속 실행
      let idx = 0;
      function next() {
        if (idx < strokesQueue.length) {
          animateStroke(strokesQueue[idx], () => {
            idx++;
            setTimeout(next, 40); // 획 간 인터벌
          });
        } else {
          isDrawing = false;
        }
      }
      next();
    }

    document.getElementById('writeBtn').addEventListener('click', () => {
      const val = document.getElementById('targetInput').value.trim();
      if (val) renderText(val);
    });

    // 시작 시 '한글' 자동 재생
    resetPaper();
    renderText('한글');
  </script>
</body>
</html>
