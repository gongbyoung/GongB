<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>동양 서예 사각 편봉 캘리그라피 엔진</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #dcd6c8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, sans-serif;
    }
    .controller {
      background: #fbf9f4;
      padding: 14px 20px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      font-size: 17px;
      padding: 8px 12px;
      border: 1px solid #baa892;
      border-radius: 4px;
      outline: none;
      width: 200px;
    }
    button {
      background: #25221e;
      color: #f5f2eb;
      border: none;
      padding: 9px 18px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #000; }
    .canvas-wrap {
      background: #faf6ed;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-radius: 4px;
      padding: 24px;
      border: 1px solid #d4c8b2;
    }
    canvas { display: block; background: #faf6ed; }
  </style>
</head>
<body>

  <div class="controller">
    <input type="text" id="targetInput" value="한글">
    <button id="writeBtn">다시 쓰기</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="calliCanvas" width="860" height="340"></canvas>
  </div>

  <script>
    // ==========================================================
    // 1. 논문 기반 자소 골격: 가로획에 '잠두-연미(머리/꼬리 맺음)' 삼절점 추가
    // [x, y, 필압 w]
    // ==========================================================
    const SKELETON = {
      cho: {
        0: [ // ㄱ: 가로로 뻗다가 꺾임(전절)에서 붓을 눌러 꺾음
          [[0.15, 0.24, 1.4], [0.18, 0.20, 1.1], [0.55, 0.19, 0.7], [0.82, 0.17, 1.3], [0.88, 0.26, 1.9], [0.72, 0.85, 0.3]]
        ],
        18: [ // ㅎ: 상단 점, 가로획(머리와 꼬리가 살아있음), 원형
          [[0.44, 0.14, 0.8], [0.52, 0.18, 1.5], [0.60, 0.22, 0.4]],
          // 가로획: 기필 역입 -> 행필 가늘게 -> 수필 눌러 맺음
          [[0.14, 0.44, 1.3], [0.18, 0.39, 0.9], [0.50, 0.37, 0.7], [0.82, 0.36, 1.2], [0.88, 0.42, 1.5], [0.84, 0.44, 0.5]],
          [[0.5, 0.54, 0.9], [0.82, 0.72, 1.3], [0.5, 0.92, 0.8], [0.18, 0.72, 1.3], [0.52, 0.54, 0.9]]
        ]
      },
      jung: {
        0: [ // ㅏ: 세로 기둥 + 가로 곁가지(잠두/연미)
          [[0.50, 0.05, 1.6], [0.52, 0.45, 0.85], [0.50, 0.95, 0.3]],
          [[0.51, 0.48, 1.2], [0.72, 0.50, 0.8], [0.92, 0.50, 1.5], [0.98, 0.55, 0.4]]
        ],
        18: [ // ㅡ: 대표적 가로획. (1) 사각 머리 역입 (2) 중간 갈필 (3) 끝에서 붓을 멈추고 뉨
          [[0.06, 0.53, 1.5], [0.12, 0.47, 1.0], [0.48, 0.46, 0.65], [0.84, 0.48, 1.2], [0.94, 0.54, 1.7], [0.98, 0.51, 0.4]]
        ]
      },
      jong: {
        4: [ // ㄴ: 세로 내리기 -> 꺾임 강압 -> 가로 뻗침
          [[0.22, 0.14, 1.2], [0.24, 0.76, 1.9], [0.60, 0.74, 0.8], [0.85, 0.72, 1.3], [0.94, 0.68, 0.3]]
        ],
        8: [ // ㄹ: 가로-세로-가로-세로-가로의 리듬감
          [[0.14, 0.18, 1.3], [0.5, 0.15, 0.7], [0.82, 0.13, 1.4], [0.80, 0.44, 0.8],
           [0.24, 0.48, 1.3], [0.22, 0.82, 0.8], [0.60, 0.80, 0.7], [0.88, 0.80, 1.5], [0.94, 0.74, 0.3]]
        ]
      }
    };

    // ==========================================================
    // 2. 45° 사각 편봉(Slanted Flat Bristle) 수묵 엔진
    // ==========================================================
    const canvas = document.getElementById('calliCanvas');
    const ctx = canvas.getContext('2d');

    // 붓의 털(모)을 45도 기울어진 납작한 띠(Chisel Ribbon) 형태로 배치
    const BRISTLE_COUNT = 36;
    const BRISTLES = Array.from({ length: BRISTLE_COUNT }, (_, i) => {
      // -1.0 ~ 1.0 선형 분포
      const offset = (i / (BRISTLE_COUNT - 1)) * 2 - 1;
      return {
        offset: offset,
        // 중심부는 붓털이 빽빽하고 외곽은 흩어짐
        jitter: (Math.random() - 0.5) * 0.25,
        thickness: 0.7 + Math.random() * 0.8
      };
    });

    function resetPaper() {
      ctx.fillStyle = '#faf6ed';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 45도 편봉 붓터치 투영 함수
    function drawSlantedBrush(x, y, radius, angle, speed) {
      // 서예 붓의 고유 붓각: 약 40도 (Math.PI * 0.22)
      const slantAngle = Math.PI * 0.22;
      
      // 진행 방향과 붓 각도의 차이에 따른 마찰 연산
      // 가로획을 그을 때 붓털의 결(Striation)이 찢어지도록 갈필 확률 계산
      const isDry = speed > 0.9;
      const dryChance = Math.min(Math.max((speed - 0.9) / 2.0, 0), 0.75);

      for (let b of BRISTLES) {
        // 빠른 행필에서 붓털이 종이에서 뜨는 '비백(갈필)' 처리
        if (isDry && Math.random() < dryChance) continue;

        // 45도 축을 기준으로 붓털 위치를 펼침 (사각 브러시 효과)
        const d = (b.offset + b.jitter) * radius;
        const bx = x + Math.cos(slantAngle) * d;
        const by = y + Math.sin(slantAngle) * d;

        // 중심부는 농묵(짙음), 가장자리는 담묵(옅음)
        const density = 1 - Math.abs(b.offset) * 0.45;
        const alpha = (isDry ? 0.35 : 0.6) * density;

        ctx.fillStyle = `rgba(18, 16, 14, ${alpha})`;
        ctx.beginPath();
        // 개별 붓털도 둥글지 않고 약간 납작한 타원으로 찍음
        ctx.ellipse(bx, by, b.thickness * 1.5, b.thickness * 0.9, slantAngle, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 잠두(기필) 및 맺음(수필) 먹물 고임
    function inkBlot(x, y, radius, opacity) {
      const g = ctx.createRadialGradient(x, y, radius * 0.1, x, y, radius * 1.5);
      g.addColorStop(0, `rgba(20, 18, 16, ${opacity})`);
      g.addColorStop(0.6, `rgba(45, 42, 38, ${opacity * 0.35})`);
      g.addColorStop(1, 'rgba(250, 246, 237, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 획 보간 드로잉
    function animateStroke(points, onDone) {
      if (!points || points.length < 2) {
        if (onDone) onDone();
        return;
      }

      // 기필 잠두 먹점
      inkBlot(points[0].x, points[0].y, points[0].w * 12, 0.4);

      let segIdx = 0;
      let t = 0;
      const BASE_SIZE = 9.5;

      function step() {
        if (segIdx >= points.length - 1) {
          // 수필 맺음 먹점
          const end = points[points.length - 1];
          inkBlot(end.x, end.y, end.w * 8, 0.25);
          if (onDone) onDone();
          return;
        }

        const p0 = points[segIdx];
        const p1 = points[segIdx + 1];

        const curX = p0.x + (p1.x - p0.x) * t;
        const curY = p0.y + (p1.y - p0.y) * t;
        const curW = (p0.w + (p1.w - p0.w) * t) * BASE_SIZE;

        const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const speed = (dist / 14) * (1 / (curW * 0.1 + 0.3));

        drawSlantedBrush(curX, curY, curW, 0, speed);

        t += 0.08; // 드로잉 밀도
        if (t >= 1) {
          t = 0;
          segIdx++;
        }
        requestAnimationFrame(step);
      }
      step();
    }

    // ==========================================================
    // 3. 결구(초·중·종) 파싱
    // ==========================================================
    function parseHangul(char) {
      const code = char.charCodeAt(0) - 0xAC00;
      if (code < 0 || code > 11171) return null;
      return {
        cho: Math.floor((code - (code % 28)) / (28 * 21)),
        jung: Math.floor(((code - (code % 28)) / 28) % 21),
        jong: code % 28
      };
    }

    function buildStrokes(char, box) {
      const p = parseHangul(char);
      if (!p) return [];

      const isV = [0, 1, 2, 3, 4, 5, 6, 7, 20].includes(p.jung);
      const hasJong = p.jong > 0;
      let cBox, uBox, oBox;

      if (!hasJong) {
        if (isV) {
          cBox = { x: box.x, y: box.y, w: box.w * 0.52, h: box.h };
          uBox = { x: box.x + box.w * 0.46, y: box.y, w: box.w * 0.54, h: box.h };
        } else {
          cBox = { x: box.x + box.w * 0.1, y: box.y, w: box.w * 0.8, h: box.h * 0.52 };
          uBox = { x: box.x, y: box.y + box.h * 0.44, w: box.w, h: box.h * 0.56 };
        }
      } else {
        if (isV) {
          cBox = { x: box.x, y: box.y, w: box.w * 0.52, h: box.h * 0.58 };
          uBox = { x: box.x + box.w * 0.46, y: box.y, w: box.w * 0.54, h: box.h * 0.72 };
          oBox = { x: box.x + box.w * 0.1, y: box.y + box.h * 0.56, w: box.w * 0.8, h: box.h * 0.44 };
        } else {
          cBox = { x: box.x + box.w * 0.12, y: box.y, w: box.w * 0.76, h: box.h * 0.38 };
          uBox = { x: box.x, y: box.y + box.h * 0.32, w: box.w, h: box.h * 0.34 };
          oBox = { x: box.x + box.w * 0.1, y: box.y + box.h * 0.56, w: box.w * 0.8, h: box.h * 0.44 };
        }
      }

      const mapCoords = (arr, b) => (arr || []).map(s => s.map(([x, y, w]) => ({
        x: b.x + x * b.w,
        y: b.y + y * b.h,
        w: w
      })));

      const res = [];
      if (SKELETON.cho[p.cho]) res.push(...mapCoords(SKELETON.cho[p.cho], cBox));
      if (SKELETON.jung[p.jung]) res.push(...mapCoords(SKELETON.jung[p.jung], uBox));
      if (hasJong && SKELETON.jong[p.jong]) res.push(...mapCoords(SKELETON.jong[p.jong], oBox));
      return res;
    }

    // ==========================================================
    // 4. 실행 파이프라인
    // ==========================================================
    let isDrawing = false;
    function render(text) {
      if (isDrawing) return;
      isDrawing = true;
      resetPaper();

      const queue = [];
      const charW = 150, charH = 150, gap = 30;
      const startX = Math.max((canvas.width - (text.length * (charW + gap) - gap)) / 2, 40);
      const startY = (canvas.height - charH) / 2;

      [...text].forEach((ch, i) => {
        queue.push(...buildStrokes(ch, { x: startX + i * (charW + gap), y: startY, w: charW, h: charH }));
      });

      let i = 0;
      function next() {
        if (i < queue.length) {
          animateStroke(queue[i], () => {
            i++;
            setTimeout(next, 35);
          });
        } else {
          isDrawing = false;
        }
      }
      next();
    }

    document.getElementById('writeBtn').addEventListener('click', () => {
      render(document.getElementById('targetInput').value.trim());
    });

    resetPaper();
    render('한글');
  </script>
</body>
</html>
