<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알고리즘 기반 한글 벡터 캘리그라피 엔진 (v34.0)</title>

  <!-- 웹 폰트 & 라이브러리 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>

  <style>
    :root {
      --bg-dark: #121215;
      --panel-bg: #1c1c22;
      --panel-border: #2c2c36;
      --accent: #ff5e36;
      --accent-grad: linear-gradient(135deg, #ff5e36, #e01e5a);
      --text: #ededf2;
      --text-dim: #9292a4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #16161b; padding: 10px 20px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.15rem; font-weight: 700; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 프리셋 선택 바 */
    .preset-bar { background: #181820; border-bottom: 1px solid var(--panel-border); padding: 8px 16px; display: flex; gap: 8px; align-items: center; }
    .preset-label { font-size: 0.78rem; font-weight: 700; color: #fca311; margin-right: 4px; }
    .btn-preset { background: #252530; color: #cfcfdc; border: 1px solid #363646; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-preset:hover { background: #323242; color: #fff; }
    .btn-preset.active { background: var(--accent-grad); border-color: transparent; color: #fff; box-shadow: 0 2px 8px rgba(255, 94, 54, 0.4); }

    .workspace { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 360px; background: var(--panel-bg); padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .sidebar-left { border-right: 1px solid var(--panel-border); }
    .sidebar-right { border-left: 1px solid var(--panel-border); }

    .card { background: #16161c; padding: 12px; border-radius: 8px; border: 1px solid #262632; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }

    label { font-size: 0.76rem; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
    label span.val { color: var(--text); font-weight: 600; }

    textarea { width: 100%; height: 75px; background: #111115; border: 1px solid var(--panel-border); border-radius: 6px; color: #fff; font-family: monospace; font-size: 0.78rem; padding: 8px; resize: vertical; }
    select, input[type="range"], input[type="color"] { width: 100%; padding: 6px; background: #131318; border: 1px solid var(--panel-border); border-radius: 6px; color: #fff; font-size: 0.8rem; }
    input[type="range"] { padding: 0; accent-color: var(--accent); cursor: pointer; }

    .viewport { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0c0e; padding: 16px; position: relative; }
    .canvas-container { box-shadow: 0 16px 40px rgba(0,0,0,0.8); border-radius: 6px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; max-height: 72vh; }
    canvas { display: block; max-height: 72vh; object-fit: contain; }

    .controller-bar { width: 100%; max-width: 900px; margin-top: 10px; background: var(--panel-bg); padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--panel-border); }
    button.btn-primary { background: var(--accent-grad); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.82rem; }
    button.btn-sub { background: #262632; color: #fff; border: 1px solid var(--panel-border); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
    .modal-box { background: var(--panel-bg); padding: 24px; border-radius: 10px; width: 320px; text-align: center; }
    .bar-bg { width: 100%; height: 8px; background: #111; border-radius: 4px; margin: 12px 0; overflow: hidden; }
    .bar-fill { width: 0%; height: 100%; background: var(--accent-grad); }
  </style>
</head>
<body>

  <header>
    <h1>🖌️ 한글 지오메트리 캘리그라피 변형 파이프라인</h1>
    <span style="font-size: 0.78rem; color: var(--text-dim);">글리프 벡터 제어점 비선형 왜곡 & 어트랙터 알고리즘 엔진 v34.0</span>
  </header>

  <!-- 4대 알고리즘 프리셋 툴바 -->
  <div class="preset-bar">
    <span class="preset-label">📐 알고리즘 모델:</span>

  </div>

  <div class="workspace">
    
    <!-- 좌측 사이드바: 텍스트 및 기본 환경 -->

      <div class="card">

    <!-- 중앙 캔버스 -->

      </div>

      <div class="controller-bar">

        <span id="time-text" style="font-family:monospace; font-size:0.8rem; color:var(--accent);">04.00s</span>

      </div>
    </div>

    <!-- 우측 사이드바: 폰트 내부 수학 파라미터 -->
    <div class="sidebar sidebar-right">
      <div class="card">
        <div class="card-title">🧮 벡터장(Vector Field) 파라미터</div>
        
        <label>장획/삐침 어트랙터 강도 <span class="val" id="val-attractor">1.0x</span></label>
        <input type="range" id="param-attractor" min="0.0" max="3.0" step="0.1" value="1.0">

        <label>비선형 벤딩/곡률 곡면 <span class="val" id="val-curvature">0.0</span></label>
        <input type="range" id="param-curvature" min="-2.0" max="2.0" step="0.1" value="0.0">

        <label>속도장 전단각 (Shear) <span class="val" id="val-shear">0°</span></label>
        <input type="range" id="param-shear" min="-15" max="25" step="1" value="0">

        <label>구형 중심 팽창 (Bulge) <span class="val" id="val-bulge">0.0</span></label>
        <input type="range" id="param-bulge" min="-1.0" max="2.0" step="0.1" value="0.0">
      </div>

      <div class="card">
        <div class="card-title">✒️ 필압 지오메트리 & 갈필 절삭</div>

        <label>외곽선 법선 확장 (팽창 필압) <span class="val" id="val-stroke-expand">1.0x</span></label>
        <input type="range" id="param-stroke-expand" min="0.5" max="2.5" step="0.1" value="1.0">

        <label>갈필(飛白) 접선 슬릿 절삭 <span class="val" id="val-slit-cut">0.3</span></label>
        <input type="range" id="param-slit-cut" min="0.0" max="1.0" step="0.05" value="0.3">

        <label>주제어 대비 (헤드라인 스케일) <span class="val" id="val-contrast">1.5x</span></label>
        <input type="range" id="param-contrast" min="1.0" max="3.5" step="0.1" value="1.5">
      </div>

      <div class="card">
        <div class="card-title">📜 조형 배치 & 간격</div>

        <label>자간 (Letter Spacing) <span class="val" id="val-spacing">-8px</span></label>
        <input type="range" id="param-spacing" min="-40" max="40" step="2" value="-8">

        <label>행간 (Line Height) <span class="val" id="val-line-height">1.05x</span></label>
        <input type="range" id="param-line-height" min="0.6" max="2.0" step="0.05" value="1.05">
      </div>
    </div>

  </div>

  <!-- 프로그레스 모달 -->
  <div class="modal-overlay" id="render-modal">
    <div class="modal-box">
      <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px;">캘리그라피 인코딩 중</div>
      <div class="bar-bg"><div class="bar-fill" id="render-bar"></div></div>
      <span id="render-pct" style="font-size: 0.85rem; color: var(--accent); font-weight: 700;">0%</span>
    </div>
  </div>

  <script>
    /* =========================================================================
       🏛️ 4대 알고리즘 프리셋 설정 (실제 이미지 조형 매핑)
       ========================================================================= */
    const PRESETS = {
      p1: {
        name: '방사형 호흡 (수직 다열)',
        text: "완전히 똑같이\n다시 한번\n지금 이 인생을\n살아도 좋다는\n마음으로\n살아라",
        sideNote: "차라투스트라는\n이렇게 말했다",
        layout: 'vertical-multi',
        bokeh: 'pastel-warm',
        attractor: 0.2,
        curvature: 0.4,
        shear: 0,
        bulge: 0.25,
        strokeExpand: 1.1,
        slitCut: 0.2,
        contrast: 1.25,
        spacing: -6,
        lineHeight: 1.05,
        seal: 'seal-dark'
      },
      p2: {
        name: '하단 장획 어트랙터 (수묵 표제)',
        text: "해답은\n없다\n\n앞으로도\n해답이 없을 것이고\n지금까지도 해답이\n없었다 이것이\n인생의 유일한\n해답이다",
        sideNote: "",
        layout: 'contrast-headline',
        bokeh: 'ink-splatter',
        attractor: 2.4, // 실제 글리프 하단점을 아래로 강하게 뽑아냄
        curvature: -0.6,
        shear: -4,
        bulge: 0.1,
        strokeExpand: 1.35,
        slitCut: 0.65, // 거친 갈필 절삭
        contrast: 3.2, // 극단적 크기 대비
        spacing: -12,
        lineHeight: 0.95,
        seal: 'seal-red'
      },
      p3: {
        name: '속도장 전단 가속 (질주 행서)',
        text: "긴장은 잠시,\n실력은 그대로",
        sideNote: "운채 씀",
        layout: 'running-script',
        bokeh: 'cyan-gold',
        attractor: 1.8, // 우측/하단 말단부를 날카롭게 압출
        curvature: 0.8,
        shear: 11, // 우상향 11도 전단 왜곡
        bulge: 0.0,
        strokeExpand: 1.15,
        slitCut: 0.45,
        contrast: 1.6,
        spacing: -4,
        lineHeight: 1.2,
        seal: 'none'
      },
      p4: {
        name: '구형 팽창 & 3분면 압출 (조형 엠블럼)',
        text: "봄캘리",
        sideNote: "",
        layout: 'emblem-quad',
        bokeh: 'ink-splatter',
        attractor: 2.8, // 좌하단(3분면) 정점을 대각선으로 극대 확장
        curvature: 0.0,
        shear: -2,
        bulge: 1.2, // 극단적인 후중화 팽창
        strokeExpand: 1.7,
        slitCut: 0.5,
        contrast: 2.4,
        spacing: -16,
        lineHeight: 1.0,
        seal: 'seal-red'
      }
    };

    /* 시스템 상태 및 DOM */
    let currentModel = 'p1';
    let loadedFont = null;
    let isPlaying = false;
    let animId = null;
    let currentTime = 4.0;
    const totalDuration = 4.0;

    const canvas = document.getElementById('calli-canvas');
    const ctx = canvas.getContext('2d');
    const inputText = document.getElementById('input-text');
    const selectRatio = document.getElementById('select-ratio');
    const selectBg = document.getElementById('select-bg');
    const inputInkColor = document.getElementById('input-ink-color');
    const selectBokeh = document.getElementById('select-bokeh');
    const selectSeal = document.getElementById('select-seal');

    const paramAttractor = document.getElementById('param-attractor');
    const paramCurvature = document.getElementById('param-curvature');
    const paramShear = document.getElementById('param-shear');
    const paramBulge = document.getElementById('param-bulge');
    const paramStrokeExpand = document.getElementById('param-stroke-expand');
    const paramSlitCut = document.getElementById('param-slit-cut');
    const paramContrast = document.getElementById('param-contrast');
    const paramSpacing = document.getElementById('param-spacing');
    const paramLineHeight = document.getElementById('param-line-height');

    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const btnPlay = document.getElementById('btn-play');
    const btnExport = document.getElementById('btn-export');

    /* =========================================================================
       🧬 핵심 알고리즘: 글리프 연속 2D 벡터장 변형기 (Glyph Vector Field Warper)
       ========================================================================= */
    class GlyphGeometryEngine {
      /**
       * opentype.js의 path.commands 좌표를 읽어 수학적 벡터장으로 정점 이동
       * @param {Array} commands - 글리프 원본 Path 명령 배열
       * @param {Object} bbox - 글리프 Bounding Box
       * @param {Object} params - 변형 수학 파라미터 모음
       */
      static deformGlyph(commands, bbox, params, isMajorChar = false) {
        const w = Math.max(1, bbox.x2 - bbox.x1);
        const h = Math.max(1, bbox.y2 - bbox.y1);
        const cx = (bbox.x1 + bbox.x2) / 2;
        const cy = (bbox.y1 + bbox.y2) / 2;

        const {
          attractor,      // 장획 어트랙터
          curvature,      // 비선형 곡률
          shearDeg,       // 전단 각도
          bulge,          // 구형 팽창
          strokeExpand,   // 외곽선 팽창
          modelType       // 현재 적용 중인 알고리즘 모델
        } = params;

        const shearRad = (-shearDeg * Math.PI) / 180;
        const tanShear = Math.tan(shearRad);

        // 정점 사상 함수 F(x, y) -> (x', y')
        const transformPoint = (x, y) => {
          // 1. 정규화 좌표 (-1 ~ 1)
          let u = (x - cx) / (w * 0.5);
          let v = (y - cy) / (h * 0.5);

          // 2. 구형 중심 팽창 (Bulge Transformation)
          if (bulge !== 0) {
            const distSq = u * u + v * v;
            const factor = 1.0 + bulge * 0.45 * Math.exp(-distSq * 0.85);
            u *= factor;
            v *= factor;
          }

          // 3. 비선형 벤딩 곡면 (Arc Curvature)
          if (curvature !== 0) {
            const bend = curvature * 0.35 * (1.0 - u * u);
            v += bend;
          }

          // 4. 속도장 전단 왜곡 (Velocity Shear)
          u += v * tanShear;

          // 5. [핵심] 단자점 어트랙터 필드 (Attractor Field: 진짜 장획 압출)
          let px = cx + u * (w * 0.5) * strokeExpand;
          let py = cy + v * (h * 0.5) * strokeExpand;

          if (isMajorChar && attractor > 0.05) {
            if (modelType === 'p2') {
              // 수묵 표제체: 최하단(v > 0.4)에 위치한 정점들을 중력장처럼 아래로 늘림
              if (v > 0.35) {
                const pullWeight = Math.pow((v - 0.35) / 0.65, 2.2);
                py += pullWeight * (h * 1.8 * attractor);
                // 자연스러운 붓의 휨 (우측으로 살짝 감기다가 좌측으로 수필)
                px += Math.sin(pullWeight * Math.PI) * (w * 0.25);
              }
            } else if (modelType === 'p3') {
              // 질주 행서체: 우측 말단부(u > 0.4)를 우상향 방향으로 날렵하게 당김
              if (u > 0.3) {
                const pullWeight = Math.pow((u - 0.3) / 0.7, 1.8);
                px += pullWeight * (w * 1.4 * attractor);
                py -= pullWeight * (h * 0.4 * attractor);
              }
            } else if (modelType === 'p4') {
              // 조형 엠블럼: 좌하단 3분면 (u < 0, v > 0.2) 정점을 대각선 아래로 길게 연장
              if (u < 0.1 && v > 0.1) {
                const pullDist = Math.hypot(u - 0.1, v - 0.1);
                const pullWeight = Math.pow(Math.min(1.5, pullDist), 2.0);
                px -= pullWeight * (w * 1.5 * attractor);
                py += pullWeight * (h * 1.9 * attractor);
              }
            }
          }

          return { x: px, y: py };
        };

        // 베지에 곡선 제어점 전체에 연속 변환 사상
        const deformedCommands = commands.map(cmd => {
          const c = Object.assign({}, cmd);
          if (c.x !== undefined && c.y !== undefined) {
            const p = transformPoint(c.x, c.y);
            c.x = p.x; c.y = p.y;
          }
          if (c.x1 !== undefined && c.y1 !== undefined) {
            const p1 = transformPoint(c.x1, c.y1);
            c.x1 = p1.x; c.y1 = p1.y;
          }
          if (c.x2 !== undefined && c.y2 !== undefined) {
            const p2 = transformPoint(c.x2, c.y2);
            c.x2 = p2.x; c.y2 = p2.y;
          }
          return c;
        });

        return deformedCommands;
      }

      /**
       * 변형된 commands를 Canvas 2D Path로 렌더링
       */
      static renderCommands(targetCtx, commands) {
        targetCtx.beginPath();
        for (let i = 0; i < commands.length; i++) {
          const cmd = commands[i];
          switch (cmd.type) {
            case 'M': targetCtx.moveTo(cmd.x, cmd.y); break;
            case 'L': targetCtx.lineTo(cmd.x, cmd.y); break;
            case 'C': targetCtx.bezierCurveTo(cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.x, cmd.y); break;
            case 'Q': targetCtx.quadraticCurveTo(cmd.x1, cmd.y1, cmd.x, cmd.y); break;
            case 'Z': targetCtx.closePath(); break;
          }
        }
      }
    }

    /* 폰트 비동기 로딩 */
    const FONT_URL = "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf";
    opentype.load(FONT_URL, (err, font) => {
      if (err) {
        alert('기본 나눔붓글씨 폰트 로드 실패: ' + err);
      } else {
        loadedFont = font;
        applyPreset('p1');
      }
    });

    /* =========================================================================
       🎨 갈필(飛白) 접선 절삭 필터 (Slit Carving Engine)
       ========================================================================= */
    function applyDryBrushSlitCut(targetCtx, w, h, slitIntensity) {
      if (slitIntensity <= 0.05) return;
      targetCtx.save();
      // 글자의 내부 획만 골라 깎아내는 destination-out 연산
      targetCtx.globalCompositeOperation = 'destination-out';

      const numSlits = Math.floor(slitIntensity * 280);
      targetCtx.strokeStyle = 'rgba(0,0,0,0.85)';

      for (let i = 0; i < numSlits; i++) {
        const sx = (Math.sin(i * 1.91) * 0.5 + 0.5) * w;
        const sy = (Math.cos(i * 2.73) * 0.5 + 0.5) * h;
        const len = (Math.sin(i * 4.1) * 0.5 + 0.5) * 45 + 15;
        const angle = (Math.sin(i * 3.3) * 0.25) + Math.PI * 0.45; // 운필 방향(대각 하강)

        targetCtx.lineWidth = (Math.sin(i * 5.7) * 0.5 + 0.5) * 2.2 + 0.6;
        targetCtx.beginPath();
        targetCtx.moveTo(sx, sy);
        targetCtx.lineTo(sx + Math.cos(angle) * len, sy + Math.sin(angle) * len);
        targetCtx.stroke();
      }
      targetCtx.restore();
    }

    /* 배경 수채화 보케 & 먹물 비산 */
    function renderBackgroundElements(targetCtx, w, h, bokehType) {
      if (bokehType === 'none') return;
      targetCtx.save();

      if (bokehType === 'pastel-warm') {
        // 1번 이미지: 파스텔 수채 원형 번짐
        const dots = [
          { x: w * 0.32, y: h * 0.35, r: 65, c: 'rgba(255, 170, 150, 0.42)' },
          { x: w * 0.62, y: h * 0.46, r: 80, c: 'rgba(255, 195, 160, 0.38)' },
          { x: w * 0.38, y: h * 0.62, r: 50, c: 'rgba(255, 205, 175, 0.45)' },
          { x: w * 0.70, y: h * 0.34, r: 20, c: 'rgba(175, 190, 140, 0.55)' },
          { x: w * 0.74, y: h * 0.42, r: 26, c: 'rgba(160, 185, 130, 0.5)' },
          { x: w * 0.67, y: h * 0.70, r: 14, c: 'rgba(140, 160, 200, 0.6)' },
          { x: w * 0.12, y: h * 0.52, r: 30, c: 'rgba(160, 180, 145, 0.45)' },
          { x: w * 0.88, y: h * 0.35, r: 24, c: 'rgba(255, 220, 170, 0.5)' }
        ];
        dots.forEach(d => {
          targetCtx.fillStyle = d.c;
          targetCtx.beginPath();
          targetCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          targetCtx.fill();
        });
      } else if (bokehType === 'cyan-gold') {
        // 3번 이미지: 청록 & 골드 별점
        for (let i = 0; i < 42; i++) {
          const x = (0.12 + (Math.sin(i * 1.7) * 0.5 + 0.5) * 0.76) * w;
          const y = (0.22 + (Math.cos(i * 2.3) * 0.5 + 0.5) * 0.56) * h;
          const r = (Math.sin(i * 3.1) * 0.5 + 0.5) * 7 + 2;
          targetCtx.fillStyle = (i % 3 === 0) ? 'rgba(235, 180, 75, 0.55)' : 'rgba(72, 175, 195, 0.65)';
          targetCtx.beginPath();
          targetCtx.arc(x, y, r, 0, Math.PI * 2);
          targetCtx.fill();
        }
      } else if (bokehType === 'ink-splatter') {
        // 2, 4번 이미지: 수묵 비산점
        targetCtx.fillStyle = 'rgba(20, 20, 22, 0.45)';
        for (let i = 0; i < 24; i++) {
          const x = (0.18 + (Math.sin(i * 2.1) * 0.5 + 0.5) * 0.64) * w;
          const y = (0.18 + (Math.cos(i * 3.7) * 0.5 + 0.5) * 0.64) * h;
          const r = (Math.sin(i * 4.3) * 0.5 + 0.5) * 3.5 + 1.2;
          targetCtx.beginPath();
          targetCtx.arc(x, y, r, 0, Math.PI * 2);
          targetCtx.fill();
        }
      }
      targetCtx.restore();
    }

    /* 전서 직인 */
    function renderSeal(targetCtx, x, y, size, type, text = "정글") {
      if (!type || type === 'none') return;
      targetCtx.save();
      const isRed = type === 'seal-red';
      targetCtx.fillStyle = isRed ? '#bb1b27' : '#1f1e24';
      targetCtx.fillRect(x, y, size, size);

      targetCtx.strokeStyle = isRed ? '#e2303c' : '#33323d';
      targetCtx.lineWidth = 2;
      targetCtx.strokeRect(x, y, size, size);

      targetCtx.fillStyle = '#ffffff';
      targetCtx.font = `bold ${Math.round(size * 0.4)}px serif`;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      targetCtx.fillText(text.slice(0, 2), x + size / 2, y + size / 2 + 1);
      targetCtx.restore();
    }

    /* 메인 렌더링 프레임 함수 */
    function renderScene(progress = 1.0) {
      if (!loadedFont) return;
      const w = canvas.width, h = canvas.height;

      // 1. 화선지 배경
      const bg = selectBg.value;
      if (bg === 'white-hanji') {
        ctx.fillStyle = '#f9f6f0';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(60, 50, 40, 0.015)';
        for (let i = 0; i < 280; i++) {
          ctx.beginPath();
          ctx.arc((Math.sin(i * 1.5)*0.5+0.5)*w, (Math.cos(i*2.7)*0.5+0.5)*h, 1.8, 0, Math.PI*2);
          ctx.fill();
        }
      } else if (bg === 'warm-hanji') {
        ctx.fillStyle = '#ede3ce';
        ctx.fillRect(0, 0, w, h);
      } else {
        ctx.clearRect(0, 0, w, h);
      }

      // 2. 보케 & 수채 번짐
      renderBackgroundElements(ctx, w, h, selectBokeh.value);

      // 3. 지오메트리 파라미터 추출
      const params = {
        attractor: parseFloat(paramAttractor.value),
        curvature: parseFloat(paramCurvature.value),
        shearDeg: parseInt(paramShear.value),
        bulge: parseFloat(paramBulge.value),
        strokeExpand: parseFloat(paramStrokeExpand.value),
        modelType: currentModel
      };

      const slitIntensity = parseFloat(paramSlitCut.value);
      const contrast = parseFloat(paramContrast.value);
      const letterSpacing = parseInt(paramSpacing.value);
      const lineHeight = parseFloat(paramLineHeight.value);
      const inkColor = inputInkColor.value;

      ctx.save();
      ctx.fillStyle = inkColor;

      const rawText = inputText.value.trim();
      const currentPresetObj = PRESETS[currentModel];

      /* -------------------------------------------------------------------------
         모델 1: 수직 다열 산문 구도 (1번 이미지)
         ------------------------------------------------------------------------- */
      if (currentModel === 'p1') {
        const columns = rawText.split('\n').filter(l => l.trim().length > 0);
        const colCount = columns.length;
        const colWidth = 110 * lineHeight;
        const startX = w / 2 + ((colCount - 1) * colWidth) / 2 - 40;
        const startY = h * 0.22;

        columns.forEach((col, cIdx) => {
          const colX = startX - cIdx * colWidth;
          const chars = Array.from(col);
          let curY = startY;

          chars.forEach((ch, rIdx) => {
            const isFirst = (cIdx === 0 && rIdx === 0);
            const fontSize = (isFirst ? 88 : 74);
            const path = loadedFont.getPath(ch, 0, 0, fontSize);
            let bbox = { x1: 0, y1: -fontSize * 0.7, x2: fontSize * 0.6, y2: 0 };
            try { bbox = path.getBoundingBox(); } catch(e) {}

            const deformed = GlyphGeometryEngine.deformGlyph(path.commands, bbox, params, false);

            ctx.save();
            ctx.translate(colX, curY);
            GlyphGeometryEngine.renderCommands(ctx, deformed);
            ctx.fill();
            ctx.restore();

            curY += fontSize * 0.95 + letterSpacing;
          });
        });

        // 우측 세로 소제목 (차라투스트라는...)
        const sideLines = (currentPresetObj.sideNote || "").split('\n');
        const sideX = w * 0.84;
        let sideY = h * 0.28;
        sideLines.forEach((sLine, sIdx) => {
          const sChars = Array.from(sLine);
          let sy = sideY;
          sChars.forEach(sc => {
            const p = loadedFont.getPath(sc, 0, 0, 36);
            let b = { x1: 0, y1: -25, x2: 25, y2: 0 };
            try { b = p.getBoundingBox(); } catch(e) {}
            const def = GlyphGeometryEngine.deformGlyph(p.commands, b, { ...params, attractor: 0, bulge: 0 }, false);
            ctx.save();
            ctx.translate(sideX + sIdx * 40, sy);
            GlyphGeometryEngine.renderCommands(ctx, def);
            ctx.fill();
            ctx.restore();
            sy += 40;
          });
        });

        renderSeal(ctx, sideX, sideY + 130, 52, selectSeal.value, "정글");

      /* -------------------------------------------------------------------------
         모델 2: 하단 장획 어트랙터 수묵 표제체 (2번 이미지)
         ------------------------------------------------------------------------- */
      } else if (currentModel === 'p2') {
        const parts = rawText.split('\n\n');
        const headline = parts[0] || "해답은\n없다";
        const bodyText = parts[1] || "";

        // 대형 헤드라인
        const headLines = headline.split('\n');
        const headBaseSize = 160 * (contrast * 0.6);
        let headY = h * 0.27;

        headLines.forEach((line, lIdx) => {
          const chars = Array.from(line);
          const lineW = chars.length * headBaseSize * 0.72;
          let headX = w * 0.32 - lineW / 2;

          chars.forEach((ch, cIdx) => {
            const isTailTarget = (lIdx === headLines.length - 1 && cIdx === chars.length - 1); // 마지막 글자('다' 또는 '없')
            const path = loadedFont.getPath(ch, 0, 0, headBaseSize);
            let bbox = { x1: 0, y1: -headBaseSize*0.7, x2: headBaseSize*0.7, y2: 0 };
            try { bbox = path.getBoundingBox(); } catch(e) {}

            // 하단 정점 어트랙터 활성화
            const deformed = GlyphGeometryEngine.deformGlyph(path.commands, bbox, params, isTailTarget);

            ctx.save();
            ctx.translate(headX, headY);
            GlyphGeometryEngine.renderCommands(ctx, deformed);
            ctx.fill();
            ctx.restore();

            headX += headBaseSize * 0.78 + letterSpacing;
          });
          headY += headBaseSize * 0.9 * lineHeight;
        });

        // 우하단 세로 본문
        if (bodyText) {
          const bodyCols = bodyText.split('\n');
          const bodySize = 40;
          const bStartX = w * 0.76;
          const bStartY = h * 0.48;

          bodyCols.forEach((bLine, colIdx) => {
            const colX = bStartX - colIdx * (bodySize * 1.35);
            const chars = Array.from(bLine);
            let curY = bStartY;
            chars.forEach(bc => {
              const p = loadedFont.getPath(bc, 0, 0, bodySize);
              let b = { x1: 0, y1: -28, x2: 28, y2: 0 };
              try { b = p.getBoundingBox(); } catch(e) {}
              const def = GlyphGeometryEngine.deformGlyph(p.commands, b, { ...params, attractor: 0 }, false);
              ctx.save();
              ctx.translate(colX, curY);
              GlyphGeometryEngine.renderCommands(ctx, def);
              ctx.fill();
              ctx.restore();
              curY += bodySize * 0.96;
            });
          });

          renderSeal(ctx, bStartX + 28, bStartY, 48, selectSeal.value, "해답");
        }

      /* -------------------------------------------------------------------------
         모델 3: 속도장 전단 가속 행서체 (3번 이미지)
         ------------------------------------------------------------------------- */
      } else if (currentModel === 'p3') {
        const lines = rawText.split('\n');
        const baseSize = 110;
        let curY = h * 0.40;

        lines.forEach((line, lIdx) => {
          const chars = Array.from(line);
          const lineW = chars.length * baseSize * 0.8;
          let curX = w / 2 - lineW / 2 + (lIdx === 1 ? -45 : 20);

          chars.forEach((ch, cIdx) => {
            const isTailTarget = (cIdx === chars.length - 1); // 행의 마지막 글자 삐침
            const path = loadedFont.getPath(ch, 0, 0, baseSize);
            let bbox = { x1: 0, y1: -baseSize*0.7, x2: baseSize*0.7, y2: 0 };
            try { bbox = path.getBoundingBox(); } catch(e) {}

            const deformed = GlyphGeometryEngine.deformGlyph(path.commands, bbox, params, isTailTarget);

            ctx.save();
            ctx.translate(curX, curY);
            GlyphGeometryEngine.renderCommands(ctx, deformed);
            ctx.fill();
            ctx.restore();

            curX += baseSize * 0.82 + letterSpacing;
          });
          curY += baseSize * 1.15 * lineHeight;
        });

        // 서명
        if (currentPresetObj.sideNote) {
          ctx.fillStyle = '#489fb5';
          ctx.font = 'italic bold 32px cursive';
          ctx.textAlign = 'center';
          ctx.fillText(`~ ${currentPresetObj.sideNote} ~`, w / 2, h * 0.72);
        }

      /* -------------------------------------------------------------------------
         모델 4: 구형 팽창 & 3분면 압출 조형 엠블럼 (4번 이미지)
         ------------------------------------------------------------------------- */
      } else if (currentModel === 'p4') {
        const chars = Array.from(rawText.replace(/\n/g, ''));
        const baseSize = 190 * (contrast * 0.52);
        const emblemW = chars.length * baseSize * 0.75;
        let curX = w / 2 - emblemW / 2;
        const curY = h * 0.44;

        chars.forEach((ch, i) => {
          const isMain = (i === 0); // 첫 글자 '봄'에 3분면 대각선 장획 집중
          const sz = isMain ? baseSize * 1.25 : baseSize * 0.92;
          const path = loadedFont.getPath(ch, 0, 0, sz);
          let bbox = { x1: 0, y1: -sz * 0.7, x2: sz * 0.7, y2: 0 };
          try { bbox = path.getBoundingBox(); } catch(e) {}

          const deformed = GlyphGeometryEngine.deformGlyph(path.commands, bbox, params, isMain);

          ctx.save();
          ctx.translate(curX, curY + (isMain ? 0 : 20));
          GlyphGeometryEngine.renderCommands(ctx, deformed);
          ctx.fill();
          ctx.restore();

          curX += sz * 0.74 + letterSpacing;
        });

        renderSeal(ctx, w * 0.68, h * 0.32, 54, selectSeal.value, "봄");
      }

      ctx.restore();

      // 4. 갈필 접선 슬릿 절삭
      applyDryBrushSlitCut(ctx, w, h, slitIntensity);
    }

    /* 프리셋 전환 및 UI 동기화 */
    function applyPreset(pKey) {
      currentModel = pKey;
      const p = PRESETS[pKey];
      if (!p) return;

      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${pKey}`);
      if (activeBtn) activeBtn.classList.add('active');

      inputText.value = p.text;
      selectBokeh.value = p.bokeh;
      selectSeal.value = p.seal;

      paramAttractor.value = p.attractor;
      document.getElementById('val-attractor').textContent = `${p.attractor}x`;

      paramCurvature.value = p.curvature;
      document.getElementById('val-curvature').textContent = p.curvature;

      paramShear.value = p.shear;
      document.getElementById('val-shear').textContent = `${p.shear}°`;

      paramBulge.value = p.bulge;
      document.getElementById('val-bulge').textContent = p.bulge;

      paramStrokeExpand.value = p.strokeExpand;
      document.getElementById('val-stroke-expand').textContent = `${p.strokeExpand}x`;

      paramSlitCut.value = p.slitCut;
      document.getElementById('val-slit-cut').textContent = p.slitCut;

      paramContrast.value = p.contrast;
      document.getElementById('val-contrast').textContent = `${p.contrast}x`;

      paramSpacing.value = p.spacing;
      document.getElementById('val-spacing').textContent = `${p.spacing}px`;

      paramLineHeight.value = p.lineHeight;
      document.getElementById('val-line-height').textContent = `${p.lineHeight}x`;

      renderScene(1.0);
    }

    // 프리셋 버튼 리스너
    ['p1', 'p2', 'p3', 'p4'].forEach(key => {
      document.getElementById(`btn-${key}`).addEventListener('click', () => applyPreset(key));
    });

    // 슬라이더 및 파라미터 리스너
    [paramAttractor, paramCurvature, paramShear, paramBulge, paramStrokeExpand, paramSlitCut, paramContrast, paramSpacing, paramLineHeight].forEach(el => {
      el.addEventListener('input', (e) => {
        const id = e.target.id;
        if (id === 'param-attractor') document.getElementById('val-attractor').textContent = `${e.target.value}x`;
        if (id === 'param-curvature') document.getElementById('val-curvature').textContent = e.target.value;
        if (id === 'param-shear') document.getElementById('val-shear').textContent = `${e.target.value}°`;
        if (id === 'param-bulge') document.getElementById('val-bulge').textContent = e.target.value;
        if (id === 'param-stroke-expand') document.getElementById('val-stroke-expand').textContent = `${e.target.value}x`;
        if (id === 'param-slit-cut') document.getElementById('val-slit-cut').textContent = e.target.value;
        if (id === 'param-contrast') document.getElementById('val-contrast').textContent = `${e.target.value}x`;
        if (id === 'param-spacing') document.getElementById('val-spacing').textContent = `${e.target.value}px`;
        if (id === 'param-line-height') document.getElementById('val-line-height').textContent = `${e.target.value}x`;
        renderScene(1.0);
      });
    });

    document.getElementById('btn-update-text').addEventListener('click', () => renderScene(1.0));
    [selectBg, selectBokeh, selectSeal, inputInkColor].forEach(el => el.addEventListener('change', () => renderScene(1.0)));

    selectRatio.addEventListener('change', (e) => {
      const r = e.target.value;
      if (r === '1:1') { canvas.width = 1440; canvas.height = 1440; }
      else if (r === '16:9') { canvas.width = 1920; canvas.height = 1080; }
      else if (r === '9:16') { canvas.width = 1080; canvas.height = 1920; }
      renderScene(1.0);
    });

    /* 재생 및 MP4 비디오 렌더링 */
    timeSlider.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      timeText.textContent = `${currentTime.toFixed(2)}s`;
      renderScene(currentTime / totalDuration);
    });

    btnExport.addEventListener('click', async () => {
      const modal = document.getElementById('render-modal');
      const bar = document.getElementById('render-bar');
      const pct = document.getElementById('render-pct');
      modal.style.display = 'flex';

      const fps = 30;
      const totalFrames = Math.ceil(totalDuration * fps);
      const stream = canvas.captureStream(fps);
      let mimeType = 'video/mp4';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 6_000_000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `hangul_calligraphy_${currentModel}_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
        a.click();
        modal.style.display = 'none';
      };

      recorder.start();
      let f = 0;
      const timer = setInterval(() => {
        if (f >= totalFrames) {
          clearInterval(timer);
          recorder.stop();
          return;
        }
        renderScene(f / totalFrames);
        const p = Math.round((f / totalFrames) * 100);
        bar.style.width = `${p}%`;
        pct.textContent = `${p}%`;
        f++;
      }, 1000 / fps);
    });
  </script>
</body>
</html>
