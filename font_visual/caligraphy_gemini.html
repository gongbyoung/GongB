<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>동적 수묵 캘리그라피 엔진</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #e8e4dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .panel {
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      font-size: 14px;
      color: #333;
    }
    .canvas-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border-radius: 4px;
      background-color: #f7f4eb; /* 전통 한지 톤 */
    }
    canvas {
      display: block;
      touch-action: none; /* 브라우저 기본 터치 제스처 방지 */
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="panel">
    <span>모드: <strong>수묵 갈필 & 번짐 (Pointer 지원)</strong></span>
    <span>• 마우스를 빠르게 움직이면 갈필(거친 털)</span>
    <span>• 천천히 멈추면 먹 번짐</span>
    <button id="clearBtn" style="padding: 2px 8px; cursor: pointer;">비우기</button>
  </div>

  <div class="canvas-container">
    <canvas id="calliCanvas" width="900" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('calliCanvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');

    // 한지 배경 텍스처 초기화
    function initPaperTexture() {
      ctx.fillStyle = '#f7f4eb';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 미세 섬유 노이즈 생성
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 8;
        data[i] += noise;     // R
        data[i + 1] += noise; // G
        data[i + 2] += noise; // B
      }
      ctx.putImageData(imgData, 0, 0);
    }
    initPaperTexture();
    clearBtn.addEventListener('click', initPaperTexture);

    // 스트로크 상태 관리
    let isDrawing = false;
    let lastPoint = null;
    let lastTime = 0;
    let smoothedWidth = 10;
    const BRUSH_BASE_RADIUS = 16;
    const NUM_BRISTLES = 28; // 브러시 붓털 가닥 수

    // 개별 붓털 오프셋 생성 (상대 극좌표계)
    const bristles = Array.from({ length: NUM_BRISTLES }, () => ({
      angle: Math.random() * Math.PI * 2,
      distance: Math.pow(Math.random(), 1.6), // 중심부 밀집 분산
      thickness: 0.6 + Math.random() * 1.4
    }));

    function getDistance(p1, p2) {
      return Math.hypot(p2.x - p1.x, p2.y - p1.y);
    }

    // 포인터 이벤트 리스너
    canvas.addEventListener('pointerdown', (e) => {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      lastPoint = { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure: e.pressure || 0.5 };
      lastTime = performance.now();
      smoothedWidth = BRUSH_BASE_RADIUS * (lastPoint.pressure || 0.5);

      // 첫 획 착지(기필) 시 수묵 점착 번짐
      renderBleed(lastPoint.x, lastPoint.y, smoothedWidth * 1.2, 0.4);
    });

    window.addEventListener('pointerup', () => {
      isDrawing = false;
      lastPoint = null;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;

      const rect = canvas.getBoundingClientRect();
      const currentPoint = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        pressure: e.pressure && e.pressure > 0 ? e.pressure : 0.5
      };

      const currentTime = performance.now();
      const dist = getDistance(lastPoint, currentPoint);
      const timeDelta = Math.max(currentTime - lastTime, 1);
      
      // 속도 (픽셀/ms)
      const speed = dist / timeDelta;

      // 물리 공식 기반 굵기 보정: 압력에 비례하고 속도에 반비례
      const targetWidth = Math.max(
        (BRUSH_BASE_RADIUS * currentPoint.pressure * 2.2) / (1 + speed * 0.35),
        2.5
      );
      
      // 급격한 두께 변화 억제 (지수 이동 평균 Smoothing)
      smoothedWidth = smoothedWidth * 0.7 + targetWidth * 0.3;

      // 보간 단계 수 (간극 없는 부드러운 선 표현)
      const steps = Math.ceil(dist / 2);

      for (let step = 0; step < steps; step++) {
        const t = step / steps;
        const interpX = lastPoint.x + (currentPoint.x - lastPoint.x) * t;
        const interpY = lastPoint.y + (currentPoint.y - lastPoint.y) * t;

        // 갈필(Dry Brush) 판정: 속도가 빠를수록 마른 붓 효과 증가
        const isDry = speed > 1.2;
        const dryFactor = Math.min((speed - 1.2) / 3, 0.85);

        renderCalligraphyPoint(interpX, interpY, smoothedWidth, isDry, dryFactor);
      }

      // 저속 및 정지 구간 수묵 번짐 효과
      if (speed < 0.25) {
        renderBleed(currentPoint.x, currentPoint.y, smoothedWidth * 1.5, 0.08);
      }

      lastPoint = currentPoint;
      lastTime = currentTime;
    });

    // 붓털 다발 기반 포인트 렌더링
    function renderCalligraphyPoint(x, y, radius, isDry, dryFactor) {
      for (let i = 0; i < NUM_BRISTLES; i++) {
        // 갈필 발생 시 일부 붓털 생략 (비백 현상)
        if (isDry && Math.random() < dryFactor) continue;

        const bristle = bristles[i];
        const r = bristle.distance * radius;
        const bx = x + Math.cos(bristle.angle) * r;
        const by = y + Math.sin(bristle.angle) * r;

        // 중심부는 진하고(농묵), 외곽 털은 옅은 농도(담묵)
        const density = 1 - bristle.distance * 0.45;
        const alpha = Math.max(0.1, (isDry ? 0.35 : 0.7) * density);

        ctx.fillStyle = `rgba(18, 18, 18, ${alpha})`;
        ctx.beginPath();
        ctx.arc(bx, by, bristle.thickness * (radius / BRUSH_BASE_RADIUS), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 먹 번짐(Diffusion) 렌더링
    function renderBleed(x, y, radius, intensity) {
      const gradient = ctx.createRadialGradient(x, y, radius * 0.2, x, y, radius * 1.8);
      gradient.addColorStop(0, `rgba(28, 28, 28, ${intensity * 0.8})`);
      gradient.addColorStop(0.5, `rgba(40, 40, 40, ${intensity * 0.3})`);
      gradient.addColorStop(1, 'rgba(247, 244, 235, 0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, radius * 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  </script>
</body>
</html>
