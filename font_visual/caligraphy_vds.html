<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캘리그라피 SRT 플레이어 + 자동 녹화</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a1a; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; width: 100%; background: #2d2d2d; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h1 { text-align: center; font-weight: 300; letter-spacing: 2px; margin-bottom: 20px; color: #ffd700; font-size: 1.8rem; }
        .canvas-wrapper { position: relative; background: #0a0a0a; border-radius: 12px; overflow: hidden; width: 100%; margin-bottom: 20px; background-color: #fef9f0; }
        #canvas { display: block; width: 100%; height: auto; background: #fef9f0; cursor: default; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; padding-bottom: 15px; border-bottom: 1px solid #444; }
        .controls button { background: #444; border: none; color: white; padding: 10px 20px; border-radius: 30px; font-size: 1rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .controls button:hover { background: #666; }
        .controls button.primary { background: #ffd700; color: #1a1a1a; }
        .controls button.record { background: #e67e22; }
        .file-input-wrapper { display: flex; align-items: center; gap: 12px; background: #3a3a3a; padding: 6px 16px; border-radius: 30px; }
        .file-input-wrapper label { cursor: pointer; color: #ffd700; font-weight: 500; }
        #fileInput { display: none; }
        .settings-panel { background: #222; padding: 20px; border-radius: 10px; margin-bottom: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .setting-item { display: flex; flex-direction: column; gap: 5px; }
        .setting-item label { font-size: 0.9rem; color: #aaa; }
        .setting-item input[type="range"] { width: 100%; cursor: pointer; }
        .ratio-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .ratio-buttons button { flex: 1; background: #444; border: none; color: #eee; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .ratio-buttons button.active { background: #ffd700; color: #1a1a1a; }
        #status { text-align: center; font-size: 0.9rem; color: #aaa; margin-top: 10px; min-height: 1.5rem; }
        #timeDisplay { font-family: monospace; font-size: 1.1rem; color: #ffd700; background: #222; padding: 4px 12px; border-radius: 20px; }
        .info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .download-link { color: #4ecdc4; text-decoration: none; font-weight: 500; padding: 6px 14px; background: #2a2a2a; border-radius: 20px; border: 1px solid #4ecdc4; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h1>✍️ 캘리그라피 편집기 (자동 녹화)</h1>
    <div class="ratio-buttons">
        <button id="ratio16" class="active" onclick="setRatio('16:9')">가로 16:9</button>
        <button id="ratio916" onclick="setRatio('9:16')">세로 9:16</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <div class="info">
        <span id="timeDisplay">00:00.000</span>
        <span id="subtitleStatus">⏸ 대기 중</span>
    </div>

    <div class="controls">
        <div class="file-input-wrapper">
            <label for="fileInput">📂 SRT 선택</label>
            <input type="file" id="fileInput" accept=".srt">
        </div>
        <button id="playBtn" class="primary">▶ 재생</button>
        <button id="pauseBtn">⏸ 일시정지</button>
        <button id="stopBtn">⏹ 정지</button>
        <button id="recordBtn" class="record">🎥 녹화 시작</button>
    </div>

    <div class="settings-panel">
        <div class="setting-item"><label>전체 크기 (캔버스 95% 이내)</label><input type="range" id="marginSlider" min="50" max="95" value="95"></div>
        <div class="setting-item"><label>전체 글자 크기</label><input type="range" id="fontSlider" min="50" max="200" value="100"></div>
        <div class="setting-item"><label>자간</label><input type="range" id="letterSlider" min="0" max="100" value="10"></div>
        <div class="setting-item"><label>줄간</label><input type="range" id="lineSlider" min="100" max="250" value="120"></div>
        <div class="setting-item"><label>가로세로비율(글자 신축)</label><input type="range" id="ratioSlider" min="50" max="200" value="100"></div>
    </div>

    <div id="status">SRT 파일을 로드해주세요.</div>
    <div id="downloadArea" style="text-align:center; margin-top:12px;"></div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let W = 1280, H = 720;
        let currentRatio = '16:9';
        let totalDuration = 0; // [수정] 전체 SRT 길이 저장

        let settings = { margin: 0.95, fontScale: 1.0, letterSpacing: 0.1, lineHeight: 1.2, charWidthScale: 1.0 };

        let subtitles = [];
        let currentTime = 0;
        let isPlaying = false;
        let animationId = null;
        let startTime = 0;
        let pausedTime = 0;
        let activeText = "";
        let currentProgress = 0;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let stream = null;

        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recordBtn = document.getElementById('recordBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const subtitleStatus = document.getElementById('subtitleStatus');
        const statusDiv = document.getElementById('status');
        const downloadArea = document.getElementById('downloadArea');
        const fileInput = document.getElementById('fileInput');

        const marginSlider = document.getElementById('marginSlider');
        const fontSlider = document.getElementById('fontSlider');
        const letterSlider = document.getElementById('letterSlider');
        const lineSlider = document.getElementById('lineSlider');
        const ratioSlider = document.getElementById('ratioSlider');

        function setRatio(ratio) {
            currentRatio = ratio;
            document.getElementById('ratio16').classList.toggle('active', ratio === '16:9');
            document.getElementById('ratio916').classList.toggle('active', ratio === '9:16');
            if (ratio === '16:9') { W = 1280; H = 720; } else { W = 720; H = 1280; }
            canvas.width = W; canvas.height = H;
            canvas.style.aspectRatio = ratio;
            pause(); currentTime = 0; pausedTime = 0;
            timeDisplay.textContent = '00:00.000';
            drawCanvas();
        }
        window.setRatio = setRatio;

        marginSlider.oninput = () => { settings.margin = marginSlider.value / 100; drawCanvas(); };
        fontSlider.oninput = () => { settings.fontScale = fontSlider.value / 100; drawCanvas(); };
        letterSlider.oninput = () => { settings.letterSpacing = letterSlider.value / 100; drawCanvas(); };
        lineSlider.oninput = () => { settings.lineHeight = lineSlider.value / 100; drawCanvas(); };
        ratioSlider.oninput = () => { settings.charWidthScale = ratioSlider.value / 100; drawCanvas(); };

        function parseSRT(content) {
            const entries = [];
            const blocks = content.trim().split(/\n\s*\n/);
            for (const block of blocks) {
                const lines = block.split('\n').filter(line => line.trim() !== '');
                if (lines.length < 3) continue;
                const index = parseInt(lines[0]);
                const timeLine = lines[1];
                const timeMatch = timeLine.match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
                if (!timeMatch) continue;
                const start = toMs(timeMatch[1], timeMatch[2], timeMatch[3], timeMatch[4]);
                const end = toMs(timeMatch[5], timeMatch[6], timeMatch[7], timeMatch[8]);
                const text = lines.slice(2).join(' ');
                entries.push({ index, startMs: start, endMs: end, text: text.trim() });
            }
            entries.sort((a, b) => a.startMs - b.startMs);
            return entries;
        }

        function toMs(h, m, s, ms) { return parseInt(h) * 3600000 + parseInt(m) * 60000 + parseInt(s) * 1000 + parseInt(ms); }

        function drawCalligraphy(text, progress) {
            ctx.clearRect(0, 0, W, H);
            const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 600);
            grad.addColorStop(0, '#fdfbf5'); grad.addColorStop(1, '#f2ead8');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

            const chars = text.split('');
            const baseFontSize = Math.min(W, H) * 0.15 * settings.fontScale;
            const spacing = baseFontSize * settings.letterSpacing;
            const lineHeight = baseFontSize * settings.lineHeight;

            ctx.font = `bold ${baseFontSize}px 'Nanum Brush Script', cursive`;
            ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
            ctx.fillStyle = '#1a1a1a'; ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 2; ctx.shadowOffsetY = 2;

            const allowedWidth = W * settings.margin;
            const lines = [];
            let currentLine = ""; let currentLineWidth = 0;

            for (let i = 0; i < chars.length; i++) {
                let ch = chars[i];
                let chW = ctx.measureText(ch).width * settings.charWidthScale + spacing;
                if (currentLineWidth + chW > allowedWidth && currentLine !== "") {
                    lines.push(currentLine); currentLine = ch; currentLineWidth = chW;
                } else { currentLine += ch; currentLineWidth += chW; }
            }
            if (currentLine !== "") lines.push(currentLine);

            const totalHeight = lines.length * lineHeight;
            const startY = (H - totalHeight) / 2 + lineHeight / 2;
            const totalChars = lines.join('').length;
            const visibleChars = progress * totalChars;
            
            let globalCharIndex = 0;
            
            for (let l = 0; l < lines.length; l++) {
                const line = lines[l];
                let lineWidth = 0;
                for (let ch of line) lineWidth += ctx.measureText(ch).width * settings.charWidthScale + spacing;
                lineWidth -= spacing;
                let currentX = (W - lineWidth) / 2;
                const currentY = startY + (l * lineHeight);

                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    let alpha = 0;
                    if (globalCharIndex < visibleChars) alpha = 1;
                    else if (globalCharIndex === Math.floor(visibleChars)) alpha = visibleChars - Math.floor(visibleChars);
                    
                    if (alpha > 0) {
                        const rot = (globalCharIndex % 2 === 0 ? -0.03 : 0.03);
                        const yOff = (globalCharIndex % 3 === 0 ? 0 : (globalCharIndex % 2 === 0 ? 5 : -5));
                        ctx.save(); ctx.translate(currentX, currentY + yOff); ctx.rotate(rot);
                        ctx.scale(settings.charWidthScale, 1); ctx.globalAlpha = alpha;
                        ctx.fillText(ch, 0, 0); ctx.restore();
                    }
                    const chWidth = ctx.measureText(ch).width * settings.charWidthScale;
                    currentX += chWidth + spacing;
                    globalCharIndex++;
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawCanvas() {
            if (activeText) drawCalligraphy(activeText, currentProgress);
            else drawCalligraphy("", 1);
        }

        function animate(timestamp) {
            if (!isPlaying) return;
            const elapsed = timestamp - startTime + pausedTime;
            currentTime = elapsed;

            // [수정 2] SRT 전체 길이에 도달하면 자동 녹화 중지 및 저장
            if (isRecording && totalDuration > 0 && currentTime >= totalDuration) {
                pause(); // 재생 정지
                isRecording = false;
                recordBtn.textContent = '🎥 녹화 시작';
                statusDiv.textContent = '✅ 자막 종료로 녹화가 자동 저장되었습니다.';
                
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop(); // onstop 이벤트에서 다운로드 링크 생성
                }
                return; // 애니메이션 루프 종료
            }

            let active = null;
            let progress = 0;
            for (const sub of subtitles) {
                if (currentTime >= sub.startMs && currentTime < sub.endMs) {
                    active = sub;
                    const duration = sub.endMs - sub.startMs;
                    const passed = currentTime - sub.startMs;
                    progress = Math.min(passed / duration, 1);
                    break;
                }
            }

            if (active) {
                activeText = active.text; currentProgress = progress;
                drawCalligraphy(activeText, progress);
                subtitleStatus.textContent = `✍️ ${activeText} (${Math.round(progress*100)}%)`;
                statusDiv.textContent = `자막 #${active.index} 재생 중`;
            } else {
                activeText = ""; currentProgress = 0;
                drawCanvas();
                subtitleStatus.textContent = '⏸ 대기 중';
            }

            const sec = Math.floor(currentTime / 1000);
            const ms = Math.floor(currentTime % 1000);
            timeDisplay.textContent = `${String(sec).padStart(2, '0')}:${String(Math.floor(ms/10)).padStart(2, '0')}.${String(ms % 100).padStart(2, '0')}`;
            animationId = requestAnimationFrame(animate);
        }

        function play() {
            if (subtitles.length === 0) { statusDiv.textContent = '⚠️ SRT 파일을 먼저 로드하세요.'; return; }
            if (isPlaying) return;
            isPlaying = true;
            if (currentTime === 0) pausedTime = 0;
            else pausedTime = currentTime;
            startTime = performance.now() - pausedTime;
            animate(startTime);
            playBtn.textContent = '▶ 재생 중';
        }

        function pause() {
            if (!isPlaying) return;
            isPlaying = false;
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            pausedTime = currentTime;
            playBtn.textContent = '▶ 재생';
        }

        function stop() {
            if (isPlaying) pause();
            currentTime = 0; pausedTime = 0;
            timeDisplay.textContent = '00:00.000';
            activeText = ""; drawCanvas();
            playBtn.textContent = '▶ 재생';
        }

        playBtn.addEventListener('click', play);
        pauseBtn.addEventListener('click', pause);
        stopBtn.addEventListener('click', stop);

        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                subtitles = parseSRT(ev.target.result);
                if (subtitles.length === 0) { statusDiv.textContent = '⚠️ 유효한 SRT가 아닙니다.'; return; }
                
                // [수정 1] 전체 길이 계산 (자동 녹화 종료용)
                totalDuration = subtitles[subtitles.length - 1].endMs;
                
                statusDiv.textContent = `✅ ${subtitles.length}개 자막 로드 완료`;
                stop();
            };
            reader.readAsText(file, 'UTF-8');
            this.value = '';
        });

        // [수정 3] 녹화 시작 버튼: 처음부터 재생 및 자동 녹화
        recordBtn.addEventListener('click', function() {
            if (subtitles.length === 0) { statusDiv.textContent = '⚠️ SRT 파일을 먼저 로드하세요.'; return; }

            if (isRecording) { // 수동 중지
                if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = '🎥 녹화 시작';
                statusDiv.textContent = '녹화 중지, 인코딩 중...';
                return;
            }

            // 1. 시작점(0초)으로 초기화
            stop(); 

            // 2. 녹화기 초기화
            if (!stream) stream = canvas.captureStream(30);
            if (!mediaRecorder) {
                const mimeTypes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm;codecs=h264'];
                let mimeType = '';
                for (const mt of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; break; }
                }
                if (!mimeType) { statusDiv.textContent = '⚠️ 이 브라우저는 녹화를 지원하지 않습니다.'; return; }
                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `calligraphy_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.webm`;
                    a.textContent = '📥 다운로드 (WebM)';
                    a.className = 'download-link';
                    downloadArea.innerHTML = '';
                    downloadArea.appendChild(a);
                    recordedChunks = [];
                    statusDiv.textContent = '✅ 녹화 완료! 다운로드 링크가 생성되었습니다.';
                };
            }

            // 3. 녹화 시작 및 처음부터 재생
            recordedChunks = [];
            mediaRecorder.start(100);
            isRecording = true;
            recordBtn.textContent = '⏹ 녹화 중지';
            statusDiv.textContent = '🔴 녹화 중... (처음부터 재생)';

            play(); // 현재 시간 0부터 시작
        });

        (function init() {
            drawCanvas();
            ctx.fillStyle = '#aaa'; ctx.font = "24px 'Nanum Brush Script', cursive";
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('📂 SRT 파일을 로드해주세요', W/2, H/2);
        })();

        window.addEventListener('beforeunload', function() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        });
    })();
</script>
</body>
</html>
