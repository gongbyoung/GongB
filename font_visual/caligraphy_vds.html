<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 캘리그라피 스튜디오 (통합 v24)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Gaegu:wght@300;400;700&family=Nanum+Brush+Script&family=Nanum+Pen+Script&family=Yeon+Sung&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

  <style>
    :root { --bg-dark: #121214; --panel-bg: #1e1e24; --panel-border: #2d2d38; --accent-color: #ff6b35; --accent-gradient: linear-gradient(135deg, #ff6b35, #f72585); --text-main: #f0f0f5; --text-muted: #a0a0b0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #18181c; padding: 12px 24px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 380px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .preview-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0c; align-items: center; justify-content: center; padding: 20px; position: relative; }
    .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 75vh; }
    canvas { display: block; max-width: 100%; max-height: 75vh; object-fit: contain; }
    
    /* 우측 LOG 패널 (신규) */
    #log-panel { position: fixed; right: 10px; top: 10px; width: 300px; max-height: 90vh; background: rgba(30, 30, 36, 0.95); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; overflow-y: auto; z-index: 999; font-size: 0.8rem; }
    #log-panel h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid #444; padding-bottom: 5px; }
    .log-entry { border-bottom: 1px dashed #333; padding: 5px 0; color: var(--text-muted); }
    .log-entry strong { color: #4ecdc4; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
    button.btn-action { background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.btn-secondary { background: #2b2b38; border: 1px solid var(--panel-border); color: var(--text-main); padding: 10px 16px; border-radius: 6px; cursor: pointer; }

    .section-title { font-size: 0.9rem; font-weight: 700; color: var(--accent-color); text-transform: uppercase; margin-bottom: 6px; }
    select, input[type="range"], input[type="color"], textarea { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; margin-bottom: 4px; }
    label { font-size: 0.82rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 6px; }
    .srt-list-container { max-height: 120px; overflow-y: auto; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; }
    .progress-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; display: none; }
    .progress-box { background: var(--panel-bg); padding: 30px; border-radius: 12px; text-align: center; width: 360px; }
    .progress-bar-bg { width: 100%; height: 10px; background: #111; border-radius: 5px; margin: 15px 0; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--accent-gradient); }
    .font-status { font-size: 0.72rem; margin-top: 2px; }
    .font-status.ready { color: #7cd992; }
    .font-status.loading { color: #ffcf6b; }
  </style>
</head>
<body>
  <header>
    <h1>🖌️ SRT 캘리그라피 스튜디오 v24 (붓 터치 + LOG)</h1>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="section-title">📂 1. SRT 불러오기</div>
      <label for="srt-input" class="btn-file" id="srt-label" style="padding: 12px; background: #2a2a36; border: 2px dashed var(--accent-color); border-radius: 8px; text-align: center; cursor: pointer;">📁 SRT 파일 열기</label>
      <input type="file" id="srt-input" accept=".srt">
      <textarea id="srt-textarea" style="height: 80px;"></textarea>
      <button class="btn-secondary" onclick="loadSRTData(document.getElementById('srt-textarea').value)">✏️ 적용</button>

      <div class="section-title">📐 2. 비율</div>
      <select id="aspect-ratio-select">
        <option value="16:9" selected>16:9 가로</option>
        <option value="9:16">9:16 세로</option>
      </select>

      <div class="section-title">🖌️ 3. 서체</div>
      <select id="font-family">
        <option value="'Nanum Brush Script', cursive" selected>나눔붓글씨</option>
        <option value="'Yeon Sung', cursive">연성체</option>
        <option value="'Dongle', sans-serif">동글체</option>
      </select>
      <div class="font-status loading" id="font-status">⏳ 폰트 로딩 중...</div>

      <div class="section-title">🎨 4. 붓 터치 스타일 (핵심)</div>
      <select id="morph-style">
        <option value="none">✨ 기본</option>
        <option value="soft-bubble">🥚 둥글둥글 (부드러운 붓)</option>
        <option value="sharp-spike">🗡️ 뾰족한 선 (거친 빠른 붓)</option>
        <option value="contrast-dynamic">🦁 강약 (중요 단어 크게)</option>
        <option value="ink-shade">💧 농담 (먹 번짐)</option>
        <option value="deform-free">🧬 변형 (키다리/혹부리)</option>
        <option value="curved-flow">🌊 구도 (곡선 배치)</option>
        <option value="seal">🔴 전서체 (도장)</option>
      </select>

      <div class="section-title">🎚️ 5. 슬라이더</div>
      <label>POWER (강도) <span id="val-power">1.0x</span></label>
      <input type="range" id="power-slider" min="0.1" max="3.0" step="0.1" value="1.0">
      
      <label>줄간격 <span id="val-line">1.2x</span></label>
      <input type="range" id="line-slider" min="0.5" max="2.0" step="0.1" value="1.2">

      <div class="section-title">🖼️ 6. 배경/색</div>
      <select id="bg-style">
        <option value="hanji" selected>한지</option>
        <option value="dark-paper">어두운 종이</option>
        <option value="transparent">투명</option>
        <option value="black">검정</option>
      </select>
      <input type="color" id="ink-color" value="#1c1917">
      
      <div class="section-title">📜 7. 자막 리스트</div>
      <div class="srt-list-container" id="srt-list"></div>
    </div>

    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
      </div>
      <div class="controls">
        <button class="btn-action" onclick="startRecording()">🔴 녹화 (0초부터 자동 저장)</button>
        <button class="btn-secondary" onclick="togglePlay()">▶ 재생/정지</button>
      </div>
    </div>
  </div>

  <!-- 우측 로그 -->
  <div id="log-panel">
    <h3>📊 렌더링 LOG</h3>
    <div id="log-messages"></div>
  </div>

  <script>
    // ========== 로그 함수 ==========
    function logMessage(msg) {
      const logDiv = document.getElementById('log-messages');
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = msg;
      logDiv.prepend(div);
      if(logDiv.children.length > 30) logDiv.removeChild(logDiv.lastChild);
    }

    // ========== 기존 변수들 (그대로 유지) ==========
    const canvas = document.getElementById('calligraphy-canvas');
    const ctx = canvas.getContext('2d');
    let srtData = [], totalDuration = 0, currentTime = 0, isPlaying = false, animationFrameId = null, lastTimestamp = 0;
    let currentFont = null, currentFontKey = null;
    const glyphDataCache = new Map();
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');
    
    // ========== 신규 변수 ==========
    const powerSlider = document.getElementById('power-slider');
    const lineSlider = document.getElementById('line-slider');
    const morphStyleSelect = document.getElementById('morph-style');
    const power = () => parseFloat(powerSlider.value);
    const lineHeightMul = () => parseFloat(lineSlider.value);

    // ========== 신규 스타일 파라미터 엔진 (붓의 강약, 농담, 속도) ==========
    function getStyleParams(style) {
      const p = power();
      let sp = { width: 1.0, jitter: 1.0, alpha: 1.0, size: 1.0, curve: 0, deform: false };
      switch(style) {
        case 'soft-bubble': // 둥글둥글: 붓을 부드럽게 눌러 발랄하고 귀여운 느낌
          sp.width = 2.0 * p; sp.jitter = 0.1; sp.alpha = 0.65; sp.size = 1.1; break;
        case 'sharp-spike': // 뾰족한 선: 강하고 빠르게 획을 빼며 거친 느낌
          sp.width = 0.4; sp.jitter = 2.8; sp.alpha = 1.0; sp.size = 0.9; break;
        case 'contrast-dynamic': // 강약 조절: 중요한 단어 크게, 보조 단어 작게
          sp.width = 1.2; sp.jitter = 1.2; sp.alpha = 0.9; sp.size = 1.5; break;
        case 'ink-shade': // 농담 조절: 먹의 농도와 물의 양 조절
          sp.alpha = 0.35; sp.width = 1.0; sp.jitter = 0.8; break;
        case 'deform-free': // 크기 배분, 변형과 탈피, 시작/끝 뭉치기 (혹부리)
          sp.size = 1.6 * p; sp.deform = true; break;
        case 'curved-flow': // 구도 잡기: 일직선이 아닌 곡선 배치
          sp.curve = 40 * p; sp.width = 1.2; break;
        case 'seal': // 도장 전서체: 틀에 꽉 차게
          sp.width = 1.8; sp.size = 1.4 * p; break;
        default: sp = { width: 1, jitter: 1, alpha: 1, size: 1, curve: 0, deform: false };
      }
      logMessage(`<strong>[${morphStyleSelect.options[morphStyleSelect.selectedIndex].text}]</strong> 두께:${sp.width.toFixed(1)}, 거칠기:${sp.jitter}, 농담:${sp.alpha}, 강도(POWER):${p}`);
      return sp;
    }

    // ========== 기존 폰트 로드 & 그리기 함수들 ==========
    const FONT_URLS = { "'Nanum Brush Script', cursive": "...", "'Yeon Sung', cursive": "...", "'Dongle', sans-serif": "..." };
    const fontObjectCache = {};
    function loadOpentypeFont(familyValue) { if (fontObjectCache[familyValue]) return fontObjectCache[familyValue]; const url = FONT_URLS[familyValue]; const p = new Promise((resolve, reject) => opentype.load(url, (err, font) => err ? reject(err) : resolve(font))); fontObjectCache[familyValue] = p; return p; }
    
    async function ensureFontLoaded() {
      const key = document.getElementById('font-family').value;
      if (currentFontKey === key && currentFont) return currentFont;
      document.getElementById('font-status').textContent = '⏳ 폰트 로딩 중...';
      document.getElementById('font-status').className = 'font-status loading';
      try { const font = await loadOpentypeFont(key); currentFont = font; currentFontKey = key; glyphDataCache.clear(); document.getElementById('font-status').textContent = '✅ 준비 완료'; document.getElementById('font-status').className = 'font-status ready'; renderFrame(currentTime); } catch(e) { document.getElementById('font-status').textContent = '⚠️ 폰트 실패'; }
      return currentFont;
    }

    function flattenGlyphPath(commands) { const contours=[];let current=[];let sx=0,sy=0,cx=0,cy=0;const STEPS=10;const push=()=>{if(current.length>1)contours.push(current);current=[];};commands.forEach(c=>{if(c.type==='M'){push();cx=c.x;cy=c.y;sx=cx;sy=cy;current.push({x:cx,y:cy});}else if(c.type==='L'){cx=c.x;cy=c.y;current.push({x:cx,y:cy});}else if(c.type==='C'){for(let i=1;i<=STEPS;i++){const t=i/STEPS,mt=1-t;current.push({x:mt*mt*mt*cx+3*mt*mt*t*c.x1+3*mt*t*t*c.x2+t*t*t*c.x,y:mt*mt*mt*cy+3*mt*mt*t*c.y1+3*mt*t*t*c.y2+t*t*t*c.y});}cx=c.x;cy=c.y;}else if(c.type==='Q'){for(let i=1;i<=STEPS;i++){const t=i/STEPS,mt=1-t;current.push({x:mt*mt*cx+2*mt*t*c.x1+t*t*c.x,y:mt*mt*cy+2*mt*t*c.y1+t*t*c.y});}cx=c.x;cy=c.y;}else if(c.type==='Z'){current.push({x:sx,y:sy});cx=sx;cy=sy;}});push();return contours;}
    function contourLength(pts){let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return len;}
    function commandsToSvgD(c){return c.map(x=>{switch(x.type){case'M':return`M ${x.x} ${x.y}`;case'L':return`L ${x.x} ${x.y}`;case'C':return`C ${x.x1} ${x.y1} ${x.x2} ${x.y2} ${x.x} ${x.y}`;case'Q':return`Q ${x.x1} ${x.y1} ${x.x} ${x.y}`;case'Z':return'Z';default:return'';}}).join(' ');}
    function getGlyphBrushData(char, fontSize) { const key=`${currentFontKey}|${char.codePointAt(0)}|${fontSize.toFixed(1)}`; if(glyphDataCache.has(key))return glyphDataCache.get(key); const path=currentFont.getPath(char,0,0,fontSize); let bbox; try{bbox=path.getBoundingBox();}catch(e){bbox={x1:0,y1:-fontSize*0.5,x2:fontSize*0.3,y2:0};} const rawContours=flattenGlyphPath(path.commands); const contours=rawContours.map(pts=>{let minX=Infinity,minY=Infinity;pts.forEach(p=>{if(p.x<minX)minX=p.x;if(p.y<minY)minY=p.y;});return{points:pts,length:contourLength(pts),minX,minY};}); contours.sort((a,b)=>(a.minY-b.minY)||(a.minX-b.minX)); const totalLength=contours.reduce((s,c)=>s+c.length,0)||fontSize*0.2; const data={contours,totalLength,bbox,svgD:commandsToSvgD(path.commands),isBlank:rawContours.length===0}; glyphDataCache.set(key,data); return data; }

    // ========== 신규: 스타일이 적용된 실제 점 찍기 엔진 ==========
    function stampSegment(targetCtx, p0, p1, distSoFar, contourLen, baseWidth, seed, sp) {
      const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const steps = Math.max(1, Math.ceil(segLen / 2));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const px = p0.x + (p1.x - p0.x) * t;
        const py = p0.y + (p1.y - p0.y) * t;
        const localDist = distSoFar + segLen * t;
        const travelT = contourLen > 0 ? Math.min(1, localDist / contourLen) : 1;
        
        // 붓의 강약과 속도감, 터치 스타일을 계산
        const taper = Math.sin(Math.min(1, travelT) * Math.PI);
        const jitter = (0.85 + seededRandom(seed + localDist * 0.37) * 0.3) * sp.jitter;
        const r = Math.max(0.6, (baseWidth / 2) * (0.35 + 0.75 * taper) * jitter * sp.width);
        
        // 농담 (먹의 진함)
        const alpha = (0.85 + seededRandom(seed + localDist * 0.13) * 0.15) * sp.alpha;
        
        targetCtx.globalAlpha = Math.min(1, alpha);
        targetCtx.beginPath();
        targetCtx.arc(px, py, r, 0, Math.PI * 2);
        targetCtx.fill();
      }
      targetCtx.globalAlpha = 1;
    }

    // ========== 신규: 변형 및 구도가 적용된 레이아웃 ==========
    function layoutShapeText(text, shapeType, bounds, tightness, contrast, layoutStyle, sp) {
      let lines = text.split('\n').filter(l => l.trim().length > 0);
      if (lines.length === 1 && text.includes(' ')) lines = text.split(' ').filter(l => l.trim().length > 0);
      if (lines.length === 0) lines = [text];

      const N = lines.length;
      const positions = [], sizes = [];
      const lineHeight = 1.1 * lineHeightMul();

      lines.forEach((lineText, lineIdx) => {
        const t = N === 1 ? 0.5 : (lineIdx + 0.5) / N;
        // 구도 잡기 (곡선 배치)
        const curveOffset = Math.sin(lineIdx * 2) * sp.curve;
        const y = bounds.y + bounds.h * (N === 1 ? 0.5 : (0.12 + 0.76 * t)) + curveOffset;

        let baseSize = bounds.w / Math.max(1, lineText.length * 0.95);
        baseSize = Math.min(baseSize, (bounds.h * 0.8) / (N * lineHeight));
        baseSize = Math.max(22, baseSize);

        const charSpacing = baseSize * tightness * 0.9;
        const totalLineWidth = (lineText.length - 1) * charSpacing;
        const startX = bounds.x + bounds.w / 2 - totalLineWidth / 2;

        Array.from(lineText).forEach((ch, charIdx) => {
          let finalSize = baseSize;
          
          // 강약 조절 및 크기 배분
          if (sp.deform) {
            if (['ㄴ','ㅡ','ㅠ','ㅛ'].includes(ch)) finalSize *= 1.7 * power(); // 오른쪽 늘이기
            else if (['ㅁ','ㅇ','ㅎ','ㅂ'].includes(ch)) finalSize *= 1.4; // 가운데 부풀리기
            else finalSize *= 1.2 * power(); // 키다리
          } else if (lineIdx === 0 && sp.size > 1.2) {
            finalSize *= sp.size; // 강약 조절 (시선을 끄는 단어)
          } else {
            finalSize *= 0.95;
          }

          positions.push({ x: startX + charIdx * charSpacing, y, ch });
          sizes.push(finalSize);
        });
      });
      return { positions, sizes, rawChars: positions.map(p => p.ch) };
    }

    // ========== 신규: 스타일이 적용된 글자 그리기 ==========
    function drawBrushGlyph(targetCtx, glyphData, centerX, centerY, revealLength, fullyDone, seed, brushScale, sp, char) {
      if (glyphData.isBlank) return;
      const bbox = glyphData.bbox;
      const offX = centerX - (bbox.x1 + bbox.x2) / 2;
      const offY = centerY - (bbox.y1 + bbox.y2) / 2;

      targetCtx.save();
      targetCtx.translate(offX, offY);

      // 변형과 탈피 (특정 모음 변화)
      if (sp.deform) {
        if (['ㄴ','ㅡ','ㅠ','ㅛ'].includes(char)) targetCtx.scale(1.8 * power(), 1);
        else if (['ㅁ','ㅇ','ㅎ','ㅂ'].includes(char)) targetCtx.scale(1.3, 1.3);
        else targetCtx.scale(0.8, 1.4 * power());
      }
      
      // 전서체 (도장처럼 꽉 차게)
      if (morphStyleSelect.value === 'seal') targetCtx.scale(1.25 * power(), 1.25 * power());

      if (fullyDone) {
        try {
          const p2d = new Path2D(glyphData.svgD);
          targetCtx.fill(p2d, 'nonzero');
          // 혹부리 (시작점, 끝점 뭉치기)
          if (sp.deform && power() > 1.0) {
            glyphData.contours.forEach(c => {
              const p1 = c.points[0]; const p2 = c.points[c.points.length-1];
              targetCtx.beginPath(); targetCtx.arc(p1.x, p1.y, 10 * power(), 0, Math.PI*2); targetCtx.fill();
              targetCtx.beginPath(); targetCtx.arc(p2.x, p2.y, 10 * power(), 0, Math.PI*2); targetCtx.fill();
            });
          }
        } catch(e) {}
        targetCtx.restore(); return;
      }

      let remaining = revealLength;
      const baseWidth = Math.max(3, (bbox.y2 - bbox.y1) * 0.045 * brushScale);

      for (const contour of glyphData.contours) {
        if (remaining <= 0) break;
        const drawLen = Math.min(contour.length, remaining);
        remaining -= drawLen;
        const pts = contour.points;
        let acc = 0;
        for (let i = 1; i < pts.length; i++) {
          const segLen = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
          if (acc + segLen > drawLen) {
            const localT = segLen > 0 ? (drawLen - acc) / segLen : 0;
            const ex = pts[i-1].x + (pts[i].x - pts[i-1].x) * localT;
            const ey = pts[i-1].y + (pts[i].y - pts[i-1].y) * localT;
            stampSegment(targetCtx, pts[i-1], { x: ex, y: ey }, acc, contour.length, baseWidth, seed, sp);
            break;
          } else {
            stampSegment(targetCtx, pts[i-1], pts[i], acc, contour.length, baseWidth, seed, sp);
            acc += segLen;
          }
        }
      }
      targetCtx.restore();
    }

    // ========== 기존 렌더링 프레임 (신규 로직 연결) ==========
    function renderFrame(timeSec) {
      drawBackground();
      if (!currentFont) return;

      const sp = getStyleParams(morphStyleSelect.value);
      const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
      if (!activeSubtitle) return;

      const text = activeSubtitle.text.trim();
      const duration = Math.max(0.5, activeSubtitle.end - activeSubtitle.start);
      const writeProgress = Math.min(1, (timeSec - activeSubtitle.start) / (duration * 0.7));
      const seed = (parseInt(activeSubtitle.id) || 1) * 97 + text.length;

      const bounds = { x: canvas.width * 0.1, y: canvas.height * 0.1, w: canvas.width * 0.8, h: canvas.height * 0.8 };
      const { positions, sizes } = layoutShapeText(text, 'inv-triangle', bounds, 0.75, 2.4, 'multiline-fit', sp);
      const { plan, totalLen } = computeCharPlan(positions.map(p=>p.ch), sizes);
      const inkRevealed = writeProgress * totalLen;

      plan.forEach((item, i) => {
        if (item.ch === ' ') return;
        const pos = positions[i];
        if (inkRevealed >= item.cumEnd) drawBrushGlyph(ctx, item.data, pos.x, pos.y, 0, true, seed + i*13, 1, sp, item.ch);
        else if (inkRevealed > item.cumEnd - item.length) drawBrushGlyph(ctx, item.data, pos.x, pos.y, inkRevealed - (item.cumEnd - item.length), false, seed + i*13, 1, sp, item.ch);
      });
    }

    // ========== 기존 유틸리티 및 플레이어 함수들 (완전 통합) ==========
    function computeCharPlan(chars, sizes) { let cum=0; const plan=chars.map((ch,i)=>{let data=null,length;if(ch!==' '){data=getGlyphBrushData(ch,sizes[i]);length=Math.max(data.totalLength,sizes[i]*0.2);}else{length=sizes[i]*0.3;}cum+=length;return{ch,data,length,cumEnd:cum};});return{plan,totalLen:cum||1};}
    function seededRandom(seed){let x=Math.sin(seed++)*10000;return x-Math.floor(x);}
    function drawBackground() { const s=document.getElementById('bg-style').value; ctx.clearRect(0,0,canvas.width,canvas.height); if(s==='hanji'){let g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,100,canvas.width/2,canvas.height/2,800);g.addColorStop(0,'#f8f4eb');g.addColorStop(1,'#e3d7c3');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);} else if(s==='transparent'){return;} else if(s==='dark-paper'){ctx.fillStyle='#16161a';ctx.fillRect(0,0,canvas.width,canvas.height);} else {ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);} }

    function parseSRT(text){const n=text.replace(/\r/g,'\n');const b=n.split('\n\n');const r=[];for(let bl of b){const l=bl.trim().split('\n');if(l.length>=3){const tm=l[1].match(/(.*?)\s*-->\s*(.*)/);if(tm)r.push({id:l[0],start:parseTime(tm[1]),end:parseTime(tm[2]),text:l.slice(2).join('\n')});}}return r;}
    function parseTime(t){if(!t)return 0;const p=t.trim().replace(',','.').split(':');return(+p[0]||0)*3600+(+p[1]||0)*60+(+p[2]||0);}
    function loadSRTData(rawText){document.getElementById('srt-textarea').value=rawText;srtData=parseSRT(rawText);totalDuration=srtData.length>0?srtData[srtData.length-1].end+1.0:10;document.getElementById('time-slider')?document.getElementById('time-slider').max=totalDuration:null;updateSRTListUI();renderFrame(0);}
    function updateSRTListUI(){const el=document.getElementById('srt-list');el.innerHTML='';srtData.forEach(i=>{const d=document.createElement('div');d.className='srt-item';d.innerHTML=`<span>#${i.id} (${formatTime(i.start)})</span> <span>${i.text.replace('\n',' / ')}</span>`;d.style.cssText='padding:6px 10px;border-bottom:1px solid #222;cursor:pointer;font-size:0.8rem;';d.onclick=()=>{currentTime=i.start;renderFrame(currentTime);};el.appendChild(d);});}
    function formatTime(s){const m=Math.floor(s/60),ss=Math.floor(s%60),ms=Math.floor((s%1)*100);return`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;}

    function togglePlay(){ if(isPlaying){pause();}else{play();} }
    function play(){if(isPlaying)return;isPlaying=true;lastTimestamp=0;animationFrameId=requestAnimationFrame(animate);}
    function pause(){isPlaying=false;if(animationFrameId)cancelAnimationFrame(animationFrameId);}
    function animate(t){if(!isPlaying)return;if(!lastTimestamp)lastTimestamp=t;const d=(t-lastTimestamp)/1000;lastTimestamp=t;currentTime+=d;if(isRecording&&currentTime>=totalDuration){currentTime=totalDuration;stopRecording();return;}if(currentTime>totalDuration){currentTime=totalDuration;pause();}renderFrame(currentTime);if(isPlaying)animationFrameId=requestAnimationFrame(animate);}

    // ========== 녹화 & 마스크 및 초기화 (완전 유지) ==========
    let mediaRecorder=null,recordedChunks=[],isRecording=false,stream=null;
    function startRecording(){pause();currentTime=0;renderFrame(0);if(!stream)stream=canvas.captureStream(30);const mimeTypes=['video/webm;codecs=vp9','video/webm;codecs=vp8'];let mimeType='';for(const m of mimeTypes){if(MediaRecorder.isTypeSupported(m)){mimeType=m;break;}}if(!mimeType){alert('녹화 미지원 브라우저');return;}recordedChunks=[];mediaRecorder=new MediaRecorder(stream,{mimeType:mimeType,videoBitsPerSecond:8000000});mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data);};mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:mimeType});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`calligraphy_${Date.now()}.webm`;a.click();URL.revokeObjectURL(url);};mediaRecorder.start(100);isRecording=true;play();logMessage('🔴 녹화가 시작되었습니다. (0초부터 자동 재생)');}
    function stopRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();pause();logMessage('✅ 영상이 자동 저장되었습니다.');}

    // 슬라이더 및 스타일 변경 시 로그 남기기
    morphStyleSelect.addEventListener('change',()=>{logMessage(`스타일이 <strong>${morphStyleSelect.options[morphStyleSelect.selectedIndex].text}</strong>(으)로 변경되었습니다.`);renderFrame(currentTime);});
    powerSlider.addEventListener('input',(e)=>{document.getElementById('val-power').textContent=e.target.value+'x';logMessage(`POWER 강도가 <strong>${e.target.value}x</strong>로 변경되었습니다.`);renderFrame(currentTime);});
    lineSlider.addEventListener('input',(e)=>{document.getElementById('val-line').textContent=e.target.value+'x';logMessage(`줄간격이 <strong>${e.target.value}x</strong>로 변경되었습니다.`);renderFrame(currentTime);});

    document.getElementById('srt-input').addEventListener('change',(e)=>{const file=e.target.files[0];if(!file)return;document.getElementById('srt-label').textContent=`📄 ${file.name}`;const reader=new FileReader();reader.onload=(evt)=>loadSRTData(evt.target.result);reader.readAsText(file);});
    document.getElementById('font-family').addEventListener('change',ensureFontLoaded);
    document.getElementById('aspect-ratio-select').addEventListener('change',()=>{const r=document.getElementById('aspect-ratio-select').value;canvas.width=r==='9:16'?1080:1920;canvas.height=r==='9:16'?1920:1080;renderFrame(currentTime);});

    // 초기화 및 폰트 로드
    const demoSRT = `1\n00:00:00,000 --> 00:00:04,500\n황혼이 오늘도 바다가 되어\n\n2\n00:00:05,000 --> 00:00:08,500\n잠기고 잠기고\n\n3\n00:00:09,000 --> 00:00:13,000\n오늘이 가장 행복한 날`;
    loadSRTData(demoSRT);
    ensureFontLoaded();
  </script>
</body>
</html>
