<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 캘리그라피 스튜디오 (진짜 붓터치 + LOG v23)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Gaegu:wght@300;400;700&family=Nanum+Brush+Script&family=Nanum+Pen+Script&family=Yeon+Sung&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

  <style>
    :root { --bg-dark: #121214; --panel-bg: #1e1e24; --panel-border: #2d2d38; --accent-color: #ff6b35; --text-main: #f0f0f5; --text-muted: #a0a0b0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #18181c; padding: 12px 24px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 380px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .preview-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0c; align-items: center; justify-content: center; padding: 20px; position: relative; }
    .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 75vh; }
    canvas { display: block; max-width: 100%; max-height: 75vh; object-fit: contain; }
    
    /* 우측 LOG 패널 */
    #log-panel {
      position: fixed; right: 10px; top: 10px; width: 300px; max-height: 80vh;
      background: rgba(30, 30, 36, 0.95); border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 15px; overflow-y: auto; z-index: 999; font-size: 0.8rem;
    }
    #log-panel h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 1rem; }
    .log-entry { border-bottom: 1px dashed #333; padding: 5px 0; color: var(--text-muted); }
    .log-entry strong { color: #4ecdc4; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
    button.btn-action { background: linear-gradient(135deg, #ff6b35, #f72585); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    select, input[type="range"], input[type="color"] { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; margin-bottom: 4px; }
    label { font-size: 0.82rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 6px; }
    .font-status.ready { color: #7cd992; font-size: 0.8rem; }
    .font-status.loading { color: #ffcf6b; font-size: 0.8rem; }
    .progress-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; display: none; }
    .progress-box { background: var(--panel-bg); padding: 30px; border-radius: 12px; text-align: center; width: 360px; }
    .progress-bar-bg { width: 100%; height: 10px; background: #111; border-radius: 5px; margin: 15px 0; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--accent-gradient, linear-gradient(135deg, #ff6b35, #f72585)); }
  </style>
</head>
<body>
  <header>
    <h1>🖌️ SRT 캘리그라피 스튜디오 v23 (실시간 붓질 & LOG)</h1>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <h3 style="margin-bottom:10px;">📂 1. SRT & 설정</h3>
      <input type="file" id="srt-input" accept=".srt">
      <textarea id="srt-textarea" style="width:100%; height:80px; background:#141418; color:white; border:1px solid #333;"></textarea>
      <button class="btn-action" style="width:100%" onclick="loadSRTData(document.getElementById('srt-textarea').value)">자막 적용</button>

      <h3 style="margin-top:20px;">📐 2. 캔버스 비율</h3>
      <select id="aspect-ratio-select">
        <option value="16:9" selected>16:9 가로형</option>
        <option value="9:16">9:16 세로형</option>
      </select>

      <h3 style="margin-top:20px;">🖌️ 3. 붓글씨 서체</h3>
      <select id="font-family">
        <option value="'Nanum Brush Script', cursive" selected>나눔붓글씨</option>
        <option value="'Yeon Sung', cursive">연성체</option>
        <option value="'Dongle', sans-serif">동글체</option>
        <option value="'Gaegu', cursive">개구체</option>
        <option value="'Nanum Pen Script', cursive">나눔펜</option>
      </select>

      <h3 style="margin-top:20px;">🪄 4. 붓 스타일 (강약 & 농담 & 변형)</h3>
      <select id="morph-style">
        <option value="none">✨ 기본 획 (기본 붓)</option>
        <option value="soft-bubble">🥚 둥글둥글 유선형 (부드러운 먹)</option>
        <option value="sharp-spike">🗡️ 뾰족한 가는획 (거친 빠른 붓)</option>
        <option value="contrast-dynamic">🦁 강약/포인트 (첫 단어 강조)</option>
        <option value="ink-shade">💧 농담 조절 (먹 번짐)</option>
        <option value="deform-free">🧬 자유 변형 (늘리기/부풀리기/키다리)</option>
        <option value="curved-flow">🌊 구도 잡기 (곡선 배치)</option>
        <option value="seal">🔴 전서체 (도장 꽉 채움)</option>
      </select>

      <h3 style="margin-top:20px;">🎚️ 5. 커스텀 슬라이더</h3>
      <label>스타일 POWER (변형 강도) <span id="val-power">1.0x</span></label>
      <input type="range" id="power-slider" min="0.1" max="3.0" step="0.1" value="1.0">
      
      <label>줄간격 (행간) <span id="val-line">1.2x</span></label>
      <input type="range" id="line-slider" min="0.5" max="2.0" step="0.1" value="1.2">

      <h3 style="margin-top:20px;">📜 6. 배경 & 색</h3>
      <select id="bg-style">
        <option value="hanji" selected>전통 한지</option>
        <option value="dark-paper">어두운 종이</option>
        <option value="transparent">투명</option>
        <option value="black">검정</option>
      </select>
      <input type="color" id="ink-color" value="#1c1917">
    </div>

    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
      </div>
      
      <div class="controls">
        <button class="btn-action" onclick="startRecording()">🔴 녹화 시작 (0초부터 자동 재생, 끝나면 저장)</button>
        <button onclick="togglePlay()" style="padding:10px 20px;">▶ 일시정지 / 재생</button>
      </div>
    </div>
  </div>

  <!-- 우측 실시간 로그 패널 -->
  <div id="log-panel">
    <h3>📊 실시간 렌더링 LOG</h3>
    <div id="log-messages"><div class="log-entry">시스템 준비됨...</div></div>
  </div>

  <script>
    // 로그 함수
    function logMessage(msg) {
      const logDiv = document.getElementById('log-messages');
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = msg;
      logDiv.prepend(div);
      if(logDiv.children.length > 20) logDiv.removeChild(logDiv.lastChild);
    }

    const canvas = document.getElementById('calligraphy-canvas');
    const ctx = canvas.getContext('2d');
    const powerSlider = document.getElementById('power-slider');
    const lineSlider = document.getElementById('line-slider');
    const morphStyle = document.getElementById('morph-style');

    let srtData = [], totalDuration = 0, currentTime = 0, isPlaying = false;
    let currentFont = null;
    const FONT_URLS = { "'Nanum Brush Script', cursive": "...", "'Yeon Sung', cursive": "...", "'Dongle', sans-serif": "...", "'Gaegu', cursive": "...", "'Nanum Pen Script', cursive": "..." };
    // (폰트 링크 확인용 더미 주석: 실제 로드 링크는 기존 코드와 동일하게 유지)

    const power = () => parseFloat(powerSlider.value);
    const lineHeightMul = () => parseFloat(lineSlider.value);

    // [핵심 수정] 붓 스타일 파라미터 반환
    function getStyleParams(style) {
      let params = { jitterScale: 1, widthScale: 1, alphaScale: 1, sizeScale: 1, curveY: 0, skew: 0 };
      const p = power();
      switch(style) {
        case 'soft-bubble': params = { jitterScale: 0.3, widthScale: 2.2 * p, alphaScale: 0.75, sizeScale: 1.1, curveY: 0, skew: 0 }; break;
        case 'sharp-spike': params = { jitterScale: 2.5, widthScale: 0.4 / p, alphaScale: 1.0, sizeScale: 0.9, curveY: 0, skew: 0 }; break;
        case 'contrast-dynamic': params = { jitterScale: 1.2, widthScale: 1.2, alphaScale: 0.9, sizeScale: 1.2, curveY: 0, skew: 0 }; break;
        case 'ink-shade': params = { jitterScale: 0.9, widthScale: 1.0, alphaScale: 0.5, sizeScale: 1.0, curveY: 0, skew: 0 }; break;
        case 'deform-free': params = { jitterScale: 0.8, widthScale: 1.0, alphaScale: 1.0, sizeScale: 1.5 * p, curveY: 0, skew: 0 }; break;
        case 'curved-flow': params = { jitterScale: 1.0, widthScale: 1.0, alphaScale: 1.0, sizeScale: 1.0, curveY: 30 * p, skew: 0 }; break;
        case 'seal': params = { jitterScale: 0.1, widthScale: 1.8, alphaScale: 1.0, sizeScale: 1.4 * p, curveY: 0, skew: 0 }; break;
        default: params = { jitterScale: 1, widthScale: 1, alphaScale: 1, sizeScale: 1, curveY: 0, skew: 0 };
      }
      logMessage(`<strong>[${style}]</strong> 두께:${params.widthScale}, 지터:${params.jitterScale}, 농담:${params.alphaScale}, 강도:${p}`);
      return params;
    }

    // [핵심 수정] 점 찍기 알고리즘 (스타일에 따른 두께, 속도, 농담)
    function stampSegment(targetCtx, p0, p1, distSoFar, contourLen, baseWidth, seed, sp) {
      const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const steps = Math.max(1, Math.ceil(segLen / 2));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const px = p0.x + (p1.x - p0.x) * t;
        const py = p0.y + (p1.y - p0.y) * t;
        const localDist = distSoFar + segLen * t;
        const travelT = contourLen > 0 ? Math.min(1, localDist / contourLen) : 1;
        
        // 붓의 강약 (획 굵기 변화)
        const taper = Math.sin(Math.min(1, travelT) * Math.PI);
        const jitter = (0.85 + seededRandom(seed + localDist * 0.37) * 0.3) * sp.jitterScale;
        const r = Math.max(0.6, (baseWidth / 2) * (0.35 + 0.75 * taper) * jitter * sp.widthScale);
        
        // 농담 (먹의 진하기)
        const alpha = (0.85 + seededRandom(seed + localDist * 0.13) * 0.15) * sp.alphaScale;
        
        targetCtx.globalAlpha = Math.min(1, alpha);
        targetCtx.beginPath();
        targetCtx.arc(px, py, r, 0, Math.PI * 2);
        targetCtx.fill();
      }
      targetCtx.globalAlpha = 1;
    }

    // 글자 배치 로직 수정 (줄 간격, 곡선 구도, 강약 포인트)
    function layoutShapeText(text, shapeType, bounds, tightness, contrast, layoutStyle, sp) {
      let lines = text.split('\n').filter(l => l.trim().length > 0);
      if (lines.length === 1 && text.includes(' ')) lines = text.split(' ').filter(l => l.trim().length > 0);
      if (lines.length === 0) lines = [text];

      const N = lines.length;
      const positions = [], sizes = [];
      const lineHeight = 1.1 * lineHeightMul(); // 줄간격 슬라이더 적용

      lines.forEach((lineText, lineIdx) => {
        const t = N === 1 ? 0.5 : (lineIdx + 0.5) / N;
        // 구도(곡선) 잡기
        const curveOffset = Math.sin(lineIdx * 2) * sp.curveY;
        const y = bounds.y + bounds.h * (N === 1 ? 0.5 : (0.12 + 0.76 * t)) + curveOffset;

        let baseSize = bounds.w / Math.max(1, lineText.length * 0.95);
        baseSize = Math.min(baseSize, (bounds.h * 0.8) / (N * lineHeight));
        baseSize = Math.max(22, baseSize);

        // 강약 조절: 첫 단어는 크게, 뒷단어는 작게
        if (sp.sizeScale !== 1) baseSize *= sp.sizeScale;
        if (lineIdx === 0 && sp.sizeScale > 1.2) baseSize *= (contrast * 1.2);

        const charSpacing = baseSize * tightness * 0.9;
        const totalLineWidth = (lineText.length - 1) * charSpacing;
        const startX = bounds.x + bounds.w / 2 - totalLineWidth / 2;

        Array.from(lineText).forEach((ch, charIdx) => {
          let finalSize = baseSize;
          // 변형 스타일(Deform) 강도 적용
          if (sp.sizeScale > 1.2) {
            if (charIdx % 2 === 0) finalSize *= 1.4; 
            else finalSize *= 0.8;
          }
          positions.push({ x: startX + charIdx * charSpacing, y, ch });
          sizes.push(finalSize);
        });
      });
      return { positions, sizes, rawChars: positions.map(p => p.ch) };
    }

    // 필획 그리기
    function drawBrushGlyph(targetCtx, glyphData, centerX, centerY, revealLength, fullyDone, seed, brushScale, sp, char) {
      if (glyphData.isBlank) return;
      const bbox = glyphData.bbox;
      const gcx = (bbox.x1 + bbox.x2) / 2;
      const gcy = (bbox.y1 + bbox.y2) / 2;
      const offX = centerX - gcx;
      const offY = centerY - gcy;

      targetCtx.save();
      targetCtx.translate(offX, offY);

      // 변형 스타일 적용 (특정 글자 변형)
      if (sp.sizeScale > 1.2) {
        if (['ㄴ','ㅡ','ㅠ','ㅛ'].includes(char)) targetCtx.scale(2.0 * power(), 1); // 오른쪽 늘이기
        else if (['ㅁ','ㅇ','ㅎ','ㅂ'].includes(char)) targetCtx.scale(1.3 * power(), 1.2); // 가운데 부풀리기
        else targetCtx.scale(0.8, 1.8); // 키다리
      }

      // 전서체 (도장)
      if (morphStyle.value === 'seal') targetCtx.scale(1.25 * power(), 1.25 * power());

      // 구도 잡기 (기울임)
      if (sp.skew !== 0) targetCtx.transform(1, sp.skew, 0, 1, 0, 0);

      // 완성된 경우 벡터 패스로 채우기
      if (fullyDone) {
        try {
          const p2d = new Path2D(glyphData.svgD);
          targetCtx.fill(p2d, 'nonzero');
          // 혹부리 (시작/끝점 뭉치기)
          if (morphStyle.value === 'deform-free' && power() > 1.2) {
            glyphData.contours.forEach(c => {
              const p1 = c.points[0]; const p2 = c.points[c.points.length-1];
              targetCtx.beginPath(); targetCtx.arc(p1.x, p1.y, 12 * power(), 0, Math.PI*2); targetCtx.fill();
              targetCtx.beginPath(); targetCtx.arc(p2.x, p2.y, 12 * power(), 0, Math.PI*2); targetCtx.fill();
            });
          }
        } catch(e) {}
        targetCtx.restore(); return;
      }

      // 그리기 진행 중 (획 스탬핑)
      let remaining = revealLength;
      const baseWidth = Math.max(3, (bbox.y2 - bbox.y1) * 0.045 * brushScale);

      for (const contour of glyphData.contours) {
        if (remaining <= 0) break;
        const drawLen = Math.min(contour.length, remaining);
        remaining -= drawLen;
        const pts = contour.points;
        let acc = 0;
        for (let i = 1; i < pts.length; i++) {
          const segLen = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
          if (acc + segLen > drawLen) {
            const localT = segLen > 0 ? (drawLen - acc) / segLen : 0;
            const ex = pts[i-1].x + (pts[i].x - pts[i-1].x) * localT;
            const ey = pts[i-1].y + (pts[i].y - pts[i-1].y) * localT;
            stampSegment(targetCtx, pts[i-1], { x: ex, y: ey }, acc, contour.length, baseWidth, seed, sp);
            break;
          } else {
            stampSegment(targetCtx, pts[i-1], pts[i], acc, contour.length, baseWidth, seed, sp);
            acc += segLen;
          }
        }
      }
      targetCtx.restore();
    }

    // [핵심 수정] 렌더링 프레임 (스타일 파라미터 전달)
    function renderFrame(timeSec) {
      drawBackground();
      if (!currentFont) return;

      const sp = getStyleParams(morphStyle.value);
      const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
      if (!activeSubtitle) return;

      const text = activeSubtitle.text.trim();
      const duration = Math.max(0.5, activeSubtitle.end - activeSubtitle.start);
      const writeProgress = Math.min(1, (timeSec - activeSubtitle.start) / (duration * 0.7));
      const seed = (parseInt(activeSubtitle.id) || 1) * 97 + text.length;

      const bounds = { x: canvas.width * 0.1, y: canvas.height * 0.1, w: canvas.width * 0.8, h: canvas.height * 0.8 };
      const { positions, sizes } = layoutShapeText(text, 'inv-triangle', bounds, 0.75, 2.4, 'multiline-fit', sp);
      const { plan, totalLen } = computeCharPlan(positions.map(p=>p.ch), sizes);
      const inkRevealed = writeProgress * totalLen;

      plan.forEach((item, i) => {
        if (item.ch === ' ') return;
        const pos = positions[i];
        if (inkRevealed >= item.cumEnd) drawBrushGlyph(ctx, item.data, pos.x, pos.y, 0, true, seed + i*13, 1, sp, item.ch);
        else if (inkRevealed > item.cumEnd - item.length) drawBrushGlyph(ctx, item.data, pos.x, pos.y, inkRevealed - (item.cumEnd - item.length), false, seed + i*13, 1, sp, item.ch);
      });
    }

    // ... (나머지 기존 파싱, 플레이어, 자동 녹화 로직은 동일하되, line-slider/power-slider 이벤트 추가) ...
    // 스타일/파라미터 변경 시 로그 남기기 + 리렌더링
    morphStyle.addEventListener('change', () => { logMessage(`스타일이 <strong>${morphStyle.options[morphStyle.selectedIndex].text}</strong>(으)로 변경됨.`); renderFrame(currentTime); });
    powerSlider.addEventListener('input', (e) => { document.getElementById('val-power').textContent = e.target.value + 'x'; renderFrame(currentTime); });
    lineSlider.addEventListener('input', (e) => { document.getElementById('val-line').textContent = e.target.value + 'x'; logMessage(`줄간격이 <strong>${e.target.value}</strong>로 변경됨.`); renderFrame(currentTime); });
    
    // (기존 코드에서 추출한 필수 함수들)
    function drawBackground() { const s = document.getElementById('bg-style').value; ctx.clearRect(0,0,canvas.width,canvas.height); if(s==='hanji'){let g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,100,canvas.width/2,canvas.height/2,800);g.addColorStop(0,'#f8f4eb');g.addColorStop(1,'#e3d7c3');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);} else if(s==='transparent'){return;} else {ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);} }
    function computeCharPlan(chars, sizes) { let cum=0; const plan=chars.map((ch,i)=>{ let data=null,length; if(ch!==' '){data=getGlyphBrushData(ch,sizes[i]);length=Math.max(data.totalLength,sizes[i]*0.2);} else {length=sizes[i]*0.3;} cum+=length; return {ch,data,length,cumEnd:cum}; }); return {plan,totalLen:cum||1}; }
    function getGlyphBrushData(char,fontSize){ const key=`${currentFontKey}|${char.codePointAt(0)}|${fontSize.toFixed(1)}`; if(glyphDataCache.has(key)) return glyphDataCache.get(key); const path=currentFont.getPath(char,0,0,fontSize); let bbox; try{bbox=path.getBoundingBox();}catch(e){bbox={x1:0,y1:-fontSize*0.5,x2:fontSize*0.3,y2:0};} const rawContours=flattenGlyphPath(path.commands); const contours=rawContours.map(pts=>{let minX=Infinity,minY=Infinity;pts.forEach(p=>{if(p.x<minX)minX=p.x;if(p.y<minY)minY=p.y;});return{points:pts,length:contourLength(pts),minX,minY};}); contours.sort((a,b)=>(a.minY-b.minY)||(a.minX-b.minX)); const totalLength=contours.reduce((s,c)=>s+c.length,0); const data={contours,totalLength:totalLength>0?totalLength:fontSize*0.2,bbox,svgD:commandsToSvgD(path.commands),isBlank:rawContours.length===0}; glyphDataCache.set(key,data); return data; }
    function flattenGlyphPath(commands) { const contours=[]; let current=[]; let startX=0,startY=0,curX=0,curY=0; const STEPS=10; const push=()=>{if(current.length>1)contours.push(current);current=[];}; commands.forEach(cmd=>{ if(cmd.type==='M'){push();curX=cmd.x;curY=cmd.y;startX=curX;startY=curY;current.push({x:curX,y:curY});} else if(cmd.type==='L'){curX=cmd.x;curY=cmd.y;current.push({x:curX,y:curY});} else if(cmd.type==='C'){const p0={x:curX,y:curY},p1={x:cmd.x1,y:cmd.y1},p2={x:cmd.x2,y:cmd.y2},p3={x:cmd.x,y:cmd.y};for(let i=1;i<=STEPS;i++){const t=i/STEPS,mt=1-t;const x=mt*mt*mt*p0.x+3*mt*mt*t*p1.x+3*mt*t*t*p2.x+t*t*t*p3.x;const y=mt*mt*mt*p0.y+3*mt*mt*t*p1.y+3*mt*t*t*p2.y+t*t*t*p3.y;current.push({x,y});}curX=cmd.x;curY=cmd.y;} else if(cmd.type==='Z'){current.push({x:startX,y:startY});curX=startX;curY=startY;} }); push(); return contours; }
    function contourLength(pts){let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return len;}
    function commandsToSvgD(commands){return commands.map(c=>{switch(c.type){case'M':return`M ${c.x} ${c.y}`;case'L':return`L ${c.x} ${c.y}`;case'C':return`C ${c.x1} ${c.y1} ${c.x2} ${c.y2} ${c.x} ${c.y}`;case'Q':return`Q ${c.x1} ${c.y1} ${c.x} ${c.y}`;case'Z':return'Z';default:return'';}}).join(' ');}
    function seededRandom(seed){let x=Math.sin(seed++)*10000;return x-Math.floor(x);}
    // ... (녹화 등 마무리 로직)
  </script>
