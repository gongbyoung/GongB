<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캘리그라피 SRT 플레이어</title>
    <!-- 1. 필수: 구글 폰트에서 캘리그라피 폰트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* ... 기존 스타일 유지 ... */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a1a; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; width: 100%; background: #2d2d2d; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h1 { text-align: center; font-weight: 300; letter-spacing: 2px; margin-bottom: 20px; color: #ffd700; font-size: 1.8rem; }
        .canvas-wrapper { position: relative; background: #0a0a0a; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; width: 100%; margin-bottom: 20px; }
        #canvas { display: block; width: 100%; height: 100%; background: #fef9f0; cursor: default; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
        .controls button { background: #444; border: none; color: white; padding: 10px 20px; border-radius: 30px; font-size: 1rem; cursor: pointer; transition: 0.2s; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
        .controls button:hover { background: #666; transform: scale(1.02); }
        .controls button:active { transform: scale(0.96); }
        .controls button.primary { background: #ffd700; color: #1a1a1a; }
        .controls button.primary:hover { background: #ffe44d; }
        .controls button.record { background: #e67e22; }
        .controls button.record:hover { background: #d35400; }
        .file-input-wrapper { display: flex; align-items: center; gap: 12px; background: #3a3a3a; padding: 6px 16px; border-radius: 30px; }
        .file-input-wrapper label { cursor: pointer; color: #ffd700; font-weight: 500; }
        #fileInput { display: none; }
        #status { text-align: center; font-size: 0.9rem; color: #aaa; margin-top: 10px; min-height: 1.5rem; }
        #timeDisplay { font-family: monospace; font-size: 1.1rem; color: #ffd700; background: #222; padding: 4px 12px; border-radius: 20px; }
        .info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .download-link { color: #4ecdc4; text-decoration: none; font-weight: 500; padding: 6px 14px; background: #2a2a2a; border-radius: 20px; border: 1px solid #4ecdc4; display: inline-block; }
        .download-link:hover { background: #4ecdc4; color: #1a1a1a; }
    </style>
</head>
<body>
<div class="container">
    <h1>✍️ 캘리그라피 SRT 플레이어</h1>
    <div class="canvas-wrapper">
        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>
    <div class="info">
        <span id="timeDisplay">00:00.000</span>
        <span id="subtitleStatus">⏸ 대기 중</span>
    </div>
    <div class="controls">
        <div class="file-input-wrapper">
            <label for="fileInput">📂 SRT 선택</label>
            <input type="file" id="fileInput" accept=".srt">
        </div>
        <button id="playBtn" class="primary">▶ 재생</button>
        <button id="pauseBtn">⏸ 일시정지</button>
        <button id="stopBtn">⏹ 정지</button>
        <button id="recordBtn" class="record">🎥 녹화 시작</button>
    </div>
    <div id="status">SRT 파일을 로드해주세요.</div>
    <div id="downloadArea" style="text-align:center; margin-top:12px;"></div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recordBtn = document.getElementById('recordBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const statusDiv = document.getElementById('status');
        const subtitleStatus = document.getElementById('subtitleStatus');
        const downloadArea = document.getElementById('downloadArea');

        const W = 1280, H = 720;
        canvas.width = W; canvas.height = H;

        let subtitles = [];
        let currentTime = 0;
        let isPlaying = false;
        let animationId = null;
        let startTime = 0;
        let pausedTime = 0;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let stream = null;

        function parseSRT(content) {
            const entries = [];
            const blocks = content.trim().split(/\n\s*\n/);
            for (const block of blocks) {
                const lines = block.split('\n').filter(line => line.trim() !== '');
                if (lines.length < 3) continue;
                const index = parseInt(lines[0]);
                if (isNaN(index)) continue;
                const timeLine = lines[1];
                const timeMatch = timeLine.match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
                if (!timeMatch) continue;
                const start = toMs(timeMatch[1], timeMatch[2], timeMatch[3], timeMatch[4]);
                const end = toMs(timeMatch[5], timeMatch[6], timeMatch[7], timeMatch[8]);
                const text = lines.slice(2).join(' ');
                entries.push({ index, startMs: start, endMs: end, text: text.trim() });
            }
            entries.sort((a, b) => a.startMs - b.startMs);
            return entries;
        }

        function toMs(h, m, s, ms) { return parseInt(h) * 3600000 + parseInt(m) * 60000 + parseInt(s) * 1000 + parseInt(ms); }

        // 2. 캘리그라피 그리기 (예시 이미지 스타일에 맞춤 개선)
        function drawCalligraphy(text, progress) {
            ctx.clearRect(0, 0, W, H);
            
            // 배경 (종이 질감)
            const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 600);
            grad.addColorStop(0, '#fdfbf5');
            grad.addColorStop(1, '#f2ead8');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const chars = text.split('');
            
            // 실제 손글씨 느낌의 폰트 적용 (Nanum Brush Script)
            ctx.font = "bold 140px 'Nanum Brush Script', 'Nanum Pen Script', cursive";
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#1a1a1a';
            ctx.shadowColor = 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = 2;
            ctx.shadowOffsetY = 2;

            // 여백이 넉넉한 자간 계산
            const baseSpacing = ctx.measureText(' ').width * 1.5; // 글자당 넉넉한 간격
            let totalWidth = 0;
            for (let ch of chars) {
                totalWidth += ctx.measureText(ch).width + baseSpacing;
            }
            totalWidth -= baseSpacing;

            let currentX = (W - totalWidth) / 2;
            const baseY = H / 2;

            // 3. 등장 효과: 왼쪽에서 오른쪽으로 '잘리는' 효과 대신, '순차적으로 나타나는' 페이드 인 효과 적용
            // 예시 이미지처럼 글자가 드러나는 느낌을 주기 위해 각 글자의 투명도를 조절합니다.
            const totalChars = chars.length;
            const visibleChars = Math.floor(progress * totalChars);
            const currentCharProgress = (progress * totalChars) - visibleChars;

            for (let i = 0; i < chars.length; i++) {
                const ch = chars[i];
                if (ch === ' ') {
                    currentX += ctx.measureText(' ').width + baseSpacing;
                    continue;
                }

                // 글자별 투명도 (붓글씨가 스르륵 나타나는 느낌)
                let alpha = 0;
                if (i < visibleChars) alpha = 1;
                else if (i === visibleChars) alpha = currentCharProgress;

                if (alpha > 0) {
                    // 글자 높낮이와 기울기를 아주 살짝만 줘서 손맛을 더함 (겹치지 않게 최소화)
                    const rot = (i % 2 === 0 ? -0.03 : 0.03);
                    const yOff = (i % 3 === 0 ? 0 : (i % 2 === 0 ? 5 : -5));

                    ctx.save();
                    ctx.translate(currentX, baseY + yOff);
                    ctx.rotate(rot);
                    ctx.globalAlpha = alpha;

                    // 붓글씨 느낌을 위해 살짝 두껍게 그림
                    ctx.fillText(ch, 0, 0);
                    ctx.fillText(ch, 0, 0); // 두 번 겹쳐 그려서 진한 먹물 느낌

                    ctx.restore();
                }

                const chWidth = ctx.measureText(ch).width;
                currentX += chWidth + baseSpacing; // 넉넉한 자간 유지
            }
            ctx.globalAlpha = 1; // 초기화
        }

        function animate(timestamp) {
            if (!isPlaying) return;
            const elapsed = timestamp - startTime + pausedTime;
            currentTime = elapsed;

            let active = null;
            let progress = 0;
            for (const sub of subtitles) {
                if (currentTime >= sub.startMs && currentTime < sub.endMs) {
                    active = sub;
                    const duration = sub.endMs - sub.startMs;
                    const passed = currentTime - sub.startMs;
                    progress = Math.min(passed / duration, 1);
                    break;
                }
            }

            if (active) {
                drawCalligraphy(active.text, progress);
                subtitleStatus.textContent = `✍️ ${active.text} (${Math.round(progress*100)}%)`;
                statusDiv.textContent = `자막 #${active.index} 재생 중`;
            } else {
                ctx.clearRect(0, 0, W, H);
                const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 600);
                grad.addColorStop(0, '#fdfbf5');
                grad.addColorStop(1, '#f2ead8');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                subtitleStatus.textContent = '⏸ 대기 중';
                statusDiv.textContent = '자막 구간이 아닙니다';
            }

            const sec = Math.floor(currentTime / 1000);
            const ms = Math.floor(currentTime % 1000);
            timeDisplay.textContent = `${String(sec).padStart(2, '0')}:${String(Math.floor(ms/10)).padStart(2, '0')}.${String(ms % 100).padStart(2, '0')}`;
            animationId = requestAnimationFrame(animate);
        }

        function play() {
            if (subtitles.length === 0) { statusDiv.textContent = '⚠️ SRT 파일을 먼저 로드하세요.'; return; }
            if (isPlaying) return;
            isPlaying = true;
            if (currentTime === 0) pausedTime = 0;
            else pausedTime = currentTime;
            startTime = performance.now() - pausedTime;
            animate(startTime);
            playBtn.textContent = '▶ 재생 중';
            statusDiv.textContent = '재생 중...';
        }

        function pause() {
            if (!isPlaying) return;
            isPlaying = false;
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            pausedTime = currentTime;
            playBtn.textContent = '▶ 재생';
            statusDiv.textContent = '일시정지';
        }

        function stop() {
            if (isPlaying) pause();
            currentTime = 0;
            pausedTime = 0;
            timeDisplay.textContent = '00:00.000';
            subtitleStatus.textContent = '⏹ 정지';
            ctx.clearRect(0, 0, W, H);
            const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 600);
            grad.addColorStop(0, '#fdfbf5');
            grad.addColorStop(1, '#f2ead8');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            statusDiv.textContent = '정지됨';
            playBtn.textContent = '▶ 재생';
        }

        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const content = ev.target.result;
                subtitles = parseSRT(content);
                if (subtitles.length === 0) { statusDiv.textContent = '⚠️ 유효한 SRT가 아닙니다.'; return; }
                statusDiv.textContent = `✅ ${subtitles.length}개 자막 로드 완료`;
                stop();
                if (subtitles.length > 0) {
                    drawCalligraphy(subtitles[0].text, 1);
                    subtitleStatus.textContent = `📖 ${subtitles[0].text}`;
                }
            };
            reader.readAsText(file, 'UTF-8');
            this.value = '';
        });

        playBtn.addEventListener('click', play);
        pauseBtn.addEventListener('click', pause);
        stopBtn.addEventListener('click', stop);

        recordBtn.addEventListener('click', function() {
            if (isRecording) {
                if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = '🎥 녹화 시작';
                statusDiv.textContent = '녹화 중지, 인코딩 중...';
                return;
            }
            if (!stream) stream = canvas.captureStream(30);
            if (!mediaRecorder) {
                const mimeTypes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm;codecs=h264'];
                let mimeType = '';
                for (const mt of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; break; }
                }
                if (!mimeType) { statusDiv.textContent = '⚠️ 이 브라우저는 녹화를 지원하지 않습니다.'; return; }
                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `calligraphy_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.webm`;
                    a.textContent = '📥 다운로드 (WebM)';
                    a.className = 'download-link';
                    downloadArea.innerHTML = '';
                    downloadArea.appendChild(a);
                    recordedChunks = [];
                    statusDiv.textContent = '✅ 녹화 완료! 다운로드 링크가 생성되었습니다.';
                };
            }
            recordedChunks = [];
            mediaRecorder.start(100);
            isRecording = true;
            recordBtn.textContent = '⏹ 녹화 중지';
            statusDiv.textContent = '🔴 녹화 중... (재생/일시정지 가능)';
        });

        (function init() {
            const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 600);
            grad.addColorStop(0, '#fdfbf5');
            grad.addColorStop(1, '#f2ead8');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#aaa';
            ctx.font = "24px 'Nanum Brush Script', serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📂 SRT 파일을 로드해주세요', W/2, H/2);
        })();

        window.addEventListener('beforeunload', function() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        });
    })();
</script>
</body>
</html>
