<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전각·구첩전(九疊篆) SRT 타이포 엔진</title>
    <!-- 기하학적이고 장방형 전서체 느낌을 극대화하는 웹폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Noto+Serif+KR:wght@900&family=ZCOOL+QingKe+HuangYou&family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0a0a;
            --seal-red: #c22a22;      /* 전각 인주 붉은색 */
            --seal-border: #a81c15;
            --paper-bg: #ece6d8;      /* 탁본/인주 배지 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #eee;
            font-family: 'Noto Serif KR', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 컨트롤 상단 바 */
        #top-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: rgba(22, 18, 18, 0.9);
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid rgba(194, 42, 34, 0.4);
            z-index: 1000;
            backdrop-filter: blur(10px);
            font-size: 12px;
        }

        #top-bar button, #top-bar select, #top-bar label {
            background: #252020;
            color: #f0e6d2;
            border: 1px solid #554444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            outline: none;
        }

        #top-bar button:hover, #top-bar label:hover {
            background: var(--seal-red);
            color: #fff;
            border-color: var(--seal-red);
        }

        #file-input { display: none; }

        #timeline-info {
            color: #e0bb6b;
            font-family: monospace;
            font-size: 13px;
            min-width: 100px;
            text-align: center;
        }

        /* 뷰포트 영역 및 가이드 */
        #viewport-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* 16:9 / 9:16 전환 컨테이너 */
        .ratio-16-9 {
            width: 1066px;
            height: 600px;
            border: 2px dashed #00ffcc; /* 보색 가이드 */
        }

        .ratio-9-16 {
            width: 380px;
            height: 675px;
            border: 2px dashed #00ffcc; /* 보색 가이드 */
        }

        #stage {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060505;
        }

        /* ========================================================
           [전각 도장(印章) & 구첩전 스타일]
        ======================================================== */
        #seal-box {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
            gap: 6px;
            padding: 16px;
            /* 도장 외곽 이중 테두리 (인곽) */
            border: 8px solid var(--seal-red);
            border-radius: 22px;
            box-shadow: 0 0 0 4px #060505, 0 0 0 8px var(--seal-red), inset 0 0 15px rgba(194, 42, 34, 0.3);
            background: rgba(194, 42, 34, 0.03);
            transform-origin: center center;
            transition: transform 0.1s;
        }

        /* 도장 내부 글자 셀 */
        .seal-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(194, 42, 34, 0.5); /* 내부 격자 */
            overflow: hidden;
            min-width: 90px;
            min-height: 90px;
        }

        /* 구첩전 글자 조형 변형 (수직으로 늘어나며 직각으로 꽉 차는 획) */
        .seal-char {
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif KR', serif;
            font-size: 82px;
            font-weight: 900;
            color: var(--seal-red);
            line-height: 1;
            /* 전서체 특유의 긴 비례와 기하학적 팽창 */
            transform: scaleY(1.3) scaleX(0.88);
            letter-spacing: -2px;
            text-shadow: 0 0 1px var(--seal-red);
            display: inline-block;
            will-change: transform, opacity, filter;
        }

        /* 파티클 캔버스 */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* ========================================================
           [IN 애니메이션 10종]
        ======================================================== */
        /* 1. 타이핑 */
        .in-typing { opacity: 0; animation: aTyping 0.05s forwards; }
        @keyframes aTyping { to { opacity: 1; } }

        /* 2. 바닥에서 팝업 */
        .in-popup {
            opacity: 0;
            transform: translateY(120%) scale(0.3, 1.8);
            animation: aPopup 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }
        @keyframes aPopup {
            60% { transform: translateY(-10%) scale(1.1, 0.9); }
            100% { opacity: 1; transform: translateY(0) scaleY(1.3) scaleX(0.88); }
        }

        /* 3. 눈처럼 내려오기 */
        .in-snow {
            opacity: 0;
            transform: translateY(-160px) rotate(15deg);
            animation: aSnow 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }
        @keyframes aSnow { to { opacity: 1; transform: translateY(0) scaleY(1.3) scaleX(0.88) rotate(0); } }

        /* 4. 사방에서 날아와 구성 */
        .in-converge {
            opacity: 0;
            transform: translate(var(--rx, -200px), var(--ry, 200px)) scale(0.1) rotate(var(--rr, 180deg));
            animation: aConverge 0.7s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        @keyframes aConverge { to { opacity: 1; transform: translate(0,0) scaleY(1.3) scaleX(0.88) rotate(0); } }

        /* 5. 벼락 낙하 (Stamp) */
        .in-stamp {
            opacity: 0;
            transform: scale(3.5);
            animation: aStamp 0.35s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }
        @keyframes aStamp {
            80% { opacity: 1; transform: scale(0.9); }
            100% { opacity: 1; transform: scaleY(1.3) scaleX(0.88); }
        }

        /* 6. 먹물 번짐 (Ink Bleed) */
        .in-inkbleed {
            opacity: 0;
            filter: blur(20px) contrast(200%);
            animation: aInk 0.9s ease-out forwards;
        }
        @keyframes aInk { to { opacity: 1; filter: blur(0); transform: scaleY(1.3) scaleX(0.88); } }

        /* 7. 3D 수직 회전 (Flip) */
        .in-flip {
            opacity: 0;
            transform: rotateY(90deg);
            animation: aFlip 0.6s ease-out forwards;
        }
        @keyframes aFlip { to { opacity: 1; transform: rotateY(0) scaleY(1.3) scaleX(0.88); } }

        /* 8. 렌즈 줌인 */
        .in-zoom {
            opacity: 0;
            transform: scale(0);
            animation: aZoom 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes aZoom { to { opacity: 1; transform: scaleY(1.3) scaleX(0.88); } }

        /* 9. 나선 회오리 (Vortex) */
        .in-vortex {
            opacity: 0;
            transform: scale(0.1) rotate(540deg);
            animation: aVortex 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes aVortex { to { opacity: 1; transform: scaleY(1.3) scaleX(0.88) rotate(0); } }

        /* 10. 좌우 슬릿 조립 */
        .in-slit {
            opacity: 0;
            filter: blur(10px);
            transform: scaleX(0.1);
            animation: aSlit 0.6s ease-out forwards;
        }
        @keyframes aSlit { to { opacity: 1; filter: blur(0); transform: scaleY(1.3) scaleX(0.88); } }

        /* ========================================================
           [OUT 애니메이션 10종]
        ======================================================== */
        /* 1. 바람에 날아가기 */
        .out-wind {
            animation: aWind 0.7s cubic-bezier(0.4, 0, 1, 1) forwards;
        }
        @keyframes aWind {
            to { opacity: 0; transform: translate(400px, -100px) skewX(-40deg) scale(0.5); filter: blur(8px); }
        }

        /* 2. 와이퍼로 닦기 */
        .out-wipe {
            mask-image: linear-gradient(to right, black 50%, transparent 50%);
            mask-size: 200% 100%;
            mask-position: 0 0;
            animation: aWipe 0.6s ease-in-out forwards;
        }
        @keyframes aWipe { to { mask-position: -100% 0; opacity: 0; } }

        /* 3. 팝업 대각선 소멸 */
        .out-diagpop {
            animation: aDiagPop 0.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }
        @keyframes aDiagPop {
            30% { transform: scale(1.15) translate(-10px, 10px); }
            100% { opacity: 0; transform: translate(250px, -250px) scale(0.2); }
        }

        /* 4. 글자 획 방향 비산 */
        .out-stroke {
            animation: aStroke 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes aStroke {
            to { opacity: 0; transform: translate(var(--sx, 120px), var(--sy, -120px)) rotate(var(--sr, 45deg)) scaleX(1.8) scaleY(0.2); filter: blur(6px); }
        }

        /* 5. 바닥 침몰 */
        .out-sink { animation: aSink 0.6s cubic-bezier(0.5, 0, 1, 0.5) forwards; }
        @keyframes aSink { to { opacity: 0; transform: translateY(180px) scale(0.8, 1.4); filter: blur(5px); } }

        /* 6. 블랙홀 회전 */
        .out-blackhole { animation: aBlackhole 0.6s ease-in forwards; }
        @keyframes aBlackhole { to { opacity: 0; transform: scale(0) rotate(-720deg); filter: blur(10px); } }

        /* 7. 먹물 흘러내림 */
        .out-melt { animation: aMelt 0.7s ease-in forwards; }
        @keyframes aMelt { to { opacity: 0; transform: translateY(120px) scaleY(2.2) scaleX(0.4); filter: blur(10px); } }

        /* 8. 도장 분쇄 폭발 */
        .out-shatter { animation: aShatter 0.6s cubic-bezier(0.1, 1, 0.1, 1) forwards; }
        @keyframes aShatter { to { opacity: 0; transform: translate(var(--rx, 100px), var(--ry, 100px)) rotate(var(--rr, 90deg)) scale(0.2); } }

        /* 9. 롤러 압축 */
        .out-squash { animation: aSquash 0.5s ease-in forwards; }
        @keyframes aSquash { to { opacity: 0; transform: scaleX(2) scaleY(0.01); filter: blur(4px); } }

        /* 10. 가루 비산 (Canvas 구동용 클래스) */
        .out-dust { opacity: 0 !important; transition: opacity 0.05s; }
    </style>
</head>
<body>

<div id="top-bar">
    <label for="file-input">📂 LOAD SRT</label>
    <input type="file" id="file-input" accept=".srt">
    
    <label>화면비:</label>
    <select id="ratio-select" onchange="changeRatio(this.value)">
        <option value="16:9">16:9 (가로형)</option>
        <option value="9:16">9:16 (세로 숏폼)</option>
    </select>

    <label>IN 효과:</label>
    <select id="in-select">
        <option value="in-stamp" selected>1. 벼락 낙하(도장 날인)</option>
        <option value="in-popup">2. 바닥에서 팝업</option>
        <option value="in-typing">3. 타이핑</option>
        <option value="in-snow">4. 눈처럼 내려오기</option>
        <option value="in-converge">5. 사방에서 날아와 구성</option>
        <option value="in-inkbleed">6. 먹물 번짐</option>
        <option value="in-flip">7. 3D 수직 회전</option>
        <option value="in-zoom">8. 렌즈 줌인</option>
        <option value="in-vortex">9. 나선 회오리</option>
        <option value="in-slit">10. 좌우 슬릿 조립</option>
    </select>

    <label>OUT 효과:</label>
    <select id="out-select">
        <option value="out-dust" selected>1. 가루되어 날아가기</option>
        <option value="out-wind">2. 바람에 날아가기</option>
        <option value="out-wipe">3. 와이퍼로 닦기</option>
        <option value="out-diagpop">4. 대각선 팝업 소멸</option>
        <option value="out-stroke">5. 각 글자 획 방향 비산</option>
        <option value="out-sink">6. 바닥으로 침몰</option>
        <option value="out-blackhole">7. 블랙홀 회전</option>
        <option value="out-melt">8. 먹물 흘러내림</option>
        <option value="out-shatter">9. 도장 분쇄 폭발</option>
        <option value="out-squash">10. 롤러 압축 소멸</option>
    </select>

    <button id="play-btn" onclick="togglePlay()">▶ 재생</button>
    <span id="timeline-info">00:00.00</span>
</div>

<div id="viewport-wrapper" class="ratio-16-9">
    <div id="stage">
        <div id="seal-box"></div>
        <canvas id="fx-canvas"></canvas>
    </div>
</div>

<script>
    let subtitles = [];
    let isPlaying = false;
    let startTime = 0;
    let animFrameId = null;
    let currentCueIndex = -1;

    const viewport = document.getElementById('viewport-wrapper');
    const sealBox = document.getElementById('seal-box');
    const timelineInfo = document.getElementById('timeline-info');
    const playBtn = document.getElementById('play-btn');
    const inSelect = document.getElementById('in-select');
    const outSelect = document.getElementById('out-select');
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let isParticleLooping = false;

    // 캔버스 크기 맞춤
    function syncCanvas() {
        canvas.width = viewport.clientWidth;
        canvas.height = viewport.clientHeight;
    }
    window.addEventListener('resize', syncCanvas);
    syncCanvas();

    // 16:9 / 9:16 화면비 제어
    function changeRatio(ratio) {
        if(ratio === '16:9') {
            viewport.className = 'ratio-16-9';
        } else {
            viewport.className = 'ratio-9-16';
        }
        syncCanvas();
    }

    // SRT 파서 (콤마, 마침표 타임라인 모두 지원)
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            parseSRT(evt.target.result);
        };
        reader.readAsText(file);
    });

    function parseSRT(data) {
        const clean = data.replace(/\r/g, '').trim();
        const blocks = clean.split(/\n\s*\n/);
        subtitles = [];

        blocks.forEach(block => {
            const lines = block.trim().split('\n');
            if(lines.length < 2) return;
            const timeLine = lines.find(l => l.includes('-->'));
            if(!timeLine) return;

            const tIdx = lines.indexOf(timeLine);
            const times = timeLine.split('-->');
            const text = lines.slice(tIdx + 1).join(' ').trim();

            subtitles.push({
                start: timeToSec(times[0].trim()),
                end: timeToSec(times[1].trim()),
                text: text
            });
        });

        if(subtitles.length > 0) {
            alert(`SRT 자막 ${subtitles.length}개가 정상 로드되었습니다.`);
            currentCueIndex = -1;
            renderCue(0); // 첫 자막 프리뷰
        }
    }

    function timeToSec(str) {
        const p = str.replace(',', '.').split(':');
        return parseFloat(p[0])*3600 + parseFloat(p[1])*60 + parseFloat(p[2]);
    }

    // 도장 구첩전 렌더링
    function renderCue(idx) {
        if(!subtitles[idx]) return;
        const sub = subtitles[idx];
        sealBox.innerHTML = '';
        
        // 텍스트를 공백 제외 글자로 분해 (최대 9글자까지 도장 3x3 격자 수납)
        const chars = sub.text.replace(/\s+/g, '').split('').slice(0, 9);
        
        // 도장 격자 열 수 계산 (글자 수에 따라 2x2 또는 3x3 적응형)
        const cols = chars.length <= 4 ? 2 : 3;
        sealBox.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        chars.forEach((char, cIdx) => {
            const cell = document.createElement('div');
            cell.className = 'seal-cell';
            
            const span = document.createElement('span');
            span.className = 'seal-char';
            span.textContent = char;

            // 랜덤 사방 벡터 (인/아웃용)
            const angle = Math.random() * Math.PI * 2;
            const dist = 350 + Math.random() * 200;
            span.style.setProperty('--rx', `${Math.cos(angle) * dist}px`);
            span.style.setProperty('--ry', `${Math.sin(angle) * dist}px`);
            span.style.setProperty('--rr', `${(Math.random() - 0.5) * 540}deg`);

            // 획 방향 비산용 벡터
            const sAngles = [-45, 45, 135, -135, 0, 90];
            const sa = sAngles[cIdx % sAngles.length];
            span.style.setProperty('--sx', `${Math.cos(sa * Math.PI / 180) * 300}px`);
            span.style.setProperty('--sy', `${Math.sin(sa * Math.PI / 180) * 300}px`);
            span.style.setProperty('--sr', `${sa}deg`);

            cell.appendChild(span);
            sealBox.appendChild(cell);
        });

        triggerInEffect();
    }

    function triggerInEffect() {
        const inEff = inSelect.value;
        const charEls = document.querySelectorAll('.seal-char');
        charEls.forEach((el, i) => {
            el.className = 'seal-char';
            el.style.animationDelay = `${i * 0.05}s`;
            el.classList.add(inEff);
        });
    }

    function triggerOutEffect() {
        const outEff = outSelect.value;
        const charEls = document.querySelectorAll('.seal-char');

        if(outEff === 'out-dust') {
            explodeToDust();
            charEls.forEach(el => el.classList.add('out-dust'));
            return;
        }

        charEls.forEach((el, i) => {
            el.style.animationDelay = `${i * 0.04}s`;
            el.classList.add(outEff);
        });
    }

    // 가루 분해 물리 효과
    function explodeToDust() {
        particles = [];
        const charEls = document.querySelectorAll('.seal-char');
        const vRect = viewport.getBoundingClientRect();

        charEls.forEach(el => {
            const rect = el.getBoundingClientRect();
            for(let i = 0; i < 60; i++) {
                particles.push({
                    x: (rect.left - vRect.left) + Math.random() * rect.width,
                    y: (rect.top - vRect.top) + Math.random() * rect.height,
                    vx: (Math.random() - 0.4) * 8 + 3,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02,
                    size: Math.random() * 3 + 1,
                    color: '#c22a22'
                });
            }
        });

        if(!isParticleLooping) {
            isParticleLooping = true;
            renderParticles();
        }
    }

    function renderParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;

            if(p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if(particles.length > 0) {
            requestAnimationFrame(renderParticles);
        } else {
            isParticleLooping = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    // 타임라인 재생 루프
    function togglePlay() {
        if(subtitles.length === 0) {
            // 샘플 자막 주입
            subtitles = [
                { start: 0.5, end: 3.5, text: "萬事如意" },
                { start: 4.0, end: 7.0, text: "家和萬事成" },
                { start: 7.5, end: 10.5, text: "大吉大利" }
            ];
            alert("기본 도장 텍스트 샘플이 로드되었습니다.");
        }

        isPlaying = !isPlaying;
        if(isPlaying) {
            playBtn.innerText = "⏹ 정지";
            playBtn.style.background = "#555";
            startTime = performance.now();
            currentCueIndex = -1;
            loop();
        } else {
            playBtn.innerText = "▶ 재생";
            playBtn.style.background = "var(--seal-red)";
            cancelAnimationFrame(animFrameId);
        }
    }

    function loop() {
        if(!isPlaying) return;
        const curTime = (performance.now() - startTime) / 1000;
        
        // 시간 포맷 표기
        const mm = Math.floor(curTime / 60).toString().padStart(2, '0');
        const ss = (curTime % 60).toFixed(2).padStart(5, '0');
        timelineInfo.innerText = `${mm}:${ss}`;

        // 현재 시간에 해당하는 자막 인덱스 검색
        const activeIdx = subtitles.findIndex(s => curTime >= s.start && curTime <= s.end);

        if(activeIdx !== -1 && activeIdx !== currentCueIndex) {
            currentCueIndex = activeIdx;
            renderCue(currentCueIndex);
        }

        // 자막 종료 0.6초 전에 OUT 효과 자동 발동
        if(currentCueIndex !== -1) {
            const cue = subtitles[currentCueIndex];
            const remaining = cue.end - curTime;
            if(remaining <= 0.6 && remaining > 0.5) {
                triggerOutEffect();
            }
        }

        // 전체 종료 검사
        if(curTime > subtitles[subtitles.length - 1].end + 1) {
            togglePlay();
            return;
        }

        animFrameId = requestAnimationFrame(loop);
    }
</script>
</body>
</html>
