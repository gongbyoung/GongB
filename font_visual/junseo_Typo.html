<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구첩전(九疊篆) 벡터 획 분해 엔진 v0.3</title>
    <style>
        :root {
            --bg-color: #050404;
            --seal-red: #c82018;      /* 고전 인주색 */
            --guide-border: #00ffcc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 컨트롤 패널 */
        #top-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            background: rgba(18, 15, 15, 0.94);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(200, 32, 24, 0.45);
            z-index: 1000;
            backdrop-filter: blur(10px);
            font-size: 11px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.85);
        }

        #top-bar button, #top-bar select, #top-bar label, #top-bar input {
            background: #201c1c;
            color: #eeddbb;
            border: 1px solid #483a3a;
            padding: 5px 9px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            outline: none;
        }

        #top-bar input[type="number"] {
            width: 65px;
            text-align: center;
            cursor: text;
        }

        #top-bar button:hover, #top-bar label:hover {
            background: var(--seal-red);
            color: #fff;
            border-color: var(--seal-red);
        }

        #file-input { display: none; }

        #timeline-info {
            color: #00ffcc;
            font-family: monospace;
            font-size: 13px;
            min-width: 75px;
            text-align: center;
        }

        /* 뷰포트 래퍼 */
        #viewport-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.25s, height 0.25s;
        }

        .ratio-16-9 {
            width: 1120px;
            height: 630px;
            border: 2px dashed var(--guide-border);
        }

        .ratio-9-16 {
            width: 380px;
            height: 675px;
            border: 2px dashed var(--guide-border);
        }

        /* 렌더링 캔버스 */
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body>

<div id="top-bar">
    <label for="file-input">📂 LOAD SRT</label>
    <input type="file" id="file-input" accept=".srt">
    
    <label>화면비:</label>
    <select id="ratio-select" onchange="changeRatio(this.value)">
        <option value="16:9">16:9 (가로형)</option>
        <option value="9:16">9:16 (세로 숏폼)</option>
    </select>

    <label>스케일 모드:</label>
    <select id="scale-mode" onchange="updateScaleModeUI()">
        <option value="fill">화면 가득 채움 (%)</option>
        <option value="fixed">절대 수치 고정 (px)</option>
    </select>

    <div id="px-input-group" style="display: none; align-items: center; gap: 4px;">
        <label>글자 크기(px):</label>
        <input type="number" id="fixed-px-val" value="140" min="30" max="600" step="10" onchange="renderCurrentFrame()">
    </div>

    <label>IN 효과:</label>
    <select id="in-select">
        <option value="stamp" selected>1. 벼락 낙하 (날인)</option>
        <option value="popup">2. 바닥에서 팝업</option>
        <option value="snow">3. 위에서 조립</option>
        <option value="converge">4. 사방에서 획 수렴</option>
    </select>

    <label>OUT 효과:</label>
    <select id="out-select">
        <option value="stroke-disassemble" selected>★ 획 단위 분리 뱀 비산</option>
        <option value="wind">바람에 날리기</option>
        <option value="sink">바닥 침몰</option>
    </select>

    <button id="play-btn" onclick="togglePlay()">▶ 재생</button>
    <span id="timeline-info">00:00.00</span>
</div>

<div id="viewport-wrapper" class="ratio-16-9">
    <canvas id="renderCanvas"></canvas>
</div>

<script>
    let subtitles = [];
    let isPlaying = false;
    let startTime = 0;
    let animFrameId = null;
    let currentCueIndex = -1;

    const viewport = document.getElementById('viewport-wrapper');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const timelineInfo = document.getElementById('timeline-info');
    const playBtn = document.getElementById('play-btn');
    const inSelect = document.getElementById('in-select');
    const outSelect = document.getElementById('out-select');
    const scaleModeSelect = document.getElementById('scale-mode');
    const pxGroup = document.getElementById('px-input-group');
    const fixedPxInput = document.getElementById('fixed-px-val');

    // 현재 화면에 배치된 구첩전 글자 획 데이터들
    let currentGlyphs = [];

    function syncCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = viewport.clientWidth * dpr;
        canvas.height = viewport.clientHeight * dpr;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', () => { syncCanvas(); renderCurrentFrame(); });

    function changeRatio(ratio) {
        viewport.className = ratio === '16:9' ? 'ratio-16-9' : 'ratio-9-16';
        syncCanvas();
        renderCurrentFrame();
    }

    function updateScaleModeUI() {
        pxGroup.style.display = scaleModeSelect.value === 'fixed' ? 'flex' : 'none';
        renderCurrentFrame();
    }

    // SRT 파일 파싱
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            parseSRT(evt.target.result);
        };
        reader.readAsText(file);
    });

    function parseSRT(data) {
        const clean = data.replace(/\r/g, '').trim();
        const blocks = clean.split(/\n\s*\n/);
        subtitles = [];

        blocks.forEach(block => {
            const lines = block.trim().split('\n');
            if(lines.length < 2) return;
            const timeLine = lines.find(l => l.includes('-->'));
            if(!timeLine) return;

            const tIdx = lines.indexOf(timeLine);
            const times = timeLine.split('-->');
            const text = lines.slice(tIdx + 1).join(' ').trim();

            subtitles.push({
                start: timeToSec(times[0].trim()),
                end: timeToSec(times[1].trim()),
                text: text
            });
        });

        if(subtitles.length > 0) {
            alert(`SRT 자막 ${subtitles.length}개가 로드되었습니다.`);
            currentCueIndex = 0;
            buildGlyphs(0);
            renderCurrentFrame();
        }
    }

    function timeToSec(str) {
        const p = str.replace(',', '.').split(':');
        return parseFloat(p[0])*3600 + parseFloat(p[1])*60 + parseFloat(p[2]);
    }

    // ========================================================
    // [구첩전(九疊篆) 알고리즘 기하 획 생성 엔진]
    // 폰트를 배제하고 사각 슬롯을 절선(Folded Path)으로 채움
    // ========================================================
    function createNineFoldStrokes(char, seed) {
        const strokes = [];
        const folds = 5; // 절선의 밀도 (구첩전의 겹수)
        const rnd = (s) => {
            let x = Math.sin(s++) * 10000;
            return x - Math.floor(x);
        };

        let s = (char.charCodeAt(0) || 100) + seed;

        // 1. 외곽 구조 획 (ㄷ자, ㄹ자 형태의 굵은 메인 획)
        strokes.push({
            type: 'outer-fold',
            points: [
                { x: 0.1, y: 0.1 },
                { x: 0.9, y: 0.1 },
                { x: 0.9, y: 0.45 },
                { x: 0.2, y: 0.45 },
                { x: 0.2, y: 0.9 },
                { x: 0.9, y: 0.9 }
            ],
            strokeWidth: 0.08
        });

        // 2. 내부 횡/종 구첩 미로 획 (글자 내면을 직각으로 접어 채움)
        for (let i = 0; i < folds; i++) {
            const yLevel = 0.2 + (i / folds) * 0.65;
            const dir = i % 2 === 0 ? 1 : -1;
            const startX = dir === 1 ? 0.25 : 0.8;
            const endX = dir === 1 ? 0.8 : 0.25;

            strokes.push({
                type: 'inner-fold',
                points: [
                    { x: startX, y: yLevel },
                    { x: endX, y: yLevel },
                    { x: endX, y: yLevel + (0.65 / folds) * 0.7 }
                ],
                strokeWidth: 0.065
            });
        }

        // 3. 수직 기둥 절선 획
        strokes.push({
            type: 'vert-pillar',
            points: [
                { x: 0.5, y: 0.15 },
                { x: 0.5, y: 0.45 },
                { x: 0.65, y: 0.45 },
                { x: 0.65, y: 0.85 }
            ],
            strokeWidth: 0.07
        });

        return strokes;
    }

    // 화면 배치 및 글자별 획 구조체 구성
    function buildGlyphs(idx) {
        if(!subtitles[idx]) return;
        const sub = subtitles[idx];
        const chars = sub.text.replace(/\s+/g, '').split('');
        if(chars.length === 0) return;

        const vW = viewport.clientWidth;
        const vH = viewport.clientHeight;
        const mode = scaleModeSelect.value;
        const total = chars.length;

        let slotSize;
        if(mode === 'fill') {
            const cols = Math.ceil(Math.sqrt(total));
            const target = Math.min(vW, vH) * 0.82;
            slotSize = Math.floor(target / cols);
        } else {
            slotSize = parseFloat(fixedPxInput.value) || 140;
        }

        const cols = Math.min(total, Math.floor((vW * 0.9) / slotSize) || 1);
        const rows = Math.ceil(total / cols);
        const totalW = cols * slotSize;
        const totalH = rows * slotSize;
        const startX = (vW - totalW) / 2;
        const startY = (vH - totalH) / 2;

        currentGlyphs = chars.map((char, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const gx = startX + col * slotSize;
            const gy = startY + row * slotSize;

            const baseStrokes = createNineFoldStrokes(char, i * 77);

            // 개별 획에 대한 물리/분해 속성 부여
            const strokes = baseStrokes.map((st, sIdx) => {
                const angle = (sIdx / baseStrokes.length) * Math.PI * 2 + (i * 0.5);
                return {
                    ...st,
                    basePoints: st.points,
                    // 획 단위 비산 벡터
                    dirX: Math.cos(angle) * (400 + (sIdx % 3) * 150),
                    dirY: Math.sin(angle) * (300 + (sIdx % 2) * 150),
                    rotSpeed: (sIdx % 2 === 0 ? 1 : -1) * (2 + Math.random() * 2),
                    phase: sIdx * 0.4
                };
            });

            return {
                char,
                x: gx,
                y: gy,
                size: slotSize,
                strokes: strokes
            };
        });
    }

    // ========================================================
    // [렌더러 및 이징(Easing) 모션 처리]
    // ========================================================
    function renderFrame(curTime) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(!subtitles[currentCueIndex]) return;

        const sub = subtitles[currentCueIndex];
        const cueDuration = Math.max(sub.end - sub.start, 0.4);
        const elapsed = curTime - sub.start;
        const normTime = Math.min(Math.max(elapsed / cueDuration, 0), 1);

        const inType = inSelect.value;
        const outType = outSelect.value;

        // IN/OUT 진행도 산정
        const inWindow = 0.22;
        const outWindow = 0.22;
        const inProgress = Math.min(normTime / inWindow, 1);
        const isOut = normTime > (1 - outWindow);
        const outProgress = isOut ? (normTime - (1 - outWindow)) / outWindow : 0;

        ctx.strokeStyle = '#c82018';
        ctx.fillStyle = '#c82018';
        ctx.lineCap = 'square';
        ctx.lineJoin = 'miter';

        currentGlyphs.forEach((glyph, gIdx) => {
            const gDelay = gIdx * 0.04;
            const localInP = Math.min(Math.max((inProgress - gDelay) / (1 - gDelay || 1), 0), 1);

            glyph.strokes.forEach((stroke, sIdx) => {
                ctx.save();

                let strokeScale = 1;
                let transX = glyph.x;
                let transY = glyph.y;
                let rotation = 0;
                let alpha = 1;

                // --- 1. IN 효과 적용 ---
                if (localInP < 1) {
                    if (inType === 'stamp') {
                        const p = localInP;
                        strokeScale = p < 0.8 ? 3.5 - p * 3.1 : 1;
                        alpha = Math.min(p * 2, 1);
                    } else if (inType === 'popup') {
                        transY += (1 - localInP) * 120;
                        alpha = localInP;
                    } else if (inType === 'snow') {
                        transY -= (1 - localInP) * 150;
                        alpha = localInP;
                    } else if (inType === 'converge') {
                        transX += stroke.dirX * (1 - localInP) * 0.5;
                        transY += stroke.dirY * (1 - localInP) * 0.5;
                        alpha = localInP;
                    }
                }

                // --- 2. OUT 효과 (개별 획 분리 비산) ---
                if (outProgress > 0) {
                    const localOutP = Math.min(Math.max((outProgress - sIdx * 0.03) / 0.8, 0), 1);

                    if (outType === 'stroke-disassemble') {
                        // 뱀처럼 구불거리며 나가는 S자 곡선 오프셋
                        const wave = Math.sin(localOutP * Math.PI * 4 + stroke.phase) * 45;
                        transX += stroke.dirX * localOutP + (stroke.dirY > 0 ? wave : -wave);
                        transY += stroke.dirY * localOutP + wave;
                        rotation = stroke.rotSpeed * localOutP;
                        alpha = 1 - Math.pow(localOutP, 2);
                        strokeScale = 1 + localOutP * 0.4;
                    } else if (outType === 'wind') {
                        transX += localOutP * 400;
                        transY -= localOutP * 80;
                        alpha = 1 - localOutP;
                    } else if (outType === 'sink') {
                        transY += localOutP * 200;
                        alpha = 1 - localOutP;
                    }
                }

                // 획 렌더링
                ctx.globalAlpha = Math.max(alpha, 0);
                ctx.translate(transX + glyph.size / 2, transY + glyph.size / 2);
                ctx.rotate(rotation);
                ctx.scale(strokeScale, strokeScale);
                ctx.translate(-glyph.size / 2, -glyph.size / 2);

                const sWidth = stroke.strokeWidth * glyph.size;
                ctx.lineWidth = Math.max(sWidth, 2);

                ctx.beginPath();
                stroke.points.forEach((pt, pIdx) => {
                    const px = pt.x * glyph.size;
                    const py = pt.y * glyph.size;
                    if (pIdx === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.stroke();

                ctx.restore();
            });
        });
    }

    function renderCurrentFrame() {
        if(currentCueIndex === -1 && subtitles.length > 0) currentCueIndex = 0;
        buildGlyphs(currentCueIndex);
        const cur = subtitles[currentCueIndex] ? subtitles[currentCueIndex].start + 0.1 : 0;
        renderFrame(cur);
    }

    // 재생 루프
    function togglePlay() {
        if(subtitles.length === 0) {
            subtitles = [
                { start: 0.5, end: 3.5, text: "萬事如意" },
                { start: 4.0, end: 7.0, text: "家和萬事成" },
                { start: 7.5, end: 10.5, text: "大吉大利" }
            ];
            alert("기본 구첩전 샘플 자막이 로드되었습니다.");
        }

        isPlaying = !isPlaying;
        if(isPlaying) {
            playBtn.innerText = "⏹ 정지";
            playBtn.style.background = "#555";
            startTime = performance.now();
            currentCueIndex = -1;
            loop();
        } else {
            playBtn.innerText = "▶ 재생";
            playBtn.style.background = "var(--seal-red)";
            cancelAnimationFrame(animFrameId);
        }
    }

    function loop() {
        if(!isPlaying) return;
        const curTime = (performance.now() - startTime) / 1000;

        const mm = Math.floor(curTime / 60).toString().padStart(2, '0');
        const ss = (curTime % 60).toFixed(2).padStart(5, '0');
        timelineInfo.innerText = `${mm}:${ss}`;

        const activeIdx = subtitles.findIndex(s => curTime >= s.start && curTime <= s.end);

        if(activeIdx !== -1 && activeIdx !== currentCueIndex) {
            currentCueIndex = activeIdx;
            buildGlyphs(currentCueIndex);
        }

        if(currentCueIndex !== -1) {
            renderFrame(curTime);
        }

        if(curTime > subtitles[subtitles.length - 1].end + 0.5) {
            togglePlay();
            return;
        }

        animFrameId = requestAnimationFrame(loop);
    }

    // 초기화
    syncCanvas();
    updateScaleModeUI();
</script>
</body>
</html>
