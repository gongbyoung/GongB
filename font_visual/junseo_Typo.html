<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전서체 타이포그래피 모션 엔진 (Seal Script Typo Engine)</title>
    <!-- 전서체/해서체 느낌을 살리기 위한 무료 구글 폰트 (Noto Serif TC / Ma Shan Zheng) 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+KR:wght@900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0c0c;
            --text-color: #eeddbb;
            --accent-color: #bb2222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Ma Shan Zheng', 'Noto Serif KR', 'Noto Serif TC', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 컨트롤 패널 UI */
        #ctrl-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(20, 18, 18, 0.85);
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(238, 221, 187, 0.25);
            z-index: 1000;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            align-items: center;
            font-family: sans-serif;
            font-size: 13px;
        }

        #ctrl-panel select, #ctrl-panel input, #ctrl-panel button {
            background: #222;
            color: #eeddbb;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 15px;
            outline: none;
            font-size: 12px;
            cursor: pointer;
        }

        #ctrl-panel button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: bold;
            transition: 0.2s;
        }

        #ctrl-panel button:hover {
            background: #dd3333;
            transform: scale(1.05);
        }

        /* 화면 꽉 차는 메인 텍스트 컨테이너 */
        #stage {
            position: relative;
            width: 90vw;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            perspective: 1000px;
        }

        #typo-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            font-size: clamp(3rem, 12vw, 15rem); /* 화면을 꽉 채우는 유동적 폰트 크기 */
            font-weight: 900;
            letter-spacing: 0.1em;
            line-height: 1.1;
            text-shadow: 0 0 15px rgba(238, 221, 187, 0.3);
            user-select: none;
        }

        /* 개별 글자 래퍼 */
        .char {
            display: inline-block;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform, opacity, filter;
        }

        /* 파티클 / 가루 분해 전용 캔버스 */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        /* ========================================================
           [IN 애니메이션 모음 - 10종 이상]
        ======================================================== */
        /* 1. 타이핑 */
        .in-typing { opacity: 0; animation: animTyping 0.05s forwards; }
        @keyframes animTyping { to { opacity: 1; } }

        /* 2. 바닥에서 팝업 (스쿼시 & 탄성) */
        .in-popup {
            opacity: 0;
            transform: translateY(120%) scale(0.3, 1.8);
            animation: animPopup 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes animPopup {
            60% { transform: translateY(-15%) scale(1.15, 0.85); }
            100% { opacity: 1; transform: translateY(0) scale(1, 1); }
        }

        /* 3. 눈처럼 내려오기 */
        .in-snow {
            opacity: 0;
            transform: translateY(-200px) rotate(20deg);
            animation: animSnow 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }
        @keyframes animSnow {
            to { opacity: 1; transform: translateY(0) rotate(0deg); }
        }

        /* 4. 사방에서 날아와 구성 */
        .in-converge {
            opacity: 0;
            transform: translate(var(--rand-x, -300px), var(--rand-y, 300px)) scale(0.1) rotate(var(--rand-rot, 180deg));
            animation: animConverge 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        @keyframes animConverge {
            to { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
        }

        /* 5. 먹물 번짐 (Ink Bleed) */
        .in-inkbleed {
            opacity: 0;
            filter: blur(30px) contrast(300%);
            transform: scale(1.4);
            animation: animInk 1.2s ease-out forwards;
        }
        @keyframes animInk {
            to { opacity: 1; filter: blur(0px) contrast(100%); transform: scale(1); }
        }

        /* 6. 천장 벼락 낙하 (Stamp) */
        .in-stamp {
            opacity: 0;
            transform: scale(4);
            animation: animStamp 0.4s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }
        @keyframes animStamp {
            80% { opacity: 1; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 7. 3D 수직 회전 (Flip Y) */
        .in-flip {
            opacity: 0;
            transform: rotateY(90deg) rotateX(45deg);
            animation: animFlip 0.8s ease-out forwards;
        }
        @keyframes animFlip {
            to { opacity: 1; transform: rotateY(0deg) rotateX(0deg); }
        }

        /* 8. 렌즈 줌인 (Hyper Zoom) */
        .in-zoom {
            opacity: 0;
            transform: scale(0);
            animation: animZoom 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes animZoom {
            to { opacity: 1; transform: scale(1); }
        }

        /* 9. 나선형 회오리 진입 (Vortex) */
        .in-vortex {
            opacity: 0;
            transform: scale(0.1) rotate(720deg);
            animation: animVortex 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes animVortex {
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* 10. 좌우 슬릿 조립 (Slit Assemble) */
        .in-slit {
            opacity: 0;
            letter-spacing: 1em;
            filter: blur(10px);
            animation: animSlit 0.8s ease-out forwards;
        }
        @keyframes animSlit {
            to { opacity: 1; letter-spacing: 0.1em; filter: blur(0); }
        }

        /* ========================================================
           [OUT 애니메이션 모음 - 10종 이상]
        ======================================================== */
        /* 1. 바람에 날아가기 (Wind Drift) */
        .out-wind {
            animation: animWind 1s cubic-bezier(0.4, 0, 1, 1) forwards;
        }
        @keyframes animWind {
            40% { transform: translateY(-30px) skewX(-20deg); }
            100% { opacity: 0; transform: translate(600px, -150px) skewX(-45deg) scale(0.6); filter: blur(10px); }
        }

        /* 2. 와이퍼로 닦기 (Wipe Out) */
        .out-wipe {
            mask-image: linear-gradient(to right, black 50%, transparent 50%);
            mask-size: 200% 100%;
            mask-position: 0% 0;
            animation: animWipe 0.8s ease-in-out forwards;
        }
        @keyframes animWipe {
            to { mask-position: -100% 0; opacity: 0; }
        }

        /* 3. 대각선 팝업 소멸 (Diagonal Pop Out) */
        .out-diagpop {
            animation: animDiagPop 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }
        @keyframes animDiagPop {
            30% { transform: translate(-30px, 30px) scale(1.15); }
            100% { opacity: 0; transform: translate(300px, -300px) scale(0.2); }
        }

        /* 4. 각 글자 획 방향 비산 (Stroke Scatter) */
        .out-stroke {
            animation: animStrokeScatter 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes animStrokeScatter {
            to {
                opacity: 0;
                transform: translate(var(--stroke-x, 150px), var(--stroke-y, -150px)) 
                           rotate(var(--stroke-rot, 45deg)) 
                           scaleX(1.8) scaleY(0.2);
                filter: blur(8px);
            }
        }

        /* 5. 바닥으로 꺼지기 (Sinkhole) */
        .out-sink {
            animation: animSink 0.7s cubic-bezier(0.5, 0, 1, 0.5) forwards;
        }
        @keyframes animSink {
            to { opacity: 0; transform: translateY(200px) scale(0.8, 1.4); filter: blur(5px); }
        }

        /* 6. 회전하며 빨려들어가기 (Blackhole Spiral) */
        .out-blackhole {
            animation: animBlackhole 0.8s ease-in forwards;
        }
        @keyframes animBlackhole {
            to { opacity: 0; transform: scale(0) rotate(-720deg); filter: blur(15px); }
        }

        /* 7. 먹물 흘러내림 (Melt/Drip) */
        .out-melt {
            animation: animMelt 1s ease-in forwards;
        }
        @keyframes animMelt {
            50% { transform: scaleY(1.4) skewY(10deg); filter: blur(2px); }
            100% { opacity: 0; transform: translateY(150px) scaleY(2) scaleX(0.5); filter: blur(12px); }
        }

        /* 8. 도장 찍혀 부서지듯 박살 (Shatter Explode) */
        .out-shatter {
            animation: animShatter 0.7s cubic-bezier(0.1, 1, 0.1, 1) forwards;
        }
        @keyframes animShatter {
            to { opacity: 0; transform: translate(var(--rand-x, 100px), var(--rand-y, 100px)) rotate(var(--rand-rot, 90deg)) scale(0.3); }
        }

        /* 9. 롤러로 압축 (Squash Thin) */
        .out-squash {
            animation: animSquash 0.5s ease-in forwards;
        }
        @keyframes animSquash {
            to { opacity: 0; transform: scaleX(2.5) scaleY(0.01); filter: blur(4px); }
        }

        /* 10. 가루 비산 (자바스크립트 Canvas 엔진 호출용 빈 클래스) */
        .out-dust {
            opacity: 0 !important;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

<!-- 제어 패널 -->
<div id="ctrl-panel">
    <input type="text" id="text-input" value="天地玄黃 宇宙洪荒" title="문구 입력">
    
    <label>IN 효과:</label>
    <select id="in-select">
        <option value="in-typing">1. 타이핑</option>
        <option value="in-popup" selected>2. 바닥에서 팝업</option>
        <option value="in-snow">3. 눈처럼 내려오기</option>
        <option value="in-converge">4. 사방에서 날아와 구성</option>
        <option value="in-inkbleed">5. 먹물 번짐</option>
        <option value="in-stamp">6. 벼락 낙하</option>
        <option value="in-flip">7. 3D 수직 회전</option>
        <option value="in-zoom">8. 렌즈 줌인</option>
        <option value="in-vortex">9. 나선 회오리</option>
        <option value="in-slit">10. 좌우 슬릿 조립</option>
    </select>

    <label>OUT 효과:</label>
    <select id="out-select">
        <option value="out-dust" selected>1. 가루되어 날아가기</option>
        <option value="out-wind">2. 바람에 날아가기</option>
        <option value="out-wipe">3. 와이퍼로 닦기</option>
        <option value="out-diagpop">4. 팝업 대각선 소멸</option>
        <option value="out-stroke">5. 각 글자 획 방향 비산</option>
        <option value="out-sink">6. 바닥으로 침몰</option>
        <option value="out-blackhole">7. 블랙홀 회전 소멸</option>
        <option value="out-melt">8. 먹물 흘러내림</option>
        <option value="out-shatter">9. 도장 분쇄 폭발</option>
        <option value="out-squash">10. 납작 압축 소멸</option>
    </select>

    <button onclick="runSequence()">▶ 재생 실행</button>
</div>

<!-- 텍스트 렌더링 무대 -->
<div id="stage">
    <div id="typo-container"></div>
</div>

<!-- 물리 파티클 시뮬레이터 캔버스 -->
<canvas id="fx-canvas"></canvas>

<script>
    const typoContainer = document.getElementById('typo-container');
    const textInput = document.getElementById('text-input');
    const inSelect = document.getElementById('in-select');
    const outSelect = document.getElementById('out-select');
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let isAnimatingParticles = false;

    // 캔버스 크기 재설정
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 텍스트를 글자(span) 단위로 분리 및 랜덤 파라미터 부여
    function setupText(text) {
        typoContainer.innerHTML = '';
        const chars = text.split('');
        
        chars.forEach((c, idx) => {
            const span = document.createElement('span');
            span.className = 'char';
            span.textContent = c === ' ' ? '\u00A0' : c;

            // 랜덤 사방 좌표 (사방 진입용)
            const angle = Math.random() * Math.PI * 2;
            const dist = 600 + Math.random() * 400;
            span.style.setProperty('--rand-x', `${Math.cos(angle) * dist}px`);
            span.style.setProperty('--rand-y', `${Math.sin(angle) * dist}px`);
            span.style.setProperty('--rand-rot', `${(Math.random() - 0.5) * 720}deg`);

            // 획 방향 비산용 벡터 (대각선 및 종횡 획 분산)
            const strokeAngles = [ -45, 45, 135, -135, 0, 90 ];
            const sAngle = strokeAngles[idx % strokeAngles.length];
            span.style.setProperty('--stroke-x', `${Math.cos(sAngle * Math.PI / 180) * 400}px`);
            span.style.setProperty('--stroke-y', `${Math.sin(sAngle * Math.PI / 180) * 400}px`);
            span.style.setProperty('--stroke-rot', `${sAngle}deg`);

            typoContainer.appendChild(span);
        });
    }

    // [IN 모션 실행]
    function playInEffect(effectName, callback) {
        const charElements = document.querySelectorAll('.char');
        charElements.forEach((el, idx) => {
            el.className = 'char'; // 초기화
            el.style.animationDelay = `${idx * 0.08}s`;
            el.classList.add(effectName);
        });

        const totalDuration = (charElements.length * 0.08 + 1.2) * 1000;
        setTimeout(callback, totalDuration);
    }

    // [OUT 모션 실행]
    function playOutEffect(effectName) {
        const charElements = document.querySelectorAll('.char');

        if (effectName === 'out-dust') {
            // 특수 캔버스 파티클 분해 실행
            explodeToDust();
            charElements.forEach(el => el.classList.add('out-dust'));
            return;
        }

        charElements.forEach((el, idx) => {
            el.style.animationDelay = `${idx * 0.06}s`;
            el.classList.add(effectName);
        });
    }

    // 가루(Dust Particle) 분해 물리 연산
    function explodeToDust() {
        particles = [];
        const charElements = document.querySelectorAll('.char');
        
        charElements.forEach(el => {
            const rect = el.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            // 글자 영역 내에서 샘플링하여 파티클 생성
            const count = 70; // 글자당 파티클 수
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: rect.left + Math.random() * rect.width,
                    y: rect.top + Math.random() * rect.height,
                    vx: (Math.random() - 0.5) * 8 + 3, // 우측으로 날림
                    vy: (Math.random() - 0.5) * 8 - 2, // 살짝 부유
                    size: Math.random() * 3 + 1,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    color: '#eeddbb'
                });
            }
        });

        if (!isAnimatingParticles) {
            isAnimatingParticles = true;
            loopParticles();
        }
    }

    function loopParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx += 0.1; // 바람 저항
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (particles.length > 0) {
            requestAnimationFrame(loopParticles);
        } else {
            isAnimatingParticles = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    // 시퀀스 실행기
    function runSequence() {
        const text = textInput.value || "天地玄黃 宇宙洪荒";
        const inEffect = inSelect.value;
        const outEffect = outSelect.value;

        // 파티클 초기화
        particles = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        setupText(text);

        // IN 모션 실행 -> 1초 대기 -> OUT 모션 실행
        playInEffect(inEffect, () => {
            setTimeout(() => {
                playOutEffect(outEffect);
            }, 1000);
        });
    }

    // 최초 로드 시 1회 자동 실행
    window.onload = () => {
        runSequence();
    };
</script>
</body>
</html>
