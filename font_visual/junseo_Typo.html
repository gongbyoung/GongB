<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한글 구첩전(九疊篆) 획 분해 엔진 v0.4</title>
    <!-- 직각 획과 두꺼운 기하학적 골격을 제공하는 한글 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dela+Gothic+One&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050404;
            --seal-red: #c82018;      /* 고전 인주색 */
            --guide-border: #00ffcc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 컨트롤 상단 패널 */
        #top-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            background: rgba(18, 15, 15, 0.94);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(200, 32, 24, 0.45);
            z-index: 1000;
            backdrop-filter: blur(10px);
            font-size: 11px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.85);
        }

        #top-bar button, #top-bar select, #top-bar label, #top-bar input {
            background: #201c1c;
            color: #eeddbb;
            border: 1px solid #483a3a;
            padding: 5px 9px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            outline: none;
        }

        #top-bar input[type="number"] {
            width: 65px;
            text-align: center;
            cursor: text;
        }

        #top-bar button:hover, #top-bar label:hover {
            background: var(--seal-red);
            color: #fff;
            border-color: var(--seal-red);
        }

        #file-input { display: none; }

        #timeline-info {
            color: #00ffcc;
            font-family: monospace;
            font-size: 13px;
            min-width: 75px;
            text-align: center;
        }

        /* 뷰포트 & 가이드 */
        #viewport-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.25s, height 0.25s;
        }

        .ratio-16-9 {
            width: 1120px;
            height: 630px;
            border: 2px dashed var(--guide-border);
        }

        .ratio-9-16 {
            width: 380px;
            height: 675px;
            border: 2px dashed var(--guide-border);
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body>

<div id="top-bar">
    <label for="file-input">📂 LOAD SRT</label>
    <input type="file" id="file-input" accept=".srt">
    
    <label>화면비:</label>
    <select id="ratio-select" onchange="changeRatio(this.value)">
        <option value="16:9">16:9 (가로형)</option>
        <option value="9:16">9:16 (세로 숏폼)</option>
    </select>

    <label>스케일 모드:</label>
    <select id="scale-mode" onchange="updateScaleModeUI()">
        <option value="fill">화면 가득 채움 (%)</option>
        <option value="fixed">절대 수치 고정 (px)</option>
    </select>

    <div id="px-input-group" style="display: none; align-items: center; gap: 4px;">
        <label>글자 크기(px):</label>
        <input type="number" id="fixed-px-val" value="160" min="40" max="600" step="10" onchange="renderCurrentFrame()">
    </div>

    <label>IN 효과:</label>
    <select id="in-select">
        <option value="stamp" selected>1. 벼락 낙하 (날인)</option>
        <option value="popup">2. 바닥에서 팝업</option>
        <option value="snow">3. 위에서 조립</option>
        <option value="converge">4. 사방에서 획 수렴</option>
    </select>

    <label>OUT 효과:</label>
    <select id="out-select">
        <option value="stroke-snake" selected>★ 획 단위 분리 뱀 비산</option>
        <option value="wind">바람에 날리기</option>
        <option value="sink">바닥 침몰</option>
    </select>

    <button id="play-btn" onclick="togglePlay()">▶ 재생</button>
    <span id="timeline-info">00:00.00</span>
</div>

<div id="viewport-wrapper" class="ratio-16-9">
    <canvas id="renderCanvas"></canvas>
</div>

<script>
    let subtitles = [];
    let isPlaying = false;
    let startTime = 0;
    let animFrameId = null;
    let currentCueIndex = -1;

    const viewport = document.getElementById('viewport-wrapper');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const timelineInfo = document.getElementById('timeline-info');
    const playBtn = document.getElementById('play-btn');
    const inSelect = document.getElementById('in-select');
    const outSelect = document.getElementById('out-select');
    const scaleModeSelect = document.getElementById('scale-mode');
    const pxGroup = document.getElementById('px-input-group');
    const fixedPxInput = document.getElementById('fixed-px-val');

    let currentGlyphs = [];

    // 오프스크린 캔버스 (한글 획 벡터 스캐닝용)
    const scanCanvas = document.createElement('canvas');
    const scanCtx = scanCanvas.getContext('2d');
    scanCanvas.width = 160;
    scanCanvas.height = 160;

    function syncCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = viewport.clientWidth * dpr;
        canvas.height = viewport.clientHeight * dpr;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', () => { syncCanvas(); renderCurrentFrame(); });

    function changeRatio(ratio) {
        viewport.className = ratio === '16:9' ? 'ratio-16-9' : 'ratio-9-16';
        syncCanvas();
        renderCurrentFrame();
    }

    function updateScaleModeUI() {
        pxGroup.style.display = scaleModeSelect.value === 'fixed' ? 'flex' : 'none';
        renderCurrentFrame();
    }

    // SRT 파일 파서
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            parseSRT(evt.target.result);
        };
        reader.readAsText(file);
    });

    function parseSRT(data) {
        const clean = data.replace(/\r/g, '').trim();
        const blocks = clean.split(/\n\s*\n/);
        subtitles = [];

        blocks.forEach(block => {
            const lines = block.trim().split('\n');
            if(lines.length < 2) return;
            const timeLine = lines.find(l => l.includes('-->'));
            if(!timeLine) return;

            const tIdx = lines.indexOf(timeLine);
            const times = timeLine.split('-->');
            const text = lines.slice(tIdx + 1).join(' ').trim();

            subtitles.push({
                start: timeToSec(times[0].trim()),
                end: timeToSec(times[1].trim()),
                text: text
            });
        });

        if(subtitles.length > 0) {
            alert(`SRT 자막 ${subtitles.length}개가 로드되었습니다.`);
            currentCueIndex = 0;
            buildGlyphs(0);
            renderCurrentFrame();
        }
    }

    function timeToSec(str) {
        const p = str.replace(',', '.').split(':');
        return parseFloat(p[0])*3600 + parseFloat(p[1])*60 + parseFloat(p[2]);
    }

    // ========================================================
    // [한글 기반 구첩전 획 벡터 추출 엔진]
    // 실제 입력된 한글 글자를 도장 비율로 스캔하여 개별 획을 생성
    // ========================================================
    function extractHangulStrokes(char, seed) {
        const strokes = [];
        const W = 160, H = 160;
        scanCtx.clearRect(0, 0, W, H);

        // 구첩전 특유의 전각 직각 팽창 렌더링
        scanCtx.save();
        scanCtx.fillStyle = '#ffffff';
        scanCtx.font = '900 135px "Black Han Sans", "Noto Sans KR", sans-serif';
        scanCtx.textAlign = 'center';
        scanCtx.textBaseline = 'middle';
        
        // 세로축 1.35배 늘려 사각 인면을 꽉 채우는 구첩전 비율 구현
        scanCtx.translate(W / 2, H / 2);
        scanCtx.scale(0.85, 1.35);
        scanCtx.fillText(char, 0, 0);
        scanCtx.restore();

        const imgData = scanCtx.getImageData(0, 0, W, H).data;
        const step = 8; // 격자 샘플링 해상도
        const horizontalRuns = [];

        // 1. 수평 절선 획(Horizontal Strokes) 추출
        for (let y = 0; y < H; y += step) {
            let startX = -1;
            for (let x = 0; x < W; x += step) {
                const idx = (y * W + x) * 4;
                const isSolid = imgData[idx + 3] > 128;

                if (isSolid && startX === -1) {
                    startX = x;
                } else if (!isSolid && startX !== -1) {
                    if (x - startX >= step * 2) {
                        horizontalRuns.push({
                            x1: startX / W,
                            y1: y / H,
                            x2: (x - step) / W,
                            y2: y / H
                        });
                    }
                    startX = -1;
                }
            }
            if (startX !== -1 && (W - startX) >= step * 2) {
                horizontalRuns.push({
                    x1: startX / W,
                    y1: y / H,
                    x2: (W - step) / W,
                    y2: y / H
                });
            }
        }

        // 2. 수직 절선 획(Vertical Strokes) 추출
        const verticalRuns = [];
        for (let x = 0; x < W; x += step) {
            let startY = -1;
            for (let y = 0; y < H; y += step) {
                const idx = (y * W + x) * 4;
                const isSolid = imgData[idx + 3] > 128;

                if (isSolid && startY === -1) {
                    startY = y;
                } else if (!isSolid && startY !== -1) {
                    if (y - startY >= step * 2) {
                        verticalRuns.push({
                            x1: x / W,
                            y1: startY / H,
                            x2: x / W,
                            y2: (y - step) / H
                        });
                    }
                    startY = -1;
                }
            }
            if (startY !== -1 && (H - startY) >= step * 2) {
                verticalRuns.push({
                    x1: x / W,
                    y1: startY / H,
                    x2: x / W,
                    y2: (H - step) / H
                });
            }
        }

        // 3. 추출된 수평/수직 획 통합
        const combined = [...horizontalRuns, ...verticalRuns];

        combined.forEach((run, rIdx) => {
            const angle = (rIdx / combined.length) * Math.PI * 2 + (seed * 0.3);
            strokes.push({
                points: [
                    { x: run.x1, y: run.y1 },
                    { x: run.x2, y: run.y2 }
                ],
                // 획 고유 비산 물리 벡터
                dirX: Math.cos(angle) * (450 + (rIdx % 4) * 120),
                dirY: Math.sin(angle) * (350 + (rIdx % 3) * 120),
                rotSpeed: (rIdx % 2 === 0 ? 1 : -1) * (3 + (rIdx % 3)),
                phase: rIdx * 0.35,
                strokeWidth: 0.055
            });
        });

        return strokes;
    }

    // 화면 꽉 찬 배치 및 글자별 획 구조체 구성
    function buildGlyphs(idx) {
        if(!subtitles[idx]) return;
        const sub = subtitles[idx];
        const chars = sub.text.replace(/\s+/g, '').split('');
        if(chars.length === 0) return;

        const vW = viewport.clientWidth;
        const vH = viewport.clientHeight;
        const mode = scaleModeSelect.value;
        const total = chars.length;

        let slotSize;
        if(mode === 'fill') {
            const cols = Math.ceil(Math.sqrt(total));
            const target = Math.min(vW, vH) * 0.85;
            slotSize = Math.floor(target / cols);
        } else {
            slotSize = parseFloat(fixedPxInput.value) || 160;
        }

        const cols = Math.min(total, Math.floor((vW * 0.92) / slotSize) || 1);
        const rows = Math.ceil(total / cols);
        const totalW = cols * slotSize;
        const totalH = rows * slotSize;
        const startX = (vW - totalW) / 2;
        const startY = (vH - totalH) / 2;

        currentGlyphs = chars.map((char, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const gx = startX + col * slotSize;
            const gy = startY + row * slotSize;

            const strokes = extractHangulStrokes(char, i * 83);

            return {
                char,
                x: gx,
                y: gy,
                size: slotSize,
                strokes: strokes
            };
        });
    }

    // ========================================================
    // [렌더러 & 획 단위 이징 모션]
    // ========================================================
    function renderFrame(curTime) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(!subtitles[currentCueIndex]) return;

        const sub = subtitles[currentCueIndex];
        const cueDuration = Math.max(sub.end - sub.start, 0.4);
        const elapsed = curTime - sub.start;
        const normTime = Math.min(Math.max(elapsed / cueDuration, 0), 1);

        const inType = inSelect.value;
        const outType = outSelect.value;

        const inWindow = 0.22;
        const outWindow = 0.22;
        const inProgress = Math.min(normTime / inWindow, 1);
        const isOut = normTime > (1 - outWindow);
        const outProgress = isOut ? (normTime - (1 - outWindow)) / outWindow : 0;

        ctx.strokeStyle = '#c82018';
        ctx.lineCap = 'square';
        ctx.lineJoin = 'miter';

        currentGlyphs.forEach((glyph, gIdx) => {
            const gDelay = gIdx * 0.035;
            const localInP = Math.min(Math.max((inProgress - gDelay) / (1 - gDelay || 1), 0), 1);

            glyph.strokes.forEach((stroke, sIdx) => {
                ctx.save();

                let strokeScale = 1;
                let transX = glyph.x;
                let transY = glyph.y;
                let rotation = 0;
                let alpha = 1;

                // --- 1. IN 효과 ---
                if (localInP < 1) {
                    if (inType === 'stamp') {
                        const p = localInP;
                        strokeScale = p < 0.8 ? 3.5 - p * 3.1 : 1;
                        alpha = Math.min(p * 2, 1);
                    } else if (inType === 'popup') {
                        transY += (1 - localInP) * 120;
                        alpha = localInP;
                    } else if (inType === 'snow') {
                        transY -= (1 - localInP) * 160;
                        alpha = localInP;
                    } else if (inType === 'converge') {
                        transX += stroke.dirX * (1 - localInP) * 0.5;
                        transY += stroke.dirY * (1 - localInP) * 0.5;
                        alpha = localInP;
                    }
                }

                // --- 2. OUT 효과 (실제 한글 획 분리 비산) ---
                if (outProgress > 0) {
                    const localOutP = Math.min(Math.max((outProgress - sIdx * 0.015) / 0.85, 0), 1);

                    if (outType === 'stroke-snake') {
                        // 뱀처럼 구불거리는 S자 곡선 (Sine 웨이브)
                        const wave = Math.sin(localOutP * Math.PI * 4 + stroke.phase) * 55;
                        transX += stroke.dirX * localOutP + (stroke.dirY > 0 ? wave : -wave);
                        transY += stroke.dirY * localOutP + wave;
                        rotation = stroke.rotSpeed * localOutP;
                        alpha = 1 - Math.pow(localOutP, 2);
                        strokeScale = 1 + localOutP * 0.3;
                    } else if (outType === 'wind') {
                        transX += localOutP * 450;
                        transY -= localOutP * 70;
                        alpha = 1 - localOutP;
                    } else if (outType === 'sink') {
                        transY += localOutP * 220;
                        alpha = 1 - localOutP;
                    }
                }

                // 획 렌더링
                ctx.globalAlpha = Math.max(alpha, 0);
                ctx.translate(transX + glyph.size / 2, transY + glyph.size / 2);
                ctx.rotate(rotation);
                ctx.scale(strokeScale, strokeScale);
                ctx.translate(-glyph.size / 2, -glyph.size / 2);

                const sWidth = stroke.strokeWidth * glyph.size;
                ctx.lineWidth = Math.max(sWidth, 2.5);

                ctx.beginPath();
                stroke.points.forEach((pt, pIdx) => {
                    const px = pt.x * glyph.size;
                    const py = pt.y * glyph.size;
                    if (pIdx === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.stroke();

                ctx.restore();
            });
        });
    }

    function renderCurrentFrame() {
        if(currentCueIndex === -1 && subtitles.length > 0) currentCueIndex = 0;
        buildGlyphs(currentCueIndex);
        const cur = subtitles[currentCueIndex] ? subtitles[currentCueIndex].start + 0.1 : 0;
        renderFrame(cur);
    }

    // 재생 루프
    function togglePlay() {
        if(subtitles.length === 0) {
            subtitles = [
                { start: 0.5, end: 3.5, text: "바다바람" },
                { start: 4.0, end: 7.0, text: "치마폭에" },
                { start: 7.5, end: 10.5, text: "니치대는구려" }
            ];
            alert("기본 한글 구첩전 샘플 자막이 로드되었습니다.");
        }

        isPlaying = !isPlaying;
        if(isPlaying) {
            playBtn.innerText = "⏹ 정지";
            playBtn.style.background = "#555";
            startTime = performance.now();
            currentCueIndex = -1;
            loop();
        } else {
            playBtn.innerText = "▶ 재생";
            playBtn.style.background = "var(--seal-red)";
            cancelAnimationFrame(animFrameId);
        }
    }

    function loop() {
        if(!isPlaying) return;
        const curTime = (performance.now() - startTime) / 1000;

        const mm = Math.floor(curTime / 60).toString().padStart(2, '0');
        const ss = (curTime % 60).toFixed(2).padStart(5, '0');
        timelineInfo.innerText = `${mm}:${ss}`;

        const activeIdx = subtitles.findIndex(s => curTime >= s.start && curTime <= s.end);

        if(activeIdx !== -1 && activeIdx !== currentCueIndex) {
            currentCueIndex = activeIdx;
            buildGlyphs(currentCueIndex);
        }

        if(currentCueIndex !== -1) {
            renderFrame(curTime);
        }

        if(curTime > subtitles[subtitles.length - 1].end + 0.5) {
            togglePlay();
            return;
        }

        animFrameId = requestAnimationFrame(loop);
    }

    // 구동 초기화
    syncCanvas();
    updateScaleModeUI();
</script>
</body>
</html>
