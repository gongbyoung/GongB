<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인전체 자막 타이포그래피</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17130f;
  --ink-2:#221b15;
  --paper:#e9e0cc;
  --paper-dim:#b9ac8d;
  --seal:#a3231f;
  --seal-deep:#7a1a17;
  --seal-glow:#e14b3a;
  --gold:#b5892c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:
    radial-gradient(ellipse at 20% 10%, #241d16 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, #201a14 0%, transparent 50%),
    var(--ink);
  color:var(--paper);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100%;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* ---------- header ---------- */
header{
  padding:22px clamp(16px,4vw,40px) 14px;
  border-bottom:1px solid #3a3126;
}
header h1{
  font-family:'Black Han Sans',sans-serif;
  font-size:clamp(20px,3vw,28px);
  letter-spacing:2px;
  margin:0 0 4px;
  color:var(--paper);
}
header p{
  margin:0;
  font-size:13px;
  color:var(--paper-dim);
  letter-spacing:.3px;
}

/* ---------- stage ---------- */
.stage-wrap{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px,3vw,32px);
}
.stage{
  position:relative;
  width:100%;
  max-width:1040px;
  aspect-ratio:16/9;
  background:#000;
  background-image:
    linear-gradient(#0000 0 0),
    repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px);
  border:1px solid #40352590;
  overflow:hidden;
}
.stage video{
  width:100%;height:100%;object-fit:contain;background:#000;display:block;
}
.stage.no-video{
  background:
    radial-gradient(circle at 50% 42%, #262019 0%, #15110d 70%);
}
.stage.no-video::before{
  content:"영상 없이 자막만 미리보기 중";
  position:absolute;top:14px;left:16px;
  font-size:12px;color:#6e6250;letter-spacing:.5px;
}

/* subtitle overlay */
.sub-overlay{
  position:absolute;
  left:0;right:0;
  bottom:9%;
  display:flex;
  justify-content:center;
  pointer-events:none;
  padding:0 4%;
  perspective:900px;
}
.sub-line{
  position:relative;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:0 2px;
  max-width:100%;
}
.sub-line .row{
  display:flex;
  justify-content:center;
  width:100%;
  flex-wrap:wrap;
}
.ch{
  display:inline-block;
  font-family:'Black Han Sans',sans-serif;
  font-size:clamp(26px,4.2vw,52px);
  line-height:1.15;
  color:var(--seal);
  text-shadow:
    0 0 0 var(--seal),
    1px 0 0 var(--seal-deep),
    -1px 0 0 var(--seal-deep),
    0 1px 0 var(--seal-deep),
    0 -1px 0 var(--seal-deep),
    2px 2px 6px rgba(0,0,0,.65);
  filter:url(#seal-carve);
  will-change:transform,opacity,filter;
  transform-origin:50% 50%;
}
.ch.space{width:.4em;}

/* seal stamp glow behind active line */
.seal-disc{
  position:absolute;
  left:50%;top:50%;
  width:0;height:0;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.seal-disc.hit{
  animation:sealHit .5s ease-out;
}
@keyframes sealHit{
  0%{box-shadow:0 0 0 0 rgba(163,35,31,.55);}
  100%{box-shadow:0 0 0 220px rgba(163,35,31,0);}
}

/* ---------- controls ---------- */
.controls{
  border-top:1px solid #3a3126;
  padding:16px clamp(16px,4vw,40px) calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-wrap:wrap;
  gap:14px 22px;
  align-items:center;
  background:linear-gradient(180deg,#1b160fcc,#140f0acc);
}
.field{
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:11px;
  color:var(--paper-dim);
  letter-spacing:.4px;
}
.field label{white-space:nowrap;}
.btn,input[type=file]::file-selector-button,select{
  font-family:inherit;
  font-size:13px;
  background:#241d16;
  color:var(--paper);
  border:1px solid #4a3d2c;
  padding:8px 14px;
  cursor:pointer;
  transition:border-color .15s, color .15s;
}
input[type=file]{
  font-size:12px;color:var(--paper-dim);
  max-width:180px;
}
.btn:hover,select:hover,input[type=file]::file-selector-button:hover{
  border-color:var(--seal);
  color:#f2e6c8;
}
.btn:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;
}
.btn.primary{
  background:var(--seal);
  border-color:var(--seal);
  color:#fff0e4;
  font-weight:700;
  min-width:78px;
}
.btn.primary:hover{background:var(--seal-glow);border-color:var(--seal-glow);}

.timeline{
  flex:1 1 260px;
  display:flex;
  align-items:center;
  gap:10px;
}
.timeline input[type=range]{
  flex:1;
  accent-color:var(--seal);
  height:4px;
}
.time-label{
  font-variant-numeric:tabular-nums;
  font-size:12px;
  color:var(--paper-dim);
  min-width:100px;
  text-align:center;
}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  .ch{animation:none !important;transition:opacity .2s;}
}

/* ===================== IN keyframes ===================== */
@keyframes in-snake{
  0%{transform:translateX(-26px) translateY(6px) rotate(-14deg);opacity:0;}
  55%{transform:translateX(6px) translateY(-3px) rotate(6deg);opacity:1;}
  100%{transform:translateX(0) translateY(0) rotate(0);opacity:1;}
}
@keyframes in-rise{
  0%{transform:translateY(42px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
@keyframes in-stamp{
  0%{transform:scale(2.4);opacity:0;filter:url(#seal-carve) brightness(2);}
  55%{transform:scale(.88);opacity:1;}
  75%{transform:scale(1.06);}
  100%{transform:scale(1);opacity:1;filter:url(#seal-carve) brightness(1);}
}
@keyframes in-press{
  0%{transform:translateY(-70px) scaleY(1);opacity:0;}
  60%{transform:translateY(0) scaleY(.6);opacity:1;}
  78%{transform:translateY(2px) scaleY(1.15);}
  100%{transform:translateY(0) scaleY(1);}
}
@keyframes in-fade{
  0%{opacity:0;}100%{opacity:1;}
}
@keyframes in-flip{
  0%{transform:rotateX(-95deg);opacity:0;}
  100%{transform:rotateX(0);opacity:1;}
}
@keyframes in-ink{
  0%{opacity:0;filter:url(#seal-carve) blur(9px);}
  100%{opacity:1;filter:url(#seal-carve) blur(0);}
}
@keyframes in-scatter{
  0%{transform:translate(var(--rx,30px),var(--ry,-30px)) rotate(var(--rr,25deg)) scale(.4);opacity:0;}
  100%{transform:translate(0,0) rotate(0) scale(1);opacity:1;}
}
@keyframes in-carve{
  0%{clip-path:inset(0 100% 0 0);opacity:.001;}
  8%{opacity:1;}
  100%{clip-path:inset(0 0 0 0);opacity:1;}
}
@keyframes in-zoom{
  0%{transform:scale(0) rotate(-10deg);opacity:0;}
  100%{transform:scale(1) rotate(0);opacity:1;}
}
@keyframes in-glow{
  0%{opacity:0;text-shadow:0 0 26px var(--seal-glow),0 0 40px var(--seal-glow);}
  60%{opacity:1;text-shadow:0 0 14px var(--seal-glow);}
  100%{opacity:1;text-shadow:2px 2px 6px rgba(0,0,0,.65);}
}
@keyframes in-shake{
  0%{transform:translateX(0);opacity:0;}
  15%{transform:translateX(-10px);opacity:1;}
  30%{transform:translateX(8px);}
  45%{transform:translateX(-6px);}
  60%{transform:translateX(4px);}
  100%{transform:translateX(0);}
}

/* ===================== OUT keyframes ===================== */
@keyframes out-snake{
  0%{transform:translateX(0) rotate(0);opacity:1;}
  40%{transform:translateX(14px) rotate(8deg);opacity:.8;}
  100%{transform:translateX(-30px) rotate(-16deg);opacity:0;}
}
@keyframes out-fly{
  0%{transform:translate(0,0) rotate(0);opacity:1;}
  100%{transform:translate(var(--rx,40px),var(--ry,-46px)) rotate(var(--rr,60deg));opacity:0;}
}
@keyframes out-dissolve{
  0%{opacity:1;filter:url(#seal-carve) blur(0);transform:translateY(0);}
  100%{opacity:0;filter:url(#seal-carve) blur(10px);transform:translateY(-26px);}
}
@keyframes out-overprint{
  0%{opacity:1;transform:scale(1);filter:brightness(1);}
  40%{opacity:.7;transform:scale(.92);filter:brightness(.5);}
  100%{opacity:0;transform:scale(.78);filter:brightness(.2);}
}
@keyframes out-fade{
  0%{opacity:1;}100%{opacity:0;}
}
@keyframes out-flip{
  0%{transform:rotateX(0);opacity:1;}
  100%{transform:rotateX(95deg);opacity:0;}
}
@keyframes out-bleed{
  0%{opacity:1;filter:url(#seal-carve) blur(0);transform:scale(1);}
  100%{opacity:0;filter:url(#seal-carve) blur(14px);transform:scale(1.35);}
}
@keyframes out-scatter{
  0%{transform:translate(0,0) rotate(0) scale(1);opacity:1;}
  100%{transform:translate(var(--rx,-40px),var(--ry,36px)) rotate(var(--rr,-40deg)) scale(.5);opacity:0;}
}
@keyframes out-carve{
  0%{clip-path:inset(0 0 0 0);opacity:1;}
  92%{opacity:1;}
  100%{clip-path:inset(0 0 0 100%);opacity:.001;}
}
@keyframes out-shrink{
  0%{transform:scale(1) rotate(0);opacity:1;}
  100%{transform:scale(0) rotate(18deg);opacity:0;}
}
@keyframes out-sink{
  0%{transform:translateY(0);opacity:1;filter:brightness(1);}
  100%{transform:translateY(30px);opacity:0;filter:brightness(.4);}
}
@keyframes out-crumble{
  0%{transform:translateY(0) rotate(0);opacity:1;}
  100%{transform:translateY(46px) rotate(var(--rr,35deg));opacity:0;}
}

.ch.anim{animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.34,1.1,.4,1);}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="seal-carve" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="1" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header>
  <h1>印篆體 자막 타이포그래피</h1>
  <p>SRT 자막을 인전체(구첩전) 스타일로 도장 찍듯 등장·소멸시키는 미리보기 도구</p>
</header>

<div class="stage-wrap">
  <div class="stage no-video" id="stage">
    <video id="video" playsinline style="display:none"></video>
    <div class="sub-overlay"><div class="sub-line" id="subLine"></div></div>
  </div>
</div>

<div class="controls">
  <div class="field">
    <label for="srtInput">SRT 파일</label>
    <input type="file" id="srtInput" accept=".srt">
  </div>
  <div class="field">
    <label for="videoInput">영상 파일 (선택)</label>
    <input type="file" id="videoInput" accept="video/*">
  </div>
  <div class="field">
    <label for="inSelect">등장 효과</label>
    <select id="inSelect"></select>
  </div>
  <div class="field">
    <label for="outSelect">소멸 효과</label>
    <select id="outSelect"></select>
  </div>
  <button class="btn primary" id="playBtn">재생</button>
  <button class="btn" id="restartBtn">처음으로</button>
  <div class="timeline">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    <span class="time-label" id="timeLabel">00:00.0 / 00:00.0</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  const IN_EFFECTS = [
    {id:'in-snake',   label:'뱀처럼 구불구불 들어오기'},
    {id:'in-rise',    label:'바닥에서 스르륵 올라오기'},
    {id:'in-stamp',   label:'도장 찍히듯 팍 찍히기'},
    {id:'in-press',   label:'위에서 눌리듯 도장 찍기'},
    {id:'in-fade',    label:'서서히 배어나오기'},
    {id:'in-flip',    label:'뒤집히며 나타나기'},
    {id:'in-ink',     label:'먹이 번지며 초점 맞기'},
    {id:'in-scatter', label:'흩어졌다가 모이기'},
    {id:'in-carve',   label:'획을 새기듯 드러나기'},
    {id:'in-zoom',    label:'확대되며 나타나기'},
    {id:'in-glow',    label:'붉게 달아올랐다 가라앉기'},
    {id:'in-shake',   label:'흔들리다 정착하기'}
  ];
  const OUT_EFFECTS = [
    {id:'out-snake',    label:'뱀처럼 구불구불 사라지기'},
    {id:'out-fly',      label:'조각나 흩날리며 사라지기'},
    {id:'out-dissolve', label:'공중으로 흩어져 분해되기'},
    {id:'out-overprint',label:'다음 글자에 덧찍혀 사라지기'},
    {id:'out-fade',     label:'서서히 스며 사라지기'},
    {id:'out-flip',     label:'뒤집히며 사라지기'},
    {id:'out-bleed',    label:'먹물 번지듯 퍼지며 사라지기'},
    {id:'out-scatter',  label:'사방으로 튕겨 사라지기'},
    {id:'out-carve',    label:'획을 지우듯 사라지기'},
    {id:'out-shrink',   label:'줄어들며 사라지기'},
    {id:'out-sink',     label:'가라앉듯 사라지기'},
    {id:'out-crumble',  label:'부스러져 떨어지기'}
  ];

  const inSelect = document.getElementById('inSelect');
  const outSelect = document.getElementById('outSelect');
  [['자동 순환',''],...IN_EFFECTS.map(e=>[e.label,e.id])].forEach(([label,val])=>{
    const o=document.createElement('option');o.value=val;o.textContent=label;inSelect.appendChild(o);
  });
  [['자동 순환',''],...OUT_EFFECTS.map(e=>[e.label,e.id])].forEach(([label,val])=>{
    const o=document.createElement('option');o.value=val;o.textContent=label;outSelect.appendChild(o);
  });

  // ---------- SRT parsing ----------
  function parseSRT(text){
    text = text.replace(/\r/g,'').trim();
    const blocks = text.split(/\n\s*\n/);
    const cues = [];
    for(const block of blocks){
      const lines = block.split('\n').filter(l=>l.length);
      if(lines.length<2) continue;
      let idx=0;
      if(/^\d+$/.test(lines[0].trim())) idx=1;
      const timeLine = lines[idx];
      const m = timeLine.match(/(\d\d):(\d\d):(\d\d)[,.](\d\d\d)\s*-->\s*(\d\d):(\d\d):(\d\d)[,.](\d\d\d)/);
      if(!m) continue;
      const start = (+m[1]*3600+ +m[2]*60+ +m[3]) + (+m[4])/1000;
      const end   = (+m[5]*3600+ +m[6]*60+ +m[7]) + (+m[8])/1000;
      const text = lines.slice(idx+1).join('\n').replace(/<[^>]+>/g,'');
      cues.push({start,end,text});
    }
    cues.sort((a,b)=>a.start-b.start);
    return cues;
  }

  // ---------- state ----------
  let cues = [];
  let activeIndex = -1;
  let playing = false;
  let virtualStart = 0;   // performance.now() offset when using virtual clock
  let virtualElapsed = 0;
  let duration = 60;
  let usingVideo = false;

  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const subLine = document.getElementById('subLine');
  const seek = document.getElementById('seek');
  const timeLabel = document.getElementById('timeLabel');
  const playBtn = document.getElementById('playBtn');

  document.getElementById('srtInput').addEventListener('change', e=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      cues = parseSRT(reader.result);
      activeIndex = -1;
      subLine.innerHTML='';
      duration = cues.length ? Math.max(duration, cues[cues.length-1].end + 2) : 60;
      seek.max = duration;
      updateTimeLabel(getCurrentTime());
    };
    reader.readAsText(f, 'utf-8');
  });

  document.getElementById('videoInput').addEventListener('change', e=>{
    const f = e.target.files[0];
    if(!f) return;
    const url = URL.createObjectURL(f);
    video.src = url;
    video.style.display='block';
    stage.classList.remove('no-video');
    usingVideo = true;
    video.addEventListener('loadedmetadata', ()=>{
      duration = Math.max(video.duration||0, cues.length?cues[cues.length-1].end+2:0);
      seek.max = duration;
    }, {once:true});
  });

  function getCurrentTime(){
    if(usingVideo) return video.currentTime;
    if(playing) return virtualElapsed + (performance.now()-virtualStart)/1000;
    return virtualElapsed;
  }

  function fmt(t){
    t = Math.max(0,t);
    const m = Math.floor(t/60);
    const s = t-m*60;
    return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0');
  }
  function updateTimeLabel(t){
    timeLabel.textContent = fmt(t)+' / '+fmt(duration);
    if(!seekDragging) seek.value = t;
  }

  let seekDragging=false;
  seek.addEventListener('input', ()=>{ seekDragging=true; });
  seek.addEventListener('change', ()=>{
    const t = parseFloat(seek.value);
    if(usingVideo){ video.currentTime = t; }
    else { virtualElapsed = t; virtualStart = performance.now(); }
    seekDragging=false;
    activeIndex = -1;
    subLine.innerHTML='';
  });

  playBtn.addEventListener('click', ()=>{
    if(!playing){
      playing = true;
      playBtn.textContent = '일시정지';
      if(usingVideo){ video.play(); }
      else { virtualStart = performance.now(); }
    } else {
      playing = false;
      playBtn.textContent = '재생';
      if(usingVideo){ video.pause(); }
      else { virtualElapsed = getCurrentTime(); }
    }
  });

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    playing=false; playBtn.textContent='재생';
    if(usingVideo){ video.pause(); video.currentTime=0; }
    virtualElapsed=0; virtualStart=performance.now();
    activeIndex=-1; subLine.innerHTML='';
    updateTimeLabel(0);
  });

  // ---------- character splitting + animation ----------
  function buildChars(str, animClass, extraDelayFn){
    const frag = document.createDocumentFragment();
    const rows = str.split('\n');
    rows.forEach((row,ri)=>{
      const rowEl = document.createElement('div');
      rowEl.className='row';
      [...row].forEach((c,ci)=>{
        const span = document.createElement('span');
        span.className='ch anim';
        if(c===' '){ span.classList.add('space'); span.textContent='\u00A0'; }
        else span.textContent=c;
        span.style.setProperty('--rx',(Math.random()*70-35).toFixed(1)+'px');
        span.style.setProperty('--ry',(Math.random()*70-35).toFixed(1)+'px');
        span.style.setProperty('--rr',(Math.random()*70-35).toFixed(1)+'deg');
        const delay = extraDelayFn(ri,ci);
        span.style.animationName = animClass;
        span.style.animationDuration='.62s';
        span.style.animationDelay = delay+'ms';
        rowEl.appendChild(span);
      });
      frag.appendChild(rowEl);
    });
    return frag;
  }

  function pickEffect(list, selectEl, cueIdx){
    const chosen = selectEl.value;
    if(chosen) return chosen;
    return list[cueIdx % list.length].id;
  }

  function showCue(cue, cueIdx){
    const outEffect = pickEffect(OUT_EFFECTS, outSelect, cueIdx>0?cueIdx-1:0);
    const oldChars = subLine.querySelectorAll('.ch');
    if(oldChars.length){
      oldChars.forEach((el,i)=>{
        el.style.animationName = outEffect;
        el.style.animationDuration='.45s';
        el.style.animationDelay=(i*16)+'ms';
      });
      setTimeout(()=>{ subLine.innerHTML=''; }, 480);
    }
    if(!cue){ return; }
    const inEffect = pickEffect(IN_EFFECTS, inSelect, cueIdx);
    const frag = buildChars(cue.text, inEffect, (ri,ci)=> ci*38 + ri*60 + (oldChars.length?260:0));
    setTimeout(()=>{ subLine.appendChild(frag); }, oldChars.length?260:0);
  }

  function tick(){
    const t = getCurrentTime();
    updateTimeLabel(t);
    if(cues.length){
      let idx = -1;
      for(let i=0;i<cues.length;i++){
        if(t>=cues[i].start && t<cues[i].end){ idx=i; break; }
      }
      if(idx===-1){
        if(activeIndex!==-1){ showCue(null, activeIndex); activeIndex=-1; }
      } else if(idx!==activeIndex){
        showCue(cues[idx], idx);
        activeIndex = idx;
      }
    }
    if(playing && !usingVideo && virtualElapsed + (performance.now()-virtualStart)/1000 > duration){
      playing=false; playBtn.textContent='재생';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
