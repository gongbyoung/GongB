<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 캘리그라피 자막 MP4 생성기 (실시간 붓글씨 모션 엔진)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Gaegu:wght@300;400;700&family=Nanum+Brush+Script&family=Nanum+Pen+Script&family=Yeon+Sung&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>

  <style>
    /* CSS 레이아웃 및 다크모드 스타일 생략 */
  </style>
</head>
<body>

  <svg class="filters" style="position:absolute; width:0; height:0;">
    <defs>
      <filter id="ink-bleed-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="main-container">
    <div class="sidebar">
      <div class="control-group">
        <div class="section-title">✍️ 붓쓰기 모션 & 구도</div>
        <label for="write-mode">실시간 써지는 애니메이션</label>
        <select id="write-mode">
          <option value="hangul-stroke" selected>🖋️ 초성➔중성➔종성 실시간 붓쓰기 (추천)</option>
          <option value="fade">✨ 감성 서서히 나타남 (Fade-in)</option>
          <option value="static">📌 고정 표시 (Static)</option>
        </select>

        <label for="layout-mode">캘리그라피 조형 밀집도</label>
        <select id="layout-mode">
          <option value="vertical-compact" selected>📜 좁은 세로축 밀집 구도 (입력 예시 사진)</option>
          <option value="cozy-cluster">🧸 아기자기 뭉친 블록 구도</option>
          <option value="hero">💥 핵심어 대형 강조 구도</option>
        </select>
      </div>

      <div class="control-group">
        <div class="section-title">⚖️ 자막 밀도 & 강약 조율</div>
        <label for="param-tightness">글자 간격 밀집도 <span class="val" id="val-tightness">아주 촘촘함</span></label>
        <input type="range" id="param-tightness" min="0.5" max="1.1" step="0.05" value="0.75">
      </div>
    </div>

    <div class="preview-area">
      <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
      <!-- 플레이어 조작바 및 MP4 익스포트 버튼 -->
    </div>
  </div>

  <script>
    // 🔤 한글 초성/중성/종성 조합 분해 알고리즘
    const CHO_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

    function getHangulWritingStages(char) {
      const code = char.charCodeAt(0);
      if (code < 0xAC00 || code > 0xD7A3) return [char];

      const sysIndex = code - 0xAC00;
      const choIdx = Math.floor(sysIndex / 588);
      const jungIdx = Math.floor((sysIndex % 588) / 28);
      const jongIdx = sysIndex % 28;

      const stage1 = CHO_LIST[choIdx];                              // 1단계: 초성만 ('ㅁ')
      const stage2 = String.fromCharCode(0xAC00 + (choIdx * 588) + (jungIdx * 28)); // 2단계: 초성+중성 ('무')
      const stage3 = char;                                          // 3단계: 초성+중성+종성 ('물')

      return jongIdx === 0 ? [stage1, stage2] : [stage1, stage2, stage3];
    }

    // 📜 좁은 세로축 밀집 구도 + 실시간 초성/중성/종성 붓쓰기 렌더링
    function renderVerticalCompactLayout(text, progress, font, inkColor, tightness, contrast, showAxis, writeMode, seed) {
      const chars = text.replace(/\n/g, ' ').split('').filter(c => c !== '');
      if (chars.length === 0) return;

      // 전체 한글 획 단계(초성->중성->종성) 계산
      let totalStages = 0;
      const charStageMaps = chars.map(char => {
        if (char === ' ') return { char, stages: [' '] };
        const stages = getHangulWritingStages(char);
        totalStages += stages.length;
        return { char, stages };
      });

      // 현재 시각 기준 완성되어야 하는 단계 수 계산
      const currentWrittenStages = Math.floor(progress * totalStages);

      const centerX = canvas.width / 2;
      const firstCharSize = Math.round(180 * contrast); // 첫 글자("물") 웅장하게
      const subCharSize = Math.round(75);              // 나머지 글자 아기자기하게
      const lineGap = subCharSize * tightness * 1.05;

      const totalH = firstCharSize + (chars.length - 1) * lineGap;
      const startY = (canvas.height - totalH) / 2 + firstCharSize * 0.4;

      ctx.save();
      ctx.textBaseline = 'middle'; ctx.textAlign = 'center';

      // 예시 사진 느낌의 은은한 세로 먹선 축
      if (showAxis) {
        ctx.save();
        ctx.strokeStyle = inkColor; ctx.globalAlpha = 0.65; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(centerX, startY - firstCharSize * 0.4);
        ctx.lineTo(centerX, startY + totalH - firstCharSize * 0.4 + 40);
        ctx.stroke();
        ctx.restore();
      }

      let stageCounter = 0;
      let curY = startY;
      let activeWritingPoint = null;

      chars.forEach((char, idx) => {
        if (char === ' ') { curY += lineGap * 0.5; return; }

        const isFirst = (idx === 0);
        const fontSize = isFirst ? firstCharSize : subCharSize;
        ctx.font = `${isFirst ? '900' : '700'} ${fontSize}px ${font}`;
        ctx.fillStyle = inkColor;

        const charData = charStageMaps[idx];
        const numStages = charData.stages.length;

        let displayChar = '';
        if (writeMode === 'hangul-stroke') {
          if (stageCounter + numStages <= currentWrittenStages) {
            displayChar = charData.stages[numStages - 1]; // 완필
          } else if (stageCounter < currentWrittenStages) {
            const subIndex = currentWrittenStages - stageCounter - 1;
            displayChar = charData.stages[Math.min(subIndex, numStages - 1)]; // 써지는 중
            activeWritingPoint = { x: centerX, y: curY };
          }
        } else {
          displayChar = char;
        }

        stageCounter += numStages;

        if (displayChar !== '') {
          ctx.save();
          const offsetX = (isFirst ? 0 : (seededRandom(seed++) - 0.5) * 8);
          ctx.translate(centerX + offsetX, curY);
          ctx.rotate((seededRandom(seed++) - 0.5) * (isFirst ? 0.05 : 0.12));
          ctx.fillText(displayChar, 0, 0);
          ctx.restore();
        }

        curY += isFirst ? (fontSize * 0.85 + lineGap * 0.3) : lineGap;
      });

      // 실시간 붓 끝 위치 붓점 연출
      if (activeWritingPoint && writeMode === 'hangul-stroke') {
        ctx.save();
        ctx.fillStyle = inkColor; ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(activeWritingPoint.x + 25, activeWritingPoint.y + 10, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }
  </script>
</body>
</html>
