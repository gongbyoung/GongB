<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 캘리그라피 자막 MP4 생성기 (전문가용 캘리그라피 엔진)</title>
  
  <!-- 캘리그라피 웹 폰트 로드 (구글 폰트 & 외부 폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Gaegu:wght@300;400;700&family=Nanum+Brush+Script&family=Nanum+Pen+Script&family=Yeon+Sung&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- MP4 인코딩 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>
  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: #1e1e24;
      --panel-border: #2d2d38;
      --accent-color: #ff6b35;
      --accent-gradient: linear-gradient(135deg, #ff6b35, #f72585);
      --text-main: #f0f0f5;
      --text-muted: #a0a0b0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* 상단 헤더 */
    header {
      background: #18181c;
      padding: 12px 24px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* 레이아웃 메인 구역 */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* 좌측 설정 패널 */
    .sidebar {
      width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    label span.val {
      color: var(--text-main);
      font-weight: 600;
    }
    input[type="file"] {
      display: none;
    }
    .btn-file {
      display: block;
      padding: 10px;
      background: #2a2a36;
      border: 1px dashed #444456;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-file:hover {
      border-color: var(--accent-color);
      background: #323242;
    }
    select, input[type="range"], input[type="color"] {
      width: 100%;
      padding: 8px;
      background: #16161a;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    input[type="range"] {
      padding: 0;
      accent-color: var(--accent-color);
      cursor: pointer;
    }
    /* 중앙 캔버스 미리보기 구역 */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a0c;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
      max-width: 100%;
      max-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }
    /* 하단 플레이어 / 타임라인 컨트롤 */
    .player-controls {
      width: 100%;
      max-width: 960px;
      margin-top: 15px;
      background: var(--panel-bg);
      padding: 14px 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid var(--panel-border);
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time-display {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--accent-color);
      min-width: 120px;
    }
    button.btn-action {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.btn-action:hover {
      opacity: 0.9;
    }
    button.btn-action:active {
      transform: scale(0.98);
    }
    button.btn-secondary {
      background: #2b2b38;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.btn-secondary:hover {
      background: #363646;
    }
    /* 자막 목록 패널 */
    .srt-list-container {
      max-height: 150px;
      overflow-y: auto;
      background: #141418;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px;
    }
    .srt-item {
      padding: 6px 10px;
      border-bottom: 1px solid #22222a;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .srt-item:hover, .srt-item.active {
      background: #252533;
      color: var(--accent-color);
    }
    /* 프로그레스 모달 */
    .progress-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      display: none;
    }
    .progress-box {
      background: var(--panel-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      text-align: center;
      width: 340px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #111;
      border-radius: 5px;
      margin: 15px 0;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-gradient);
      transition: width 0.1s linear;
    }
    svg.filters {
      position: absolute;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <!-- 붓글씨 먹물 번짐용 SVG 디스플레이스먼트 필터 -->
  <svg class="filters">
    <defs>
      <filter id="ink-bleed-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <header>
    <h1>🖌️ SRT 캘리그라피 자막 MP4 생성기</h1>
    <span style="font-size: 0.85rem; color: var(--text-muted);">전문가용 다형성 캘리그라피 엔진 v2.0</span>
  </header>
  <div class="main-container">
    <!-- 좌측 설정 사이드바 -->
    <div class="sidebar">
      
      <!-- 파일 업로드 -->
      <div class="control-group">
        <div class="section-title">📄 SRT 자막 파일</div>
        <label for="srt-input" class="btn-file" id="srt-label">
          📁 SRT 자막 불러오기 (.srt)
        </label>
        <input type="file" id="srt-input" accept=".srt">
      </div>
      <!-- 구도 스타일 선택 (문장마다 완성된 캘리그라피 구도 생성) -->
      <div class="control-group">
        <div class="section-title">🎭 캘리그라피 구도 메커니즘</div>
        <label for="layout-mode">구도 생성 모드</label>
        <select id="layout-mode">
          <option value="auto" selected>✨ 스마트 문맥 자동 조형 (추천)</option>
          <option value="hero">💥 핵심어 대형 강조형 (Hero Accent)</option>
          <option value="vertical">📜 전통 세로 흘림형 (Vertical Korean)</option>
          <option value="diagonal">↗ 대각선 춤추는 구도 (Dynamic Slant)</option>
          <option value="block">🧱 감성 블록 조형 (Artistic Block)</option>
        </select>
        <label for="font-family">붓글씨 기본 서체</label>
        <select id="font-family">
          <option value="'Nanum Brush Script', cursive" selected>나눔붓글씨 (힘있는 필체)</option>
          <option value="'Yeon Sung', cursive">연성체 (유려한 곡선)</option>
          <option value="'Dongle', sans-serif">동글체 (조형적 감성)</option>
          <option value="'Gaegu', cursive">개구체 (자연스러운 획)</option>
          <option value="'Nanum Pen Script', cursive">나눔펜글씨</option>
        </select>
      </div>
      <!-- 세부 조형 옵션 -->
      <div class="control-group">
        <div class="section-title">⚖️ 강약 & 조형 파라미터</div>
        
        <label for="param-contrast">글자 크기 강약 대비 (Thick/Thin) <span class="val" id="val-contrast">2.2x</span></label>
        <input type="range" id="param-contrast" min="1.2" max="3.5" step="0.1" value="2.2">
        <label for="param-flourish">문맥 맞춤형 선택적 갈고리/획 <span class="val" id="val-flourish">자연스러움</span></label>
        <select id="param-flourish">
          <option value="context" selected>🎯 핵심 글자에만 제한적 적용 (추천)</option>
          <option value="minimal">🌱 절제됨 (갈고리 최소화)</option>
          <option value="none">❌ 갈고리 완전 제거</option>
        </select>
        <label for="param-stagger">줄간 입체 배치 (지그재그) <span class="val" id="val-stagger">60px</span></label>
        <input type="range" id="param-stagger" min="0" max="120" value="60">
        <label for="param-bleed">먹물 번짐 강도 <span class="val" id="val-bleed">보통</span></label>
        <select id="param-bleed">
          <option value="normal" selected>보통 (자연스러운 번짐)</option>
          <option value="heavy">진함 (화려한 붓터치)</option>
          <option value="clean">깔끔함 (필터 최소화)</option>
        </select>
      </div>
      <!-- 배경 & 색상 -->
      <div class="control-group">
        <div class="section-title">🖼️ 배경 및 먹물 색상</div>
        <label for="bg-style">배경 스타일</label>
        <select id="bg-style">
          <option value="hanji" selected>전통 한지 (Rice Paper)</option>
          <option value="dark-paper">어두운 먹종이 (Dark Paper)</option>
          <option value="transparent">투명 배경 (영상 자막용)</option>
          <option value="black">단색 검정</option>
        </select>
        <label for="ink-color">먹물 색상</label>
        <input type="color" id="ink-color" value="#1c1917">
      </div>
      <!-- 자막 목록 -->
      <div class="control-group">
        <div class="section-title">📜 로드된 자막 목록</div>
        <div class="srt-list-container" id="srt-list"></div>
      </div>
    </div>
    <!-- 중앙 미리보기 구역 -->
    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
      </div>
      <div class="player-controls">
        <div class="timeline-row">
          <button class="btn-secondary" id="btn-play">▶ 재생</button>
          <input type="range" id="time-slider" min="0" max="100" value="0" step="0.01" style="flex:1;">
          <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
          <div style="font-size: 0.85rem; color: var(--text-muted);">
            해상도: 1920x1080 (Full HD) | 30 FPS H.264
          </div>
          <button class="btn-action" id="btn-export">
            🎬 H.264 MP4 영상 저장
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- 프로그레스 모달 -->
  <div class="progress-overlay" id="progress-modal">
    <div class="progress-box">
      <h3 style="margin-bottom: 10px; font-size: 1.1rem;">📽️ MP4 영상 렌더링 중...</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);" id="progress-text">프레임 생성 및 H.264 인코딩 진행 중</p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <span id="progress-percent" style="font-weight: bold; font-size: 1.1rem; color: var(--accent-color);">0%</span>
    </div>
  </div>
  <script>
    let srtData = [];
    let totalDuration = 0;
    let currentTime = 0;
    let isPlaying = false;
    let animationFrameId = null;
    let lastTimestamp = 0;
    const canvas = document.getElementById('calligraphy-canvas');
    const ctx = canvas.getContext('2d');
    const srtInput = document.getElementById('srt-input');
    const srtLabel = document.getElementById('srt-label');
    const srtListEl = document.getElementById('srt-list');
    const btnPlay = document.getElementById('btn-play');
    const timeSlider = document.getElementById('time-slider');
    const timeDisplay = document.getElementById('time-display');
    const btnExport = document.getElementById('btn-export');
    
    const layoutModeSelect = document.getElementById('layout-mode');
    const fontFamilySelect = document.getElementById('font-family');
    const bgStyleSelect = document.getElementById('bg-style');
    const inkColorInput = document.getElementById('ink-color');
    const paramContrast = document.getElementById('param-contrast');
    const paramFlourish = document.getElementById('param-flourish');
    const paramStagger = document.getElementById('param-stagger');
    const paramBleed = document.getElementById('param-bleed');
    const progressModal = document.getElementById('progress-modal');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const progressText = document.getElementById('progress-text');
    paramContrast.addEventListener('input', (e) => {
      document.getElementById('val-contrast').textContent = e.target.value + 'x';
      renderFrame(currentTime);
    });
    paramStagger.addEventListener('input', (e) => {
      document.getElementById('val-stagger').textContent = e.target.value + 'px';
      renderFrame(currentTime);
    });
    [layoutModeSelect, fontFamilySelect, bgStyleSelect, inkColorInput, paramFlourish, paramBleed].forEach(el => {
      el.addEventListener('change', () => renderFrame(currentTime));
    });
    const demoSRT = `1
00:00:00,500 --> 00:00:04,000
옷고름 너어는
고아의 설움.
2
00:00:04,500 --> 00:00:08,000
동트는 그곳에
꽃이 핀다
3
00:00:08,500 --> 00:00:12,000
말하는대로 생각한대로
꿈꾸는대로 이루어져라!
4
00:00:12,500 --> 00:00:16,000
도깨비
빛나는 당신의 내일을 응원합니다`;
    function parseSRTTime(timeStr) {
      if (!timeStr) return 0;
      const parts = timeStr.trim().replace(',', '.').split(':');
      return (parseFloat(parts[0])||0)*3600 + (parseFloat(parts[1])||0)*60 + (parseFloat(parts[2])||0);
    }
    function parseSRT(text) {
      const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = normalized.split('\n\n');
      const result = [];
      for (let block of blocks) {
        const lines = block.trim().split('\n');
        if (lines.length >= 3) {
          const timeMatch = lines[1].match(/(.*?)\s*-->\s*(.*)/);
          if (timeMatch) {
            result.push({
              id: lines[0],
              start: parseSRTTime(timeMatch[1]),
              end: parseSRTTime(timeMatch[2]),
              text: lines.slice(2).join('\n')
            });
          }
        }
      }
      return result;
    }
    function loadSRTData(rawText) {
      srtData = parseSRT(rawText);
      totalDuration = srtData.length > 0 ? srtData[srtData.length - 1].end + 1.0 : 10;
      timeSlider.max = totalDuration;
      updateSRTListUI();
      renderFrame(0);
    }
    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      srtLabel.textContent = `📄 ${file.name}`;
      const reader = new FileReader();
      reader.onload = (evt) => loadSRTData(evt.target.result);
      reader.readAsText(file);
    });
    function updateSRTListUI() {
      srtListEl.innerHTML = '';
      srtData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'srt-item';
        div.innerHTML = `<span>#${item.id} (${formatTime(item.start)})</span> <span>${item.text.replace('\n', ' / ')}</span>`;
        div.addEventListener('click', () => {
          currentTime = item.start;
          timeSlider.value = currentTime;
          renderFrame(currentTime);
        });
        srtListEl.appendChild(div);
      });
    }
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }
    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }
    function drawBackground() {
      const style = bgStyleSelect.value;
      const w = canvas.width, h = canvas.height;
      if (style === 'transparent') { ctx.clearRect(0,0,w,h); return; }
      if (style === 'black') { ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h); return; }
      if (style === 'dark-paper') { ctx.fillStyle='#16161a'; ctx.fillRect(0,0,w,h); return; }
      const grad = ctx.createRadialGradient(w/2, h/2, 100, w/2, h/2, w/1.1);
      grad.addColorStop(0, '#f9f5ec');
      grad.addColorStop(1, '#e3d9c3');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = 'rgba(80, 60, 40, 0.035)';
      for (let i = 0; i < 450; i++) {
        const x = seededRandom(i * 1.3) * w;
        const y = seededRandom(i * 2.7) * h;
        const r = seededRandom(i * 3.1) * 2.2 + 0.4;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
    }
    function analyzeCalligraphyStructure(text, seed) {
      const lines = text.split('\n').filter(l => l.trim().length > 0);
      const words = text.replace('\n', ' ').split(' ').filter(w => w.length > 0);
      let heroIndex = 0;
      let maxLen = 0;
      words.forEach((w, idx) => {
        if (w.length >= maxLen) {
          maxLen = w.length;
          heroIndex = idx;
        }
      });
      return {
        lines,
        words,
        heroWord: words[heroIndex] || words[0] || '',
        heroIndex
      };
    }
    function renderCalligraphyMasterpiece(text, cueId) {
      if (!text) return;
      const font = fontFamilySelect.value;
      const inkColor = inkColorInput.value;
      const contrastRatio = parseFloat(paramContrast.value);
      const flourishMode = paramFlourish.value;
      const staggerPx = parseFloat(paramStagger.value);
      const bleedMode = paramBleed.value;
      let mode = layoutModeSelect.value;
      let seed = cueId * 137 + text.length;
      if (mode === 'auto') {
        const modes = ['hero', 'block', 'vertical', 'diagonal'];
        mode = modes[Math.floor(seededRandom(seed++) * modes.length)];
      }
      if (bleedMode === 'heavy') ctx.filter = 'url(#ink-bleed-filter)';
      else if (bleedMode === 'normal') ctx.filter = 'blur(0.5px)';
      else ctx.filter = 'none';
      const analysis = analyzeCalligraphyStructure(text, seed);
      if (mode === 'vertical') {
        renderVerticalLayout(analysis, font, inkColor, contrastRatio, flourishMode, seed);
      } else if (mode === 'hero') {
        renderHeroAccentLayout(analysis, font, inkColor, contrastRatio, flourishMode, staggerPx, seed);
      } else if (mode === 'diagonal') {
        renderDiagonalDanceLayout(analysis, font, inkColor, contrastRatio, flourishMode, staggerPx, seed);
      } else {
        renderArtisticBlockLayout(analysis, font, inkColor, contrastRatio, flourishMode, staggerPx, seed);
      }
      ctx.filter = 'none';
    }
    function renderHeroAccentLayout(struct, font, inkColor, contrast, flourishMode, stagger, seed) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      const heroText = struct.heroWord;
      const otherWords = struct.words.filter(w => w !== heroText);
      const heroSize = Math.round(160 * contrast);
      const normalSize = Math.round(90);
      ctx.font = `700 ${heroSize}px ${font}`;
      ctx.fillStyle = inkColor;
      const heroY = centerY - (otherWords.length > 0 ? 50 : 0);
      ctx.fillText(heroText, centerX, heroY);
      if (flourishMode !== 'none' && seededRandom(seed++) > 0.3) {
        drawContextualStroke(centerX, heroY, heroSize, heroText, inkColor, seed);
      }
      if (otherWords.length > 0) {
        ctx.font = `400 ${normalSize}px ${font}`;
        ctx.globalAlpha = 0.85;
        const subText = otherWords.join(' ');
        const subY = heroY + heroSize * 0.75;
        const subX = centerX + (seededRandom(seed++) - 0.5) * stagger;
        ctx.fillText(subText, subX, subY);
      }
      ctx.restore();
    }
    function renderVerticalLayout(struct, font, inkColor, contrast, flourishMode, seed) {
      const centerX = canvas.width / 2;
      const startY = canvas.height * 0.22;
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillStyle = inkColor;
      const allChars = struct.words.join('').split('');
      const totalChars = allChars.length;
      const charGap = Math.min(140, (canvas.height * 0.6) / totalChars);
      allChars.forEach((char, idx) => {
        const isHero = (idx === 0);
        const fontPx = isHero ? Math.round(150 * contrast) : Math.round(100);
        ctx.font = `700 ${fontPx}px ${font}`;
        const curY = startY + idx * charGap;
        const curX = centerX + (seededRandom(seed++) - 0.5) * (isHero ? 20 : 50);
        const rot = (seededRandom(seed++) - 0.5) * 0.15;
        ctx.save();
        ctx.translate(curX, curY);
        ctx.rotate(rot);
        ctx.fillText(char, 0, 0);
        if (flourishMode !== 'none' && isHero && seededRandom(seed++) > 0.4) {
          ctx.beginPath();
          ctx.lineWidth = 10;
          ctx.strokeStyle = inkColor;
          ctx.lineCap = 'round';
          ctx.moveTo(0, fontPx * 0.3);
          ctx.lineTo((seededRandom(seed++) - 0.5) * 30, fontPx * 1.8);
          ctx.stroke();
        }
        ctx.restore();
      });
      ctx.restore();
    }
    function renderDiagonalDanceLayout(struct, font, inkColor, contrast, flourishMode, stagger, seed) {
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.fillStyle = inkColor;
      const lines = struct.lines;
      const baseSize = 110;
      const lineGap = baseSize * 1.4;
      const totalH = lines.length * lineGap;
      let curY = (canvas.height - totalH) / 2 + baseSize / 2;
      let startX = canvas.width * 0.28;
      lines.forEach((lineText, lIdx) => {
        const lineX = startX + lIdx * (stagger + 40);
        const lineAngle = -0.05 + (lIdx * 0.04);
        ctx.save();
        ctx.translate(lineX, curY);
        ctx.rotate(lineAngle);
        const words = lineText.split(' ');
        let cursorX = 0;
        words.forEach((w, wIdx) => {
          const isAccent = (w === struct.heroWord || wIdx === 0);
          const fontSize = isAccent ? Math.round(baseSize * contrast * 0.9) : baseSize;
          ctx.font = `700 ${fontSize}px ${font}`;
          ctx.globalAlpha = isAccent ? 1.0 : 0.8;
          ctx.fillText(w, cursorX, 0);
          const wWidth = ctx.measureText(w).width;
          if (flourishMode === 'context' && isAccent && seededRandom(seed++) > 0.6) {
            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.strokeStyle = inkColor;
            ctx.moveTo(cursorX, fontSize * 0.4);
            ctx.quadraticCurveTo(cursorX + wWidth * 0.5, fontSize * 0.6, cursorX + wWidth * 1.1, fontSize * 0.35);
            ctx.stroke();
          }
          cursorX += wWidth + 30;
        });
        ctx.restore();
        curY += lineGap;
      });
      ctx.restore();
    }
    function renderArtisticBlockLayout(struct, font, inkColor, contrast, flourishMode, stagger, seed) {
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillStyle = inkColor;
      const lines = struct.lines;
      const baseSize = 120;
      const lineGap = baseSize * 1.5;
      const startY = (canvas.height - (lines.length * lineGap)) / 2 + baseSize / 2;
      lines.forEach((lineText, lIdx) => {
        const lineY = startY + lIdx * lineGap;
        const lineStaggerX = (lIdx % 2 === 0 ? -1 : 1) * (stagger * 0.7);
        ctx.save();
        ctx.translate(canvas.width / 2 + lineStaggerX, lineY);
        const fontPx = (lIdx === 0) ? Math.round(baseSize * contrast * 0.8) : baseSize;
        ctx.font = `700 ${fontPx}px ${font}`;
        ctx.fillText(lineText, 0, 0);
        ctx.restore();
      });
      ctx.fillStyle = inkColor;
      for (let k = 0; k < 4; k++) {
        if (seededRandom(seed++) > 0.4) {
          const rx = canvas.width / 2 + (seededRandom(seed++) - 0.5) * 500;
          const ry = canvas.height / 2 + (seededRandom(seed++) - 0.5) * 300;
          ctx.beginPath(); ctx.arc(rx, ry, seededRandom(seed++) * 3 + 1, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }
    function drawContextualStroke(cx, cy, size, text, color, seed) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      const startX = cx - size * 0.6;
      const startY = cy + size * 0.45;
      const endX = cx + size * 0.8;
      const endY = cy + size * 0.35 + (seededRandom(seed++) - 0.5) * 30;
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(cx, startY + 25, endX, endY);
      ctx.stroke();
      ctx.restore();
    }
    function renderFrame(timeSec) {
      drawBackground();
      const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
      if (activeSubtitle) {
        renderCalligraphyMasterpiece(activeSubtitle.text, parseInt(activeSubtitle.id) || 1);
      }
      timeDisplay.textContent = `${formatTime(timeSec)} / ${formatTime(totalDuration)}`;
    }
    function animate(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      currentTime += delta;
      if (currentTime > totalDuration) { currentTime = totalDuration; pause(); }
      timeSlider.value = currentTime;
      renderFrame(currentTime);
      if (isPlaying) animationFrameId = requestAnimationFrame(animate);
    }
    function play() {
      if (isPlaying) return;
      isPlaying = true;
      btnPlay.textContent = '⏸ 일시정지';
      lastTimestamp = 0;
      animationFrameId = requestAnimationFrame(animate);
    }
    function pause() {
      isPlaying = false;
      btnPlay.textContent = '▶ 재생';
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }
    btnPlay.addEventListener('click', () => isPlaying ? pause() : play());
    timeSlider.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      renderFrame(currentTime);
    });
    btnExport.addEventListener('click', async () => {
      if (srtData.length === 0) { alert('SRT 자막 파일이 로드되지 않았습니다.'); return; }
      pause();
      progressModal.style.display = 'flex';
      const fps = 30;
      const totalFrames = Math.ceil(totalDuration * fps);
      const width = canvas.width, height = canvas.height;
      try {
        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width, height },
          fastStart: 'in-memory'
        });
        const videoEncoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: (e) => console.error(e)
        });
        videoEncoder.configure({
          codec: 'avc1.42E01E',
          width, height,
          bitrate: 6_500_000,
          framerate: fps
        });
        for (let i = 0; i < totalFrames; i++) {
          const frameTime = i / fps;
          renderFrame(frameTime);
          const videoFrame = new VideoFrame(canvas, { timestamp: Math.round(frameTime * 1e6) });
          videoEncoder.encode(videoFrame, { keyFrame: i % (fps * 2) === 0 });
          videoFrame.close();
          const pct = Math.round(((i + 1) / totalFrames) * 100);
          progressFill.style.width = `${pct}%`;
          progressPercent.textContent = `${pct}%`;
          progressText.textContent = `MP4 프레임 인코딩 중 (${i + 1} / ${totalFrames})`;
          if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
        }
        await videoEncoder.flush();
        muxer.finalize();
        const { buffer } = muxer.target;
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `calligraphy_masterpiece_${Date.now()}.mp4`;
        a.click();
        URL.revokeObjectURL(url);
        progressText.textContent = 'MP4 비디오 다운로드 완료!';
        setTimeout(() => progressModal.style.display = 'none', 1000);
      } catch (err) {
        alert(`MP4 저장 중 오류 발생: ${err.message}`);
        progressModal.style.display = 'none';
      }
    });
    loadSRTData(demoSRT);
  </script>
</body>
