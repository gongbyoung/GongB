<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRT 캘리그라피 v27.1 Hotfix</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>
:root{--bg:#0f0f12;--panel:#1a1a20;--panel2:#22222c;--border:#2a2a36;--accent:#ff6b35;--text:#f1f1f5;--muted:#8b8ba0;--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,system-ui;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{height:52px;background:#15151b;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:380px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 0;font-size:.82rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-content{flex:1;overflow-y:auto;padding:14px;display:none}
.tab-content.active{display:block}
.btn{border:none;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer;font-size:.84rem}
.btn-primary{background:linear-gradient(135deg,#ff6b35,#f72585);color:#fff}
.btn-secondary{background:#22222c;border:1px solid var(--border);color:var(--text)}
.btn-file{display:flex;justify-content:center;gap:6px;padding:11px;border:1.5px dashed #3a3a4a;border-radius:10px;background:#17171e;cursor:pointer;font-size:.84rem}
input[type=file]{display:none}
input[type=range],select,textarea{width:100%;background:#15151c;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.84rem}
textarea{min-height:80px}
.label{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;margin:8px 0 4px}
.srt-list{max-height:220px;overflow-y:auto;background:#13131a;border:1px solid var(--border);border-radius:8px}
.srt-item{padding:7px 10px;border-bottom:1px solid #1f1f2a;font-size:.78rem;cursor:pointer;display:flex;gap:6px}
.srt-item.active{background:rgba(255,107,53,.15);border-left:3px solid var(--accent)}
.preview{flex:1;display:flex;flex-direction:column;background:#08080a;align-items:center;justify-content:center;padding:16px;gap:12px;position:relative}
.canvas-wrap{box-shadow:0 18px 50px rgba(0,0,0,.8);border-radius:12px;overflow:hidden;background:#fff}
canvas{display:block;max-width:min(86vw,960px);max-height:62vh}
.player{width:100%;max-width:960px;background:#1a1a20;border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.log{position:absolute;right:10px;top:10px;width:300px;max-height:40vh;background:rgba(20,20,28,.93);border:1px solid var(--border);border-radius:10px;padding:8px 10px;overflow-y:auto;z-index:5}
.log h3{font-size:.78rem;color:var(--accent);margin-bottom:6px}
.log-entry{font-size:.71rem;color:var(--muted);padding:3px 0;border-bottom:1px dashed #2a2a3a;word-break:break-all}
</style>
</head>
<body>
<header><h1 style="font-size:1rem">🖌 v27.1 Hotfix - 폴백 렌더러 추가</h1><span id="font-status" style="font-size:.78rem;color:#8b8ba0">로딩 중</span></header>
<div class="main">
<div class="sidebar">
<div class="tabs"><button class="tab active" data-tab="a">소스</button><button class="tab" data-tab="b">세션</button><button class="tab" data-tab="c">스타일/출력</button></div>
<div class="tab-content active" id="tab-a">
<label class="btn-file" for="ttf">📁 내 TTF 불러오기</label><input type="file" id="ttf" accept=".ttf,.otf">
<div id="font-detail" style="font-size:.72rem;color:#8b8ba0;margin:6px 0">기본 폰트 대기</div>
<label class="btn-file" for="srt">📁 SRT 불러오기</label><input type="file" id="srt" accept=".srt,.txt">
<textarea id="srt-ta" placeholder="SRT 붙여넣기"></textarea>
<div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-secondary" id="apply" style="flex:1">적용</button><button class="btn btn-secondary" id="sample">샘플</button></div>
<div class="label" style="margin-top:12px">흑백 마스크 <span><input type="checkbox" id="use-mask" checked> 사용</span></div>
<label class="btn-file" for="mask">🖼 마스크 업로드</label><input type="file" id="mask" accept="image/*">
<div class="label">먹 색상 <input type="color" id="ink" value="#1a1a1a" style="width:40px;height:28px"></div>
<div class="label">배경</div><select id="bg"><option value="hanji" selected>한지</option><option value="white">흰색</option><option value="black">검정</option><option value="dark">어두운 종이</option></select>
<div style="margin-top:12px" class="label">세션 목록</div><div class="srt-list" id="list"></div>
</div>
<div class="tab-content" id="tab-b">
<div id="sess-empty" style="font-size:.78rem;color:#777">자막 클릭 시 편집 가능</div>
<div id="sess-ctrl" style="display:none">
<input id="sid" readonly style="opacity:.5;margin-bottom:8px">
<div class="label">X <span id="vx">0</span></div><input type="range" id="sx" min="-600" max="600" value="0">
<div class="label">Y <span id="vy">0</span></div><input type="range" id="sy" min="-600" max="600" value="0">
<div class="label">크기 <span id="vs">1.0x</span></div><input type="range" id="ss" min="0.4" max="2.5" step="0.05" value="1">
<button class="btn btn-secondary" id="reset-sess" style="width:100%;margin-top:10px">리셋</button>
</div>
<div class="label" style="margin-top:14px">캔버스 비율</div><select id="aspect"><option value="16:9" selected>16:9 1920x1080</option><option value="9:16">9:16 1080x1920</option><option value="1:1">1:1 1080x1080</option></select>
</div>
<div class="tab-content" id="tab-c">
<div class="label">붓 스타일</div><select id="style"><option value="none" selected>기본 붓 (채우기)</option><option value="brush">붓 스트로크 (획 따라 그리기)</option><option value="soft">부드러운 먹</option></select>
<div class="label">POWER <span id="vp">1.0</span></div><input type="range" id="power" min="0.2" max="3" step="0.1" value="1">
<div class="label">줄간격 <span id="vl">1.2</span></div><input type="range" id="line" min="0.6" max="2.2" step="0.1" value="1.2">
<div class="label">디버그</div><div style="font-size:.72rem;color:#8b8ba0;line-height:1.5">• v27.1은 opentype 실패 시 자동으로 CSS 폰트(fillText)로 폴백<br>• 마스크 체크 해제하면 마스크 없이 무조건 보임<br>• 붓 스트로크 모드에서만 애니메이션, 기본 모드는 즉시 채우기</div>
</div>
</div>
<div class="preview">
<div class="log"><h3>LOG</h3><div id="logs"></div></div>
<div class="canvas-wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div class="player"><div style="display:flex;gap:8px;align-items:center"><button class="btn btn-secondary" id="play">▶ 재생</button><input type="range" id="time" min="0" max="10" value="0" step="0.01" style="flex:1"><span id="tlabel" style="font-family:monospace;font-size:.82rem;color:#ff6b35;min-width:150px;text-align:right">00:00 / 00:00</span></div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.72rem;color:#777">가이드는 편집에만 표시, 녹화시 숨김</span><div style="display:flex;gap:6px"><button class="btn btn-secondary" id="to0">⏮ 0초</button><button class="btn btn-primary" id="rec">🔴 녹화</button></div></div></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
function log(t,err){const d=document.createElement('div');d.className='log-entry';d.textContent='['+new Date().toLocaleTimeString()+'] '+t; if(err) d.style.color='#fb7185'; $('logs').prepend(d); if($('logs').children.length>60) $('logs').lastChild.remove();}
const cv=$('cv'), ctx=cv.getContext('2d');
const mcv=document.createElement('canvas'), mctx=mcv.getContext('2d');
let srt=[], dur=10, cur=0, playing=false, aid=null, last=0, isRec=false;
let font=null, fontId='default', sel=0, maskImg=null, maskUse=true;
let maskUrl=null;
let glyphCache=new Map();
const maskBoundsCache=new WeakMap();

function debounce(fn,ms){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms)}}
const rerenderDeb=debounce(()=>render(cur),50);

function parseTime(s){if(!s) return NaN; s=s.trim().replace(',','.'); const m=s.match(/(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)/); if(!m) return NaN; return (parseFloat(m[1]||0)*3600+parseFloat(m[2])*60+parseFloat(m[3]));}
function parseSRT(raw){const norm=raw.replace(/\r/g,'').trim(); if(!norm) return []; const blocks=norm.split(/\n\s*\n/); const out=[]; for(const b of blocks){const lines=b.split('\n').map(l=>l.trim()).filter(Boolean); if(lines.length<2) continue; let i=0,id=String(out.length+1); if(/^\d+$/.test(lines[0])){id=lines[0]; i=1;} const tl=lines[i]||''; const tm=tl.match(/(.+?)\s*-->\s*(.+)/); if(!tm) continue; const st=parseTime(tm[1]), en=parseTime(tm[2]); if(!isFinite(st)||!isFinite(en)||en<=st) continue; const txt=lines.slice(i+1).join('\n'); if(!txt) continue; out.push({id,start:st,end:en,text:txt,session:{x:0,y:0,scale:1}});} return out.sort((a,b)=>a.start-b.start);}

function loadSRT(raw){$('srt-ta').value=raw; const p=parseSRT(raw); if(!p.length){log('SRT 파싱 실패',true); return;} srt=p; dur=p[p.length-1].end+1; $('time').max=dur; sel=0; updateList(); loadSess(0); render(0); log('SRT '+p.length+'개 로드');}
function updateList(){const el=$('list'); el.innerHTML=''; srt.forEach((it,i)=>{const d=document.createElement('div'); d.className='srt-item'+(i===sel?' active':''); d.textContent='#'+it.id+' ('+fmt(it.start)+') '+it.text.replace(/\n/g,' / ').slice(0,30); d.onclick=()=>{sel=i; loadSess(i); updateList();}; el.appendChild(d);});}
function loadSess(i){if(!srt[i]) return; const s=srt[i].session; $('sess-empty').style.display='none'; $('sess-ctrl').style.display='block'; $('sid').value='세션 #'+srt[i].id; $('sx').value=s.x; $('sy').value=s.y; $('ss').value=s.scale; $('vx').textContent=s.x; $('vy').textContent=s.y; $('vs').textContent=s.scale.toFixed(2)+'x';}
function fmt(s){const m=Math.floor(s/60), ss=Math.floor(s%60), ms=Math.floor((s%1)*100); return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;}

$('ttf').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return; if(f.size>20*1024*1024){log('20MB 초과',true); return;}
  try{const buf=await f.arrayBuffer(); const fo=opentype.parse(buf); font=fo; fontId=f.name+'_'+Date.now(); glyphCache.clear(); $('font-detail').textContent='✅ '+f.name; $('font-status').textContent=f.name; log('커스텀 폰트: '+f.name); render(cur);}catch(err){log('폰트 파싱 실패: '+err.message,true);}
});
async function loadDefault(){try{const url='https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf'; const fo=await new Promise((res,rej)=>opentype.load(url,(e,f)=>e?rej(e):res(f))); font=fo; fontId='nanum_'+Date.now(); $('font-status').textContent='나눔붓글씨 (opentype)'; $('font-detail').textContent='✅ 기본 폰트 준비'; log('기본 폰트 로딩 성공'); render(0);}catch(err){$('font-status').textContent='기본 폰트 실패 - CSS 폴백 사용'; log('기본 폰트 opentype 실패, CSS 폴백으로 전환',true); render(0);}}
loadDefault();

$('mask').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return; if(maskUrl) URL.revokeObjectURL(maskUrl);
  const u=URL.createObjectURL(f); maskUrl=u; const img=new Image(); img.onload=()=>{URL.revokeObjectURL(u); maskUrl=null; maskImg=img; log('마스크 적용: '+f.name); render(cur);}; img.onerror=()=>log('마스크 로드 실패',true); img.src=u;
});
$('use-mask').addEventListener('change',e=>{maskUse=e.target.checked; render(cur); log('마스크 '+(maskUse?'사용':'미사용'));});

function getDefaultMask(){const w=cv.width,h=cv.height; const o=document.createElement('canvas'); o.width=w;o.height=h; const oc=o.getContext('2d'); oc.fillStyle='#fff'; oc.beginPath(); oc.moveTo(w*0.1,h*0.15); oc.lineTo(w*0.9,h*0.15); oc.lineTo(w*0.5,h*0.9); oc.closePath(); oc.fill(); return o;}
function getBounds(img){if(maskBoundsCache.has(img)) return maskBoundsCache.get(img); const w=cv.width,h=cv.height; const o=document.createElement('canvas'); o.width=w;o.height=h; const oc=o.getContext('2d'); try{oc.drawImage(img,0,0,w,h);}catch{const b={x:w*0.2,y:h*0.2,w:w*0.6,h:h*0.6}; maskBoundsCache.set(img,b); return b;} const d=oc.getImageData(0,0,w,h).data; let minX=w,minY=h,maxX=0,maxY=0,f=false; for(let y=0;y<h;y+=8){for(let x=0;x<w;x+=8){const a=d[(y*w+x)*4+3]; if(a>50){f=true; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}}} const b=f?{x:minX,y:minY,w:Math.max(100,maxX-minX),h:Math.max(100,maxY-minY)}:{x:w*0.2,y:h*0.2,w:w*0.6,h:h*0.6}; maskBoundsCache.set(img,b); return b;}

function drawBg(){
  const v=$('bg').value; const w=cv.width,h=cv.height; ctx.clearRect(0,0,w,h);
  if(v==='hanji'){const g=ctx.createRadialGradient(w/2,h/2,100,w/2,h/2,Math.max(w,h)); g.addColorStop(0,'#f8f4eb'); g.addColorStop(1,'#e3d7c3'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);}
  else if(v==='white'){ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);}
  else if(v==='black'){ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);}
  else if(v==='dark'){ctx.fillStyle='#1a1a1e'; ctx.fillRect(0,0,w,h);}
}
function layout(text,bounds,lineMul,tight,sess){
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean); const N=lines.length||1; const poss=[], sizes=[]; const scale=sess.scale||1, ox=sess.x||0, oy=sess.y||0; const cx=bounds.x+bounds.w/2, cy=bounds.y+bounds.h/2;
  lines.forEach((lt,li)=>{
    const t=N===1?0.5:(li+0.5)/N; const baseY=bounds.y+bounds.h*(N===1?0.5:(0.18+0.64*t));
    const sy2=cy+(baseY-cy)*scale+oy;
    let baseSize=(bounds.w/Math.max(1,lt.length*0.95))*scale; baseSize=Math.min(baseSize,(bounds.h*0.75)/(N*lineMul*1.1)); baseSize=Math.max(28,baseSize);
    const charSp=baseSize*tight*0.9; const totalW=(lt.length-1)*charSp; const baseX=bounds.x+bounds.w/2-totalW/2; const sx2=cx+(baseX-cx)*scale+ox;
    Array.from(lt).forEach((ch,ci)=>{ poss.push({x:sx2+ci*charSp*scale,y:sy2,ch}); sizes.push(baseSize); });
  });
  return {poss,sizes};
}

function getGlyph(ch,sz){
  const key=fontId+'|'+ch.codePointAt(0)+'|'+sz.toFixed(1);
  if(glyphCache.has(key)) return glyphCache.get(key);
  if(!font){ const d={isBlank:true,reason:'no-font'}; glyphCache.set(key,d); return d; }
  try{
    const path=font.getPath(ch,0,0,sz);
    if(!path.commands||path.commands.length===0){ const d={isBlank:true,reason:'empty-path'}; glyphCache.set(key,d); return d;}
    const bbox=path.getBoundingBox(); const svgD=path.commands.map(c=>{switch(c.type){case'M':return `M ${c.x} ${c.y}`;case'L':return `L ${c.x} ${c.y}`;case'C':return `C ${c.x1} ${c.y1} ${c.x2} ${c.y2} ${c.x} ${c.y}`;case'Q':return `Q ${c.x1} ${c.y1} ${c.x} ${c.y}`;case'Z':return 'Z';default:return '';}}).join(' ');
    const d={isBlank:false,bbox,svgD,commands:path.commands}; glyphCache.set(key,d); return d;
  }catch(err){
    const d={isBlank:true,reason:err.message}; glyphCache.set(key,d); return d;
  }
}

function render(time){
  drawBg();
  const active=srt.find(it=>time>=it.start && time<=it.end);
  const bounds=(()=>{const m=maskUse?(maskImg||getDefaultMask()):{width:cv.width,height:cv.height}; const b=maskUse?getBounds(m):{x:cv.width*0.12,y:cv.height*0.12,w:cv.width*0.76,h:cv.height*0.76}; return b;})();
  if(!isRec){ ctx.save(); ctx.strokeStyle='rgba(255,107,53,.6)'; ctx.setLineDash([8,8]); ctx.lineWidth=2; const sess=active?active.session:{x:0,y:0,scale:1}; const cx=bounds.x+bounds.w/2, cy=bounds.y+bounds.h/2; const tr={x:cx+(bounds.x-cx)*sess.scale+sess.x, y:cy+(bounds.y-cy)*sess.scale+sess.y, w:bounds.w*sess.scale, h:bounds.h*sess.scale}; ctx.strokeRect(tr.x,tr.y,tr.w,tr.h); ctx.restore(); }
  if(!active) return;
  const text=active.text.trim(); if(!text) return;
  const sess=active.session||{x:0,y:0,scale:1};
  const style=$('style').value; const power=parseFloat($('power').value)||1; const lineM=parseFloat($('line').value)||1.2; const tight=0.78;
  const ink=$('ink').value;
  const {poss,sizes}=layout(text,bounds,lineM,tight,sess);
  const durAct=Math.max(0.5,active.end-active.start); const prog=Math.min(1,Math.max(0,(time-active.start)/(durAct*0.75)));

  if(style==='none' || style==='soft'){
    // 즉시 채우기 + 폴백 - 가장 안정적
    ctx.save(); ctx.fillStyle=ink;
    if(maskUse){
      mcv.width=cv.width; mcv.height=cv.height; mctx.clearRect(0,0,cv.width,cv.height); mctx.fillStyle=ink;
      let drawn=0, fallback=0;
      poss.forEach((p,i)=>{
        const sz=sizes[i]; const g=getGlyph(p.ch,sz);
        if(!g.isBlank){
          const bx=g.bbox; const offX=p.x-(bx.x1+bx.x2)/2, offY=p.y-(bx.y1+bx.y2)/2;
          mctx.save(); mctx.translate(offX,offY);
          try{ const pd=new Path2D(g.svgD); mctx.fill(pd); drawn++; }catch{ fallback++; }
          mctx.restore();
        } else { fallback++; }
      });
      if(fallback>0 && drawn===0){
        // opentype 완전 실패 -> CSS 폰트 폴백
        log('opentype 글리프 실패 '+fallback+'개, CSS 폰트 폴백 사용');
        poss.forEach((p,i)=>{ const sz=sizes[i]; mctx.font=`${sz*1.05}px 'Nanum Brush Script', sans-serif`; mctx.textAlign='center'; mctx.textBaseline='middle'; mctx.fillText(p.ch,p.x,p.y); });
      } else if(fallback>0){ log('일부 글리프 폴백: '+fallback+'개'); poss.forEach((p,i)=>{ const sz=sizes[i]; const g=getGlyph(p.ch,sz); if(g.isBlank){ mctx.font=`${sz*1.05}px 'Nanum Brush Script'`; mctx.textAlign='center'; mctx.textBaseline='middle'; mctx.fillText(p.ch,p.x,p.y);} });}
      if(maskUse){
        mctx.globalCompositeOperation='destination-in'; const mi=maskImg||getDefaultMask(); mctx.drawImage(mi,0,0,cv.width,cv.height); mctx.globalCompositeOperation='source-over';
      }
      ctx.drawImage(mcv,0,0);
    } else {
      // 마스크 없이 직접
      let fb=0; poss.forEach((p,i)=>{ const sz=sizes[i]; const g=getGlyph(p.ch,sz); if(!g.isBlank){ const bx=g.bbox; const offX=p.x-(bx.x1+bx.x2)/2, offY=p.y-(bx.y1+bx.y2)/2; ctx.save(); ctx.translate(offX,offY); try{ctx.fill(new Path2D(g.svgD));}catch{fb++;} ctx.restore(); } else fb++; });
      if(fb>0){ poss.forEach((p,i)=>{ const sz=sizes[i]; const g=getGlyph(p.ch,sz); if(g.isBlank){ ctx.font=`${sizes[i]*1.05}px 'Nanum Brush Script'`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.ch,p.x,p.y);} }); }
    }
    ctx.restore();
  } else {
    // 브러시 스트로크 모드 - 애니메이션
    mcv.width=cv.width; mcv.height=cv.height; mctx.clearRect(0,0,cv.width,cv.height); mctx.fillStyle=ink;
    const totalChars=poss.length||1; const revealCount=Math.floor(prog*totalChars+1);
    poss.forEach((p,i)=>{
      if(i>revealCount) return; const sz=sizes[i]; const g=getGlyph(p.ch,sz);
      if(!g.isBlank){
        const bx=g.bbox; const offX=p.x-(bx.x1+bx.x2)/2, offY=p.y-(bx.y1+bx.y2)/2;
        mctx.save(); mctx.translate(offX,offY);
        if(i===revealCount){ mctx.globalAlpha=0.6+Math.random()*0.4; }
        try{ mctx.fill(new Path2D(g.svgD)); }catch{}
        mctx.restore();
      } else {
        mctx.font=`${sz*1.05}px 'Nanum Brush Script'`; mctx.textAlign='center'; mctx.textBaseline='middle'; mctx.fillText(p.ch,p.x,p.y);
      }
    });
    if(maskUse){ mctx.globalCompositeOperation='destination-in'; const mi=maskImg||getDefaultMask(); mctx.drawImage(mi,0,0,cv.width,cv.height); mctx.globalCompositeOperation='source-over'; }
    ctx.drawImage(mcv,0,0);
  }
}

// player
function play(){ if(playing) return; playing=true; last=0; $('play').textContent='⏸ 일시정지'; aid=requestAnimationFrame(anim); }
function pause(){ playing=false; if(aid) cancelAnimationFrame(aid); $('play').textContent='▶ 재생'; }
function anim(t){ if(!playing) return; if(!last) last=t; const dt=(t-last)/1000; last=t; cur+=dt; if(isRec && cur>=dur){ cur=dur; stopRec(); return;} if(cur>dur){cur=dur; pause();} $('time').value=cur; $('tlabel').textContent=fmt(cur)+' / '+fmt(dur); render(cur); if(playing) aid=requestAnimationFrame(anim); }

let rec=null, chunks=[], stream=null;
function startRec(){ pause(); cur=0; isRec=true; render(0); if(!stream) stream=cv.captureStream(30); const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'; chunks=[]; rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000}); rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);}; rec.onstop=()=>{const blob=new Blob(chunks,{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='calligraphy_'+Date.now()+'.webm'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); isRec=false; $('rec').textContent='🔴 녹화'; log('녹화 저장 완료'); render(cur);}; rec.start(100); $('rec').textContent='⏹ 종료'; play(); log('녹화 시작');}
function stopRec(){ if(rec&&rec.state==='recording'){try{rec.requestData();}catch{} rec.stop();} isRec=false; pause();}

$('play').addEventListener('click',()=>playing?pause():play());
$('rec').addEventListener('click',()=>rec&&rec.state==='recording'?stopRec():startRec());
$('to0').addEventListener('click',()=>{cur=0; $('time').value=0; render(0); $('tlabel').textContent=fmt(0)+' / '+fmt(dur);});
$('time').addEventListener('input',e=>{cur=parseFloat(e.target.value)||0; render(cur); $('tlabel').textContent=fmt(cur)+' / '+fmt(dur);});
$('srt').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>loadSRT(ev.target.result); r.readAsText(f);});
$('apply').addEventListener('click',()=>loadSRT($('srt-ta').value));
$('sample').addEventListener('click',()=>loadSRT(`1\n00:00:00,000 --> 00:00:07,090\n하루도 검푸른\n\n2\n00:00:07,090 --> 00:00:12,080\n물결에 흐느적\n\n3\n00:00:12,080 --> 00:00:20,280\n잠기고 잠기고`));
['sx','sy','ss'].forEach(id=>{$(id).addEventListener('input',e=>{const v=id==='ss'?parseFloat(e.target.value):parseInt(e.target.value); if(id==='sx'){$('vx').textContent=v; srt[sel].session.x=v;} if(id==='sy'){$('vy').textContent=v; srt[sel].session.y=v;} if(id==='ss'){$('vs').textContent=v.toFixed(2)+'x'; srt[sel].session.scale=v;} rerenderDeb();});});
$('power').addEventListener('input',e=>{$('vp').textContent=e.target.value; rerenderDeb();});
$('line').addEventListener('input',e=>{$('vl').textContent=e.target.value; rerenderDeb();});
['style','ink','bg'].forEach(id=>$(id).addEventListener('change',()=>render(cur)));
$('aspect').addEventListener('change',()=>{const v=$('aspect').value; if(v==='9:16'){cv.width=1080;cv.height=1920;} else if(v==='1:1'){cv.width=1080;cv.height=1080;} else {cv.width=1920;cv.height=1080;} mcv.width=cv.width; mcv.height=cv.height; render(cur);});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active')); b.classList.add('active'); $('tab-'+b.dataset.tab).classList.add('active');}));

loadSRT(`1\n00:00:00,000 --> 00:00:07,090\n하루도 검푸른\n\n2\n00:00:07,090 --> 00:00:12,080\n물결에 흐느적\n\n3\n00:00:12,080 --> 00:00:20,280\n잠기고 잠기고`);
</script>
