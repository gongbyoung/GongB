
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슬픈 우상 - 무절단 풀 텍스트 타이포그래피 마스크</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.85);
      --border-color: #2a303f;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 17, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .main-container {
      display: flex;
      flex: 1;
      gap: 24px;
      padding: 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    /* Left Control Panel */
    .control-panel {
      width: 420px;
      flex-shrink: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }

    .control-panel::-webkit-scrollbar {
      width: 6px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="text"], textarea, select {
      width: 100%;
      background: #090a0f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent-color);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: 'Nanum Myeongjo', serif;
      line-height: 1.6;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-color);
      height: 4px;
    }

    .range-val {
      font-size: 0.8rem;
      color: var(--text-muted);
      width: 36px;
      text-align: right;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }

    /* Right Preview Area */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
      max-width: 100%;
      max-height: calc(100vh - 200px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-color);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #1e2433;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #2a3247;
    }

    @media (max-width: 1024px) {
      .main-container {
        flex-direction: column;
      }
      .control-panel {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>슬픈 우상 (Sad Idol) Typography Generator</h1>
      <div class="subtitle">Intact Non-Slicing Text Packing Generator</div>
    </div>
  </header>

  <div class="main-container">
    <!-- Left Control Panel -->
    <div class="control-panel">
      
      <!-- Section 1: 틀 글자 (마스크) 설정 -->
      <div class="section">
        <div class="section-title">1. 틀 글자 (마스크) 설정</div>
        <div class="form-row">
          <div class="form-group">
            <label for="maskText1">첫째 줄 글자</label>
            <input type="text" id="maskText1" value="슬픈">
          </div>
          <div class="form-group">
            <label for="maskText2">둘째 줄 글자</label>
            <input type="text" id="maskText2" value="우상">
          </div>
        </div>

        <div class="form-group">
          <label for="maskFont">틀 글자 폰트</label>
          <select id="maskFont">
            <option value="'Black Han Sans', sans-serif">블랙한산 (Black Han Sans - 굵고 선명함)</option>
            <option value="'Noto Sans KR', sans-serif">노토산스 (Noto Sans Black)</option>
            <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo ExtraBold)</option>
            <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang Bold)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="maskFontSize">틀 크기 (px)</label>
            <div class="range-group">
              <input type="range" id="maskFontSize" min="150" max="480" value="380">
              <span class="range-val" id="maskFontSizeVal">380</span>
            </div>
          </div>
          <div class="form-group">
            <label for="maskLineHeight">줄 간격 Offset</label>
            <div class="range-group">
              <input type="range" id="maskLineHeight" min="0.6" max="1.4" step="0.05" value="0.82">
              <span class="range-val" id="maskLineHeightVal">0.82</span>
            </div>
          </div>
        </div>

        <!-- Stroke / Border Control -->
        <div class="checkbox-group">
          <input type="checkbox" id="showStroke">
          <label for="showStroke" style="color: #fff; font-weight: 600; cursor: pointer;">테두리(윤곽선) 표시하기 (체크 해제 시 온전한 글자로만 완성)</label>
        </div>

        <div class="form-row" id="strokeControls" style="opacity: 0.5; pointer-events: none;">
          <div class="form-group">
            <label for="maskStrokeWidth">테두리 두께 (px)</label>
            <div class="range-group">
              <input type="range" id="maskStrokeWidth" min="0.5" max="10" step="0.5" value="1.5">
              <span class="range-val" id="maskStrokeWidthVal">1.5</span>
            </div>
          </div>
          <div class="form-group">
            <label for="maskStrokeColor">테두리 색상</label>
            <input type="color" id="maskStrokeColor" value="#818cf8">
          </div>
        </div>
      </div>

      <!-- Section 2: 내부 채움 글 (시) 설정 -->
      <div class="section">
        <div class="section-title">2. 내부 채울 시 내용</div>
        <div class="form-group">
          <label for="poemContent">시 구절 내용</label>
          <textarea id="poemContent">그대는 이 밤에 안식하시옵니까. 홀로 속삭이는 목소리로 그대의 안부를 여쭐지라도, 어찌 이 가벼운 입술로 다 전할 수 있으리오. 그대에게 마땅한 더 높은 언사가 어디 없으리까. 깊고 깊은 바다 속에 신비한 산호가 자라듯 그대 안에 보배로운 것들이 가득합니다. 그대의 심장, 얼마나 진기한 도가니인지요. 그리스 명장의 손으로 탄생한 걸작 비너스도 이 뜨거운 심장을 가지지 못해 미술관에서 슬픈 세월을 보내거늘, 그대는 어찌하여 이 사랑의 성전을 지니셨나이다. 간혹 세상으로 창을 열 때면, 그대의 붉은 심장은 수줍어 영영 몸 안 깊은 곳으로 숨어버리시는구려. 그대의 숨결은 얼마나 화려하고 신선하며, 숨겨진 속내는 얼마나 오묘하고 깊으신가요. 미묘한 곡선을 지닌 신비로운 두 언덕을 지나 이 아름다운 몸을 헤아리는 동안, 나는 미궁에 빠진 나그네처럼 길을 잃고 헤맵니다. 그대의 사랑과 고독과 정진으로 인하여 이 눈부신 육체를 벗어던지고 떠나실 아침이 머지않았음을 느끼며, 나는 불길한 예감에 홀로 떨고 있나이다. 그대의 눈은 속속들이 맑고 푸른 한 쌍의 호수, 밤은 그대의 호수에 깃들기 위해 찾아오는 듯합니다. 조심히, 조심히 그대의 이마를 우러르고 뺨을 지나 흑단빛 머리칼에 숨은 그대의 귀에 다다릅니다. 조개껍데기가 오롯이 먼 바다의 소리를 듣듯 그대의 귀는 항시 이 밤에도 다만 듣기 위해 열려 있기에, 이 소란한 세상 속에서 그대의 귀에 기대어 다만 죽음같이 고요한 이오니아의 바다를 바라봅니다. 하얀 나리꽃으로 마지막 장식을 하여 드리고, 나 또한 이 이오니아 바닷가를 떠나오리다.</textarea>
        </div>

        <div class="form-group">
          <label for="contentFont">내부 글자 폰트</label>
          <select id="contentFont">
            <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo - 추천)</option>
            <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang)</option>
            <option value="'Noto Sans KR', sans-serif">노토산스 (Noto Sans KR)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="contentFontSize">내부 글자 크기 (px)</label>
            <div class="range-group">
              <input type="range" id="contentFontSize" min="8" max="22" value="12">
              <span class="range-val" id="contentFontSizeVal">12</span>
            </div>
          </div>
          <div class="form-group">
            <label for="contentLineHeight">내부 줄 간격</label>
            <div class="range-group">
              <input type="range" id="contentLineHeight" min="0.9" max="2.0" step="0.05" value="1.2">
              <span class="range-val" id="contentLineHeightVal">1.2</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="contentColor">내부 글자 색상</label>
          <input type="color" id="contentColor" value="#e2e8f0">
        </div>
      </div>

      <!-- Section 3: 캔버스 배경 설정 -->
      <div class="section">
        <div class="section-title">3. 배경 및 캔버스 설정</div>
        <div class="form-row">
          <div class="form-group">
            <label for="bgColor">캔버스 배경 색상</label>
            <input type="color" id="bgColor" value="#0b0d14">
          </div>
          <div class="form-group">
            <label for="canvasSize">캔버스 해상도 (정사각형)</label>
            <select id="canvasSize">
              <option value="1080">1080 x 1080 px (고화질)</option>
              <option value="1440">1440 x 1440 px (초고화질)</option>
              <option value="800">800 x 800 px (보통)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="btn-group">
        <button class="btn btn-primary" id="downloadBtn">📸 PNG 이미지 다운로드</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 초기화</button>
      </div>

    </div>

    <!-- Right Canvas Preview -->
    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Canvas & Controls initialization
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // Offscreen Canvas for Mask Generation
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    // DOM Elements
    const maskText1Input = document.getElementById('maskText1');
    const maskText2Input = document.getElementById('maskText2');
    const maskFontSelect = document.getElementById('maskFont');
    const maskFontSizeInput = document.getElementById('maskFontSize');
    const maskFontSizeVal = document.getElementById('maskFontSizeVal');
    const maskLineHeightInput = document.getElementById('maskLineHeight');
    const maskLineHeightVal = document.getElementById('maskLineHeightVal');

    const showStrokeCheckbox = document.getElementById('showStroke');
    const strokeControls = document.getElementById('strokeControls');
    const maskStrokeWidthInput = document.getElementById('maskStrokeWidth');
    const maskStrokeWidthVal = document.getElementById('maskStrokeWidthVal');
    const maskStrokeColorInput = document.getElementById('maskStrokeColor');

    const poemContentInput = document.getElementById('poemContent');
    const contentFontSelect = document.getElementById('contentFont');
    const contentFontSizeInput = document.getElementById('contentFontSize');
    const contentFontSizeVal = document.getElementById('contentFontSizeVal');
    const contentLineHeightInput = document.getElementById('contentLineHeight');
    const contentLineHeightVal = document.getElementById('contentLineHeightVal');
    const contentColorInput = document.getElementById('contentColor');

    const bgColorInput = document.getElementById('bgColor');
    const canvasSizeSelect = document.getElementById('canvasSize');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Helper: Sync Range Values
    function bindRange(input, valSpan) {
      input.addEventListener('input', () => {
        valSpan.textContent = input.value;
        render();
      });
    }

    bindRange(maskFontSizeInput, maskFontSizeVal);
    bindRange(maskLineHeightInput, maskLineHeightVal);
    bindRange(maskStrokeWidthInput, maskStrokeWidthVal);
    bindRange(contentFontSizeInput, contentFontSizeVal);
    bindRange(contentLineHeightInput, contentLineHeightVal);

    showStrokeCheckbox.addEventListener('change', () => {
      if (showStrokeCheckbox.checked) {
        strokeControls.style.opacity = '1';
        strokeControls.style.pointerEvents = 'auto';
      } else {
        strokeControls.style.opacity = '0.5';
        strokeControls.style.pointerEvents = 'none';
      }
      render();
    });

    // Event listeners
    [maskText1Input, maskText2Input, maskFontSelect, maskStrokeColorInput, poemContentInput,
     contentFontSelect, contentColorInput, bgColorInput].forEach(el => {
      el.addEventListener('input', render);
    });

    canvasSizeSelect.addEventListener('change', () => {
      const sz = parseInt(canvasSizeSelect.value, 10);
      canvas.width = sz;
      canvas.height = sz;
      maskCanvas.width = sz;
      maskCanvas.height = sz;
      render();
    });

    // Main Render Routine with Collision-Based Intact Text Packing
    function render() {
      const W = canvas.width;
      const H = canvas.height;

      // 1. Clear & Background
      ctx.fillStyle = bgColorInput.value;
      ctx.fillRect(0, 0, W, H);

      // 2. Render Mask Shape on Offscreen Canvas
      maskCanvas.width = W;
      maskCanvas.height = H;
      maskCtx.clearRect(0, 0, W, H);

      const maskLine1 = maskText1Input.value.trim();
      const maskLine2 = maskText2Input.value.trim();
      const mFontSize = parseFloat(maskFontSizeInput.value) * (W / 1080);
      const mLineHeightOffset = parseFloat(maskLineHeightInput.value);

      maskCtx.fillStyle = '#ffffff';
      maskCtx.font = `900 ${mFontSize}px ${maskFontSelect.value}`;
      maskCtx.textAlign = 'center';
      maskCtx.textBaseline = 'middle';

      const lineGap = mFontSize * mLineHeightOffset;
      const startY = H / 2 - (lineGap / 2);

      maskCtx.fillText(maskLine1, W / 2, startY);
      maskCtx.fillText(maskLine2, W / 2, startY + lineGap);

      // Extract pixel alpha map of mask
      const maskImageData = maskCtx.getImageData(0, 0, W, H);
      const maskPixels = maskImageData.data;

      // Helper function: Check if pixel is inside the mask shape
      function isMaskPixel(px, py) {
        const x = Math.floor(px);
        const y = Math.floor(py);
        if (x < 0 || x >= W || y < 0 || y >= H) return false;
        return maskPixels[(y * W + x) * 4 + 3] > 128; // Alpha threshold
      }

      // Helper function: Check if bounding box of a word is 100% inside mask
      function canFitBox(x, y, w, h) {
        // Grid sampling inside the box (6x6 sampling points for high accuracy)
        const samples = 5;
        for (let i = 0; i <= samples; i++) {
          for (let j = 0; j <= samples; j++) {
            const sx = x + (w * i) / samples;
            const sy = y + (h * j) / samples;
            if (!isMaskPixel(sx, sy)) return false;
          }
        }
        return true;
      }

      // 3. Render Non-Slicing Words
      const cFontSize = parseFloat(contentFontSizeInput.value) * (W / 1080);
      const cLineHeight = parseFloat(contentLineHeightInput.value);
      const lineSpacing = cFontSize * cLineHeight;

      ctx.fillStyle = contentColorInput.value;
      ctx.font = `${cFontSize}px ${contentFontSelect.value}`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      // Clean up poem text into continuous word array
      let cleanPoem = poemContentInput.value.replace(/\r\n|\r|\n/g, ' ').replace(/\s+/g, ' ').trim();
      if (!cleanPoem) cleanPoem = "내용 없음";
      const words = cleanPoem.split(' ');

      const spaceWidth = ctx.measureText(' ').width;
      let wordIdx = 0;

      // Scan Y from top to bottom
      const stepX = Math.max(2, Math.floor(cFontSize * 0.2));

      for (let y = 0; y <= H - cFontSize; y += lineSpacing) {
        let x = 0;
        while (x <= W - cFontSize) {
          // Fast check: If current point isn't even in mask, skip
          if (!isMaskPixel(x, y + cFontSize * 0.5)) {
            x += stepX;
            continue;
          }

          const currentWord = words[wordIdx];
          const wordWidth = ctx.measureText(currentWord).width;

          // Check if entire word box fits without touching mask boundary
          if (canFitBox(x, y, wordWidth, cFontSize)) {
            // Render INTACT word
            ctx.fillText(currentWord, x, y);
            x += wordWidth + spaceWidth;
            wordIdx = (wordIdx + 1) % words.length; // Loop poem words
          } else {
            x += stepX; // Move forward to seek valid fitting space
          }
        }
      }

      // 4. Draw Outer Stroke (if Enabled)
      if (showStrokeCheckbox.checked) {
        const strokeW = parseFloat(maskStrokeWidthInput.value) * (W / 1080);
        if (strokeW > 0) {
          ctx.strokeStyle = maskStrokeColorInput.value;
          ctx.lineWidth = strokeW;
          ctx.font = `900 ${mFontSize}px ${maskFontSelect.value}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.strokeText(maskLine1, W / 2, startY);
          ctx.strokeText(maskLine2, W / 2, startY + lineGap);
        }
      }
    }

    // Download PNG
    downloadBtn.addEventListener('click', () => {
      const link = document.appendLink ? document.appendLink() : document.createElement('a');
      link.download = `sad_idol_intact_typography_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Reset Defaults
    resetBtn.addEventListener('click', () => {
      maskText1Input.value = '슬픈';
      maskText2Input.value = '우상';
      maskFontSizeInput.value = '380';
      maskFontSizeVal.textContent = '380';
      maskLineHeightInput.value = '0.82';
      maskLineHeightVal.textContent = '0.82';
      showStrokeCheckbox.checked = false;
      strokeControls.style.opacity = '0.5';
      strokeControls.style.pointerEvents = 'none';
      maskStrokeWidthInput.value = '1.5';
      maskStrokeWidthVal.textContent = '1.5';
      contentFontSizeInput.value = '12';
      contentFontSizeVal.textContent = '12';
      contentLineHeightInput.value = '1.2';
      contentLineHeightVal.textContent = '1.2';
      contentColorInput.value = '#e2e8f0';
      bgColorInput.value = '#0b0d14';
      render();
    });

    // Initial render once fonts load
    document.fonts.ready.then(() => {
      render();
    });
    render();
  </script>
</body>
