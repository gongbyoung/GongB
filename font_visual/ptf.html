<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슬픈 우상 - 시 타이포그래피 비디오 제너레이터</title>
  <!-- Google Fonts 사전 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.85);
      --border-color: #2a303f;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 17, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .main-container {
      display: flex;
      flex: 1;
      gap: 24px;
      padding: 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .control-panel {
      width: 440px;
      flex-shrink: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }

    .control-panel::-webkit-scrollbar {
      width: 6px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="text"], textarea, select {
      width: 100%;
      background: #090a0f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent-color);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      font-family: 'Nanum Myeongjo', serif;
      line-height: 1.6;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-color);
      height: 4px;
    }

    .range-val {
      font-size: 0.8rem;
      color: var(--text-muted);
      width: 36px;
      text-align: right;
    }

    .num-input-direct {
      width: 68px !important;
      background: #090a0f;
      color: #00ffcc !important;
      border: 1px solid var(--accent-color) !important;
      border-radius: 6px;
      padding: 3px 4px !important;
      text-align: center;
      font-weight: bold;
      font-size: 0.82rem !important;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }

    .status-badge {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #a5b4fc;
      line-height: 1.6;
    }

    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
      max-width: 100%;
      max-height: calc(100vh - 220px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-start:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    .btn-preview {
      background: #3b82f6;
      color: #fff;
    }

    .btn-preview:hover {
      background: #2563eb;
    }

    .btn-autofit {
      background: #312e81;
      color: #c7d2fe;
      border: 1px solid #4338ca;
    }

    .btn-autofit:hover {
      background: #3730a3;
      color: #fff;
    }

    .btn-secondary {
      background: #1e2433;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #2a3247;
    }

    #progressBox {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 1024px) {
      .main-container {
        flex-direction: column;
      }
      .control-panel {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>슬픈 우상 (Sad Idol) Syllable Video Generator</h1>
      <div class="subtitle">음절 단위 타이포그래피 모션 및 MP4 (H.264) 내보내기 전용 엔진</div>
    </div>
  </header>

  <div class="main-container">
    <!-- Left Control Panel -->
    <div class="control-panel">
      
      <!-- Section 1: 틀 글자 (마스크) 설정 -->
      <div class="section">
        <div class="section-title">1. 틀 글자 (마스크) 설정</div>
        <div class="form-row">
          <div class="form-group">
            <label for="maskText1">첫째 줄 글자</label>
            <input type="text" id="maskText1" value="슬픈">
          </div>
          <div class="form-group">
            <label for="maskText2">둘째 줄 글자</label>
            <input type="text" id="maskText2" value="우상">
          </div>
        </div>

        <div class="form-group">
          <label for="maskFont">틀 글자 폰트</label>
          <select id="maskFont">
            <option value="'Black Han Sans', sans-serif">블랙한산 (Black Han Sans - 굵고 선명함)</option>
            <option value="'Noto Sans KR', sans-serif">노토산스 (Noto Sans Black)</option>
            <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo ExtraBold)</option>
            <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang Bold)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="maskFontSize">틀 크기 (px)</label>
            <div class="range-group">
              <input type="range" id="maskFontSize" min="180" max="480" value="380">
              <span class="range-val" id="maskFontSizeVal">380</span>
            </div>
          </div>
          <div class="form-group">
            <label for="maskLineHeight">줄 간격 Offset</label>
            <div class="range-group">
              <input type="range" id="maskLineHeight" min="0.6" max="1.4" step="0.05" value="0.82">
              <span class="range-val" id="maskLineHeightVal">0.82</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="maskLetterSpacing">틀 자간 Offset (글자 간격)</label>
          <div class="range-group">
            <input type="range" id="maskLetterSpacing" min="0.5" max="2.0" step="0.05" value="1.0">
            <span class="range-val" id="maskLetterSpacingVal">1.0</span>
          </div>
        </div>

        <!-- Stroke Control -->
        <div class="checkbox-group">
          <input type="checkbox" id="showStroke" checked>
          <label for="showStroke" style="color: #fff; font-weight: 600; cursor: pointer;">테두리(윤곽선) 표시하기</label>
        </div>

        <div class="form-row" id="strokeControls">
          <div class="form-group">
            <label for="maskStrokeWidth">테두리 두께 (px)</label>
            <div class="range-group">
              <input type="range" id="maskStrokeWidth" min="0.5" max="10" step="0.5" value="1.5">
              <span class="range-val" id="maskStrokeWidthVal">1.5</span>
            </div>
          </div>
          <div class="form-group">
            <label for="maskStrokeColor">테두리 색상</label>
            <input type="color" id="maskStrokeColor" value="#818cf8">
          </div>
        </div>
      </div>

      <!-- Section 2: 내부 채움 글 (시) 설정 -->
      <div class="section">
        <div class="section-title">2. 순차 채울 시 내용 및 애니메이션 시간</div>
        <div class="form-group">
          <label for="poemContent">시 구절 내용</label>
          <textarea id="poemContent">그대는 이 밤에 안식하시옵니까. 홀로 속삭이는 목소리로 그대의 안부를 여쭐지라도, 어찌 이 가벼운 입술로 다 전할 수 있으리오. 그대에게 마땅한 더 높은 언사가 어디 없으리까. 깊고 깊은 바다 속에 신비한 산호가 자라듯 그대 안에 보배로운 것들이 가득합니다. 그대의 심장, 얼마나 진기한 도가니인지요. 그리스 명장의 손으로 탄생한 걸작 비너스도 이 뜨거운 심장을 가지지 못해 미술관에서 슬픈 세월을 보내거늘, 그대는 어찌하여 이 사랑의 성전을 지니셨나이다.</textarea>
        </div>

        <div class="form-group">
          <label for="contentFont">내부 글자 폰트</label>
          <select id="contentFont">
            <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo)</option>
            <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang)</option>
            <option value="'Noto Sans KR', sans-serif">노토산스 (Noto Sans KR)</option>
          </select>
        </div>

        <!-- 💡 내부 글자 크기 (소수점 입력) & 내부 자간 (Letter Spacing) 컨트롤 구역 -->
        <div class="form-row">
          <div class="form-group">
            <label for="contentFontSize">글자 크기 (px - 소수점)</label>
            <div class="range-group">
              <input type="range" id="contentFontSize" min="1" max="50" step="0.05" value="16.0">
              <input type="number" id="contentFontSizeNum" class="num-input-direct" min="1" max="50" step="0.05" value="16.0">
            </div>
          </div>
          <div class="form-group">
            <label for="contentLetterSpacing">내부 글자 자간 (px)</label>
            <div class="range-group">
              <input type="range" id="contentLetterSpacing" min="-5" max="20" step="0.1" value="0.0">
              <input type="number" id="contentLetterSpacingNum" class="num-input-direct" min="-5" max="20" step="0.1" value="0.0">
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="contentLineHeight">내부 줄 간격</label>
            <div class="range-group">
              <input type="range" id="contentLineHeight" min="0.9" max="2.0" step="0.05" value="1.15">
              <span class="range-val" id="contentLineHeightVal">1.15</span>
            </div>
          </div>
          <div class="form-group">
            <label for="animDuration">⏱️ 써지는 시간 (초)</label>
            <div class="range-group">
              <input type="range" id="animDuration" min="1" max="360" step="1" value="12">
              <span class="range-val" id="animDurationVal">12s</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="contentColor">내부 글자 색상</label>
          <input type="color" id="contentColor" value="#e2e8f0">
        </div>

        <!-- 자동 맞춤 버튼 -->
        <button class="btn btn-autofit" id="autoFitBtn" style="margin-top: 4px;">
          ✨ 시 1회 완독 글자 크기 자동 맞춤 (Auto-Fit)
        </button>

        <div class="status-badge" id="statusBadge" style="margin-top: 8px;">
          📊 <b>시 분량 정밀 분석</b><br>
          <span id="poemStatText">계산 중...</span>
        </div>
      </div>

      <!-- Section 3: 배경 및 캔버스 비율 설정 -->
      <div class="section">
        <div class="section-title">3. 배경 및 화면 비율 설정</div>
        <div class="form-row">
          <div class="form-group">
            <label for="bgColor">캔버스 배경 색상</label>
            <input type="color" id="bgColor" value="#0b0d14">
          </div>
          <div class="form-group">
            <label for="canvasRatio">화면 비율 및 해상도</label>
            <select id="canvasRatio">
              <option value="1:1">1:1 정사각형 (1080x1080)</option>
              <option value="16:9">16:9 가로 영상 (1920x1080)</option>
              <option value="9:16">9:16 세로 숏폼 (1080x1920)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="btn-group">
        <button class="btn btn-start" id="startBtn">▶️ 써지기 모션 시작 & MP4 녹화</button>
        <button class="btn btn-preview" id="previewBtn">👁️ 최종 형태 미리보기</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 설정 초기화</button>
      </div>

      <div id="progressBox">
        ⏳ MP4 녹화 진행 중... <span id="progressPercent">0%</span>
      </div>

    </div>

    <!-- Right Preview Area -->
    <div class="preview-area">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');

    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    // DOM Elements
    const maskText1Input = document.getElementById('maskText1');
    const maskText2Input = document.getElementById('maskText2');
    const maskFontSelect = document.getElementById('maskFont');
    const maskFontSizeInput = document.getElementById('maskFontSize');
    const maskFontSizeVal = document.getElementById('maskFontSizeVal');
    const maskLineHeightInput = document.getElementById('maskLineHeight');
    const maskLineHeightVal = document.getElementById('maskLineHeightVal');
    const maskLetterSpacingInput = document.getElementById('maskLetterSpacing');
    const maskLetterSpacingVal = document.getElementById('maskLetterSpacingVal');

    const showStrokeCheckbox = document.getElementById('showStroke');
    const strokeControls = document.getElementById('strokeControls');
    const maskStrokeWidthInput = document.getElementById('maskStrokeWidth');
    const maskStrokeWidthVal = document.getElementById('maskStrokeWidthVal');
    const maskStrokeColorInput = document.getElementById('maskStrokeColor');

    const poemContentInput = document.getElementById('poemContent');
    const contentFontSelect = document.getElementById('contentFont');
    const contentFontSizeInput = document.getElementById('contentFontSize');
    const contentFontSizeNum = document.getElementById('contentFontSizeNum');
    const contentLetterSpacingInput = document.getElementById('contentLetterSpacing');
    const contentLetterSpacingNum = document.getElementById('contentLetterSpacingNum');
    const contentLineHeightInput = document.getElementById('contentLineHeight');
    const contentLineHeightVal = document.getElementById('contentLineHeightVal');
    const animDurationInput = document.getElementById('animDuration');
    const animDurationVal = document.getElementById('animDurationVal');
    const contentColorInput = document.getElementById('contentColor');
    const poemStatText = document.getElementById('poemStatText');

    const bgColorInput = document.getElementById('bgColor');
    const canvasRatioSelect = document.getElementById('canvasRatio');
    
    const startBtn = document.getElementById('startBtn');
    const previewBtn = document.getElementById('previewBtn');
    const autoFitBtn = document.getElementById('autoFitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const progressBox = document.getElementById('progressBox');
    const progressPercent = document.getElementById('progressPercent');

    let isAnimationRunning = false;
    let animReqId = null;

    function bindRange(input, valSpan, unit = '') {
      input.addEventListener('input', () => {
        valSpan.textContent = input.value + unit;
        if (!isAnimationRunning) renderPreview();
      });
    }

    bindRange(maskFontSizeInput, maskFontSizeVal);
    bindRange(maskLineHeightInput, maskLineHeightVal);
    bindRange(maskLetterSpacingInput, maskLetterSpacingVal);
    bindRange(maskStrokeWidthInput, maskStrokeWidthVal);
    bindRange(contentLineHeightInput, contentLineHeightVal);
    bindRange(animDurationInput, animDurationVal, 's');

    // 💡 내부 글자 크기 소수점 동기화
    contentFontSizeInput.addEventListener('input', () => {
      contentFontSizeNum.value = parseFloat(contentFontSizeInput.value).toFixed(2);
      if (!isAnimationRunning) renderPreview();
    });

    contentFontSizeNum.addEventListener('input', () => {
      let val = parseFloat(contentFontSizeNum.value);
      if (isNaN(val)) return;
      if (val < 1) val = 1;
      if (val > 50) val = 50;
      contentFontSizeInput.value = val;
      if (!isAnimationRunning) renderPreview();
    });

    // 💡 내부 글자 자간 (Letter Spacing) 소수점 동기화
    contentLetterSpacingInput.addEventListener('input', () => {
      contentLetterSpacingNum.value = parseFloat(contentLetterSpacingInput.value).toFixed(1);
      if (!isAnimationRunning) renderPreview();
    });

    contentLetterSpacingNum.addEventListener('input', () => {
      let val = parseFloat(contentLetterSpacingNum.value);
      if (isNaN(val)) return;
      if (val < -5) val = -5;
      if (val > 20) val = 20;
      contentLetterSpacingInput.value = val;
      if (!isAnimationRunning) renderPreview();
    });

    showStrokeCheckbox.addEventListener('change', () => {
      strokeControls.style.opacity = showStrokeCheckbox.checked ? '1' : '0.5';
      strokeControls.style.pointerEvents = showStrokeCheckbox.checked ? 'auto' : 'none';
      if (!isAnimationRunning) renderPreview();
    });

    [maskText1Input, maskText2Input, maskFontSelect, maskStrokeColorInput, poemContentInput,
     contentFontSelect, contentColorInput, bgColorInput].forEach(el => {
      el.addEventListener('input', () => {
        if (!isAnimationRunning) renderPreview();
      });
    });

    canvasRatioSelect.addEventListener('change', () => {
      const ratio = canvasRatioSelect.value;
      if (ratio === '16:9') {
        canvas.width = 1920;
        canvas.height = 1080;
        canvasWrapper.style.aspectRatio = '16 / 9';
      } else if (ratio === '9:16') {
        canvas.width = 1080;
        canvas.height = 1920;
        canvasWrapper.style.aspectRatio = '9 / 16';
      } else {
        canvas.width = 1080;
        canvas.height = 1080;
        canvasWrapper.style.aspectRatio = '1 / 1';
      }
      if (!isAnimationRunning) renderPreview();
    });

    // 💡 [정밀 자간 및 소수점 배치 연산 엔진]
    function calculatePlacements() {
      const W = canvas.width;
      const H = canvas.height;

      const line1 = maskText1Input.value.trim().split('');
      const line2 = maskText2Input.value.trim().split('');
      
      const glyphs = [];
      const mFontSize = parseFloat(maskFontSizeInput.value) * (Math.min(W, H) / 1080);
      const mLineHeightOffset = parseFloat(maskLineHeightInput.value);
      const mLetterSpacing = parseFloat(maskLetterSpacingInput.value);

      const lineGap = mFontSize * mLineHeightOffset;
      const startY = H / 2 - (lineGap / 2);

      if (line1.length > 0) {
        const step1 = mFontSize * mLetterSpacing;
        const totalW1 = (line1.length - 1) * step1;
        const startX1 = W / 2 - totalW1 / 2;
        line1.forEach((ch, idx) => {
          glyphs.push({ char: ch, cx: startX1 + idx * step1, cy: startY });
        });
      }

      if (line2.length > 0) {
        const step2 = mFontSize * mLetterSpacing;
        const totalW2 = (line2.length - 1) * step2;
        const startX2 = W / 2 - totalW2 / 2;
        line2.forEach((ch, idx) => {
          glyphs.push({ char: ch, cx: startX2 + idx * step2, cy: startY + lineGap });
        });
      }

      let cleanPoem = poemContentInput.value.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!cleanPoem) cleanPoem = "내용 없음";
      const poemChars = cleanPoem.split('');

      const cFontSize = parseFloat(contentFontSizeInput.value) * (Math.min(W, H) / 1080);
      const cLetterSpacing = parseFloat(contentLetterSpacingInput.value) * (Math.min(W, H) / 1080);
      const cLineHeight = parseFloat(contentLineHeightInput.value);
      const lineSpacing = cFontSize * cLineHeight;

      ctx.font = `${cFontSize}px ${contentFontSelect.value}`;

      const placedChars = [];
      let charIdx = 0;
      let totalMaskCapacity = 0;

      glyphs.forEach((g) => {
        maskCanvas.width = W;
        maskCanvas.height = H;
        maskCtx.clearRect(0, 0, W, H);

        maskCtx.fillStyle = '#ffffff';
        maskCtx.font = `900 ${mFontSize}px ${maskFontSelect.value}`;
        maskCtx.textAlign = 'center';
        maskCtx.textBaseline = 'middle';

        maskCtx.lineWidth = Math.max(12, mFontSize * 0.1);
        maskCtx.strokeStyle = '#ffffff';
        maskCtx.strokeText(g.char, g.cx, g.cy);
        maskCtx.fillText(g.char, g.cx, g.cy);

        const imgData = maskCtx.getImageData(0, 0, W, H);
        const pixels = imgData.data;

        function isInsideGlyph(px, py) {
          const x = Math.floor(px);
          const y = Math.floor(py);
          if (x < 0 || x >= W || y < 0 || y >= H) return false;
          return pixels[(y * W + x) * 4 + 3] > 128;
        }

        function canFitBox(x, y, w, h) {
          const samples = 3;
          for (let i = 0; i <= samples; i++) {
            for (let j = 0; j <= samples; j++) {
              if (!isInsideGlyph(x + (w * i) / samples, y + (h * j) / samples)) return false;
            }
          }
          return true;
        }

        const bboxYMin = Math.max(0, Math.floor(g.cy - mFontSize * 0.65));
        const bboxYMax = Math.min(H - cFontSize, Math.floor(g.cy + mFontSize * 0.65));
        const bboxXMin = Math.max(0, Math.floor(g.cx - mFontSize * 0.65));
        const bboxXMax = Math.min(W - cFontSize, Math.floor(g.cx + mFontSize * 0.65));

        const stepX = Math.max(2, Math.floor(cFontSize * 0.2));

        for (let y = bboxYMin; y <= bboxYMax; y += lineSpacing) {
          let x = bboxXMin;
          while (x <= bboxXMax) {
            if (!isInsideGlyph(x, y + cFontSize * 0.5)) {
              x += stepX;
              continue;
            }

            const sampleChar = poemChars[totalMaskCapacity % poemChars.length];
            const charWidth = ctx.measureText(sampleChar).width;

            if (canFitBox(x, y, charWidth, cFontSize)) {
              totalMaskCapacity++;
              if (charIdx < poemChars.length) {
                placedChars.push({ char: poemChars[charIdx], x, y });
                charIdx++;
              }
              // 💡 글자 폭 + 내부 자간(Letter Spacing) 반영
              x += charWidth + cLetterSpacing;
            } else {
              x += stepX;
            }
          }
        }
      });

      const totalPoemChars = poemChars.length;
      let statHTML = `총 시 글자 수: <b>${totalPoemChars}자</b> / 틀 총 용량: <b>${totalMaskCapacity}칸</b><br>`;

      if (totalMaskCapacity < totalPoemChars) {
        const cutCount = totalPoemChars - totalMaskCapacity;
        statHTML += `<span style="color:#ef4444; font-weight:bold;">⚠️ 틀이 좁아 시가 ${cutCount}자 잘립니다! (글자 크기를 줄이세요)</span>`;
      } else if (totalMaskCapacity === totalPoemChars) {
        statHTML += `<span style="color:#10b981; font-weight:bold;">🎉 PERFECT! 시 1회 전체가 틀에 100% 빈틈없이 딱 맞아떨어집니다!</span>`;
      } else {
        const emptySpace = totalMaskCapacity - totalPoemChars;
        statHTML += `<span style="color:#f59e0b;">ℹ️ 시 1회 전체가 다 써지고 틀에 ${emptySpace}자 분량의 빈 공간이 남습니다.</span>`;
      }
      poemStatText.innerHTML = statHTML;

      return { placedChars, mFontSize, glyphs, totalMaskCapacity, totalPoemChars };
    }

    // 💡 [초정밀 Auto-Fit 알고리즘]
    function autoFitFontSize() {
      let bestSize = parseFloat(contentFontSizeInput.value);
      let minDiff = 99999;

      for (let testSize = 2.0; testSize <= 45.0; testSize += 0.05) {
        contentFontSizeInput.value = testSize.toFixed(2);
        contentFontSizeNum.value = testSize.toFixed(2);
        
        const res = calculatePlacements();
        if (res.totalMaskCapacity >= res.totalPoemChars) {
          const diff = res.totalMaskCapacity - res.totalPoemChars;
          if (diff < minDiff) {
            minDiff = diff;
            bestSize = testSize;
          }
        }
      }

      contentFontSizeInput.value = bestSize.toFixed(2);
      contentFontSizeNum.value = bestSize.toFixed(2);
      renderPreview();
    }

    function renderPreview() {
      if (isAnimationRunning) return;
      const W = canvas.width;
      const H = canvas.height;

      ctx.fillStyle = bgColorInput.value;
      ctx.fillRect(0, 0, W, H);

      const { placedChars, mFontSize, glyphs } = calculatePlacements();

      const cFontSize = parseFloat(contentFontSizeInput.value) * (Math.min(W, H) / 1080);
      ctx.fillStyle = contentColorInput.value;
      ctx.font = `${cFontSize}px ${contentFontSelect.value}`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      placedChars.forEach(p => {
        ctx.fillText(p.char, p.x, p.y);
      });

      if (showStrokeCheckbox.checked) {
        const strokeW = parseFloat(maskStrokeWidthInput.value) * (Math.min(W, H) / 1080);
        if (strokeW > 0) {
          ctx.strokeStyle = maskStrokeColorInput.value;
          ctx.lineWidth = strokeW;
          ctx.font = `900 ${mFontSize}px ${maskFontSelect.value}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          glyphs.forEach(g => {
            ctx.strokeText(g.char, g.cx, g.cy);
          });
        }
      }
    }

    async function startAnimationAndRecord() {
      if (isAnimationRunning) return;
      isAnimationRunning = true;

      startBtn.disabled = true;
      previewBtn.disabled = true;
      autoFitBtn.disabled = true;
      progressBox.style.display = 'block';
      progressPercent.textContent = '0%';

      const W = canvas.width;
      const H = canvas.height;

      const { placedChars, mFontSize, glyphs } = calculatePlacements();
      const totalChars = placedChars.length;
      const durationSec = parseFloat(animDurationInput.value);
      const totalDurationMs = durationSec * 1000;

      const cFontSize = parseFloat(contentFontSizeInput.value) * (Math.min(W, H) / 1080);

      const stream = canvas.captureStream(30);
      let mimeType = 'video/mp4;codecs=avc1';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
          mimeType = 'video/webm;codecs=h264';
        } else {
          mimeType = 'video/webm';
        }
      }

      const recorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        link.download = `sad_idol_typography_${Date.now()}.${ext}`;
        link.href = url;
        link.click();

        isAnimationRunning = false;
        startBtn.disabled = false;
        previewBtn.disabled = false;
        autoFitBtn.disabled = false;
        progressBox.style.display = 'none';
        renderPreview();
      };

      recorder.start();
      const startTime = performance.now();

      function drawFrame(now) {
        const elapsed = now - startTime;
        let progress = elapsed / totalDurationMs;
        if (progress > 1.0) progress = 1.0;

        const currentDrawCount = Math.floor(progress * totalChars);
        const pct = Math.floor(progress * 100);
        progressPercent.textContent = `${pct}%`;

        ctx.fillStyle = bgColorInput.value;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = contentColorInput.value;
        ctx.font = `${cFontSize}px ${contentFontSelect.value}`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        for (let i = 0; i < currentDrawCount; i++) {
          const p = placedChars[i];
          ctx.fillText(p.char, p.x, p.y);
        }

        if (showStrokeCheckbox.checked) {
          const strokeW = parseFloat(maskStrokeWidthInput.value) * (Math.min(W, H) / 1080);
          if (strokeW > 0) {
            ctx.strokeStyle = maskStrokeColorInput.value;
            ctx.lineWidth = strokeW;
            ctx.font = `900 ${mFontSize}px ${maskFontSelect.value}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            glyphs.forEach(g => {
              ctx.strokeText(g.char, g.cx, g.cy);
            });
          }
        }

        if (progress < 1.0) {
          animReqId = requestAnimationFrame(drawFrame);
        } else {
          setTimeout(() => {
            recorder.stop();
          }, 1500);
        }
      }

      animReqId = requestAnimationFrame(drawFrame);
    }

    startBtn.addEventListener('click', startAnimationAndRecord);
    previewBtn.addEventListener('click', renderPreview);
    autoFitBtn.addEventListener('click', autoFitFontSize);

    resetBtn.addEventListener('click', () => {
      if (isAnimationRunning) return;
      maskText1Input.value = '슬픈';
      maskText2Input.value = '우상';
      maskFontSizeInput.value = '380';
      maskFontSizeVal.textContent = '380';
      maskLineHeightInput.value = '0.82';
      maskLineHeightVal.textContent = '0.82';
      maskLetterSpacingInput.value = '1.0';
      maskLetterSpacingVal.textContent = '1.0';
      showStrokeCheckbox.checked = true;
      strokeControls.style.opacity = '1';
      strokeControls.style.pointerEvents = 'auto';
      maskStrokeWidthInput.value = '1.5';
      maskStrokeWidthVal.textContent = '1.5';
      contentFontSizeInput.value = '16.0';
      contentFontSizeNum.value = '16.0';
      contentLetterSpacingInput.value = '0.0';
      contentLetterSpacingNum.value = '0.0';
      contentLineHeightInput.value = '1.15';
      contentLineHeightVal.textContent = '1.15';
      animDurationInput.value = '12';
      animDurationVal.textContent = '12s';
      contentColorInput.value = '#e2e8f0';
      bgColorInput.value = '#0b0d14';
      canvasRatioSelect.value = '1:1';
      canvas.width = 1080;
      canvas.height = 1080;
      canvasWrapper.style.aspectRatio = '1 / 1';
      renderPreview();
    });

    document.fonts.ready.then(() => {
      renderPreview();
    });
  </script>
</body>
