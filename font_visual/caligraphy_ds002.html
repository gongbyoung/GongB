<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT 캘리그라피 스튜디오 v3.1 (6대 결합형)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

    <style>
        :root { --bg-dark: #121214; --panel-bg: #1e1e24; --panel-border: #2d2d38; --accent-color: #ff6b35; --text-main: #f0f0f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #18181c; padding: 15px 24px; border-bottom: 1px solid var(--panel-border); }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 340px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .preview-area { flex: 1; display: flex; flex-direction: column; background: #f4ecd8; align-items: center; justify-content: center; padding: 20px; position: relative; }
        .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 80vh; cursor: grab; background: #f4ecd8; }
        canvas { display: block; max-width: 100%; max-height: 80vh; object-fit: contain; pointer-events: none; }

        .player-controls { width: 100%; max-width: 960px; margin-top: 15px; background: var(--panel-bg); padding: 14px 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--panel-border); }
        .timeline-row { display: flex; align-items: center; gap: 12px; }
        .time-display { font-family: monospace; font-size: 0.9rem; color: var(--accent-color); min-width: 120px; }
        button.btn-action { background: linear-gradient(135deg, #ff6b35, #f72585); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1.05rem; }
        button.btn-secondary { background: #2b2b38; border: 1px solid var(--panel-border); color: var(--text-main); padding: 12px 16px; border-radius: 6px; cursor: pointer; }

        .section-title { font-size: 0.9rem; font-weight: 700; color: var(--accent-color); text-transform: uppercase; margin-bottom: 6px; }
        select, input[type="range"], input[type="text"], textarea { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; margin-bottom: 4px; }
        label { font-size: 0.82rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 6px; }
        input[type="file"] { display: none; }
        .btn-file { display: block; padding: 10px; background: #2a2a36; border: 1px solid var(--panel-border); border-radius: 6px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
        .srt-list-container { max-height: 120px; overflow-y: auto; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; }
        .srt-item { padding: 6px 10px; border-bottom: 1px solid #22222a; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; }
        .srt-item.active { background: rgba(255, 107, 55, 0.2); border-left: 3px solid var(--accent-color); }

        #log-panel { position: fixed; right: 10px; top: 10px; width: 280px; max-height: 80vh; background: rgba(30, 30, 36, 0.95); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; overflow-y: auto; z-index: 999; font-size: 0.8rem; }
        #log-panel h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .log-entry { border-bottom: 1px dashed #333; padding: 5px 0; color: var(--text-muted); }
        .log-entry strong { color: #4ecdc4; }
    </style>
</head>
<body>
    <header>
        <h1>🖌️ SRT 캘리그라피 스튜디오 v3.1 (6대 결합 유형 자동 배치)</h1>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="section-title">📂 로드</div>
            <label for="ttf-input" class="btn-file">📁 TTF 폰트</label>
            <input type="file" id="ttf-input" accept=".ttf, .otf">
            <div class="font-status" id="font-status" style="font-size: 0.8rem; color: #7cd992; margin-bottom: 10px;">기본 나눔붓글씨 사용 중</div>
            
            <select id="aspect-ratio-select">
                <option value="16:9" selected>🖥️ 16:9 가로</option>
                <option value="9:16">📱 9:16 세로</option>
            </select>

            <label for="srt-input" class="btn-file">📁 SRT 파일</label>
            <input type="file" id="srt-input" accept=".srt">
            <textarea id="srt-textarea" style="height: 80px; background: #141418;"></textarea>
            <button class="btn-action" id="btn-apply-srt" style="width:100%; margin-bottom: 10px;">✏️ 자막 적용하기</button>

            <div class="section-title">🎨 물리 엔진 설정</div>
            <label>붓털 개수 <span id="val-bristles">18</span></label>
            <input type="range" id="bristle-count" min="5" max="40" step="1" value="18">
            
            <label>기본 붓 굵기 <span id="val-radius">16</span></label>
            <input type="range" id="base-radius" min="5" max="35" step="1" value="16">

            <label>전체 기울기 <span id="val-shear">0.0</span></label>
            <input type="range" id="global-shear" min="-0.5" max="0.5" step="0.01" value="0.0">
            
            <div class="section-title">🔠 초성 수동 조정 (그리드 위 추가 이동)</div>
            <input type="range" id="cho-x" min="-100" max="100" step="1" value="0" placeholder="X">
            <input type="range" id="cho-y" min="-100" max="100" step="1" value="0" placeholder="Y">
            
            <div class="section-title">🟩 중성 수동 조정 (그리드 위 추가 이동)</div>
            <input type="range" id="jung-x" min="-100" max="100" step="1" value="0" placeholder="X">
            <input type="range" id="jung-y" min="-100" max="100" step="1" value="0" placeholder="Y">

            <div class="section-title">🟦 종성 수동 조정 (그리드 위 추가 이동)</div>
            <input type="range" id="jong-x" min="-100" max="100" step="1" value="0" placeholder="X">
            <input type="range" id="jong-y" min="-100" max="100" step="1" value="0" placeholder="Y">
            
            <label for="mask-file-input" class="btn-file" style="margin-top:10px;">🖼️ 마스크 (선택)</label>
            <input type="file" id="mask-file-input" accept="image/*">
            
            <div class="section-title" style="margin-top:15px;">📜 세션 목록</div>
            <div class="srt-list-container" id="srt-list"></div>
        </div>

        <div class="preview-area">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
            </div>
            <div class="player-controls">
                <div class="timeline-row">
                    <button class="btn-secondary" id="btn-play">▶ 재생</button>
                    <input type="range" id="time-slider" min="0" max="100" value="0" step="0.01" style="flex:1;">
                    <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
                </div>
                <button class="btn-action" id="btn-export">🔴 녹화 시작 (자동 저장)</button>
            </div>
        </div>
    </div>

    <div id="log-panel">
        <h3>📊 렌더링 LOG</h3>
        <div id="log-messages"></div>
    </div>

    <script>
        const canvas = document.getElementById('calligraphy-canvas');
        const ctx = canvas.getContext('2d');
        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d');

        let srtData = [], totalDuration = 0, currentTime = 0, isPlaying = false, animationFrameId = null, lastTimestamp = 0;
        let currentFont = null;
        let hasMask = false;
        let currentMaskAlphaImage = null;

        // [핵심] 물리 엔진 설정
        let engine = {
            bristleCount: 18,
            baseRadius: 16,
            shear: 0.0
        };

        // [핵심] 수동 오프셋 (0이 기본)
        let offsets = { cho: { x: 0, y: 0 }, jung: { x: 0, y: 0 }, jong: { x: 0, y: 0 } };

        // UI 바인딩
        document.getElementById('bristle-count').addEventListener('input', (e) => { engine.bristleCount = parseInt(e.target.value); document.getElementById('val-bristles').textContent = e.target.value; renderFrame(currentTime); });
        document.getElementById('base-radius').addEventListener('input', (e) => { engine.baseRadius = parseInt(e.target.value); document.getElementById('val-radius').textContent = e.target.value; renderFrame(currentTime); });
        document.getElementById('global-shear').addEventListener('input', (e) => { engine.shear = parseFloat(e.target.value); document.getElementById('val-shear').textContent = e.target.value; renderFrame(currentTime); });

        document.getElementById('cho-x').addEventListener('input', (e) => { offsets.cho.x = parseFloat(e.target.value); renderFrame(currentTime); });
        document.getElementById('cho-y').addEventListener('input', (e) => { offsets.cho.y = parseFloat(e.target.value); renderFrame(currentTime); });
        document.getElementById('jung-x').addEventListener('input', (e) => { offsets.jung.x = parseFloat(e.target.value); renderFrame(currentTime); });
        document.getElementById('jung-y').addEventListener('input', (e) => { offsets.jung.y = parseFloat(e.target.value); renderFrame(currentTime); });
        document.getElementById('jong-x').addEventListener('input', (e) => { offsets.jong.x = parseFloat(e.target.value); renderFrame(currentTime); });
        document.getElementById('jong-y').addEventListener('input', (e) => { offsets.jong.y = parseFloat(e.target.value); renderFrame(currentTime); });

        function logMessage(msg) {
            const logDiv = document.getElementById('log-messages');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = msg;
            logDiv.prepend(div);
        }

        // [핵심 1] 6대 결합 유형 분류
        function getSyllableType(cho, jung, jong) {
            const vertical = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅣ'];
            const horizontal = ['ㅗ', 'ㅛ', 'ㅜ', 'ㅠ', 'ㅡ'];
            const compound = ['ㅘ', 'ㅙ', 'ㅚ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅢ'];

            if (vertical.includes(jung)) return jong ? 'Type4' : 'Type1'; // 좌우상-하 vs 좌우
            if (horizontal.includes(jung)) return jong ? 'Type5' : 'Type2'; // 3단 직렬 vs 상하
            if (compound.includes(jung)) return jong ? 'Type6' : 'Type3'; // 감쌈+하단 vs 감쌈
            return 'Type1'; // 예외 처리
        }

        // [핵심 2] 6가지 유형에 따른 그리드 좌표 (0.0 ~ 1.0)
        function getGridPositions(type) {
            // X 비율, Y 비율 (글자 박스 기준)
            switch(type) {
                case 'Type1': // 좌우 결합 (받침 X)
                    return { cho: { x: 0.25, y: 0.5 }, jung: { x: 0.75, y: 0.5 }, jong: null };
                case 'Type2': // 상하 결합 (받침 X)
                    return { cho: { x: 0.5, y: 0.25 }, jung: { x: 0.5, y: 0.75 }, jong: null };
                case 'Type3': // 복합 감쌈 (받침 X)
                    return { cho: { x: 0.35, y: 0.35 }, jung: { x: 0.75, y: 0.75 }, jong: null };
                case 'Type4': // 좌우상-하 (받침 O)
                    return { cho: { x: 0.25, y: 0.25 }, jung: { x: 0.75, y: 0.25 }, jong: { x: 0.5, y: 0.75 } };
                case 'Type5': // 3단 직렬 (받침 O)
                    return { cho: { x: 0.5, y: 0.16 }, jung: { x: 0.5, y: 0.5 }, jong: { x: 0.5, y: 0.84 } };
                case 'Type6': // 복합 감쌈-하단 (받침 O)
                    return { cho: { x: 0.35, y: 0.25 }, jung: { x: 0.75, y: 0.65 }, jong: { x: 0.5, y: 0.9 } };
                default: 
                    return { cho: { x: 0.5, y: 0.5 }, jung: { x: 0.5, y: 0.5 }, jong: null };
            }
        }

        // [핵심 3] 베지어 곡선을 위한 중간점 계산
        function getMidPoint(p1, p2) {
            return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        }

        // [핵심 4] 초기화된 붓털들
        function initBristles() {
            const bristles = [];
            for (let i = 0; i < engine.bristleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random();
                bristles.push({
                    ox: Math.cos(angle) * dist,
                    oy: Math.sin(angle) * dist,
                    alpha: 0.1 + Math.random() * 0.3
                });
            }
            return bristles;
        }

        // [핵심 5] 글자의 벡터 경로 추출
        function getPointsFromGlyph(char, size) {
            try {
                const path = currentFont.getPath(char, 0, 0, size);
                let pts = [];
                let cx = 0, cy = 0, sx = 0, sy = 0;
                const STEPS = 10;

                path.commands.forEach(c => {
                    if (c.type === 'M') { cx = c.x; cy = c.y; sx = cx; sy = cy; pts.push({x: cx, y: cy}); }
                    else if (c.type === 'L') { cx = c.x; cy = c.y; pts.push({x: cx, y: cy}); }
                    else if (c.type === 'C') {
                        for (let i = 1; i <= STEPS; i++) {
                            const t = i / STEPS, mt = 1 - t;
                            pts.push({
                                x: mt*mt*mt*cx + 3*mt*mt*t*c.x1 + 3*mt*t*t*c.x2 + t*t*t*c.x,
                                y: mt*mt*mt*cy + 3*mt*mt*t*c.y1 + 3*mt*t*t*c.y2 + t*t*t*c.y
                            });
                        }
                        cx = c.x; cy = c.y;
                    }
                    else if (c.type === 'Q') {
                        for (let i = 1; i <= STEPS; i++) {
                            const t = i / STEPS, mt = 1 - t;
                            pts.push({
                                x: mt*mt*cx + 2*mt*t*c.x1 + t*t*c.x,
                                y: mt*mt*cy + 2*mt*t*c.y1 + t*t*c.y
                            });
                        }
                        cx = c.x; cy = c.y;
                    }
                    else if (c.type === 'Z') { pts.push({x: sx, y: sy}); cx = sx; cy = sy; }
                });

                return pts;
            } catch(e) { return []; }
        }

        // [핵심 6] 물리 기반 브러시 렌더링
        function drawPhysicsStroke(targetCtx, pts, strokeSize, seed) {
            if (pts.length < 2) return;

            let pressure = 0.6;
            let lastPoint = pts[0];
            const bristles = initBristles();

            for (let i = 0; i < pts.length; i++) {
                const current = pts[i];

                if (i > 0) {
                    const dist = Math.hypot(current.x - lastPoint.x, current.y - lastPoint.y);
                    const velocity = dist / 10;
                    pressure = Math.max(0.2, Math.min(1.0, 1.2 - velocity * 0.1));
                }
                lastPoint = current;

                if (i > 1) {
                    const p0 = pts[i - 2];
                    const p1 = pts[i - 1];
                    const p2 = pts[i];

                    const mid1 = getMidPoint(p0, p1);
                    const mid2 = getMidPoint(p1, p2);
                    
                    const currentRadius = strokeSize * pressure;

                    bristles.forEach(b => {
                        const offsetX = b.ox * currentRadius;
                        const offsetY = b.oy * currentRadius;

                        targetCtx.beginPath();
                        targetCtx.strokeStyle = `rgba(30, 30, 30, ${b.alpha})`;
                        targetCtx.lineWidth = Math.max(0.8, pressure * 2.5);
                        targetCtx.lineCap = 'round';
                        targetCtx.lineJoin = 'round';

                        targetCtx.moveTo(mid1.x + offsetX, mid1.y + offsetY);
                        targetCtx.quadraticCurveTo(
                            p1.x + offsetX, p1.y + offsetY,
                            mid2.x + offsetX, mid2.y + offsetY
                        );
                        targetCtx.stroke();
                    });
                }
            }
        }

        // [핵심 7] 렌더링 메인
        function renderFrame(timeSec) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f4ecd8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!isRecording) {
                ctx.strokeStyle = 'rgba(80, 120, 80, 0.6)';
                ctx.setLineDash([8, 8]);
                ctx.strokeRect(canvas.width * 0.05, canvas.height * 0.05, canvas.width * 0.9, canvas.height * 0.9);
            }
            if (!currentFont) return;

            const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
            if (!activeSubtitle) return;
            const text = activeSubtitle.text.trim();

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.transform(1, engine.shear, 0, 1, 0, 0);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            let currentX = canvas.width * 0.1;
            const fontSize = 180;
            const lineHeight = fontSize * 1.6;
            let currentY = canvas.height / 2 - lineHeight / 2;

            // [유니코드 분해]
            const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
            const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
            const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

            for (let char of text) {
                if (char === '\n') { currentY += lineHeight; currentX = canvas.width * 0.1; continue; }
                
                let charWidth = currentFont.getAdvanceWidth(char, fontSize) + 30; 

                ctx.save();
                ctx.translate(currentX, currentY);
                ctx.scale(1, -1); // Y축 뒤집기

                // [1] 전체 글자의 BBox를 구해 그리드를 설정
                let fullBBox;
                try { fullBBox = currentFont.getPath(char, 0, 0, fontSize).getBoundingBox(); } catch(e) { fullBBox = {x1: 0, y1: -fontSize, x2: fontSize, y2: 0}; }

                // [2] 유니코드 분해
                const code = char.charCodeAt(0);
                let parts = { cho: null, jung: null, jong: null };
                if (code >= 0xAC00 && code <= 0xD7A3) {
                    const L = Math.floor((code - 0xAC00) / 588);
                    const V = Math.floor((code - 0xAC00 - L * 588) / 28);
                    const T = Math.floor((code - 0xAC00 - L * 588 - V * 28));
                    parts = { cho: CHO[L], jung: JUNG[V], jong: JONG[T] };
                }

                // [3] 6대 결합 유형 판별 및 그리드 좌표 가져오기
                if (parts.cho && parts.jung) {
                    const type = getSyllableType(parts.cho, parts.jung, parts.jong);
                    const grid = getGridPositions(type);

                    const fullW = fullBBox.x2 - fullBBox.x1;
                    const fullH = fullBBox.y2 - fullBBox.y1;

                    const drawComponent = (compChar, gridPos, offset) => {
                        if (!compChar) return;
                        const pts = getPointsFromGlyph(compChar, fontSize);
                        if (pts.length === 0) return;

                        // 자모의 중심점
                        let compBBox;
                        try { compBBox = currentFont.getPath(compChar, 0, 0, fontSize).getBoundingBox(); } catch(e) { compBBox = {x1: 0, y1: -fontSize, x2: fontSize, y2: 0}; }
                        const compCX = (compBBox.x1 + compBBox.x2) / 2;
                        const compCY = (compBBox.y1 + compBBox.y2) / 2;

                        // 그리드 상의 목표 중심 좌표 (BBox 전체에서의 비율)
                        const targetX = fullBBox.x1 + (gridPos.x * fullW);
                        const targetY = fullBBox.y1 + (gridPos.y * fullH);

                        // 이동 오프셋 계산 + 사용자 수동 오프셋
                        const moveX = (targetX - compCX) + offset.x;
                        const moveY = (targetY - compCY) + offset.y;

                        ctx.save();
                        ctx.translate(moveX, moveY);
                        drawPhysicsStroke(ctx, pts, engine.baseRadius);
                        ctx.restore();
                    };

                    drawComponent(parts.cho, grid.cho, offsets.cho);
                    drawComponent(parts.jung, grid.jung, offsets.jung);
                    if (parts.jong) {
                        drawComponent(parts.jong, grid.jong, offsets.jong);
                    }

                } else {
                    // 영어, 숫자 등 자모 분해가 안 되는 글자는 전체를 그대로 그리기
                    const pts = getPointsFromGlyph(char, fontSize);
                    if (pts.length > 0) drawPhysicsStroke(ctx, pts, engine.baseRadius);
                }

                ctx.restore(); // 좌표계 복원

                currentX += charWidth;
                if (currentX > canvas.width * 0.9) { currentX = canvas.width * 0.1; currentY += lineHeight; }
            }

            ctx.restore(); // 기울기 복원

            if (isRecording && hasMask && currentMaskAlphaImage) {
                ctx.globalCompositeOperation = 'destination-in';
                ctx.drawImage(currentMaskAlphaImage, 0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        // 파싱 및 기타 기본 함수
        function parseSRT(text){ const n=text.replace(/\r/g,'\n'); const b=n.split('\n\n'); const r=[]; for(let bl of b){ const l=bl.trim().split('\n'); if(l.length>=3){ const tm=l[1].match(/(.*?)\s*-->\s*(.*)/); if(tm){ r.push({ id:l[0], start:parseTime(tm[1]), end:parseTime(tm[2]), text:l.slice(2).join('\n') }); } } } return r; }
        function parseTime(t){ if(!t) return 0; const p=t.trim().replace(',','.').split(':'); return(+p[0]||0)*3600+(+p[1]||0)*60+(+p[2]||0); }
        
        function loadSRTData(rawText){
            document.getElementById('srt-textarea').value=rawText;
            srtData = parseSRT(rawText);
            totalDuration = srtData.length>0 ? srtData[srtData.length-1].end+1.0 : 10;
            document.getElementById('time-slider').max = totalDuration;
            const el = document.getElementById('srt-list');
            el.innerHTML = '';
            srtData.forEach((i) => {
                const d = document.createElement('div');
                d.className = 'srt-item';
                d.innerHTML = `<span>#${i.id}</span> <span>${i.text.replace('\n',' ')}</span>`;
                el.appendChild(d);
            });
            logMessage("✅ 자막 적용 완료 (6대 결합 유형 배치)");
            renderFrame(0);
        }

        document.getElementById('btn-apply-srt').addEventListener('click', () => loadSRTData(document.getElementById('srt-textarea').value));

        document.getElementById('ttf-input').addEventListener('change', (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => { 
                try { currentFont = opentype.parse(evt.target.result); logMessage(`폰트: ${file.name} 적용 완료`); renderFrame(0); }
                catch(err) { logMessage("⚠️ 폰트 로드 실패"); }
            };
            reader.readAsArrayBuffer(file);
        });

        function togglePlay(){ if(isPlaying){pause();}else{play();} }
        function play(){ if(isPlaying)return; isPlaying=true; lastTimestamp=0; animationFrameId=requestAnimationFrame(animate); }
        function pause(){ isPlaying=false; if(animationFrameId)cancelAnimationFrame(animationFrameId); }
        function animate(t){ if(!isPlaying)return; if(!lastTimestamp)lastTimestamp=t; const d=(t-lastTimestamp)/1000; lastTimestamp=t; currentTime+=d; if(currentTime>totalDuration){ currentTime=totalDuration; pause(); } document.getElementById('time-slider').value=currentTime; renderFrame(currentTime); if(isPlaying)animationFrameId=requestAnimationFrame(animate); }
        document.getElementById('btn-play').addEventListener('click', togglePlay);

        let mediaRecorder=null,recordedChunks=[],stream=null, isRecording=false;
        function startRecording(){
            pause(); currentTime=0; isRecording=true; renderFrame(0); 
            if(!stream)stream=canvas.captureStream(30);
            recordedChunks=[];
            mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:8000000});
            mediaRecorder.ondataavailable=e=>{ if(e.data.size>0)recordedChunks.push(e.data); };
            mediaRecorder.onstop=()=>{
                const blob=new Blob(recordedChunks,{type:'video/webm'});
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a'); a.href=url; a.download=`calligraphy_${Date.now()}.webm`; a.click();
                URL.revokeObjectURL(url); isRecording=false; renderFrame(currentTime); logMessage("✅ 녹화 저장 완료");
            };
            mediaRecorder.start(100); play(); logMessage("🔴 녹화 시작");
        }
        document.getElementById('btn-export').addEventListener('click', startRecording);
        document.getElementById('aspect-ratio-select').addEventListener('change', () => { 
            const r = document.getElementById('aspect-ratio-select').value;
            canvas.width = r==='9:16'?1080:1920; canvas.height = r==='9:16'?1920:1080;
            maskCanvas.width = canvas.width; maskCanvas.height = canvas.height;
            renderFrame(0);
        });

        document.getElementById('mask-file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0]; if(!file) return;
            const img = new Image();
            img.onload = async () => {
                const w = canvas.width, h = canvas.height;
                const off = document.createElement('canvas'); off.width = w; off.height = h;
                const octx = off.getContext('2d'); octx.drawImage(img, 0, 0, w, h);
                const imgData = octx.getImageData(0, 0, w, h); const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const brightness = (d[i] + d[i+1] + d[i+2]) / 3; const srcAlpha = d[i+3];
                    d[i] = 255; d[i+1] = 255; d[i+2] = 255; d[i+3] = srcAlpha < 10 ? 0 : brightness;
                }
                octx.putImageData(imgData, 0, 0);
                const outImg = new Image(); outImg.onload = () => { currentMaskAlphaImage = outImg; hasMask = true; };
                outImg.src = off.toDataURL();
            };
            img.src = URL.createObjectURL(file);
        });

        (async()=>{ 
            try{ 
                const font=await new Promise((resolve,reject)=>opentype.load("https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf",(err,f)=>err?reject(err):resolve(f))); 
                currentFont=font; document.getElementById('font-status').textContent='✅ 기본 나눔붓글씨 준비 완료'; 
            }catch(e){ document.getElementById('font-status').textContent='⚠️ 기본 폰트 실패'; }
            renderFrame(0); 
        })();

        const demoSRT = `1\n00:00:00,000 --> 00:00:04,500\n황혼이 오늘도 바다가 되어\n\n2\n00:00:05,000 --> 00:00:08,500\n잠기고 잠기고\n\n3\n00:00:09,000 --> 00:00:13,000\n오늘이 가장 행복한 날`;
        loadSRTData(demoSRT);
    </script>
</body>
</html>
