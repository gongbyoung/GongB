<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>논문 기반 캘리그라피 v3.5 (중심 기준 & 강력한 변형)</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root { --bg:#0a0a12; --panel:#1e1e36; --accent:#ff6b35; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: var(--bg); color: #fff; height: 100vh; display: flex; }
  .sidebar { width: 340px; background: var(--panel); border-right: 1px solid #333; padding: 15px; overflow-y: auto; }
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  
  h3 { color: var(--accent); border-bottom: 1px solid #444; padding-bottom: 5px; margin: 20px 0 10px; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .row input[type="range"] { flex: 1; }
  .val { width: 45px; text-align: right; font-size: 12px; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-weight: bold; }
  .btn-orange { background: var(--accent); color: #fff; }
  .btn-green { background: #22c55e; color: #111; }
  .btn-gray { background: #444; color: #eee; }
  .file-label { display: block; background: #444; color: #fff; padding: 8px; text-align: center; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-size: 14px; }
  input[type="file"] { display: none; }
  textarea { width: 100%; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; margin-bottom: 5px; }
  
  .paper-area { background: #f4ecd8; border-radius: 12px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; gap: 20px; }
  .calli-char { display: inline-block; width: 400px; height: 400px; transition: transform 0.2s ease; position: relative; }
  .calli-char:hover { transform: scale(1.05) rotate(-2deg); }
  .calli-char svg { width: 100%; height: 100%; overflow: hidden; filter: url(#ink-bleed); }
  
  .char-display { font-size: 80px; background: #fff; color: #111; width: 120px; height: 120px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .nav-btns { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .nav-btns button { padding: 5px 15px; }
  
  .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
  .style-item { background: #333; border: 1px solid #555; padding: 8px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .style-item.active { background: var(--accent); border-color: #fff; font-weight: bold; }
</style>
</head>
<body>

  <!-- 강력한 변형(삐침)을 위한 필터 -->
  <svg width="0" height="0" style="position:absolute;">
    <filter id="ink-bleed">
      <feTurbulence id="noise" type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
      <feDisplacementMap id="displacement" in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="sidebar">
    <h3>1. SRT 데이터 로드</h3>
    <label class="file-label" for="srt-upload">📁 SRT 파일 열기</label>
    <input type="file" id="srt-upload" accept=".srt,.txt">
    <textarea id="srt-content" rows="4" placeholder="자막 내용을 붙여넣거나 파일을 여세요"></textarea>
    <button class="btn btn-orange" onclick="extractSRT()">🔍 고유 글자 추출</button>
    <div style="text-align:center; font-size:12px; margin-top:5px;" id="char-count">0자</div>

    <h3>2. 글자 탐색</h3>
    <div class="char-display" id="char-view">-</div>
    <div class="nav-btns">
      <button class="btn btn-gray" onclick="prev()">◀ 이전</button>
      <span id="char-idx" style="line-height:30px;">0 / 0</span>
      <button class="btn btn-gray" onclick="next()">다음 ▶</button>
    </div>

    <h3>3. 초/중/종성 변형 (중심 기준)</h3>
    <p style="font-size:11px; color:#aaa; margin-bottom:10px;">* 크기는 중심에서 바깥으로 퍼지는 정도, 거리는 추가 이동 거리, 랜덤은 흔들림입니다.</p>
    
    <strong style="color: #ff6b35;">초성</strong>
    <div class="row"><label>거리</label><input type="range" id="cho-dist" min="-100" max="100" value="0" oninput="redraw()"><span class="val" id="cho-dist-v">0</span></div>
    <div class="row"><label>크기</label><input type="range" id="cho-s" min="0.1" max="3" step="0.05" value="1.0" oninput="redraw()"><span class="val" id="cho-s-v">1.00</span></div>
    <div class="row"><label>랜덤</label><input type="range" id="cho-rand" min="0" max="100" value="0" oninput="redraw()"><span class="val" id="cho-rand-v">0</span></div>

    <strong style="color: #ff6b35;">중성</strong>
    <div class="row"><label>거리</label><input type="range" id="jung-dist" min="-100" max="100" value="0" oninput="redraw()"><span class="val" id="jung-dist-v">0</span></div>
    <div class="row"><label>크기</label><input type="range" id="jung-s" min="0.1" max="3" step="0.05" value="1.0" oninput="redraw()"><span class="val" id="jung-s-v">1.00</span></div>
    <div class="row"><label>랜덤</label><input type="range" id="jung-rand" min="0" max="100" value="0" oninput="redraw()"><span class="val" id="jung-rand-v">0</span></div>

    <strong style="color: #ff6b35;">종성</strong>
    <div class="row"><label>거리</label><input type="range" id="jong-dist" min="-100" max="100" value="0" oninput="redraw()"><span class="val" id="jong-dist-v">0</span></div>
    <div class="row"><label>크기</label><input type="range" id="jong-s" min="0.1" max="3" step="0.05" value="1.0" oninput="redraw()"><span class="val" id="jong-s-v">1.00</span></div>
    <div class="row"><label>랜덤</label><input type="range" id="jong-rand" min="0" max="100" value="0" oninput="redraw()"><span class="val" id="jong-rand-v">0</span></div>

    <h3>4. 붓터치 스타일 (강한 변형 포함)</h3>
    <div class="style-grid">
      <div class="style-item active" onclick="setStyle('none', this)">기본</div>
      <div class="style-item" onclick="setStyle('bold', this)">농묵</div>
      <div class="style-item" onclick="setStyle('soft', this)">둥근</div>
      <div class="style-item" onclick="setStyle('sharp', this)">뾰족</div>
      <div class="style-item" onclick="setStyle('dry', this)">갈필</div>
      <div class="style-item" onclick="setStyle('rough', this)">거친</div>
    </div>
    
    <div class="row"><label>번짐 강도</label><input type="range" id="brushStrength" min="0" max="25" step="0.5" value="5" oninput="updateBrush()"><span class="val" id="brushStrength-v">5</span></div>
    <div class="row"><label>획 두께</label><input type="range" id="strokeWidth" min="0" max="40" step="1" value="12" oninput="redraw()"><span class="val" id="strokeWidth-v">12</span></div>

    <h3>5. 프리셋 & 내보내기</h3>
    <button class="btn btn-gray" onclick="savePreset()">💾 프리셋 저장</button>
    <button class="btn btn-gray" onclick="loadPreset()">📂 프리셋 로드</button>
    <div style="height:5px;"></div>
    <button class="btn btn-orange" onclick="exportOne('png')">현재 글자 PNG</button>
    <button class="btn btn-green" onclick="exportAll('png')">전체 글자 ZIP (PNG)</button>
    <div id="export-status" style="text-align:center; font-size:12px; margin-top:10px; color:#aaa"></div>
  </div>

  <div class="main">
    <div class="paper-area" id="stage"></div>
    <p style="margin-top:20px; font-size:13px; color:#aaa;">* 크기와 거리는 글자의 절대적 정중앙(200, 200)을 기준으로 동작합니다.</p>
  </div>

<script>
const JAMO_DB = {
  'ㄱ': '<path d="M 20 20 L 70 20 L 70 70" />', 'ㄲ': '<path d="M 20 20 L 70 20 L 70 70 M 30 40 L 80 40 L 80 90" />',
  'ㄴ': '<path d="M 20 20 L 20 70 L 70 70" />', 'ㄷ': '<path d="M 30 20 L 70 20 L 70 70 L 30 70" />',
  'ㄸ': '<path d="M 30 20 L 70 20 L 70 70 L 30 70 M 20 40 L 80 40" />', 'ㄹ': '<path d="M 20 20 L 70 20 L 70 40 L 20 40 L 20 70 L 70 70" />',
  'ㅁ': '<path d="M 20 20 L 70 20 L 70 70 L 20 70 Z" />', 'ㅂ': '<path d="M 20 20 L 60 20 L 60 70 L 20 70 M 30 40 L 70 40 L 70 70" />',
  'ㅃ': '<path d="M 20 20 L 60 20 L 60 70 L 20 70 M 30 40 L 70 40 L 70 70 M 40 20 L 80 20 L 80 70 L 40 70" />',
  'ㅅ': '<path d="M 50 20 L 50 70 M 50 50 L 20 70 M 50 50 L 80 70" />', 'ㅆ': '<path d="M 50 20 L 50 70 M 50 50 L 20 70 M 50 50 L 80 70 M 30 20 L 30 70 M 30 50 L 10 70 M 30 50 L 50 70" />',
  'ㅇ': '<path d="M 50 30 C 50 20, 70 20, 70 30 C 70 50, 50 50, 50 30 Z M 50 60 L 70 70" />', 'ㅈ': '<path d="M 20 20 L 70 20 M 50 20 L 50 50 M 50 40 L 20 70 M 50 40 L 80 70" />',
  'ㅉ': '<path d="M 20 20 L 70 20 M 50 20 L 50 50 M 50 40 L 20 70 M 50 40 L 80 70 M 30 20 L 30 50 M 30 40 L 10 70 M 30 40 L 50 70" />',
  'ㅊ': '<path d="M 20 20 L 70 20 M 50 20 L 50 50 M 50 40 L 20 70 M 50 40 L 80 70 M 50 10 L 50 30" />', 'ㅋ': '<path d="M 20 20 L 70 20 L 70 70 M 70 40 L 40 40" />',
  'ㅌ': '<path d="M 30 20 L 70 20 L 70 70 L 30 70 M 30 40 L 70 40" />', 'ㅍ': '<path d="M 30 20 L 30 70 M 70 20 L 70 70 M 30 30 L 70 30 M 30 60 L 70 60" />',
  'ㅎ': '<path d="M 50 15 L 50 25 M 50 25 C 40 30, 40 50, 50 50 M 50 25 C 60 30, 60 50, 50 50 M 20 60 L 80 60" />',
  
  'ㅏ': '<path d="M 60 10 L 60 90 M 60 40 L 85 40" />', 'ㅐ': '<path d="M 50 10 L 50 90 M 50 40 L 75 40 M 80 10 L 80 90 M 80 40 L 95 40" />',
  'ㅑ': '<path d="M 60 10 L 60 90 M 60 20 L 85 20 M 60 50 L 85 50" />', 'ㅒ': '<path d="M 50 10 L 50 90 M 50 20 L 75 20 M 50 50 L 75 50 M 80 10 L 80 90 M 80 20 L 95 20 M 80 50 L 95 50" />',
  'ㅓ': '<path d="M 60 10 L 60 90 M 60 40 L 35 40" />', 'ㅔ': '<path d="M 50 10 L 50 90 M 50 40 L 25 40 M 80 10 L 80 90 M 80 40 L 55 40" />',
  'ㅕ': '<path d="M 60 10 L 60 90 M 60 20 L 35 20 M 60 50 L 35 50" />', 'ㅖ': '<path d="M 50 10 L 50 90 M 50 20 L 25 20 M 50 50 L 25 50 M 80 10 L 80 90 M 80 20 L 55 20 M 80 50 L 55 50" />',
  'ㅗ': '<path d="M 20 40 L 80 40 M 50 40 L 50 70" />', 'ㅘ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50" />',
  'ㅙ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50 M 80 30 L 80 80 M 80 50 L 100 50" />',
  'ㅚ': '<path d="M 50 10 L 50 90 M 50 40 L 25 40 M 10 40 L 90 40 M 70 40 L 70 80" />', 'ㅛ': '<path d="M 20 30 L 80 30 M 50 30 L 50 70 M 50 50 L 20 70 M 50 50 L 80 70" />',
  'ㅜ': '<path d="M 20 50 L 80 50 M 50 50 L 50 80" />', 'ㅝ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50 M 90 50 L 90 90" />',
  'ㅞ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50 M 80 30 L 80 80 M 80 50 L 100 50 M 100 50 L 100 90" />',
  'ㅟ': '<path d="M 50 10 L 50 90 M 50 40 L 25 40 M 10 40 L 90 40 M 70 40 L 70 80" />', 'ㅠ': '<path d="M 20 60 L 80 60 M 50 60 L 50 30 M 50 50 L 20 30 M 50 50 L 80 30" />',
  'ㅡ': '<path d="M 20 50 L 80 50" />', 'ㅢ': '<path d="M 60 10 L 60 90 M 60 40 L 35 40 M 10 50 L 80 50" />', 'ㅣ': '<path d="M 50 10 L 50 90" />',
  '': ''
};

const CHO_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function decompose(char) {
  const code = char.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return null;
  const s = code - 0xAC00;
  return { cho: CHO_LIST[Math.floor(s/(21*28))], jung: JUNG_LIST[Math.floor(s/28)%21], jong: JONG_LIST[s%28], jungIdx: Math.floor(s/28)%21, jongIdx: s%28 };
}

function getType(jungIdx, jongIdx) {
  const seRo = [0,1,2,3,4,5,6,7,20].includes(jungIdx);
  const gaRo = [8,12,13,17,18].includes(jungIdx);
  if (seRo && !jongIdx) return 1;
  if (gaRo && !jongIdx) return 2;
  if (!seRo && !gaRo && !jongIdx) return 3;
  if (seRo && jongIdx) return 4;
  if (gaRo && jongIdx) return 5;
  return 6;
}

function getBoxes(type, w, h) {
  if (type === 1) return { cho: [0, 0, w/2, h], jung: [w/2, 0, w/2, h] };
  if (type === 2) return { cho: [0, 0, w, h/2], jung: [0, h/2, w, h/2] };
  if (type === 3) return { cho: [0, 0, w/2, h/2], jung: [w/2, 0, w/2, h/2] };
  if (type === 4) return { cho: [0, 0, w/2, h/2], jung: [w/2, 0, w/2, h/2], jong: [0, h/2, w, h/2] };
  if (type === 5) return { cho: [0, 0, w, h/3], jung: [0, h/3, w, h/3], jong: [0, (h/3)*2, w, h/3] };
  return { cho: [0, 0, w/2, h/3], jung: [w/2, 0, w/2, h/3], jong: [0, h/3, w, (h/3)*2] };
}

let uniqChars = [];
let charIdx = 0;

function getOpts(part) {
  return {
    dist: parseFloat(document.getElementById(part + '-dist').value),
    scale: parseFloat(document.getElementById(part + '-s').value),
    rand: parseFloat(document.getElementById(part + '-rand').value)
  };
}

function updateBrush() {
  const v = parseFloat(document.getElementById('brushStrength').value);
  document.getElementById('brushStrength-v').innerText = v;
  document.getElementById('displacement').setAttribute('scale', v);
}

function setStyle(style, el) {
  let thick = 12, brush = 5, freq = 0.04;
  if (style === 'bold') { thick = 20; brush = 4; freq = 0.05; }
  if (style === 'soft') { thick = 24; brush = 2; freq = 0.06; }
  if (style === 'sharp') { thick = 10; brush = 12; freq = 0.09; }
  if (style === 'dry') { thick = 8; brush = 18; freq = 0.02; }
  if (style === 'rough') { thick = 16; brush = 22; freq = 0.02; }
  if (style === 'none') { thick = 12; brush = 5; freq = 0.04; }

  document.getElementById('strokeWidth').value = thick;
  document.getElementById('brushStrength').value = brush;
  // 고주파/저주파 노이즈 설정 (변형의 크기)
  document.getElementById('noise').setAttribute('baseFrequency', freq);

  document.querySelectorAll('.style-item').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  updateBrush();
  redraw();
}

function redraw() {
  if (!uniqChars.length) return;
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  
  const span = document.createElement('span');
  span.className = 'calli-char';
  
  const char = uniqChars[charIdx];
  span.dataset.char = char;
  drawCharacter(span, char);
  stage.appendChild(span);

  document.getElementById('char-view').innerText = char;
  document.getElementById('char-idx').innerText = `${charIdx + 1} / ${uniqChars.length}`;
  
  ['cho', 'jung', 'jong'].forEach(p => {
    document.getElementById(p + '-dist-v').innerText = document.getElementById(p + '-dist').value;
    document.getElementById(p + '-s-v').innerText = parseFloat(document.getElementById(p + '-s').value).toFixed(2);
    document.getElementById(p + '-rand-v').innerText = document.getElementById(p + '-rand').value;
  });
  document.getElementById('strokeWidth-v').innerText = document.getElementById('strokeWidth').value;
}

function drawCharacter(targetEl, char) {
  if (!char || char === ' ') return;
  const dec = decompose(char);
  let svgContent = '';
  
  const size = 400;
  const CHAR_CENTER_X = size / 2;
  const CHAR_CENTER_Y = size / 2;
  
  if (dec) {
    const type = getType(dec.jungIdx, dec.jongIdx);
    const layout = getBoxes(type, size, size);
    
    const baseStroke = parseFloat(document.getElementById('strokeWidth').value);
    const finalStroke = Math.max(baseStroke, 1); 
    const strokeStyle = `fill="none" stroke="#111" stroke-width="${finalStroke}" stroke-linecap="round" stroke-linejoin="round"`;

    const renderJamo = (jamo, box, part) => {
      if (!jamo || !JAMO_DB[jamo]) return '';
      let opts = getOpts(part);

      // ★ 중심 기준 로직 재정의
      const boxCX = box[0] + box[2]/2;
      const boxCY = box[1] + box[3]/2;
      
      // 중심에서 박스 중심까지의 벡터
      let dirX = boxCX - CHAR_CENTER_X;
      let dirY = boxCY - CHAR_CENTER_Y;
      let baseDist = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
      dirX /= baseDist;
      dirY /= baseDist;

      // 크기(Scale)는 중심에서의 거리를 비례적으로 늘림
      const dist = (baseDist * opts.scale) + opts.dist;
      
      // 캔버스 안에 머물도록 클램프
      const jamoW = 100 * opts.scale;
      const maxDist = (size / 2) - (jamoW / 2);
      const finalDist = Math.min(dist, maxDist);
      
      const targetX = CHAR_CENTER_X + dirX * finalDist;
      const targetY = CHAR_CENTER_Y + dirY * finalDist;

      // 랜덤값 적용 (회전 및 미세 위치 흔들림)
      const rotation = (opts.rand - 50) * 0.4;
      const jitterX = (opts.rand - 50) * 0.3;
      const jitterY = (opts.rand - 50) * 0.3;

      return `<g transform="translate(${targetX + jitterX}, ${targetY + jitterY}) rotate(${rotation}) scale(${opts.scale}) translate(-50, -50)"><g ${strokeStyle}>${JAMO_DB[jamo]}</g></g>`;
    };

    svgContent += renderJamo(dec.cho, layout.cho, 'cho');
    svgContent += renderJamo(dec.jung, layout.jung, 'jung');
    if (layout.jong) svgContent += renderJamo(dec.jong, layout.jong, 'jong');
  } else {
    svgContent = `<text x="200" y="260" font-size="200" text-anchor="middle" fill="#111">${char}</text>`;
  }

  targetEl.innerHTML = `<svg viewBox="0 0 ${size} ${size}">${svgContent}</svg>`;
}

function extractSRT() {
  const content = document.getElementById('srt-content').value;
  if (!content) return alert('SRT 내용을 입력하세요.');
  const matches = content.match(/[가-힣]/g);
  if (!matches) return alert('한글이 포함되어 있지 않습니다.');
  uniqChars = [...new Set(matches)];
  charIdx = 0;
  document.getElementById('char-count').innerText = `${uniqChars.length}자`;
  redraw();
}

function prev() { if (uniqChars.length) { charIdx = (charIdx - 1 + uniqChars.length) % uniqChars.length; redraw(); } }
function next() { if (uniqChars.length) { charIdx = (charIdx + 1) % uniqChars.length; redraw(); } }

function savePreset() {
  const state = {
    cho: getOpts('cho'), jung: getOpts('jung'), jong: getOpts('jong'),
    strokeWidth: document.getElementById('strokeWidth').value,
    brushStrength: document.getElementById('brushStrength').value
  };
  localStorage.setItem('v3_preset', JSON.stringify(state));
  alert('프리셋 저장 완료');
}

function loadPreset() {
  const saved = localStorage.getItem('v3_preset');
  if (!saved) return alert('저장된 프리셋 없음');
  const state = JSON.parse(saved);
  ['cho', 'jung', 'jong'].forEach(p => {
    document.getElementById(p + '-dist').value = state[p].dist;
    document.getElementById(p + '-s').value = state[p].scale;
    document.getElementById(p + '-rand').value = state[p].rand;
  });
  document.getElementById('strokeWidth').value = state.strokeWidth;
  document.getElementById('brushStrength').value = state.brushStrength;
  updateBrush();
  redraw();
}

function exportOne(type) {
  if (!uniqChars.length) return alert('먼저 글자를 추출하세요.');
  const el = document.querySelector('.calli-char svg');
  const xml = new XMLSerializer().serializeToString(el);
  const svgBlob = new Blob([xml], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f4ecd8';
    ctx.fillRect(0, 0, 800, 800);
    ctx.drawImage(img, 0, 0, 800, 800);
    const mime = type === 'png' ? 'image/png' : 'image/jpeg';
    canvas.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `char_${uniqChars[charIdx]}.${type}`; a.click(); }, mime, 0.95);
  };
  img.src = url;
}

async function exportAll(type) {
  if (!uniqChars.length) return alert('먼저 글자를 추출하세요.');
  const zip = new JSZip();
  const status = document.getElementById('export-status');
  status.innerText = '처리 중...';

  for (let i = 0; i < uniqChars.length; i++) {
    const span = document.createElement('span');
    drawCharacter(span, uniqChars[i]);
    const xml = new XMLSerializer().serializeToString(span.querySelector('svg'));
    const img = await new Promise((res) => {
      const img = new Image();
      img.onload = () => res(img);
      img.src = URL.createObjectURL(new Blob([xml], {type: 'image/svg+xml;charset=utf-8'}));
    });
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f4ecd8';
    ctx.fillRect(0, 0, 800, 800);
    ctx.drawImage(img, 0, 0, 800, 800);
    const blob = await new Promise(res => canvas.toBlob(res, `image/${type}`, 0.95));
    zip.file(`char_${String(i).padStart(3, '0')}.${type}`, blob);
    if (i % 10 === 0) status.innerText = `진행 중: ${i + 1} / ${uniqChars.length}`;
  }

  const zipBlob = await zip.generateAsync({type: 'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = `calligraphy_${type}_all.zip`;
  a.click();
  status.innerText = '완료!';
}

document.getElementById('srt-upload').addEventListener('change', e => {
  const f = e.target.files[0]; const r = new FileReader();
  r.onload = ev => { document.getElementById('srt-content').value = ev.target.result; extractSRT(); };
  r.readAsText(f);
});

redraw();
</script>
