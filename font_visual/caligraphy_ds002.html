<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Generator v5.0</title>
    <!-- 실제 붓글씨 폰트 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f4; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .controls-panel { width: 350px; background: white; border-right: 2px solid #ddd; padding: 20px; overflow-y: auto; }
        .version-title { font-size: 22px; font-weight: 900; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #2196F3; }
        .control-group { margin-bottom: 15px; border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fafafa; }
        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .input-row input[type="range"] { flex: 1; }
        .input-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        select, input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .main-area { flex: 1; display: flex; flex-direction: column; }
        .canvas-container { flex: 1; padding: 20px; background: white; margin: 20px; border: 2px dashed #2196F3; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; border: 1px solid rgba(33,150,243,0.3); }
        .log-panel { width: 300px; background: #1e1e1e; color: #00ff00; font-family: 'Courier New', monospace; font-size: 13px; padding: 20px; overflow-y: auto; }
        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        #popup { background: white; padding: 30px; border-radius: 15px; max-width: 500px; text-align: center; }
        #popup h1 { margin-top: 0; color: #2196F3; }
        #popup p { line-height: 1.6; font-size: 16px; text-align: left; }
        #popup button { width: auto; padding: 10px 30px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="popup">
            <h1>🎨 캘리그라피 생성기</h1>
            <h2 style="color: #555;">버전 5.0 (실제 폰트 획 렌더링)</h2>
            <hr>
            <p>
                <b>📖 사용 방법</b><br><br>
                1. 이 버전은 실제 '붓글씨' 폰트의 획을 불러와 먹물처럼 번지게 렌더링합니다.<br>
                2. 이제 '사'는 '사'답게, '랑'은 '랑'답게 제대로 출력됩니다.<br>
                3. 마우스를 움직이면 팝업이 사라집니다.
            </p>
            <button onclick="closePopup()">닫기</button>
        </div>
    </div>

    <div class="controls-panel">
        <div class="version-title">🎛️ Calligraphy v5.0</div>

        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="사랑은 아름다워" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>문장 분포 (순서 유지)</label>
            <select id="layoutSelect" onchange="generateArt()">
                <option value="flow" selected>자연스러운 흐름 (좌→우)</option>
                <option value="circle">원형 흐름</option>
                <option value="reverseTriangle">역삼각형 흐름</option>
                <option value="diamond">마름모 흐름</option>
            </select>
            <div class="input-row">
                <label>영역 크기</label>
                <input type="range" id="layoutRadiusRange" min="100" max="500" value="280" oninput="syncInput('layoutRadiusRange', 'layoutRadiusNum')">
                <input type="number" id="layoutRadiusNum" value="280" oninput="syncInput('layoutRadiusNum', 'layoutRadiusRange'); generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>붓터치 강도</label>
            <div class="input-row">
                <label>기본 획 굵기</label>
                <input type="range" id="thicknessRange" min="1" max="20" value="8" oninput="syncInput('thicknessRange', 'thicknessNum')">
                <input type="number" id="thicknessNum" value="8" oninput="syncInput('thicknessNum', 'thicknessRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>불규칙성 (기울기)</label>
                <input type="range" id="tiltRange" min="0" max="100" value="30" oninput="syncInput('tiltRange', 'tiltNum')">
                <input type="number" id="tiltNum" value="30" oninput="syncInput('tiltNum', 'tiltRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
    </div>
    <div class="log-panel" id="logPanel">
        <h3>📋 시스템 로그</h3>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');
        const overlay = document.getElementById('overlay');

        // 폰트 로드 후 렌더링
        window.onload = () => {
            if (document.fonts) {
                document.fonts.ready.then(generateArt);
            } else {
                setTimeout(generateArt, 1000);
            }
        };

        function closePopup() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
        }
        ['mousemove', 'click'].forEach(e => window.addEventListener(e, () => {
            if (overlay.style.display !== 'none') closePopup();
        }));

        function syncInput(s, t) { document.getElementById(t).value = document.getElementById(s).value; }

        function addLog(m) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`;
            logPanel.appendChild(div);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const syllable = code - 0xAC00;
                const cho = Math.floor(syllable / 588);
                const jung = Math.floor((syllable % 588) / 28);
                const jong = syllable % 28;
                return { cho, jung, jong, isHangul: true };
            }
            return { isHangul: false, char };
        }

        // 문장 분포
        function getSequentialPosition(index, total, type, cx, cy, radius, randomness) {
            let baseX, baseY;
            const angle = (index / total) * Math.PI * 2;

            if (type === 'circle') {
                baseX = cx + Math.cos(angle) * radius;
                baseY = cy + Math.sin(angle) * radius;
            } else if (type === 'reverseTriangle') {
                baseX = cx + Math.cos(angle) * radius;
                baseY = cy + Math.abs(Math.sin(angle)) * radius;
            } else if (type === 'diamond') {
                baseX = cx + Math.cos(angle) * radius * 0.8;
                baseY = cy + Math.sin(angle) * radius;
            } else {
                const step = radius * 2 / Math.max(1, total - 1);
                baseX = cx - radius + step * index;
                baseY = cy;
            }

            return {
                x: baseX + (Math.random() * 2 - 1) * randomness * 40,
                y: baseY + (Math.random() * 2 - 1) * randomness * 60
            };
        }

        // ✅ 실제 폰트의 획 경로에 붓터치를 입히는 핵심 함수
        function drawCalligraphyText(char, x, y, size, tilt, thickness) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(tilt);
            
            // 글자 크기와 폰트 설정
            ctx.font = `${size}px 'Nanum Brush Script', cursive`;

            // 1. 진한 획 (바탕)
            ctx.fillStyle = 'black';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 0, 0);

            // 2. 붓터치 (먹물 번짐 효과) - 그림자를 여러 겹 쌓아 질감 표현
            // 그림자를 옆으로 흘려서 번지듯 표현
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = thickness * 2;
            ctx.shadowOffsetX = thickness * 0.5;
            ctx.shadowOffsetY = thickness * 0.5;
            
            // 글자 다시 그려서 그림자 효과 강조
            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillText(char, 0, 0);

            // 3. 미세한 잉크 번짐 (아주 약하게)
            ctx.shadowBlur = thickness * 4;
            ctx.shadowOffsetX = thickness * 1.5;
            ctx.shadowOffsetY = thickness * 1.5;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillText(char, 0, 0);

            ctx.restore();
        }

        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0; // 초기화

            const text = document.getElementById('textInput').value;
            const layoutType = document.getElementById('layoutSelect').value;
            const thickness = parseInt(document.getElementById('thicknessNum').value);
            const randomness = parseInt(document.getElementById('tiltNum').value) / 100;
            const radius = parseInt(document.getElementById('layoutRadiusNum').value);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            const chars = text.split('');
            const total = chars.length;
            const fontSize = 140; // 글자 기본 크기

            logPanel.innerHTML = '<h3>📋 시스템 로그</h3>';
            addLog(`✅ v5.0 실제 폰트 렌더링 적용.`);

            chars.forEach((char, index) => {
                const pos = getSequentialPosition(index, total, layoutType, cx, cy, radius, randomness);
                const tilt = (Math.random() * 2 - 1) * randomness * 0.2;
                
                // 글자 고유 크기 랜덤 (역동감)
                const randomScale = 1 + (Math.random() * 2 - 1) * 0.2;
                const finalSize = fontSize * randomScale;

                if (decomposeHangul(char).isHangul) {
                    const d = decomposeHangul(char);
                    drawCalligraphyText(char, pos.x, pos.y, finalSize, tilt, thickness);
                    addLog(`- "${char}" 렌더링 완료 (크기: ${Math.round(finalSize)}px)`);
                } else {
                    // 영어나 특수문자 처리
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.font = `${finalSize}px 'Nanum Brush Script', cursive`;
                    ctx.fillStyle = 'black';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(char, 0, 0);
                    ctx.restore();
                }
            });
        }

        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            addLog("💾 이미지가 저장되었습니다.");
        }
    </script>
</body>
</html>
