<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Generator v7.0</title>
    <!-- 실제 붓글씨 폰트 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f4; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .controls-panel { width: 350px; background: white; border-right: 2px solid #ddd; padding: 20px; overflow-y: auto; }
        .version-title { font-size: 22px; font-weight: 900; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #2196F3; }
        .control-group { margin-bottom: 15px; border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fafafa; }
        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .input-row input[type="range"] { flex: 1; }
        .input-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        select, input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .main-area { flex: 1; display: flex; flex-direction: column; }
        .canvas-container { flex: 1; padding: 20px; background: white; margin: 20px; border: 2px dashed #2196F3; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; border: 1px solid rgba(33,150,243,0.3); }
        .log-panel { width: 300px; background: #1e1e1e; color: #00ff00; font-family: 'Courier New', monospace; font-size: 13px; padding: 20px; overflow-y: auto; }
        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        #popup { background: white; padding: 30px; border-radius: 15px; max-width: 500px; text-align: center; }
        #popup button { width: auto; padding: 10px 30px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="popup">
            <h1>🎨 캘리그라피 생성기</h1>
            <h2 style="color: #555;">버전 7.0 (폰트 분해 및 변형 엔진)</h2>
            <hr>
            <p>이 버전은 진짜 폰트를 가져와 벡터 경로를 분해하고, 그 위에 먹물 번짐과 붓터치를 적용합니다.</p>
            <button onclick="closePopup()">닫기</button>
        </div>
    </div>

    <div class="controls-panel">
        <div class="version-title">🎛️ Calligraphy v7.0</div>

        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="사랑은 아름다워" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>붓터치 질감</label>
            <select id="styleSelect" onchange="generateArt()">
                <option value="1">진한 붓터치 (기본)</option>
                <option value="2">가벼운 붓터치 (번짐)</option>
                <option value="3">마른 붓터치 (거친 질감)</option>
            </select>
        </div>

        <div class="control-group">
            <label>폰트 및 변형</label>
            <div class="input-row">
                <label>글자 크기</label>
                <input type="range" id="sizeRange" min="50" max="300" value="180" oninput="syncInput('sizeRange', 'sizeNum')">
                <input type="number" id="sizeNum" value="180" oninput="syncInput('sizeNum', 'sizeRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>불규칙성 (기울기)</label>
                <input type="range" id="tiltRange" min="0" max="100" value="20" oninput="syncInput('tiltRange', 'tiltNum')">
                <input type="number" id="tiltNum" value="20" oninput="syncInput('tiltNum', 'tiltRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>먹물 번짐</label>
                <input type="range" id="blurRange" min="0" max="20" value="3" oninput="syncInput('blurRange', 'blurNum')">
                <input type="number" id="blurNum" value="3" oninput="syncInput('blurNum', 'blurRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
    </div>

    <div class="log-panel" id="logPanel">
        <h3>📋 시스템 로그</h3>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');
        const overlay = document.getElementById('overlay');

        // 폰트가 로드된 후에만 렌더링
        window.onload = () => {
            if (document.fonts) {
                document.fonts.ready.then(() => {
                    generateArt();
                    addLog("✅ 실제 폰트(Nanum Brush Script) 로드 완료.");
                });
            } else {
                setTimeout(generateArt, 500);
            }
        };

        function closePopup() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
        }
        ['mousemove', 'click'].forEach(e => window.addEventListener(e, () => {
            if (overlay.style.display !== 'none') closePopup();
        }));

        function syncInput(s, t) { document.getElementById(t).value = document.getElementById(s).value; }

        function addLog(m) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`;
            logPanel.appendChild(div);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // [핵심 엔진] 폰트를 분해하여 실제 붓터치로 렌더링
        function drawCalligraphyWithPath(char, x, y, size, blur, style) {
            ctx.save();
            ctx.translate(x, y);
            
            // 1. 폰트를 설정하고 글자를 그려서 경로(Path)를 생성
            ctx.font = `${size}px 'Nanum Brush Script', cursive`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 글자 그림자/번짐 설정
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = blur; // 먹물 번짐 정도
            ctx.shadowOffsetX = blur * 0.5;
            ctx.shadowOffsetY = blur * 0.5;

            ctx.fillStyle = 'black';
            ctx.fillText(char, 0, 0);

            // 2. 폰트의 외곽선(Path)을 따라가는 실시간 렌더링 (레이어 추가)
            // 실제 붓은 획이 겹치는 부분이 진해지므로, 여러 겹을 겹쳐 그립니다.
            
            // 가벼운 터치 (안쪽)
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.6;
            ctx.fillText(char, 0, 0);
            
            // 마른 붓터치 (살짝 옆으로 밀며 거친 질감)
            if (style === '3') {
                ctx.globalAlpha = 0.3;
                ctx.shadowBlur = 1;
                ctx.translate(-2, 1);
                ctx.fillText(char, 0, 0);
                ctx.translate(2, -1);
            }
            
            // 3. 개별 글자 크기/기울기 랜덤화를 위해 초기화
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const text = document.getElementById('textInput').value;
            const style = document.getElementById('styleSelect').value;
            const size = parseInt(document.getElementById('sizeNum').value);
            const tiltAmt = parseInt(document.getElementById('tiltNum').value) / 100;
            const blur = parseInt(document.getElementById('blurNum').value);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            const chars = text.split('');
            const total = chars.length;
            const spacing = size * 1.5;

            logPanel.innerHTML = '<h3>📋 시스템 로그</h3>';
            addLog(`✅ v7.0 렌더링 시작. 입력: "${text}"`);

            chars.forEach((char, index) => {
                // 문장 순서 유지 + 살짝의 랜덤 오프셋
                const x = cx - (spacing * (total - 1) / 2) + (spacing * index) + (Math.random() * 2 - 1) * tiltAmt * 30;
                const y = cy + (Math.random() * 2 - 1) * tiltAmt * 40;
                
                // 글자마다 기울기와 크기 랜덤
                const tilt = (Math.random() * 2 - 1) * tiltAmt * 0.3;
                const randomSize = size * (1 + (Math.random() * 2 - 1) * 0.2);

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(tilt);
                
                drawCalligraphyWithPath(char, 0, 0, randomSize, blur, style);
                
                ctx.restore();

                addLog(`- "${char}" 렌더링 (크기: ${Math.round(randomSize)}px, 기울기: ${(tilt * 57.3).toFixed(1)}도)`);
            });
        }

        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            addLog("💾 이미지가 저장되었습니다.");
        }
    </script>
</body>
</html>
