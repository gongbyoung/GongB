<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>논문 기반 한글 캘리그라피 스튜디오 v3.0</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root { --bg:#0a0a12; --panel:#1e1e36; --accent:#ff6b35; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: var(--bg); color: #fff; height: 100vh; display: flex; }
  
  /* 레이아웃 */
  .sidebar { width: 340px; background: var(--panel); border-right: 1px solid #333; padding: 15px; overflow-y: auto; }
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  
  /* UI 요소 */
  h3 { color: var(--accent); border-bottom: 1px solid #444; padding-bottom: 5px; margin: 20px 0 10px; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .row input[type="range"] { flex: 1; }
  .val { width: 45px; text-align: right; font-size: 12px; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-weight: bold; }
  .btn-orange { background: var(--accent); color: #fff; }
  .btn-green { background: #22c55e; color: #111; }
  .btn-gray { background: #444; color: #eee; }
  .file-label { display: block; background: #444; color: #fff; padding: 8px; text-align: center; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-size: 14px; }
  input[type="file"] { display: none; }
  textarea { width: 100%; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; margin-bottom: 5px; }
  
  /* 캔버스 및 인터랙션 */
  .paper-area { background: #f4ecd8; border-radius: 12px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; gap: 20px; }
  .calli-char { display: inline-block; width: 200px; height: 200px; transition: transform 0.2s ease; position: relative; }
  .calli-char:hover { transform: scale(1.05) rotate(-2deg); }
  .calli-char svg { width: 100%; height: 100%; overflow: visible; filter: url(#ink-bleed); }
  .char-display { font-size: 80px; background: #fff; color: #111; width: 120px; height: 120px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  
  .nav-btns { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .nav-btns button { padding: 5px 15px; }
</style>
</head>
<body>

  <!-- 공통 수묵 효과 SVG 필터 (논문 요구사항) -->
  <svg width="0" height="0" style="position:absolute;">
    <filter id="ink-bleed">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="sidebar">
    <h3>1. SRT 데이터 로드</h3>
    <label class="file-label" for="srt-upload">📁 SRT 파일 열기</label>
    <input type="file" id="srt-upload" accept=".srt,.txt">
    <textarea id="srt-content" rows="4" placeholder="자막 내용을 붙여넣거나 파일을 여세요"></textarea>
    <button class="btn btn-orange" onclick="extractSRT()">🔍 고유 글자 추출</button>
    <div style="text-align:center; font-size:12px; margin-top:5px;" id="char-count">0자</div>

    <h3>2. 글자 탐색</h3>
    <div class="char-display" id="char-view">-</div>
    <div class="nav-btns">
      <button class="btn btn-gray" onclick="prev()">◀ 이전</button>
      <span id="char-idx" style="line-height:30px;">0 / 0</span>
      <button class="btn btn-gray" onclick="next()">다음 ▶</button>
    </div>

    <h3>3. 변형 옵션 (초/중/종)</h3>
    <strong style="color: #ff6b35;">초성</strong>
    <div class="row"><label>X</label><input type="range" id="cho-x" min="-50" max="50" value="0" oninput="redraw()"><span class="val" id="cho-x-v">0</span></div>
    <div class="row"><label>Y</label><input type="range" id="cho-y" min="-50" max="50" value="0" oninput="redraw()"><span class="val" id="cho-y-v">0</span></div>
    <div class="row"><label>크기</label><input type="range" id="cho-s" min="0.5" max="1.5" step="0.05" value="1" oninput="redraw()"><span class="val" id="cho-s-v">1.00</span></div>

    <strong style="color: #ff6b35;">중성</strong>
    <div class="row"><label>X</label><input type="range" id="jung-x" min="-50" max="50" value="0" oninput="redraw()"><span class="val" id="jung-x-v">0</span></div>
    <div class="row"><label>Y</label><input type="range" id="jung-y" min="-50" max="50" value="0" oninput="redraw()"><span class="val" id="jung-y-v">0</span></div>
    <div class="row"><label>크기</label><input type="range" id="jung-s" min="0.5" max="1.5" step="0.05" value="1" oninput="redraw()"><span class="val" id="jung-s-v">1.00</span></div>

    <strong style="color: #ff6b35;">종성</strong>
    <div class="row"><label>X</label><input type="range" id="jong-x" min="-50" max="50" value="0" oninput="redraw()"><span class="val" id="jong-x-v">0</span></div>
    <div class="row"><label>Y</label><input type="range" id="jong-y" min="-50" max="50" value="0" oninput="redraw()"><span class="val" id="jong-y-v">0</span></div>
    <div class="row"><label>크기</label><input type="range" id="jong-s" min="0.5" max="1.5" step="0.05" value="1" oninput="redraw()"><span class="val" id="jong-s-v">1.00</span></div>

    <h3>4. 프리셋 & 내보내기</h3>
    <button class="btn btn-gray" onclick="savePreset()">💾 프리셋 저장</button>
    <button class="btn btn-gray" onclick="loadPreset()">📂 프리셋 로드</button>
    <div style="height:5px;"></div>
    <button class="btn btn-orange" onclick="exportOne('png')">현재 글자 PNG</button>
    <button class="btn btn-green" onclick="exportAll('png')">전체 글자 ZIP (PNG)</button>
    <div id="export-status" style="text-align:center; font-size:12px; margin-top:10px; color:#aaa"></div>
  </div>

  <div class="main">
    <div class="paper-area" id="stage"></div>
    <p style="margin-top:20px; font-size:13px; color:#aaa;">* SVG 벡터 기반 + 수묵 필터가 적용된 글자입니다. 글자에 마우스를 올려보세요.</p>
  </div>

<script>
/* ============================================
   논문 기반 28 자소 데이터셋 (SVG Path)
   실제 붓글씨 느낌을 내기 위해 stroke를 두껍게 설정
============================================ */
const JAMO_DB = {
  // 초성
  'ㄱ': '<path d="M 20 20 L 70 20 L 70 70" />',
  'ㄲ': '<path d="M 20 20 L 70 20 L 70 70 M 30 40 L 80 40 L 80 90" />',
  'ㄴ': '<path d="M 20 20 L 20 70 L 70 70" />',
  'ㄷ': '<path d="M 30 20 L 70 20 L 70 70 L 30 70" />',
  'ㄸ': '<path d="M 30 20 L 70 20 L 70 70 L 30 70 M 20 40 L 80 40" />',
  'ㄹ': '<path d="M 20 20 L 70 20 L 70 40 L 20 40 L 20 70 L 70 70" />',
  'ㅁ': '<path d="M 20 20 L 70 20 L 70 70 L 20 70 Z" />',
  'ㅂ': '<path d="M 20 20 L 60 20 L 60 70 L 20 70 M 30 40 L 70 40 L 70 70" />',
  'ㅃ': '<path d="M 20 20 L 60 20 L 60 70 L 20 70 M 30 40 L 70 40 L 70 70 M 40 20 L 80 20 L 80 70 L 40 70" />',
  'ㅅ': '<path d="M 50 20 L 50 70 M 50 50 L 20 70 M 50 50 L 80 70" />',
  'ㅆ': '<path d="M 50 20 L 50 70 M 50 50 L 20 70 M 50 50 L 80 70 M 30 20 L 30 70 M 30 50 L 10 70 M 30 50 L 50 70" />',
  'ㅇ': '<path d="M 50 30 C 50 20, 70 20, 70 30 C 70 50, 50 50, 50 30 Z M 50 60 L 70 70" />',
  'ㅈ': '<path d="M 20 20 L 70 20 M 50 20 L 50 50 M 50 40 L 20 70 M 50 40 L 80 70" />',
  'ㅉ': '<path d="M 20 20 L 70 20 M 50 20 L 50 50 M 50 40 L 20 70 M 50 40 L 80 70 M 30 20 L 30 50 M 30 40 L 10 70 M 30 40 L 50 70" />',
  'ㅊ': '<path d="M 20 20 L 70 20 M 50 20 L 50 50 M 50 40 L 20 70 M 50 40 L 80 70 M 50 10 L 50 30" />',
  'ㅋ': '<path d="M 20 20 L 70 20 L 70 70 M 70 40 L 40 40" />',
  'ㅌ': '<path d="M 30 20 L 70 20 L 70 70 L 30 70 M 30 40 L 70 40" />',
  'ㅍ': '<path d="M 30 20 L 30 70 M 70 20 L 70 70 M 30 30 L 70 30 M 30 60 L 70 60" />',
  'ㅎ': '<path d="M 50 15 L 50 25 M 50 25 C 40 30, 40 50, 50 50 M 50 25 C 60 30, 60 50, 50 50 M 20 60 L 80 60" />',
  
  // 중성
  'ㅏ': '<path d="M 60 10 L 60 90 M 60 40 L 85 40" />',
  'ㅐ': '<path d="M 50 10 L 50 90 M 50 40 L 75 40 M 80 10 L 80 90 M 80 40 L 95 40" />',
  'ㅑ': '<path d="M 60 10 L 60 90 M 60 20 L 85 20 M 60 50 L 85 50" />',
  'ㅒ': '<path d="M 50 10 L 50 90 M 50 20 L 75 20 M 50 50 L 75 50 M 80 10 L 80 90 M 80 20 L 95 20 M 80 50 L 95 50" />',
  'ㅓ': '<path d="M 60 10 L 60 90 M 60 40 L 35 40" />',
  'ㅔ': '<path d="M 50 10 L 50 90 M 50 40 L 25 40 M 80 10 L 80 90 M 80 40 L 55 40" />',
  'ㅕ': '<path d="M 60 10 L 60 90 M 60 20 L 35 20 M 60 50 L 35 50" />',
  'ㅖ': '<path d="M 50 10 L 50 90 M 50 20 L 25 20 M 50 50 L 25 50 M 80 10 L 80 90 M 80 20 L 55 20 M 80 50 L 55 50" />',
  'ㅗ': '<path d="M 20 40 L 80 40 M 50 40 L 50 70" />',
  'ㅘ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50" />',
  'ㅙ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50 M 80 30 L 80 80 M 80 50 L 100 50" />',
  'ㅚ': '<path d="M 50 10 L 50 90 M 50 40 L 25 40 M 10 40 L 90 40 M 70 40 L 70 80" />',
  'ㅛ': '<path d="M 20 30 L 80 30 M 50 30 L 50 70 M 50 50 L 20 70 M 50 50 L 80 70" />',
  'ㅜ': '<path d="M 20 50 L 80 50 M 50 50 L 50 80" />',
  'ㅝ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50 M 90 50 L 90 90" />',
  'ㅞ': '<path d="M 30 10 L 30 70 M 30 30 L 55 30 M 10 40 L 70 40 M 40 40 L 40 70 M 70 30 L 70 70 M 70 50 L 90 50 M 80 30 L 80 80 M 80 50 L 100 50 M 100 50 L 100 90" />',
  'ㅟ': '<path d="M 50 10 L 50 90 M 50 40 L 25 40 M 10 40 L 90 40 M 70 40 L 70 80" />',
  'ㅠ': '<path d="M 20 60 L 80 60 M 50 60 L 50 30 M 50 50 L 20 30 M 50 50 L 80 30" />',
  'ㅡ': '<path d="M 20 50 L 80 50" />',
  'ㅢ': '<path d="M 60 10 L 60 90 M 60 40 L 35 40 M 10 50 L 80 50" />',
  'ㅣ': '<path d="M 50 10 L 50 90" />',

  // 종성 (받침은 ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅅ, ㅇ 등 초성과 동일하게 사용됨)
  '': ''
};

/* ============================================
   한글 분해 및 6가지 결구 분류 (논문의 1, 2단계)
============================================ */
const CHO_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function decompose(char) {
  const code = char.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return null;
  const syllable = code - 0xAC00;
  return {
    cho: CHO_LIST[Math.floor(syllable / (21 * 28))],
    jung: JUNG_LIST[Math.floor(syllable / 28) % 21],
    jong: JONG_LIST[syllable % 28],
    jungIdx: Math.floor(syllable / 28) % 21,
    jongIdx: syllable % 28
  };
}

function getType(jungIdx, jongIdx) {
  const seRo = [0,1,2,3,4,5,6,7,20].includes(jungIdx);
  const gaRo = [8,12,13,17,18].includes(jungIdx);
  if (seRo && !jongIdx) return 1;
  if (gaRo && !jongIdx) return 2;
  if (!seRo && !gaRo && !jongIdx) return 3;
  if (seRo && jongIdx) return 4;
  if (gaRo && jongIdx) return 5;
  return 6;
}

function getBoxes(type, w, h) {
  // 논문의 무게중심 기반 배치 박스
  if (type === 1) return { cho: [0, 0, w/2, h], jung: [w/2, 0, w/2, h] };
  if (type === 2) return { cho: [0, 0, w, h/2], jung: [0, h/2, w, h/2] };
  if (type === 3) return { cho: [0, 0, w/2, h/2], jung: [w/2, 0, w/2, h/2] };
  if (type === 4) return { cho: [0, 0, w/2, h/2], jung: [w/2, 0, w/2, h/2], jong: [0, h/2, w, h/2] };
  if (type === 5) return { cho: [0, 0, w, h/3], jung: [0, h/3, w, h/3], jong: [0, (h/3)*2, w, h/3] };
  return { cho: [0, 0, w/2, h/3], jung: [w/2, 0, w/2, h/3], jong: [0, h/3, w, (h/3)*2] };
}

/* ============================================
   SVG 렌더링 및 인터랙션 (논문의 3, 4단계)
============================================ */
let uniqChars = [];
let charIdx = 0;

// 옵션 가져오기
function getOpts(part) {
  return {
    dx: parseFloat(document.getElementById(part + '-x').value),
    dy: parseFloat(document.getElementById(part + '-y').value),
    scale: parseFloat(document.getElementById(part + '-s').value)
  };
}

function drawCharacter(targetEl, char) {
  if (!char || char === ' ') return;
  const dec = decompose(char);
  
  let svgContent = '';
  const size = 200; // SVG viewBox 크기
  
  if (dec) {
    const type = getType(dec.jungIdx, dec.jongIdx);
    const layout = getBoxes(type, size, size);
    
    const renderJamo = (jamo, box) => {
      if (!jamo || !JAMO_DB[jamo]) return '';
      let opts = {};
      if (box === layout.cho) opts = getOpts('cho');
      if (box === layout.jung) opts = getOpts('jung');
      if (box === layout.jong) opts = getOpts('jong');

      const cx = box[0] + box[2]/2 + opts.dx;
      const cy = box[1] + box[3]/2 + opts.dy;
      const s = opts.scale;

      return `<g transform="translate(${cx}, ${cy}) scale(${s}) translate(-${size/2}, -${size/2})">${JAMO_DB[jamo]}</g>`;
    };

    svgContent += renderJamo(dec.cho, layout.cho);
    svgContent += renderJamo(dec.jung, layout.jung);
    if (layout.jong) svgContent += renderJamo(dec.jong, layout.jong);
  } else {
    // 특수문자나 숫자는 그냥 텍스트로 처리
    svgContent = `<text x="100" y="140" font-size="150" text-anchor="middle" fill="#111">${char}</text>`;
  }

  // SVG 및 필터 적용 (논문 4단계)
  const svg = `
    <svg viewBox="0 0 200 200">
      ${svgContent}
    </svg>
  `;
  targetEl.innerHTML = svg;
}

function redraw() {
  if (!uniqChars.length) return;
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  
  const span = document.createElement('span');
  span.className = 'calli-char';
  span.dataset.char = uniqChars[charIdx];
  
  drawCharacter(span, uniqChars[charIdx]);
  stage.appendChild(span);

  document.getElementById('char-view').innerText = uniqChars[charIdx];
  document.getElementById('char-idx').innerText = `${charIdx + 1} / ${uniqChars.length}`;
  
  ['cho', 'jung', 'jong'].forEach(p => {
    document.getElementById(p + '-x-v').innerText = document.getElementById(p + '-x').value;
    document.getElementById(p + '-y-v').innerText = document.getElementById(p + '-y').value;
    document.getElementById(p + '-s-v').innerText = parseFloat(document.getElementById(p + '-s').value).toFixed(2);
  });
}

function extractSRT() {
  const content = document.getElementById('srt-content').value;
  if (!content) return alert('SRT 내용을 입력하세요.');
  const matches = content.match(/[가-힣]/g);
  if (!matches) return alert('한글이 포함되어 있지 않습니다.');
  uniqChars = [...new Set(matches)];
  charIdx = 0;
  document.getElementById('char-count').innerText = `${uniqChars.length}자`;
  redraw();
}

function prev() { if (uniqChars.length) { charIdx = (charIdx - 1 + uniqChars.length) % uniqChars.length; redraw(); } }
function next() { if (uniqChars.length) { charIdx = (charIdx + 1) % uniqChars.length; redraw(); } }

function savePreset() {
  const state = {
    cho: getOpts('cho'), jung: getOpts('jung'), jong: getOpts('jong')
  };
  localStorage.setItem('v3_preset', JSON.stringify(state));
  alert('프리셋 저장 완료');
}

function loadPreset() {
  const saved = localStorage.getItem('v3_preset');
  if (!saved) return alert('저장된 프리셋 없음');
  const state = JSON.parse(saved);
  ['cho', 'jung', 'jong'].forEach(p => {
    document.getElementById(p + '-x').value = state[p].dx;
    document.getElementById(p + '-y').value = state[p].dy;
    document.getElementById(p + '-s').value = state[p].scale;
  });
  redraw();
}

/* SVG를 이미지로 내보내기 */
function exportOne(type) {
  if (!uniqChars.length) return alert('먼저 글자를 추출하세요.');
  const el = document.querySelector('.calli-char svg');
  const xml = new XMLSerializer().serializeToString(el);
  const svgBlob = new Blob([xml], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f4ecd8'; // 한지 배경
    ctx.fillRect(0, 0, 800, 800);
    ctx.drawImage(img, 0, 0, 800, 800);
    
    const mime = type === 'png' ? 'image/png' : 'image/jpeg';
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `char_${uniqChars[charIdx]}.${type}`;
      a.click();
    }, mime, 0.95);
  };
  img.src = url;
}

async function exportAll(type) {
  if (!uniqChars.length) return alert('먼저 글자를 추출하세요.');
  const zip = new JSZip();
  const status = document.getElementById('export-status');
  status.innerText = '처리 중...';

  for (let i = 0; i < uniqChars.length; i++) {
    const span = document.createElement('span');
    drawCharacter(span, uniqChars[i]);
    const xml = new XMLSerializer().serializeToString(span.querySelector('svg'));
    
    const img = await new Promise((res) => {
      const img = new Image();
      img.onload = () => res(img);
      img.src = URL.createObjectURL(new Blob([xml], {type: 'image/svg+xml;charset=utf-8'}));
    });

    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f4ecd8';
    ctx.fillRect(0, 0, 800, 800);
    ctx.drawImage(img, 0, 0, 800, 800);
    
    const blob = await new Promise(res => canvas.toBlob(res, `image/${type}`, 0.95));
    zip.file(`char_${String(i).padStart(3, '0')}.${type}`, blob);
    
    if (i % 10 === 0) status.innerText = `진행 중: ${i + 1} / ${uniqChars.length}`;
  }

  const zipBlob = await zip.generateAsync({type: 'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = `calligraphy_${type}_all.zip`;
  a.click();
  status.innerText = '완료!';
}

/* SRT 파일 로드 */
document.getElementById('srt-upload').addEventListener('change', e => {
  const f = e.target.files[0];
  const r = new FileReader();
  r.onload = ev => { document.getElementById('srt-content').value = ev.target.result; extractSRT(); };
  r.readAsText(f);
});

/* 초기 렌더링 */
redraw();
</script>
</body>
</html>
