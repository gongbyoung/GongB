<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정밀 한글 캘리그라피 제너레이터</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 컨트롤 패널 */
        .controls-panel {
            width: 350px;
            background: white;
            border-right: 2px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        h2 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .control-group {
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .input-row input[type="range"] {
            flex: 1;
        }

        .input-row input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-generate:hover { background-color: #45a049; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .btn-save-video { background-color: #ff9800; color: white; }
        .btn-reset { background-color: #f44336; color: white; }

        /* 오른쪽 메인 영역 (캔버스 + 로그) */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .canvas-container {
            flex: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }

        /* 로그 패널 */
        .log-panel {
            height: 250px;
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 15px;
            border-radius: 10px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 5px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; }

        /* 슬라이더 동기화 스타일 */
        .synced-input { display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <!-- 왼쪽 패널 -->
    <div class="controls-panel">
        <h2>🎛️ 제어판</h2>

        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="바람 속에 장미가" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>모양틀 (프레임) 설정</label>
            <div class="input-row">
                <span>종류</span>
                <select id="layoutSelect" onchange="generateArt()">
                    <option value="circle">원</option>
                    <option value="triangle">삼각형</option>
                    <option value="reverseTriangle">역삼각형</option>
                    <option value="diamond">마름모</option>
                    <option value="star">별모양</option>
                    <option value="top">ㅗ</option>
                    <option value="bottom">ㅜ</option>
                    <option value="left">ㅓ</option>
                    <option value="right">ㅏ</option>
                </select>
            </div>
            <div class="input-row">
                <label>틀 크기 (지름)</label>
                <input type="range" id="frameSizeRange" min="100" max="800" value="500" oninput="syncInput('frameSizeRange', 'frameSizeNum')">
                <input type="number" id="frameSizeNum" value="500" min="100" max="800" oninput="syncInput('frameSizeNum', 'frameSizeRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>틀 X 좌표</label>
                <input type="number" id="centerX" value="500" oninput="generateArt()">
            </div>
            <div class="input-row">
                <label>틀 Y 좌표</label>
                <input type="number" id="centerY" value="400" oninput="generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>글자 배치 규칙</label>
            <div class="input-row">
                <label>글자 간격</label>
                <input type="range" id="spacingRange" min="0" max="100" value="50" oninput="syncInput('spacingRange', 'spacingNum')">
                <input type="number" id="spacingNum" value="50" oninput="syncInput('spacingNum', 'spacingRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>랜덤 정도</label>
                <input type="range" id="randomRange" min="0" max="100" value="20" oninput="syncInput('randomRange', 'randomNum')">
                <input type="number" id="randomNum" value="20" oninput="syncInput('randomNum', 'randomRange'); generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>글자 형태 (왜곡)</label>
            <select id="styleSelect" onchange="generateArt()">
                <option value="none">자연스러움 (없음)</option>
                <option value="circle">둥글게 (원)</option>
                <option value="triangle">각지게 (삼각)</option>
                <option value="square">네모나게 (사각)</option>
            </select>
        </div>

        <div class="control-group">
            <label>캘리그라피 붓터치</label>
            <div class="input-row">
                <label>획 굵기 (붓터치)</label>
                <input type="range" id="thicknessRange" min="1" max="30" value="12" oninput="syncInput('thicknessRange', 'thicknessNum')">
                <input type="number" id="thicknessNum" value="12" oninput="syncInput('thicknessNum', 'thicknessRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>전체 글자 크기 배율</label>
                <input type="range" id="globalScaleRange" min="10" max="200" value="100" oninput="syncInput('globalScaleRange', 'globalScaleNum')">
                <input type="number" id="globalScaleNum" value="100" oninput="syncInput('globalScaleNum', 'globalScaleRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>개별 글자 크기 배율</label>
                <input type="range" id="letterScaleRange" min="10" max="200" value="100" oninput="syncInput('letterScaleRange', 'letterScaleNum')">
                <input type="number" id="letterScaleNum" value="100" oninput="syncInput('letterScaleNum', 'letterScaleRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성하기</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
        <button class="btn-save-video" onclick="saveAsVideo()">🎬 영상 저장 (WebM)</button>
        <button class="btn-reset" onclick="resetControls()">🔄 초기화</button>
    </div>

    <!-- 메인 영역 -->
    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
        
        <div class="log-panel" id="logPanel">
            <h3>📋 처리 로그 (실시간)</h3>
            <!-- 여기에 로그가 추가됩니다 -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');

        // 슬라이더와 숫자 입력 동기화 함수
        function syncInput(sourceId, targetId) {
            const source = document.getElementById(sourceId);
            const target = document.getElementById(targetId);
            target.value = source.value;
        }

        // 로그 추가 함수
        function addLog(message) {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            logEntry.innerHTML = `<strong>[${time}]</strong> ${message}`;
            logPanel.appendChild(logEntry);
            logPanel.scrollTop = logPanel.scrollHeight; // 자동 스크롤
        }

        // 초/중/종성 분해
        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const syllable = code - 0xAC00;
                const cho = Math.floor(syllable / 588);
                const jung = Math.floor((syllable % 588) / 28);
                const jong = syllable % 28;
                return { cho, jung, jong, isHangul: true };
            }
            return { isHangul: false, char };
        }

        // 초/중/종성 이름 배열
        const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        // 2. 글자 좌표 왜곡 (수치 고정형)
        function distortPoint(x, y, type, size) {
            if (type === 'none') return { x, y }; // 자연스러움

            const cx = 0, cy = 0;
            let dx = x - cx, dy = y - cy;
            
            // 삼각/사각/원의 가장자리로 투영
            if (type === 'circle') {
                let angle = Math.atan2(dy, dx);
                let targetR = size / 2;
                return { x: cx + Math.cos(angle) * targetR, y: cy + Math.sin(angle) * targetR };
            } else if (type === 'triangle') {
                let angle = Math.atan2(dy, dx);
                let vertexAngle = Math.floor(((angle + Math.PI) / (2 * Math.PI)) * 3) * (2 * Math.PI / 3);
                let closestVX = cx + Math.cos(vertexAngle) * (size / 2);
                let closestVY = cy + Math.sin(vertexAngle) * (size / 2);
                // 꼭짓점으로 강제 이동 (기존 지렁이 현상 제거를 위해 랜덤 요소 제거)
                return { x: x * 0.5 + closestVX * 0.5, y: y * 0.5 + closestVY * 0.5 };
            } else if (type === 'square') {
                let maxX = size / 2, maxY = size / 2;
                let scale = Math.max(Math.abs(dx)/maxX, Math.abs(dy)/maxY);
                let angle = Math.atan2(dy, dx);
                let newDist = Math.sqrt(dx*dx + dy*dy) / scale;
                return { x: cx + Math.cos(angle) * newDist, y: cy + Math.sin(angle) * newDist };
            }
            return { x, y };
        }

        // 3. 문장 분포 (9가지 배열)
        function getLayoutPosition(index, total, type, frameSize, centerX, centerY, spacingFactor) {
            // spacingFactor는 글자가 얼마나 바깥쪽으로 퍼지는지 (0~1)
            const radius = (frameSize / 2) * (0.8 + spacingFactor * 0.2);
            
            switch(type) {
                case 'circle': {
                    const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
                    return { x: centerX + Math.cos(angle) * radius, y: centerY + Math.sin(angle) * radius };
                }
                case 'triangle': {
                    const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
                    let r = radius * (0.9 + 0.1 * Math.cos(3 * angle));
                    return { x: centerX + Math.cos(angle) * r, y: centerY + Math.sin(angle) * r };
                }
                // ... (나머지 레이아웃은 생략, 필요시 추가)
                default: {
                    const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
                    return { x: centerX + Math.cos(angle) * radius, y: centerY + Math.sin(angle) * radius };
                }
            }
        }

        // 4. 메인 생성 함수
        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const text = document.getElementById('textInput').value;
            const layoutType = document.getElementById('layoutSelect').value;
            const styleType = document.getElementById('styleSelect').value;
            
            const frameSize = parseInt(document.getElementById('frameSizeNum').value);
            const centerX = parseInt(document.getElementById('centerX').value);
            const centerY = parseInt(document.getElementById('centerY').value);
            
            const spacing = parseInt(document.getElementById('spacingNum').value) / 100; // 0~1
            const randomAmt = parseInt(document.getElementById('randomNum').value) / 100; // 0~1
            
            const thickness = parseInt(document.getElementById('thicknessNum').value);
            const globalScale = parseInt(document.getElementById('globalScaleNum').value) / 100;
            const letterScale = parseInt(document.getElementById('letterScaleNum').value) / 100;

            const chars = text.split('');
            const total = chars.length;

            // 로그 초기화
            logPanel.innerHTML = '<h3>📋 처리 로그 (실시간)</h3>';
            addLog(`입력 문장: "${text}" (총 ${total}자)`);
            addLog(`프레임: 크기 ${frameSize}, 중심 (${centerX}, ${centerY}), 모양 ${layoutType}`);

            ctx.fillStyle = '#111';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            chars.forEach((char, index) => {
                const layoutPos = getLayoutPosition(index, total, layoutType, frameSize, centerX, centerY, spacing);
                
                // 개별 글자 랜덤 크기 적용
                let randomScale = 1 + ((Math.random() * 2 - 1) * randomAmt);
                let finalScale = globalScale * letterScale * randomScale;
                
                if (decomposeHangul(char).isHangul) {
                    const decomposed = decomposeHangul(char);
                    
                    // 로그에 상세 정보 기록
                    const choName = CHO[decomposed.cho];
                    const jungName = JUNG[decomposed.jung];
                    const jongName = decomposed.jong > 0 ? JONG[decomposed.jong] : '없음';
                    
                    addLog(`- "${char}": [초성:${choName}, 중성:${jungName}, 종성:${jongName}] → 좌표(${Math.round(layoutPos.x)}, ${Math.round(layoutPos.y)}) / 크기 ${(finalScale * 100).toFixed(0)}%`);

                    drawHangulGlyph(decomposed, layoutPos.x, layoutPos.y, finalScale, styleType, thickness);
                } else {
                    ctx.font = `bold ${80 * finalScale}px Arial`;
                    ctx.fillText(char, layoutPos.x, layoutPos.y);
                    addLog(`- "${char}": [일반 문자] → 좌표(${Math.round(layoutPos.x)}, ${Math.round(layoutPos.y)})`);
                }
            });

            addLog('✅ 렌더링 완료');
        }

        // 캘리그라피 획 그리기 (수치 고정형 - 지렁이 현상 제거)
        function drawHangulGlyph(decomp, x, y, scale, styleType, thickness) {
            ctx.lineWidth = thickness; // 붓터치 굵기
            
            // 글자 하나의 기본 크기 (여기서는 단순 상수로 고정)
            const size = 70 * scale;
            const s = size; // s는 스케일 변수

            // 초성, 중성, 종성을 수학적으로 대략 배치
            // 여기서는 실제 폰트처럼 보이도록 획의 시작/끝 좌표를 고정적으로 계산합니다.
            
            const strokes = [];

            // 1. 초성 (왼쪽 위 or 왼쪽)
            // 예시: 'ㄱ' 같은 형태
            strokes.push([
                { x: x - s*0.3, y: y - s*0.5 },
                { x: x - s*0.3, y: y + s*0.5 }
            ]);
            strokes.push([
                { x: x - s*0.3, y: y + s*0.5 },
                { x: x - s*0.1, y: y + s*0.2 }
            ]);

            // 2. 중성 (오른쪽)
            // 예시: 'ㅏ' 같은 형태
            strokes.push([
                { x: x + s*0.2, y: y - s*0.7 },
                { x: x + s*0.2, y: y + s*0.7 }
            ]);
            strokes.push([
                { x: x + s*0.2, y: y },
                { x: x + s*0.5, y: y }
            ]);

            // 3. 종성 (있다면 아래쪽)
            if (decomp.jong > 0) {
                strokes.push([
                    { x: x - s*0.3, y: y + s*0.7 },
                    { x: x + s*0.5, y: y + s*0.7 }
                ]);
            }

            // 각 획을 그리기 전에 왜곡 적용
            strokes.forEach(stroke => {
                const p1 = stroke[0];
                const p2 = stroke[1];

                // 도형 왜곡 적용 (지정한 프레임 크기에 맞춰)
                const distortedP1 = distortPoint(p1.x, p1.y, styleType, size * 3); // 왜곡 강도를 줄이기 위해 3배 크기
                const distortedP2 = distortPoint(p2.x, p2.y, styleType, size * 3);

                ctx.beginPath();
                ctx.moveTo(distortedP1.x, distortedP1.y);
                ctx.lineTo(distortedP2.x, distortedP2.y); // 직선으로 깔끔하게
                ctx.stroke();
            });
        }

        // 저장 기능
        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            addLog('💾 PNG 파일로 저장되었습니다.');
        }

        function saveAsVideo() {
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'calligraphy.webm';
                a.click();
                URL.revokeObjectURL(url);
                addLog('🎬 영상(WebM) 저장이 완료되었습니다.');
            };

            recorder.start();
            addLog('🎬 영상 녹화를 시작합니다 (3초간)...');
            
            let progress = 0;
            const animationInterval = setInterval(() => {
                generateArt(); // 프레임을 계속 다시 그리면서 애니메이션 효과
                progress++;
                if (progress > 90) { // 30fps * 3초 = 90프레임
                    clearInterval(animationInterval);
                    recorder.stop();
                }
            }, 33);
        }

        // 초기화
        function resetControls() {
            document.getElementById('textInput').value = "바람 속에 장미가";
            document.getElementById('layoutSelect').value = "circle";
            document.getElementById('styleSelect').value = "none";
            document.getElementById('frameSizeNum').value = 500;
            document.getElementById('frameSizeRange').value = 500;
            document.getElementById('centerX').value = 500;
            document.getElementById('centerY').value = 400;
            document.getElementById('spacingNum').value = 50;
            document.getElementById('spacingRange').value = 50;
            document.getElementById('randomNum').value = 20;
            document.getElementById('randomRange').value = 20;
            document.getElementById('thicknessNum').value = 12;
            document.getElementById('thicknessRange').value = 12;
            document.getElementById('globalScaleNum').value = 100;
            document.getElementById('globalScaleRange').value = 100;
            document.getElementById('letterScaleNum').value = 100;
            document.getElementById('letterScaleRange').value = 100;
            
            generateArt();
            addLog('🔄 모든 설정이 초기화되었습니다.');
        }

        // 초기 실행
        window.onload = generateArt;
    </script>
</body>
</html>
