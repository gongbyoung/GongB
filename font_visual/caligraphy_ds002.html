<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Generator v8.0 (Design System)</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f4; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .controls-panel { width: 350px; background: white; border-right: 2px solid #ddd; padding: 20px; overflow-y: auto; }
        .version-title { font-size: 22px; font-weight: 900; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #2196F3; }
        .control-group { margin-bottom: 15px; border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fafafa; }
        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .input-row input[type="range"] { flex: 1; }
        .input-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        select, input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .main-area { flex: 1; display: flex; flex-direction: column; }
        .canvas-container { flex: 1; padding: 20px; background: white; margin: 20px; border: 2px dashed #2196F3; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; border: 1px solid rgba(33,150,243,0.3); }
        .log-panel { width: 300px; background: #1e1e1e; color: #00ff00; font-family: 'Courier New', monospace; font-size: 13px; padding: 20px; overflow-y: auto; }
        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        #popup { background: white; padding: 30px; border-radius: 15px; max-width: 500px; text-align: center; }
        #popup button { width: auto; padding: 10px 30px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay">
        <div id="popup">
            <h1>🎨 캘리그라피 디자인 시스템</h1>
            <h2>v8.0 - 실제 작가의 팁 적용</h2>
            <hr>
            <p>강조 단어, 덩어리감, 여백, Baseline 굴곡, 획별 먹물 번짐까지 실제 작품처럼 렌더링합니다.</p>
            <button onclick="closePopup()">닫기</button>
        </div>
    </div>

    <div class="controls-panel">
        <div class="version-title">🎛️ Calligraphy v8.0</div>

        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="바람에 흩날리는 꽃잎" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>강조 단어 (키워드 설정)</label>
            <input type="text" id="keywordInput" value="꽃잎" oninput="generateArt()">
            <div class="input-row">
                <label>강조 크기 배율</label>
                <input type="range" id="kwScaleRange" min="100" max="300" value="180" oninput="syncInput('kwScaleRange', 'kwScaleNum')">
                <input type="number" id="kwScaleNum" value="180" oninput="syncInput('kwScaleNum', 'kwScaleRange'); generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>9가지 붓터치 스타일</label>
            <select id="strokeStyleSelect" onchange="generateArt()">
                <option value="1">1. 굵고→얇고→굵고</option>
                <option value="2">2. 굵고→마지막 얇고</option>
                <option value="3" selected>3. 얇고→굵고→얇고→길게</option>
                <option value="4">4. 유려한 곡선 (출렁)</option>
                <option value="5">5. 처음/끝 갈라짐</option>
                <option value="6">6. 끝 물방울 (먹물)</option>
                <option value="7">7. 모음 윗부분 물방울</option>
                <option value="8">8. 받침 늘이기</option>
                <option value="9">9. 기본 혼합형</option>
            </select>
        </div>

        <div class="control-group">
            <label>구도 및 여백</label>
            <div class="input-row">
                <label>글자 크기</label>
                <input type="range" id="sizeRange" min="30" max="150" value="80" oninput="syncInput('sizeRange', 'sizeNum')">
                <input type="number" id="sizeNum" value="80" oninput="syncInput('sizeNum', 'sizeRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>덩어리감 (자간)</label>
                <input type="range" id="spacingRange" min="0" max="100" value="10" oninput="syncInput('spacingRange', 'spacingNum')">
                <input type="number" id="spacingNum" value="10" oninput="syncInput('spacingNum', 'spacingRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>기울기 리듬감</label>
                <input type="range" id="tiltRange" min="0" max="100" value="30" oninput="syncInput('tiltRange', 'tiltNum')">
                <input type="number" id="tiltNum" value="30" oninput="syncInput('tiltNum', 'tiltRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>여백(패딩)</label>
                <input type="range" id="paddingRange" min="0" max="300" value="150" oninput="syncInput('paddingRange', 'paddingNum')">
                <input type="number" id="paddingNum" value="150" oninput="syncInput('paddingNum', 'paddingRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
    </div>

    <div class="log-panel" id="logPanel">
        <h3>📋 캘리그라피 로그</h3>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');
        const overlay = document.getElementById('overlay');
        window.onload = generateArt;

        function closePopup() { overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 500); }
        ['mousemove', 'click'].forEach(e => window.addEventListener(e, () => { if (overlay.style.display !== 'none') closePopup(); }));
        function syncInput(s, t) { document.getElementById(t).value = document.getElementById(s).value; }
        function addLog(m) { const div = document.createElement('div'); div.className = 'log-entry'; div.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`; logPanel.appendChild(div); logPanel.scrollTop = logPanel.scrollHeight; }

        // 유니코드 분해
        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const syllable = code - 0xAC00;
                return { cho: Math.floor(syllable / 588), jung: Math.floor((syllable % 588) / 28), jong: syllable % 28, isHangul: true };
            }
            return { isHangul: false, char };
        }

        // 9가지 붓터치 굵기 함수 (획의 시작 t=0, 끝 t=1)
        function getBrushWidth(t, style, base) {
            switch(style) {
                case '1': return base * (Math.abs(t - 0.5) * 1.6 + 0.2); // 굵고-얇고-굵고
                case '2': return base * (1 - t * 0.9); // 굵고-얇고
                case '3': return base * (Math.sin(t * Math.PI) * 0.7 + 0.3); // 얇고-굵고-얇고
                case '4': return base * (Math.sin(t * Math.PI * 4) * 0.3 + 0.7); // 물결
                case '5': return base * (t < 0.1 || t > 0.9 ? 0.2 : 1); // 갈라짐
                case '6': return base * (t < 0.9 ? 1 : 0.5); // 끝 물방울
                case '7': return base * (t < 0.2 ? 0.5 : 1); // 윗부분 물방울
                case '8': return base * (0.5 + t * 0.8); // 받침 늘이기
                default: return base * (0.6 + Math.sin(t * Math.PI) * 0.4); // 기본
            }
        }

        // 실제 획 그리기 (베지어 곡선 + 굵기 변화 + 처음/끝 번짐)
        function drawStroke(p1, ctrl, p2, base, style, isImportant) {
            const segments = 30;
            let prevX = p1.x, prevY = p1.y;

            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const x = (1-t)*(1-t)*p1.x + 2*(1-t)*t*ctrl.x + t*t*p2.x;
                const y = (1-t)*(1-t)*p1.y + 2*(1-t)*t*ctrl.y + t*t*p2.y;

                let w = getBrushWidth(t, style, base);
                
                // 강조 단어는 획이 더 굵게
                if (isImportant) w *= 1.5;

                // 먹물 번짐 (처음과 끝에만)
                ctx.shadowBlur = 0;
                if (t < 0.1) ctx.shadowBlur = base * 0.5; // 처음 번짐
                if (t > 0.9) ctx.shadowBlur = base * 0.8; // 끝 번짐 (꼬리)
                ctx.shadowColor = 'black';

                ctx.beginPath();
                ctx.moveTo(prevX, prevY);
                ctx.lineTo(x, y);
                ctx.lineWidth = w;
                ctx.strokeStyle = 'black';
                ctx.stroke();

                prevX = x; prevY = y;
            }
        }

        // 글자 그리기 (초/중/종을 획으로 분해)
        function drawHangulCharacter(charData, x, y, size, style, isImportant, tilt) {
            const s = size;
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(tilt);

            // 초성 (ㄱ, ㄴ, ㄷ 등 - 단순한 'ㄴ' 형태)
            drawStroke({x:-s*0.4, y:-s*0.5}, {x:-s*0.5, y:0}, {x:-s*0.4, y:s*0.5}, s*0.15, style, isImportant);
            
            // 중성 (ㅏ, ㅓ 등 - 세로 획 + 가로 획)
            drawStroke({x:s*0.2, y:-s*0.6}, {x:s*0.3, y:0}, {x:s*0.2, y:s*0.6}, s*0.15, style, isImportant);
            // 가로 획 (받침 늘이기 8번이면 오른쪽으로 길게)
            let hEndX = s*0.7;
            if (style === '8') hEndX = s*1.2;
            drawStroke({x:s*0.2, y:0}, {x:s*0.4, y:-s*0.05}, {x:hEndX, y:0}, s*0.15, style, isImportant);

            // 종성 (받침)
            if (charData.jong > 0) {
                drawStroke({x:-s*0.3, y:s*0.5}, {x:0, y:s*0.6}, {x:s*0.5, y:s*0.5}, s*0.15, style, isImportant);
            }
            ctx.restore();
        }

        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const text = document.getElementById('textInput').value;
            const keyword = document.getElementById('keywordInput').value;
            const style = parseInt(document.getElementById('strokeStyleSelect').value);
            const baseSize = parseInt(document.getElementById('sizeNum').value);
            const spacing = parseInt(document.getElementById('spacingNum').value) / 100;
            const tiltAmt = parseInt(document.getElementById('tiltNum').value) / 100;
            const padding = parseInt(document.getElementById('paddingNum').value);
            const kwScale = parseInt(document.getElementById('kwScaleNum').value) / 100;

            const chars = text.split('');
            const total = chars.length;

            const canvasW = canvas.width;
            const canvasH = canvas.height;

            // 여백의 미 (Padding)
            const workAreaX = canvasW - padding * 2;
            const workAreaY = canvasH - padding * 2;

            // 행간과 자간 계산 (덩어리감)
            const charSpacing = baseSize * (1 + spacing); // 자간을 좁게
            const totalWidth = charSpacing * total;
            const startX = (canvasW - totalWidth) / 2;

            logPanel.innerHTML = '<h3>📋 캘리그라피 로그</h3>';
            addLog(`✅ 문장: ${text} / 강조: ${keyword}`);

            chars.forEach((char, index) => {
                const cData = decomposeHangul(char);
                
                // 강조 단어 체크
                const isImportant = keyword.includes(char);
                
                // 강조 단어는 크게 (시선 집중)
                let charSize = baseSize;
                if (isImportant) charSize = baseSize * kwScale;

                // 글자 위치 (기준선 위아래 굴곡 - 리듬감)
                const baselineY = canvasH / 2 + Math.sin(index * 1.5) * tiltAmt * 30;
                const x = startX + (charSpacing * index) + (Math.random() * 2 - 1) * tiltAmt * 20;
                
                // 개별 글자 기울기 (불규칙성)
                const tilt = (Math.random() * 2 - 1) * tiltAmt * 0.3;

                // 한글 처리
                if (cData.isHangul) {
                    drawHangulCharacter(cData, x, baselineY, charSize, style, isImportant, tilt);
                    addLog(`- "${char}" (크기: ${Math.round(charSize)}px) 렌더링`);
                } else {
                    // 공백 또는 특수문자 처리
                    ctx.font = `${charSize}px Arial`;
                    ctx.fillText(char, x, baselineY);
                }
            });
            addLog("✅ 캘리그라피 완성 (여백과 덩어리감 적용됨)");
        }

        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            addLog("💾 이미지가 저장되었습니다.");
        }
    </script>
</body>
</html>
