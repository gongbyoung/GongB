<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 캘리그라피 스튜디오 v34 (전체 화면 정상화)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

  <style>
    :root { --bg-dark: #121214; --panel-bg: #1e1e24; --panel-border: #2d2d38; --accent-color: #ff6b35; --text-main: #f0f0f5; --text-muted: #a0a0b0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #18181c; padding: 12px 24px; border-bottom: 1px solid var(--panel-border); }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 380px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .preview-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0c; align-items: center; justify-content: center; padding: 20px; position: relative; }
    .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 70vh; cursor: grab; }
    canvas { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; pointer-events: none; }
    
    .player-controls { width: 100%; max-width: 960px; margin-top: 15px; background: var(--panel-bg); padding: 14px 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--panel-border); }
    .timeline-row { display: flex; align-items: center; gap: 12px; }
    .time-display { font-family: monospace; font-size: 0.9rem; color: var(--accent-color); min-width: 120px; }
    button.btn-action { background: linear-gradient(135deg, #ff6b35, #f72585); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.btn-secondary { background: #2b2b38; border: 1px solid var(--panel-border); color: var(--text-main); padding: 10px 16px; border-radius: 6px; cursor: pointer; }

    .section-title { font-size: 0.9rem; font-weight: 700; color: var(--accent-color); text-transform: uppercase; margin-bottom: 6px; }
    select, input[type="range"], input[type="color"], input[type="number"], input[type="text"], textarea { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; margin-bottom: 4px; }
    label { font-size: 0.82rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 6px; }
    input[type="file"] { display: none; }
    .btn-file { display: block; padding: 12px; background: #2a2a36; border: 2px dashed var(--accent-color); border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    .srt-list-container { max-height: 200px; overflow-y: auto; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; }
    .srt-item { padding: 6px 10px; border-bottom: 1px solid #22222a; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; }
    .srt-item.active { background: rgba(255, 107, 55, 0.2); border-left: 3px solid var(--accent-color); }

    #log-panel { position: fixed; right: 10px; top: 10px; width: 300px; max-height: 90vh; background: rgba(30, 30, 36, 0.95); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; overflow-y: auto; z-index: 999; font-size: 0.8rem; }
    #log-panel h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid #444; padding-bottom: 5px; }
    .log-entry { border-bottom: 1px dashed #333; padding: 5px 0; color: var(--text-muted); }
    .log-entry strong { color: #4ecdc4; }
  </style>
</head>
<body>
  <header>
    <h1>🖌️ SRT 캘리그라피 스튜디오 v34 (정상화 + 진한 먹)</h1>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="section-title">📂 1. 폰트 & SRT</div>
      <label for="ttf-input" class="btn-file">📁 나만의 TTF 불러오기</label>
      <input type="file" id="ttf-input" accept=".ttf, .otf">
      <div class="font-status" id="font-status">기본 나눔붓글씨 사용 중</div>
      
      <label for="srt-input" class="btn-file">📁 SRT 파일 불러오기</label>
      <input type="file" id="srt-input" accept=".srt">
      <textarea id="srt-textarea" class="srt-textarea" style="height:80px;" placeholder="SRT 내용 입력"></textarea>
      <button class="btn-secondary" id="btn-apply-srt" style="width:100%;">✏️ 자막 적용하기</button>

      <div class="section-title">📐 2. 비율</div>
      <select id="aspect-ratio-select">
        <option value="16:9" selected>16:9 가로 (1920x1080)</option>
        <option value="9:16">9:16 세로 (1080x1920)</option>
      </select>

      <div style="background: #2a2a36; padding: 10px; border-radius: 6px; font-size: 0.8rem; color: #aaa; border: 1px solid #444;">
        💡 <strong>편집 팁:</strong> 캔버스의 글씨를 마우스로 직접 끌어서 위치를 변경하세요.
      </div>

      <div class="section-title">🎛️ 3. 선택된 세션 설정</div>
      <div id="session-controls" style="display: none;">
        <label>세션 ID</label>
        <input type="text" id="session-id" readonly>
        <label>위치 X <span id="val-x">0</span></label>
        <input type="range" id="session-x" min="-500" max="500" step="10" value="0">
        <label>위치 Y <span id="val-y">0</span></label>
        <input type="range" id="session-y" min="-500" max="500" step="10" value="0">
        <label>크기 <span id="val-scale">1.0x</span></label>
        <input type="range" id="session-scale" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>

      <div class="section-title">🖼️ 4. 공용 마스크</div>
      <label for="mask-file-input" class="btn-file">🖼️ 흑백 마스크 (.png / .jpg)</label>
      <input type="file" id="mask-file-input" accept="image/*">

      <div class="section-title">🖌️ 5. 붓터치 스타일</div>
      <select id="morph-style">
        <option value="vbp">🖌️ 가변 굵기 붓 (기본, 진하게)</option>
        <option value="soft">🥚 둥글둥글 (부드러운 눌림)</option>
        <option value="sharp">🗡️ 뾰족 (거친 빠른 붓)</option>
        <option value="dry">💧 갈필 (마른 붓)</option>
      </select>

      <div class="section-title">🎚️ 6. 필압 및 구도</div>
      <label>POWER (획 굵기) <span id="val-power">1.0x</span></label>
      <input type="range" id="power-slider" min="0.1" max="3.0" step="0.1" value="1.0">
      <label>글자 기울기 (리듬감) <span id="val-rhythm">0.5</span></label>
      <input type="range" id="rhythm-slider" min="0.0" max="1.0" step="0.1" value="0.5">
      <label>줄간격 <span id="val-line">1.2x</span></label>
      <input type="range" id="line-slider" min="0.5" max="2.0" step="0.1" value="1.2">

      <div class="section-title">🖼️ 7. 배경 & 색상</div>
      <select id="bg-style">
        <option value="hanji" selected>한지</option>
        <option value="dark-paper">어두운 종이</option>
        <option value="transparent">투명</option>
        <option value="black">검정</option>
      </select>
      <input type="color" id="ink-color" value="#1c1917">

      <div class="section-title">📜 8. 세션 목록</div>
      <div class="srt-list-container" id="srt-list"></div>
    </div>

    <div class="preview-area">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
      </div>
      <div class="player-controls">
        <div class="timeline-row">
          <button class="btn-secondary" id="btn-play">▶ 재생</button>
          <input type="range" id="time-slider" min="0" max="100" value="0" step="0.01" style="flex:1;">
          <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div id="res-indicator" style="font-size:0.85rem; color:var(--text-muted);">드래그로 이동 | 녹화 시 마스크 적용</div>
          <button class="btn-action" id="btn-export">🔴 녹화 시작</button>
        </div>
      </div>
    </div>
  </div>

  <div id="log-panel">
    <h3>📊 렌더링 LOG</h3>
    <div id="log-messages"></div>
  </div>

  <script>
    function logMessage(msg) {
      const logDiv = document.getElementById('log-messages');
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = msg;
      logDiv.prepend(div);
      if(logDiv.children.length > 30) logDiv.removeChild(logDiv.lastChild);
    }

    const canvas = document.getElementById('calligraphy-canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');
    
    let srtData = [], totalDuration = 0, currentTime = 0, isPlaying = false, animationFrameId = null, lastTimestamp = 0;
    let currentFont = null;
    let selectedSessionIndex = 0;
    let isRecording = false;

    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');
    let currentMaskAlphaImage = null;
    const maskBoundsCache = new Map();
    
    const powerSlider = document.getElementById('power-slider');
    const rhythmSlider = document.getElementById('rhythm-slider');
    const lineSlider = document.getElementById('line-slider');
    const morphStyleSelect = document.getElementById('morph-style');
    
    const power = () => parseFloat(powerSlider.value);
    const rhythm = () => parseFloat(rhythmSlider.value);
    const lineHeightMul = () => parseFloat(lineSlider.value);

    let isDragging = false;
    let dragStartX = 0, dragStartY = 0, dragStartSessionX = 0, dragStartSessionY = 0;
    wrapper.addEventListener('mousedown', (e) => {
      if (isRecording || !srtData[selectedSessionIndex]) return;
      isDragging = true;
      dragStartX = e.clientX; dragStartY = e.clientY;
      dragStartSessionX = srtData[selectedSessionIndex].session.x;
      dragStartSessionY = srtData[selectedSessionIndex].session.y;
      wrapper.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      srtData[selectedSessionIndex].session.x = dragStartSessionX + (e.clientX - dragStartX) * scaleX;
      srtData[selectedSessionIndex].session.y = dragStartSessionY + (e.clientY - dragStartY) * scaleY;
      document.getElementById('session-x').value = Math.round(srtData[selectedSessionIndex].session.x);
      document.getElementById('session-y').value = Math.round(srtData[selectedSessionIndex].session.y);
      document.getElementById('val-x').textContent = Math.round(srtData[selectedSessionIndex].session.x);
      document.getElementById('val-y').textContent = Math.round(srtData[selectedSessionIndex].session.y);
      renderFrame(currentTime);
    });
    window.addEventListener('mouseup', () => { if(isDragging){ isDragging = false; wrapper.style.cursor = 'grab'; logMessage(`세션 이동 완료`); } });

    document.getElementById('ttf-input').addEventListener('change', (e) => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => { currentFont = opentype.parse(evt.target.result); logMessage(`폰트: ${file.name} 적용`); renderFrame(currentTime); };
      reader.readAsArrayBuffer(file);
    });

    function normalizeMaskAlpha(img) {
      return new Promise(resolve => {
        const w = canvas.width, h = canvas.height;
        const off = document.createElement('canvas'); off.width = w; off.height = h;
        const octx = off.getContext('2d'); octx.drawImage(img, 0, 0, w, h);
        const imgData = octx.getImageData(0, 0, w, h); const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const brightness = (d[i] + d[i+1] + d[i+2]) / 3; const srcAlpha = d[i+3];
          const a = srcAlpha < 10 ? 0 : brightness;
          d[i] = 255; d[i+1] = 255; d[i+2] = 255; d[i+3] = a;
        }
        octx.putImageData(imgData, 0, 0);
        const outImg = new Image(); outImg.onload = () => resolve(outImg); outImg.src = off.toDataURL();
      });
    }
    document.getElementById('mask-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if(!file) return;
      const img = new Image();
      img.onload = async () => { currentMaskAlphaImage = await normalizeMaskAlpha(img); logMessage("마스크 적용"); renderFrame(currentTime); };
      img.src = URL.createObjectURL(file);
    });

    function getMaskBounds(img) {
      if (maskBoundsCache.has(img)) return maskBoundsCache.get(img);
      const w = canvas.width, h = canvas.height;
      const off = document.createElement('canvas'); off.width = w; off.height = h;
      const octx = off.getContext('2d'); octx.drawImage(img, 0, 0, w, h);
      const data = octx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
      for (let y = 0; y < h; y += 4) for (let x = 0; x < w; x += 4) { const a = data[(y * w + x) * 4 + 3]; if (a > 128) { found = true; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; } }
      const bounds = found ? { x: minX, y: minY, w: Math.max(40, maxX - minX), h: Math.max(40, maxY - minY) } : { x: w*0.3, y: h*0.3, w: w*0.4, h: h*0.4 };
      maskBoundsCache.set(img, bounds); return bounds;
    }

    function getDefaultMask() {
      const w = canvas.width, h = canvas.height;
      const off = document.createElement('canvas'); off.width = w; off.height = h;
      const octx = off.getContext('2d'); octx.fillStyle = '#fff';
      octx.beginPath(); octx.moveTo(w * 0.1, h * 0.2); octx.lineTo(w * 0.9, h * 0.2); octx.lineTo(w * 0.5, h * 0.8); octx.closePath(); octx.fill();
      return off;
    }

    function drawGuideFrame() {
      if (isRecording) return; 
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 107, 55, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      const mask = currentMaskAlphaImage || getDefaultMask();
      const bounds = getMaskBounds(mask);
      ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
      ctx.strokeStyle = 'rgba(255, 107, 55, 0.9)'; ctx.lineWidth = 1.5;
      const centerX = bounds.x + bounds.w / 2, centerY = bounds.y + bounds.h / 2;
      ctx.beginPath(); ctx.moveTo(centerX, bounds.y); ctx.lineTo(centerX, bounds.y + bounds.h); ctx.moveTo(bounds.x, centerY); ctx.lineTo(bounds.x + bounds.w, centerY); ctx.stroke();
      ctx.restore();
    }

    // 가변 폭 외곽선 패스 생성 (중심선이 아닌 "폭 있는" 실제 붓 패스 생성!)
    function createBrushPath(glyphData, sp) {
      const pts = glyphData.contours;
      if (pts.length < 2) return null;

      const leftPts = [];
      const rightPts = [];
      const baseWidth = 40 * sp.width * power();

      for (let i = 0; i < pts.length; i++) {
        const prev = pts[Math.max(0, i - 1)];
        const next = pts[Math.min(pts.length - 1, i + 1)];
        
        // 중심선의 접선 벡터
        let dx = next.x - prev.x;
        let dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;

        // 법선 벡터
        const nx = -dy;
        const ny = dx;

        // 필압에 따른 굵기
        const t = pts.length > 1 ? i / (pts.length - 1) : 0;
        let p = Math.pow(Math.sin(t * Math.PI * 0.88), 0.82);
        p = 0.22 + p * 1.38;
        if (t > 0.80) p *= (1 - (t - 0.80) / 0.20 * 0.70);
        p = Math.max(0.10, p);

        const w = baseWidth * p;

        leftPts.push({ x: pts[i].x + nx * w / 2, y: pts[i].y + ny * w / 2 });
        rightPts.push({ x: pts[i].x - nx * w / 2, y: pts[i].y - ny * w / 2 });
      }

      // 왼쪽 경로 + 오른쪽 경로 역순으로 연결
      let d = `M ${leftPts[0].x} ${leftPts[0].y}`;
      for (let i = 1; i < leftPts.length; i++) d += ` L ${leftPts[i].x} ${leftPts[i].y}`;
      for (let i = rightPts.length - 1; i >= 0; i--) d += ` L ${rightPts[i].x} ${rightPts[i].y}`;
      d += ' Z';

      return new Path2D(d);
    }

    // Path2D를 가변 굵기로 렌더링
    function drawBrushGlyph(targetCtx, glyphData, centerX, centerY, revealLength, fullyDone, seed, sp, char) {
      if (!glyphData || !glyphData.contours) return;
      const bbox = glyphData.bbox;
      const offX = centerX - (bbox.x1 + bbox.x2) / 2;
      const offY = centerY - (bbox.y1 + bbox.y2) / 2;

      targetCtx.save();
      targetCtx.translate(offX, offY);
      targetCtx.globalAlpha = 1.0;

      // [핵심 수정] Path2D를 항상 "FILL" (채움) 한다. 이렇게 하면 테두리만 남는 문제 해결.
      // 완성 여부와 관계 없이 무조건 진한 먹으로 채워진다.
      const brushPath = createBrushPath(glyphData, sp);
      if (brushPath) {
        targetCtx.fillStyle = targetCtx.fillStyle; // 색 유지
        targetCtx.fill(brushPath, 'nonzero');
      }
      
      targetCtx.restore();
    }

    // Path 데이터를 점으로 변환
    function commandsToPts(commands, fontSize) {
      let pts = [];
      let cx = 0, cy = 0, sx = 0, sy = 0;
      const SEGMENTS = 16;
      commands.forEach(c => {
        if (c.type === 'M') { cx = c.x; cy = c.y; sx = cx; sy = cy; pts.push({x: cx, y: cy}); }
        else if (c.type === 'L') { cx = c.x; cy = c.y; pts.push({x: cx, y: cy}); }
        else if (c.type === 'C') {
          for (let i = 1; i <= SEGMENTS; i++) { const t = i / SEGMENTS, mt = 1 - t; pts.push({ x: mt*mt*mt*cx + 3*mt*mt*t*c.x1 + 3*mt*t*t*c.x2 + t*t*t*c.x, y: mt*mt*mt*cy + 3*mt*mt*t*c.y1 + 3*mt*t*t*c.y2 + t*t*t*c.y }); }
          cx = c.x; cy = c.y;
        }
        else if (c.type === 'Q') {
          for (let i = 1; i <= SEGMENTS; i++) { const t = i / SEGMENTS, mt = 1 - t; pts.push({ x: mt*mt*cx + 2*mt*t*c.x1 + t*t*c.x, y: mt*mt*cy + 2*mt*t*c.y1 + t*t*c.y }); }
          cx = c.x; cy = c.y;
        }
        else if (c.type === 'Z') { pts.push({x: sx, y: sy}); cx = sx; cy = sy; }
      });
      return pts;
    }

    function getGlyphBrushData(char, fontSize) {
      const key = `${currentFont?.familyName || 'font'}|${char.codePointAt(0)}|${fontSize.toFixed(1)}`;
      if (glyphDataCache.has(key)) return glyphDataCache.get(key);
      
      const path = currentFont.getPath(char, 0, 0, fontSize);
      const bbox = path.getBoundingBox();
      const commands = path.commands;
      const pts = commandsToPts(commands, fontSize);

      if (pts.length < 4) {
        const emptyData = { contours: [], totalLength: 0, bbox, isBlank: true };
        glyphDataCache.set(key, emptyData);
        return emptyData;
      }
      
      let totalLength = 0;
      for (let i = 1; i < pts.length; i++) totalLength += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);

      const data = { contours: pts, totalLength, bbox, isBlank: false };
      glyphDataCache.set(key, data);
      return data;
    }

    function computeCharPlan(chars, sizes) {
      let cum = 0;
      const plan = chars.map((ch, i) => {
        let data = null, length;
        if (ch !== ' ') {
          data = getGlyphBrushData(ch, sizes[i]);
          length = Math.max(data.totalLength, sizes[i] * 0.2);
        } else {
          length = sizes[i] * 0.3;
        }
        cum += length;
        return { ch, data, length, cumEnd: cum };
      });
      return { plan, totalLen: cum || 1 };
    }

    function seededRandom(seed){let x=Math.sin(seed++)*10000;return x-Math.floor(x);}

    function layoutSessionText(text, bounds, tightness, contrast, sp, session) {
      let lines = text.split('\n').filter(l => l.trim().length > 0);
      if (lines.length === 1 && text.includes(' ')) lines = text.split(' ').filter(l => l.trim().length > 0);
      const N = lines.length; const positions = [], sizes = [];
      const lineHeight = 1.1 * lineHeightMul();
      const offsetX = session.x || 0; const offsetY = session.y || 0; const globalScale = session.scale || 1.0;

      lines.forEach((lineText, lineIdx) => {
        const t = N === 1 ? 0.5 : (lineIdx + 0.5) / N;
        const y = (bounds.y + bounds.h * (N === 1 ? 0.5 : (0.12 + 0.76 * t))) * globalScale + offsetY;
        let baseSize = bounds.w / Math.max(1, lineText.length * 0.95) * globalScale;
        baseSize = Math.min(baseSize, (bounds.h * 0.8) / (N * lineHeight)); 
        baseSize = Math.max(22, baseSize);
        const charSpacing = baseSize * tightness * 0.9;
        const totalLineWidth = (lineText.length - 1) * charSpacing;
        const startX = (bounds.x + bounds.w / 2 - totalLineWidth / 2) * globalScale + offsetX;

        Array.from(lineText).forEach((ch, charIdx) => {
          let finalSize = baseSize;
          const rot = (seededRandom(charIdx + lineIdx) - 0.5) * 0.2 * rhythm();
          positions.push({ x: startX + charIdx * charSpacing, y, ch, rot });
          sizes.push(finalSize);
        });
      });
      return { positions, sizes, rawChars: positions.map(p => p.ch) };
    }

    function getStyleParams(style) {
      let sp = { width: 1.0, alpha: 1.0 };
      switch(style) {
        case 'soft': sp.width = 2.5; sp.alpha = 1.0; break;
        case 'sharp': sp.width = 0.4; sp.alpha = 1.0; break;
        case 'dry': sp.width = 1.2; sp.alpha = 0.8; break;
        default: sp.width = 1.0; sp.alpha = 1.0; break;
      }
      sp.width *= power();
      return sp;
    }

    function renderMaskFitMode(text, writeProgress, maskImg, inkColor, sp, session, applyClip) {
      if (!maskImg || !currentFont) return;
      const w = canvas.width, h = canvas.height;
      const bounds = getMaskBounds(maskImg);
      const offsetX = session.x || 0; const offsetY = session.y || 0; const scale = session.scale || 1.0;
      const transformedBounds = { x: bounds.x + offsetX, y: bounds.y + offsetY, w: bounds.w * scale, h: bounds.h * scale };
      const { positions, sizes } = layoutSessionText(text, transformedBounds, 0.75, 2.4, sp, session);
      const { plan, totalLen } = computeCharPlan(positions.map(p=>p.ch), sizes);
      const inkRevealed = writeProgress * totalLen;

      maskCtx.clearRect(0, 0, w, h);
      maskCtx.fillStyle = inkColor;

      plan.forEach((item, i) => {
        if (item.ch === ' ' || !item.data) return;
        const pos = positions[i];
        
        maskCtx.save();
        maskCtx.translate(pos.x, pos.y);
        maskCtx.rotate(pos.rot || 0);
        maskCtx.translate(-pos.x, -pos.y);

        if (inkRevealed >= item.cumEnd) drawBrushGlyph(maskCtx, item.data, pos.x, pos.y, 0, true, i*13, 1, sp, item.ch);
        else if (inkRevealed > item.cumEnd - item.length) drawBrushGlyph(maskCtx, item.data, pos.x, pos.y, inkRevealed - (item.cumEnd - item.length), false, i*13, 1, sp, item.ch);
        
        maskCtx.restore();
      });

      if (applyClip) { maskCtx.globalCompositeOperation = 'destination-in'; maskCtx.drawImage(maskImg, 0, 0, w, h); maskCtx.globalCompositeOperation = 'source-over'; }
      ctx.drawImage(maskCanvas, 0, 0);
    }

    function renderFrame(timeSec) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      if (!isRecording) drawGuideFrame();
      if (!currentFont) return;
      
      const sp = getStyleParams(morphStyleSelect.value);
      const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
      if (!activeSubtitle) return;
      const text = activeSubtitle.text.trim();
      const duration = Math.max(0.5, activeSubtitle.end - activeSubtitle.start);
      const writeProgress = Math.min(1, (timeSec - activeSubtitle.start) / (duration * 0.7));
      const maskImg = currentMaskAlphaImage || getDefaultMask();
      renderMaskFitMode(text, writeProgress, maskImg, document.getElementById('ink-color').value, sp, activeSubtitle.session || {x:0, y:0, scale:1}, isRecording);
    }

    function drawBackground() {
      const s=document.getElementById('bg-style').value; ctx.clearRect(0,0,canvas.width,canvas.height);
      if(s==='hanji'){let g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,100,canvas.width/2,canvas.height/2,800);g.addColorStop(0,'#f8f4eb');g.addColorStop(1,'#e3d7c3');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);}
      else if(s==='transparent'){return;} else if(s==='dark-paper'){ctx.fillStyle='#16161a';ctx.fillRect(0,0,canvas.width,canvas.height);} else {ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);}
    }

    // SRT/세션
    function parseSRT(text){ const n=text.replace(/\r/g,'\n'); const b=n.split('\n\n'); const r=[]; for(let bl of b){ const l=bl.trim().split('\n'); if(l.length>=3){ const tm=l[1].match(/(.*?)\s*-->\s*(.*)/); if(tm){ r.push({ id:l[0], start:parseTime(tm[1]), end:parseTime(tm[2]), text:l.slice(2).join('\n'), session:{x:0,y:0,scale:1.0} }); } } } return r; }
    function parseTime(t){ if(!t) return 0; const p=t.trim().replace(',','.').split(':'); return(+p[0]||0)*3600+(+p[1]||0)*60+(+p[2]||0); }
    function loadSRTData(rawText){ document.getElementById('srt-textarea').value=rawText; srtData=parseSRT(rawText); totalDuration=srtData.length>0?srtData[srtData.length-1].end+1.0:10; document.getElementById('time-slider').max=totalDuration; updateSRTListUI(); selectedSessionIndex=0; loadSessionControls(0); renderFrame(0); }
    function updateSRTListUI(){ const el=document.getElementById('srt-list'); el.innerHTML=''; srtData.forEach((i,idx)=>{ const d=document.createElement('div'); d.className='srt-item'+(idx===selectedSessionIndex?' active':''); d.innerHTML=`<span>#${i.id} (${formatTime(i.start)})</span> <span>${i.text.replace('\n',' / ')}</span>`; d.onclick=()=>{ selectedSessionIndex=idx; loadSessionControls(idx); updateSRTListUI(); }; el.appendChild(d); }); }
    function loadSessionControls(idx){ const session=srtData[idx].session; document.getElementById('session-id').value=`세션 #${srtData[idx].id}`; document.getElementById('session-x').value=session.x; document.getElementById('session-y').value=session.y; document.getElementById('session-scale').value=session.scale; document.getElementById('val-x').textContent=Math.round(session.x); document.getElementById('val-y').textContent=Math.round(session.y); document.getElementById('val-scale').textContent=session.scale.toFixed(1)+'x'; document.getElementById('session-controls').style.display='block'; }
    document.getElementById('session-x').addEventListener('input',(e)=>{const v=parseInt(e.target.value);document.getElementById('val-x').textContent=v;srtData[selectedSessionIndex].session.x=v;renderFrame(currentTime);});
    document.getElementById('session-y').addEventListener('input',(e)=>{const v=parseInt(e.target.value);document.getElementById('val-y').textContent=v;srtData[selectedSessionIndex].session.y=v;renderFrame(currentTime);});
    document.getElementById('session-scale').addEventListener('input',(e)=>{const v=parseFloat(e.target.value);document.getElementById('val-scale').textContent=v.toFixed(1)+'x';srtData[selectedSessionIndex].session.scale=v;renderFrame(currentTime);});

    // 재생
    function togglePlay(){ if(isPlaying){pause();}else{play();} }
    function play(){ if(isPlaying)return; isPlaying=true; lastTimestamp=0; animationFrameId=requestAnimationFrame(animate); }
    function pause(){ isPlaying=false; if(animationFrameId)cancelAnimationFrame(animationFrameId); }
    function animate(t){ if(!isPlaying)return; if(!lastTimestamp)lastTimestamp=t; const d=(t-lastTimestamp)/1000; lastTimestamp=t; currentTime+=d; if(isRecording&&currentTime>=totalDuration){ currentTime=totalDuration; stopRecording(); return; } if(currentTime>totalDuration){ currentTime=totalDuration; pause(); } document.getElementById('time-slider').value=currentTime; document.getElementById('time-display').textContent=`${formatTime(currentTime)} / ${formatTime(totalDuration)}`; renderFrame(currentTime); if(isPlaying)animationFrameId=requestAnimationFrame(animate); }
    function formatTime(s){ const m=Math.floor(s/60),ss=Math.floor(s%60),ms=Math.floor((s%1)*100); return`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(ms).padStart(2,'0')}`; }

    // 녹화
    let mediaRecorder=null,recordedChunks=[],stream=null;
    function startRecording(){ pause(); currentTime=0; isRecording=true; renderFrame(0); if(!stream)stream=canvas.captureStream(30); const mimeTypes=['video/webm;codecs=vp9','video/webm;codecs=vp8']; let mimeType=''; for(const m of mimeTypes){ if(MediaRecorder.isTypeSupported(m)){ mimeType=m; break; } } if(!mimeType){ alert('녹화 미지원'); isRecording=false; return; } recordedChunks=[]; mediaRecorder=new MediaRecorder(stream,{mimeType:mimeType,videoBitsPerSecond:8000000}); mediaRecorder.ondataavailable=e=>{ if(e.data.size>0)recordedChunks.push(e.data); }; mediaRecorder.onstop=()=>{ const blob=new Blob(recordedChunks,{type:mimeType}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`calligraphy_${Date.now()}.webm`; a.click(); URL.revokeObjectURL(url); isRecording=false; renderFrame(currentTime); logMessage('✅ 녹화 저장 완료!'); }; mediaRecorder.start(100); play(); logMessage('🔴 녹화 시작!'); }
    function stopRecording(){ if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop(); pause(); }

    document.getElementById('btn-play').addEventListener('click', togglePlay);
    document.getElementById('btn-export').addEventListener('click', startRecording);
    document.getElementById('time-slider').addEventListener('input',(e)=>{ currentTime=parseFloat(e.target.value); renderFrame(currentTime); });
    document.getElementById('srt-input').addEventListener('change',(e)=>{ const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=(evt)=>loadSRTData(evt.target.result); reader.readAsText(file); });
    document.getElementById('btn-apply-srt').addEventListener('click',()=>loadSRTData(document.getElementById('srt-textarea').value));
    document.getElementById('aspect-ratio-select').addEventListener('change',()=>{ const r=document.getElementById('aspect-ratio-select').value; canvas.width=r==='9:16'?1080:1920; canvas.height=r==='9:16'?1920:1080; maskCanvas.width=canvas.width; maskCanvas.height=canvas.height; renderFrame(currentTime); });
    
    morphStyleSelect.addEventListener('change',()=>{ logMessage(`붓 스타일: ${morphStyleSelect.options[morphStyleSelect.selectedIndex].text}`); renderFrame(currentTime); });
    powerSlider.addEventListener('input',(e)=>{ document.getElementById('val-power').textContent=e.target.value+'x'; renderFrame(currentTime); });
    rhythmSlider.addEventListener('input',(e)=>{ document.getElementById('val-rhythm').textContent=e.target.value; renderFrame(currentTime); });
    lineSlider.addEventListener('input',(e)=>{ document.getElementById('val-line').textContent=e.target.value+'x'; renderFrame(currentTime); });

    const glyphDataCache = new Map(); 
    (async()=>{ 
      try{ 
        const font=await new Promise((resolve,reject)=>opentype.load("https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf",(err,f)=>err?reject(err):resolve(f))); 
        currentFont=font; 
        document.getElementById('font-status').textContent='✅ 기본 나눔붓글씨 준비 완료'; 
        logMessage("<strong>[폰트]</strong> 나눔붓글씨 로딩 성공");
      }catch(e){ 
        document.getElementById('font-status').textContent='⚠️ 기본 폰트 실패, TTF 업로드 필요'; 
      } 
      renderFrame(0); 
    })();

    const demoSRT = `1\n00:00:00,000 --> 00:00:04,500\n황혼이 오늘도 바다가 되어\n\n2\n00:00:05,000 --> 00:00:08,500\n잠기고 잠기고\n\n3\n00:00:09,000 --> 00:00:13,000\n오늘이 가장 행복한 날`;
    loadSRTData(demoSRT);
  </script>
</body>
