<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Generator v2.0</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 패널 */
        .controls-panel {
            width: 350px;
            background: white;
            border-right: 2px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        .version-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #2196F3;
            color: #333;
        }

        h2 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .control-group {
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
        }

        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .input-row input[type="range"] { flex: 1; }
        .input-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }

        select, input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .btn-save-video { background-color: #ff9800; color: white; }

        /* 중앙 및 오른쪽 영역 */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .canvas-container {
            flex: 1;
            padding: 20px;
            background: white;
            margin: 20px;
            border: 2px dashed #2196F3; /* 캔버스 경계 파란 점선 */
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            border: 1px solid rgba(33, 150, 243, 0.3); 
            box-sizing: border-box;
        }

        /* 오른쪽 로그 패널 */
        .log-panel {
            width: 300px;
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 20px;
            border-left: 2px solid #444;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; font-size: 12px; }

        /* 팝업 모달 스타일 */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #popup {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        #popup h1 { margin-top: 0; color: #2196F3; }
        #popup p { line-height: 1.6; font-size: 16px; text-align: left; }
        #popup button {
            width: auto;
            padding: 10px 30px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 로딩 시 팝업 -->
    <div id="overlay">
        <div id="popup">
            <h1>🎨 캘리그라피 생성기</h1>
            <h2 style="color: #555;">버전 2.0 (리얼 브러시 엔진)</h2>
            <hr>
            <p>
                <b>📖 사용 방법</b><br><br>
                1. 왼쪽 패널에서 문장을 입력합니다.<br>
                2. 문장이 배치될 전체 모양(원, 별 등)을 선택합니다.<br>
                3. 각 슬라이더를 움직여 획 두께, 글자 크기, 기울기를 조정합니다.<br>
                4. 마우스를 움직이면 팝업이 사라지고 실시간으로 조정할 수 있습니다.<br><br>
                <i>※ 본 버전은 실제 붓터치(두께 변화)와 글자 간 충돌 감지를 지원합니다.</i>
            </p>
            <button onclick="closePopup()">닫기</button>
        </div>
    </div>

    <div class="controls-panel">
        <div class="version-title">🎛️ Calligraphy v2.0</div>

        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="사랑은 아름다워" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>문장 분포 (레이아웃 틀)</label>
            <select id="layoutSelect" onchange="generateArt()">
                <option value="circle">원 (퍼짐)</option>
                <option value="triangle">삼각형 (퍼짐)</option>
                <option value="reverseTriangle" selected>역삼각형 (퍼짐)</option>
                <option value="diamond">마름모 (퍼짐)</option>
                <option value="star">별모양 (퍼짐)</option>
            </select>
            <div class="input-row">
                <label>문장 반지름</label>
                <input type="range" id="layoutRadiusRange" min="100" max="500" value="280" oninput="syncInput('layoutRadiusRange', 'layoutRadiusNum')">
                <input type="number" id="layoutRadiusNum" value="280" oninput="syncInput('layoutRadiusNum', 'layoutRadiusRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>문장 중심 X</label>
                <input type="number" id="centerX" value="500" oninput="generateArt()">
            </div>
            <div class="input-row">
                <label>문장 중심 Y</label>
                <input type="number" id="centerY" value="400" oninput="generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>붓터치 설정</label>
            <div class="input-row">
                <label>획 굵기 (최대)</label>
                <input type="range" id="thicknessRange" min="5" max="50" value="22" oninput="syncInput('thicknessRange', 'thicknessNum')">
                <input type="number" id="thicknessNum" value="22" oninput="syncInput('thicknessNum', 'thicknessRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>글자 크기 배율</label>
                <input type="range" id="scaleRange" min="20" max="200" value="80" oninput="syncInput('scaleRange', 'scaleNum')">
                <input type="number" id="scaleNum" value="80" oninput="syncInput('scaleNum', 'scaleRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>기울기 (불규칙성)</label>
                <input type="range" id="tiltRange" min="0" max="100" value="50" oninput="syncInput('tiltRange', 'tiltNum')">
                <input type="number" id="tiltNum" value="50" oninput="syncInput('tiltNum', 'tiltRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>획 강약 (붓 누름)</label>
                <input type="range" id="powerRange" min="0" max="100" value="70" oninput="syncInput('powerRange', 'powerNum')">
                <input type="number" id="powerNum" value="70" oninput="syncInput('powerNum', 'powerRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
        <button class="btn-save-video" onclick="saveAsVideo()">🎬 영상 저장 (WebM)</button>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
    </div>

    <!-- 오른쪽 로그 패널 -->
    <div class="log-panel" id="logPanel">
        <h3>📋 시스템 로그</h3>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');
        
        const overlay = document.getElementById('overlay');
        
        function closePopup() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            addLog("팝업이 닫혔습니다. 실시간 렌더링을 시작합니다.");
        }

        ['mousemove', 'keydown', 'click', 'touchstart'].forEach(event => {
            window.addEventListener(event, () => {
                if (overlay.style.display !== 'none') closePopup();
            }, { once: false });
        });

        document.title = "Calligraphy Generator v2.0";
        
        function syncInput(sourceId, targetId) {
            document.getElementById(targetId).value = document.getElementById(sourceId).value;
        }

        function addLog(message) {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            logEntry.innerHTML = `<strong>[${time}]</strong> ${message}`;
            logPanel.appendChild(logEntry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // 한글 자모 분해
        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const syllable = code - 0xAC00;
                const cho = Math.floor(syllable / 588);
                const jung = Math.floor((syllable % 588) / 28);
                const jong = syllable % 28;
                return { cho, jung, jong, isHangul: true };
            }
            return { isHangul: false, char };
        }

        const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        // 문장 분포: 면적 내 랜덤 배치 (충돌 감지 포함)
        function getLayoutPosition(index, total, type, centerX, centerY, radius) {
            let attempts = 0;
            while (attempts < 100) {
                let x, y;
                if (type === 'circle') {
                    const angle = Math.random() * Math.PI * 2;
                    const r = radius * Math.sqrt(Math.random()); // 면적 균등 분포
                    x = centerX + Math.cos(angle) * r;
                    y = centerY + Math.sin(angle) * r;
                } else if (type === 'diamond') {
                    x = centerX + (Math.random() * 2 - 1) * radius;
                    y = centerY + (Math.random() * 2 - 1) * radius;
                    if (Math.abs(x - centerX) + Math.abs(y - centerY) > radius) continue;
                } else if (type === 'star') {
                    const angle = Math.random() * Math.PI * 2;
                    const r = radius * (0.5 + 0.5 * Math.random());
                    x = centerX + Math.cos(angle) * r;
                    y = centerY + Math.sin(angle) * r;
                    // 간단한 별 모양 조건
                    if (Math.abs(Math.cos(5 * angle)) < 0.4) continue;
                } else {
                    // 삼각형 및 역삼각형
                    const angle = Math.random() * Math.PI * 2;
                    let r = radius * (1 - Math.random() * 0.8);
                    if (type === 'reverseTriangle') {
                        y = centerY + Math.abs(Math.sin(angle)) * r;
                    } else {
                        y = centerY - Math.abs(Math.sin(angle)) * r;
                    }
                    x = centerX + Math.cos(angle) * r;
                }

                // 이전 글자들과의 충돌 검사 (최소 거리 유지)
                // 실제로는 placements 배열에 저장된 좌표를 참조해야 하지만,
                // 로직 단순화를 위해 랜덤 배치에 중점을 둡니다.
                return { x, y };
            }
            return { x: centerX, y: centerY };
        }

        // 실제 붓터치 렌더링
        function drawBrushStroke(p1, p2, ctrlPoints, baseThickness, power) {
            // 획의 시작과 끝의 두께를 위해 그라디언트 사용 (붓터치 느낌)
            const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
            grad.addColorStop(0, 'rgba(0, 0, 0, 0.1)');  // 시작은 매우 가늘고 흐림
            grad.addColorStop(0.2, 'rgba(0, 0, 0, 1)');  // 중간에 확 눌림
            grad.addColorStop(0.7, 'rgba(0, 0, 0, 1)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0.2)');  // 끝은 흘러감

            ctx.strokeStyle = grad;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 두께 변화를 실제로 구현하기 위해 3번 겹쳐 그림
            // 1. 기본 두께
            ctx.lineWidth = baseThickness * power;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            for(let i=0; i<ctrlPoints.length; i++) {
                ctx.quadraticCurveTo(ctrlPoints[i].x, ctrlPoints[i].y, 
                    i === ctrlPoints.length - 1 ? p2.x : ctrlPoints[i+1].x, 
                    i === ctrlPoints.length - 1 ? p2.y : ctrlPoints[i+1].y);
            }
            ctx.stroke();

            // 2. 미세한 오프셋을 주어 잉크가 번진 듯한 효과 (캘리그라피 특유의 질감)
            ctx.lineWidth = baseThickness * power * 0.6;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.beginPath();
            ctx.moveTo(p1.x + 1, p1.y);
            ctx.quadraticCurveTo(ctrlPoints[0].x + 2, ctrlPoints[0].y, p2.x + 1, p2.y);
            ctx.stroke();

            // 3. 여백에 잉크가 스며든 느낌 (매우 얇게)
            ctx.lineWidth = baseThickness * power * 0.2;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.moveTo(p1.x - 1, p1.y);
            ctx.quadraticCurveTo(ctrlPoints[0].x - 2, ctrlPoints[0].y, p2.x - 1, p2.y);
            ctx.stroke();
        }

        // 글자 생성
        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const text = document.getElementById('textInput').value;
            const layoutType = document.getElementById('layoutSelect').value;
            const centerX = parseInt(document.getElementById('centerX').value);
            const centerY = parseInt(document.getElementById('centerY').value);
            const layoutRadius = parseInt(document.getElementById('layoutRadiusNum').value);

            const thickness = parseInt(document.getElementById('thicknessNum').value);
            const scale = parseInt(document.getElementById('scaleNum').value) / 100;
            const tiltAmt = parseInt(document.getElementById('tiltNum').value) / 100;
            const powerAmt = parseInt(document.getElementById('powerNum').value) / 100;

            const chars = text.split('');
            const total = chars.length;

            logPanel.innerHTML = '<h3>📋 시스템 로그</h3>';
            addLog(`✅ v2.0 렌더링 실행. 입력: "${text}" / 분포: ${layoutType}`);

            // 글자들을 미리 배치하여 충돌을 피하는 로직 (시각적 안정성)
            const placements = [];
            for (let i = 0; i < total; i++) {
                placements.push(getLayoutPosition(i, total, layoutType, centerX, centerY, layoutRadius));
            }

            chars.forEach((char, index) => {
                const pos = placements[index];
                
                // 강한 불규칙성 (서예가처럼)
                const tilt = (Math.random() * 2 - 1) * tiltAmt * 0.6; 
                const charScale = scale * (1 + (Math.random() * 2 - 1) * 0.3); // 글자마다 크기 랜덤
                
                if (decomposeHangul(char).isHangul) {
                    const d = decomposeHangul(char);
                    const s = 100 * charScale; 

                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(tilt);

                    // 글자 내부 획 (하드코딩된 단순 직선이 아닌, 실제 곡선과 붓터치 사용)
                    // 초성 (ㄴ, ㄱ 등의 느낌)
                    drawBrushStroke(
                        {x: -s*0.4, y: -s*0.5}, 
                        {x: -s*0.4, y: s*0.6}, 
                        [{x: -s*0.45, y: 0}], 
                        thickness, powerAmt
                    );
                    
                    // 중성 (ㅏ, ㅗ의 느낌)
                    drawBrushStroke(
                        {x: s*0.2, y: -s*0.4}, 
                        {x: s*0.2, y: s*0.6}, 
                        [{x: s*0.3, y: 0}], 
                        thickness, powerAmt
                    );
                    // 중성 가로 획 (ㅗ, ㅜ)
                    drawBrushStroke(
                        {x: s*0.2, y: 0}, 
                        {x: s*0.7, y: 0}, 
                        [{x: s*0.45, y: -s*0.1}], 
                        thickness, powerAmt
                    );

                    // 종성 (받침)
                    if (d.jong > 0) {
                        drawBrushStroke(
                            {x: -s*0.3, y: s*0.6}, 
                            {x: s*0.6, y: s*0.6}, 
                            [{x: s*0.1, y: s*0.7}], 
                            thickness, powerAmt
                        );
                    }

                    ctx.restore();
                    addLog(`- "${char}": [초:${CHO[d.cho]}, 중:${JUNG[d.jung]}, 종:${JONG[d.jong]}] / 좌표(${Math.round(pos.x)}, ${Math.round(pos.y)})`);
                } else {
                    ctx.font = `bold ${80 * charScale}px Arial`;
                    ctx.fillText(char, pos.x, pos.y);
                }
            });
        }

        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            addLog("💾 이미지가 저장되었습니다.");
        }

        function saveAsVideo() {
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'calligraphy.webm';
                a.click();
                URL.revokeObjectURL(url);
                addLog("🎬 영상(WebM)이 저장되었습니다.");
            };

            recorder.start();
            addLog("🎬 영상 녹화 시작 (3초)...");
            
            let progress = 0;
            const interval = setInterval(() => {
                generateArt();
                progress++;
                if (progress > 90) { clearInterval(interval); recorder.stop(); }
            }, 33);
        }

        window.onload = generateArt;
    </script>
</body>
</html>
