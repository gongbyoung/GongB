<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT 캘리그라피 스튜디오 v4.0 (직관적 제어)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
        :root { --bg-dark: #121214; --panel-bg: #1e1e24; --panel-border: #2d2d38; --accent-color: #ff6b35; --text-main: #f0f0f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #18181c; padding: 15px 24px; border-bottom: 1px solid var(--panel-border); }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* 왼쪽 UI 패널 - 깔끔하게 정리 */
        .sidebar { width: 300px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .preview-area { flex: 1; display: flex; flex-direction: column; background: #f4ecd8; align-items: center; justify-content: center; padding: 20px; position: relative; }
        .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 80vh; cursor: grab; background: #f4ecd8; }
        canvas { display: block; max-width: 100%; max-height: 80vh; object-fit: contain; pointer-events: none; }

        .player-controls { width: 100%; max-width: 960px; margin-top: 15px; background: var(--panel-bg); padding: 14px 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--panel-border); }
        .timeline-row { display: flex; align-items: center; gap: 12px; }
        .time-display { font-family: monospace; font-size: 0.9rem; color: var(--accent-color); min-width: 120px; }
        button.btn-action { background: linear-gradient(135deg, #ff6b35, #f72585); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1.05rem; }
        button.btn-secondary { background: #2b2b38; border: 1px solid var(--panel-border); color: var(--text-main); padding: 12px 16px; border-radius: 6px; cursor: pointer; }

        .section-title { font-size: 0.9rem; font-weight: 700; color: var(--accent-color); text-transform: uppercase; margin-bottom: 6px; }
        select, input[type="range"], input[type="text"], textarea { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; margin-bottom: 4px; }
        label { font-size: 0.82rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 6px; }
        input[type="file"] { display: none; }
        .btn-file { display: block; padding: 10px; background: #2a2a36; border: 1px solid var(--panel-border); border-radius: 6px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
        .srt-list-container { max-height: 120px; overflow-y: auto; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; }
        .srt-item { padding: 6px 10px; border-bottom: 1px solid #22222a; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; }
        .srt-item.active { background: rgba(255, 107, 55, 0.2); border-left: 3px solid var(--accent-color); }

        #log-panel { position: fixed; right: 10px; top: 10px; width: 280px; max-height: 80vh; background: rgba(30, 30, 36, 0.95); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; overflow-y: auto; z-index: 999; font-size: 0.8rem; }
        #log-panel h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .log-entry { border-bottom: 1px dashed #333; padding: 5px 0; color: var(--text-muted); }
        .log-entry strong { color: #4ecdc4; }
    </style>
</head>
<body>
    <header>
        <h1>🖌️ SRT 캘리그라피 스튜디오 v4.0 (직관적 조작)</h1>
    </header>
    <div class="main-container">
        <div class="sidebar">
            <div class="section-title">📂 로드</div>
            <label for="ttf-input" class="btn-file">📁 TTF 폰트</label>
            <input type="file" id="ttf-input" accept=".ttf, .otf">
            <div class="font-status" id="font-status" style="font-size: 0.8rem; color: #7cd992; margin-bottom: 10px;">기본 나눔붓글씨 사용 중</div>
            <select id="aspect-ratio-select">
                <option value="16:9" selected>🖥️ 16:9 가로</option>
                <option value="9:16">📱 9:16 세로</option>
            </select>
            <label for="srt-input" class="btn-file">📁 SRT 파일</label>
            <input type="file" id="srt-input" accept=".srt">
            <textarea id="srt-textarea" style="height: 80px; background: #141418;"></textarea>
            <button class="btn-action" id="btn-apply-srt" style="width:100%; margin-bottom: 10px;">✏️ 자막 적용하기</button>

            <!-- 전역 설정 -->
            <div class="section-title">🎨 글자 전체 변형</div>
            <label>전체 글자 크기 <span id="val-size">1.0x</span></label>
            <input type="range" id="global-size" min="0.5" max="2.0" step="0.05" value="1.0">
            
            <label>획 두껍게 <span id="val-thick">1.0x</span></label>
            <input type="range" id="global-thick" min="0.3" max="3.0" step="0.1" value="1.0">
            
            <label>획 길게 늘이기 <span id="val-len">1.0x</span></label>
            <input type="range" id="global-len" min="0.5" max="2.0" step="0.05" value="1.0">

            <label>전체 기울기 <span id="val-shear">0.0</span></label>
            <input type="range" id="global-shear" min="-0.5" max="0.5" step="0.01" value="0.0">

            <!-- 초성 -->
            <div class="section-title">🔷 초성</div>
            <label>중심에서 바깥으로 <span id="val-c-dist">0.0</span></label>
            <input type="range" id="cho-dist" min="-0.5" max="1.0" step="0.05" value="0.0">
            <label>초성만 크기 <span id="val-c-scale">1.0</span></label>
            <input type="range" id="cho-scale" min="0.5" max="2.0" step="0.05" value="1.0">

            <!-- 중성 -->
            <div class="section-title">🟩 중성</div>
            <label>중심에서 바깥으로 <span id="val-j-dist">0.0</span></label>
            <input type="range" id="jung-dist" min="-0.5" max="1.0" step="0.05" value="0.0">
            <label>중성만 크기 <span id="val-j-scale">1.0</span></label>
            <input type="range" id="jung-scale" min="0.5" max="2.0" step="0.05" value="1.0">

            <!-- 종성 -->
            <div class="section-title">🟦 종성</div>
            <label>중심에서 바깥으로 <span id="val-jg-dist">0.0</span></label>
            <input type="range" id="jong-dist" min="-0.5" max="1.0" step="0.05" value="0.0">
            <label>종성만 크기 <span id="val-jg-scale">1.0</span></label>
            <input type="range" id="jong-scale" min="0.5" max="2.0" step="0.05" value="1.0">
            
            <label for="mask-file-input" class="btn-file" style="margin-top:10px;">🖼️ 마스크 (선택)</label>
            <input type="file" id="mask-file-input" accept="image/*">
            <div class="section-title" style="margin-top:15px;">📜 세션 목록</div>
            <div class="srt-list-container" id="srt-list"></div>
        </div>

        <div class="preview-area">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
            </div>
            <div class="player-controls">
                <div class="timeline-row">
                    <button class="btn-secondary" id="btn-play">▶ 재생</button>
                    <input type="range" id="time-slider" min="0" max="100" value="0" step="0.01" style="flex:1;">
                    <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
                </div>
                <button class="btn-action" id="btn-export">🔴 녹화 시작 (자동 저장)</button>
            </div>
        </div>
    </div>
    <div id="log-panel">
        <h3>📊 렌더링 LOG</h3>
        <div id="log-messages"></div>
    </div>

    <script>
        const canvas = document.getElementById('calligraphy-canvas');
        const ctx = canvas.getContext('2d');
        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d');

        let srtData = [], totalDuration = 0, currentTime = 0, isPlaying = false, animationFrameId = null, lastTimestamp = 0;
        let currentFont = null;
        let hasMask = false;
        let currentMaskAlphaImage = null;

        // [핵심] 직관적인 설정값들
        let settings = {
            global: { size: 1.0, thick: 1.0, len: 1.0, shear: 0.0 },
            cho: { dist: 0.0, scale: 1.0 },
            jung: { dist: 0.0, scale: 1.0 },
            jong: { dist: 0.0, scale: 1.0 }
        };

        // UI 바인딩
        document.getElementById('global-size').addEventListener('input', (e) => { settings.global.size = parseFloat(e.target.value); document.getElementById('val-size').textContent = e.target.value + 'x'; renderFrame(currentTime); });
        document.getElementById('global-thick').addEventListener('input', (e) => { settings.global.thick = parseFloat(e.target.value); document.getElementById('val-thick').textContent = e.target.value + 'x'; renderFrame(currentTime); });
        document.getElementById('global-len').addEventListener('input', (e) => { settings.global.len = parseFloat(e.target.value); document.getElementById('val-len').textContent = e.target.value + 'x'; renderFrame(currentTime); });
        document.getElementById('global-shear').addEventListener('input', (e) => { settings.global.shear = parseFloat(e.target.value); document.getElementById('val-shear').textContent = e.target.value; renderFrame(currentTime); });

        document.getElementById('cho-dist').addEventListener('input', (e) => { settings.cho.dist = parseFloat(e.target.value); document.getElementById('val-c-dist').textContent = e.target.value; renderFrame(currentTime); });
        document.getElementById('cho-scale').addEventListener('input', (e) => { settings.cho.scale = parseFloat(e.target.value); document.getElementById('val-c-scale').textContent = e.target.value; renderFrame(currentTime); });

        document.getElementById('jung-dist').addEventListener('input', (e) => { settings.jung.dist = parseFloat(e.target.value); document.getElementById('val-j-dist').textContent = e.target.value; renderFrame(currentTime); });
        document.getElementById('jung-scale').addEventListener('input', (e) => { settings.jung.scale = parseFloat(e.target.value); document.getElementById('val-j-scale').textContent = e.target.value; renderFrame(currentTime); });

        document.getElementById('jong-dist').addEventListener('input', (e) => { settings.jong.dist = parseFloat(e.target.value); document.getElementById('val-jg-dist').textContent = e.target.value; renderFrame(currentTime); });
        document.getElementById('jong-scale').addEventListener('input', (e) => { settings.jong.scale = parseFloat(e.target.value); document.getElementById('val-jg-scale').textContent = e.target.value; renderFrame(currentTime); });

        function logMessage(msg) {
            const logDiv = document.getElementById('log-messages');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = msg;
            logDiv.prepend(div);
        }

        // 유니코드 분해
        const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const L = Math.floor((code - 0xAC00) / 588);
                const V = Math.floor((code - 0xAC00 - L * 588) / 28);
                const T = Math.floor((code - 0xAC00 - L * 588 - V * 28));
                return { cho: CHO[L], jung: JUNG[V], jong: JONG[T] };
            }
            return { cho: null, jung: null, jong: null };
        }

        // [핵심 수정] Path2D를 버리고 점(배열) 추출. Y축 변환을 하지 않음!
        function getPointsFromGlyph(char, size) {
            try {
                const path = currentFont.getPath(char, 0, 0, size);
                let pts = [];
                let cx = 0, cy = 0, sx = 0, sy = 0;
                const STEPS = 8; // 부드럽게 하기 위한 샘플링

                path.commands.forEach(c => {
                    if (c.type === 'M') { cx = c.x; cy = c.y; sx = cx; sy = cy; pts.push({x: cx, y: cy}); }
                    else if (c.type === 'L') { cx = c.x; cy = c.y; pts.push({x: cx, y: cy}); }
                    else if (c.type === 'C') {
                        for (let i = 1; i <= STEPS; i++) {
                            const t = i / STEPS, mt = 1 - t;
                            pts.push({
                                x: mt*mt*mt*cx + 3*mt*mt*t*c.x1 + 3*mt*t*t*c.x2 + t*t*t*c.x,
                                y: mt*mt*mt*cy + 3*mt*mt*t*c.y1 + 3*mt*t*t*c.y2 + t*t*t*c.y
                            });
                        }
                        cx = c.x; cy = c.y;
                    }
                    else if (c.type === 'Q') {
                        for (let i = 1; i <= STEPS; i++) {
                            const t = i / STEPS, mt = 1 - t;
                            pts.push({
                                x: mt*mt*cx + 2*mt*t*c.x1 + t*t*c.x,
                                y: mt*mt*cy + 2*mt*t*c.y1 + t*t*c.y
                            });
                        }
                        cx = c.x; cy = c.y;
                    }
                    else if (c.type === 'Z') { pts.push({x: sx, y: sy}); cx = sx; cy = sy; }
                });
                return pts;
            } catch(e) { return []; }
        }

        // [핵심 수정] 선을 직접 그리는 함수 (변환 행렬 적용됨)
        function drawSolidStroke(targetCtx, pts, lineWidth, alpha) {
            if (pts.length < 2) return;
            
            targetCtx.beginPath();
            targetCtx.moveTo(pts[0].x, pts[0].y);
            
            // 중간점 기준 부드러운 베지어 곡선으로 연결
            for (let i = 1; i < pts.length - 1; i++) {
                const midX = (pts[i].x + pts[i+1].x) / 2;
                const midY = (pts[i].y + pts[i+1].y) / 2;
                targetCtx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
            }
            targetCtx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);

            targetCtx.lineWidth = lineWidth;
            targetCtx.lineCap = 'round';
            targetCtx.lineJoin = 'round';
            targetCtx.strokeStyle = `rgba(30, 30, 30, ${alpha})`;

            targetCtx.stroke();
            // 진하게 한번 더
            targetCtx.lineWidth = lineWidth * 0.7;
            targetCtx.stroke();
        }

        // 6대 유형 및 그리드
        function getSyllableType(cho, jung, jong) {
            const vertical = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅣ'];
            const horizontal = ['ㅗ', 'ㅛ', 'ㅜ', 'ㅠ', 'ㅡ'];
            const compound = ['ㅘ', 'ㅙ', 'ㅚ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅢ'];

            if (vertical.includes(jung)) return jong ? 'Type4' : 'Type1';
            if (horizontal.includes(jung)) return jong ? 'Type5' : 'Type2';
            if (compound.includes(jung)) return jong ? 'Type6' : 'Type3';
            return 'Type1'; 
        }

        function getGridPositions(type) {
            switch(type) {
                case 'Type1': return { cho: { x: 0.25, y: 0.5 }, jung: { x: 0.75, y: 0.5 }, jong: null };
                case 'Type2': return { cho: { x: 0.5, y: 0.25 }, jung: { x: 0.5, y: 0.75 }, jong: null };
                case 'Type3': return { cho: { x: 0.35, y: 0.35 }, jung: { x: 0.75, y: 0.7 }, jong: null };
                case 'Type4': return { cho: { x: 0.25, y: 0.25 }, jung: { x: 0.75, y: 0.25 }, jong: { x: 0.5, y: 0.75 } };
                case 'Type5': return { cho: { x: 0.5, y: 0.16 }, jung: { x: 0.5, y: 0.5 }, jong: { x: 0.5, y: 0.84 } };
                case 'Type6': return { cho: { x: 0.35, y: 0.25 }, jung: { x: 0.75, y: 0.65 }, jong: { x: 0.5, y: 0.9 } };
                default: return { cho: { x: 0.5, y: 0.5 }, jung: { x: 0.5, y: 0.5 }, jong: null };
            }
        }

        // [핵심] 메인 렌더링
        function renderFrame(timeSec) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f4ecd8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (!isRecording) { ctx.strokeStyle = 'rgba(80, 120, 80, 0.6)'; ctx.setLineDash([8, 8]); ctx.strokeRect(canvas.width * 0.05, canvas.height * 0.05, canvas.width * 0.9, canvas.height * 0.9); }
            if (!currentFont) return;

            const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
            if (!activeSubtitle) return;
            const text = activeSubtitle.text.trim();

            // 전역 설정
            ctx.save();
            
            // 기울기 적용
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.transform(1, settings.global.shear, 0, 1, 0, 0);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            let currentX = canvas.width * 0.1;
            const fontSize = 180; // 기본 폰트 크기 (여기서 고정, 스케일은 변환행렬로 조절)
            const lineHeight = fontSize * 1.6;
            let currentY = canvas.height / 2 - lineHeight / 2;

            for (let char of text) {
                if (char === '\n') { currentY += lineHeight; currentX = canvas.width * 0.1; continue; }
                
                let charWidth = currentFont.getAdvanceWidth(char, fontSize) + 30; 

                ctx.save();
                
                // [핵심] Opentype Y축 뒤집기 (글자 방향 수정)
                ctx.translate(currentX, currentY);
                ctx.scale(1, -1);
                
                // [핵심] 전체 글자 크기
                ctx.scale(settings.global.size * settings.global.len, settings.global.size);

                // 글자 전체 중심 계산
                let fullBBox;
                try { fullBBox = currentFont.getPath(char, 0, 0, fontSize).getBoundingBox(); } catch(e) { fullBBox = {x1: 0, y1: -fontSize, x2: fontSize, y2: 0}; }

                const parts = decomposeHangul(char);
                const fullW = fullBBox.x2 - fullBBox.x1;
                const fullH = fullBBox.y2 - fullBBox.y1;
                const centerX = fullBBox.x1 + fullW / 2;
                const centerY = fullBBox.y1 + fullH / 2;

                // [핵심] 글자 중심으로 이동 후 그리기 시작
                ctx.translate(-centerX, -centerY);

                const lineWidth = 16 * settings.global.thick;
                const alpha = 0.85;

                const drawComponent = (compChar, gridPos, cfg) => {
                    if (!compChar) return;
                    const pts = getPointsFromGlyph(compChar, fontSize);
                    if (pts.length === 0) return;

                    const dx = gridPos.x - 0.5;
                    const dy = gridPos.y - 0.5;

                    // [핵심] 중심에서 바깥으로의 거리 조절
                    const targetX = (dx * (1 + cfg.dist)) * fullW;
                    const targetY = (dy * (1 + cfg.dist)) * fullH;

                    ctx.save();
                    ctx.translate(targetX, targetY);
                    ctx.scale(cfg.scale, cfg.scale);

                    drawSolidStroke(ctx, pts, lineWidth, alpha);

                    ctx.restore();
                };

                if (parts.cho && parts.jung) {
                    const type = getSyllableType(parts.cho, parts.jung, parts.jong);
                    const grid = getGridPositions(type);

                    drawComponent(parts.cho, grid.cho, settings.cho);
                    drawComponent(parts.jung, grid.jung, settings.jung);
                    if (parts.jong) drawComponent(parts.jong, grid.jong, settings.jong);
                } else {
                    // 영어, 숫자 등
                    const pts = getPointsFromGlyph(char, fontSize);
                    if (pts.length > 0) drawSolidStroke(ctx, pts, lineWidth, alpha);
                }

                ctx.restore(); // 글자 변환 행렬 복원

                currentX += charWidth;
                if (currentX > canvas.width * 0.9) { currentX = canvas.width * 0.1; currentY += lineHeight; }
            }

            ctx.restore(); // 전역 기울기 복원

            if (isRecording && hasMask && currentMaskAlphaImage) {
                ctx.globalCompositeOperation = 'destination-in';
                ctx.drawImage(currentMaskAlphaImage, 0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        // 초기화 및 기타 기본 로직 (이전과 동일)
        function parseSRT(text){ const n=text.replace(/\r/g,'\n'); const b=n.split('\n\n'); const r=[]; for(let bl of b){ const l=bl.trim().split('\n'); if(l.length>=3){ const tm=l[1].match(/(.*?)\s*-->\s*(.*)/); if(tm){ r.push({ id:l[0], start:parseTime(tm[1]), end:parseTime(tm[2]), text:l.slice(2).join('\n') }); } } } return r; }
        function parseTime(t){ if(!t) return 0; const p=t.trim().replace(',','.').split(':'); return(+p[0]||0)*3600+(+p[1]||0)*60+(+p[2]||0); }
        
        function loadSRTData(rawText){
            document.getElementById('srt-textarea').value=rawText;
            srtData = parseSRT(rawText);
            totalDuration = srtData.length>0 ? srtData[srtData.length-1].end+1.0 : 10;
            document.getElementById('time-slider').max = totalDuration;
            const el = document.getElementById('srt-list');
            el.innerHTML = '';
            srtData.forEach((i) => { const d = document.createElement('div'); d.className = 'srt-item'; d.innerHTML = `<span>#${i.id}</span> <span>${i.text.replace('\n',' ')}</span>`; el.appendChild(d); });
            logMessage("✅ 자막 적용 완료 (v4.0 직관적 UI)");
            renderFrame(0);
        }

        document.getElementById('btn-apply-srt').addEventListener('click', () => loadSRTData(document.getElementById('srt-textarea').value));
        document.getElementById('ttf-input').addEventListener('change', (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (evt) => { try { currentFont = opentype.parse(evt.target.result); logMessage(`폰트: ${file.name} 적용 완료`); renderFrame(0); } catch(err) { logMessage("⚠️ 폰트 로드 실패"); } }; reader.readAsArrayBuffer(file); });
        function togglePlay(){ if(isPlaying){pause();}else{play();} }
        function play(){ if(isPlaying)return; isPlaying=true; lastTimestamp=0; animationFrameId=requestAnimationFrame(animate); }
        function pause(){ isPlaying=false; if(animationFrameId)cancelAnimationFrame(animationFrameId); }
        function animate(t){ if(!isPlaying)return; if(!lastTimestamp)lastTimestamp=t; const d=(t-lastTimestamp)/1000; lastTimestamp=t; currentTime+=d; if(currentTime>totalDuration){ currentTime=totalDuration; pause(); } document.getElementById('time-slider').value=currentTime; renderFrame(currentTime); if(isPlaying)animationFrameId=requestAnimationFrame(animate); }
        document.getElementById('btn-play').addEventListener('click', togglePlay);
        let mediaRecorder=null,recordedChunks=[],stream=null, isRecording=false;
        function startRecording(){ pause(); currentTime=0; isRecording=true; renderFrame(0); if(!stream)stream=canvas.captureStream(30); recordedChunks=[]; mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:8000000}); mediaRecorder.ondataavailable=e=>{ if(e.data.size>0)recordedChunks.push(e.data); }; mediaRecorder.onstop=()=>{ const blob=new Blob(recordedChunks,{type:'video/webm'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`calligraphy_${Date.now()}.webm`; a.click(); URL.revokeObjectURL(url); isRecording=false; renderFrame(currentTime); logMessage("✅ 녹화 저장 완료"); }; mediaRecorder.start(100); play(); logMessage("🔴 녹화 시작"); }
        document.getElementById('btn-export').addEventListener('click', startRecording);
        document.getElementById('aspect-ratio-select').addEventListener('change', () => { const r = document.getElementById('aspect-ratio-select').value; canvas.width = r==='9:16'?1080:1920; canvas.height = r==='9:16'?1920:1080; maskCanvas.width = canvas.width; maskCanvas.height = canvas.height; renderFrame(0); });

        document.getElementById('mask-file-input').addEventListener('change', async (e) => { const file = e.target.files[0]; if(!file) return; const img = new Image(); img.onload = async () => { const w = canvas.width, h = canvas.height; const off = document.createElement('canvas'); off.width = w; off.height = h; const octx = off.getContext('2d'); octx.drawImage(img, 0, 0, w, h); const imgData = octx.getImageData(0, 0, w, h); const d = imgData.data; for (let i = 0; i < d.length; i += 4) { const brightness = (d[i] + d[i+1] + d[i+2]) / 3; const srcAlpha = d[i+3]; d[i] = 255; d[i+1] = 255; d[i+2] = 255; d[i+3] = srcAlpha < 10 ? 0 : brightness; } octx.putImageData(imgData, 0, 0); const outImg = new Image(); outImg.onload = () => { currentMaskAlphaImage = outImg; hasMask = true; }; outImg.src = off.toDataURL(); }; img.src = URL.createObjectURL(file); });

        (async()=>{ try{ const font=await new Promise((resolve,reject)=>opentype.load("https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf",(err,f)=>err?reject(err):resolve(f))); currentFont=font; document.getElementById('font-status').textContent='✅ 기본 나눔붓글씨 준비 완료'; }catch(e){ document.getElementById('font-status').textContent='⚠️ 기본 폰트 실패'; } renderFrame(0); })();
        const demoSRT = `1\n00:00:00,000 --> 00:00:04,500\n황혼이 오늘도 바다가 되어\n\n2\n00:00:05,000 --> 00:00:08,500\n잠기고 잠기고\n\n3\n00:00:09,000 --> 00:00:13,000\n오늘이 가장 행복한 날`;
        loadSRTData(demoSRT);
    </script>
</body>
</html>
