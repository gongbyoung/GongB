<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Generator v6.0</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f4; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .controls-panel { width: 350px; background: white; border-right: 2px solid #ddd; padding: 20px; overflow-y: auto; }
        .version-title { font-size: 22px; font-weight: 900; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #2196F3; }
        .control-group { margin-bottom: 15px; border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fafafa; }
        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .input-row input[type="range"] { flex: 1; }
        .input-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        select, input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .main-area { flex: 1; display: flex; flex-direction: column; }
        .canvas-container { flex: 1; padding: 20px; background: white; margin: 20px; border: 2px dashed #2196F3; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; border: 1px solid rgba(33,150,243,0.3); }
        .log-panel { width: 300px; background: #1e1e1e; color: #00ff00; font-family: 'Courier New', monospace; font-size: 13px; padding: 20px; overflow-y: auto; }
        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        #popup { background: white; padding: 30px; border-radius: 15px; max-width: 500px; text-align: center; }
        #popup button { width: auto; padding: 10px 30px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay">
        <div id="popup">
            <h1>🎨 캘리그라피 생성기</h1>
            <h2 style="color: #555;">버전 6.0 (진짜 붓터치 궤적)</h2>
            <hr>
            <p>이 버전은 폰트를 사용하지 않습니다. 글자의 획을 직접 그리며, 획의 각 구간마다 두께가 실시간으로 변합니다.</p>
            <button onclick="closePopup()">닫기</button>
        </div>
    </div>

    <div class="controls-panel">
        <div class="version-title">🎛️ Calligraphy v6.0</div>
        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="사랑은 아름다워" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>획 스타일 (9가지)</label>
            <select id="strokeStyleSelect" onchange="generateArt()">
                <option value="1-1">1-1: 굵고→얇고→굵고</option>
                <option value="1-2">1-2: 굵고→마지막 얇고</option>
                <option value="1-3" selected>1-3: 얇고→굵고→얇고→길게</option>
                <option value="1-4">1-4: 유려한 곡선 (출렁)</option>
                <option value="1-5">1-5: 처음/끝 갈라짐</option>
                <option value="1-6">1-6: 끝 물방울 (먹물)</option>
                <option value="1-7">1-7: 모음 윗부분 물방울</option>
                <option value="1-8">1-8: 받침 늘이기</option>
                <option value="1-9">1-9: 기본 혼합형</option>
            </select>
        </div>

        <div class="control-group">
            <label>붓터치 설정</label>
            <div class="input-row">
                <label>기본 굵기</label>
                <input type="range" id="thicknessRange" min="10" max="60" value="30" oninput="syncInput('thicknessRange', 'thicknessNum')">
                <input type="number" id="thicknessNum" value="30" oninput="syncInput('thicknessNum', 'thicknessRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>불규칙성</label>
                <input type="range" id="tiltRange" min="0" max="100" value="40" oninput="syncInput('tiltRange', 'tiltNum')">
                <input type="number" id="tiltNum" value="40" oninput="syncInput('tiltNum', 'tiltRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
    </div>
    <div class="log-panel" id="logPanel">
        <h3>📋 시스템 로그</h3>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');
        const overlay = document.getElementById('overlay');
        window.onload = generateArt;

        function closePopup() { overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 500); }
        ['mousemove', 'click'].forEach(e => window.addEventListener(e, () => { if (overlay.style.display !== 'none') closePopup(); }));
        function syncInput(s, t) { document.getElementById(t).value = document.getElementById(s).value; }
        function addLog(m) { const div = document.createElement('div'); div.className = 'log-entry'; div.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`; logPanel.appendChild(div); logPanel.scrollTop = logPanel.scrollHeight; }

        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const syllable = code - 0xAC00;
                const cho = Math.floor(syllable / 588);
                const jung = Math.floor((syllable % 588) / 28);
                const jong = syllable % 28;
                return { cho, jung, jong, isHangul: true };
            }
            return { isHangul: false, char };
        }

        function getSequentialPosition(index, total, centerX, centerY, radius, randomness) {
            const step = radius * 2 / Math.max(1, total - 1);
            const baseX = centerX - radius + step * index;
            return { x: baseX + (Math.random() * 2 - 1) * randomness * 30, y: centerY + (Math.random() * 2 - 1) * randomness * 50 };
        }

        // 9가지 굵기 함수
        function getWidth(t, style, base) {
            switch(style) {
                case '1-1': return base * (Math.abs(t - 0.5) * 1.6 + 0.2);
                case '1-2': return base * (1 - t * 0.9);
                case '1-3': return base * (Math.sin(t * Math.PI) * 0.7 + 0.3);
                case '1-4': return base * (Math.sin(t * Math.PI * 4) * 0.3 + 0.7);
                case '1-5': return base * (t < 0.1 || t > 0.9 ? 0.2 : 1);
                case '1-6': return base * (t < 0.9 ? 1 : 0.4);
                case '1-7': return base * (t < 0.2 ? 0.5 : 1);
                case '1-8': return base * (0.5 + t * 0.8);
                default: return base * (0.6 + Math.sin(t * Math.PI) * 0.4);
            }
        }

        // 진짜 붓터치 그리기 (곡선을 타고가며 두께 변화)
        function drawBrushStroke(p1, ctrl, p2, style, base, isHorizontalEnd = false) {
            ctx.lineCap = 'round';
            const segments = 40;
            let prevX = p1.x, prevY = p1.y;

            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                // 2차 베지어 공식
                const x = (1-t)*(1-t)*p1.x + 2*(1-t)*t*ctrl.x + t*t*p2.x;
                const y = (1-t)*(1-t)*p1.y + 2*(1-t)*t*ctrl.y + t*t*p2.y;

                let w = getWidth(t, style, base);
                
                // 가로 획의 끝(삐침) 처리: 오른쪽으로 갈수록 얇아지며 길게 늘어남
                if (isHorizontalEnd && t > 0.7) {
                    w *= (1 - t) * 2;
                    x += (t - 0.7) * 50; // 오른쪽으로 길게 늘어남
                }

                ctx.beginPath();
                ctx.moveTo(prevX, prevY);
                ctx.lineTo(x, y);
                ctx.lineWidth = w;
                ctx.stroke();

                prevX = x; prevY = y;
            }
        }

        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const text = document.getElementById('textInput').value;
            const style = document.getElementById('strokeStyleSelect').value;
            const thickness = parseInt(document.getElementById('thicknessNum').value);
            const randomness = parseInt(document.getElementById('tiltNum').value) / 100;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 250;

            const chars = text.split('');
            const total = chars.length;
            logPanel.innerHTML = '<h3>📋 시스템 로그</h3>';
            addLog(`✅ v6.0 붓터치 적용. 스타일: ${style}`);

            chars.forEach((char, index) => {
                const pos = getSequentialPosition(index, total, cx, cy, radius, randomness);
                const tilt = (Math.random() * 2 - 1) * 0.2;
                const s = 100;

                if (decomposeHangul(char).isHangul) {
                    const d = decomposeHangul(char);

                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(tilt);

                    // [초성] 'ㄴ' 형태의 세로 획과 꺾임
                    drawBrushStroke({x: -s*0.4, y: -s*0.5}, {x: -s*0.5, y: 0}, {x: -s*0.4, y: s*0.5}, style, thickness);
                    drawBrushStroke({x: -s*0.4, y: s*0.5}, {x: -s*0.2, y: s*0.7}, {x: -s*0.1, y: s*0.5}, style, thickness);
                    
                    // [중성] 'ㅏ' 형태의 세로 획과 가로 획
                    drawBrushStroke({x: s*0.2, y: -s*0.5}, {x: s*0.3, y: 0}, {x: s*0.2, y: s*0.5}, style, thickness);
                    // 가로 획 (삐침 적용)
                    drawBrushStroke({x: s*0.2, y: 0}, {x: s*0.4, y: -s*0.1}, {x: s*0.7, y: 0}, style, thickness, true);
                    
                    // [종성]
                    if (d.jong > 0) {
                        drawBrushStroke({x: -s*0.3, y: s*0.5}, {x: 0, y: s*0.6}, {x: s*0.5, y: s*0.5}, style, thickness, true);
                    }

                    ctx.restore();
                    addLog(`- "${char}" 초/중/종 획을 붓터치로 렌더링 완료`);
                }
            });
        }

        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
