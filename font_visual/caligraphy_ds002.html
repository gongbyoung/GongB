<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 캘리그라피 스튜디오 v1.009</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

  <style>
    :root { --bg-dark: #121214; --panel-bg: #1e1e24; --panel-border: #2d2d38; --accent-color: #ff6b35; --accent-gradient: linear-gradient(135deg, #ff6b35, #f72585); --text-main: #f0f0f5; --text-muted: #a0a0b0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #18181c; padding: 12px 24px; border-bottom: 1px solid var(--panel-border); }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .preview-area { flex: 1; display: flex; flex-direction: column; background: #f4ecd8; align-items: center; justify-content: center; padding: 20px; position: relative; }
    .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 70vh; cursor: grab; background: #f4ecd8; }
    canvas { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; pointer-events: none; }
    
    .player-controls { width: 100%; max-width: 960px; margin-top: 15px; background: var(--panel-bg); padding: 14px 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--panel-border); }
    .timeline-row { display: flex; align-items: center; gap: 12px; }
    .time-display { font-family: monospace; font-size: 0.9rem; color: var(--accent-color); min-width: 120px; }
    button.btn-action { background: var(--accent-gradient); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1.05rem; }
    button.btn-secondary { background: #2b2b38; border: 1px solid var(--panel-border); color: var(--text-main); padding: 12px 16px; border-radius: 6px; cursor: pointer; }

    select, input[type="range"], input[type="text"], textarea { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; margin-bottom: 4px; }
    label { font-size: 0.82rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 6px; }
    input[type="file"] { display: none; }
    .btn-file { display: block; padding: 10px; background: #2a2a36; border: 1px solid var(--panel-border); border-radius: 6px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
    .srt-list-container { max-height: 150px; overflow-y: auto; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; }
    .srt-item { padding: 6px 10px; border-bottom: 1px solid #22222a; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; }
    .srt-item.active { background: rgba(255, 107, 55, 0.2); border-left: 3px solid var(--accent-color); }

    #log-panel { position: fixed; right: 10px; top: 10px; width: 280px; max-height: 80vh; background: rgba(30, 30, 36, 0.95); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; overflow-y: auto; z-index: 999; font-size: 0.8rem; }
    #log-panel h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid #444; padding-bottom: 5px; }
    .log-entry { border-bottom: 1px dashed #333; padding: 5px 0; color: var(--text-muted); }
    .log-entry strong { color: #4ecdc4; }
    
    details { background: #222; padding: 10px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
    summary { font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>🖌️ SRT 캘리그라피 스튜디오 v1.009 (완전 안정화)</h1>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="section-title">📂 1. 기본</div>
      <label for="ttf-input" class="btn-file">📁 TTF 폰트</label>
      <input type="file" id="ttf-input" accept=".ttf, .otf">
      <div class="font-status" id="font-status" style="font-size: 0.8rem; color: #7cd992; margin-bottom: 10px;">기본 나눔붓글씨 사용 중</div>
      
      <select id="aspect-ratio-select">
        <option value="16:9" selected>🖥️ 16:9 가로</option>
        <option value="9:16">📱 9:16 세로</option>
      </select>

      <label for="srt-input" class="btn-file">📁 SRT 파일</label>
      <input type="file" id="srt-input" accept=".srt">
      <textarea id="srt-textarea" style="height: 80px; background: #141418;"></textarea>
      <button class="btn-action" id="btn-apply-srt" style="width:100%; margin-bottom: 10px;">✏️ 자막 적용하기 (렌더링)</button>

      <details open>
        <summary>🎨 2. 붓터치 설정</summary>
        <label>획 굵기 (POWER) <span id="val-power">1.0x</span></label>
        <input type="range" id="power-slider" min="0.1" max="3.0" step="0.1" value="1.0">
        <label>획 시작 굵기 <span id="val-start">1.0x</span></label>
        <input type="range" id="start-slider" min="0.1" max="2.0" step="0.1" value="1.0">
        <label>유선형 (부드러움) <span id="val-smooth">0.5</span></label>
        <input type="range" id="smooth-slider" min="0.0" max="1.0" step="0.1" value="0.5">
        <label>글자 기울기 <span id="val-rhythm">0.5</span></label>
        <input type="range" id="rhythm-slider" min="0.0" max="1.0" step="0.1" value="0.5">
      </details>

      <details>
        <summary>🎛️ 3. 세션 위치/크기</summary>
        <div id="session-controls">
          <label>위치 X <span id="val-x">0</span></label>
          <input type="range" id="session-x" min="-500" max="500" step="10" value="0">
          <label>위치 Y <span id="val-y">0</span></label>
          <input type="range" id="session-y" min="-500" max="500" step="10" value="0">
          <label>크기 <span id="val-scale">1.0x</span></label>
          <input type="range" id="session-scale" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
      </details>

      <label for="mask-file-input" class="btn-file" style="margin-top:10px;">🖼️ 마스크 이미지 (선택)</label>
      <input type="file" id="mask-file-input" accept="image/*">
      
      <div class="section-title" style="margin-top:15px;">📜 4. 세션 목록</div>
      <div class="srt-list-container" id="srt-list"></div>
    </div>

    <div class="preview-area">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
      </div>
      <div class="player-controls">
        <div class="timeline-row">
          <button class="btn-secondary" id="btn-play">▶ 재생</button>
          <input type="range" id="time-slider" min="0" max="100" value="0" step="0.01" style="flex:1;">
          <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <button class="btn-action" id="btn-export">🔴 녹화 시작 (자동 저장)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="log-panel">
    <h3>📊 렌더링 LOG</h3>
    <div id="log-messages"></div>
  </div>

  <script>
    function logMessage(msg) {
      const logDiv = document.getElementById('log-messages');
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = msg;
      logDiv.prepend(div);
      if(logDiv.children.length > 30) logDiv.removeChild(logDiv.lastChild);
    }

    const canvas = document.getElementById('calligraphy-canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');
    
    let srtData = [], totalDuration = 0, currentTime = 0, isPlaying = false, animationFrameId = null, lastTimestamp = 0;
    let currentFont = null;
    let selectedSessionIndex = 0;
    let isRecording = false;

    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');
    let currentMaskAlphaImage = null;
    let hasMask = false;

    const powerSlider = document.getElementById('power-slider');
    const startSlider = document.getElementById('start-slider');
    const smoothSlider = document.getElementById('smooth-slider');
    const rhythmSlider = document.getElementById('rhythm-slider');
    
    const power = () => parseFloat(powerSlider.value);
    const startPressure = () => parseFloat(startSlider.value);
    const smoothVal = () => parseFloat(smoothSlider.value);
    const rhythm = () => parseFloat(rhythmSlider.value);

    function getStyleParams() {
      return { power: power(), start: startPressure(), smooth: smoothVal(), rhythm: rhythm() };
    }

    function getActiveBounds() {
      return { x: canvas.width * 0.1, y: canvas.height * 0.1, w: canvas.width * 0.8, h: canvas.height * 0.8 };
    }

    // [핵심] 자동 줄바꿈 & 절대 겹치지 않는 배치 (AdvanceWidth 사용)
    function layoutSessionText(text, bounds, sp, session) {
      let cleanText = text.replace(/\r/g, '').replace(/\n/g, ' ');
      const maxWidth = bounds.w * 0.9;
      const offsetX = session.x || 0; const offsetY = session.y || 0; const globalScale = session.scale || 1.0;
      
      // 글자 크기 결정 (한 줄 최대 길이 대비)
      let fontSize = bounds.w / Math.max(1, cleanText.length * 0.65);
      fontSize = Math.min(fontSize, bounds.h / 4);
      fontSize = Math.max(40, fontSize * globalScale); // 최소 크기 보장

      // 줄바꿈 로직
      let lines = [];
      let currentLine = "";
      let currentWidth = 0;
      
      for (let char of cleanText) {
        let charWidth = currentFont.getAdvanceWidth(char, fontSize); // 절대 NaN이 없는 정확한 값
        if (currentWidth + charWidth > maxWidth && currentLine !== "") {
          lines.push(currentLine);
          currentLine = char;
          currentWidth = charWidth;
        } else {
          currentLine += char;
          currentWidth += charWidth;
        }
      }
      if (currentLine) lines.push(currentLine);

      const lineHeight = fontSize * 1.15;
      const totalHeight = lines.length * lineHeight;
      const startY = (bounds.y + bounds.h / 2 - totalHeight / 2) + offsetY;

      const positions = [];
      const sizes = [];

      lines.forEach((lineText, lineIdx) => {
        let totalLineWidth = 0;
        let lineChars = Array.from(lineText);
        let lineWidths = lineChars.map(ch => currentFont.getAdvanceWidth(ch, fontSize));
        totalLineWidth = lineWidths.reduce((a, b) => a + b, 0);

        // 중앙 정렬
        let currentX = (bounds.x + bounds.w / 2 - totalLineWidth / 2) + offsetX;
        
        lineChars.forEach((ch, idx) => {
          let rot = (seededRandom(idx + lineIdx) - 0.5) * 0.2 * sp.rhythm;
          positions.push({ x: currentX, y: startY + lineIdx * lineHeight, ch, rot });
          sizes.push(fontSize);
          currentX += lineWidths[idx];
        });
      });

      return { positions, sizes };
    }

    function seededRandom(seed){let x=Math.sin(seed++)*10000;return x-Math.floor(x);}

    // [핵심] Path2D를 안전하게 가져오기
    function getGlyphPathData(char, fontSize) {
      const key = `${currentFont?.familyName || 'font'}|${char.codePointAt(0)}|${fontSize.toFixed(1)}`;
      if (glyphDataCache.has(key)) return glyphDataCache.get(key);
      
      let p2d = null;
      try {
        const path = currentFont.getPath(char, 0, 0, fontSize);
        const svgD = path.toPathData ? path.toPathData() : commandsToSvgD(path.commands);
        p2d = new Path2D(svgD);
      } catch(e) {
        p2d = null;
      }
      
      const data = { p2d, char, isBlank: p2d === null };
      glyphDataCache.set(key, data);
      return data;
    }

    function commandsToSvgD(commands) {
      return commands.map(c => {
        switch(c.type) {
          case 'M': return `M ${c.x} ${c.y}`;
          case 'L': return `L ${c.x} ${c.y}`;
          case 'C': return `C ${c.x1} ${c.y1} ${c.x2} ${c.y2} ${c.x} ${c.y}`;
          case 'Q': return `Q ${c.x1} ${c.y1} ${c.x} ${c.y}`;
          case 'Z': return 'Z';
          default: return '';
        }
      }).join(' ');
    }

    // [핵심] 진한 먹물 + 붓터치 렌더링 (Fill 고정)
    function renderFrame(timeSec) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      if (!isRecording) drawGuideFrame();
      if (!currentFont) return;
      
      const sp = getStyleParams();
      const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
      if (!activeSubtitle) return;
      const text = activeSubtitle.text.trim();
      const duration = Math.max(0.5, activeSubtitle.end - activeSubtitle.start);
      const writeProgress = Math.min(1, (timeSec - activeSubtitle.start) / (duration * 0.7));
      
      const bounds = getActiveBounds();
      const { positions, sizes } = layoutSessionText(text, bounds, sp, activeSubtitle.session || {x:0, y:0, scale:1});
      
      maskCtx.clearRect(0, 0, canvas.width, canvas.height);
      maskCtx.fillStyle = '#1c1917'; // 먹색 고정
      maskCtx.strokeStyle = '#1c1917';

      // 각 글자 그리기
      positions.forEach((pos, i) => {
        const ch = pos.ch;
        if (ch === ' ') return;
        
        const data = getGlyphPathData(ch, sizes[i]);
        if (!data.p2d) return;

        maskCtx.save();
        maskCtx.translate(pos.x, pos.y);
        maskCtx.rotate(pos.rot || 0);
        maskCtx.translate(-pos.x, -pos.y);

        // 붓터치 표현 (다층 구조 & 그림자)
        maskCtx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        maskCtx.shadowBlur = 2 + sp.smooth * 6; // 유선형 값이 높을 수록 번짐
        maskCtx.globalAlpha = 0.9;
        maskCtx.fill(data.p2d, 'nonzero'); // 먼저 채우고
        
        maskCtx.lineJoin = 'round';
        maskCtx.lineCap = 'round';
        
        // 두께 레이어 (POWER 적용)
        maskCtx.lineWidth = sp.power * 2.0;
        maskCtx.globalAlpha = 0.8;
        maskCtx.stroke(data.p2d); // 가장자리를 둥글게 두껍게

        maskCtx.lineWidth = sp.power * 1.0;
        maskCtx.globalAlpha = 1.0;
        maskCtx.stroke(data.p2d);

        maskCtx.restore();
      });

      // 마스크 클리핑
      if (isRecording && hasMask && currentMaskAlphaImage) {
        maskCtx.globalCompositeOperation = 'destination-in'; 
        maskCtx.drawImage(currentMaskAlphaImage, 0, 0, canvas.width, canvas.height); 
        maskCtx.globalCompositeOperation = 'source-over'; 
      }
      
      ctx.drawImage(maskCanvas, 0, 0);
    }

    function drawBackground() {
      ctx.fillStyle = '#f4ecd8'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGuideFrame() {
      if (isRecording) return; 
      ctx.save();
      ctx.strokeStyle = 'rgba(80, 120, 80, 0.6)'; 
      ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      const bounds = getActiveBounds();
      ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
      ctx.restore();
    }

    function normalizeMaskAlpha(img) {
      return new Promise(resolve => {
        const w = canvas.width, h = canvas.height;
        const off = document.createElement('canvas'); off.width = w; off.height = h;
        const octx = off.getContext('2d'); octx.drawImage(img, 0, 0, w, h);
        const imgData = octx.getImageData(0, 0, w, h); const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const brightness = (d[i] + d[i+1] + d[i+2]) / 3; const srcAlpha = d[i+3];
          const a = srcAlpha < 10 ? 0 : brightness;
          d[i] = 255; d[i+1] = 255; d[i+2] = 255; d[i+3] = a;
        }
        octx.putImageData(imgData, 0, 0);
        const outImg = new Image(); outImg.onload = () => resolve(outImg); outImg.src = off.toDataURL();
      });
    }

    function parseSRT(text){ const n=text.replace(/\r/g,'\n'); const b=n.split('\n\n'); const r=[]; for(let bl of b){ const l=bl.trim().split('\n'); if(l.length>=3){ const tm=l[1].match(/(.*?)\s*-->\s*(.*)/); if(tm){ r.push({ id:l[0], start:parseTime(tm[1]), end:parseTime(tm[2]), text:l.slice(2).join('\n'), session:{x:0,y:0,scale:1.0} }); } } } return r; }
    function parseTime(t){ if(!t) return 0; const p=t.trim().replace(',','.').split(':'); return(+p[0]||0)*3600+(+p[1]||0)*60+(+p[2]||0); }
    
    function loadSRTData(rawText){
      document.getElementById('srt-textarea').value=rawText;
      srtData = parseSRT(rawText);
      totalDuration = srtData.length>0 ? srtData[srtData.length-1].end+1.0 : 10;
      document.getElementById('time-slider').max = totalDuration;
      updateSRTListUI();
      selectedSessionIndex = 0;
      loadSessionControls(0);
      logMessage("✅ 자막 적용 완료");
      renderFrame(0);
    }

    function updateSRTListUI(){ const el=document.getElementById('srt-list'); el.innerHTML=''; srtData.forEach((i,idx)=>{ const d=document.createElement('div'); d.className='srt-item'+(idx===selectedSessionIndex?' active':''); d.innerHTML=`<span>#${i.id}</span> <span>${i.text.replace('\n',' ')}</span>`; d.onclick=()=>{ selectedSessionIndex=idx; loadSessionControls(idx); updateSRTListUI(); }; el.appendChild(d); }); }
    
    function loadSessionControls(idx){
      if (!srtData[idx]) return;
      const session = srtData[idx].session || {x:0, y:0, scale:1.0};
      document.getElementById('session-x').value = session.x;
      document.getElementById('session-y').value = session.y;
      document.getElementById('session-scale').value = session.scale;
      document.getElementById('val-x').textContent = Math.round(session.x);
      document.getElementById('val-y').textContent = Math.round(session.y);
      document.getElementById('val-scale').textContent = session.scale.toFixed(1) + 'x';
    }

    document.getElementById('btn-apply-srt').addEventListener('click', () => loadSRTData(document.getElementById('srt-textarea').value));
    
    document.getElementById('session-x').addEventListener('input',(e)=>{ if(srtData[selectedSessionIndex]){ srtData[selectedSessionIndex].session.x=parseInt(e.target.value); document.getElementById('val-x').textContent=e.target.value; }});
    document.getElementById('session-y').addEventListener('input',(e)=>{ if(srtData[selectedSessionIndex]){ srtData[selectedSessionIndex].session.y=parseInt(e.target.value); document.getElementById('val-y').textContent=e.target.value; }});
    document.getElementById('session-scale').addEventListener('input',(e)=>{ if(srtData[selectedSessionIndex]){ srtData[selectedSessionIndex].session.scale=parseFloat(e.target.value); document.getElementById('val-scale').textContent=e.target.value; }});

    document.getElementById('power-slider').addEventListener('input',(e)=>{ document.getElementById('val-power').textContent=e.target.value+'x'; });
    document.getElementById('start-slider').addEventListener('input',(e)=>{ document.getElementById('val-start').textContent=e.target.value+'x'; });
    document.getElementById('smooth-slider').addEventListener('input',(e)=>{ document.getElementById('val-smooth').textContent=e.target.value; });
    document.getElementById('rhythm-slider').addEventListener('input',(e)=>{ document.getElementById('val-rhythm').textContent=e.target.value; });

    document.getElementById('ttf-input').addEventListener('change', (e) => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => { currentFont = opentype.parse(evt.target.result); logMessage(`폰트: ${file.name} 적용 완료. [자막 적용]을 눌러주세요.`); };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('mask-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if(!file) return;
      const img = new Image();
      img.onload = async () => { currentMaskAlphaImage = await normalizeMaskAlpha(img); hasMask = true; logMessage("마스크 적용 완료."); };
      img.src = URL.createObjectURL(file);
    });

    document.getElementById('aspect-ratio-select').addEventListener('change',()=>{ const r=document.getElementById('aspect-ratio-select').value; canvas.width=r==='9:16'?1080:1920; canvas.height=r==='9:16'?1920:1080; maskCanvas.width=canvas.width; maskCanvas.height=canvas.height; logMessage("비율 변경. [자막 적용]을 눌러주세요."); });

    function togglePlay(){ if(isPlaying){pause();}else{play();} }
    function play(){ if(isPlaying)return; isPlaying=true; lastTimestamp=0; animationFrameId=requestAnimationFrame(animate); }
    function pause(){ isPlaying=false; if(animationFrameId)cancelAnimationFrame(animationFrameId); }
    function animate(t){ if(!isPlaying)return; if(!lastTimestamp)lastTimestamp=t; const d=(t-lastTimestamp)/1000; lastTimestamp=t; currentTime+=d; if(isRecording&&currentTime>=totalDuration){ currentTime=totalDuration; stopRecording(); return; } if(currentTime>totalDuration){ currentTime=totalDuration; pause(); } document.getElementById('time-slider').value=currentTime; document.getElementById('time-display').textContent=`${formatTime(currentTime)} / ${formatTime(totalDuration)}`; renderFrame(currentTime); if(isPlaying)animationFrameId=requestAnimationFrame(animate); }
    function formatTime(s){ const m=Math.floor(s/60),ss=Math.floor(s%60),ms=Math.floor((s%1)*100); return`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(ms).padStart(2,'0')}`; }

    let mediaRecorder=null,recordedChunks=[],stream=null;
    function startRecording(){ pause(); currentTime=0; isRecording=true; renderFrame(0); if(!stream)stream=canvas.captureStream(30); const mimeTypes=['video/webm;codecs=vp9','video/webm;codecs=vp8']; let mimeType=''; for(const m of mimeTypes){ if(MediaRecorder.isTypeSupported(m)){ mimeType=m; break; } } if(!mimeType){ alert('녹화 미지원'); isRecording=false; return; } recordedChunks=[]; mediaRecorder=new MediaRecorder(stream,{mimeType:mimeType,videoBitsPerSecond:8000000}); mediaRecorder.ondataavailable=e=>{ if(e.data.size>0)recordedChunks.push(e.data); }; mediaRecorder.onstop=()=>{ const blob=new Blob(recordedChunks,{type:mimeType}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`calligraphy_${Date.now()}.webm`; a.click(); URL.revokeObjectURL(url); isRecording=false; renderFrame(currentTime); logMessage('✅ 녹화 저장 완료!'); }; mediaRecorder.start(100); play(); logMessage('🔴 녹화 시작!'); }
    function stopRecording(){ if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop(); pause(); }

    document.getElementById('btn-play').addEventListener('click', togglePlay);
    document.getElementById('btn-export').addEventListener('click', startRecording);
    document.getElementById('time-slider').addEventListener('input',(e)=>{ currentTime=parseFloat(e.target.value); renderFrame(currentTime); });
    document.getElementById('srt-input').addEventListener('change',(e)=>{ const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=(evt)=>loadSRTData(evt.target.result); reader.readAsText(file); });

    const glyphDataCache = new Map(); 
    (async()=>{ 
      try{ 
        const font=await new Promise((resolve,reject)=>opentype.load("https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf",(err,f)=>err?reject(err):resolve(f))); 
        currentFont=font; 
        document.getElementById('font-status').textContent='✅ 기본 나눔붓글씨 준비 완료'; 
        logMessage("<strong>[폰트]</strong> 나눔붓글씨 로딩 성공");
      }catch(e){ 
        document.getElementById('font-status').textContent='⚠️ 기본 폰트 실패, TTF 업로드 필요'; 
      } 
      renderFrame(0); 
    })();

    const demoSRT = `1\n00:00:00,000 --> 00:00:04,500\n황혼이 오늘도 바다가 되어\n\n2\n00:00:05,000 --> 00:00:08,500\n잠기고 잠기고\n\n3\n00:00:09,000 --> 00:00:13,000\n오늘이 가장 행복한 날`;
    loadSRTData(demoSRT);
  </script>
