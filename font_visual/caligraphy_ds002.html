<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Generator v3.0</title>
    <!-- 실제 폰트 로드 (Google Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .controls-panel {
            width: 350px;
            background: white;
            border-right: 2px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        .version-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #2196F3;
            color: #333;
        }

        .control-group {
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
        }

        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .input-row input[type="range"] { flex: 1; }
        .input-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        select, input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .btn-save-video { background-color: #ff9800; color: white; }

        .main-area { flex: 1; display: flex; flex-direction: column; }
        .canvas-container {
            flex: 1; padding: 20px; background: white; margin: 20px;
            border: 2px dashed #2196F3; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        canvas { max-width: 100%; max-height: 100%; border: 1px solid rgba(33, 150, 243, 0.3); box-sizing: border-box; }

        .log-panel {
            width: 300px; background: #1e1e1e; color: #00ff00;
            font-family: 'Courier New', monospace; font-size: 13px; padding: 20px;
            border-left: 2px solid #444; overflow-y: auto;
        }
        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; font-size: 12px; }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        #popup { background: white; padding: 30px; border-radius: 15px; max-width: 500px; text-align: center; }
        #popup h1 { margin-top: 0; color: #2196F3; }
        #popup p { line-height: 1.6; font-size: 16px; text-align: left; }
        #popup button { width: auto; padding: 10px 30px; background: #2196F3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="popup">
            <h1>🎨 캘리그라피 생성기</h1>
            <h2 style="color: #555;">버전 3.0 (9가지 붓터치 + 실제 폰트 연계)</h2>
            <hr>
            <p>
                <b>📖 사용 방법</b><br><br>
                1. 문장을 입력하고, 배치 모양과 붓터치 스타일을 선택하세요.<br>
                2. 이제 글자들은 순서를 유지하며 자연스럽게 배치됩니다.<br>
                3. 각 글자마다 크기, 기울기, 회전이 랜덤하게 적용되어 역동감을 줍니다.<br>
                4. 마우스를 움직이면 팝업이 사라집니다.
            </p>
            <button onclick="closePopup()">닫기</button>
        </div>
    </div>

    <div class="controls-panel">
        <div class="version-title">🎛️ Calligraphy v3.0</div>

        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="사랑은 아름다워" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>문장 분포 (순서 유지)</label>
            <select id="layoutSelect" onchange="generateArt()">
                <option value="flow">자연스러운 흐름 (왼→오)</option>
                <option value="circle">원형 흐름</option>
                <option value="triangle">삼각형 흐름</option>
                <option value="reverseTriangle" selected>역삼각형 흐름</option>
                <option value="diamond">마름모 흐름</option>
            </select>
            <div class="input-row">
                <label>영역 크기</label>
                <input type="range" id="layoutRadiusRange" min="100" max="500" value="280" oninput="syncInput('layoutRadiusRange', 'layoutRadiusNum')">
                <input type="number" id="layoutRadiusNum" value="280" oninput="syncInput('layoutRadiusNum', 'layoutRadiusRange'); generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>붓터치 스타일 (9가지)</label>
            <select id="strokeStyleSelect" onchange="generateArt()">
                <option value="1-1">1-1: 굵고-얇고-굵고</option>
                <option value="1-2">1-2: 굵고-마지막 얇고</option>
                <option value="1-3">1-3: 얇고-굵고-얇고-길게</option>
                <option value="1-4">1-4: 유려한 곡선 (출렁)</option>
                <option value="1-5">1-5: 처음/끝 갈라짐</option>
                <option value="1-6" selected>1-6: 모두 같고, 끝 물방울</option>
                <option value="1-7">1-7: 모음 윗부분 물방울</option>
                <option value="1-8">1-8: ㄴ,ㅜ,ㅗ,ㅡ,ㄹ,ㄷ,ㅛ 받침 늘이기</option>
                <option value="1-9">1-9: 기본 혼합형</option>
            </select>
        </div>

        <div class="control-group">
            <label>붓터치 설정</label>
            <div class="input-row">
                <label>기본 획 굵기</label>
                <input type="range" id="thicknessRange" min="5" max="50" value="22" oninput="syncInput('thicknessRange', 'thicknessNum')">
                <input type="number" id="thicknessNum" value="22" oninput="syncInput('thicknessNum', 'thicknessRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>불규칙성 (역동감)</label>
                <input type="range" id="tiltRange" min="0" max="100" value="60" oninput="syncInput('tiltRange', 'tiltNum')">
                <input type="number" id="tiltNum" value="60" oninput="syncInput('tiltNum', 'tiltRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
        <button class="btn-save-video" onclick="saveAsVideo()">🎬 영상 저장 (WebM)</button>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
    </div>

    <div class="log-panel" id="logPanel">
        <h3>📋 시스템 로그</h3>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');
        const overlay = document.getElementById('overlay');

        // 폰트 로드 대기 후 렌더링
        window.onload = () => {
            document.fonts.ready.then(() => {
                generateArt();
            });
        };

        function closePopup() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
        }
        ['mousemove', 'keydown', 'click'].forEach(e => window.addEventListener(e, () => {
            if (overlay.style.display !== 'none') closePopup();
        }));

        function syncInput(sourceId, targetId) {
            document.getElementById(targetId).value = document.getElementById(sourceId).value;
        }

        function addLog(message) {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            logEntry.innerHTML = `<strong>[${time}]</strong> ${message}`;
            logPanel.appendChild(logEntry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // [핵심 1] 순서를 유지하는 배치
        function getSequentialPosition(index, total, type, centerX, centerY, radius, randomness) {
            let baseX, baseY;
            
            if (type === 'flow') {
                // 왼쪽에서 오른쪽으로 자연스럽게
                const step = radius * 1.5 / Math.max(1, total - 1);
                baseX = centerX - (radius * 0.75) + step * index;
                baseY = centerY;
            } else {
                const angle = (index / total) * Math.PI * 2; // 순서대로 각도 증가
                if (type === 'circle') {
                    baseX = centerX + Math.cos(angle) * radius;
                    baseY = centerY + Math.sin(angle) * radius;
                } else if (type === 'diamond') {
                    baseX = centerX + Math.cos(angle) * radius * 0.8;
                    baseY = centerY + Math.sin(angle) * radius;
                } else if (type === 'triangle') {
                    let r = radius * (1 - 0.2 * Math.abs(Math.cos(angle * 1.5)));
                    baseX = centerX + Math.cos(angle) * r;
                    baseY = centerY - Math.abs(Math.sin(angle)) * r;
                } else { // reverseTriangle
                    let r = radius * (1 - 0.2 * Math.abs(Math.cos(angle * 1.5)));
                    baseX = centerX + Math.cos(angle) * r;
                    baseY = centerY + Math.abs(Math.sin(angle)) * r;
                }
            }

            // 순서는 지키되, 주변으로 자유롭게 랜덤 오프셋
            const offsetX = (Math.random() * 2 - 1) * randomness * 30;
            const offsetY = (Math.random() * 2 - 1) * randomness * 30;

            return { x: baseX + offsetX, y: baseY + offsetY };
        }

        // [핵심 2] 9가지 붓터치 스타일을 적용한 렌더링
        function drawStroke(p1, p2, ctrl, thickness, style, power) {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const drawPath = () => {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                for (let i = 0; i < ctrl.length; i++) {
                    ctx.quadraticCurveTo(ctrl[i].x, ctrl[i].y, 
                        i === ctrl.length - 1 ? p2.x : ctrl[i + 1].x, 
                        i === ctrl.length - 1 ? p2.y : ctrl[i + 1].y);
                }
            };

            switch (style) {
                case '1-1': // 굵고-얇고-굵고
                    for (let i = 0; i < 3; i++) {
                        ctx.lineWidth = thickness * (i === 1 ? 0.4 : 1);
                        ctx.strokeStyle = `rgba(0,0,0,${0.6 + i * 0.2})`;
                        drawPath();
                        ctx.stroke();
                    }
                    break;

                case '1-2': // 처음 굵고, 마지막 얇고
                    ctx.lineWidth = thickness;
                    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
                    drawPath(); ctx.stroke();
                    
                    ctx.lineWidth = thickness * 0.3;
                    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.quadraticCurveTo(ctrl[0].x, ctrl[0].y, p2.x, p2.y); // 끝부분을 얇게
                    ctx.stroke();
                    break;

                case '1-3': // 얇고-굵고-얇고-길게
                    ctx.lineWidth = thickness * 0.3;
                    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
                    drawPath(); ctx.stroke();
                    
                    ctx.lineWidth = thickness * 1.2;
                    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.quadraticCurveTo(ctrl[0].x * 1.2, ctrl[0].y * 1.2, p2.x * 1.3, p2.y * 1.3); // 길게 뻗침
                    ctx.stroke();
                    break;

                case '1-4': // 유려한 곡선 (출렁)
                    const waveCtrl = [
                        { x: (p1.x + p2.x) / 2 + 20, y: (p1.y + p2.y) / 2 - 20 },
                        { x: (p1.x + p2.x) / 2 - 10, y: (p1.y + p2.y) / 2 + 30 },
                        { x: p2.x, y: p2.y }
                    ];
                    ctx.lineWidth = thickness * 0.8;
                    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.bezierCurveTo(waveCtrl[0].x, waveCtrl[0].y, waveCtrl[1].x, waveCtrl[1].y, p2.x, p2.y);
                    ctx.stroke();
                    break;

                case '1-5': // 갈라짐 (로고)
                    ctx.lineWidth = thickness * 0.8;
                    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
                    drawPath(); ctx.stroke();
                    
                    // 처음 갈라짐
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.quadraticCurveTo(p1.x - 15, p1.y + 10, p1.x - 30, p1.y + 20);
                    ctx.stroke();
                    
                    // 끝 갈라짐
                    ctx.beginPath();
                    ctx.moveTo(p2.x, p2.y);
                    ctx.quadraticCurveTo(p2.x + 15, p2.y + 10, p2.x + 30, p2.y + 20);
                    ctx.stroke();
                    break;

                case '1-6': // 끝 물방울 (먹물)
                    ctx.lineWidth = thickness;
                    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
                    drawPath(); ctx.stroke();
                    
                    // 물방울 퍼짐
                    ctx.beginPath();
                    ctx.arc(p2.x, p2.y + 5, thickness * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(p2.x + 2, p2.y, thickness * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fill();
                    break;

                case '1-7': // 모음 윗부분 물방울 (중성 상단)
                    ctx.lineWidth = thickness * 0.7;
                    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
                    drawPath(); ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(p1.x, p1.y + 10, thickness * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fill();
                    break;

                case '1-8': // 받침 늘이기 (ㅗ,ㅜ,ㄴ 등)
                    // 중성이나 종성이 가로로 뻗는 글자에서 길게 늘어나는 효과
                    const longCtrl = { x: p2.x + 50, y: p2.y };
                    ctx.lineWidth = thickness * 0.6;
                    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.quadraticCurveTo(longCtrl.x, longCtrl.y, p2.x + 100, p2.y);
                    ctx.stroke();
                    break;

                default: // 1-9 기본 혼합
                    const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                    grad.addColorStop(0, 'rgba(0,0,0,1)');
                    grad.addColorStop(1, 'rgba(0,0,0,0.2)');
                    ctx.lineWidth = thickness * power;
                    ctx.strokeStyle = grad;
                    drawPath(); ctx.stroke();
            }
        }

        // 한글 자모 분해 (폰트 좌표의 기준점 계산용)
        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const syllable = code - 0xAC00;
                const cho = Math.floor(syllable / 588);
                const jung = Math.floor((syllable % 588) / 28);
                const jong = syllable % 28;
                return { cho, jung, jong, isHangul: true };
            }
            return { isHangul: false, char };
        }

        const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const text = document.getElementById('textInput').value;
            const layoutType = document.getElementById('layoutSelect').value;
            const radius = parseInt(document.getElementById('layoutRadiusNum').value);
            const thickness = parseInt(document.getElementById('thicknessNum').value);
            const randomness = parseInt(document.getElementById('tiltNum').value) / 100;
            const strokeStyle = document.getElementById('strokeStyleSelect').value;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const chars = text.split('');
            const total = chars.length;

            logPanel.innerHTML = '<h3>📋 시스템 로그</h3>';
            addLog(`✅ v3.0 렌더링. 스타일: ${strokeStyle}`);

            // 문자별 불규칙성 적용
            chars.forEach((char, index) => {
                // 순서 유지 + 랜덤 오프셋
                const pos = getSequentialPosition(index, total, layoutType, centerX, centerY, radius, randomness);
                
                // 글자 고유의 랜덤 크기/기울기/회전 (역동감)
                const charScale = 1 + (Math.random() * 2 - 1) * 0.3;
                const tilt = (Math.random() * 2 - 1) * 0.4;

                if (decomposeHangul(char).isHangul) {
                    const d = decomposeHangul(char);
                    
                    // 실제 폰트 (Nanum Brush Script)를 캔버스에 로드
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(tilt);
                    ctx.scale(charScale, charScale);
                    
                    ctx.font = `140px 'Nanum Brush Script', cursive`;
                    ctx.fillStyle = 'transparent'; // 글자 자체는 투명하게
                    ctx.fillText(char, -70, 40); // 폰트 중심 맞추기

                    // 폰트의 획을 따라서 캘리그라피 스타일을 적용할 수 있도록,
                    // 각 획을 대략적인 좌표로 잡아 9가지 스타일을 입힘
                    // (실제로는 SVG Path를 추출해야 하지만, 여기서는 효율적인 근사치 사용)
                    const size = 140;
                    
                    // 초성 획 (왼쪽)
                    drawStroke(
                        {x: -size*0.4, y: -size*0.5}, 
                        {x: -size*0.4, y: size*0.5}, 
                        [{x: -size*0.45, y: 0}], 
                        thickness * charScale, strokeStyle, randomness
                    );

                    // 중성 획 (오른쪽 세로)
                    drawStroke(
                        {x: size*0.2, y: -size*0.5}, 
                        {x: size*0.2, y: size*0.5}, 
                        [{x: size*0.25, y: 0}], 
                        thickness * charScale, strokeStyle, randomness
                    );

                    // 중성 가로 획 (ㅗ, ㅜ 등)
                    drawStroke(
                        {x: size*0.2, y: 0}, 
                        {x: size*0.7, y: 0}, 
                        [{x: size*0.45, y: -size*0.05}], 
                        thickness * charScale, strokeStyle, randomness
                    );

                    // 종성 (받침) - 1-8 스타일 연계를 위해 특정 종성일 때 길게 늘어남
                    if (d.jong > 0) {
                        drawStroke(
                            {x: -size*0.3, y: size*0.5}, 
                            {x: size*0.6, y: size*0.5}, 
                            [{x: size*0.1, y: size*0.55}], 
                            thickness * charScale, strokeStyle, randomness
                        );
                    }
                    
                    ctx.restore();
                    
                    addLog(`- "${char}": [초:${CHO[d.cho]}, 중:${JUNG[d.jung]}, 종:${JONG[d.jong]}] / 좌표(${Math.round(pos.x)}, ${Math.round(pos.y)}) / 크기 ${Math.round(charScale * 100)}%`);
                }
            });
        }

        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            addLog("💾 이미지가 저장되었습니다.");
        }

        function saveAsVideo() {
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'calligraphy.webm';
                a.click();
                URL.revokeObjectURL(url);
                addLog("🎬 영상(WebM)이 저장되었습니다.");
            };

            recorder.start();
            addLog("🎬 영상 녹화 시작 (3초)...");
            let progress = 0;
            const interval = setInterval(() => {
                generateArt();
                progress++;
                if (progress > 90) { clearInterval(interval); recorder.stop(); }
            }, 33);
        }
    </script>
</body>
</html>
