<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT 캘리그라피 스튜디오 v1.036 (SRT 로딩 수정)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root { --bg-dark: #121214; --panel-bg: #1e1e24; --panel-border: #2d2d38; --accent-color: #ff6b35; --text-main: #f0f0f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #18181c; padding: 15px 24px; border-bottom: 1px solid var(--panel-border); }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 320px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
        .right-panel { width: 280px; background: var(--panel-bg); border-left: 1px solid var(--panel-border); padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .preview-area { flex: 1; display: flex; flex-direction: column; background: #f4ecd8; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 80vh; background: #f4ecd8; }
        canvas { display: block; max-width: 100%; max-height: 80vh; object-fit: contain; pointer-events: none; }
        .player-controls { width: 100%; max-width: 960px; margin-top: 15px; background: var(--panel-bg); padding: 14px 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--panel-border); }
        .timeline-row { display: flex; align-items: center; gap: 12px; }
        .time-display { font-family: monospace; font-size: 0.9rem; color: var(--accent-color); min-width: 130px; }
        button.btn-action { background: linear-gradient(135deg, #ff6b35, #f72585); color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
        button.btn-secondary { background: #2b2b38; border: 1px solid var(--panel-border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.82rem; }
        .section-title { font-size: 0.85rem; font-weight: 800; color: var(--accent-color); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        select, input[type="range"], input[type="text"], textarea { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; }
        label { font-size: 0.8rem; color: #a0a0b0; display: flex; justify-content: space-between; margin-top: 6px; }
        input[type="file"] { display: none; }
        .btn-file { display: block; padding: 9px; background: #2a2a36; border: 1px dashed #4a4a6e; border-radius: 6px; text-align: center; cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--text-main); }
        .srt-list-container { max-height: 110px; overflow-y: auto; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; }
        .srt-item { padding: 6px 8px; border-bottom: 1px solid #22222a; font-size: 0.78rem; cursor: pointer; display: flex; justify-content: space-between; }
        .srt-item:hover { background: #1e1e28; }
        .srt-item.active { background: rgba(255, 107, 55, 0.2); border-left: 3px solid var(--accent-color); }
        
        .char-list-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .char-chip { background: #2a2a36; border: 1px solid #444; border-radius: 4px; text-align: center; padding: 6px 0; font-size: 1.1rem; cursor: pointer; user-select: none; }
        .char-chip:hover { border-color: var(--accent-color); }
        .char-chip.active { background: var(--accent-color); color: white; font-weight: bold; border-color: var(--accent-color); }
        .char-controls { display: none; background: #16161a; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .char-controls.active { display: block; }

        .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .style-check { background: #2a2a36; border: 1px solid #444; border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; font-size: 0.75rem; }
        .style-check:hover { border-color: var(--accent-color); }
        .style-check.active { background: var(--accent-color); color: white; border-color: var(--accent-color); font-weight: bold; }
        .style-check input { display: none; }

        #log-panel { position: fixed; right: 300px; top: 10px; width: 240px; max-height: 80vh; background: rgba(30, 30, 36, 0.95); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; overflow-y: auto; z-index: 999; font-size: 0.75rem; }
        #log-panel h3 { color: var(--accent-color); margin-bottom: 8px; font-size: 0.95rem; border-bottom: 1px solid #444; padding-bottom: 4px; }
        .log-entry { border-bottom: 1px dashed #333; padding: 4px 0; color: #8a8ab8; }
    </style>
</head>
<body>
    <header>
        <h1>🖌️ SRT 캘리그라피 스튜디오 v1.036 (SRT 로딩 수정)</h1>
    </header>
    <div class="main-container">
        <!-- 좌측 패널 -->
        <div class="sidebar">
            <div class="section-title">📂 폰트 및 자막</div>
            <label for="ttf-input" class="btn-file">📁 TTF 폰트 열기</label>
            <input type="file" id="ttf-input" accept=".ttf, .otf">
            <div id="font-status" style="font-size: 0.75rem; color: #7cd992;">기본 나눔붓글씨 로드 완료</div>
            <select id="aspect-ratio-select">
                <option value="16:9" selected>🖥️ 16:9 가로</option>
                <option value="9:16">📱 9:16 세로 쇼츠</option>
            </select>
            <label for="srt-input" class="btn-file">📁 SRT 파일 불러오기</label>
            <input type="file" id="srt-input" accept=".srt">
            <textarea id="srt-textarea" style="height: 55px;" placeholder="또는 SRT 내용을 직접 입력하세요"></textarea>
            <button class="btn-action" id="btn-apply-srt" style="width:100%;">자막 분석 적용</button>

            <div class="section-title">🎨 전체 문장 붓터치 (중복 선택)</div>
            <div id="global-style-grid" class="style-grid"></div>

            <div class="section-title">🎚️ 전역 수동 조정</div>
            <label>자간 거리 <span id="val-spacing">0.88</span></label>
            <input type="range" id="global-spacing" min="0.6" max="1.5" step="0.02" value="0.88">
            <label>전체 기울기 <span id="val-shear">-0.08</span></label>
            <input type="range" id="global-shear" min="-0.3" max="0.3" step="0.01" value="-0.08">
            
            <div class="section-title">🔷 메쉬 왜곡 (수동)</div>
            <label>초성 강조 <span id="val-cho-warp">0.20</span></label>
            <input type="range" id="cho-warp" min="-0.5" max="0.8" step="0.05" value="0.20">
            <label>중성 신장 <span id="val-jung-warp">0.15</span></label>
            <input type="range" id="jung-warp" min="-0.5" max="0.8" step="0.05" value="0.15">
            <label>종성 받침 <span id="val-jong-warp">0.25</span></label>
            <input type="range" id="jong-warp" min="-0.5" max="0.8" step="0.05" value="0.25">

            <div class="section-title">📤 에셋 추출</div>
            <button class="btn-secondary" id="btn-svg" style="width:100%;">📐 실벡터 SVG 추출</button>
            <button class="btn-action" id="btn-offline" style="width:100%; margin-top: 4px;">🔴 60FPS 무손실 WebM</button>
            
            <label for="mask-file-input" class="btn-file" style="margin-top:6px;">🖼️ 화선지 마스크</label>
            <input type="file" id="mask-file-input" accept="image/*">
            <div class="srt-list-container" id="srt-list"></div>
        </div>

        <!-- 중앙 캔버스 -->
        <div class="preview-area">
            <div class="canvas-wrapper">
                <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
            </div>
            <div class="player-controls">
                <div class="timeline-row">
                    <button class="btn-secondary" id="btn-play">▶ 재생</button>
                    <input type="range" id="time-slider" min="0" max="100" value="0" step="0.01" style="flex:1;">
                    <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
                </div>
                <button class="btn-action" id="btn-export">🔴 실시간 녹화 시작</button>
            </div>
        </div>

        <!-- 우측 패널 -->
        <div class="right-panel">
            <div class="section-title">🔤 글자 개별 제어</div>
            <div style="font-size:0.75rem; color:#888;">클릭하여 선택 후 미세 조형</div>
            <div id="char-list" class="char-list-grid"></div>
            
            <button class="btn-secondary" id="btn-clear-override" style="width:100%;">모든 개별 설정 초기화</button>

            <div id="char-controls" class="char-controls">
                <div class="section-title" id="char-target-title" style="font-size: 0.8rem; margin-bottom: 8px;">글자 변형</div>
                
                <label>이 글자에 적용할 붓터치</label>
                <div id="char-style-grid" class="style-grid"></div>

                <label>개별 X 이동 <span id="val-c-x">0px</span></label>
                <input type="range" id="char-x" min="-80" max="80" step="1" value="0">
                <label>개별 Y 이동 <span id="val-c-y">0px</span></label>
                <input type="range" id="char-y" min="-80" max="80" step="1" value="0">
                <label>개별 크기 <span id="val-c-scale">1.00x</span></label>
                <input type="range" id="char-scale" min="0.5" max="2.0" step="0.05" value="1.0">
                <label>개별 삐침 <span id="val-c-whisk">12</span></label>
                <input type="range" id="char-whisker" min="0" max="30" step="1" value="12">
                <label>개별 먹물 <span id="val-c-infill">0.70</span></label>
                <input type="range" id="char-infill" min="0" max="1.0" step="0.05" value="0.70">
                <button class="btn-secondary" id="btn-reset-char" style="width:100%; margin-top: 10px;">이 글자 초기화</button>
            </div>
        </div>
    </div>

    <div id="log-panel">
        <h3>📊 엔진 로그</h3>
        <div id="log-messages"></div>
    </div>

    <script>
        const styleList = [
            { id: 'soft', name: '둥글둥글' },
            { id: 'sharp', name: '뾰족' },
            { id: 'contrast', name: '강약' },
            { id: 'ink', name: '농담' },
            { id: 'deform', name: '자유변형' },
            { id: 'curve', name: '곡선구도' },
            { id: 'seal', name: '전서체' },
            { id: 'dry', name: '갈필' },
            { id: 'bold', name: '농묵' }
        ];

        const styleParams = {
            soft:     { spacing: 0.85, shear: -0.04, bristles: 24, whiskerLen: 4,  infillDepth: 0.5,  choWarp: 0.25, jungWarp: 0.10, jongWarp: 0.20 },
            sharp:    { spacing: 0.94, shear: -0.12, bristles: 8,  whiskerLen: 20, infillDepth: 0.3,  choWarp: 0.10, jungWarp: 0.30, jongWarp: 0.15 },
            contrast: { spacing: 0.88, shear: -0.08, bristles: 16, whiskerLen: 12, infillDepth: 0.7,  choWarp: 0.40, jungWarp: 0.05, jongWarp: 0.45 },
            ink:      { spacing: 0.88, shear: -0.08, bristles: 18, whiskerLen: 10, infillDepth: 0.95, choWarp: 0.20, jungWarp: 0.15, jongWarp: 0.25 },
            deform:   { spacing: 0.90, shear: -0.08, bristles: 14, whiskerLen: 8,  infillDepth: 0.6,  choWarp: 0.50, jungWarp: 0.40, jongWarp: 0.30 },
            curve:    { spacing: 0.80, shear: -0.02, bristles: 16, whiskerLen: 10, infillDepth: 0.6,  choWarp: 0.10, jungWarp: 0.50, jongWarp: 0.10 },
            seal:     { spacing: 0.72, shear: 0.00,  bristles: 32, whiskerLen: 0,  infillDepth: 0.9,  choWarp: 0.80, jungWarp: 0.80, jongWarp: 0.80 },
            dry:      { spacing: 0.92, shear: -0.05, bristles: 8,  whiskerLen: 24, infillDepth: 0.25, choWarp: 0.15, jungWarp: 0.10, jongWarp: 0.20 },
            bold:     { spacing: 0.82, shear: -0.10, bristles: 26, whiskerLen: 8,  infillDepth: 0.9,  choWarp: 0.30, jungWarp: 0.20, jongWarp: 0.35 }
        };

        let settings = { spacing: 0.88, shear: -0.08, bristles: 16, whiskerLen: 12, infillDepth: 0.70, choWarp: 0.20, jungWarp: 0.15, jongWarp: 0.25 };
        let selectedGlobalStyles = [];
        let charOverrides = {};
        let selectedCharIndex = null;
        let lastBuiltText = "";

        const canvas = document.getElementById('calligraphy-canvas');
        const ctx = canvas.getContext('2d');
        const scratchCv = document.createElement('canvas');
        const scratchCtx = scratchCv.getContext('2d');
        
        function syncScratchpad(w, h) {
            if (scratchCv.width !== w || scratchCv.height !== h) { scratchCv.width = w; scratchCv.height = h; }
            scratchCtx.setTransform(1, 0, 0, 1, 0, 0);
            scratchCtx.clearRect(0, 0, w, h);
        }

        let srtData = [], totalDuration = 0, currentTime = 0, isPlaying = false, animationFrameId = null, lastTimestamp = 0;
        let currentFont = null;
        let hasMask = false, currentMaskAlphaImage = null;
        let isRecording = false, mediaRecorder = null, recordedChunks = [], stream = null;
        let lastRenderedPaths = [], lastBrushStrokes = [];

        // 스타일 체크박스 그리드 생성 함수
        function createStyleGrid(containerId, callback) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            styleList.forEach(style => {
                const div = document.createElement('div');
                div.className = 'style-check';
                div.textContent = style.name;
                div.dataset.styleId = style.id;
                div.addEventListener('click', () => {
                    div.classList.toggle('active');
                    const selected = Array.from(container.querySelectorAll('.active')).map(el => el.dataset.styleId);
                    callback(selected);
                });
                container.appendChild(div);
            });
        }

        function calculateSettings(selectedIds) {
            if (selectedIds.length === 0) {
                return { spacing: 0.88, shear: -0.08, bristles: 16, whiskerLen: 12, infillDepth: 0.70, choWarp: 0.20, jungWarp: 0.15, jongWarp: 0.25 };
            }
            const keys = ['spacing', 'shear', 'bristles', 'whiskerLen', 'infillDepth', 'choWarp', 'jungWarp', 'jongWarp'];
            let sum = {}; keys.forEach(k => sum[k] = 0);
            selectedIds.forEach(id => {
                const sp = styleParams[id];
                keys.forEach(k => sum[k] += sp[k]);
            });
            let result = {};
            keys.forEach(k => result[k] = sum[k] / selectedIds.length);
            return result;
        }

        createStyleGrid('global-style-grid', (selected) => {
            selectedGlobalStyles = selected;
            settings = { ...settings, ...calculateSettings(selected) };
            document.getElementById('global-spacing').value = settings.spacing;
            document.getElementById('val-spacing').textContent = settings.spacing.toFixed(2);
            document.getElementById('global-shear').value = settings.shear;
            document.getElementById('val-shear').textContent = settings.shear.toFixed(2);
            document.getElementById('cho-warp').value = settings.choWarp;
            document.getElementById('val-cho-warp').textContent = settings.choWarp.toFixed(2);
            document.getElementById('jung-warp').value = settings.jungWarp;
            document.getElementById('val-jung-warp').textContent = settings.jungWarp.toFixed(2);
            document.getElementById('jong-warp').value = settings.jongWarp;
            document.getElementById('val-jong-warp').textContent = settings.jongWarp.toFixed(2);
            renderFrame(currentTime);
            logMessage(`전역 붓터치 조합 적용: ${selected.length}개 선택`);
        });

        createStyleGrid('char-style-grid', (selected) => {
            if (selectedCharIndex === null) return;
            if (!charOverrides[selectedCharIndex]) {
                charOverrides[selectedCharIndex] = { dx: 0, dy: 0, scale: 1.0, styles: [] };
            }
            charOverrides[selectedCharIndex].styles = selected;
            renderFrame(currentTime);
        });

        function syncCharControls() {
            const controls = document.getElementById('char-controls');
            if (selectedCharIndex === null) { controls.classList.remove('active'); return; }
            controls.classList.add('active');
            const o = charOverrides[selectedCharIndex] || {};
            
            document.getElementById('char-x').value = o.dx || 0;
            document.getElementById('val-c-x').textContent = (o.dx || 0) + 'px';
            document.getElementById('char-y').value = o.dy || 0;
            document.getElementById('val-c-y').textContent = (o.dy || 0) + 'px';
            document.getElementById('char-scale').value = o.scale || 1.0;
            document.getElementById('val-c-scale').textContent = (o.scale || 1.0).toFixed(2) + 'x';
            document.getElementById('char-whisker').value = (o.whiskerLen !== undefined ? o.whiskerLen : settings.whiskerLen);
            document.getElementById('val-c-whisk').textContent = (o.whiskerLen !== undefined ? o.whiskerLen : settings.whiskerLen);
            document.getElementById('char-infill').value = (o.infillDepth !== undefined ? o.infillDepth : settings.infillDepth);
            document.getElementById('val-c-infill').textContent = (o.infillDepth !== undefined ? o.infillDepth : settings.infillDepth).toFixed(2);

            const grid = document.getElementById('char-style-grid');
            grid.querySelectorAll('.style-check').forEach(el => {
                el.classList.toggle('active', (o.styles || []).includes(el.dataset.styleId));
            });
        }

        const bindInput = (id, target, spanId, isFloat = true, suffix = '') => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(spanId);
            el.addEventListener('input', (e) => {
                settings[target] = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value);
                if (valEl) valEl.textContent = e.target.value + suffix;
                renderFrame(currentTime);
            });
        };
        bindInput('global-spacing', 'spacing', 'val-spacing');
        bindInput('global-shear', 'shear', 'val-shear');
        bindInput('cho-warp', 'choWarp', 'val-cho-warp');
        bindInput('jung-warp', 'jungWarp', 'val-jung-warp');
        bindInput('jong-warp', 'jongWarp', 'val-jong-warp');

        const bindCharInput = (id, target, spanId, isFloat = true, suffix = '') => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(spanId);
            el.addEventListener('input', (e) => {
                if (selectedCharIndex === null) return;
                if (!charOverrides[selectedCharIndex]) {
                    charOverrides[selectedCharIndex] = { dx: 0, dy: 0, scale: 1.0, styles: [] };
                }
                charOverrides[selectedCharIndex][target] = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value);
                if (valEl) valEl.textContent = e.target.value + suffix;
                renderFrame(currentTime);
            });
        };
        bindCharInput('char-x', 'dx', 'val-c-x', false, 'px');
        bindCharInput('char-y', 'dy', 'val-c-y', false, 'px');
        bindCharInput('char-scale', 'scale', 'val-c-scale', true, 'x');
        bindCharInput('char-whisker', 'whiskerLen', 'val-c-whisk', false);
        bindCharInput('char-infill', 'infillDepth', 'val-c-infill', true);

        document.getElementById('btn-reset-char').addEventListener('click', () => {
            if (selectedCharIndex === null) return;
            delete charOverrides[selectedCharIndex];
            syncCharControls();
            renderFrame(currentTime);
        });

        document.getElementById('btn-clear-override').addEventListener('click', () => {
            charOverrides = {};
            syncCharControls();
            renderFrame(currentTime);
        });

        function logMessage(msg) {
            const logDiv = document.getElementById('log-messages');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `[${new Date().toLocaleTimeString().slice(0,8)}] ${msg}`;
            logDiv.prepend(div);
        }

        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function getLocalSettings(charIndex) {
            let base = { ...settings };
            const o = charOverrides[charIndex];
            if (o) {
                if (o.styles && o.styles.length > 0) {
                    base = { ...base, ...calculateSettings(o.styles) };
                }
                if (o.dx !== undefined) base.dx = o.dx;
                if (o.dy !== undefined) base.dy = o.dy;
                if (o.scale !== undefined) base.scale = o.scale;
                if (o.whiskerLen !== undefined) base.whiskerLen = o.whiskerLen;
                if (o.infillDepth !== undefined) base.infillDepth = o.infillDepth;
            }
            return base;
        }

        function warpContourBilinear(pts, bbox, localSettings) {
            const w = bbox.x2 - bbox.x1 || 1;
            const h = bbox.y2 - bbox.y1 || 1;
            return pts.map(p => {
                const u = Math.max(0, Math.min(1, (p.x - bbox.x1) / w));
                const v = Math.max(0, Math.min(1, (p.y - bbox.y1) / h));
                const wCho = (1 - u) * (1 - v);
                const wJung = u * (1 - v * 0.5);
                const wJong = v;
                const dxCho = -localSettings.choWarp * w * 0.25 * wCho;
                const dyCho = -localSettings.choWarp * h * 0.25 * wCho;
                const dxJung = localSettings.jungWarp * w * 0.35 * wJung;
                const dyJung = -localSettings.jungWarp * h * 0.10 * wJung;
                const dxJong = (u - 0.5) * localSettings.jongWarp * w * 0.20 * wJong;
                const dyJong = localSettings.jongWarp * h * 0.30 * wJong;
                return { x: p.x + dxCho + dxJung + dxJong, y: p.y + dyCho + dyJung + dyJong };
            });
        }

        function generateSharpWhiskers(contours, randGen, localSettings) {
            if (localSettings.whiskerLen <= 0) return [];
            const whiskers = [];
            contours.forEach(pts => {
                const len = pts.length;
                if (len < 8) return;
                for (let i = 2; i < len - 2; i += 3) {
                    const p0 = pts[i - 2], p1 = pts[i], p2 = pts[i + 2];
                    const v1x = p1.x - p0.x, v1y = p1.y - p0.y;
                    const v2x = p2.x - p1.x, v2y = p2.y - p1.y;
                    const l1 = Math.hypot(v1x, v1y) || 1;
                    const l2 = Math.hypot(v2x, v2y) || 1;
                    const dot = (v1x * v2x + v1y * v2y) / (l1 * l2);
                    if (dot < 0.2) {
                        const tangentX = (v1x / l1 - v2x / l2) * 0.5;
                        const tangentY = (v1y / l1 - v2y / l2) * 0.5;
                        const tLen = Math.hypot(tangentX, tangentY) || 1;
                        const dirX = tangentX / tLen;
                        const dirY = tangentY / tLen;
                        for (let k = 0; k < 4; k++) {
                            const wLength = localSettings.whiskerLen * (0.6 + randGen() * 0.8);
                            const spread = (randGen() - 0.5) * 0.6;
                            const cos = Math.cos(spread), sin = Math.sin(spread);
                            const outX = dirX * cos - dirY * sin;
                            const outY = dirX * sin + dirY * cos;
                            const endX = p1.x + outX * wLength;
                            const endY = p1.y + outY * wLength;
                            const cpx = (p1.x + endX) * 0.5 + (randGen() - 0.5) * 4;
                            const cpy = (p1.y + endY) * 0.5 + (randGen() - 0.5) * 4;
                            whiskers.push({ d: `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q ${cpx.toFixed(1)} ${cpy.toFixed(1)} ${endX.toFixed(1)} ${endY.toFixed(1)}`, stroke: `rgba(20, 20, 22, ${(0.15 + randGen() * 0.25).toFixed(3)})`, width: (0.6 + randGen() * 0.8).toFixed(2) });
                        }
                    }
                }
            });
            return whiskers;
        }

        function extractContoursFromGlyph(char, fontSize) {
            try {
                const path = currentFont.getPath(char, 0, 0, fontSize);
                const contours = [];
                let current = [];
                let cx = 0, cy = 0;
                const STEPS = 8;
                path.commands.forEach(c => {
                    if (c.type === 'M') {
                        if (current.length > 0) contours.push(current);
                        current = [];
                        cx = c.x; cy = c.y;
                        current.push({x: cx, y: cy});
                    } else if (c.type === 'L') { cx = c.x; cy = c.y; current.push({x: cx, y: cy}); }
                    else if (c.type === 'C') {
                        for (let i = 1; i <= STEPS; i++) {
                            const t = i / STEPS, mt = 1 - t;
                            current.push({ x: mt*mt*mt*cx + 3*mt*mt*t*c.x1 + 3*mt*t*t*c.x2 + t*t*t*c.x, y: mt*mt*mt*cy + 3*mt*mt*t*c.y1 + 3*mt*t*t*c.y2 + t*t*t*c.y });
                        }
                        cx = c.x; cy = c.y;
                    } else if (c.type === 'Q') {
                        for (let i = 1; i <= STEPS; i++) {
                            const t = i / STEPS, mt = 1 - t;
                            current.push({ x: mt*mt*cx + 2*mt*t*c.x1 + t*t*c.x, y: mt*mt*cy + 2*mt*t*c.y1 + t*t*c.y });
                        }
                        cx = c.x; cy = c.y;
                    } else if (c.type === 'Z') {
                        if (current.length > 0) current.push({x: current[0].x, y: current[0].y});
                    }
                });
                if (current.length > 0) contours.push(current);
                let bbox;
                try { bbox = path.getBoundingBox(); } catch(e) { bbox = {x1: 0, y1: -fontSize, x2: fontSize, y2: 0}; }
                return { contours, bbox };
            } catch(e) { return { contours: [], bbox: {x1:0, y1:0, x2:0, y2:0} }; }
        }

        function renderCalligraphyGlyph(targetCtx, char, fontSize, seed, isSvgRecord, globalX, globalY, charIndex) {
            const localSettings = getLocalSettings(charIndex);
            const { contours, bbox } = extractContoursFromGlyph(char, fontSize);
            if (contours.length === 0) return 0;

            const randGen = mulberry32(seed);
            const warpedContours = contours.map(pts => warpContourBilinear(pts, bbox, localSettings));

            const override = charOverrides[charIndex];
            const offsetX = override ? (override.dx || 0) : 0;
            const offsetY = override ? (override.dy || 0) : 0;
            const scale = override ? (override.scale || 1.0) : 1.0;
            const centerX = (bbox.x1 + bbox.x2) * 0.5;
            const centerY = (bbox.y1 + bbox.y2) * 0.5;

            const transformStr = `translate(${globalX + centerX + offsetX}, ${globalY + centerY + offsetY}) scale(${scale}) translate(${-centerX}, ${-centerY})`;

            targetCtx.save();
            targetCtx.translate(centerX + offsetX, centerY + offsetY);
            targetCtx.scale(scale, scale);
            targetCtx.translate(-centerX, -centerY);

            targetCtx.beginPath();
            let svgPathData = "";
            warpedContours.forEach(pts => {
                if (pts.length < 2) return;
                targetCtx.moveTo(pts[0].x, pts[0].y);
                svgPathData += `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} `;
                for (let i = 1; i < pts.length - 1; i++) {
                    const mx = (pts[i].x + pts[i+1].x) * 0.5;
                    const my = (pts[i].y + pts[i+1].y) * 0.5;
                    targetCtx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
                    svgPathData += `Q ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)} `;
                }
                targetCtx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
                targetCtx.closePath();
                svgPathData += `Z `;
            });
            targetCtx.fillStyle = 'rgba(24, 24, 26, 0.94)';
            targetCtx.fill('evenodd');
            if (isSvgRecord) {
                lastRenderedPaths.push({ d: svgPathData, transform: transformStr });
            }

            targetCtx.save();
            const strokeCount = localSettings.bristles;
            warpedContours.forEach(pts => {
                const len = pts.length;
                for (let i = 1; i < len; i += 2) {
                    const dx = pts[i].x - pts[i-1].x;
                    const dy = pts[i].y - pts[i-1].y;
                    const dLen = Math.hypot(dx, dy) || 1;
                    const nx = -dy / dLen;
                    const ny = dx / dLen;
                    for (let b = 0; b < strokeCount; b++) {
                        const tOffset = (randGen() - 0.5) * 2;
                        const depth = randGen() * localSettings.infillDepth * 18;
                        const px = pts[i].x + nx * tOffset * depth;
                        const py = pts[i].y + ny * tOffset * depth;
                        const qx = px + dx * 0.5 + (randGen() - 0.5) * 3;
                        const qy = py + dy * 0.5 + (randGen() - 0.5) * 3;
                        targetCtx.beginPath();
                        targetCtx.strokeStyle = `rgba(18, 18, 20, ${(0.08 + randGen() * 0.15).toFixed(3)})`;
                        targetCtx.lineWidth = 0.8 + randGen() * 1.6;
                        targetCtx.moveTo(px, py);
                        targetCtx.lineTo(qx, qy);
                        targetCtx.stroke();
                        if (isSvgRecord && b % 3 === 0) {
                            lastBrushStrokes.push({
                                d: `M ${px.toFixed(1)} ${py.toFixed(1)} L ${qx.toFixed(1)} ${qy.toFixed(1)}`,
                                stroke: `rgba(18,18,20,0.18)`,
                                width: `1.0`,
                                transform: transformStr
                            });
                        }
                    }
                }
            });
            targetCtx.restore();

            const whiskers = generateSharpWhiskers(warpedContours, randGen, localSettings);
            whiskers.forEach(wh => {
                targetCtx.beginPath();
                targetCtx.strokeStyle = wh.stroke;
                targetCtx.lineWidth = parseFloat(wh.width);
                const m = wh.d.match(/M\s*([-\d\.]+)\s+([-\d\.]+)\s+Q\s*([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)/);
                if (m) {
                    targetCtx.moveTo(parseFloat(m[1]), parseFloat(m[2]));
                    targetCtx.quadraticCurveTo(parseFloat(m[3]), parseFloat(m[4]), parseFloat(m[5]), parseFloat(m[6]));
                    targetCtx.stroke();
                    if (isSvgRecord) {
                        lastBrushStrokes.push({
                            d: wh.d,
                            stroke: wh.stroke,
                            width: wh.width,
                            transform: transformStr
                        });
                    }
                }
            });

            targetCtx.restore();
            return (bbox.x2 - bbox.x1) * localSettings.spacing * scale;
        }

        function splitTextByWidth(rawText, maxChars) {
            const rawLines = rawText.split('\n');
            const result = [];
            rawLines.forEach(l => {
                if (l.length <= maxChars) { result.push(l); }
                else {
                    const words = l.split(' ');
                    let cur = '';
                    words.forEach(w => {
                        if ((cur + ' ' + w).trim().length > maxChars) {
                            if (cur) result.push(cur.trim());
                            cur = w;
                        } else { cur = (cur + ' ' + w).trim(); }
                    });
                    if (cur) result.push(cur.trim());
                }
            });
            return result;
        }

        function renderFrame(timeSec) {
            lastRenderedPaths = [];
            lastBrushStrokes = [];

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f4ecd8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!currentFont) return;
            const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
            if (!activeSubtitle) return;

            const text = activeSubtitle.text.trim();
            
            if (lastBuiltText !== text) {
                lastBuiltText = text;
                selectedCharIndex = null;
                syncCharControls();
                
                const cleanChars = Array.from(text.replace(/\s/g, ''));
                const charListContainer = document.getElementById('char-list');
                charListContainer.innerHTML = '';
                cleanChars.forEach((char, idx) => {
                    const btn = document.createElement('div');
                    btn.className = 'char-chip' + (idx === selectedCharIndex ? ' active' : '');
                    btn.textContent = char;
                    btn.addEventListener('click', () => {
                        selectedCharIndex = idx;
                        syncCharControls();
                        document.getElementById('char-target-title').textContent = `'${char}' 글자 변형 (#${idx+1})`;
                        charListContainer.querySelectorAll('.char-chip').forEach(c => c.classList.remove('active'));
                        btn.classList.add('active');
                    });
                    charListContainer.appendChild(btn);
                });
            }

            syncScratchpad(canvas.width, canvas.height);
            scratchCtx.save();
            scratchCtx.translate(canvas.width * 0.5, canvas.height * 0.5);
            scratchCtx.transform(1, settings.shear, 0, 1, 0, 0);
            scratchCtx.translate(-canvas.width * 0.5, -canvas.height * 0.5);

            const fontSize = 175;
            const lineHeight = fontSize * 1.45;
            const maxCharsPerLine = canvas.width > 1200 ? 10 : 6;
            const lines = splitTextByWidth(text, maxCharsPerLine);

            let startY = (canvas.height - lines.length * lineHeight) * 0.5 + fontSize * 0.8;
            let charCounter = 0;

            lines.forEach((lineStr, lineIdx) => {
                let currentX = canvas.width * 0.1;
                let currentY = startY + lineIdx * lineHeight;

                for (let i = 0; i < lineStr.length; i++) {
                    const char = lineStr[i];
                    if (char === ' ') { currentX += fontSize * 0.35; continue; }

                    const seed = char.charCodeAt(0) * 131 + lineIdx * 37 + i * 17;
                    scratchCtx.save();
                    scratchCtx.translate(currentX, currentY);
                    const advance = renderCalligraphyGlyph(scratchCtx, char, fontSize, seed, true, currentX, currentY, charCounter);
                    scratchCtx.restore();

                    currentX += advance > 0 ? advance + 25 : fontSize * 0.45;
                    charCounter++;
                }
            });
            scratchCtx.restore();

            if (hasMask && currentMaskAlphaImage) {
                scratchCtx.save();
                scratchCtx.globalCompositeOperation = 'destination-in';
                scratchCtx.drawImage(currentMaskAlphaImage, 0, 0, canvas.width, canvas.height);
                scratchCtx.restore();
            }

            ctx.drawImage(scratchCv, 0, 0);
        }

        document.getElementById('btn-svg').addEventListener('click', () => {
            if (lastRenderedPaths.length === 0) { alert("현재 캔버스에 표시된 글씨가 없습니다."); return; }
            let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${canvas.width} ${canvas.height}" width="${canvas.width}" height="${canvas.height}">\n`;
            svgContent += `<rect width="100%" height="100%" fill="#f4ecd8"/>\n`;
            const shearAngleDeg = Math.atan(settings.shear) * (180 / Math.PI);
            svgContent += `<g transform="translate(${canvas.width*0.5},${canvas.height*0.5}) skewY(${shearAngleDeg.toFixed(2)}) translate(${-canvas.width*0.5},${-canvas.height*0.5})">\n`;
            lastRenderedPaths.forEach(pathObj => { svgContent += `  <g transform="${pathObj.transform}"><path d="${pathObj.d}" fill="#18181a" fill-rule="evenodd"/></g>\n`; });
            lastBrushStrokes.forEach(st => { svgContent += `  <g transform="${st.transform}"><path d="${st.d}" fill="none" stroke="${st.stroke}" stroke-width="${st.width}" stroke-linecap="round"/></g>\n`; });
            svgContent += `</g>\n</svg>`;

            const blob = new Blob([svgContent], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `Calligraphy_Vector_${Date.now()}.svg`; a.click();
            URL.revokeObjectURL(url);
            logMessage("✅ 실벡터 SVG 추출 완료");
        });

        function togglePlay() { isPlaying ? pause() : play(); }
        function play() { if (isPlaying) return; isPlaying = true; lastTimestamp = 0; animationFrameId = requestAnimationFrame(animate); }
        function pause() { isPlaying = false; if (animationFrameId) cancelAnimationFrame(animationFrameId); }
        function animate(t) {
            if (!isPlaying) return;
            if (!lastTimestamp) lastTimestamp = t;
            currentTime += (t - lastTimestamp) / 1000;
            lastTimestamp = t;
            if (currentTime > totalDuration) {
                if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
                    currentTime = totalDuration; renderFrame(currentTime); pause(); mediaRecorder.stop(); return;
                } else { currentTime = 0; }
            }
            document.getElementById('time-slider').value = currentTime;
            document.getElementById('time-display').textContent = `${formatTime(currentTime)} / ${formatTime(totalDuration)}`;
            renderFrame(currentTime);
            animationFrameId = requestAnimationFrame(animate);
        }
        document.getElementById('btn-play').addEventListener('click', togglePlay);
        document.getElementById('time-slider').addEventListener('input', (e) => { currentTime = parseFloat(e.target.value); document.getElementById('time-display').textContent = `${formatTime(currentTime)} / ${formatTime(totalDuration)}`; renderFrame(currentTime); });

        function startRecording() {
            pause(); currentTime = 0; isRecording = true; renderFrame(0);
            if (!stream) stream = canvas.captureStream(30);
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm', videoBitsPerSecond: 8000000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `Calligraphy_Live_${Date.now()}.webm`; a.click();
                URL.revokeObjectURL(url);
                isRecording = false; document.getElementById('btn-export').textContent = '🔴 실시간 녹화 시작';
                logMessage("✅ 실시간 녹화 저장 완료");
            };
            mediaRecorder.start(100);
            document.getElementById('btn-export').textContent = '⏹ 녹화 진행 중 (자동 종료 대기)';
            play(); logMessage("🔴 실시간 녹화 시작");
        }
        document.getElementById('btn-export').addEventListener('click', () => {
            if (isRecording) { pause(); if (mediaRecorder) mediaRecorder.stop(); }
            else { startRecording(); }
        });

        document.getElementById('btn-offline').addEventListener('click', async () => {
            if (!srtData.length) { alert("SRT 자막을 먼저 로드해주세요."); return; }
            logMessage("🔴 60FPS 무손실 오프라인 렌더링 시작...");
            const fps = 30;
            const totalFrames = Math.ceil(totalDuration * fps);
            const stream = canvas.captureStream(0);
            const track = stream.getVideoTracks()[0];
            const isRequestFrameSupported = !!(track && track.requestFrame);

            if (isRequestFrameSupported) {
                const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 10000000 });
                const chunks = [];
                recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    const blob = new Blob(chunks, {type: 'video/webm'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `Calligraphy_Lossless_${Date.now()}.webm`; a.click();
                    URL.revokeObjectURL(url);
                    logMessage("✅ 무손실 WebM 완료");
                };
                recorder.start();
                for (let f = 0; f <= totalFrames; f++) {
                    renderFrame(f / fps);
                    track.requestFrame();
                    await new Promise(r => setTimeout(r, 1000 / fps / 2));
                }
                recorder.stop();
            } else {
                logMessage("⚠️ Safari 감지: JSZip 폴백");
                const zip = new JSZip();
                for (let f = 0; f <= totalFrames; f++) {
                    renderFrame(f / fps);
                    const blob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.95));
                    zip.file(`frame_${String(f).padStart(5, '0')}.webp`, blob);
                }
                const zipBlob = await zip.generateAsync({type: 'blob'});
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a'); a.href = url; a.download = `Calligraphy_Frames_${Date.now()}.zip`; a.click();
                URL.revokeObjectURL(url);
                logMessage("✅ Safari 프레임 ZIP 완료");
            }
        });

        function parseSRT(text) {
            const blocks = text.replace(/\r/g, '').trim().split(/\n\s*\n/);
            const out = [];
            for (const b of blocks) {
                const ls = b.split('\n').map(l => l.trim()).filter(Boolean);
                if (ls.length < 2) continue;
                let i = 0; if (/^\d+$/.test(ls[0])) i = 1;
                const tm = (ls[i] || '').match(/(.+?)\s*-->\s*(.+)/);
                if (!tm) continue;
                out.push({ start: parseTime(tm[1]), end: parseTime(tm[2]), text: ls.slice(i+1).join('\n') });
            }
            return out.sort((a, b) => a.start - b.start);
        }
        function parseTime(t) { if (!t) return 0; const p = t.trim().replace(',', '.').split(':'); return (+p[0]||0)*3600 + (+p[1]||0)*60 + (+p[2]||0); }
        function formatTime(s) { const m = Math.floor(s / 60); const sec = Math.floor(s % 60); const ms = Math.floor((s % 1) * 100); return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(ms).padStart(2, '0')}`; }
        function loadSRTData(rawText) {
            document.getElementById('srt-textarea').value = rawText;
            srtData = parseSRT(rawText);
            totalDuration = srtData.length > 0 ? srtData[srtData.length - 1].end + 1.0 : 10;
            document.getElementById('time-slider').max = totalDuration;
            const el = document.getElementById('srt-list');
            el.innerHTML = '';
            srtData.forEach(item => {
                const d = document.createElement('div');
                d.className = 'srt-item';
                d.innerHTML = `<span>${item.text.replace('\n', ' ')}</span><span style="font-family:monospace;color:var(--accent-color);">${formatTime(item.start)}</span>`;
                d.addEventListener('click', () => { currentTime = item.start + 0.01; renderFrame(currentTime); });
                el.appendChild(d);
            });
            lastBuiltText = "";
            logMessage(`자막 로드 완료 (${srtData.length}개 세션)`);
            renderFrame(0);
        }

        // [수정] SRT 파일 로딩 이벤트 리스너 추가
        document.getElementById('srt-input').addEventListener('change', (e) => {
            const file = e.target.files[0];

            reader.onload = (evt) => {

            };
            reader.readAsText(file);
        });

        document.getElementById('btn-apply-srt').addEventListener('click', () => loadSRTData(document.getElementById('srt-textarea').value));
        document.getElementById('ttf-input').addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    currentFont = opentype.parse(evt.target.result);
                    document.getElementById('font-status').textContent = `✅ ${file.name} 준비 완료`;
                    logMessage(`폰트 적용: ${file.name}`);
                    renderFrame(currentTime);
                } catch(err) { alert("폰트 파싱 실패"); }
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('mask-file-input').addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            const img = new Image();
            img.onload = () => { currentMaskAlphaImage = img; hasMask = true; renderFrame(currentTime); };
            img.src = URL.createObjectURL(file);
        });

        document.getElementById('aspect-ratio-select').addEventListener('change', (e) => {
            const isVertical = e.target.value === '9:16';
            canvas.width = isVertical ? 1080 : 1920;
            canvas.height = isVertical ? 1920 : 1080;
            renderFrame(currentTime);
        });

        (async () => {
            try {
                currentFont = await new Promise((res, rej) => opentype.load("https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf", (err, f) => err ? rej(err) : res(f)));
                document.getElementById('font-status').textContent = '✅ 나눔손글씨 붓글씨 엔진 활성화';
                renderFrame(0);
