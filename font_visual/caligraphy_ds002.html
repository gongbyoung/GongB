<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자별 프레임 캘리그라피</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .controls-panel {
            width: 350px;
            background: white;
            border-right: 2px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        h2 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .control-group {
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
        }

        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .input-row input[type="range"] { flex: 1; }
        .input-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }

        select, input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-generate { background-color: #4CAF50; color: white; }
        .btn-save-img { background-color: #2196F3; color: white; }
        .btn-save-video { background-color: #ff9800; color: white; }
        .btn-reset { background-color: #f44336; color: white; }

        .main-area { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        .canvas-container { flex: 1; background: white; border: 2px solid #ddd; border-radius: 10px; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 20px; }
        canvas { max-width: 100%; max-height: 100%; }

        .log-panel {
            height: 250px;
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 15px;
            border-radius: 10px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .log-panel h3 { margin-top: 0; color: white; border-bottom: 1px solid #444; padding-bottom: 5px;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div class="controls-panel">
        <h2>🎛️ 제어판</h2>

        <div class="control-group">
            <label>문장 입력</label>
            <input type="text" id="textInput" value="바람 속에 장미가" oninput="generateArt()">
        </div>

        <div class="control-group">
            <label>문장 분포 (9가지 배치)</label>
            <select id="layoutSelect" onchange="generateArt()">
                <option value="circle">원</option>
                <option value="triangle">삼각형</option>
                <option value="reverseTriangle">역삼각형</option>
                <option value="diamond">마름모</option>
                <option value="star">별모양</option>
                <option value="top">ㅗ</option>
                <option value="bottom">ㅜ</option>
                <option value="left">ㅓ</option>
                <option value="right">ㅏ</option>
            </select>
        </div>

        <div class="control-group">
            <label>글자별 프레임 (내부 모양)</label>
            <select id="styleSelect" onchange="generateArt()">
                <option value="none">자연스러움 (없음)</option>
                <option value="circle">원형</option>
                <option value="triangle">삼각형</option>
                <option value="square">사각형</option>
            </select>
        </div>

        <div class="control-group">
            <label>배치 및 크기 설정</label>
            <div class="input-row">
                <label>프레임(글자) 크기</label>
                <input type="range" id="frameSizeRange" min="30" max="200" value="80" oninput="syncInput('frameSizeRange', 'frameSizeNum')">
                <input type="number" id="frameSizeNum" value="80" min="30" max="200" oninput="syncInput('frameSizeNum', 'frameSizeRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>문장 중심 X</label>
                <input type="number" id="centerX" value="500" oninput="generateArt()">
            </div>
            <div class="input-row">
                <label>문장 중심 Y</label>
                <input type="number" id="centerY" value="400" oninput="generateArt()">
            </div>
            <div class="input-row">
                <label>문장 반지름(퍼짐)</label>
                <input type="range" id="layoutRadiusRange" min="100" max="500" value="300" oninput="syncInput('layoutRadiusRange', 'layoutRadiusNum')">
                <input type="number" id="layoutRadiusNum" value="300" min="100" max="500" oninput="syncInput('layoutRadiusNum', 'layoutRadiusRange'); generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>글자 배치 규칙</label>
            <div class="input-row">
                <label>글자 간격</label>
                <input type="range" id="spacingRange" min="0" max="100" value="50" oninput="syncInput('spacingRange', 'spacingNum')">
                <input type="number" id="spacingNum" value="50" oninput="syncInput('spacingNum', 'spacingRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>랜덤 정도</label>
                <input type="range" id="randomRange" min="0" max="100" value="20" oninput="syncInput('randomRange', 'randomNum')">
                <input type="number" id="randomNum" value="20" oninput="syncInput('randomNum', 'randomRange'); generateArt()">
            </div>
        </div>

        <div class="control-group">
            <label>붓터치</label>
            <div class="input-row">
                <label>획 굵기</label>
                <input type="range" id="thicknessRange" min="1" max="30" value="6" oninput="syncInput('thicknessRange', 'thicknessNum')">
                <input type="number" id="thicknessNum" value="6" oninput="syncInput('thicknessNum', 'thicknessRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>전체 글자 크기 배율</label>
                <input type="range" id="globalScaleRange" min="10" max="200" value="100" oninput="syncInput('globalScaleRange', 'globalScaleNum')">
                <input type="number" id="globalScaleNum" value="100" oninput="syncInput('globalScaleNum', 'globalScaleRange'); generateArt()">
            </div>
            <div class="input-row">
                <label>개별 글자 크기 배율</label>
                <input type="range" id="letterScaleRange" min="10" max="200" value="100" oninput="syncInput('letterScaleRange', 'letterScaleNum')">
                <input type="number" id="letterScaleNum" value="100" oninput="syncInput('letterScaleNum', 'letterScaleRange'); generateArt()">
            </div>
        </div>

        <button class="btn-generate" onclick="generateArt()">🎨 다시 생성하기</button>
        <button class="btn-save-img" onclick="saveAsPNG()">💾 PNG 저장</button>
        <button class="btn-save-video" onclick="saveAsVideo()">🎬 영상 저장 (WebM)</button>
        <button class="btn-reset" onclick="resetControls()">🔄 초기화</button>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="800"></canvas>
        </div>
        
        <div class="log-panel" id="logPanel">
            <h3>📋 처리 로그 (실시간)</h3>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('logPanel');

        function syncInput(sourceId, targetId) {
            const source = document.getElementById(sourceId);
            const target = document.getElementById(targetId);
            target.value = source.value;
        }

        function addLog(message) {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            logEntry.innerHTML = `<strong>[${time}]</strong> ${message}`;
            logPanel.appendChild(logEntry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const syllable = code - 0xAC00;
                const cho = Math.floor(syllable / 588);
                const jung = Math.floor((syllable % 588) / 28);
                const jong = syllable % 28;
                return { cho, jung, jong, isHangul: true };
            }
            return { isHangul: false, char };
        }

        const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        // [핵심 수정] 글자 하나가 놓일 문장 전체의 좌표 (문장 9가지 분포)
        function getLayoutPosition(index, total, type, centerX, centerY, radius, spacingFactor) {
            // spacingFactor는 글자 간격을 결정
            const r = radius * (0.8 + spacingFactor * 0.2);
            
            switch(type) {
                case 'circle': {
                    const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
                    return { x: centerX + Math.cos(angle) * r, y: centerY + Math.sin(angle) * r };
                }
                case 'triangle': {
                    const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
                    let triR = r * (0.9 + 0.1 * Math.cos(3 * angle));
                    return { x: centerX + Math.cos(angle) * triR, y: centerY + Math.sin(angle) * triR };
                }
                case 'reverseTriangle': {
                    const angle = (index / total) * Math.PI * 2 + Math.PI / 2;
                    let triR = r * (0.9 + 0.1 * Math.cos(3 * angle));
                    return { x: centerX + Math.cos(angle) * triR, y: centerY + Math.sin(angle) * triR };
                }
                case 'diamond': {
                    let t = (index / (total - 1)) * 2 - 1;
                    return { x: centerX + t * r * 1.2, y: centerY + (Math.abs(t) - 0.5) * r * (index % 2 === 0 ? 1 : -1) };
                }
                case 'star': {
                    const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
                    let starR = r * (Math.cos(5 * angle) * 0.2 + 0.8);
                    return { x: centerX + Math.cos(angle) * starR, y: centerY + Math.sin(angle) * starR };
                }
                case 'top': return { x: (index / (total - 1)) * (r * 1.6) + (centerX - r * 0.8), y: centerY - r * 0.5 };
                case 'bottom': return { x: (index / (total - 1)) * (r * 1.6) + (centerX - r * 0.8), y: centerY + r * 0.5 };
                case 'left': return { x: centerX - r * 0.8, y: (index / (total - 1)) * (r * 1.6) + (centerY - r * 0.8) };
                case 'right': return { x: centerX + r * 0.8, y: (index / (total - 1)) * (r * 1.6) + (centerY - r * 0.8) };
                default: return { x: centerX, y: centerY };
            }
        }

        // [핵심 수정] 글자 내부 좌표를 '글자 프레임' 안에 투영
        function distortPointInFrame(x, y, type, frameSize) {
            if (type === 'none') return { x, y };

            // 글자 좌표계의 중심 (0,0) 기준
            const half = frameSize / 2;

            if (type === 'circle') {
                let angle = Math.atan2(y, x);
                let dist = Math.sqrt(x*x + y*y);
                let targetR = half;
                // 안쪽 점은 그대로 두고, 바깥 점만 원 테두리로 끌어당김
                let newDist = Math.min(dist, targetR);
                return { x: Math.cos(angle) * newDist, y: Math.sin(angle) * newDist };
            } else if (type === 'triangle') {
                let angle = Math.atan2(y, x);
                let vertexAngle = Math.floor(((angle + Math.PI) / (2 * Math.PI)) * 3) * (2 * Math.PI / 3);
                let closestVX = Math.cos(vertexAngle) * half;
                let closestVY = Math.sin(vertexAngle) * half;
                // 삼각형 꼭짓점 방향으로 좌표를 50% 섞어서 당김
                return { x: x * 0.5 + closestVX * 0.5, y: y * 0.5 + closestVY * 0.5 };
            } else if (type === 'square') {
                let maxX = half, maxY = half;
                let scale = Math.max(Math.abs(x)/maxX, Math.abs(y)/maxY);
                if (scale <= 1) return { x, y };
                let angle = Math.atan2(y, x);
                let newDist = Math.sqrt(x*x + y*y) / scale;
                return { x: Math.cos(angle) * newDist, y: Math.sin(angle) * newDist };
            }
            return { x, y };
        }

        function generateArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const text = document.getElementById('textInput').value;
            const layoutType = document.getElementById('layoutSelect').value;
            const styleType = document.getElementById('styleSelect').value;
            
            const frameSize = parseInt(document.getElementById('frameSizeNum').value);
            const centerX = parseInt(document.getElementById('centerX').value);
            const centerY = parseInt(document.getElementById('centerY').value);
            const layoutRadius = parseInt(document.getElementById('layoutRadiusNum').value);
            
            const spacing = parseInt(document.getElementById('spacingNum').value) / 100;
            const randomAmt = parseInt(document.getElementById('randomNum').value) / 100;
            
            const thickness = parseInt(document.getElementById('thicknessNum').value);
            const globalScale = parseInt(document.getElementById('globalScaleNum').value) / 100;
            const letterScale = parseInt(document.getElementById('letterScaleNum').value) / 100;

            const chars = text.split('');
            const total = chars.length;

            logPanel.innerHTML = '<h3>📋 처리 로그 (실시간)</h3>';
            addLog(`입력: "${text}" (${total}자)`);
            addLog(`문장 분포: ${layoutType}, 반지름: ${layoutRadius}`);

            ctx.fillStyle = '#111';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            chars.forEach((char, index) => {
                // 1. 문장 안에서 이 글자가 놓일 위치 계산
                const layoutPos = getLayoutPosition(index, total, layoutType, centerX, centerY, layoutRadius, spacing);
                
                // 2. 랜덤 크기 계산
                let randomScale = 1 + ((Math.random() * 2 - 1) * randomAmt);
                let finalScale = globalScale * letterScale * randomScale;
                
                if (decomposeHangul(char).isHangul) {
                    const decomposed = decomposeHangul(char);
                    
                    const choName = CHO[decomposed.cho];
                    const jungName = JUNG[decomposed.jung];
                    const jongName = decomposed.jong > 0 ? JONG[decomposed.jong] : '없음';
                    
                    addLog(`- "${char}": [초:${choName}, 중:${jungName}, 종:${jongName}] → 좌표(${Math.round(layoutPos.x)}, ${Math.round(layoutPos.y)}) / 글자 크기: ${Math.round(frameSize * finalScale)}px`);

                    // 3. 글자 내부 좌표를 프레임 모양에 맞춰 왜곡하고 그리기
                    drawHangulGlyph(decomposed, layoutPos.x, layoutPos.y, finalScale, styleType, thickness, frameSize);
                } else {
                    ctx.font = `bold ${80 * finalScale}px Arial`;
                    ctx.fillText(char, layoutPos.x, layoutPos.y);
                    addLog(`- "${char}": [일반 문자] → 좌표(${Math.round(layoutPos.x)}, ${Math.round(layoutPos.y)})`);
                }
            });

            addLog('✅ 렌더링 완료');
        }

        // [핵심 수정] 각 글자마다 프레임을 만들어 그 안에 초/중/종을 배치
        function drawHangulGlyph(decomp, x, y, scale, styleType, thickness, baseFrameSize) {
            ctx.lineWidth = thickness; 
            
            // 최종 글자 크기 (프레임 크기 * 배율)
            const frameSize = baseFrameSize * scale;
            const half = frameSize / 2;

            // 초/중/종의 상대 좌표 (프레임 중심 0,0 기준)
            const strokes = [];

            // 초성: 왼쪽 위 (x: -0.3*size, y: -0.5*size ~ +0.5*size)
            const choOffsetX = -half * 0.3;
            const choOffsetY1 = -half * 0.5;
            const choOffsetY2 = half * 0.5;
            const choHookY = half * 0.2;

            strokes.push([ { x: choOffsetX, y: choOffsetY1 }, { x: choOffsetX, y: choOffsetY2 } ]);
            strokes.push([ { x: choOffsetX, y: choOffsetY2 }, { x: choOffsetX + half * 0.2, y: choHookY } ]);

            // 중성: 오른쪽 (x: +0.2*size, y: -0.7*size ~ +0.7*size)
            const jungOffsetX = half * 0.2;
            const jungOffsetY1 = -half * 0.7;
            const jungOffsetY2 = half * 0.7;

            strokes.push([ { x: jungOffsetX, y: jungOffsetY1 }, { x: jungOffsetX, y: jungOffsetY2 } ]);
            strokes.push([ { x: jungOffsetX, y: 0 }, { x: jungOffsetX + half * 0.5, y: 0 } ]);

            // 종성: 아래쪽 (있다면)
            if (decomp.jong > 0) {
                const jongOffsetX = choOffsetX;
                const jongOffsetY = half * 0.7;
                strokes.push([ { x: jongOffsetX, y: jongOffsetY }, { x: jongOffsetX + half * 0.8, y: jongOffsetY } ]);
            }

            // 왜곡 및 그리기
            strokes.forEach(stroke => {
                const p1 = stroke[0];
                const p2 = stroke[1];

                // 글자 내부 좌표를 프레임 모양에 맞춰 변형
                const distortedP1 = distortPointInFrame(p1.x, p1.y, styleType, frameSize);
                const distortedP2 = distortPointInFrame(p2.x, p2.y, styleType, frameSize);

                ctx.beginPath();
                ctx.moveTo(x + distortedP1.x, y + distortedP1.y);
                ctx.lineTo(x + distortedP2.x, y + distortedP2.y);
                ctx.stroke();
            });
        }

        function saveAsPNG() {
            const link = document.createElement('a');
            link.download = 'calligraphy.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            addLog('💾 PNG 파일로 저장되었습니다.');
        }

        function saveAsVideo() {
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'calligraphy.webm';
                a.click();
                URL.revokeObjectURL(url);
                addLog('🎬 영상(WebM) 저장이 완료되었습니다.');
            };

            recorder.start();
            addLog('🎬 영상 녹화를 시작합니다...');
            
            let progress = 0;
            const animationInterval = setInterval(() => {
                generateArt();
                progress++;
                if (progress > 90) {
                    clearInterval(animationInterval);
                    recorder.stop();
                }
            }, 33);
        }

        function resetControls() {
            document.getElementById('textInput').value = "바람 속에 장미가";
            document.getElementById('layoutSelect').value = "circle";
            document.getElementById('styleSelect').value = "none";
            
            document.getElementById('frameSizeNum').value = 80;
            document.getElementById('frameSizeRange').value = 80;
            
            document.getElementById('centerX').value = 500;
            document.getElementById('centerY').value = 400;
            
            document.getElementById('layoutRadiusNum').value = 300;
            document.getElementById('layoutRadiusRange').value = 300;
            
            document.getElementById('spacingNum').value = 50;
            document.getElementById('spacingRange').value = 50;
            document.getElementById('randomNum').value = 20;
            document.getElementById('randomRange').value = 20;
            document.getElementById('thicknessNum').value = 6;
            document.getElementById('thicknessRange').value = 6;
            document.getElementById('globalScaleNum').value = 100;
            document.getElementById('globalScaleRange').value = 100;
            document.getElementById('letterScaleNum').value = 100;
            document.getElementById('letterScaleRange').value = 100;
            
            generateArt();
            addLog('🔄 모든 설정이 초기화되었습니다.');
        }

        window.onload = generateArt;
    </script>
</body>
</html>
