<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글그림 (시화) 에디터</title>
    <style>
        :root {
            --bg-color: #1a1a20;
            --panel-bg: #272732;
            --input-bg: #1c1c24;
            --text-color: #e8e8ed;
            --text-muted: #9a9ab0;
            --accent: #5a7be0;
            --accent-hover: #4a6bd0;
            --save-btn: #38bdf8;
            --save-btn-hover: #0284c7;
            --border-color: #3f3f50;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; height: 100vh; overflow: hidden;
        }
        #controls {
            width: 350px; min-width: 350px;
            background-color: var(--panel-bg);
            padding: 24px 20px;
            overflow-y: auto;
            box-shadow: 4px 0 15px rgba(0,0,0,0.4);
            z-index: 10;
            display: flex; flex-direction: column; gap: 18px;
        }
        #controls h2 { margin: 0 0 4px 0; font-size: 1.25rem; font-weight: 700; color: #fff; }
        .sub-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 0.85rem; font-weight: 600; color: #c4c4d4; display: flex; justify-content: space-between; }
        .value-badge { color: var(--accent); font-weight: 700; }
        .control-row { display: flex; gap: 12px; }
        .control-row > div { flex: 1; }
        
        input[type="text"], input[type="file"], textarea, select {
            width: 100%; padding: 9px 12px; 
            background: var(--input-bg); border: 1px solid var(--border-color); 
            color: #fff; border-radius: 6px; font-size: 0.88rem; outline: none;
        }
        textarea { height: 110px; resize: vertical; line-height: 1.5; font-family: inherit; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); height: 6px; margin: 6px 0; }
        input[type="color"] { border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; padding: 2px; background: var(--input-bg); width: 100%; height: 38px; }
        
        button {
            padding: 11px 16px; background-color: var(--accent); color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        button:hover { background-color: var(--accent-hover); }
        #btn-save { background-color: var(--save-btn); color: #0f172a; margin-top: 8px; font-size: 1rem; font-weight: 700; padding: 13px; }
        #btn-save:hover { background-color: var(--save-btn-hover); color: #ffffff; }

        #preview {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px;
            background: repeating-conic-gradient(#15151a 0% 25%, #1d1d26 0% 50%) 50% / 32px 32px;
            position: relative; overflow: hidden;
        }
        canvas { max-width: 100%; max-height: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.6); object-fit: contain; }
        .empty-hint {
            position: absolute; color: var(--text-muted); font-size: 0.95rem; pointer-events: none;
            text-align: center; line-height: 1.6; background: rgba(0,0,0,0.4); padding: 12px 24px; border-radius: 20px; backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="controls">
        <div>
            <h2>🎨 글그림 (시화) 에디터</h2>
            <div class="sub-title">로컬 이미지 & 한글 시 레이아웃 스튜디오</div>
        </div>
        
        <!-- 로컬 이미지 로드 -->
        <div class="control-group">
            <label>🖼️ 로컬 배경 이미지 선택</label>
            <input type="file" id="img-file" accept="image/*">
        </div>
        
        <!-- 로컬 폰트 로드 -->
        <div class="control-group">
            <label>✒️ 로컬 폰트 선택 (.ttf, .otf)</label>
            <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2">
        </div>

        <!-- 시 입력 -->
        <div class="control-group">
            <label>📜 시 구절 (Text)</label>
            <textarea id="text-input" placeholder="여기에 시를 입력하세요.">얼굴 하나 야위어 가오.
달이 차오르는 밤이면...</textarea>
        </div>

        <!-- 텍스트 속성 제어 -->
        <div class="control-row">
            <div class="control-group">
                <label>글자 크기 <span id="val-size" class="value-badge">60px</span></label>
                <input type="range" id="font-size" min="20" max="250" value="60">
            </div>
            <div class="control-group">
                <label>글자 색상</label>
                <input type="color" id="text-color" value="#ffffff">
            </div>
        </div>

        <div class="control-row">
            <div class="control-group">
                <label>줄 간격 <span id="val-line" class="value-badge">1.5</span></label>
                <input type="range" id="line-height" min="1.0" max="3.0" step="0.1" value="1.5">
            </div>
            <div class="control-group">
                <label>글자 간격 <span id="val-letter" class="value-badge">0px</span></label>
                <input type="range" id="letter-spacing" min="-20" max="60" value="0">
            </div>
        </div>

        <!-- 방향 및 정렬 -->
        <div class="control-group">
            <label>글쓰기 방향</label>
            <select id="text-dir">
                <option value="horizontal">가로 쓰기</option>
                <option value="vertical">세로 쓰기 (우→좌 진행)</option>
            </select>
        </div>

        <div class="control-row">
            <div class="control-group">
                <label>가로 위치 정렬</label>
                <select id="align-x">
                    <option value="left">왼쪽</option>
                    <option value="center" selected>가운데</option>
                    <option value="right">오른쪽</option>
                </select>
            </div>
            <div class="control-group">
                <label>세로 위치 정렬</label>
                <select id="align-y">
                    <option value="top">위</option>
                    <option value="center" selected>중간</option>
                    <option value="bottom">아래</option>
                </select>
            </div>
        </div>

        <button id="btn-save">💾 고해상도 시화 저장하기</button>
    </div>

    <div id="preview">
        <canvas id="canvas"></canvas>
        <div id="empty-hint" class="empty-hint">좌측에서 로컬 이미지를 선택해 주세요.</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const emptyHint = document.getElementById('empty-hint');
            
            let currentImage = null;
            let customFontName = 'Malgun Gothic';

            const elImgFile = document.getElementById('img-file');
            const elFontFile = document.getElementById('font-file');
            const elText = document.getElementById('text-input');
            const elSize = document.getElementById('font-size');
            const elColor = document.getElementById('text-color');
            const elLine = document.getElementById('line-height');
            const elLetter = document.getElementById('letter-spacing');
            const elDir = document.getElementById('text-dir');
            const elAlignX = document.getElementById('align-x');
            const elAlignY = document.getElementById('align-y');
            const btnSave = document.getElementById('btn-save');

            // 로컬 이미지 로딩
            elImgFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        emptyHint.style.display = 'none';
                        draw();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 로컬 폰트 로딩
            elFontFile.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const fontName = 'CustomFont_' + Date.now();
                    const fontBuffer = await file.arrayBuffer();
                    const fontFace = new FontFace(fontName, fontBuffer);
                    await fontFace.load();
                    document.fonts.add(fontFace);
                    customFontName = fontName;
                    draw();
                } catch (err) {
                    alert("폰트 파일 로딩에 실패했습니다: " + err.message);
                }
            });

            // 실시간 렌더링 이벤트
            const inputs = [elText, elSize, elColor, elLine, elLetter, elDir, elAlignX, elAlignY];
            inputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    if(e.target === elSize) document.getElementById('val-size').innerText = e.target.value + 'px';
                    if(e.target === elLine) document.getElementById('val-line').innerText = e.target.value;
                    if(e.target === elLetter) document.getElementById('val-letter').innerText = e.target.value + 'px';
                    draw();
                });
            });

            function draw() {
                if (!currentImage) {
                    canvas.width = 1000; canvas.height = 1000;
                    ctx.fillStyle = '#1c1c24'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(currentImage, 0, 0);
                }

                const text = elText.value;
                if (!text.trim()) return;

                const fontSize = parseInt(elSize.value);
                const lineHeight = parseFloat(elLine.value);
                const letterSpacing = parseInt(elLetter.value);
                const alignX = elAlignX.value;
                const alignY = elAlignY.value;
                const dir = elDir.value;
                const padding = Math.min(canvas.width, canvas.height) * 0.08;

                ctx.font = `${fontSize}px "${customFontName}"`;
                ctx.fillStyle = elColor.value;
                
                const lines = text.split('\n');

                if (dir === 'horizontal') {
                    ctx.textAlign = alignX; ctx.textBaseline = "top";
                    const blockHeight = lines.length * (fontSize * lineHeight);
                    
                    let startY = padding;
                    if (alignY === 'center') startY = (canvas.height - blockHeight) / 2;
                    if (alignY === 'bottom') startY = canvas.height - blockHeight - padding;

                    let startX = padding;
                    if (alignX === 'center') startX = canvas.width / 2;
                    if (alignX === 'right') startX = canvas.width - padding;

                    lines.forEach((line, i) => {
                        const y = startY + (i * fontSize * lineHeight);
                        if (letterSpacing === 0) {
                            ctx.fillText(line, startX, y);
                        } else {
                            let lineW = 0;
                            for(let c of line) lineW += ctx.measureText(c).width + letterSpacing;
                            lineW -= letterSpacing;
                            
                            let currentX = startX;
                            if(alignX === 'center') currentX = canvas.width/2 - lineW/2;
                            if(alignX === 'right') currentX = canvas.width - padding - lineW;

                            ctx.textAlign = 'left';
                            for(let char of line) {
                                ctx.fillText(char, currentX, y);
                                currentX += ctx.measureText(char).width + letterSpacing;
                            }
                            ctx.textAlign = alignX;
                        }
                    });

                } else {
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    const blockWidth = lines.length * (fontSize * lineHeight);
                    
                    let maxLen = 0;
                    lines.forEach(l => { if (l.length > maxLen) maxLen = l.length; });
                    const blockHeight = maxLen * (fontSize + letterSpacing);

                    let startX = canvas.width - padding - (fontSize/2);
                    if (alignX === 'center') startX = (canvas.width / 2) + (blockWidth / 2) - (fontSize/2);
                    if (alignX === 'left') startX = padding + blockWidth - (fontSize/2);

                    let startY = padding + (fontSize/2);
                    if (alignY === 'center') startY = (canvas.height - blockHeight) / 2 + (fontSize/2);
                    if (alignY === 'bottom') startY = canvas.height - padding - blockHeight + (fontSize/2);

                    lines.forEach((line, i) => {
                        const x = startX - (i * fontSize * lineHeight);
                        for(let j = 0; j < line.length; j++) {
                            const y = startY + (j * (fontSize + letterSpacing));
                            ctx.fillText(line[j], x, y);
                        }
                    });
                }
            }

            btnSave.addEventListener('click', () => {
                if (!currentImage) { alert("배경 이미지를 먼저 선택해 주세요."); return; }
                const link = document.createElement('a');
                link.download = '정지용_글그림_시화.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            draw();
        })();
    </script>
</body>
</html>
