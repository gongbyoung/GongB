<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한글전서체 타이포 엔진 v0.5</title>
    <style>
        :root {
            --bg-color: #050404;
            --seal-red: #c82018;
            --guide-border: #00ffcc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 2단 컨트롤 패널 */
        #ctrl-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(18, 15, 15, 0.95);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(200, 32, 24, 0.45);
            z-index: 1000;
            backdrop-filter: blur(12px);
            font-size: 11px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.85);
            max-width: 95vw;
        }

        .ctrl-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        #ctrl-container button, #ctrl-container select, #ctrl-container label, #ctrl-container input {
            background: #201c1c;
            color: #eeddbb;
            border: 1px solid #483a3a;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            outline: none;
        }

        #ctrl-container input[type="number"] { width: 55px; text-align: center; }
        #ctrl-container input[type="range"] { accent-color: var(--seal-red); cursor: pointer; }
        #ctrl-container button:hover, #ctrl-container label:hover { background: var(--seal-red); color: #fff; }
        #file-input { display: none; }

        #time-slider { flex: 1; min-width: 150px; height: 5px; }
        #timeline-info {
            color: #00ffcc;
            font-family: monospace;
            font-size: 12px;
            min-width: 85px;
            text-align: center;
        }

        #viewport-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.25s, height 0.25s;
        }

        .ratio-16-9 { width: 1120px; height: 630px; border: 2px dashed var(--guide-border); }
        .ratio-9-16 { width: 380px; height: 675px; border: 2px dashed var(--guide-border); }

        #renderCanvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

<div id="ctrl-container">
    <!-- 1행: 파일, 화면비, 조형 파라미터 조절 -->
    <div class="ctrl-row">
        <label for="file-input">📂 LOAD SRT</label>
        <input type="file" id="file-input" accept=".srt">
        
        <label>화면비:</label>
        <select id="ratio-select" onchange="changeRatio(this.value)">
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
        </select>

        <label>한줄 글자수:</label>
        <select id="col-select" onchange="renderCurrentFrame()">
            <option value="auto">자동(정방형)</option>
            <option value="2">2자씩</option>
            <option value="3">3자씩</option>
            <option value="4">4자씩</option>
            <option value="5">5자씩</option>
        </select>

        <label>획 굵기:</label>
        <input type="range" id="weight-slider" min="1" max="25" value="6" oninput="syncWeight(this.value)">
        <span id="weight-val">6px</span>

        <label>자간:</label>
        <input type="range" id="spacing-slider" min="-30" max="60" value="10" oninput="syncSpacing(this.value)">
        <span id="spacing-val">10px</span>

        <label>글자 크기(px):</label>
        <input type="number" id="fixed-px-val" value="160" min="40" max="600" step="10" onchange="renderCurrentFrame()">
    </div>

    <!-- 2행: 인/아웃 모션 및 타임라인 컨트롤 -->
    <div class="ctrl-row">
        <label>IN:</label>
        <select id="in-select">
            <option value="snake-in" selected>1. 획들이 뱀처럼 들어오기</option>
            <option value="slide-up">2. 바닥에서 스르륵 올라오기</option>
            <option value="stamp-char">3. 도장찍듯이 한글자씩 찍히기</option>
            <option value="stamp-top">4. 상단 도장 날인(눌림 복원)</option>
            <option value="fold-unfold">5. 접혔던 획 펼치기</option>
            <option value="ink-bleed">6. 먹물 번짐</option>
            <option value="spiral-in">7. 나선 수렴</option>
            <option value="converge-4way">8. 4방향 수렴</option>
            <option value="elastic-pop">9. 탄성 팝업</option>
            <option value="typing-stroke">10. 획 순서 드로잉</option>
        </select>

        <label>OUT:</label>
        <select id="out-select">
            <option value="snake-out" selected>★ 수평/수직 뱀 굴곡 비산</option>
            <option value="dust-fly">2. 공중 날리기</option>
            <option value="next-stamp-crush">3. 으깨지며 소멸</option>
            <option value="wind-sweep">4. 바람에 날리기</option>
            <option value="wipe-side">5. 와이퍼 닦기</option>
            <option value="diag-popout">6. 대각선 소멸</option>
            <option value="sink-down">7. 바닥 침몰</option>
            <option value="stroke-shatter">8. 획 유리 파쇄</option>
            <option value="blackhole">9. 블랙홀 소멸</option>
            <option value="melt-drip">10. 먹물 흘러내림</option>
        </select>

        <button id="play-btn" onclick="togglePlay()">▶ 재생</button>
        <button id="pause-btn" onclick="togglePause()">⏸ 일시정지</button>
        <input type="range" id="time-slider" min="0" max="100" step="0.01" value="0" oninput="seekTime(this.value)">
        <span id="timeline-info">00:00.00</span>
    </div>
</div>

<div id="viewport-wrapper" class="ratio-16-9">
    <canvas id="renderCanvas"></canvas>
</div>

<script>
    let subtitles = [];
    let isPlaying = false;
    let isPaused = false;
    let currentTime = 0;
    let lastTimestamp = 0;
    let animFrameId = null;
    let currentCueIndex = -1;

    let strokeWidthVal = 6;
    let charSpacingVal = 10;

    const viewport = document.getElementById('viewport-wrapper');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const timeSlider = document.getElementById('time-slider');
    const timelineInfo = document.getElementById('timeline-info');
    const playBtn = document.getElementById('play-btn');
    const inSelect = document.getElementById('in-select');
    const outSelect = document.getElementById('out-select');
    const colSelect = document.getElementById('col-select');
    const fixedPxInput = document.getElementById('fixed-px-val');

    let currentGlyphs = [];

    function syncCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = viewport.clientWidth * dpr;
        canvas.height = viewport.clientHeight * dpr;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', () => { syncCanvas(); renderCurrentFrame(); });

    function changeRatio(ratio) {
        viewport.className = ratio === '16:9' ? 'ratio-16-9' : 'ratio-9-16';
        syncCanvas();
        renderCurrentFrame();
    }

    function syncWeight(v) {
        strokeWidthVal = parseFloat(v);
        document.getElementById('weight-val').innerText = v + 'px';
        renderCurrentFrame();
    }

    function syncSpacing(v) {
        charSpacingVal = parseFloat(v);
        document.getElementById('spacing-val').innerText = v + 'px';
        renderCurrentFrame();
    }

    // SRT 파서
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            parseSRT(evt.target.result);
        };
        reader.readAsText(file);
    });

    function parseSRT(data) {
        const clean = data.replace(/\r/g, '').trim();
        const blocks = clean.split(/\n\s*\n/);
        subtitles = [];

        blocks.forEach(block => {
            const lines = block.trim().split('\n');
            if(lines.length < 2) return;
            const timeLine = lines.find(l => l.includes('-->'));
            if(!timeLine) return;

            const tIdx = lines.indexOf(timeLine);
            const times = timeLine.split('-->');
            const text = lines.slice(tIdx + 1).join(' ').trim();

            subtitles.push({
                start: timeToSec(times[0].trim()),
                end: timeToSec(times[1].trim()),
                text: text
            });
        });

        if(subtitles.length > 0) {
            const maxEnd = subtitles[subtitles.length - 1].end;
            timeSlider.max = maxEnd + 1;
            alert(`SRT 자막 ${subtitles.length}개가 로드되었습니다.`);
            currentTime = 0;
            currentCueIndex = 0;
            buildGlyphs(0);
            renderCurrentFrame();
        }
    }

    function timeToSec(str) {
        const p = str.replace(',', '.').split(':');
        return parseFloat(p[0])*3600 + parseFloat(p[1])*60 + parseFloat(p[2]);
    }

    // =========================================================================
    // [한글전서체 획 분절 및 굴곡 벡터 엔진]
    // 획들을 세부 수평(H)/수직(V) 선분으로 쪼개어 유기적인 뱀 탈출 궤적을 부여
    // =========================================================================
    function getJeonseoSegmentStrokes(char, seed) {
        const segments = [];
        const code = char.charCodeAt(0);
        let cho = 0, jung = 0, jong = 0;
        let isHangul = (code >= 0xAC00 && code <= 0xD7A3);

        if (isHangul) {
            const sIdx = code - 0xAC00;
            jong = sIdx % 28;
            jung = Math.floor((sIdx - jong) / 28) % 21;
            cho = Math.floor(Math.floor((sIdx - jong) / 28) / 21);
        }

        const hasJong = jong > 0;
        const topH = hasJong ? 0.52 : 0.94;
        const botY = hasJong ? 0.56 : 0.94;
        const isVertVowel = [0, 1, 2, 3, 20].includes(jung);
        const choW = isVertVowel ? 0.62 : 0.94;
        const vX = 0.94;

        // 보조 선분 추가기
        function addSeg(x1, y1, x2, y2, type) {
            segments.push({
                x1, y1, x2, y2,
                type: type || (Math.abs(x2 - x1) > Math.abs(y2 - y1) ? 'H' : 'V')
            });
        }

        // 초성
        if ([9, 10].includes(cho)) { // ㅈ, ㅊ
            addSeg(0.06, 0.06, choW, 0.06, 'H');
            addSeg(choW * 0.5, 0.06, 0.12, topH * 0.45, 'V');
            addSeg(0.12, topH * 0.45, 0.06, topH * 0.92, 'V');
            addSeg(choW * 0.5, 0.06, choW - 0.12, topH * 0.45, 'V');
            addSeg(choW - 0.12, topH * 0.45, choW, topH * 0.92, 'V');
        } else if (cho === 17) { // ㅍ
            addSeg(0.06, 0.06, choW, 0.06, 'H');
            addSeg(0.06, topH * 0.92, choW, topH * 0.92, 'H');
            addSeg(choW * 0.35, 0.06, choW * 0.35, topH * 0.92, 'V');
            addSeg(choW * 0.65, 0.06, choW * 0.65, topH * 0.92, 'V');
        } else if ([0, 15].includes(cho)) { // ㄱ, ㅋ
            addSeg(0.06, 0.06, choW, 0.06, 'H');
            addSeg(choW, 0.06, choW, topH * 0.92, 'V');
            if (cho === 15) addSeg(0.06, topH * 0.45, choW, topH * 0.45, 'H');
        } else if ([11, 18].includes(cho)) { // ㅇ, ㅎ
            addSeg(0.15, 0.06, choW - 0.15, 0.06, 'H');
            addSeg(0.06, 0.2, 0.06, topH * 0.75, 'V');
            addSeg(choW, 0.2, choW, topH * 0.75, 'V');
            addSeg(0.15, topH * 0.92, choW - 0.15, topH * 0.92, 'H');
            addSeg(0.06, 0.2, 0.15, 0.06, 'H');
            addSeg(choW - 0.15, 0.06, choW, 0.2, 'H');
            addSeg(0.06, topH * 0.75, 0.15, topH * 0.92, 'H');
            addSeg(choW - 0.15, topH * 0.92, choW, topH * 0.75, 'H');
            if (cho === 18) addSeg(0.2, 0.02, choW - 0.2, 0.02, 'H');
        } else { // 기타 (ㄴ, ㄷ, ㅁ 등)
            addSeg(0.06, 0.06, choW, 0.06, 'H');
            addSeg(0.06, 0.06, 0.06, topH * 0.92, 'V');
            addSeg(choW, 0.06, choW, topH * 0.92, 'V');
            addSeg(0.06, topH * 0.92, choW, topH * 0.92, 'H');
        }

        // 중성 모음
        if (isVertVowel) {
            addSeg(vX, 0.06, vX, topH * 0.92, 'V');
            addSeg(choW, topH * 0.45, vX, topH * 0.45, 'H');
        } else {
            addSeg(0.06, topH * 0.92, 0.94, topH * 0.92, 'H');
        }

        // 종성 받침
        if (hasJong) {
            if (jong === 21) { // ㅇ 받침
                addSeg(0.2, botY, 0.8, botY, 'H');
                addSeg(0.06, botY + 0.12, 0.06, 0.82, 'V');
                addSeg(0.94, botY + 0.12, 0.94, 0.82, 'V');
                addSeg(0.2, 0.94, 0.8, 0.94, 'H');
            } else if (jong === 4) { // ㄴ 받침
                addSeg(0.06, botY, 0.06, 0.94, 'V');
                addSeg(0.06, 0.94, 0.94, 0.94, 'H');
            } else {
                addSeg(0.06, botY, 0.94, botY, 'H');
                addSeg(0.06, botY, 0.06, 0.94, 'V');
                addSeg(0.94, botY, 0.94, 0.94, 'V');
                addSeg(0.06, 0.94, 0.94, 0.94, 'H');
            }
        }

        // 물리 비산 궤적 파라미터 매핑
        return segments.map((seg, i) => {
            const angle = (i / segments.length) * Math.PI * 2 + (seed * 0.4);
            return {
                ...seg,
                dirX: Math.cos(angle) * (380 + (i % 3) * 120),
                dirY: Math.sin(angle) * (280 + (i % 2) * 120),
                rotSpeed: (i % 2 === 0 ? 1 : -1) * (2.0 + (i % 3)),
                phase: i * 0.6
            };
        });
    }

    // 자막 문자열을 사각 박스 격자에 배치
    function buildGlyphs(idx) {
        if(!subtitles[idx]) return;
        const sub = subtitles[idx];
        const chars = sub.text.replace(/\s+/g, '').split('');
        if(chars.length === 0) return;

        const vW = viewport.clientWidth;
        const vH = viewport.clientHeight;
        const slotSize = parseFloat(fixedPxInput.value) || 160;
        const total = chars.length;

        // 한줄 글자수 설정 적용
        let cols;
        const colMode = colSelect.value;
        if(colMode === 'auto') {
            cols = Math.ceil(Math.sqrt(total));
        } else {
            cols = parseInt(colMode);
        }

        const rows = Math.ceil(total / cols);
        const stepX = slotSize + charSpacingVal;
        const stepY = slotSize + charSpacingVal;
        const totalW = cols * slotSize + (cols - 1) * charSpacingVal;
        const totalH = rows * slotSize + (rows - 1) * charSpacingVal;
        const startX = (vW - totalW) / 2;
        const startY = (vH - totalH) / 2;

        currentGlyphs = chars.map((char, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const gx = startX + col * stepX;
            const gy = startY + row * stepY;

            const strokes = getJeonseoSegmentStrokes(char, i * 43);

            return {
                char,
                x: gx,
                y: gy,
                size: slotSize,
                strokes: strokes
            };
        });
    }

    // ========================================================
    // [렌더러 및 뱀 비산 모션 엔진]
    // ========================================================
    function renderFrame(curTime) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(!subtitles[currentCueIndex]) return;

        const sub = subtitles[currentCueIndex];
        const cueDuration = Math.max(sub.end - sub.start, 0.4);
        const elapsed = curTime - sub.start;
        const normTime = Math.min(Math.max(elapsed / cueDuration, 0), 1);

        const inType = inSelect.value;
        const outType = outSelect.value;

        const inWindow = 0.25;
        const outWindow = 0.25;
        const inProgress = Math.min(normTime / inWindow, 1);
        const isOut = normTime > (1 - outWindow);
        const outProgress = isOut ? (normTime - (1 - outWindow)) / outWindow : 0;

        ctx.strokeStyle = '#c82018';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = strokeWidthVal;

        currentGlyphs.forEach((glyph, gIdx) => {
            const charDelay = gIdx * 0.05;
            const localInP = Math.min(Math.max((inProgress - charDelay) / (1 - charDelay || 1), 0), 1);
            const localOutP = isOut ? Math.min(Math.max((outProgress - charDelay * 0.4) / 0.8, 0), 1) : 0;

            glyph.strokes.forEach((stroke, sIdx) => {
                ctx.save();

                let scaleX = 1, scaleY = 1;
                let transX = glyph.x;
                let transY = glyph.y;
                let rotation = 0;
                let alpha = 1;

                // --- 1. IN 효과 ---
                if (localInP < 1) {
                    const p = localInP;
                    switch (inType) {
                        case 'snake-in':
                            // 획 방향별 유기적 진입
                            const inW = Math.sin((1 - p) * Math.PI * 3 + stroke.phase) * 50;
                            if (stroke.type === 'H') {
                                transX += stroke.dirX * (1 - p);
                                transY += inW;
                            } else {
                                transX += inW;
                                transY += stroke.dirY * (1 - p);
                            }
                            alpha = p;
                            break;

                        case 'slide-up':
                            transY += (1 - p) * 180;
                            alpha = p;
                            break;

                        case 'stamp-char':
                            const sp = Math.min(p * 1.5, 1);
                            scaleX = scaleY = sp < 0.85 ? 3.0 - sp * 2.3 : 1.0;
                            alpha = Math.min(sp * 2, 1);
                            break;

                        case 'stamp-top':
                            if (p < 0.6) {
                                transY += (1 - p / 0.6) * -300;
                                scaleY = 1.4; scaleX = 0.7;
                            } else if (p < 0.8) {
                                scaleY = 0.65; scaleX = 1.35;
                            } else {
                                scaleY = scaleX = 1.0;
                            }
                            alpha = Math.min(p * 2, 1);
                            break;

                        case 'fold-unfold':
                            scaleX = Math.max(p, 0.05);
                            scaleY = Math.sin(p * Math.PI * 0.5);
                            alpha = p;
                            break;

                        case 'ink-bleed':
                            alpha = Math.pow(p, 1.8);
                            ctx.shadowColor = 'rgba(200, 32, 24, 0.6)';
                            ctx.shadowBlur = (1 - p) * 25;
                            break;

                        case 'spiral-in':
                            const spin = (1 - p) * Math.PI * 3;
                            transX += Math.cos(spin) * 180 * (1 - p);
                            transY += Math.sin(spin) * 180 * (1 - p);
                            rotation = spin;
                            alpha = p;
                            break;

                        case 'converge-4way':
                            const cd = sIdx % 4;
                            if (cd === 0) transX -= (1 - p) * 350;
                            if (cd === 1) transX += (1 - p) * 350;
                            if (cd === 2) transY -= (1 - p) * 250;
                            if (cd === 3) transY += (1 - p) * 250;
                            alpha = p;
                            break;

                        case 'elastic-pop':
                            const bc = Math.sin(p * Math.PI * 1.5) * Math.exp(-p * 3);
                            scaleX = 1 + bc * 0.8;
                            scaleY = 1 - bc * 0.4;
                            alpha = Math.min(p * 2, 1);
                            break;

                        case 'typing-stroke':
                            alpha = p > (sIdx / glyph.strokes.length) ? 1 : 0;
                            break;
                    }
                }

                // --- 2. OUT 효과 (수평/수직 분절 뱀 비산 강화) ---
                if (localOutP > 0) {
                    const op = localOutP;
                    switch (outType) {
                        case 'snake-out':
                            // 수평/수직 획의 고유 방향 뱀 굴곡
                            const wave = Math.sin(op * Math.PI * 5 + stroke.phase) * 45;
                            if (stroke.type === 'H') {
                                // 수평선은 좌우로 흐르며 수직으로 격하게 요동침
                                transX += (stroke.dirX > 0 ? 1 : -1) * op * 550;
                                transY += wave * (1 + op * 2);
                                rotation = Math.sin(op * Math.PI * 2) * 0.4;
                            } else {
                                // 수직선은 위아래로 솟구치며 좌우로 구불거림
                                transX += wave * (1 + op * 2);
                                transY += (stroke.dirY > 0 ? 1 : -1) * op * 450;
                                rotation = Math.cos(op * Math.PI * 2) * 0.4;
                            }
                            alpha = 1 - Math.pow(op, 2);
                            break;

                        case 'dust-fly':
                            transY -= op * 180;
                            transX += Math.sin(op * Math.PI * 2 + sIdx) * 50;
                            scaleX = scaleY = Math.max(1 - op, 0);
                            alpha = 1 - op;
                            break;

                        case 'next-stamp-crush':
                            scaleY = Math.max(1 - op * 1.5, 0.02);
                            scaleX = 1 + op * 0.8;
                            transY += op * 40;
                            alpha = 1 - op;
                            break;

                        case 'wind-sweep':
                            transX += op * 550;
                            transY -= op * 90;
                            rotation = op * 0.4;
                            alpha = 1 - op;
                            break;

                        case 'wipe-side':
                            alpha = op > (sIdx / glyph.strokes.length) ? 0 : 1;
                            break;

                        case 'diag-popout':
                            transX += op * 280;
                            transY -= op * 280;
                            scaleX = scaleY = Math.max(1 - op, 0);
                            alpha = 1 - op;
                            break;

                        case 'sink-down':
                            transY += op * 220;
                            alpha = 1 - op;
                            break;

                        case 'stroke-shatter':
                            transX += (Math.random() - 0.5) * 80 * op;
                            transY += (Math.random() - 0.5) * 80 * op;
                            rotation = op * 3;
                            alpha = 1 - op;
                            break;

                        case 'blackhole':
                            scaleX = scaleY = Math.max(1 - op, 0);
                            rotation = -op * Math.PI * 4;
                            alpha = 1 - op;
                            break;

                        case 'melt-drip':
                            transY += op * 180;
                            scaleY = 1 + op * 2.5;
                            scaleX = Math.max(1 - op * 0.6, 0.2);
                            alpha = 1 - op;
                            break;
                    }
                }

                // 선분 렌더링
                ctx.globalAlpha = Math.max(alpha, 0);
                ctx.translate(transX + glyph.size / 2, transY + glyph.size / 2);
                ctx.rotate(rotation);
                ctx.scale(scaleX, scaleY);
                ctx.translate(-glyph.size / 2, -glyph.size / 2);

                ctx.beginPath();
                ctx.moveTo(stroke.x1 * glyph.size, stroke.y1 * glyph.size);
                ctx.lineTo(stroke.x2 * glyph.size, stroke.y2 * glyph.size);
                ctx.stroke();

                ctx.restore();
            });
        });
    }

    function renderCurrentFrame() {
        if(currentCueIndex === -1 && subtitles.length > 0) currentCueIndex = 0;
        buildGlyphs(currentCueIndex);
        renderFrame(currentTime);
    }

    // 타임라인 탐색(슬라이더 조작)
    function seekTime(val) {
        currentTime = parseFloat(val);
        updateTimelineUI();

        const activeIdx = subtitles.findIndex(s => currentTime >= s.start && currentTime <= s.end);
        if(activeIdx !== -1 && activeIdx !== currentCueIndex) {
            currentCueIndex = activeIdx;
            buildGlyphs(currentCueIndex);
        }
        renderFrame(currentTime);
    }

    function updateTimelineUI() {
        timeSlider.value = currentTime;
        const mm = Math.floor(currentTime / 60).toString().padStart(2, '0');
        const ss = (currentTime % 60).toFixed(2).padStart(5, '0');
        timelineInfo.innerText = `${mm}:${ss}`;
    }

    // 재생 / 일시정지 제어
    function togglePlay() {
        if(subtitles.length === 0) {
            subtitles = [
                { start: 0.5, end: 3.5, text: "증평군수인" },
                { start: 4.0, end: 7.0, text: "치마폭에" },
                { start: 7.5, end: 10.5, text: "바다바람" }
            ];
            timeSlider.max = 11.5;
            alert("기본 한글전서체 샘플 자막이 로드되었습니다.");
        }

        if(isPaused) {
            isPaused = false;
            isPlaying = true;
            lastTimestamp = performance.now();
            playBtn.innerText = "⏹ 정지";
            loop();
            return;
        }

        isPlaying = !isPlaying;
        if(isPlaying) {
            playBtn.innerText = "⏹ 정지";
            lastTimestamp = performance.now();
            loop();
        } else {
            playBtn.innerText = "▶ 재생";
            cancelAnimationFrame(animFrameId);
        }
    }

    function togglePause() {
        if(!isPlaying) return;
        isPaused = !isPaused;
        if(isPaused) {
            cancelAnimationFrame(animFrameId);
            document.getElementById('pause-btn').innerText = "▶ 계속";
        } else {
            lastTimestamp = performance.now();
            document.getElementById('pause-btn').innerText = "⏸ 일시정지";
            loop();
        }
    }

    function loop() {
        if(!isPlaying || isPaused) return;

        const now = performance.now();
        const delta = (now - lastTimestamp) / 1000;
        lastTimestamp = now;
        currentTime += delta;

        updateTimelineUI();

        const activeIdx = subtitles.findIndex(s => currentTime >= s.start && currentTime <= s.end);
        if(activeIdx !== -1 && activeIdx !== currentCueIndex) {
            currentCueIndex = activeIdx;
            buildGlyphs(currentCueIndex);
        }

        if(currentCueIndex !== -1) {
            renderFrame(currentTime);
        }

        if(currentTime > subtitles[subtitles.length - 1].end + 0.5) {
            togglePlay();
            return;
        }

        animFrameId = requestAnimationFrame(loop);
    }

    // 초기 설정 구동
    syncCanvas();
    renderCurrentFrame();
</script>
</body>
</html>
