<style>

<div class="jamo-box" style="border-color:#22c55e"><div class="sec-title">종성</div><div class="label">거리 <span id="vJongDist">1.00x</span></div><input type="range" id="jongDist" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">크기 <span id="vJongSize">1.00x</span></div><input type="range" id="jongSize" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">랜덤 <span id="vJongRand">0.00</span></div><input type="range" id="jongRand" min="0" max="1.0" step="0.05" value="0.0"></div>

</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv');
const ctx = cv.getContext('2d');
let baseFont = null;
let uniqChars = [];
let curIdx = 0;
let curChar = '가';

function log(m){ $('log').textContent=`[${new Date().toLocaleTimeString().slice(0,8)}] ${m}\n`+$('log').textContent; }

function parseSRT(raw){
  const blocks = raw.replace(/\r/g,'').trim().split(/\n\s*\n/);
  const out=[];
  for(const b of blocks){
    const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length<2) continue;
    let i=0; if(/^\d+$/.test(lines[0])) i=1;
    const mm=(lines[i]||'').match(/(.+?)\s*-->\s*(.+)/);
    if(!mm) continue;
    out.push({text: lines.slice(i+1).join('\n')});
  }
  return out;
}
function analyze(){
  const raw=$('srtTa').value.trim();
  if(!raw){ alert('SRT 붙여넣기'); return; }
  const srt=parseSRT(raw);
  const all=srt.map(o=>o.text).join('').replace(/[\s]/g,'');
  const allChars=[...all].filter(c=>/[가-힣]/.test(c));
  uniqChars=[...new Set(allChars)];
  if(uniqChars.length===0){ alert('한글 없음'); return; }
  $('infoNum').textContent=`전체 ${allChars.length}자 / 고유 ${uniqChars.length}자`;
  buildGrid(uniqChars);
  curIdx=0; curChar=uniqChars[0];
  updateIndicator(); renderGrid(); renderChar(curChar);
}
function buildGrid(chars){
  const grid=$('char-grid'); grid.innerHTML='';
  chars.forEach((ch, idx)=>{
    const btn=document.createElement('button'); btn.className='char-btn'; btn.textContent=ch;
    btn.onclick=()=>{ curIdx=idx; curChar=ch; updateIndicator(); renderGrid(); renderChar(ch); };
    grid.appendChild(btn);
  });
}
function renderGrid(){ const grid=$('char-grid'); [...grid.children].forEach((b,i)=>b.classList.toggle('active', i===curIdx)); }
function updateIndicator(){ $('char-indicator').textContent=`${curIdx+1}/${uniqChars.length}`; $('current-char-display').textContent=curChar; }

function getRenderOpts(){
  const getNum=id=>{ const el=$(id); const v=parseFloat(el?.value); return Number.isNaN(v)?null:v; };
  const getCheck=id=> $(id)?.checked ?? false;
  return {
    choDist:getNum('choDist')??1, choSize:getNum('choSize')??1, choRand:getNum('choRand')??0,
    jungDist:getNum('jungDist')??1, jungSize:getNum('jungSize')??1, jungRand:getNum('jungRand')??0,
    jongDist:getNum('jongDist')??1, jongSize:getNum('jongSize')??1, jongRand:getNum('jongRand')??0,
    overallScale:getNum('overallScale')??1,
    jamoMode:getCheck('jamoMode'), jamoClampOff:getCheck('jamoClampOff'),
    bgTransparent:getCheck('bgTransparent'), showGuide:getCheck('showGuide'), showCenter:getCheck('showCenter'), showBoxes:getCheck('showBoxes')
  };
}
function getBounds(path){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  path.commands.forEach(c=>{
    if(c.x!==undefined){minX=Math.min(minX,c.x); maxX=Math.max(maxX,c.x); minY=Math.min(minY,c.y); maxY=Math.max(maxY,c.y);}
    if(c.x1!==undefined){minX=Math.min(minX,c.x1,c.x2); maxX=Math.max(maxX,c.x1,c.x2); minY=Math.min(minY,c.y1,c.y2); maxY=Math.max(maxY,c.y1,c.y2);}
  });
  if(minX===Infinity) return null;
  return {minX,maxX,minY,maxY,cx:(minX+maxX)/2,cy:(minY+maxY)/2,w:maxX-minX,h:maxY-minY};
}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5; t=Math.imul(t ^ t >>> 15, t | 1); t^=t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0)/4294967296;};}
function getContourArea(cmds){
  let area=0; const pts=[];
  cmds.forEach(c=>{if(c.x!==undefined) pts.push({x:c.x,y:c.y}); else if(c.x1!==undefined){pts.push({x:c.x1,y:c.y1}); pts.push({x:c.x2,y:c.y2}); pts.push({x:c.x,y:c.y});}});
  for(let i=0;i<pts.length;i++){const p1=pts[i], p2=pts[(i+1)%pts.length]; if(p1.x!==undefined && p2.x!==undefined) area+=(p1.x*p2.y - p2.x*p1.y);}
  return area/2;
}
function splitGroups(syl, baseSize){
  try{
    const path=baseFont.getPath(syl,0,0,baseSize);
    const contours=[]; let cur=[]; let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    path.commands.forEach(c=>{
      if(c.type==='M'){
        if(cur.length>0){ const area=getContourArea(cur); if(Math.abs(area)>0.5) contours.push({cmds:cur.slice(), bbox:{minX,maxX,minY,maxY,cx:(minX+maxX)/2,cy:(minY+maxY)/2}, area, isHole:area<0}); cur=[]; minX=Infinity; maxX=-Infinity; minY=Infinity; maxY=-Infinity; }
        cur.push(c); if(c.x!==undefined){minX=Math.min(minX,c.x); maxX=Math.max(maxX,c.x); minY=Math.min(minY,c.y); maxY=Math.max(maxY,c.y);}
      } else { cur.push(c); if(c.x!==undefined){minX=Math.min(minX,c.x); maxX=Math.max(maxX,c.x); minY=Math.min(minY,c.y); maxY=Math.max(maxY,c.y);} if(c.x1!==undefined){minX=Math.min(minX,c.x1,c.x2); maxX=Math.max(maxX,c.x1,c.x2); minY=Math.min(minY,c.y1,c.y2); maxY=Math.max(maxY,c.y1,c.y2);} }
    });
    if(cur.length>0){ const area=getContourArea(cur); if(Math.abs(area)>0.5) contours.push({cmds:cur,bbox:{minX,maxX,minY,maxY,cx:(minX+maxX)/2,cy:(minY+maxY)/2},area,isHole:area<0}); }
    if(contours.length===0) return null;
    let gMinX=Infinity,gMaxX=-Infinity,gMinY=Infinity,gMaxY=-Infinity;
    contours.forEach(ct=>{ if(ct.isHole) return; gMinX=Math.min(gMinX,ct.bbox.minX); gMaxX=Math.max(gMaxX,ct.bbox.maxX); gMinY=Math.min(gMinY,ct.bbox.minY); gMaxY=Math.max(gMaxY,ct.bbox.maxY); });
    if(gMinX===Infinity) return null;
    const gW=gMaxX-gMinX, gH=gMaxY-gMinY;
    if(gW<5||gH<5) return null;
    const groups={cho:[],jung:[],jong:[]};
    contours.forEach(ct=>{
      if(ct.isHole) return;
      if(ct.bbox.w<1||ct.bbox.h<1) return;
      const relY=(ct.bbox.cy-gMinY)/(gH||1), relX=(ct.bbox.cx-gMinX)/(gW||1);
      const code=syl.charCodeAt(0); const S=code-0xAC00; const jungIdx=(S/28|0)%21; const jongIdx=S%28;
      const isSeRo=[0,1,2,3,4,5,6,7,20].includes(jungIdx), isGaRo=[8,12,13,17,18].includes(jungIdx), hasJong=jongIdx!==0;
      let type=1; if(isSeRo&&!hasJong) type=1; else if(isGaRo&&!hasJong) type=2; else if(!isSeRo&&!isGaRo&&!hasJong) type=3; else if(isSeRo&&hasJong) type=4; else if(isGaRo&&hasJong) type=5; else type=6;
      let target='jung';
      if(type===1) target=relX<0.5?'cho':'jung'; else if(type===2) target=relY<0.5?'cho':'jung'; else if(type===3) target=(relX<0.45&&relY<0.55)?'cho':'jung'; else if(type===4) target=relY>0.68?'jong':(relX<0.5?'cho':'jung'); else if(type===5) target=relY<0.38?'cho':(relY<0.65?'jung':'jong'); else target=relY>0.72?'jong':(relX<0.45&&relY<0.45?'cho':'jung');
      groups[target].push(ct);
    });
    function toPath(group){ const p=new opentype.Path(); group.forEach(ct=>{ct.cmds.forEach(c=>{if(c.type==='M') p.moveTo(c.x,c.y); else if(c.type==='L') p.lineTo(c.x,c.y); else if(c.type==='C') p.curveTo(c.x1,c.y1,c.x2,c.y2,c.x,c.y); else if(c.type==='Q') p.quadTo(c.x1,c.y1,c.x,c.y); else if(c.type==='Z') p.close();});}); let bMinX=Infinity,bMaxX=-Infinity,bMinY=Infinity,bMaxY=-Infinity; group.forEach(ct=>{bMinX=Math.min(bMinX,ct.bbox.minX); bMaxX=Math.max(bMaxX,ct.bbox.maxX); bMinY=Math.min(bMinY,ct.bbox.minY); bMaxY=Math.max(bMaxY,ct.bbox.maxY);}); if(bMinX===Infinity) return null; p._bbox={cx:(bMinX+bMaxX)/2,cy:(bMinY+bMaxY)/2,w:bMaxX-bMinX,h:bMaxY-bMinY,minX:bMinX,maxX:bMaxX,minY:bMinY,maxY:bMaxY}; return p; }
    const choPath = groups.cho.length?toPath(groups.cho):null;
    const jungPath = groups.jung.length?toPath(groups.jung):null;
    const jongPath = groups.jong.length?toPath(groups.jong):null;
    if(!choPath && !jungPath && !jongPath) return null;
    return {cho:choPath, jung:jungPath, jong:jongPath};
  }catch(e){ return null; }
}
function getBoxesForType(type, baseSize, renderOpts){
  let b={};
  if(type===1){b.cho={x:-0.18*baseSize,y:0,w:0.52*baseSize,h:0.88*baseSize}; b.jung={x:0.18*baseSize,y:0,w:0.40*baseSize,h:0.88*baseSize};}
  else if(type===2){b.cho={x:0,y:-0.18*baseSize,w:0.85*baseSize,h:0.48*baseSize}; b.jung={x:0,y:0.18*baseSize,w:0.85*baseSize,h:0.42*baseSize};}
  else if(type===3){b.cho={x:-0.12*baseSize,y:-0.14*baseSize,w:0.44*baseSize,h:0.50*baseSize}; b.jung={x:0.14*baseSize,y:0.10*baseSize,w:0.52*baseSize,h:0.60*baseSize};}
  else if(type===4){b.cho={x:-0.16*baseSize,y:-0.16*baseSize,w:0.44*baseSize,h:0.52*baseSize}; b.jung={x:0.16*baseSize,y:-0.16*baseSize,w:0.36*baseSize,h:0.52*baseSize}; b.jong={x:0,y:0.24*baseSize,w:0.78*baseSize,h:0.30*baseSize};}
  else if(type===5){b.cho={x:0,y:-0.22*baseSize,w:0.80*baseSize,h:0.34*baseSize}; b.jung={x:0,y:0.02*baseSize,w:0.78*baseSize,h:0.22*baseSize}; b.jong={x:0,y:0.26*baseSize,w:0.68*baseSize,h:0.26*baseSize};}
  else {b.cho={x:-0.12*baseSize,y:-0.20*baseSize,w:0.40*baseSize,h:0.40*baseSize}; b.jung={x:0.12*baseSize,y:-0.02*baseSize,w:0.50*baseSize,h:0.46*baseSize}; b.jong={x:0,y:0.28*baseSize,w:0.72*baseSize,h:0.24*baseSize};}
  const out={}; Object.entries(b).forEach(([k,box])=>{ 
    const dist=renderOpts[k+'Dist']??1, size=renderOpts[k+'Size']??1; 
    let w2=box.w*size, h2=box.h*size, nx=box.x*dist, ny=box.y*dist; 
    out[k]={x:nx,y:ny,w:w2,h:h2}; 
  }); 
  return out;
}
function deformPath(p,k,renderOpts,seed){
  if(!p) return null; const gb=p._bbox||getBounds(p); if(!gb||gb.w<0.5||gb.h<0.5) return null; const cx=gb.cx, cy=gb.cy; const size=renderOpts[k+'Size']??1, rnd=renderOpts[k+'Rand']??0; const rand=mulberry32(seed); const np=new opentype.Path();
  p.commands.forEach(c=>{
    const dp=(px,py)=>{ let dx=px-cx, dy=py-cy; dx*=size; dy*=size; if(rnd>0){dx+=(rand()-0.5)*rnd*20; dy+=(rand()-0.5)*rnd*20;} return {x:cx+dx,y:cy+dy}; };
    if(c.type==='M'){const q=dp(c.x,c.y); np.moveTo(q.x,q.y);} else if(c.type==='L'){const q=dp(c.x,c.y); np.lineTo(q.x,q.y);} else if(c.type==='C'){const q1=dp(c.x1,c.y1), q2=dp(c.x2,c.y2), q=dp(c.x,c.y); np.curveTo(q1.x,q1.y,q2.x,q2.y,q.x,q.y);} else if(c.type==='Q'){const q1=dp(c.x1,c.y1), q=dp(c.x,c.y); np.quadTo(q1.x,q1.y,q.x,q.y);} else if(c.type==='Z') np.close();
  }); const b=getBounds(np); if(!b||b.w<0.5||b.h<0.5) return null; np._bbox=b; return np;
}
function centerAndFit(paths){
  let gminX=Infinity,gmaxX=-Infinity,gminY=Infinity,gmaxY=-Infinity;
  paths.forEach(o=>{ const b=getBounds(o.path); if(!b) return; gminX=Math.min(gminX,b.minX); gmaxX=Math.max(gmaxX,b.maxX); gminY=Math.min(gminY,b.minY); gmaxY=Math.max(gmaxY,b.maxY); });
  if(gminX===Infinity) return null;
  const gcx=(gminX+gmaxX)/2, gcy=(gminY+gmaxY)/2;
  const gW=gmaxX-gminX, gH=gmaxY-gminY;
  const maxAllowed=900;
  let fitScale=1;
  const maxDim=Math.max(gW,gH);
  if(maxDim > maxAllowed) fitScale = maxAllowed / maxDim;
  if(maxDim < 10) return null;
  const centeredPaths = paths.map(o=>{
    const np=new opentype.Path();
    o.path.commands.forEach(c=>{
      const sc=(px,py,cx,cy,s)=>({x:cx+(px-cx)*s, y:cy+(py-cy)*s});
      if(c.type==='M'){const q=sc(c.x,c.y,gcx,gcy,fitScale); np.moveTo(q.x+540-gcx, q.y+540-gcy);}
      else if(c.type==='L'){const q=sc(c.x,c.y,gcx,gcy,fitScale); np.lineTo(q.x+540-gcx, q.y+540-gcy);}
      else if(c.type==='C'){const q1=sc(c.x1,c.y1,gcx,gcy,fitScale); const q2=sc(c.x2,c.y2,gcx,gcy,fitScale); const q=sc(c.x,c.y,gcx,gcy,fitScale); np.curveTo(q1.x+540-gcx, q1.y+540-gcy, q2.x+540-gcx, q2.y+540-gcy, q.x+540-gcx, q.y+540-gcy);}
      else if(c.type==='Q'){const q1=sc(c.x1,c.y1,gcx,gcy,fitScale); const q=sc(c.x,c.y,gcx,gcy,fitScale); np.quadTo(q1.x+540-gcx, q1.y+540-gcy, q.x+540-gcx, q.y+540-gcy);}
      else if(c.type==='Z') np.close();
    });
    return {...o, path:np};
  });
  return {paths:centeredPaths, fitScale};
}
function renderSimple(ch, baseSize, tctx){
  let fs=baseSize; if(fs>900) fs=900; if(fs<80) fs=80;
  if(baseFont){
    try{
      const p=baseFont.getPath(ch,0,0,baseSize);
      const b=getBounds(p);
      if(b && b.w>1 && b.h>1){
        const gcx=b.cx, gcy=b.cy;
        let fitScale=1; const maxDim=Math.max(b.w,b.h); if(maxDim>900) fitScale=900/maxDim;
        const fp=new opentype.Path();
        p.commands.forEach(c=>{
          const sc=(px,py,cx,cy,s)=>({x:cx+(px-cx)*s, y:cy+(py-cy)*s});
          if(c.type==='M'){const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.moveTo(q.x+540-gcx, q.y+540-gcy);}
          else if(c.type==='L'){const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.lineTo(q.x+540-gcx, q.y+540-gcy);}
          else if(c.type==='C'){const q1=sc(c.x1,c.y1,gcx,gcy,fitScale); const q2=sc(c.x2,c.y2,gcx,gcy,fitScale); const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.curveTo(q1.x+540-gcx, q1.y+540-gcy, q2.x+540-gcx, q2.y+540-gcy, q.x+540-gcx, q.y+540-gcy);}
          else if(c.type==='Q'){const q1=sc(c.x1,c.y1,gcx,gcy,fitScale); const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.quadTo(q1.x+540-gcx, q1.y+540-gcy, q.x+540-gcx, q.y+540-gcy);}
          else if(c.type==='Z') fp.close();
        });
        const p2d=new Path2D();
        fp.commands.forEach(c=>{ if(c.type==='M') p2d.moveTo(c.x,c.y); else if(c.type==='L') p2d.lineTo(c.x,c.y); else if(c.type==='C') p2d.bezierCurveTo(c.x1,c.y1,c.x2,c.y2,c.x,c.y); else if(c.type==='Q') p2d.quadraticCurveTo(c.x1,c.y1,c.x,c.y); else if(c.type==='Z') p2d.closePath(); });
        tctx.fillStyle='#111'; tctx.fill(p2d);
        return {ok:true, fitScale, method:'font', hasPixels:true};
      }
    }catch(e){}
  }
  tctx.fillStyle='#111'; tctx.font=`900 ${fs}px sans-serif`; tctx.textAlign='center'; tctx.textBaseline='middle'; tctx.fillText(ch, 540, 540);
  return {ok:true, fitScale:fs/baseSize, method:'sans', hasPixels:true};
}
function hasVisiblePixels(canvas){
  try{
    const c = canvas.getContext('2d');
    const data = c.getImageData(400,400,280,280).data;
    for(let i=0;i<data.length;i+=4){
      if(data[i]<50 && data[i+3]>10) return true;
    }
    return false;
  }catch(e){ return true; }
}

function renderChar(ch){
  if(!ch) return;
  const renderOpts=getRenderOpts();
  const baseSize=650 * (renderOpts.overallScale??1);
  const textCv=document.createElement('canvas'); textCv.width=1080; textCv.height=1080;
  const tctx=textCv.getContext('2d');
  const guideCv=document.createElement('canvas'); guideCv.width=1080; guideCv.height=1080;
  const gctx=guideCv.getContext('2d');
  let intendedBoxes={};

  try{
    // 1단계: 무조건 보이는 단순 렌더
    const simpleResult = renderSimple(ch, baseSize, tctx);
    log(`단순: ${ch} ${simpleResult.method} fit ${simpleResult.fitScale.toFixed(2)}x - 절대 보임`);

    // 2단계: 분리 ON이면 고급 시도, 실패 시 단순 유지 (절대 안 사라짐)
    if(renderOpts.jamoMode && baseFont){
      const code=ch.charCodeAt(0); const isHangul=code>=0xAC00&&code<=0xD7A3;
      if(isHangul){
        const S=code-0xAC00; const jungIdx=(S/28|0)%21, jongIdx=S%28;
        const isSeRo=[0,1,2,3,4,5,6,7,20].includes(jungIdx), isGaRo=[8,12,13,17,18].includes(jungIdx), hasJong=jongIdx!==0;
        let type=1; if(isSeRo&&!hasJong) type=1; else if(isGaRo&&!hasJong) type=2; else if(!isSeRo&&!isGaRo&&!hasJong) type=3; else if(isSeRo&&hasJong) type=4; else if(isGaRo&&hasJong) type=5; else type=6;
        intendedBoxes=getBoxesForType(type, baseSize, renderOpts);
        const split=splitGroups(ch, baseSize);
        if(split){
          let drawList=[];
          ['cho','jung','jong'].forEach((k,i)=>{
            if(split[k]){
              const box=intendedBoxes[k]; if(!box) return;
              const sp=split[k]; const gb=sp._bbox||getBounds(sp); if(!gb||gb.w<1) return;
              const sx=box.w/(gb.w||baseSize)*0.95, sy=box.h/(gb.h||baseSize)*0.95;
              if(sx<0.01||sy<0.01||sx>10||sy>10) return;
              const tp=new opentype.Path();
              sp.commands.forEach(c=>{
                if(c.type==='M') tp.moveTo((c.x-gb.cx)*sx+box.x, (c.y-gb.cy)*sy+box.y);
                else if(c.type==='L') tp.lineTo((c.x-gb.cx)*sx+box.x, (c.y-gb.cy)*sy+box.y);
                else if(c.type==='C') tp.curveTo((c.x1-gb.cx)*sx+box.x, (c.y1-gb.cy)*sy+box.y, (c.x2-gb.cx)*sx+box.x, (c.y2-gb.cy)*sy+box.y, (c.x-gb.cx)*sx+box.x, (c.y-gb.cy)*sy+box.y);
                else if(c.type==='Q') tp.quadTo((c.x1-gb.cx)*sx+box.x, (c.y1-gb.cy)*sy+box.y, (c.x-gb.cx)*sx+box.x, (c.y-gb.cy)*sy+box.y);
                else if(c.type==='Z') tp.close();
              });
              tp._bbox=getBounds(tp);
              const def=deformPath(tp,k,renderOpts,ch.charCodeAt(0)+i*33);
              if(def) drawList.push({path:def,k, box});
            }
          });
          if(drawList.length>0){
            const centered = centerAndFit(drawList);
            if(centered && centered.paths.length>0){
              // 고급 캔버스에 그려서 픽셀 체크
              const advCv=document.createElement('canvas'); advCv.width=1080; advCv.height=1080;
              const advCtx=advCv.getContext('2d');
              centered.paths.forEach(o=>{
                const p2d=new Path2D();
                o.path.commands.forEach(c=>{ if(c.type==='M') p2d.moveTo(c.x,c.y); else if(c.type==='L') p2d.lineTo(c.x,c.y); else if(c.type==='C') p2d.bezierCurveTo(c.x1,c.y1,c.x2,c.y2,c.x,c.y); else if(c.type==='Q') p2d.quadraticCurveTo(c.x1,c.y1,c.x,c.y); else if(c.type==='Z') p2d.closePath(); });
                advCtx.fillStyle='#111'; advCtx.fill(p2d);
              });
              if(hasVisiblePixels(advCv)){
                // 고급 성공 시에만 단순 덮어쓰기
                tctx.clearRect(0,0,1080,1080);
                tctx.drawImage(advCv,0,0);
                log(`분리 ON 성공: ${ch} ${centered.paths.length}조각 fit ${centered.fitScale.toFixed(2)}x - 중앙 유지`);
              } else {
                log(`분리 ON 실패: ${ch} 픽셀 없음 - 단순 유지 (사라짐 방지)`);
              }
            } else {
              log(`분리 ON 실패: ${ch} centerAndFit null - 단순 유지`);
            }
          } else {
            log(`분리 ON: ${ch} 조각 없음 - 단순 유지`);
          }
        } else {
          log(`분리 ON: ${ch} split null - 단순 유지`);
        }
      }
    }
  }catch(e){
    log(`에러 ${e.message} - 단순 유지`);
  }

  ctx.clearRect(0,0,1080,1080);
  if(!getRenderOpts().bgTransparent){
    const g=ctx.createRadialGradient(540,540,80,540,540,800); g.addColorStop(0,'#f4ecd8'); g.addColorStop(1,'#e8dcc3'); ctx.fillStyle=g; ctx.fillRect(0,0,1080,1080);
  }
  ctx.drawImage(textCv,0,0);
  if(getRenderOpts().showGuide){
    if(getRenderOpts().showCenter){
      gctx.strokeStyle='rgba(59,130,246,0.8)'; gctx.lineWidth=1.5; gctx.setLineDash([12,8]);
      gctx.beginPath(); gctx.moveTo(540,0); gctx.lineTo(540,1080); gctx.stroke();
      gctx.beginPath(); gctx.moveTo(0,540); gctx.lineTo(1080,540); gctx.stroke();
    }
    if(getRenderOpts().showBoxes){
      Object.entries(intendedBoxes||{}).forEach(([k,box])=>{
        if(!box) return;
        const centeredBoxX = 540 + box.x;
        const centeredBoxY = 540 + box.y;
        let col='rgba(239,68,68,0.6)'; if(k==='jung') col='rgba(59,130,246,0.6)'; if(k==='jong') col='rgba(34,197,94,0.6)';
        gctx.strokeStyle=col; gctx.setLineDash([6,4]); gctx.strokeRect(centeredBoxX-box.w/2, centeredBoxY-box.h/2, box.w, box.h);
      });
    }
    ctx.drawImage(guideCv,0,0);
  }
}

function updateLabels(){
  const o=getRenderOpts();
  const set=(id,val)=>{ const el=$(id); if(el) el.textContent=val; };
  set('vOverallScale',(o.overallScale||1).toFixed(2)+'x');
  set('vChoDist',(o.choDist||1).toFixed(2)+'x'); set('vChoSize',(o.choSize||1).toFixed(2)+'x'); set('vChoRand',(o.choRand||0).toFixed(2));
  set('vJungDist',(o.jungDist||1).toFixed(2)+'x'); set('vJungSize',(o.jungSize||1).toFixed(2)+'x'); set('vJungRand',(o.jungRand||0).toFixed(2));
  set('vJongDist',(o.jongDist||1).toFixed(2)+'x'); set('vJongSize',(o.jongSize||1).toFixed(2)+'x'); set('vJongRand',(o.jongRand||0).toFixed(2));
}

['choDist','choSize','choRand','jungDist','jungSize','jungRand','jongDist','jongSize','jongRand','overallScale'].forEach(id=>{
  const el=$(id); if(el) el.addEventListener('input',()=>{ updateLabels(); renderChar(curChar); });
});
['jamoMode','jamoClampOff','bgTransparent','showGuide','showCenter','showBoxes'].forEach(id=>{
  const el=$(id); if(el) el.addEventListener('change',()=>{ renderChar(curChar); });
});
$('btn-prev').onclick=()=>{ if(!uniqChars.length) return; curIdx=(curIdx-1+uniqChars.length)%uniqChars.length; curChar=uniqChars[curIdx]; updateIndicator(); renderGrid(); renderChar(curChar); };
$('btn-next').onclick=()=>{ if(!uniqChars.length) return; curIdx=(curIdx+1)%uniqChars.length; curChar=uniqChars[curIdx]; updateIndicator(); renderGrid(); renderChar(curChar); };
$('btn-apply-srt').onclick=analyze;
$('srt-input').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ $('srtTa').value=ev.target.result; analyze(); }; r.readAsText(f); };
$('ttf-input').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ try{ baseFont=opentype.parse(ev.target.result); $('font-status').textContent=`✅ ${f.name}`; renderChar(curChar); }catch(err){ log(`폰트 오류 ${err.message}`);} }; r.readAsArrayBuffer(f); };

const PRESET_KEY='calli_presets_v1_063';
function getPresets(){ try{ return JSON.parse(localStorage.getItem(PRESET_KEY)||'{}'); }catch(e){ return {}; } }
function savePresets(o){ localStorage.setItem(PRESET_KEY, JSON.stringify(o)); }
function refreshPresetList(){
  const sel=$('presetList'); const presets=getPresets(); sel.innerHTML='';
  Object.keys(presets).forEach(name=>{ const opt=document.createElement('option'); opt.value=name; opt.textContent=name; sel.appendChild(opt); });
  if(Object.keys(presets).length===0){ const opt=document.createElement('option'); opt.textContent='저장된 프리셋 없음'; sel.appendChild(opt); }
}
function collectOpts(){
  const ids=['choDist','choSize','choRand','jungDist','jungSize','jungRand','jongDist','jongSize','jongRand','overallScale'];
  const out={}; ids.forEach(id=>{ const el=$(id); if(el) out[id]=el.value; });
  ['jamoMode','jamoClampOff','bgTransparent','showGuide','showCenter','showBoxes'].forEach(id=>{ const el=$(id); if(el) out[id]=el.checked; });
  return out;
}
function applyOpts(o){ Object.entries(o).forEach(([k,v])=>{ const el=$(k); if(!el) return; if(el.type==='checkbox') el.checked=v; else el.value=v; }); updateLabels(); renderChar(curChar); }
$('btnSavePreset').onclick=()=>{ const name=$('presetName').value.trim(); if(!name){ alert('이름 입력'); return; } const presets=getPresets(); presets[name]=collectOpts(); savePresets(presets); refreshPresetList(); };
$('btnLoadPreset').onclick=()=>{ const sel=$('presetList'); const name=sel.value; const presets=getPresets(); const o=presets[name]; if(!o){ alert('없음'); return; } applyOpts(o); };
$('btnDeletePreset').onclick=()=>{ const sel=$('presetList'); const name=sel.value; if(!confirm(`삭제? ${name}`)) return; const presets=getPresets(); delete presets[name]; savePresets(presets); refreshPresetList(); };

$('btnPNGCurrent').onclick=()=>{
  const prev=$('showGuide').checked; $('showGuide').checked=false; renderChar(curChar);
  setTimeout(()=>{ cv.toBlob(b=>{ const url=URL.createObjectURL(b); const a=document.createElement('a'); a.href=url; a.download=`${curChar}_${Date.now()}.png`; a.click(); URL.revokeObjectURL(url); $('showGuide').checked=prev; renderChar(curChar); }); },80);
};
$('btnJPGCurrent').onclick=()=>{
  const prev=$('showGuide').checked; $('showGuide').checked=false; renderChar(curChar);
  setTimeout(()=>{ const tmp=document.createElement('canvas'); tmp.width=1080; tmp.height=1080; const tctx=tmp.getContext('2d'); tctx.fillStyle='#fff'; tctx.fillRect(0,0,1080,1080); tctx.drawImage(cv,0,0); tmp.toBlob(b=>{ const url=URL.createObjectURL(b); const a=document.createElement('a'); a.href=url; a.download=`${curChar}_${Date.now()}.jpg`; a.click(); URL.revokeObjectURL(url); $('showGuide').checked=prev; renderChar(curChar); },'image/jpeg',0.92); },80);
};
async function saveAll(isJPG){
  if(!uniqChars.length){ alert('SRT 없음'); return; }
  const zip=new JSZip(); const prev=$('showGuide').checked; $('showGuide').checked=false;
  for(let i=0;i<uniqChars.length;i++){
    curIdx=i; curChar=uniqChars[i]; updateIndicator(); renderGrid(); renderChar(curChar);
    await new Promise(r=>setTimeout(r,80));
    const tmp=document.createElement('canvas'); tmp.width=1080; tmp.height=1080; const tctx=tmp.getContext('2d');
    if(isJPG){ tctx.fillStyle='#fff'; tctx.fillRect(0,0,1080,1080); }
    tctx.drawImage(cv,0,0);
    const blob=await new Promise(res=> tmp.toBlob(res, isJPG?'image/jpeg':'image/png', isJPG?0.92:1.0));
    zip.file(`${String(i).padStart(3,'0')}_${curChar}.${isJPG?'jpg':'png'}`, blob);
  }
  $('showGuide').checked=prev;
  const zb=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(zb); const a=document.createElement('a'); a.href=url; a.download=`Calligraphy_${isJPG?'JPG':'PNG'}_${Date.now()}.zip`; a.click(); URL.revokeObjectURL(url);
}
$('btnPNGAll').onclick=()=>saveAll(false);
$('btnJPGAll').onclick=()=>saveAll(true);
$('btnReset').onclick=()=>{ ['choDist','jungDist','jongDist','choSize','jungSize','jongSize'].forEach(id=>$(id).value=1.0); ['choRand','jungRand','jongRand'].forEach(id=>$(id).value=0); $('overallScale').value=1.0; $('jamoMode').checked=false; updateLabels(); renderChar(curChar); };
$('btnMaster').onclick=()=>{ $('choDist').value=1.15; $('choSize').value=1.15; $('choRand').value=0.25; $('jungDist').value=1.10; $('jungSize').value=1.20; $('jungRand').value=0.20; $('jamoMode').checked=true; $('jamoClampOff').checked=true; updateLabels(); renderChar(curChar); };

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowLeft') $('btn-prev').click();
  if(e.key==='ArrowRight') $('btn-next').click();
});

window.onload=()=>{
  const defaultChars=['가','나','다','라','마','바','사','아','자','차','하','루','도','검','푸','른'];
  uniqChars=defaultChars;
  buildGrid(defaultChars);
  curIdx=0; curChar='가';
  updateIndicator(); renderGrid(); renderChar('가');
  updateLabels();
};

(async()=>{
  try{
    baseFont=await new Promise((res,rej)=> opentype.load('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf', (err,font)=> err?rej(err):res(font)));
    $('font-status').textContent='✅ 나눔손글씨 활성화 - 분리ON이어도 절대 안 사라짐';
    refreshPresetList();
  }catch(e){
    $('font-status').textContent='⚠ 폰트 실패 - 그래도 보임';
    refreshPresetList();
  }
})();
