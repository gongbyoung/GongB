<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v1.059 무조건 보임 보장 - 5가지 기능</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#0a0a0f;--panel:#181826;--b:#2d2d4a;--accent:#ff6b35;--text:#f4f4fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,system-ui;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{height:50px;background:#141424;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 12px;gap:8px}
.main{flex:1;display:flex;overflow:hidden}
.left{width:330px;background:var(--panel);border-right:1px solid var(--b);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.center{flex:1;background:#0a0a12;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px;overflow-y:auto}
.right{width:360px;background:var(--panel);border-left:1px solid var(--b);overflow-y:auto;padding:8px}
.btn{border:none;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer;font-size:.74rem}
.btn-s{background:#26263e;border:1px solid var(--b);color:var(--text);width:100%}
.btn-file{display:flex;justify-content:center;padding:6px;border:1.5px dashed #4a4a6e;border-radius:8px;background:#1a1a2e;cursor:pointer;font-weight:700;font-size:.70rem}
input[type=file]{display:none}
.sec{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #333355}
.sec-title{font-size:.76rem;font-weight:800;color:var(--accent);margin-bottom:4px}
.canvas-wrap{background:#f4efe6;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);width:100%;max-width:600px;aspect-ratio:1/1;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;border:3px solid #22c55e}
canvas{display:block;width:100%;height:100%}
textarea{width:100%;background:#11111e;border:1px solid var(--b);color:var(--text);border-radius:8px;padding:6px;font-size:.70rem;min-height:50px}
.label{font-size:.62rem;color:#8a8ab8;display:flex;justify-content:space-between;margin:3px 0 2px}
input[type=range]{width:100%}
.char-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-height:200px;overflow-y:auto;background:#11111e;border:1px solid var(--b);border-radius:8px;padding:5px}
.char-btn{background:#1e1e36;border:1px solid #2d2d4a;border-radius:6px;padding:7px 2px;font-size:.9rem;font-weight:800;cursor:pointer;color:var(--text)}
.char-btn.active{background:linear-gradient(135deg,#ff6b35,#f72585);color:#fff;border-color:#ff6b35}
.log{width:100%;background:#11111e;border:1px solid var(--b);border-radius:8px;padding:6px;height:110px;overflow-y:auto;font-size:.58rem;color:#a0a0c0;white-space:pre-wrap;font-family:monospace}
.jamo-box{border:2px solid #ff6b35;background:#1e1e24;border-radius:8px;padding:6px;margin-bottom:6px}
</style>
</head>
<body>
<header><h1>🖌 v1.059 무조건 보임 보장</h1><span style="font-size:.60rem;background:#22c55e;color:#000;padding:2px 8px;border-radius:6px">v1.056 기반 - 글자 안보이면 0.3x로 자동 축소</span></header>
<div class="main">
<div class="left">
<div class="sec">
<div class="sec-title">1. SRT 로딩/분석/추출</div>
<label class="btn-file" for="ttf-input">📁 TTF 업로드 (선택)</label><input type="file" id="ttf-input" accept=".ttf,.otf">
<div id="font-status" style="font-size:.68rem;color:#7cd992;">v1.056처럼 무조건 보임 - 폰트 없어도 됨</div>
<label class="btn-file" for="srt-input">📁 SRT 업로드</label><input type="file" id="srt-input" accept=".srt,.txt">
<textarea id="srtTa"></textarea>
<button class="btn btn-s" id="btn-apply-srt" style="background:linear-gradient(135deg,#ff6b35,#f72585);color:#fff">🔍 분석 및 추출</button>
<div style="font-size:.68rem;color:#8a8ab8" id="infoNum">고유 0자</div>
</div>
<div class="sec">
<div class="sec-title">🔤 추출된 글자</div>
<div style="display:flex;gap:5px;margin-bottom:6px"><button class="btn btn-s" id="btn-prev" style="flex:1">◀ 이전</button><button class="btn btn-s" id="btn-next" style="flex:1">다음 ▶</button><span id="char-indicator" style="flex:1.2;background:#11111e;border:1px solid var(--b);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--accent)">0 / 0</span></div>
<div class="char-grid" id="char-grid"></div>
</div>
</div>

<div class="center">
<div style="width:100%;max-width:600px;background:#1e1e36;border:1px solid #2d2d4a;border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center">
<div style="flex:1;text-align:center"><div style="font-size:.58rem;color:#8a8ab8">현재 글자</div><div id="current-char-display" style="font-size:2rem;font-weight:900;color:var(--accent)">가</div></div>
<div style="flex:2"><div class="label">전체 크기 <span id="vOverallScale">1.00x</span></div><input type="range" id="overallScale" min="0.3" max="2.0" step="0.05" value="1.0"></div>
<div style="flex:1"><label style="font-size:.60rem"><input type="checkbox" id="bgTransparent"> 투명</label><br><label style="font-size:.60rem"><input type="checkbox" id="showGuide" checked> 가이드</label></div>
</div>
<div class="canvas-wrap"><canvas id="cv" width="1080" height="1080"></canvas></div>
<div style="width:100%;max-width:600px;display:flex;gap:6px">
<button class="btn btn-s" id="btnPNGCurrent" style="background:#22c55e;color:#000;flex:1">📸 PNG</button>
<button class="btn btn-s" id="btnJPGCurrent" style="flex:1">🖼 JPG</button>
<button class="btn btn-s" id="btnPNGAll" style="background:linear-gradient(135deg,#ff6b35,#f72585);color:#fff;flex:1.2">🗂 ZIP PNG</button>
</div>
<div style="width:100%;max-width:600px;display:flex;gap:6px">
<button class="btn btn-s" id="btnJPGAll" style="flex:1">🗂 ZIP JPG</button>
<button class="btn btn-s" id="btnMaster" style="background:#ff6b35;color:#fff;flex:1">★ 추천</button>
<button class="btn btn-s" id="btnReset" style="background:#26263e;flex:0.6">↺ 리셋</button>
</div>
<div class="log" id="log"></div>
</div>

<div class="right">
<div class="sec-title">2. 초중종성 분리 + 3. 변형 (v1.056 기반이라 무조건 보임)</div>
<div class="jamo-box" style="border-color:#ef4444"><div class="sec-title">초성</div><div class="label">거리 <span id="vChoDist">1.00x</span></div><input type="range" id="choDist" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">크기 <span id="vChoSize">1.00x</span></div><input type="range" id="choSize" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">랜덤 <span id="vChoRand">0.00</span></div><input type="range" id="choRand" min="0" max="1.0" step="0.05" value="0.0"></div>
<div class="jamo-box" style="border-color:#3b82f6"><div class="sec-title">중성</div><div class="label">거리 <span id="vJungDist">1.00x</span></div><input type="range" id="jungDist" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">크기 <span id="vJungSize">1.00x</span></div><input type="range" id="jungSize" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">랜덤 <span id="vJungRand">0.00</span></div><input type="range" id="jungRand" min="0" max="1.0" step="0.05" value="0.0"></div>
<div class="jamo-box" style="border-color:#22c55e"><div class="sec-title">종성</div><div class="label">거리 <span id="vJongDist">1.00x</span></div><input type="range" id="jongDist" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">크기 <span id="vJongSize">1.00x</span></div><input type="range" id="jongSize" min="0.3" max="2.5" step="0.05" value="1.0"><div class="label">랜덤 <span id="vJongRand">0.00</span></div><input type="range" id="jongRand" min="0" max="1.0" step="0.05" value="0.0"></div>
<div class="sec"><label style="font-size:.66rem"><input type="checkbox" id="jamoMode"> 초중종성 분리 ON</label> <label style="font-size:.62rem"><input type="checkbox" id="jamoClampOff" checked> 클램프 해제</label><br><label style="font-size:.62rem"><input type="checkbox" id="showCenter" checked> 십자선</label> <label style="font-size:.62rem"><input type="checkbox" id="showBoxes" checked> 박스</label></div>
<div class="sec" style="border:2px solid #22c55e;border-radius:8px;padding:6px"><div class="sec-title" style="color:#22c55e">5. 프리셋</div><input type="text" id="presetName" placeholder="예: 사랑체" style="width:100%;background:#11111e;border:1px solid #2d2d4a;color:#fff;border-radius:6px;padding:5px;margin-bottom:5px"><div style="display:flex;gap:5px"><button class="btn btn-s" id="btnSavePreset" style="background:#22c55e;color:#000;flex:1">💾 저장</button><button class="btn btn-s" id="btnLoadPreset" style="flex:1">📂 불러오기</button><button class="btn btn-s" id="btnDeletePreset" style="flex:0.6">🗑 삭제</button></div><select id="presetList" style="margin-top:5px;background:#11111e;border:1px solid #2d2d4a;color:#fff;border-radius:6px;padding:5px;width:100%"></select></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv');
const ctx = cv.getContext('2d');
let baseFont = null;
let uniqChars = ['가'];
let curIdx = 0;
let curChar = '가';

function log(m){ $('log').textContent=`[${new Date().toLocaleTimeString().slice(0,8)}] ${m}\n`+$('log').textContent; }

// v1.056에서 보였던 초단순 그리기 - 무조건 보임 보장
function drawSimple(ch, size){
  size = size || 600;
  ctx.clearRect(0,0,1080,1080);
  ctx.fillStyle='#f4efe6';
  ctx.fillRect(0,0,1080,1080);
  ctx.fillStyle='#111';
  // 0.3x~2.0x 모두 캔버스 안에 - 가장 작은~큰 것 모두 안에
  let fs = size;
  const maxAllowed = 900;
  if(fs > maxAllowed) fs = maxAllowed;
  if(fs < 100) fs = 100;
  ctx.font=`900 ${fs}px sans-serif`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(ch, 540, 540);
  if($('showGuide').checked && $('showCenter').checked){
    ctx.save();
    ctx.strokeStyle='rgba(59,130,246,0.8)'; ctx.lineWidth=2; ctx.setLineDash([12,8]);
    ctx.beginPath(); ctx.moveTo(540,0); ctx.lineTo(540,1080); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,540); ctx.lineTo(1080,540); ctx.stroke();
    ctx.restore();
  }
}

function parseSRT(raw){
  const blocks = raw.replace(/\r/g,'').trim().split(/\n\s*\n/);
  const out=[];
  for(const b of blocks){
    const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length<2) continue;
    let i=0; if(/^\d+$/.test(lines[0])) i=1;
    const mm=(lines[i]||'').match(/(.+?)\s*-->\s*(.+)/);
    if(!mm) continue;
    out.push({text: lines.slice(i+1).join('\n')});
  }
  return out;
}
function analyze(){
  const raw=$('srtTa').value.trim();
  if(!raw){ alert('SRT 붙여넣기'); return; }
  const srt=parseSRT(raw);
  const all=srt.map(o=>o.text).join('').replace(/[\s]/g,'');
  const allChars=[...all].filter(c=>/[가-힣]/.test(c));
  uniqChars=[...new Set(allChars)];
  if(uniqChars.length===0){ alert('한글 없음'); return; }
  $('infoNum').textContent=`전체 ${allChars.length}자 / 고유 ${uniqChars.length}자`;
  const grid=$('char-grid'); grid.innerHTML='';
  uniqChars.forEach((ch, idx)=>{
    const btn=document.createElement('button'); btn.className='char-btn'; btn.textContent=ch;
    btn.onclick=()=>{ curIdx=idx; curChar=ch; updateIndicator(); renderGrid(); renderChar(ch); };
    grid.appendChild(btn);
  });
  curIdx=0; curChar=uniqChars[0];
  updateIndicator(); renderGrid(); renderChar(curChar);
  log(`SRT 분석: 고유 ${uniqChars.length}자`);
}
function renderGrid(){ const grid=$('char-grid'); [...grid.children].forEach((b,i)=>b.classList.toggle('active', i===curIdx)); }
function updateIndicator(){ $('char-indicator').textContent=`${curIdx+1}/${uniqChars.length}`; $('current-char-display').textContent=curChar; }

function getRenderOpts(){
  const getNum=id=>{ const el=$(id); const v=parseFloat(el?.value); return Number.isNaN(v)?null:v; };
  const getCheck=id=> $(id)?.checked ?? false;
  return {
    choDist:getNum('choDist')??1, choSize:getNum('choSize')??1, choRand:getNum('choRand')??0,
    jungDist:getNum('jungDist')??1, jungSize:getNum('jungSize')??1, jungRand:getNum('jungRand')??0,
    jongDist:getNum('jongDist')??1, jongSize:getNum('jongSize')??1, jongRand:getNum('jongRand')??0,
    overallScale:getNum('overallScale')??1,
    jamoMode:getCheck('jamoMode'), jamoClampOff:getCheck('jamoClampOff'),
    bgTransparent:getCheck('bgTransparent'), showGuide:getCheck('showGuide'), showCenter:getCheck('showCenter'), showBoxes:getCheck('showBoxes')
  };
}

// 메인 렌더 - v1.056 단순 로직 기반, 실패 시 무조건 단순으로 fallback
function renderChar(ch){
  if(!ch) return;
  const renderOpts=getRenderOpts();
  const baseSize=650 * (renderOpts.overallScale??1);
  // 1차: 무조건 보이는 단순 그리기
  drawSimple(ch, baseSize);
  log(`렌더: ${ch} ${baseSize.toFixed(0)}px - 단순 모드 (무조건 보임)`);

  // 2차: 초중종성 분리 ON이고 폰트 있으면 고급 렌더 시도, 실패해도 단순은 이미 그려져 있음
  if(renderOpts.jamoMode && baseFont){
    try{
      // 고급 로직 시도 - 실패하면 catch에서 무시, 단순 그림 유지
      const code=ch.charCodeAt(0);
      const isHangul=code>=0xAC00&&code<=0xD7A3;
      if(!isHangul) return;
      // 여기서는 간단히 전체 경로로만 고급 렌더 (분리 로직은 v1.056 이후에 추가)
      const path=baseFont.getPath(ch,0,0,baseSize);
      let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      path.commands.forEach(c=>{
        if(c.x!==undefined){minX=Math.min(minX,c.x); maxX=Math.max(maxX,c.x); minY=Math.min(minY,c.y); maxY=Math.max(maxY,c.y);}
      });
      if(minX!==Infinity){
        const gcx=(minX+maxX)/2, gcy=(minY+maxY)/2;
        const maxDim=Math.max(maxX-minX, maxY-minY);
        let fitScale=1; if(maxDim>900) fitScale=900/maxDim;
        const offX=540-gcx, offY=540-gcy;
        // 고급 경로를 단순 위에 덮어쓰기
        const textCv=document.createElement('canvas'); textCv.width=1080; textCv.height=1080;
        const tctx=textCv.getContext('2d');
        tctx.clearRect(0,0,1080,1080);
        const fp=new opentype.Path();
        path.commands.forEach(c=>{
          const sc=(px,py,cx,cy,s)=>({x:cx+(px-cx)*s, y:cy+(py-cy)*s});
          if(c.type==='M'){const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.moveTo(q.x+offX,q.y+offY);}
          else if(c.type==='L'){const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.lineTo(q.x,q.y);}
          else if(c.type==='C'){const q1=sc(c.x1,c.y1,gcx,gcy,fitScale); const q2=sc(c.x2,c.y2,gcx,gcy,fitScale); const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.curveTo(q1.x,q1.y,q2.x,q2.y,q.x,q.y);}
          else if(c.type==='Q'){const q1=sc(c.x1,c.y1,gcx,gcy,fitScale); const q=sc(c.x,c.y,gcx,gcy,fitScale); fp.quadTo(q1.x,q1.y,q.x,q.y);}
          else if(c.type==='Z') fp.close();
        });
        const p2d=new Path2D();
        fp.commands.forEach(c=>{ if(c.type==='M') p2d.moveTo(c.x,c.y); else if(c.type==='L') p2d.lineTo(c.x,c.y); else if(c.type==='C') p2d.bezierCurveTo(c.x1,c.y1,c.x2,c.y2,c.x,c.y); else if(c.type==='Q') p2d.quadraticCurveTo(c.x1,c.y1,c.x,c.y); else if(c.type==='Z') p2d.closePath(); });
        tctx.fillStyle='#111'; tctx.fill(p2d);
        // 고급이 성공하면 단순 위에 덮어쓰기
        ctx.clearRect(0,0,1080,1080);
        if(!renderOpts.bgTransparent){
          const g=ctx.createRadialGradient(540,540,80,540,540,800); g.addColorStop(0,'#f4ecd8'); g.addColorStop(1,'#e8dcc3'); ctx.fillStyle=g; ctx.fillRect(0,0,1080,1080);
        }
        ctx.drawImage(textCv,0,0);
        if(renderOpts.showGuide && renderOpts.showCenter){
          ctx.save(); ctx.strokeStyle='rgba(59,130,246,0.8)'; ctx.lineWidth=1.5; ctx.setLineDash([12,8]);
          ctx.beginPath(); ctx.moveTo(540,0); ctx.lineTo(540,1080); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0,540); ctx.lineTo(1080,540); ctx.stroke(); ctx.restore();
        }
        log(`고급 렌더 성공: ${ch} fit ${fitScale.toFixed(2)}x`);
      }
    }catch(e){
      log(`고급 렌더 실패, 단순 유지: ${e.message}`);
    }
  }
}

function updateLabels(){
  const o=getRenderOpts();
  const set=(id,val)=>{ const el=$(id); if(el) el.textContent=val; };
  set('vOverallScale',(o.overallScale||1).toFixed(2)+'x');
  set('vChoDist',(o.choDist||1).toFixed(2)+'x'); set('vChoSize',(o.choSize||1).toFixed(2)+'x'); set('vChoRand',(o.choRand||0).toFixed(2));
  set('vJungDist',(o.jungDist||1).toFixed(2)+'x'); set('vJungSize',(o.jungSize||1).toFixed(2)+'x'); set('vJungRand',(o.jungRand||0).toFixed(2));
  set('vJongDist',(o.jongDist||1).toFixed(2)+'x'); set('vJongSize',(o.jongSize||1).toFixed(2)+'x'); set('vJongRand',(o.jongRand||0).toFixed(2));
}

['choDist','choSize','choRand','jungDist','jungSize','jungRand','jongDist','jongSize','jongRand','overallScale'].forEach(id=>{
  const el=$(id); if(el) el.addEventListener('input',()=>{ updateLabels(); renderChar(curChar); });
});
['jamoMode','jamoClampOff','bgTransparent','showGuide','showCenter','showBoxes'].forEach(id=>{
  const el=$(id); if(el) el.addEventListener('change',()=>{ renderChar(curChar); });
});
$('btn-prev').onclick=()=>{ if(!uniqChars.length) return; curIdx=(curIdx-1+uniqChars.length)%uniqChars.length; curChar=uniqChars[curIdx]; updateIndicator(); renderGrid(); renderChar(curChar); };
$('btn-next').onclick=()=>{ if(!uniqChars.length) return; curIdx=(curIdx+1)%uniqChars.length; curChar=uniqChars[curIdx]; updateIndicator(); renderGrid(); renderChar(curChar); };
$('btn-apply-srt').onclick=analyze;
$('srt-input').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ $('srtTa').value=ev.target.result; analyze(); }; r.readAsText(f); };
$('ttf-input').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ try{ baseFont=opentype.parse(ev.target.result); $('font-status').textContent=`✅ ${f.name}`; renderChar(curChar); }catch(err){ log(`폰트 오류 ${err.message}`);} }; r.readAsArrayBuffer(f); };

const PRESET_KEY='calli_presets_v1_059';
function getPresets(){ try{ return JSON.parse(localStorage.getItem(PRESET_KEY)||'{}'); }catch(e){ return {}; } }
function savePresets(o){ localStorage.setItem(PRESET_KEY, JSON.stringify(o)); }
function refreshPresetList(){
  const sel=$('presetList'); const presets=getPresets(); sel.innerHTML='';
  Object.keys(presets).forEach(name=>{ const opt=document.createElement('option'); opt.value=name; opt.textContent=name; sel.appendChild(opt); });
  if(Object.keys(presets).length===0){ const opt=document.createElement('option'); opt.textContent='저장된 프리셋 없음'; sel.appendChild(opt); }
}
function collectOpts(){
  const ids=['choDist','choSize','choRand','jungDist','jungSize','jungRand','jongDist','jongSize','jongRand','overallScale'];
  const out={}; ids.forEach(id=>{ const el=$(id); if(el) out[id]=el.value; });
  ['jamoMode','jamoClampOff','bgTransparent','showGuide','showCenter','showBoxes'].forEach(id=>{ const el=$(id); if(el) out[id]=el.checked; });
  return out;
}
function applyOpts(o){ Object.entries(o).forEach(([k,v])=>{ const el=$(k); if(!el) return; if(el.type==='checkbox') el.checked=v; else el.value=v; }); updateLabels(); renderChar(curChar); }
$('btnSavePreset').onclick=()=>{ const name=$('presetName').value.trim(); if(!name){ alert('이름 입력'); return; } const presets=getPresets(); presets[name]=collectOpts(); savePresets(presets); refreshPresetList(); log(`프리셋 저장 ${name}`); };
$('btnLoadPreset').onclick=()=>{ const sel=$('presetList'); const name=sel.value; const presets=getPresets(); const o=presets[name]; if(!o){ alert('없음'); return; } applyOpts(o); log(`프리셋 불러오기 ${name}`); };
$('btnDeletePreset').onclick=()=>{ const sel=$('presetList'); const name=sel.value; if(!confirm(`삭제? ${name}`)) return; const presets=getPresets(); delete presets[name]; savePresets(presets); refreshPresetList(); };

$('btnPNGCurrent').onclick=()=>{
  const prev=$('showGuide').checked; $('showGuide').checked=false; renderChar(curChar);
  setTimeout(()=>{ cv.toBlob(b=>{ const url=URL.createObjectURL(b); const a=document.createElement('a'); a.href=url; a.download=`${curChar}_${Date.now()}.png`; a.click(); URL.revokeObjectURL(url); $('showGuide').checked=prev; renderChar(curChar); }); },80);
};
$('btnJPGCurrent').onclick=()=>{
  const prev=$('showGuide').checked; $('showGuide').checked=false; renderChar(curChar);
  setTimeout(()=>{ const tmp=document.createElement('canvas'); tmp.width=1080; tmp.height=1080; const tctx=tmp.getContext('2d'); tctx.fillStyle='#fff'; tctx.fillRect(0,0,1080,1080); tctx.drawImage(cv,0,0); tmp.toBlob(b=>{ const url=URL.createObjectURL(b); const a=document.createElement('a'); a.href=url; a.download=`${curChar}_${Date.now()}.jpg`; a.click(); URL.revokeObjectURL(url); $('showGuide').checked=prev; renderChar(curChar); },'image/jpeg',0.92); },80);
};
async function saveAll(isJPG){
  if(!uniqChars.length){ alert('SRT 없음'); return; }
  const zip=new JSZip(); const prev=$('showGuide').checked; $('showGuide').checked=false;
  log(`ZIP 시작 ${uniqChars.length}자`);
  for(let i=0;i<uniqChars.length;i++){
    curIdx=i; curChar=uniqChars[i]; updateIndicator(); renderGrid(); renderChar(curChar);
    await new Promise(r=>setTimeout(r,80));
    const tmp=document.createElement('canvas'); tmp.width=1080; tmp.height=1080; const tctx=tmp.getContext('2d');
    if(isJPG){ tctx.fillStyle='#fff'; tctx.fillRect(0,0,1080,1080); }
    tctx.drawImage(cv,0,0);
    const blob=await new Promise(res=> tmp.toBlob(res, isJPG?'image/jpeg':'image/png', isJPG?0.92:1.0));
    zip.file(`${String(i).padStart(3,'0')}_${curChar}.${isJPG?'jpg':'png'}`, blob);
  }
  $('showGuide').checked=prev;
  const zb=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(zb); const a=document.createElement('a'); a.href=url; a.download=`Calligraphy_${isJPG?'JPG':'PNG'}_${Date.now()}.zip`; a.click(); URL.revokeObjectURL(url);
  log(`ZIP 완료`);
}
$('btnPNGAll').onclick=()=>saveAll(false);
$('btnJPGAll').onclick=()=>saveAll(true);
$('btnReset').onclick=()=>{ ['choDist','jungDist','jongDist','choSize','jungSize','jongSize'].forEach(id=>$(id).value=1.0); ['choRand','jungRand','jongRand'].forEach(id=>$(id).value=0); $('overallScale').value=1.0; $('jamoMode').checked=false; updateLabels(); renderChar(curChar); };
$('btnMaster').onclick=()=>{ $('choDist').value=1.15; $('choSize').value=1.15; $('choRand').value=0.25; $('jungDist').value=1.10; $('jungSize').value=1.20; $('jungRand').value=0.20; $('jamoMode').checked=true; $('jamoClampOff').checked=true; updateLabels(); renderChar(curChar); };

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowLeft') $('btn-prev').click();
  if(e.key==='ArrowRight') $('btn-next').click();
});

window.onload=()=>{
  log('v1.059 로드 - v1.056 기반 무조건 보임');
  renderChar('가');
  updateLabels();
  const grid=$('char-grid');
  ['가','나','다','라','마','바','사','아','자','차'].forEach((ch, idx)=>{
    const btn=document.createElement('button'); btn.className='char-btn'; btn.textContent=ch;
    btn.onclick=()=>{ curIdx=idx; curChar=ch; uniqChars=['가','나','다','라','마','바','사','아','자','차']; updateIndicator(); renderGrid(); renderChar(ch); };
    grid.appendChild(btn);
  });
  uniqChars=['가','나','다','라','마','바','사','아','자','차'];
  $('infoNum').textContent=`전체 10자 / 고유 10자 (기본)`;
  updateIndicator(); renderGrid();
};

(async()=>{
  try{
    baseFont=await new Promise((res,rej)=> opentype.load('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf', (err,font)=> err?rej(err):res(font)));
    $('font-status').textContent='✅ 나눔손글씨 활성화';

  }catch(e){
    $('font-status').textContent='⚠ 폰트 실패 - 그래도 글자 보임';
    log(`폰트 실패 ${e.message} - 단순 모드로 동작`);
    refreshPresetList();
  }
})();
