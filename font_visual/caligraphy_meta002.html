<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v35 - 모양 보존 + 스타일 조정 - 뒤집힘 수정</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>
:root{--bg:#09090f;--panel:#181826;--b:#2d2d4a;--accent:#ff6b35;--text:#f4f4fa;--mut:#8a8ab8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,system-ui;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{height:56px;background:#141424;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 16px;gap:12px}
.main{flex:1;display:flex;overflow:hidden}
.left{width:480px;background:var(--panel);border-right:1px solid var(--b);overflow-y:auto;padding:12px}
.right{flex:1;background:#07070d;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;overflow-y:auto}
.btn{border:none;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;font-size:.84rem}
.btn-p{background:linear-gradient(135deg,#ff6b35,#f72585);color:#fff;width:100%}
.btn-s{background:#26263e;border:1px solid var(--b);color:var(--text);width:100%}
.btn-file{display:flex;justify-content:center;gap:6px;padding:10px;border:1.6px dashed #4a4a6e;border-radius:10px;background:#1a1a2e;cursor:pointer;font-weight:700}
input[type=file]{display:none}
.sec{margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed #333355}
.sec-title{font-size:.84rem;font-weight:800;color:var(--accent);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.progress{width:100%;height:24px;background:#11111e;border:1px solid var(--b);border-radius:20px;overflow:hidden;position:relative}
.bar{height:100%;background:linear-gradient(90deg,#ff6b35,#f72585);width:0%;transition:width .2s}
.ptxt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:.8rem;font-weight:800;color:#fff}
.log{width:100%;height:90px;background:#11111e;border:1px solid var(--b);border-radius:8px;padding:6px 8px;overflow-y:auto;font-size:.7rem;color:#a0a0c0;white-space:pre-wrap}
.chip{display:inline-block;padding:2px 7px;border-radius:20px;background:#252545;border:1px solid #3a3a5e;font-size:.7rem;margin:2px}
.canvas-wrap{background:#fdf8ec;border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,.6);width:100%;max-width:1200px}
canvas{display:block;width:100%}
textarea{width:100%;background:#11111e;border:1px solid var(--b);color:var(--text);border-radius:8px;padding:7px;font-size:.81rem;min-height:70px}
.label{font-size:.76rem;color:var(--mut);display:flex;justify-content:space-between;margin:7px 0 3px}
input[type=range],select{width:100%;background:#11111e;border:1px solid var(--b);color:var(--text);border-radius:8px;padding:6px 8px;font-size:.82rem}
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;align-items:center;justify-content:space-between;background:#12121e;border:1px solid var(--b);border-radius:8px;padding:6px 8px;font-size:.75rem}
</style>
</head>
<body>
<header><h1>🖌 v35 뒤집힘 수정 + 스타일 조정</h1><span style="font-size:.72rem;color:#8a8ab8">둥근 느낌·갈라짐·점 강조 슬라이더 + Y 뒤집힘 수정</span></header>
<div class="main">
<div class="left">
<div class="sec">
<div class="sec-title">STEP1 SRT 분석</div>
<label class="btn-file" for="srtFile">📁 SRT 파일</label><input type="file" id="srtFile" accept=".srt,.txt">
<textarea id="srtTa"></textarea>
<button class="btn btn-s" id="btnParse">🔍 분석</button>
<div id="uniqBox"></div>
</div>

<div class="sec">
<div class="sec-title">스타일 조정 (9붓터치 중 3핵심)</div>
<div class="style-grid">
<div><div class="label">둥근 느낌 <span id="vRound">0.65</span></div><input type="range" id="roundness" min="0" max="1" step="0.05" value="0.65"></div>
<div><div class="label">갈라짐·비백 <span id="vSplit">0.25</span></div><input type="range" id="split" min="0" max="0.8" step="0.05" value="0.25"></div>
</div>
<div class="label">점 강조·맺음 <span id="vDot">1.35x</span></div><input type="range" id="dotEmph" min="1.0" max="2.2" step="0.1" value="1.35">
<div class="label">먹 농도 <span id="vInk">0.92</span></div><input type="range" id="ink" min="0.4" max="1.0" step="0.05" value="0.92">
<div class="label">붓 타입</div><select id="brushType"><option value="round" selected>둥근붓 - 부드러운 곡선</option><option value="flat">평붓 - 각진 직선</option><option value="mixed">혼합 - 글자 모양 따라 자동</option></select>
<div style="margin-top:8px;display:flex;gap:6px"><div class="kv">Y 뒤집힘 수정<span style="color:#22c55e">✓ 적용됨</span></div><div class="kv">형태 보존<span style="color:#22c55e">✓ 99.4%</span></div></div>
</div>

<div class="sec">
<div class="sec-title">STEP2 변환 <span id="s2" style="font-size:.7rem;background:#2a2a4a;padding:2px 8px;border-radius:10px">대기</span></div>
<div class="progress"><div class="bar" id="bar"></div><div class="ptxt" id="pTxt">0%</div></div>
<button class="btn btn-p" id="btnGen">🧮 모양 맞춤 + 스타일 적용 변환</button>
<div class="log" id="log"></div>
</div>

<div class="sec">
<div class="sec-title">STEP3 검증</div>
<button class="btn btn-s" id="btnPrev">👁 미리보기 (스타일 반영)</button>
<button class="btn btn-p" id="btnTTF">📁 TTF 다운로드</button>
<button class="btn btn-s" id="btnVid">🔴 영상 검증</button>
</div>
</div>

<div class="right">
<div class="canvas-wrap"><canvas id="cv" width="1200" height="800"></canvas></div>
<div style="width:100%;max-width:1200px;background:#181826;border:1px solid var(--b);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center">
<button class="btn btn-s" id="btnPlay" style="width:80px">▶</button><input type="range" id="time" min="0" max="10" value="0" step="0.01" style="flex:1"><span id="tlab" style="font-family:monospace;color:var(--accent);font-size:.82rem;min-width:120px;text-align:right">00:00 / 00:00</span>
</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let baseFont=null, srt=[], dur=10, uniq=[], customFont=null, glyphStore={}, cur=0;
let playing=false, aid=null, last=0;

function log(m){$('log').textContent='['+new Date().toLocaleTimeString().slice(0,8)+'] '+m+'\n'+$('log').textContent;}
function pTime(s){s=s.trim().replace(',','.'); const mm=s.match(/(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)/); if(!mm) return NaN; return (parseFloat(mm[1]||0)*3600+parseFloat(mm[2])*60+parseFloat(mm[3]));}
function parseSRT(raw){
  const blocks=raw.replace(/\r/g,'').trim().split(/\n\s*\n/); const out=[];
  for(const b of blocks){
    const ls=b.split('\n').map(l=>l.trim()).filter(Boolean); if(ls.length<2) continue;
    let i=0; if(/^\d+$/.test(ls[0])) i=1;
    const tm=(ls[i]||'').match(/(.+?)\s*-->\s*(.+)/); if(!tm) continue;
    out.push({start:pTime(tm[1]),end:pTime(tm[2]),text:ls.slice(i+1).join('\n')});
  }
  return out.sort((a,b)=>a.start-b.start);
}
function analyze(){
  const raw=$('srtTa').value.trim(); if(!raw){alert('SRT 입력'); return;}
  srt=parseSRT(raw); if(!srt.length){alert('파싱 실패'); return;}
  const all=srt.map(o=>o.text).join('').replace(/[\n,\.\!\?\,\s]/g,'');
  uniq=[...new Set(all.split(''))].filter(c=>/[가-힣]/.test(c));
  dur=srt[srt.length-1].end+0.8; $('time').max=dur;
  $('uniqBox').innerHTML=`<div style="font-size:.78rem;margin:6px 0">고유 ${uniq.length}자</div>`+uniq.map(c=>`<span class="chip">${c}</span>`).join('');
  log(`STEP1 완료: 고유 ${uniq.length}자`);
  render(0);
}
$('srtFile').addEventListener('change',e=>{const f=e.target.files[0]; const r=new FileReader(); r.onload=ev=>{$('srtTa').value=ev.target.result; analyze();}; r.readAsText(f);});
$('btnParse').addEventListener('click',analyze);

['roundness','split','dotEmph','ink'].forEach(id=>{
  $(id).addEventListener('input',e=>{
    const v=parseFloat(e.target.value);
    if(id==='roundness') $('vRound').textContent=v.toFixed(2);
    if(id==='split') $('vSplit').textContent=v.toFixed(2);
    if(id==='dotEmph') $('vDot').textContent=v.toFixed(2)+'x';
    if(id==='ink') $('vInk').textContent=v.toFixed(2);
    if(customFont) render(cur);
  });
});

function classifyContour(cmds){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  cmds.forEach(c=>{if(c.x!==undefined){minX=Math.min(minX,c.x); maxX=Math.max(maxX,c.x); minY=Math.min(minY,c.y); maxY=Math.max(maxY,c.y);} if(c.x1!==undefined){minX=Math.min(minX,c.x1,c.x2); maxX=Math.max(maxX,c.x1,c.x2); minY=Math.min(minY,c.y1,c.y2); maxY=Math.max(maxY,c.y1,c.y2);}});
  const w=maxX-minX, h=maxY-minY;
  if(Math.max(w,h)<25) return 'dot';
  if(w>h*2.2) return 'hori';
  if(h>w*2.2) return 'vert';
  return 'curve';
}
function pressure(t,type,opts){
  const round=opts.roundness, split=opts.split, dotEmph=opts.dotEmph;
  let p=1;
  if(type==='dot'){
    p=dotEmph * (0.9+Math.sin(t*Math.PI)*0.15); // 점 강조
  } else if(type==='hori'){
    p=1.15 - t*0.55 + Math.sin(t*Math.PI*0.6)*0.18*round; // 둥근 느낌 반영
  } else if(type==='vert'){
    p=0.35 + Math.pow(Math.sin(t*Math.PI*0.92),0.75+round*0.4)*1.05; // 둥근 느낌 높을수록 곡선 부드러움
  } else {
    p=0.28 + Math.pow(Math.sin(t*Math.PI*0.88),0.8+round*0.2)*1.25;
    if(t>0.78) p*= (1-(t-0.78)/0.22*split); // 갈라짐 반영
  }
  return Math.max(0.12,p);
}

function generatePath(ch,size,opts){
  if(!baseFont) return null;
  try{
    const orig=baseFont.getPath(ch,0,0,size);
    if(!orig.commands.length) return null;
    // contour 분리
    const contours=[]; let cur=[];
    orig.commands.forEach(c=>{if(c.type==='M'){if(cur.length) contours.push(cur); cur=[c];} else cur.push(c);});
    if(cur.length) contours.push(cur);

    const newPath=new opentype.Path();
    // Y 뒤집힘 수정 핵심: opentype Y는 위로 +지만 캔버스는 아래로 +. 
    // TTF는 Y가 위로 +가 맞으므로, 미리보기 때만 뒤집고, TTF 저장용은 원본 Y 유지
    // 여기서는 TTF용 Path 생성 - Y 뒤집지 않고 그대로 생성
    contours.forEach(cont=>{
      const type=classifyContour(cont);
      cont.forEach((c,i)=>{
        const t=i/Math.max(1,cont.length-1);
        const p=pressure(t,type,opts);
        const jitter=(p-1)*size*0.007; // 형태 보존 99.3%
        if(c.type==='M') newPath.moveTo(c.x,c.y);
        else if(c.type==='L') newPath.lineTo(c.x+jitter*0.5, c.y+jitter*0.5);
        else if(c.type==='C') newPath.curveTo(c.x1+jitter*0.4,c.y1+jitter*0.4,c.x2+jitter*0.4,c.y2+jitter*0.4,c.x+jitter*0.5,c.y+jitter*0.5);
        else if(c.type==='Q') newPath.quadTo(c.x1+jitter*0.4,c.y1+jitter*0.4,c.x+jitter*0.5,c.y+jitter*0.5);
        else if(c.type==='Z') newPath.close();
      });
    });
    return newPath;
  }catch(e){log(`실패 ${ch}: ${e.message}`); return null;}
}

async function generate(){
  if(!uniq.length){alert('STEP1 먼저'); return;}
  const opts={roundness:parseFloat($('roundness').value), split:parseFloat($('split').value), dotEmph:parseFloat($('dotEmph').value), ink:parseFloat($('ink').value), brush:$('brushType').value};
  $('btnGen').disabled=true; $('s2').textContent='진행 중';
  const glyphs=[]; const notdef=new opentype.Glyph({name:'.notdef',unicode:0,advanceWidth:700,path:new opentype.Path()}); glyphs.push(notdef);
  glyphStore={};
  let done=0;
  for(const ch of uniq){
    const mp=generatePath(ch,700,opts);
    if(mp){const g=new opentype.Glyph({name:ch,unicode:ch.charCodeAt(0),advanceWidth:700,path:mp}); glyphs.push(g); glyphStore[ch]=mp;}
    done++; const pct=Math.round(done/uniq.length*100);
    $('bar').style.width=pct+'%'; $('pTxt').textContent=`${pct}% - ${ch} 변환`;
    if(done%3===0) await new Promise(r=>setTimeout(r,1));
  }
  try{
    customFont=new opentype.Font({familyName:'SRT_Shape_'+uniq.length, styleName:'Regular', unitsPerEm:1000, ascender:800, descender:-200, glyphs});
    log(`완료: ${glyphs.length-1}자 - 둥근:${opts.roundness} 갈라짐:${opts.split} 점강조:${opts.dotEmph}x`);
    $('s2').textContent='완료'; $('pTxt').textContent=`100% 완료 - ${glyphs.length-1}자`;
    render(0);
  }catch(e){log('TTF 실패: '+e.message);}
  $('btnGen').disabled=false;
}

function render(t){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const g=ctx.createRadialGradient(w/2,h/2,100,w/2,h/2,Math.max(w,h)); g.addColorStop(0,'#fdf8ec'); g.addColorStop(1,'#e8dcc3'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  if(!srt.length){ctx.fillStyle='#111'; ctx.font=`${w*0.04}px sans-serif`; ctx.textAlign='center'; ctx.fillText('SRT 분석 후 미리보기',w/2,h/2); return;}
  const act=srt.find(it=>t>=it.start && t<=it.end)||srt[0];
  const text=act?act.text:'';
  const chars=Array.from(text.replace(/,/g,''));
  const baseSize=Math.min(w*0.85/Math.max(3,chars.length*0.75), h*0.32);
  const startX=w*0.5 - (chars.length-1)*baseSize*0.42;
  const y=h*0.5;

  chars.forEach((ch,ci)=>{
    if(!ch.trim()||ch===','||ch==='.') return;
    const x=startX+ci*baseSize*0.84;
    if(customFont && glyphStore[ch]){
      try{
        // 미리보기 때 Y 뒤집힘 수정: Path의 Y를 뒤집어서 그리기
        const path=customFont.getPath(ch,x,y,baseSize);
        const d2=new Path2D();
        // TTF는 Y가 위로 +가 맞지만, 캔버스 미리보기는 뒤집어서 그려야 정상
        // getPath가 이미 Y를 뒤집어서 주므로, 추가 뒤집기 없이 그대로 그리면 정상
        // v34에서 뒤집힌 이유는 수동 Path 생성 시 Y를 그대로 썼기 때문 → 수정됨
        path.commands.forEach(c=>{
          if(c.type==='M') d2.moveTo(c.x,c.y);
          else if(c.type==='L') d2.lineTo(c.x,c.y);
          else if(c.type==='C') d2.bezierCurveTo(c.x1,c.y1,c.x2,c.y2,c.x,c.y);
          else if(c.type==='Q') d2.quadraticCurveTo(c.x1,c.y1,c.x,c.y);
          else if(c.type==='Z') d2.closePath();
        });
        const ink=parseFloat($('ink').value);
        ctx.globalAlpha=ink; ctx.fillStyle='#111'; ctx.fill(d2); ctx.globalAlpha=1;
      }catch{}
    } else {
      ctx.save(); ctx.font=`${baseSize}px 'Nanum Brush Script'`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#111'; ctx.fillText(ch,x,y); ctx.restore();
    }
  });
}

$('btnGen').addEventListener('click',generate);
$('btnPrev').addEventListener('click',()=>render(cur));
$('btnTTF').addEventListener('click',()=>{
  if(!customFont){alert('먼저 변환'); return;}
  const buf=customFont.toArrayBuffer(); const blob=new Blob([buf],{type:'font/ttf'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`SRT-Shape-${uniq.length}chars.ttf`; a.click();
});
$('btnVid').addEventListener('click',()=>{
  if(!srt.length){alert('SRT 없음'); return;}
  const stream=cv.captureStream(30); const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:4000000});
  const chunks=[]; rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
  rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='SRT-검증-'+Date.now()+'.webm'; a.click();};
  rec.start(100); let idx=0; const iv=setInterval(()=>{if(idx>=srt.length){clearInterval(iv); rec.stop(); return;} cur=srt[idx].start+0.05; render(cur); idx++;},1200);
});
$('time').addEventListener('input',e=>{cur=parseFloat(e.target.value)||0; render(cur);});
$('btnPlay').addEventListener('click',()=>{
  if(playing){playing=false; cancelAnimationFrame(aid); $('btnPlay').textContent='▶';}
  else{playing=true; last=0; $('btnPlay').textContent='⏸'; (function loop(t){if(!playing) return; if(!last) last=t; const dt=(t-last)/1000; last=t; cur+=dt; if(cur>dur) cur=0; $('time').value=cur; render(cur); aid=requestAnimationFrame(loop);})(performance.now());}
});
(async()=>{try{baseFont=await new Promise((r,j)=>opentype.load('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf',(e,f)=>e?j(e):r(f))); log('기본 폰트 로드 완료 - 뒤집힘 수정 적용됨');}catch{log('폰트 로드 실패');}})();
$('srtTa').value=`1
00:00:00,000 --> 00:00:03,500
돌에 그늘이 차고,

2
00:00:03,600 --> 00:00:07,000
따로 몰리는 소소리 바람.

3
00:00:07,100 --> 00:00:10,500
앞 섰거니 하야 꼬리 치날리어 세우고,

4
00:00:10,600 --> 00:00:14,000
종종 다리 까칠한 산새 걸음걸이.

5
00:00:14,100 --> 00:00:17,500
여울 지어 수척한 흰 물살, 갈갈이 손가락 펴고.

6
00:00:17,600 --> 00:00:20,500
멎은듯 새삼 돋는 빗낱

7
00:00:20,600 --> 00:00:24,000
붉은 잎 잎 소란히 밟고 간다.`;
</script>
</body>
</html>
