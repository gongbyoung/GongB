<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 캘리그라피 스튜디오 (100% 도형 틀 조형 피팅 엔진 v10.0)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Gaegu:wght@300;400;700&family=Nanum+Brush+Script&family=Nanum+Pen+Script&family=Yeon+Sung&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>

  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: #1e1e24;
      --panel-border: #2d2d38;
      --accent-color: #ff6b35;
      --accent-gradient: linear-gradient(135deg, #ff6b35, #f72585);
      --text-main: #f0f0f5;
      --text-muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #18181c; padding: 12px 24px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 390px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .section-title { font-size: 0.9rem; font-weight: 700; color: var(--accent-color); text-transform: uppercase; margin-bottom: 6px; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.82rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    label span.val { color: var(--text-main); font-weight: 600; }
    input[type="file"] { display: none; }
    .btn-file { display: block; padding: 12px; background: #2a2a36; border: 2px dashed var(--accent-color); border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    textarea.srt-textarea { width: 100%; height: 85px; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-family: monospace; font-size: 0.78rem; padding: 8px; resize: vertical; margin-top: 4px; }
    select, input[type="range"], input[type="color"] { width: 100%; padding: 8px; background: #16161a; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-main); font-size: 0.85rem; margin-bottom: 4px; }
    input[type="range"] { padding: 0; accent-color: var(--accent-color); cursor: pointer; }
    .preview-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0c; align-items: center; justify-content: center; padding: 20px; position: relative; }
    .canvas-wrapper { position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); border-radius: 8px; overflow: hidden; max-width: 100%; max-height: 70vh; display: flex; align-items: center; justify-content: center; background: #000; }
    canvas { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; }
    .player-controls { width: 100%; max-width: 960px; margin-top: 15px; background: var(--panel-bg); padding: 14px 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--panel-border); }
    .timeline-row { display: flex; align-items: center; gap: 12px; }
    .time-display { font-family: monospace; font-size: 0.9rem; color: var(--accent-color); min-width: 120px; }
    button.btn-action { background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.btn-secondary { background: #2b2b38; border: 1px solid var(--panel-border); color: var(--text-main); padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .srt-list-container { max-height: 120px; overflow-y: auto; background: #141418; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; }
    .srt-item { padding: 6px 10px; border-bottom: 1px solid #22222a; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; }
    .progress-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
    .progress-box { background: var(--panel-bg); padding: 30px; border-radius: 12px; text-align: center; width: 340px; }
    .progress-bar-bg { width: 100%; height: 10px; background: #111; border-radius: 5px; margin: 15px 0; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--accent-gradient); }
    svg.filters { position: absolute; width: 0; height: 0; }
  </style>
</head>
<body>

  <svg class="filters">
    <defs>
      <filter id="ink-bleed-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <header>
    <h1>🖌️ SRT 캘리그라피 스튜디오</h1>
    <span style="font-size: 0.85rem; color: var(--text-muted);">도형 틀(Shape Frame) 조형 피팅 엔진 v10.0</span>
  </header>

  <div class="main-container">
    <div class="sidebar">
      
      <div class="control-group">
        <div class="section-title">📂 1. SRT 자막 로딩 & 직접 편집</div>
        <label for="srt-input" class="btn-file" id="srt-label">📁 SRT 자막 파일 불러오기 (.srt)</label>
        <input type="file" id="srt-input" accept=".srt">

        <label style="margin-top: 6px;">SRT 자막 직접 입력/수정</label>
        <textarea id="srt-textarea" class="srt-textarea" placeholder="SRT 자막 내용을 입력하세요."></textarea>
        <button class="btn-secondary" id="btn-apply-srt" style="width:100%; margin-top:4px;">✏️ 자막 적용하기</button>
      </div>

      <div class="control-group">
        <div class="section-title">🔷 2. 보이지 않는 도형 틀 조형 (Shape Frame)</div>
        
        <label for="shape-frame-select">도형 틀 선택</label>
        <select id="shape-frame-select">
          <option value="diamond" selected>🔷 다이아몬드 / 마름모 (추천)</option>
          <option value="circle">⭕ 원형 (동그란 낙관 감성)</option>
          <option value="triangle">🔺 정삼각형 (피라미드 구도)</option>
          <option value="inv-triangle">🔻 역삼각형 (하향 집중 구도)</option>
          <option value="horizontal-rect">▭ 가로 직사각형 (와이드 블록)</option>
          <option value="horizontal-ellipse">⬭ 가로 타원형 (유선형 메달)</option>
          <option value="vertical-ellipse">0 세로 타원형 (세로 계란형)</option>
          <option value="vertical-rect">📜 세로 직사각형 (세로축 구도)</option>
          <option value="star">⭐ 별형 (Star-burst 조형)</option>
        </select>

        <label for="param-show-guide">도형 가이드선 표시 (편집용)</label>
        <select id="param-show-guide">
          <option value="guide-shape" selected>📐 도형 윤곽선 가이드 표시 (편집 확인용)</option>
          <option value="subtle-axis">🖌️ 세로 먹선 축 표시</option>
          <option value="none">❌ 투명 (가이드선 없음)</option>
        </select>
      </div>

      <div class="control-group">
        <div class="section-title">🖌️ 3. 붓글씨 필체 & 쓰기 연출</div>
        
        <label for="font-family">캘리그라피 붓글씨 서체</label>
        <select id="font-family">
          <option value="'Nanum Brush Script', cursive" selected>나눔붓글씨 (전통 서예 붓글씨)</option>
          <option value="'Yeon Sung', cursive">연성체 (유려한 곡선 필체)</option>
          <option value="'Dongle', sans-serif">동글체 (아기자기한 손글씨)</option>
          <option value="'Gaegu', cursive">개구체 (자연스러운 캘리)</option>
          <option value="'Nanum Pen Script', cursive">나눔펜글씨 (감성 펜글씨)</option>
        </select>

        <label for="engine-mode">쓰기 구현 방식</label>
        <select id="engine-mode">
          <option value="font-stroke-trace" selected>🌊 도형 틀 연속 쓰기 애니메이션</option>
          <option value="static">📌 완성작 도형 틀 고정 보기</option>
        </select>

        <label for="param-finish-pct">
          문장 쓰기 완성 구간 <span class="val" id="val-finish-pct">70% 시간 내 완성</span>
        </label>
        <input type="range" id="param-finish-pct" min="50" max="85" step="1" value="70">
      </div>

      <div class="control-group">
        <div class="section-title">🎨 4. 서체 강약 & 밀도 조율</div>
        
        <label for="param-tightness">글자 밀집도 <span class="val" id="val-tightness">아주 촘촘함</span></label>
        <input type="range" id="param-tightness" min="0.5" max="1.1" step="0.05" value="0.75">

        <label for="param-contrast">글자 크기 강약 대비 <span class="val" id="val-contrast">2.4x</span></label>
        <input type="range" id="param-contrast" min="1.2" max="3.5" step="0.1" value="2.4">
      </div>

      <div class="control-group">
        <div class="section-title">🖼️ 5. 배경 및 먹물 색상</div>
        <label for="bg-style">배경 스타일</label>
        <select id="bg-style">
          <option value="hanji" selected>전통 한지 (Rice Paper)</option>
          <option value="dark-paper">어두운 먹종이 (Dark Paper)</option>
          <option value="transparent">투명 배경 (영상 합성용)</option>
          <option value="black">단색 검정</option>
        </select>

        <label for="ink-color">먹물 색상</label>
        <input type="color" id="ink-color" value="#1c1917">
      </div>

      <div class="control-group">
        <div class="section-title">📜 6. 로드된 자막 목록</div>
        <div class="srt-list-container" id="srt-list"></div>
      </div>

    </div>

    <div class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="calligraphy-canvas" width="1920" height="1080"></canvas>
      </div>

      <div class="player-controls">
        <div class="timeline-row">
          <button class="btn-secondary" id="btn-play">▶ 재생</button>
          <input type="range" id="time-slider" min="0" max="100" value="0" step="0.01" style="flex:1;">
          <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
          <div style="font-size: 0.85rem; color: var(--text-muted);">
            해상도: 1920x1080 (Full HD) | 30 FPS H.264 MP4
          </div>
          <button class="btn-action" id="btn-export">🎬 H.264 MP4 영상 저장</button>
        </div>
      </div>
    </div>
  </div>

  <div class="progress-overlay" id="progress-modal">
    <div class="progress-box">
      <h3 style="margin-bottom: 10px; font-size: 1.1rem;">📽️ MP4 영상 렌더링 중...</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);" id="progress-text">도형 틀 캘리그라피 인코딩 진행 중</p>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <span id="progress-percent" style="font-weight: bold; font-size: 1.1rem; color: var(--accent-color);">0%</span>
    </div>
  </div>

  <script>
    let srtData = [];
    let totalDuration = 0;
    let currentTime = 0;
    let isPlaying = false;
    let animationFrameId = null;
    let lastTimestamp = 0;

    const canvas = document.getElementById('calligraphy-canvas');
    const ctx = canvas.getContext('2d');
    const srtInput = document.getElementById('srt-input');
    const srtLabel = document.getElementById('srt-label');
    const srtTextarea = document.getElementById('srt-textarea');
    const btnApplySrt = document.getElementById('btn-apply-srt');
    const srtListEl = document.getElementById('srt-list');
    const btnPlay = document.getElementById('btn-play');
    const timeSlider = document.getElementById('time-slider');
    const timeDisplay = document.getElementById('time-display');
    const btnExport = document.getElementById('btn-export');
    
    const shapeFrameSelect = document.getElementById('shape-frame-select');
    const paramShowGuide = document.getElementById('param-show-guide');
    const fontFamilySelect = document.getElementById('font-family');
    const engineModeSelect = document.getElementById('engine-mode');
    const paramFinishPct = document.getElementById('param-finish-pct');
    const bgStyleSelect = document.getElementById('bg-style');
    const inkColorInput = document.getElementById('ink-color');
    const paramTightness = document.getElementById('param-tightness');
    const paramContrast = document.getElementById('param-contrast');

    const progressModal = document.getElementById('progress-modal');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const progressText = document.getElementById('progress-text');

    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = 1920; maskCanvas.height = 1080;
    const maskCtx = maskCanvas.getContext('2d');

    paramFinishPct.addEventListener('input', (e) => {
      document.getElementById('val-finish-pct').textContent = `${e.target.value}% 시간 내 완성`;
      renderFrame(currentTime);
    });
    paramTightness.addEventListener('input', (e) => {
      document.getElementById('val-tightness').textContent = e.target.value < 0.7 ? '매우 촘촘' : '보통';
      renderFrame(currentTime);
    });
    paramContrast.addEventListener('input', (e) => {
      document.getElementById('val-contrast').textContent = e.target.value + 'x';
      renderFrame(currentTime);
    });
    [shapeFrameSelect, paramShowGuide, fontFamilySelect, engineModeSelect, bgStyleSelect, inkColorInput].forEach(el => {
      el.addEventListener('change', () => renderFrame(currentTime));
    });

    const demoSRT = `1
00:00:00,500 --> 00:00:04,500
물에 흔들리는 적

2
00:00:05,000 --> 00:00:08,500
바람에 피는 꽃

3
00:00:09,000 --> 00:00:13,000
오늘이 가장 행복한 날`;

    function parseSRTTime(timeStr) {
      if (!timeStr) return 0;
      const parts = timeStr.trim().replace(',', '.').split(':');
      return (parseFloat(parts[0])||0)*3600 + (parseFloat(parts[1])||0)*60 + (parseFloat(parts[2])||0);
    }

    function parseSRT(text) {
      const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = normalized.split('\n\n');
      const result = [];
      for (let block of blocks) {
        const lines = block.trim().split('\n');
        if (lines.length >= 3) {
          const timeMatch = lines[1].match(/(.*?)\s*-->\s*(.*)/);
          if (timeMatch) {
            result.push({
              id: lines[0],
              start: parseSRTTime(timeMatch[1]),
              end: parseSRTTime(timeMatch[2]),
              text: lines.slice(2).join('\n')
            });
          }
        }
      }
      return result;
    }

    function loadSRTData(rawText) {
      srtTextarea.value = rawText;
      srtData = parseSRT(rawText);
      totalDuration = srtData.length > 0 ? srtData[srtData.length - 1].end + 1.0 : 10;
      timeSlider.max = totalDuration;
      updateSRTListUI();
      renderFrame(0);
    }

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      srtLabel.textContent = `📄 ${file.name}`;
      const reader = new FileReader();
      reader.onload = (evt) => loadSRTData(evt.target.result);
      reader.readAsText(file);
    });

    btnApplySrt.addEventListener('click', () => {
      loadSRTData(srtTextarea.value);
    });

    function updateSRTListUI() {
      srtListEl.innerHTML = '';
      srtData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'srt-item';
        div.innerHTML = `<span>#${item.id} (${formatTime(item.start)})</span> <span>${item.text.replace('\n', ' / ')}</span>`;
        div.addEventListener('click', () => {
          currentTime = item.start;
          timeSlider.value = currentTime;
          renderFrame(currentTime);
        });
        srtListEl.appendChild(div);
      });
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function drawBackground() {
      const style = bgStyleSelect.value;
      const w = canvas.width, h = canvas.height;

      if (style === 'transparent') { ctx.clearRect(0,0,w,h); return; }
      if (style === 'black') { ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h); return; }
      if (style === 'dark-paper') { ctx.fillStyle='#16161a'; ctx.fillRect(0,0,w,h); return; }

      const grad = ctx.createRadialGradient(w/2, h/2, 100, w/2, h/2, w/1.1);
      grad.addColorStop(0, '#f8f4eb');
      grad.addColorStop(1, '#e3d7c3');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);

      ctx.fillStyle = 'rgba(80, 60, 40, 0.035)';
      for (let i = 0; i < 400; i++) {
        const x = seededRandom(i * 1.3) * w;
        const y = seededRandom(i * 2.7) * h;
        const r = seededRandom(i * 3.1) * 2.2 + 0.4;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
    }

    // 🔷 선택한 도형 틀 기하학에 100% 자막 글자 위치 피팅 알고리즘
    function calculateShapeFramePositions(chars, shapeType, tightness, contrast, seed) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const totalCount = chars.length;
      const positions = [];

      const baseFontPx = Math.round(95 * contrast);

      if (shapeType === 'diamond') {
        const rowHeight = baseFontPx * tightness * 1.15;
        if (totalCount <= 4) {
          const startY = centerY - rowHeight;
          chars.forEach((char, idx) => {
            if (idx === 0) {
              positions.push({ x: centerX, y: startY, size: Math.round(baseFontPx * 1.5), weight: '900', rot: 0 });
            } else if (idx === 1 || idx === 2) {
              const offsetX = (idx === 1 ? -1 : 1) * baseFontPx * 0.75;
              positions.push({ x: centerX + offsetX, y: centerY, size: Math.round(baseFontPx * 0.85), weight: '700', rot: 0 });
            } else {
              positions.push({ x: centerX, y: startY + rowHeight * 2, size: Math.round(baseFontPx * 0.9), weight: '700', rot: 0 });
            }
          });
        } else {
          chars.forEach((char, idx) => {
            const normIdx = (idx / (totalCount - 1)) - 0.5;
            const widthFactor = 1.0 - Math.abs(normIdx) * 1.7;
            const px = centerX + (seededRandom(seed++) - 0.5) * 280 * widthFactor;
            const py = centerY + normIdx * 450;
            const size = Math.round(baseFontPx * (idx === 0 ? 1.4 : (0.7 + widthFactor * 0.5)));
            positions.push({ x: px, y: py, size, weight: idx === 0 ? '900' : '700', rot: (seededRandom(seed++) - 0.5) * 0.1 });
          });
        }
      }
      else if (shapeType === 'circle') {
        const radius = 220;
        chars.forEach((char, idx) => {
          if (idx === 0) {
            positions.push({ x: centerX, y: centerY - 40, size: Math.round(baseFontPx * 1.6), weight: '900', rot: 0 });
          } else {
            const angle = ((idx - 1) / (totalCount - 1)) * Math.PI * 1.4 + Math.PI * 0.15;
            const px = centerX + Math.cos(angle) * radius;
            const py = centerY + Math.sin(angle) * radius * 0.7;
            positions.push({ x: px, y: py, size: Math.round(baseFontPx * 0.75), weight: '700', rot: angle * 0.1 });
          }
        });
      }
      else if (shapeType === 'triangle') {
        const rowH = baseFontPx * tightness * 1.15;
        const startY = centerY - rowH * 1.2;
        chars.forEach((char, idx) => {
          if (idx === 0) {
            positions.push({ x: centerX, y: startY, size: Math.round(baseFontPx * 1.5), weight: '900', rot: 0 });
          } else if (idx <= 2) {
            const offsetX = (idx === 1 ? -1 : 1) * baseFontPx * 0.75;
            positions.push({ x: centerX + offsetX, y: startY + rowH, size: Math.round(baseFontPx * 0.85), weight: '700', rot: 0 });
          } else {
            const offsetX = (idx - 4) * baseFontPx * 0.7;
            positions.push({ x: centerX + offsetX, y: startY + rowH * 2, size: Math.round(baseFontPx * 0.75), weight: '700', rot: 0 });
          }
        });
      }
      else if (shapeType === 'inv-triangle') {
        const rowH = baseFontPx * tightness * 1.15;
        const startY = centerY - rowH;
        chars.forEach((char, idx) => {
          if (idx < totalCount - 1) {
            const normX = ((idx / Math.max(1, totalCount - 2)) - 0.5) * baseFontPx * 1.6;
            positions.push({ x: centerX + normX, y: startY, size: Math.round(baseFontPx * 1.1), weight: '700', rot: 0 });
          } else {
            positions.push({ x: centerX, y: startY + rowH * 1.8, size: Math.round(baseFontPx * 1.4), weight: '900', rot: 0 });
          }
        });
      }
      else if (shapeType === 'horizontal-rect') {
        const colW = baseFontPx * tightness * 0.95;
        const startX = centerX - ((totalCount - 1) * colW) / 2;
        chars.forEach((char, idx) => {
          const isFirst = (idx === 0);
          positions.push({
            x: startX + idx * colW,
            y: centerY,
            size: isFirst ? Math.round(baseFontPx * 1.4) : baseFontPx,
            weight: isFirst ? '900' : '700',
            rot: 0
          });
        });
      }
      else {
        const firstSize = Math.round(baseFontPx * 1.6);
        const subSize = Math.round(baseFontPx * 0.75);
        const lineGap = subSize * tightness * 1.05;
        const totalH = firstSize + (totalCount - 1) * lineGap;
        let curY = (canvas.height - totalH) / 2 + firstSize * 0.4;

        chars.forEach((char, idx) => {
          const isFirst = (idx === 0);
          const fontPx = isFirst ? firstSize : subSize;
          positions.push({ x: centerX, y: curY, size: fontPx, weight: isFirst ? '900' : '700', rot: 0 });
          curY += isFirst ? (firstSize * 0.85 + lineGap * 0.3) : lineGap;
        });
      }

      return positions;
    }

    function drawShapeGuideOutline(shapeType, centerX, centerY) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 107, 55, 0.6)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);

      ctx.beginPath();
      if (shapeType === 'circle') {
        ctx.arc(centerX, centerY, 240, 0, Math.PI * 2);
      } else if (shapeType === 'horizontal-ellipse') {
        ctx.ellipse(centerX, centerY, 340, 190, 0, 0, Math.PI * 2);
      } else if (shapeType === 'vertical-ellipse') {
        ctx.ellipse(centerX, centerY, 190, 340, 0, 0, Math.PI * 2);
      } else if (shapeType === 'triangle') {
        ctx.moveTo(centerX, centerY - 220);
        ctx.lineTo(centerX + 240, centerY + 180);
        ctx.lineTo(centerX - 240, centerY + 180);
        ctx.closePath();
      } else if (shapeType === 'inv-triangle') {
        ctx.moveTo(centerX - 240, centerY - 180);
        ctx.lineTo(centerX + 240, centerY - 180);
        ctx.lineTo(centerX, centerY + 220);
        ctx.closePath();
      } else if (shapeType === 'diamond') {
        ctx.moveTo(centerX, centerY - 250);
        ctx.lineTo(centerX + 260, centerY);
        ctx.lineTo(centerX, centerY + 250);
        ctx.lineTo(centerX - 260, centerY);
        ctx.closePath();
      } else if (shapeType === 'horizontal-rect') {
        ctx.rect(centerX - 420, centerY - 160, 840, 320);
      } else {
        ctx.rect(centerX - 180, centerY - 320, 360, 640);
      }

      ctx.stroke();
      ctx.restore();
    }

    function renderCalligraphyFrame(subtitleObj, timeSec) {
      if (!subtitleObj) return;

      const font = fontFamilySelect.value;
      const engineMode = engineModeSelect.value;
      const shapeType = shapeFrameSelect.value;
      const guideMode = paramShowGuide.value;
      const inkColor = inkColorInput.value;
      const tightness = parseFloat(paramTightness.value);
      const contrast = parseFloat(paramContrast.value);
      const finishPct = parseInt(paramFinishPct.value) / 100;

      const duration = Math.max(0.5, subtitleObj.end - subtitleObj.start);
      const elapsed = Math.max(0, timeSec - subtitleObj.start);

      const writeDuration = duration * finishPct;
      const writeProgress = Math.min(1.0, Math.max(0.0, elapsed / writeDuration));

      const text = subtitleObj.text.trim();
      const seed = parseInt(subtitleObj.id) * 97 + text.length;

      ctx.filter = 'blur(0.3px) url(#ink-bleed-filter)';

      renderShapeFittedCalligraphy(text, writeProgress, shapeType, guideMode, font, inkColor, tightness, contrast, engineMode, seed);

      ctx.filter = 'none';
    }

    function renderShapeFittedCalligraphy(text, writeProgress, shapeType, guideMode, font, inkColor, tightness, contrast, engineMode, seed) {
      const chars = text.replace(/\n/g, ' ').split('').filter(c => c !== '');
      if (chars.length === 0) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.save();

      if (guideMode === 'guide-shape') {
        drawShapeGuideOutline(shapeType, centerX, centerY);
      } else if (guideMode === 'subtle-axis') {
        ctx.save();
        ctx.strokeStyle = inkColor; ctx.globalAlpha = 0.65; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - 320);
        ctx.lineTo(centerX, centerY + 340);
        ctx.stroke();
        ctx.restore();
      }

      const posList = calculateShapeFramePositions(chars, shapeType, tightness, contrast, seed);

      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      maskCtx.save();
      maskCtx.textBaseline = 'middle';
      maskCtx.textAlign = 'center';

      chars.forEach((char, idx) => {
        if (char === ' ') return;
        const pos = posList[idx] || { x: centerX, y: centerY, size: 90, weight: '700', rot: 0 };

        maskCtx.save();
        maskCtx.font = `${pos.weight} ${pos.size}px ${font}`;
        maskCtx.fillStyle = inkColor;

        maskCtx.translate(pos.x, pos.y);
        maskCtx.rotate(pos.rot || 0);
        maskCtx.fillText(char, 0, 0);
        maskCtx.restore();
      });

      maskCtx.restore();

      if (engineMode === 'static' || writeProgress >= 1.0) {
        ctx.drawImage(maskCanvas, 0, 0);
      } else {
        ctx.save();
        const sweepY = (centerY - 380) + writeProgress * 760;

        ctx.beginPath();
        ctx.rect(0, 0, canvas.width, sweepY);
        ctx.clip();

        ctx.drawImage(maskCanvas, 0, 0);
        ctx.restore();

        if (engineMode !== 'static') {
          const currentIdx = Math.min(posList.length - 1, Math.floor(writeProgress * posList.length));
          const activePos = posList[currentIdx];

          ctx.save();
          ctx.fillStyle = inkColor; ctx.globalAlpha = 0.9;
          ctx.beginPath();
          ctx.arc(activePos.x, sweepY, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      ctx.restore();
    }

    function renderFrame(timeSec) {
      drawBackground();
      const activeSubtitle = srtData.find(item => timeSec >= item.start && timeSec <= item.end);
      if (activeSubtitle) {
        renderCalligraphyFrame(activeSubtitle, timeSec);
      }
      timeDisplay.textContent = `${formatTime(timeSec)} / ${formatTime(totalDuration)}`;
    }

    function animate(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentTime += delta;
      if (currentTime > totalDuration) { currentTime = totalDuration; pause(); }

      timeSlider.value = currentTime;
      renderFrame(currentTime);

      if (isPlaying) animationFrameId = requestAnimationFrame(animate);
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      btnPlay.textContent = '⏸ 일시정지';
      lastTimestamp = 0;
      animationFrameId = requestAnimationFrame(animate);
    }

    function pause() {
      isPlaying = false;
      btnPlay.textContent = '▶ 재생';
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    btnPlay.addEventListener('click', () => isPlaying ? pause() : play());
    timeSlider.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      renderFrame(currentTime);
    });

    btnExport.addEventListener('click', async () => {
      if (srtData.length === 0) { alert('SRT 자막 파일이 로드되지 않았습니다.'); return; }

      pause();
      progressModal.style.display = 'flex';

      const fps = 30;
      const totalFrames = Math.ceil(totalDuration * fps);
      const width = canvas.width, height = canvas.height;

      try {
        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width, height },
          fastStart: 'in-memory'
        });

        const videoEncoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: (e) => console.error(e)
        });

        videoEncoder.configure({
          codec: 'avc1.42E01E',
          width, height,
          bitrate: 6_500_000,
          framerate: fps
        });

        for (let i = 0; i < totalFrames; i++) {
          const frameTime = i / fps;
          renderFrame(frameTime);

          const videoFrame = new VideoFrame(canvas, { timestamp: Math.round(frameTime * 1e6) });
          videoEncoder.encode(videoFrame, { keyFrame: i % (fps * 2) === 0 });
          videoFrame.close();

          const pct = Math.round(((i + 1) / totalFrames) * 100);
          progressFill.style.width = `${pct}%`;
          progressPercent.textContent = `${pct}%`;
          progressText.textContent = `도형 틀 캘리그라피 인코딩 중 (${i + 1} / ${totalFrames})`;

          if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
        }

        await videoEncoder.flush();
        muxer.finalize();

        const { buffer } = muxer.target;
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `calligraphy_shape_fit_${Date.now()}.mp4`;
        a.click();
        URL.revokeObjectURL(url);

        progressText.textContent = 'MP4 비디오 다운로드 완료!';
        setTimeout(() => progressModal.style.display = 'none', 1000);

      } catch (err) {
        alert(`MP4 저장 중 오류 발생: ${err.message}`);
        progressModal.style.display = 'none';
      }
    });

    loadSRTData(demoSRT);
  </script>
</body>
