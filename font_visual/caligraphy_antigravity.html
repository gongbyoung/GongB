<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT 캘리그라피 붓글씨 자막 비디오 생성기</title>
    <!-- 구글 캘리그라피 폰트 적용 (나눔 붓글씨, 동해 독도체 등) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Brush+Script&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🖌️ SRT 캘리그라피 붓글씨 자막 생성기</h1>
            <p>SRT 자막 파일의 시간 설정에 맞춰 캘리그라피 붓글씨 애니메이션을 렌더링하고 비디오로 저장합니다.</p>
        </header>

        <main>
            <section class="control-panel">
                <div class="input-group">
                    <label for="srtFileInput">📂 SRT 자막 파일 선택:</label>
                    <input type="file" id="srtFileInput" accept=".srt">
                </div>

                <div class="input-group">
                    <label for="fontSelect">✍️ 캘리그라피 폰트 선택:</label>
                    <select id="fontSelect">
                        <option value="'Nanum Brush Script', cursive">나눔 붓글씨 (Nanum Brush)</option>
                        <option value="'East Sea Dokdo', cursive">동해 독도체 (East Sea Dokdo)</option>
                        <option value="'Nanum Pen Script', cursive">나눔 펜글씨 (Nanum Pen)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="textColorInput">🎨 자막 색상:</label>
                    <input type="color" id="textColorInput" value="#ffffff">
                </div>

                <div class="button-group">
                    <button id="btnPlay" disabled>▶️ 애니메이션 재생</button>
                    <button id="btnPause" disabled>⏸️ 일시정지</button>
                    <button id="btnExportWebM" disabled>🎥 비디오 녹화 저장</button>
                </div>
            </section>

            <section class="preview-area">
                <div class="canvas-wrapper">
                    <canvas id="subCanvas" width="1280" height="720"></canvas>
                    <div id="statusMessage" class="status-overlay">SRT 자막 파일을 먼저 업로드해주세요.</div>
                </div>
                <div class="timeline-info">
                    <span id="currentTime">00:00.000</span> / <span id="totalTime">00:00.000</span>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
