<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한글 캘리그라피 스튜디오 v41.0 (리얼 붓털 물리 엔진 탑재)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>

  <style>
    /* 기존 v40.0 CSS와 동일 (길이 관계상 레이아웃 스타일은 생략 없이 그대로 유지합니다) */
    :root { --bg-dark: #121215; --panel-bg: #1c1c22; --panel-border: #2c2c36; --accent: #ff5e36; --accent-grad: linear-gradient(135deg, #ff5e36, #e01e5a); --text: #ededf2; --text-dim: #9292a4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #16161b; padding: 10px 20px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.15rem; font-weight: 700; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .preset-bar { background: #181820; border-bottom: 1px solid var(--panel-border); padding: 8px 16px; display: flex; gap: 8px; align-items: center; overflow-x: auto; }
    .preset-label { font-size: 0.78rem; font-weight: 700; color: #fca311; margin-right: 4px; white-space: nowrap; }
    .btn-preset { background: #252530; color: #cfcfdc; border: 1px solid #363646; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-preset:hover { background: #323242; color: #fff; }
    .btn-preset.active { background: var(--accent-grad); border-color: transparent; color: #fff; box-shadow: 0 2px 8px rgba(255, 94, 54, 0.4); }
    .workspace { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 380px; background: var(--panel-bg); padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .sidebar-left { border-right: 1px solid var(--panel-border); }
    .sidebar-right { border-left: 1px solid var(--panel-border); }
    .card { background: #16161c; padding: 12px; border-radius: 8px; border: 1px solid #262632; display: flex; flex-direction: column; gap: 7px; }
    .card-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }
    label { font-size: 0.75rem; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
    label span.val { color: var(--text); font-weight: 600; }
    input[type="file"] { display: none; }
    .btn-file { display: block; padding: 8px; background: #22222d; border: 1px dashed var(--accent); border-radius: 6px; text-align: center; cursor: pointer; font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .btn-file:hover { background: #2c2c3a; }
    textarea { width: 100%; height: 75px; background: #111115; border: 1px solid var(--panel-border); border-radius: 6px; color: #fff; font-family: monospace; font-size: 0.78rem; padding: 8px; resize: vertical; }
    select, input[type="range"], input[type="color"], input[type="number"], input[type="text"] { width: 100%; padding: 6px 8px; background: #131318; border: 1px solid var(--panel-border); border-radius: 6px; color: #fff; font-size: 0.8rem; }
    input[type="range"] { padding: 0; accent-color: var(--accent); cursor: pointer; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .dim-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dim-group { display: flex; flex-direction: column; gap: 2px; }
    .dim-group span { font-size: 0.7rem; color: var(--text-dim); }
    .srt-list-box { max-height: 120px; overflow-y: auto; background: #101014; border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px; }
    .srt-item { padding: 6px 8px; border-bottom: 1px solid #22222c; font-size: 0.75rem; cursor: pointer; display: flex; justify-content: space-between; border-radius: 4px; }
    .srt-item.active { background: rgba(255, 94, 54, 0.25); border-left: 3px solid var(--accent); color: #fff; font-weight: bold; }
    .srt-item:hover { background: #22222c; }
    .viewport { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0c0e; padding: 16px; position: relative; }
    .canvas-container { box-shadow: 0 16px 40px rgba(0,0,0,0.8); border-radius: 6px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; max-height: 72vh; max-width: 100%; }
    canvas { display: block; max-height: 72vh; max-width: 100%; object-fit: contain; }
    .controller-bar { width: 100%; max-width: 940px; margin-top: 10px; background: var(--panel-bg); padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--panel-border); }
    button.btn-primary { background: var(--accent-grad); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
    button.btn-sub { background: #262632; color: #fff; border: 1px solid var(--panel-border); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    button.btn-sub:hover { background: #343444; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
    .modal-box { background: var(--panel-bg); padding: 24px; border-radius: 10px; width: 340px; text-align: center; }
    .bar-bg { width: 100%; height: 8px; background: #111; border-radius: 4px; margin: 12px 0; overflow: hidden; }
    .bar-fill { width: 0%; height: 100%; background: var(--accent-grad); }
  </style>
</head>
<body>

  <!-- UI 헤더 및 사이드바 영역 (기존과 완벽 동일) -->
  <header>
    <h1>🖌️ 한글 캘리그라피 템플릿 매니저 & SRT 일괄 완성 스튜디오</h1>
    <span style="font-size: 0.78rem; color: var(--text-dim);">자막 일괄 렌더링 & 커스텀 템플릿 엔진 v41.0 (물리엔진 적용)</span>
  </header>

  <div class="preset-bar">
    <span class="preset-label">⚡ 기본 템플릿:</span>
    <button class="btn-preset active" id="btn-p1">1. 맛있게 (블록형)</button>
    <button class="btn-preset" id="btn-p2">2. 행복할 권리 (산문형)</button>
    <button class="btn-preset" id="btn-p3">3. 사랑도 (쐐기형)</button>
    <button class="btn-preset" id="btn-p4">4. 첫눈처럼 (계단형)</button>
    <button class="btn-preset" id="btn-p5">5. 시나브로 (엠블럼)</button>
    <button class="btn-preset" id="btn-p6">6. 사랑을 배운다 (장천형)</button>
  </div>

  <div class="workspace">
    <div class="sidebar sidebar-left">
      <!-- 템플릿, SRT 로드, 서명, 캔버스 설정 카드 등 기존 코드 그대로 유지 -->
      <div class="card"><div class="card-title">🎬 SRT 자막 일괄 로드</div>
        <textarea id="input-text" placeholder="1&#10;00:00:00,500 --> 00:00:03,000&#10;맛있게 먹으면&#10;0칼로리"></textarea>
        <button class="btn-sub" id="btn-apply-srt">✏️ 자막 데이터 동기화</button>
        <div class="srt-list-box" id="srt-list-container"></div>
      </div>
      <div class="card"><div class="card-title">✍️ 부제 / 서명</div><input type="text" id="input-subtext" value="제주글씨"></div>
      <div class="card"><div class="card-title">📐 캔버스 크기 & 배경</div>
        <select id="select-ratio"><option value="1:1" selected>1:1 (1440x1440)</option><option value="16:9">16:9</option><option value="9:16">9:16</option></select>
        <select id="select-bg"><option value="white-hanji" selected>순백 전통 화선지</option><option value="warm-hanji">은은한 미색 고서지</option><option value="dark-paper">먹지</option><option value="transparent">투명</option></select>
        <input type="color" id="input-ink-color" value="#111113">
      </div>
      <div class="card"><div class="card-title">🔴 전서 직인</div><select id="select-seal"><option value="seal-red">🔴 주문 정방형 붉은 인장</option><option value="none" selected>❌ 인장 없음</option></select><input type="text" id="input-seal-text" value="제주" maxlength="4"></div>
    </div>

    <div class="viewport">
      <div class="canvas-container"><canvas id="calli-canvas" width="1440" height="1440"></canvas></div>
      <div class="controller-bar">
        <button class="btn-sub" id="btn-play">▶ 재생</button>
        <input type="range" id="time-slider" min="0" max="5.0" step="0.02" value="0.0" style="flex:1;">
        <span id="time-text" style="font-family:monospace; font-size:0.82rem; color:var(--accent); min-width:110px;">00.00s / 05.00s</span>
      </div>
    </div>

    <div class="sidebar sidebar-right">
      <div class="card">
        <div class="card-title">🧮 파라미터 제어기</div>
        <label>레이아웃 <select id="select-layout-pattern"><option value="center">중앙</option><option value="block-headline" selected>블록형</option></select></label>
        <label>행별 축소 <input type="range" id="param-decay" min="0.6" max="1.4" step="0.05" value="1.0"></label>
        <label>주제어 대비 <input type="range" id="param-contrast" min="1.0" max="3.5" step="0.1" value="1.4"></label>
        <label>장획 방향 <select id="select-pull-dir"><option value="down">하강</option><option value="down-right">우하단</option></select></label>
        <label>장획 타겟 <select id="select-pull-target"><option value="last-char">마지막</option><option value="none" selected>없음</option></select></label>
        <label>장획 강도 <input type="range" id="param-attractor" min="0.0" max="3.0" step="0.1" value="0.0"></label>
        <label>기울기 <input type="range" id="param-shear" min="-15" max="25" step="1" value="7"></label>
        <label>팽창 <input type="range" id="param-bulge" min="-1.0" max="2.0" step="0.1" value="0.3"></label>
        <label>굵기 <input type="range" id="param-stroke-expand" min="0.5" max="2.5" step="0.05" value="1.35"></label>
        <label>곡률 <input type="range" id="param-curvature" min="-2.0" max="2.0" step="0.1" value="0.2"></label>
        <label>갈필(비백) 강도 <input type="range" id="param-slit-cut" min="0.0" max="1.0" step="0.05" value="0.65"></label>
        <label>자간 <input type="range" id="param-spacing" min="-40" max="40" step="2" value="-6"></label>
        <label>행간 <input type="range" id="param-line-height" min="0.6" max="2.2" step="0.05" value="1.05"></label>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       [A] 다중 붓털 물리 텍스처 엔진 (v41.0 신규 탑재)
       마우스가 아닌 폰트 바운딩 박스 내부를 붓털들이 긁고 지나가며 갈필 텍스처를 자동 생성합니다.
       ========================================================================= */
    class PhysicalBristleEngine {
      static generateTexture(w, h, color, intensity) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        
        ctx.fillStyle = color;
        // 갈필 강도가 낮으면 기본적으로 바탕을 많이 채워줌
        if(intensity < 0.3) {
            ctx.fillRect(0, 0, w, h);
            return c;
        }

        const bristles = [];
        const numBristles = 80; // 붓털 80가닥
        for(let i=0; i<numBristles; i++) {
            bristles.push({
                y: (i / numBristles) * h,
                size: Math.random() * 3 + 1.5,
                wobble: Math.random() * 20
            });
        }

        // 대각선(획의 흐름) 방향으로 붓털을 강하게 그어버림
        ctx.fillStyle = color;
        for(let x = -50; x < w + 50; x += 3) {
            bristles.forEach(b => {
                // 갈필 강도(intensity)가 높을수록 털이 흩날려서 빈 공간이 생김
                if(Math.random() > intensity * 0.8) {
                    const wave = Math.sin(x * 0.05 + b.wobble) * (intensity * 15);
                    ctx.beginPath();
                    ctx.arc(x, b.y + wave, b.size, 0, Math.PI*2);
                    ctx.fill();
                }
            });
        }
        return c;
      }
    }

    // 전역 변수 및 SRT 파싱 (v40.0 로직 동일)
    let srtData = [];
    let loadedFont = null;
    let isPlaying = false;
    let animId = null;
    let lastTimestamp = 0;
    let currentTime = 0;
    let totalDuration = 5.0;

    const canvas = document.getElementById('calli-canvas');
    const ctx = canvas.getContext('2d');
    const charOffscreen = document.createElement('canvas');
    const charCtx = charOffscreen.getContext('2d');

    const inputText = document.getElementById('input-text');
    const timeSlider = document.getElementById('time-slider');
    const btnPlay = document.getElementById('btn-play');

    function parseSRTTime(h, m, s, ms) { return (parseInt(h)||0)*3600 + (parseInt(m)||0)*60 + (parseInt(s)||0) + (parseInt(ms)||0)/1000; }
    function parseSRT(text) {
      if (!text) return [];
      const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
      const result = [];
      blocks.forEach(b => {
        const lines = b.trim().split('\n');
        let timeLineIdx = -1;
        for (let i = 0; i < lines.length; i++) if (lines[i].includes('-->')) { timeLineIdx = i; break; }
        if (timeLineIdx !== -1) {
          const m = lines[timeLineIdx].match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/);
          if (m) result.push({ start: parseSRTTime(m[1], m[2], m[3], m[4]), end: parseSRTTime(m[5], m[6], m[7], m[8]), text: lines.slice(timeLineIdx + 1).join('\n') });
        }
      });
      return result;
    }

    const FONT_URL = "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumbrushscript/NanumBrushScript-Regular.ttf";
    opentype.load(FONT_URL, (err, font) => {
      if (!err) {
        loadedFont = font;
        inputText.value = `1\n00:00:00,500 --> 00:00:03,000\n맛있게 먹으면\n0칼로리`;
        srtData = parseSRT(inputText.value);
        renderScene(0);
      }
    });

    document.getElementById('btn-apply-srt').addEventListener('click', () => { srtData = parseSRT(inputText.value); renderScene(0); });

    class GlyphGeometryEngine {
      static deformGlyph(commands, bbox, uiParams) {
        const w = Math.max(1, bbox.x2 - bbox.x1), h = Math.max(1, bbox.y2 - bbox.y1);
        const cx = (bbox.x1 + bbox.x2) / 2, cy = (bbox.y1 + bbox.y2) / 2;
        const shearRad = (-uiParams.shear * Math.PI) / 180;
        
        const transformPoint = (x, y) => {
          let u = (x - cx) / (w * 0.5), v = (y - cy) / (h * 0.5);
          if (uiParams.bulge !== 0) { const f = 1.0 + uiParams.bulge * 0.45 * Math.exp(-(u*u + v*v) * 0.85); u *= f; v *= f; }
          if (uiParams.curvature !== 0) v += uiParams.curvature * 0.35 * (1.0 - u * u);
          u += v * Math.tan(shearRad);
          return { x: cx + u * (w * 0.5) * uiParams.strokeExpand, y: cy + v * (h * 0.5) * uiParams.strokeExpand };
        };

        return commands.map(cmd => {
          const c = Object.assign({}, cmd);
          if (c.x !== undefined) { const p = transformPoint(c.x, c.y); c.x = p.x; c.y = p.y; }
          if (c.x1 !== undefined) { const p = transformPoint(c.x1, c.y1); c.x1 = p.x; c.y1 = p.y; }
          if (c.x2 !== undefined) { const p = transformPoint(c.x2, c.y2); c.x2 = p.x; c.y2 = p.y; }
          return c;
        });
      }
      static renderCommands(ctx, commands) {
        ctx.beginPath();
        for (let cmd of commands) {
          if (cmd.type === 'M') ctx.moveTo(cmd.x, cmd.y);
          else if (cmd.type === 'L') ctx.lineTo(cmd.x, cmd.y);
          else if (cmd.type === 'C') ctx.bezierCurveTo(cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.x, cmd.y);
          else if (cmd.type === 'Q') ctx.quadraticCurveTo(cmd.x1, cmd.y1, cmd.x, cmd.y);
          else if (cmd.type === 'Z') ctx.closePath();
        }
      }
    }

    // 💡 [핵심 변경] v41.0 리얼 붓털 마스킹 렌더러
    function renderWritingGlyph(targetCtx, ch, renderX, renderY, fontSize, uiParams, progressU) {
      if (progressU <= 0.001) return;
      const path = loadedFont.getPath(ch, 0, 0, fontSize);
      let bbox = { x1: 0, y1: -fontSize * 0.7, x2: fontSize * 0.7, y2: 0 };
      try { bbox = path.getBoundingBox(); } catch(e) {}

      const deformed = GlyphGeometryEngine.deformGlyph(path.commands, bbox, uiParams);

      const pad = 120;
      const gw = Math.max(40, (bbox.x2 - bbox.x1) * 2.2 + pad);
      const gh = Math.max(40, (bbox.y2 - bbox.y1) * 2.4 + pad);
      charOffscreen.width = gw; charOffscreen.height = gh;
      
      const localCX = gw / 2, localCY = gh * 0.45;
      
      charCtx.clearRect(0, 0, gw, gh);
      charCtx.save();
      
      // 1. 글씨의 외곽선(Path)을 먼저 그립니다.
      charCtx.translate(localCX, localCY);
      GlyphGeometryEngine.renderCommands(charCtx, deformed);
      charCtx.fill();
      
      // 2. 다중 붓털 엔진이 생성한 '갈필 텍스처'를 글씨 내부에만(source-in) 덮어씌웁니다! (단색 채우기 탈피)
      charCtx.globalCompositeOperation = 'source-in';
      const bristleTexture = PhysicalBristleEngine.generateTexture(gw, gh, uiParams.inkColor, uiParams.slitCut);
      charCtx.drawImage(bristleTexture, -localCX, -localCY);
      charCtx.restore();

      // 3. 서서히 써지는 애니메이션(Sweep) 마스킹
      if (progressU < 0.999) {
        charCtx.save();
        charCtx.globalCompositeOperation = 'destination-in';
        charCtx.translate(localCX, localCY);
        charCtx.rotate(-(50 * Math.PI) / 180);
        const diag = Math.hypot(gw, gh);
        const sweepX = -diag * 0.48 + progressU * (diag * 0.96);
        charCtx.beginPath();
        charCtx.moveTo(-diag, -diag);
        charCtx.lineTo(sweepX, -diag);
        for (let s = 0; s <= 12; s++) charCtx.lineTo(sweepX + Math.sin(s * 1.5 + progressU * 8) * 8, -diag + (s / 12) * (diag * 2));
        charCtx.lineTo(-diag, diag);
        charCtx.fill();
        charCtx.restore();
      }

      targetCtx.drawImage(charOffscreen, renderX - localCX, renderY - localCY);
    }

    function renderScene(timeSec) {
      if (!loadedFont) return;
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = document.getElementById('select-bg').value === 'white-hanji' ? '#faf7f2' : '#141418';
      ctx.fillRect(0, 0, w, h);

      let activeSubtitle = srtData.find(s => timeSec >= s.start && timeSec <= s.end) || (srtData.length > 0 ? srtData[0] : {start:0, end:5, text:'캘리그라피'});
      const segDuration = Math.max(0.8, activeSubtitle.end - activeSubtitle.start);
      const segElapsed = Math.max(0, Math.min(segDuration, timeSec - activeSubtitle.start));

      const uiParams = {
        shear: parseInt(document.getElementById('param-shear').value),
        bulge: parseFloat(document.getElementById('param-bulge').value),
        strokeExpand: parseFloat(document.getElementById('param-stroke-expand').value),
        curvature: parseFloat(document.getElementById('param-curvature').value),
        slitCut: parseFloat(document.getElementById('param-slit-cut').value), // 이 값이 붓털의 갈라짐(비백)을 결정!
        inkColor: document.getElementById('input-ink-color').value
      };

      const rawLines = activeSubtitle.text.split('\n');
      const baseSize = 180;
      let currentY = h/2 - (rawLines.length * baseSize)/2;

      const charSpan = (segDuration * 0.8) / Math.max(1, activeSubtitle.text.replace(/\s/g,'').length);
      let globalCharIndex = 0;

      rawLines.forEach((lineStr) => {
        const chars = Array.from(lineStr);
        let startX = (w - (chars.length * baseSize * 0.78)) / 2;
        
        chars.forEach((ch) => {
          const tStart = globalCharIndex * charSpan;
          let u = 0;
          if (segElapsed >= tStart + charSpan) u = 1.0;
          else if (segElapsed > tStart) u = (segElapsed - tStart) / charSpan;
          
          if(ch !== ' ') {
              renderWritingGlyph(ctx, ch, startX, currentY + baseSize, baseSize, uiParams, u);
              globalCharIndex++;
          }
          startX += baseSize * 0.78 - 6;
        });
        currentY += baseSize * 1.05;
      });
    }

    function animateLoop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      currentTime += (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if (currentTime > totalDuration) { currentTime = 0; isPlaying = false; btnPlay.textContent = '▶ 재생'; }
      timeSlider.value = currentTime;
      renderScene(currentTime);
      if (isPlaying) requestAnimationFrame(animateLoop);
    }

    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.textContent = isPlaying ? '⏸ 일시정지' : '▶ 재생';
      if (isPlaying) { lastTimestamp = 0; requestAnimationFrame(animateLoop); }
    });
    timeSlider.addEventListener('input', (e) => { isPlaying = false; btnPlay.textContent = '▶ 재생'; currentTime = parseFloat(e.target.value); renderScene(currentTime); });
    
    // UI 슬라이더 연동
    document.querySelectorAll('input[type="range"]').forEach(el => el.addEventListener('input', () => renderScene(currentTime)));
  </script>
</body>
</html>
