<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한글 캘리그라피 스튜디오 v43.0 (지렁이 굴곡 & 신규 템플릿)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>

  <link rel="stylesheet" href="style.css">
  <script src="js/engine_layout.js" defer></script>
  <script src="js/engine_brush.js" defer></script>
  <script src="js/engine_fluid.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <header>
    <h1>🖌️ 한글 캘리그라피 템플릿 매니저 & SRT 일괄 완성 스튜디오</h1>
    <span style="font-size: 0.78rem; color: var(--text-dim);">자막 일괄 렌더링 & 모듈형 템플릿 엔진 v43.0</span>
  </header>

  <div class="preset-bar">
    <span class="preset-label">⚡ 기본 템플릿:</span>
    <button class="btn-preset active" id="btn-p1">1. 맛있게 (블록형)</button>
    <button class="btn-preset" id="btn-p2">2. 행복할 권리 (산문)</button>
    <button class="btn-preset" id="btn-p3">3. 사랑도 (쐐기형)</button>
    <button class="btn-preset" id="btn-p4">4. 첫눈처럼 (계단형)</button>
    <button class="btn-preset" id="btn-p5">5. 시나브로 (엠블럼)</button>
    <button class="btn-preset" id="btn-p6">6. 사랑 (장천형)</button>
    <!-- 💡 신규 템플릿 3종 추가 -->
    <button class="btn-preset" id="btn-p7" style="border-color:#00e5ff; color:#00e5ff;">7. 춤사위 (물결)</button>
    <button class="btn-preset" id="btn-p8" style="border-color:#00e5ff; color:#00e5ff;">8. 갈지자 (지그재그)</button>
    <button class="btn-preset" id="btn-p9" style="border-color:#00e5ff; color:#00e5ff;">9. 메아리 (확장)</button>
  </div>

  <div class="workspace">
    <div class="sidebar sidebar-left">
      <div class="card">
        <div class="card-title">🔤 커스텀 폰트 뼈대 로드</div>
        <label for="input-font-file" class="btn-file">📁 .TTF / .OTF 폰트 불러오기</label>
        <input type="file" id="input-font-file" accept=".ttf,.otf">
      </div>

      <div class="card">
        <div class="card-title">🎬 SRT 자막 일괄 로드 & 네비게이터</div>
        <label for="input-srt-file" class="btn-file">📁 .SRT 자막 파일 불러오기</label>
        <input type="file" id="input-srt-file" accept=".srt">
        <label style="margin-top: 4px;">자막 직접 입력 / 편집</label>
        <textarea id="input-text" placeholder="1&#10;00:00:00,500 --> 00:00:03,000&#10;맛있게 먹으면&#10;0칼로리"></textarea>
        <button class="btn-sub" id="btn-apply-srt">✏️ 자막 데이터 동기화</button>
        <div class="srt-list-box" id="srt-list-container"></div>
      </div>

      <div class="card"><div class="card-title">✍️ 부제 / 서명 (SubText)</div><input type="text" id="input-subtext" value="제주글씨"></div>
      <div class="card"><div class="card-title">📐 캔버스 크기 & 배경</div>
        <select id="select-ratio"><option value="1:1" selected>1:1 정방형 (1440x1440)</option><option value="16:9">16:9 가로형</option><option value="9:16">9:16 세로형</option></select>
        <select id="select-bg"><option value="white-hanji" selected>순백 전통 화선지</option><option value="warm-hanji">은은한 미색 고서지</option><option value="dark-paper">먹지</option><option value="transparent">투명</option></select>
        <input type="color" id="input-ink-color" value="#111113">
      </div>
      <div class="card"><div class="card-title">🔴 전서 직인 (낙관)</div>
        <select id="select-seal"><option value="seal-red">🔴 주문 정방형 붉은 인장</option><option value="none" selected>❌ 인장 없음</option></select>
        <input type="text" id="input-seal-text" value="제주" maxlength="4">
      </div>
    </div>

    <div class="viewport">
      <div class="canvas-container"><canvas id="calli-canvas" width="1440" height="1440"></canvas></div>
      <div class="controller-bar">
        <button class="btn-sub" id="btn-play">▶ 재생</button>
        <input type="range" id="time-slider" min="0" max="5.0" step="0.02" value="0.0" style="flex:1;">
        <span id="time-text" style="font-family:monospace; font-size:0.82rem; color:var(--accent); min-width:110px;">00.00s / 05.00s</span>
        <button class="btn-primary" id="btn-export">🎬 전체 MP4 렌더링</button>
      </div>
    </div>

    <div class="sidebar sidebar-right">
      <div class="card"><div class="card-title">🏛️ 1. 조형 구도 패턴</div>
        <label>문장 배치 
          <select id="select-layout-pattern">
            <option value="center">⚖️ 중앙</option>
            <option value="stair-diagonal">📐 계단형</option>
            <option value="wedge-title">🔻 쐐기형</option>
            <option value="block-headline" selected>▭ 블록형</option>
            <option value="emblem-compact">🗿 엠블럼</option>
            <option value="wave-dance">🌊 물결 춤사위</option>
            <option value="zigzag">⚡ 갈지자 지그재그</option>
          </select>
        </label>
        <label>행별 축소 <input type="range" id="param-decay" min="0.6" max="1.4" step="0.05" value="1.0"></label>
        <label>주제어 대비 <input type="range" id="param-contrast" min="1.0" max="3.5" step="0.1" value="1.4"></label>
        <label style="color:#00e5ff; margin-top:8px; border-top:1px dashed #2c2c36; padding-top:8px;">전체 크기 배율 <input type="range" id="param-global-scale" min="0.3" max="3.0" step="0.05" value="1.0"></label>
        <label style="color:#00e5ff;">가로 위치 (X) <input type="range" id="param-offset-x" min="-1000" max="1000" step="10" value="0"></label>
        <label style="color:#00e5ff;">세로 위치 (Y) <input type="range" id="param-offset-y" min="-1000" max="1000" step="10" value="0"></label>
      </div>
      <div class="card"><div class="card-title">✒️ 2. 장획/삐침 어트랙터</div>
        <label>뻗는 방향 <select id="select-pull-dir"><option value="down" selected>⬇️ 수직 하강</option><option value="down-right">↘️ 우하단 사선</option><option value="right">➡️ 우측 수평</option></select></label>
        <label>적용 대상 <select id="select-pull-target"><option value="last-char" selected>마지막 글자</option><option value="none">없음</option></select></label>
        <label>장획 강도 <input type="range" id="param-attractor" min="0.0" max="3.0" step="0.1" value="0.0"></label>
      </div>
      <div class="card"><div class="card-title">🧮 3. 획 왜곡 및 물리 질감</div>
        <!-- 💡 신규 추가: 지렁이 굴곡 -->
        <label style="color:#ff5e36;">지렁이 굴곡 (Wobble) <input type="range" id="param-wobble" min="0.0" max="2.0" step="0.1" value="0.0"></label>
        <label>전단각(기울기) <input type="range" id="param-shear" min="-15" max="25" step="1" value="7"></label>
        <label>중심 팽창 <input type="range" id="param-bulge" min="-1.0" max="2.0" step="0.1" value="0.3"></label>
        <label>획 굵기 <input type="range" id="param-stroke-expand" min="0.5" max="2.5" step="0.05" value="1.35"></label>
        <label>곡률(Bending) <input type="range" id="param-curvature" min="-2.0" max="2.0" step="0.1" value="0.2"></label>
        <label>갈필(비백) 강도 <input type="range" id="param-slit-cut" min="0.0" max="1.0" step="0.05" value="0.1"></label>
        <label style="color:#fca311;">수분(먹물 번짐) <input type="range" id="param-bleed" min="0.0" max="1.0" step="0.05" value="0.3"></label>
      </div>
      <div class="card"><div class="card-title">📜 4. 간격 및 여백</div>
        <label>자간 <input type="range" id="param-spacing" min="-40" max="40" step="2" value="-6"></label>
        <label>행간 <input type="range" id="param-line-height" min="0.6" max="2.2" step="0.05" value="1.05"></label>
      </div>
    </div>
  </div>
</body>
</html>
