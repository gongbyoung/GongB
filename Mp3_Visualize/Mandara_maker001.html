<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Mandala Generator v3</title>
<style>
:root{--bg:#0f0f12;--panel:#1d1d22;--border:#2e2e38;--text:#fff;--muted:#9a9ab0;--accent:#4CAF50;--accent2:#ff3b30}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,system-ui;overflow:hidden}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:var(--panel)}
.app{display:grid;grid-template-columns:340px minmax(420px,1fr) 340px;gap:14px;height:calc(100vh - 56px);padding:14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:0.9rem}
.panel-body{padding:12px 14px;overflow-y:auto;flex:1}
.group{margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed #2a2a33}
.group label.title{font-size:0.8rem;color:var(--muted);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;display:block}
.ctrl{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.ctrl .top{display:flex;justify-content:space-between}
input[type=file],select{width:100%;background:#121216;color:#fff;border:1px solid var(--border);padding:8px 10px;border-radius:10px;font-size:0.85rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}
.btn.stop{background:var(--accent2)}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;height:100%}
.canvas-wrap{position:relative;background:#000;border-radius:18px;border:1px solid #222;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:1;width:100%;max-height:calc(100vh - 160px)}
.ratio-16-9{aspect-ratio:16/9;width:100%} .ratio-9-16{aspect-ratio:9/16;width:58%;max-width:520px}
canvas{width:100%;height:100%;display:block}
.timeline{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:10px 16px;display:flex;gap:10px;align-items:center}
@media(max-width:1200px){html,body{overflow:auto}.app{grid-template-columns:1fr;height:auto}.canvas-wrap{max-height:none;min-height:400px}}
</style>
</head>
<body>
<div class="header"><h1>🎵 Music Mandala v3</h1><small>LEFT·CENTER·RIGHT</small></div>
<div class="app">
  <div class="panel"><div class="panel-head">왼쪽 - 파일 & Bass/Drum</div><div class="panel-body">
    <button id="generateBtn" class="btn">GENERATE & PLAY</button>
    <div class="group">
      <label class="title">트랙</label>
      <input type="file" id="vocalFile" accept="audio/*"><input type="file" id="otherFile" accept="audio/*" style="margin-top:6px"><input type="file" id="bassFile" accept="audio/*" style="margin-top:6px"><input type="file" id="drumFile" accept="audio/*" style="margin-top:6px">
      <div style="display:flex;gap:6px;margin-top:8px"><select id="aspectRatio"><option value="ratio-16-9">16:9</option><option value="ratio-9-16">9:16</option></select><select id="colorTheme"><option value="pastel">Pastel</option><option value="primary">Primary</option><option value="custom">Custom 3색</option></select></div>
      <div id="customColors" style="display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px"><input type="color" id="c1" value="#ff00ea"><input type="color" id="c2" value="#00ffd0"><input type="color" id="c3" value="#ffea00"></div>
    </div>
    <div class="group"><label class="title">BASS</label>
      Size <input type="range" id="bass-size" min="0.2" max="3" step="0.1" value="1"> Spread <input type="range" id="bass-spread" min="0" max="1.5" step="0.05" value="0.7"> Rings <input type="range" id="bass-rings" min="1" max="8" step="1" value="3"> Thick <input type="range" id="bass-thick" min="0.5" max="20" step="0.5" value="6">
      <select id="bass-shape"><option value="circle">Circle</option><option value="hex">Hexagon</option><option value="square">Square</option></select>
    </div>
    <div class="group"><label class="title">DRUM</label>
      Length <input type="range" id="drum-len" min="0.2" max="1.8" step="0.05" value="1"> Spread <input type="range" id="drum-spread" min="0" max="1.5" step="0.05" value="0.8"> Sym <input type="range" id="drum-sym" min="3" max="32" step="1" value="12"> Thick <input type="range" id="drum-thick" min="0.5" max="20" step="0.5" value="5">
      <select id="drum-shape"><option value="line">Line</option><option value="spike">Spike</option><option value="bar">Bar</option></select>
    </div>
  </div></div>
  <div class="center"><div id="canvasWrapper" class="canvas-wrap ratio-16-9"><canvas id="mandalaCanvas"></canvas></div><div class="timeline"><span id="currentTime">0:00</span><input type="range" id="timeline" style="flex:1"><span id="duration">0:00</span></div></div>
  <div class="panel"><div class="panel-head">오른쪽 - Vocal/Other</div><div class="panel-body">
    <div class="group"><label class="title">VOCAL</label>
      Size <input type="range" id="vocal-size" min="0.2" max="2.8" step="0.1" value="1"> Sym <input type="range" id="vocal-sym" min="3" max="24" step="1" value="8"> Layers <input type="range" id="vocal-layers" min="1" max="6" step="1" value="2"> Rot <input type="range" id="vocal-rot" min="0" max="3" step="0.1" value="1">
      <select id="vocal-shape"><option value="petal">Petal</option><option value="diamond">Diamond</option><option value="leaf">Leaf</option></select>
    </div>
    <div class="group"><label class="title">OTHER</label>
      Spread <input type="range" id="other-spread" min="0.1" max="1.5" step="0.05" value="0.9"> Count <input type="range" id="other-count" min="4" max="80" step="1" value="20"> Size <input type="range" id="other-size" min="0.5" max="12" step="0.5" value="4"> Speed <input type="range" id="other-speed" min="0" max="3" step="0.1" value="1">
      <select id="other-shape"><option value="dot">Dot</option><option value="star">Star</option><option value="cross">Cross</option></select>
    </div>
  </div></div>
</div>
<script>
// (위에서 준 전체 JS 로직 동일 - 생략 없이 포함)
</script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>


</body>
</html>
