<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>4Track Mandala Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@400;700;800&display=swap">

<style>
/* ─── Design tokens ─── */
:root {
  --bg: #0c0c12;
  --bg2: #13131f;
  --bg3: #1a1a2a;
  --surface: #1e1e30;
  --border: rgba(255,255,255,0.08);
  --fg: #e8e8f0;
  --fg2: #8888aa;
  --fg3: #5555770;
  --accent-v: #c084fc;   /* VOCAL – violet */
  --accent-d: #f97316;   /* DRUM  – orange */
  --accent-o: #34d399;   /* OTHER – emerald */
  --accent-b: #38bdf8;   /* BASS  – sky */
  --font-d: 'Syne', sans-serif;
  --font-b: 'DM Sans', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f4ff;
    --bg2: #eeedf8;
    --bg3: #e6e4f4;
    --surface: #fafafe;
    --border: rgba(0,0,0,0.08);
    --fg: #18182a;
    --fg2: #5a5a80;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f4ff;
  --bg2: #eeedf8;
  --bg3: #e6e4f4;
  --surface: #fafafe;
  --border: rgba(0,0,0,0.08);
  --fg: #18182a;
  --fg2: #5a5a80;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-b);
  background: var(--bg);
  color: var(--fg);
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
html { height: 100%; }

/* ─── Layout ─── */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 0;
}

/* ─── Header ─── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
header h1 {
  font-family: var(--font-d);
  font-weight: 800;
  font-size: clamp(14px, 2vw, 18px);
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent-v), var(--accent-b));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-right { display: flex; align-items: center; gap: 8px; }

/* ─── Main area ─── */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
  gap: 0;
}

/* ─── Canvas area ─── */
.canvas-wrap {
  flex: 1;
  min-width: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
#mandalaCanvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
}

/* ─── Sidebar ─── */
.sidebar {
  width: 300px;
  flex-shrink: 0;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── Tab bar ─── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 8px 4px;
  font-family: var(--font-d);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: transparent;
  border: none;
  color: var(--fg2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.tab-btn.active { color: var(--fg); border-bottom-color: var(--accent-v); }
.tab-btn[data-tab="drum"].active { border-bottom-color: var(--accent-d); }
.tab-btn[data-tab="other"].active { border-bottom-color: var(--accent-o); }
.tab-btn[data-tab="bass"].active { border-bottom-color: var(--accent-b); }

/* ─── Panel scroll ─── */
.panel-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* ─── Section ─── */
.section-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg2);
  margin-bottom: 6px;
}

/* ─── File drop zone ─── */
.drop-zone {
  border: 1.5px dashed var(--border);
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent-v);
  background: rgba(192,132,252,0.05);
}
.drop-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.drop-icon { font-size: 18px; margin-bottom: 4px; }
.drop-label { font-size: 11px; color: var(--fg2); line-height: 1.4; }
.drop-label strong { color: var(--fg); }
.file-name {
  font-size: 10px;
  color: var(--accent-o);
  margin-top: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.track-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}

/* ─── Controls ─── */
.ctrl-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.ctrl-label {
  font-size: 11px;
  color: var(--fg2);
  flex-shrink: 0;
  width: 52px;
}
.ctrl-val {
  font-size: 10px;
  color: var(--fg2);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
input[type=range] {
  flex: 1;
  height: 3px;
  -webkit-appearance: none;
  background: var(--bg3);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--fg);
  cursor: pointer;
}
.vocal-range::-webkit-slider-thumb { background: var(--accent-v); }
.drum-range::-webkit-slider-thumb  { background: var(--accent-d); }
.other-range::-webkit-slider-thumb { background: var(--accent-o); }
.bass-range::-webkit-slider-thumb  { background: var(--accent-b); }

/* ─── Shape selector ─── */
.shape-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.shape-btn {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg3);
  border: 1.5px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  font-size: 9px;
  color: var(--fg2);
  gap: 3px;
  transition: all 0.15s;
}
.shape-btn svg { width: 18px; height: 18px; }
.shape-btn:hover { border-color: var(--border); color: var(--fg); }
.shape-btn.active { border-color: var(--accent-v); color: var(--accent-v); background: rgba(192,132,252,0.08); }

/* ─── Color style ─── */
.color-chips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.chip {
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 10px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover { border-color: var(--fg2); color: var(--fg); }
.chip.active { border-color: var(--accent-v); color: var(--accent-v); background: rgba(192,132,252,0.08); }

/* ─── Custom colors ─── */
.custom-colors {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.color-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  color: var(--fg2);
}
.color-swatch input[type=color] {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  cursor: pointer;
  padding: 1px;
  background: transparent;
}

/* ─── Gradient style ─── */
.grad-chips { display: flex; gap: 4px; flex-wrap: wrap; }

/* ─── Flow mode toggle ─── */
.flow-toggle {
  display: flex;
  background: var(--bg3);
  border-radius: 20px;
  padding: 2px;
  gap: 0;
}
.flow-btn {
  flex: 1;
  padding: 4px 10px;
  border-radius: 18px;
  font-size: 10px;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.flow-btn.active {
  background: linear-gradient(135deg, var(--accent-v), var(--accent-b));
  color: #fff;
}

/* ─── Transport ─── */
.transport {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.btn-play {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-v), var(--accent-b));
  border: none;
  cursor: pointer;
  color: #fff;
  font-size: 14px;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.btn-play:hover { transform: scale(1.08); }
.btn-play:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-sm {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-b);
}
.btn-sm:hover { color: var(--fg); border-color: var(--fg2); }
.btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-rec {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: #f87171;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-b);
  display: flex;
  align-items: center;
  gap: 4px;
}
.btn-rec:hover { background: rgba(248,113,113,0.1); border-color: #f87171; }
.btn-rec.recording { background: rgba(248,113,113,0.15); border-color: #f87171; animation: recPulse 1s ease-in-out infinite; }
.btn-rec:disabled { opacity: 0.35; cursor: not-allowed; animation: none; }
@keyframes recPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; }
.time-display {
  font-size: 11px;
  color: var(--fg2);
  font-variant-numeric: tabular-nums;
  margin-left: auto;
  flex-shrink: 0;
}
/* ─── Rec status bar ─── */
.rec-status {
  font-size: 10px;
  padding: 5px 10px;
  border-radius: 6px;
  background: rgba(248,113,113,0.08);
  border: 1px solid rgba(248,113,113,0.25);
  color: #f87171;
  display: none;
  align-items: center;
  gap: 6px;
  margin: 0 0 4px;
  flex-shrink: 0;
}
.rec-status.show { display: flex; }
.rec-status.done { color: var(--accent-o); background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.25); }
/* progress bar */
.progress-bar-wrap {
  height: 2px;
  background: var(--bg3);
  border-radius: 1px;
  overflow: hidden;
  flex: 1;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: #f87171;
  border-radius: 1px;
  transition: width 0.3s linear;
}

/* ─── Level meters ─── */
.meters {
  display: flex;
  gap: 3px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.meter-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.meter-label { font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg2); }
.meter-bar {
  width: 100%;
  height: 40px;
  background: var(--bg3);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.meter-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  transition: height 0.05s;
  border-radius: 2px;
}
.meter-v .meter-fill { background: var(--accent-v); }
.meter-d .meter-fill { background: var(--accent-d); }
.meter-o .meter-fill { background: var(--accent-o); }
.meter-b .meter-fill { background: var(--accent-b); }

/* ─── All tracks panel ─── */
.all-tracks { display: flex; flex-direction: column; gap: 10px; }
.track-row {
  background: var(--bg3);
  border-radius: 8px;
  padding: 10px;
}
.track-row-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-d);
  letter-spacing: 0.04em;
}

/* ─── Theme toggle ─── */
.theme-toggle {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  font-family: var(--font-b);
}

/* ─── Divider ─── */
hr.divider {
  border: none;
  border-top: 1px solid var(--border);
}

/* ─── Responsive ─── */
@media (max-width: 640px) {
  .sidebar { width: 100%; max-height: 55vh; border-left: none; border-top: 1px solid var(--border); }
  .main { flex-direction: column; }
  .canvas-wrap { min-height: 200px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="app">

  <!-- Header -->
  <header>
    <h1>4Track Mandala Studio</h1>
    <div class="flow-toggle" title="흐름 모드">
      <button class="flow-btn active" data-mode="expand">↗ 퍼짐</button>
      <button class="flow-btn" data-mode="implode">↙ 흡수</button>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle">☀ Light</button>
    </div>
  </header>

  <div class="main">
    <!-- Canvas -->
    <div class="canvas-wrap">
      <canvas id="mandalaCanvas"></canvas>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Tab bar -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="vocal">🎤 Vocal</button>
        <button class="tab-btn" data-tab="drum">🥁 Drum</button>
        <button class="tab-btn" data-tab="other">🎸 Other</button>
        <button class="tab-btn" data-tab="bass">🎹 Bass</button>
        <button class="tab-btn" data-tab="style">🎨</button>
      </div>

      <!-- Panel scroll -->
      <div class="panel-scroll" id="panelScroll">
      </div>

      <!-- Level meters -->
      <div class="meters">
        <div class="meter-col meter-v">
          <div class="meter-bar"><div class="meter-fill" id="meterV" style="height:0%"></div></div>
          <div class="meter-label">VOC</div>
        </div>
        <div class="meter-col meter-d">
          <div class="meter-bar"><div class="meter-fill" id="meterD" style="height:0%"></div></div>
          <div class="meter-label">DRM</div>
        </div>
        <div class="meter-col meter-o">
          <div class="meter-bar"><div class="meter-fill" id="meterO" style="height:0%"></div></div>
          <div class="meter-label">OTH</div>
        </div>
        <div class="meter-col meter-b">
          <div class="meter-bar"><div class="meter-fill" id="meterB" style="height:0%"></div></div>
          <div class="meter-label">BSS</div>
        </div>
      </div>

      <!-- Rec status -->
      <div class="rec-status" id="recStatus">
        <div class="rec-dot"></div>
        <span id="recStatusText">녹화 준비 중...</span>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="recProgress"></div></div>
      </div>

      <!-- Transport -->
      <div class="transport">
        <button class="btn-play" id="btnPlay" title="Play / Pause">▶</button>
        <button class="btn-sm" id="btnStop">■ Stop</button>
        <button class="btn-rec" id="btnRec" title="녹화 시작 (재생 처음부터 끝까지)">
          <span class="rec-dot"></span>REC
        </button>
        <span class="time-display" id="timeDisplay">0:00.0</span>
      </div>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────────────────
//  STATE
// ────────────────────────────────────────────────────────────
const TRACKS = ['vocal','drum','other','bass'];
const TRACK_META = {
  vocal: { label:'VOCAL', color:'#c084fc', accent:'--accent-v' },
  drum:  { label:'DRUM',  color:'#f97316', accent:'--accent-d' },
  other: { label:'OTHER', color:'#34d399', accent:'--accent-o' },
  bass:  { label:'BASS',  color:'#38bdf8', accent:'--accent-b' },
};

const SHAPES = [
  { id:'circle',  label:'원',    path:'M9,4.5 A4.5,4.5 0 1,1 8.999,4.5z' },
  { id:'petal',   label:'꽃잎',  path:'M9,3 C13,5 13,13 9,15 C5,13 5,5 9,3z' },
  { id:'star',    label:'별',    path:'M9,2 L10.5,7 L15,7 L11.5,10 L12.8,15 L9,12 L5.2,15 L6.5,10 L3,7 L7.5,7 Z' },
  { id:'drop',    label:'방울',  path:'M9,2 C9,2 15,9 15,12 A6,6 0 0,1 3,12 C3,9 9,2 9,2z' },
  { id:'leaf',    label:'잎',    path:'M9,2 C14,5 16,14 9,16 C2,14 4,5 9,2z' },
  { id:'diamond', label:'다이아', path:'M9,1 L17,9 L9,17 L1,9 Z' },
  { id:'crescent',label:'반달',  path:'M9,2 A7,7 0 1,0 9,16 A4,4 0 1,1 9,2z' },
  { id:'triangle',label:'삼각',  path:'M9,1 L17,16 L1,16 Z' },
];

const COLOR_STYLES = [
  { id:'bw',      label:'흑백' },
  { id:'pastel',  label:'파스텔' },
  { id:'vivid',   label:'원색' },
  { id:'custom',  label:'커스텀' },
];
const GRAD_STYLES = [
  { id:'radial',   label:'원형 그라디언트' },
  { id:'linear',   label:'선형 그라디언트' },
  { id:'inout',    label:'안팎 그라디언트' },
];

const state = {
  playing: false,
  audioCtx: null,
  tracks: {
    vocal: { buf:null, src:null, analyser:null, gain:null, file:null,
             intensity:70, count:8, size:60, shape:'petal', enabled:true },
    drum:  { buf:null, src:null, analyser:null, gain:null, file:null,
             intensity:70, count:6, size:50, shape:'circle', enabled:true },
    other: { buf:null, src:null, analyser:null, gain:null, file:null,
             intensity:70, count:10, size:40, shape:'leaf', enabled:true },
    bass:  { buf:null, src:null, analyser:null, gain:null, file:null,
             intensity:80, count:5, size:80, shape:'diamond', enabled:true },
  },
  colorStyle: 'vivid',
  gradStyle: 'radial',
  customColors: ['#c084fc','#f97316','#34d399','#38bdf8'],
  flowMode: 'expand',   // 'expand' | 'implode'
  startTime: 0,
  pauseOffset: 0,
  freqData: { vocal:0, drum:0, other:0, bass:0 },
  rotation: 0,
  activeTab: 'vocal',
  animId: null,
  // Recording
  mediaRecorder: null,
  recChunks: [],
  recDuration: 0,  // longest loaded track duration (seconds)
  recTimer: null,
  recStartAt: 0,
};

// ────────────────────────────────────────────────────────────
//  CANVAS
// ────────────────────────────────────────────────────────────
const canvas = document.getElementById('mandalaCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.width = w * devicePixelRatio;
  canvas.height = h * devicePixelRatio;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ────────────────────────────────────────────────────────────
//  COLOR UTILS
// ────────────────────────────────────────────────────────────
function getTrackColors(freq) {
  const cs = state.colorStyle;
  if (cs === 'custom') return state.customColors;
  if (cs === 'bw') {
    const v = Math.round(255 * freq);
    return [`rgb(${v},${v},${v})`, `rgb(${v},${v},${v})`, `rgb(${v},${v},${v})`, `rgb(${v},${v},${v})`];
  }
  if (cs === 'pastel') {
    const f = (hue, a) => `hsl(${hue},60%,${75 + a*10}%)`;
    return [f(280,freq), f(25,freq), f(150,freq), f(200,freq)];
  }
  // vivid
  return ['#c084fc','#f97316','#34d399','#38bdf8'];
}

function buildGradient(cx, cy, r, color, freq) {
  const gs = state.gradStyle;
  let g;
  if (gs === 'radial') {
    g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, colorAlpha(color, 0.95));
    g.addColorStop(1, colorAlpha(color, 0.1));
  } else if (gs === 'linear') {
    const angle = freq * Math.PI * 2;
    const dx = Math.cos(angle) * r;
    const dy = Math.sin(angle) * r;
    g = ctx.createLinearGradient(cx-dx, cy-dy, cx+dx, cy+dy);
    g.addColorStop(0, colorAlpha(color, 0.15));
    g.addColorStop(0.5, colorAlpha(color, 0.95));
    g.addColorStop(1, colorAlpha(color, 0.15));
  } else { // inout
    g = ctx.createRadialGradient(cx, cy, r*0.3, cx, cy, r);
    g.addColorStop(0, colorAlpha(color, 0.1));
    g.addColorStop(0.5, colorAlpha(color, 0.9));
    g.addColorStop(1, colorAlpha(color, 0.15));
  }
  return g;
}

function colorAlpha(hex, a) {
  if (hex.startsWith('#')) {
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  if (hex.startsWith('hsl')) return hex.replace('hsl','hsla').replace(')',`,${a})`);
  if (hex.startsWith('rgb(')) return hex.replace('rgb','rgba').replace(')',`,${a})`);
  return hex;
}

// ────────────────────────────────────────────────────────────
//  SHAPE DRAWING
// ────────────────────────────────────────────────────────────
function drawShape(cx, cy, size, shape, rotation) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  const s = size / 9;
  ctx.scale(s, s);
  ctx.translate(-9, -9);
  const p2d = new Path2D();
  switch(shape) {
    case 'circle':
      p2d.arc(9, 9, 4.5, 0, Math.PI*2); break;
    case 'petal':
      p2d.moveTo(9,3);
      p2d.bezierCurveTo(13,5,13,13,9,15);
      p2d.bezierCurveTo(5,13,5,5,9,3); break;
    case 'star':
      for(let i=0;i<5;i++){
        const a1=-Math.PI/2+i*Math.PI*2/5, a2=a1+Math.PI/5;
        if(i===0) p2d.moveTo(9+7*Math.cos(a1), 9+7*Math.sin(a1));
        else p2d.lineTo(9+7*Math.cos(a1), 9+7*Math.sin(a1));
        p2d.lineTo(9+3*Math.cos(a2), 9+3*Math.sin(a2));
      }
      p2d.closePath(); break;
    case 'drop':
      p2d.moveTo(9,2);
      p2d.bezierCurveTo(15,8,15,11,9,15);
      p2d.bezierCurveTo(3,11,3,8,9,2); break;
    case 'leaf':
      p2d.moveTo(9,2);
      p2d.bezierCurveTo(15,5,16,13,9,16);
      p2d.bezierCurveTo(2,13,3,5,9,2); break;
    case 'diamond':
      p2d.moveTo(9,1); p2d.lineTo(17,9);
      p2d.lineTo(9,17); p2d.lineTo(1,9);
      p2d.closePath(); break;
    case 'crescent':
      p2d.arc(9,9,7,0,Math.PI*2);
      p2d.arc(12,9,4.5,0,Math.PI*2,true); break;
    case 'triangle':
      p2d.moveTo(9,1); p2d.lineTo(17,16);
      p2d.lineTo(1,16); p2d.closePath(); break;
  }
  ctx.fill(p2d);
  ctx.restore();
}

// ────────────────────────────────────────────────────────────
//  MANDALA DRAW
// ────────────────────────────────────────────────────────────
// particle pool for flow mode
const particles = [];
function spawnParticle(trk, cx, cy, W, H) {
  const freq = state.freqData[trk];
  const t = state.tracks[trk];
  const implode = state.flowMode === 'implode';
  const maxR = Math.min(W, H) * 0.48;
  const startR = implode ? maxR * (0.5 + Math.random()*0.5) : 0;
  const endR   = implode ? 0 : maxR * (0.5 + Math.random()*0.5);
  const colors = getTrackColors(freq);
  const ti = TRACKS.indexOf(trk);
  return {
    trk, ang: Math.random() * Math.PI * 2,
    r: startR, startR, endR,
    life: 0, duration: 0.6 + Math.random() * 1.2,
    size: t.size * (0.3 + Math.random()*0.7) * (0.5 + freq*0.5),
    shape: t.shape,
    color: colors[ti],
    rotation: Math.random() * Math.PI * 2,
    spinSpeed: (Math.random()-0.5) * 0.08,
    symmetry: t.count,
  };
}

function drawMandala(dt) {
  const W = canvas.width / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;
  const cx = W / 2, cy = H / 2;

  // Trail fade — slower = longer trail
  ctx.fillStyle = isDark() ? 'rgba(12,12,18,0.16)' : 'rgba(245,244,255,0.16)';
  ctx.fillRect(0, 0, W, H);

  const freqs = state.freqData;
  const totalFreq = (freqs.vocal + freqs.drum + freqs.other + freqs.bass) / 4;
  const colors = getTrackColors(totalFreq);
  const rotSpeed = 0.003;
  const implode = state.flowMode === 'implode';

  // ── Spawn new particles proportional to freq
  if (state.playing) {
    TRACKS.forEach(trk => {
      const freq = freqs[trk];
      const t = state.tracks[trk];
      if (!t.enabled || freq < 0.02) return;
      const spawnRate = freq * 2.5 * (t.intensity/100);
      if (Math.random() < spawnRate * dt) {
        // spawn t.count symmetrical copies at once
        particles.push(spawnParticle(trk, cx, cy, W, H));
      }
    });
  }

  // ── Update & draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    const prog = Math.min(p.life / p.duration, 1);
    const eased = implode
      ? 1 - Math.pow(1 - prog, 2)   // ease-in: accelerates toward center
      : Math.pow(prog, 0.5);         // ease-out: slows as it expands

    p.r = p.startR + (p.endR - p.startR) * eased;
    p.rotation += p.spinSpeed;

    const alpha = implode
      ? (1 - prog) * (0.5 + freqs[p.trk] * 0.5)  // fade out as pulled in
      : prog < 0.1 ? prog * 10 : (1 - prog) * (0.6 + freqs[p.trk] * 0.4); // fade in then out

    if (p.life >= p.duration) { particles.splice(i, 1); continue; }

    // draw symmetrical copies
    const sym = p.symmetry;
    for (let s = 0; s < sym; s++) {
      const ang = p.ang + (Math.PI * 2 / sym) * s + state.rotation * (1 + TRACKS.indexOf(p.trk) * 0.08);
      const px = cx + Math.cos(ang) * p.r;
      const py = cy + Math.sin(ang) * p.r;
      const g = buildGradient(px, py, p.size, p.color, freqs[p.trk]);
      ctx.fillStyle = g;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      drawShape(px, py, p.size, p.shape, ang + p.rotation);
    }
  }
  ctx.globalAlpha = 1;

  // ── Static ring mandala (base layer)
  TRACKS.forEach((trk, ti) => {
    const t = state.tracks[trk];
    if (!t.enabled) return;
    const freq = freqs[trk];
    const color = colors[ti];
    const intensity = t.intensity / 100;
    const count = t.count;
    const baseSize = t.size * (0.35 + freq * 0.3) * intensity;
    const baseRadius = Math.min(W, H) * (implode ? 0.38 : 0.12) * (1 + ti * 0.35)
                       + freq * Math.min(W,H) * 0.04 * intensity;

    const layerRot = state.rotation * (1 + ti * 0.08) * (ti % 2 === 0 ? 1 : -1);
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 / count) * i + layerRot;
      const px = cx + Math.cos(ang) * baseRadius;
      const py = cy + Math.sin(ang) * baseRadius;
      const shapeRot = ang + state.rotation * 1.5;
      const shapeSize = baseSize * (0.7 + 0.3 * Math.sin(state.rotation * 3 + i));
      const g = buildGradient(px, py, shapeSize, color, freq);
      ctx.fillStyle = g;
      ctx.globalAlpha = 0.25 + freq * 0.2;
      drawShape(px, py, shapeSize, t.shape, shapeRot);
    }
    ctx.globalAlpha = 1;
  });

  // ── Center glow
  const glowR = Math.min(W,H) * 0.04 + totalFreq * Math.min(W,H) * 0.04;
  const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,glowR*3);
  if (implode) {
    // pulsing bright core on implode
    const pulse = 0.7 + totalFreq * 0.3;
    glow.addColorStop(0, `rgba(255,255,255,${pulse})`);
    glow.addColorStop(0.2, `rgba(56,189,248,${pulse * 0.6})`);
  } else {
    glow.addColorStop(0,'rgba(255,255,255,0.9)');
    glow.addColorStop(0.3,'rgba(192,132,252,0.5)');
  }
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, glowR * (implode ? 4 + totalFreq * 3 : 3), 0, Math.PI*2);
  ctx.fill();

  // ── Ring lines
  ctx.globalAlpha = 0.1 + totalFreq * 0.12;
  ctx.strokeStyle = isDark() ? '#ffffff' : '#333333';
  ctx.lineWidth = 0.5;
  for (let r = 1; r <= 4; r++) {
    ctx.beginPath();
    ctx.arc(cx, cy, Math.min(W,H)*0.08*r + totalFreq*12, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  state.rotation += rotSpeed + totalFreq * 0.01;
}

let lastFrameTime = performance.now();

// ────────────────────────────────────────────────────────────
//  AUDIO ENGINE
// ────────────────────────────────────────────────────────────
function ensureCtx() {
  if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

async function loadTrackFile(trk, file) {
  ensureCtx();
  const t = state.tracks[trk];
  t.file = file;

  const ab = await file.arrayBuffer();
  t.buf = await state.audioCtx.decodeAudioData(ab);
  updateTrackPanel(trk);
}

function startAllTracks(oneShot = false) {
  ensureCtx();
  const ctx2 = state.audioCtx;
  if (ctx2.state === 'suspended') ctx2.resume();

  // figure out max duration for recording
  let maxDuration = 0;

  TRACKS.forEach(trk => {
    const t = state.tracks[trk];
    if (!t.buf) return;
    if (t.src) { try { t.src.stop(); } catch(e){} }

    if (!t.analyser) {
      t.analyser = ctx2.createAnalyser();
      t.analyser.fftSize = 256;
      t.gain = ctx2.createGain();
      t.analyser.connect(t.gain);
      t.gain.connect(ctx2.destination);
    }
    t.gain.gain.value = t.intensity / 100;

    const src = ctx2.createBufferSource();
    src.buffer = t.buf;
    src.loop = !oneShot;
    src.connect(t.analyser);
    src.start(0, state.pauseOffset % t.buf.duration);
    if (t.buf.duration > maxDuration) maxDuration = t.buf.duration;
    t.src = src;
  });

  state.startTime = ctx2.currentTime - state.pauseOffset;
  state.playing = true;
  document.getElementById('btnPlay').textContent = '⏸';

  if (oneShot && maxDuration > 0) {
    // stop and finalize recording when longest track ends
    const remaining = maxDuration - state.pauseOffset;
    state._oneShotTimer = setTimeout(() => {
      stopAllTracks(false);
      if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
        state.mediaRecorder.stop();
      }
    }, remaining * 1000 + 200);
  }
}

// ────────────────────────────────────────────────────────────
//  RECORDING
// ────────────────────────────────────────────────────────────
function startRecording() {
  if (state.mediaRecorder) return;
  // reset to start
  stopAllTracks(false);
  particles.length = 0;
  state.pauseOffset = 0;
  state.rotation = 0;

  const stream = canvas.captureStream(30);
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';
  const mr = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
  state.mediaRecorder = mr;
  state.recChunks = [];

  mr.ondataavailable = e => { if (e.data.size > 0) state.recChunks.push(e.data); };
  mr.onstart = () => {
    state.recStartAt = Date.now();
    updateRecUI(true);
    // progress bar update
    state.recTimer = setInterval(() => {
      const elapsed = (Date.now() - state.recStartAt) / 1000;
      const maxDur = Math.max(...TRACKS.map(tr => state.tracks[tr].buf?.duration || 0));
      const pct = maxDur > 0 ? Math.min(elapsed / maxDur, 1) : 0;
      document.getElementById('recProgress').style.width = (pct * 100) + '%';
      document.getElementById('recStatusText').textContent =
        `녹화 중... ${elapsed.toFixed(1)}s / ${maxDur.toFixed(1)}s`;
    }, 200);
  };
  mr.onstop = () => {
    clearInterval(state.recTimer);
    state.recTimer = null;
    const blob = new Blob(state.recChunks, { type: mimeType });
    state.recChunks = [];
    state.mediaRecorder = null;
    finishRecording(blob);
  };

  mr.start(100);
  // start audio one-shot
  startAllTracks(true);
}

function finishRecording(blob) {
  updateRecUI(false, true);
  const url = URL.createObjectURL(blob);
  const sizeMB = (blob.size / 1048576).toFixed(1);
  document.getElementById('recStatusText').textContent = `완료 (${sizeMB} MB) — 아래 링크 클릭`;
  document.getElementById('recProgress').style.width = '100%';

  // show download link
  const recArea = document.getElementById('recStatus');
  // remove old links
  recArea.querySelectorAll('.rec-dl').forEach(el => el.remove());
  const a = document.createElement('button');
  a.className = 'rec-dl btn-sm';
  a.textContent = '⬇ mandala.webm 저장';
  a.style.cssText = 'font-size:10px;color:var(--accent-o);border-color:var(--accent-o);cursor:pointer;margin-left:8px;';
  a.addEventListener('click', () => {
    // Use runtime downloads capability if available, else window.open
    if (window.claude && window.claude.downloads) {
      fetch(url).then(r => r.arrayBuffer()).then(buf => {
        window.claude.downloads.save({
          filename: 'mandala.webm',
          data: new Uint8Array(buf),
          mimeType: mimeType,
        });
      });
    } else {
      window.open(url, '_blank');
    }
  });
  recArea.appendChild(a);
}

function updateRecUI(recording, done = false) {
  const btn = document.getElementById('btnRec');
  const status = document.getElementById('recStatus');
  btn.classList.toggle('recording', recording);
  status.style.display = (recording || done) ? 'flex' : 'none';
  if (done) status.classList.add('done');
  else status.classList.remove('done');
}

function stopAllTracks(pause = false) {
  if (state.audioCtx) {
    if (pause) {
      state.pauseOffset = state.audioCtx.currentTime - state.startTime;
    } else {
      state.pauseOffset = 0;
    }
    TRACKS.forEach(trk => {
      const t = state.tracks[trk];
      if (t.src) { try { t.src.stop(); } catch(e){} t.src = null; }
    });
  }
  state.playing = false;
  document.getElementById('btnPlay').textContent = '▶';
  if (!pause) {
    document.getElementById('timeDisplay').textContent = '0:00.0';
    state.rotation = 0;
  }
}

// ────────────────────────────────────────────────────────────
//  ANIMATION LOOP
// ────────────────────────────────────────────────────────────
const freqArr = {};
TRACKS.forEach(trk => { freqArr[trk] = new Uint8Array(128); });

function animLoop(ts) {
  state.animId = requestAnimationFrame(animLoop);
  const dt = Math.min((ts - lastFrameTime) / 1000, 0.1);
  lastFrameTime = ts;

  TRACKS.forEach(trk => {
    const t = state.tracks[trk];
    if (t.analyser) {
      t.analyser.getByteFrequencyData(freqArr[trk]);
      const avg = freqArr[trk].slice(0, 64).reduce((a,b)=>a+b,0) / 64 / 255;
      state.freqData[trk] = state.freqData[trk] * 0.7 + avg * 0.3;
    } else {
      state.freqData[trk] = state.freqData[trk] * 0.92;
    }
  });

  // Update meters
  ['vocal','drum','other','bass'].forEach((trk, i) => {
    const ids = ['meterV','meterD','meterO','meterB'];
    const el = document.getElementById(ids[i]);
    if (el) el.style.height = (state.freqData[trk] * 100).toFixed(1) + '%';
  });

  // Time display
  if (state.playing && state.audioCtx) {
    const elapsed = state.audioCtx.currentTime - state.startTime;
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('timeDisplay').textContent =
      `${m}:${s.toFixed(1).padStart(4,'0')}`;
  }

  drawMandala(dt);
}
requestAnimationFrame(animLoop);

// ────────────────────────────────────────────────────────────
//  UI PANELS
// ────────────────────────────────────────────────────────────
function isDark() {
  const root = document.documentElement;
  if (root.dataset.theme === 'dark') return true;
  if (root.dataset.theme === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function buildTrackPanel(trk) {
  const t = state.tracks[trk];
  const meta = TRACK_META[trk];
  const cls = trk === 'vocal' ? 'vocal' : trk === 'drum' ? 'drum' : trk === 'other' ? 'other' : 'bass';
  return `
    <div class="section-title">오디오 파일</div>
    <div class="drop-zone" id="drop_${trk}">
      <input type="file" id="file_${trk}" accept="audio/*" data-trk="${trk}">
      <div class="drop-icon">🎵</div>
      <div class="drop-label"><strong>${meta.label}</strong><br>MP3 / WAV / OGG</div>
      <div class="file-name" id="fname_${trk}">${t.file ? t.file.name : '파일 없음'}</div>
    </div>

    <hr class="divider">
    <div class="section-title">파라미터</div>

    <div class="ctrl-row">
      <span class="ctrl-label">세기</span>
      <input type="range" class="${cls}-range" id="${trk}_intensity" min="0" max="100" value="${t.intensity}">
      <span class="ctrl-val" id="${trk}_intensity_v">${t.intensity}</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">갯수</span>
      <input type="range" class="${cls}-range" id="${trk}_count" min="2" max="24" value="${t.count}">
      <span class="ctrl-val" id="${trk}_count_v">${t.count}</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">크기</span>
      <input type="range" class="${cls}-range" id="${trk}_size" min="10" max="150" value="${t.size}">
      <span class="ctrl-val" id="${trk}_size_v">${t.size}</span>
    </div>

    <hr class="divider">
    <div class="section-title">모양</div>
    <div class="shape-grid" id="shape_${trk}">
      ${SHAPES.map(sh => `
        <button class="shape-btn ${t.shape===sh.id?'active':''}" data-trk="${trk}" data-shape="${sh.id}" title="${sh.label}">
          <svg viewBox="0 0 18 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            ${shapeInlineSVG(sh.id)}
          </svg>
          ${sh.label}
        </button>`).join('')}
    </div>
  `;
}

function shapeInlineSVG(id) {
  switch(id) {
    case 'circle':  return '<circle cx="9" cy="9" r="6"/>';
    case 'petal':   return '<path d="M9,2 C13,4 13,14 9,16 C5,14 5,4 9,2z"/>';
    case 'star':    return '<polygon points="9,1 10.8,6.5 16.5,6.5 12,10 13.8,15.5 9,12 4.2,15.5 6,10 1.5,6.5 7.2,6.5"/>';
    case 'drop':    return '<path d="M9,1 C9,1 16,9 16,12 A7,7 0 0,1 2,12 C2,9 9,1 9,1z"/>';
    case 'leaf':    return '<path d="M9,1 C15,4 17,14 9,17 C1,14 3,4 9,1z"/>';
    case 'diamond': return '<polygon points="9,1 17,9 9,17 1,9"/>';
    case 'crescent':return '<path d="M14,9 A7,7 0 1,1 14.01,9 M14,9 A4,4 0 1,0 14.01,9z"/>';
    case 'triangle':return '<polygon points="9,1 17,17 1,17"/>';
  }
  return '';
}

              <span class="track-dot" style="background:${meta.color}"></span>
              ${meta.label}
              <span style="font-size:9px; color:var(--fg2); font-weight:400; margin-left:auto;">
                ${t.file ? '✓ 로드됨' : '파일 없음'}
              </span>
            </div>
            <div class="ctrl-row">
              <span class="ctrl-label">세기</span>
              <input type="range" id="all_${trk}_intensity" min="0" max="100" value="${t.intensity}" style="flex:1;">
              <span class="ctrl-val" id="all_${trk}_intensity_v">${t.intensity}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderPanel(tab) {
  const panel = document.getElementById('panelScroll');
  state.activeTab = tab;
  if (tab === 'style') {
    panel.innerHTML = buildStylePanel();
    bindStyleEvents();
  } else {
    panel.innerHTML = buildTrackPanel(tab);
    bindTrackEvents(tab);
  }
}

function bindTrackEvents(trk) {
  // File input
  const fi = document.getElementById(`file_${trk}`);
  if (fi) fi.addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) loadTrackFile(trk, f).then(() => {
      document.getElementById(`fname_${trk}`).textContent = f.name;
    });
  });

  // Sliders
  ['intensity','count','size'].forEach(param => {
    const sl = document.getElementById(`${trk}_${param}`);
    if (!sl) return;
    sl.addEventListener('input', e => {
      const v = parseInt(e.target.value);
      state.tracks[trk][param] = v;
      const vEl = document.getElementById(`${trk}_${param}_v`);
      if (vEl) vEl.textContent = v;
      if (param === 'intensity' && state.tracks[trk].gain) {
        state.tracks[trk].gain.gain.value = v / 100;
      }
    });
  });

  // Shapes
  const sg = document.getElementById(`shape_${trk}`);
  if (sg) sg.addEventListener('click', e => {
    const btn = e.target.closest('.shape-btn');
    if (!btn) return;
    state.tracks[trk].shape = btn.dataset.shape;
    sg.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b === btn));
  });
}

function bindStyleEvents() {
  // Color style
  document.querySelectorAll('[data-colorstyle]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.colorStyle = btn.dataset.colorstyle;
      document.querySelectorAll('[data-colorstyle]').forEach(b => b.classList.toggle('active', b===btn));
      const cr = document.getElementById('customColorRow');
      if (cr) cr.style.display = state.colorStyle === 'custom' ? 'flex' : 'none';
    });
  });

  // Custom colors
  TRACKS.forEach((trk,i) => {
    const ci = document.getElementById(`cc_${trk}`);
    if (ci) ci.addEventListener('input', e => { state.customColors[i] = e.target.value; });
  });

  // Grad style
  document.querySelectorAll('[data-gradstyle]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.gradStyle = btn.dataset.gradstyle;
      document.querySelectorAll('[data-gradstyle]').forEach(b => b.classList.toggle('active', b===btn));
    });
  });

  // All-tracks intensity sliders
  TRACKS.forEach(trk => {
    const sl = document.getElementById(`all_${trk}_intensity`);
    if (sl) sl.addEventListener('input', e => {
      const v = parseInt(e.target.value);
      state.tracks[trk].intensity = v;
      const vEl = document.getElementById(`all_${trk}_intensity_v`);
      if (vEl) vEl.textContent = v;
      if (state.tracks[trk].gain) state.tracks[trk].gain.gain.value = v / 100;
    });
  });
}

function updateTrackPanel(trk) {
  if (state.activeTab === trk) renderPanel(trk);
  if (state.activeTab === 'style') renderPanel('style');
}

// ────────────────────────────────────────────────────────────
//  EVENT BINDING
// ────────────────────────────────────────────────────────────
// Tabs
document.querySelector('.tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPanel(btn.dataset.tab);
});

// Play / Pause
document.getElementById('btnPlay').addEventListener('click', () => {
  ensureCtx();
  if (state.playing) {
    stopAllTracks(true);
  } else {
    startAllTracks();
  }
});

// Stop
document.getElementById('btnStop').addEventListener('click', () => {
  if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
    state.mediaRecorder.stop();
  }
  clearTimeout(state._oneShotTimer);
  stopAllTracks(false);
  particles.length = 0;
});

// REC button
document.getElementById('btnRec').addEventListener('click', () => {
  if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
    // cancel recording
    clearTimeout(state._oneShotTimer);
    state.mediaRecorder.stop();
    stopAllTracks(false);
    particles.length = 0;
    updateRecUI(false);
  } else {
    const hasBuf = TRACKS.some(trk => state.tracks[trk].buf);
    if (!hasBuf) {
      alert('먼저 트랙에 MP3 파일을 로드해주세요.');
      return;
    }
    startRecording();
  }
});

// Flow mode toggle
document.querySelectorAll('.flow-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.flow-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.flowMode = btn.dataset.mode;
    particles.length = 0; // clear existing particles on mode switch
  });
});

// Theme toggle
document.getElementById('themeToggle').addEventListener('click', () => {
  const root = document.documentElement;
  const isDarkNow = isDark();
  root.dataset.theme = isDarkNow ? 'light' : 'dark';
  document.getElementById('themeToggle').textContent = isDarkNow ? '🌙 Dark' : '☀ Light';
});

// ────────────────────────────────────────────────────────────
//  INIT
// ────────────────────────────────────────────────────────────
renderPanel('vocal');
</script>

</body></html>
