<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@400;700;800&display=swap">
<style>
:root {
  --bg: #0c0c12;
  --bg2: #13131f;
  --bg3: #1a1a2a;
  --surface: #1e1e30;
  --border: rgba(255,255,255,0.08);
  --fg: #e8e8f0;
  --fg2: #8888aa;
  --fg3: #555577;
  --accent-v: #c084fc;
  --accent-d: #f97316;
  --accent-o: #34d399;
  --accent-b: #38bdf8;
  --font-d: 'Syne', sans-serif;
  --font-b: 'DM Sans', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f4ff; --bg2: #eeedf8; --bg3: #e6e4f4; --surface: #fafafe;
    --border: rgba(0,0,0,0.08); --fg: #18182a; --fg2: #5a5a80; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f4ff; --bg2: #eeedf8; --bg3: #e6e4f4; --surface: #fafafe;
  --border: rgba(0,0,0,0.08); --fg: #18182a; --fg2: #5a5a80; color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-b); background: var(--bg); color: var(--fg);
  height: 100%; overflow: hidden; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
html { height: 100%; }
.app { display: flex; flex-direction: column; height: 100%; gap: 0; }
header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; gap:12px; }
header h1 {
  font-family: var(--font-d); font-weight: 800; font-size: clamp(14px, 2vw, 18px);
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent-v), var(--accent-b));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header-right { display: flex; align-items: center; gap: 8px; }
.main { display: flex; flex: 1; min-height: 0; gap: 0; }
/* ─── Canvas 16:9 고정 영역 ─── */
.canvas-wrap {
  flex: 1; min-width: 0; position: relative; display: flex;
  align-items: center; justify-content: center; background: var(--bg);
  padding: 18px; overflow: hidden;
}
.canvas-16-9 {
  aspect-ratio: 16 / 9;
  width: 100%;
  max-width: 100%;
  max-height: 100%;
  position: relative;
  background: radial-gradient(120% 120% at 50% 50%, #17172a 0%, var(--bg) 72%);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.03);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.canvas-16-9::before{
  content:'16:9 FIXED';
  position:absolute; top:10px; left:12px; z-index:2;
  font-family: var(--font-d); font-size:9px; letter-spacing:0.14em;
  color: var(--fg2); opacity:0.6; pointer-events:none;
}
#mandalaCanvas { display: block; width: 100%; height: 100%; }
.sidebar { width: 320px; flex-shrink: 0; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab-btn { flex: 1; padding: 8px 4px; font-family: var(--font-d); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: transparent; border: none; color: var(--fg2); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
.tab-btn.active { color: var(--fg); border-bottom-color: var(--accent-v); }
.tab-btn[data-tab="drum"].active { border-bottom-color: var(--accent-d); }
.tab-btn[data-tab="other"].active { border-bottom-color: var(--accent-o); }
.tab-btn[data-tab="bass"].active { border-bottom-color: var(--accent-b); }
.panel-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.section-title { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg2); margin-bottom: 6px; }
.drop-zone { border: 1.5px dashed var(--border); border-radius: 8px; padding: 12px 8px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative; }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent-v); background: rgba(192,132,252,0.05); }
.drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-icon { font-size: 18px; margin-bottom: 4px; }
.drop-label { font-size: 11px; color: var(--fg2); line-height: 1.4; }
.drop-label strong { color: var(--fg); }
.file-name { font-size: 10px; color: var(--accent-o); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.ctrl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ctrl-label { font-size: 11px; color: var(--fg2); flex-shrink: 0; width: 52px; }
.ctrl-val { font-size: 10px; color: var(--fg2); width: 28px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; height: 3px; -webkit-appearance: none; background: var(--bg3); border-radius: 2px; outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); cursor: pointer; }
.vocal-range::-webkit-slider-thumb { background: var(--accent-v); }
.drum-range::-webkit-slider-thumb  { background: var(--accent-d); }
.other-range::-webkit-slider-thumb { background: var(--accent-o); }
.bass-range::-webkit-slider-thumb  { background: var(--accent-b); }
.shape-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.shape-btn {
  aspect-ratio: 0.9; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg3); border: 1.5px solid transparent; border-radius: 8px; cursor: pointer;
  font-size: 8.5px; color: var(--fg2); gap: 4px; transition: all 0.15s; padding:4px 2px; line-height:1.1; text-align:center;
}
.shape-btn svg { width: 22px; height: 22px; }
.shape-btn:hover { border-color: var(--border); color: var(--fg); }
.shape-btn.active { border-color: var(--accent-v); color: var(--accent-v); background: rgba(192,132,252,0.10); }
.shape-btn.composite { background: linear-gradient(135deg, rgba(192,132,252,0.12), rgba(56,189,248,0.08)); }
.shape-btn.composite.active { border-color: var(--accent-b); color: var(--accent-b); }
.color-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { padding: 4px 9px; border-radius: 20px; font-size: 10px; border: 1.5px solid var(--border); background: transparent; color: var(--fg2); cursor: pointer; transition: all 0.15s; }
.chip:hover { border-color: var(--fg2); color: var(--fg); }
.chip.active { border-color: var(--accent-v); color: var(--accent-v); background: rgba(192,132,252,0.08); }
.custom-colors { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; color: var(--fg2); }
.color-swatch input[type=color] { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); cursor: pointer; padding: 1px; background: transparent; }
.grad-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.flow-toggle { display: flex; background: var(--bg3); border-radius: 20px; padding: 2px; gap: 0; }
.flow-btn { flex: 1; padding: 4px 10px; border-radius: 18px; font-size: 10px; font-weight: 600; border: none; background: transparent; color: var(--fg2); cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em; white-space: nowrap; }
.flow-btn.active { background: linear-gradient(135deg, var(--accent-v), var(--accent-b)); color: #fff; }
.transport { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.btn-play { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-v), var(--accent-b)); border: none; cursor: pointer; color: #fff; font-size: 14px; flex-shrink: 0; transition: transform 0.15s; }
.btn-play:hover { transform: scale(1.08); }
.btn-play:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-sm { padding: 5px 10px; border-radius: 20px; font-size: 11px; border: 1.5px solid var(--border); background: transparent; color: var(--fg2); cursor: pointer; transition: all 0.15s; font-family: var(--font-b); }
.btn-sm:hover { color: var(--fg); border-color: var(--fg2); }
.btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-rec { padding: 5px 10px; border-radius: 20px; font-size: 11px; border: 1.5px solid var(--border); background: transparent; color: #f87171; cursor: pointer; transition: all 0.15s; font-family: var(--font-b); display: flex; align-items: center; gap: 4px; }
.btn-rec:hover { background: rgba(248,113,113,0.1); border-color: #f87171; }
.btn-rec.recording { background: rgba(248,113,113,0.15); border-color: #f87171; animation: recPulse 1s ease-in-out infinite; }
@keyframes recPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; }
.time-display { font-size: 11px; color: var(--fg2); font-variant-numeric: tabular-nums; margin-left: auto; flex-shrink: 0; }
.rec-status { font-size: 10px; padding: 5px 10px; border-radius: 6px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); color: #f87171; display: none; align-items: center; gap: 6px; margin: 0 0 4px; flex-shrink: 0; }
.rec-status.show { display: flex; }
.rec-status.done { color: var(--accent-o); background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.25); }
.progress-bar-wrap { height: 2px; background: var(--bg3); border-radius: 1px; overflow: hidden; flex: 1; }
.progress-bar-fill { height: 100%; width: 0%; background: #f87171; border-radius: 1px; transition: width 0.3s linear; }
.meters { display: flex; gap: 3px; padding: 8px 0; border-top: 1px solid var(--border); flex-shrink: 0; }
.meter-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.meter-label { font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg2); }
.meter-bar { width: 100%; height: 40px; background: var(--bg3); border-radius: 2px; position: relative; overflow: hidden; }
.meter-fill { position: absolute; bottom: 0; left: 0; right: 0; transition: height 0.05s; border-radius: 2px; }
.meter-v .meter-fill { background: var(--accent-v); }
.meter-d .meter-fill { background: var(--accent-d); }
.meter-o .meter-fill { background: var(--accent-o); }
.meter-b .meter-fill { background: var(--accent-b); }
.all-tracks { display: flex; flex-direction: column; gap: 10px; }
.track-row { background: var(--bg3); border-radius: 8px; padding: 10px; }
.track-row-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 11px; font-weight: 600; font-family: var(--font-d); letter-spacing: 0.04em; }
.theme-toggle { padding: 4px 10px; border-radius: 20px; font-size: 10px; border: 1px solid var(--border); background: transparent; color: var(--fg2); cursor: pointer; font-family: var(--font-b); }
hr.divider { border: none; border-top: 1px solid var(--border); }
@media (max-width: 720px) {
  .sidebar { width: 100%; max-height: 56vh; border-left: none; border-top: 1px solid var(--border); }
  .main { flex-direction: column; }
  .canvas-wrap { min-height: 300px; padding:10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<div class="app">
  <header>
    <h1>4Track Mandala Studio · 16:9 Composite</h1>
    <div class="flow-toggle" title="흐름 모드">

</div>
<script>
// ─── STATE ───
const TRACKS = ['vocal','drum','other','bass'];
const TRACK_META = {
  vocal: { label:'VOCAL', color:'#c084fc' },
  drum:  { label:'DRUM',  color:'#f97316' },
  other: { label:'OTHER', color:'#34d399' },
  bass:  { label:'BASS',  color:'#38bdf8' },
};
// ─── 기존 단일 쉐이프 8개 ───
const PRIMITIVE_SHAPES = [
  { id:'circle',  label:'원' },
  { id:'petal',   label:'꽃잎' },
  { id:'star',    label:'별' },
  { id:'drop',    label:'방울' },
  { id:'leaf',    label:'잎' },
  { id:'diamond', label:'다이아' },
  { id:'crescent',label:'반달' },
  { id:'triangle',label:'삼각' },
];
// ─── NEW: 복합 만다라 쉐이프 (기존들을 겹쳐서) ───
const COMPOSITE_DEFS = {
  rose_mandala: {
    label:'로즈 만다라',
    layers: [
      { shape:'petal', scale:1.0, rot:0, alpha:1 },
      { shape:'petal', scale:0.62, rot:0.39, alpha:0.92 },
      { shape:'circle', scale:0.26, alpha:0.95 },
      { shape:'star', scale:0.18, alpha:0.9 }
    ]
  },
  temple_bloom: {
    label:'성전 블룸',
    layers: [
      { shape:'diamond', scale:1.15, rot:0, alpha:0.9 },
      { shape:'petal', scale:0.78, rot:0, alpha:1 },
      { shape:'drop', scale:0.42, rot:3.1415, alpha:0.85 },
      { shape:'circle', scale:0.20, alpha:1 }
    ]
  },
  lotus_prism: {
    label:'연꽃 프리즘',
    layers: [
      { shape:'leaf', scale:1.1, rot:0, alpha:0.95 },
      { shape:'triangle', scale:0.72, rot:0, alpha:0.8 },
      { shape:'petal', scale:0.52, rot:0, alpha:0.9 },
      { shape:'circle', scale:0.18, alpha:1 }
    ]
  },
  star_gate: {
    label:'스타 게이트',
    layers: [
      { shape:'star', scale:1.0, rot:0, alpha:1 },
      { shape:'diamond', scale:0.58, rot:0.785, alpha:0.9 },
      { shape:'circle', scale:0.32, alpha:0.85 },
      { shape:'circle', scale:0.15, alpha:1 }
    ]
  },
  crescent_crown: {
    label:'초승 왕관',
    layers: [
      { shape:'crescent', scale:1.1, rot:-0.2, alpha:0.9 },
      { shape:'petal', scale:0.62, rot:0.2, alpha:0.95 },
      { shape:'star', scale:0.28, rot:0, alpha:1 }
    ]
  },
  celestial_lotus: {
    label:'천상 연꽃',
    layers: [
      { shape:'petal', scale:1.0, rot:0, alpha:1 },
      { shape:'leaf', scale:0.85, rot:0.35, alpha:0.88 },
      { shape:'diamond', scale:0.52, rot:0.785, alpha:0.82 },
      { shape:'circle', scale:0.38, alpha:0.7 },
      { shape:'star', scale:0.22, alpha:1 }
    ]
  },
  dual_petal: {
    label:'이중 꽃잎',
    layers: [
      { shape:'petal', scale:1.0, rot:0, alpha:0.95 },
      { shape:'petal', scale:0.72, rot:3.1415, alpha:0.9 },
      { shape:'leaf', scale:0.45, rot:1.57, alpha:0.85 }
    ]
  },
  trinity_orb: {
    label:'삼위 오브',
    layers: [
      { shape:'triangle', scale:1.0, rot:0, alpha:0.85 },
      { shape:'circle', scale:0.62, alpha:0.8 },
      { shape:'star', scale:0.32, rot:0, alpha:1 },
      { shape:'circle', scale:0.12, alpha:1 }
    ]
  }
};
const COMPOSITE_SHAPES = Object.entries(COMPOSITE_DEFS).map(([id, def])=>({ id, label:def.label, composite:true }));
const SHAPES = [...PRIMITIVE_SHAPES, ...COMPOSITE_SHAPES];
const COLOR_STYLES = [
  { id:'bw',      label:'흑백' },
  { id:'pastel',  label:'파스텔' },
  { id:'vivid',   label:'원색' },
  { id:'custom',  label:'커스텀' },
];
const GRAD_STYLES = [
  { id:'radial',   label:'원형 그라디언트' },
  { id:'linear',   label:'선형 그라디언트' },
  { id:'inout',    label:'안팎 그라디언트' },
];
const state = {
  playing: false,
  audioCtx: null,
  tracks: {
    vocal: { buf:null, src:null, analyser:null, gain:null, file:null, intensity:70, count:8, size:60, shape:'celestial_lotus', enabled:true },
    drum:  { buf:null, src:null, analyser:null, gain:null, file:null, intensity:70, count:6, size:50, shape:'star_gate', enabled:true },
    other: { buf:null, src:null, analyser:null, gain:null, file:null, intensity:70, count:10, size:40, shape:'rose_mandala', enabled:true },
    bass:  { buf:null, src:null, analyser:null, gain:null, file:null, intensity:80, count:5, size:80, shape:'lotus_prism', enabled:true },
  },
  colorStyle: 'vivid',
  gradStyle: 'radial',
  customColors: ['#c084fc','#f97316','#34d399','#38bdf8'],
  flowMode: 'expand',
  startTime: 0,
  pauseOffset: 0,
  freqData: { vocal:0, drum:0, other:0, bass:0 },
  rotation: 0,
  activeTab: 'vocal',
  animId: null,
  mediaRecorder: null,
  recChunks: [],
  recTimer: null,
  recStartAt: 0,
};
// ─── CANVAS 16:9 ───
const canvas = document.getElementById('mandalaCanvas');
const ctx = canvas.getContext('2d');
const canvasBox = document.getElementById('canvasBox');
function resizeCanvas() {
  const w = canvasBox.clientWidth;
  const h = canvasBox.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);
new ResizeObserver(resizeCanvas).observe(canvasBox);
resizeCanvas();
// ─── COLOR UTILS ───
function getTrackColors(freq) {
  const cs = state.colorStyle;
  if (cs === 'custom') return state.customColors;
  if (cs === 'bw') {
    const v = Math.round(255 * freq);
    return [`rgb(${v},${v},${v})`, `rgb(${v},${v},${v})`, `rgb(${v},${v},${v})`, `rgb(${v},${v},${v})`];
  }

        <button class="shape-btn ${sh.composite?'composite':''} ${t.shape===sh.id?'active':''}" data-trk="${trk}" data-shape="${sh.id}" title="${sh.label}">
          <svg viewBox="0 0 18 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${shapeInlineSVG(sh.id)}</svg>
          ${sh.label}
        </button>`).join('')}
    </div>
  `;
}
function buildStylePanel() {
  return `
    <div class="section-title">색상 스타일</div>
    <div class="color-chips">${COLOR_STYLES.map(c=>`<button class="chip ${state.colorStyle===c.id?'active':''}" data-colorstyle="${c.id}">${c.label}</button>`).join('')}</div>
    <div id="customColorRow" style="display:${state.colorStyle==='custom'?'flex':'none'}; flex-direction:column; gap:8px; margin-top:8px;">
      <div class="section-title">커스텀 색상</div>
      <div class="custom-colors">${TRACKS.map((trk,i)=>`<div class="color-swatch"><input type="color" id="cc_${trk}" value="${state.customColors[i]}" data-ci="${i}"><span>${TRACK_META[trk].label}</span></div>`).join('')}</div>
    </div>
    <hr class="divider">
    <div class="section-title">색상 모양</div>
    <div class="grad-chips">${GRAD_STYLES.map(g=>`<button class="chip ${state.gradStyle===g.id?'active':''}" data-gradstyle="${g.id}">${g.label}</button>`).join('')}</div>
    <hr class="divider">
    <div class="section-title">캔버스</div>
    <div style="font-size:11px; color:var(--fg2); line-height:1.5;">현재 <strong style="color:var(--fg)">16:9 고정</strong> 모드. 녹화 시에도 16:9 webm으로 저장됩니다. 검은 레터박스는 자동 처리됩니다.</div>
    <hr class="divider">
    <div class="section-title">전체 보기</div>
    <div class="all-tracks">${TRACKS.map(trk => {
        const t = state.tracks[trk]; const meta = TRACK_META[trk];
        return `<div class="track-row"><div class="track-row-header"><span class="track-dot" style="background:${meta.color}"></span>${meta.label}<span style="font-size:9px; color:var(--fg2); font-weight:400; margin-left:auto;">${t.file ? '✓ 로드됨' : '파일 없음'}</span></div><div class="ctrl-row"><span class="ctrl-label">세기</span><input type="range" id="all_${trk}_intensity" min="0" max="100" value="${t.intensity}" style="flex:1;"><span class="ctrl-val" id="all_${trk}_intensity_v">${t.intensity}</span></div></div>`;
      }).join('')}</div>
  `;
}
function renderPanel(tab) {
  const panel = document.getElementById('panelScroll');
  state.activeTab = tab;
  if (tab === 'style') { panel.innerHTML = buildStylePanel(); bindStyleEvents(); }
  else { panel.innerHTML = buildTrackPanel(tab); bindTrackEvents(tab); }
}
function bindTrackEvents(trk) {
  const fi = document.getElementById(`file_${trk}`);
  if (fi) fi.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadTrackFile(trk, f).then(() => { document.getElementById(`fname_${trk}`).textContent = f.name; }); });
  ['intensity','count','size'].forEach(param => {
    const sl = document.getElementById(`${trk}_${param}`); if (!sl) return;
    sl.addEventListener('input', e => {
      const v = parseInt(e.target.value); state.tracks[trk][param] = v;
      const vEl = document.getElementById(`${trk}_${param}_v`); if (vEl) vEl.textContent = v;
      if (param === 'intensity' && state.tracks[trk].gain) state.tracks[trk].gain.gain.value = v / 100;
    });
  });
  const sg = document.getElementById(`shape_${trk}`);
  if (sg) sg.addEventListener('click', e => {
    const btn = e.target.closest('.shape-btn'); if (!btn) return;
    state.tracks[trk].shape = btn.dataset.shape;
    sg.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b === btn));
  });
}
function bindStyleEvents() {
  document.querySelectorAll('[data-colorstyle]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.colorStyle = btn.dataset.colorstyle;
      document.querySelectorAll('[data-colorstyle]').forEach(b => b.classList.toggle('active', b===btn));
      const cr = document.getElementById('customColorRow'); if (cr) cr.style.display = state.colorStyle === 'custom' ? 'flex' : 'none';
    });
  });
  TRACKS.forEach((trk,i) => { const ci = document.getElementById(`cc_${trk}`); if (ci) ci.addEventListener('input', e => { state.customColors[i] = e.target.value; }); });
  document.querySelectorAll('[data-gradstyle]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.gradStyle = btn.dataset.gradstyle;
      document.querySelectorAll('[data-gradstyle]').forEach(b => b.classList.toggle('active', b===btn));
    });
  });
  TRACKS.forEach(trk => {
    const sl = document.getElementById(`all_${trk}_intensity`);
    if (sl) sl.addEventListener('input', e => {
      const v = parseInt(e.target.value); state.tracks[trk].intensity = v;
      const vEl = document.getElementById(`all_${trk}_intensity_v`); if (vEl) vEl.textContent = v;
      if (state.tracks[trk].gain) state.tracks[trk].gain.gain.value = v / 100;
    });
  });
}
function updateTrackPanel(trk) { if (state.activeTab === trk) renderPanel(trk); if (state.activeTab === 'style') renderPanel('style'); }
// Tabs / Transport
document.querySelector('.tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn'); if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderPanel(btn.dataset.tab);
});
document.getElementById('btnPlay').addEventListener('click', () => { ensureCtx(); if (state.playing) stopAllTracks(true); else startAllTracks(); });
document.getElementById('btnStop').addEventListener('click', () => {
  if (state.mediaRecorder && state.mediaRecorder.state === 'recording') state.mediaRecorder.stop();
  clearTimeout(state._oneShotTimer); stopAllTracks(false); particles.length = 0;
});
document.getElementById('btnRec').addEventListener('click', () => {
  if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
    clearTimeout(state._oneShotTimer); state.mediaRecorder.stop(); stopAllTracks(false); particles.length = 0; updateRecUI(false);
  } else {
    const hasBuf = TRACKS.some(trk => state.tracks[trk].buf); if (!hasBuf) { alert('먼저 트랙에 MP3 파일을 로드해주세요.'); return; }
    startRecording();
  }
});
document.querySelectorAll('.flow-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.flow-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
    state.flowMode = btn.dataset.mode; particles.length = 0;
  });
});
document.getElementById('themeToggle').addEventListener('click', () => {
  const root = document.documentElement; const isDarkNow = isDark();
  root.dataset.theme = isDarkNow ? 'light' : 'dark';
  document.getElementById('themeToggle').textContent = isDarkNow ? '🌙 Dark' : '☀ Light';
});
renderPanel('vocal');
</script>
</body></html>
