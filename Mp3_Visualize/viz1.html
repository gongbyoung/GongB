<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>물 위 자막 비주얼라이저</title>
<style>
  :root { --bg:#03060f; --panel:#0c1220; --line:rgba(140,180,255,.18); --muted:#8ea0b8; --text:#e8f2ff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .app { height:100dvh; display:flex; flex-direction:column; padding:8px; gap:8px; }
  .stage {
    flex:1; min-height:0; position:relative; border-radius:12px; overflow:hidden;
    background:#02060e; border:1px solid var(--line);
  }
  canvas { display:block; width:100%; height:100%; }
  .meta {
    position:absolute; top:8px; left:10px; right:10px; display:flex; justify-content:space-between;
    font-size:12px; text-shadow:0 1px 6px #000; pointer-events:none; opacity:0;
  }
  .meta.show { opacity:1; }
  .panel {
    flex-shrink:0; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px; display:flex; flex-direction:column; gap:6px; max-height:46dvh;
  }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:nowrap; }
  .row.wrap { flex-wrap:wrap; }
  button, .file-btn {
    appearance:none; border:1px solid var(--line); background:#182236; color:#fff;
    border-radius:8px; padding:7px 10px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  button.primary { background:#2563eb; border-color:#2563eb; }
  button.srt { background:#0e7490; border-color:#0e7490; }
  button.rec { background:#c62828; border-color:#c62828; }
  button.ok { background:#2e7d32; border-color:#2e7d32; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.on { outline:1px solid #7eb8ff; }
  input[type=file] { display:none; }
  .file-btn { display:inline-flex; align-items:center; justify-content:center; flex:1; }
  .progress { height:6px; background:#1c283c; border-radius:99px; overflow:hidden; cursor:pointer; }
  .bar { height:100%; width:0; background:linear-gradient(90deg,#3d7fff,#00e5ff); }
  label.opt { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); min-width:0; flex:1; }
  label.opt span { width:52px; flex-shrink:0; }
  label.opt b { width:36px; text-align:right; color:#fff; font-weight:600; flex-shrink:0; }
  input[type=range] { flex:1; min-width:50px; accent-color:#3d7fff; }
  .status { font-size:11px; color:var(--muted); text-align:center; min-height:14px; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="meta" id="meta">
      <span id="trackName">파일 없음</span>
      <span id="timeDisplay">0:00 / 0:00</span>
    </div>
  </div>
  <div class="panel">
    <div class="row">
      <label class="file-btn"><input id="fileInput" type="file" accept="audio/*,.mp3" />MP3</label>
      <label class="file-btn srt" style="background:#0e7490"><input id="srtInput" type="file" accept=".srt,text/plain" />SRT</label>
      <label class="file-btn"><input id="fontInput" type="file" accept=".ttf,.otf,.woff,.woff2,font/*" />폰트</label>
      <button class="primary" id="playBtn" disabled><span id="playText">재생</span></button>
      <button class="rec" id="recordBtn" disabled><span id="recText">녹화</span></button>
      <button class="ok" id="downloadBtn" style="display:none">저장</button>
    </div>
    <div class="progress" id="progressWrap"><div class="bar" id="progressBar"></div></div>
    <div class="row wrap" id="styleGroup">
      <button type="button" class="on" data-style="bars">막대</button>
      <button type="button" data-style="circle">원형</button>
      <button type="button" data-style="wave">파형</button>
      <button type="button" data-style="particles">파티클</button>
      <button type="button" data-style="radial">방사</button>
      <button type="button" class="on" id="modeSink">물에 빠짐</button>
      <button type="button" id="modeScatter">물에 흩어짐</button>
    </div>
    <div class="row wrap">
      <label class="opt"><span>글자크기</span><input id="fontSize" type="range" min="12" max="72" value="28" /><b id="fontSizeVal">28</b></label>
      <label class="opt"><span>글자위치</span><input id="textY" type="range" min="10" max="90" value="72" /><b id="textYVal">72</b></label>
    </div>
    <div class="row wrap">
      <label class="opt"><span>비주얼크기</span><input id="vizScale" type="range" min="20" max="160" value="100" /><b id="vizScaleVal">100</b></label>
      <label class="opt"><span>비주얼위치</span><input id="vizY" type="range" min="0" max="80" value="0" /><b id="vizYVal">0</b></label>
      <label class="opt"><span>반응</span><input id="react" type="range" min="20" max="300" value="100" /><b id="reactVal">100</b></label>
    </div>
    <div class="status" id="status">MP3, SRT, 폰트를 고르세요. 조절은 바로 반영됩니다.</div>
  </div>
</div>
<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const stage = document.getElementById('stage');
  const fileInput = document.getElementById('fileInput');
  const srtInput = document.getElementById('srtInput');
  const fontInput = document.getElementById('fontInput');
  const playBtn = document.getElementById('playBtn');
  const playText = document.getElementById('playText');
  const recordBtn = document.getElementById('recordBtn');
  const recText = document.getElementById('recText');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusEl = document.getElementById('status');
  const trackName = document.getElementById('trackName');
  const timeDisplay = document.getElementById('timeDisplay');
  const meta = document.getElementById('meta');
  const progressBar = document.getElementById('progressBar');
  const progressWrap = document.getElementById('progressWrap');
  const styleGroup = document.getElementById('styleGroup');
  const ui = { fontSize:28, textY:0.72, vizScale:1, vizY:0, react:1, exitMode:'sink', fontFamily:'"Apple SD Gothic Neo","Malgun Gothic",sans-serif' };
  let audioCtx, analyser, sourceNode, audioEl, dataArray;
  let isPlaying = false, animId = null, currentStyle = 'bars';
  let mediaRecorder, recordedChunks = [], isRecording = false, recordedBlob = null;
  let particles = [], hue = 0, cues = [], activeCue = null, textParticles = [];
  let writeProgress = 0, writeStartTime = 0, dissolveStart = 0, isDissolving = false, lastCueText = '', ripples = [];
  function bindRange(id, valId, apply) {
    const el = document.getElementById(id), lab = document.getElementById(valId);
    const sync = () => { lab.textContent = el.value; apply(+el.value); };
    el.addEventListener('input', sync); sync();
  }
  bindRange('fontSize','fontSizeVal', (v) => { ui.fontSize = v; });
  bindRange('textY','textYVal', (v) => { ui.textY = v / 100; });
  bindRange('vizScale','vizScaleVal', (v) => { ui.vizScale = v / 100; });
  bindRange('vizY','vizYVal', (v) => { ui.vizY = v / 100; });
  bindRange('react','reactVal', (v) => { ui.react = v / 100; });
  document.getElementById('modeSink').onclick = () => setMode('sink');
  document.getElementById('modeScatter').onclick = () => setMode('scatter');
  function setMode(m) {
    ui.exitMode = m;
    document.getElementById('modeSink').classList.toggle('on', m === 'sink');
    document.getElementById('modeScatter').classList.toggle('on', m === 'scatter');
  }
  styleGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-style]');
    if (!btn) return;
    styleGroup.querySelectorAll('[data-style]').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    currentStyle = btn.dataset.style;
    if (currentStyle === 'particles') initParticles();
  });
  function amp(v) { return Math.min(1, (v / 255) * ui.react); }
  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!isPlaying) drawIdle(r.width, r.height);
  }
  addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(resize, 60); });
  resize(); setTimeout(resize, 200);
  function drawIdle(w, h) {
    ctx.fillStyle = '#04101c'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(190,220,255,.45)';
    ctx.font = '600 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('음악과 자막이 여기에 나옵니다', w / 2, h / 2);
  }
  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }
  function setupAnalyser() {
    ensureCtx();
    if (!analyser) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.78;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
  }
  function toSec(h, m, s, ms) {
    const frac = ms < 10 ? ms / 10 : ms < 100 ? ms / 100 : ms / 1000;
    return h * 3600 + m * 60 + s + frac;
  }
  function parseSRT(text) {
    const out = [];
    text = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for (const block of text.trim().split(/\n\s*\n/)) {
      const lines = block.trim().split('\n');
      if (lines.length < 2) continue;
      let timeLine = lines[0], start = 1;
      if (/^\d+$/.test(lines[0].trim()) && lines.length >= 3) { timeLine = lines[1]; start = 2; }
      const m = timeLine.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/);
      if (!m) continue;
      const txt = lines.slice(start).join('\n').replace(/<[^>]+>/g, '').trim();
      if (txt) out.push({ start: toSec(+m[1],+m[2],+m[3],+m[4]), end: toSec(+m[5],+m[6],+m[7],+m[8]), text: txt });
    }
    return out;
  }
  fontInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const face = new FontFace('UserLyric', await file.arrayBuffer());
      await face.load(); document.fonts.add(face);
      ui.fontFamily = '"UserLyric", sans-serif';
      statusEl.textContent = '폰트 적용: ' + file.name;
    } catch (err) { statusEl.textContent = '폰트를 읽지 못했습니다. ttf, otf, woff를 사용해 주세요.'; }
  });
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    stopAll();
    if (sourceNode) { try { sourceNode.disconnect(); } catch (_) {} sourceNode = null; }
    trackName.textContent = file.name.replace(/\.[^/.]+$/, '');
    meta.classList.add('show');
    statusEl.textContent = 'MP3 로딩 중';
    downloadBtn.style.display = 'none'; recordedBlob = null;
    try {
      setupAnalyser();
      if (audioEl) { audioEl.pause(); URL.revokeObjectURL(audioEl.src); }
      audioEl = new Audio();
      audioEl.src = URL.createObjectURL(file);
      audioEl.crossOrigin = 'anonymous';
      sourceNode = audioCtx.createMediaElementSource(audioEl);
      sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
      await new Promise((res) => { audioEl.onloadedmetadata = res; setTimeout(res, 2500); });
      playBtn.disabled = false; recordBtn.disabled = false;
      statusEl.textContent = cues.length ? ('준비 · 자막 ' + cues.length) : '준비 완료';
      updateTime(); resize(); bindAudio();
    } catch (err) { statusEl.textContent = 'MP3 로드 실패'; }
  });
  srtInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      cues = parseSRT(await file.text());
      activeCue = null; textParticles = []; isDissolving = false; writeProgress = 0;
      statusEl.textContent = cues.length ? ('자막 ' + cues.length + '개') : '자막을 찾지 못했습니다';
    } catch (err) { statusEl.textContent = 'SRT 읽기 실패'; }
  });
  playBtn.onclick = async () => {
    if (!audioEl) return;
    try {
      ensureCtx();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (isPlaying) {
        audioEl.pause(); isPlaying = false; cancelAnimationFrame(animId);
        const r = stage.getBoundingClientRect(); drawIdle(r.width, r.height);
      } else { await audioEl.play(); isPlaying = true; drawLoop(); }
      playText.textContent = isPlaying ? '일시정지' : '재생';
    } catch (err) { statusEl.textContent = '재생 실패. 다시 눌러 주세요.'; }
  };
  function stopAll() {
    if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
    isPlaying = false; cancelAnimationFrame(animId); playText.textContent = '재생';
    if (isRecording) stopRecording();
    activeCue = null; textParticles = []; isDissolving = false;
  }
  function fmt(s) { if (!isFinite(s)) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
  function updateTime() {
    if (!audioEl) return;
    timeDisplay.textContent = fmt(audioEl.currentTime)+' / '+fmt(audioEl.duration||0);
    progressBar.style.width = ((audioEl.duration ? audioEl.currentTime/audioEl.duration : 0)*100)+'%';
  }
  progressWrap.onclick = (e) => {
    if (!audioEl || !audioEl.duration) return;
    const r = progressWrap.getBoundingClientRect();
    audioEl.currentTime = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)) * audioEl.duration;
    activeCue = null; textParticles = []; isDissolving = false;
  };
  function bindAudio() {
    audioEl.ontimeupdate = updateTime;
    audioEl.onended = () => {
      isPlaying = false; playText.textContent = '재생'; cancelAnimationFrame(animId);
      if (isRecording) stopRecording();
      const r = stage.getBoundingClientRect(); drawIdle(r.width, r.height);
    };
  }
  function initParticles() {
    const r = stage.getBoundingClientRect(); particles = [];
    for (let i = 0; i < 48; i++) particles.push({ x:Math.random()*r.width, y:Math.random()*r.height*0.5, vx:(Math.random()-0.5)*1.2, vy:(Math.random()-0.5)*1.2, rad:1+Math.random()*2 });
  }
  function addRipple(x, y, f) { ripples.push({ x, y, r:2, max:24+f*36, a:0.45, life:1 }); }
  function drawRipples() {
    for (let i = ripples.length-1; i >= 0; i--) {
      const p = ripples[i]; p.r += 1.6; p.life -= 0.02;
      if (p.life <= 0) { ripples.splice(i,1); continue; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(140,210,255,'+(p.a*p.life)+')'; ctx.lineWidth = 1.4; ctx.stroke();
    }
  }
  function fontPx(w) { return Math.max(12, ui.fontSize * Math.min(1.15, w/420)); }
  function setFont(px) { ctx.font = '600 '+px+'px '+ui.fontFamily; }
  function updateSubtitle(t) {
    let found = null;
    for (const c of cues) if (t >= c.start && t < c.end) { found = c; break; }
    if (found) {
      if (!activeCue || activeCue.text !== found.text) {
        if (activeCue && !isDissolving) beginExit();
        activeCue = found; writeProgress = 0; writeStartTime = performance.now(); isDissolving = false; lastCueText = found.text;
      }
    } else if (activeCue && !isDissolving) { beginExit(); activeCue = null; }
  }
  function beginExit() {
    if (!lastCueText || isDissolving) return;
    isDissolving = true; dissolveStart = performance.now(); textParticles = [];
    const r = stage.getBoundingClientRect(), w = r.width, h = r.height, px = fontPx(w);
    setFont(px);
    const lines = lastCueText.split('\n'), lineH = px*1.25, y0 = h*ui.textY-((lines.length-1)*lineH)/2;
    lines.forEach((line, li) => {
      let x = (w - ctx.measureText(line).width)/2, y = y0+li*lineH;
      for (const ch of line) {
        const cw = ctx.measureText(ch).width;
        if (ch !== ' ') {
          const n = ui.exitMode === 'scatter' ? 5 : 1;
          for (let k = 0; k < n; k++) {
            const sink = ui.exitMode === 'sink';
            textParticles.push({
              ch: k === 0 ? ch : '', x: x+cw/2+(Math.random()-0.5)*(sink?2:8), y,
              vx: sink ? (Math.random()-0.5)*0.35 : (Math.random()-0.5)*3.2,
              vy: sink ? 0.4+Math.random()*0.8 : -1.2-Math.random()*1.6,
              rot:0, vr: sink ? 0.01 : (Math.random()-0.5)*0.2, life:1, size:px*(k===0?1:0.45), delay:Math.random()*0.15
            });
          }
          addRipple(x+cw/2, y+px*0.4, ui.exitMode==='sink'?0.7:0.35);
        }
        x += cw;
      }
    });
  }
  function drawText(w, h, now) {
    if (activeCue && !isDissolving) {
      const dur = Math.min(1.2, 0.3+activeCue.text.length*0.035);
      writeProgress = Math.min(1, (now-writeStartTime)/1000/dur);
      const lines = activeCue.text.split('\n'), px = fontPx(w);
      setFont(px); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const lineH = px*1.25, y0 = h*ui.textY-((lines.length-1)*lineH)/2;
      const total = activeCue.text.replace(/\n/g,'').length || 1;
      let idx = 0; const wave = now*0.002;
      lines.forEach((line, li) => {
        let x = (w-ctx.measureText(line).width)/2, baseY = y0+li*lineH;
        for (const ch of line) {
          const cw = ctx.measureText(ch).width, reveal = idx/total; idx++;
          if (writeProgress < reveal) { x += cw; continue; }
          const local = Math.min(1, (writeProgress-reveal)/0.12);
          ctx.save();
          ctx.translate(x+cw/2+Math.sin(wave+x*0.03)*2*(1-local*0.5), baseY+Math.cos(wave*1.2+x*0.02)*1.5);
          ctx.globalAlpha = 0.4+local*0.6; ctx.shadowColor = 'rgba(120,200,255,.6)'; ctx.shadowBlur = 12; ctx.fillStyle = '#fff';
          ctx.fillText(ch, -cw/2, 0); ctx.restore(); x += cw;
        }
      });
    }
    if (!isDissolving) return;
    const elapsed = (now-dissolveStart)/1000, sink = ui.exitMode === 'sink';
    for (let i = textParticles.length-1; i >= 0; i--) {
      const p = textParticles[i];
      if (elapsed < p.delay) continue;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= sink ? 0.008 : 0.014;
      if (sink) { p.vy += 0.035; p.vx *= 0.995; } else { p.vy += 0.02; p.vx *= 0.985; }
      if (p.life <= 0 || p.y > h+40) { textParticles.splice(i,1); continue; }
      if (!p.ch) { ctx.beginPath(); ctx.arc(p.x,p.y,1.6,0,6.28); ctx.fillStyle = 'rgba(160,210,255,'+p.life+')'; ctx.fill(); continue; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0,p.life);
      setFont(p.size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = sink ? 'rgba(180,220,255,.95)' : '#e8f6ff'; ctx.fillText(p.ch,0,0); ctx.restore();
    }
    if (!textParticles.length) { isDissolving = false; lastCueText = ''; }
  }
  function vizOrigin(h) { return h * ui.vizY; }
  function drawBars(w, h) {
    const count = 40, step = Math.max(1, Math.floor(dataArray.length/count)), slot = w/count, bw = slot*0.62, base = h-4;
    for (let i = 0; i < count; i++) {
      const v = amp(dataArray[i*step]), bh = Math.max(2, v*h*0.72*ui.vizScale), x = i*slot+(slot-bw)/2;
      ctx.fillStyle = 'hsla('+((hue+i*6+190)%360)+',75%,58%,.9)';
      ctx.fillRect(x, base-vizOrigin(h)*0.15-bh, bw, bh);
    }
  }
  function drawCircle(w, h) {
    const cx = w/2, cy = h*(0.28+ui.vizY*0.45), base = Math.min(w,h)*0.1*ui.vizScale, n = 64, step = Math.max(1, Math.floor(dataArray.length/n));
    for (let i = 0; i < n; i++) {
      const v = amp(dataArray[i*step]), a = (i/n)*Math.PI*2-Math.PI/2, len = v*Math.min(w,h)*0.28*ui.vizScale;
      ctx.strokeStyle = 'hsla('+((hue+i*5+190)%360)+',80%,62%,'+(0.35+v*0.6)+')'; ctx.lineWidth = 2+v*3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*base, cy+Math.sin(a)*base); ctx.lineTo(cx+Math.cos(a)*(base+len), cy+Math.sin(a)*(base+len)); ctx.stroke();
    }
  }
  function drawWave(w, h) {
    const mid = h*(0.32+ui.vizY*0.35), n = 72, step = Math.max(1, Math.floor(dataArray.length/n));
    ctx.beginPath(); ctx.moveTo(0, mid);
    for (let i = 0; i < n; i++) ctx.lineTo((i/(n-1))*w, mid-amp(dataArray[i*step])*h*0.32*ui.vizScale);
    ctx.lineTo(w, mid); ctx.closePath(); ctx.fillStyle = 'hsla('+((hue+200)%360)+',70%,55%,.55)'; ctx.fill();
  }
  function drawParts(w, h) {
    if (!particles.length) initParticles();
    let bass = 0; for (let i = 0; i < 6; i++) bass += dataArray[i]; bass = amp(bass/6);
    const limit = h*(0.45+ui.vizY*0.4);
    for (const p of particles) {
      p.x += p.vx*(1+bass*ui.vizScale); p.y += p.vy*(1+bass);
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < vizOrigin(h) || p.y > limit) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.rad*(1+bass*2)*Math.max(0.6, ui.vizScale), 0, 6.28);
      ctx.fillStyle = 'hsla('+((hue+200)%360)+',75%,62%,.55)'; ctx.fill();
    }
  }
  function drawRadial(w, h) {
    const cx = w/2, cy = h*(0.3+ui.vizY*0.4), maxR = Math.min(w,h)*0.26*ui.vizScale;
    for (let ring = 0; ring < 3; ring++) {
      const base = ((ring+1)/3)*maxR*0.55;
      for (let i = 0; i < 32; i++) {
        const v = amp(dataArray[Math.floor((i/32)*dataArray.length*0.7)]), a = (i/32)*Math.PI*2+ring*0.2;
        ctx.strokeStyle = 'hsla('+((hue+180+ring*25)%360)+',75%,58%,'+(0.3+v*0.6)+')'; ctx.lineWidth = 1.5+v*2.5;
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*base, cy+Math.sin(a)*base);
        ctx.lineTo(cx+Math.cos(a)*(base+v*maxR*0.4), cy+Math.sin(a)*(base+v*maxR*0.4)); ctx.stroke();
      }
    }
  }
  function drawLoop() {
    if (!isPlaying) return;
    animId = requestAnimationFrame(drawLoop);
    const r = stage.getBoundingClientRect(), w = r.width, h = r.height;
    if (w < 2 || h < 2) return;
    if (analyser) analyser.getByteFrequencyData(dataArray);
    ctx.fillStyle = '#030a14'; ctx.fillRect(0,0,w,h); hue = (hue+0.4)%360;
    if (currentStyle === 'circle') drawCircle(w,h);
    else if (currentStyle === 'wave') drawWave(w,h);
    else if (currentStyle === 'particles') drawParts(w,h);
    else if (currentStyle === 'radial') drawRadial(w,h);
    else drawBars(w,h);
    if (audioEl) updateSubtitle(audioEl.currentTime);
    drawRipples(); drawText(w, h, performance.now());
  }
  recordBtn.onclick = () => { if (isRecording) stopRecording(); else startRec(); };
  async function startRec() {
    if (!audioEl) return;
    if (!isPlaying) { ensureCtx(); await audioCtx.resume(); await audioEl.play(); isPlaying = true; playText.textContent = '일시정지'; drawLoop(); }
    recordedChunks = []; recordedBlob = null; downloadBtn.style.display = 'none';
    const vs = canvas.captureStream(30); let stream = vs;
    try { if (audioEl.captureStream) { const as = audioEl.captureStream(); stream = new MediaStream([...vs.getVideoTracks(), ...as.getAudioTracks()]); } } catch (e) {}
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    try { mediaRecorder = new MediaRecorder(stream, { mimeType: mime }); } catch (e) { mediaRecorder = new MediaRecorder(stream); }
    mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) recordedChunks.push(ev.data); };
    mediaRecorder.onstop = () => { recordedBlob = new Blob(recordedChunks, { type:'video/webm' }); downloadBtn.style.display = 'inline-flex'; isRecording = false; recText.textContent = '녹화'; statusEl.textContent = '녹화 완료'; };
    mediaRecorder.start(200); isRecording = true; recText.textContent = '중지'; statusEl.textContent = '녹화 중';
  }
  function stopRecording() { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }
  downloadBtn.onclick = () => {
    if (!recordedBlob) return;
    const url = URL.createObjectURL(recordedBlob), a = document.createElement('a');
    a.href = url; a.download = (trackName.textContent || 'lyric') + '.webm';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };
})();
</script>
</body>
