<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무한만다라 메이커 스튜디오</title>
<style>
  :root {
    --bg-dark: #09090e;
    --panel-bg: #14141c;
    --border: #262636;
    --accent: #7c5cff;
    --accent-hover: #967aff;
    --danger: #ff4757;
    --text: #e8e8f0;
    --text-sub: #9090a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .stage-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at center, #181826 0%, #050508 100%);
    position: relative;
  }
  .canvas-wrapper {
    position: relative;
    width: calc(100vh * 16 / 9 - 80px);
    max-height: calc(100vh - 80px);
    aspect-ratio: 16 / 9;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    overflow: hidden;
    background: #000;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .rec-badge {
    position: absolute; top: 16px; left: 16px;
    background: rgba(255, 71, 87, 0.9); color: #fff;
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
    display: none; align-items: center; gap: 6px; z-index: 10;
  }
  .rec-badge.active { display: flex; }
  .rec-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  .stage-info {
    margin-top: 10px; font-size: 12px; color: var(--text-sub); display: flex; gap: 16px; align-items: center;
  }

  .sidebar {
    width: 440px; background: var(--panel-bg); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  .sidebar-header {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-header h1 { font-size: 17px; font-weight: 700; }
  .badge-ratio {
    background: rgba(124, 92, 255, 0.18); color: #b4a0ff;
    border: 1px solid rgba(124, 92, 255, 0.4); padding: 3px 8px; border-radius: 6px; font-size: 11px;
  }

  .controls-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  .controls-scroll::-webkit-scrollbar { width: 6px; }
  .controls-scroll::-webkit-scrollbar-thumb { background: #333344; border-radius: 3px; }

  .section { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-sub);
    margin-bottom: 12px; letter-spacing: 0.6px; display: flex; justify-content: space-between; align-items: center;
  }

  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .row label { font-size: 13px; color: var(--text); flex: 0 0 135px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 5px; }
  .val-box { width: 42px; text-align: right; font-size: 12px; color: var(--text-sub); }

  select, input[type="number"] {
    background: #1f1f2b; color: var(--text); border: 1px solid #36364a;
    padding: 7px 10px; border-radius: 6px; font-size: 13px; flex: 1; outline: none;
  }
  select:focus, input[type="number"]:focus { border-color: var(--accent); }

  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .theme-btn {
    background: #1f1f2b; border: 1px solid #323246; color: var(--text-sub);
    padding: 8px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-align: center;
    transition: 0.15s;
  }
  .theme-btn.active { background: rgba(124, 92, 255, 0.25); border-color: var(--accent); color: #fff; }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1; background: #222230; color: #fff; border: 1px solid #38384d;
    padding: 9px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: #2e2e42; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); }

  .meter-bar { display: flex; gap: 6px; margin-top: 10px; height: 8px; }
  .meter-col { flex: 1; background: #1a1a24; border-radius: 4px; overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7c5cff, #00d2d3); transition: width 0.05s linear; }
  .audio-status { font-size: 11.5px; color: var(--text-sub); margin-top: 6px; line-height: 1.4; }
  .folder-hint { background: rgba(0, 210, 211, 0.08); border: 1px solid rgba(0, 210, 211, 0.25); color: #9be8e8; padding: 8px 10px; border-radius: 6px; font-size: 11.5px; margin-bottom: 12px; }
</style>
</head>
<body>

  <div class="stage-container">
    <div class="canvas-wrapper">
      <div class="rec-badge" id="recBadge">
        <div class="rec-dot"></div>
        <span id="recTime">REC 00:00</span>
      </div>
      <canvas id="mandalaCanvas" width="1920" height="1080"></canvas>
    </div>
    <div class="stage-info">
      <span>테마 모드: <b id="currentThemeName" style="color:#b4a0ff;">우주속 (Cosmic)</b></span>
      <span>|</span>
      <span id="fpsCounter">60 FPS</span>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>무한만다라 스튜디오</h1>
      <span class="badge-ratio">만다라 메이커 v4.0</span>
    </div>

    <div class="controls-scroll">

      <!-- 1. 주제별 테마 선택 -->
      <div class="section">
        <div class="section-title"><span>주제별 테마 (Theme Mode)</span></div>
        <div class="theme-grid">
          <button class="theme-btn active" data-theme="COSMIC">🌌 우주속</button>
          <button class="theme-btn" data-theme="FLOWER">🌸 꽃잎속</button>
          <button class="theme-btn" data-theme="LEAF">🍃 잎사귀</button>
          <button class="theme-btn" data-theme="WATER">💧 물속</button>
          <button class="theme-btn" data-theme="VOLCANO">🌋 화산속</button>
          <button class="theme-btn" data-theme="CLOUD">☁️ 구름속</button>
        </div>
      </div>

      <!-- 2. 이미지 매핑 (만다라 조각 패턴 소스) -->
      <div class="section">
        <div class="section-title"><span>만다라 패턴 이미지 업로드</span></div>
        <div class="btn-group">
          <label class="btn primary" style="cursor:pointer;">
            🖼️ 이미지 불러오기
            <input type="file" id="patternImageInput" accept="image/*" multiple style="display:none;">
          </label>
          <button class="btn" id="btnClearImages">초기화</button>
        </div>
        <div class="audio-status" id="imgStatus">업로드된 이미지: 0장 (만다라 조각 대칭 반복)</div>
      </div>

      <!-- 3. 만다라 분할 배율 및 무한 생성/소멸 제어 -->
      <div class="section">
        <div class="section-title">만다라 대칭 분할 & 무한 생성/소멸</div>
        <div class="row">
          <label>대칭 분할 수 (Symmetry)</label>
          <input type="range" id="rngSymmetry" min="4" max="32" step="2" value="12">
          <span class="val-box" id="valSymmetry">12분할</span>
        </div>
        <div class="row">
          <label>무한 고리 층수 (Rings)</label>
          <input type="range" id="rngRings" min="4" max="24" step="1" value="12">
          <span class="val-box" id="valRings">12층</span>
        </div>
        <div class="row">
          <label>생성/소멸 속도 (Speed)</label>
          <input type="range" id="rngSpeed" min="0.2" max="3.0" step="0.1" value="1.0">
          <span class="val-box" id="valSpeed">1.0</span>
        </div>
        <div class="row">
          <label>회전 속도 (Spin)</label>
          <input type="range" id="rngSpin" min="-2.0" max="2.0" step="0.05" value="0.4">
          <span class="val-box" id="valSpin">0.4</span>
        </div>
      </div>

      <!-- 4. 오디오 & 주파수 연동 -->
      <div class="section">
        <div class="section-title">
          <span>오디오 주파수 연동 비트</span>
          <span id="audioModeLabel" style="color:#a288ff;">호흡 곡선</span>
        </div>
        <div class="btn-group">
          <label class="btn primary" style="cursor:pointer;">
            🎵 MP3 음악 파일
            <input type="file" id="audioInput" accept="audio/*" style="display:none;">
          </label>
          <button class="btn" id="btnBreath">🌬️ 호흡</button>
        </div>
        <audio id="audioPlayer" controls style="width:100%; height:34px; margin-top:10px; display:none; background:#222; border-radius:6px;"></audio>
        <div class="meter-bar">
          <div class="meter-col"><div class="meter-fill" id="meterBass"></div></div>
          <div class="meter-col"><div class="meter-fill" id="meterMid"></div></div>
          <div class="meter-col"><div class="meter-fill" id="meterHigh"></div></div>
        </div>
      </div>

      <!-- 5. 영상 녹화 -->
      <div class="section">
        <div class="section-title"><span>고화질 1920x1080 녹화</span></div>
        <div class="btn-group">
          <button class="btn primary" id="btnRecord">⏺ 영상 녹화 시작</button>
          <button class="btn" id="btnSnapshot">📸 스냅샷</button>
        </div>
      </div>

    </div>
  </aside>

<script>
window.TAU = Math.PI * 2;

// 주제별 테마 정의
const THEMES = {
  COSMIC: { name: "우주속", bg: [0.03, 0.02, 0.07, 1], pColor: "rgba(120,200,255,0.7)" },
  FLOWER: { name: "꽃잎속", bg: [0.06, 0.04, 0.06, 1], pColor: "rgba(255,150,180,0.7)" },
  LEAF: { name: "잎사귀", bg: [0.02, 0.06, 0.04, 1], pColor: "rgba(100,220,130,0.7)" },
  WATER: { name: "물속", bg: [0.02, 0.04, 0.08, 1], pColor: "rgba(80,180,255,0.7)" },
  VOLCANO: { name: "화산속", bg: [0.08, 0.02, 0.02, 1], pColor: "rgba(255,100,50,0.7)" },
  CLOUD: { name: "구름속", bg: [0.05, 0.07, 0.10, 1], pColor: "rgba(200,220,255,0.7)" }
};

let currentThemeKey = "COSMIC";
let customImages = []; // 업로드된 이미지 보관 배열

const settings = {
  symmetry: 12,
  rings: 12,
  speed: 1.0,
  spin: 0.4,
};

// 배경 파티클
const particles = [];
for (let i = 0; i < 70; i++) {
  particles.push({
    x: Math.random() * 1920, y: Math.random() * 1080,
    vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8,
    size: Math.random() * 3 + 1
  });
}

function toRgbaStr(c, alpha = 1.0) {
  const r = Math.round(Math.max(0, Math.min(1, c[0])) * 255);
  const g = Math.round(Math.max(0, Math.min(1, c[1])) * 255);
  const b = Math.round(Math.max(0, Math.min(1, c[2])) * 255);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
}

// 오디오 분석
let audioMode = "BREATH";
let audioCtx = null, analyser = null, freqData = null;
const audioPlayer = document.getElementById("audioPlayer");

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

document.getElementById("audioInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  ensureAudioContext();
  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.style.display = "block";
  audioPlayer.play();
  const src = audioCtx.createMediaElementSource(audioPlayer);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
  audioMode = "FILE";
  document.getElementById("audioModeLabel").textContent = "오디오: " + file.name.slice(0, 12);
});

document.getElementById("btnBreath").addEventListener("click", () => {
  audioPlayer.pause();
  audioPlayer.style.display = "none";
  audioMode = "BREATH";
  document.getElementById("audioModeLabel").textContent = "호흡 곡선";
});

function getAudioBands(timeSec) {
  if (audioMode === "FILE" && !audioPlayer.paused && analyser) {
    analyser.getByteFrequencyData(freqData);
    let sum = 0; for (let i = 0; i < 35; i++) sum += freqData[i];
    const b = (sum / 35) / 255;
    let sumMid = 0; for (let i = 35; i < 140; i++) sumMid += freqData[i];
    const m = (sumMid / 105) / 255;
    return { bass: b * 1.6, mid: m * 1.4, energy: (b + m) * 0.8 };
  }
  const f = timeSec * 24;
  const b = Math.max(0, Math.min(1, 0.35 + 0.25 * Math.sin(f * 0.17)));
  const m = Math.max(0, Math.min(1, 0.40 + 0.30 * Math.sin(f * 0.11)));
  return { bass: b, mid: m, energy: b * 0.5 + m * 0.5 };
}

// 이미지 업로드
document.getElementById("patternImageInput").addEventListener("change", (e) => {
  const files = e.target.files;
  if (!files.length) return;
  for (let file of files) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => customImages.push(img);
  }
  document.getElementById("imgStatus").textContent = `업로드된 이미지: ${files.length}장 로드 완료!`;
});
document.getElementById("btnClearImages").addEventListener("click", () => {
  customImages = [];
  document.getElementById("imgStatus").textContent = "업로드된 이미지: 0장";
});

document.querySelectorAll(".theme-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentThemeKey = btn.dataset.theme;
    document.getElementById("currentThemeName").textContent = THEMES[currentThemeKey].name + " (" + currentThemeKey + ")";
  });
});

// 슬라이더 바인딩
function bindRange(id, valId, key, suffix = "") {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  el.addEventListener("input", () => {
    settings[key] = parseFloat(el.value);
    valEl.textContent = el.value + suffix;
  });
}
bindRange("rngSymmetry", "valSymmetry", "symmetry", "분할");
bindRange("rngRings", "valRings", "rings", "층");
bindRange("rngSpeed", "valSpeed", "speed", "");
bindRange("rngSpin", "valSpin", "spin", "");

// 진정한 만다라 렌더링 엔진 (칼레이도스코프 부채꼴 조각 + 무한 생성/소멸)
const canvas = document.getElementById("mandalaCanvas");
const ctx = canvas.getContext("2d");
let lastTime = performance.now();

function render(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  const bands = getAudioBands(now / 1000);
  document.getElementById("meterBass").style.width = `${Math.round(bands.bass * 100)}%`;
  document.getElementById("meterMid").style.width = `${Math.round(bands.mid * 100)}%`;

  const theme = THEMES[currentThemeKey];
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  // 배경
  ctx.save();
  ctx.fillStyle = toRgbaStr(theme.bg, 1.0);
  ctx.fillRect(0, 0, W, H);

  // 파티클
  ctx.fillStyle = theme.pColor;
  for (let p of particles) {
    p.x += p.vx * (1 + bands.bass * 3);
    p.y += p.vy * (1 + bands.bass * 3);
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 + bands.bass * 0.8), 0, TAU);
    ctx.fill();
  }

  const rings = Math.round(settings.rings);
  const symmetry = Math.round(settings.symmetry);
  const maxRadius = H * 0.48;

  // 회전 각도
  const globalRot = now * 0.0002 * settings.spin;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(globalRot);

  // 무한 생성/소멸 흐름 시간값
  const timeFlow = (now * 0.0004 * settings.speed * (1 + bands.energy * 0.8)) % 1.0;

  // 각 고리(Ring)별로 무한 확장(BLOOM) 효과 적용
  for (let i = 0; i < rings; i++) {
    // 각 고리의 생명 주기 (0 ~ 1)
    const age = (i / rings + timeFlow) % 1.0;
    
    // 중앙에서 태어나 바깥으로 커지며 페이드아웃 되는 알파 및 스케일
    const radius = maxRadius * Math.pow(age, 1.1) * (1 + bands.bass * 0.1);
    const alpha = Math.sin(age * Math.PI) * (0.85 + bands.mid * 0.15); // 태어날 때 진해지고 사라질 때 투명해짐

    if (alpha <= 0.02 || radius < 5) continue;

    const sliceAngle = TAU / symmetry;

    // 대칭 분할(Symmetry) 수만큼 부채꼴 조각 반복 배치 (완벽한 만다라 원리)
    for (let s = 0; s < symmetry; s++) {
      ctx.save();
      ctx.rotate(sliceAngle * s);

      // 짝수/홀수 조각 좌우 반전(Mirror)을 주어야 진짜 만다라 패턴이 완성됨
      if (s % 2 === 1) {
        ctx.scale(1, -1);
      }

      ctx.save();
      // 부채꼴 클리핑 영역 지정 (업로드한 이미지나 도형이 조각 안쪽에만 갇혀 만다라를 형성)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, -sliceAngle * 0.5, sliceAngle * 0.5);
      ctx.closePath();
      ctx.clip();

      // 사용자가 업로드한 이미지가 있는 경우 조각 내부에 매핑
      if (customImages.length > 0) {
        const img = customImages[i % customImages.length];
        ctx.globalAlpha = alpha;
        
        // 이미지가 만다라 안에서 반복 배치되도록 스케일 조정
        ctx.save();
        ctx.scale(0.8 + age * 0.5, 0.8 + age * 0.5);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        ctx.restore();
      } else {
        // 이미지가 없을 때 기본적으로 그려지는 기하학적 만다라 꽃잎/패턴 조각
        ctx.globalAlpha = alpha;
        ctx.fillStyle = s % 2 === 0 ? "rgba(124, 92, 255, 0.7)" : "rgba(0, 210, 211, 0.7)";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(0, radius * 0.5, radius * 0.35, 0, TAU);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(sliceAngle * 0.5) * radius, Math.sin(sliceAngle * 0.5) * radius);
        ctx.stroke();
      }

      ctx.restore(); // 클리핑 복원
      ctx.restore(); // 대칭 회전 복원
    }
  }

  ctx.restore(); // 글로벌 회전 복원
  ctx.restore(); // 캔버스 저장 복원
  requestAnimationFrame(render);
}

// 녹화 및 스냅샷
let mediaRecorder = null, recordedChunks = [];
document.getElementById("btnRecord").addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
  const stream = canvas.captureStream(60);
  mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: 20_000_000 });
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `mandala_maker_${Date.now()}.webm`;
    a.click();
    document.getElementById("btnRecord").textContent = "⏺ 영상 녹화 시작";
  };
  mediaRecorder.start();
  document.getElementById("btnRecord").textContent = "⏹ 녹화 중지 및 저장";
});

document.getElementById("btnSnapshot").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = `mandala_snapshot_${Date.now()}.png`;
  a.click();
});

requestAnimationFrame(render);
</script>
</body>
</html>
