<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무한만다라 스튜디오 (테마별 주제 및 분할 확장 에디션)</title>
<style>
  :root {
    --bg-dark: #09090e;
    --panel-bg: #14141c;
    --border: #262636;
    --accent: #7c5cff;
    --accent-hover: #967aff;
    --danger: #ff4757;
    --text: #e8e8f0;
    --text-sub: #9090a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .stage-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at center, #181826 0%, #050508 100%);
    position: relative;
  }
  .canvas-wrapper {
    position: relative;
    width: calc(100vh * 16 / 9 - 80px);
    max-height: calc(100vh - 80px);
    aspect-ratio: 16 / 9;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    overflow: hidden;
    background: #000;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .rec-badge {
    position: absolute; top: 16px; left: 16px;
    background: rgba(255, 71, 87, 0.9); color: #fff;
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
    display: none; align-items: center; gap: 6px; z-index: 10;
  }
  .rec-badge.active { display: flex; }
  .rec-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  .stage-info {
    margin-top: 10px; font-size: 12px; color: var(--text-sub); display: flex; gap: 16px; align-items: center;
  }

  .sidebar {
    width: 440px; background: var(--panel-bg); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  .sidebar-header {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-header h1 { font-size: 17px; font-weight: 700; }
  .badge-ratio {
    background: rgba(124, 92, 255, 0.18); color: #b4a0ff;
    border: 1px solid rgba(124, 92, 255, 0.4); padding: 3px 8px; border-radius: 6px; font-size: 11px;
  }

  .controls-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  .controls-scroll::-webkit-scrollbar { width: 6px; }
  .controls-scroll::-webkit-scrollbar-thumb { background: #333344; border-radius: 3px; }

  .section { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-sub);
    margin-bottom: 12px; letter-spacing: 0.6px; display: flex; justify-content: space-between; align-items: center;
  }

  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .row label { font-size: 13px; color: var(--text); flex: 0 0 135px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 5px; }
  .val-box { width: 42px; text-align: right; font-size: 12px; color: var(--text-sub); }

  select, input[type="number"] {
    background: #1f1f2b; color: var(--text); border: 1px solid #36364a;
    padding: 7px 10px; border-radius: 6px; font-size: 13px; flex: 1; outline: none;
  }
  select:focus, input[type="number"]:focus { border-color: var(--accent); }

  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .theme-btn {
    background: #1f1f2b; border: 1px solid #323246; color: var(--text-sub);
    padding: 8px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-align: center;
    transition: 0.15s;
  }
  .theme-btn.active { background: rgba(124, 92, 255, 0.25); border-color: var(--accent); color: #fff; }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1; background: #222230; color: #fff; border: 1px solid #38384d;
    padding: 9px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: #2e2e42; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); }

  .meter-bar { display: flex; gap: 6px; margin-top: 10px; height: 8px; }
  .meter-col { flex: 1; background: #1a1a24; border-radius: 4px; overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7c5cff, #00d2d3); transition: width 0.05s linear; }
  .audio-status { font-size: 11.5px; color: var(--text-sub); margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>

  <div class="stage-container">
    <div class="canvas-wrapper">
      <div class="rec-badge" id="recBadge">
        <div class="rec-dot"></div>
        <span id="recTime">REC 00:00</span>
      </div>
      <canvas id="mandalaCanvas" width="1920" height="1080"></canvas>
    </div>
    <div class="stage-info">
      <span>테마 모드: <b id="currentThemeName" style="color:#b4a0ff;">우주 (Cosmic)</b></span>
      <span>|</span>
      <span id="fpsCounter">60 FPS</span>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>무한만다라 스튜디오</h1>
      <span class="badge-ratio">테마 & 분할 제어</span>
    </div>

    <div class="controls-scroll">

      <!-- 1. 주제별 테마 선택 -->
      <div class="section">
        <div class="section-title"><span>주제별 테마 (Theme Mode)</span></div>
        <div class="theme-grid">
          <button class="theme-btn active" data-theme="COSMIC">🌌 우주속</button>
          <button class="theme-btn" data-theme="FLOWER">🌸 꽃잎속</button>
          <button class="theme-btn" data-theme="LEAF">🍃 잎사귀</button>
          <button class="theme-btn" data-theme="WATER">💧 물속</button>
          <button class="theme-btn" data-theme="VOLCANO">🌋 화산속</button>
          <button class="theme-btn" data-theme="CLOUD">☁️ 구름속</button>
        </div>
      </div>

      <!-- 2. 이미지 매핑 (패턴 소스 업로드) -->
      <div class="section">
        <div class="section-title"><span>커스텀 패턴 이미지 매핑</span></div>
        <div class="btn-group">
          <label class="btn primary" style="cursor:pointer;">
            🖼️ 패턴 이미지 불러오기
            <input type="file" id="patternImageInput" accept="image/*" multiple style="display:none;">
          </label>
          <button class="btn" id="btnClearImages">초기화</button>
        </div>
        <div class="audio-status" id="imgStatus">업로드된 이미지: 0장 (만다라 타일에 자동 매핑)</div>
      </div>

      <!-- 3. 만다라 분할 배율 및 스타일 슬라이더 -->
      <div class="section">
        <div class="section-title">만다라 분할 배율 & 스타일 조정</div>
        <div class="row">
          <label>분할 확장 모드 (Division)</label>
          <input type="range" id="rngDivision" min="4" max="32" step="2" value="12">
          <span class="val-box" id="valDivision">12분할</span>
        </div>
        <div class="row">
          <label>만다라 스타일 강도</label>
          <input type="range" id="rngStyleMix" min="0.1" max="2.0" step="0.1" value="1.0">
          <span class="val-box" id="valStyleMix">1.0</span>
        </div>
        <div class="row">
          <label>고리 층수 (Rings)</label>
          <input type="range" id="rngRings" min="6" max="35" step="1" value="18">
          <span class="val-box" id="valRings">18</span>
        </div>
        <div class="row">
          <label>회전 속도 (Spin)</label>
          <input type="range" id="rngSpin" min="0.0" max="2.0" step="0.05" value="0.4">
          <span class="val-box" id="valSpin">0.4</span>
        </div>
      </div>

      <!-- 4. 오디오 & 주파수 연동 -->
      <div class="section">
        <div class="section-title">
          <span>오디오 주파수 연동 비트</span>
          <span id="audioModeLabel" style="color:#a288ff;">호흡 곡선</span>
        </div>
        <div class="btn-group">
          <label class="btn primary" style="cursor:pointer;">
            🎵 MP3 음악 파일
            <input type="file" id="audioInput" accept="audio/*" style="display:none;">
          </label>
          <button class="btn" id="btnBreath">🌬️ 호흡</button>
        </div>
        <audio id="audioPlayer" controls style="width:100%; height:34px; margin-top:10px; display:none; background:#222; border-radius:6px;"></audio>
        <div class="meter-bar">
          <div class="meter-col"><div class="meter-fill" id="meterBass"></div></div>
          <div class="meter-col"><div class="meter-fill" id="meterMid"></div></div>
          <div class="meter-col"><div class="meter-fill" id="meterHigh"></div></div>
        </div>
      </div>

      <!-- 5. 영상 녹화 -->
      <div class="section">
        <div class="section-title"><span>고화질 1920x1080 녹화</span></div>
        <div class="btn-group">
          <button class="btn primary" id="btnRecord">⏺ 영상 녹화 시작</button>
          <button class="btn" id="btnSnapshot">📸 스냅샷</button>
        </div>
      </div>

    </div>
  </aside>

<script>
window.TAU = Math.PI * 2;

// 테마별 팔레트 및 파티클 설정
const THEMES = {
  COSMIC: { name: "우주 (Cosmic)", bg: [0.03, 0.02, 0.07, 1], colors: [[0.55, 0.15, 1.00, 1], [0.00, 0.95, 1.00, 1], [1.00, 0.08, 0.58, 1], [0.95, 0.93, 0.20, 1]], particleType: "stars" },
  FLOWER: { name: "꽃잎 (Flower)", bg: [0.06, 0.04, 0.06, 1], colors: [[0.95, 0.45, 0.65, 1], [0.98, 0.78, 0.45, 1], [0.82, 0.25, 0.45, 1], [1.00, 0.95, 0.90, 1]], particleType: "petals" },
  LEAF: { name: "잎사귀 (Leaf)", bg: [0.02, 0.06, 0.04, 1], colors: [[0.18, 0.75, 0.42, 1], [0.45, 0.88, 0.35, 1], [0.12, 0.45, 0.28, 1], [0.85, 0.95, 0.55, 1]], particleType: "leaves" },
  WATER: { name: "물속 (Water)", bg: [0.02, 0.04, 0.08, 1], colors: [[0.10, 0.60, 0.95, 1], [0.20, 0.90, 0.85, 1], [0.05, 0.25, 0.65, 1], [0.80, 0.95, 1.00, 1]], particleType: "bubbles" },
  VOLCANO: { name: "화산속 (Volcano)", bg: [0.08, 0.02, 0.02, 1], colors: [[0.98, 0.32, 0.05, 1], [1.00, 0.75, 0.10, 1], [0.75, 0.08, 0.08, 1], [0.20, 0.20, 0.20, 1]], particleType: "embers" },
  CLOUD: { name: "구름속 (Cloud)", bg: [0.05, 0.07, 0.10, 1], colors: [[0.85, 0.90, 0.98, 1], [0.65, 0.75, 0.90, 1], [0.45, 0.58, 0.78, 1], [1.00, 1.00, 1.00, 1]], particleType: "clouds" }
};

let currentThemeKey = "COSMIC";
let customImages = []; // 사용자가 업로드한 이미지 배열

const settings = {
  division: 12,
  styleMix: 1.0,
  rings: 18,
  spin: 0.4,
  fillAlpha: 0.65,
};

// 배경 파티클 생성
const particles = [];
for (let i = 0; i < 70; i++) {
  particles.push({
    x: Math.random() * 1920,
    y: Math.random() * 1080,
    vx: (Math.random() - 0.5) * 0.8,
    vy: (Math.random() - 0.5) * 0.8,
    size: Math.random() * 4 + 1,
    alpha: Math.random() * 0.7 + 0.2
  });
}

function lerpColor(colors, t) {
  const n = colors.length;
  const x = (((t % 1.0) + 1.0) % 1.0) * n;
  const i = Math.floor(x) % n;
  const f = x - Math.floor(x);
  const a = colors[i], b = colors[(i + 1) % n];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, 1];
}
function toRgbaStr(c, alpha = 1.0) {
  const r = Math.round(Math.max(0, Math.min(1, c[0])) * 255);
  const g = Math.round(Math.max(0, Math.min(1, c[1])) * 255);
  const b = Math.round(Math.max(0, Math.min(1, c[2])) * 255);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
}

// 오디오 분석
let audioMode = "BREATH";
let audioCtx = null, analyser = null, freqData = null, audioDestNode = null;
const audioPlayer = document.getElementById("audioPlayer");

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    audioDestNode = audioCtx.createMediaStreamDestination();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

document.getElementById("audioInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  ensureAudioContext();
  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.style.display = "block";
  audioPlayer.play();
  const src = audioCtx.createMediaElementSource(audioPlayer);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
  audioMode = "FILE";
  document.getElementById("audioModeLabel").textContent = "오디오: " + file.name.slice(0, 12);
});

document.getElementById("btnBreath").addEventListener("click", () => {
  audioPlayer.pause();
  audioPlayer.style.display = "none";
  audioMode = "BREATH";
  document.getElementById("audioModeLabel").textContent = "호흡 곡선";
});

function getAudioBands(timeSec) {
  if (audioMode === "FILE" && !audioPlayer.paused && analyser) {
    analyser.getByteFrequencyData(freqData);
    let sum = 0;
    for (let i = 0; i < 30; i++) sum += freqData[i];
    const b = (sum / 30) / 255;
    let sumMid = 0;
    for (let i = 30; i < 150; i++) sumMid += freqData[i];
    const m = (sumMid / 120) / 255;
    return { bass: b * 1.4, mid: m * 1.2, high: 0.5, energy: (b + m) * 0.7 };
  }
  const f = timeSec * 24;
  const b = Math.max(0, Math.min(1, 0.35 + 0.25 * Math.sin(f * 0.17)));
  const m = Math.max(0, Math.min(1, 0.40 + 0.30 * Math.sin(f * 0.11)));
  return { bass: b, mid: m, high: 0.4, energy: b * 0.5 + m * 0.5 };
}

// 이미지 업로드 핸들러
document.getElementById("patternImageInput").addEventListener("change", (e) => {
  const files = e.target.files;
  if (!files.length) return;
  for (let file of files) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => customImages.push(img);
  }
  document.getElementById("imgStatus").textContent = `업로드된 이미지: ${files.length}장 로드 완료!`;
});
document.getElementById("btnClearImages").addEventListener("click", () => {
  customImages = [];
  document.getElementById("imgStatus").textContent = "업로드된 이미지: 0장";
});

// 테마 버튼 이벤트
document.querySelectorAll(".theme-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentThemeKey = btn.dataset.theme;
    document.getElementById("currentThemeName").textContent = THEMES[currentThemeKey].name;
  });
});

// 슬라이더 바인딩
function bindRange(id, valId, key, suffix = "") {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  el.addEventListener("input", () => {
    settings[key] = parseFloat(el.value);
    valEl.textContent = el.value + suffix;
  });
}
bindRange("rngDivision", "valDivision", "division", "분할");
bindRange("rngStyleMix", "valStyleMix", "styleMix", "");
bindRange("rngRings", "valRings", "rings", "");
bindRange("rngSpin", "valSpin", "spin", "");

// 캔버스 렌더링 엔진
const canvas = document.getElementById("mandalaCanvas");
const ctx = canvas.getContext("2d");
let lastTime = performance.now();

function render(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  const bands = getAudioBands(now / 1000);
  document.getElementById("meterBass").style.width = `${Math.round(bands.bass * 100)}%`;
  document.getElementById("meterMid").style.width = `${Math.round(bands.mid * 100)}%`;
  document.getElementById("meterHigh").style.width = `${Math.round(bands.high * 100)}%`;

  const theme = THEMES[currentThemeKey];
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  // 배경 채우기
  ctx.save();
  ctx.fillStyle = toRgbaStr(theme.bg, 1.0);
  ctx.fillRect(0, 0, W, H);

  // 주제별 배경 파티클 애니메이션
  ctx.fillStyle = toRgbaStr(theme.colors[0], 0.6);
  for (let p of particles) {
    p.x += p.vx * (1 + bands.bass * 2);
    p.y += p.vy * (1 + bands.bass * 2);
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 + bands.bass * 0.5), 0, TAU);
    ctx.fill();
  }

  // 만다라 그리기 (분할 모드 & 층수 반영)
  const rings = settings.rings;
  const division = Math.round(settings.division);
  const baseRadius = H * 0.44;

  for (let i = 0; i < rings; i++) {
    const ringRatio = (i + 1) / rings;
    const r = baseRadius * ringRatio * (0.8 + bands.bass * 0.15);
    const rot = (now * 0.0002 * settings.spin * (i % 2 === 0 ? 1 : -1)) + (i * 0.15);
    const color = lerpColor(theme.colors, ringRatio + now * 0.0001);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    // 몇 분할로 커질지 결정하는 대칭 회전 루프
    for (let d = 0; d < division; d++) {
      ctx.save();
      ctx.rotate((TAU * d) / division);

      ctx.beginPath();
      const petals = 6;
      const pRadius = r / rings * 1.8 * settings.styleMix;
      
      for (let pt = 0; pt < petals; pt++) {
        const angle = (TAU * pt) / petals;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (pt === 0) ctx.moveTo(px, py);
        else ctx.bezierCurveTo(px * 0.8, py * 0.8, px * 1.2, py * 1.2, px, py);
      }
      ctx.closePath();

      // 업로드한 이미지가 있다면 타일처럼 매핑, 없으면 테마 그라디언트 채움
      if (customImages.length > 0) {
        const img = customImages[i % customImages.length];
        ctx.fillStyle = ctx.createPattern(img, 'repeat');
      } else {
        ctx.fillStyle = toRgbaStr(color, settings.fillAlpha * (0.5 + bands.mid * 0.5));
      }
      ctx.fill();

      ctx.lineWidth = 1.8;
      ctx.strokeStyle = toRgbaStr(theme.colors[(i + 1) % theme.colors.length], 0.8);
      ctx.stroke();

      ctx.restore();
    }
    ctx.restore();
  }

  ctx.restore();
  requestAnimationFrame(render);
}

// 녹화 스크립트
let mediaRecorder = null, recordedChunks = [];
document.getElementById("btnRecord").addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
  const stream = canvas.captureStream(60);
  mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: 20_000_000 });
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `mandala_theme_${Date.now()}.webm`;
    a.click();
    document.getElementById("btnRecord").textContent = "⏺ 영상 녹화 시작";
  };
  mediaRecorder.start();
  document.getElementById("btnRecord").textContent = "⏹ 녹화 중지 및 저장";
});

document.getElementById("btnSnapshot").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = `mandala_snapshot_${Date.now()}.png`;
  a.click();
});

requestAnimationFrame(render);
</script>
</body>
