<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만다라 스튜디오V001</title>
<style>
  :root {
    --bg-dark: #0f0f14;
    --panel-bg: #181820;
    --border: #2a2a38;
    --accent: #7c5cff;
    --accent-hover: #967aff;
    --danger: #ff4757;
    --text: #e8e8f0;
    --text-sub: #9090a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .stage-container {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 20px;
background: radial-gradient(circle at center, #181826 0%, #050508 100%);
position: relative;
}
.canvas-wrapper {
position: relative;
width: calc(100vh * 16 / 9 - 80px);
max-height: calc(100vh - 80px);
aspect-ratio: 16 / 9;
box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
border-radius: 14px;
overflow: hidden;
background: #000;
}
canvas { width: 100%; height: 100%; display: block; }
.rec-badge {
position: absolute; top: 16px; left: 16px;
background: rgba(255, 71, 87, 0.9); color: #fff;
padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
display: none; align-items: center; gap: 6px; z-index: 10;
}
.rec-badge.active { display: flex; }
.rec-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

.stage-info {
margin-top: 10px; font-size: 12px; color: var(--text-sub); display: flex; gap: 16px; align-items: center;
}

.sidebar {
width: 440px; background: var(--panel-bg); border-left: 1px solid var(--border);
display: flex; flex-direction: column; height: 100vh;
}
.sidebar-header {
padding: 18px 20px; border-bottom: 1px solid var(--border);
display: flex; justify-content: space-between; align-items: center;
}
.sidebar-header h1 { font-size: 17px; font-weight: 700; }
.badge-ratio {
background: rgba(124, 92, 255, 0.18); color: #b4a0ff;
border: 1px solid rgba(124, 92, 255, 0.4); padding: 3px 8px; border-radius: 6px; font-size: 11px;
}

.controls-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
.controls-scroll::-webkit-scrollbar { width: 6px; }
.controls-scroll::-webkit-scrollbar-thumb { background: #333344; border-radius: 3px; }

.section { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; }
.section-title {
font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-sub);
margin-bottom: 12px; letter-spacing: 0.6px; display: flex; justify-content: space-between; align-items: center;
}

.row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.row label { font-size: 13px; color: var(--text); flex: 0 0 135px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 5px; }
.val-box { width: 42px; text-align: right; font-size: 12px; color: var(--text-sub); }

select, input[type="number"] {
background: #1f1f2b; color: var(--text); border: 1px solid #36364a;
padding: 7px 10px; border-radius: 6px; font-size: 13px; flex: 1; outline: none;
}
select:focus, input[type="number"]:focus { border-color: var(--accent); }

.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.theme-btn {
background: #1f1f2b; border: 1px solid #323246; color: var(--text-sub);
padding: 8px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-align: center;
transition: 0.15s;
}
.theme-btn.active { background: rgba(124, 92, 255, 0.25); border-color: var(--accent); color: #fff; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
flex: 1; background: #222230; color: #fff; border: 1px solid #38384d;
padding: 9px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer;
display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { background: #2e2e42; }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.danger { background: var(--danger); border-color: var(--danger); }

.meter-bar { display: flex; gap: 6px; margin-top: 10px; height: 8px; }
.meter-col { flex: 1; background: #1a1a24; border-radius: 4px; overflow: hidden; }
.meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7c5cff, #00d2d3); transition: width 0.05s linear; }
.audio-status { font-size: 11.5px; color: var(--text-sub); margin-top: 6px; line-height: 1.4; }


<div class="controls-scroll">

    <div class="section-title"><span>주제별 테마 (Theme Mode)</span></div>
    <div class="theme-grid">
      <button class="theme-btn active" data-theme="COSMIC">🌌 우주속</button>
      <button class="theme-btn" data-theme="FLOWER">🌸 꽃잎속</button>
      <button class="theme-btn" data-theme="LEAF">🍃 잎사귀</button>
      <button class="theme-btn" data-theme="WATER">💧 물속</button>
      <button class="theme-btn" data-theme="VOLCANO">🌋 화산속</button>

  </div>

  <!-- 2. 이미지 매핑 (만다라 조각 패턴 소스) -->

    <div class="btn-group">
      <label class="btn primary" style="cursor:pointer;">
        🖼️ 이미지 불러오기

      <button class="btn" id="btnClearImages">초기화</button>

  </div>

  <!-- 3. 만다라 분할 배율 및 무한 생성/소멸 제어 -->
  <div class="section">
    <div class="section-title">만다라 대칭 분할 & 무한 생성/소멸</div>
    <div class="row">
      <label>대칭 분할 수 (Symmetry)</label>
      <input type="range" id="rngSymmetry" min="4" max="32" step="2" value="12">
      <span class="val-box" id="valSymmetry">12분할</span>
    </div>
    <div class="row">
      <label>무한 고리 층수 (Rings)</label>
      <input type="range" id="rngRings" min="4" max="24" step="1" value="12">
      <span class="val-box" id="valRings">12층</span>
    </div>
    <div class="row">
      <label>생성/소멸 속도 (Speed)</label>
      <input type="range" id="rngSpeed" min="0.2" max="3.0" step="0.1" value="1.0">
      <span class="val-box" id="valSpeed">1.0</span>
    </div>
    <div class="row">
      <label>회전 속도 (Spin)</label>
      <input type="range" id="rngSpin" min="-2.0" max="2.0" step="0.05" value="0.4">
      <span class="val-box" id="valSpin">0.4</span>
    </div>
    <div class="row">
      <label>선 굵기 (Line)</label>
      <input type="range" id="rngLine" min="0.5" max="5.0" step="0.1" value="1.8">
      <span class="val-box" id="valLine">1.8</span>
    </div>
    <div class="row">
      <label>내부 투명도 (Alpha)</label>
      <input type="range" id="rngFillAlpha" min="0.1" max="1.0" step="0.05" value="0.75">
      <span class="val-box" id="valFillAlpha">0.75</span>
    </div>
  </div>

  <!-- 4. 오디오 & 주파수 연동 -->
  <div class="section">
    <div class="section-title">
      <span>오디오 주파수 연동 비트</span>
      <span id="audioModeLabel" style="color:#a288ff;">호흡 곡선</span>
    </div>
    <div class="btn-group">
      <label class="btn primary" style="cursor:pointer;">
        🎵 MP3 음악 파일
        <input type="file" id="audioInput" accept="audio/*" style="display:none;">
      </label>
      <button class="btn" id="btnBreath">🌬️ 호흡</button>
    </div>
    <audio id="audioPlayer" controls style="width:100%; height:34px; margin-top:10px; display:none; background:#222; border-radius:6px;"></audio>
    <div class="meter-bar">
      <div class="meter-col"><div class="meter-fill" id="meterBass"></div></div>
      <div class="meter-col"><div class="meter-fill" id="meterMid"></div></div>
      <div class="meter-col"><div class="meter-fill" id="meterHigh"></div></div>
    </div>
  </div>

  <!-- 5. 영상 녹화 -->
  <div class="section">
    <div class="section-title"><span>고화질 1920x1080 녹화</span></div>
    <div class="btn-group">
      <button class="btn primary" id="btnRecord">⏺ 영상 녹화 시작</button>
      <button class="btn" id="btnSnapshot">📸 스냅샷</button>
    </div>
  </div>

</div>
  </aside>

<script>
const TAU = Math.PI * 2;

// 정통 팔레트 및 배경 잉크
const PALETTES = {
  CYBER: [[1.00, 0.08, 0.58, 1], [0.00, 0.95, 1.00, 1], [0.55, 0.15, 1.00, 1], [1.00, 0.92, 0.10, 1]],
  PASTEL: [[0.95, 0.75, 0.73, 1], [0.96, 0.86, 0.66, 1], [0.73, 0.84, 0.80, 1], [0.73, 0.79, 0.91, 1], [0.88, 0.75, 0.84, 1]],
  PRIMARY: [[0.89, 0.07, 0.14, 1], [1.00, 0.80, 0.00, 1], [0.11, 0.31, 1.00, 1], [1.00, 1.00, 1.00, 1]],
  GOLD_LOTUS: [[1.00, 0.84, 0.25, 1], [0.96, 0.48, 0.18, 1], [0.75, 0.15, 0.28, 1], [0.98, 0.93, 0.76, 1]],
  AURORA: [[0.10, 0.95, 0.65, 1], [0.15, 0.60, 0.98, 1], [0.62, 0.28, 0.95, 1], [0.95, 0.35, 0.75, 1]],
  DANCFENG: [[0.85, 0.18, 0.20, 1], [0.16, 0.68, 0.52, 1], [0.96, 0.76, 0.18, 1], [0.18, 0.32, 0.72, 1], [0.95, 0.93, 0.88, 1]],
  MONO: [[0.96, 0.95, 0.92, 1], [0.84, 0.81, 0.76, 1], [0.66, 0.62, 0.57, 1], [0.48, 0.45, 0.41, 1]],
};
const INK = {
  CYBER: [0.03, 0.02, 0.07, 1], PASTEL: [0.07, 0.06, 0.08, 1], PRIMARY: [0.03, 0.03, 0.06, 1],
  GOLD_LOTUS: [0.06, 0.03, 0.04, 1], AURORA: [0.02, 0.05, 0.07, 1], DANCFENG: [0.05, 0.06, 0.06, 1], MONO: [0.05, 0.045, 0.04, 1]
};

const settings = {
  flow: "BLOOM",
  palette: "CYBER",
  fillAlpha: 0.75,
  nega: false,
  glow: true,
  symmetry: 12,
  rings: 16,
  speed: 1.0,
  spin: 0.5,
  line: 1.8,
  maxScale: 1.2,
  seed: 7
};

let customImages = []; // 업로드된 이미지 배열

// 기하학 헬퍼
function quad(p0, p1, p2, steps = 8) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const u = 1 - t;
    pts.push([
      u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
      u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1],
    ]);
  }
  return pts;
}

function circle(r, segs = 48) {
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const a = (TAU * i) / segs;
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return pts;
}

// 정통 만다라 모티프 생성기 (꽃잎, 연꽃, 기와, 별, 기하)
function getMotifSplines(typeIndex, n, morph) {
  const splines = [];
  if (typeIndex % 4 === 0) {
    // 🌸 꽃잎 패턴
    const inner = 0.65;
    for (let i = 0; i < n; i++) {
      const a = (TAU * i) / n;
      const half = (Math.PI / n) * 0.85;
      const tip = [Math.cos(a), Math.sin(a)];
      const bl = [Math.cos(a - half) * inner, Math.sin(a - half) * inner];
      const br = [Math.cos(a + half) * inner, Math.sin(a + half) * inner];
      const mid = [Math.cos(a) * (inner + 1) * 0.5, Math.sin(a) * (inner + 1) * 0.5];
      const px = Math.cos(a + Math.PI / 2) * 0.12;
      const py = Math.sin(a + Math.PI / 2) * 0.12;
      const left = quad(bl, [mid[0] + px, mid[1] + py], tip, 8);
      const right = quad(tip, [mid[0] - px, mid[1] - py], br, 8);
      const poly = left.concat(right.slice(1));
      poly.push(bl);
      splines.push({ pts: poly, closed: true });
    }
    splines.push({ pts: circle(inner * 0.92, 36), closed: true });
  } else if (typeIndex % 4 === 1) {
    // 🪷 연꽃/다이아몬드 로제타
    const rOuter = 1.0 + morph * 0.08;
    const rInner = 0.45;
    const half = (Math.PI / n) * 0.75;
    for (let i = 0; i < n; i++) {
      const a = (TAU * i) / n;
      splines.push({
        pts: [
          [Math.cos(a) * rInner, Math.sin(a) * rInner],
          [Math.cos(a - half) * 0.75, Math.sin(a - half) * 0.75],
          [Math.cos(a) * rOuter, Math.sin(a) * rOuter],
          [Math.cos(a + half) * 0.75, Math.sin(a + half) * 0.75],
          [Math.cos(a) * rInner, Math.sin(a) * rInner],
        ],
        closed: true
      });
    }
  } else if (typeIndex % 4 === 2) {
    // ✨ 만화경 별 레이어
    for (let i = 0; i < n; i++) {
      const a = (TAU * i) / n;
      const stepA = Math.PI / n;
      const poly = [
        [Math.cos(a) * 1.05, Math.sin(a) * 1.05],
        [Math.cos(a + stepA * 0.5) * 0.78, Math.sin(a + stepA * 0.5) * 0.78],
        [Math.cos(a) * 0.4, Math.sin(a) * 0.4],
        [Math.cos(a - stepA * 0.5) * 0.78, Math.sin(a - stepA * 0.5) * 0.78],
        [Math.cos(a) * 1.05, Math.sin(a) * 1.05],
      ];
      splines.push({ pts: poly, closed: true });
    }
    splines.push({ pts: circle(0.9, 32), closed: true });
  } else {
    // 📐 기하학 다각형 링
    const poly = [];
    for (let i = 0; i <= n; i++) {
      const a = (TAU * i) / n;
      const rr = i % 2 === 0 ? 1.0 : 0.75;
      poly.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    splines.push({ pts: poly, closed: true });
    splines.push({ pts: circle(0.5, 24), closed: true });
  }
  return splines;
}

function createRng(seed) {
  let a = seed >>> 0;
  return function() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a) >>> 0;
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function invertColor(c) { return [1 - c[0], 1 - c[1], 1 - c[2], 1]; }
function lerpColor(colors, t) {
  const n = colors.length;
  const x = (((t % 1.0) + 1.0) % 1.0) * n;
  const i = Math.floor(x) % n;
  const f = x - Math.floor(x);
  const a = colors[i], b = colors[(i + 1) % n];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, 1];
}

// 오디오 분석
let audioMode = "BREATH";
let audioCtx = null, analyser = null, freqData = null;
const audioPlayer = document.getElementById("audioPlayer");

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

document.getElementById("audioInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  ensureAudioContext();
  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.style.display = "block";
  audioPlayer.play();
  const src = audioCtx.createMediaElementSource(audioPlayer);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
  audioMode = "FILE";
  document.getElementById("audioModeLabel").textContent = "오디오: " + file.name.slice(0, 12);
});

document.getElementById("btnBreath").addEventListener("click", () => {
  audioPlayer.pause();
  audioPlayer.style.display = "none";
  audioMode = "BREATH";
  document.getElementById("audioModeLabel").textContent = "호흡 곡선";
});

function getAudioBands(timeSec) {
  if (audioMode === "FILE" && !audioPlayer.paused && analyser) {
    analyser.getByteFrequencyData(freqData);
    let sum = 0; for (let i = 0; i < 35; i++) sum += freqData[i];
    const b = (sum / 35) / 255;
    let sumMid = 0; for (let i = 35; i < 140; i++) sumMid += freqData[i];
    const m = (sumMid / 105) / 255;
    return { bass: b * 1.5, mid: m * 1.3, energy: (b + m) * 0.75 };
  }
  const f = timeSec * 24;
  const b = Math.max(0, Math.min(1, 0.35 + 0.25 * Math.sin(f * 0.17)));
  const m = Math.max(0, Math.min(1, 0.40 + 0.30 * Math.sin(f * 0.11)));
  return { bass: b, mid: m, energy: b * 0.5 + m * 0.5 };
}

// 이미지 업로드
document.getElementById("patternImageInput").addEventListener("change", (e) => {
  const files = e.target.files;
  if (!files.length) return;
  for (let file of files) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => customImages.push(img);
  }
  document.getElementById("imgStatus").textContent = `업로드된 이미지: ${files.length}장 (만다라 타일 매핑 활성화)`;
});
document.getElementById("btnClearImages").addEventListener("click", () => {
  customImages = [];
  document.getElementById("imgStatus").textContent = "현재: 기본 정통 만다라 쉐이프 사용 중";
});

// 슬라이더 바인딩
function bindRange(id, valId, key, suffix = "") {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  el.addEventListener("input", () => {
    settings[key] = parseFloat(el.value);
    valEl.textContent = el.value + suffix;
  });
}
bindRange("rngSymmetry", "valSymmetry", "symmetry", "");
bindRange("rngRings", "valRings", "rings", "");
bindRange("rngSpeed", "valSpeed", "speed", "");
bindRange("rngSpin", "valSpin", "spin", "");
bindRange("rngLine", "valLine", "line", "");
bindRange("rngFillAlpha", "valFillAlpha", "fillAlpha", "");

document.getElementById("selPalette").addEventListener("change", (e) => { settings.palette = e.target.value; });
document.getElementById("selFlow").addEventListener("change", (e) => { settings.flow = e.target.value; });

function bindToggle(id, key) {
  const btn = document.getElementById(id);
  btn.addEventListener("click", () => {
    settings[key] = !settings[key];
    btn.classList.toggle("active", settings[key]);
  });
}
bindToggle("togGlow", "glow");
bindToggle("togNega", "nega");

// 캔버스 렌더링 엔진 (정통 만다라 + 무한 생성/소멸 엔진)
const canvas = document.getElementById("mandalaCanvas");
const ctx = canvas.getContext("2d");
let lastTime = performance.now();

function render(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  const bands = getAudioBands(now / 1000);
  document.getElementById("meterBass").style.width = `${Math.round(bands.bass * 100)}%`;
  document.getElementById("meterMid").style.width = `${Math.round(bands.mid * 100)}%`;

  let palette = PALETTES[settings.palette].map(c => [...c]);
  let ink = [...INK[settings.palette]];
  if (settings.nega) { palette = palette.map(invertColor); ink = invertColor(ink); }

  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  // 배경 채우기
  ctx.save();
  ctx.fillStyle = toRgbaStr(ink, 1.0);
  ctx.fillRect(0, 0, W, H);

  // 파티클
  ctx.fillStyle = "rgba(120,200,255,0.6)";
  for (let p of particles) {
    p.x += p.vx * (1 + bands.bass * 2);
    p.y += p.vy * (1 + bands.bass * 2);
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 + bands.bass * 0.5), 0, TAU);
    ctx.fill();
  }

  const rings = Math.round(settings.rings);
  const symmetry = Math.round(settings.symmetry);
  const maxRadius = (H * 0.46) * settings.maxScale;
  const innerScale = 0.05;

  // 무한 생성/소멸 흐름 (BLOOM / INWARD)
  const timeFlow = (now * 0.00015 * settings.speed * (0.6 + bands.energy * 1.2)) % 1.0;

  for (let i = 0; i < rings; i++) {
    const phase = (i / rings + timeFlow) % 1.0;
    const u = settings.flow === "BLOOM" ? phase : (1.0 - phase);
    const radius = innerScale + (maxRadius - innerScale) * u;

    // 생명 주기 페이드 (중앙에서 태어나 외곽에서 부드럽게 소멸)
    const env = Math.sin(u * Math.PI);
    if (env <= 0.01 || radius < 10) continue;

    const rot = (now * 0.0001 * settings.spin * (i % 2 === 0 ? 1 : -1)) + (i * 0.25);
    const colorMain = lerpColor(palette, (i / rings) + (now * 0.00005));
    const colorEdge = lerpColor(palette, (i / rings) + 0.3);

    const splines = getMotifSplines(i, symmetry, bands.mid * 0.8);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    if (settings.glow) {
      ctx.shadowColor = toRgbaStr(colorMain, 0.8);
      ctx.shadowBlur = 12 + bands.bass * 18;
    }

    ctx.lineWidth = Math.max(0.6, settings.line * (0.7 + bands.mid * 0.5));
    ctx.strokeStyle = toRgbaStr(colorEdge, env * 0.9);

    for (const sp of splines) {
      const pts = sp.pts;
      if (!pts || pts.length < 2) continue;

      // 대칭축(Symmetry) 반복 렌더링 (진짜 만다라 칼레이도스코프)
      for (let s = 0; s < symmetry; s++) {
        ctx.save();
        ctx.rotate((TAU * s) / symmetry);
        if (s % 2 === 1) ctx.scale(1, -1); // 좌우 대칭 미러링

        ctx.beginPath();
        for (let k = 0; k < pts.length; k++) {
          const px = pts[k][0] * radius;
          const py = pts[k][1] * radius;
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        if (sp.closed) ctx.closePath();

        // 사용자 업로드 이미지가 있으면 패턴 매핑, 없으면 입체 그라디언트
        if (customImages.length > 0) {
          const img = customImages[i % customImages.length];
          ctx.save();
          ctx.clip();
          ctx.globalAlpha = env * 0.85;
          ctx.drawImage(img, -img.width / 2, -img.height / 2, radius * 1.5, radius * 1.5);
          ctx.restore();
        } else if (sp.closed) {
          const fillAlpha = Math.min(1.0, env * settings.fillAlpha);
          const rg = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius);
          rg.addColorStop(0, toRgbaStr(colorMain, fillAlpha * 0.3));
          rg.addColorStop(0.7, toRgbaStr(colorEdge, fillAlpha * 0.6));
          rg.addColorStop(1, toRgbaStr(colorMain, fillAlpha * 0.85));
          ctx.fillStyle = rg;
          ctx.fill();
        }

        ctx.stroke();
        ctx.restore();
      }
    }

    ctx.restore();
  }

  ctx.restore();
  requestAnimationFrame(render);
}

// 녹화 및 스냅샷
let mediaRecorder = null, recordedChunks = [];
document.getElementById("btnRecord").addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
  const stream = canvas.captureStream(60);
  mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: 20_000_000 });
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `true_mandala_${Date.now()}.webm`;
    a.click();
    document.getElementById("btnRecord").textContent = "⏺ 영상 녹화 시작";
  };
  mediaRecorder.start();
  document.getElementById("btnRecord").textContent = "⏹ 녹화 중지 및 저장";
});

document.getElementById("btnSnapshot").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = `mandala_snapshot_${Date.now()}.png`;
  a.click();
});

requestAnimationFrame(render);
</script>
</body>
</html>
