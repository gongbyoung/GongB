<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무한만다라 스튜디오 (정통 만다라 + 이미지 매핑 통합 에디션)</title>
<style>
  :root {
    --bg-dark: #0f0f14;
    --panel-bg: #181820;
    --border: #2a2a38;
    --accent: #7c5cff;
    --danger: #ff4757;
    --text: #e8e8f0;
    --text-sub: #9090a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .stage-container {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; background: radial-gradient(circle at center, #181826 0%, #050508 100%);
  }
  .canvas-wrapper {
    position: relative; width: calc(100vh * 16 / 9 - 80px); max-height: calc(100vh - 80px);
    aspect-ratio: 16 / 9; box-shadow: 0 25px 50px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.08);
    border-radius: 14px; overflow: hidden; background: #000;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .rec-badge {
    position: absolute; top: 16px; left: 16px; background: rgba(255, 71, 87, 0.9); color: #fff;
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
    display: none; align-items: center; gap: 6px; z-index: 10;
  }
  .rec-badge.active { display: flex; }
  .rec-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  .stage-info { margin-top: 10px; font-size: 12px; color: var(--text-sub); display: flex; gap: 16px; align-items: center; }

  .sidebar {
    width: 440px; background: var(--panel-bg); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  .sidebar-header {
    padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-header h1 { font-size: 17px; font-weight: 700; }
  .badge-ratio { background: rgba(124, 92, 255, 0.18); color: #b4a0ff; border: 1px solid rgba(124, 92, 255, 0.4); padding: 3px 8px; border-radius: 6px; font-size: 11px; }
  .controls-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  .controls-scroll::-webkit-scrollbar { width: 6px; }
  .controls-scroll::-webkit-scrollbar-thumb { background: #333344; border-radius: 3px; }
  .section { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-title { font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 12px; display: flex; justify-content: space-between; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .row label { font-size: 13px; color: var(--text); flex: 0 0 135px; }
  .row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 5px; }
  .val-box { width: 42px; text-align: right; font-size: 12px; color: var(--text-sub); }
  select, input[type="number"] { background: #1f1f2b; color: var(--text); border: 1px solid #36364a; padding: 7px 10px; border-radius: 6px; font-size: 13px; flex: 1; outline: none; }
  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .theme-btn { background: #1f1f2b; border: 1px solid #323246; color: var(--text-sub); padding: 8px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: 0.15s; }
  .theme-btn.active { background: rgba(124, 92, 255, 0.25); border-color: var(--accent); color: #fff; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { flex: 1; background: #222230; color: #fff; border: 1px solid #38384d; padding: 9px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover { background: #2e2e42; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); }
  .meter-bar { display: flex; gap: 6px; margin-top: 10px; height: 8px; }
  .meter-col { flex: 1; background: #1a1a24; border-radius: 4px; overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7c5cff, #00d2d3); transition: width 0.05s linear; }
  .audio-status { font-size: 11.5px; color: var(--text-sub); margin-top: 6px; line-height: 1.4; }
  .toggle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .toggle-btn { background: #232330; border: 1px solid #343446; color: var(--text-sub); padding: 8px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
  .toggle-btn.active { background: rgba(124, 92, 255, 0.2); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>

<div class="stage-container">
  <div class="canvas-wrapper">
    <div class="rec-badge" id="recBadge"><div class="rec-dot"></div><span id="recTime">REC 00:00</span></div>
    <canvas id="mandalaCanvas" width="1920" height="1080"></canvas>
  </div>
  <div class="stage-info">
    <span>테마 모드: <b id="currentThemeName" style="color:#b4a0ff;">우주속 (Cosmic)</b></span> | <span id="fpsCounter">60 FPS</span>
  </div>
</div>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>무한만다라 스튜디오</h1><span class="badge-ratio">정통 + 이미지 V5.0</span>
  </div>

  <div class="controls-scroll">
    <!-- 1. 주제별 테마 선택 -->
    <div class="section">
      <div class="section-title"><span>주제별 테마 (Theme Mode)</span></div>
      <div class="theme-grid">
        <button class="theme-btn active" data-theme="COSMIC">🌌 우주속</button>
        <button class="theme-btn" data-theme="FLOWER">🌸 꽃잎속</button>
        <button class="theme-btn" data-theme="LEAF">🍃 잎사귀</button>
        <button class="theme-btn" data-theme="WATER">💧 물속</button>
        <button class="theme-btn" data-theme="VOLCANO">🌋 화산속</button>
        <button class="theme-btn" data-theme="CLOUD">☁️ 구름속</button>
      </div>
    </div>

    <!-- 2. 이미지 매핑 -->
    <div class="section">
      <div class="section-title"><span>만다라 패턴 이미지 업로드</span></div>
      <div class="btn-group">
        <label class="btn primary" style="cursor:pointer;">🖼️ 이미지 불러오기
          <input type="file" id="patternImageInput" accept="image/*" multiple style="display:none;">
        </label>
        <button class="btn" id="btnClearImages">초기화</button>
      </div>
      <div class="audio-status" id="imgStatus">이미지가 없으면 기본 정통 쉐이프(꽃잎, 기하 등)가 생성됩니다.</div>
    </div>

    <!-- 3. 만다라 분할 배율 -->
    <div class="section">
      <div class="section-title">만다라 대칭 분할 & 무한 생성/소멸</div>
      <div class="row">
        <label>대칭 분할 수 (Symmetry)</label>
        <input type="range" id="rngSymmetry" min="4" max="32" step="2" value="12">
        <span class="val-box" id="valSymmetry">12분할</span>
      </div>
      <div class="row">
        <label>무한 고리 층수 (Rings)</label>
        <input type="range" id="rngRings" min="4" max="30" step="1" value="14">
        <span class="val-box" id="valRings">14층</span>
      </div>
      <div class="row">
        <label>생성/소멸 속도 (Speed)</label>
        <input type="range" id="rngSpeed" min="0.2" max="3.0" step="0.1" value="1.0">
        <span class="val-box" id="valSpeed">1.0</span>
      </div>
      <div class="row">
        <label>회전 속도 (Spin)</label>
        <input type="range" id="rngSpin" min="-2.0" max="2.0" step="0.05" value="0.4">
        <span class="val-box" id="valSpin">0.4</span>
      </div>
      <div class="row">
        <label>선 굵기 (Line)</label>
        <input type="range" id="rngLine" min="0.5" max="5.0" step="0.1" value="1.8">
        <span class="val-box" id="valLine">1.8</span>
      </div>
      <div class="row">
        <label>내부 투명도 (Alpha)</label>
        <input type="range" id="rngFillAlpha" min="0.1" max="1.0" step="0.05" value="0.75">
        <span class="val-box" id="valFillAlpha">0.75</span>
      </div>
      <div class="toggle-grid">
        <div class="toggle-btn active" id="togGlow">네온 발광 (GLOW)</div>
        <div class="toggle-btn" id="togNega">색상 반전 (NEGA)</div>
      </div>
    </div>

    <!-- 4. 오디오 -->
    <div class="section">
      <div class="section-title"><span>오디오 주파수 연동 비트</span><span id="audioModeLabel" style="color:#a288ff;">호흡 곡선</span></div>
      <div class="btn-group">
        <label class="btn primary" style="cursor:pointer;">🎵 MP3 음악 파일
          <input type="file" id="audioInput" accept="audio/*" style="display:none;">
        </label>
        <button class="btn" id="btnBreath">🌬️ 호흡</button>
      </div>
      <audio id="audioPlayer" controls style="width:100%; height:34px; margin-top:10px; display:none; background:#222; border-radius:6px;"></audio>
      <div class="meter-bar">
        <div class="meter-col"><div class="meter-fill" id="meterBass"></div></div>
        <div class="meter-col"><div class="meter-fill" id="meterMid"></div></div>
        <div class="meter-col"><div class="meter-fill" id="meterHigh"></div></div>
      </div>
    </div>

    <!-- 5. 녹화 -->
    <div class="section">
      <div class="section-title"><span>고화질 1920x1080 녹화</span></div>
      <div class="btn-group">
        <button class="btn primary" id="btnRecord">⏺ 영상 녹화 시작</button>
        <button class="btn" id="btnSnapshot">📸 스냅샷</button>
      </div>
    </div>
  </div>
</aside>

<script>
// ============================================================================
// 1. 공통 유틸리티 및 안전한 이벤트 바인딩 (에러 방지)
// ============================================================================
const TAU = Math.PI * 2;

function createRng(seed) {
  let a = seed >>> 0;
  return function() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a) >>> 0;
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function invertColor(c) { return [1 - c[0], 1 - c[1], 1 - c[2], 1]; }
function lerpColor(colors, t) {
  const n = colors.length;
  const x = (((t % 1.0) + 1.0) % 1.0) * n;
  const i = Math.floor(x) % n;
  const f = x - Math.floor(x);
  const a = colors[i], b = colors[(i + 1) % n];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, 1];
}
function toRgbaStr(c, alpha = 1.0) {
  const r = Math.round(Math.max(0, Math.min(1, c[0])) * 255);
  const g = Math.round(Math.max(0, Math.min(1, c[1])) * 255);
  const b = Math.round(Math.max(0, Math.min(1, c[2])) * 255);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
}

// ============================================================================
// 2. 정통 만다라 기하학 쉐이프 엔진 (꽃잎, 기와, 별, 기하 등 완벽 구현)
// ============================================================================
function quad(p0, p1, p2, steps = 8) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps; const u = 1 - t;
    pts.push([
      u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
      u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1],
    ]);
  }
  return pts;
}

function circle(r, segs = 48) {
  const pts = [];
  for (let i = 0; i <= segs; i++) pts.push([Math.cos(TAU * i / segs) * r, Math.sin(TAU * i / segs) * r]);
  return pts;
}

function getMotifSplines(typeIndex, n, morph) {
  const splines = [];
  if (typeIndex % 4 === 0) {
    // 🌸 꽃잎 패턴
    const inner = 0.65;
    for (let i = 0; i < n; i++) {
      const a = (TAU * i) / n;
      const half = (Math.PI / n) * 0.85;
      const tip = [Math.cos(a), Math.sin(a)];
      const bl = [Math.cos(a - half) * inner, Math.sin(a - half) * inner];
      const br = [Math.cos(a + half) * inner, Math.sin(a + half) * inner];
      const mid = [Math.cos(a) * (inner + 1) * 0.5, Math.sin(a) * (inner + 1) * 0.5];
      const px = Math.cos(a + Math.PI / 2) * 0.12;
      const py = Math.sin(a + Math.PI / 2) * 0.12;
      const left = quad(bl, [mid[0] + px, mid[1] + py], tip, 8);
      const right = quad(tip, [mid[0] - px, mid[1] - py], br, 8);
      const poly = left.concat(right.slice(1));
      poly.push(bl);
      splines.push({ pts: poly, closed: true });
    }
    splines.push({ pts: circle(inner * 0.92, 36), closed: true });
  } else if (typeIndex % 4 === 1) {
    // 🪷 연꽃/다이아몬드 로제타
    const rOuter = 1.0 + morph * 0.08;
    const rInner = 0.45;
    const half = (Math.PI / n) * 0.75;
    for (let i = 0; i < n; i++) {
      const a = (TAU * i) / n;
      splines.push({
        pts: [
          [Math.cos(a) * rInner, Math.sin(a) * rInner],
          [Math.cos(a - half) * 0.75, Math.sin(a - half) * 0.75],
          [Math.cos(a) * rOuter, Math.sin(a) * rOuter],
          [Math.cos(a + half) * 0.75, Math.sin(a + half) * 0.75],
          [Math.cos(a) * rInner, Math.sin(a) * rInner],
        ],
        closed: true
      });
    }
  } else if (typeIndex % 4 === 2) {
    // ✨ 만화경 별 레이어
    for (let i = 0; i < n; i++) {
      const a = (TAU * i) / n;
      const stepA = Math.PI / n;
      const poly = [
        [Math.cos(a) * 1.05, Math.sin(a) * 1.05],
        [Math.cos(a + stepA * 0.5) * 0.78, Math.sin(a + stepA * 0.5) * 0.78],
        [Math.cos(a) * 0.4, Math.sin(a) * 0.4],
        [Math.cos(a - stepA * 0.5) * 0.78, Math.sin(a - stepA * 0.5) * 0.78],
        [Math.cos(a) * 1.05, Math.sin(a) * 1.05],
      ];
      splines.push({ pts: poly, closed: true });
    }
    splines.push({ pts: circle(0.9, 32), closed: true });
  } else {
    // 📐 기하학 다각형 링
    const poly = [];
    for (let i = 0; i <= n; i++) {
      const a = (TAU * i) / n;
      const rr = i % 2 === 0 ? 1.0 : 0.75;
      poly.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    splines.push({ pts: poly, closed: true });
    splines.push({ pts: circle(0.5, 24), closed: true });
  }
  return splines;
}

// ============================================================================
// 3. 상태 관리, 오디오, 그리고 UI 초기화
// ============================================================================
const THEMES = {
  COSMIC: { name: "우주속", bg: [0.03, 0.02, 0.07, 1], colors: [[0.55, 0.15, 1.00, 1], [0.00, 0.95, 1.00, 1], [1.00, 0.08, 0.58, 1], [0.95, 0.93, 0.20, 1]], pColor: "rgba(120,200,255,0.7)" },
  FLOWER: { name: "꽃잎속", bg: [0.06, 0.04, 0.06, 1], colors: [[0.95, 0.45, 0.65, 1], [0.98, 0.78, 0.45, 1], [0.82, 0.25, 0.45, 1], [1.00, 0.95, 0.90, 1]], pColor: "rgba(255,150,180,0.7)" },
  LEAF: { name: "잎사귀", bg: [0.02, 0.06, 0.04, 1], colors: [[0.18, 0.75, 0.42, 1], [0.45, 0.88, 0.35, 1], [0.12, 0.45, 0.28, 1], [0.85, 0.95, 0.55, 1]], pColor: "rgba(100,220,130,0.7)" },
  WATER: { name: "물속", bg: [0.02, 0.04, 0.08, 1], colors: [[0.10, 0.60, 0.95, 1], [0.20, 0.90, 0.85, 1], [0.05, 0.25, 0.65, 1], [0.80, 0.95, 1.00, 1]], pColor: "rgba(80,180,255,0.7)" },
  VOLCANO: { name: "화산속", bg: [0.08, 0.02, 0.02, 1], colors: [[0.98, 0.32, 0.05, 1], [1.00, 0.75, 0.10, 1], [0.75, 0.08, 0.08, 1], [0.30, 0.10, 0.10, 1]], pColor: "rgba(255,100,50,0.7)" },
  CLOUD: { name: "구름속", bg: [0.05, 0.07, 0.10, 1], colors: [[0.85, 0.90, 0.98, 1], [0.65, 0.75, 0.90, 1], [0.45, 0.58, 0.78, 1], [1.00, 1.00, 1.00, 1]], pColor: "rgba(200,220,255,0.7)" }
};

let currentThemeKey = "COSMIC";
let customImages = [];
const settings = {
  symmetry: 12, rings: 14, speed: 1.0, spin: 0.4, line: 1.8, fillAlpha: 0.75,
  glow: true, nega: false, seed: 7
};

const particles = [];
for (let i = 0; i < 70; i++) {
  particles.push({
    x: Math.random() * 1920, y: Math.random() * 1080,
    vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8,
    size: Math.random() * 3 + 1
  });
}

// 오디오 컨텍스트
let audioMode = "BREATH";
let audioCtx = null, analyser = null, freqData = null;

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function getAudioBands(timeSec) {
  const audioPlayer = document.getElementById("audioPlayer");
  if (audioMode === "FILE" && audioPlayer && !audioPlayer.paused && analyser) {
    analyser.getByteFrequencyData(freqData);
    let sum = 0; for (let i = 0; i < 35; i++) sum += freqData[i];
    const b = (sum / 35) / 255;
    let sumMid = 0; for (let i = 35; i < 140; i++) sumMid += freqData[i];
    const m = (sumMid / 105) / 255;
    return { bass: b * 1.6, mid: m * 1.4, energy: (b + m) * 0.8 };
  }
  const f = timeSec * 24;
  const b = Math.max(0, Math.min(1, 0.35 + 0.25 * Math.sin(f * 0.17)));
  const m = Math.max(0, Math.min(1, 0.40 + 0.30 * Math.sin(f * 0.11)));
  return { bass: b, mid: m, energy: b * 0.5 + m * 0.5 };
}

// 링 데이터 재생성
let ringsData = [];
function rebuildRings() {
  const count = settings.rings;
  const rnd = createRng(settings.seed || 1);
  ringsData = [];
  for (let i = 0; i < count; i++) {
    const phase = (i + 0.35) / count;
    const spinDir = rnd() > 0.5 ? 1 : -1;
    ringsData.push({ index: i, phase, spinDir });
  }
}

// ============================================================================
// 4. 렌더링 루프 (정통 쉐이프 vs 사용자 이미지 매핑 자동 전환)
// ============================================================================
const canvas = document.getElementById("mandalaCanvas");
const ctx = canvas ? canvas.getContext("2d") : null;
let lastTime = performance.now();
let frameCount = 0;
let fpsTimer = performance.now();

function render(now) {
  if (!ctx || !canvas) return;
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  frameCount++;
  if (now - fpsTimer >= 500) {
    const fps = Math.round((frameCount * 1000) / (now - fpsTimer));
    const fpsEl = document.getElementById("fpsCounter");
    if (fpsEl) fpsEl.textContent = `${fps} FPS`;
    frameCount = 0;
    fpsTimer = now;
  }

  const bands = getAudioBands(now / 1000);
  const mBass = document.getElementById("meterBass");
  const mMid = document.getElementById("meterMid");
  if (mBass) mBass.style.width = `${Math.round(bands.bass * 100)}%`;
  if (mMid) mMid.style.width = `${Math.round(bands.mid * 100)}%`;

  const theme = THEMES[currentThemeKey];
  let colors = theme.colors.map(c => [...c]);
  let bg = [...theme.bg];
  if (settings.nega) { colors = colors.map(invertColor); bg = invertColor(bg); }

  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  ctx.save();
  ctx.fillStyle = toRgbaStr(bg, 1.0);
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = theme.pColor;
  for (let p of particles) {
    p.x += p.vx * (1 + bands.bass * 3);
    p.y += p.vy * (1 + bands.bass * 3);
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 + bands.bass * 0.8), 0, TAU);
    ctx.fill();
  }

  const rings = Math.round(settings.rings);
  const symmetry = Math.round(settings.symmetry);
  const maxRadius = H * 0.52;
  const innerScale = 0.05;

  const timeFlow = (now * 0.00015 * settings.speed * (0.6 + bands.energy * 1.2)) % 1.0;
  
  if (ringsData.length !== rings) rebuildRings();

  for (let i = 0; i < rings; i++) {
    const ring = ringsData[i];
    const phase = (i / rings + timeFlow) % 1.0;
    const u = phase; // BLOOM (중심에서 바깥으로)
    const radius = innerScale + (maxRadius - innerScale) * u;

    const env = Math.sin(u * Math.PI);
    if (env <= 0.01 || radius < 5) continue;

    const rot = (now * 0.0001 * settings.spin * ring.spinDir) + (i * 0.25);
    const colorMain = lerpColor(colors, (i / rings) + (now * 0.00005));
    const colorEdge = lerpColor(colors, (i / rings) + 0.3);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    if (settings.glow) {
      ctx.shadowColor = toRgbaStr(colorMain, 0.8);
      ctx.shadowBlur = 12 + bands.bass * 18;
    }

    ctx.lineWidth = Math.max(0.6, settings.line * (0.7 + bands.mid * 0.5));
    ctx.strokeStyle = toRgbaStr(colorEdge, env * 0.9);

    if (customImages.length > 0) {
      // 1. [만다라 이미지 매핑 모드] (부채꼴 조각 만화경)
      const img = customImages[i % customImages.length];
      const sliceAngle = TAU / symmetry;
      
      for (let s = 0; s < symmetry; s++) {
        ctx.save();
        ctx.rotate(sliceAngle * s);
        if (s % 2 === 1) ctx.scale(1, -1);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, -sliceAngle * 0.5, sliceAngle * 0.5);
        ctx.closePath();
        ctx.clip(); // 조각 밖으로 그림이 삐져나가지 않도록 마스킹

        ctx.globalAlpha = env * settings.fillAlpha;
        // 이미지가 중심에서 바깥으로 커지면서 확장되는 효과
        ctx.scale(0.8 + u * 0.5, 0.8 + u * 0.5);
        ctx.drawImage(img, -img.width / 2, -img.height / 2, radius * 1.5, radius * 1.5);
        ctx.restore();

        // 조각 선 그리기
        ctx.save();
        ctx.rotate(sliceAngle * s);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(sliceAngle * 0.5) * radius, Math.sin(sliceAngle * 0.5) * radius);
        ctx.stroke();
        ctx.restore();
      }
    } else {
      // 2. [정통 기하학 쉐이프 모드] (꽃잎, 기와, 별 등 복합 레이어)
      const morph = bands.mid * 0.8;
      const splines = getMotifSplines(i, symmetry, morph);

      ctx.scale(radius, radius);
      
      // 스케일에 맞춰 선 굵기 보정
      ctx.lineWidth = Math.max(0.002, (settings.line * (0.7 + bands.mid * 0.5)) / radius);

      for (const sp of splines) {
        const pts = sp.pts;
        if (!pts || pts.length < 2) continue;

        ctx.beginPath();
        for (let k = 0; k < pts.length; k++) {
          if (k === 0) ctx.moveTo(pts[k][0], pts[k][1]);
          else ctx.lineTo(pts[k][0], pts[k][1]);
        }
        if (sp.closed) ctx.closePath();

        if (sp.closed) {
          const fillAlpha = Math.min(1.0, env * settings.fillAlpha);
          const rg = ctx.createRadialGradient(0, 0, 0.2, 0, 0, 1.0);
          rg.addColorStop(0, toRgbaStr(colorMain, fillAlpha * 0.3));
          rg.addColorStop(0.7, toRgbaStr(colorEdge, fillAlpha * 0.6));
          rg.addColorStop(1, toRgbaStr(colorMain, fillAlpha * 0.85));
          ctx.fillStyle = rg;
          ctx.fill();
        }
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  ctx.restore();
  requestAnimationFrame(render);
}

// ============================================================================
// 5. 안전한 DOM 이벤트 바인딩
// ============================================================================
document.addEventListener("DOMContentLoaded", () => {
  const audioPlayer = document.getElementById("audioPlayer");
  document.getElementById("audioInput")?.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    ensureAudioContext();
    const url = URL.createObjectURL(file);
    if (audioPlayer) {
      audioPlayer.src = url;
      audioPlayer.style.display = "block";
      audioPlayer.play();
    }
    if (audioCtx && audioPlayer && !audioPlayer.srcConnected) {
      const src = audioCtx.createMediaElementSource(audioPlayer);
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      audioPlayer.srcConnected = true;
    }
    audioMode = "FILE";
    const label = document.getElementById("audioModeLabel");
    if (label) label.textContent = "오디오: " + file.name.slice(0, 12);
  });

  document.getElementById("btnBreath")?.addEventListener("click", () => {
    if (audioPlayer) { audioPlayer.pause(); audioPlayer.style.display = "none"; }
    audioMode = "BREATH";
    const label = document.getElementById("audioModeLabel");
    if (label) label.textContent = "호흡 곡선";
  });

  document.getElementById("patternImageInput")?.addEventListener("change", (e) => {
    const files = e.target.files;
    if (!files.length) return;
    for (let file of files) {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => customImages.push(img);
    }
    const status = document.getElementById("imgStatus");
    if (status) status.textContent = `업로드된 이미지: ${customImages.length + files.length}장 (이미지 만다라 활성화!)`;
  });

  document.getElementById("btnClearImages")?.addEventListener("click", () => {
    customImages = [];
    const status = document.getElementById("imgStatus");
    if (status) status.textContent = "현재: 기본 정통 만다라 쉐이프 사용 중";
  });

  document.querySelectorAll(".theme-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentThemeKey = btn.dataset.theme;
      const themeName = document.getElementById("currentThemeName");
      if (themeName) themeName.textContent = THEMES[currentThemeKey].name;
    });
  });

  function bindRange(id, valId, key, suffix = "") {
    const el = document.getElementById(id);
    const valEl = document.getElementById(valId);
    if (!el) return;
    el.addEventListener("input", () => {
      settings[key] = parseFloat(el.value);
      if (valEl) valEl.textContent = el.value + suffix;
    });
  }
  bindRange("rngSymmetry", "valSymmetry", "symmetry", "분할");
  bindRange("rngRings", "valRings", "rings", "층");
  bindRange("rngSpeed", "valSpeed", "speed", "");
  bindRange("rngSpin", "valSpin", "spin", "");
  bindRange("rngLine", "valLine", "line", "");
  bindRange("rngFillAlpha", "valFillAlpha", "fillAlpha", "");

  function bindToggle(id, key) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener("click", () => {
      settings[key] = !settings[key];
      btn.classList.toggle("active", settings[key]);
    });
  }
  bindToggle("togGlow", "glow");
  bindToggle("togNega", "nega");

  // 녹화
  let mediaRecorder = null, recordedChunks = [];
  document.getElementById("btnRecord")?.addEventListener("click", () => {
    if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
    if (!canvas) return;
    const stream = canvas.captureStream(60);
    mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: 20_000_000 });
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: "video/webm" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `mandala_studio_${Date.now()}.webm`;
      a.click();
      const btn = document.getElementById("btnRecord");
      if (btn) btn.textContent = "⏺ 영상 녹화 시작";
    };
    mediaRecorder.start();
    const btn = document.getElementById("btnRecord");
    if (btn) btn.textContent = "⏹ 녹화 중지 및 저장";
  });

  document.getElementById("btnSnapshot")?.addEventListener("click", () => {
    if (!canvas) return;
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = `mandala_snapshot_${Date.now()}.png`;
    a.click();
  });

  requestAnimationFrame(render);
});
</script>
</body>
</html>
