<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무한만다라</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #100e0c; color: #f4efe6; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { display: flex; overflow: hidden; }
  canvas { flex: 1; width: 100%; height: 100%; display: block; }
  aside {
    width: 300px; height: 100%; overflow: auto; background: #1b1714; border-left: 1px solid #3a3128; padding: 16px 16px 28px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  p { margin: 0 0 14px; color: #b3a394; font-size: 13px; line-height: 1.45; }
  h2 { margin: 16px 0 8px; font-size: 11px; letter-spacing: 0.12em; color: #b3a394; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  button, label.file {
    height: 36px; border-radius: 8px; border: 1px solid #3a3128; background: #100e0c; color: #f4efe6;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  button.on, label.file { background: #e25b3a; color: #1a0d09; border-color: #e25b3a; font-weight: 600; }
  label.file { display: grid; place-items: center; }
  input[type="file"] { display: none; }
  label.row { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; font-size: 13px; }
  label.row span { display: flex; justify-content: space-between; color: #b3a394; }
  input[type="range"] { width: 100%; accent-color: #e25b3a; }
  audio { width: 100%; margin-top: 8px; }
  @media (max-width: 800px) {
    body { flex-direction: column; }
    aside { width: 100%; height: 42%; border-left: 0; border-top: 1px solid #3a3128; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<aside>
  <h1>무한만다라</h1>
  <p>깃허브 Pages에 <b>index.html</b>로 올리면 그대로 실행됩니다. MP3는 이 브라우저에서만 재생됩니다.</p>
  <h2>모양</h2>
  <div class="grid grid4" id="themes"></div>
  <h2>흐름</h2>
  <div class="grid">
    <button id="bloom" class="on" type="button">중심에서 피어남</button>
    <button id="inward" type="button">바깥에서 스러짐</button>
  </div>
  <h2>음악</h2>
  <label class="file">MP3 열기<input id="file" type="file" accept="audio/*"></label>
  <audio id="player" controls hidden></audio>
  <label class="row">반응 <span id="vSens">80</span><input id="sens" type="range" min="0" max="100" value="80"></label>
  <h2>생성</h2>
  <label class="row">속도 <span id="vSpeed">0.75</span><input id="speed" type="range" min="20" max="220" value="75"></label>
  <label class="row">밀도 <span id="vDensity">62</span><input id="density" type="range" min="5" max="100" value="62"></label>
  <label class="row">대칭 <span id="vSym">12</span><input id="sym" type="range" min="6" max="24" value="12"></label>
  <label class="row">회전 <span id="vSpin">0.18</span><input id="spin" type="range" min="0" max="140" value="18"></label>
</aside>
<script>
const TAU = Math.PI * 2;
const THEMES = [
  { id:"flower", name:"꽃잎", bg0:[255,250,247], bg1:[255,236,230], stroke:[86,108,106], fills:[[224,96,112],[244,168,166],[156,190,176],[232,120,132],[255,214,206]], fillAlpha:0.94, line:1.45, dark:false, stars:false, glow:null, vary:true, bands:["petal","bead","lotus","petal","scallop","leaf","sprig"] },
  { id:"ink", name:"선화", bg0:[250,247,242], bg1:[236,230,220], stroke:[28,28,32], fills:[[255,255,255],[246,242,234]], fillAlpha:0.2, line:1.7, dark:false, stars:false, glow:null, vary:false, bands:["petal","lotus","point","bead","petal","point","leaf"] },
  { id:"cosmic", name:"우주", bg0:[18,28,78], bg1:[6,8,28], stroke:[236,232,255], fills:[[186,156,236],[120,96,210],[236,228,255]], fillAlpha:0.16, line:1.35, dark:true, stars:true, glow:[150,120,230], vary:false, bands:["heart","bead","heart","petal","scallop","heart","lotus"] },
  { id:"henna", name:"헤나", bg0:[228,196,154], bg1:[206,164,116], stroke:[92,40,22], fills:[[150,68,36],[176,92,48],[112,46,26]], fillAlpha:0.28, line:1.55, dark:false, stars:false, glow:null, vary:false, bands:["swirl","bead","petal","swirl","scallop","bead","lotus"] },
  { id:"thangka", name:"불화", bg0:[186,58,30], bg1:[112,24,16], stroke:[48,22,12], fills:[[232,168,48],[214,78,36],[36,72,156],[236,206,130],[22,78,62]], fillAlpha:0.92, line:1.35, dark:true, stars:false, glow:[255,196,80], vary:true, bands:["lotus","palace","petal","bead","lotus","point","scallop"] },
  { id:"folk", name:"민화", bg0:[255,252,248], bg1:[255,236,214], stroke:[62,44,38], fills:[[206,42,52],[236,132,42],[236,196,56],[52,146,78],[52,104,196],[196,64,132]], fillAlpha:0.95, line:1.4, dark:false, stars:false, glow:null, vary:true, bands:["petal","leaf","point","bead","lotus","petal","sprig"] },
  { id:"leaf", name:"잎", bg0:[246,246,240], bg1:[226,232,222], stroke:[62,96,84], fills:[[196,106,116],[146,184,156],[84,132,112],[232,206,196]], fillAlpha:0.92, line:1.4, dark:false, stars:false, glow:null, vary:true, bands:["leaf","petal","bead","leaf","sprig","lotus","scallop"] },
  { id:"water", name:"물", bg0:[10,48,86], bg1:[4,16,36], stroke:[214,236,248], fills:[[36,150,198],[18,96,160],[186,224,236],[52,176,168]], fillAlpha:0.62, line:1.3, dark:true, stars:false, glow:[80,190,220], vary:true, bands:["petal","scallop","lotus","bead","heart","petal","point"] }
];
const params = { theme:"flower", flow:"bloom", symmetry:12, density:0.62, speed:0.75, spin:0.18, line:1.45, sensitivity:0.8 };
function rgba(c, a) { return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")"; }
function mix(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function smooth(e0, e1, x) { const t = Math.min(1, Math.max(0, (x-e0)/((e1-e0)||1))); return t*t*(3-2*t); }
function themeOf() { return THEMES.find(t => t.id === params.theme) || THEMES[0]; }

const view = {
  bands: [], stars: [], starKey: "", shapeKey: "", seq: 0, spawnAcc: 0, morph: 0.35, air: 0.15, kick: 0, time: 0,
  w: 1, h: 1, cx: 0, cy: 0, maxR: 120
};
function sig() { return params.theme + ":" + Math.round(params.symmetry) + ":" + params.density.toFixed(3); }
function petalCount() { let n = Math.max(6, Math.min(24, Math.round(params.symmetry))); return n % 2 ? n + 1 : n; }
function travel() { return 16 / Math.max(0.25, params.speed); }
function desired() { return Math.round(8 + params.density * 8); }
function reseed() {
  const theme = themeOf();
  view.bands = []; view.seq = 0; view.spawnAcc = 0; view.shapeKey = sig();
  const count = desired(), T = travel();
  for (let i = 0; i < count; i++) {
    view.bands.push({ kind: theme.bands[i % theme.bands.length], age: ((i+0.45)/count)*T, rot: (i*0.17)%0.4, spin: i%2? -1:1, slot: i });
    view.seq = i + 1;
  }
}
function birth(theme) {
  view.bands.push({ kind: theme.bands[view.seq % theme.bands.length], age: 0, rot: (view.seq%2)*0.18, spin: view.seq%2? -1:1, slot: view.seq });
  view.seq++;
}
function radiusOf(age, T) {
  const u = Math.min(1, age / T), inner = view.maxR * 0.1;
  return params.flow === "bloom" ? inner + (view.maxR-inner)*u : view.maxR - (view.maxR-inner)*u;
}
function env(age, T) {
  const u = age / T;
  return params.flow === "inward" ? smooth(0,0.05,u)*smooth(0,0.24,1-u) : smooth(0,0.05,u)*smooth(0,0.1,1-u);
}
function color(theme, slot, petal) {
  const i = theme.vary ? (slot + petal) % theme.fills.length : slot % theme.fills.length;
  return theme.fills[i];
}
function tracePetal(ctx, a, r0, r1, spread, bulge, kind) {

  const blx = Math.cos(a-spread)*r0, bly = Math.sin(a-spread)*r0;
  const brx = Math.cos(a+spread)*r0, bry = Math.sin(a+spread)*r0;
  const px = Math.cos(a+Math.PI/2)*bulge, py = Math.sin(a+Math.PI/2)*bulge;
  if (kind === "point") { ctx.moveTo(blx,bly); ctx.lineTo(tipX,tipY); ctx.lineTo(brx,bry); ctx.closePath(); return; }

    ctx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
    ctx.bezierCurveTo(blx+px*0.2, bly+py*0.2, Math.cos(a-spread*0.8)*(r0+(r1-r0)*0.7)+px, Math.sin(a-spread*0.8)*(r0+(r1-r0)*0.7)+py, Math.cos(a)*cleft, Math.sin(a)*cleft);
    ctx.bezierCurveTo(Math.cos(a+spread*0.8)*(r0+(r1-r0)*0.7)-px, Math.sin(a+spread*0.8)*(r0+(r1-r0)*0.7)-py, brx-px*0.2, bry-py*0.2, tipX, tipY);
    ctx.bezierCurveTo(Math.cos(a+spread*0.25)*(r1*0.92), Math.sin(a+spread*0.25)*(r1*0.92), brx, bry, Math.cos(a)*r0, Math.sin(a)*r0);
    ctx.closePath(); return;

  ctx.moveTo(blx, bly);
  ctx.bezierCurveTo(Math.cos(a-spread*0.35)*neck+px, Math.sin(a-spread*0.35)*neck+py, Math.cos(a)*(r0+(r1-r0)*0.86)+px*0.25, Math.sin(a)*(r0+(r1-r0)*0.86)+py*0.25, tipX, tipY);
  ctx.bezierCurveTo(Math.cos(a)*(r0+(r1-r0)*0.86)-px*0.25, Math.sin(a)*(r0+(r1-r0)*0.86)-py*0.25, Math.cos(a+spread*0.35)*neck-px, Math.sin(a+spread*0.35)*neck-py, brx, bry);
  ctx.closePath();
}
function vein(ctx, a, r0, r1, theme) {
  ctx.beginPath();
  ctx.moveTo(Math.cos(a)*(r0+(r1-r0)*0.12), Math.sin(a)*(r0+(r1-r0)*0.12));
  ctx.quadraticCurveTo(Math.cos(a+0.08)*(r0+(r1-r0)*0.55), Math.sin(a+0.08)*(r0+(r1-r0)*0.55), Math.cos(a)*(r0+(r1-r0)*0.84), Math.sin(a)*(r0+(r1-r0)*0.84));
  ctx.strokeStyle = rgba(theme.stroke, 0.65); ctx.stroke();
}
function petals(ctx, theme, band, radius, n, fat, kind) {
  const depth = kind==="point"?0.26:kind==="lotus"?0.22:kind==="heart"||kind==="leaf"?0.2:0.17;
  const r1 = radius, r0 = radius*(1-depth);
  const spread = (Math.PI/n)*(kind==="leaf"?0.62:kind==="point"?0.78:0.92)*fat;
  const bulge = (r1-r0)*(kind==="leaf"?0.28:0.42)*fat;
  for (let i = 0; i < n; i++) {
    const a = (i/n)*TAU - Math.PI/2;
    const fill = color(theme, band.slot, i);
    const inset = mix(fill, [255,255,255], theme.dark ? 0.08 : 0.35);
    ctx.beginPath(); tracePetal(ctx, a, r0, r1, spread, bulge, kind);
    ctx.fillStyle = rgba(fill, theme.fillAlpha); ctx.strokeStyle = rgba(theme.stroke, 0.95); ctx.fill(); ctx.stroke();
    ctx.beginPath(); tracePetal(ctx, a, r0+(r1-r0)*0.22, r0+(r1-r0)*0.78, spread*0.62, bulge*0.45, kind);
    ctx.fillStyle = rgba(inset, Math.min(1, theme.fillAlpha*0.85));
    ctx.strokeStyle = rgba(theme.stroke, theme.fillAlpha>0.5?0.45:0.85); ctx.fill(); ctx.stroke();
    vein(ctx, a, r0, r1, theme);

      const pr = r0+(r1-r0)*0.58;
      ctx.beginPath(); ctx.arc(Math.cos(a)*pr, Math.sin(a)*pr, Math.max(1.2,(r1-r0)*0.07), 0, TAU);
      ctx.fillStyle = rgba(theme.stroke, 0.8); ctx.fill();
    }
  }
  ctx.beginPath(); ctx.arc(0,0,r0,0,TAU); ctx.strokeStyle = rgba(theme.stroke, 0.55); ctx.stroke();
}
function paintBand(ctx, theme, band, radius, alpha, n, fat, lw) {
  ctx.save(); ctx.rotate(band.rot); ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.lineWidth = Math.max(0.8, lw*(0.55+radius/view.maxR)); ctx.globalAlpha = alpha;
  const kind = band.kind;
  if (kind === "bead") {
    const count = n*2, rad = Math.max(1.4, radius*0.028);
    ctx.beginPath(); ctx.arc(0,0,radius,0,TAU); ctx.strokeStyle = rgba(theme.stroke,0.45); ctx.stroke();
    for (let i=0;i<count;i++) {
      const a = (i/count)*TAU + band.rot;
      ctx.beginPath(); ctx.arc(Math.cos(a)*radius, Math.sin(a)*radius, i%2? rad*0.55:rad, 0, TAU);
      ctx.fillStyle = rgba(color(theme, band.slot, i), theme.fillAlpha); ctx.fill();
      ctx.strokeStyle = rgba(theme.stroke,0.8); ctx.stroke();
    }
  } else if (kind === "scallop") {
    const bowl = ((TAU*radius)/n)*0.48*fat;
    for (let i=0;i<n;i++) {
      const a = (i/n)*TAU;
      ctx.beginPath(); ctx.arc(Math.cos(a)*radius*0.9, Math.sin(a)*radius*0.9, bowl, a-Math.PI/2, a+Math.PI/2); ctx.closePath();
      ctx.fillStyle = rgba(color(theme, band.slot, i), theme.fillAlpha); ctx.strokeStyle = rgba(theme.stroke,0.9); ctx.fill(); ctx.stroke();
    }
  } else if (kind === "palace") {
    const s = radius*0.78; ctx.lineWidth = Math.max(lw,1.6); ctx.strokeStyle = rgba(theme.fills[0],0.95);
    ctx.strokeRect(-s,-s,s*2,s*2); const inner = s*0.72; ctx.strokeRect(-inner,-inner,inner*2,inner*2);
    const gw = s*0.22, gh = s*0.16; ctx.fillStyle = rgba(theme.fills[1], theme.fillAlpha);
    for (let k=0;k<4;k++) {
      ctx.save(); ctx.rotate(k*Math.PI/2);
      ctx.beginPath(); ctx.rect(-gw/2, -s-gh*0.15, gw, gh); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-gw/2,-s-gh*0.15); ctx.lineTo(0,-s-gh*1.15); ctx.lineTo(gw/2,-s-gh*0.15); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  } else if (kind === "sprig") {
    ctx.strokeStyle = rgba(theme.stroke,0.85); ctx.fillStyle = rgba(color(theme, band.slot, 0), theme.fillAlpha);
    for (let i=0;i<n;i++) {
      const a = (i/n)*TAU, x0 = Math.cos(a)*radius*0.92, y0 = Math.sin(a)*radius*0.92, x1 = Math.cos(a)*radius, y1 = Math.sin(a)*radius;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
      for (let k=0;k<3;k++) { const t=0.35+k*0.28; ctx.beginPath(); ctx.arc(x0+(x1-x0)*t, y0+(y1-y0)*t, Math.max(1,radius*0.012*(1.3-k*0.25)),0,TAU); ctx.fill(); ctx.stroke(); }
    }
  } else if (kind === "swirl") {
    petals(ctx, theme, band, radius, n, fat*0.85, "leaf");
    const r0 = radius*0.78;
    for (let i=0;i<n;i++) {
      const a = (i/n)*TAU - Math.PI/2; ctx.beginPath();
      for (let s=0;s<=10;s++) {
        const t=s/10, ang=a+t*3.4, rr=r0+(radius-r0)*(0.15+t*0.7);
        const x = Math.cos(ang)*rr*(0.25+t*0.08)+Math.cos(a)*radius*0.55;
        const y = Math.sin(ang)*rr*(0.25+t*0.08)+Math.sin(a)*radius*0.55;
        if (s===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = rgba(theme.stroke,0.9); ctx.stroke();
    }
  } else petals(ctx, theme, band, radius, n, fat, kind);
  ctx.restore();
}

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
let audioCtx = null, analyser = null, freq = null, mediaNode = null, live = false, beat = 0, prevBass = 0;
const player = document.getElementById("player");
function bands() {
  if (live && analyser && !player.paused) {
    analyser.getByteFrequencyData(freq);
    let b=0,m=0,h=0,e=0;
    const n = freq.length;
    for (let i=0;i<n;i++) { const v=freq[i]/255; e+=v; if(i<12)b+=v; else if(i<48)m+=v; else if(i<140)h+=v; }
    b = Math.min(1, b/12*1.4); m = Math.min(1, m/36); h = Math.min(1, h/92);
    const energy = Math.min(1, e/n*1.8);
    const edge = b > 0.62 && b > prevBass + 0.08; prevBass = b*0.8 + prevBass*0.2;
    return { bass:b, mid:m, high:h, energy, beatEdge:edge };
  }
  const t = view.time;
  const bass = 0.28 + 0.18*Math.sin(t*1.3);
  const mid = 0.32 + 0.16*Math.sin(t*0.7);
  return { bass, mid, high: 0.12, energy: bass*0.6+mid*0.4, beatEdge: false };
}
function step(dt, audio) {
  if (sig() !== view.shapeKey || !view.bands.length) reseed();
  view.time += dt;
  const follow = 1 - Math.exp(-dt*4);
  view.morph += (audio.mid - view.morph)*follow;
  view.air += (audio.high - view.air)*follow;
  view.kick *= Math.exp(-dt*4.5);
  if (audio.beatEdge) view.kick = 1;
  const theme = themeOf(), T = travel();
  const speedK = 0.72 + audio.energy * params.sensitivity * 1.35;
  const spinRate = (0.035 + params.spin*0.22) * (0.3 + view.air*params.sensitivity*2.4);
  for (const band of view.bands) { band.age += dt*speedK; band.rot += band.spin*spinRate*dt; }
  view.bands = view.bands.filter(b => b.age < T);
  const cap = desired()+2;
  const interval = T / desired() / (0.55 + audio.energy*params.sensitivity*1.5);
  view.spawnAcc += dt;
  let guard = 0;
  while (view.spawnAcc >= interval && view.bands.length < cap && guard < 3) { view.spawnAcc -= interval; birth(theme); guard++; }
  if (audio.beatEdge && view.bands.length < cap) birth(theme);
}
function draw(audio) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)) {
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  view.w = w; view.h = h; view.cx = w/2; view.cy = h/2; view.maxR = Math.max(90, Math.min(w,h)*0.46);
  const theme = themeOf();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  const g = ctx.createRadialGradient(view.cx, view.cy, view.maxR*0.15, view.cx, view.cy, Math.max(w,h)*0.75);

  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  if (theme.stars) {
    const key = w+"x"+h;
    if (key !== view.starKey) {
      view.starKey = key; view.stars = [];
      for (let i=0;i<90;i++) view.stars.push({ x: Math.random()*w, y: Math.random()*h, s: 0.4+Math.random()*1.5, ph: Math.random()*TAU });
    }
    for (const s of view.stars) {
      ctx.globalAlpha = (0.25+0.75*Math.abs(Math.sin(view.time*1.4+s.ph)))*(0.35+audio.high*0.65);
      ctx.fillStyle = "rgba(236,232,255,1)"; ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const T = travel(), n = petalCount();
  const fat = 0.78 + view.morph*params.sensitivity*0.7 + view.kick*0.12;
  const lw = params.line * theme.line * (0.85 + audio.bass*params.sensitivity*0.45);
  const painted = view.bands.map(band => ({ band, radius: radiusOf(band.age, T), alpha: env(band.age, T) }))
    .filter(it => it.alpha > 0.02 && it.radius > 8).sort((a,b) => b.radius - a.radius);
  ctx.save(); ctx.translate(view.cx, view.cy);
  const pulse = 1 + audio.bass*params.sensitivity*0.035 + view.kick*0.02;
  ctx.scale(pulse, pulse);
  if (theme.glow) {
    const gg = ctx.createRadialGradient(0,0,view.maxR*0.02,0,0,view.maxR*0.72);
    gg.addColorStop(0, rgba(theme.glow, 0.28+audio.bass*0.22)); gg.addColorStop(1, rgba(theme.glow, 0));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0,0,view.maxR,0,TAU); ctx.fill();
  }
  for (const it of painted) paintBand(ctx, theme, it.band, it.radius, it.alpha, n, fat, lw);
  const coreR = view.maxR*0.11*(1+audio.bass*params.sensitivity*0.22+view.kick*0.16);
  ctx.save(); ctx.lineWidth = Math.max(1, lw*0.8); ctx.rotate(view.time*0.08);
  petals(ctx, theme, {slot:1, rot:0}, coreR*2.15, Math.max(8, Math.min(12,n)), fat, "lotus");
  ctx.beginPath(); ctx.arc(0,0,coreR*0.42,0,TAU); ctx.fillStyle = rgba(theme.fills[0],1); ctx.strokeStyle = rgba(theme.stroke,1); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,coreR*0.16,0,TAU); ctx.fillStyle = rgba(theme.dark?[255,236,200]:theme.stroke, 0.9); ctx.fill();
  ctx.restore(); ctx.restore();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  const audio = bands(); step(dt, audio); draw(audio);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const themesEl = document.getElementById("themes");
THEMES.forEach(theme => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = theme.name;
  if (theme.id === params.theme) b.className = "on";
  b.onclick = () => { params.theme = theme.id; view.shapeKey = ""; [...themesEl.children].forEach(el => el.classList.toggle("on", el === b)); };
  themesEl.appendChild(b);
});
document.getElementById("bloom").onclick = () => { params.flow = "bloom"; bloom.className = "on"; inward.className = ""; };
document.getElementById("inward").onclick = () => { params.flow = "inward"; inward.className = "on"; bloom.className = ""; };
const bloom = document.getElementById("bloom"), inward = document.getElementById("inward");
function bind(id, out, map) {
  const el = document.getElementById(id);
  el.oninput = () => { const v = map(Number(el.value)); document.getElementById(out).textContent = typeof v === "number" && id !== "sym" && id !== "density" && id !== "sens" ? v.toFixed(2) : String(v); };
}
document.getElementById("sens").oninput = e => { params.sensitivity = e.target.value/100; vSens.textContent = e.target.value; };
document.getElementById("speed").oninput = e => { params.speed = e.target.value/100; vSpeed.textContent = params.speed.toFixed(2); view.shapeKey = ""; };
document.getElementById("density").oninput = e => { params.density = e.target.value/100; vDensity.textContent = e.target.value; view.shapeKey = ""; };
document.getElementById("sym").oninput = e => { params.symmetry = Number(e.target.value); vSym.textContent = e.target.value; view.shapeKey = ""; };
document.getElementById("spin").oninput = e => { params.spin = e.target.value/100; vSpin.textContent = params.spin.toFixed(2); };
document.getElementById("file").onchange = e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; freq = new Uint8Array(analyser.frequencyBinCount);
  }
  audioCtx.resume();
  player.src = URL.createObjectURL(file); player.hidden = false;
  if (!mediaNode) { mediaNode = audioCtx.createMediaElementSource(player); mediaNode.connect(analyser); analyser.connect(audioCtx.destination); }
  live = true; player.play();
};
