<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Tunnel v3.1 - Fixed Mandala</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050a;--bg2:#0f0f1a;--border:rgba(255,255,255,0.08);--fg:#f2f2ff;--fg2:#8a8aa8;--accent:#6ae4ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(90deg, rgba(106,228,255,0.08), rgba(255,100,200,0.08))}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;letter-spacing:-0.02em}
h1 b{background:linear-gradient(135deg,#6ae4ff,#b56aff,#ff8a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.main{flex:1;display:flex;min-height:0}
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(100% 100% at 50% 50%, #10112a 0%, #04050a 75%);min-width:0}
.box{aspect-ratio:16/9;width:100%;max-width:100%;max-height:100%;border-radius:18px;border:1px solid var(--border);overflow:hidden;position:relative;background:#000;box-shadow:0 20px 80px rgba(0,0,0,0.9)}
#canvas{width:100%;height:100%;display:block}
.controls{width:345px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:13px;overflow:auto}
.label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg2);font-weight:700;margin-bottom:6px}
.drop{border:1.5px dashed var(--border);border-radius:10px;padding:12px;text-align:center;cursor:pointer;position:relative}
.drop:hover{border-color:var(--accent);background:rgba(106,228,255,0.06)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.fname{font-size:10px;color:#6ae4ff;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.lab{width:58px;font-size:11px;color:var(--fg2);flex-shrink:0}
.row input[type=range]{flex:1;height:3px;-webkit-appearance:none;background:#22223a;border-radius:2px}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg)}
.val{width:30px;text-align:right;font-size:10px;color:var(--fg2);font-variant-numeric:tabular-nums}
.btn{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--fg2);font-size:11px;cursor:pointer}
.btn:hover{color:var(--fg);border-color:var(--fg2)}
.btn-play{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#6ae4ff,#b56aff);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 9px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--fg2);font-size:10px;cursor:pointer;line-height:1.2}
.chip.active{border-color:var(--accent);color:var(--accent);background:rgba(106,228,255,0.1)}
.meters{display:flex;gap:4px}
.meter-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.meter-bar{width:100%;height:40px;background:#1a1a2e;border-radius:3px;position:relative;overflow:hidden}
.meter-fill{position:absolute;bottom:0;left:0;right:0;border-radius:3px;transition:height .06s}
@media(max-width:760px){.main{flex-direction:column}.controls{width:100%;max-height:56vh;border-left:none;border-top:1px solid var(--border)}.canvas-wrap{min-height:300px}}
</style>
</head>
<body>
<header>
  <h1><b>INFINITE v3.1</b> · 완벽 만다라 · 16:9</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="count" style="font-size:11px;color:var(--fg2)">0 RINGS</span>
    <span id="time" style="font-size:11px;color:var(--fg2)">0:00.0</span>
  </div>
</header>
<div class="main">
  <div class="canvas-wrap">
    <div class="box" id="box"><canvas id="canvas"></canvas></div>
  </div>
  <div class="controls">
    <div>
      <div class="label">음악 — 만화경(Kaleidoscope) 엔진</div>
      <div class="drop" id="drop">
        <input type="file" id="file" accept="audio/*">
        <div style="font-size:18px">🎧</div>
        <div style="font-size:11px;color:var(--fg2)"><strong style="color:var(--fg)">MP3 드랍</strong><br>부채꼴 대칭·반복 완벽 적용</div>
        <div class="fname" id="fname">파일 없음 — 데모 모드</div>
      </div>
    </div>
    
    <!-- 이미지 매핑 추가 -->
    <div>
      <div class="label">이미지 매핑 (선택사항)</div>
      <div class="drop" id="imgDrop">
        <input type="file" id="imgFile" accept="image/*" multiple>
        <div style="font-size:14px">🖼️</div>
        <div style="font-size:10px;color:var(--fg2)"><strong style="color:var(--fg)">이미지 조각 매핑</strong></div>
        <div class="fname" id="imgFname">기본 정통 쉐이프 렌더링 중</div>
      </div>
      <div style="text-align:right; margin-top:4px;">
          <button class="btn" id="btnClearImg" style="font-size:9px; padding:2px 6px;">이미지 지우기</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;align-items:center; margin-top:8px;">
      <button class="btn-play" id="play">▶</button>
      <button class="btn" id="stop">■</button>
      <button class="btn" id="clear">CLEAR</button>
      <button class="btn" id="rec">● REC</button>
    </div>
    
    <div>
      <div class="label">생성 모드 — 정통 만다라 6종</div>
      <div class="chips">
        <button class="chip active" data-mode="mixed">복합 ALL</button>
        <button class="chip" data-mode="neon">네온 X</button>
        <button class="chip" data-mode="lace">레이스</button>
        <button class="chip" data-mode="flower">플라워</button>
        <button class="chip" data-mode="bloom">꽃/잎</button>
        <button class="chip" data-mode="giwa">기와/단청</button>
        <button class="chip" data-mode="buddha">불교/연꽃</button>
        <button class="chip" data-mode="fire">불꽃/마그마</button>
        <button class="chip" data-mode="water">물/방울</button>
        <button class="chip" data-mode="cloud">구름</button>
        <button class="chip" data-mode="random">완전랜덤</button>
      </div>
    </div>
    <div>
      <div class="label">주파수 매칭 / 터널</div>
      <div class="row"><span class="lab">대칭(Sym)</span><input type="range" id="sSymmetry" min="4" max="32" step="2" value="12"><span class="val" id="vSymmetry">12</span></div>
      <div class="row"><span class="lab">Bass 속도</span><input type="range" id="sBass" min="0" max="200" value="130"><span class="val" id="vBass">130</span></div>
      <div class="row"><span class="lab">생성간격</span><input type="range" id="sSpawn" min="10" max="200" value="70"><span class="val" id="vSpawn">70</span></div>
      <div class="row"><span class="lab">밀도</span><input type="range" id="sDensity" min="1" max="30" value="16"><span class="val" id="vDensity">16</span></div>
      <div class="row"><span class="lab">네온강도</span><input type="range" id="sGlow" min="0" max="200" value="110"><span class="val" id="vGlow">110</span></div>
    </div>
    <div class="meters">
      <div class="meter-col"><div class="meter-bar"><div class="meter-fill" id="mB" style="height:0%;background:linear-gradient(0deg,#6ae4ff,#2a8fff)"></div></div><div style="font-size:8px;color:var(--fg2)">BASS</div></div>
      <div class="meter-col"><div class="meter-bar"><div class="meter-fill" id="mM" style="height:0%;background:linear-gradient(0deg,#b56aff,#ff6aff)"></div></div><div style="font-size:8px;color:var(--fg2)">MID</div></div>
      <div class="meter-col"><div class="meter-bar"><div class="meter-fill" id="mH" style="height:0%;background:linear-gradient(0deg,#ff8a3a,#ffe27a)"></div></div><div style="font-size:8px;color:var(--fg2)">HIGH</div></div>
      <div class="meter-col"><div class="meter-bar"><div class="meter-fill" id="mBeat" style="height:0%;background:linear-gradient(0deg,#fff,#6ae4ff)"></div></div><div style="font-size:8px;color:var(--fg2)">BEAT</div></div>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('canvas');
const box=document.getElementById('box');
const ctx=canvas.getContext('2d');

let audioCtx, analyser, source, buf, freqData, playing=false, startTime=0, pauseOffset=0;
let bands={bass:0,mid:0,high:0,beat:0}, smooth={bass:0,mid:0,high:0,beat:0};
let mode='mixed';
let rotationGlobal=0;
let customImages = [];

const params={sym:12, bass:1.3, spawn:0.7, density:16, glow:1.1};

function resize(){
  const w=box.clientWidth,h=box.clientHeight,dpr=devicePixelRatio||1;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(box); resize();

function ensureCtx(){ 
  if(!audioCtx){ 
    audioCtx=new (window.AudioContext||window.webkitAudioContext)(); 
    analyser=audioCtx.createAnalyser(); 
    analyser.fftSize=1024; 
    freqData=new Uint8Array(analyser.frequencyBinCount); 
  } 
}

async function loadFile(file){
  ensureCtx(); document.getElementById('fname').textContent=file.name;
  const ab=await file.arrayBuffer(); buf=await audioCtx.decodeAudioData(ab); stop(true);
}

function play(){
  ensureCtx();
  if(!buf && !playing){ playing=true; startTime=audioCtx?audioCtx.currentTime:performance.now()/1000; document.getElementById('play').textContent='⏸'; return; }
  if(!buf) return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(source) try{source.stop()}catch(e){}
  source=audioCtx.createBufferSource(); source.buffer=buf; source.loop=false;
  source.connect(analyser); analyser.connect(audioCtx.destination);
  source.start(0,pauseOffset); source.onended=()=>{ if(playing) stop(false); };
  startTime=audioCtx.currentTime-pauseOffset; playing=true; document.getElementById('play').textContent='⏸';
}

function stop(isPause){
  if(source){ try{source.stop()}catch(e){} source=null; }
  if(audioCtx && isPause){ pauseOffset=audioCtx.currentTime-startTime; } else { pauseOffset=0; }
  if(!isPause){ playing=false; document.getElementById('play').textContent='▶'; }
}

let beatHist=[];
function updateBands(){
  if(analyser && playing && buf){
    analyser.getByteFrequencyData(freqData);
    const len=freqData.length;
    const avg=(s,e)=>{ let sum=0; for(let i=s;i<e;i++) sum+=freqData[i]; return sum/Math.max(1,e-s); };
    bands.bass=avg(0, Math.floor(len*0.08))/255;
    bands.mid=avg(Math.floor(len*0.08), Math.floor(len*0.35))/255;
    bands.high=avg(Math.floor(len*0.35), Math.floor(len*0.85))/255;
    beatHist.push(bands.bass); if(beatHist.length>18) beatHist.shift();
    const avgB=beatHist.length>0 ? beatHist.reduce((a,b)=>a+b,0)/beatHist.length : 0;
    bands.beat=Math.max(0,(bands.bass-avgB)*3.0);
  } else {
    const t=performance.now()*0.001;
    bands.bass=0.38+Math.sin(t*0.85)*0.22+Math.sin(t*1.7)*0.08;
    bands.mid=0.42+Math.sin(t*1.15+1)*0.18;
    bands.high=0.40+Math.sin(t*1.65+2)*0.20;
    bands.beat=Math.max(0,Math.sin(t*2.6)*0.55);
  }
  smooth.bass=smooth.bass*0.74+bands.bass*0.26;
  smooth.mid=smooth.mid*0.78+bands.mid*0.22;
  smooth.high=smooth.high*0.82+bands.high*0.18;
  smooth.beat=smooth.beat*0.62+bands.beat*0.38;
  
  document.getElementById('mB').style.height=(smooth.bass*100).toFixed(1)+'%';
  document.getElementById('mM').style.height=(smooth.mid*100).toFixed(1)+'%';
  document.getElementById('mH').style.height=(smooth.high*100).toFixed(1)+'%';
  document.getElementById('mBeat').style.height=(smooth.beat*100).toFixed(1)+'%';
  
  if(playing && audioCtx){
    const el=audioCtx.currentTime-startTime; const m=Math.floor(el/60); const s=el%60;
    document.getElementById('time').textContent=`${m}:${s.toFixed(1).padStart(4,'0')}`;
  }
}

// ─── TUNNEL SYSTEM v3.1 — Fixed scaleJitter bug ───
let mandalas=[];
let lastSpawn=0;
const ALL_MODES=['neon','lace','flower','bloom','giwa','buddha','fire','water','cloud'];

function spawnMandala(now){
  let typeMix;
  if(mode==='mixed' || mode==='random'){
    typeMix = ALL_MODES[Math.floor(Math.random()*ALL_MODES.length)];
  } else {
    typeMix=mode;
  }
  mandalas.push({
    birth:now,
    sym: params.sym, 
    rotOff:Math.random()*Math.PI*2,
    rotSpeed:(Math.random()*0.4+0.1)*(Math.random()>0.5?1:-1),
    hue:Math.random()*60-30,
    typeMix:typeMix,
    scaleJitter:0.85+Math.random()*0.35, // FIXED: This was missing in V3!
    seed:Math.random()*100,
  });
}

// ─── SHAPE DRAWING ENGINE ───

function neonStroke(x1,y1,x2,y2,color,w,glow){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.shadowBlur=14*glow; ctx.shadowColor=color; ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.shadowBlur=5*glow; ctx.lineWidth=w*0.45; ctx.strokeStyle='#fff'; ctx.globalAlpha=0.4; ctx.stroke();
  ctx.restore();
}

function drawNeonLayer(baseR,glow,alpha){
  const b=smooth.bass;
  for(let a=0;a<2;a++){
    const ang=(Math.PI*2*a)/2 + Math.PI/4;
    const perp=ang+Math.PI/2;
    for(let k=-1;k<=1;k++){
      const offX=Math.cos(perp)*k*10, offY=Math.sin(perp)*k*10;
      const x1=Math.cos(ang)*(baseR*0.15)+offX, y1=Math.sin(ang)*(baseR*0.15)+offY;
      const x2=Math.cos(ang)*(baseR*0.92 + b*8)+offX, y2=Math.sin(ang)*(baseR*0.92 + b*8)+offY;
      neonStroke(x1,y1,x2,y2,k===0?'#5de8ff':'#2ab6ff',2.0+b*1.0,glow);
    }
  }
}

function drawLaceLayer(baseR,glow,alpha){
  const h=smooth.high, m=smooth.mid;
  const ang = 0; 
  const r=baseR*0.58 + Math.sin(m*3)*6 + h*4;
  const x=Math.cos(ang)*r, y=Math.sin(ang)*r;
  const hue=180+80;
  ctx.fillStyle=`hsl(${hue},85%,${62+smooth.bass*8}%)`;
  ctx.shadowBlur=6*glow; ctx.shadowColor=`hsl(${hue},85%,60%)`;
  ctx.globalAlpha=alpha*(0.7+h*0.3);
  ctx.beginPath(); ctx.arc(x,y,1.5+h*2.2,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=alpha;
}

function drawFlowerLayer(baseR,glow,alpha){
  const b=smooth.bass;
  const r0=baseR*0.22, r1=baseR*0.95 + b*10;
  ctx.save(); 
  ctx.fillStyle='#3a9e3a'; ctx.shadowBlur=10*glow; ctx.shadowColor='#3a9e3a'; ctx.globalAlpha=alpha*0.85;
  ctx.beginPath(); ctx.moveTo(r0,0); ctx.bezierCurveTo((r0+r1)*0.5,-r1*0.38,(r0+r1)*0.5,r1*0.38,r0,0); ctx.closePath(); ctx.fill();
  const grad=ctx.createLinearGradient(r0,0,r1,0); grad.addColorStop(0,'#ffcc33'); grad.addColorStop(1,'#ff7a1a');
  ctx.fillStyle=grad; ctx.shadowColor='#ff8a1a';
  ctx.beginPath(); ctx.moveTo(r0+6,0); ctx.bezierCurveTo((r0+r1)*0.45,-12,(r0+r1)*0.7,-8,r1-6,0); ctx.bezierCurveTo((r0+r1)*0.7,8,(r0+r1)*0.45,12,r0+6,0); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha=alpha;
}

function drawBloomLayer(baseR,glow,alpha,seed){
  const b=smooth.bass, h=smooth.high;
  const r0=baseR*0.12, r1=baseR*0.92 + b*12;
  ctx.save();
  ctx.fillStyle='#2e7d32'; ctx.shadowBlur=8*glow; ctx.shadowColor='#2e7d32'; ctx.globalAlpha=alpha*0.9;
  ctx.beginPath(); ctx.moveTo(r0,0); ctx.quadraticCurveTo((r0+r1)*0.5,-r1*0.32,r1,0); ctx.quadraticCurveTo((r0+r1)*0.5,r1*0.32,r0,0); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=0.7; ctx.beginPath(); ctx.moveTo(r0,0); ctx.lineTo(r1,0); ctx.stroke();
  for(let k=0;k<2;k++){
    const rr1 = r1 - k*12;
    const grad=ctx.createLinearGradient(r0,0,rr1,0);
    grad.addColorStop(0, k===0?'#ffd1e8':'#ff8fc0'); grad.addColorStop(1, k===0?'#ff5ea8':'#ff2e8a');
    ctx.fillStyle=grad; ctx.shadowColor='#ff5ea8'; ctx.shadowBlur=10*glow; ctx.globalAlpha=alpha*0.92;
    const w = (k===0?0.28:0.18)*rr1;
    ctx.beginPath(); ctx.moveTo(r0+8,0); ctx.bezierCurveTo((r0+rr1)*0.4,-w,(r0+rr1)*0.7,-w*0.6,rr1,0); ctx.bezierCurveTo((r0+rr1)*0.7,w*0.6,(r0+rr1)*0.4,w,r0+8,0); ctx.fill();
  }
  ctx.restore();
  
  const x=Math.cos(0)*(baseR*0.16), y=Math.sin(0)*(baseR*0.16);
  ctx.fillStyle='#ffe27a'; ctx.shadowBlur=8*glow; ctx.shadowColor='#ffe27a'; ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.arc(x,y,2+h*2,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=alpha;
}

function drawGiwaLayer(baseR,glow,alpha,seed){
  const b=smooth.bass, m=smooth.mid;
  const dancheong=['#d33a2c','#1a6b4a','#f2b234','#1a4a8a','#7a3aa8'];
  const r0=baseR*0.55, r1=baseR*0.95 + b*10;
  ctx.save();
  ctx.strokeStyle=dancheong[0]; ctx.lineWidth=3+b*2; ctx.shadowBlur=8*glow; ctx.shadowColor=dancheong[0]; ctx.globalAlpha=alpha*0.9;
  ctx.beginPath(); ctx.moveTo(r0,-18); ctx.quadraticCurveTo((r0+r1)/2, -28 - m*8, r1, -14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r0,18); ctx.quadraticCurveTo((r0+r1)/2, 28 + m*8, r1, 14); ctx.stroke();
  for(let k=0;k<3;k++){
    const rr = r0 + k*(r1-r0)/3;
    ctx.fillStyle=dancheong[k%5]; ctx.globalAlpha=alpha*0.85; ctx.shadowBlur=6*glow; ctx.shadowColor=dancheong[k%5];
    ctx.beginPath(); ctx.arc(rr,0,10+b*4, -Math.PI/2, Math.PI/2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=0.8; ctx.globalAlpha=alpha*0.4; ctx.stroke();
  }
  ctx.restore();
  
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle='#e63946'; ctx.shadowBlur=10*glow; ctx.shadowColor='#e63946';
  ctx.beginPath(); ctx.arc(0,0,baseR*0.14, Math.PI/2, Math.PI*1.5); ctx.fill();
  ctx.fillStyle='#1a4a8a'; ctx.beginPath(); ctx.arc(0,0,baseR*0.14, -Math.PI/2, Math.PI/2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-baseR*0.07,baseR*0.035,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e63946'; ctx.beginPath(); ctx.arc(0,baseR*0.07,baseR*0.035,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha=alpha;
}

function drawBuddhaLayer(baseR,glow,alpha,seed){
  const b=smooth.bass, m=smooth.mid, h=smooth.high;
  for(let k=0;k<3;k++){
    const r=baseR*(0.68 + k*0.10) + b*8;
    ctx.strokeStyle=`rgba(255,215,0,${alpha*(0.8 - k*0.2)})`; ctx.lineWidth=1.8; ctx.shadowBlur=12*glow; ctx.shadowColor='#ffd700';
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  }
  const r0=baseR*0.18, r1=baseR*0.72 + b*10;
  ctx.save();
  const grad=ctx.createLinearGradient(r0,0,r1,0); grad.addColorStop(0,'#fff7cc'); grad.addColorStop(0.6,'#ffd700'); grad.addColorStop(1,'#ff8fc0');
  ctx.fillStyle=grad; ctx.shadowBlur=12*glow; ctx.shadowColor='#ffd700'; ctx.globalAlpha=alpha*0.95;
  ctx.beginPath(); ctx.moveTo(r0,0); ctx.bezierCurveTo((r0+r1)*0.4,-16,(r0+r1)*0.6,-12,r1,0); ctx.bezierCurveTo((r0+r1)*0.6,12,(r0+r1)*0.4,16,r0,0); ctx.fill();
  ctx.restore();
  
  const wheelR=baseR*0.22 + m*6;
  ctx.save(); ctx.rotate(rotationGlobal*0.8);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.shadowBlur=10*glow; ctx.shadowColor='#ffd700'; ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.arc(0,0,wheelR,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(wheelR, 0); ctx.stroke();
  ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(0,0,4+h*3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha=alpha;
}

function drawFireLayer(baseR,glow,alpha,seed){
  const b=smooth.bass, h=smooth.high, beat=smooth.beat;
  const t=performance.now()*0.001;
  const flick = Math.sin(t*6 + seed)*6;
  const r0=baseR*0.10, r1=baseR*0.95 + b*18 + flick + beat*10;
  ctx.save();
  const grad=ctx.createLinearGradient(r0,0,r1,0);
  grad.addColorStop(0,'#fff7ae'); grad.addColorStop(0.35,'#ff8c00'); grad.addColorStop(0.7,'#ff2d00'); grad.addColorStop(1,'#8a0f00');
  ctx.fillStyle=grad; ctx.shadowBlur=16*glow; ctx.shadowColor='#ff4400'; ctx.globalAlpha=alpha*0.92;
  ctx.beginPath(); ctx.moveTo(r0,0);
  ctx.bezierCurveTo((r0+r1)*0.3, -18 - flick, (r0+r1)*0.6, -14 + flick, r1,0);
  ctx.bezierCurveTo((r0+r1)*0.6, 14 - flick, (r0+r1)*0.3, 18 + flick, r0,0);
  ctx.fill();
  ctx.strokeStyle='rgba(255,220,0,0.7)'; ctx.lineWidth=1; ctx.globalAlpha=alpha*0.7;
  ctx.beginPath(); ctx.moveTo(r0+10,0); ctx.lineTo(r1*0.7, 0); ctx.stroke();
  ctx.restore();
  
  const r=baseR*0.55;
  const x=Math.cos(0.4)*r + Math.sin(t*1.2)*6, y=Math.sin(0.4)*r + Math.cos(t*1.1)*6;
  const g2=ctx.createRadialGradient(x,y,0,x,y,18+h*8);
  g2.addColorStop(0,`rgba(180,180,180,${alpha*0.22})`); g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(x,y,18+h*8,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=alpha;
}

function drawWaterLayer(baseR,glow,alpha,seed){
  const b=smooth.bass, h=smooth.high;
  const t=performance.now()*0.001;
  for(let k=0;k<3;k++){
    const r=baseR*(0.35 + k*0.22) + Math.sin(t*2 + k)*4 + b*8;
    ctx.strokeStyle=`rgba(106,228,255,${alpha*(0.7 - k*0.15)})`; ctx.lineWidth=1.6 + b*1.5; ctx.shadowBlur=10*glow; ctx.shadowColor='#6ae4ff';
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  }
  const r=baseR*0.70 + b*10;
  const s=6 + b*6 + Math.sin(t*3)*2;
  const grad=ctx.createRadialGradient(r-s*0.3,-s*0.3,0,r,0,s*1.4);
  grad.addColorStop(0,'#e0f7ff'); grad.addColorStop(0.4,'#6ae4ff'); grad.addColorStop(1,'#0a5a9a');
  ctx.fillStyle=grad; ctx.shadowBlur=10*glow; ctx.shadowColor='#6ae4ff'; ctx.globalAlpha=alpha*0.95;
  ctx.beginPath(); ctx.arc(r,0,s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(r-s*0.3,-s*0.3,s*0.25,0,Math.PI*2); ctx.fill();
  
  const rr=baseR*0.25 + ((t*20) % (baseR*0.5));
  ctx.strokeStyle=`rgba(255,255,255,${alpha*0.5})`; ctx.lineWidth=1; ctx.globalAlpha=alpha*0.6;
  ctx.beginPath(); ctx.arc(rr, - (t*8 % 10),2+h*2,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=alpha;
}

function drawCloudLayer(baseR,glow,alpha,seed){
  const b=smooth.bass, h=smooth.high;
  const t=performance.now()*0.001;
  const r=baseR*0.62 + b*8;
  const puffs=4;
  for(let p=0;p<puffs;p++){
    const px=r + (p-1.5)*10, py=Math.sin(p*1.5 + seed)*6;
    const s=10 + b*8 + (p===1?4:0);
    const col=`rgba(255,255,255,${alpha*0.85})`;
    ctx.fillStyle=col; ctx.shadowBlur=8*glow; ctx.shadowColor=col; ctx.globalAlpha=alpha*0.9;
    ctx.beginPath(); ctx.arc(px,py,s,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=alpha;
}

// ─── COMPOSITE DISPATCH & KALEIDOSCOPE SYMMETRY ───
function drawCompositeMandala(cx,cy,scale,rot,sym,hueShift,typeMix,alpha,glow,seed){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);
  
  const baseR = scale; 
  const sliceAngle = (Math.PI * 2) / sym;
  
  // 만화경(Kaleidoscope) 대칭 렌더링
  for(let i=0; i<sym; i++){
    ctx.save();
    ctx.rotate(sliceAngle * i);
    
    // 만다라 대칭 (짝수 조각은 거울 반전)
    if(i%2===1){ ctx.scale(1, -1); }
    
    // 부채꼴 클리핑 영역
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0, 0, baseR*1.2, -sliceAngle*0.5, sliceAngle*0.5);
    ctx.closePath();
    ctx.clip();
    
    // 사용자 이미지 매핑
    if(customImages.length > 0){
        const img = customImages[i % customImages.length];
        ctx.globalAlpha = alpha;
        // 이미지가 중앙에서 퍼져나가도록 스케일
        ctx.save();
        ctx.scale(scale*0.003, scale*0.003); // baseR에 비례
        ctx.drawImage(img, -img.width/2, -img.height/2);
        ctx.restore();
    } else {
        // 정통 쉐이프
        if(typeMix==='neon') drawNeonLayer(baseR,glow,alpha);
        else if(typeMix==='lace') drawLaceLayer(baseR,glow,alpha);
        else if(typeMix==='flower') drawFlowerLayer(baseR,glow,alpha);
        else if(typeMix==='bloom') drawBloomLayer(baseR,glow,alpha,seed);
        else if(typeMix==='giwa') drawGiwaLayer(baseR,glow,alpha,seed);
        else if(typeMix==='buddha') drawBuddhaLayer(baseR,glow,alpha,seed);
        else if(typeMix==='fire') drawFireLayer(baseR,glow,alpha,seed);
        else if(typeMix==='water') drawWaterLayer(baseR,glow,alpha,seed);
        else if(typeMix==='cloud') drawCloudLayer(baseR,glow,alpha,seed);
    }
    
    ctx.restore();
  }
  
  // 공통 코어 (가운데 빛)
  const coreR=baseR*0.035 + smooth.beat*baseR*0.06 + smooth.high*2;
  ctx.fillStyle='#ff4fbf'; ctx.shadowBlur=12*glow; ctx.shadowColor='#ff4fbf'; ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.arc(0,0,coreR,0,Math.PI*2); ctx.fill();
  
  ctx.restore();
}

let last=performance.now();
function loop(ts){
  requestAnimationFrame(loop);
  const now=ts/1000;
  const dt=Math.min((ts-last)/1000,0.1); last=ts;
  updateBands();
  
  const W=box.clientWidth, H=box.clientHeight;
  const cx=W/2, cy=H/2;
  const minDim=Math.min(W,H);
  const diag=Math.hypot(W/2,H/2);
  
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(0,0,W,H);
  
  rotationGlobal += (0.004 + smooth.mid*0.02)*0.8 + smooth.beat*0.03;
  
  const spawnInterval = Math.max(0.08, (0.9 - smooth.bass*0.5 - smooth.beat*0.6) * params.spawn);
  if(now - lastSpawn > spawnInterval || smooth.beat>0.35){
    spawnMandala(now); lastSpawn=now;
  }
  if(mandalas.length < params.density*0.4 && now - lastSpawn > 0.12){
    spawnMandala(now); lastSpawn=now;
  }
  if(mandalas.length > params.density + 12){
    mandalas.splice(0, mandalas.length - (params.density+12));
  }
  
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  
  for(let idx=0; idx<mandalas.length; idx++){
    const m=mandalas[idx];
    const age=now - m.birth;
    
    // 무한 줌인 효과
    // m.scaleJitter가 항상 숫자를 갖도록 보완 (안전장치)
    const scaleJ = m.scaleJitter !== undefined ? m.scaleJitter : 1.0;
    const speed = (0.22 + smooth.bass*params.bass*0.55 + smooth.beat*0.35) * scaleJ;
    // 반지름
    const baseR = (10 + age*speed*120); 
    
    if(baseR > diag + 100){ m.toRemove=true; continue; }
    
    let alpha;
    if(age < 0.25) alpha = age/0.25;
    else {
      const fadeStart = diag*0.70;
      const fadeEnd = diag + 80;
      if(baseR < fadeStart) alpha = 1.0;
      else alpha = 1.0 - (baseR - fadeStart)/(fadeEnd - fadeStart);
      alpha = Math.max(0, Math.min(1, alpha));
    }
    if(alpha<=0.01) { if(baseR>diag) m.toRemove=true; continue; }
    
    const rot = m.rotOff + age*m.rotSpeed + rotationGlobal*(0.3 + smooth.mid*0.4);
    
    drawCompositeMandala(cx,cy, baseR, rot, m.sym, m.hue, m.typeMix, alpha, params.glow, m.seed);
  }
  ctx.restore();
  
  mandalas = mandalas.filter(m=>!m.toRemove);
  document.getElementById('count').textContent=`${mandalas.length} RINGS`;
}
requestAnimationFrame(loop);

let recorder=null, chunks=[];
document.getElementById('rec').addEventListener('click', ()=>{
  if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
  const stream=canvas.captureStream(30);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000}); chunks=[];
  recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`infinite-mandala-v3-kaleidoscope.webm`; a.click(); document.getElementById('rec').textContent='● REC'; };
  recorder.start(100); document.getElementById('rec').textContent='■ STOP';
  if(!playing) play();
});
