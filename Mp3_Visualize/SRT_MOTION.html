<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Calligraphy Gapless Masterpiece</title>
    <!-- 정통 붓글씨 및 캘리그라피 서체 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Brush+Script&family=Yeon+Sung&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0b0b0d;
            color: #eee;
            font-family: 'Nanum Brush Script', cursive;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 상단 관제탑 컨트롤 바 */
        #control-panel {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 24, 0.94);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 8px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .btn {
            background: #28282e;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 13px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }
        .btn:hover {
            background: #3c3c46;
        }
        .btn-primary {
            background: #b5894b;
            color: #120e09;
            font-weight: 700;
            border: none;
        }
        .btn-primary:hover {
            background: #caa062;
        }
        .btn-preview.active {
            background: #962d22;
            color: #fff;
            border-color: #c0392b;
        }
        .text-input {
            background: #1c1c22;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 8px;
            border-radius: 12px;
            font-size: 12px;
            width: 85px;
            outline: none;
            text-align: center;
        }
        .text-input:focus {
            border-color: #b5894b;
        }
        select.font-select {
            background: #28282e;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 8px;
            border-radius: 14px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #bbb;
        }
        .slider-group input[type="range"] {
            width: 80px;
            cursor: pointer;
            accent-color: #b5894b;
        }
        .file-label {
            font-size: 12px;
            color: #bbb;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
        #time-display {
            font-size: 12px;
            font-family: monospace;
            color: #888;
            min-width: 75px;
            text-align: center;
        }
        #preview-badge {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(150, 45, 34, 0.88);
            color: #fff;
            padding: 5px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-family: sans-serif;
            letter-spacing: 1px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <button id="btn-play" class="btn btn-primary">▶ 재생</button>
        <button id="btn-preview" class="btn btn-preview">👁️ 최종본 미리보기</button>
        <button id="btn-reset" class="btn">처음으로</button>

        <input type="text" id="title-input" class="text-input" value="별 헤는 밤" placeholder="제목">
        <input type="text" id="author-input" class="text-input" value="윤동주 詩" placeholder="글쓴이">

        <select id="font-select" class="font-select">
            <option value="'Nanum Brush Script', cursive" selected>나눔 붓글씨체</option>
            <option value="'East Sea Dokdo', cursive">독도 필묵체</option>
            <option value="'Yeon Sung', cursive">연성체</option>
        </select>

        <div class="slider-group" title="글자 크기 및 여백 미세 조절">
            <span>크기</span>
            <input type="range" id="scale-slider" min="0.6" max="1.3" step="0.02" value="0.95">
        </div>
        
        <label class="file-label btn" title="MP3 오디오 선택">
            🎵 MP3
            <input type="file" id="audio-input" accept="audio/*">
        </label>
        
        <label class="file-label btn" title="SRT 자막 선택">
            📜 SRT
            <input type="file" id="srt-input" accept=".srt">
        </label>

        <span id="time-display">00:00 / 00:00</span>
    </div>

    <div id="preview-badge">무여백 무충돌 캘리그라피 깜지 최종본</div>
    <div id="canvas-container"></div>

    <script>
        const DEFAULT_DEMO_SRT = `
1
00:00:01,000 --> 00:00:03,800
나가는 눈길은 수평선 저쪽까지 깃폭처럼 퍼덕이고

2
00:00:04,100 --> 00:00:07,000
바나나 껍질로 바다를 놀려대노니

3
00:00:07,300 --> 00:00:10,200
설마 죽을라구요 굽어보는 물굽이

4
00:00:10,500 --> 00:00:13,300
그대는 바람 보고 꾸짖는 철없는 짓

5
00:00:13,600 --> 00:00:16,500
치마폭에 싸서 날려 보낸다

6
00:00:16,800 --> 00:00:19,600
하이야 솟구치는 백열의 숨결

7
00:00:19,900 --> 00:00:22,700
배는 화물창 짐승처럼 짖으며 물길을 가르고

8
00:00:23,000 --> 00:00:25,900
검은 해적 같은 외딴 섬이 지나간다

9
00:00:26,200 --> 00:00:29,200
흩어져 날으는 갈매기 떼 날개 뒤로 짠 바람이 분다

10
00:00:29,500 --> 00:00:32,500
발자국마다 고운 피가 고이고

11
00:00:32,800 --> 00:00:35,800
별 하나에 추억과 사랑을 실어 보낸다

12
00:00:36,100 --> 00:00:39,000
쉬이 아침이 오면 바다는 푸른 먹물이 되고

13
00:00:39,300 --> 00:00:43,000
우리의 모든 노래는 지면 위에 영원히 남으리라
        `.trim();

        function parseSRT(data) {
            const pattern = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\n{2,}|\n*$)/g;
            const list = [];
            let match;
            function toSeconds(t) {
                const p = t.replace(',', '.').split(':');
                return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
            }
            while ((match = pattern.exec(data)) !== null) {
                list.push({
                    index: parseInt(match[1]),
                    startTime: toSeconds(match[2]),
                    endTime: toSeconds(match[3]),
                    text: match[4].replace(/\r?\n/g, ' ').trim()
                });
            }
            return list;
        }

        class MasterDenseCalligraphyEngine {
            constructor(container) {
                this.container = container;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.container.appendChild(this.canvas);

                this.audioCtx = null;
                this.audioElement = new Audio();
                this.audioElement.crossOrigin = "anonymous";
                this.analyser = null;
                this.audioSource = null;
                this.freqData = null;
                this.isDemoMode = true;

                this.currentTime = 0;
                this.duration = 45;
                this.isPlaying = false;
                this.isPreviewMode = false;

                this.titleText = "별 헤는 밤";
                this.authorText = "윤동주 詩";
                this.userFontScale = 0.95; // 황금 안전 폰트 스케일

                this.srtList = [];
                this.charItems = [];
                this.isLayoutCalculated = false;

                this.allFinished = false;
                this.finalInkProgress = 0;
                this.currentFont = "'Nanum Brush Script', cursive";

                this.a4Rect = { x: 0, y: 0, w: 0, h: 0 };
                this.centerOval = { cx: 0, cy: 0, rx: 0, ry: 0 };

                this.paperNoise = document.createElement('canvas');
                this.buildPaperNoise();

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => {
                    this.resize();
                    this.buildPaperNoise();
                });

                document.fonts.ready.then(() => {
                    this.isLayoutCalculated = false;
                });

                this.loadSRT(DEFAULT_DEMO_SRT);
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            resize() {
                const w = this.canvas.width = window.innerWidth;
                const h = this.canvas.height = window.innerHeight;

                const a4Aspect = 1 / 1.4142;
                let paperH = h * 0.90;
                let paperW = paperH * a4Aspect;

                if (paperW > w * 0.90) {
                    paperW = w * 0.90;
                    paperH = paperW / a4Aspect;
                }

                this.a4Rect = {
                    x: (w - paperW) / 2,
                    y: (h - paperH) / 2,
                    w: paperW,
                    h: paperH
                };

                // 중앙 타원 크기 (텍스트 영역 황금비 확보)
                this.centerOval = {
                    cx: this.a4Rect.x + this.a4Rect.w / 2,
                    cy: this.a4Rect.y + this.a4Rect.h / 2,
                    rx: this.a4Rect.w * 0.24,
                    ry: this.a4Rect.h * 0.135
                };

                this.isLayoutCalculated = false;
            }

            buildPaperNoise() {
                this.paperNoise.width = 256;
                this.paperNoise.height = 256;
                const pctx = this.paperNoise.getContext('2d');
                const img = pctx.createImageData(256, 256);
                for (let i = 0; i < img.data.length; i += 4) {
                    const grain = (Math.random() - 0.5) * 18;
                    img.data[i] = 247 + grain;
                    img.data[i + 1] = 244 + grain;
                    img.data[i + 2] = 237 + grain;
                    img.data[i + 3] = 255;
                }
                pctx.putImageData(img, 0, 0);
            }

            loadSRT(text) {
                this.srtList = parseSRT(text);
                if (this.srtList.length > 0) {
                    this.duration = this.srtList[this.srtList.length - 1].endTime + 3.0;
                }
                this.reset();
            }

            setFont(fontStr) {
                this.currentFont = fontStr;
                this.isLayoutCalculated = false;
            }

            setFontScale(scale) {
                this.userFontScale = scale;
                this.isLayoutCalculated = false;
            }

            togglePreview() {
                this.isPreviewMode = !this.isPreviewMode;
                const badge = document.getElementById('preview-badge');
                const btn = document.getElementById('btn-preview');
                if (this.isPreviewMode) {
                    badge.style.display = 'block';
                    btn.classList.add('active');
                } else {
                    badge.style.display = 'none';
                    btn.classList.remove('active');
                }
            }

            /**
             * [무여백 무충돌 등면적 타일링 알고리즘]
             * 1. A4 가용 면적 / 전체 글자 수 = 한 글자의 이상적 면적(S) 도출
             * 2. 링 개수를 적정 수치(4~6개)로 제어하여 글자 크기를 35px 이상으로 대폭 확대
             * 3. 벽돌형 엇갈림(Staggered) 배치로 방사형 흰색 틈새 원천 제거
             */
            computeGaplessLayout() {
                if (!this.srtList || this.srtList.length === 0) return;

                // 공백 제외 전체 순수 글자 추출
                const allCharacters = [];
                this.srtList.forEach(line => {
                    const str = line.text.replace(/\s+/g, '');
                    for (let i = 0; i < str.length; i++) {
                        allCharacters.push({
                            char: str[i],
                            lineIndex: line.index,
                            startTime: line.startTime,
                            endTime: line.endTime
                        });
                    }
                });

                const totalN = allCharacters.length;
                if (totalN === 0) return;

                const cx = this.centerOval.cx;
                const cy = this.centerOval.cy;
                const rx0 = this.centerOval.rx;
                const ry0 = this.centerOval.ry;

                const pad = this.a4Rect.w * 0.035;
                const hw = (this.a4Rect.w / 2) - pad;
                const hh = (this.a4Rect.h / 2) - pad;

                const getR_In = (phi) => {
                    return (rx0 * ry0) / Math.sqrt(Math.pow(ry0 * Math.cos(phi), 2) + Math.pow(rx0 * Math.sin(phi), 2));
                };
                const getR_Out = (phi) => {
                    const cosP = Math.abs(Math.cos(phi)) + 1e-6;
                    const sinP = Math.abs(Math.sin(phi)) + 1e-6;
                    return Math.min(hw / cosP, hh / sinP);
                };

                // A4 가용 면적 연산 및 이상적 정사각형 셀 크기(S) 산출
                const a4Area = this.a4Rect.w * this.a4Rect.h;
                const ovalArea = Math.PI * rx0 * ry0;
                const usableArea = (a4Area - ovalArea) * 0.88;
                const idealCellSize = Math.sqrt(usableArea / totalN);

                // 방사형 평균 깊이 및 최적 링 개수 도출 (여백 과다 방지를 위해 링 수를 4~7개로 제한)
                const radialDepth = ((hw - rx0) + (hh - ry0)) / 2;
                const ringCount = Math.max(3, Math.min(7, Math.round(radialDepth / idealCellSize)));

                // 각 링의 둘레 실측
                const ringPerimeters = [];
                for (let k = 0; k < ringCount; k++) {
                    const u = (k + 0.5) / ringCount;
                    let peri = 0, px = 0, py = 0;
                    const steps = 72;
                    for (let j = 0; j <= steps; j++) {
                        const phi = (j / steps) * Math.PI * 2;
                        const rIn = getR_In(phi) * 1.05;
                        const rOut = getR_Out(phi) * 0.99;
                        const r = rIn + u * (rOut - rIn);
                        const x = cx + r * Math.cos(phi);
                        const y = cy + r * Math.sin(phi);
                        if (j > 0) peri += Math.hypot(x - px, y - py);
                        px = x;
                        py = y;
                    }
                    ringPerimeters.push(peri);
                }

                const totalPerimeter = ringPerimeters.reduce((a, b) => a + b, 0);

                // 둘레 비율에 맞추어 각 링에 글자 수 배분
                const ringCapacities = ringPerimeters.map(p => Math.max(1, Math.round(totalN * (p / totalPerimeter))));
                let diff = totalN - ringCapacities.reduce((a, b) => a + b, 0);
                ringCapacities[ringCapacities.length - 1] += diff;

                // 링 두께
                const ringThickness = radialDepth / ringCount;

                let charPointer = 0;
                this.charItems = [];

                for (let k = 0; k < ringCount; k++) {
                    const countOnRing = ringCapacities[k];
                    const u = (k + 0.5) / ringCount;
                    const peri = ringPerimeters[k];

                    // 각 링에서의 글자당 호 길이
                    const charArcStep = peri / countOnRing;

                    // 글자 칸은 꽉 차되, 실제 획은 겹치지 않는 안전 폰트 크기 계산
                    const slotSize = Math.min(charArcStep, ringThickness);
                    // 폰트 크기를 슬롯 크기에 거의 육박(0.92)하게 키워 빈틈을 완전히 메움
                    const finalFontSize = slotSize * 0.92 * this.userFontScale;

                    // [핵심] 짝수/홀수 링을 반 칸씩 엇갈리게(Staggered) 회전시켜 방사형 빈틈 통로를 완전히 차단
                    const staggerOffset = (k % 2 === 1) ? (Math.PI / countOnRing) : 0;

                    for (let i = 0; i < countOnRing; i++) {
                        if (charPointer >= totalN) break;
                        const item = allCharacters[charPointer];

                        // 12시 방향부터 회전 배치 + 엇갈림 오프셋
                        const phi = (i / countOnRing) * Math.PI * 2 - Math.PI / 2 + staggerOffset;

                        const rIn = getR_In(phi) * 1.05;
                        const rOut = getR_Out(phi) * 0.99;
                        const r = rIn + u * (rOut - rIn);

                        const targetX = cx + r * Math.cos(phi);
                        const targetY = cy + r * Math.sin(phi);

                        // 접선 회전각 계산
                        const delta = 0.008;
                        const rA = rIn + u * (getR_Out(phi - delta) - rIn);
                        const rB = rIn + u * (getR_Out(phi + delta) - rIn);
                        const xA = cx + rA * Math.cos(phi - delta);
                        const yA = cy + rA * Math.sin(phi - delta);
                        const xB = cx + rB * Math.cos(phi + delta);
                        const yB = cy + rB * Math.sin(phi + delta);

                        let tangentAngle = Math.atan2(yB - yA, xB - xA);

                        // 글자 뒤집힘 방지 (-90도 ~ +90도)
                        if (tangentAngle > Math.PI / 2) tangentAngle -= Math.PI;
                        if (tangentAngle < -Math.PI / 2) tangentAngle += Math.PI;

                        // 서예의 자연스러운 미세 틸트
                        const tilt = (((charPointer * 13) % 9) - 4) * (Math.PI / 180);

                        this.charItems.push({
                            char: item.char,
                            lineIndex: item.lineIndex,
                            startTime: item.startTime,
                            endTime: item.endTime,
                            targetX: targetX,
                            targetY: targetY,
                            targetAngle: tangentAngle + tilt,
                            targetSize: finalFontSize,
                            state: 'WAITING',
                            flyProgress: 0,
                            baseAlpha: 0.18
                        });

                        charPointer++;
                    }
                }

                this.isLayoutCalculated = true;
            }

            setupAudio(file) {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                this.audioElement.src = URL.createObjectURL(file);
                if (!this.audioSource) {
                    this.audioSource = this.audioCtx.createMediaElementSource(this.audioElement);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64;
                    this.audioSource.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                }
                this.isDemoMode = false;
                this.audioElement.onloadedmetadata = () => {
                    this.duration = this.audioElement.duration;
                };
            }

            play() {
                if (this.isPreviewMode) this.togglePreview();
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;
                if (!this.isDemoMode) {
                    this.audioElement.play();
                }
            }

            pause() {
                this.isPlaying = false;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                }
            }

            reset() {
                this.currentTime = 0;
                this.isPlaying = false;
                this.allFinished = false;
                this.finalInkProgress = 0;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                    this.audioElement.currentTime = 0;
                }
                this.computeGaplessLayout();
            }

            getRMS() {
                if (!this.isPlaying) return 0;
                if (!this.isDemoMode && this.analyser) {
                    this.analyser.getByteFrequencyData(this.freqData);
                    let sum = 0;
                    for (let i = 0; i < this.freqData.length; i++) sum += this.freqData[i];
                    return (sum / this.freqData.length) / 255;
                } else {
                    return (Math.sin(this.currentTime * 4.2) * 0.5 + 0.5) * 0.35;
                }
            }

            easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            loop() {
                if (this.isPlaying && !this.isPreviewMode) {
                    if (this.isDemoMode) {
                        this.currentTime += 1 / 60;
                        if (this.currentTime >= this.duration) {
                            this.currentTime = this.duration;
                            this.isPlaying = false;
                        }
                    } else {
                        this.currentTime = this.audioElement.currentTime;
                        if (this.audioElement.ended) this.isPlaying = false;
                    }
                }

                if (!this.isLayoutCalculated) {
                    this.computeGaplessLayout();
                }

                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 1. 화선지 배경
                this.renderBackground(ctx);

                const rms = this.getRMS();
                let stampedCount = 0;

                // 2. 글자 상태 갱신
                this.charItems.forEach(item => {
                    if (this.currentTime < item.startTime) {
                        item.state = 'WAITING';
                    } else if (this.currentTime >= item.startTime && this.currentTime <= item.endTime) {
                        item.state = 'ACTIVE';
                    } else if (this.currentTime > item.endTime) {
                        if (item.state === 'ACTIVE') {
                            item.state = 'FLYING';
                            item.flyProgress = 0;
                        } else if (item.state === 'FLYING') {
                            item.flyProgress += 0.038;
                            if (item.flyProgress >= 1.0) {
                                item.flyProgress = 1.0;
                                item.state = 'STAMPED';
                            }
                        }
                        if (item.state === 'STAMPED') {
                            stampedCount++;
                        }
                    }
                });

                if (this.charItems.length > 0 && stampedCount === this.charItems.length) {
                    this.allFinished = true;
                }

                // 완성 먹색 트랜지션
                if (this.isPreviewMode) {
                    this.finalInkProgress = 1.0;
                } else if (this.allFinished) {
                    this.finalInkProgress = Math.min(1.0, this.finalInkProgress + 0.008);
                }

                // 3. 지면 안착 레이어 (무여백 깜지)
                this.renderStampedLayer(ctx);

                // 4. 날아가는 글자 레이어 (Flying)
                if (!this.isPreviewMode) {
                    this.renderFlyingLayer(ctx);
                }

                // 5. 중앙 타원 영역 (상하 분리)
                this.renderCenterOvalZone(ctx, rms);

                this.updateUI();
                requestAnimationFrame(this.loop);
            }

            renderBackground(ctx) {
                ctx.fillStyle = "#0a0a0c";
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                ctx.save();
                ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
                ctx.shadowBlur = 45;
                ctx.shadowOffsetY = 18;

                ctx.fillStyle = "#f6f3ea";
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();

                ctx.save();
                ctx.globalCompositeOperation = "multiply";
                ctx.globalAlpha = 0.52;
                const ptrn = ctx.createPattern(this.paperNoise, 'repeat');
                ctx.fillStyle = ptrn;
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();
            }

            renderCenterOvalZone(ctx, rms) {
                const oval = this.centerOval;
                ctx.save();

                // 타원 내부 정돈된 여백 마스크
                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx * 1.03, oval.ry * 1.03, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#f6f3ea";
                ctx.fill();

                // 섬세한 이중 테두리
                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx, oval.ry, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(40, 40, 45, 0.35)";
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx * 0.96, oval.ry * 0.96, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(40, 40, 45, 0.15)";
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // 상단 고정: 제목 / 글쓴이 / 전각 낙관
                const titleY = oval.cy - oval.ry * 0.44;
                const authorY = oval.cy - oval.ry * 0.10;

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.font = `bold ${oval.ry * 0.34}px ${this.currentFont}`;
                ctx.fillStyle = "#151518";
                ctx.shadowColor = "rgba(0,0,0,0.18)";
                ctx.shadowBlur = 3;
                ctx.fillText(this.titleText, oval.cx - oval.rx * 0.08, titleY);

                ctx.font = `500 ${oval.ry * 0.20}px 'Gowun Batang', serif`;
                ctx.fillStyle = "#4a4a52";
                ctx.shadowBlur = 0;
                ctx.fillText(this.authorText, oval.cx - oval.rx * 0.12, authorY);

                const sealS = oval.ry * 0.25;
                const sealX = oval.cx + (oval.rx * 0.38);
                const sealY = authorY - sealS * 0.5;

                ctx.fillStyle = "#9e2a2b";
                ctx.fillRect(sealX, sealY, sealS, sealS);
                ctx.strokeStyle = "#771d1e";
                ctx.lineWidth = 1;
                ctx.strokeRect(sealX, sealY, sealS, sealS);

                ctx.fillStyle = "#f6f3ea";
                ctx.font = `bold ${sealS * 0.45}px serif`;
                ctx.fillText("心", sealX + sealS * 0.5, sealY + sealS * 0.35);
                ctx.fillText("印", sealX + sealS * 0.5, sealY + sealS * 0.75);

                // 하단 독립: 현재 부르는 가사
                if (!this.isPreviewMode) {
                    const activeItem = this.charItems.find(it => it.state === 'ACTIVE');
                    if (activeItem) {
                        const curLine = this.srtList.find(l => l.index === activeItem.lineIndex);
                        if (curLine) {
                            const lyricY = oval.cy + oval.ry * 0.44;
                            const beat = 1.0 + (rms * 0.22);
                            let lyricFontSize = oval.ry * 0.26 * beat;

                            ctx.font = `bold ${lyricFontSize}px ${this.currentFont}`;

                            const maxW = oval.rx * 1.75;
                            const measuredW = ctx.measureText(curLine.text).width;
                            if (measuredW > maxW) {
                                lyricFontSize *= (maxW / measuredW);
                                ctx.font = `bold ${lyricFontSize}px ${this.currentFont}`;
                            }

                            ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
                            ctx.shadowBlur = 6 + (rms * 10);
                            ctx.fillStyle = "#0c0c0e";
                            ctx.fillText(curLine.text, oval.cx, lyricY);
                        }
                    }
                }

                ctx.restore();
            }

            renderStampedLayer(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.charItems.forEach(item => {
                    const isVisible = this.isPreviewMode || item.state === 'STAMPED';
                    if (isVisible) {
                        const alpha = this.isPreviewMode ? 0.95 : (item.baseAlpha + (0.95 - item.baseAlpha) * this.finalInkProgress);
                        const grey = this.isPreviewMode ? 14 : Math.floor(180 - (180 - 14) * this.finalInkProgress);

                        ctx.save();
                        ctx.translate(item.targetX, item.targetY);
                        ctx.rotate(item.targetAngle);

                        ctx.font = `bold ${item.targetSize}px ${this.currentFont}`;

                        if (this.finalInkProgress > 0 || this.isPreviewMode) {
                            ctx.shadowColor = "rgba(10, 10, 15, 0.22)";
                            ctx.shadowBlur = 1.5;
                        }

                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;
                        ctx.fillText(item.char, 0, 0);

                        ctx.restore();
                    }
                });
                ctx.restore();
            }

            renderFlyingLayer(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.charItems.forEach(item => {
                    if (item.state === 'FLYING') {
                        const t = this.easeOutCubic(item.flyProgress);

                        const startX = this.centerOval.cx;
                        const startY = this.centerOval.cy + this.centerOval.ry * 0.44;

                        const curX = startX + (item.targetX - startX) * t;
                        const curY = startY + (item.targetY - startY) * t;
                        const curAngle = item.targetAngle * t;

                        const startSize = this.centerOval.ry * 0.26;
                        const curSize = startSize + (item.targetSize - startSize) * t;

                        const alpha = 1.0 - (1.0 - item.baseAlpha) * t;
                        const grey = Math.floor(14 + (180 - 14) * t);

                        ctx.save();
                        ctx.translate(curX, curY);
                        ctx.rotate(curAngle);

                        ctx.font = `bold ${curSize}px ${this.currentFont}`;
                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;
                        ctx.fillText(item.char, 0, 0);
                        ctx.restore();
                    }
                });
                ctx.restore();
            }

            updateUI() {
                const fmt = (s) => {
                    const m = Math.floor(s / 60);
                    const sec = Math.floor(s % 60);
                    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                };
                document.getElementById('time-display').innerText = 
                    `${fmt(this.currentTime)} / ${fmt(this.duration)}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const engine = new MasterDenseCalligraphyEngine(container);

            const btnPlay = document.getElementById('btn-play');
            const btnPreview = document.getElementById('btn-preview');
            const btnReset = document.getElementById('btn-reset');
            const fontSelect = document.getElementById('font-select');
            const scaleSlider = document.getElementById('scale-slider');
            const titleInput = document.getElementById('title-input');
            const authorInput = document.getElementById('author-input');
            const audioInput = document.getElementById('audio-input');
            const srtInput = document.getElementById('srt-input');

            btnPlay.addEventListener('click', () => {
                if (engine.isPlaying) {
                    engine.pause();
                    btnPlay.innerText = "▶ 재생";
                } else {
                    engine.play();
                    btnPlay.innerText = "⏸ 일시정지";
                }
            });

            btnPreview.addEventListener('click', () => {
                engine.togglePreview();
            });

            btnReset.addEventListener('click', () => {
                engine.reset();
                btnPlay.innerText = "▶ 재생";
            });

            scaleSlider.addEventListener('input', (e) => {
                engine.setFontScale(parseFloat(e.target.value));
            });

            titleInput.addEventListener('input', (e) => {
                engine.titleText = e.target.value;
            });

            authorInput.addEventListener('input', (e) => {
                engine.authorText = e.target.value;
            });

            fontSelect.addEventListener('change', (e) => {
                engine.setFont(e.target.value);
            });

            audioInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    engine.setupAudio(f);
                    btnPlay.innerText = "▶ MP3 재생";
                }
            });

            srtInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        engine.loadSRT(evt.target.result);
                        btnPlay.innerText = "▶ 재생";
                    };
                    reader.readAsText(f);
                }
            });
        });
    </script>
</body>
</html>
