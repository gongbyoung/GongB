<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Calligraphy Inking Canvas</title>
    <!-- 명조/캘리그래피 감성 웹폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121214;
            color: #ececec;
            font-family: 'Gowun Batang', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 상단 관제탑 컨트롤 바 */
        #control-panel {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(24, 24, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .btn {
            background: #2a2a30;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            font-size: 13px;
            font-family: inherit;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: #3e3e48;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .btn-primary {
            background: #c29f62;
            color: #1a150e;
            font-weight: bold;
            border: none;
        }
        .btn-primary:hover {
            background: #d8b476;
        }
        .file-label {
            font-size: 12px;
            color: #bbb;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
        #time-display {
            font-size: 13px;
            font-family: monospace;
            color: #aaa;
            min-width: 80px;
            text-align: center;
        }
        /* 우하단 상태 표시 */
        #status-badge {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 10;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <button id="btn-play" class="btn btn-primary">▶ 데모 재생</button>
        <button id="btn-reset" class="btn">초기화</button>
        
        <label class="file-label btn" title="MP3 오디오 파일 업로드">
            🎵 MP3
            <input type="file" id="audio-input" accept="audio/*">
        </label>
        
        <label class="file-label btn" title="SRT 자막 파일 업로드">
            📜 SRT
            <input type="file" id="srt-input" accept=".srt">
        </label>

        <span id="time-display">00:00 / 00:00</span>
    </div>

    <div id="status-badge">A4 CALLIGRAPHY INKING ENGINE</div>
    <div id="canvas-container"></div>

    <script>
        // -------------------------------------------------------------
        // 1. 기본 데모 데이터 (별 헤는 밤 발췌 - 파일 없이도 테스트 가능)
        // -------------------------------------------------------------
        const DEMO_SRT_TEXT = `
1
00:00:01,000 --> 00:00:03,500
계절이 지나가는 하늘에는

2
00:00:03,800 --> 00:00:06,200
가을로 가득 차 있습니다

3
00:00:06,500 --> 00:00:09,000
나는 아무 걱정도 없이

4
00:00:09,300 --> 00:00:12,000
가을 속의 별들을 다 헤일 듯합니다

5
00:00:12,500 --> 00:00:15,000
가슴 속에 하나 둘 새겨지는 별을

6
00:00:15,300 --> 00:00:18,000
이제 다 못 헤는 것은

7
00:00:18,300 --> 00:00:21,000
쉬이 아침이 오는 까닭이요

8
00:00:21,400 --> 00:00:24,200
내일 밤이 남은 까닭이요

9
00:00:24,600 --> 00:00:27,500
별 하나에 추억과

10
00:00:27,800 --> 00:00:30,500
별 하나에 사랑과

11
00:00:30,800 --> 00:00:33,500
별 하나에 쓸쓸함과

12
00:00:33,800 --> 00:00:36,500
별 하나에 동경과

13
00:00:36,800 --> 00:00:39,800
별 하나에 시와

14
00:00:40,100 --> 00:00:43,500
별 하나에 어머니, 어머니
        `.trim();

        // -------------------------------------------------------------
        // 2. SRT 파서 유틸리티
        // -------------------------------------------------------------
        function parseSRT(data) {
            const pattern = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\n{2,}|\n*$)/g;
            const result = [];
            let match;
            function toSeconds(t) {
                const parts = t.replace(',', '.').split(':');
                return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
            }
            while ((match = pattern.exec(data)) !== null) {
                result.push({
                    index: parseInt(match[1]),
                    startTime: toSeconds(match[2]),
                    endTime: toSeconds(match[3]),
                    text: match[4].replace(/\r?\n/g, ' ').trim()
                });
            }
            return result;
        }

        // -------------------------------------------------------------
        // 3. 메인 캘리그래피 렌더러 엔진
        // -------------------------------------------------------------
        class SrtCalligraphyEngine {
            constructor(container) {
                this.container = container;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.container.appendChild(this.canvas);

                // 오디오 관련
                this.audioCtx = null;
                this.audioElement = new Audio();
                this.audioElement.crossOrigin = "anonymous";
                this.analyser = null;
                this.audioSource = null;
                this.freqData = null;
                this.isDemoMode = true;

                // 타이머 및 상태
                this.currentTime = 0;
                this.duration = 45;
                this.isPlaying = false;
                this.srtList = [];
                this.lyricItems = [];
                this.isLayoutCalculated = false;

                this.allFinished = false;
                this.finalInkProgress = 0; // 0: 연회색 -> 1: 완전 먹색

                this.a4Rect = { x: 0, y: 0, w: 0, h: 0 };

                // 절차적 종이 질감 캔버스 사전 렌더링
                this.paperTextureCanvas = document.createElement('canvas');
                this.createPaperTexture();

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => {
                    this.resize();
                    this.createPaperTexture();
                });
                this.loadSRT(DEMO_SRT_TEXT);
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            // A4 비율(1 : 1.414) 뷰포트 계산
            resize() {
                const w = this.canvas.width = window.innerWidth;
                const h = this.canvas.height = window.innerHeight;

                const a4Aspect = 1 / 1.4142; // A4 세로 비율
                let paperH = h * 0.88;
                let paperW = paperH * a4Aspect;

                if (paperW > w * 0.9) {
                    paperW = w * 0.9;
                    paperH = paperW / a4Aspect;
                }

                this.a4Rect = {
                    x: (w - paperW) / 2,
                    y: (h - paperH) / 2,
                    w: paperW,
                    h: paperH
                };

                this.isLayoutCalculated = false;
            }

            // 부드러운 아날로그 미색 한지/종이 질감 노이즈 생성
            createPaperTexture() {
                this.paperTextureCanvas.width = 256;
                this.paperTextureCanvas.height = 256;
                const pCtx = this.paperTextureCanvas.getContext('2d');
                const imgData = pCtx.createImageData(256, 256);
                for (let i = 0; i < imgData.data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 22;
                    imgData.data[i] = 245 + noise;     // R
                    imgData.data[i + 1] = 242 + noise; // G
                    imgData.data[i + 2] = 235 + noise; // B
                    imgData.data[i + 3] = 255;
                }
                pCtx.putImageData(imgData, 0, 0);
            }

            loadSRT(text) {
                this.srtList = parseSRT(text);
                if (this.srtList.length > 0) {
                    this.duration = this.srtList[this.srtList.length - 1].endTime + 3.0;
                }
                this.reset();
            }

            // 가사들이 A4 지면을 가득 채우도록 행/열 그리드 자동 레이아웃 계산
            computeFullPageLayout() {
                if (!this.srtList || this.srtList.length === 0) return;

                const total = this.srtList.length;
                // 황금 비율에 가까운 격자 배분
                const cols = Math.ceil(Math.sqrt(total / 1.4142));
                const rows = Math.ceil(total / cols);

                const marginX = this.a4Rect.w * 0.08;
                const marginY = this.a4Rect.h * 0.08;
                const usableW = this.a4Rect.w - (marginX * 2);
                const usableH = this.a4Rect.h - (marginY * 2);

                const cellW = usableW / cols;
                const cellH = usableH / rows;

                this.lyricItems = this.srtList.map((item, idx) => {
                    const col = idx % cols;
                    const row = Math.floor(idx / cols);

                    const targetX = this.a4Rect.x + marginX + (col * cellW) + (cellW / 2);
                    const targetY = this.a4Rect.y + marginY + (row * cellH) + (cellH / 2);

                    // 글자 수와 셀 크기에 맞춘 서체 크기
                    const targetSize = Math.max(12, Math.min(cellH * 0.42, (cellW / item.text.length) * 1.5));

                    return {
                        text: item.text,
                        startTime: item.startTime,
                        endTime: item.endTime,
                        targetX: targetX,
                        targetY: targetY,
                        targetSize: targetSize,
                        state: 'WAITING', // WAITING -> ACTIVE -> FLYING -> STAMPED
                        flyProgress: 0,
                        baseAlpha: 0.15 // 평상시 가독성을 해치지 않는 연회색 알파값
                    };
                });

                this.isLayoutCalculated = true;
            }

            setupAudio(file) {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                this.audioElement.src = URL.createObjectURL(file);
                if (!this.audioSource) {
                    this.audioSource = this.audioCtx.createMediaElementSource(this.audioElement);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64;
                    this.audioSource.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                }
                this.isDemoMode = false;
                this.audioElement.onloadedmetadata = () => {
                    this.duration = this.audioElement.duration;
                };
            }

            play() {
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;
                if (!this.isDemoMode) {
                    this.audioElement.play();
                }
            }

            pause() {
                this.isPlaying = false;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                }
            }

            reset() {
                this.currentTime = 0;
                this.isPlaying = false;
                this.allFinished = false;
                this.finalInkProgress = 0;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                    this.audioElement.currentTime = 0;
                }
                this.computeFullPageLayout();
            }

            // 오디오 음압 계산 (데모 모드 시 음악적 사인파로 시뮬레이션)
            getRMS() {
                if (!this.isPlaying) return 0;
                if (!this.isDemoMode && this.analyser) {
                    this.analyser.getByteFrequencyData(this.freqData);
                    let sum = 0;
                    for (let i = 0; i < this.freqData.length; i++) sum += this.freqData[i];
                    return (sum / this.freqData.length) / 255;
                } else {
                    // 데모용 가상 비트 호흡
                    return (Math.sin(this.currentTime * 4) * 0.5 + 0.5) * 0.35;
                }
            }

            easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            // 60FPS 렌더링 루프
            loop() {
                // 시간 진행
                if (this.isPlaying) {
                    if (this.isDemoMode) {
                        this.currentTime += 1 / 60;
                        if (this.currentTime >= this.duration) {
                            this.currentTime = this.duration;
                            this.isPlaying = false;
                        }
                    } else {
                        this.currentTime = this.audioElement.currentTime;
                        if (this.audioElement.ended) this.isPlaying = false;
                    }
                }

                if (!this.isLayoutCalculated) {
                    this.computeFullPageLayout();
                }

                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 1. 배경 (A4 용지 + 그림자 + 종이 질감)
                this.renderBackground(ctx);

                const rms = this.getRMS();
                let currentActiveItem = null;
                let stampedCount = 0;

                // 2. 가사 상태 갱신
                this.lyricItems.forEach(item => {
                    if (this.currentTime < item.startTime) {
                        item.state = 'WAITING';
                    } else if (this.currentTime >= item.startTime && this.currentTime <= item.endTime) {
                        item.state = 'ACTIVE';
                        currentActiveItem = item;
                    } else if (this.currentTime > item.endTime) {
                        if (item.state === 'ACTIVE') {
                            item.state = 'FLYING';
                            item.flyProgress = 0;
                        } else if (item.state === 'FLYING') {
                            item.flyProgress += 0.035; // 부드럽게 날아가는 속도
                            if (item.flyProgress >= 1.0) {
                                item.flyProgress = 1.0;
                                item.state = 'STAMPED';
                            }
                        }
                        if (item.state === 'STAMPED') {
                            stampedCount++;
                        }
                    }
                });

                // 모든 가사가 안착되었는지 판별
                if (this.lyricItems.length > 0 && stampedCount === this.lyricItems.length) {
                    this.allFinished = true;
                }

                // 3. 최종 먹색 전환 (Final Inking) 트랜지션
                if (this.allFinished) {
                    this.finalInkProgress = Math.min(1.0, this.finalInkProgress + 0.007);
                }

                // 4. 레이어 1: 지면에 박힌 가사 (평소엔 연회색 -> 완료 시 짙은 먹빛)
                this.renderStampedLayer(ctx);

                // 5. 레이어 2: 목표 위치로 날아가는 가사 (Flying)
                this.renderFlyingLayer(ctx);

                // 6. 레이어 3: 현재 활성 가사 (중앙에 크고 선명하게 등장)
                if (currentActiveItem) {
                    this.renderActiveLyric(ctx, currentActiveItem, rms);
                }

                // UI 시간 업데이트
                this.updateTimerUI();

                requestAnimationFrame(this.loop);
            }

            renderBackground(ctx) {
                // 외부 배경 어둡게
                ctx.fillStyle = "#121215";
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // A4 종이 그림자
                ctx.save();
                ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
                ctx.shadowBlur = 35;
                ctx.shadowOffsetY = 15;

                // A4 용지 기본 바탕색
                ctx.fillStyle = "#f5f2e9";
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();

                // 종이 질감 패턴 오버레이 (자연스러운 섬유 질감)
                ctx.save();
                ctx.globalCompositeOperation = "multiply";
                ctx.globalAlpha = 0.55;
                const ptrn = ctx.createPattern(this.paperTextureCanvas, 'repeat');
                ctx.fillStyle = ptrn;
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();

                // A4 용지 테두리 얇은 마감선
                ctx.strokeStyle = "rgba(0, 0, 0, 0.06)";
                ctx.lineWidth = 1;
                ctx.strokeRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
            }

            // 안착된 글자들 (평소엔 옅은 회색 -> 완성 시 진한 검은색으로 물듦)
            renderStampedLayer(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.lyricItems.forEach(item => {
                    if (item.state === 'STAMPED') {
                        // 알파: 0.15 -> 0.95, 색상: 회색(185) -> 짙은 먹빛(18)
                        const alpha = item.baseAlpha + (0.95 - item.baseAlpha) * this.finalInkProgress;
                        const grey = Math.floor(185 - (185 - 18) * this.finalInkProgress);

                        // 최종 완성 시 서체 두께감 증가
                        const weight = this.finalInkProgress > 0.5 ? '700' : '400';
                        ctx.font = `${weight} ${item.targetSize}px 'Nanum Myeongjo', 'Gowun Batang', serif`;
                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;

                        // 최종 완성 단계에서는 미세한 먹물 번짐 그림자 부여
                        if (this.finalInkProgress > 0) {
                            ctx.shadowColor = `rgba(0, 0, 0, ${0.2 * this.finalInkProgress})`;
                            ctx.shadowBlur = 4 * this.finalInkProgress;
                        }

                        ctx.fillText(item.text, item.targetX, item.targetY);
                    }
                });
                ctx.restore();
            }

            // 중앙에서 지정 위치로 날아가는 중간 애니메이션
            renderFlyingLayer(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.lyricItems.forEach(item => {
                    if (item.state === 'FLYING') {
                        const t = this.easeOutCubic(item.flyProgress);

                        const startX = this.canvas.width / 2;
                        const startY = this.canvas.height / 2;
                        const x = startX + (item.targetX - startX) * t;
                        const y = startY + (item.targetY - startY) * t;

                        const startSize = this.a4Rect.w * 0.052;
                        const size = startSize + (item.targetSize - startSize) * t;

                        // 진한 검은색에서 연회색으로 부드럽게 감쇠
                        const alpha = 1.0 - (1.0 - item.baseAlpha) * t;
                        const grey = Math.floor(18 + (185 - 18) * t);

                        ctx.font = `700 ${size}px 'Nanum Myeongjo', 'Gowun Batang', serif`;
                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;
                        ctx.fillText(item.text, x, y);
                    }
                });
                ctx.restore();
            }

            // 현재 노래하고 있는 활성 가사 (화면 중앙 포커스)
            renderActiveLyric(ctx, item, rms) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                // 음압(rms)에 반응해 심장처럼 박동하는 크기
                const scale = 1.0 + (rms * 0.35);
                const baseSize = this.a4Rect.w * 0.052;
                const size = baseSize * scale;

                // 짙은 붓글씨 먹물 번짐 표현
                ctx.font = `800 ${size}px 'Nanum Myeongjo', 'Gowun Batang', serif`;
                ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
                ctx.shadowBlur = 10 + (rms * 15);
                ctx.fillStyle = "#121214";

                ctx.fillText(item.text, centerX, centerY);
                ctx.restore();
            }

            updateTimerUI() {
                const format = (s) => {
                    const m = Math.floor(s / 60);
                    const sec = Math.floor(s % 60);
                    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                };
                document.getElementById('time-display').innerText = 
                    `${format(this.currentTime)} / ${format(this.duration)}`;
            }
        }

        // -------------------------------------------------------------
        // 4. UI 이벤트 및 인스턴스 바인딩
        // -------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const engine = new SrtCalligraphyEngine(container);

            const btnPlay = document.getElementById('btn-play');
            const btnReset = document.getElementById('btn-reset');
            const audioInput = document.getElementById('audio-input');
            const srtInput = document.getElementById('srt-input');

            btnPlay.addEventListener('click', () => {
                if (engine.isPlaying) {
                    engine.pause();
                    btnPlay.innerText = "▶ 재생";
                } else {
                    engine.play();
                    btnPlay.innerText = "⏸ 일시정지";
                }
            });

            btnReset.addEventListener('click', () => {
                engine.reset();
                btnPlay.innerText = "▶ 재생";
            });

            audioInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    engine.setupAudio(file);
                    btnPlay.innerText = "▶ MP3 재생";
                }
            });

            srtInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        engine.loadSRT(evt.target.result);
                        btnPlay.innerText = "▶ 재생";
                    };
                    reader.readAsText(file);
                }
            });
        });
    </script>
</body>
</html>
