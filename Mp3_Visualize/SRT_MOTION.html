<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Collage Masterpiece</title>
    <!-- 정통 붓글씨 및 캘리그라피 서체 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Brush+Script&family=Yeon+Sung&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0b0b0d;
            color: #eee;
            font-family: 'Nanum Brush Script', cursive;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 상단 컨트롤 관제탑 */
        #control-panel {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 24, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .btn {
            background: #28282e;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 7px 14px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }
        .btn:hover {
            background: #3c3c46;
        }
        .btn-primary {
            background: #b5894b;
            color: #120e09;
            font-weight: 700;
            border: none;
        }
        .btn-primary:hover {
            background: #caa062;
        }
        .btn-preview.active {
            background: #962d22;
            color: #fff;
            border-color: #c0392b;
        }
        .text-input {
            background: #1c1c22;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 10px;
            border-radius: 14px;
            font-size: 12px;
            width: 100px;
            outline: none;
            text-align: center;
        }
        .text-input:focus {
            border-color: #b5894b;
        }
        select.font-select {
            background: #28282e;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 10px;
            border-radius: 16px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .file-label {
            font-size: 12px;
            color: #bbb;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
        #time-display {
            font-size: 12px;
            font-family: monospace;
            color: #888;
            min-width: 75px;
            text-align: center;
        }
        #preview-badge {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(150, 45, 34, 0.88);
            color: #fff;
            padding: 5px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-family: sans-serif;
            letter-spacing: 1px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <button id="btn-play" class="btn btn-primary">▶ 재생</button>
        <button id="btn-preview" class="btn btn-preview">👁️ 최종본 미리보기</button>
        <button id="btn-reset" class="btn">처음으로</button>

        <input type="text" id="title-input" class="text-input" value="별 헤는 밤" placeholder="제목">
        <input type="text" id="author-input" class="text-input" value="윤동주 詩" placeholder="글쓴이">

        <select id="font-select" class="font-select">
            <option value="'Nanum Brush Script', cursive" selected>나눔 붓글씨체</option>
            <option value="'East Sea Dokdo', cursive">독도 필묵체</option>
            <option value="'Yeon Sung', cursive">연성체</option>
        </select>
        
        <label class="file-label btn" title="MP3 파일 선택">
            🎵 MP3
            <input type="file" id="audio-input" accept="audio/*">
        </label>
        
        <label class="file-label btn" title="SRT 자막 선택">
            📜 SRT
            <input type="file" id="srt-input" accept=".srt">
        </label>

        <span id="time-display">00:00 / 00:00</span>
    </div>

    <div id="preview-badge">최종 완성본 깜지 미리보기 모드</div>
    <div id="canvas-container"></div>

    <script>
        // 기본 내장 데모 SRT
        const DEFAULT_DEMO_SRT = `
1
00:00:01,000 --> 00:00:03,800
계절이 지나가는 하늘에는 가을로 가득 차 있습니다

2
00:00:04,100 --> 00:00:07,000
나는 아무 걱정도 없이 가을 속의 별들을 다 헤일 듯합니다

3
00:00:07,300 --> 00:00:10,200
가슴 속에 하나 둘 새겨지는 별을 이제 다 못 헤는 것은

4
00:00:10,500 --> 00:00:13,300
쉬이 아침이 오는 까닭이요 내일 밤이 남은 까닭이요

5
00:00:13,600 --> 00:00:16,500
아직 나의 청춘이 다하지 않은 까닭입니다

6
00:00:16,800 --> 00:00:19,600
별 하나에 추억과 별 하나에 사랑과

7
00:00:19,900 --> 00:00:22,700
별 하나에 쓸쓸함과 별 하나에 동경과

8
00:00:23,000 --> 00:00:25,900
별 하나에 시와 별 하나에 어머니, 어머니

9
00:00:26,200 --> 00:00:29,200
어머님, 나는 별 하나에 아름다운 말 한마디씩 불러 봅니다

10
00:00:29,500 --> 00:00:32,500
소학교 때 책상을 같이 했던 아이들의 이름과

11
00:00:32,800 --> 00:00:35,800
패, 경, 옥 이런 이국 소녀들의 이름과

12
00:00:36,100 --> 00:00:39,000
비둘기, 강아지, 토끼, 노루, 프랑시스 잼, 라이너 마리아 릴케

13
00:00:39,300 --> 00:00:42,300
이네들은 너무나 멀리 있습니다, 별이 아스라이 멀 듯이

14
00:00:42,600 --> 00:00:45,600
그리고 당신은 멀리 북간도에 계십니다

15
00:00:45,900 --> 00:00:49,000
그러나 겨울이 지나고 나의 별에도 봄이 오면

16
00:00:49,300 --> 00:00:53,000
무덤 위에 파란 잔디가 피어나듯이 내 이름자 묻힌 언덕 위에도 자랑처럼 풀이 무성할 거외다
        `.trim();

        function parseSRT(data) {
            const pattern = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\n{2,}|\n*$)/g;
            const list = [];
            let match;
            function toSeconds(t) {
                const p = t.replace(',', '.').split(':');
                return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
            }
            while ((match = pattern.exec(data)) !== null) {
                list.push({
                    index: parseInt(match[1]),
                    startTime: toSeconds(match[2]),
                    endTime: toSeconds(match[3]),
                    text: match[4].replace(/\r?\n/g, ' ').trim()
                });
            }
            return list;
        }

        class CalligraphyCollageEngine {
            constructor(container) {
                this.container = container;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.container.appendChild(this.canvas);

                this.audioCtx = null;
                this.audioElement = new Audio();
                this.audioElement.crossOrigin = "anonymous";
                this.analyser = null;
                this.audioSource = null;
                this.freqData = null;
                this.isDemoMode = true;

                this.currentTime = 0;
                this.duration = 54;
                this.isPlaying = false;
                this.isPreviewMode = false;

                this.titleText = "별 헤는 밤";
                this.authorText = "윤동주 詩";

                this.srtList = [];
                this.lyricItems = [];
                this.isLayoutCalculated = false;

                this.allFinished = false;
                this.finalInkProgress = 0;
                this.currentFont = "'Nanum Brush Script', cursive";

                this.a4Rect = { x: 0, y: 0, w: 0, h: 0 };
                this.centerOval = { cx: 0, cy: 0, rx: 0, ry: 0 };

                // 화선지 텍스처 버퍼
                this.paperNoise = document.createElement('canvas');
                this.buildPaperNoise();

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => {
                    this.resize();
                    this.buildPaperNoise();
                });

                document.fonts.ready.then(() => {
                    this.isLayoutCalculated = false;
                });

                this.loadSRT(DEFAULT_DEMO_SRT);
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            resize() {
                const w = this.canvas.width = window.innerWidth;
                const h = this.canvas.height = window.innerHeight;

                const a4Aspect = 1 / 1.4142;
                let paperH = h * 0.88;
                let paperW = paperH * a4Aspect;

                if (paperW > w * 0.88) {
                    paperW = w * 0.88;
                    paperH = paperW / a4Aspect;
                }

                this.a4Rect = {
                    x: (w - paperW) / 2,
                    y: (h - paperH) / 2,
                    w: paperW,
                    h: paperH
                };

                // 가운데 타원(제목/글쓴이 영역) 계산
                this.centerOval = {
                    cx: this.a4Rect.x + this.a4Rect.w / 2,
                    cy: this.a4Rect.y + this.a4Rect.h / 2,
                    rx: this.a4Rect.w * 0.28,
                    ry: this.a4Rect.h * 0.16
                };

                this.isLayoutCalculated = false;
            }

            buildPaperNoise() {
                this.paperNoise.width = 256;
                this.paperNoise.height = 256;
                const pctx = this.paperNoise.getContext('2d');
                const img = pctx.createImageData(256, 256);
                for (let i = 0; i < img.data.length; i += 4) {
                    const grain = (Math.random() - 0.5) * 20;
                    img.data[i] = 247 + grain;
                    img.data[i + 1] = 244 + grain;
                    img.data[i + 2] = 237 + grain;
                    img.data[i + 3] = 255;
                }
                pctx.putImageData(img, 0, 0);
            }

            loadSRT(text) {
                this.srtList = parseSRT(text);
                if (this.srtList.length > 0) {
                    this.duration = this.srtList[this.srtList.length - 1].endTime + 3.0;
                }
                this.reset();
            }

            setFont(fontStr) {
                this.currentFont = fontStr;
                this.isLayoutCalculated = false;
            }

            togglePreview() {
                this.isPreviewMode = !this.isPreviewMode;
                const badge = document.getElementById('preview-badge');
                const btn = document.getElementById('btn-preview');
                if (this.isPreviewMode) {
                    badge.style.display = 'block';
                    btn.classList.add('active');
                } else {
                    badge.style.display = 'none';
                    btn.classList.remove('active');
                }
            }

            /**
             * 중앙 타원을 제외한 지면 전체를 회전/변형 캘리그라피로 가득 채우는 알고리즘
             * 중복 없이 각 가사 문장을 고유한 궤도 슬롯에 배치
             */
            computeCollageLayout() {
                if (!this.srtList || this.srtList.length === 0) return;

                const N = this.srtList.length;
                const cx = this.centerOval.cx;
                const cy = this.centerOval.cy;
                const rx = this.centerOval.rx;
                const ry = this.centerOval.ry;

                // 타원 바깥에서 A4 용지 끝까지의 거리 밴드
                const maxRx = this.a4Rect.w * 0.46;
                const maxRy = this.a4Rect.h * 0.46;

                this.ctx.save();
                this.lyricItems = this.srtList.map((item, idx) => {
                    // 균일한 나선/방사형 확산 각도
                    const phi = (idx / N) * Math.PI * 2 + (idx % 2 === 0 ? 0.1 : -0.1);
                    
                    // 안쪽 타원 경계선 바로 바깥(1.2)부터 용지 가장자리(2.8)까지 층위 배분
                    const layer = (idx % 3) / 2.5; // 0, 0.4, 0.8
                    const currentRx = rx * 1.25 + (maxRx - rx * 1.25) * layer;
                    const currentRy = ry * 1.30 + (maxRy - ry * 1.30) * layer;

                    // 타원 좌표계 배치
                    let targetX = cx + currentRx * Math.cos(phi);
                    let targetY = cy + currentRy * Math.sin(phi);

                    // A4 테두리 내부로 클램핑
                    const padX = this.a4Rect.w * 0.08;
                    const padY = this.a4Rect.h * 0.06;
                    targetX = Math.max(this.a4Rect.x + padX, Math.min(this.a4Rect.x + this.a4Rect.w - padX, targetX));
                    targetY = Math.max(this.a4Rect.y + padY, Math.min(this.a4Rect.y + this.a4Rect.h - padY, targetY));

                    // 타원의 곡선을 타고 흐르는 회전각(접선 벡터) 계산
                    // dx = -rx * sin(phi), dy = ry * cos(phi)
                    let tangentAngle = Math.atan2(currentRy * Math.cos(phi), -currentRx * Math.sin(phi));

                    // 글자가 완전히 뒤집히지 않도록 가독성 범위(-90도 ~ +90도)로 정규화
                    if (tangentAngle > Math.PI / 2) tangentAngle -= Math.PI;
                    if (tangentAngle < -Math.PI / 2) tangentAngle += Math.PI;

                    // 모서리 깜지 느낌을 위한 미세한 유기적 틸트 부여
                    const organicTilt = ((idx * 37) % 20 - 10) * (Math.PI / 180);
                    const finalAngle = tangentAngle + organicTilt;

                    // 텍스트 길이와 지면 밀도에 따른 폰트 크기 계산
                    const baseSize = Math.max(16, Math.min(34, (this.a4Rect.w * 0.052) * (20 / Math.max(10, item.text.length))));
                    
                    // 캘리그라피 붓의 신축(변형) 배율
                    const scaleX = 0.9 + ((idx % 4) * 0.08); // 장평 변화
                    const scaleY = 1.0 + (((idx + 2) % 3) * 0.1);

                    return {
                        text: item.text,
                        startTime: item.startTime,
                        endTime: item.endTime,
                        targetX: targetX,
                        targetY: targetY,
                        targetAngle: finalAngle,
                        targetSize: baseSize,
                        scaleX: scaleX,
                        scaleY: scaleY,
                        state: 'WAITING',
                        flyProgress: 0,
                        baseAlpha: 0.14
                    };
                });
                this.ctx.restore();

                this.isLayoutCalculated = true;
            }

            setupAudio(file) {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                this.audioElement.src = URL.createObjectURL(file);
                if (!this.audioSource) {
                    this.audioSource = this.audioCtx.createMediaElementSource(this.audioElement);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64;
                    this.audioSource.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                }
                this.isDemoMode = false;
                this.audioElement.onloadedmetadata = () => {
                    this.duration = this.audioElement.duration;
                };
            }

            play() {
                if (this.isPreviewMode) this.togglePreview();
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;
                if (!this.isDemoMode) {
                    this.audioElement.play();
                }
            }

            pause() {
                this.isPlaying = false;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                }
            }

            reset() {
                this.currentTime = 0;
                this.isPlaying = false;
                this.allFinished = false;
                this.finalInkProgress = 0;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                    this.audioElement.currentTime = 0;
                }
                this.computeCollageLayout();
            }

            getRMS() {
                if (!this.isPlaying) return 0;
                if (!this.isDemoMode && this.analyser) {
                    this.analyser.getByteFrequencyData(this.freqData);
                    let sum = 0;
                    for (let i = 0; i < this.freqData.length; i++) sum += this.freqData[i];
                    return (sum / this.freqData.length) / 255;
                } else {
                    return (Math.sin(this.currentTime * 4.2) * 0.5 + 0.5) * 0.35;
                }
            }

            easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            loop() {
                if (this.isPlaying && !this.isPreviewMode) {
                    if (this.isDemoMode) {
                        this.currentTime += 1 / 60;
                        if (this.currentTime >= this.duration) {
                            this.currentTime = this.duration;
                            this.isPlaying = false;
                        }
                    } else {
                        this.currentTime = this.audioElement.currentTime;
                        if (this.audioElement.ended) this.isPlaying = false;
                    }
                }

                if (!this.isLayoutCalculated) {
                    this.computeCollageLayout();
                }

                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 1. 도화지 배경
                this.renderBackground(ctx);

                const rms = this.getRMS();
                let currentActiveItem = null;
                let stampedCount = 0;

                // 2. 가사 상태 업데이트
                this.lyricItems.forEach(item => {
                    if (this.currentTime < item.startTime) {
                        item.state = 'WAITING';
                    } else if (this.currentTime >= item.startTime && this.currentTime <= item.endTime) {
                        item.state = 'ACTIVE';
                        currentActiveItem = item;
                    } else if (this.currentTime > item.endTime) {
                        if (item.state === 'ACTIVE') {
                            item.state = 'FLYING';
                            item.flyProgress = 0;
                        } else if (item.state === 'FLYING') {
                            item.flyProgress += 0.038;
                            if (item.flyProgress >= 1.0) {
                                item.flyProgress = 1.0;
                                item.state = 'STAMPED';
                            }
                        }
                        if (item.state === 'STAMPED') {
                            stampedCount++;
                        }
                    }
                });

                if (this.lyricItems.length > 0 && stampedCount === this.lyricItems.length) {
                    this.allFinished = true;
                }

                // 최종 먹물 번짐 진행도
                if (this.isPreviewMode) {
                    this.finalInkProgress = 1.0;
                } else if (this.allFinished) {
                    this.finalInkProgress = Math.min(1.0, this.finalInkProgress + 0.007);
                }

                // 3. 지면 안착 레이어 (깜지 콜라주)
                this.renderStampedCollage(ctx);

                // 4. 날아가는 레이어 (Flying)
                if (!this.isPreviewMode) {
                    this.renderFlyingLayer(ctx);
                }

                // 5. 중앙 타원 여백 및 제목/글쓴이 렌더링
                this.renderCenterOvalZone(ctx);

                // 6. 현재 노래 중인 활성 캘리그라피
                if (currentActiveItem && !this.isPreviewMode) {
                    this.renderActiveLyric(ctx, currentActiveItem, rms);
                }

                this.updateUI();
                requestAnimationFrame(this.loop);
            }

            renderBackground(ctx) {
                ctx.fillStyle = "#0a0a0c";
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // A4 그림자
                ctx.save();
                ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
                ctx.shadowBlur = 45;
                ctx.shadowOffsetY = 18;

                // 미색 한지 바탕
                ctx.fillStyle = "#f6f3ea";
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();

                // 종이 노이즈 질감
                ctx.save();
                ctx.globalCompositeOperation = "multiply";
                ctx.globalAlpha = 0.52;
                const ptrn = ctx.createPattern(this.paperNoise, 'repeat');
                ctx.fillStyle = ptrn;
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();
            }

            // 중앙 타원 영역: 부드러운 네거티브 여백 + 제목 및 글쓴이
            renderCenterOvalZone(ctx) {
                const oval = this.centerOval;
                ctx.save();

                // 타원 내부를 맑고 깨끗하게 비워내는 은은한 마스크 (배경 먹물 차단)
                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx * 1.05, oval.ry * 1.05, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#f6f3ea";
                ctx.fill();

                // 타원 테두리 섬세한 이중 먹선
                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx, oval.ry, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(40, 40, 45, 0.35)";
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx * 0.95, oval.ry * 0.95, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(40, 40, 45, 0.15)";
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // 제목 (타원 상단부)
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `bold ${oval.ry * 0.38}px ${this.currentFont}`;
                ctx.fillStyle = "#161618";
                ctx.shadowColor = "rgba(0,0,0,0.2)";
                ctx.shadowBlur = 4;
                ctx.fillText(this.titleText, oval.cx, oval.cy - oval.ry * 0.22);

                // 글쓴이 (타원 하단부)
                ctx.font = `500 ${oval.ry * 0.22}px 'Gowun Batang', serif`;
                ctx.fillStyle = "#4a4a52";
                ctx.shadowBlur = 0;
                ctx.fillText(this.authorText, oval.cx, oval.cy + oval.ry * 0.28);

                // 전통 붉은 전각 낙관 인장
                const sealS = oval.ry * 0.28;
                const sealX = oval.cx + (oval.rx * 0.52);
                const sealY = oval.cy + (oval.ry * 0.12);

                ctx.fillStyle = "#9e2a2b";
                ctx.fillRect(sealX, sealY, sealS, sealS);
                ctx.strokeStyle = "#771d1e";
                ctx.lineWidth = 1;
                ctx.strokeRect(sealX, sealY, sealS, sealS);

                ctx.fillStyle = "#f6f3ea";
                ctx.font = `bold ${sealS * 0.45}px serif`;
                ctx.fillText("心", sealX + sealS * 0.5, sealY + sealS * 0.35);
                ctx.fillText("印", sealX + sealS * 0.5, sealY + sealS * 0.75);

                ctx.restore();
            }

            // 지면에 회전 및 변형되어 안착된 캘리그라피 깜지 레이어
            renderStampedCollage(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.lyricItems.forEach(item => {
                    const isVisible = this.isPreviewMode || item.state === 'STAMPED';
                    if (isVisible) {
                        const alpha = this.isPreviewMode ? 0.94 : (item.baseAlpha + (0.94 - item.baseAlpha) * this.finalInkProgress);
                        const grey = this.isPreviewMode ? 18 : Math.floor(185 - (185 - 18) * this.finalInkProgress);

                        ctx.save();
                        // 1. 고유 타깃 위치로 이동
                        ctx.translate(item.targetX, item.targetY);
                        // 2. 타원 흐름에 맞춘 회전
                        ctx.rotate(item.targetAngle);
                        // 3. 붓글씨 조형 변형(장평)
                        ctx.scale(item.scaleX, item.scaleY);

                        ctx.font = `bold ${item.targetSize}px ${this.currentFont}`;
                        
                        if (this.finalInkProgress > 0 || this.isPreviewMode) {
                            ctx.shadowColor = "rgba(10, 10, 15, 0.25)";
                            ctx.shadowBlur = 3;
                        }

                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;
                        ctx.fillText(item.text, 0, 0);

                        ctx.restore();
                    }
                });
                ctx.restore();
            }

            // 중앙에서 고유 회전 슬롯으로 날아가는 모션
            renderFlyingLayer(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.lyricItems.forEach(item => {
                    if (item.state === 'FLYING') {
                        const t = this.easeOutCubic(item.flyProgress);

                        // 중앙에서 목표 회전 위치로 보간
                        const startX = this.canvas.width / 2;
                        const startY = this.canvas.height / 2;
                        const curX = startX + (item.targetX - startX) * t;
                        const curY = startY + (item.targetY - startY) * t;

                        const curAngle = item.targetAngle * t;
                        const curScaleX = 1.0 + (item.scaleX - 1.0) * t;
                        const curScaleY = 1.0 + (item.scaleY - 1.0) * t;

                        const startSize = this.a4Rect.w * 0.06;
                        const curSize = startSize + (item.targetSize - startSize) * t;

                        const alpha = 1.0 - (1.0 - item.baseAlpha) * t;
                        const grey = Math.floor(18 + (185 - 18) * t);

                        ctx.save();
                        ctx.translate(curX, curY);
                        ctx.rotate(curAngle);
                        ctx.scale(curScaleX, curScaleY);

                        ctx.font = `bold ${curSize}px ${this.currentFont}`;
                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;
                        ctx.fillText(item.text, 0, 0);
                        ctx.restore();
                    }
                });
                ctx.restore();
            }

            // 현재 부르고 있는 활성 가사 (가장 크고 진하게 표시)
            renderActiveLyric(ctx, item, rms) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                const centerX = this.centerOval.cx;
                // 타원 내부 제목과 겹치지 않도록 살짝 아래 또는 중심에 강력한 포커스
                const centerY = this.centerOval.cy;

                const beat = 1.0 + (rms * 0.25);
                const baseSize = this.a4Rect.w * 0.058;
                let targetFontSize = baseSize * beat;

                // 타원 폭을 벗어나지 않도록 안전 리사이징
                const maxW = this.centerOval.rx * 1.7;
                ctx.font = `bold ${targetFontSize}px ${this.currentFont}`;
                let measuredW = ctx.measureText(item.text).width;
                if (measuredW > maxW) {
                    targetFontSize = targetFontSize * (maxW / measuredW);
                    ctx.font = `bold ${targetFontSize}px ${this.currentFont}`;
                }

                // 활성 가사 배경을 살짝 감싸는 연한 먹안개
                ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
                ctx.shadowBlur = 12 + (rms * 16);
                ctx.fillStyle = "#0c0c0e";

                ctx.fillText(item.text, centerX, centerY);
                ctx.restore();
            }

            updateUI() {
                const fmt = (s) => {
                    const m = Math.floor(s / 60);
                    const sec = Math.floor(s % 60);
                    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                };
                document.getElementById('time-display').innerText = 
                    `${fmt(this.currentTime)} / ${fmt(this.duration)}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const engine = new CalligraphyCollageEngine(container);

            const btnPlay = document.getElementById('btn-play');
            const btnPreview = document.getElementById('btn-preview');
            const btnReset = document.getElementById('btn-reset');
            const fontSelect = document.getElementById('font-select');
            const titleInput = document.getElementById('title-input');
            const authorInput = document.getElementById('author-input');
            const audioInput = document.getElementById('audio-input');
            const srtInput = document.getElementById('srt-input');

            btnPlay.addEventListener('click', () => {
                if (engine.isPlaying) {
                    engine.pause();
                    btnPlay.innerText = "▶ 재생";
                } else {
                    engine.play();
                    btnPlay.innerText = "⏸ 일시정지";
                }
            });

            btnPreview.addEventListener('click', () => {
                engine.togglePreview();
            });

            btnReset.addEventListener('click', () => {
                engine.reset();
                btnPlay.innerText = "▶ 재생";
            });

            titleInput.addEventListener('input', (e) => {
                engine.titleText = e.target.value;
            });

            authorInput.addEventListener('input', (e) => {
                engine.authorText = e.target.value;
            });

            fontSelect.addEventListener('change', (e) => {
                engine.setFont(e.target.value);
            });

            audioInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    engine.setupAudio(f);
                    btnPlay.innerText = "▶ MP3 재생";
                }
            });

            srtInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        engine.loadSRT(evt.target.result);
                        btnPlay.innerText = "▶ 재생";
                    };
                    reader.readAsText(f);
                }
            });
        });
    </script>
</body>
</html>
