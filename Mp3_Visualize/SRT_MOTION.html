<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Calligraphy Masterpiece</title>
    <!-- 정통 붓글씨 및 캘리그라피 웹폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Brush+Script&family=Yeon+Sung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d0d0f;
            color: #eaeaea;
            font-family: 'Nanum Brush Script', cursive;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 상단 관제탑 컨트롤 바 */
        #control-panel {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(22, 22, 26, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .btn {
            background: #28282e;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 7px 14px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .btn:hover {
            background: #3a3a44;
            border-color: rgba(255, 255, 255, 0.35);
        }
        .btn-primary {
            background: #c69c6d;
            color: #1a140d;
            font-weight: 700;
            border: none;
        }
        .btn-primary:hover {
            background: #dbb080;
        }
        .btn-preview.active {
            background: #a93226;
            color: #ffffff;
            border-color: #e74c3c;
        }
        .file-label {
            font-size: 12px;
            color: #bbb;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
        select.font-select {
            background: #28282e;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        #time-display {
            font-size: 12px;
            font-family: monospace;
            color: #999;
            min-width: 80px;
            text-align: center;
        }
        #preview-watermark {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(169, 50, 38, 0.85);
            color: #fff;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-family: sans-serif;
            letter-spacing: 1px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <button id="btn-play" class="btn btn-primary">▶ 재생</button>
        <button id="btn-preview" class="btn btn-preview">👁️ 최종본 미리보기</button>
        <button id="btn-reset" class="btn">처음으로</button>

        <select id="font-select" class="font-select" title="캘리그라피 서체 선택">
            <option value="'Nanum Brush Script', cursive" selected>나눔 붓글씨체</option>
            <option value="'East Sea Dokdo', cursive">독도 필묵체</option>
            <option value="'Yeon Sung', cursive">연성 감성손글씨</option>
        </select>
        
        <label class="file-label btn" title="MP3 오디오 파일 지정">
            🎵 MP3
            <input type="file" id="audio-input" accept="audio/*">
        </label>
        
        <label class="file-label btn" title="SRT 자막 파일 지정">
            📜 SRT
            <input type="file" id="srt-input" accept=".srt">
        </label>

        <span id="time-display">00:00 / 00:00</span>
    </div>

    <div id="preview-watermark">최종 완성본 미리보기 모드 (클릭하여 해제 가능)</div>
    <div id="canvas-container"></div>

    <script>
        // 기본 내장 데모 SRT (실제 긴 가사 행 포함 테스트)
        const DEFAULT_DEMO_SRT = `
1
00:00:01,000 --> 00:00:04,200
나가는 눈길은 수평선 저쪽까지 깃폭처럼 퍼덕이고

2
00:00:04,500 --> 00:00:07,800
찬바람 머금은 파도는 부서져 하얀 꽃을 피운다

3
00:00:08,200 --> 00:00:11,500
계절이 지나가는 하늘 위로 시린 별들이 돋아나고

4
00:00:12,000 --> 00:00:15,300
가슴속 깊이 새겨진 이름 하나 쉬이 지우지 못한다

5
00:00:15,800 --> 00:00:19,200
어둠이 짙어질수록 새벽의 빛은 더욱 또렷해지니

6
00:00:19,600 --> 00:00:23,000
흘러간 세월의 흔적들은 먹물이 되어 지면에 맺힌다

7
00:00:23,500 --> 00:00:27,000
바람아 불어라 나의 모든 노래가 저 먼 곳에 닿도록

8
00:00:27,500 --> 00:00:31,000
홀로 남은 자리마다 피어나는 묵향처럼 영원하리라
        `.trim();

        function parseSRT(data) {
            const pattern = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\n{2,}|\n*$)/g;
            const list = [];
            let match;
            function toSeconds(t) {
                const p = t.replace(',', '.').split(':');
                return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
            }
            while ((match = pattern.exec(data)) !== null) {
                list.push({
                    index: parseInt(match[1]),
                    startTime: toSeconds(match[2]),
                    endTime: toSeconds(match[3]),
                    text: match[4].replace(/\r?\n/g, ' ').trim()
                });
            }
            return list;
        }

        class CalligraphyCanvasEngine {
            constructor(container) {
                this.container = container;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.container.appendChild(this.canvas);

                this.audioCtx = null;
                this.audioElement = new Audio();
                this.audioElement.crossOrigin = "anonymous";
                this.analyser = null;
                this.audioSource = null;
                this.freqData = null;
                this.isDemoMode = true;

                this.currentTime = 0;
                this.duration = 32;
                this.isPlaying = false;
                this.isPreviewMode = false;

                this.srtList = [];
                this.lyricItems = [];
                this.isLayoutCalculated = false;

                this.allFinished = false;
                this.finalInkProgress = 0;
                this.currentFont = "'Nanum Brush Script', cursive";

                this.a4Rect = { x: 0, y: 0, w: 0, h: 0 };

                // 절차적 한지 텍스처 버퍼
                this.paperNoise = document.createElement('canvas');
                this.buildPaperNoise();

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => {
                    this.resize();
                    this.buildPaperNoise();
                });

                document.fonts.ready.then(() => {
                    this.isLayoutCalculated = false;
                });

                this.loadSRT(DEFAULT_DEMO_SRT);
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            resize() {
                const w = this.canvas.width = window.innerWidth;
                const h = this.canvas.height = window.innerHeight;

                const a4Aspect = 1 / 1.4142; // A4 규격
                let paperH = h * 0.88;
                let paperW = paperH * a4Aspect;

                if (paperW > w * 0.88) {
                    paperW = w * 0.88;
                    paperH = paperW / a4Aspect;
                }

                this.a4Rect = {
                    x: (w - paperW) / 2,
                    y: (h - paperH) / 2,
                    w: paperW,
                    h: paperH
                };

                this.isLayoutCalculated = false;
            }

            buildPaperNoise() {
                this.paperNoise.width = 300;
                this.paperNoise.height = 300;
                const pctx = this.paperNoise.getContext('2d');
                const img = pctx.createImageData(300, 300);
                for (let i = 0; i < img.data.length; i += 4) {
                    const grain = (Math.random() - 0.5) * 18;
                    img.data[i] = 246 + grain;
                    img.data[i + 1] = 243 + grain;
                    img.data[i + 2] = 236 + grain;
                    img.data[i + 3] = 255;
                }
                pctx.putImageData(img, 0, 0);
            }

            loadSRT(text) {
                this.srtList = parseSRT(text);
                if (this.srtList.length > 0) {
                    this.duration = this.srtList[this.srtList.length - 1].endTime + 3.0;
                }
                this.reset();
            }

            setFont(fontStr) {
                this.currentFont = fontStr;
                this.isLayoutCalculated = false;
            }

            togglePreview() {
                this.isPreviewMode = !this.isPreviewMode;
                const badge = document.getElementById('preview-watermark');
                const btn = document.getElementById('btn-preview');
                if (this.isPreviewMode) {
                    badge.style.display = 'block';
                    btn.classList.add('active');
                } else {
                    badge.style.display = 'none';
                    btn.classList.remove('active');
                }
            }

            // 가사 지면 배치 계산 (화면 밖 벗어남 원천 방지)
            computeLayout() {
                if (!this.srtList || this.srtList.length === 0) return;

                const total = this.srtList.length;
                const paddingX = this.a4Rect.w * 0.12;
                const paddingY = this.a4Rect.h * 0.10;
                const usableW = this.a4Rect.w - (paddingX * 2);
                const usableH = this.a4Rect.h - (paddingY * 2);

                // 시(詩) 형태의 유려한 세로 흐름 배치 (행간 계산)
                const lineSpacing = usableH / (total + 1);

                this.ctx.save();
                this.lyricItems = this.srtList.map((item, idx) => {
                    const targetX = this.a4Rect.x + this.a4Rect.w / 2;
                    const targetY = this.a4Rect.y + paddingY + (lineSpacing * (idx + 1));

                    // 초기 기준 폰트 크기
                    let fontSize = Math.min(lineSpacing * 0.72, this.a4Rect.w * 0.058);

                    // 텍스트 너비 실측 및 화면 밖 이탈 방지 자동 축소
                    this.ctx.font = `bold ${fontSize}px ${this.currentFont}`;
                    let textWidth = this.ctx.measureText(item.text).width;

                    if (textWidth > usableW) {
                        const scaleDown = usableW / textWidth;
                        fontSize = Math.floor(fontSize * scaleDown);
                    }

                    return {
                        text: item.text,
                        startTime: item.startTime,
                        endTime: item.endTime,
                        targetX: targetX,
                        targetY: targetY,
                        targetSize: fontSize,
                        state: 'WAITING',
                        flyProgress: 0,
                        baseAlpha: 0.16
                    };
                });
                this.ctx.restore();

                this.isLayoutCalculated = true;
            }

            setupAudio(file) {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                this.audioElement.src = URL.createObjectURL(file);
                if (!this.audioSource) {
                    this.audioSource = this.audioCtx.createMediaElementSource(this.audioElement);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64;
                    this.audioSource.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                }
                this.isDemoMode = false;
                this.audioElement.onloadedmetadata = () => {
                    this.duration = this.audioElement.duration;
                };
            }

            play() {
                if (this.isPreviewMode) this.togglePreview();
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;
                if (!this.isDemoMode) {
                    this.audioElement.play();
                }
            }

            pause() {
                this.isPlaying = false;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                }
            }

            reset() {
                this.currentTime = 0;
                this.isPlaying = false;
                this.allFinished = false;
                this.finalInkProgress = 0;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                    this.audioElement.currentTime = 0;
                }
                this.computeLayout();
            }

            getRMS() {
                if (!this.isPlaying) return 0;
                if (!this.isDemoMode && this.analyser) {
                    this.analyser.getByteFrequencyData(this.freqData);
                    let sum = 0;
                    for (let i = 0; i < this.freqData.length; i++) sum += this.freqData[i];
                    return (sum / this.freqData.length) / 255;
                } else {
                    return (Math.sin(this.currentTime * 4.5) * 0.5 + 0.5) * 0.38;
                }
            }

            easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            loop() {
                if (this.isPlaying && !this.isPreviewMode) {
                    if (this.isDemoMode) {
                        this.currentTime += 1 / 60;
                        if (this.currentTime >= this.duration) {
                            this.currentTime = this.duration;
                            this.isPlaying = false;
                        }
                    } else {
                        this.currentTime = this.audioElement.currentTime;
                        if (this.audioElement.ended) this.isPlaying = false;
                    }
                }

                if (!this.isLayoutCalculated) {
                    this.computeLayout();
                }

                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 1. 아날로그 화선지/한지 캔버스 렌더링
                this.renderBackground(ctx);

                const rms = this.getRMS();
                let currentActiveItem = null;
                let stampedCount = 0;

                // 2. 가사 상태 업데이트
                this.lyricItems.forEach(item => {
                    if (this.currentTime < item.startTime) {
                        item.state = 'WAITING';
                    } else if (this.currentTime >= item.startTime && this.currentTime <= item.endTime) {
                        item.state = 'ACTIVE';
                        currentActiveItem = item;
                    } else if (this.currentTime > item.endTime) {
                        if (item.state === 'ACTIVE') {
                            item.state = 'FLYING';
                            item.flyProgress = 0;
                        } else if (item.state === 'FLYING') {
                            item.flyProgress += 0.038;
                            if (item.flyProgress >= 1.0) {
                                item.flyProgress = 1.0;
                                item.state = 'STAMPED';
                            }
                        }
                        if (item.state === 'STAMPED') {
                            stampedCount++;
                        }
                    }
                });

                if (this.lyricItems.length > 0 && stampedCount === this.lyricItems.length) {
                    this.allFinished = true;
                }

                // 최종 먹색 전환 진척도
                if (this.isPreviewMode) {
                    this.finalInkProgress = 1.0;
                } else if (this.allFinished) {
                    this.finalInkProgress = Math.min(1.0, this.finalInkProgress + 0.007);
                }

                // 3. 지면 안착 레이어 (미리보기 시 전체 출력, 진행 중엔 흐린 먹빛)
                this.renderStampedLayer(ctx);

                // 4. 날아가는 획 레이어 (미리보기 시 생략)
                if (!this.isPreviewMode) {
                    this.renderFlyingLayer(ctx);
                }

                // 5. 중앙 활성 캘리그라피 (미리보기 시 숨김, 화면 폭 완벽 맞춤)
                if (currentActiveItem && !this.isPreviewMode) {
                    this.renderActiveLyric(ctx, currentActiveItem, rms);
                }

                // 6. 붉은 전각 낙관 (최종본 도장)
                if (this.finalInkProgress > 0.05) {
                    this.renderSeal(ctx, this.finalInkProgress);
                }

                this.updateUI();
                requestAnimationFrame(this.loop);
            }

            renderBackground(ctx) {
                ctx.fillStyle = "#0c0c0e";
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // A4 종이 그림자
                ctx.save();
                ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
                ctx.shadowBlur = 40;
                ctx.shadowOffsetY = 16;

                // 은은한 미색(화선지 톤)
                ctx.fillStyle = "#f6f3eb";
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();

                // 질감 합성
                ctx.save();
                ctx.globalCompositeOperation = "multiply";
                ctx.globalAlpha = 0.5;
                const pattern = ctx.createPattern(this.paperNoise, 'repeat');
                ctx.fillStyle = pattern;
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();

                ctx.strokeStyle = "rgba(0, 0, 0, 0.05)";
                ctx.lineWidth = 1;
                ctx.strokeRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
            }

            // 지면에 안착된 캘리그라피 텍스트
            renderStampedLayer(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.lyricItems.forEach(item => {
                    // 미리보기 모드일 땐 모든 텍스트를 강제 표시
                    const isVisible = this.isPreviewMode || item.state === 'STAMPED';
                    if (isVisible) {
                        const alpha = this.isPreviewMode ? 0.96 : (item.baseAlpha + (0.96 - item.baseAlpha) * this.finalInkProgress);
                        const grey = this.isPreviewMode ? 14 : Math.floor(180 - (180 - 14) * this.finalInkProgress);

                        ctx.font = `bold ${item.targetSize}px ${this.currentFont}`;
                        
                        // 붓글씨 먹물 번짐 그림자
                        if (this.finalInkProgress > 0 || this.isPreviewMode) {
                            ctx.shadowColor = "rgba(10, 10, 10, 0.28)";
                            ctx.shadowBlur = 3;
                        } else {
                            ctx.shadowColor = "transparent";
                        }

                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;
                        ctx.fillText(item.text, item.targetX, item.targetY);
                    }
                });
                ctx.restore();
            }

            // 안착 자리로 부드럽게 날아가는 트랜지션
            renderFlyingLayer(ctx) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                this.lyricItems.forEach(item => {
                    if (item.state === 'FLYING') {
                        const t = this.easeOutCubic(item.flyProgress);

                        const startX = this.canvas.width / 2;
                        const startY = this.canvas.height / 2;
                        const x = startX + (item.targetX - startX) * t;
                        const y = startY + (item.targetY - startY) * t;

                        const startSize = this.a4Rect.w * 0.065;
                        const size = startSize + (item.targetSize - startSize) * t;

                        const alpha = 1.0 - (1.0 - item.baseAlpha) * t;
                        const grey = Math.floor(14 + (180 - 14) * t);

                        ctx.font = `bold ${size}px ${this.currentFont}`;
                        ctx.fillStyle = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;
                        ctx.fillText(item.text, x, y);
                    }
                });
                ctx.restore();
            }

            // 현재 가사: 화면 밖으로 절대 나가지 않도록 완벽 보정
            renderActiveLyric(ctx, item, rms) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                // 음압 반응 배율
                const beatScale = 1.0 + (rms * 0.28);
                const baseSize = this.a4Rect.w * 0.065;
                let targetFontSize = baseSize * beatScale;

                // 텍스트 실측 후 A4 지면 최대 허용 폭(84%) 내로 강제 맞춤
                const maxAllowedW = this.a4Rect.w * 0.84;
                ctx.font = `bold ${targetFontSize}px ${this.currentFont}`;
                let measuredW = ctx.measureText(item.text).width;

                if (measuredW > maxAllowedW) {
                    targetFontSize = targetFontSize * (maxAllowedW / measuredW);
                    ctx.font = `bold ${targetFontSize}px ${this.currentFont}`;
                }

                // 짙은 묵직한 먹물 번짐 효과
                ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
                ctx.shadowBlur = 10 + (rms * 15);
                ctx.fillStyle = "#0e0d0c";

                ctx.fillText(item.text, centerX, centerY);
                ctx.restore();
            }

            // 전각 낙관 (작품 완성 시 찍히는 붉은 서예 인장)
            renderSeal(ctx, progress) {
                ctx.save();
                const sealSize = this.a4Rect.w * 0.065;
                const sealX = this.a4Rect.x + this.a4Rect.w * 0.84;
                const sealY = this.a4Rect.y + this.a4Rect.h * 0.88;

                ctx.globalAlpha = Math.min(1.0, progress * 1.2);
                
                // 붉은 인주 색상
                ctx.fillStyle = "#9e2a2b";
                ctx.fillRect(sealX, sealY, sealSize, sealSize);

                // 인장 테두리 풍화 질감
                ctx.strokeStyle = "#7c1d1e";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(sealX + 1, sealY + 1, sealSize - 2, sealSize - 2);

                // 전각 문자 "草心 (초심)"
                ctx.fillStyle = "#f6f3eb";
                ctx.font = `bold ${sealSize * 0.42}px serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("心", sealX + sealSize / 2, sealY + sealSize * 0.32);
                ctx.fillText("印", sealX + sealSize / 2, sealY + sealSize * 0.72);

                ctx.restore();
            }

            updateUI() {
                const fmt = (s) => {
                    const m = Math.floor(s / 60);
                    const sec = Math.floor(s % 60);
                    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                };
                document.getElementById('time-display').innerText = 
                    `${fmt(this.currentTime)} / ${fmt(this.duration)}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const engine = new CalligraphyCanvasEngine(container);

            const btnPlay = document.getElementById('btn-play');
            const btnPreview = document.getElementById('btn-preview');
            const btnReset = document.getElementById('btn-reset');
            const fontSelect = document.getElementById('font-select');
            const audioInput = document.getElementById('audio-input');
            const srtInput = document.getElementById('srt-input');

            btnPlay.addEventListener('click', () => {
                if (engine.isPlaying) {
                    engine.pause();
                    btnPlay.innerText = "▶ 재생";
                } else {
                    engine.play();
                    btnPlay.innerText = "⏸ 일시정지";
                }
            });

            btnPreview.addEventListener('click', () => {
                engine.togglePreview();
            });

            btnReset.addEventListener('click', () => {
                engine.reset();
                btnPlay.innerText = "▶ 재생";
            });

            fontSelect.addEventListener('change', (e) => {
                engine.setFont(e.target.value);
            });

            audioInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    engine.setupAudio(f);
                    btnPlay.innerText = "▶ MP3 재생";
                }
            });

            srtInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        engine.loadSRT(evt.target.result);
                        btnPlay.innerText = "▶ 재생";
                    };
                    reader.readAsText(f);
                }
            });
        });
    </script>
</body>
</html>
