precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec3 u_skyBottom;
uniform vec3 u_skyMid;
uniform vec3 u_skyTop;
uniform vec3 u_cloudTint;
uniform float u_brightness;
uniform float u_isNight;
uniform float u_skyMode; // 0 morning 1 noon 2 sunset 3 night

uniform float u_vocal;
uniform float u_drums;
uniform float u_bass;
uniform float u_other;

uniform float u_L0_density;
uniform float u_L0_speed;
uniform float u_L0_thick;
uniform float u_L0_complex;
uniform float u_L0_contrast;
uniform float u_L0_bright;
uniform float u_L0_height;
uniform float u_L0_wobble;

uniform float u_L1_density;
uniform float u_L1_speed;
uniform float u_L1_thick;
uniform float u_L1_complex;
uniform float u_L1_contrast;
uniform float u_L1_bright;
uniform float u_L1_height;
uniform float u_L1_wobble;

uniform float u_L2_density;
uniform float u_L2_speed;
uniform float u_L2_thick;
uniform float u_L2_complex;
uniform float u_L2_contrast;
uniform float u_L2_bright;
uniform float u_L2_height;
uniform float u_L2_wobble;

uniform float u_L3_density;
uniform float u_L3_speed;
uniform float u_L3_thick;
uniform float u_L3_complex;
uniform float u_L3_contrast;
uniform float u_L3_bright;
uniform float u_L3_height;
uniform float u_L3_wobble;

uniform float u_L4_density;
uniform float u_L4_speed;
uniform float u_L4_thick;
uniform float u_L4_complex;
uniform float u_L4_contrast;
uniform float u_L4_bright;
uniform float u_L4_height;
uniform float u_L4_wobble;

float hash(vec2 p){
  p = fract(p*vec2(123.34,456.21));
  p += dot(p, p+45.32);
  return fract(p.x*p.y);
}
float noise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  float a = hash(i);
  float b = hash(i+vec2(1.0,0.0));
  float c = hash(i+vec2(0.0,1.0));
  float d = hash(i+vec2(1.0,1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
}
float fbm(vec2 p){
  float v = 0.0;
  float a = 0.5;
  vec2 shift = vec2(100.0);
  for(int i=0;i<5;i++){
    v += a*noise(p);
    p = p*2.02 + shift;
    a *= 0.5;
  }
  return v;
}

float cloudShape(vec2 uv, float dens, float spd, float thick, float complex, float heightOff, float wobble, float time){
  float y = uv.y - heightOff*0.8 + 0.1;
  vec2 p = vec2(uv.x* (dens*0.06+0.6), y*1.2);
  float w = sin(time*0.25*wobble*0.04 + uv.x*3.0)*0.08*wobble*0.02;
  p.y += w;
  p.x += time*spd*0.0008;
  p.y += time*spd*0.0003;
  float n = fbm(p* (complex*0.03+0.6));
  float n2 = fbm(p*2.3 + time*0.02);
  float cloud = smoothstep(thick*0.01-0.15, thick*0.01+0.25, n + n2*0.35);
  cloud *= smoothstep(0.0, 0.35, y) * smoothstep(1.2, 0.45, y);
  return cloud;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = frag / u_resolution;
  vec2 suv = (frag - 0.5*u_resolution) / u_resolution.y;
  float t = u_time*0.5;

  // sky gradient
  float h = uv.y;
  // improved 3-stop gradient
  float midMix = smoothstep(0.0, 0.55, h);
  float topMix = smoothstep(0.45, 1.0, h);
  vec3 skyLow = mix(u_skyBottom, u_skyMid, midMix);
  vec3 sky = mix(skyLow, u_skyTop, topMix);

  // slight horizontal vignette based on sky mode
  float sunX = 0.0;
  if(u_skyMode > 1.5 && u_skyMode < 2.5){
    sunX = 0.75; // sunset sun to right
  } else if(u_skyMode < 0.5){
    sunX = 0.25;
  }
  float sunDist = length(vec2(uv.x - sunX, uv.y - 0.15));
  float sunGlow = 0.0;
  if(u_skyMode > 1.5 && u_skyMode < 2.5){
    sunGlow = 0.35 * exp(-sunDist*4.0);
    sky += vec3(1.0,0.55,0.22)*sunGlow*0.9;
  } else if(u_skyMode < 0.5){
    sunGlow = 0.18 * exp(-sunDist*6.0);
    sky += vec3(1.0,0.92,0.75)*sunGlow;
  }

  // clouds layers from far to near
  vec3 col = sky;

  // helper to composite
  // L0 base static (low audio influence)
  float c0 = cloudShape(uv, u_L0_density, u_L0_speed, u_L0_thick, u_L0_complex, u_L0_height*0.01, u_L0_wobble, t);
  c0 = pow(c0, 1.2 - u_L0_contrast*0.005);
  float a0 = c0 * 0.9;
  vec3 cloud0 = u_cloudTint * (0.85 + u_L0_bright*0.004) * u_brightness;
  // slight shading
  float shade0 = fbm(suv*1.2 + t*0.01)*0.18;
  cloud0 -= shade0*0.25;
  col = mix(col, cloud0, a0*0.95);

  // L1 vocal
  float c1 = cloudShape(uv, u_L1_density, u_L1_speed*(1.0+u_vocal*0.8), u_L1_thick, u_L1_complex, u_L1_height*0.01, u_L1_wobble, t);
  c1 = pow(c1, 1.1 - u_L1_contrast*0.006);
  float a1 = c1 * (0.7 + u_vocal*0.5);
  vec3 cloud1 = u_cloudTint * (0.9 + u_L1_bright*0.005 + u_vocal*0.35) * u_brightness;
  cloud1 += vec3(0.12,0.05,0.15)*u_vocal*0.5;
  float sh1 = fbm(suv*1.8 + t*0.03)*0.22;
  cloud1 -= sh1*0.35;
  col = mix(col, cloud1, a1);

  // L2 drums - more wobble
  float c2 = cloudShape(uv, u_L2_density, u_L2_speed*(1.0+u_drums*1.2), u_L2_thick, u_L2_complex, u_L2_height*0.01, u_L2_wobble*(1.0+u_drums), t);
  c2 = pow(c2, 1.0 - u_L2_contrast*0.007);
  float a2 = c2 * (0.65 + u_drums*0.6);
  vec3 cloud2 = u_cloudTint * (0.88 + u_L2_bright*0.005 + u_drums*0.45) * u_brightness;
  cloud2 += vec3(0.15,0.12,0.02)*u_drums*0.4;
  col = mix(col, cloud2, a2);

  // L3 bass - low, thick
  float c3 = cloudShape(uv, u_L3_density, u_L3_speed*(1.0+u_bass*0.6), u_L3_thick, u_L3_complex, u_L3_height*0.01, u_L3_wobble, t);
  c3 = pow(c3, 1.25 - u_L3_contrast*0.005);
  float a3 = c3 * (0.75 + u_bass*0.45);
  vec3 cloud3 = u_cloudTint * (0.82 + u_L3_bright*0.005 + u_bass*0.38) * u_brightness;
  cloud3 += vec3(0.06,0.18,0.12)*u_bass*0.35;
  float sh3 = fbm(suv*1.0 + t*0.008)*0.2;
  cloud3 -= sh3*0.3;
  col = mix(col, cloud3, a3);

  // L4 other - high wispy
  float c4 = cloudShape(uv, u_L4_density, u_L4_speed*(1.0+u_other*0.7), u_L4_thick, u_L4_complex, u_L4_height*0.01, u_L4_wobble, t);
  c4 = pow(c4, 1.15 - u_L4_contrast*0.005);
  float a4 = c4 * (0.6 + u_other*0.55);
  vec3 cloud4 = u_cloudTint * (0.92 + u_L4_bright*0.0045 + u_other*0.32) * u_brightness;
  col = mix(col, cloud4, a4*0.9);

  // sunset extra glow boost
  if(u_skyMode > 1.5 && u_skyMode < 2.5){
    float glowMask = (c1+c2+c3)*0.33;
    col += vec3(1.0,0.5,0.18)*glowMask*0.25*u_brightness;
  }

  // night stars
  if(u_isNight > 0.5){
    vec2 starUV = uv*500.0 + t*0.5;
    float starHash = hash(floor(starUV));
    float star = step(0.998, starHash) * 0.9;
    // twinkle
    float tw = sin(t*2.0 + starHash*6.28)*0.3+0.7;
    // avoid stars behind dense clouds
    float cloudCover = (c0+c1+c2+c3+c4)*0.2;
    star *= (1.0 - cloudCover*0.9);
    col += vec3(0.85,0.92,1.0)*star*tw;
    // subtle milky
    float milky = fbm(uv*2.0)*0.06;
    col += milky*vec3(0.3,0.4,0.7)*0.35;
  }

  // vignette
  float vig = 1.0 - dot(suv, suv)*0.28;
  col *= vig;

  // final tone
  col = pow(col, vec3(0.95));
  col = clamp(col, 0.0, 1.25);

  gl_FragColor = vec4(col, 1.0);
}
