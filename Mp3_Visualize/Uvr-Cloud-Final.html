uniform float u_brightness;
uniform float u_contrast;
uniform float u_seed[4];
uniform float u_speedX[4];
uniform float u_speedY[4];
uniform int u_skyMode;
uniform float u_windBoost;

float hash(vec2 p){
  return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123);
}
float noise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = hash(i);
  float b = hash(i+vec2(1.0,0.0));
  float c = hash(i+vec2(0.0,1.0));
  float d = hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0;
  float amp = 0.5;
  float freq = 1.0;
  for(int i=0;i<5;i++){
    v += noise(p*freq) * amp;
    freq *= 2.0;
    amp *= 0.5;
  }
  return v;
}

vec3 skyColor(vec2 uv, int mode){
  float y = uv.y;
  if(mode==0){
    vec3 top = vec3(0.35,0.55,0.85);
    vec3 mid = vec3(1.0,0.68,0.52);
    vec3 bot = vec3(1.0,0.87,0.62);
    float t = smoothstep(0.0,0.65,y);
    float t2 = smoothstep(0.4,1.0,y);
    return mix(mix(bot,mid,t), top, t2*0.6);
  } else if(mode==1){
    vec3 top = vec3(0.33,0.62,0.96);
    vec3 bot = vec3(0.78,0.89,1.0);
    return mix(bot, top, pow(y,0.85));
  } else if(mode==2){
    vec3 top = vec3(0.18,0.18,0.35);
    vec3 mid = vec3(0.85,0.35,0.45);
    vec3 bot = vec3(1.0,0.55,0.22);
    float t = smoothstep(0.0,0.55,y);
    return mix(bot, mix(mid, top, smoothstep(0.3,1.0,y)), t);
  } else {
    vec3 top = vec3(0.04,0.06,0.12);
    vec3 bot = vec3(0.11,0.13,0.22);
    return mix(bot, top, pow(y,0.7));
  }
}

vec3 cloudCol(int mode, float shade){
  if(mode==0){
    return vec3(1.0,0.97,0.92) * (0.85 + shade*0.25);
  } else if(mode==1){
    return vec3(1.0,1.0,1.0) * (0.9 + shade*0.2);
  } else if(mode==2){
    vec3 warm = vec3(1.0,0.78,0.62);
    vec3 pink = vec3(1.0,0.6,0.7);
    return mix(warm, pink, shade) * 1.05;
  } else {
    vec3 base = vec3(0.22,0.24,0.32);
    vec3 highlight = vec3(0.38,0.42,0.52);
    return mix(base, highlight, shade*0.9 + 0.1);
  }
}

void main(){
  vec2 uv = v_uv;
  vec3 sky = skyColor(uv, u_skyMode);
  vec3 accum = sky;
  float accumAlpha = 0.0;
  for(int i=0;i<4;i++){
    float seed = u_seed[i];
    float sx = u_speedX[i] * u_windBoost;
    float sy = u_speedY[i];
    float layerScale = u_scale * (0.75 + float(i)*0.28);
    vec2 luv = uv * layerScale;
    float timeOffX = u_time * sx * 0.06;
    float timeOffY = u_time * sy * 0.025;
    float wobble = sin(u_time*0.12 + seed*0.017) * 0.015;
    luv.x += timeOffX + wobble;
    luv.y += timeOffY;
    float fx = fbm(luv*0.8 + vec2(seed*0.05));
    float fy = fbm(luv*0.8 + vec2(10.0 + seed*0.05));
    vec2 warp = vec2(fx, fy) * 0.45;
    vec2 puv = luv + warp;
    float largeMaskRaw = fbm(puv*0.35 + vec2(seed*0.07, seed*0.13));
    float largeMask = largeMaskRaw * 0.35 + 0.65;
    float n = fbm(puv*1.1 + vec2(seed*0.11, seed*0.09));
    n += fbm(puv*2.3 + vec2(5.0)) * 0.5;
    n += fbm(puv*4.2 + vec2(2.0)) * 0.25;
    n /= 1.75;
    n = (n - 0.5) * u_contrast + 0.5;
    n = clamp(n, 0.0, 1.0);
    float lowThresh = 0.75 - u_density * 0.42;
    lowThresh = clamp(lowThresh, 0.28, 0.48);
    float cloudRaw = smoothstep(lowThresh, 0.72, n);
    float cloud = cloudRaw * largeMask;
    cloud = pow(cloud, 0.9);
    float layerAlpha = cloud * u_mix * u_opacity * 0.85;
    layerAlpha = clamp(layerAlpha, 0.0, 0.65);
    float shade = fbm(puv*1.8 + vec2(20.0)) * 0.6 + 0.4;
    vec3 ccol = cloudCol(u_skyMode, shade) * u_brightness;
    if(u_skyMode==3){
      ccol *= 0.85 + cloud*0.5;
    }
    float blend = layerAlpha * (1.0 - accumAlpha*0.55);
    accum = mix(accum, ccol, blend);
    accumAlpha += layerAlpha * 0.35;
  }
  float vig = 1.0 - length(uv-0.5)*0.18;
  accum *= vig;
  outColor = vec4(accum, 1.0);
}
