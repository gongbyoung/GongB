float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
float noise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); float a=hash(i); float b=hash(i+vec2(1.0,0.0)); float c=hash(i+vec2(0.0,1.0)); float d=hash(i+vec2(1.0,1.0)); vec2 u=f*f*(3.0-2.0*f); return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
float fbm(vec2 p){ float v=0.0; float a=0.5; vec2 shift=vec2(100.0,100.0); mat2 rot=mat2(0.87758,0.47942,-0.47942,0.87758); for(int i=0;i<5;i++){ v+=a*noise(p); p=rot*p*2.03+shift; a*=0.5; } return v; }
float billowNoise(vec2 p){ return 1.0 - abs(noise(p)*2.0 - 1.0); }
float billowFbm(vec2 p){ float v=0.0; float a=0.5; vec2 shift=vec2(100.0,100.0); mat2 rot=mat2(0.87758,0.47942,-0.47942,0.87758); for(int i=0;i<5;i++){ v+=a*billowNoise(p); p=rot*p*2.03+shift; a*=0.5; } return v; }

// v27 CLEAN 10 types
float cloud_1_cirrocumulus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 3.2 + vec2(seed*0.13, seed*0.07);
  p += sin(p.yx*5.0 + time*0.4)*0.12;
  vec2 i = floor(p);
  vec2 f = fract(p);
  float cells=0.0;
  for(int y=-1;y<=1;y++){
    for(int x=-1;x<=1;x++){
      vec2 nb = vec2(float(x), float(y));
      vec2 cell = i + nb;
      float h = hash(cell + seed*1.1);
      vec2 jitter = vec2(h, hash(cell*2.3+seed))*0.6 - 0.3;
      vec2 diff = nb + 0.5 + jitter - f;
      float d = dot(diff,diff);
      cells += exp(-d*8.0) * (0.5 + h*0.5);
    }
  }
  cells *= 0.32;
  return smoothstep(0.25, 0.40, cells);
}
float cloud_2_cirrus(vec2 uv, float time, float seed, float audio, float scale){
  float streakAudio = 1.0 + audio*1.2;
  vec2 p = uv;
  p.x *= 3.0 * streakAudio;
  p.y *= 0.6;
  p *= scale * 1.2;
  p += vec2(seed*0.1, seed*0.05);
  p.x += sin(uv.y*8.0 + time*0.6 + seed*0.1)*0.35;
  float n = fbm(p*0.9 + vec2(time*0.04, 0.0));
  float lines = sin(p.y*12.0 + fbm(p*2.0)*3.0 + time*0.2)*0.5+0.5;
  lines = pow(lines, 6.0);
  float wispy = n * (0.3 + lines*0.7);
  wispy = smoothstep(0.35, 0.75, wispy);
  float thin = fbm(p*1.5)*0.3 + 0.7;
  return wispy * thin;
}
float cloud_3_cirrostratus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 0.4 + vec2(seed*0.08, seed*0.06);
  float n = fbm(p*0.5 + vec2(time*0.01));
  float halo = sin(length(uv-0.5)*12.0 + time*0.1)*0.05 + 0.95;
  float cloud = n * halo;
  cloud = smoothstep(0.45, 0.85, cloud)*0.65;
  float uniformNoise = fbm(p*0.3)*0.2 + 0.8;
  return cloud * uniformNoise;
}
float cloud_4_altostratus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 1.1 + vec2(seed*0.09, seed*0.07);
  float n = fbm(p*1.2 + vec2(time*0.008));
  float cloud = 0.6 + n*0.2;
  cloud = smoothstep(0.58, 0.78, cloud);
  float flatMask = 1.0 - abs(uv.y-0.5)*0.3;
  cloud *= flatMask;
  return cloud * 0.75;
}
float cloud_5_altocumulus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 1.6 + vec2(seed*0.11, seed*0.08);
  p.x += sin(p.y*6.0 + time*0.3)*0.15;
  p.y += sin(p.x*4.0 + time*0.2)*0.1;
  float n = fbm(p);
  float lines = sin(p.x*5.0 + n*3.0)*0.5+0.5;
  lines = pow(lines, 2.5);
  float sheep = n*0.6 + lines*0.4;
  float var = fbm(p*0.4)*0.5+0.7;
  sheep *= var;
  return smoothstep(0.38, 0.72, sheep);
}
float cloud_6_stratus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 0.55 + vec2(seed*0.07, seed*0.05);
  p.x *= 1.8;
  float n = fbm(p*0.6 + vec2(time*0.005, 0.0));
  float cloud = smoothstep(0.42, 0.78, n);
  float fog = 0.85 + sin(uv.x*2.0+time*0.05)*0.05;
  return cloud * fog * 0.9;
}
float cloud_7_stratocumulus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 0.8 + vec2(seed*0.12, seed*0.09);
  float b = billowFbm(p*0.8);
  float f = fbm(p*0.4);
  float lumps = b*0.8 + f*0.4;
  float roll = sin(p.x*3.0 + time*0.1)*0.15;
  lumps += roll*0.2;
  return smoothstep(0.35, 0.70, lumps);
}
float cloud_8_nimbostratus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 0.65 + vec2(seed*0.14, seed*0.1);
  float n = fbm(p*0.9 + vec2(time*0.006));
  float b = billowFbm(p*0.7);
  float dense = n*0.5 + b*0.5;
  dense = smoothstep(0.32, 0.68, dense);
  float bottom = smoothstep(0.7, 0.1, uv.y);
  return dense * (0.7 + bottom*0.3);
}
float cloud_9_cumulonimbus(vec2 uv, float time, float seed, float audio, float scale){
  float towerAudio = 1.0 + audio*0.6;
  vec2 p = uv;
  float height = p.y;
  float widthFactor = mix(1.2, 0.6, pow(height, 1.2*towerAudio));
  float anvil = smoothstep(0.65, 0.9, height);
  float anvilSpread = 1.0 + anvil*1.8;
  p.x = (p.x-0.5)*widthFactor*anvilSpread + 0.5;
  p *= scale * 0.75;
  p += vec2(seed*0.13, seed*0.08);
  p.y += time*0.008;
  float n = fbm(p*1.1);
  float b = billowFbm(p*0.9);
  float tower = n*0.4 + b*0.6;
  tower = smoothstep(0.30, 0.65, tower);
  float shapeMask = 1.0 - abs(p.x-0.5*scale)*0.8;
  shapeMask = clamp(shapeMask, 0.0, 1.0);
  float topMask = 1.0 - smoothstep(0.85, 0.95, height)*0.2;
  return tower * shapeMask * topMask;
}
float cloud_10_cumulus(vec2 uv, float time, float seed, float audio, float scale){
  vec2 p = uv * scale * 0.9 + vec2(seed*0.15, seed*0.11);
  float var = fbm(p*0.3)*0.8 + 0.6;
  p *= var;
  float b = billowFbm(p*0.75);
  float f = fbm(p*1.1);
  float puffy = b*0.75 + f*0.25;
  float torn = fbm(p*2.2 + vec2(seed*0.02))*0.18;
  puffy += torn;
  float isoMask = smoothstep(0.28, 0.62, puffy);
  return isoMask;
}

float getCloudById(float id, vec2 uv, float time, float seed, float audio, float scale){
  if(id < 1.5) return cloud_1_cirrocumulus(uv,time,seed,audio,scale);
  else if(id < 2.5) return cloud_2_cirrus(uv,time,seed,audio,scale);
  else if(id < 3.5) return cloud_3_cirrostratus(uv,time,seed,audio,scale);
  else if(id < 4.5) return cloud_4_altostratus(uv,time,seed,audio,scale);
  else if(id < 5.5) return cloud_5_altocumulus(uv,time,seed,audio,scale);
  else if(id < 6.5) return cloud_6_stratus(uv,time,seed,audio,scale);
  else if(id < 7.5) return cloud_7_stratocumulus(uv,time,seed,audio,scale);
  else if(id < 8.5) return cloud_8_nimbostratus(uv,time,seed,audio,scale);
  else if(id < 9.5) return cloud_9_cumulonimbus(uv,time,seed,audio,scale);
  else return cloud_10_cumulus(uv,time,seed,audio,scale);
}
float getOpacityById(float id){
  if(id < 1.5) return 0.32;
  else if(id < 2.5) return 0.28;
  else if(id < 3.5) return 0.22;
  else if(id < 4.5) return 0.45;
  else if(id < 5.5) return 0.52;
  else if(id < 6.5) return 0.58;
  else if(id < 7.5) return 0.72;
  else if(id < 8.5) return 0.82;
  else if(id < 9.5) return 0.85;
  else return 0.78;
}
vec3 getColorById(float id, vec2 uv, float brightBoost, float audio){
  vec3 white = vec3(1.0);
  if(id < 1.5){ // cirrocumulus bright
    return white * brightBoost * 1.05;
  } else if(id < 2.5){ // cirrus wispy
    return white * brightBoost * 0.98;
  } else if(id < 3.5){ // cirrostratus veil
    return white * brightBoost * 0.92;
  } else if(id < 4.5){ // altostratus grayish
    return vec3(0.72,0.74,0.80) * brightBoost * 0.95;
  } else if(id < 5.5){ // altocumulus sheep
    return white * brightBoost * 0.96;
  } else if(id < 6.5){ // stratus flat fog
    return vec3(0.92,0.93,0.95) * brightBoost * 0.94;
  } else if(id < 7.5){ // stratocumulus thick
    return white * brightBoost * 0.92;
  } else if(id < 8.5){ // nimbostratus dark rainy
    float bottomDark = smoothstep(0.6, 0.1, uv.y) * 0.4;
    vec3 base = vec3(55.0,60.0,72.0)/255.0;
    base = mix(base, vec3(0.18,0.20,0.26), bottomDark);
    return base * (0.6 + brightBoost*0.5);
  } else if(id < 9.5){ // cumulonimbus tower anvil
    float h = uv.y;
    float brightTop = mix(0.5, 1.25, pow(h, 1.1));
    brightTop *= (1.0 + audio*0.25);
    vec3 base = mix(vec3(0.22,0.24,0.30), white, brightTop);
    return base * brightBoost;
  } else { // cumulus puffy bright
    return white * brightBoost * 1.08;
  }
}

void main(){
  vec2 uv=gl_FragCoord.xy / u_resolution;
  vec2 p=(uv-0.5)*2.0;
  float r=length(p);
  float fovRad = u_fov * 3.14159265 / 180.0;
  float theta = r * fovRad * 0.5;
  float fisheyeR = sin(theta) / (fovRad*0.5 + 0.0001);
  float distort = fisheyeR / (r + 0.0001);
  distort = clamp(distort, 0.30, 2.0);
  vec2 domeUV = p * distort * 0.5 + 0.5;
  vec2 clampedUV=clamp(domeUV,0.0,1.0);
  float gradT=pow(clampedUV.y,0.9);
  vec3 skyTop; vec3 skyBottom;
  if(u_skyMode<0.5){ skyTop=vec3(95.0,135.0,200.0)/255.0; skyBottom=vec3(255.0,220.0,175.0)/255.0; }
  else if(u_skyMode<1.5){ skyTop=vec3(58.0,141.0,222.0)/255.0; skyBottom=vec3(135.0,206.0,235.0)/255.0; }
  else if(u_skyMode<2.5){ skyTop=vec3(42.0,42.0,110.0)/255.0; skyBottom=vec3(255.0,122.0,69.0)/255.0; }
  else { skyTop=vec3(10.0,14.0,26.0)/255.0; skyBottom=vec3(26.0,31.0,53.0)/255.0; }
  vec3 skyCol=mix(skyBottom, skyTop, gradT);
  if(u_skyMode>2.5){
    vec2 moonPos=vec2(0.72,0.82); float md=length(domeUV-moonPos);
    float moonGlow=exp(-md*8.0)*0.8 + exp(-md*18.0)*0.45;
    skyCol+=vec3(0.92,0.94,1.0)*moonGlow*0.6;
    vec2 starCoord=floor(domeUV*700.0); float starHash=hash(starCoord);
    float star=step(0.9985, starHash); float twinkle=0.7+0.3*sin(u_time*2.0+starHash*20.0);
    skyCol+=vec3(star*twinkle*0.9);
  }
  float vign=1.0 - smoothstep(0.7,1.7, r);
  skyCol*=mix(0.82,1.0,vign);
  float globalFlash = u_beat3*0.10 + u_audio3*0.05;
  skyCol += vec3(globalFlash*0.9, globalFlash*0.95, globalFlash);
  vec2 baseWindOffset=vec2(u_time*u_wind*0.02, u_time*u_wind*0.004);
  vec3 finalCol=skyCol;

  // L0 VOCALS 상층운 pool 1,2,3
  {
    float a=u_audio0; float beat=u_beat0;
    float scalePulse=1.0 + a*0.28 + beat*0.15; float speedBoost=1.0 + a*0.9 + beat*0.6;
    float brightBoost=1.0 + a*0.45 + beat*0.2; float densityBoost=1.0 + a*0.35;
    float effScale=u_scale0/scalePulse; float effDensity=u_density0/densityBoost;
    float tMod=u_time*speedBoost; vec2 windOffset=baseWindOffset*speedBoost;
    vec2 layerUV=domeUV + windOffset*0.5; layerUV.x*=1.6;
    layerUV+=a*0.06*vec2(sin(tMod*2.0+u_seed0*0.11), cos(tMod*1.7+u_seed0*0.13));
    float c1=getCloudById(u_a00, layerUV, tMod, u_seed0, a, effScale);
    float c2=0.0; if(u_cnt0>1.5) c2=getCloudById(u_a01, layerUV, tMod, u_seed0+13.0, a, effScale*0.95);
    float c3=0.0; if(u_cnt0>2.5) c3=getCloudById(u_a02, layerUV, tMod, u_seed0+27.0, a, effScale*1.05);
    vec3 col1=getColorById(u_a00, layerUV, brightBoost, a);
    vec3 col2=col1; if(u_cnt0>1.5) col2=getColorById(u_a01, layerUV, brightBoost, a);
    vec3 col3=col1; if(u_cnt0>2.5) col3=getColorById(u_a02, layerUV, brightBoost, a);
    float op1=getOpacityById(u_a00); float op2=op1; if(u_cnt0>1.5) op2=getOpacityById(u_a01); float op3=op1; if(u_cnt0>2.5) op3=getOpacityById(u_a02);
    float cloud; vec3 cloudCol; float cloudOp;
    if(u_cnt0<1.5){ cloud=c1; cloudCol=col1; cloudOp=op1; }
    else if(u_cnt0<2.5){ float mask=fbm(layerUV*0.55 + vec2(u_seed0*0.01))*0.6+0.2; cloud=mix(c1,c2,mask); cloudCol=mix(col1,col2,mask); cloudOp=mix(op1,op2,mask); }
    else { float m1=fbm(layerUV*0.4 + vec2(u_seed0*0.01))*0.5+0.25; float m2=fbm(layerUV*0.7 + vec2(u_seed0*0.02))*0.5+0.25; float w1=(1.0-m1)*(1.0-m2); float w2=m1; float w3=m2*(1.0-m1); float sum=w1+w2+w3+0.001; w1/=sum; w2/=sum; w3/=sum; cloud=c1*w1+c2*w2+c3*w3; cloudCol=col1*w1+col2*w2+col3*w3; cloudOp=op1*w1+op2*w2+op3*w3; }
    cloud=smoothstep(0.30, 0.68, cloud);
    cloud=smoothstep(effDensity-0.08, effDensity+0.22, cloud);
    float largeMask=fbm(layerUV*0.30 + vec2(u_seed0*0.01))*0.35+0.65; cloud*=largeMask;
    float e=0.01; float hl=fbm(layerUV+vec2(-e,0.0)); float hr=fbm(layerUV+vec2(e,0.0)); float hd=fbm(layerUV+vec2(0.0,-e)); float hu=fbm(layerUV+vec2(0.0,e)); vec2 grad=vec2(hr-hl, hu-hd)/(2.0*e); vec3 normal=normalize(vec3(-grad*0.6,1.0)); vec3 sunDir=normalize(vec3(0.4,0.7,0.6)); float shading=0.55+0.45*dot(normal,sunDir); shading=mix(1.0,shading,0.55);
    float interiorNoise=billowFbm(layerUV*2.6 + vec2(u_seed0*0.02))*0.5 + fbm(layerUV*3.1 + vec2(u_seed0*0.03))*0.5; float luminance=0.62 + interiorNoise*0.38; float heightBias=fbm(layerUV*0.85 + vec2(u_seed0*0.018))*0.6 + shading*0.4; float selfShadow=mix(0.70, 1.12, smoothstep(0.18, 0.82, heightBias));
    vec3 cCol=cloudCol*u_bright0*brightBoost*luminance*selfShadow*shading; cCol=mix(cCol, skyCol+vec3(0.08), 0.10);
    float alpha=cloud*0.88*u_mix0*u_opacity0*cloudOp*1.3*(0.85+0.35*brightBoost); alpha=clamp(alpha,0.0,1.0);
    finalCol=mix(finalCol, cCol, alpha);
  }
  // L1 OTHER 중층운 4,5
  {
    float a=u_audio1; float beat=u_beat1;
    float scalePulse=1.0 + a*0.28 + beat*0.15; float speedBoost=1.0 + a*0.9 + beat*0.6;
    float brightBoost=1.0 + a*0.45 + beat*0.25; float densityBoost=1.0 + a*0.35;
    float effScale=u_scale1/scalePulse; float effDensity=u_density1/densityBoost;
    float tMod=u_time*speedBoost; vec2 windOffset=baseWindOffset*speedBoost;
    vec2 layerUV=domeUV + windOffset*0.7 + vec2(0.13,0.07); layerUV.x*=1.6;
    layerUV+=a*0.06*vec2(sin(tMod*2.0+u_seed1*0.11), cos(tMod*1.7+u_seed1*0.13));
    float c1=getCloudById(u_a10, layerUV, tMod, u_seed1, a, effScale);
    float c2=0.0; if(u_cnt1>1.5) c2=getCloudById(u_a11, layerUV, tMod, u_seed1+13.0, a, effScale*0.95);
    float c3=0.0; if(u_cnt1>2.5) c3=getCloudById(u_a12, layerUV, tMod, u_seed1+27.0, a, effScale*1.05);
    vec3 col1=getColorById(u_a10, layerUV, brightBoost, a);
    vec3 col2=col1; if(u_cnt1>1.5) col2=getColorById(u_a11, layerUV, brightBoost, a);
    vec3 col3=col1; if(u_cnt1>2.5) col3=getColorById(u_a12, layerUV, brightBoost, a);
    float op1=getOpacityById(u_a10); float op2=op1; if(u_cnt1>1.5) op2=getOpacityById(u_a11); float op3=op1; if(u_cnt1>2.5) op3=getOpacityById(u_a12);
    float cloud; vec3 cloudCol; float cloudOp;
    if(u_cnt1<1.5){ cloud=c1; cloudCol=col1; cloudOp=op1; }
    else if(u_cnt1<2.5){ float mask=fbm(layerUV*0.55 + vec2(u_seed1*0.012))*0.6+0.2; cloud=mix(c1,c2,mask); cloudCol=mix(col1,col2,mask); cloudOp=mix(op1,op2,mask); }
    else { float m1=fbm(layerUV*0.4 + vec2(u_seed1*0.012))*0.5+0.25; float m2=fbm(layerUV*0.7 + vec2(u_seed1*0.02))*0.5+0.25; float w1=(1.0-m1)*(1.0-m2); float w2=m1; float w3=m2*(1.0-m1); float sum=w1+w2+w3+0.001; w1/=sum; w2/=sum; w3/=sum; cloud=c1*w1+c2*w2+c3*w3; cloudCol=col1*w1+col2*w2+col3*w3; cloudOp=op1*w1+op2*w2+op3*w3; }
    cloud=smoothstep(0.30, 0.68, cloud);
    cloud=smoothstep(effDensity-0.08, effDensity+0.22, cloud);
    float largeMask=fbm(layerUV*0.30 + vec2(u_seed1*0.012))*0.35+0.65; cloud*=largeMask;
    float e=0.01; float hl=fbm(layerUV+vec2(-e,0.0)); float hr=fbm(layerUV+vec2(e,0.0)); float hd=fbm(layerUV+vec2(0.0,-e)); float hu=fbm(layerUV+vec2(0.0,e)); vec2 grad=vec2(hr-hl, hu-hd)/(2.0*e); vec3 normal=normalize(vec3(-grad*0.7,1.0)); vec3 sunDir=normalize(vec3(0.4,0.7,0.6)); float shading=0.55+0.45*dot(normal,sunDir); shading=mix(1.0,shading,0.60);
    float interiorNoise=billowFbm(layerUV*2.6 + vec2(u_seed1*0.022))*0.5 + fbm(layerUV*3.1 + vec2(u_seed1*0.032))*0.5; float luminance=0.62 + interiorNoise*0.38; float heightBias=fbm(layerUV*0.85 + vec2(u_seed1*0.02))*0.6 + shading*0.4; float selfShadow=mix(0.70, 1.12, smoothstep(0.18, 0.82, heightBias));
    vec3 cCol=cloudCol*u_bright1*brightBoost*luminance*selfShadow*shading; cCol=mix(cCol, skyCol+vec3(0.08), 0.10);
    float alpha=cloud*0.88*u_mix1*u_opacity1*cloudOp*1.3*(0.85+0.38*brightBoost); alpha=clamp(alpha,0.0,1.0);
    finalCol=mix(finalCol, cCol, alpha);
  }
  // L2 BASS 하층운 6,7,8
  {
    float a=u_audio2; float beat=u_beat2;
    float scalePulse=1.0 + a*0.28 + beat*0.15; float speedBoost=1.0 + a*0.9 + beat*0.6;
    float brightBoost=1.0 + a*0.45 + beat*0.2; float densityBoost=1.0 + a*0.35;
