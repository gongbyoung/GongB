float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p);

  float a = hash(i);

  return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;

  for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; }

}
float billow(vec2 p){
  float n = fbm(p);

float ridged(vec2 p){
