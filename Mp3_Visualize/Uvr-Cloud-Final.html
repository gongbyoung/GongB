float irregularCloud(vec2 uv, float scale, float seed, float density, float time){
  vec2 base=uv*scale+vec2(seed*0.13, seed*0.07);
  float domainWarp=fbm(base*0.28 + vec2(seed*0.011))*0.78;
  vec2 pp=base + vec2(domainWarp, domainWarp*0.62);
  vec2 i=floor(pp);
  vec2 f=fract(pp);
  float best=0.0;
  for(int y=-1;y<=1;y++){
    for(int x=-1;x<=1;x++){
      vec2 nb=vec2(float(x),float(y));
      vec2 cell=i+nb;
      float h1=hash(cell+seed);
      float h2=hash(cell*1.7+seed+17.0);
      float h3=hash(cell*2.3+seed+31.0);
      vec2 jitter=vec2(h1,h2)*0.8-0.4;
      float sizeVar=h3*0.7+0.6; // 0.6x-1.3x irregular
      vec2 center=nb + vec2(0.5) + jitter;
      vec2 cellUV=f - center;
      // warp to break circles - bokeh already fixed
      float warp=fbm(cellUV*2.5 + vec2(seed*0.01, seed*0.013))*0.45;
      cellUV+=vec2(warp, warp*0.7);
      cellUV.x*=1.0 + h1*0.42;
      cellUV.y*=0.86 + h2*0.36;
      float b=billowFbm(cellUV*1.8 + vec2(seed*0.021, seed*0.017));
      float d=fbm(cellUV*2.2 + vec2(seed*0.009));
      float n=b*0.6 + d*0.4;
      float fall=exp(-dot(cellUV,cellUV)*2.2);
      fall*=0.82 + fbm(cellUV*3.3 + vec2(seed*0.02))*0.55;
      float shape=n * fall * sizeVar * 1.35;
      best=max(best, shape);
    }
  }
  // SOFT FIX: wide 0.15-0.82 (0.67 range) vs old hard 0.38-0.65 (0.27)
  float cloud=smoothstep(0.15, 0.82, best);
  // softer density threshold
  cloud=smoothstep(density-0.12, density+0.32, cloud);
  // feathery edge high freq fbm 6.5 *0.35+0.65
  float edgeFade=fbm(uv*6.5 + time*0.014 + vec2(seed*0.006, seed*0.009))*0.35+0.65;
  cloud*=edgeFade;
  float edgeTurb=fbm(uv*4.5 + time*0.011 + vec2(seed*0.005, seed*0.008))*0.28;
  cloud+=edgeTurb*0.18*cloud;
  return clamp(cloud,0.0,1.0);
}

void main(){
  vec2 uv=gl_FragCoord.xy / u_resolution;
  vec2 p=(uv-0.5)*2.0;
  float r=length(p);
  float fovFactor=u_fov/90.0;
  p*=fovFactor;
  r=length(p);
  float distort=1.0+r*r*0.15;
  vec2 domeUV=p*distort*0.5+0.5;
  vec2 clampedUV=clamp(domeUV,0.0,1.0);
  float gradT=pow(clampedUV.y,0.9);
  vec3 skyTop;
  vec3 skyBottom;
  if(u_skyMode<0.5){
    skyTop=vec3(95.0,135.0,200.0)/255.0;
    skyBottom=vec3(255.0,220.0,175.0)/255.0;
  } else if(u_skyMode<1.5){
    skyTop=vec3(58.0,141.0,222.0)/255.0;
    skyBottom=vec3(135.0,206.0,235.0)/255.0;
  } else if(u_skyMode<2.5){
    skyTop=vec3(42.0,42.0,110.0)/255.0;
    skyBottom=vec3(255.0,122.0,69.0)/255.0;
  } else {
    skyTop=vec3(10.0,14.0,26.0)/255.0;
    skyBottom=vec3(26.0,31.0,53.0)/255.0;
  }
  vec3 skyCol=mix(skyBottom, skyTop, gradT);
  if(u_skyMode>2.5){
    vec2 moonPos=vec2(0.72,0.82);
    float md=length(domeUV-moonPos);
    float moonGlow=exp(-md*8.0)*0.8 + exp(-md*18.0)*0.45;
    vec3 moonCol=vec3(0.92,0.94,1.0);
    skyCol+=moonCol*moonGlow*0.6;
    vec2 starCoord=floor(domeUV*700.0);
    float starHash=hash(starCoord);
    float star=step(0.9985, starHash);
    float twinkle=0.7+0.3*sin(u_time*2.0+starHash*20.0);
    skyCol+=vec3(star*twinkle*0.9);
  }
  float vign=1.0 - smoothstep(0.7,1.6, r);
  skyCol*=mix(0.82,1.0,vign);
  vec2 windOffset=vec2(u_time*u_wind*0.02, u_time*u_wind*0.004);
  vec3 finalCol=skyCol;

  // ---- SOFT VOLUMETRIC LAYERS: pow(cloud,0.8)*0.75 translucent + interior variation 0.6-1.0 + self-shadow 0.65-1.15 + scattering ----
  {
    vec2 layerUV=domeUV + windOffset*0.5;
    layerUV.x*=1.6;
    float cloud=irregularCloud(layerUV, u_scale0, u_seed0, u_density0, u_time);
    float largeMask=fbm(layerUV*0.28 + vec2(u_seed0*0.01))*0.45+0.55;
    cloud*=largeMask;
    float e=0.01;
    float hl=fbm(layerUV+vec2(-e,0.0)); float hr=fbm(layerUV+vec2(e,0.0));
    float hd=fbm(layerUV+vec2(0.0,-e)); float hu=fbm(layerUV+vec2(0.0,e));
    vec2 grad=vec2(hr-hl, hu-hd)/(2.0*e);
    vec3 normal=normalize(vec3(-grad*0.6,1.0));
    vec3 sunDir=normalize(vec3(0.4,0.7,0.6));
    float shading=0.55+0.45*dot(normal,sunDir);
    shading=mix(1.0,shading,0.55);
    float interiorNoise=billowFbm(layerUV*2.6 + vec2(u_seed0*0.02))*0.5 + fbm(layerUV*3.1 + vec2(u_seed0*0.03))*0.5;
    float luminance=0.6 + interiorNoise*0.4;
    float heightBias=fbm(layerUV*0.85 + vec2(u_seed0*0.018))*0.6 + shading*0.4;
    float selfShadow=mix(0.65, 1.15, smoothstep(0.18, 0.82, heightBias));
    vec3 cloudCol=vec3(1.0)*u_bright0*luminance*selfShadow*shading;
    vec3 scatterTint=skyBottom*0.25 + vec3(0.08);
    cloudCol=mix(cloudCol, scatterTint + cloudCol*0.55, cloud*0.22);
    cloudCol=mix(cloudCol, skyCol+vec3(0.12), 0.18);
    float softAlpha=pow(clamp(cloud,0.0,1.0), 0.8)*0.75;
    float alpha=softAlpha*u_mix0*u_opacity0*0.95;
    alpha=clamp(alpha,0.0,1.0);
    finalCol=mix(finalCol, cloudCol, alpha);
  }
  {
    vec2 layerUV=domeUV + windOffset*0.7 + vec2(0.13,0.07);
    layerUV.x*=1.6;
    float cloud=irregularCloud(layerUV, u_scale1, u_seed1, u_density1, u_time);
    float largeMask=fbm(layerUV*0.28 + vec2(u_seed1*0.012))*0.45+0.55;
    cloud*=largeMask;
    float e=0.01;
    float hl=fbm(layerUV+vec2(-e,0.0)); float hr=fbm(layerUV+vec2(e,0.0));
    float hd=fbm(layerUV+vec2(0.0,-e)); float hu=fbm(layerUV+vec2(0.0,e));
    vec2 grad=vec2(hr-hl, hu-hd)/(2.0*e);
    vec3 normal=normalize(vec3(-grad*0.7,1.0));
    vec3 sunDir=normalize(vec3(0.4,0.7,0.6));
    float shading=0.55+0.45*dot(normal,sunDir);
    shading=mix(1.0,shading,0.6);
    float interiorNoise=billowFbm(layerUV*2.6 + vec2(u_seed1*0.022))*0.5 + fbm(layerUV*3.1 + vec2(u_seed1*0.032))*0.5;
    float luminance=0.6 + interiorNoise*0.4;
    float heightBias=fbm(layerUV*0.85 + vec2(u_seed1*0.02))*0.6 + shading*0.4;
    float selfShadow=mix(0.65, 1.15, smoothstep(0.18, 0.82, heightBias));
    vec3 cloudCol=vec3(1.0)*u_bright1*luminance*selfShadow*shading;
    vec3 scatterTint=skyBottom*0.25 + vec3(0.08);
    cloudCol=mix(cloudCol, scatterTint + cloudCol*0.55, cloud*0.22);
    cloudCol=mix(cloudCol, skyCol+vec3(0.10), 0.15);
    float softAlpha=pow(clamp(cloud,0.0,1.0), 0.8)*0.75;
    float alpha=softAlpha*u_mix1*u_opacity1*0.95;
    alpha=clamp(alpha,0.0,1.0);
    finalCol=mix(finalCol, cloudCol, alpha);
  }
  {
    vec2 layerUV=domeUV + windOffset*0.9 + vec2(0.27,0.12);
    layerUV.x*=1.6;
    float cloud=irregularCloud(layerUV, u_scale2, u_seed2, u_density2, u_time);
    float largeMask=fbm(layerUV*0.28 + vec2(u_seed2*0.015))*0.45+0.55;
    cloud*=largeMask;
    float e=0.012;
    float hl=fbm(layerUV+vec2(-e,0.0)); float hr=fbm(layerUV+vec2(e,0.0));
    float hd=fbm(layerUV+vec2(0.0,-e)); float hu=fbm(layerUV+vec2(0.0,e));
    vec2 grad=vec2(hr-hl, hu-hd)/(2.0*e);
    vec3 normal=normalize(vec3(-grad*0.8,1.0));
    vec3 sunDir=normalize(vec3(0.4,0.7,0.6));
    float shading=0.55+0.45*dot(normal,sunDir);
    float interiorNoise=billowFbm(layerUV*2.6 + vec2(u_seed2*0.024))*0.5 + fbm(layerUV*3.1 + vec2(u_seed2*0.034))*0.5;
    float luminance=0.6 + interiorNoise*0.4;
    float heightBias=fbm(layerUV*0.85 + vec2(u_seed2*0.022))*0.6 + shading*0.4;
    float selfShadow=mix(0.65, 1.15, smoothstep(0.18, 0.82, heightBias));
    vec3 cloudCol=vec3(1.0)*u_bright2*luminance*selfShadow;
    cloudCol=mix(cloudCol*0.78, cloudCol*1.08, shading);
    vec3 scatterTint=skyBottom*0.25 + vec3(0.08);
    cloudCol=mix(cloudCol, scatterTint + cloudCol*0.55, cloud*0.22);
    cloudCol=mix(cloudCol, skyCol+vec3(0.08), 0.12);
    float softAlpha=pow(clamp(cloud,0.0,1.0), 0.8)*0.75;
    float alpha=softAlpha*u_mix2*u_opacity2*0.95;
    alpha=clamp(alpha,0.0,1.0);
    finalCol=mix(finalCol, cloudCol, alpha);
  }
  {
    vec2 layerUV=domeUV + windOffset*0.35 + vec2(0.41,0.19);
    layerUV.x*=1.6;
    float cloud=irregularCloud(layerUV, u_scale3, u_seed3, u_density3, u_time);
    float largeMask=fbm(layerUV*0.28 + vec2(u_seed3*0.008))*0.45+0.55;
    cloud*=largeMask;
    float e=0.01;
    float hl=fbm(layerUV+vec2(-e,0.0)); float hr=fbm(layerUV+vec2(e,0.0));
    float hd=fbm(layerUV+vec2(0.0,-e)); float hu=fbm(layerUV+vec2(0.0,e));
    vec2 grad=vec2(hr-hl, hu-hd)/(2.0*e);
    vec3 normal=normalize(vec3(-grad*0.5,1.0));
    vec3 sunDir=normalize(vec3(0.4,0.7,0.6));
    float shading=0.55+0.45*dot(normal,sunDir);
    float interiorNoise=billowFbm(layerUV*2.6 + vec2(u_seed3*0.02))*0.5 + fbm(layerUV*3.1 + vec2(u_seed3*0.03))*0.5;
    float luminance=0.6 + interiorNoise*0.4;
    float heightBias=fbm(layerUV*0.85 + vec2(u_seed3*0.018))*0.6 + shading*0.4;
    float selfShadow=mix(0.65, 1.15, smoothstep(0.18, 0.82, heightBias));
    vec3 cloudCol=vec3(1.0)*u_bright3*luminance*selfShadow*shading*0.92;
    vec3 scatterTint=skyBottom*0.25 + vec3(0.08);
    cloudCol=mix(cloudCol, scatterTint + cloudCol*0.55, cloud*0.22);
    cloudCol=mix(cloudCol, skyCol+vec3(0.14), 0.22);
    float softAlpha=pow(clamp(cloud,0.0,1.0), 0.8)*0.75;
    float alpha=softAlpha*u_mix3*u_opacity3*0.95;
    alpha=clamp(alpha,0.0,1.0);
    finalCol=mix(finalCol, cloudCol, alpha);
  }

  float edgeMask=smoothstep(1.35,0.9, r);
  finalCol=mix(skyCol*0.7, finalCol, edgeMask);
  outColor=vec4(finalCol,1.0);
}
