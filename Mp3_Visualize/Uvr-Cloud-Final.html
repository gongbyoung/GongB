float getCloudById(int id, vec2 uv, float time, float seed, float audio, float scale){
  if(id==1) return cloud_1_cirrocumulus(uv,time,seed,audio,scale);
  else if(id==2) return cloud_2_cirrus(uv,time,seed,audio,scale);
  else if(id==3) return cloud_3_cirrostratus(uv,time,seed,audio,scale);
  else if(id==4) return cloud_4_altostratus(uv,time,seed,audio,scale);
  else if(id==5) return cloud_5_altocumulus(uv,time,seed,audio,scale);
  else if(id==6) return cloud_6_stratus(uv,time,seed,audio,scale);
  else if(id==7) return cloud_7_stratocumulus(uv,time,seed,audio,scale);
  else if(id==8) return cloud_8_nimbostratus(uv,time,seed,audio,scale);
  else if(id==9) return cloud_9_cumulonimbus(uv,time,seed,audio,scale);

vec3 getColorById(int id, vec2 uv, float bright, float audio){

  else if(id==5) return white * bright * 0.95;
  else if(id==6) return vec3(0.92,0.93,0.95) * bright * 0.92;
  else if(id==7) return vec3(0.98,0.98,1.0) * bright * 0.90;
