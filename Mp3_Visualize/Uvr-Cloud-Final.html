// --- hash & noise ---
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
vec2 hash2(vec2 p){

  float b = hash(i+vec2(1.0,0.0));

    p*=2.03;
    a*=0.5;
  }

vec3 skyGradient(float v, float skyMode){
  // v 0=hor 1=zenith
  if(skyMode < 0.5){ // morning
    vec3 hor = vec3(1.0,0.78,0.62);
    vec3 mid = vec3(0.55,0.7,0.95);
    vec3 zen = vec3(0.25,0.45,0.85);
    float t1 = smoothstep(0.0,0.45,v);
    float t2 = smoothstep(0.45,1.0,v);
    return mix(mix(hor,mid,t1), zen, t2);
  } else if(skyMode < 1.5){ // noon
    vec3 hor = vec3(0.55,0.78,0.98);
    vec3 mid = vec3(0.32,0.58,0.92);
    vec3 zen = vec3(0.12,0.32,0.78);
    return mix(hor, zen, pow(v,0.9));
  } else if(skyMode < 2.5){ // sunset
    vec3 hor = vec3(1.0,0.55,0.32);
    vec3 mid = vec3(0.85,0.45,0.55);
    vec3 zen = vec3(0.18,0.22,0.55);
    float t = pow(v,0.8);
    return mix(hor, zen, t) + vec3(0.12,0.0,0.08)*sin(v*6.0)*0.15;
  } else { // night 56,61,82
    vec3 nightBase = vec3(56.0,61.0,82.0)/255.0;
    vec3 hor = nightBase*0.9;
    vec3 zen = nightBase*0.45;
    return mix(hor, zen, pow(v,1.2));
  }
}

float islandMask(vec2 p){
  // p world coords
  float m = 0.0;
  m += smoothstep(0.52,0.38, length(p*0.8 - vec2(0.3,0.1)))*0.9;
  m += smoothstep(0.42,0.28, length(p*1.1 - vec2(-0.5,0.25)))*0.75;
  m += smoothstep(0.35,0.22, length(p*1.3 - vec2(0.8,-0.3)))*0.6;
  // fbm detail to blob edge
  float n = fbm(p*1.9)*0.25;
  m = clamp(m + n*0.2,0.0,1.0);
  return m;
}

void main(){
  vec2 uv = v_uv;
  float aspect = u_resolution.x / u_resolution.y;
  vec2 p = (uv*2.0-1.0);
  p.x *= aspect;

  float isGlide = step(0.5, u_viewMode);
  float isGround = 1.0 - isGlide;
  float skyMode = u_skyMode;

  // FOV handling
  float fovRad = radians(u_fov);
  float fovScale = tan(fovRad*0.5);

  // vertical angle v: 0 horizon, 1 zenith
  float vElev = uv.y; // 0 bottom, 1 top
  // ground mode compresses near horizon for 140deg feeling
  float vPersp = isGround>0.5 ? pow(vElev, 1.35) : vElev;
  // for glide, vertical also but less compressed
  vPersp = mix(vPersp, pow(vElev,0.95), isGlide);

  // depth for parallax: far = 1 to 12km
  float depthFar = mix(1.0, 12.0, pow(vPersp, 1.3));
  // altitude influences horizon line
  float horizonBase = mix(0.28, 0.48, isGlide);
  float horizon = horizonBase + (u_altitude-1.0)*0.04*isGlide; // higher = more sky? actually more sea? invert
  horizon = mix(horizon, 0.38, isGround*0.5);
  horizon = clamp(horizon, 0.18, 0.58);

  // wind drift
  vec2 windOffset = vec2(u_time*0.01*u_wind, u_time*0.006*u_wind);

  // --- sky base ---
  vec3 skyCol = skyGradient(vPersp, skyMode);
  // aerial perspective haze near horizon
  float haze = 1.0 - smoothstep(0.0,0.35, abs(vElev - horizon)*2.2);
  skyCol = mix(skyCol, skyCol*1.25 + vec3(0.15), haze*0.35);

  // --- sea ---
  vec3 seaCol = vec3(0.0);
  float isSea = 1.0 - step(horizon, uv.y);
  if(isSea>0.5 || isGlide>0.5){
    // world sea coords: moving in glide mode
    vec2 seaUV = vec2(p.x*0.6 + windOffset.x*0.2, (horizon-uv.y)*1.8);
    // forward motion for glide
    seaUV.y += u_time*u_speed*0.25*isGlide;
    seaUV.x += u_time*0.02*isGlide;
    // base sea
    vec3 deep = vec3(0.08,0.28,0.52);
    vec3 shallow = vec3(0.18,0.48,0.78);
    float seaFbm = fbm(seaUV*2.2 + u_seeds[0]*0.1);
    seaCol = mix(deep, shallow, seaFbm*0.7 + 0.3);
    // islands procedural blobs
    float isl = islandMask(seaUV*0.9 + vec2(u_seeds[1], u_seeds[2])*0.05);
    vec3 islandCol = vec3(0.18,0.32,0.24)*0.9 + vec3(0.12,0.2,0.15)*fbm(seaUV*5.0);
    // add beach rim
    float beach = smoothstep(0.35,0.38, isl) - smoothstep(0.48,0.55, isl);
    islandCol += beach*vec3(0.85,0.78,0.55)*0.6;
    seaCol = mix(seaCol, islandCol, clamp(isl,0.0,1.0));
    // specular glint
    float glint = pow(noise(seaUV*35.0 + u_time*0.2), 28.0)*1.5;
    seaCol += glint*vec3(0.9,0.95,1.0)*0.5*isSea;
  }

  // --- cloud layers ---
  vec3 finalCol = skyCol;
  // blend sea first
  finalCol = mix(finalCol, seaCol, isSea * (0.92 - haze*0.2));

  // sun direction top-right
  vec2 sunDir = normalize(vec2(0.55, 0.75));
  float audioBoost = (u_audio[0]+u_audio[1]+u_audio[2]+u_audio[3])*0.06;

  // Layer High - Cirrus wispy streaks 8-10km
  {
    float scaleHigh = 2.5 * u_scale * 1.8;
    vec2 uvHigh = vec2(p.x*0.5, vPersp*1.2) * scaleHigh;
    uvHigh += windOffset*0.25 + vec2(u_seeds[3]*0.13, u_seeds[0]*0.07);
    uvHigh.x += u_time*0.008*isGlide + u_time*0.004*isGround;
    // stretched noise for cirrus
    vec2 warp = vec2(fbm(uvHigh*0.7), fbm(uvHigh*0.7+10.0))*0.6;
    float n = fbm(uvHigh*0.6 + warp);
    // wispy streaks via directional
    float streak = fbm(vec2(uvHigh.x*0.25, uvHigh.y*1.8 + n*1.2));
    float cirrusMask = smoothstep(0.35,0.78, streak) * smoothstep(0.55,0.42, abs(vPersp-0.85));
    cirrusMask *= 0.45; // opacity 0.25-0.45
    cirrusMask = mix(cirrusMask, cirrusMask*1.2, audioBoost);
    // scale large, semi-transparent, slight blue
    vec3 cirrusCol = vec3(0.96,0.97,1.0) + vec3(0.08,0.12,0.18)*0.2;
    // only in upper sky
    float upperFade = smoothstep(0.45, 0.78, vPersp);
    cirrusMask *= upperFade;
    finalCol = mix(finalCol, cirrusCol, cirrusMask * u_opacity * 0.85);

    cumScale = 1.2 / cumScale; // inverse so slider bigger = larger clouds (lower frequency)
    float depthFactor = depthFar; // far smaller

    puff = clamp(puff,0.0,1.0);

    largeMask = smoothstep(0.35,0.62, largeMask); // holes

    // self-shadowing: normal approx from fbm gradient

    // fade near horizon for ground perspective

    float glideFade = 1.0;

    vec2 shadowUV = baseUV - shadowOffset* (cumScale*1.5);

    float sd = cellular(shadowUV, sId, sPos, u_seeds[1]);
    float sJ = 0.5 + hash(sId*1.37 + u_seeds[2])*1.5;
    float sPuff = 1.0 - sd*2.5 / sJ;
    float sMask = smoothstep(0.45,0.68, sPuff) * largeMask;
    sMask = smoothstep(densThresh-0.08, densThresh+0.12, sMask);
    // darken sea by 0.3
    float shadowDark = sMask*0.32 * isSea * (1.0 - smoothstep(0.6,1.0, vPersp));

  }

  // Layer Low - Haze/Stratus veil near horizon
  {
    float lowScale = u_scale*0.55;
    vec2 uvLow = vec2(p.x*0.8, vPersp*0.6) * (1.5/lowScale);
    uvLow += windOffset*0.15 + vec2(u_seeds[2]*0.08,0.0);
    float nLow = fbm(uvLow*0.9);
    float veil = smoothstep(0.42,0.68, nLow) * 0.28;
    veil *= smoothstep(0.0,0.42, 1.0 - abs(vPersp - horizon)*2.5); // near horizon
    vec3 veilCol = vec3(0.88,0.90,0.92);
    finalCol = mix(finalCol, veilCol, veil*0.55*u_opacity);
  }

  // Extra micro detail for aerial depth: far tiny clouds as dots
  {
    float tinyScale = 3.2 / u_scale;
    vec2 tinyUV = vec2(p.x, vPersp) * tinyScale * 2.5 + vec2(u_seeds[3]*0.2, u_seeds[0]*0.2);

    vec2 tid; vec2 tpos;
    float td = cellular(tinyUV, tid, tpos, u_seeds[0]*1.1);
    float tj = 0.5 + hash(tid)*0.6;
    float tMask = smoothstep(0.72,0.88, 1.0 - td*3.2/tj);
    tMask *= smoothstep(0.55,0.95, vPersp); // only far upper
    tMask *= fbm(tinyUV*0.5)*0.5+0.5;
    finalCol = mix(finalCol, vec3(1.0), tMask*0.22*u_opacity);

  float vig = 1.0 - length(p*0.35)*0.18;
  finalCol *= vig;
  // subtle film grain for premium
  float grain = hash(uv*vec2(932.0,123.0) + u_time*3.0)*0.04 -0.02;
  finalCol += grain;

  outColor = vec4(finalCol,1.0);
