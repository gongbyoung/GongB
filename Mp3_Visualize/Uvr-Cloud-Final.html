// SOFT VOLUMETRIC FIX v20: wide falloff + feathery + pow alpha - no hard shape cutouts
float irregularCloud(vec2 uv, float scale, float seed, float density, float time){
  vec2 base=uv*scale+vec2(seed*0.13, seed*0.07);
  float domainWarp=fbm(base*0.28 + vec2(seed*0.011))*0.78;
  vec2 pp=base + vec2(domainWarp, domainWarp*0.62);
  vec2 i=floor(pp);
  vec2 f=fract(pp);
  float best=0.0;
  for(int y=-1;y<=1;y++){
    for(int x=-1;x<=1;x++){
      vec2 nb=vec2(float(x),float(y));
      vec2 cell=i+nb;
      float h1=hash(cell+seed);
      float h2=hash(cell*1.7+seed+17.0);
      float h3=hash(cell*2.3+seed+31.0);
      vec2 jitter=vec2(h1,h2)*0.8-0.4;
      float sizeVar=h3*0.7+0.6; // 0.6x-1.3x irregular
      vec2 center=nb + vec2(0.5) + jitter;
      vec2 cellUV=f - center;
      // warp to break circles - bokeh already fixed
      float warp=fbm(cellUV*2.5 + vec2(seed*0.01, seed*0.013))*0.45;
      cellUV+=vec2(warp, warp*0.7);
      cellUV.x*=1.0 + h1*0.42;
      cellUV.y*=0.86 + h2*0.36;
      float b=billowFbm(cellUV*1.8 + vec2(seed*0.021, seed*0.017));
      float d=fbm(cellUV*2.2 + vec2(seed*0.009));
      float n=b*0.6 + d*0.4;
      float fall=exp(-dot(cellUV,cellUV)*2.2);
      fall*=0.82 + fbm(cellUV*3.3 + vec2(seed*0.02))*0.55;
      float shape=n * fall * sizeVar * 1.35;
      best=max(best, shape);
    }
  }
  // SOFT FIX: wide 0.15-0.82 (0.67 range) vs old hard 0.38-0.65 (0.27)
  float cloud=smoothstep(0.15, 0.82, best);
  // softer density threshold
  cloud=smoothstep(density-0.12, density+0.32, cloud);
  // feathery edge high freq fbm 6.5 *0.35+0.65
  float edgeFade=fbm(uv*6.5 + time*0.014 + vec2(seed*0.006, seed*0.009))*0.35+0.65;
  cloud*=edgeFade;
  float edgeTurb=fbm(uv*4.5 + time*0.011 + vec2(seed*0.005, seed*0.008))*0.28;
  cloud+=edgeTurb*0.18*cloud;
  return clamp(cloud,0.0,1.0);
}
