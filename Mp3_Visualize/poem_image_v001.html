<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선 시화 - 오디오 리액티브</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    /* 파일 선택 버튼 스타일 */
    input[type="file"] {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      font-size: 15px;
      padding: 10px 14px;
      background: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <!-- p5.js + p5.sound CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
  
  <!-- 메인 스케치 -->
  <script src="sketch.js"></script>
</body>
</html>
