<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선 시화 - 최종판</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: sans-serif;
      color: #eee;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(0,0,0,0.9);
      padding: 14px;
      border-radius: 12px;
      width: 340px;
      max-height: 96vh;
      overflow-y: auto;
      font-size: 13px;
    }
    #ui label {
      display: block;
      margin: 9px 0 3px;
      color: #ccc;
    }
    #ui input[type="file"],
    #ui select {
      width: 100%;
      margin-bottom: 4px;
      padding: 4px;
    }
    #ui input[type="range"] {
      width: 100%;
    }
    #ui button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: #4a90e2;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #ui button:hover { background: #357abd; }
    #ui button.secondary { background: #555; }
    #ui button.danger { background: #c44; }
    #status {
      margin-top: 10px;
      color: #8f8;
      line-height: 1.4;
      white-space: pre-line;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .row label {
      flex: 1;
      margin: 0;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .control-row span {
      min-width: 36px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label>1. 음악 파일</label>
    <input type="file" id="musicInput" accept="audio/*">

    <label>2. SRT 자막 파일</label>
    <input type="file" id="srtInput" accept=".srt">

    <label>3. 이미지들 (여러 장)</label>
    <input type="file" id="imageInput" accept="image/*" multiple>

    <hr style="border-color:#444; margin:12px 0;">

    <label>캔버스 방향</label>
    <select id="orientation">
      <option value="portrait">세로모드 (1080×1920)</option>
      <option value="landscape">가로모드 (1920×1080)</option>
    </select>

    <label>글자 방향</label>
    <select id="writingMode">
      <option value="horizontal">가로쓰기</option>
      <option value="vertical">세로쓰기</option>
    </select>

    <label>폰트</label>
    <select id="fontSelect">
      <option value="serif">명조 (Serif)</option>
      <option value="sans-serif">고딕 (Sans)</option>
      <option value="'Nanum Myeongjo', serif">나눔명조</option>
      <option value="'Noto Serif KR', serif">본명조</option>
      <option value="'Gaegu', cursive">손글씨 느낌</option>
      <option value="cursive">필기체</option>
    </select>

    <label>글자 크기</label>
    <div class="control-row">
      <input type="range" id="textSize" min="16" max="70" value="34">
      <span id="textSizeVal">34</span>
    </div>

    <label>위치 X</label>
    <div class="control-row">
      <input type="range" id="textX" min="40" max="1800" value="100">
      <span id="textXVal">100</span>
    </div>

    <label>위치 Y</label>
    <div class="control-row">
      <input type="range" id="textY" min="40" max="1700" value="160">
      <span id="textYVal">160</span>
    </div>

    <label>줄 간격</label>
    <div class="control-row">
      <input type="range" id="lineHeight" min="24" max="90" value="46">
      <span id="lineHeightVal">46</span>
    </div>

    <label>캘리그라피 효과 강도</label>
    <div class="control-row">
      <input type="range" id="calligraphy" min="0" max="100" value="35">
      <span id="calligraphyVal">35</span>
    </div>

    <button id="previewBtn" class="secondary">최종 시 미리보기</button>
    <button id="startBtn">시작하기 + 영상 저장</button>

    <div id="status">모든 파일을 선택한 뒤<br>미리보기로 위치/효과를 확인하세요</div>
  </div>

  <!-- 구글 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&family=Noto+Serif+KR&family=Gaegu&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
