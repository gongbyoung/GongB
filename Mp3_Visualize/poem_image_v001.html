<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선 시화 - 오디오 리액티브</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      font-family: sans-serif;
      color: #eee;
    }
    #ui {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 10px;
      width: 280px;
    }
    #ui input[type="file"] {
      margin-bottom: 10px;
      width: 100%;
    }
    #ui textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 8px;
      resize: vertical;
      font-size: 14px;
    }
    #ui button {
      width: 100%;
      padding: 8px;
      background: #4a90e2;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    #ui button:hover {
      background: #357abd;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="ui">
    <input type="file" id="musicInput" accept="audio/*">
    <textarea id="lyricsInput" placeholder="여기에 시(가사)를 입력하세요.&#10;한 줄에 한 구절씩 적어주세요."></textarea>
    <button id="startBtn">시작하기</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
