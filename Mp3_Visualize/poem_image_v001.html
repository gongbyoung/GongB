<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선 시화 - 시 쌓기</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: sans-serif;
      color: #eee;
    }
    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(0,0,0,0.88);
      padding: 14px;
      border-radius: 12px;
      width: 320px;
      max-height: 96vh;
      overflow-y: auto;
      font-size: 13px;
    }
    #ui label {
      display: block;
      margin: 10px 0 3px;
      color: #ccc;
    }
    #ui input[type="file"] {
      width: 100%;
      margin-bottom: 4px;
    }
    #ui input[type="range"] {
      width: 100%;
    }
    #ui button {
      width: 100%;
      padding: 9px;
      margin-top: 8px;
      background: #4a90e2;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #ui button:hover {
      background: #357abd;
    }
    #ui button.secondary {
      background: #555;
    }
    #status {
      margin-top: 10px;
      color: #8f8;
      line-height: 1.4;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .control-row span {
      min-width: 40px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label>1. 음악 파일</label>
    <input type="file" id="musicInput" accept="audio/*">

    <label>2. SRT 자막 파일</label>
    <input type="file" id="srtInput" accept=".srt">

    <label>3. 이미지들 (여러 장 선택)</label>
    <input type="file" id="imageInput" accept="image/*" multiple>

    <hr style="border-color:#444; margin: 14px 0;">

    <label>시 텍스트 크기</label>
    <div class="control-row">
      <input type="range" id="textSize" min="18" max="60" value="32">
      <span id="textSizeVal">32</span>
    </div>

    <label>시 위치 X (왼쪽← →오른쪽)</label>
    <div class="control-row">
      <input type="range" id="textX" min="50" max="1000" value="120">
      <span id="textXVal">120</span>
    </div>

    <label>시 위치 Y (위← →아래)</label>
    <div class="control-row">
      <input type="range" id="textY" min="50" max="1600" value="180">
      <span id="textYVal">180</span>
    </div>

    <label>줄 간격</label>
    <div class="control-row">
      <input type="range" id="lineHeight" min="28" max="80" value="42">
      <span id="lineHeightVal">42</span>
    </div>

    <button id="previewBtn" class="secondary">최종 시 미리보기</button>
    <button id="startBtn">시작하기</button>

    <div id="status">음악 → SRT → 이미지 선택 후<br>미리보기로 위치 확인하세요</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
