<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선 시화 - 이미지 시퀀스</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: sans-serif;
      color: #eee;
    }
    #ui {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(0,0,0,0.8);
      padding: 16px;
      border-radius: 12px;
      width: 300px;
    }
    #ui label {
      display: block;
      margin: 8px 0 4px;
      font-size: 13px;
      color: #ccc;
    }
    #ui input[type="file"] {
      width: 100%;
      margin-bottom: 6px;
    }
    #ui button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      background: #4a90e2;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #8f8;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label>음악 파일</label>
    <input type="file" id="musicInput" accept="audio/*">

    <label>SRT 자막 파일</label>
    <input type="file" id="srtInput" accept=".srt">

    <button id="startBtn">시작하기</button>
    <div id="status">이미지 폴더: Assets/001.png ~ 순서로 준비</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
