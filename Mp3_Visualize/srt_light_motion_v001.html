<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자모 LED 키네틱 타이포그래피001</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        header h1 {
            font-size: 18px;
            margin-right: 15px;
            color: #ffd700;
            white-space: nowrap;
        }
        button, input[type="file"], select, input[type="text"] {
            background: #0f3460;
            color: white;
            border: 1px solid #533483;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover {
            background: #533483;
            border-color: #7b5ea7;
        }
        input[type="file"] { padding: 5px; }
        select { padding: 7px; }
        input[type="text"] { cursor: text; }
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .time-display {
            font-family: monospace;
            background: #0a0a1a;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        #timeline {
            flex: 1;
            min-width: 120px;
            cursor: pointer;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #0f3460;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .slider-container label { white-space: nowrap; }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #0d1117;
            position: relative;
            min-height: 0;
        }
        canvas {
            max-width: 100%;
            max-height: 65vh;
            border: 1px solid #333;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .current-sentence {
            margin-top: 15px;
            background: rgba(0,0,0,0.75);
            padding: 12px 22px;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            color: #aaa;
            text-align: center;
            max-width: 90%;
            min-height: 45px;
            white-space: pre-wrap;
            word-break: keep-all;
            pointer-events: none;
        }
        .current-sentence .lit {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.7);
        }
        .font-picker-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎵 자모 LED 키네틱 타이포</h1>
        <input type="file" id="srtFile" accept=".srt">
        <input type="file" id="audioFile" accept="audio/*">
        <button id="loadSample">샘플 SRT</button>
        <div class="controls">
            <button id="playBtn">▶ 재생</button>
            <button id="stopBtn">⏹ 정지</button>
            <input type="range" id="timeline" min="0" max="100" step="0.01" value="0">
            <span class="time-display" id="timeDisplay">00:00.00</span>
            <select id="aspectRatio">
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
            </select>
            <div class="font-picker-row">
                <select id="fontSelect">
                    <option value="'Noto Sans KR', 'Malgun Gothic', sans-serif">Noto Sans KR</option>
                    <option value="'Malgun Gothic', sans-serif">맑은 고딕</option>
                    <option value="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">Apple Gothic</option>
                    <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                    <option value="'Gulim', sans-serif">굴림</option>
                    <option value="'Arial', sans-serif">Arial</option>
                </select>
                <input type="text" id="customFont" placeholder="폰트 이름 입력" style="width:120px;">
                <button id="applyFontBtn">적용</button>
                <button id="systemFontsBtn">🔍 시스템 폰트</button>
            </div>
            <div class="slider-container">
                <label for="scatterSlider">흩어짐:</label>
                <input type="range" id="scatterSlider" min="0" max="100" value="50" step="1">
                <span id="scatterValue">50</span>
            </div>
            <div class="slider-container">
                <label for="fontSizeSlider">글자 크기:</label>
                <input type="range" id="fontSizeSlider" min="20" max="120" value="80" step="1">
                <span id="fontSizeValue">80</span>
            </div>
            <button id="shuffleBtn">🔀 셔플</button>
            <button id="saveBtn" style="background:#2ecc71; border-color:#2ecc71; color:#000; font-weight:bold;">💾 MP4 저장</button>
        </div>
    </header>

    <div class="main-area">
        <canvas id="canvas" width="1280" height="720"></canvas>
        <div class="current-sentence" id="currentSentence"></div>
    </div>

    <audio id="audio" style="display:none;"></audio>

    <script>
        // ==================== 유틸리티 ====================
        function timeToSeconds(str) {
            const parts = str.split(':');
            if (parts.length === 3) {
                const [h, m, s] = parts;
                const [sec, ms] = s.split(',');
                return parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(sec) + (parseInt(ms || 0) / 1000);
            }
            return 0;
        }

        function parseSRT(content) {
            const blocks = content.trim().split(/\n\s*\n/);
            const cues = [];
            blocks.forEach((block, idx) => {
                const lines = block.trim().split('\n');
                if (lines.length < 2) return;
                const timeLineIndex = lines.findIndex(l => l.includes('-->'));
                if (timeLineIndex === -1) return;
                const timeLine = lines[timeLineIndex];
                const [startStr, endStr] = timeLine.split('-->').map(s => s.trim());
                const start = timeToSeconds(startStr);
                const end = timeToSeconds(endStr);
                const text = lines.slice(timeLineIndex + 1)
                    .join('\n')
                    .replace(/\{\\.*?\}/g, '')
                    .replace(/<[^>]*>/g, '')
                    .trim();
                cues.push({ start, end, text });
            });
            return cues;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 100);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
        }

        // ==================== 한글 자모 분해 ====================
        const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
        const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

        function decomposeKorean(syllable) {
            const code = syllable.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const offset = code - 0xAC00;
                const choIdx = Math.floor(offset / 588);
                const jungIdx = Math.floor((offset % 588) / 28);
                const jongIdx = offset % 28;
                const result = [CHO[choIdx], JUNG[jungIdx]];
                if (jongIdx > 0) result.push(JONG[jongIdx]);
                return result;
            }
            return [syllable];
        }

        // ==================== 전역 상태 ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audio');
        const timeline = document.getElementById('timeline');
        const timeDisplay = document.getElementById('timeDisplay');
        const currentSentenceEl = document.getElementById('currentSentence');
        const fontSelect = document.getElementById('fontSelect');
        const customFontInput = document.getElementById('customFont');
        const applyFontBtn = document.getElementById('applyFontBtn');
        const systemFontsBtn = document.getElementById('systemFontsBtn');
        const scatterSlider = document.getElementById('scatterSlider');
        const scatterValueSpan = document.getElementById('scatterValue');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeValueSpan = document.getElementById('fontSizeValue');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const aspectRatioSelect = document.getElementById('aspectRatio');

        let cues = [];
        let uniqueComponents = [];
        let currentTime = 0;
        let isPlaying = false;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let audioCtx = null;
        let audioSource = null;
        let audioDest = null;
        let scatterAmount = 0.5;
        let currentFont = "'Noto Sans KR', 'Malgun Gothic', sans-serif";
        let currentFontSize = 80;

        // ==================== SRT 및 오디오 로딩 ====================
        document.getElementById('srtFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                loadSRT(ev.target.result);
            };
            reader.readAsText(file);
        });

        document.getElementById('loadSample').addEventListener('click', function() {
            const sample = `1
00:00:00,000 --> 00:00:03,000
안녕하세요

2
00:00:03,500 --> 00:00:07,000
오늘은 즐거운 날

3
00:00:07,500 --> 00:00:11,000
함께 노래해요

4
00:00:11,500 --> 00:00:15,000
라라라 라라라

5
00:00:15,500 --> 00:00:20,000
신나는 음악과 함께
`;
            loadSRT(sample);
        });

        document.getElementById('audioFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            audio.src = URL.createObjectURL(file);
            audio.load();
            if (audioCtx) {
                audioCtx.close().catch(() => {});
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioSource = audioCtx.createMediaElementSource(audio);
            audioDest = audioCtx.createMediaStreamDestination();
            audioSource.connect(audioDest);
            audioSource.connect(audioCtx.destination);
        });

        function loadSRT(content) {
            cues = parseSRT(content);
            buildComponentIntervals();
            assignInitialPositions();
            avoidOverlaps();
            setupTimeline();
            currentTime = 0;
            updateTimeDisplay();
            render();
        }

        // ==================== 자모 컴포넌트 인터벌 구축 ====================
        function buildComponentIntervals() {
            const componentMap = new Map();

            cues.forEach(cue => {
                const chars = Array.from(cue.text);
                chars.forEach(char => {
                    if (char.trim() === '') return;
                    const components = decomposeKorean(char);
                    const numComponents = components.length;
                    const syllableDuration = cue.end - cue.start;
                    const step = syllableDuration / numComponents;
                    const fullLitTime = cue.start + (numComponents - 1) * step;

                    components.forEach((comp, idx) => {
                        if (!componentMap.has(comp)) {
                            componentMap.set(comp, { char: comp, intervals: [] });
                        }
                        const entry = componentMap.get(comp);
                        entry.intervals.push({
                            start: cue.start + idx * step,
                            end: cue.end,
                            fullLitTime: fullLitTime
                        });
                    });
                });
            });

            uniqueComponents = Array.from(componentMap.values());
            uniqueComponents.forEach(entry => {
                entry.intervals.sort((a, b) => a.start - b.start);
                entry.firstStart = entry.intervals[0]?.start || 0;
            });
            uniqueComponents.sort((a, b) => a.firstStart - b.firstStart);
        }

        // ==================== 랜덤 위치 배치 (기존 스타일) ====================
        function assignInitialPositions() {
            const w = canvas.width;
            const h = canvas.height;
            const margin = 30;
            const centerX = w / 2;
            const centerY = h / 2;
            const maxRadius = Math.min(w, h) * 0.45;

            uniqueComponents.forEach(entry => {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * maxRadius;
                entry.baseX = centerX + Math.cos(angle) * dist;
                entry.baseY = centerY + Math.sin(angle) * dist;

                // 클램프
                entry.baseX = Math.min(Math.max(entry.baseX, margin), w - margin);
                entry.baseY = Math.min(Math.max(entry.baseY, margin), h - margin);

                updateEntryPosition(entry);
            });
        }

        function updateEntryPosition(entry) {
            const spreadFactor = scatterAmount;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            // baseX/Y는 이미 중심에서 일정 반경 내에 있음. scatterAmount가 0이면 중심으로.
            const x = centerX + (entry.baseX - centerX) * spreadFactor;
            const y = centerY + (entry.baseY - centerY) * spreadFactor;
            entry.x = Math.min(Math.max(x, 20), canvas.width - 20);
            entry.y = Math.min(Math.max(y, 20), canvas.height - 20);
        }

        // ==================== 겹침 회피 ====================
        function avoidOverlaps() {
            if (uniqueComponents.length < 2) return;
            ctx.font = `${currentFontSize}px ${currentFont}`;
            // 각 컴포넌트의 대략적인 폭 계산
            const widths = uniqueComponents.map(entry => {
                return ctx.measureText(entry.char).width;
            });

            const iterations = 200;
            const pushForce = 0.5;

            for (let iter = 0; iter < iterations; iter++) {
                let moved = false;
                for (let i = 0; i < uniqueComponents.length; i++) {
                    for (let j = i + 1; j < uniqueComponents.length; j++) {
                        const entryA = uniqueComponents[i];
                        const entryB = uniqueComponents[j];
                        const dx = entryB.x - entryA.x;
                        const dy = entryB.y - entryA.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = (widths[i] + widths[j]) / 2 + 2; // 여유 2px
                        if (dist < minDist && dist > 0) {
                            const overlap = (minDist - dist) / 2;
                            const nx = dx / dist;
                            const ny = dy / dist;
                            // 반대 방향으로 이동
                            entryA.x -= nx * overlap * pushForce;
                            entryA.y -= ny * overlap * pushForce;
                            entryB.x += nx * overlap * pushForce;
                            entryB.y += ny * overlap * pushForce;

                            // 클램프
                            entryA.x = Math.min(Math.max(entryA.x, 20), canvas.width - 20);
                            entryA.y = Math.min(Math.max(entryA.y, 20), canvas.height - 20);
                            entryB.x = Math.min(Math.max(entryB.x, 20), canvas.width - 20);
                            entryB.y = Math.min(Math.max(entryB.y, 20), canvas.height - 20);
                            moved = true;
                        }
                    }
                }
                if (!moved) break;
            }
        }

        function reshufflePositions() {
            assignInitialPositions();
            avoidOverlaps();
            render();
        }

        // ==================== 화면 비율 변경 ====================
        aspectRatioSelect.addEventListener('change', function() {
            const ratio = this.value;
            if (ratio === '16:9') {
                canvas.width = 1280;
                canvas.height = 720;
            } else {
                canvas.width = 720;
                canvas.height = 1280;
            }
            assignInitialPositions();
            avoidOverlaps();
            render();
        });

        // ==================== 폰트 관련 ====================
        applyFontBtn.addEventListener('click', function() {
            const customFont = customFontInput.value.trim();
            if (customFont) {
                currentFont = `'${customFont}', sans-serif`;
                fontSelect.value = currentFont;
                render();
            }
        });

        fontSelect.addEventListener('change', function() {
            currentFont = this.value;
            avoidOverlaps();
            render();
        });

        systemFontsBtn.addEventListener('click', async function() {
            if (navigator.fonts && navigator.fonts.query) {
                try {
                    const fonts = await navigator.fonts.query();
                    const fontSet = new Set();
                    fonts.forEach(f => {
                        if (f.family && f.family !== '') fontSet.add(f.family);
                    });
                    const fontList = Array.from(fontSet).sort();
                    if (fontList.length === 0) {
                        alert('시스템 폰트를 찾을 수 없습니다. (브라우저 제한)');
                        return;
                    }
                    fontList.forEach(font => {
                        const opt = document.createElement('option');
                        opt.value = `'${font}', sans-serif`;
                        opt.textContent = font;
                        fontSelect.appendChild(opt);
                    });
                    alert(`${fontList.length}개의 시스템 폰트를 목록에 추가했습니다.`);
                } catch (err) {
                    alert('시스템 폰트를 불러올 수 없습니다: ' + err.message);
                }
            } else {
                alert('이 브라우저는 시스템 폰트 목록을 지원하지 않습니다. 폰트 이름을 직접 입력해주세요.');
            }
        });

        // ==================== 타임라인 및 재생 ====================
        function setupTimeline() {
            const maxTime = cues.length > 0 ? Math.max(...cues.map(c => c.end)) : 0;
            timeline.max = maxTime;
            timeline.value = 0;
        }

        function updateTimeDisplay() {
            timeDisplay.textContent = formatTime(currentTime);
        }

        timeline.addEventListener('input', () => {
            currentTime = parseFloat(timeline.value);
            updateTimeDisplay();
            render();
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            if (cues.length === 0) return;
            isPlaying = true;
            if (audio.src) {
                audio.currentTime = currentTime;
                audio.play().catch(() => {});
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            isPlaying = false;
            isRecording = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            audio.pause();
            if (audioCtx) audioCtx.suspend();
        });

        audio.addEventListener('timeupdate', () => {
            currentTime = audio.currentTime;
            timeline.value = currentTime;
            updateTimeDisplay();
        });

        audio.addEventListener('pause', () => { if (!isRecording) isPlaying = false; });
        audio.addEventListener('play', () => { isPlaying = true; });

        // ==================== 산란 및 글자 크기 UI ====================
        scatterSlider.addEventListener('input', () => {
            scatterAmount = scatterSlider.value / 100;
            scatterValueSpan.textContent = scatterSlider.value;
            uniqueComponents.forEach(entry => updateEntryPosition(entry));
            avoidOverlaps();
            render();
        });

        fontSizeSlider.addEventListener('input', () => {
            currentFontSize = parseInt(fontSizeSlider.value);
            fontSizeValueSpan.textContent = currentFontSize;
            avoidOverlaps();
            render();
        });

        shuffleBtn.addEventListener('click', reshufflePositions);

        // ==================== 렌더링 ====================
        function isComponentActive(compEntry, time) {
            return compEntry.intervals.some(interval => time >= interval.start && time <= interval.end);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (uniqueComponents.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('SRT 파일을 로드하세요', canvas.width/2, canvas.height/2);
                updateCurrentSentence();
                return;
            }

            const fontFamily = currentFont || fontSelect.value;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${currentFontSize}px ${fontFamily}`;

            const activeColor = '#ffd700';
            const inactiveColor = 'rgba(255,255,255,0.3)';

            uniqueComponents.forEach(entry => {
                const x = entry.x;
                const y = entry.y;
                const isActive = isComponentActive(entry, currentTime);

                if (isActive) {
                    ctx.fillStyle = activeColor;
                    ctx.shadowColor = activeColor;
                    ctx.shadowBlur = 15;
                    ctx.fillText(entry.char, x, y);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.strokeStyle = inactiveColor;
                    ctx.lineWidth = 2;
                    ctx.strokeText(entry.char, x, y);
                }
            });

            updateCurrentSentence();
        }

        function updateCurrentSentence() {
            const activeCue = cues.find(cue => currentTime >= cue.start && currentTime <= cue.end);
            if (!activeCue) {
                currentSentenceEl.textContent = '';
                return;
            }

            const chars = Array.from(activeCue.text);
            let html = '';
            chars.forEach(char => {
                if (char.trim() === '') {
                    html += ' ';
                    return;
                }
                const components = decomposeKorean(char);
                const numComp = components.length;
                const syllableDuration = activeCue.end - activeCue.start;
                const step = syllableDuration / numComp;
                const fullLitTime = activeCue.start + (numComp - 1) * step;
                const isLit = currentTime >= fullLitTime;
                html += isLit ? `<span class="lit">${char}</span>` : char;
            });
            currentSentenceEl.innerHTML = html;
        }

        // ==================== 애니메이션 루프 ====================
        let lastFrameTime = performance.now();
        function animationLoop(now) {
            const dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            if (isPlaying && !isRecording) {
                currentTime += dt;
                const maxTime = parseFloat(timeline.max);
                if (currentTime >= maxTime) {
                    currentTime = maxTime;
                    isPlaying = false;
                    audio.pause();
                }
                timeline.value = currentTime;
                updateTimeDisplay();
            }

            if (isRecording) {
                currentTime += dt;
                const maxTime = parseFloat(timeline.max);
                if (currentTime >= maxTime) {
                    currentTime = maxTime;
                    render();
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                    isRecording = false;
                    isPlaying = false;
                    audio.pause();
                    if (audioCtx) audioCtx.suspend();
                } else {
                    timeline.value = currentTime;
                    updateTimeDisplay();
                }
            }

            render();
            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);

        // ==================== MP4 저장 ====================
        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=avc1.42E01E',
                'video/mp4',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            for (const t of types) {
                if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
            }
            return 'video/webm';
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (isRecording) return;
            if (cues.length === 0) { alert('SRT 자막을 먼저 로드하세요.'); return; }
            const maxTime = parseFloat(timeline.max);
            if (maxTime <= 0) return;

            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

            currentTime = 0;
            timeline.value = 0;
            isPlaying = true;
            isRecording = true;
            recordedChunks = [];

            const canvasStream = canvas.captureStream(60);
            let combinedStream = canvasStream;
            if (audioDest && audioDest.stream.getAudioTracks().length > 0) {
                combinedStream = new MediaStream();
                canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
                audioDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
            }

            const mimeType = getSupportedMimeType();
            mediaRecorder = new MediaRecorder(combinedStream, {
                mimeType,
                videoBitsPerSecond: 8_000_000
            });

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `kinetic_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                isRecording = false;
                isPlaying = false;
            };

            mediaRecorder.start(1000);

            const audioEl = document.getElementById('audio');
            if (audioEl.src && audioCtx) {
                audioEl.currentTime = 0;
                audioEl.play().catch(() => {});
            }
        });

        // ==================== 초기화 ====================
        function init() {
            setupTimeline();
            render();
        }
        init();
    </script>
</body>
</html>
