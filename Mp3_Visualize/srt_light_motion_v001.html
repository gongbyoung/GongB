<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamo Kinetic Typography Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        header h1 {
            font-size: 20px;
            margin-right: 20px;
            color: #ffd700;
        }
        button, input[type="file"], select {
            background: #0f3460;
            color: white;
            border: 1px solid #533483;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover {
            background: #533483;
            border-color: #7b5ea7;
        }
        input[type="file"] {
            padding: 6px;
        }
        select {
            padding: 8px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .time-display {
            font-family: monospace;
            background: #0a0a1a;
            padding: 4px 8px;
            border-radius: 4px;
        }
        #timeline {
            flex: 1;
            min-width: 150px;
            cursor: pointer;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0d1117;
            position: relative;
            min-height: 0;
        }
        canvas {
            max-width: 100%;
            max-height: 60vh;
            border: 1px solid #333;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .current-sentence {
            margin-top: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            text-align: center;
            max-width: 90%;
            min-height: 50px;
            white-space: pre-wrap;
            word-break: keep-all;
            pointer-events: none;
        }
        .current-sentence .lit {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.7);
        }
    </style>
</head>
<body>
    <header>
        <h1>🎵 자모 키네틱 타이포</h1>
        <input type="file" id="srtFile" accept=".srt">
        <input type="file" id="audioFile" accept="audio/*">
        <button id="loadSample">샘플 SRT</button>
        <div class="controls">
            <button id="playBtn">▶ 재생</button>
            <button id="stopBtn">⏹ 정지</button>
            <input type="range" id="timeline" min="0" max="100" step="0.01" value="0">
            <span class="time-display" id="timeDisplay">00:00.00</span>
            <select id="fontSelect">
                <option value="'Noto Sans KR', 'Malgun Gothic', sans-serif">Noto Sans KR</option>
                <option value="'Malgun Gothic', sans-serif">맑은 고딕</option>
                <option value="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">Apple Gothic</option>
                <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                <option value="'Gulim', sans-serif">굴림</option>
                <option value="'Arial', sans-serif">Arial</option>
            </select>
            <button id="saveBtn" class="save-btn">💾 MP4 저장</button>
        </div>
    </header>

    <div class="main-area">
        <canvas id="canvas" width="1200" height="700"></canvas>
        <div class="current-sentence" id="currentSentence"></div>
    </div>

    <audio id="audio" style="display:none;"></audio>

    <script>
        // ==================== 유틸리티 ====================
        function timeToSeconds(str) {
            const parts = str.split(':');
            if (parts.length === 3) {
                const [h, m, s] = parts;
                const [sec, ms] = s.split(',');
                return parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(sec) + (parseInt(ms || 0) / 1000);
            }
            return 0;
        }

        function parseSRT(content) {
            const blocks = content.trim().split(/\n\s*\n/);
            const cues = [];
            blocks.forEach((block, idx) => {
                const lines = block.trim().split('\n');
                if (lines.length < 2) return;
                const timeLineIndex = lines.findIndex(l => l.includes('-->'));
                if (timeLineIndex === -1) return;
                const timeLine = lines[timeLineIndex];
                const [startStr, endStr] = timeLine.split('-->').map(s => s.trim());
                const start = timeToSeconds(startStr);
                const end = timeToSeconds(endStr);
                const text = lines.slice(timeLineIndex + 1)
                    .join('\n')
                    .replace(/\{\\.*?\}/g, '')
                    .replace(/<[^>]*>/g, '')
                    .trim();
                cues.push({ start, end, text });
            });
            return cues;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 100);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
        }

        // ==================== 한글 자모 분해 ====================
        const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
        const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

        function decomposeKorean(syllable) {
            const code = syllable.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const offset = code - 0xAC00;
                const choIdx = Math.floor(offset / (21 * 28));
                const jungIdx = Math.floor((offset % (21 * 28)) / 28);
                const jongIdx = offset % 28;
                return [CHO[choIdx], JUNG[jungIdx], ...(jongIdx > 0 ? [JONG[jongIdx]] : [])];
            }
            return [syllable]; // 한글이 아닌 문자는 그대로 반환
        }

        // ==================== 전역 상태 ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audio');
        const timeline = document.getElementById('timeline');
        const timeDisplay = document.getElementById('timeDisplay');
        const currentSentenceEl = document.getElementById('currentSentence');
        const fontSelect = document.getElementById('fontSelect');

        let cues = [];
        let uniqueComponents = []; // [{ char, intervals: [{start,end}], fullLitTime }] (fullLitTime is max start time of its components)
        let currentTime = 0;
        let isPlaying = false;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let audioCtx = null;
        let audioSource = null;
        let audioDest = null;

        // ==================== SRT 및 오디오 로딩 ====================
        document.getElementById('srtFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                loadSRT(ev.target.result);
            };
            reader.readAsText(file);
        });

        document.getElementById('loadSample').addEventListener('click', function() {
            const sample = `1
00:00:00,000 --> 00:00:03,000
안녕하세요

2
00:00:03,500 --> 00:00:07,000
오늘은 즐거운 날

3
00:00:07,500 --> 00:00:11,000
함께 노래해요

4
00:00:11,500 --> 00:00:15,000
라라라 라라라

5
00:00:15,500 --> 00:00:20,000
신나는 음악과 함께
`;
            loadSRT(sample);
        });

        document.getElementById('audioFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            audio.src = URL.createObjectURL(file);
            audio.load();
            if (audioCtx) {
                audioCtx.close().catch(() => {});
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioSource = audioCtx.createMediaElementSource(audio);
            audioDest = audioCtx.createMediaStreamDestination();
            audioSource.connect(audioDest);
            audioSource.connect(audioCtx.destination);
        });

        function loadSRT(content) {
            cues = parseSRT(content);
            buildComponentIntervals();
            setupTimeline();
            currentTime = 0;
            updateTimeDisplay();
            render();
        }

        // ==================== 자모 컴포넌트 인터벌 구축 ====================
        function buildComponentIntervals() {
            const componentMap = new Map(); // key(문자) -> { char, intervals: [] }

            cues.forEach(cue => {
                const chars = Array.from(cue.text);
                chars.forEach(char => {
                    if (char.trim() === '') return; // 공백은 무시
                    const components = decomposeKorean(char);
                    const numComponents = components.length;
                    const syllableDuration = cue.end - cue.start;
                    const step = syllableDuration / numComponents;
                    const fullLitTime = cue.start + (numComponents - 1) * step; // 모든 컴포넌트가 켜지는 시각

                    components.forEach((comp, idx) => {
                        if (!componentMap.has(comp)) {
                            componentMap.set(comp, { char: comp, intervals: [] });
                        }
                        const entry = componentMap.get(comp);
                        // 각 컴포넌트의 시작은 cue.start + idx * step, 끝은 cue.end
                        entry.intervals.push({
                            start: cue.start + idx * step,
                            end: cue.end,
                            fullLitTime: fullLitTime // 이 컴포넌트가 속한 음절의 완전 점등 시각
                        });
                    });
                });
            });

            // Map을 배열로 변환하고 등장 순서(첫 등장 start 기준)로 정렬
            uniqueComponents = Array.from(componentMap.values());
            uniqueComponents.forEach(entry => {
                entry.intervals.sort((a, b) => a.start - b.start);
                entry.firstStart = entry.intervals[0]?.start || 0;
            });
            uniqueComponents.sort((a, b) => a.firstStart - b.firstStart);
        }

        // ==================== 타임라인 및 재생 ====================
        function setupTimeline() {
            const maxTime = cues.length > 0 ? Math.max(...cues.map(c => c.end)) : 0;
            timeline.max = maxTime;
            timeline.value = 0;
        }

        function updateTimeDisplay() {
            timeDisplay.textContent = formatTime(currentTime);
        }

        timeline.addEventListener('input', () => {
            currentTime = parseFloat(timeline.value);
            updateTimeDisplay();
            render();
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            if (cues.length === 0) return;
            isPlaying = true;
            if (audio.src) {
                audio.currentTime = currentTime;
                audio.play().catch(() => {});
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            isPlaying = false;
            isRecording = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            audio.pause();
            if (audioCtx) audioCtx.suspend();
        });

        audio.addEventListener('timeupdate', () => {
            currentTime = audio.currentTime;
            timeline.value = currentTime;
            updateTimeDisplay();
        });

        audio.addEventListener('pause', () => { if (!isRecording) isPlaying = false; });
        audio.addEventListener('play', () => { isPlaying = true; });

        // ==================== 렌더링 ====================
        function isComponentActive(compEntry, time) {
            return compEntry.intervals.some(interval => time >= interval.start && time <= interval.end);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (uniqueComponents.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('SRT 파일을 로드하세요', canvas.width/2, canvas.height/2);
                updateCurrentSentence();
                return;
            }

            const fontFamily = fontSelect.value;
            const cols = Math.ceil(Math.sqrt(uniqueComponents.length * (canvas.width / canvas.height)));
            const rows = Math.ceil(uniqueComponents.length / cols);
            const cellWidth = canvas.width / cols;
            const cellHeight = canvas.height / rows;
            const fontSize = Math.min(cellWidth, cellHeight) * 0.7;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${fontSize}px ${fontFamily}`;

            const activeColor = '#ffd700';
            const inactiveColor = 'rgba(255,255,255,0.3)';

            uniqueComponents.forEach((entry, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);
                const x = col * cellWidth + cellWidth / 2;
                const y = row * cellHeight + cellHeight / 2;

                const isActive = isComponentActive(entry, currentTime);

                if (isActive) {
                    ctx.fillStyle = activeColor;
                    ctx.shadowColor = activeColor;
                    ctx.shadowBlur = 15;
                    ctx.fillText(entry.char, x, y);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.strokeStyle = inactiveColor;
                    ctx.lineWidth = 2;
                    ctx.strokeText(entry.char, x, y);
                }
            });

            updateCurrentSentence();
        }

        function updateCurrentSentence() {
            // 현재 활성화된 큐 찾기
            const activeCue = cues.find(cue => currentTime >= cue.start && currentTime <= cue.end);
            if (!activeCue) {
                currentSentenceEl.textContent = '';
                return;
            }

            const chars = Array.from(activeCue.text);
            let html = '';
            chars.forEach(char => {
                if (char.trim() === '') {
                    html += ' '; // 공백은 그대로
                    return;
                }
                const components = decomposeKorean(char);
                const numComp = components.length;
                const syllableDuration = activeCue.end - activeCue.start;
                const step = syllableDuration / numComp;
                const fullLitTime = activeCue.start + (numComp - 1) * step;
                // 현재 시간이 fullLitTime 이상이면 해당 음절이 완전히 점등된 것으로 간주
                const isLit = currentTime >= fullLitTime;
                html += isLit ? `<span class="lit">${char}</span>` : char;
            });
            currentSentenceEl.innerHTML = html;
        }

        // ==================== 애니메이션 루프 ====================
        let lastFrameTime = performance.now();
        function animationLoop(now) {
            const dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            if (isPlaying && !isRecording) {
                currentTime += dt;
                const maxTime = parseFloat(timeline.max);
                if (currentTime >= maxTime) {
                    currentTime = maxTime;
                    isPlaying = false;
                    audio.pause();
                }
                timeline.value = currentTime;
                updateTimeDisplay();
            }

            if (isRecording) {
                currentTime += dt;
                const maxTime = parseFloat(timeline.max);
                if (currentTime >= maxTime) {
                    currentTime = maxTime;
                    render();
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                    isRecording = false;
                    isPlaying = false;
                    audio.pause();
                    if (audioCtx) audioCtx.suspend();
                } else {
                    timeline.value = currentTime;
                    updateTimeDisplay();
                }
            }

            render();
            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);

        // ==================== MP4 저장 ====================
        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=avc1.42E01E',
                'video/mp4',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            for (const t of types) {
                if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
            }
            return 'video/webm';
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (isRecording) return;
            if (cues.length === 0) { alert('SRT 자막을 먼저 로드하세요.'); return; }
            const maxTime = parseFloat(timeline.max);
            if (maxTime <= 0) return;

            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

            currentTime = 0;
            timeline.value = 0;
            isPlaying = true;
            isRecording = true;
            recordedChunks = [];

            const canvasStream = canvas.captureStream(60);
            let combinedStream = canvasStream;
            if (audioDest && audioDest.stream.getAudioTracks().length > 0) {
                combinedStream = new MediaStream();
                canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
                audioDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
            }

            const mimeType = getSupportedMimeType();
            mediaRecorder = new MediaRecorder(combinedStream, {
                mimeType,
                videoBitsPerSecond: 8_000_000
            });

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `kinetic_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                isRecording = false;
                isPlaying = false;
            };

            mediaRecorder.start(1000);

            const audioEl = document.getElementById('audio');
            if (audioEl.src && audioCtx) {
                audioEl.currentTime = 0;
                audioEl.play().catch(() => {});
            }
        });

        // ==================== 폰트 변경 시 즉시 반영 ====================
        fontSelect.addEventListener('change', () => {
            render();
        });

        // ==================== 초기화 ====================
        function init() {
            setupTimeline();
            render();
        }
        init();
    </script>
</body>
</html>
