<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRT Kinetic Typography Studio - Final</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Inter:wght@400;800&family=Montserrat:wght@800&family=Noto+Sans+KR:wght@400;800&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e5e5e5;font-family:Inter,Noto Sans KR,sans-serif;display:flex;height:100vh;overflow:hidden}
.left{width:360px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;background:#050505;align-items:center;justify-content:center;padding:20px;position:relative}
.right{width:400px;background:#111;border-left:1px solid #222;overflow-y:auto;padding:16px}
.btn{background:#222;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:#2a2a2a}
.btn.primary{background:#ff3b30;border-color:#ff3b30;font-weight:800}
.btn.active{background:#fff;color:#000}
.srt-item{padding:10px 12px;border-radius:10px;background:#181818;border:1px solid #222;margin-bottom:8px;cursor:pointer}
.srt-item.active{background:#fff;color:#000;border-color:#fff}
.canvas-wrap{position:relative;box-shadow:0 20px 80px rgba(0,0,0,0.8);border-radius:12px;overflow:hidden;border:1px solid #222;background:#000}
#mainCanvas{display:block;max-width:100%;max-height:62vh}
.badge{background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border:1px solid #333;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge.onair{background:#ff3b30;color:#fff}
.motion-btn{padding:8px;border-radius:8px;background:#1c1c1c;border:1px solid #2a2a2a;font-size:11px;cursor:pointer;text-align:left}
.motion-btn.active{background:#fff;color:#000}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;color:#888}
.field input,.field select{background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:6px 8px;border-radius:6px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
</style>
</head>
<body>
<div class="left">
<div style="padding:16px;border-bottom:1px solid #222">
<label class="btn primary" style="display:block;text-align:center">📁 SRT 파일 선택<input id="srtFile" type="file" accept=".srt" style="display:none"></label>
<textarea id="srtPaste" placeholder="SRT 붙여넣기 예:&#10;1&#10;00:00:00,000 --> 00:00:02,000&#10;보지 못하였습니다" style="width:100%;height:80px;margin-top:10px;background:#0f0f0f;border:1px solid #222;color:#fff;padding:8px;border-radius:8px;font-size:12px"></textarea>
<button id="parseBtn" class="btn" style="width:100%;margin-top:8px">파싱 + 미리보기 시작</button>
<div style="margin-top:8px;font-size:10px;color:#666;line-height:1.4">FIX: 타임코드는 내부 계산용으로만 사용, 캔버스에는 가사 TEXT만 렌더링됨. 위치/회전 0으로 초기화됨.</div>
</div>
<div id="list" style="flex:1;overflow-y:auto;padding:10px"></div>
</div>

<div class="center">
<div style="position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:5">
<span class="badge" id="resBadge">1080x1920 • 60FPS • TEXT ONLY</span>
<span class="badge onair" id="motionBadge" style="pointer-events:auto">ON AIR</span>
</div>
<div class="canvas-wrap"><canvas id="mainCanvas" width="1080" height="1920"></canvas></div>
<div style="display:flex;gap:8px;margin-top:14px;align-items:center;width:100%;max-width:640px">
<button id="playBtn" class="btn primary">⏸ 정지</button>
<button id="loopBtn" class="btn active">🔁 루프</button>
<button id="resetPosBtn" class="btn">📍 위치 리셋 (중앙)</button>
<input id="seek" type="range" min="0" max="100" value="30" style="flex:1;accent-color:#ff3b30">
<span id="timeLabel" style="font-size:11px;width:50px">0.30</span>
</div>
<div style="display:flex;gap:8px;margin-top:10px">
<select id="resSelect" class="btn"><option value="1080x1920">1080x1920 세로</option><option value="1920x1080">1920x1080 가로</option><option value="1080x1080">1080x1080</option></select>
<input id="bgColor" type="color" value="#000000">
<button id="exportBtn" class="btn primary">⬇ MP4/WebM 저장</button>
</div>
</div>

<div class="right">
<h2 style="font-size:12px;color:#888;margin-bottom:8px">선택 라인 편집</h2>
<div class="field"><label>가사 TEXT (타임코드 아님)</label><input id="editText" type="text"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div class="field"><label>폰트</label><select id="fontSel"><option>Noto Sans KR</option><option>Black Han Sans</option><option>Inter</option><option>Anton</option><option>Montserrat</option><option>Bebas Neue</option><option>Oswald</option></select></div>
<div class="field"><label>크기</label><input id="sizeSel" type="range" min="24" max="200" value="92"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<div class="field"><label>X</label><input id="xPos" type="range" min="0" max="1080" value="540"></div>
<div class="field"><label>Y</label><input id="yPos" type="range" min="0" max="1920" value="960"></div>
<div class="field"><label>회전</label><input id="rot" type="range" min="-180" max="180" value="0"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div class="field"><label>비틀기 X</label><input id="skewX" type="range" min="-45" max="45" value="0"></div>
<div class="field"><label>비틀기 Y</label><input id="skewY" type="range" min="-45" max="45" value="0"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div class="field"><label>IN</label><input id="inDur" type="range" min="0.1" max="2" step="0.1" value="0.6"></div>
<div class="field"><label>Stagger</label><input id="stagger" type="range" min="0.01" max="0.2" step="0.01" value="0.06"></div>
</div>
<h2 style="font-size:12px;color:#888;margin:12px 0 8px">KINETIC 34 MOTIONS - 진짜 역동</h2>
<div id="motionGrid" class="grid"></div>
<div style="display:flex;gap:8px;margin-top:12px;align-items:center">
<input id="color" type="color" value="#ffffff"><input id="strokeColor" type="color" value="#000000"><label style="font-size:11px"><input id="strokeOn" type="checkbox" checked> 외곽선</label><label style="font-size:11px"><input id="shadowOn" type="checkbox" checked> 그림자</label>
</div>
</div>

<script>
const canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d');
const motions=[
{id:'slam',name:'Slam Pop Shake',cat:'IMPACT'},{id:'bounce',name:'Bounce Drop',cat:'IMPACT'},{id:'elastic',name:'Elastic Overshoot',cat:'IMPACT'},{id:'hammer',name:'Hammer Hit',cat:'IMPACT'},
{id:'whipL',name:'Whip Left',cat:'SLIDE'},{id:'velR',name:'Velocity Right',cat:'SLIDE'},{id:'stagUp',name:'Stagger Up',cat:'SLIDE'},{id:'train',name:'Train Rush',cat:'SLIDE'},
{id:'flipX',name:'3D Flip X',cat:'ROTATE'},{id:'flipY',name:'3D Flip Y',cat:'ROTATE'},{id:'vortex',name:'Vortex Spin',cat:'ROTATE'},{id:'tilt',name:'Tilt Typewriter',cat:'ROTATE'},
{id:'glitch',name:'Skew Glitch',cat:'DISTORT'},{id:'wave',name:'Liquid Wave',cat:'DISTORT'},{id:'jitter',name:'Jitter Shake',cat:'DISTORT'},{id:'chroma',name:'Chromatic Split',cat:'DISTORT'},
{id:'pulse',name:'Heartbeat Pulse',cat:'SCALE'},{id:'cascade',name:'Cascade Pop',cat:'SCALE'},{id:'zoomBlur',name:'Zoom Blur',cat:'SCALE'},{id:'stretch',name:'Stretch Squeeze',cat:'SCALE'},
{id:'fall',name:'Fall & Bounce',cat:'GRAVITY'},{id:'float',name:'Float Up',cat:'GRAVITY'},{id:'pendulum',name:'Pendulum Swing',cat:'GRAVITY'},{id:'spring',name:'Spring Snap',cat:'GRAVITY'},
{id:'karaoke',name:'Karaoke Wipe',cat:'CINEMATIC'},{id:'outline',name:'Outline to Fill',cat:'CINEMATIC'},{id:'blurIn',name:'Blur Focus In',cat:'CINEMATIC'},{id:'splitRot',name:'Split Rotate',cat:'CINEMATIC'},
{id:'typewriter',name:'Typewriter',cat:'EXTRA'},{id:'rubber',name:'Rubber Band',cat:'EXTRA'},{id:'scatter',name:'Scatter Break',cat:'EXTRA'},{id:'orbit',name:'Circular Orbit',cat:'EXTRA'},{id:'fire',name:'Fire Up',cat:'EXTRA'},{id:'neon',name:'Neon Flicker',cat:'EXTRA'}
];
let srtLines=[],selected=0,isPlaying=true,loop=true,progress=0.3;
let state={font:'Noto Sans KR',size:92,x:540,y:960,rot:0,skewX:0,skewY:0,color:'#ffffff',strokeColor:'#000000',strokeOn:true,shadowOn:true,motion:'slam',inDur:0.6,stagger:0.06};

function parseSRT(txt){
let lines=txt.trim().split(/\r?\n/),res=[],i=0;
while(i<lines.length){
if(!lines[i].trim()){i++;continue;}
let idx=parseInt(lines[i]); i++; if(isNaN(idx)) continue;
if(i>=lines.length) break;
let tl=lines[i]; i++;
let m=tl.match(/(\d+):(\d+):(\d+),(\d+)\s*-->\s*(\d+):(\d+):(\d+),(\d+)/);
if(!m) continue;
let s=(+m[1]*3600+ +m[2]*60+ +m[3])*1000+ +m[4];
let e=(+m[5]*3600+ +m[6]*60+ +m[7])*1000+ +m[8];
let t=[]; while(i<lines.length && lines[i].trim()!==''){t.push(lines[i]); i++;}
let full=t.join(' ').trim();
if(full) res.push({index:res.length,start:s,end:e,text:full,motion:motions[res.length%motions.length].id,x:540,y:960,size:92,rot:0,skewX:0,skewY:0});
}
return res;
}
function renderList(){
let list=document.getElementById('list'); list.innerHTML='';
srtLines.forEach((l,idx)=>{
let d=document.createElement('div'); d.className='srt-item'+(idx===selected?' active':'');
d.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:10px;opacity:0.6"><span>#${idx+1}</span><span>${(l.start/1000).toFixed(1)}s</span></div><div style="font-weight:700;margin-top:4px">${l.text}</div><div style="font-size:10px;margin-top:4px">${l.motion}</div>`;
d.onclick=()=>{selected=idx; loadLine(); renderList();};
list.appendChild(d);
});
}
function loadLine(){
if(!srtLines[selected]) return; let l=srtLines[selected];
document.getElementById('editText').value=l.text;
state.motion=l.motion; state.x=l.x; state.y=l.y; state.size=l.size; state.rot=l.rot; state.skewX=l.skewX; state.skewY=l.skewY;
document.getElementById('xPos').value=state.x; document.getElementById('yPos').value=state.y;
document.getElementById('sizeSel').value=state.size; document.getElementById('rot').value=state.rot;
document.getElementById('skewX').value=state.skewX; document.getElementById('skewY').value=state.skewY;
document.getElementById('motionBadge').textContent='ON AIR • '+state.motion;
document.querySelectorAll('.motion-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===state.motion));
}
function saveLine(){
if(!srtLines[selected]) return;
srtLines[selected].text=document.getElementById('editText').value;
srtLines[selected].motion=state.motion; srtLines[selected].x=state.x; srtLines[selected].y=state.y;
srtLines[selected].size=state.size; srtLines[selected].rot=state.rot; srtLines[selected].skewX=state.skewX; srtLines[selected].skewY=state.skewY;
}
function ease(t,type){
if(type==='elastic') return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*2*Math.PI/3)+1;
if(type==='back'){let c1=1.70158,c3=c1+1; return 1 + c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
if(type==='bounce'){if(t<1/2.75)return 7.5625*t*t;else if(t<2/2.75){t-=1.5/2.75;return 7.5625*t*t+0.75}else if(t<2.5/2.75){t-=2.25/2.75;return 7.5625*t*t+0.9375}else{t-=2.625/2.75;return 7.5625*t*t+0.984375}}
return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}
function draw(){
ctx.fillStyle=document.getElementById('bgColor').value||'#000';
ctx.fillRect(0,0,canvas.width,canvas.height);
if(!srtLines[selected]){requestAnimationFrame(draw);return;}
let line=srtLines[selected]; let text=line.text||'샘플';
let chars=[...text]; let p=progress;
ctx.textAlign='center'; ctx.textBaseline='middle';
chars.forEach((ch,i)=>{
let charP=Math.min(1,Math.max(0,(p - i*state.stagger)/0.6));
let e=ease(charP, state.motion==='elastic'?'elastic':state.motion==='bounce'?'bounce':'back');
let ox=0,oy=0,sc=1,rot=0,sx=0,sy=0,alpha=1;
switch(state.motion){
case 'slam': sc=e*1.2; oy=(1-e)*-80; rot=(1-e)*15*(i%2?1:-1); if(charP>0.8) ox=(Math.random()-0.5)*(1-charP)*30; break;
case 'bounce': oy=(1-e)*-200; sc=0.5+e*0.5; break;
case 'elastic': sc=e; rot=(1-e)*360; break;
case 'hammer': sc=charP<0.5?3-charP*4:1+Math.sin((charP-0.5)*10)*0.2; break;
case 'whipL': ox=(1-e)*-600; rot=(1-e)*-30; break;
case 'velR': ox=(1-e)*600; break;
case 'stagUp': oy=(1-e)*200; alpha=e; break;
case 'train': ox=(1-e)*-800; sx=(1-e)*30; break;
case 'flipX': rot=(1-charP)*90; break;
case 'vortex': rot=(1-e)*720; ox=Math.cos(i)*(1-e)*200; oy=Math.sin(i)*(1-e)*200; sc=e; break;
case 'glitch': ox=charP<0.9?(Math.random()-0.5)*(1-charP)*100:0; break;
case 'wave': oy=Math.sin(i*0.8+p*10)*20; break;
case 'jitter': ox=(Math.random()-0.5)*10; oy=(Math.random()-0.5)*10; break;
case 'pulse': sc=1+Math.sin(p*10+i)*0.3*e; break;
case 'zoomBlur': sc=e*2; alpha=e; break;
case 'fall': oy=(1-e)*-400+(1-e)*(1-e)*400; break;
case 'pendulum': rot=Math.sin(p*4+i*0.3)*20*e; break;
case 'karaoke': alpha=i/chars.length < p?1:0.2; break;
case 'typewriter': alpha=i/chars.length < p?1:0; break;
case 'scatter': ox=(1-e)*(Math.random()-0.5)*600; oy=(1-e)*(Math.random()-0.5)*600; rot=(1-e)*720; break;
case 'orbit': let ang=p*6.28+i*0.5; ox=Math.cos(ang)*100*(1-e*0.5); oy=Math.sin(ang)*100*(1-e*0.5); break;
case 'neon': alpha=Math.random()>0.1?1:0.3; break;
}
let cx=state.x+ox+(i-chars.length/2)*(state.size*0.55);
let cy=state.y+oy;
ctx.save();
ctx.globalAlpha=alpha;
ctx.translate(cx,cy);
ctx.rotate((rot+state.rot)*Math.PI/180);
ctx.transform(1,sy+state.skewY/45,sx+state.skewX/45,1,0,0);
ctx.scale(sc,sc);
ctx.font=`800 ${state.size}px ${state.font}, sans-serif`;
if(state.shadowOn){ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=20;ctx.shadowOffsetY=8;}
ctx.fillStyle=state.color;
if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=8;ctx.lineJoin='round';ctx.strokeText(ch,0,0);}
ctx.fillText(ch,0,0);
ctx.restore();
});
if(isPlaying){progress+=0.012; if(progress>1) progress=loop?0:1; document.getElementById('seek').value=progress*100; document.getElementById('timeLabel').textContent=progress.toFixed(2);}
requestAnimationFrame(draw);
}
document.getElementById('motionGrid').innerHTML=motions.map(m=>`<button class="motion-btn" data-id="${m.id}"><span style="font-size:9px;opacity:0.6">${m.cat}</span><b>${m.name}</b></button>`).join('');
document.getElementById('motionGrid').addEventListener('click',e=>{
let b=e.target.closest('.motion-btn'); if(!b) return; state.motion=b.dataset.id; saveLine(); loadLine();
});
document.getElementById('srtFile').addEventListener('change',async ev=>{
let f=ev.target.files[0]; if(!f) return; let txt=await f.text(); srtLines=parseSRT(txt); selected=0; renderList(); loadLine(); isPlaying=true;
});
document.getElementById('parseBtn').addEventListener('click',()=>{
let txt=document.getElementById('srtPaste').value;
if(!txt.trim()) txt=`1\n00:00:00,000 --> 00:00:02,500\n보지 못하였습니다\n\n2\n00:00:02,500 --> 00:00:05,000\n당신이 사과를 따서\n\n3\n00:00:05,000 --> 00:00:08,000\n나를 주려고 크고 붉은 사과를\n\n4\n00:00:08,000 --> 00:00:11,000\n그 사과속으로 들어가는 것을`;
srtLines=parseSRT(txt); selected=0; renderList(); loadLine(); isPlaying=true;
});
['editText','fontSel','color','strokeColor'].forEach(id=>{
document.getElementById(id).addEventListener('input',()=>{
if(id==='editText') saveLine();
if(id==='fontSel') state.font=document.getElementById(id).value;
if(id==='color') state.color=document.getElementById(id).value;
if(id==='strokeColor') state.strokeColor=document.getElementById(id).value;
saveLine();
});
});
['sizeSel','xPos','yPos','rot','skewX','skewY','stagger'].forEach(id=>{
document.getElementById(id).addEventListener('input',e=>{
let v=parseFloat(e.target.value);
if(id==='sizeSel') state.size=v; if(id==='xPos') state.x=v; if(id==='yPos') state.y=v;
if(id==='rot') state.rot=v; if(id==='skewX') state.skewX=v; if(id==='skewY') state.skewY=v; if(id==='stagger') state.stagger=v;
saveLine();
});
});
document.getElementById('seek').addEventListener('input',e=>progress=e.target.value/100);
document.getElementById('playBtn').addEventListener('click',()=>{isPlaying=!isPlaying; document.getElementById('playBtn').textContent=isPlaying?'⏸ 정지':'▶ 재생';});
document.getElementById('loopBtn').addEventListener('click',e=>{loop=!loop; e.target.classList.toggle('active',loop);});
document.getElementById('resetPosBtn').addEventListener('click',()=>{state.x=canvas.width/2; state.y=canvas.height/2; state.rot=0; state.skewX=0; state.skewY=0; document.getElementById('xPos').value=state.x; document.getElementById('yPos').value=state.y; document.getElementById('rot').value=0; document.getElementById('skewX').value=0; document.getElementById('skewY').value=0; saveLine();});
document.getElementById('strokeOn').addEventListener('change',e=>state.strokeOn=e.target.checked);
document.getElementById('shadowOn').addEventListener('change',e=>state.shadowOn=e.target.checked);
document.getElementById('resSelect').addEventListener('change',e=>{let [w,h]=e.target.value.split('x').map(Number); canvas.width=w; canvas.height=h; state.x=w/2; state.y=h/2; saveLine();});
document.getElementById('exportBtn').addEventListener('click',()=>{
let stream=canvas.captureStream(60); let rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000}); let chunks=[];
rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='kinetic_'+Date.now()+'.webm'; a.click();};
rec.start(); progress=0; isPlaying=true; setTimeout(()=>rec.stop(), (srtLines.length*2500||10000));
});
let dragging=false;
canvas.addEventListener('pointerdown',()=>dragging=true);
window.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointermove',e=>{if(!dragging) return; let r=canvas.getBoundingClientRect(); let sx=canvas.width/r.width, sy=canvas.height/r.height; state.x=(e.clientX-r.left)*sx; state.y=(e.clientY-r.top)*sy; document.getElementById('xPos').value=state.x; document.getElementById('yPos').value=state.y; saveLine();});
document.getElementById('parseBtn').click(); draw();
</script>
</body>
</html>
