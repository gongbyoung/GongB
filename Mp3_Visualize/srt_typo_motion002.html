</div>

let state={font:'Noto Sans KR',weight:'800',size:184,x:540,y:960,rot:0,letterSpacing:14,lineSpacing:28,stagger:0.06,mode:'jamo',color:'#ffffff',strokeColor:'#000000',strokeOn:true,shadowOn:true,safeMargin:0.95};
const audio=document.getElementById('audio');

function parseSRT(txt){let lines=txt.trim().split(/\r?\n/),res=[],i=0;while(i<lines.length){if(!lines[i].trim()){i++;continue;}let idx=parseInt(lines[i]);i++;if(isNaN(idx))continue;if(i>=lines.length)break;let tl=lines[i];i++;let m=tl.match(/(\d+):(\d+):(\d+),(\d+)\s*-->\s*(\d+):(\d+):(\d+),(\d+)/);if(!m)continue;let s=(+m[1]*3600+ +m[2]*60+ +m[3])*1000+ +m[4];let e=(+m[5]*3600+ +m[6]*60+ +m[7])*1000+ +m[8];let t=[];while(i<lines.length && lines[i].trim()!==''){t.push(lines[i]);i++;}let full=t.join(' ').trim();if(full)res.push({start:s,end:e,text:full,x:540,y:960,size:184,motion:'lullaby_float'});}return res;}
function calcTotal(){if(audio.duration && !isNaN(audio.duration))totalDuration=audio.duration*1000;else if(srtLines.length)totalDuration=srtLines[srtLines.length-1].end+1000;else totalDuration=10000;document.getElementById('totalInfo')?.replaceChildren(document.createTextNode(`총 길이: ${(totalDuration/1000).toFixed(1)}초`));}
function applyStyle(styleKey){
 currentStyle=styleKey;
 let styleMotions=STYLE_DEFS[styleKey].motions;
 srtLines.forEach((line,idx)=>{line.motion=styleMotions[idx % styleMotions.length].id;});
 document.getElementById('styleInfo').textContent=`현재: ${STYLE_DEFS[styleKey].name} | ${styleMotions.length}개 모션 순환 | 95% 안전영역 | 크기 ${state.size}px | 폰트 ${state.font}`;
 document.querySelectorAll('.style-btn').forEach(b=>b.classList.toggle('active', b.dataset.style===styleKey));
 renderList(); renderCurrentStyleMotions();
 if(styleKey==='dance'||styleKey==='rock') setMode('char'); else if(styleKey==='ballad'||styleKey==='traditional'||styleKey==='lullaby') setMode('jamo'); else if(styleKey==='kids') setMode('word');
}
function renderCurrentStyleMotions(){let c=document.getElementById('currentStyleMotions');let ms=STYLE_DEFS[currentStyle].motions;c.innerHTML=ms.map((m,i)=>`<div style="background:#1a1a1a;border:1px solid #333;padding:3px 5px;border-radius:5px">${i+1}. ${m.name}</div>`).join('');}
function renderList(){let list=document.getElementById('list');list.innerHTML='';srtLines.forEach((l,idx)=>{let d=document.createElement('div');d.className='srt-item'+(idx===selected?' active':'');let sm=STYLE_DEFS[currentStyle].motions[idx % STYLE_DEFS[currentStyle].motions.length];d.innerHTML=`<div><div style="font-weight:700">${l.text.substring(0,24)}</div><div style="opacity:0.6">#${idx+1} ${(l.start/1000).toFixed(1)}s</div></div><span class="tag">${sm?sm.name.split(' ')[1]:''}</span>`;d.onclick=()=>{selected=idx;globalTime=l.start;renderList();};list.appendChild(d);});}
function ease(t,type){if(type==='elastic')return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*2*Math.PI/3)+1;if(type==='bounce'){if(t<1/2.75)return 7.5625*t*t;else if(t<2/2.75){t-=1.5/2.75;return 7.5625*t*t+0.75}else if(t<2.5/2.75){t-=2.25/2.75;return 7.5625*t*t+0.9375}else{t-=2.625/2.75;return 7.5625*t*t+0.984375}}return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function getActiveLine(tm){return srtLines.find(l=>tm>=l.start && tm<=l.end)||null;}
function wrapTextToLines(text,maxWidth,font){ctx.font=font;let words=text.split(' ');let lines=[],cur='';for(let w of words){let test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxWidth && cur!==''){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);let final=[];for(let line of lines){if(ctx.measureText(line).width<=maxWidth){final.push(line);continue;}let buf='';for(let ch of [...line]){let test=buf+ch;if(ctx.measureText(test).width>maxWidth && buf!==''){final.push(buf);buf=ch;}else buf=test;}if(buf)final.push(buf);}return final;}
function getBase(mId){let f=allMotions.find(m=>m.id===mId);return f?f.base:mId.replace(/^(dance|ballad|rock|trad|kids|lullaby)_/,'');}
function drawAtTime(tm){
 ctx.fillStyle=document.getElementById('bgColor').value||'#000';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.save();ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.setLineDash([8,8]);ctx.lineWidth=1;let sw=canvas.width*state.safeMargin,sh=canvas.height*state.safeMargin;ctx.strokeRect((canvas.width-sw)/2,(canvas.height-sh)/2,sw,sh);ctx.restore();
 let line=getActiveLine(tm);if(!line)return;
 let p=Math.min(1,(tm-line.start)/600);
 let fontStr=`${state.weight} ${line.size}px ${state.font}, sans-serif`;ctx.font=fontStr;
 let maxWidth=canvas.width*state.safeMargin - 40;
 let wrapped=wrapTextToLines(line.text,maxWidth,fontStr);
 let lineHeight=line.size + state.lineSpacing + 22;
 let totalH=wrapped.length*lineHeight;
 let maxAllowedH=canvas.height*state.safeMargin - 80;
 let scaleFactor=1;
 if(totalH>maxAllowedH){scaleFactor=maxAllowedH/totalH;fontStr=`${state.weight} ${line.size*scaleFactor}px ${state.font}, sans-serif`;ctx.font=fontStr;wrapped=wrapTextToLines(line.text,maxWidth,fontStr);lineHeight=line.size*scaleFactor + state.lineSpacing + 22;totalH=wrapped.length*lineHeight;}
 let baseY=line.y - totalH/2;
 let minY=(canvas.height - canvas.height*state.safeMargin)/2 + totalH/2;
 let maxY=canvas.height - (canvas.height - canvas.height*state.safeMargin)/2 - totalH/2;
 baseY=Math.max(minY,Math.min(maxY,baseY));
 let baseMotion=getBase(line.motion);
 wrapped.forEach((rowText,rowIdx)=>{
  let chars=[...rowText];let words=rowText.split(' ');
  if(state.mode==='char'||state.mode==='jamo'){
   let charWidths=chars.map(ch=>ctx.measureText(ch).width);
   let totalW=charWidths.reduce((a,b)=>a+b,0)+(chars.length-1)*state.letterSpacing;
   let safeLeft=(canvas.width - canvas.width*state.safeMargin)/2;let safeRight=safeLeft+canvas.width*state.safeMargin;
   let startX=line.x - totalW/2;if(startX<safeLeft)startX=safeLeft;if(startX+totalW>safeRight)startX=safeRight-totalW;
   let accumX=0;
   chars.forEach((ch,i)=>{
    let charP=Math.min(1,Math.max(0,(p - i*state.stagger - rowIdx*0.12)/0.6));
    let e=ease(charP, baseMotion.includes('elastic')?'elastic':baseMotion.includes('bounce')?'bounce':'back');
    let decomp=decomposeHangul(ch);
    let cx=startX+accumX+charWidths[i]/2;let cy=baseY+rowIdx*lineHeight;
    let isJamo=baseMotion.startsWith('jamo')||state.mode==='jamo';
    if(!isJamo){
     let ox=0,oy=0,sc=1,rot=0,alpha=1,skx=0;
     switch(baseMotion){
      case 'slam':sc=e*1.25;oy=(1-e)*-90;rot=(1-e)*12*(i%2?1:-1);break;
      case 'bounce':oy=(1-e)*-220;sc=0.4+e*0.6;break;
      case 'elastic':sc=e;rot=(1-e)*360;break;
      case 'whipL':ox=(1-e)*-700;rot=(1-e)*-25;break;
      case 'velR':ox=(1-e)*700;sc=0.2+e*0.8;break;
      case 'vortex':rot=(1-e)*720;sc=e;ox=Math.cos(i)*(1-e)*160;oy=Math.sin(i)*(1-e)*160;break;
      case 'glitch':if(charP<0.88)ox=(Math.random()-0.5)*(1-charP)*120;skx=(1-charP)*18;break;
      case 'wave':oy=Math.sin(i*0.7+tm*0.012)*22;break;
      case 'pulse':sc=1+Math.sin(tm*0.018+i)*0.35*e;break;
      case 'scatter':ox=(1-e)*(Math.random()-0.5)*800;oy=(1-e)*(Math.random()-0.5)*800;rot=(1-e)*720;break;
      case 'orbit':let ang=tm*0.005+i*0.55;ox=Math.cos(ang)*110*(1-e*0.5);oy=Math.sin(ang)*110*(1-e*0.5);break;
      case 'hammer':sc=charP<0.5?3-charP*4:1+Math.sin((charP-0.5)*12)*0.25;break;
      case 'jitter':ox=(Math.random()-0.5)*12;oy=(Math.random()-0.5)*12;break;
      case 'fall':oy=(1-e)*-450+(1-e)*(1-e)*450;sc=0.5+e*0.5;break;
      default:oy=(1-e)*60;alpha=e;
     }
     ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx+ox,cy+oy);ctx.rotate(rot*Math.PI/180);ctx.transform(1,0,skx/45,1,0,0);ctx.scale(sc,sc);
     ctx.font=fontStr;ctx.textAlign='center';ctx.textBaseline='middle';if(state.shadowOn){ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=22;}
     ctx.fillStyle=state.color;if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=Math.max(4,line.size*0.09);ctx.strokeText(ch,0,0);}ctx.fillText(ch,0,0);ctx.restore();
    }else{
     if(!decomp){ctx.save();ctx.globalAlpha=e;ctx.translate(cx,cy+(1-e)*-40);ctx.scale(e,e);ctx.font=fontStr;ctx.textAlign='center';ctx.fillStyle=state.color;ctx.fillText(ch,0,0);ctx.restore();}
     else{
      let parts=[{j:decomp.cho,d:0,offX:-10,offY:-16},{j:decomp.jung,d:0.07,offX:10,offY:0},{j:decomp.jong,d:0.14,offX:2,offY:18}].filter(p=>p.j);
      parts.forEach((part,pi)=>{
       let pp=Math.min(1,Math.max(0,(p - i*state.stagger - part.d)/0.48));let ee=ease(pp,'elastic');
       let jox=(1-ee)*(part.offX*5 + (Math.random()-0.5)*16);let joy=(1-ee)*(part.offY*4 - 85);let jrot=(1-ee)*(pi===0?-22:pi===1?18:-12);let jsc=0.15+ee*0.9;
       if(baseMotion==='jamoShake'){jox=Math.sin(tm*0.02+pi)*6*(1-pp*0.4);joy=(1-ee)*-32;}
       else if(baseMotion==='jamoSpin'){jrot=(1-ee)*360*(pi%2?1:-1);jsc=ee;}
       else if(baseMotion==='jamoWave'){joy=Math.sin(tm*0.01+pi*1.2)*10 + (1-ee)*-40;}
       ctx.save();ctx.globalAlpha=jsc*0.92;ctx.translate(cx+jox,cy+joy);ctx.rotate(jrot*Math.PI/180);ctx.scale(jsc,jsc);
       ctx.font=`${state.weight} ${line.size*0.70}px ${state.font}, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=pi===2?'#ddd':state.color;
       if(pp<0.82)ctx.fillText(part.j,0,0);ctx.restore();
      });
      let finalP=Math.min(1,Math.max(0,(p - i*state.stagger - 0.28)/0.48));let fe=ease(finalP,'back');
      if(finalP>0){ctx.save();ctx.globalAlpha=finalP;ctx.translate(cx,cy);ctx.scale(0.55+fe*0.45,0.55+fe*0.45);ctx.font=fontStr;ctx.textAlign='center';ctx.textBaseline='middle';if(state.shadowOn){ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=20;}ctx.fillStyle=state.color;if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=8;ctx.strokeText(ch,0,0);}ctx.fillText(ch,0,0);ctx.restore();}
     }
    }
    accumX+=charWidths[i]+state.letterSpacing;
   });
  }else if(state.mode==='word'){
   let wordWidths=words.map(w=>ctx.measureText(w).width);let totalW=wordWidths.reduce((a,b)=>a+b,0)+(words.length-1)*(state.letterSpacing*3+ctx.measureText(' ').width);
   let safeLeft=(canvas.width - canvas.width*state.safeMargin)/2;let startX=line.x - totalW/2;if(startX<safeLeft)startX=safeLeft;
   let acc=0;words.forEach((w,wi)=>{let wp=Math.min(1,Math.max(0,(p - wi*0.18 - rowIdx*0.1)/0.55));let we=ease(wp,'back');let ox=0,oy=0,sc=1,alpha=1;if(baseMotion==='wordPop'){sc=0.2+we*0.8;oy=(1-we)*-50;}else if(baseMotion==='wordBounce'){oy=(1-we)*-180;sc=0.5+we*0.5;}else ox=(1-we)*-400;let cx=startX+acc+wordWidths[wi]/2+ox;let cy=baseY+rowIdx*lineHeight+oy;ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.font=fontStr;ctx.textAlign='center';ctx.fillStyle=state.color;if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=8;ctx.strokeText(w,0,0);}ctx.fillText(w,0,0);ctx.restore();acc+=wordWidths[wi]+state.letterSpacing*3+ctx.measureText(' ').width;});
  }else{
   let wp=Math.min(1,(p)/0.6);let we=ease(wp,'back');let oy=(1-we)*-80;let sc=0.5+we*0.5;ctx.save();ctx.globalAlpha=we;ctx.translate(line.x, baseY+rowIdx*lineHeight+oy);ctx.scale(sc,sc);ctx.font=fontStr;ctx.textAlign='center';ctx.fillStyle=state.color;if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=8;ctx.strokeText(rowText,0,0);}ctx.fillText(rowText,0,0);ctx.restore();
  }
 });
}
function drawLoop(){if(!exporting){if(isPlaying){globalTime+=16;if(globalTime>totalDuration)globalTime=0;}document.getElementById('seek').value=totalDuration?(globalTime/totalDuration*100):0;document.getElementById('timeLabel').textContent=`${(globalTime/1000).toFixed(1)}s / ${(totalDuration/1000).toFixed(1)}s`;}drawAtTime(globalTime);requestAnimationFrame(drawLoop);}

function renderMotionGrid(){
 document.getElementById('motionSel').innerHTML=allMotions.map(m=>`<option value="${m.id}">[${m.styleName}] ${m.name}</option>`).join('');
 let cats={};allMotions.forEach(m=>{if(!cats[m.styleName])cats[m.styleName]=[];cats[m.styleName].push(m);});
 let html='';for(let cat in cats){html+=`<div style="grid-column:1/-1;font-size:10px;color:${STYLE_DEFS[Object.keys(STYLE_DEFS).find(k=>STYLE_DEFS[k].name===cat)]?.color||'#666'};margin-top:6px;font-weight:800">${cat} - ${cats[cat].length}개</div>`;cats[cat].forEach(m=>{html+=`<button class="motion-btn" data-id="${m.id}"><b>${m.name.replace(cat+' ','')}</b></button>`;});}
 document.getElementById('motionGrid').innerHTML=html;
}
renderMotionGrid();renderCurrentStyleMotions();
document.getElementById('motionGrid').addEventListener('click',e=>{let b=e.target.closest('.motion-btn');if(!b)return;let line=srtLines[selected];if(line)line.motion=b.dataset.id;renderList();});
document.getElementById('motionSel').addEventListener('change',e=>{let line=srtLines[selected];if(line){line.motion=e.target.value;renderList();}});
document.querySelectorAll('.style-btn').forEach(btn=>{btn.addEventListener('click',()=>applyStyle(btn.dataset.style));});
function setMode(m){state.mode=m;document.querySelectorAll('#modeChar,#modeJamo,#modeWord,#modeSentence').forEach(b=>b.classList.remove('active'));let map={char:'modeChar',jamo:'modeJamo',word:'modeWord',sentence:'modeSentence'};document.getElementById(map[m])?.classList.add('active');}
document.getElementById('modeChar').addEventListener('click',()=>setMode('char'));
document.getElementById('modeJamo').addEventListener('click',()=>setMode('jamo'));
document.getElementById('modeWord').addEventListener('click',()=>setMode('word'));
document.getElementById('modeSentence').addEventListener('click',()=>setMode('sentence'));
setMode('jamo');

document.getElementById('srtFile').addEventListener('change',async ev=>{let f=ev.target.files[0];if(!f)return;let txt=await f.text();srtLines=parseSRT(txt);selected=0;applyStyle(currentStyle);calcTotal();renderList();});
document.getElementById('parseBtn').addEventListener('click',()=>{
 let txt=document.getElementById('srtPaste').value;
 if(!txt.trim())txt=`1\n00:00:00,000 --> 00:00:03,000\n빨간차가 달린 지도\n\n2\n00:00:03,000 --> 00:00:06,000\n당신이 사과를 따서\n\n3\n00:00:06,000 --> 00:00:09,000\n나를 주려고 했던 그 순간`;
 srtLines=parseSRT(txt);selected=0;applyStyle(currentStyle);calcTotal();isPlaying=true;renderList();
});
document.getElementById('audioFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);audio.src=url;audio.style.display='block';audio.onloadedmetadata=()=>calcTotal();});
document.getElementById('seek').addEventListener('input',e=>globalTime=e.target.value/100*totalDuration);
document.getElementById('playBtn').addEventListener('click',()=>{isPlaying=!isPlaying;document.getElementById('playBtn').textContent=isPlaying?'⏸':'▶';});
document.getElementById('resSelect').addEventListener('change',e=>{let [w,h]=e.target.value.split('x').map(Number);canvas.width=w;canvas.height=h;state.x=w/2;state.y=h/2;});
document.getElementById('fontSel').addEventListener('change',e=>{state.font=e.target.value;});
document.getElementById('weightSel').addEventListener('change',e=>{state.weight=e.target.value;});
['letterSpacing','lineSpacing','stagger','sizeSel','xPos','yPos','rot'].forEach(id=>{document.getElementById(id)?.addEventListener('input',e=>{let v=parseFloat(e.target.value);if(id==='sizeSel'){state.size=v;srtLines.forEach(l=>l.size=v);}else if(id==='xPos')state.x=v;else if(id==='yPos')state.y=v;else if(id==='rot')state.rot=v;else state[id]=v;});});
document.getElementById('color').addEventListener('input',e=>state.color=e.target.value);
document.getElementById('strokeColor').addEventListener('input',e=>state.strokeColor=e.target.value);
document.getElementById('strokeOn').addEventListener('change',e=>state.strokeOn=e.target.checked);
document.getElementById('shadowOn').addEventListener('change',e=>state.shadowOn=e.target.checked);

// === FIXED EXPORT: 전체 타임라인 H264 ===
document.getElementById('exportBtn').addEventListener('click',async()=>{
 if(!srtLines.length){alert('SRT 먼저 로드해주세요');return;}
 if(exporting){alert('이미 저장 중입니다');return;}
 exporting=true; isPlaying=false;
 let status=document.getElementById('exportStatus');
 let bar=document.getElementById('exportBar');
 let progress=document.getElementById('exportProgress');
 progress.style.display='block';
 bar.style.width='0%';

 // mime 타입 체크 - 크롬은 mp4 지원, 파이어폭스는 webm만
 let mimeCandidates=[
  'video/mp4; codecs=avc1.42E01E',
  'video/mp4; codecs=avc1',
  'video/mp4',
  'video/webm; codecs=vp9',
  'video/webm; codecs=vp8',
  'video/webm'
 ];
 let chosenMime=null;
 for(let m of mimeCandidates){ if(MediaRecorder.isTypeSupported(m)){ chosenMime=m; break; } }
 if(!chosenMime){ status.textContent='❌ 이 브라우저는 영상 저장을 지원하지 않습니다. 크롬 최신 버전 사용 권장'; exporting=false; progress.style.display='none'; return; }

 status.textContent=`🔴 렌더링 준비 중... ${chosenMime} | 전체 ${(totalDuration/1000).toFixed(1)}초`;
 try{
  let stream=canvas.captureStream(60);
  // 트랙이 없으면 실패
  if(stream.getVideoTracks().length===0){ throw new Error('캔버스 캡처 실패'); }
  let recorder=new MediaRecorder(stream, {mimeType:chosenMime, videoBitsPerSecond:15000000});
  let chunks=[];
  recorder.ondataavailable=e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
  recorder.onerror=e=>{ console.error('Recorder error', e); status.textContent='❌ 녹화 오류: '+e.error; exporting=false; progress.style.display='none'; };
  recorder.onstop=()=>{
   try{
    if(chunks.length===0){ status.textContent='❌ 저장된 데이터 없음'; exporting=false; return; }
    let blob=new Blob(chunks, {type:chosenMime});
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');
    let ext=chosenMime.includes('mp4')?'mp4':'webm';
    a.href=url;
    a.download=`kinetic_${currentStyle}_${Date.now()}.${ext}`;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    status.textContent=`✅ 저장 완료! ${ext.toUpperCase()} (${(blob.size/1024/1024).toFixed(1)}MB) - ${chosenMime} | ${ext==='webm'?'ffmpeg -i input.webm -c:v libx264 output.mp4 로 변환 가능':''}`;
   }catch(err){ status.textContent='❌ 저장 실패: '+err.message; }
   progress.style.display='none';
   exporting=false;
   bar.style.width='0%';
  };
  recorder.start(100); // 100ms 단위로 데이터 수집
  let exportTime=0;
  function exportStep(){
   exportTime+=16.66;
   globalTime=exportTime;
   drawAtTime(globalTime);
   let pct=Math.min(100, (exportTime/totalDuration)*100);
   bar.style.width=pct+'%';
   status.textContent=`🔴 렌더링 중... ${(exportTime/1000).toFixed(1)}s / ${(totalDuration/1000).toFixed(1)}s (${pct.toFixed(1)}%) - ${chosenMime}`;
   if(exportTime < totalDuration){
    requestAnimationFrame(exportStep);
   }else{
    setTimeout(()=>{ recorder.stop(); stream.getTracks().forEach(t=>t.stop()); }, 200);
   }
  }
  exportStep();
 }catch(err){
  status.textContent='❌ 저장 오류: '+err.message+' - 크롬 최신 버전으로 시도해주세요';
  exporting=false;
  progress.style.display='none';
 }
});

document.getElementById('parseBtn').click();
drawLoop();
</script>
</body>
</html>
