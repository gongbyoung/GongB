<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SRT Kinetic Studio V3 - H264 Full Export</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Inter:wght@800&family=Montserrat:wght@800&family=Noto+Sans+KR:wght@800&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#eee;font-family:Inter,Noto Sans KR,sans-serif;display:flex;height:100vh;overflow:hidden}
.left{width:350px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;padding:16px}
.right{width:400px;background:#111;border-left:1px solid #222;overflow-y:auto;padding:14px}
.btn{background:#222;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:#ff3b30;border-color:#ff3b30;font-weight:800}
.btn:disabled{opacity:0.4}
.srt-item{padding:9px 11px;border-radius:10px;background:#181818;border:1px solid #222;margin-bottom:6px;cursor:pointer;font-size:12px}
.srt-item.active{background:#fff;color:#000}
#mainCanvas{display:block;max-height:62vh;max-width:100%;border-radius:12px;border:1px solid #222;background:#000}
.motion-btn{padding:7px;border-radius:7px;background:#1c1c1c;border:1px solid #2a2a2a;font-size:10px;cursor:pointer}
.motion-btn.active{background:#fff;color:#000}
.field{margin-bottom:8px} .field label{font-size:10px;color:#888} .field input,.field select{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:5px;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#exportProgress{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-top:8px;display:none}
#exportProgress div{height:100%;background:#ff3b30;width:0%}
</style>
</head>
<body>
<div class="left">
<div style="padding:14px;border-bottom:1px solid #222">
<label class="btn primary" style="display:block;text-align:center">📁 SRT 선택<input id="srtFile" type="file" accept=".srt" style="display:none"></label>
<label class="btn" style="display:block;text-align:center;margin-top:8px">🎵 오디오 MP3/WAV (전체 길이 기준)<input id="audioFile" type="file" accept="audio/*" style="display:none"></label>
<audio id="audio" controls style="width:100%;margin-top:8px;display:none"></audio>
<div id="totalInfo" style="font-size:11px;color:#888;margin-top:6px">총 길이: SRT 마지막 자막까지 자동 계산</div>
<textarea id="srtPaste" placeholder="SRT 붙여넣기" style="width:100%;height:70px;margin-top:8px;background:#0f0f0f;border:1px solid #222;color:#fff;padding:6px;border-radius:6px;font-size:11px"></textarea>
<button id="parseBtn" class="btn" style="width:100%;margin-top:6px">파싱</button>
</div>
<div id="list" style="flex:1;overflow-y:auto;padding:8px"></div>
</div>

<div class="center">
<canvas id="mainCanvas" width="1080" height="1920"></canvas>
<div style="display:flex;gap:8px;margin-top:12px;align-items:center;width:100%;max-width:700px">
<button id="playBtn" class="btn primary">⏸</button>
<input id="seek" type="range" min="0" max="100" value="0" style="flex:1;accent-color:#ff3b30">
<span id="timeLabel" style="font-size:11px">0.0s / 0.0s</span>
<button id="resetPosBtn" class="btn">📍 중앙</button>
</div>
<div style="display:flex;gap:8px;margin-top:10px;width:100%;max-width:700px">
<select id="resSelect" class="btn"><option value="1080x1920">1080x1920 세로</option><option value="1920x1080">1920x1080 가로</option><option value="1080x1080">1080x1080</option></select>
<input id="bgColor" type="color" value="#000000">
<button id="exportBtn" class="btn primary" style="flex:1">⬇ H264 MP4 전체 저장 (처음~끝까지)</button>
</div>
<div id="exportProgress"><div id="exportBar"></div></div>
<div id="exportStatus" style="font-size:11px;color:#888;margin-top:6px">저장 버튼 누르면 노래 처음부터 끝까지 H264 MP4로 렌더링됩니다. (시간 표시 절대 렌더링 안함)</div>
</div>

<div class="right">
<div class="field"><label>가사 TEXT</label><input id="editText" type="text"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div class="field"><label>폰트</label><select id="fontSel"><option>Noto Sans KR</option><option>Black Han Sans</option><option>Inter</option><option>Anton</option><option>Montserrat</option><option>Bebas Neue</option><option>Oswald</option></select></div>
<div class="field"><label>크기</label><input id="sizeSel" type="range" min="24" max="200" value="92"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
<div class="field"><label>X</label><input id="xPos" type="range" min="0" max="1080" value="540"></div>
<div class="field"><label>Y</label><input id="yPos" type="range" min="0" max="1920" value="960"></div>
<div class="field"><label>회전</label><input id="rot" type="range" min="-180" max="180" value="0"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div class="field"><label>자간 (letter-spacing)</label><input id="letterSpacing" type="range" min="-20" max="100" value="12"></div>
<div class="field"><label>행간</label><input id="lineSpacing" type="range" min="0" max="200" value="0"></div>
</div>

<div class="field" style="background:#1a1a1a;padding:10px;border-radius:10px;border:1px solid #2a2a2a">
<label style="color:#fff;font-weight:800">✂ 나눔 모드 (초중종성/단어/문장)</label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<button id="modeChar" class="btn active" style="font-size:11px">🔤 한 글자씩</button>
<button id="modeJamo" class="btn" style="font-size:11px">🧩 초중종성 제자리</button>
<button id="modeWord" class="btn" style="font-size:11px">📝 단어 나눔</button>
<button id="modeSentence" class="btn" style="font-size:11px">📄 문장 나눔</button>
</div>
<div style="font-size:10px;color:#888;margin-top:6px">초중종성: 자리는 한 자리 유지, 모션만 초/중/종 따로 적용</div>
</div>

<div class="field"><label>모션</label><select id="motionSel"></select></div>
<div id="motionGrid" class="grid"></div>
<div style="display:flex;gap:6px;margin-top:10px">
<input id="color" type="color" value="#ffffff"><input id="strokeColor" type="color" value="#000000"><label style="font-size:10px"><input id="strokeOn" type="checkbox" checked> 외곽</label><label style="font-size:10px"><input id="shadowOn" type="checkbox" checked> 그림자</label>
</div>
</div>

<script>
const canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d');
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function decomposeHangul(ch){
 let code=ch.charCodeAt(0);
 if(code<0xAC00||code>0xD7A3) return null;
 let base=code-0xAC00;
 let cho=Math.floor(base/(21*28));
 let jung=Math.floor((base%(21*28))/28);
 let jong=base%28;
 return {cho:CHO[cho], jung:JUNG[jung], jong:JONG[jong]||'', choIdx:cho, jungIdx:jung, jongIdx:jong};
}
const motions=[
{id:'slam',name:'Slam Pop Shake',cat:'IMPACT'},{id:'bounce',name:'Bounce Drop',cat:'IMPACT'},{id:'elastic',name:'Elastic Overshoot',cat:'IMPACT'},{id:'hammer',name:'Hammer Hit',cat:'IMPACT'},{id:'impactShake',name:'Impact Shake',cat:'IMPACT'},{id:'whipL',name:'Whip Left',cat:'SLIDE'},{id:'velR',name:'Velocity Right',cat:'SLIDE'},{id:'stagUp',name:'Stagger Up',cat:'SLIDE'},{id:'train',name:'Train Rush',cat:'SLIDE'},{id:'slideBlur',name:'Slide Blur',cat:'SLIDE'},{id:'flipX',name:'3D Flip X',cat:'ROTATE'},{id:'flipY',name:'3D Flip Y',cat:'ROTATE'},{id:'vortex',name:'Vortex Spin',cat:'ROTATE'},{id:'tilt',name:'Tilt Typewriter',cat:'ROTATE'},{id:'spin3D',name:'Spin 3D Cube',cat:'ROTATE'},{id:'glitch',name:'Skew Glitch',cat:'DISTORT'},{id:'wave',name:'Liquid Wave',cat:'DISTORT'},{id:'jitter',name:'Jitter Shake',cat:'DISTORT'},{id:'chroma',name:'Chromatic Split',cat:'DISTORT'},{id:'liquid',name:'Liquid Morph',cat:'DISTORT'},{id:'warp',name:'Warp Stretch',cat:'DISTORT'},{id:'pulse',name:'Heartbeat Pulse',cat:'SCALE'},{id:'cascade',name:'Cascade Pop',cat:'SCALE'},{id:'zoomBlur',name:'Zoom Blur',cat:'SCALE'},{id:'stretch',name:'Stretch Squeeze',cat:'SCALE'},{id:'popScale',name:'Pop Scale Bounce',cat:'SCALE'},{id:'fall',name:'Fall Bounce',cat:'GRAVITY'},{id:'float',name:'Float Up',cat:'GRAVITY'},{id:'pendulum',name:'Pendulum Swing',cat:'GRAVITY'},{id:'spring',name:'Spring Snap',cat:'GRAVITY'},{id:'gravityDrop',name:'Gravity Drop',cat:'GRAVITY'},{id:'karaoke',name:'Karaoke Wipe',cat:'CINEMATIC'},{id:'outline',name:'Outline to Fill',cat:'CINEMATIC'},{id:'blurIn',name:'Blur Focus In',cat:'CINEMATIC'},{id:'splitRot',name:'Split Rotate',cat:'CINEMATIC'},{id:'typewriter',name:'Typewriter Cursor',cat:'CINEMATIC'},{id:'reveal',name:'Mask Reveal',cat:'CINEMATIC'},{id:'rubber',name:'Rubber Band',cat:'EXTRA'},{id:'scatter',name:'Break Scatter',cat:'EXTRA'},{id:'orbit',name:'Circular Orbit',cat:'EXTRA'},{id:'fire',name:'Fire Up',cat:'EXTRA'},{id:'neon',name:'Neon Flicker',cat:'EXTRA'},{id:'pixelate',name:'Pixelate In',cat:'EXTRA'},
{id:'jamoInPlace',name:'초중종성 제자리 조립',cat:'JAMO'},{id:'jamoShake',name:'초중종성 제자리 흔들림',cat:'JAMO'},{id:'jamoSpin',name:'초중종성 제자리 회전',cat:'JAMO'},{id:'jamoElastic',name:'초중종성 탄성',cat:'JAMO'},{id:'jamoWave',name:'초중종성 웨이브',cat:'JAMO'},{id:'jamoPop3',name:'초중종성 3단 팝',cat:'JAMO'},
{id:'wordPop',name:'단어 팝',cat:'WORD'},{id:'wordSlide',name:'단어 슬라이드',cat:'WORD'},{id:'wordBounce',name:'단어 바운스',cat:'WORD'},{id:'sentenceDrop',name:'문장 드롭',cat:'SENTENCE'},{id:'sentenceWave',name:'문장 웨이브',cat:'SENTENCE'}
];
let srtLines=[],selected=0,isPlaying=false,loop=false,progress=0,globalTime=0,totalDuration=0,exporting=false;
let state={font:'Noto Sans KR',size:92,x:540,y:960,rot:0,skewX:0,skewY:0,color:'#ffffff',strokeColor:'#000000',strokeOn:true,shadowOn:true,motion:'jamoInPlace',stagger:0.06,letterSpacing:12, lineSpacing:24, mode:'jamo', modeChar:'jamo'};
const audio=document.getElementById('audio');

function parseSRT(txt){
let lines=txt.trim().split(/\r?\n/),res=[],i=0;
while(i<lines.length){
if(!lines[i].trim()){i++;continue;}
let idx=parseInt(lines[i]); i++; if(isNaN(idx)) continue;
if(i>=lines.length) break;
let tl=lines[i]; i++;
let m=tl.match(/(\d+):(\d+):(\d+),(\d+)\s*-->\s*(\d+):(\d+):(\d+),(\d+)/);
if(!m) continue;
let s=(+m[1]*3600+ +m[2]*60+ +m[3])*1000+ +m[4];
let e=(+m[5]*3600+ +m[6]*60+ +m[7])*1000+ +m[8];
let t=[]; while(i<lines.length && lines[i].trim()!==''){t.push(lines[i]); i++;}
let full=t.join(' ').trim();
if(full) res.push({start:s,end:e,text:full,motion:motions[res.length%motions.length].id,x:540,y:960,size:92,rot:0,skewX:0,skewY:0});
}
return res;
}
function calcTotal(){
if(audio.duration && !isNaN(audio.duration)) totalDuration=audio.duration*1000;
else if(srtLines.length) totalDuration=srtLines[srtLines.length-1].end+1000;
else totalDuration=10000;
document.getElementById('totalInfo').textContent=`총 길이: ${(totalDuration/1000).toFixed(1)}초 - 저장 시 처음부터 끝까지 전체 렌더`;
document.getElementById('timeLabel').textContent=`${(globalTime/1000).toFixed(1)}s / ${(totalDuration/1000).toFixed(1)}s`;
}
function renderList(){
let list=document.getElementById('list'); list.innerHTML='';
srtLines.forEach((l,idx)=>{
let d=document.createElement('div'); d.className='srt-item'+(idx===selected?' active':'');
d.innerHTML=`<div style="display:flex;justify-content:space-between;opacity:0.6"><span>#${idx+1}</span><span>${(l.start/1000).toFixed(1)}s</span></div><div style="font-weight:700">${l.text}</div>`;
d.onclick=()=>{selected=idx; loadLine(); globalTime=l.start; renderList();};
list.appendChild(d);
});
}
function loadLine(){
if(!srtLines[selected]) return; let l=srtLines[selected];
document.getElementById('editText').value=l.text; state.motion=l.motion; state.x=l.x; state.y=l.y; state.size=l.size;
document.getElementById('xPos').value=state.x; document.getElementById('yPos').value=state.y; document.getElementById('sizeSel').value=state.size;
document.getElementById('motionSel').value=state.motion;
}
function saveLine(){
if(!srtLines[selected]) return; srtLines[selected].text=document.getElementById('editText').value; srtLines[selected].motion=state.motion; srtLines[selected].x=state.x; srtLines[selected].y=state.y; srtLines[selected].size=state.size;
}
function ease(t,type){
if(type==='elastic') return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*2*Math.PI/3)+1;
if(type==='bounce'){if(t<1/2.75)return 7.5625*t*t;else if(t<2/2.75){t-=1.5/2.75;return 7.5625*t*t+0.75}else if(t<2.5/2.75){t-=2.25/2.75;return 7.5625*t*t+0.9375}else{t-=2.625/2.75;return 7.5625*t*t+0.984375}}
return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}
function getActiveLine(timeMs){
return srtLines.find(l=>timeMs>=l.start && timeMs<=l.end) || null;
}
function wrapTextToLines(text, maxWidth, font){
 ctx.font=font;
 let words=text.split(' ');
 let lines=[], cur='';
 for(let w of words){
  let test=cur?cur+' '+w:w;
  if(ctx.measureText(test).width>maxWidth && cur!==''){
   lines.push(cur); cur=w;
  } else cur=test;
 }
 if(cur) lines.push(cur);
 // 한글 긴 문장 추가 분할
 let finalLines=[];
 for(let line of lines){
  if(ctx.measureText(line).width<=maxWidth){ finalLines.push(line); continue; }
  let buf=''; for(let ch of [...line]){
   let test=buf+ch;
   if(ctx.measureText(test).width>maxWidth && buf!==''){ finalLines.push(buf); buf=ch; } else buf=test;
  }
  if(buf) finalLines.push(buf);
 }
 return finalLines;
}
function drawAtTime(timeMs){
ctx.fillStyle=document.getElementById('bgColor').value||'#000';
ctx.fillRect(0,0,canvas.width,canvas.height);
let line=getActiveLine(timeMs);
if(!line) return;
let p=Math.min(1,(timeMs-line.start)/600);
let fontStr=`800 ${line.size}px ${state.font}, sans-serif`;
ctx.font=fontStr;
let maxWidth=canvas.width - 160;
let wrapped=wrapTextToLines(line.text, maxWidth, fontStr);
let lineHeight=line.size + state.lineSpacing + 24;
let totalH=wrapped.length*lineHeight - state.lineSpacing;
let baseY=line.y - totalH/2;

wrapped.forEach((rowText,rowIdx)=>{
 let chars=[...rowText];
 let words=rowText.split(' ');
 // 모드별 유닛 결정
 let units=[];
 if(state.mode==='char' || state.mode==='jamo'){
  ctx.font=fontStr;
  let charWidths=chars.map(ch=>ctx.measureText(ch).width);
  let totalW=charWidths.reduce((a,b)=>a+b,0) + (chars.length-1)*state.letterSpacing;
  let startX=line.x - totalW/2;
  let accumX=0;
  chars.forEach((ch,i)=>{
   let charP=Math.min(1,Math.max(0,(p - i*state.stagger - rowIdx*0.12)/0.6));
   let e=ease(charP, line.motion.includes('elastic')?'elastic':line.motion.includes('bounce')?'bounce':'back');
   let decomp=decomposeHangul(ch);
   let cx=startX + accumX + charWidths[i]/2;
   let cy=baseY + rowIdx*lineHeight;
   let isJamoMotion=line.motion.startsWith('jamo') || state.mode==='jamo';

   if(!isJamoMotion){
    let ox=0,oy=0,sc=1,rot=0,alpha=1,skx=0;
    switch(line.motion){
     case 'slam': sc=e*1.25; oy=(1-e)*-90; rot=(1-e)*12*(i%2?1:-1); break;
     case 'bounce': oy=(1-e)*-220; sc=0.4+e*0.6; break;
     case 'elastic': sc=e; rot=(1-e)*360; break;
     case 'hammer': sc=charP<0.5?3-charP*4:1+Math.sin((charP-0.5)*12)*0.25; break;
     case 'impactShake': sc=e; oy=(1-e)*-20; if(charP>0.7) {ox=(Math.random()-0.5)*(1-charP)*40;} break;
     case 'whipL': ox=(1-e)*-700; rot=(1-e)*-25; break;
     case 'velR': ox=(1-e)*700; sc=0.2+e*0.8; break;
     case 'stagUp': oy=(1-e)*240; alpha=e; break;
     case 'train': ox=(1-e)*-900; skx=(1-e)*25; break;
     case 'slideBlur': ox=(1-e)*-500; alpha=e; sc=0.8+e*0.2; break;
     case 'flipX': rot=(1-e)*90; sc=charP; break;
     case 'flipY': sc=Math.cos((1-charP)*Math.PI/2); alpha=charP; break;
     case 'vortex': rot=(1-e)*720; sc=e; ox=Math.cos(i)* (1-e)*160; oy=Math.sin(i)*(1-e)*160; break;
     case 'tilt': rot=(1-e)*35; oy=(1-e)*90; break;
     case 'spin3D': rot=(1-e)*180; sc=0.3+e*0.7; break;
     case 'glitch': if(charP<0.88) ox=(Math.random()-0.5)*(1-charP)*120; skx=(1-charP)*18; break;
     case 'wave': oy=Math.sin(i*0.7+timeMs*0.012)*22; break;
     case 'jitter': ox=(Math.random()-0.5)*12; oy=(Math.random()-0.5)*12; break;
     case 'chroma': ox=(i%2?12:-12)*(1-e); break;
     case 'liquid': oy=Math.sin(i*0.5+timeMs*0.008)*15; sc=1+Math.sin(timeMs*0.01+i)*0.15*e; skx=Math.sin(timeMs*0.01+i)*8; break;
     case 'warp': sc=1; skx=Math.sin(timeMs*0.015+i)*12*(1-e+0.5); break;
     case 'pulse': sc=1+Math.sin(timeMs*0.018+i)*0.35*e; break;
     case 'cascade': sc=e; oy=(1-e)*-110; rot=(1-e)*15; break;
     case 'zoomBlur': sc=e*2.2; alpha=e; break;
     case 'stretch': sc=1; skx=Math.sin(p*10+i)*10; break;
     case 'popScale': sc= e<0.6? e*2.5 : 1+Math.sin((e-0.6)*8)*0.2; break;
     case 'fall': oy=(1-e)*-450+(1-e)*(1-e)*450; sc=0.5+e*0.5; break;
     case 'float': oy=Math.sin(timeMs*0.002+i)*18; break;
     case 'pendulum': rot=Math.sin(timeMs*0.004+i*0.3)*22*e; break;
     case 'spring': sc=1+Math.sin(charP*14)*0.32*(1-charP); break;
     case 'gravityDrop': oy=(1-e)*-300; if(e>0.8) oy+=Math.sin((e-0.8)*30)*10; break;
     case 'karaoke': alpha=i/chars.length < p?1:0.18; sc= i/chars.length < p?1.1:1; break;
     case 'outline': alpha=e; sc=0.8+e*0.2; break;
     case 'blurIn': alpha=e; sc=0.7+e*0.3; break;
     case 'splitRot': rot=(1-e)*180*(i%2?1:-1); oy=(1-e)*90*(i%2?1:-1); break;
     case 'typewriter': alpha=i/chars.length < p?1:0; break;
     case 'reveal': alpha=charP; ox=(1-e)*-30; break;
     case 'rubber': sc=1; let s=Math.sin(charP*7)*0.4*(1-charP); ctx.save(); // handled via scaleX
     break;
     case 'scatter': ox=(1-e)*(Math.random()-0.5)*800; oy=(1-e)*(Math.random()-0.5)*800; rot=(1-e)*720; break;
     case 'orbit': let ang=timeMs*0.005+i*0.55; ox=Math.cos(ang)*110*(1-e*0.5); oy=Math.sin(ang)*110*(1-e*0.5); break;
     case 'fire': oy=(1-e)*110; sc=e; break;
     case 'neon': alpha=Math.random()>0.12?1:0.25; break;
     case 'pixelate': sc=e; alpha=Math.floor(e*8)/8; break;
     default: oy=(1-e)*60; alpha=e;
    }
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(cx+ox,cy+oy); ctx.rotate(rot*Math.PI/180); ctx.transform(1,0,skx/45,1,0,0); ctx.scale(sc,sc);
    ctx.font=fontStr; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(state.shadowOn){ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=22;ctx.shadowOffsetY=10;}
    ctx.fillStyle=state.color;
    if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=Math.max(4,line.size*0.09);ctx.lineJoin='round';ctx.strokeText(ch,0,0);}
    ctx.fillText(ch,0,0); ctx.restore();
   } else {
    // 초중종성 제자리 - 자리 그대로, 모션만 분리
    if(!decomp){
     let sc=e; let oy=(1-e)*-40;
     ctx.save(); ctx.globalAlpha=e; ctx.translate(cx,cy+oy); ctx.scale(sc,sc); ctx.font=fontStr; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=state.color; ctx.fillText(ch,0,0); ctx.restore();
    } else {
     let parts=[
      {j:decomp.cho, d:0, offX:-10, offY:-16},
      {j:decomp.jung, d:0.07, offX:10, offY:0},
      {j:decomp.jong, d:0.14, offX:2, offY:18}
     ].filter(p=>p.j);
     parts.forEach((part,pi)=>{
      let pp=Math.min(1,Math.max(0,(p - i*state.stagger - part.d)/0.48));
      let ee=ease(pp, line.motion.includes('Elastic')?'elastic':'back');
      let jox=0,joy=0,jsc=ee,jrot=0,jAlpha=pp;
      if(line.motion==='jamoInPlace' || line.motion==='jamoPop3'){
       jox=(1-ee)*(part.offX*5 + (Math.random()-0.5)*16);
       joy=(1-ee)*(part.offY*4 - 85);
       jrot=(1-ee)*(pi===0?-22:pi===1?18:-12);
       jsc=0.15+ee*0.9;
      } else if(line.motion==='jamoShake'){
       jox=Math.sin(timeMs*0.02+pi)*6*(1-pp*0.4);
       joy=(1-ee)*-32;
       jsc=ee;
      } else if(line.motion==='jamoSpin'){
       jrot=(1-ee)*360*(pi%2?1:-1); jsc=ee; joy=(1-ee)*-40;
      } else if(line.motion==='jamoElastic'){
       jsc=ee*1.2; joy=(1-ee)*-60; jrot=(1-ee)*25*(pi%2?1:-1);
      } else if(line.motion==='jamoWave'){
       joy=Math.sin(timeMs*0.01+pi*1.2)*10 + (1-ee)*-40; jsc=ee;
      }
      ctx.save(); ctx.globalAlpha=jAlpha*0.92; ctx.translate(cx+jox,cy+joy); ctx.rotate(jrot*Math.PI/180); ctx.scale(jsc,jsc);
      ctx.font=`800 ${line.size*0.70}px ${state.font}, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=pi===2?'#ddd':state.color;
      if(pp<0.82){ ctx.fillText(part.j,0,0); }
      ctx.restore();
     });
     let finalP=Math.min(1,Math.max(0,(p - i*state.stagger - 0.28)/0.48));
     let fe=ease(finalP,'back');
     if(finalP>0){
      ctx.save(); ctx.globalAlpha=finalP; ctx.translate(cx,cy); ctx.scale(0.55+fe*0.45,0.55+fe*0.45);
      ctx.font=fontStr; ctx.textAlign='center'; ctx.textBaseline='middle';
      if(state.shadowOn){ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=20;}
      ctx.fillStyle=state.color;
      if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=8;ctx.lineJoin='round';ctx.strokeText(ch,0,0);}
      ctx.fillText(ch,0,0); ctx.restore();
     }
    }
   }
   accumX+=charWidths[i]+state.letterSpacing;
  });
 } else if(state.mode==='word'){
  let wordWidths=words.map(w=>{ctx.font=fontStr; return ctx.measureText(w).width;});
  let totalW=wordWidths.reduce((a,b)=>a+b,0)+(words.length-1)*(state.letterSpacing*3+ctx.measureText(' ').width);
  let startX=line.x - totalW/2;
  let acc=0;
  words.forEach((w,wi)=>{
   let wp=Math.min(1,Math.max(0,(p - wi*0.18 - rowIdx*0.1)/0.55));
   let we=ease(wp,'back');
   let ox=0,oy=0,sc=1,rot=0,alpha=1;
   switch(line.motion){
    case 'wordPop': sc=0.2+we*0.8; oy=(1-we)*-50; break;
    case 'wordSlide': ox=(1-we)*-400; break;
    case 'wordBounce': oy=(1-we)*-180; sc=0.5+we*0.5; break;
    default: sc=we; oy=(1-we)*-40; alpha=we;
   }
   let cx=startX+acc+wordWidths[wi]/2+ox;
   let cy=baseY+rowIdx*lineHeight+oy;
   ctx.save(); ctx.globalAlpha=alpha; ctx.translate(cx,cy); ctx.rotate(rot*Math.PI/180); ctx.scale(sc,sc);
   ctx.font=fontStr; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=state.color;
   if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=8;ctx.strokeText(w,0,0);}
   ctx.fillText(w,0,0); ctx.restore();
   acc+=wordWidths[wi]+state.letterSpacing*3+ctx.measureText(' ').width;
  });
 } else if(state.mode==='sentence'){
  let wp=Math.min(1,(p)/0.6); let we=ease(wp,'back');
  let ox=0,oy=0,sc=1,rot=0,alpha=1;
  switch(line.motion){
   case 'sentenceDrop': oy=(1-we)*-300; sc=0.7+we*0.3; break;
   case 'sentenceWave': oy=Math.sin(timeMs*0.008)*12; sc=1; break;
   default: sc=0.5+we*0.5; oy=(1-we)*-80; alpha=we;
  }
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(line.x+ox, baseY+rowIdx*lineHeight+oy); ctx.scale(sc,sc);
  ctx.font=fontStr; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=state.color;
  if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=8;ctx.strokeText(rowText,0,0);}
  ctx.fillText(rowText,0,0); ctx.restore();
 }
});
}
function drawLoop(){
if(!exporting){
if(isPlaying){globalTime+=16; if(globalTime>totalDuration){globalTime=loop?0:totalDuration; if(!loop) isPlaying=false;}}
document.getElementById('seek').value=totalDuration? (globalTime/totalDuration*100):0;
document.getElementById('timeLabel').textContent=`${(globalTime/1000).toFixed(1)}s / ${(totalDuration/1000).toFixed(1)}s`;
}
drawAtTime(globalTime);
requestAnimationFrame(drawLoop);
}
// UI
function renderMotionGrid(){
 let cats={};
 motions.forEach(m=>{ if(!cats[m.cat]) cats[m.cat]=[]; cats[m.cat].push(m); });
 let html='';
 for(let cat in cats){
  html+=`<div style="grid-column:1/-1;font-size:10px;color:#666;margin-top:8px;font-weight:800">${cat}</div>`;
  cats[cat].forEach(m=>{ html+=`<button class="motion-btn ${state.motion===m.id?'active':''}" data-id="${m.id}"><b>${m.name}</b><span style="font-size:9px;opacity:0.6;display:block">${m.cat}</span></button>`; });
 }
 document.getElementById('motionGrid').innerHTML=html;
}
document.getElementById('motionSel').innerHTML=motions.map(m=>`<option value="${m.id}">[${m.cat}] ${m.name}</option>`).join('');
renderMotionGrid();
document.getElementById('motionGrid').addEventListener('click',e=>{let b=e.target.closest('.motion-btn'); if(!b) return; state.motion=b.dataset.id; document.getElementById('motionSel').value=state.motion; renderMotionGrid(); saveLine();});
document.getElementById('motionSel').addEventListener('change',e=>{state.motion=e.target.value; renderMotionGrid(); saveLine();});

// 모드 버튼
function setMode(m){
 state.mode=m;
 document.querySelectorAll('#modeChar,#modeJamo,#modeWord,#modeSentence').forEach(btn=>btn.classList.remove('active'));
 let map={char:'modeChar', jamo:'modeJamo', word:'modeWord', sentence:'modeSentence'};
 let target=document.getElementById(map[m]);
 if(target) target.classList.add('active');
 if(m==='jamo' && !state.motion.startsWith('jamo')){ state.motion='jamoInPlace'; document.getElementById('motionSel').value=state.motion; renderMotionGrid(); }
 if(m==='word' && !state.motion.startsWith('word')){ state.motion='wordPop'; document.getElementById('motionSel').value=state.motion; renderMotionGrid(); }
 if(m==='sentence' && !state.motion.startsWith('sentence')){ state.motion='sentenceDrop'; document.getElementById('motionSel').value=state.motion; renderMotionGrid(); }
}
document.getElementById('modeChar').addEventListener('click',()=>setMode('char'));
document.getElementById('modeJamo').addEventListener('click',()=>setMode('jamo'));
document.getElementById('modeWord').addEventListener('click',()=>setMode('word'));
document.getElementById('modeSentence').addEventListener('click',()=>setMode('sentence'));
setMode('jamo');
document.getElementById('srtFile').addEventListener('change',async ev=>{let f=ev.target.files[0]; if(!f) return; let txt=await f.text(); srtLines=parseSRT(txt); selected=0; renderList(); loadLine(); calcTotal();});
document.getElementById('parseBtn').addEventListener('click',()=>{
let txt=document.getElementById('srtPaste').value;
if(!txt.trim()) txt=`1\n00:00:00,000 --> 00:00:02,500\n보지 못하였습니다\n\n2\n00:00:02,500 --> 00:00:05,000\n당신이 사과를 따서\n\n3\n00:00:05,000 --> 00:00:08,000\n나를 주려고 크고 붉은 사과를`;
srtLines=parseSRT(txt); selected=0; renderList(); loadLine(); calcTotal(); isPlaying=true;
});
document.getElementById('audioFile').addEventListener('change',e=>{
let f=e.target.files[0]; if(!f) return; let url=URL.createObjectURL(f); audio.src=url; audio.style.display='block'; audio.onloadedmetadata=()=>calcTotal();
});
document.getElementById('seek').addEventListener('input',e=>{globalTime= e.target.value/100*totalDuration;});
document.getElementById('playBtn').addEventListener('click',()=>{isPlaying=!isPlaying; document.getElementById('playBtn').textContent=isPlaying?'⏸':'▶'; if(isPlaying && audio.src) audio.play(); else audio.pause();});
document.getElementById('resetPosBtn').addEventListener('click',()=>{state.x=canvas.width/2; state.y=canvas.height/2; saveLine();});

// H264 EXPORT - 전체 타임라인
document.getElementById('exportBtn').addEventListener('click',async()=>{
if(!srtLines.length){alert('SRT 먼저 로드');return;}
exporting=true;
isPlaying=false;
let mimeOpts=[
'video/mp4; codecs=avc1.42E01E',
'video/mp4; codecs=avc1',
'video/mp4',
'video/webm; codecs=vp9',
'video/webm'
];
let chosenMime=null;
for(let m of mimeOpts){ if(MediaRecorder.isTypeSupported(m)){ chosenMime=m; break; } }
console.log('Chosen mime',chosenMime);
let status=document.getElementById('exportStatus');
status.textContent=`H264 인코딩 시도 중: ${chosenMime} - 전체 ${ (totalDuration/1000).toFixed(1)}초 렌더링`;
document.getElementById('exportProgress').style.display='block';
let stream=canvas.captureStream(60);
let rec=new MediaRecorder(stream,{mimeType:chosenMime, videoBitsPerSecond:12000000});
let chunks=[];
rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
rec.onstop=()=>{
let blob=new Blob(chunks,{type:chosenMime});
let url=URL.createObjectURL(blob);
let a=document.createElement('a');
let ext=chosenMime.includes('mp4')?'mp4':'webm';
a.href=url; a.download=`kinetic_FULL_${Date.now()}.${ext}`; a.click();
status.textContent=`✅ 저장 완료: ${ext.toUpperCase()} (${chosenMime}) - 크롬/엣지 최신버전에선 MP4 H264로 저장됨. 만약 webm으로 저장됐다면, Handbrake나 ffmpeg로 mp4 변환 가능: ffmpeg -i input.webm -c:v libx264 -pix_fmt yuv420p output.mp4`;
document.getElementById('exportProgress').style.display='none';
exporting=false;
};
rec.start(100);
let startTime=performance.now();
let exportTime=0;
function exportStep(){
exportTime+=16.66; // 60fps
globalTime=exportTime;
drawAtTime(globalTime);
let pct=Math.min(100, exportTime/totalDuration*100);
document.getElementById('exportBar').style.width=pct+'%';
status.textContent=`🔴 전체 렌더링 중... ${(exportTime/1000).toFixed(1)}s / ${(totalDuration/1000).toFixed(1)}s (${pct.toFixed(1)}%) - ${chosenMime}`;
if(exportTime<totalDuration){
requestAnimationFrame(exportStep);
}else{
rec.stop();
}
}
exportStep();
});

document.getElementById('editText').addEventListener('input',()=>saveLine());
['fontSel','sizeSel','xPos','yPos','rot','letterSpacing','lineSpacing'].forEach(id=>{
document.getElementById(id).addEventListener('input',e=>{
if(id==='fontSel') state.font=e.target.value;
if(id==='sizeSel') state.size=parseFloat(e.target.value);
if(id==='xPos') state.x=parseFloat(e.target.value);
if(id==='yPos') state.y=parseFloat(e.target.value);
if(id==='rot') state.rot=parseFloat(e.target.value);
if(id==='letterSpacing') state.letterSpacing=parseFloat(e.target.value);
if(id==='lineSpacing') state.lineSpacing=parseFloat(e.target.value);
saveLine();
});
});
drawLoop();
</script>
</body>
