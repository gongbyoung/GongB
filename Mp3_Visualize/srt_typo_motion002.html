<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SRT Kinetic V5 - Jamo + Auto Wrap</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Inter:wght@800&family=Montserrat:wght@800&family=Noto+Sans+KR:wght@800&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#eee;font-family:Inter,Noto Sans KR,sans-serif;display:flex;height:100vh;overflow:hidden}
.left{width:350px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;padding:16px}
.right{width:420px;background:#111;border-left:1px solid #222;overflow-y:auto;padding:14px}
.btn{background:#222;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.btn.primary{background:#ff3b30;border-color:#ff3b30;font-weight:800}
.btn.active{background:#fff;color:#000}
.srt-item{padding:9px 11px;border-radius:10px;background:#181818;border:1px solid #222;margin-bottom:6px;cursor:pointer;font-size:12px}
.srt-item.active{background:#fff;color:#000}
#mainCanvas{display:block;max-height:62vh;max-width:100%;border-radius:12px;border:1px solid #222;background:#000}
.motion-btn{padding:7px;border-radius:7px;background:#1c1c1c;border:1px solid #2a2a2a;font-size:10px;cursor:pointer}
.motion-btn.active{background:#fff;color:#000}
.field{margin-bottom:8px} .field label{font-size:10px;color:#888} .field input,.field select{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:5px;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.toggle{ display:flex; gap:6px; margin:8px 0}
.toggle button{flex:1;padding:6px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#888;font-size:11px;cursor:pointer}
.toggle button.active{background:#fff;color:#000;border-color:#fff;font-weight:800}
#exportProgress{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-top:8px;display:none}
#exportProgress div{height:100%;background:#ff3b30;width:0%}
</style>
</head>
<body>
<div class="left">
<div style="padding:14px;border-bottom:1px solid #222">
<label class="btn primary" style="display:block;text-align:center">📁 SRT 선택<input id="srtFile" type="file" accept=".srt" style="display:none"></label>
<label class="btn" style="display:block;text-align:center;margin-top:8px">🎵 MP3/WAV<input id="audioFile" type="file" accept="audio/*" style="display:none"></label>
<audio id="audio" controls style="width:100%;margin-top:8px;display:none"></audio>
<div id="totalInfo" style="font-size:11px;color:#888;margin-top:6px">총 길이 자동 계산</div>
<textarea id="srtPaste" placeholder="SRT 붙여넣기" style="width:100%;height:60px;margin-top:8px;background:#0f0f0f;border:1px solid #222;color:#fff;padding:6px;border-radius:6px;font-size:11px"></textarea>
<button id="parseBtn" class="btn" style="width:100%;margin-top:6px">파싱</button>
</div>
<div id="list" style="flex:1;overflow-y:auto;padding:8px"></div>
</div>

<div class="center">
<canvas id="mainCanvas" width="1080" height="1920"></canvas>
<div style="display:flex;gap:8px;margin-top:12px;align-items:center;width:100%;max-width:700px">
<button id="playBtn" class="btn primary">⏸</button>
<input id="seek" type="range" min="0" max="100" value="0" style="flex:1;accent-color:#ff3b30">
<span id="timeLabel" style="font-size:11px">0.0s / 0.0s</span>
<button id="resetPosBtn" class="btn">📍 중앙</button>
</div>
<div style="display:flex;gap:8px;margin-top:10px;width:100%;max-width:700px">
<select id="resSelect" class="btn"><option value="1080x1920">1080x1920 세로</option><option value="1920x1080">1920x1080 가로</option><option value="1080x1080">1080x1080</option></select>
<input id="bgColor" type="color" value="#000000">
<button id="exportBtn" class="btn primary" style="flex:1">⬇ H264 MP4 전체 저장</button>
</div>
<div id="exportProgress"><div id="exportBar"></div></div>
<div id="exportStatus" style="font-size:11px;color:#666;margin-top:6px">자동 줄바꿈 + 자간 + 초중종성 분리 모션 적용</div>
</div>

<div class="right">
<div class="field"><label>가사 TEXT</label><input id="editText" type="text"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div class="field"><label>폰트</label><select id="fontSel"><option>Noto Sans KR</option><option>Black Han Sans</option><option>Inter</option><option>Anton</option><option>Montserrat</option><option>Oswald</option></select></div>
<div class="field"><label>크기</label><input id="sizeSel" type="range" min="24" max="200" value="82"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div class="field"><label>자간</label><input id="letterSpacing" type="range" min="-10" max="80" value="8"></div>
<div class="field"><label>행간</label><input id="lineSpacing" type="range" min="0" max="120" value="24"></div>
</div>
<div class="field"><label>모션 모드 - 진짜 키네틱</label>
<div class="toggle">
<button id="modeChar" class="active">한 글자씩</button>
<button id="modeJamo">초중종성 분리</button>
<button id="modeWord">단어씩</button>
</div>
</div>
<div class="field"><label>모션 프리셋</label><select id="motionSel"></select></div>
<div id="motionGrid" class="grid"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
<div class="field"><label>X</label><input id="xPos" type="range" min="0" max="1080" value="540"></div>
<div class="field"><label>Y</label><input id="yPos" type="range" min="0" max="1920" value="960"></div>
</div>
<div style="display:flex;gap:6px">
<input id="color" type="color" value="#ffffff"><input id="strokeColor" type="color" value="#000000"><label style="font-size:10px"><input id="strokeOn" type="checkbox" checked> 외곽</label><label style="font-size:10px"><input id="shadowOn" type="checkbox" checked> 그림자</label>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<div class="field"><label>Stagger (글자 간 딜레이)</label><input id="stagger" type="range" min="0.01" max="0.25" step="0.01" value="0.06"></div>
<div class="field"><label>캔버스 여백 (줄바꿈 기준)</label><input id="padding" type="range" min="0" max="200" value="80"></div>
</div>
</div>

<script>
const canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d');
const motions=[
{id:'slam',name:'Slam Pop'},{id:'bounce',name:'Bounce Drop'},{id:'elastic',name:'Elastic'},{id:'whipL',name:'Whip Left'},{id:'velR',name:'Velocity Right'},{id:'stagUp',name:'Stagger Up'},{id:'vortex',name:'Vortex Spin'},{id:'glitch',name:'Glitch'},{id:'wave',name:'Liquid Wave'},{id:'pulse',name:'Heartbeat'},{id:'scatter',name:'Scatter Break'},{id:'orbit',name:'Orbit'},{id:'neon',name:'Neon Flicker'},{id:'fall',name:'Fall Bounce'},{id:'jamoPop',name:'자모 팝 (초중종 분리)'},{id:'jamoAssemble',name:'자모 조립'},{id:'charRotate',name:'한글자씩 회전'}
];

// 한글 초중종성 분리 테이블 (호환 자모)
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function decomposeHangul(char){
let code=char.charCodeAt(0);
if(code<0xAC00 || code>0xD7A3) return [char]; // not hangul
let base=code-0xAC00;
let cho=Math.floor(base/(21*28));
let jung=Math.floor((base%(21*28))/28);
let jong=base%28;
let res=[CHO[cho], JUNG[jung]];
if(jong!==0) res.push(JONG[jong]);
return res;
}

let srtLines=[],selected=0,isPlaying=false,loop=false,globalTime=0,totalDuration=0,exporting=false;
let state={font:'Noto Sans KR',size:82,x:540,y:960,rot:0,letterSpacing:8,lineSpacing:24,stagger:0.06,padding:80,color:'#ffffff',strokeColor:'#000000',strokeOn:true,shadowOn:true,motion:'slam',mode:'char'};
const audio=document.getElementById('audio');

function parseSRT(txt){
let lines=txt.trim().split(/\r?\n/),res=[],i=0;
while(i<lines.length){
if(!lines[i].trim()){i++;continue;}
let idx=parseInt(lines[i]); i++; if(isNaN(idx)) continue;
if(i>=lines.length) break;
let tl=lines[i]; i++;
let m=tl.match(/(\d+):(\d+):(\d+),(\d+)\s*-->\s*(\d+):(\d+):(\d+),(\d+)/);
if(!m) continue;
let s=(+m[1]*3600+ +m[2]*60+ +m[3])*1000+ +m[4];
let e=(+m[5]*3600+ +m[6]*60+ +m[7])*1000+ +m[8];
let t=[]; while(i<lines.length && lines[i].trim()!==''){t.push(lines[i]); i++;}
let full=t.join(' ').trim();
if(full) res.push({start:s,end:e,text:full,motion:'slam',x:540,y:960,size:82});
}
return res;
}
function calcTotal(){
if(audio.duration && !isNaN(audio.duration)) totalDuration=audio.duration*1000;
else if(srtLines.length) totalDuration=srtLines[srtLines.length-1].end+1000;
else totalDuration=10000;
}
function renderList(){
let list=document.getElementById('list'); list.innerHTML='';
srtLines.forEach((l,idx)=>{
let d=document.createElement('div'); d.className='srt-item'+(idx===selected?' active':'');
d.innerHTML=`<div style="opacity:0.6">#${idx+1} ${(l.start/1000).toFixed(1)}s</div><div style="font-weight:700">${l.text}</div>`;
d.onclick=()=>{selected=idx; loadLine(); globalTime=l.start; renderList();};
list.appendChild(d);
});
}
function loadLine(){ if(!srtLines[selected]) return; document.getElementById('editText').value=srtLines[selected].text; }
function saveLine(){ if(!srtLines[selected]) return; srtLines[selected].text=document.getElementById('editText').value; }

function ease(t,type){
if(type==='elastic') return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*2*Math.PI/3)+1;
if(type==='bounce'){if(t<1/2.75)return 7.5625*t*t;else if(t<2/2.75){t-=1.5/2.75;return 7.5625*t*t+0.75}else if(t<2.5/2.75){t-=2.25/2.75;return 7.5625*t*t+0.9375}else{t-=2.625/2.75;return 7.5625*t*t+0.984375}}
return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}
function getActiveLine(timeMs){ return srtLines.find(l=>timeMs>=l.start && timeMs<=l.end) || null; }

function wrapText(text, maxWidth, font){
ctx.font=font;
let words=text.split(' ');
let lines=[], cur='';
for(let w of words){
let test=cur?cur+' '+w:w;
if(ctx.measureText(test).width>maxWidth && cur!==''){
lines.push(cur);
cur=w;
}else cur=test;
}
if(cur) lines.push(cur);
// 한글은 단어 단위가 아니라 글자 단위로도 줄바꿈 필요하면 재처리
let finalLines=[];
for(let line of lines){
if(ctx.measureText(line).width<=maxWidth){ finalLines.push(line); continue; }
let buf=''; for(let ch of [...line]){ let test=buf+ch; if(ctx.measureText(test).width>maxWidth && buf!==''){ finalLines.push(buf); buf=ch; } else buf=test; } if(buf) finalLines.push(buf);
}
return finalLines;
}

function drawAtTime(timeMs){
ctx.fillStyle=document.getElementById('bgColor').value||'#000';
ctx.fillRect(0,0,canvas.width,canvas.height);
let line=getActiveLine(timeMs);
if(!line) return;
let p=Math.min(1,(timeMs-line.start)/500);
let fontStr=`800 ${line.size}px ${state.font}, sans-serif`;
ctx.font=fontStr;
let maxWidth=canvas.width - state.padding*2;
let wrapped=wrapText(line.text, maxWidth, fontStr);
let lineHeight=line.size + state.lineSpacing;
let totalH=wrapped.length*lineHeight - state.lineSpacing;
let baseY=line.y - totalH/2;

wrapped.forEach((rowText,rowIdx)=>{
let chars=[...rowText];
let units=[]; // kinetic units: either char, jamo, or word
if(state.mode==='char'){
units=chars.map(c=>({display:c, jamos:decomposeHangul(c), isJamo:false}));
}else if(state.mode==='jamo'){
// 초중종성 분리: 한 글자를 2~3개 유닛으로
chars.forEach(c=>{
let j=decomposeHangul(c);
j.forEach(jm=>units.push({display:jm, parent:c, isJamo:true, fullChar:c}));
});
}else{ // word
let words=rowText.split(' ');
units=words.map(w=>({display:w, isWord:true}));
}

let charWidths=units.map(u=>ctx.measureText(u.display).width);
let totalW=charWidths.reduce((a,b)=>a+b,0) + (units.length-1)*state.letterSpacing;
let startX=line.x - totalW/2;
let accum=0;
units.forEach((u,i)=>{
let charP=Math.min(1,Math.max(0,(p - i*state.stagger* (u.isJamo?0.5:1))/0.6));
let e=ease(charP, u.isJamo?'elastic':'back');
let ox=0,oy=0,sc=1,rot=0,alpha=1;
if(state.motion==='jamoPop' || state.motion==='slam'){
sc=0.2+e*1.0; oy=(1-e)*-60*(u.isJamo? (i%3===0?1:-1):1); rot=(1-e)* (u.isJamo? 180: 30)*(i%2?1:-1);
}
else if(state.motion==='jamoAssemble'){
// 초성은 왼쪽에서, 중성은 위에서, 종성은 아래에서 모임
if(u.isJamo){
let idxInSyll=i%3;
if(idxInSyll===0){ ox=(1-e)*-120; } else if(idxInSyll===1){ oy=(1-e)*-120; } else { oy=(1-e)*120; ox=(1-e)*80; }
sc=e; rot=(1-e)*90;
}else{ sc=e; oy=(1-e)*-40; }
}
else if(state.motion==='charRotate'){
rot=(1-e)*360; sc=e; alpha=charP;
}
else{
switch(state.motion){
case 'bounce': oy=(1-e)*-180; sc=0.5+e*0.5; break;
case 'whipL': ox=(1-e)*-500; break;
case 'vortex': rot=(1-e)*720; sc=e; break;
case 'glitch': ox=charP<0.85?(Math.random()-0.5)*(1-charP)*100:0; break;
case 'wave': oy=Math.sin(i*0.7+timeMs*0.012)*18; break;
case 'scatter': ox=(1-e)*(Math.random()-0.5)*700; oy=(1-e)*(Math.random()-0.5)*700; rot=(1-e)*720; break;
default: oy=(1-e)*50; alpha=e;
}
}
let cx=startX + accum + charWidths[i]/2 + ox;
let cy=baseY + rowIdx*lineHeight + oy;
ctx.save();
ctx.globalAlpha=alpha;
ctx.translate(cx,cy);
ctx.rotate(rot*Math.PI/180);
ctx.scale(sc,sc);
ctx.font=fontStr;
ctx.textAlign='center'; ctx.textBaseline='middle';
if(state.shadowOn){ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;}
ctx.fillStyle=state.color;
if(state.strokeOn){ctx.strokeStyle=state.strokeColor;ctx.lineWidth=Math.max(4,line.size*0.08);ctx.lineJoin='round';ctx.strokeText(u.display,0,0);}
ctx.fillText(u.display,0,0);
ctx.restore();
accum+=charWidths[i]+state.letterSpacing;
});
});
}
function drawLoop(){
if(!exporting){
if(isPlaying){globalTime+=16; if(globalTime>totalDuration){globalTime=loop?0:totalDuration;}}
document.getElementById('seek').value=totalDuration? (globalTime/totalDuration*100):0;
document.getElementById('timeLabel').textContent=`${(globalTime/1000).toFixed(1)}s / ${(totalDuration/1000).toFixed(1)}s`;
}
drawAtTime(globalTime);
requestAnimationFrame(drawLoop);
}

// UI
document.getElementById('motionSel').innerHTML=motions.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
document.getElementById('motionGrid').innerHTML=motions.map(m=>`<button class="motion-btn" data-id="${m.id}">${m.name}</button>`).join('');
document.getElementById('motionGrid').addEventListener('click',e=>{let b=e.target.closest('.motion-btn'); if(!b) return; state.motion=b.dataset.id; document.getElementById('motionSel').value=b.dataset.id;});
document.getElementById('motionSel').addEventListener('change',e=>state.motion=e.target.value);
document.getElementById('srtFile').addEventListener('change',async ev=>{let f=ev.target.files[0]; if(!f) return; let txt=await f.text(); srtLines=parseSRT(txt); selected=0; renderList(); loadLine(); calcTotal();});
document.getElementById('parseBtn').addEventListener('click',()=>{
let txt=document.getElementById('srtPaste').value;
if(!txt.trim()) txt=`1\n00:00:00,000 --> 00:00:03,000\n빨간차가 달린 지도 빨간차가 달린 지도 너무 길어서 화면을 넘어가는 테스트\n\n2\n00:00:03,000 --> 00:00:06,000\n당신이 사과를 따서 나를 주려고 했던 그 순간`;
srtLines=parseSRT(txt); selected=0; renderList(); loadLine(); calcTotal(); isPlaying=true;
});
document.getElementById('audioFile').addEventListener('change',e=>{let f=e.target.files[0]; if(!f) return; let url=URL.createObjectURL(f); audio.src=url; audio.style.display='block'; audio.onloadedmetadata=()=>calcTotal();});
document.getElementById('seek').addEventListener('input',e=>globalTime=e.target.value/100*totalDuration);
document.getElementById('playBtn').addEventListener('click',()=>{isPlaying=!isPlaying; document.getElementById('playBtn').textContent=isPlaying?'⏸':'▶';});
document.getElementById('resetPosBtn').addEventListener('click',()=>{state.x=canvas.width/2; state.y=canvas.height/2;});

function setMode(m){ state.mode=m; document.querySelectorAll('.toggle button').forEach(b=>b.classList.remove('active')); document.getElementById('mode'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active'); }
document.getElementById('modeChar').onclick=()=>setMode('char');
document.getElementById('modeJamo').onclick=()=>setMode('jamo');
document.getElementById('modeWord').onclick=()=>setMode('word');

['editText','fontSel','sizeSel','xPos','yPos','letterSpacing','lineSpacing','stagger','padding','color','strokeColor'].forEach(id=>{
document.getElementById(id).addEventListener('input',e=>{
let v=e.target.value;
if(id==='editText') saveLine();
if(id==='fontSel') state.font=v;
if(id==='sizeSel') state.size=parseFloat(v);
if(id==='xPos') state.x=parseFloat(v);
if(id==='yPos') state.y=parseFloat(v);
if(id==='letterSpacing') state.letterSpacing=parseFloat(v);
if(id==='lineSpacing') state.lineSpacing=parseFloat(v);
if(id==='stagger') state.stagger=parseFloat(v);
if(id==='padding') state.padding=parseFloat(v);
if(id==='color') state.color=v;
if(id==='strokeColor') state.strokeColor=v;
});
});
document.getElementById('strokeOn').addEventListener('change',e=>state.strokeOn=e.target.checked);
document.getElementById('shadowOn').addEventListener('change',e=>state.shadowOn=e.target.checked);
document.getElementById('resSelect').addEventListener('change',e=>{let [w,h]=e.target.value.split('x').map(Number); canvas.width=w; canvas.height=h; state.x=w/2; state.y=h/2;});

document.getElementById('exportBtn').addEventListener('click',async()=>{
if(!srtLines.length){alert('SRT 먼저');return;}
exporting=true; isPlaying=false;
let mime='video/mp4; codecs=avc1.42E01E';
if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm; codecs=vp9';
let stream=canvas.captureStream(60);
let rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:12000000});
let chunks=[]; rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
rec.onstop=()=>{let blob=new Blob(chunks,{type:mime}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`kinetic_${Date.now()}.${mime.includes('mp4')?'mp4':'webm'}`; a.click(); exporting=false;};
rec.start();
let exp=0;
function step(){
exp+=16.66; globalTime=exp;
drawAtTime(globalTime);
document.getElementById('exportBar').style.width=Math.min(100,exp/totalDuration*100)+'%';
if(exp<totalDuration) requestAnimationFrame(step); else rec.stop();
}
step();
});

document.getElementById('parseBtn').click();
drawLoop();
</script>
</body>
</html>
