<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT 키네틱 타이포그래피 스튜디오</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --panel: #2a2a3c;
            --accent: #6c5ce7;
            --text: #eee;
            --border: #444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 280px;
            background: var(--panel);
            padding: 16px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar.right {
            border-right: none;
            border-left: 1px solid var(--border);
        }
        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            min-width: 0;
        }
        canvas {
            max-width: 100%;
            max-height: 70vh;
            border: 1px solid #333;
            background: #000;
            display: block;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, select, input[type="file"], input[type="number"], input[type="text"], input[type="color"] {
            background: #3a3a4a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #4a4a5a; }
        input[type="color"] { padding: 0; width: 40px; height: 32px; }
        label { display: block; margin: 8px 0 4px; font-size: 13px; color: #aaa; }
        hr { margin: 16px 0; border: 0; border-top: 1px solid var(--border); }
        h2, h3 { font-size: 16px; margin-bottom: 8px; }
        .subtitle-item {
            padding: 8px;
            margin: 4px 0;
            background: #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            border-left: 3px solid transparent;
        }
        .subtitle-item.selected {
            border-left-color: var(--accent);
            background: #3f3f55;
        }
        .subtitle-item .time {
            font-size: 11px;
            color: #aaa;
        }
        .property-editor input, .property-editor select {
            width: 100%;
            margin-bottom: 6px;
        }
        .property-editor .row {
            display: flex;
            gap: 8px;
        }
        .property-editor .row > * { flex: 1; }
        #timeline {
            flex: 1;
            min-width: 200px;
        }
        #timeDisplay { font-family: monospace; }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }
        .btn-primary:hover { background: #7d6ff0; }
        .btn-danger { background: #e74c3c; border-color: #e74c3c; }
        .btn-danger:hover { background: #ff5e4a; }
    </style>
</head>
<body>
    <div id="app">
        <!-- 왼쪽 패널: 프로젝트 및 전역 설정 -->
        <div class="sidebar left">
            <h2>📁 프로젝트</h2>
            <label>SRT 자막 파일</label>
            <input type="file" id="srtFile" accept=".srt">
            <label>오디오 파일 (선택)</label>
            <input type="file" id="audioFile" accept="audio/*">
            <audio id="audio" style="display:none;"></audio>
            <button id="loadSample" style="margin-top:8px;">샘플 SRT 로드</button>
            <hr>
            <h2>🎬 전역 설정</h2>
            <label>전역 프리셋</label>
            <select id="globalPreset"></select>
            <button id="applyGlobalPreset" style="margin-top:8px;">모든 자막에 적용</button>
            <hr>
            <label>기본 폰트</label>
            <select id="fontFamily">
                <option value="Arial">Arial</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
                <option value="Verdana">Verdana</option>
                <option value="Impact">Impact</option>
                <option value="Noto Sans KR">Noto Sans KR</option>
                <option value="Nanum Gothic">Nanum Gothic</option>
                <option value="맑은 고딕">맑은 고딕</option>
            </select>
            <label>기본 폰트 크기</label>
            <input type="number" id="fontSize" value="60" min="10" max="200">
            <label>기본 색상</label>
            <input type="color" id="textColor" value="#ffffff">
            <label>테두리 색</label>
            <input type="color" id="strokeColor" value="#000000">
            <label>테두리 두께</label>
            <input type="number" id="strokeWidth" value="0" min="0" max="20" step="0.5">
            <label>그림자 흐림</label>
            <input type="number" id="shadowBlur" value="0" min="0" max="50">
            <label>그림자 색</label>
            <input type="color" id="shadowColor" value="#000000">
            <hr>
            <h2>💾 내보내기</h2>
            <label>내보낼 길이 (초)</label>
            <input type="number" id="exportDuration" value="10" min="1" max="600">
            <button id="exportBtn" class="btn-primary" style="width:100%; margin-top:8px;">MP4 저장</button>
            <a id="downloadLink" style="display:none;"></a>
        </div>

        <!-- 중앙: 캔버스 및 재생 컨트롤 -->
        <div class="center">
            <canvas id="canvas" width="1280" height="720"></canvas>
            <div class="controls">
                <button id="playBtn">▶ 재생</button>
                <button id="stopBtn">⏹ 정지</button>
                <input type="range" id="timeline" min="0" max="100" step="0.01" value="0">
                <span id="timeDisplay">0.00 / 0.00</span>
            </div>
        </div>

        <!-- 오른쪽 패널: 자막 목록 및 선택 속성 -->
        <div class="sidebar right">
            <h2>📝 자막 목록</h2>
            <div id="subtitleList" style="max-height:40vh; overflow-y:auto;"></div>
            <div id="propertyEditor" class="property-editor">
                <h3>선택된 자막 속성</h3>
                <div id="selectedText" style="font-size:13px; color:#aaa; margin-bottom:8px;"></div>
                <label>애니메이션 프리셋</label>
                <select id="linePreset"></select>
                <div class="row">
                    <div>
                        <label>X 위치</label>
                        <input type="number" id="propX" step="1">
                    </div>
                    <div>
                        <label>Y 위치</label>
                        <input type="number" id="propY" step="1">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>크기(배율)</label>
                        <input type="number" id="propScale" step="0.01">
                    </div>
                    <div>
                        <label>회전(deg)</label>
                        <input type="number" id="propRotation" step="1">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>비틀기 X(deg)</label>
                        <input type="number" id="propSkewX" step="1">
                    </div>
                    <div>
                        <label>비틀기 Y(deg)</label>
                        <input type="number" id="propSkewY" step="1">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>입장 시간(초)</label>
                        <input type="number" id="propEnterDur" step="0.01" min="0">
                    </div>
                    <div>
                        <label>퇴장 시간(초)</label>
                        <input type="number" id="propExitDur" step="0.01" min="0">
                    </div>
                </div>
                <label>폰트</label>
                <select id="propFontFamily"></select>
                <label>폰트 크기</label>
                <input type="number" id="propFontSize" min="10" max="200">
                <label>색상</label>
                <input type="color" id="propColor">
                <label>테두리 색</label>
                <input type="color" id="propStrokeColor">
                <label>테두리 두께</label>
                <input type="number" id="propStrokeWidth" min="0" max="20" step="0.5">
                <label>그림자 흐림</label>
                <input type="number" id="propShadowBlur" min="0" max="50">
                <label>그림자 색</label>
                <input type="color" id="propShadowColor">
            </div>
        </div>
    </div>

    <script>
        // ==================== 유틸리티 ====================
        function timeToSeconds(str) {
            const parts = str.split(':');
            if (parts.length === 3) {
                const [h, m, s] = parts;
                const [sec, ms] = s.split(',');
                return parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(sec) + (parseInt(ms || 0) / 1000);
            }
            return 0;
        }

        function parseSRT(content) {
            const blocks = content.trim().split(/\n\s*\n/);
            const subs = [];
            blocks.forEach((block, idx) => {
                const lines = block.trim().split('\n');
                if (lines.length < 2) return;
                const timeLineIndex = lines.findIndex(l => l.includes('-->'));
                if (timeLineIndex === -1) return;
                const timeLine = lines[timeLineIndex];
                const [startStr, endStr] = timeLine.split('-->').map(s => s.trim());
                const start = timeToSeconds(startStr);
                const end = timeToSeconds(endStr);
                // 텍스트는 timeLine 이후의 모든 줄
                const textLines = lines.slice(timeLineIndex + 1);
                // SRT 태그 제거 ({\an8}, {\pos(...)} 등)
                const text = textLines.join('\n')
                    .replace(/\{\\.*?\}/g, '')
                    .replace(/<[^>]*>/g, '')
                    .trim();
                subs.push({
                    id: idx,
                    start,
                    end,
                    text,
                    props: { ...defaultProps }
                });
            });
            return subs;
        }

        function easeOutBounce(p) {
            if (p < 1 / 2.75) return 7.5625 * p * p;
            if (p < 2 / 2.75) return 7.5625 * (p -= 1.5 / 2.75) * p + 0.75;
            if (p < 2.5 / 2.75) return 7.5625 * (p -= 2.25 / 2.75) * p + 0.9375;
            return 7.5625 * (p -= 2.625 / 2.75) * p + 0.984375;
        }

        function easeOutElastic(p) {
            if (p === 0 || p === 1) return p;
            return Math.pow(2, -10 * p) * Math.sin((p - 0.075) * (2 * Math.PI) / 0.3) + 1;
        }

        function easeInBack(p) {
            return p * p * (2.70158 * p - 1.70158);
        }

        function easeOutBack(p) {
            return 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2);
        }

        function easeInOutCubic(p) {
            return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        }

        function easeInOutBack(p) {
            const c1 = 1.70158;
            const c2 = c1 * 1.525;
            return p < 0.5
                ? (Math.pow(2 * p, 2) * ((c2 + 1) * 2 * p - c2)) / 2
                : (Math.pow(2 * p - 2, 2) * ((c2 + 1) * (p * 2 - 2) + c2) + 2) / 2;
        }

        function easeOutQuart(p) {
            return 1 - Math.pow(1 - p, 4);
        }

        function easeInQuart(p) {
            return p * p * p * p;
        }

        function lerp(a, b, t) { return a + (b - a) * t; }

        // ==================== 기본 속성 ====================
        const defaultProps = {
            x: 640, y: 360,
            scale: 1,
            rotation: 0,
            skewX: 0, skewY: 0,
            fontFamily: 'Arial',
            fontSize: 60,
            color: '#ffffff',
            strokeColor: '#000000',
            strokeWidth: 0,
            shadowBlur: 0,
            shadowColor: '#000000',
            enterDur: 0.5,
            exitDur: 0.5,
            animationPreset: 'fadeIn',
            perChar: true, // 기본은 글자 단위
            holdMotion: 'none' // 'none', 'float', 'pulse', 'wave', 'shake', 'spin', 'bounce'
        };

        // ==================== 프리셋 정의 ====================
        // 각 프리셋은 mode: 'whole' 또는 'char'
        // char 모드에서는 enter/hold/exit 함수가 (t, p, index, count, char) 형태
        // 반환값: { x, y, scale, rotation, skewX, skewY, opacity, blur, letterSpacing }
        const presets = [
            // ===== 기존 기본 프리셋 (whole 모드) =====
            { id: 'fadeIn', name: '1. 페이드 인/아웃', mode: 'whole',
                enter: (t, p) => { t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.opacity = 1 - p; } },
            { id: 'slideUp', name: '2. 위로 슬라이드', mode: 'whole',
                enter: (t, p) => { t.y = (1 - p) * -100; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.y = p * 100; t.opacity = 1 - p; } },
            { id: 'slideDown', name: '3. 아래로 슬라이드', mode: 'whole',
                enter: (t, p) => { t.y = (1 - p) * 100; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.y = p * -100; t.opacity = 1 - p; } },
            { id: 'slideLeft', name: '4. 왼쪽 슬라이드', mode: 'whole',
                enter: (t, p) => { t.x = (1 - p) * -150; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.x = p * -150; t.opacity = 1 - p; } },
            { id: 'slideRight', name: '5. 오른쪽 슬라이드', mode: 'whole',
                enter: (t, p) => { t.x = (1 - p) * 150; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.x = p * 150; t.opacity = 1 - p; } },
            { id: 'zoomIn', name: '6. 줌 인', mode: 'whole',
                enter: (t, p) => { t.scale = 0.2 + 0.8 * p; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.scale = 1 + 0.5 * p; t.opacity = 1 - p; } },
            { id: 'zoomOut', name: '7. 줌 아웃', mode: 'whole',
                enter: (t, p) => { t.scale = 2 - p; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.scale = 1 - 0.5 * p; t.opacity = 1 - p; } },
            { id: 'rotateIn', name: '8. 회전 인', mode: 'whole',
                enter: (t, p) => { t.rotation = (1 - p) * 360; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.rotation = p * 360; t.opacity = 1 - p; } },
            { id: 'rotateOut', name: '9. 회전 아웃', mode: 'whole',
                enter: (t, p) => { t.rotation = - (1 - p) * 360; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.rotation = - p * 360; t.opacity = 1 - p; } },
            { id: 'blurIn', name: '10. 블러 인', mode: 'whole',
                enter: (t, p) => { t.blur = (1 - p) * 10; t.opacity = p; },
                hold: (t, time) => {},
                exit: (t, p) => { t.blur = p * 10; t.opacity = 1 - p; } },

            // ===== 키네틱 타이포그래피 (char 모드) =====
            { id: 'kineticTypewriter', name: '11. 글자별 타이핑', mode: 'char',
                enter: (t, p, i, count) => {
                    const charProgress = Math.max(0, Math.min(1, p * count - i));
                    t.opacity = charProgress > 0 ? 1 : 0;
                    if (charProgress > 0) t.scale = 0.5 + 0.5 * charProgress;
                    return t;
                },
                hold: (t, time, i) => {
                    t.opacity = 1;
                    return t;
                },
                exit: (t, p, i, count) => {
                    const charProgress = Math.max(0, Math.min(1, p * count - i));
                    t.opacity = 1 - charProgress;
                    return t;
                } },
            { id: 'kineticWave', name: '12. 파도 웨이브', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.05;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    t.y = Math.sin(progress * Math.PI * 4) * 30 * (1 - progress);
                    t.opacity = progress;
                    t.rotation = Math.sin(progress * Math.PI * 6) * 20 * (1 - progress);
                    return t;
                },
                hold: (t, time, i) => {
                    const phase = time * 5 + i * 0.5;
                    t.y = Math.sin(phase) * 8;
                    t.rotation = Math.sin(phase * 1.3) * 3;
                    return t;
                },
                exit: (t, p, i, count) => {
                    const delay = i * 0.03;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    t.y = Math.sin(progress * Math.PI * 4) * 30 * progress;
                    t.opacity = 1 - progress;
                    return t;
                } },
            { id: 'kineticBounceLetters', name: '13. 글자별 바운스', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.03;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    const bounce = easeOutBounce(progress);
                    t.y = (1 - bounce) * -80;
                    t.scale = 0.5 + 0.5 * bounce;
                    t.opacity = progress > 0 ? 1 : 0;
                    return t;
                },
                hold: (t, time, i) => {
                    t.y = Math.sin(time * 6 + i) * 5;
                    return t;
                },
                exit: (t, p, i, count) => {
                    const progress = Math.max(0, Math.min(1, p));
                    t.y = progress * -60;
                    t.opacity = 1 - progress;
                    return t;
                } },
            { id: 'kineticSpinIn', name: '14. 글자별 회전 인', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.04;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    t.rotation = (1 - progress) * 720;
                    t.scale = 0.3 + 0.7 * progress;
                    t.opacity = progress;
                    return t;
                },
                hold: (t, time, i) => {
                    t.rotation = Math.sin(time * 2 + i) * 5;
                    return t;
                },
                exit: (t, p, i, count) => {
                    const progress = Math.max(0, Math.min(1, p));
                    t.rotation = progress * 720;
                    t.opacity = 1 - progress;
                    return t;
                } },
            { id: 'kineticFlyInLeft', name: '15. 왼쪽에서 플라이 인', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.02;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    t.x = (1 - progress) * -400;
                    t.opacity = progress;
                    t.rotation = (1 - progress) * -30;
                    return t;
                },
                hold: (t, time, i) => {
                    t.x = Math.sin(time * 3 + i) * 5;
                    return t;
                },
                exit: (t, p, i, count) => {
                    t.x = p * -400;
                    t.opacity = 1 - p;
                    return t;
                } },
            { id: 'kineticFlyInRight', name: '16. 오른쪽에서 플라이 인', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.02;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    t.x = (1 - progress) * 400;
                    t.opacity = progress;
                    t.rotation = (1 - progress) * 30;
                    return t;
                },
                hold: (t, time, i) => {
                    t.x = Math.sin(time * 3 + i) * 5;
                    return t;
                },
                exit: (t, p, i, count) => {
                    t.x = p * 400;
                    t.opacity = 1 - p;
                    return t;
                } },
            { id: 'kineticDrop', name: '17. 드롭 인 (바운스)', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.01;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    const bounce = easeOutBounce(progress);
                    t.y = (1 - bounce) * -300;
                    t.scale = 0.5 + 0.5 * bounce;
                    t.opacity = progress > 0 ? 1 : 0;
                    return t;
                },
                hold: (t, time, i) => {
                    t.y = Math.sin(time * 4 + i) * 4;
                    return t;
                },
                exit: (t, p, i, count) => {
                    t.y = p * -300;
                    t.opacity = 1 - p;
                    return t;
                } },
            { id: 'kineticElastic', name: '18. 탄성 인 (글자별)', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.03;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    const elastic = easeOutElastic(progress);
                    t.scale = elastic;
                    t.opacity = progress > 0 ? 1 : 0;
                    return t;
                },
                hold: (t, time, i) => {
                    t.scale = 1 + Math.sin(time * 5 + i) * 0.05;
                    return t;
                },
                exit: (t, p, i, count) => {
                    t.scale = 1 + p * 0.5;
                    t.opacity = 1 - p;
                    return t;
                } },
            { id: 'kineticTwist', name: '19. 꼬임 회전', mode: 'char',
                enter: (t, p, i, count) => {
                    const delay = i * 0.04;
                    const progress = Math.max(0, Math.min(1, p - delay));
                    t.rotation = (1 - progress) * 1080;
                    t.skewX = (1 - progress) * 30;
                    t.opacity = progress;
                    return t;
                },
                hold: (t, time, i) => {
                    t.rotation = Math.sin(time * 4 + i) * 10;
                    return t;
                },
                exit: (t, p, i, count) => {
                    t.rotation = p * 1080;
                    t.skewX = p * 30;
                    t.opacity = 1 - p;
                    return t;

        populateFontSelect(document.getElementById('fontFamily'));

        // 프리셋 셀렉트 채우기
        function populatePresetSelect(select) {
            select.innerHTML = '';
            presets.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name;
                select.appendChild(opt);
            });
        }
        populatePresetSelect(globalPreset);
        populatePresetSelect(linePreset);

        // ==================== SRT 로딩 ====================
        document.getElementById('srtFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                subtitles = parseSRT(ev.target.result);
                selectedCueIndex = -1;
                updateSubtitleList();
                updateTimelineRange();
                currentTime = 0;
                render();
            };
            reader.readAsText(file);
        });

        document.getElementById('loadSample').addEventListener('click', function() {
            const sample = `1
00:00:00,000 --> 00:00:02,000
안녕하세요!

2
00:00:02,500 --> 00:00:05,000
타이포그래픽 모션

3
00:00:05,500 --> 00:00:08,000
SRT 자막을 로드했습니다.

4
00:00:08,500 --> 00:00:12,000
애프터이펙트 스타일

5
00:00:12,500 --> 00:00:16,000
다빈치 리졸브 스타일

6
00:00:16,500 --> 00:00:20,000
캡컷 스타일
`;
            subtitles = parseSRT(sample);
            selectedCueIndex = -1;
            updateSubtitleList();
            updateTimelineRange();
            currentTime = 0;
            render();
        });

        // ==================== 오디오 ====================
        document.getElementById('audioFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const audio = document.getElementById('audio');
            audio.src = URL.createObjectURL(file);
            audio.load();
            if (audioCtx) {
                audioCtx.close().catch(() => {});
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioSource = audioCtx.createMediaElementSource(audio);
            audioDest = audioCtx.createMediaStreamDestination();
            audioSource.connect(audioDest);
            audioSource.connect(audioCtx.destination);
        });

        // ==================== 자막 목록 UI ====================
        function updateSubtitleList() {
            subtitleList.innerHTML = '';
            subtitles.forEach((sub, idx) => {
                const div = document.createElement('div');
                div.className = 'subtitle-item' + (idx === selectedCueIndex ? ' selected' : '');
                div.innerHTML = `<div>${sub.text}</div><div class="time">${sub.start.toFixed(2)}s - ${sub.end.toFixed(2)}s</div>`;
                div.addEventListener('click', () => {
                    selectedCueIndex = idx;
                    updateSubtitleList();
                    updatePropertyEditor();
                    render();
                });
                subtitleList.appendChild(div);
            });
        }

        // ==================== 속성 편집기 ====================
        const propInputs = {
            x: document.getElementById('propX'),
            y: document.getElementById('propY'),
            scale: document.getElementById('propScale'),
            rotation: document.getElementById('propRotation'),
            skewX: document.getElementById('propSkewX'),
            skewY: document.getElementById('propSkewY'),
            enterDur: document.getElementById('propEnterDur'),
            exitDur: document.getElementById('propExitDur'),
            fontSize: document.getElementById('propFontSize'),
            color: document.getElementById('propColor'),
            strokeColor: document.getElementById('propStrokeColor'),
            strokeWidth: document.getElementById('propStrokeWidth'),
            shadowBlur: document.getElementById('propShadowBlur'),
            shadowColor: document.getElementById('propShadowColor')
        };

        function updatePropertyEditor() {
            if (selectedCueIndex < 0 || selectedCueIndex >= subtitles.length) {
                document.getElementById('selectedText').textContent = '자막을 선택하세요';
                return;
            }
            const sub = subtitles[selectedCueIndex];
            document.getElementById('selectedText').textContent = sub.text;
            linePreset.value = sub.props.animationPreset;
            propFontFamily.value = sub.props.fontFamily;
            propInputs.x.value = sub.props.x;
            propInputs.y.value = sub.props.y;
            propInputs.scale.value = sub.props.scale;
            propInputs.rotation.value = sub.props.rotation;
            propInputs.skewX.value = sub.props.skewX;
            propInputs.skewY.value = sub.props.skewY;
            propInputs.enterDur.value = sub.props.enterDur;
            propInputs.exitDur.value = sub.props.exitDur;
            propInputs.fontSize.value = sub.props.fontSize;
            propInputs.color.value = sub.props.color;
            propInputs.strokeColor.value = sub.props.strokeColor;
            propInputs.strokeWidth.value = sub.props.strokeWidth;
            propInputs.shadowBlur.value = sub.props.shadowBlur;
            propInputs.shadowColor.value = sub.props.shadowColor;
        }

        function updateSelectedCue() {
            if (selectedCueIndex < 0 || selectedCueIndex >= subtitles.length) return;
            const sub = subtitles[selectedCueIndex];
            sub.props.animationPreset = linePreset.value;
            sub.props.fontFamily = propFontFamily.value;
            sub.props.x = parseFloat(propInputs.x.value) || 0;
            sub.props.y = parseFloat(propInputs.y.value) || 0;
            sub.props.scale = parseFloat(propInputs.scale.value) || 1;
            sub.props.rotation = parseFloat(propInputs.rotation.value) || 0;
            sub.props.skewX = parseFloat(propInputs.skewX.value) || 0;
            sub.props.skewY = parseFloat(propInputs.skewY.value) || 0;
            sub.props.enterDur = parseFloat(propInputs.enterDur.value) || 0;
            sub.props.exitDur = parseFloat(propInputs.exitDur.value) || 0;
            sub.props.fontSize = parseFloat(propInputs.fontSize.value) || 60;
            sub.props.color = propInputs.color.value;
            sub.props.strokeColor = propInputs.strokeColor.value;
            sub.props.strokeWidth = parseFloat(propInputs.strokeWidth.value) || 0;
            sub.props.shadowBlur = parseFloat(propInputs.shadowBlur.value) || 0;
            sub.props.shadowColor = propInputs.shadowColor.value;
            updateSubtitleList();
            render();
        }

        Object.values(propInputs).forEach(input => input.addEventListener('input', updateSelectedCue));
        linePreset.addEventListener('change', updateSelectedCue);
        propFontFamily.addEventListener('change', updateSelectedCue);

        document.getElementById('applyGlobalPreset').addEventListener('click', () => {
            const preset = globalPreset.value;
            subtitles.forEach(sub => sub.props.animationPreset = preset);
            if (selectedCueIndex >= 0) updatePropertyEditor();
            render();
        });

        // ==================== 타임라인 ====================
        function updateTimelineRange() {
            const maxTime = Math.max(0, ...subtitles.map(s => s.end), 10);
            timeline.max = maxTime;
            timeline.value = currentTime;
            updateTimeDisplay();
        }

        function updateTimeDisplay() {
            const max = parseFloat(timeline.max) || 0;
            timeDisplay.textContent = `${currentTime.toFixed(2)} / ${max.toFixed(2)}`;
        }

        timeline.addEventListener('input', () => {
            currentTime = parseFloat(timeline.value);
            updateTimeDisplay();
            render();
        });

        // ==================== 재생 제어 ====================
        document.getElementById('playBtn').addEventListener('click', () => {
            if (isRecording) return;
            if (subtitles.length === 0) return;
            isPlaying = true;
            if (audioCtx && document.getElementById('audio').src) {
                audioCtx.resume();
                const audio = document.getElementById('audio');
                audio.currentTime = currentTime;
                audio.play();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            isPlaying = false;
            isRecording = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            const audio = document.getElementById('audio');
            audio.pause();
            if (audioCtx) audioCtx.suspend();
        });

        // ==================== 렌더링 ====================
        function drawCharacter(ctx, char, x, y, transform) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, transform.opacity ?? 1));
            ctx.translate(x + (transform.x || 0), y + (transform.y || 0));
            if (transform.skewX || transform.skewY) {
                ctx.transform(1, Math.tan(transform.skewY * Math.PI / 180), Math.tan(transform.skewX * Math.PI / 180), 1, 0, 0);
            }
            ctx.rotate((transform.rotation || 0) * Math.PI / 180);
            ctx.scale(transform.scale || 1, transform.scale || 1);
            if (transform.blur > 0 && typeof ctx.filter !== 'undefined') {
                ctx.filter = `blur(${transform.blur}px)`;
            }
            ctx.font = transform.font;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = transform.strokeWidth || 0;
            ctx.strokeStyle = transform.strokeColor || '#000';
            ctx.fillStyle = transform.color || '#fff';
            if (transform.shadowBlur > 0) {
                ctx.shadowBlur = transform.shadowBlur;
                ctx.shadowColor = transform.shadowColor;
            }
            ctx.fillText(char, 0, 0);
            if (ctx.lineWidth > 0) ctx.strokeText(char, 0, 0);
            ctx.restore();
            ctx.filter = 'none';
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (const cue of subtitles) {
                if (currentTime >= cue.start && currentTime <= cue.end) {
                    const local = currentTime - cue.start;
                    const dur = cue.end - cue.start;
                    const props = cue.props;
                    const enterDur = Math.min(props.enterDur, dur / 2) || 0.1;
                    const exitDur = Math.min(props.exitDur, dur / 2) || 0.1;
                    let phase = 'hold';
                    let p = 0;
                    if (local < enterDur) {
                        phase = 'enter';
                        p = local / enterDur;
                    } else if (local > dur - exitDur) {
                        phase = 'exit';
                        p = (local - (dur - exitDur)) / exitDur;
                    }

                    const preset = presets.find(pr => pr.id === props.animationPreset) || presets[0];

                    // 글자 단위 모드 여부
                    if (preset.mode === 'char') {
                        const chars = cue.text.split('');
                        const charCount = chars.length;
                        // 전체 텍스트 폭 측정
                        ctx.font = `${props.fontSize}px ${props.fontFamily}`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const totalWidth = ctx.measureText(cue.text).width;
                        const startX = props.x - totalWidth / 2;
                        let currentX = startX;

                        for (let i = 0; i < charCount; i++) {
                            const char = chars[i];
                            const charWidth = ctx.measureText(char).width;
                            const charCenterX = currentX + charWidth / 2;
                            const charCenterY = props.y;

                            const charTransform = {
                                x: 0, y: 0, scale: 1, rotation: 0,
                                skewX: 0, skewY: 0, opacity: 1,
                                blur: 0, letterSpacing: 0,
                                font: `${props.fontSize}px ${props.fontFamily}`,
                                color: props.color,
                                strokeColor: props.strokeColor,
                                strokeWidth: props.strokeWidth,
                                shadowBlur: props.shadowBlur,
                                shadowColor: props.shadowColor
                            };

                            // 프리셋 적용
                            if (phase === 'enter') {
                                preset.enter(charTransform, p, i, charCount);
                            } else if (phase === 'exit') {
                                preset.exit(charTransform, p, i, charCount);
                            } else {
                                if (preset.hold) preset.hold(charTransform, local, i, charCount);
                            }

                            // 기본 속성 (위치, 회전 등) 적용
                            charTransform.x += props.x - charCenterX;
                            charTransform.y += props.y - charCenterY;
                            charTransform.rotation += props.rotation;
                            charTransform.skewX += props.skewX;
                            charTransform.skewY += props.skewY;
                            charTransform.scale *= props.scale;

                            drawCharacter(ctx, char, charCenterX, charCenterY, charTransform);
                            currentX += charWidth;
                        }
                    } else {
                        // 기존 whole 모드
                        const wholeTransform = {
                            x: 0, y: 0, scale: 1, rotation: 0,
                            skewX: 0, skewY: 0, opacity: 1,
                            blur: 0, letterSpacing: 0,
                            font: `${props.fontSize}px ${props.fontFamily}`,
                            color: props.color,
                            strokeColor: props.strokeColor,
                            strokeWidth: props.strokeWidth,
                            shadowBlur: props.shadowBlur,
                            shadowColor: props.shadowColor
                        };

                        if (phase === 'enter') {
                            preset.enter(wholeTransform, p);
                        } else if (phase === 'exit') {
                            preset.exit(wholeTransform, p);
                        } else {
                            if (preset.hold) preset.hold(wholeTransform, local);
                        }

                        ctx.save();
                        ctx.globalAlpha = Math.max(0, Math.min(1, wholeTransform.opacity ?? 1));
                        ctx.translate(props.x + (wholeTransform.x || 0), props.y + (wholeTransform.y || 0));
                        if (wholeTransform.skewX || wholeTransform.skewY) {
                            ctx.transform(1, Math.tan(wholeTransform.skewY * Math.PI / 180), Math.tan(wholeTransform.skewX * Math.PI / 180), 1, 0, 0);
                        }
                        ctx.rotate((props.rotation + (wholeTransform.rotation || 0)) * Math.PI / 180);
                        ctx.scale(props.scale * (wholeTransform.scale || 1), props.scale * (wholeTransform.scale || 1));
                        if (wholeTransform.blur > 0 && typeof ctx.filter !== 'undefined') {
                            ctx.filter = `blur(${wholeTransform.blur}px)`;
                        }
                        ctx.font = `${props.fontSize}px ${props.fontFamily}`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.lineWidth = props.strokeWidth;
                        ctx.strokeStyle = props.strokeColor;
                        ctx.fillStyle = props.color;
                        if (props.shadowBlur > 0) {
                            ctx.shadowBlur = props.shadowBlur;
                            ctx.shadowColor = props.shadowColor;
                        }
                        ctx.fillText(cue.text, 0, 0);
                        if (props.strokeWidth > 0) ctx.strokeText(cue.text, 0, 0);
                        ctx.restore();
                        ctx.filter = 'none';
                    }
                }
            }
            updateTimeDisplay();
        }

        // ==================== 애니메이션 루프 ====================
        let lastFrameTime = performance.now();
        function animationLoop(now) {
            const dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            if (isPlaying && !isRecording) {
                currentTime += dt;
                const max = parseFloat(timeline.max);
                if (currentTime >= max) {
                    currentTime = max;
                    isPlaying = false;
                    const audio = document.getElementById('audio');
                    audio.pause();
                    if (audioCtx) audioCtx.suspend();
                }
                timeline.value = currentTime;
                render();
            }

            if (isRecording) {
                currentTime += dt;
                const endTime = parseFloat(document.getElementById('exportDuration').value);
                if (currentTime >= endTime) {
                    currentTime = endTime;
                    render();
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                    isRecording = false;
                    isPlaying = false;
                    const audio = document.getElementById('audio');
                    audio.pause();
                    if (audioCtx) audioCtx.suspend();
                } else {
                    timeline.value = currentTime;
                    render();
                }
            }

            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);

        // ==================== 내보내기 ====================
        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=avc1.42E01E',
                'video/mp4',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            for (const t of types) {
                if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
            }
            return 'video/webm';
        }

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (isRecording) return;
            if (subtitles.length === 0) { alert('SRT 자막을 먼저 로드하세요.'); return; }
            const endTime = parseFloat(document.getElementById('exportDuration').value);
            if (isNaN(endTime) || endTime <= 0) { alert('내보낼 시간을 올바르게 입력하세요.'); return; }

            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

            currentTime = 0;
            timeline.value = 0;
            isPlaying = true;
            isRecording = true;
            recordedChunks = [];

            const canvasStream = canvas.captureStream(60);
            let combinedStream = canvasStream;
            if (audioDest && audioDest.stream.getAudioTracks().length > 0) {
                combinedStream = new MediaStream();
                canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
                audioDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
            }

            const mimeType = getSupportedMimeType();
            mediaRecorder = new MediaRecorder(combinedStream, {
                mimeType,
                videoBitsPerSecond: 8_000_000
            });

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.getElementById('downloadLink');
                a.href = url;
                a.download = `typography_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
                a.click();
                URL.revokeObjectURL(url);
                isRecording = false;
                isPlaying = false;
            };

            mediaRecorder.start(1000);

            const audio = document.getElementById('audio');
            if (audio.src && audioCtx) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        });

        // 초기화
        updateSubtitleList();
        updateTimelineRange();
        render();
    </script>
</body>
</html>
