<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Music Visualizer - DDR Style</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            background-color: #1e1e2f; /* 어두운 배경 */
            color: white;
        }
        #controls {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #3a3a5a;
            border-radius: 8px;
        }
        canvas {
            border: 2px solid #6c7bc1;
            background-color: #000000; /* 비주얼라이저 배경 */
        }
    </style>
</head>
<body>
    <h1>🎧 음악 리듬 시각화 (DDR Style)</h1>

    <div id="controls">
        <!-- 1. 오디오 파일 로딩을 위한 입력 필드 -->
        <input type="file" id="audioFile" accept="audio/*">
        <button id="startButton">분석 시작</button>
        <p id="statusMessage">음악 파일을 불러와 버튼을 누르세요.</p>
    </div>

    <!-- 2. 노트가 그려질 캔버스 -->
    <canvas id="visualizerCanvas"></canvas>

    <!-- 3. 핵심 로직 파일 링크 -->
    <script src="gemma_script.js"></script>
</body>
</html>
