<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음악 리듬 시각화 (DDR Style)</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background-color: #1e1e2f; /* 어두운 배경 */
            color: white;
            padding: 30px 10px;
        }
        #controls {
            margin-bottom: 30px;
            padding: 25px;
            background-color: #3a3a5a;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
        #audioFileLabel {
            margin-bottom: 15px;
            font-size: 1.3em;
            color: #b0c4de; /* 은은한 색상 */
        }
        canvas {
            border: 4px solid #6c7bc1;
            background-color: #000000; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            width: 90%; /* 반응형 개선 */
            max-width: 1000px;
        }
    </style>
</head>
<body>
    <h1>🎧 음악 리듬 시각화 (DDR Style)</h1>

    <div id="controls">
        <label for="audioFileLabel" id="audioFileLabel">🎵 파일 선택:</label><br>
        <input type="file" id="audioFile" accept="audio/*" style="margin-right: 15px;">
        <button id="startButton" style="padding: 12px 30px; background-color: #8a2be2; border: none; cursor: pointer; color: white; font-weight: bold; border-radius: 6px;">분석 시작</button>
        <p id="statusMessage" style="margin-top: 15px; font-size: 0.9em;"></p>
    </div>

    <!-- 캔버스 영역 -->
    <canvas id="visualizerCanvas"></canvas>

    <!-- 핵심 로직 파일 링크 (script.js가 이 모든 것을 처리합니다) -->
    <script src="Gemma_script.js"></script>
</body>
</html>
