<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRT GENERATOR LAB — Sync Maker</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0c;
  --panel:#121218;
  --accent:#00ffcc;
  --border:rgba(255,255,255,0.1);
  --text:#e0e0e0;
}
body{
  background:var(--bg); color:var(--text);
  font-family:'Pretendard', sans-serif;
  height:100vh; display: flex; flex-direction: column;
}

/* UI STRUCTURE */
.topbar{
  padding:15px 20px; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.logo{letter-spacing:3px; color:var(--accent); font-weight:bold; font-size:14px;}

.container { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; gap: 2px; background: var(--border); }

.side-panel {
  background: var(--panel);
  display: flex; flex-direction: column; padding: 20px; overflow-y: auto;
}

h3 { font-size: 11px; letter-spacing: 2px; color: #666; margin-bottom: 15px; text-transform: uppercase; }

/* INPUTS */
textarea { 
  flex: 1; background: #000; color: var(--text); border: 1px solid var(--border); 
  padding: 15px; font-family: inherit; font-size: 13px; line-height: 1.8; resize: none; outline: none;
}
#srtOutput { background: #050505; color: var(--accent); font-family: monospace; }

/* CONTROLS */
.player-box {
  padding: 20px; background: #000; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 15px;
}
.progress-bar { width: 100%; height: 6px; background: #222; cursor: pointer; position: relative; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; pointer-events: none; }

/* 새로 추가된 마커 스타일 */
.marker {
  position: absolute;
  top: -5px;
  width: 10px;
  height: 16px;
  background: #ff2a6d;
  border: 1px solid #fff;
  cursor: ew-resize;
  z-index: 10;
  transform: translateX(-50%);
  border-radius: 2px;
}
.marker.end-marker {
  background: var(--accent);
}
.marker:hover { transform: translateX(-50%) scale(1.2); z-index: 11; }

.btns { display: flex; gap: 10px; align-items: center; }
.btn { 
  background: transparent; border: 1px solid var(--border); color: #fff; 
  padding: 12px 20px; cursor: pointer; font-size: 12px; font-weight: bold; flex: 1;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.sync { background: var(--accent); color: #000; border: none; font-size: 14px; }
.btn.sync:active { transform: scale(0.98); opacity: 0.8; }

#timeDisplay { font-family: monospace; color: var(--accent); font-size: 18px; width: 120px; text-align: center; }

.instruction { font-size: 11px; color: #666; line-height: 1.6; margin-top: 10px; }
mark { background: var(--accent); color: #000; padding: 0 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">SRT SYNC GENERATOR</div>
  <div style="font-size:10px; opacity: 0.5;">MAKE YOUR LYRIC TIMELINE</div>
</div>

<div class="container">
  <div class="side-panel">
    <h3>1. 가사 입력 (한 줄에 한 문장)</h3>
    <textarea id="lyricInput" placeholder="노래 가사를 여기에 복사해서 붙여넣으세요.&#10;엔터로 줄바꿈된 한 줄이 하나의 자막 단위가 됩니다."></textarea>
    <div class="instruction">
      * <mark>SPACE</mark>를 누를 때마다 현재 가사의 시작 시간이 기록됩니다.<br>
      * 마지막 가사 싱크 후 <b>SPACE를 한 번 더 누르면</b> 마지막 자막이 종료됩니다.<br>
      * 완료 후 하단 <b>슬라이더의 마커를 드래그</b>하여 미세조정할 수 있습니다.
    </div>
  </div>

  <div class="side-panel">
    <h3>2. 생성된 SRT 결과</h3>
    <textarea id="srtOutput" readonly placeholder="싱크 작업이 시작되면 여기에 SRT 코드가 나타납니다."></textarea>
    <button class="btn" style="margin-top:10px;" onclick="downloadSRT()">SRT 파일로 저장</button>
  </div>
</div>

<div class="player-box">
  <div class="progress-bar" id="progressBar" onclick="seek(event)">
    <div class="progress-fill" id="progFill"></div>
    <!-- 마커들이 여기에 동적으로 생성됩니다 -->
  </div>
  
  <div class="btns">
    <button class="btn" id="loadBtn" onclick="document.getElementById('audioFile').click()">파일 불러오기</button>
    <input type="file" id="audioFile" accept="audio/*" style="display:none" onchange="loadAudio(this.files)">
    
    <div id="timeDisplay">00:00:00</div>
    
    <button class="btn" onclick="togglePlay()" id="playBtn">PLAY</button>
    <button class="btn sync" id="syncBtn" onclick="markSync()">SYNC (SPACE)</button>
  </div>
</div>

<script>
let audio = new Audio();
let lyrics = [];
let srtResults = [];
let currentLineIdx = 0;

function loadAudio(files) {
  const url = URL.createObjectURL(files[0]);
  audio.src = url;
  document.getElementById('loadBtn').textContent = files[0].name;
  clearWork();
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    document.getElementById('playBtn').textContent = "PAUSE";
    if (srtResults.length === 0) {
      lyrics = document.getElementById('lyricInput').value.split('\n').filter(l => l.trim() !== "");
      currentLineIdx = 0;
    }
  } else {
    audio.pause();
    document.getElementById('playBtn').textContent = "PLAY";
  }
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.floor((seconds % 1) * 1000);
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')},${String(ms).padStart(3, '0')}`;
}

// "00:00:10,500" 형식을 다시 초(seconds)로 변환
function timeToSeconds(timeStr) {
  const parts = timeStr.split(',');
  const hms = parts[0].split(':');
  const sec = parseInt(hms[0], 10) * 3600 + parseInt(hms[1], 10) * 60 + parseInt(hms[2], 10);
  const ms = parseInt(parts[1], 10) / 1000;
  return sec + ms;
}

function markSync() {
  if (audio.paused) return;
  const currentTime = audio.currentTime;
  
  // 1. 가사를 모두 입력한 뒤, 마지막 자막의 끝나는 시간을 설정하는 처리
  if (currentLineIdx === lyrics.length) {
    if (srtResults.length > 0) {
      srtResults[srtResults.length - 1].end = formatTime(currentTime);
      updateSRTDisplay();
      renderMarkers();
    }
    currentLineIdx++; // 더 이상 실행되지 않도록 인덱스 증가
    audio.pause();
    document.getElementById('playBtn').textContent = "PLAY";
    return;
  }

  // 이미 마지막 종료 마커까지 다 찍은 상태라면 무시
  if (currentLineIdx > lyrics.length) return; 

  // 2. 가사 싱크 입력 처리
  if (currentLineIdx > 0) {
    srtResults[currentLineIdx - 1].end = formatTime(currentTime - 0.001);
  }

  srtResults.push({
    index: currentLineIdx + 1,
    start: formatTime(currentTime),
    end: formatTime(currentTime + 2), 
    text: lyrics[currentLineIdx]
  });

  currentLineIdx++;
  updateSRTDisplay();
  renderMarkers();
}

function updateSRTDisplay() {
  let srtText = "";
  srtResults.forEach(item => {
    srtText += `${item.index}\n${item.start} --> ${item.end}\n${item.text}\n\n`;
  });
  document.getElementById('srtOutput').value = srtText;
  document.getElementById('srtOutput').scrollTop = document.getElementById('srtOutput').scrollHeight;
}

// 오디오 진행상태
audio.ontimeupdate = () => {
  const p = (audio.currentTime / audio.duration) * 100;
  document.getElementById('progFill').style.width = p + "%";
  document.getElementById('timeDisplay').textContent = formatTime(audio.currentTime).split(',')[0];
};

function seek(e) {
  if (isDraggingMarker) return; // 마커 드래그 중에는 탐색 방지
  const rect = e.target.getBoundingClientRect();
  const p = (e.clientX - rect.left) / rect.width;
  audio.currentTime = p * audio.duration;
}

// 단축키 (스페이스바)
window.addEventListener('keydown', (e) => {
  if (e.code === "Space") {
    if (document.activeElement.tagName !== "TEXTAREA") {
      e.preventDefault();
      markSync();
    }
  }
});

function clearWork() {
  srtResults = [];
  currentLineIdx = 0;
  document.getElementById('srtOutput').value = "";
  renderMarkers();
}

/* ================================
   마커 드래그 시스템 (미세 조정 기능)
=================================== */
let isDraggingMarker = false;
let dragIndex = -1;
let isDraggingEndMarker = false;

function renderMarkers() {
  const bar = document.getElementById('progressBar');
  // 기존 마커 삭제
  bar.querySelectorAll('.marker').forEach(m => m.remove());
  if (!audio.duration) return;

  // 시작 마커들 렌더링
  srtResults.forEach((item, i) => {
    let p = (timeToSeconds(item.start) / audio.duration) * 100;
    let marker = document.createElement('div');
    marker.className = 'marker';
    marker.style.left = p + '%';
    marker.title = `자막 ${item.index} 조절`;

    marker.onmousedown = (e) => {
      e.stopPropagation();
      isDraggingMarker = true;
      dragIndex = i;
      isDraggingEndMarker = false;
    };
    bar.appendChild(marker);
  });

  // 최종 종료 마커 렌더링 (마지막 스페이스바를 누른 후)
  if (srtResults.length > 0 && currentLineIdx > lyrics.length) {
    let lastItem = srtResults[srtResults.length - 1];
    let p = (timeToSeconds(lastItem.end) / audio.duration) * 100;
    let endMarker = document.createElement('div');
    endMarker.className = 'marker end-marker';
    endMarker.style.left = p + '%';
    endMarker.title = `최종 종료 시간 조절`;

    endMarker.onmousedown = (e) => {
      e.stopPropagation();
      isDraggingMarker = true;
      dragIndex = srtResults.length - 1;
      isDraggingEndMarker = true;
    };
    bar.appendChild(endMarker);
  }
}

window.addEventListener('mousemove', (e) => {
  if (!isDraggingMarker || !audio.duration) return;
  
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  let p = (e.clientX - rect.left) / rect.width;
  p = Math.max(0, Math.min(1, p));
  let newTime = p * audio.duration;

  // 마커가 순서를 엇갈리지 않도록 최소/최대 시간 제한 (Clamping)
  let minTime = 0;
  let maxTime = audio.duration;

  if (isDraggingEndMarker) {
    minTime = timeToSeconds(srtResults[dragIndex].start);
  } else {
    if (dragIndex > 0) minTime = timeToSeconds(srtResults[dragIndex - 1].start);
    if (dragIndex < srtResults.length - 1) {
      maxTime = timeToSeconds(srtResults[dragIndex + 1].start);
    } else if (currentLineIdx > lyrics.length) {
      maxTime = timeToSeconds(srtResults[dragIndex].end);
    }
  }

  // 서로 겹치지 않게 0.01초 간격 유지
  newTime = Math.max(minTime + 0.01, Math.min(maxTime - 0.01, newTime));

  // 데이터 업데이트
  if (isDraggingEndMarker) {
    srtResults[dragIndex].end = formatTime(newTime);
  } else {
    srtResults[dragIndex].start = formatTime(newTime);
    if (dragIndex > 0) {
      srtResults[dragIndex - 1].end = formatTime(newTime - 0.001);
    }
  }

  renderMarkers();
  updateSRTDisplay();
});

window.addEventListener('mouseup', () => {
  isDraggingMarker = false;
});

function downloadSRT() {
  const content = document.getElementById('srtOutput').value;
  if (!content) return;
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "subtitle.srt";
  a.click();
}
</script>
</body>
</html>
