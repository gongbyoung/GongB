<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>브라우저 로컬 완전 자동 SRT 생성기</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    header { text-align: center; margin-bottom: 8px; }
    header h1 { font-size: 1.6rem; color: #fff; margin-bottom: 6px; }
    header p { color: var(--subtext); font-size: 0.9rem; }
    
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .row { display: flex; gap: 16px; margin-top: 12px; }
    .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 600; font-size: 0.85rem; color: var(--subtext); }
    input[type="file"], select {
      background: #0f172a; border: 1px solid var(--border); color: #fff;
      padding: 10px; border-radius: 8px; font-size: 0.85rem; width: 100%; outline: none;
    }
    textarea {
      width: 100%; height: 160px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; color: #fff; font-size: 0.9rem; resize: vertical; outline: none; line-height: 1.5;
    }
    
    .btn {
      background: var(--accent); color: white; border: none; padding: 12px 20px;
      font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.95rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
    .btn-green { background: #10b981; }
    .btn-green:hover { background: #059669; }

    #status {
      font-size: 0.85rem; color: #38bdf8; min-height: 20px; text-align: center;
      background: #0b1329; padding: 10px; border-radius: 6px; border: 1px dashed var(--border);
    }
    #previewBox {
      display: none; flex-direction: column; gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>로컬 AI 오디오 자동 자막 생성기</h1>
    <p>서버 업로드 없이 내 브라우저에서 Whisper AI를 구동해 타임스탬프를 자동 추출합니다.</p>
  </header>

  <div class="card">
    <div class="row">
      <div class="col">
        <label>1. MP3 오디오 파일 선택</label>
        <input type="file" id="audioFile" accept="audio/*">
      </div>
      <div class="col">
        <label>2. Whisper 모델 선택</label>
        <select id="modelSelect">
          <option value="Xenova/whisper-tiny">Whisper-Tiny (초고속, ~75MB, 테스트 권장)</option>
          <option value="Xenova/whisper-base" selected>Whisper-Base (균형형, ~140MB, 권장)</option>
          <option value="Xenova/whisper-small">Whisper-Small (고정밀, ~460MB, 약간 느림)</option>
        </select>
      </div>
    </div>

    <div class="col" style="margin-top: 14px;">
      <label>3. 원본 텍스트 가사 (선택 사항: 입력 시 타이밍에 맞게 이 가사를 우선 매핑합니다)</label>
      <textarea id="rawLyrics" placeholder="가사를 줄 단위로 붙여넣으세요. 비워두면 AI가 받아적은 텍스트로 SRT가 생성됩니다."></textarea>
    </div>

    <button id="runBtn" class="btn" style="margin-top: 16px; width: 100%;">자동 자막 분석 시작</button>
  </div>

  <div id="status">오디오 파일을 올리고 분석 시작 버튼을 눌러주세요.</div>

  <div id="previewBox" class="card">
    <label>완성된 SRT 자막 결과</label>
    <textarea id="srtResult" style="height: 220px;" readonly></textarea>
    <button id="downloadBtn" class="btn btn-green">SRT 파일 다운로드</button>
  </div>
</div>

<!-- Transformers.js 브라우저 번들 로드 -->
<script type="module">
  import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

  // 로컬 브라우저 캐시 활용 설정
  env.allowLocalModels = false;

  const audioFileInput = document.getElementById('audioFile');
  const modelSelect = document.getElementById('modelSelect');
  const rawLyrics = document.getElementById('rawLyrics');
  const runBtn = document.getElementById('runBtn');
  const statusEl = document.getElementById('status');
  const previewBox = document.getElementById('previewBox');
  const srtResult = document.getElementById('srtResult');
  const downloadBtn = document.getElementById('downloadBtn');

  let transcriber = null;
  let currentModel = '';

  // 오디오 파일을 16kHz Float32Array로 디코딩
  async function readAudioData(file) {
    const arrayBuffer = await file.arrayBuffer();
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
    return decoded.getChannelData(0); // 모노 채널 데이터 반환
  }

  // 밀리초 -> SRT 타임 포맷 변환 (00:00:00,000)
  function formatSRTTime(seconds) {
    if (isNaN(seconds) || seconds < 0) seconds = 0;
    const date = new Date(seconds * 1000);
    const hh = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const mm = String(date.getUTCMinutes()).padStart(2, '0');
    const ss = String(date.getUTCSeconds()).padStart(2, '0');
    const ms = String(date.getUTCMilliseconds()).padStart(3, '0');
    return `${hh}:${mm}:${ss},${ms}`;
  }

  runBtn.addEventListener('click', async () => {
    const file = audioFileInput.files[0];
    if (!file) {
      alert('MP3 오디오 파일을 먼저 등록해 주세요.');
      return;
    }

    runBtn.disabled = true;
    previewBox.style.display = 'none';

    try {
      const selectedModel = modelSelect.value;
      if (!transcriber || currentModel !== selectedModel) {
        statusEl.innerText = `AI 모델(${selectedModel}) 다운로드 중... 잠시만 기다려주세요 (최초 1회만 캐싱).`;
        transcriber = await pipeline('automatic-speech-recognition', selectedModel, {
          progress_callback: (p) => {
            if (p.status === 'progress') {
              statusEl.innerText = `모델 다운로드 중: ${p.file} (${Math.round(p.progress)}%)`;
            }
          }
        });
        currentModel = selectedModel;
      }

      statusEl.innerText = '오디오 파형 디코딩 중 (16kHz)...';
      const audioData = await readAudioData(file);

      statusEl.innerText = '음성 분석 및 타임스탬프 계산 중... 곡 길이에 따라 30초~1분 정도 소요될 수 있습니다.';
      
      // 타임스탬프 추출 활성화
      const output = await transcriber(audioData, {
        return_timestamps: true,
        chunk_length_s: 30,
        stride_length_s: 5,
        language: 'korean',
        task: 'transcribe'
      });

      statusEl.innerText = '자막 및 텍스트 매핑 완료!';

      // 원본 텍스트 가사가 입력되어 있다면 줄별로 매핑, 없으면 AI 인식 텍스트 사용
      const userLines = rawLyrics.value.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const chunks = output.chunks || [];
      
      let srtText = '';
      if (userLines.length > 0) {
        // 원본 가사 줄 수와 타임스탬프 청크 매핑
        userLines.forEach((line, idx) => {
          let start = 0;
          let end = 0;

          if (chunks[idx]) {
            start = chunks[idx].timestamp[0] ?? 0;
            end = chunks[idx].timestamp[1] ?? (start + 2.5);
          } else if (chunks.length > 0) {
            // 청크 수보다 가사가 많으면 마지막 시점 이후로 2.5초씩 가배정
            const lastChunk = chunks[chunks.length - 1];
            start = (lastChunk.timestamp[1] || 0) + (idx - chunks.length) * 2.5;
            end = start + 2.5;
          }

          srtText += `${idx + 1}\n${formatSRTTime(start)} --> ${formatSRTTime(end)}\n${line}\n\n`;
        });
      } else {
        // AI가 자동 추출한 텍스트 그대로 SRT화
        chunks.forEach((chunk, idx) => {
          const start = chunk.timestamp[0] ?? 0;
          const end = chunk.timestamp[1] ?? (start + 2.0);
          srtText += `${idx + 1}\n${formatSRTTime(start)} --> ${formatSRTTime(end)}\n${chunk.text.trim()}\n\n`;
        });
      }

      srtResult.value = srtText;
      previewBox.style.display = 'flex';

    } catch (err) {
      console.error(err);
      statusEl.innerText = `오류 발생: ${err.message}`;
    } finally {
      runBtn.disabled = false;
    }
  });

  // SRT 다운로드
  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([srtResult.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${audioFileInput.files[0]?.name.replace(/\.[^/.]+$/, "") || "lyrics"}.srt`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
