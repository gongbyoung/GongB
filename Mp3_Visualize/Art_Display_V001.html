<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 詩畫 캘리그라피 생성기 (사각 전서 인장 탑재)</title>
  <!-- 전통 캘리그라피, 직각 도장 전서용 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #c0292b;
      --paper-cream: #f4edd9;
      --ink-black: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 사이드바 */
    #sidebar {
      width: 395px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-395px);
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group label {
      font-size: 0.83rem;
      color: #a2a8ba;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .form-group label span {
      color: var(--accent-gold);
    }

    select, textarea, input[type="file"], input[type="range"], button {
      width: 100%;
      padding: 9px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .control-sub-box {
      background: #171922;
      border: 1px solid #282e3d;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-sub-box .sub-title {
      font-size: 0.82rem;
      color: var(--accent-gold);
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #bbb;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.76rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 85px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover {
      background: #ebd274;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 395px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 메인 뷰포트 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 화폭 */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 90px 140px;
    }

    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 140px 90px;
    }

    #poem-scroll.completed {
      box-shadow: 0 0 100px rgba(212, 175, 55, 0.45), inset 0 0 140px rgba(150, 130, 90, 0.3);
    }

    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .word-glyph {
      display: inline-block;
      opacity: 0;
      transform: scale(2.8);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.4));
      flex-shrink: 0;
    }

    .word-glyph.landed {
      opacity: 0.95;
      transform: scale(1);
    }

    /* 화면 중앙 활성 타이핑 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-canvas-wrap {
      width: 620px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 50px rgba(212, 175, 55, 0.55));
      opacity: 0;
      transform: scale(0.65);
      transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-canvas-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 낙관 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.9;
      transform: scale(1) rotate(0deg);
    }

    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 캔버스 규격 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 고정)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- 형상 선택 -->
      <div class="form-group">
        <label for="shape-type">글자 왜곡 형상</label>
        <select id="shape-type">
          <option value="rect" selected>사각 인장 (전각 전서체 - 직각 꽉 채움)</option>
          <option value="hand">손바닥 (Hand - 손가락/손바닥 실루엣)</option>
          <option value="star">별 (Star - 5갈래 꼭짓점 방사형)</option>
          <option value="oval">타원 (Oval - 유려한 달걀형 곡선)</option>
          <option value="heart">하트 (Heart - 상단 홈과 하단 뾰족형)</option>
        </select>
      </div>

      <!-- [사각 인장 전용 세부 컨트롤] -->
      <div class="control-sub-box" id="box-seal-options">
        <div class="sub-title">사각 인장(도장) 전용 설정</div>
        <div class="form-group">
          <label for="seal-carve-mode">각법 (도장 형식)</label>
          <select id="seal-carve-mode">
            <option value="yang">양각 (陽刻 - 붉은 테두리 + 붉은 글자)</option>
            <option value="eum">음각 (陰刻 - 사각 덩어리 파내기, 여백 無)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="seal-color-mode">인장 색상</label>
          <select id="seal-color-mode">
            <option value="red">전통 주사위 인주 (朱肉, 붉은색)</option>
            <option value="black">수묵 먹물 (墨, 칠흑색)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="seal-ortho">직각화 & 사각 틀 밀착 <span id="seal-ortho-val">98%</span></label>
          <input type="range" id="seal-ortho" min="60" max="100" value="98">
        </div>
      </div>

      <!-- 글자 크기 조절 -->
      <div class="form-group">
        <label for="glyph-scale">글자 크기 배율 <span id="glyph-scale-val">100%</span></label>
        <input type="range" id="glyph-scale" min="50" max="180" value="100">
      </div>

      <!-- 연속 필압 조절 -->
      <div class="control-sub-box">
        <div class="sub-title">연속 획(필압) 조절 - 자연스러운 곡선 보간</div>
        <div class="form-group">
          <label for="stroke-start">시작 획 두께 <span id="stroke-start-val">3px</span></label>
          <input type="range" id="stroke-start" min="0" max="16" value="3" step="0.5">
        </div>
        <div class="form-group">
          <label for="stroke-mid">중간 획 두께 <span id="stroke-mid-val">1px</span></label>
          <input type="range" id="stroke-mid" min="0" max="16" value="1" step="0.5">
        </div>
        <div class="form-group">
          <label for="stroke-end">끝 획 두께 <span id="stroke-end-val">5px</span></label>
          <input type="range" id="stroke-end" min="0" max="16" value="5" step="0.5">
        </div>
      </div>

      <!-- 틀 밀착 & 채움 (손바닥/별/타원/하트용) -->
      <div class="control-sub-box" id="box-general-frame">
        <div class="sub-title">형상 틀 밀착 & 채움 조절</div>
        <div class="form-group">
          <label for="frame-tightness">틀 밀착도 <span id="tightness-val">95%</span></label>
          <input type="range" id="frame-tightness" min="40" max="100" value="95">
        </div>
        <div class="form-group">
          <label for="frame-fill">틀 채움 확장 <span id="fill-val">110%</span></label>
          <input type="range" id="frame-fill" min="70" max="160" value="110">
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="show-outline" checked>
          <span>형상 외곽선(은은한 먹선 틀) 표시</span>
        </label>
      </div>

      <!-- 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (줄바꿈 지원)</label>
        <textarea id="direct-text">하늘과 바람과
별과 시

내 모든 삶이
빛나는 형상이 되리라</textarea>
      </div>

      <!-- 오디오 파일 -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <main id="viewport">
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <div id="scroll-content"></div>
        <div id="red-seal">千古<br>詩心</div>

        <div id="center-stage">
          <div id="center-canvas-wrap"></div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 픽셀 바운딩 박스 검출 (Full-Bleed Bounding Box Extraction)
       글자 획의 최외곽 픽셀을 찾아 사각 틀의 4개 변에 강제 밀착
       ------------------------------------------------------------- */
    function getGlyphBoundingBox(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, maxX = 0, minY = h, maxY = 0;
      let hasPixel = false;

      for (let y = 0; y < h; y++) {
        const row = y * w;
        for (let x = 0; x < w; x++) {
          if (data[(row + x) * 4 + 3] > 30) {
            hasPixel = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (!hasPixel) return { minX: 0, maxX: w, minY: 0, maxY: h, w, h };
      return { minX, maxX, minY, maxY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
    }

    /* -------------------------------------------------------------
       2. 고속 2D EDT 거리 변환 (SDF 필압 팽창 엔진)
       ------------------------------------------------------------- */
    function computeEDT1D(f, n, d) {
      const v = new Int32Array(n);
      const z = new Float32Array(n + 1);
      let k = 0;
      v[0] = 0; z[0] = -1e6; z[1] = 1e6;

      for (let q = 1; q < n; q++) {
        let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) {
          k--;
          s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        }
        k++; v[k] = q; z[k] = s; z[k + 1] = 1e6;
      }

      k = 0;
      for (let q = 0; q < n; q++) {
        while (z[k + 1] < q) k++;
        d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
      }
    }

    function generateSDFDilatedGlyph(char, targetW, targetH, strokeStart, strokeMid, strokeEnd, fontName) {
      const off = document.createElement('canvas');
      off.width = targetW;
      off.height = targetH;
      const ctx = off.getContext('2d');

      ctx.fillStyle = '#000000';
      ctx.font = fontName;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(char, targetW / 2, targetH / 2);

      const maxStroke = Math.max(strokeStart, strokeMid, strokeEnd);
      if (maxStroke <= 0.2) return off;

      const imgData = ctx.getImageData(0, 0, targetW, targetH);
      const data = imgData.data;
      const inf = 1e6;
      const f = new Float32Array(targetW * targetH);

      for (let i = 0; i < targetW * targetH; i++) {
        f[i] = (data[i * 4 + 3] > 120) ? 0 : inf;
      }

      const colIn = new Float32Array(targetH);
      const colOut = new Float32Array(targetH);
      const g = new Float32Array(targetW * targetH);

      for (let x = 0; x < targetW; x++) {
        for (let y = 0; y < targetH; y++) colIn[y] = f[y * targetW + x];
        computeEDT1D(colIn, targetH, colOut);
        for (let y = 0; y < targetH; y++) g[y * targetW + x] = colOut[y];
      }

      const rowIn = new Float32Array(targetW);
      const rowOut = new Float32Array(targetW);
      const dist = new Float32Array(targetW * targetH);

      for (let y = 0; y < targetH; y++) {
        for (let x = 0; x < targetW; x++) rowIn[x] = g[y * targetW + x];
        computeEDT1D(rowIn, targetW, rowOut);
        for (let x = 0; x < targetW; x++) dist[y * targetW + x] = Math.sqrt(rowOut[x]);
      }

      for (let y = 0; y < targetH; y++) {
        const v = y / targetH;
        let R = 0;
        if (v < 0.5) {
          const t = v / 0.5;
          const s = t * t * (3 - 2 * t);
          R = strokeStart * (1 - s) + strokeMid * s;
        } else {
          const t = (v - 0.5) / 0.5;
          const s = t * t * (3 - 2 * t);
          R = strokeMid * (1 - s) + strokeEnd * s;
        }

        const offset = y * targetW;
        for (let x = 0; x < targetW; x++) {
          const idx = (offset + x) * 4;
          const d = dist[offset + x];
          if (d <= R) {
            const alpha = Math.min(1.0, Math.max(0.0, (R - d + 0.5)));
            data[idx] = 0;
            data[idx + 1] = 0;
            data[idx + 2] = 0;
            data[idx + 3] = Math.max(data[idx + 3], Math.floor(alpha * 255));
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return off;
    }

    /* -------------------------------------------------------------
       3. 사각 전서 인장 전용 직각화 및 꽉 채움 렌더러
       (참조 도판 스타일: 양각 김봄 / 음각 이로운 완벽 구현)
       ------------------------------------------------------------- */
    function renderSquaredSealGlyph(char, targetSize, options) {
      const {
        strokeStart,
        strokeMid,
        strokeEnd,
        carveMode,    // 'yang'(양각) or 'eum'(음각)
        colorMode,    // 'red' or 'black'
        orthoRate     // 0.6 ~ 1.0 (직각화 및 마진 밀착도)
      } = options;

      const primaryColor = (colorMode === 'red') ? '#c0292b' : '#111115';
      const paperBgColor = '#f4edd9'; // 한지 바탕색

      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      // 1. 직각과 직선이 살아있는 묵직한 서체로 임시 캔버스에 렌더링
      const baseSize = 280;
      const rawCanvas = generateSDFDilatedGlyph(
        char,
        baseSize,
        baseSize,
        strokeStart,
        strokeMid,
        strokeEnd,
        `bold ${baseSize * 0.78}px 'Black Han Sans', sans-serif`
      );

      // 2. 글자 실제 획 Bounding Box 검출 (상·하·좌·우 획 끝점)
      const rawCtx = rawCanvas.getContext('2d');
      const bbox = getGlyphBoundingBox(rawCtx, baseSize, baseSize);

      // 3. 인장 테두리(인곽) 및 마진 계산
      const pad = Math.floor(targetSize * 0.08); // 외곽 마진 8%
      const borderW = Math.max(3, Math.floor(targetSize * 0.055)); // 도장 테두리 두께
      const innerX = pad + borderW + 2;
      const innerY = pad + borderW + 2;
      const innerW = targetSize - (innerX * 2);
      const innerH = targetSize - (innerY * 2);

      // [음각 모드 (陰刻)]: 붉은 사각 덩어리가 100% 꽉 차고 글자가 음각으로 파여짐 (도판의 '이로운' 스타일)
      if (carveMode === 'eum') {
        ctx.fillStyle = primaryColor;
        // 꽉 찬 사각 인장 바탕
        ctx.fillRect(pad, pad, targetSize - pad * 2, targetSize - pad * 2);

        // 글자를 한지색(파여진 홈)으로 비등방 스트레칭하여 사각 내부를 빈틈없이 꽉 채움
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = targetSize;
        maskCanvas.height = targetSize;
        const mctx = maskCanvas.getContext('2d');

        // Bounding Box를 정확히 innerW x innerH에 1:1로 팽창 매핑
        mctx.drawImage(
          rawCanvas,
          bbox.minX, bbox.minY, bbox.w, bbox.h,
          innerX, innerY, innerW, innerH
        );

        // 파내기(Destination-Out 또는 한지색 덮기)
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(maskCanvas, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
      }
      // [양각 모드 (陽刻)]: 붉은 사각 테두리 안에 굵은 직각 획이 테두리까지 꽉 차게 닿음 (도판의 '김봄' 스타일)
      else {
        // 사각 인장 외곽 테두리 (인곽)
        ctx.lineWidth = borderW;
        ctx.strokeStyle = primaryColor;
        ctx.strokeRect(pad + borderW / 2, pad + borderW / 2, targetSize - pad * 2 - borderW, targetSize - pad * 2 - borderW);

        // 글자를 인주색으로 채우기 위한 틴트 캔버스
        const tintCanvas = document.createElement('canvas');
        tintCanvas.width = innerW;
        tintCanvas.height = innerH;
        const tctx = tintCanvas.getContext('2d');

        // Bounding Box를 테두리 안쪽 끝까지 꽉 채우도록 비등방 팽창 드로우
        tctx.drawImage(
          rawCanvas,
          bbox.minX, bbox.minY, bbox.w, bbox.h,
          0, 0, innerW, innerH
        );

        // 색상 틴트 (검정 -> primaryColor)
        tctx.globalCompositeOperation = 'source-in';
        tctx.fillStyle = primaryColor;
        tctx.fillRect(0, 0, innerW, innerH);

        // 최종 합성
        ctx.drawImage(tintCanvas, innerX, innerY);
      }

      return canvas;
    }

    /* -------------------------------------------------------------
       4. 기타 비사각 형상(손바닥, 별, 타원, 하트) 렌더러
       ------------------------------------------------------------- */
    const TargetShapeBoundaries = {
      hand: (theta) => {
        if (theta < 0) {
          const thumb = Math.exp(-Math.pow((theta - (-2.38)) / 0.22, 2)) * 0.88;
          const indexF = Math.exp(-Math.pow((theta - (-1.95)) / 0.17, 2)) * 0.96;
          const middleF = Math.exp(-Math.pow((theta - (-1.57)) / 0.16, 2)) * 1.0;
          const ringF = Math.exp(-Math.pow((theta - (-1.19)) / 0.17, 2)) * 0.94;
          const pinky = Math.exp(-Math.pow((theta - (-0.78)) / 0.18, 2)) * 0.84;
          return Math.min(1.0, 0.52 + thumb + indexF + middleF + ringF + pinky);
        } else {
          return 0.38 + 0.35 * Math.pow(Math.abs(Math.cos(theta)), 1.5);
        }
      },
      star: (theta) => {
        const offset = theta + Math.PI / 2;
        const seg = (offset % ((2 * Math.PI) / 5) + ((2 * Math.PI) / 5)) % ((2 * Math.PI) / 5) - Math.PI / 5;
        return 0.38 + 0.62 * Math.pow(Math.max(0, Math.cos(2.5 * seg)), 1.4);
      },
      oval: (theta) => {
        const a = 0.82, b = 1.0;
        return (a * b) / Math.sqrt(Math.pow(b * Math.cos(theta), 2) + Math.pow(a * Math.sin(theta), 2));
      },
      heart: (theta) => {
        if (theta < 0) {
          const cleft = Math.exp(-Math.pow((theta - (-Math.PI / 2)) / 0.28, 2)) * 0.65;
          const lobeL = Math.exp(-Math.pow((theta - (-2.15)) / 0.45, 2)) * 0.98;
          const lobeR = Math.exp(-Math.pow((theta - (-0.99)) / 0.45, 2)) * 0.98;
          return Math.max(0.35, Math.max(lobeL, lobeR) - cleft);
        } else {
          return 0.45 + 0.55 * Math.pow(Math.sin(theta), 2.2);
        }
      }
    };

    function deformOrganicPoint(uNorm, vNorm, shapeKey, tightness, fillPower) {
      let r = Math.sqrt(uNorm * uNorm + vNorm * vNorm);
      if (r < 0.0001) return { x: 0, y: 0 };
      const theta = Math.atan2(vNorm, uNorm);
      const rBox = 1.0 / Math.max(Math.abs(Math.cos(theta)), Math.abs(Math.sin(theta)));

      let rho = Math.min(1.0, r / rBox);
      rho = Math.pow(rho, 1.0 / fillPower);

      const boundaryFn = TargetShapeBoundaries[shapeKey] || TargetShapeBoundaries.hand;
      const rTarget = boundaryFn(theta);
      const rFinal = rho * ((1 - tightness) * rBox + tightness * rTarget);

      return {
        x: rFinal * Math.cos(theta),
        y: rFinal * Math.sin(theta)
      };
    }

    function renderOrganicWarpedGlyph(char, shapeKey, targetSize, options) {
      const { strokeStart, strokeMid, strokeEnd, tightness, fillPower, showOutline } = options;
      const srcSize = 320;
      const srcCanvas = generateSDFDilatedGlyph(
        char,
        srcSize,
        srcSize,
        strokeStart,
        strokeMid,
        strokeEnd,
        `bold ${srcSize * 0.74}px 'Nanum Brush Script', cursive`
      );

      const dstCanvas = document.createElement('canvas');
      dstCanvas.width = targetSize;
      dstCanvas.height = targetSize;
      const dctx = dstCanvas.getContext('2d');

      if (showOutline) {
        dctx.save();
        dctx.beginPath();
        const boundaryFn = TargetShapeBoundaries[shapeKey] || TargetShapeBoundaries.hand;
        for (let i = 0; i <= 72; i++) {
          const angle = (i / 72) * 2 * Math.PI - Math.PI;
          const rB = boundaryFn(angle);
          const px = (rB * Math.cos(angle) * 0.46 + 0.5) * targetSize;
          const py = (rB * Math.sin(angle) * 0.46 + 0.5) * targetSize;
          if (i === 0) dctx.moveTo(px, py); else dctx.lineTo(px, py);
        }
        dctx.closePath();
        dctx.strokeStyle = 'rgba(180, 150, 100, 0.28)';
        dctx.lineWidth = Math.max(1.5, targetSize * 0.018);
        dctx.stroke();
        dctx.restore();
      }

      const gridN = 16;
      const vertices = [];
      for (let j = 0; j <= gridN; j++) {
        const row = [];
        const vNorm = (j / gridN) * 2 - 1;
        for (let i = 0; i <= gridN; i++) {
          const uNorm = (i / gridN) * 2 - 1;
          const def = deformOrganicPoint(uNorm, vNorm, shapeKey, tightness, fillPower);
          row.push({
            u: (i / gridN) * srcSize,
            v: (j / gridN) * srcSize,
            x: (def.x * 0.46 + 0.5) * targetSize,
            y: (def.y * 0.46 + 0.5) * targetSize
          });
        }
        vertices.push(row);
      }

      for (let j = 0; j < gridN; j++) {
        for (let i = 0; i < gridN; i++) {
          drawTriangleSeamFree(dctx, srcCanvas, vertices[j][i], vertices[j][i + 1], vertices[j + 1][i]);
          drawTriangleSeamFree(dctx, srcCanvas, vertices[j][i + 1], vertices[j + 1][i + 1], vertices[j + 1][i]);
        }
      }

      return dstCanvas;
    }

    function drawTriangleSeamFree(ctx, img, p0, p1, p2) {
      const D = (p1.u - p0.u) * (p2.v - p0.v) - (p2.u - p0.u) * (p1.v - p0.v);
      if (Math.abs(D) < 0.0001) return;

      const cx = (p0.x + p1.x + p2.x) / 3;
      const cy = (p0.y + p1.y + p2.y) / 3;
      const expand = 0.65;

      function pushOut(p) {
        const dx = p.x - cx, dy = p.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        return { x: p.x + (dx / len) * expand, y: p.y + (dy / len) * expand };
      }

      const ep0 = pushOut(p0), ep1 = pushOut(p1), ep2 = pushOut(p2);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ep0.x, ep0.y);
      ctx.lineTo(ep1.x, ep1.y);
      ctx.lineTo(ep2.x, ep2.y);
      ctx.closePath();
      ctx.clip();

      const a = ((p1.x - p0.x) * (p2.v - p0.v) - (p2.x - p0.x) * (p1.v - p0.v)) / D;
      const c = (-(p1.x - p0.x) * (p2.u - p0.u) + (p2.x - p0.x) * (p1.u - p0.u)) / D;
      const e = p0.x - a * p0.u - c * p0.v;
      const b = ((p1.y - p0.y) * (p2.v - p0.v) - (p2.y - p0.y) * (p1.v - p0.v)) / D;
      const d = (-(p1.y - p0.y) * (p2.u - p0.u) + (p2.y - p0.y) * (p1.u - p0.u)) / D;
      const f = p0.y - b * p0.u - d * p0.v;

      ctx.transform(a, b, c, d, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    // 종합 렌더러 분기
    function renderUniversalGlyph(char, shapeKey, targetSize, options) {
      if (shapeKey === 'rect') {
        return renderSquaredSealGlyph(char, targetSize, options);
      } else {
        return renderOrganicWarpedGlyph(char, shapeKey, targetSize, options);
      }
    }

    /* -------------------------------------------------------------
       5. SRT 파서
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join('\n').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    /* -------------------------------------------------------------
       6. 뷰포트 반응형 및 2K 스케일러
       ------------------------------------------------------------- */
    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      if (ratioSelect.value === '16:9') {
        canvas2KWidth = 2560; canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440; canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      const finalScale = Math.min(scaleX, scaleY, 1.0);
      scaler.style.transform = `scale(${finalScale})`;
    }

    window.addEventListener('resize', updateViewportScale);
    ratioSelect.addEventListener('change', () => {
      applyCanvasResolution();
      buildVisualization();
    });

    /* -------------------------------------------------------------
       7. UI 컨트롤러 및 빌더
       ------------------------------------------------------------- */
    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const shapeTypeSelect = document.getElementById('shape-type');

    const boxSealOptions = document.getElementById('box-seal-options');
    const boxGeneralFrame = document.getElementById('box-general-frame');
    const sealCarveMode = document.getElementById('seal-carve-mode');
    const sealColorMode = document.getElementById('seal-color-mode');
    const sealOrthoInput = document.getElementById('seal-ortho');
    const sealOrthoVal = document.getElementById('seal-ortho-val');

    const glyphScaleInput = document.getElementById('glyph-scale');
    const glyphScaleVal = document.getElementById('glyph-scale-val');
    const strokeStartInput = document.getElementById('stroke-start');
    const strokeStartVal = document.getElementById('stroke-start-val');
    const strokeMidInput = document.getElementById('stroke-mid');
    const strokeMidVal = document.getElementById('stroke-mid-val');
    const strokeEndInput = document.getElementById('stroke-end');
    const strokeEndVal = document.getElementById('stroke-end-val');
    const frameTightnessInput = document.getElementById('frame-tightness');
    const tightnessVal = document.getElementById('tightness-val');
    const frameFillInput = document.getElementById('frame-fill');
    const fillVal = document.getElementById('fill-val');
    const showOutlineCheck = document.getElementById('show-outline');

    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const centerWrap = document.getElementById('center-canvas-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt';
    let srtCues = [];
    let timelineEvents = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let currentActiveIdx = -1;

    // 형상 선택에 따라 전용 UI 표시 분기
    function syncShapePanels() {
      if (shapeTypeSelect.value === 'rect') {
        boxSealOptions.style.display = 'flex';
        boxGeneralFrame.style.display = 'none';
      } else {
        boxSealOptions.style.display = 'none';
        boxGeneralFrame.style.display = 'flex';
      }
    }

    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      buildVisualization();
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      buildVisualization();
    });

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          currentMode = 'srt';
          tabSrt.click();
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 파일을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    function getRenderingOptions() {
      return {
        strokeStart: parseFloat(strokeStartInput.value),
        strokeMid: parseFloat(strokeMidInput.value),
        strokeEnd: parseFloat(strokeEndInput.value),
        tightness: parseFloat(frameTightnessInput.value) / 100,
        fillPower: parseFloat(frameFillInput.value) / 100,
        showOutline: showOutlineCheck.checked,
        carveMode: sealCarveMode.value,
        colorMode: sealColorMode.value,
        orthoRate: parseFloat(sealOrthoInput.value) / 100
      };
    }

    function buildVisualization() {
      stopPlayback();
      syncShapePanels();
      scrollContent.innerHTML = '';
      centerWrap.innerHTML = '';
      centerWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      timelineEvents = [];

      const shape = shapeTypeSelect.value;
      const options = getRenderingOptions();
      const scaleMultiplier = parseFloat(glyphScaleInput.value) / 100;

      let textLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          textLines = ["SRT 파일을 업로드하거나", "직접 글 입력을 선택해주세요"];
        } else {
          textLines = srtCues.map(c => c.text);
        }
      } else {
        textLines = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
      }

      const safeWidth = canvas2KWidth * 0.82;
      const safeHeight = canvas2KHeight * 0.82;

      let maxLineChars = 1;
      textLines.forEach(line => {
        if (line.length > maxLineChars) maxLineChars = line.length;
      });
      const numLines = Math.max(textLines.length, 1);

      const baseGlyphW = safeWidth / (maxLineChars * 1.08);
      const baseGlyphH = safeHeight / (numLines * 1.35);
      let calculatedSize = Math.floor(Math.min(baseGlyphW, baseGlyphH) * scaleMultiplier);
      calculatedSize = Math.max(30, Math.min(calculatedSize, 220));

      const lineGap = Math.floor(calculatedSize * 0.32);
      scrollContent.style.gap = `${lineGap}px`;

      let globalCharIdx = 0;
      const defaultInterval = 280;

      textLines.forEach((lineText, lineIdx) => {
        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const chars = lineText.split('');
        chars.forEach((char, charIdx) => {
          if (char === ' ' || char === '\t') {
            const space = document.createElement('div');
            space.style.width = `${Math.floor(calculatedSize * 0.45)}px`;
            space.style.flexShrink = '0';
            lineRow.appendChild(space);
            return;
          }

          const glyphCanvas = renderUniversalGlyph(
            char, 
            shape, 
            Math.floor(calculatedSize * 1.3), 
            options
          );
          glyphCanvas.className = 'word-glyph';
          glyphCanvas.style.width = `${calculatedSize}px`;
          glyphCanvas.style.height = `${calculatedSize}px`;
          lineRow.appendChild(glyphCanvas);

          let triggerTime = 0;
          if (currentMode === 'srt' && srtCues.length > 0) {
            const cue = srtCues[lineIdx];
            const dur = cue.end - cue.start;
            triggerTime = cue.start + (charIdx / chars.length) * dur;
          } else {
            triggerTime = globalCharIdx * defaultInterval;
          }

          timelineEvents.push({
            index: globalCharIdx,
            char: char,
            element: glyphCanvas,
            triggerTime: triggerTime,
            shape: shape,
            options: options,
            landed: false
          });

          globalCharIdx++;
        });

        scrollContent.appendChild(lineRow);
      });

      if (timelineEvents.length > 0) {
        if (currentMode === 'srt' && srtCues.length > 0) {
          totalDurationMs = srtCues[srtCues.length - 1].end + 1200;
        } else {
          totalDurationMs = globalCharIdx * defaultInterval + 2500;
        }
      }

      timeSlider.max = totalDurationMs;
      updateTime(0);
    }

    /* -------------------------------------------------------------
       8. 애니메이션 렌더링 루프
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let activeEvt = null;

      for (let i = 0; i < timelineEvents.length; i++) {
        const ev = timelineEvents[i];
        if (currMs >= ev.triggerTime) {
          if (!ev.landed) {
            ev.element.classList.add('landed');
            ev.landed = true;
          }
          if (currMs - ev.triggerTime < 750) {
            activeEvt = ev;
          }
        } else {
          if (ev.landed) {
            ev.element.classList.remove('landed');
            ev.landed = false;
          }
        }
      }

      if (activeEvt) {
        if (currentActiveIdx !== activeEvt.index) {
          currentActiveIdx = activeEvt.index;
          centerWrap.innerHTML = '';

          const bigGlyph = renderUniversalGlyph(
            activeEvt.char,
            activeEvt.shape,
            560,
            activeEvt.options
          );
          centerWrap.appendChild(bigGlyph);

          centerWrap.classList.remove('active');
          void centerWrap.offsetWidth;
          centerWrap.classList.add('active');
        }
      } else {
        centerWrap.classList.remove('active');
        currentActiveIdx = -1;
      }

      if (currMs >= totalDurationMs - 1200 && timelineEvents.length > 0) {
        poemScroll.classList.add('completed');
        centerWrap.classList.remove('active');
      } else {
        poemScroll.classList.remove('completed');
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (timelineEvents.length === 0) buildVisualization();
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       9. 이벤트 리스너
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      buildVisualization();
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    glyphScaleInput.addEventListener('input', (e) => {
      glyphScaleVal.textContent = `${e.target.value}%`;
      buildVisualization();
    });

    strokeStartInput.addEventListener('input', (e) => {
      strokeStartVal.textContent = `${e.target.value}px`;
      buildVisualization();
    });

    strokeMidInput.addEventListener('input', (e) => {
      strokeMidVal.textContent = `${e.target.value}px`;
      buildVisualization();
    });

    strokeEndInput.addEventListener('input', (e) => {
      strokeEndVal.textContent = `${e.target.value}px`;
      buildVisualization();
    });

    sealOrthoInput.addEventListener('input', (e) => {
      sealOrthoVal.textContent = `${e.target.value}%`;
      buildVisualization();
    });

    frameTightnessInput.addEventListener('input', (e) => {
      tightnessVal.textContent = `${e.target.value}%`;
      buildVisualization();
    });

    frameFillInput.addEventListener('input', (e) => {
      fillVal.textContent = `${e.target.value}%`;
      buildVisualization();
    });

    sealCarveMode.addEventListener('change', buildVisualization);
    sealColorMode.addEventListener('change', buildVisualization);
    showOutlineCheck.addEventListener('change', buildVisualization);
    shapeTypeSelect.addEventListener('change', buildVisualization);

    directTextInput.addEventListener('input', () => {
      if (currentMode === 'direct') buildVisualization();
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyCanvasResolution();
      buildVisualization();
      updateFrame(0);
    });
  </script>
</body>
</html>
