<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 詩畫 캘리그라피 생성기</title>
  <!-- 전통 캘리그라피, 직각 전각 서체, 한글 명조 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #c0292b;
      --paper-cream: #f4edd9;
      --ink-black: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 설정 사이드바 */
    #sidebar {
      width: 420px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-420px);
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* 설정 적용 액션 박스 */
    .apply-action-box {
      background: #191c28;
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }

    button.btn-apply {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 800;
      font-size: 0.98rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    button.btn-apply:hover:not(:disabled) {
      background: #ebd274;
      transform: translateY(-1px);
    }

    button.btn-apply:disabled {
      background: #444a59;
      color: #8f96a8;
      cursor: not-allowed;
    }

    #apply-status-text {
      font-size: 0.8rem;
      text-align: center;
      color: #a2a8ba;
    }

    .form-group label {
      font-size: 0.82rem;
      color: #a2a8ba;
      margin-bottom: 4px;
      display: block;
      font-weight: bold;
    }

    .slider-number-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-number-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .slider-number-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      background: #1b1e2a;
      border: 1px solid #333a4d;
      border-radius: 6px;
      color: var(--accent-gold);
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: bold;
      text-align: right;
      outline: none;
    }

    select, textarea, input[type="file"], button {
      width: 100%;
      padding: 8px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .control-sub-box {
      background: #171922;
      border: 1px solid #282e3d;
      border-radius: 6px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .control-sub-box .sub-title {
      font-size: 0.82rem;
      color: var(--accent-gold);
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #bbb;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.76rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover:not(:disabled) {
      background: #ebd274;
    }

    button.btn-primary:disabled {
      background: #444a59;
      color: #777;
      cursor: not-allowed;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 420px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 뷰포트 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 고정 그림판 */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 80px 120px;
    }

    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 120px 80px;
    }

    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
      z-index: 10;
    }

    /* 1) 일반 텍스트 라인 컨테이너 (별, 타원, 사각 인장) */
    #scroll-content.mode-lines {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      width: 100%;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scroll-line.landed {
      opacity: 1;
      transform: scale(1);
    }

    .scroll-line .word-glyph {
      display: inline-block;
      flex-shrink: 0;
      filter: grayscale(100%) opacity(28%);
      transition: filter 1.2s ease, transform 0.8s ease;
    }

    #poem-scroll.completed .scroll-line .word-glyph {
      filter: grayscale(0%) opacity(95%) drop-shadow(2px 3px 6px rgba(0, 0, 0, 0.38));
    }

    /* 2) 손바닥 캘리그램 카드 컨테이너 */
    #scroll-content.mode-cards {
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 36px;
    }

    .docked-palm-card {
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6) translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .docked-palm-card.landed {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .docked-palm-card canvas {
      filter: grayscale(100%) opacity(28%);
      transition: filter 1.2s ease;
    }

    #poem-scroll.completed .docked-palm-card canvas {
      filter: grayscale(0%) opacity(95%) drop-shadow(4px 8px 12px rgba(0, 0, 0, 0.45));
    }

    #poem-scroll.completed {
      box-shadow: 0 0 100px rgba(212, 175, 55, 0.5), inset 0 0 140px rgba(150, 130, 90, 0.3);
    }

    /* 화면 중앙 실시간 타이핑 포커스 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-focus-wrap {
      padding: 24px 44px;
      border-radius: 18px;
      background: rgba(244, 237, 217, 0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 75px rgba(212, 175, 55, 0.5);
      opacity: 0;
      transform: scale(0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-focus-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 낙관 인장 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.94;
      transform: scale(1) rotate(0deg);
    }

    /* 타임라인 바 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 설정 적용 액션 버튼 -->
      <div class="apply-action-box">
        <button class="btn-apply" id="btn-apply">⚡ 설정 적용 및 2K 렌더링</button>
        <div id="apply-status-text">설정을 조절한 후 버튼을 누르면 일괄 반영됩니다.</div>
      </div>

      <!-- 캔버스 규격 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 해상도)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- 형상 선택 -->
      <div class="form-group">
        <label for="shape-type">시화 형상 스타일</label>
        <select id="shape-type">
          <option value="star" selected>★ 별 (갇힌 구멍 & 세로획 상단 정밀 각인)</option>
          <option value="oval">⬭ 와이드 타원 (가로로 뚱뚱한 2.2:1 뱃지 글자)</option>
          <option value="rect">■ 사각 인장 (전각 전서체 - 직각 꽉 채움)</option>
          <option value="hand">✋ 손바닥 (문장형 손바닥 수묵 캘리그램)</option>
        </select>
      </div>

      <!-- [사각 인장 전용 옵션] -->
      <div class="control-sub-box" id="box-seal-options" style="display: none;">
        <div class="sub-title">사각 인장 도장 전용 설정</div>
        <div class="form-group">
          <label for="seal-carve-mode">각법 (도장 형식)</label>
          <select id="seal-carve-mode">
            <option value="yang">양각 (陽刻 - 붉은 테두리 + 붉은 글자)</option>
            <option value="eum">음각 (陰刻 - 사각 덩어리 파내기, 여백 無)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="seal-color-mode">인장 색상</label>
          <select id="seal-color-mode">
            <option value="red">전통 주사위 인주 (朱肉, 붉은색)</option>
            <option value="black">수묵 먹물 (墨, 칠흑색)</option>
          </select>
        </div>
      </div>

      <!-- 1. 글자/작품 크기 배율 -->
      <div class="form-group">
        <label>글자/작품 크기 배율 (%)</label>
        <div class="slider-number-row">
          <input type="range" id="glyph-scale-range" min="50" max="180" value="100">
          <input type="number" id="glyph-scale-num" min="50" max="180" value="100">
        </div>
      </div>

      <!-- 2. 글자 필압 조절 -->
      <div class="control-sub-box">
        <div class="sub-title">글자 획 두께 (필압) 조절</div>
        <div class="form-group">
          <label>글자 획 두께 (px)</label>
          <div class="slider-number-row">
            <input type="range" id="text-stroke-range" min="0" max="14" value="3" step="0.5">
            <input type="number" id="text-stroke-num" min="0" max="14" value="3" step="0.5">
          </div>
        </div>
      </div>

      <!-- 3. 테두리 점선 가이드 설정 -->
      <div class="control-sub-box">
        <div class="sub-title">형상 테두리 가이드 설정</div>
        <label class="checkbox-row">
          <input type="checkbox" id="show-outline" checked>
          <span>형상 외곽선(점선) 표시 (끄면 글자만 보임)</span>
        </label>
      </div>

      <!-- 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (한 줄이 한 문장)</label>
        <textarea id="direct-text">별에서 온 도적
동글동글 굴러오는 짠 바람에
뺨마다 고운 피가 고이고
하늘과 바람과 별과 시</textarea>
      </div>

      <!-- 배경 음악 -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <main id="viewport">
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <div id="scroll-content" class="mode-lines"></div>
        <div id="red-seal">千古<br>詩心</div>

        <div id="center-stage">
          <div id="center-focus-wrap"></div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 슬라이더 <-> 숫자 인풋 가벼운 바인딩
       ------------------------------------------------------------- */
    function bindSliderNumberLight(rangeId, numId) {
      const rangeEl = document.getElementById(rangeId);
      const numEl = document.getElementById(numId);
      rangeEl.addEventListener('input', () => { numEl.value = rangeEl.value; });
      numEl.addEventListener('input', () => { rangeEl.value = numEl.value; });
    }
    bindSliderNumberLight('glyph-scale-range', 'glyph-scale-num');
    bindSliderNumberLight('text-stroke-range', 'text-stroke-num');

    /* -------------------------------------------------------------
       2. 결정론적 의사 난수 생성기 (Deterministic PRNG)
       ------------------------------------------------------------- */
    function createPRNG(seed) {
      let s = seed;
      return function() {
        const x = Math.sin(s++) * 10000;
        return x - Math.floor(x);
      };
    }

    /* -------------------------------------------------------------
       3. 랜덤 변형 & 회전 별(Star) 렌더러
       ------------------------------------------------------------- */
    function drawStylizedStar(ctx, cx, cy, baseR, seed, color = '#111115', isSmall = false) {
      const rnd = createPRNG(seed);
      ctx.save();

      // 1. 랜덤 회전 (-180 ~ +180도)
      const rot = rnd() * Math.PI * 2;
      // 2. 랜덤 크기 변형
      const scale = isSmall ? (0.42 + rnd() * 0.25) : (0.75 + rnd() * 0.45);
      const r = Math.max(2.8, baseR * scale);

      // 3. 4각 스파클 또는 5각 별 랜덤 선택
      const points = (rnd() > 0.5) ? 4 : 5;
      const innerRatio = (points === 4) ? (0.22 + rnd() * 0.12) : (0.42 + rnd() * 0.15);

      // 4. 종횡비 랜덤 변형 (찌그러진 별)
      const sx = 0.85 + rnd() * 0.3;
      const sy = 0.85 + rnd() * 0.3;

      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.scale(sx, sy);

      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const angle = (i * Math.PI) / points - Math.PI / 2;
        const dist = (i % 2 === 0) ? r : r * innerRatio;
        const px = Math.cos(angle) * dist;
        const py = Math.sin(angle) * dist;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();

      ctx.fillStyle = color;
      ctx.fill();

      // 큰 별은 안쪽에 미세한 음각 하이라이트 부여
      if (!isSmall && r > 6.5) {
        ctx.strokeStyle = '#f4edd9';
        ctx.lineWidth = 1.0;
        ctx.stroke();
      }

      ctx.restore();
    }

    /* -------------------------------------------------------------
       4. 한글 자형 역추적 분석기 (갇힌 구멍 & 세로 모음 상단 탐지)
       ------------------------------------------------------------- */
    function hasVerticalVowel(char) {
      const code = char.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        const S = code - 0xAC00;
        const V = Math.floor((S % 588) / 28);
        // ㅓ, ㅏ, ㅣ, ㅑ, ㅐ, ㅕ, ㅖ, ㅔ 등 세로 모음군
        const targetVowels = [0, 1, 2, 3, 4, 5, 6, 7, 20];
        return targetVowels.includes(V);
      }
      return false;
    }

    // 2D 픽셀 플러드 필로 'ㅇ, ㅂ, ㅎ, ㅁ' 등 갇힌 구멍(Hole) 정밀 검출
    function detectEnclosedHoles(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      const visited = new Uint8Array(w * h);
      const queue = [];

      // 테두리 외곽 배경 픽셀 큐 삽입
      for (let x = 0; x < w; x++) {
        if (data[x * 4 + 3] <= 60) { visited[x] = 1; queue.push(x); }
        const b = (h - 1) * w + x;
        if (data[b * 4 + 3] <= 60) { visited[b] = 1; queue.push(b); }
      }
      for (let y = 0; y < h; y++) {
        const l = y * w;
        if (data[l * 4 + 3] <= 60 && !visited[l]) { visited[l] = 1; queue.push(l); }
        const r = y * w + (w - 1);
        if (data[r * 4 + 3] <= 60 && !visited[r]) { visited[r] = 1; queue.push(r); }
      }

      let head = 0;
      while (head < queue.length) {
        const idx = queue[head++];
        const cx = idx % w;
        const cy = Math.floor(idx / w);
        const neighbors = [idx - 1, idx + 1, idx - w, idx + w];
        for (let i = 0; i < 4; i++) {
          const n = neighbors[i];
          const nx = n % w;
          const ny = Math.floor(n / w);
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            if (!visited[n] && data[n * 4 + 3] <= 60) {
              visited[n] = 1;
              queue.push(n);
            }
          }
        }
      }

      // 외곽과 단절된 내부 구멍 픽셀들을 그룹화
      const holeLabels = new Int32Array(w * h);
      let curLabel = 0;
      const holes = [];

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          if (data[idx * 4 + 3] <= 60 && !visited[idx] && holeLabels[idx] === 0) {
            curLabel++;
            const comp = [];
            const q = [idx];
            holeLabels[idx] = curLabel;
            let qh = 0;

            while (qh < q.length) {
              const cIdx = q[qh++];
              const px = cIdx % w;
              const py = Math.floor(cIdx / w);
              comp.push({ x: px, y: py });

              const nbs = [cIdx - 1, cIdx + 1, cIdx - w, cIdx + w];
              for (let k = 0; k < 4; k++) {
                const n = nbs[k];
                const nx = n % w;
                const ny = Math.floor(n / w);
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                  if (data[n * 4 + 3] <= 60 && !visited[n] && holeLabels[n] === 0) {
                    holeLabels[n] = curLabel;
                    q.push(n);
                  }
                }
              }
            }

            // 노이즈 제거 (20픽셀 이상 유효 구멍)
            if (comp.length >= 20) {
              let sumX = 0, sumY = 0;
              let minX = w, maxX = 0, minY = h, maxY = 0;
              for (const p of comp) {
                sumX += p.x; sumY += p.y;
                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
              }
              holes.push({
                cx: sumX / comp.length,
                cy: sumY / comp.length,
                radius: Math.min(maxX - minX, maxY - minY) * 0.45
              });
            }
          }
        }
      }
      return holes;
    }

    // 세로 모음의 상단 꼭대기 팁 좌표 검출
    function detectVerticalVowelTop(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      let minTopY = h;
      let targetX = w * 0.75;
      let found = false;

      // 글자 우측 절반 영역 검사
      for (let x = Math.floor(w * 0.52); x < Math.floor(w * 0.94); x++) {
        for (let y = Math.floor(h * 0.08); y < Math.floor(h * 0.75); y++) {
          const idx = (y * w + x) * 4;
          if (data[idx + 3] > 140) {
            if (y < minTopY) {
              minTopY = y;
              targetX = x;
              found = true;
            }
            break;
          }
        }
      }
      return found ? { x: targetX, y: minTopY } : null;
    }

    /* -------------------------------------------------------------
       5. 형상별 렌더러
       ------------------------------------------------------------- */

    // [형상 1] 별(Star) 정밀 각인 렌더러
    function renderStarGlyph(char, targetSize, options) {
      const { textStroke, showOutline } = options;
      const baseSize = 256;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      // 1. 임시 분석용 캔버스에 캘리그라피 렌더링
      const tmp = document.createElement('canvas');
      tmp.width = baseSize;
      tmp.height = baseSize;
      const tctx = tmp.getContext('2d');

      tctx.textAlign = 'center';
      tctx.textBaseline = 'middle';
      tctx.font = `bold ${baseSize * 0.74}px 'Nanum Brush Script', cursive`;

      if (textStroke > 0) {
        tctx.lineWidth = textStroke * 2.2;
        tctx.strokeStyle = '#111115';
        tctx.lineJoin = 'round';
        tctx.strokeText(char, baseSize / 2, baseSize / 2);
      }
      tctx.fillStyle = '#111115';
      tctx.fillText(char, baseSize / 2, baseSize / 2);

      // 2. 갇힌 구멍(ㅇ, ㅂ, ㅎ 등) 및 세로 모음(ㅓ, ㅏ, ㅣ 등) 꼭대기 탐지
      const holes = detectEnclosedHoles(tctx, baseSize, baseSize);
      const isVertical = hasVerticalVowel(char);
      const vTop = isVertical ? detectVerticalVowelTop(tctx, baseSize, baseSize) : null;

      // 3. 대상 캔버스에 글자 복사
      ctx.drawImage(tmp, 0, 0, targetSize, targetSize);
      const scale = targetSize / baseSize;
      const charSeed = char.charCodeAt(0) * 17;

      // 4-A. 갇힌 부분에만 별 찍기 (랜덤 변형 & 회전)
      holes.forEach((hole, hIdx) => {
        drawStylizedStar(
          ctx,
          hole.cx * scale,
          hole.cy * scale,
          hole.radius * scale * 0.95,
          charSeed + hIdx * 31,
          '#111115',
          false
        );
      });

      // 4-B. ㅓ, ㅏ, ㅣ, ㅑ, ㅐ, ㅕ의 세로획 꼭대기에만 아주 작은 별 찍기
      if (vTop) {
        drawStylizedStar(
          ctx,
          vTop.x * scale,
          Math.max(4, (vTop.y - 2) * scale),
          targetSize * 0.045, // 아주 작은 크기
          charSeed + 83,
          '#111115',
          true
        );
      }

      // 점선 가이드 테두리
      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.45)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(targetSize * 0.06, targetSize * 0.06, targetSize * 0.88, targetSize * 0.88);
        ctx.restore();
      }

      return canvas;
    }

    // [형상 2] 와이드 타원(Oval) 글자 렌더러 (2.2:1 Squircle)
    function renderWideOvalGlyph(char, targetSize, options) {
      const { textStroke, showOutline } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const cx = targetSize / 2;
      const cy = targetSize / 2;
      const rx = targetSize * 0.46;
      const ry = targetSize * 0.22;

      if (showOutline) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.48)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${targetSize * 0.65}px 'Nanum Brush Script', cursive`;

      // 가로로 통통하게 채우기 위해 스케일 조정
      ctx.translate(cx, cy);
      ctx.scale(1.25, 0.68);

      if (textStroke > 0) {
        ctx.lineWidth = textStroke * 2;
        ctx.strokeStyle = '#111115';
        ctx.lineJoin = 'round';
        ctx.strokeText(char, 0, 0);
      }
      ctx.fillStyle = '#111115';
      ctx.fillText(char, 0, 0);
      ctx.restore();

      return canvas;
    }

    // [형상 3] 사각 인장(Rect) 렌더러 (직각 전서체 & 꽉 채움)
    function renderSquareSealGlyph(char, targetSize, options) {
      const { textStroke, carveMode, colorMode, showOutline } = options;
      const primaryColor = (colorMode === 'red') ? '#c0292b' : '#111115';
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const pad = Math.floor(targetSize * 0.08);
      const borderW = Math.max(3, Math.floor(targetSize * 0.055));
      const innerX = pad + borderW + 2;
      const innerY = pad + borderW + 2;
      const innerW = targetSize - (innerX * 2);
      const innerH = targetSize - (innerY * 2);

      const raw = document.createElement('canvas');
      raw.width = innerW;
      raw.height = innerH;
      const rctx = raw.getContext('2d');
      rctx.textAlign = 'center';
      rctx.textBaseline = 'middle';
      rctx.font = `bold ${innerH * 0.86}px 'Black Han Sans', sans-serif`;

      if (textStroke > 0) {
        rctx.lineWidth = textStroke * 2.2;
        rctx.strokeStyle = '#000';
        rctx.lineJoin = 'miter';
        rctx.strokeText(char, innerW / 2, innerH / 2);
      }
      rctx.fillStyle = '#000';
      rctx.fillText(char, innerW / 2, innerH / 2);

      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.5)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(pad, pad, targetSize - pad * 2, targetSize - pad * 2);
        ctx.restore();
      }

      if (carveMode === 'eum') {
        ctx.fillStyle = primaryColor;
        ctx.fillRect(pad, pad, targetSize - pad * 2, targetSize - pad * 2);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(raw, innerX, innerY);
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.lineWidth = borderW;
        ctx.strokeStyle = primaryColor;
        ctx.strokeRect(pad + borderW / 2, pad + borderW / 2, targetSize - pad * 2 - borderW, targetSize - pad * 2 - borderW);

        const tint = document.createElement('canvas');
        tint.width = innerW;
        tint.height = innerH;
        const tctx = tint.getContext('2d');
        tctx.drawImage(raw, 0, 0);
        tctx.globalCompositeOperation = 'source-in';
        tctx.fillStyle = primaryColor;
        tctx.fillRect(0, 0, innerW, innerH);

        ctx.drawImage(tint, innerX, innerY);
      }
      return canvas;
    }

    // [형상 4] 손바닥(Palm) 문장형 수묵 캘리그램 렌더러
    function drawTaperedCalliStroke(ctx, pts, startW, midW, endW, color = '#111115') {
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const count = pts.length;
      if (count < 2) return;

      for (let i = 0; i < count - 1; i++) {
        const p0 = pts[i];
        const p1 = pts[i + 1];
        const t = i / (count - 1);
        const w = (t < 0.5) 
          ? startW * (1 - t * 2) + midW * (t * 2)
          : midW * (1 - (t - 0.5) * 2) + endW * ((t - 0.5) * 2);

        ctx.beginPath();
        ctx.lineWidth = Math.max(1, w);
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function renderPalmCalligram(sentence, targetSize, options) {
      const { textStroke } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const s = targetSize / 600;
      const brushW = 20 * s;

      // 5개 손가락 수묵 붓선
      drawTaperedCalliStroke(ctx, [{x:175*s,y:390*s},{x:130*s,y:340*s},{x:75*s,y:280*s},{x:70*s,y:210*s},{x:90*s,y:195*s},{x:115*s,y:210*s},{x:155*s,y:260*s}], brushW*0.8, brushW*1.3, brushW*0.3); // 엄지
      drawTaperedCalliStroke(ctx, [{x:190*s,y:210*s},{x:195*s,y:130*s},{x:215*s,y:70*s},{x:235*s,y:75*s},{x:245*s,y:140*s}], brushW*0.85, brushW*1.25, brushW*0.3); // 검지
      drawTaperedCalliStroke(ctx, [{x:330*s,y:190*s},{x:345*s,y:105*s},{x:365*s,y:50*s},{x:390*s,y:55*s},{x:405*s,y:130*s}], brushW*0.9, brushW*1.4, brushW*0.3); // 중지
      drawTaperedCalliStroke(ctx, [{x:420*s,y:170*s},{x:440*s,y:115*s},{x:470*s,y:80*s},{x:490*s,y:90*s},{x:495*s,y:150*s}], brushW*0.85, brushW*1.25, brushW*0.3); // 약지
      drawTaperedCalliStroke(ctx, [{x:495*s,y:170*s},{x:530*s,y:190*s},{x:535*s,y:250*s},{x:515*s,y:350*s},{x:470*s,y:440*s},{x:420*s,y:500*s}], brushW*0.9, brushW*1.45, brushW*0.4); // 소지 및 외곽
      drawTaperedCalliStroke(ctx, [{x:420*s,y:500*s},{x:350*s,y:540*s},{x:250*s,y:545*s},{x:190*s,y:510*s},{x:175*s,y:440*s}], brushW*1.1, brushW*1.4, brushW*0.5); // 손목

      // 손바닥 중심부 문장 캘리그라피
      const words = sentence.trim().split(/\s+/);
      let lines = [];
      if (words.length <= 2) lines = [words.join(' ')];
      else if (words.length <= 4) lines = [words.slice(0, 2).join(' '), words.slice(2).join(' ')];
      else lines = [words.slice(0, 2).join(' '), words.slice(2, 4).join(' '), words.slice(4).join(' ')];

      const maxLen = Math.max(...lines.map(l => l.length));
      const fontSize = Math.floor(Math.min((260 * s) / (maxLen * 0.85), (250 * s) / (lines.length * 1.15)));

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${fontSize}px 'Black Han Sans', 'Nanum Brush Script', sans-serif`;

      const cx = 320 * s, cy = 330 * s;
      const lineH = fontSize * 1.15;
      const startY = cy - (lines.length * lineH) / 2 + lineH / 2;

      lines.forEach((lText, idx) => {
        const y = startY + idx * lineH;
        ctx.save();
        ctx.translate(cx, y);
        if (textStroke > 0) {
          ctx.lineWidth = textStroke * s * 1.8;
          ctx.strokeStyle = '#111115';
          ctx.lineJoin = 'round';
          ctx.strokeText(lText, 0, 0);
        }
        ctx.fillStyle = '#111115';
        ctx.fillText(lText, 0, 0);
        ctx.restore();
      });
      ctx.restore();

      return canvas;
    }

    // 종합 분기
    function renderGlyphByShape(char, shapeKey, targetSize, options) {
      if (shapeKey === 'star') return renderStarGlyph(char, targetSize, options);
      if (shapeKey === 'oval') return renderWideOvalGlyph(char, targetSize, options);
      if (shapeKey === 'rect') return renderSquareSealGlyph(char, targetSize, options);
      return renderStarGlyph(char, targetSize, options);
    }

    /* -------------------------------------------------------------
       6. SRT 파서
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join(' ').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    /* -------------------------------------------------------------
       7. 뷰포트 반응형 스케일러
       ------------------------------------------------------------- */
    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      if (ratioSelect.value === '16:9') {
        canvas2KWidth = 2560; canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440; canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      scaler.style.transform = `scale(${Math.min(scaleX, scaleY, 1.0)})`;
    }

    window.addEventListener('resize', updateViewportScale);

      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      applyStatusText.textContent = "자막 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      applyStatusText.textContent = "직접 입력 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          applyStatusText.textContent = `자막 ${srtCues.length}개 준비됨. [적용 버튼]을 누르세요.`;
          currentMode = 'srt';
          tabSrt.classList.add('active');
          tabDirect.classList.remove('active');
          sectionSrt.style.display = 'block';
          sectionDirect.style.display = 'none';
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 형식을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    shapeTypeSelect.addEventListener('change', () => {
      boxSealOptions.style.display = (shapeTypeSelect.value === 'rect') ? 'flex' : 'none';
    });

    function getOptions() {
      return {
        textStroke: parseFloat(document.getElementById('text-stroke-range').value),
        showOutline: showOutlineCheck.checked,
        carveMode: sealCarveMode.value,
        colorMode: sealColorMode.value
      };
    }

    // 비동기 일괄 렌더링 엔진
    async function executeBuildVisualization() {
      stopPlayback();
      applyCanvasResolution();
      boxSealOptions.style.display = (shapeTypeSelect.value === 'rect') ? 'flex' : 'none';

      btnApply.disabled = true;
      btnPlay.disabled = true;
      btnReset.disabled = true;
      btnApply.textContent = "⏳ 2K 렌더링 진행 중...";
      applyStatusText.textContent = "시화 자형을 분석하고 고해상도 렌더링을 진행 중입니다...";

      await new Promise(resolve => setTimeout(resolve, 60));

      scrollContent.innerHTML = '';
      centerFocusWrap.innerHTML = '';
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      cueTimelineEvents = [];

      const shape = shapeTypeSelect.value;
      const options = getOptions();
      const scaleMultiplier = parseFloat(document.getElementById('glyph-scale-range').value) / 100;

      let rawLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          rawLines = [
            { start: 0, end: 3200, text: "별에서 온 도적" },
            { start: 3200, end: 6400, text: "동글동글 굴러오는 짠 바람에" },
            { start: 6400, end: 9600, text: "뺨마다 고운 피가 고이고" }
          ];
        } else {
          rawLines = srtCues;
        }
      } else {
        const textArr = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
        const interval = 3000;
        rawLines = textArr.map((t, idx) => ({
          start: idx * interval,
          end: (idx + 1) * interval,
          text: t
        }));
      }

      // [분기 A] 손바닥 모드: 문장형 캘리그램 카드 배치
      if (shape === 'hand') {
        scrollContent.className = 'mode-cards';

        const count = rawLines.length;
        let cols = Math.ceil(Math.sqrt(count * (canvas2KWidth / canvas2KHeight)));
        cols = Math.max(1, Math.min(cols, count));
        const rows = Math.ceil(count / cols);

        const maxCardW = (canvas2KWidth * 0.82) / cols - 36;
        const maxCardH = (canvas2KHeight * 0.82) / rows - 36;
        let cardSize = Math.floor(Math.min(maxCardW, maxCardH) * scaleMultiplier);
        cardSize = Math.max(160, Math.min(cardSize, 560));

        for (let idx = 0; idx < rawLines.length; idx++) {
          const cueData = rawLines[idx];
          applyStatusText.textContent = `렌더링 진행 중: (${idx + 1} / ${rawLines.length}) 손바닥 생성 중...`;

          const cardDiv = document.createElement('div');
          cardDiv.className = 'docked-palm-card';
          cardDiv.style.width = `${cardSize}px`;
          cardDiv.style.height = `${cardSize}px`;

          const palmCanvas = renderPalmCalligram(cueData.text, cardSize, options);
          cardDiv.appendChild(palmCanvas);
          scrollContent.appendChild(cardDiv);

          cueTimelineEvents.push({
            index: idx,
            text: cueData.text,
            start: cueData.start,
            end: cueData.end,
            element: cardDiv,
            isPalm: true,
            cardSize: cardSize,
            options: options,
            landed: false
          });

          if (idx % 2 === 0) await new Promise(r => setTimeout(r, 15));
        }
      }
      // [분기 B] 별, 와이드 타원, 사각 인장: 글자별 시화 행(Line) 배치 복구
      else {
        scrollContent.className = 'mode-lines';

        const safeW = canvas2KWidth * 0.84;
        const safeH = canvas2KHeight * 0.84;
        let maxLineChars = 1;
        rawLines.forEach(l => { if (l.text.length > maxLineChars) maxLineChars = l.text.length; });
        const numLines = Math.max(rawLines.length, 1);

        const baseGlyphW = safeW / (maxLineChars * 1.15);
        const baseGlyphH = safeH / (numLines * 1.4);
        let glyphSize = Math.floor(Math.min(baseGlyphW, baseGlyphH) * scaleMultiplier);
        glyphSize = Math.max(32, Math.min(glyphSize, 180));

        scrollContent.style.gap = `${Math.floor(glyphSize * 0.32)}px`;

        for (let idx = 0; idx < rawLines.length; idx++) {
          const cueData = rawLines[idx];
          applyStatusText.textContent = `렌더링 진행 중: (${idx + 1} / ${rawLines.length}) 자막 행 생성 중...`;

          const lineRow = document.createElement('div');
          lineRow.className = 'scroll-line';

          const chars = cueData.text.split('');
          chars.forEach(ch => {
            if (ch === ' ' || ch === '\t') {
              const sp = document.createElement('div');
              sp.style.width = `${Math.floor(glyphSize * 0.45)}px`;
              lineRow.appendChild(sp);
              return;
            }
            const gCanvas = renderGlyphByShape(ch, shape, Math.floor(glyphSize * 1.25), options);
            gCanvas.className = 'word-glyph';
            gCanvas.style.width = `${glyphSize}px`;
            gCanvas.style.height = `${glyphSize}px`;
            lineRow.appendChild(gCanvas);
          });

          scrollContent.appendChild(lineRow);

          cueTimelineEvents.push({
            index: idx,
            text: cueData.text,
            start: cueData.start,
            end: cueData.end,
            element: lineRow,
            isPalm: false,
            glyphSize: glyphSize,
            shape: shape,
            options: options,
            landed: false
          });

          if (idx % 2 === 0) await new Promise(r => setTimeout(r, 15));
        }
      }

      totalDurationMs = cueTimelineEvents[cueTimelineEvents.length - 1].end + 1200;
      timeSlider.max = totalDurationMs;
      timeSlider.value = 0;
      updateTime(0);

      btnApply.disabled = false;
      btnPlay.disabled = false;
      btnReset.disabled = false;
      btnApply.textContent = "⚡ 설정 적용 및 2K 렌더링";
      applyStatusText.textContent = `✓ 렌더링 완료 (${rawLines.length}개 자막 준비됨). [시연 시작]을 누르세요.`;
      applyStatusText.style.color = '#55db88';
      setTimeout(() => { applyStatusText.style.color = '#a2a8ba'; }, 3500);
    }

    btnApply.addEventListener('click', executeBuildVisualization);

    /* -------------------------------------------------------------
       9. 재생 루프 및 트랜지션
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let currentCue = null;

      for (let i = 0; i < cueTimelineEvents.length; i++) {
        const cue = cueTimelineEvents[i];

        if (currMs >= cue.start) {
          if (!cue.landed) {
            cue.element.classList.add('landed');
            cue.landed = true;
          }
        } else {
          if (cue.landed) {
            cue.element.classList.remove('landed');
            cue.landed = false;
          }
        }

        if (currMs >= cue.start && currMs < cue.end) {
          currentCue = cue;
        }
      }

      // 화면 중앙 타이핑 포커스 연출
      if (currentCue) {
        if (activeCueIdx !== currentCue.index) {
          activeCueIdx = currentCue.index;
          centerFocusWrap.innerHTML = '';

          // 손바닥 모드
          if (currentCue.isPalm) {
            const bigPalm = renderPalmCalligram(currentCue.text, 520, currentCue.options);
            bigPalm.style.filter = 'drop-shadow(4px 10px 18px rgba(0,0,0,0.4))';
            centerFocusWrap.appendChild(bigPalm);
          }
          // 별, 타원, 사각 인장 모드 (문장 전체 나열)
          else {
            const centerSize = Math.min(180, Math.floor(currentCue.glyphSize * 1.55));
            const chars = currentCue.text.split('');
            chars.forEach(ch => {
              if (ch === ' ') {
                const sp = document.createElement('div');
                sp.style.width = `${Math.floor(centerSize * 0.45)}px`;
                centerFocusWrap.appendChild(sp);
                return;
              }
              const gCanvas = renderGlyphByShape(ch, currentCue.shape, Math.floor(centerSize * 1.25), currentCue.options);
              gCanvas.style.width = `${centerSize}px`;
              gCanvas.style.height = `${centerSize}px`;
              gCanvas.style.filter = 'drop-shadow(2px 4px 6px rgba(0,0,0,0.3))';
              centerFocusWrap.appendChild(gCanvas);
            });
          }

          centerFocusWrap.classList.remove('active');
          void centerFocusWrap.offsetWidth;
          centerFocusWrap.classList.add('active');
        }
      } else {
        centerFocusWrap.classList.remove('active');
        activeCueIdx = -1;
      }

      // 마지막 자막 이후: 화폭 전체가 선명한 칠흑색(먹색)으로 트랜지션 및 낙관 완성
      if (cueTimelineEvents.length > 0) {
        const lastCue = cueTimelineEvents[cueTimelineEvents.length - 1];
        if (currMs >= lastCue.end) {
          poemScroll.classList.add('completed');
          centerFocusWrap.classList.remove('active');
        } else {
          poemScroll.classList.remove('completed');
        }
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (cueTimelineEvents.length === 0) {
        executeBuildVisualization().then(() => startPlayback());
        return;
      }
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       10. 제어 버튼 리스너
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      for (let i = 0; i < cueTimelineEvents.length; i++) {
        cueTimelineEvents[i].element.classList.remove('landed');
        cueTimelineEvents[i].landed = false;
      }
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    window.addEventListener('DOMContentLoaded', () => {
      executeBuildVisualization();
    });
  </script>
</body>
</html>
