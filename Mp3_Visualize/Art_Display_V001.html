<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정방향 캘리그라피 시화(詩畫) 생성기</title>
  <!-- 전통 캘리그라피 및 명조 한글 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0c10;
      --panel-bg: #14161f;
      --accent-gold: #d4af37;
      --accent-red: #c0392b;
      --paper-cream: #f5eedc;
      --ink-black: #111114;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 설정 패널 */
    #sidebar {
      width: 370px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed {
      transform: translateX(-370px);
    }

    .panel-header {
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.1rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 입력 모드 토글 탭 */
    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 8px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 10px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #a2a8ba;
      margin-bottom: 6px;
      display: block;
    }

    select, textarea, input[type="file"], input[type="range"], button {
      width: 100%;
      padding: 10px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }

    .file-box {
      background: #171a24;
      padding: 12px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.78rem;
      color: #55db88;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover {
      background: #ebd274;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    /* 패널 여닫기 버튼 */
    #toggle-sidebar {
      position: absolute;
      left: 370px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 메인 뷰포트 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1b1e2a 0%, #08090d 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 화면 중앙 활성 왜곡 글자 (타이핑 하이라이트) */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-canvas-wrap {
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.5));
      opacity: 0;
      transform: scale(0.65);
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-canvas-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 전통 족자 화폭 (시화 캔버스) */
    #poem-scroll {
      position: relative;
      width: 860px;
      height: 640px;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.3) 0%, transparent 70%);
      border-radius: 4px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 100px rgba(150, 130, 90, 0.25);
      border: 14px solid #201a14;
      overflow: hidden;
      padding: 45px 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 1s ease;
    }

    #poem-scroll.completed {
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.4), inset 0 0 100px rgba(150, 130, 90, 0.25);
      transform: scale(1.02);
    }

    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 52px;
    }

    /* 화폭에 안착하는 왜곡 글자 캔버스 */
    .word-glyph {
      width: 50px;
      height: 50px;
      display: inline-block;
      opacity: 0;
      transform: scale(2.8);
      transition: all 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.35));
    }

    .word-glyph.landed {
      opacity: 0.92;
      transform: scale(1);
    }

    /* 붉은 낙관 인장 */
    #red-seal {
      position: absolute;
      right: 42px;
      bottom: 38px;
      width: 56px;
      height: 56px;
      border: 3px solid var(--accent-red);
      border-radius: 6px;
      color: var(--accent-red);
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.88;
      transform: scale(1) rotate(0deg);
    }

    /* 재생 진행 슬라이더 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(20, 22, 31, 0.9);
      padding: 10px 22px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <!-- 설정 사이드바 -->
  <aside id="sidebar">
    <div class="panel-header">
      <h1>詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 텍스트 소스 선택 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 파일</button>
        <button class="mode-tab" id="tab-direct">직접 글 입력</button>
      </div>

      <!-- 형상 선택 -->
      <div class="form-group">
        <label for="shape-type">글자 왜곡 형상</label>
        <select id="shape-type">
          <option value="hand">손바닥 (Hand - 손가락과 손바닥 실루엣)</option>
          <option value="star">별 (Star - 5갈래 꼭짓점 방사 왜곡)</option>
          <option value="oval">타원 (Oval - 유려한 달걀형 곡선)</option>
          <option value="rect">사각 인장 (Square Seal - 묵직한 돌인장)</option>
          <option value="heart">하트 (Heart - 상단 홈과 하단 뾰족형)</option>
        </select>
      </div>

      <!-- 왜곡 강도 조절 -->
      <div class="form-group">
        <label for="warp-intensity">형상 왜곡 강도: <span id="warp-val">100%</span></label>
        <input type="range" id="warp-intensity" min="30" max="150" value="100">
      </div>

      <!-- SRT 자막 파일 영역 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 선택</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 입력 영역 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (줄바꿈 지원)</label>
        <textarea id="direct-text">하늘과 바람과
별과 시

내 모든 삶이
빛나는 형상이 되리라</textarea>
      </div>

      <!-- 배경 음악 파일 (선택) -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <!-- 제어 버튼 -->
      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시화 시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <!-- 메인 뷰포트 -->
  <main id="viewport">
    <!-- 화면 정중앙 실시간 타이핑 왜곡 글자 -->
    <div id="center-stage">
      <div id="center-canvas-wrap"></div>
    </div>

    <!-- 완성될 시화 화폭 (족자) -->
    <div id="poem-scroll">
      <div id="scroll-content"></div>
      <div id="red-seal">千古<br>詩心</div>
    </div>

    <!-- 하단 타임라인 -->
    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 정방향 2D 메쉬 왜곡 수식 (Shape Deformers)
       캔버스 좌표계와 1:1 일치:
       u: -1(좌) ~ +1(우), v: -1(상) ~ +1(하)
       ------------------------------------------------------------- */
    const ShapeDeformers = {
      // 1. 손바닥 (상단 손가락 4개, 좌측 엄지, 하단 손목 수축)
      hand: (u, v, strength) => {
        let x = u;
        let y = v;

        // 상단 손가락들 (v < -0.1)
        if (v < -0.1) {
          const fingerWarp = 0.22 * Math.sin((u + 0.9) * 4.2) + 0.15 * Math.cos((u - 0.2) * 5.0);
          y -= fingerWarp * Math.pow(Math.abs(v + 0.1) / 0.9, 1.4) * strength;
        }

        // 좌측 엄지손가락 (u < -0.1 && v가 중간일 때 돌출)
        if (u < -0.1 && v > -0.35 && v < 0.4) {
          const thumb = Math.sin(((v + 0.35) / 0.75) * Math.PI) * 0.42 * strength;
          x -= thumb;
        }

        // 하단 손목 수축 (v > 0.3)
        if (v > 0.3) {
          const wrist = 1 - 0.45 * ((v - 0.3) / 0.7) * strength;
          x *= Math.max(0.4, wrist);
        }

        return { x: x * 0.9, y: y * 0.9 };
      },

      // 2. 별 (5각 별 형상 왜곡)
      star: (u, v, strength) => {
        const r = Math.sqrt(u * u + v * v);
        // atan2(y, x) -> v가 음수일 때 위쪽이므로 -PI/2가 상단
        const theta = Math.atan2(v, u);
        const starFactor = 0.58 + 0.42 * Math.pow(Math.max(0, Math.cos(5 * theta + Math.PI / 2)), 1.3);
        const modR = r * (1 + (starFactor - 0.7) * 1.35 * strength);

        return {
          x: modR * Math.cos(theta),
          y: modR * Math.sin(theta)
        };
      },

      // 3. 타원 (Squircle 기반 정규화)
      oval: (u, v, strength) => {
        const s = strength;
        const x = u * Math.sqrt(Math.max(0, 1 - (v * v) / 2)) * (0.85 + 0.15 * (1 - s));
        const y = v * Math.sqrt(Math.max(0, 1 - (u * u) / 2)) * 1.25;
        return { x, y };
      },

      // 4. 사각 인장 (가장자리 귀접이와 모서리 돌출)
      rect: (u, v, strength) => {
        const p = 0.16 * strength;
        const x = u * (1 - p * (v * v));
        const y = v * (1 - p * (u * u));
        return { x: x * 0.92, y: y * 0.92 };
      },

      // 5. 하트 (상단 홈 파임, 하단 뾰족 모서리)
      heart: (u, v, strength) => {
        let x = u * (1 - 0.35 * (1 - v) * 0.5);
        let y = v;

        // 상단 가운데 파임 (v < 0)
        if (v < 0) {
          y += Math.pow(1 - Math.abs(u), 1.8) * 0.45 * strength;
        }
        // 하단 뾰족 모서리 (v > 0)
        if (v > 0) {
          x *= Math.max(0.1, 1 - v * 0.65 * strength);
        }

        return { x: x * 0.95, y: y * 1.05 };
      }
    };

    /* -------------------------------------------------------------
       2. 정밀 2D 아핀 변환 메쉬 렌더러 (정방향 렌더링 보장)
       ------------------------------------------------------------- */
    function renderWarpedGlyphCanvas(char, shapeKey, intensity, targetSize = 240) {
      const srcCanvas = document.createElement('canvas');
      const srcSize = 256;
      srcCanvas.width = srcSize;
      srcCanvas.height = srcSize;
      const sctx = srcCanvas.getContext('2d');

      // 1. 소스 캔버스에 올바른 방향으로 붓글씨 렌더링
      sctx.fillStyle = '#111114';
      sctx.font = `bold ${srcSize * 0.72}px 'Nanum Brush Script', cursive`;
      sctx.textAlign = 'center';
      sctx.textBaseline = 'middle';
      sctx.fillText(char, srcSize / 2, srcSize / 2);

      // 2. 대상 왜곡 캔버스 생성
      const dstCanvas = document.createElement('canvas');
      dstCanvas.width = targetSize;
      dstCanvas.height = targetSize;
      const dctx = dstCanvas.getContext('2d');

      const gridN = 14;
      const deformer = ShapeDeformers[shapeKey] || ShapeDeformers.hand;
      const strength = intensity / 100;

      // 격자 정점 산출
      const vertices = [];
      for (let j = 0; j <= gridN; j++) {
        const row = [];
        const vNorm = (j / gridN) * 2 - 1; // -1(위) ~ +1(아래)
        for (let i = 0; i <= gridN; i++) {
          const uNorm = (i / gridN) * 2 - 1; // -1(좌) ~ +1(우)
          
          const def = deformer(uNorm, vNorm, strength);

          row.push({
            u: (i / gridN) * srcSize,
            v: (j / gridN) * srcSize,
            x: (def.x * 0.45 + 0.5) * targetSize,
            y: (def.y * 0.45 + 0.5) * targetSize
          });
        }
        vertices.push(row);
      }

      // 3. 삼각 분할 텍스처 매핑
      for (let j = 0; j < gridN; j++) {
        for (let i = 0; i < gridN; i++) {
          const p00 = vertices[j][i];
          const p10 = vertices[j][i + 1];
          const p01 = vertices[j + 1][i];
          const p11 = vertices[j + 1][i + 1];

          drawTexturedTriangle(dctx, srcCanvas, p00, p10, p01);
          drawTexturedTriangle(dctx, srcCanvas, p10, p11, p01);
        }
      }

      return dstCanvas;
    }

    // 수학적으로 검증된 정밀 역행렬 아핀 변환 (상하반전 오류 완전 제거)
    function drawTexturedTriangle(ctx, img, p0, p1, p2) {
      const D = (p1.u - p0.u) * (p2.v - p0.v) - (p2.u - p0.u) * (p1.v - p0.v);
      if (Math.abs(D) < 0.0001) return;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.closePath();
      ctx.clip();

      const a = ((p1.x - p0.x) * (p2.v - p0.v) - (p2.x - p0.x) * (p1.v - p0.v)) / D;
      const c = (-(p1.x - p0.x) * (p2.u - p0.u) + (p2.x - p0.x) * (p1.u - p0.u)) / D;
      const e = p0.x - a * p0.u - c * p0.v;

      const b = ((p1.y - p0.y) * (p2.v - p0.v) - (p2.y - p0.y) * (p1.v - p0.v)) / D;
      const d = (-(p1.y - p0.y) * (p2.u - p0.u) + (p2.y - p0.y) * (p1.u - p0.u)) / D;
      const f = p0.y - b * p0.u - d * p0.v;

      ctx.transform(a, b, c, d, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    /* -------------------------------------------------------------
       3. 견고한 SRT 파서 (BOM, 윈도우 개행, 모든 구분자 완벽 지원)
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      // 1. BOM 제거 및 줄바꿈 정규화
      let clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        if (lines.length >= 2) {
          // 타임라인 행 찾기 ("-->" 포함 행)
          let timeLineIdx = -1;
          for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('-->')) {
              timeLineIdx = i;
              break;
            }
          }

          if (timeLineIdx !== -1 && lines.length > timeLineIdx + 1) {
            const timeParts = lines[timeLineIdx].split('-->');
            const start = timeToMs(timeParts[0]);
            const end = timeToMs(timeParts[1]);
            const textLines = lines.slice(timeLineIdx + 1).join('\n').trim();

            if (textLines && !isNaN(start) && !isNaN(end) && end > start) {
              cues.push({ start, end, text: textLines });
            }
          }
        }
      });

      return cues;
    }

    /* -------------------------------------------------------------
       4. 앱 상태 및 타임라인 빌더
       ------------------------------------------------------------- */
    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const shapeTypeSelect = document.getElementById('shape-type');
    const warpIntensityInput = document.getElementById('warp-intensity');
    const warpValLabel = document.getElementById('warp-val');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const poemScroll = document.getElementById('poem-scroll');
    const centerWrap = document.getElementById('center-canvas-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt'; // 'srt' 또는 'direct'
    let srtCues = [];
    let timelineEvents = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let currentActiveIdx = -1;

    // 모드 전환
    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      buildVisualization();
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      buildVisualization();
    });

    // SRT 파일 로드
    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          currentMode = 'srt';
          tabSrt.click();
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 형식을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    // 시화 시각화 데이터 구축
    function buildVisualization() {
      stopPlayback();
      scrollContent.innerHTML = '';
      centerWrap.innerHTML = '';
      centerWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      timelineEvents = [];

      const shape = shapeTypeSelect.value;
      const intensity = parseFloat(warpIntensityInput.value);

      let textLines = [];

      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          // SRT가 아직 안 들어왔으면 안내 메시지
          textLines = ["SRT 파일을 업로드하거나", "직접 글 입력을 선택해주세요"];
        } else {
          textLines = srtCues.map(c => c.text);
        }
      } else {
        textLines = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
      }

      let globalCharIndex = 0;
      const defaultInterval = 280;

      textLines.forEach((lineText, lineIdx) => {
        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const chars = lineText.split('');
        chars.forEach((char, charIdx) => {
          if (char === ' ' || char === '\t') {
            const space = document.createElement('div');
            space.style.width = '16px';
            lineRow.appendChild(space);
            return;
          }

          // 올바른 방향으로 베이킹된 왜곡 글자 캔버스
          const glyph = renderWarpedGlyphCanvas(char, shape, intensity, 110);
          glyph.className = 'word-glyph';
          lineRow.appendChild(glyph);

          // 타이밍 계산
          let triggerTime = 0;
          if (currentMode === 'srt' && srtCues.length > 0) {
            const cue = srtCues[lineIdx];
            const dur = cue.end - cue.start;
            triggerTime = cue.start + (charIdx / chars.length) * dur;
          } else {
            triggerTime = globalCharIndex * defaultInterval;
          }

          timelineEvents.push({
            index: globalCharIndex,
            char: char,
            element: glyph,
            triggerTime: triggerTime,
            shape: shape,
            intensity: intensity,
            landed: false
          });

          globalCharIndex++;
        });

        scrollContent.appendChild(lineRow);
      });

      if (timelineEvents.length > 0) {
        if (currentMode === 'srt' && srtCues.length > 0) {
          totalDurationMs = srtCues[srtCues.length - 1].end + 1200;
        } else {
          totalDurationMs = globalCharIndex * defaultInterval + 2500;
        }
      }

      timeSlider.max = totalDurationMs;
      updateTime(0);
    }

    /* -------------------------------------------------------------
       5. 타이핑 프레임 렌더러
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let activeEvt = null;

      for (let i = 0; i < timelineEvents.length; i++) {
        const ev = timelineEvents[i];
        if (currMs >= ev.triggerTime) {
          if (!ev.landed) {
            ev.element.classList.add('landed');
            ev.landed = true;
          }
          if (currMs - ev.triggerTime < 750) {
            activeEvt = ev;
          }
        } else {
          if (ev.landed) {
            ev.element.classList.remove('landed');
            ev.landed = false;
          }
        }
      }

      // 화면 중앙 왜곡 글자 하이라이트 연출
      if (activeEvt) {
        if (currentActiveIdx !== activeEvt.index) {
          currentActiveIdx = activeEvt.index;
          centerWrap.innerHTML = '';

          // 중앙 260px 대형 정방향 왜곡 캔버스 베이킹
          const bigGlyph = renderWarpedGlyphCanvas(
            activeEvt.char,
            activeEvt.shape,
            activeEvt.intensity,
            260
          );
          centerWrap.appendChild(bigGlyph);

          centerWrap.classList.remove('active');
          void centerWrap.offsetWidth; // Reflow
          centerWrap.classList.add('active');
        }
      } else {
        centerWrap.classList.remove('active');
        currentActiveIdx = -1;
      }

      // 전체 완료 시 화폭 및 붉은 인장 완성
      if (currMs >= totalDurationMs - 1200 && timelineEvents.length > 0) {
        poemScroll.classList.add('completed');
        centerWrap.classList.remove('active');
      } else {
        poemScroll.classList.remove('completed');
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (timelineEvents.length === 0) buildVisualization();
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시화 시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       6. UI 이벤트 등록
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      buildVisualization();
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    shapeTypeSelect.addEventListener('change', buildVisualization);
    warpIntensityInput.addEventListener('input', (e) => {
      warpValLabel.textContent = `${e.target.value}%`;
      buildVisualization();
    });

    directTextInput.addEventListener('input', () => {
      if (currentMode === 'direct') buildVisualization();
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    // 사이드바 토글
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
    });

    // 시작 시 기본 초기화
    window.addEventListener('DOMContentLoaded', () => {
      buildVisualization();
      updateFrame(0);
    });
  </script>
</body>
</html>
