<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 핸드-폰트 시화 생성기</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #d4af37; --bg: #0a0b0e; --skin: #f5d1b5; --outline: #2c1a10; }
    body { background: var(--bg); color: #eee; font-family: 'Nanum Myeongjo', serif; margin:0; display: flex; height: 100vh; overflow: hidden; }
    
    /* 사이드바 UI */
    #sidebar { width: 420px; background: #161821; border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    .group { background: #1f222e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
    h3 { color: var(--gold); font-size: 0.9rem; margin: 0 0 10px 0; border-bottom: 1px solid #444; padding-bottom: 5px; }
    label { display: block; font-size: 0.75rem; color: #bbb; margin: 8px 0 4px; }
    input[type="range"], input[type="number"], select { width: 100%; accent-color: var(--gold); background: #000; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 4px; }
    .row { display: flex; gap: 8px; }
    
    .btn-apply { width: 100%; padding: 12px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; font-size: 1rem; color: #000; }
    .btn-play { width: 100%; padding: 12px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 8px; }
    
    /* 메인 뷰포트 */
    #viewport { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #canvas-container { transform-origin: center; position: relative; box-shadow: 0 0 80px rgba(0,0,0,0.9); }
    canvas { background: #f0e6d2; display: block; }
    
    #loading { position: absolute; inset:0; background: rgba(0,0,0,0.8); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
    #timeline { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 70%; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; }
    #time-slider { flex: 1; }
  </style>
</head>
<body>

<aside id="sidebar">
  <h2 style="color:var(--gold); text-align:center; margin-top:0;">✋ 핸드-폰트 캘리그라피</h2>
  
  <div class="group">
    <h3>1. 손가락 획 설정 (Stroke)</h3>
    <label>피부 톤 (Skin Color)</label>
    <input type="color" id="skin-color" value="#f5d1b5">
    <label>획 두께 (Finger Thickness)</label>
    <input type="range" id="stroke-thick" min="5" max="30" value="14">
    <label>관절 마디 표현 (Joint Detail)</label>
    <input type="range" id="joint-detail" min="0" max="100" value="70">
  </div>

  <div class="group">
    <h3>2. 문장 레이아웃 (Layout)</h3>
    <label>배치 형태</label>
    <select id="layout-shape">
      <option value="rect">정방형 그리드</option>
      <option value="circle">원형 배치</option>
      <option value="triangle">피라미드형</option>
    </select>
    <label>중심 위치 X, Y (%)</label>
    <div class="row">
      <input type="number" id="center-x" value="50">
      <input type="number" id="center-y" value="45">
    </div>
    <label>자간 / 줄간격</label>
    <div class="row">
      <input type="number" id="char-gap" value="120">
      <input type="number" id="line-gap" value="160">
    </div>
  </div>

  <div class="group">
    <h3>3. 개별 글자 조절 (Typography)</h3>
    <label>전체 크기 (Scale)</label>
    <input type="range" id="global-scale" min="0.5" max="2.5" step="0.1" value="1.2">
    <label>강조 글자 크기 (%)</label>
    <input type="range" id="emphasize-scale" min="100" max="250" value="160">
  </div>

  <div class="group">
    <h3>4. 데이터 소스</h3>
    <textarea id="text-input" style="width:100%; height:60px;">한없이 나가는 눈길은&#10;수평선 저쪽까지</textarea>
    <label>SRT 자막 업로드</label>
    <input type="file" id="srt-file" accept=".srt">
  </div>

  <button class="btn-apply" id="btn-render">⚡ 2K 시화 베이킹 시작</button>
  <button class="btn-play" id="btn-play">▶ 시연(애니메이션) 시작</button>
</aside>

<main id="viewport">
  <div id="loading"><p>손으로 글자를 빚는 중...</p></div>
  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
  </div>
  <div id="timeline">
    <span id="time-val" style="font-family:monospace; font-size:0.9rem;">00:00</span>
    <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
  </div>
</main>

<script>
/**
 * HAND-FONT ENGINE
 * 이미지를 분석하여 손가락 획으로 글자를 재구성합니다.
 */
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = 2560, H = 1440; 
canvas.width = W; canvas.height = H;

let srtData = [];
let bakedData = [];
let isPlaying = false;
let startTime = 0;
let totalDuration = 5000;

// [핵심] 손가락 모양 획 그리기 함수
function drawFingerStroke(ctx, x1, y1, x2, y2, thick, skinColor) {
    const dist = Math.hypot(x2 - x1, y2 - y1);
    const angle = Math.atan2(y2 - y1, x2 - x1);
    
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(angle);
    
    // 1. 외곽선 (살짝 어두운 톤)
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#2c1a10";
    ctx.lineWidth = thick + 4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(dist, 0);
    ctx.stroke();
    
    // 2. 살구색 피부 채우기
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = thick;
    ctx.beginPath();
    ctx.moveTo(1, 0);
    ctx.lineTo(dist - 1, 0);
    ctx.stroke();
    
    // 3. 관절 및 손톱 디테일 (Joints)
    const detail = document.getElementById('joint-detail').value / 100;
    if (detail > 0.1) {
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = 2;
        // 첫 번째 관절
        ctx.beginPath(); ctx.moveTo(dist * 0.3, -thick/3); ctx.lineTo(dist * 0.3, thick/3); ctx.stroke();
        // 두 번째 관절
        ctx.beginPath(); ctx.moveTo(dist * 0.6, -thick/3); ctx.lineTo(dist * 0.6, thick/3); ctx.stroke();
        
        // 손톱 (끝부분)
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.beginPath();
        ctx.ellipse(dist - 5, 0, thick/3, thick/2, 0, 0, Math.PI*2);
        ctx.fill();
    }
    
    ctx.restore();
}

// [핵심] 한글을 손으로 구성하는 렌더러
function renderHandChar(char, x, y, size, opts) {
    // 임시 캔버스에 글자를 그려서 획의 경로를 추적 (간접 추출)
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 200; tempCanvas.height = 200;
    const tctx = tempCanvas.getContext('2d');
    tctx.font = `bold 140px "Nanum Gothic"`;
    tctx.textAlign = "center";
    tctx.textBaseline = "middle";
    tctx.fillText(char, 100, 100);
    
    const pixels = tctx.getImageData(0, 0, 200, 200).data;
    const points = [];
    
    // 글자 픽셀에서 샘플링하여 획의 위치를 파악
    const step = 14;
    for (let py = 0; py < 200; py += step) {
        for (let px = 0; px < 200; px += step) {
            if (pixels[(py * 200 + px) * 4 + 3] > 128) {
                points.push({x: px, y: py});
            }
        }
    }
    
    ctx.save();
    ctx.translate(x, y);
    const s = size / 140;
    ctx.scale(s, s);
    
    // 샘플링된 점들을 연결하여 손가락 획으로 대체
    for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[i+1] || points[0];
        const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        
        // 글자의 형태를 유지하는 거리 내에서만 획을 그림
        if (d < step * 1.5) {
            drawFingerStroke(ctx, p1.x - 100, p1.y - 100, p2.x - 100, p2.y - 100, opts.thick, opts.skin);
        }
        
        // 'ㅇ'이나 곡선 부분을 위한 손바닥 덩어리 처리
        if (i % 4 === 0) {
            ctx.fillStyle = opts.skin;
            ctx.strokeStyle = "#2c1a10";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(p1.x - 100, p1.y - 100, opts.thick/2, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
        }
    }
    ctx.restore();
}

// [베이킹] 설정된 텍스트/SRT를 바탕으로 전체 화면 구성
async function bakeAll() {
    document.getElementById('loading').style.display = 'flex';
    await new Promise(r => setTimeout(r, 100)); // UI 갱신 대기

    ctx.fillStyle = "#f0e6d2"; // 한지 느낌 배경
    ctx.fillRect(0, 0, W, H);
    
    const rawText = document.getElementById('text-input').value;
    const lines = rawText.split('\n');
    
    const opts = {
        skin: document.getElementById('skin-color').value,
        thick: parseInt(document.getElementById('stroke-thick').value),
        scale: parseFloat(document.getElementById('global-scale').value)
    };

    const gapX = parseInt(document.getElementById('char-gap').value);
    const gapY = parseInt(document.getElementById('line-gap').value);
    const startX = W * (parseInt(document.getElementById('center-x').value)/100);
    const startY = H * (parseInt(document.getElementById('center-y').value)/100);

    bakedData = [];
    let charIdx = 0;
    
    lines.forEach((line, lIdx) => {
        const chars = line.split('');
        const lineOffset = (chars.length * gapX) / 2;
        
        chars.forEach((char, cIdx) => {
            if (char.trim() === "") return;
            const px = startX - lineOffset + (cIdx * gapX);
            const py = startY + (lIdx * gapY);
            
            bakedData.push({
                char, x: px, y: py, 
                size: 150 * opts.scale,
                start: srtData.length > 0 ? (srtData[charIdx]?.start || 0) : charIdx * 300
            });
            charIdx++;
        });
    });

    totalDuration = bakedData.length > 0 ? bakedData[bakedData.length - 1].start + 1000 : 5000;
    document.getElementById('time-slider').max = totalDuration;
    
    // 초기 렌더링
    renderFrame(0);
    document.getElementById('loading').style.display = 'none';
}

function renderFrame(time) {
    ctx.fillStyle = "#f0e6d2";
    ctx.fillRect(0, 0, W, H);
    
    const opts = {
        skin: document.getElementById('skin-color').value,
        thick: parseInt(document.getElementById('stroke-thick').value)
    };

    bakedData.forEach(item => {
        if (time >= item.start) {
            const alpha = Math.min(1, (time - item.start) / 500);
            ctx.globalAlpha = alpha;
            renderHandChar(item.char, item.x, item.y, item.size, opts);
        }
    });
    ctx.globalAlpha = 1;
    drawSeal(W - 250, H - 250);
}

function drawSeal(x, y) {
    ctx.save();
    ctx.strokeStyle = "#c0292b"; ctx.lineWidth = 10;
    ctx.strokeRect(x, y, 160, 160);
    ctx.fillStyle = "#c0292b";
    ctx.font = "bold 45px 'Nanum Myeongjo'";
    ctx.textAlign = "center";
    ctx.fillText("詩心", x+80, y+70);
    ctx.fillText("掌中", x+80, y+125);
    ctx.restore();
}

// 애니메이션 루프
function animate() {
    if (!isPlaying) return;
    const now = performance.now();
    const elapsed = now - startTime;
    
    if (elapsed > totalDuration) {
        isPlaying = false;
        return;
    }

    renderFrame(elapsed);
    document.getElementById('time-slider').value = elapsed;
    updateTimeText(elapsed);
    requestAnimationFrame(animate);
}

function updateTimeText(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    document.getElementById('time-val').textContent = `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

// 이벤트 리스너
document.getElementById('btn-render').addEventListener('click', bakeAll);
document.getElementById('btn-play').addEventListener('click', () => {
    isPlaying = !isPlaying;
    if (isPlaying) {
        startTime = performance.now() - parseFloat(document.getElementById('time-slider').value);
        animate();
    }
});

document.getElementById('time-slider').addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    renderFrame(val);
    updateTimeText(val);
    if (isPlaying) startTime = performance.now() - val;
});

// SRT 파일 처리
document.getElementById('srt-file').addEventListener('change', (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
        const raw = ev.target.result;
        const blocks = raw.split('\n\n');
        srtData = blocks.map(b => {
            const lines = b.split('\n');
            if(lines.length < 3) return null;
            const times = lines[1].split(' --> ');
            return {
                start: timeToMs(times[0]),
                text: lines.slice(2).join(' ')
            };
        }).filter(x => x);
        alert("SRT 자막 로드 완료! 베이킹을 시작하세요.");
    };
    reader.readAsText(e.target.files[0]);
});

function timeToMs(t) {
    const p = t.split(':');
    return (parseInt(p[0])*3600 + parseInt(p[1])*60 + parseFloat(p[2].replace(',','.'))) * 1000;
}

// 초기 스케일링
function resizer() {
    const s = Math.min((window.innerWidth-450)/W, window.innerHeight/H) * 0.9;
    document.getElementById('canvas-container').style.transform = `scale(${s})`;
}
window.onresize = resizer; resizer();
window.onload = bakeAll;

</script>
</body>
</html>
