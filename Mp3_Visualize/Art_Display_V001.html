<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 詩畫 손가락 타이포그래피 생성기</title>
  <!-- 직각 전각 서체, 캘리그라피, 명조 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #c0292b;
      --paper-cream: #f4edd9;
      --ink-black: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 조작 사이드바 */
    #sidebar {
      width: 410px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-410px);
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 설정 적용 액션 박스 */
    .apply-action-box {
      background: #191c28;
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }

    button.btn-apply {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 800;
      font-size: 0.98rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    button.btn-apply:hover:not(:disabled) {
      background: #ebd274;
      transform: translateY(-1px);
    }

    button.btn-apply:disabled {
      background: #444a59;
      color: #8f96a8;
      cursor: not-allowed;
    }

    #apply-status-text {
      font-size: 0.8rem;
      text-align: center;
      color: #a2a8ba;
    }

    .form-group label {
      font-size: 0.84rem;
      color: #a2a8ba;
      margin-bottom: 5px;
      display: block;
      font-weight: bold;
    }

    select, textarea, input[type="file"], button {
      width: 100%;
      padding: 9px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .slider-number-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-number-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .slider-number-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      background: #1b1e2a;
      border: 1px solid #333a4d;
      border-radius: 6px;
      color: var(--accent-gold);
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: bold;
      text-align: right;
      outline: none;
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.76rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover:not(:disabled) {
      background: #ebd274;
    }

    button.btn-primary:disabled {
      background: #444a59;
      color: #777;
      cursor: not-allowed;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 410px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 반응형 뷰포트 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 고정 화폭 */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 80px 120px;
    }

    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 120px 80px;
    }

    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 26px;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scroll-line.landed {
      opacity: 1;
      transform: scale(1);
    }

    /* 박힌 글자 기본: 흐린 회색 비활성화 */
    .scroll-line .word-glyph {
      display: inline-block;
      flex-shrink: 0;
      filter: grayscale(100%) opacity(28%);
      transition: filter 1.2s ease, transform 0.8s ease;
    }

    /* 마지막 자막 완료 시: 선명한 살결 및 먹선 트랜지션 */
    #poem-scroll.completed .scroll-line .word-glyph {
      filter: grayscale(0%) opacity(100%) drop-shadow(3px 6px 12px rgba(0, 0, 0, 0.35));
    }

    #poem-scroll.completed {
      box-shadow: 0 0 100px rgba(212, 175, 55, 0.5), inset 0 0 140px rgba(150, 130, 90, 0.3);
    }

    /* 화면 중앙 실시간 타이핑 포커스 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-focus-wrap {
      padding: 24px 44px;
      border-radius: 18px;
      background: rgba(244, 237, 217, 0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 75px rgba(212, 175, 55, 0.5);
      opacity: 0;
      transform: scale(0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-focus-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 낙관 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.94;
      transform: scale(1) rotate(0deg);
    }

    /* 타임라인 바 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 설정 적용 액션 박스 -->
      <div class="apply-action-box">
        <button class="btn-apply" id="btn-apply">⚡ 설정 적용 및 2K 렌더링</button>
        <div id="apply-status-text">설정을 조절한 후 버튼을 누르면 일괄 반영됩니다.</div>
      </div>

      <!-- 캔버스 규격 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 해상도)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- [핵심 단일 옵션] 손가락 스타일 선택 -->
      <div class="form-group">
        <label for="finger-style-select">손가락 조형 스타일</label>
        <select id="finger-style-select">
          <option value="slender" selected>섬섬옥수 (가늘고 긴 손가락 & 우아한 수인)</option>
          <option value="chubby">통통한 손 (도톰하고 볼륨감 있는 살결 손)</option>
        </select>
      </div>

      <!-- 글자 크기 배율 -->
      <div class="form-group">
        <label>글자 크기 배율 (%)</label>
        <div class="slider-number-row">
          <input type="range" id="glyph-scale-range" min="50" max="180" value="100">
          <input type="number" id="glyph-scale-num" min="50" max="180" value="100">
        </div>
      </div>

      <!-- 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (한 줄이 한 문장)</label>
        <textarea id="direct-text">한없이 나가는 눈길은
수평선 저쪽까지
깃폭처럼 퍼덕인다</textarea>
      </div>

      <!-- 배경 음악 -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <main id="viewport">
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <div id="scroll-content"></div>
        <div id="red-seal">千古<br>詩心</div>

        <div id="center-stage">
          <div id="center-focus-wrap"></div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. UI 입력 양방향 동기화
       ------------------------------------------------------------- */
    function bindSliderNumberLight(rangeId, numId) {
      const rangeEl = document.getElementById(rangeId);
      const numEl = document.getElementById(numId);
      rangeEl.addEventListener('input', () => { numEl.value = rangeEl.value; });
      numEl.addEventListener('input', () => { rangeEl.value = numEl.value; });
    }
    bindSliderNumberLight('glyph-scale-range', 'glyph-scale-num');

    /* -------------------------------------------------------------
       2. [핵심] 실제 손가락 획 & 합장 수인 렌더링 엔진
       (첨부 이미지 '한없이 나가는 눈길은' 스타일 1:1 완벽 조형)
       ------------------------------------------------------------- */

    // [단일 손가락 획 렌더링]: 손목 기저부, 손가락 마디, 손톱, 관절선
    function drawAnatomicalFingerStroke(ctx, p1, p2, width, nailAtTip = true, isChubby = false) {
      ctx.save();
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 1) { ctx.restore(); return; }

      const angle = Math.atan2(dy, dx);
      ctx.translate(p1.x, p1.y);
      ctx.rotate(angle);

      // 통통한 손 vs 섬섬옥수 두께 및 볼륨 비율
      const r = isChubby ? width * 0.58 : width * 0.44;
      const taper = isChubby ? 0.85 : 0.72;

      // 전통 한지 배채풍 살결 그라데이션
      const grad = ctx.createLinearGradient(0, -r, 0, r);
      grad.addColorStop(0, '#fae3d2');
      grad.addColorStop(0.5, '#edd1be');
      grad.addColorStop(1, '#d8ad93');

      ctx.beginPath();
      // 손목 기저부 (손바닥 쪽 연결부)
      ctx.moveTo(0, -r * 0.75);
      // 관절 굴곡 프로필
      ctx.bezierCurveTo(len * 0.35, -r * 1.05, len * 0.75, -r * taper, len - r, -r * taper);
      // 손끝 둥근 아치
      ctx.arc(len - r, 0, r * taper, -Math.PI / 2, Math.PI / 2);
      ctx.bezierCurveTo(len * 0.75, r * taper, len * 0.35, r * 1.05, 0, r * 0.75);
      ctx.closePath();

      ctx.fillStyle = grad;
      ctx.fill();

      // 먹선 윤곽 (진하고 깊은 먹갈색)
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = Math.max(2.0, width * 0.13);
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 손끝 손톱 (Ivory Nail)
      if (nailAtTip) {
        ctx.save();
        const nailL = width * (isChubby ? 0.48 : 0.54);
        const nailW = width * (isChubby ? 0.46 : 0.40);
        const nailX = len - r - nailL * 0.15;

        ctx.beginPath();
        ctx.ellipse(nailX, 0, nailL * 0.42, nailW * 0.48, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff9f2';
        ctx.fill();
        ctx.strokeStyle = '#22150e';
        ctx.lineWidth = Math.max(1.3, width * 0.08);
        ctx.stroke();

        // 큐티클 라인
        ctx.beginPath();
        ctx.arc(nailX - nailL * 0.22, 0, nailW * 0.35, -Math.PI / 2, Math.PI / 2);
        ctx.strokeStyle = '#c68d71';
        ctx.lineWidth = 1.1;
        ctx.stroke();
        ctx.restore();
      }

      // 관절 마디 주름선 (Knuckle Lines)
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = Math.max(1.2, width * 0.08);

      const midK = len * 0.45;
      ctx.beginPath();
      ctx.arc(midK, 0, r * 0.55, -Math.PI / 3, Math.PI / 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(midK + 3.5, 0, r * 0.5, -Math.PI / 3.2, Math.PI / 3.2);
      ctx.stroke();

      const tipK = len * 0.74;
      ctx.beginPath();
      ctx.arc(tipK, 0, r * 0.5, -Math.PI / 3, Math.PI / 3);
      ctx.stroke();

      ctx.restore();
    }

    // [관절 꺾임 획 (Bent Knuckle Finger: ㄱ, ㄴ, ㄷ, ㄹ)]: 손가락이 자연스럽게 굽혀진 단일 관절
    function drawBentKnuckleStroke(ctx, p1, pCorner, p2, width, isChubby = false) {
      ctx.save();
      const r = isChubby ? width * 0.58 : width * 0.44;

      const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
      grad.addColorStop(0, '#fae3d2');
      grad.addColorStop(0.5, '#edd1be');
      grad.addColorStop(1, '#d8ad93');

      // 코너를 지나는 연속 튜브 렌더링
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo(pCorner.x, pCorner.y, p2.x, p2.y);
      ctx.lineWidth = r * 2.0;
      ctx.strokeStyle = grad;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      ctx.lineWidth = Math.max(2.0, width * 0.13);
      ctx.strokeStyle = '#22150e';
      ctx.stroke();

      // 끝단 손톱
      const angle = Math.atan2(p2.y - pCorner.y, p2.x - pCorner.x);
      ctx.save();
      ctx.translate(p2.x, p2.y);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.ellipse(-r * 0.2, 0, r * 0.5, r * 0.45, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fff9f2';
      ctx.fill();
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.restore();

      // 코너 관절 주름
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(pCorner.x, pCorner.y, r * 0.65, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    // [합장 수인 'ㅇ' 자형 (Mudra Hands)]: 첨부 이미지의 '한, 이, 은, 평' 두 손 모음 완벽 구현
    function drawMudraCuppedHands(ctx, cx, cy, rx, ry, strokeWidth, isChubby = false) {
      ctx.save();
      const w = strokeWidth * (isChubby ? 1.05 : 0.88);

      // 좌측 손
      const gradL = ctx.createLinearGradient(cx - rx * 1.5, cy, cx, cy);
      gradL.addColorStop(0, '#d8ad93');
      gradL.addColorStop(0.5, '#edd1be');
      gradL.addColorStop(1, '#fae3d2');

      ctx.beginPath();
      ctx.moveTo(cx, cy - ry);
      ctx.bezierCurveTo(cx - rx * 1.45, cy - ry * 0.6, cx - rx * 1.45, cy + ry * 0.6, cx, cy + ry);
      ctx.bezierCurveTo(cx - rx * 0.55, cy + ry * 0.6, cx - rx * 0.55, cy - ry * 0.6, cx, cy - ry);
      ctx.fillStyle = gradL;
      ctx.fill();
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = Math.max(2.0, strokeWidth * 0.13);
      ctx.stroke();

      // 우측 손
      const gradR = ctx.createLinearGradient(cx + rx * 1.5, cy, cx, cy);
      gradR.addColorStop(0, '#d8ad93');
      gradR.addColorStop(0.5, '#edd1be');
      gradR.addColorStop(1, '#fae3d2');

      ctx.beginPath();
      ctx.moveTo(cx, cy - ry);
      ctx.bezierCurveTo(cx + rx * 1.45, cy - ry * 0.6, cx + rx * 1.45, cy + ry * 0.6, cx, cy + ry);
      ctx.bezierCurveTo(cx + rx * 0.55, cy + ry * 0.6, cx + rx * 0.55, cy - ry * 0.6, cx, cy - ry);
      ctx.fillStyle = gradR;
      ctx.fill();
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = Math.max(2.0, strokeWidth * 0.13);
      ctx.stroke();

      // 손끝 손톱 2개
      ctx.fillStyle = '#fff9f2';
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = 1.3;

      ctx.beginPath();
      ctx.ellipse(cx - 3.5, cy - ry + 3, 3.8, 2.8, -0.25, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(cx + 3.5, cy - ry + 3, 3.8, 2.8, 0.25, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // 손목 맞닿음 주름선
      ctx.strokeStyle = '#22150e';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(cx - rx * 0.85, cy, 5.5, -Math.PI / 3, Math.PI / 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + rx * 0.85, cy, 5.5, Math.PI * 0.65, Math.PI * 1.35);
      ctx.stroke();

      ctx.restore();
    }

    /* -------------------------------------------------------------
       3. 한글 음소 분해 & 손가락 타이포그래피 매핑
       ------------------------------------------------------------- */
    function renderHandTypographyGlyph(char, targetSize, options) {
      const { fingerStyle } = options;
      const isChubby = (fingerStyle === 'chubby');
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const s = targetSize;
      const code = char.charCodeAt(0);

      // 비한글(문장부호 등): 우아한 손가락 하나
      if (code < 0xAC00 || code > 0xD7A3) {
        drawAnatomicalFingerStroke(ctx, { x: s * 0.35, y: s * 0.65 }, { x: s * 0.65, y: s * 0.35 }, s * 0.20, true, isChubby);
        return canvas;
      }

      const SIndex = code - 0xAC00;
      const LIndex = Math.floor(SIndex / 588);
      const VIndex = Math.floor((SIndex % 588) / 28);
      const TIndex = SIndex % 28;

      const fw = s * (isChubby ? 0.16 : 0.125);
      const isVertical = [0, 1, 2, 3, 4, 5, 6, 7, 20].includes(VIndex);
      const hasJong = (TIndex > 0);

      // 음소별 결구 영역
      let choBox, jungBox, jongBox;
      if (!hasJong) {
        if (isVertical) {
          choBox = { x: s * 0.08, y: s * 0.12, w: s * 0.44, h: s * 0.76 };
          jungBox = { x: s * 0.54, y: s * 0.08, w: s * 0.38, h: s * 0.84 };
        } else {
          choBox = { x: s * 0.18, y: s * 0.08, w: s * 0.64, h: s * 0.44 };
          jungBox = { x: s * 0.10, y: s * 0.54, w: s * 0.80, h: s * 0.38 };
        }
      } else {
        if (isVertical) {
          choBox = { x: s * 0.08, y: s * 0.06, w: s * 0.44, h: s * 0.46 };
          jungBox = { x: s * 0.54, y: s * 0.05, w: s * 0.38, h: s * 0.50 };
          jongBox = { x: s * 0.14, y: s * 0.56, w: s * 0.72, h: s * 0.38 };
        } else {
          choBox = { x: s * 0.18, y: s * 0.06, w: s * 0.64, h: s * 0.34 };
          jungBox = { x: s * 0.10, y: s * 0.40, w: s * 0.80, h: s * 0.28 };
          jongBox = { x: s * 0.14, y: s * 0.66, w: s * 0.72, h: s * 0.30 };
        }
      }

      // 자음 드로우
      function drawConsonant(cIdx, b) {
        const { x, y, w, h } = b;
        const bw = fw * (b.w / s * 1.6);

        // ㅇ (합장 수인)
        if (cIdx === 11) {
          drawMudraCuppedHands(ctx, x + w * 0.5, y + h * 0.5, w * 0.38, h * 0.42, bw, isChubby);
          return;
        }
        // ㄱ
        if (cIdx === 0 || cIdx === 1) {
          drawBentKnuckleStroke(ctx, { x: x + w * 0.15, y: y + h * 0.25 }, { x: x + w * 0.82, y: y + h * 0.25 }, { x: x + w * 0.78, y: y + h * 0.88 }, bw, isChubby);
          return;
        }
        // ㄴ
        if (cIdx === 2) {
          drawBentKnuckleStroke(ctx, { x: x + w * 0.22, y: y + h * 0.15 }, { x: x + w * 0.22, y: y + h * 0.80 }, { x: x + w * 0.88, y: y + h * 0.80 }, bw, isChubby);
          return;
        }
        // ㄷ
        if (cIdx === 3 || cIdx === 4) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.18, y: y + h * 0.22 }, { x: x + w * 0.82, y: y + h * 0.22 }, bw, true, isChubby);
          drawBentKnuckleStroke(ctx, { x: x + w * 0.22, y: y + h * 0.22 }, { x: x + w * 0.22, y: y + h * 0.80 }, { x: x + w * 0.88, y: y + h * 0.80 }, bw, isChubby);
          return;
        }
        // ㄹ
        if (cIdx === 5) {
          drawBentKnuckleStroke(ctx, { x: x + w * 0.18, y: y + h * 0.20 }, { x: x + w * 0.82, y: y + h * 0.20 }, { x: x + w * 0.82, y: y + h * 0.50 }, bw, isChubby);
          drawBentKnuckleStroke(ctx, { x: x + w * 0.82, y: y + h * 0.50 }, { x: x + w * 0.20, y: y + h * 0.50 }, { x: x + w * 0.20, y: y + h * 0.82 }, bw, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.20, y: y + h * 0.82 }, { x: x + w * 0.88, y: y + h * 0.82 }, bw, true, isChubby);
          return;
        }
        // ㅁ
        if (cIdx === 6) {
          drawBentKnuckleStroke(ctx, { x: x + w * 0.20, y: y + h * 0.20 }, { x: x + w * 0.20, y: y + h * 0.82 }, { x: x + w * 0.85, y: y + h * 0.82 }, bw, isChubby);
          drawBentKnuckleStroke(ctx, { x: x + w * 0.20, y: y + h * 0.22 }, { x: x + w * 0.82, y: y + h * 0.22 }, { x: x + w * 0.82, y: y + h * 0.82 }, bw, isChubby);
          return;
        }
        // ㅂ
        if (cIdx === 7 || cIdx === 8) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.22, y: y + h * 0.15 }, { x: x + w * 0.22, y: y + h * 0.82 }, bw, false, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.78, y: y + h * 0.15 }, { x: x + w * 0.78, y: y + h * 0.82 }, bw, false, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.22, y: y + h * 0.50 }, { x: x + w * 0.78, y: y + h * 0.50 }, bw, false, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.22, y: y + h * 0.82 }, { x: x + w * 0.85, y: y + h * 0.82 }, bw, true, isChubby);
          return;
        }
        // ㅅ
        if (cIdx === 9 || cIdx === 10) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.50, y: y + h * 0.18 }, { x: x + w * 0.16, y: y + h * 0.85 }, bw, true, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.50, y: y + h * 0.24 }, { x: x + w * 0.84, y: y + h * 0.85 }, bw, true, isChubby);
          return;
        }
        // ㅈ, ㅊ
        if (cIdx === 12 || cIdx === 13 || cIdx === 14) {
          if (cIdx === 14) drawAnatomicalFingerStroke(ctx, { x: x + w * 0.40, y: y + h * 0.08 }, { x: x + w * 0.60, y: y + h * 0.14 }, bw * 0.8, true, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.18, y: y + h * 0.24 }, { x: x + w * 0.82, y: y + h * 0.24 }, bw, false, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.50, y: y + h * 0.26 }, { x: x + w * 0.18, y: y + h * 0.85 }, bw, true, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.50, y: y + h * 0.28 }, { x: x + w * 0.82, y: y + h * 0.85 }, bw, true, isChubby);
          return;
        }
        // ㅎ
        if (cIdx === 18) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.38, y: y + h * 0.08 }, { x: x + w * 0.62, y: y + h * 0.14 }, bw * 0.8, true, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.16, y: y + h * 0.28 }, { x: x + w * 0.84, y: y + h * 0.28 }, bw, true, isChubby);
          drawMudraCuppedHands(ctx, x + w * 0.5, y + h * 0.65, w * 0.32, h * 0.30, bw, isChubby);
          return;
        }

        drawAnatomicalFingerStroke(ctx, { x: x + w * 0.5, y: y + h * 0.2 }, { x: x + w * 0.2, y: y + h * 0.8 }, bw, true, isChubby);
        drawAnatomicalFingerStroke(ctx, { x: x + w * 0.5, y: y + h * 0.2 }, { x: x + w * 0.8, y: y + h * 0.8 }, bw, true, isChubby);
      }

      // 모음 드로우
      function drawVowel(vIdx, b) {
        const { x, y, w, h } = b;
        const bw = fw * 0.95;

        // ㅣ
        if (vIdx === 20) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.5, y: y + h * 0.08 }, { x: x + w * 0.5, y: y + h * 0.92 }, bw, true, isChubby);
          return;
        }
        // ㅏ
        if (vIdx === 0 || vIdx === 2) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.4, y: y + h * 0.08 }, { x: x + w * 0.4, y: y + h * 0.92 }, bw, true, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.4, y: y + h * 0.45 }, { x: x + w * 0.88, y: y + h * 0.45 }, bw, true, isChubby);
          if (vIdx === 2) drawAnatomicalFingerStroke(ctx, { x: x + w * 0.4, y: y + h * 0.65 }, { x: x + w * 0.88, y: y + h * 0.65 }, bw, true, isChubby);
          return;
        }
        // ㅓ
        if (vIdx === 4 || vIdx === 6) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.12, y: y + h * 0.45 }, { x: x + w * 0.60, y: y + h * 0.45 }, bw, false, isChubby);
          if (vIdx === 6) drawAnatomicalFingerStroke(ctx, { x: x + w * 0.12, y: y + h * 0.65 }, { x: x + w * 0.60, y: y + h * 0.65 }, bw, false, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.60, y: y + h * 0.08 }, { x: x + w * 0.60, y: y + h * 0.92 }, bw, true, isChubby);
          return;
        }
        // ㅡ
        if (vIdx === 18) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.1, y: y + h * 0.5 }, { x: x + w * 0.9, y: y + h * 0.5 }, bw, true, isChubby);
          return;
        }
        // ㅗ, ㅛ
        if (vIdx === 8 || vIdx === 12) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.5, y: y + h * 0.15 }, { x: x + w * 0.5, y: y + h * 0.65 }, bw, false, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.08, y: y + h * 0.65 }, { x: x + w * 0.92, y: y + h * 0.65 }, bw, true, isChubby);
          return;
        }
        // ㅜ, ㅠ
        if (vIdx === 13 || vIdx === 17) {
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.08, y: y + h * 0.35 }, { x: x + w * 0.92, y: y + h * 0.35 }, bw, false, isChubby);
          drawAnatomicalFingerStroke(ctx, { x: x + w * 0.5, y: y + h * 0.35 }, { x: x + w * 0.5, y: y + h * 0.88 }, bw, true, isChubby);
          return;
        }

        drawAnatomicalFingerStroke(ctx, { x: x + w * 0.5, y: y + h * 0.1 }, { x: x + w * 0.5, y: y + h * 0.9 }, bw, true, isChubby);
        drawAnatomicalFingerStroke(ctx, { x: x + w * 0.1, y: y + h * 0.5 }, { x: x + w * 0.9, y: y + h * 0.5 }, bw, true, isChubby);
      }

      drawConsonant(LIndex, choBox);
      drawVowel(VIndex, jungBox);

      if (hasJong) {
        const jongMap = [0, 0, 1, 0, 2, 2, 2, 3, 5, 5, 5, 5, 5, 5, 5, 5, 6, 7, 7, 9, 10, 11, 12, 14, 15, 16, 17, 18];
        drawConsonant(jongMap[TIndex], jongBox);
      }

      return canvas;
    }

    /* -------------------------------------------------------------
       4. SRT 파서
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join(' ').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    /* -------------------------------------------------------------
       5. 2K 뷰포트 반응형 스케일러
       ------------------------------------------------------------- */
    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      if (ratioSelect.value === '16:9') {
        canvas2KWidth = 2560; canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440; canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      scaler.style.transform = `scale(${Math.min(scaleX, scaleY, 1.0)})`;
    }

    window.addEventListener('resize', updateViewportScale);

    /* -------------------------------------------------------------
       6. 비동기 일괄 렌더링 & 도킹 타임라인
       ------------------------------------------------------------- */
    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const fingerStyleSelect = document.getElementById('finger-style-select');

    const btnApply = document.getElementById('btn-apply');
    const applyStatusText = document.getElementById('apply-status-text');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const centerFocusWrap = document.getElementById('center-focus-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt';
    let srtCues = [];
    let cueTimelineEvents = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let activeCueIdx = -1;

    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      applyStatusText.textContent = "자막 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      applyStatusText.textContent = "직접 입력 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          applyStatusText.textContent = `자막 ${srtCues.length}개 준비됨. [적용 버튼]을 누르세요.`;
          currentMode = 'srt';
          tabSrt.classList.add('active');
          tabDirect.classList.remove('active');
          sectionSrt.style.display = 'block';
          sectionDirect.style.display = 'none';
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 형식을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    function getOptions() {
      return {
        fingerStyle: fingerStyleSelect.value
      };
    }

    async function executeBuildVisualization() {
      stopPlayback();
      applyCanvasResolution();

      btnApply.disabled = true;
      btnPlay.disabled = true;
      btnReset.disabled = true;
      btnApply.textContent = "⏳ 2K 렌더링 진행 중...";
      applyStatusText.textContent = "손가락 획 및 수인을 2K 화폭에 정밀 조형 중입니다...";

      await new Promise(resolve => setTimeout(resolve, 50));

      scrollContent.innerHTML = '';
      centerFocusWrap.innerHTML = '';
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      cueTimelineEvents = [];

      const options = getOptions();
      const scaleMultiplier = parseFloat(document.getElementById('glyph-scale-range').value) / 100;

      let rawLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          rawLines = [
            { start: 0, end: 3200, text: "한없이 나가는 눈길은" },
            { start: 3200, end: 6400, text: "수평선 저쪽까지" },
            { start: 6400, end: 9600, text: "깃폭처럼 퍼덕인다" }
          ];
        } else {
          rawLines = srtCues;
        }
      } else {
        const textArr = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
        const interval = 3000;
        rawLines = textArr.map((t, idx) => ({
          start: idx * interval,
          end: (idx + 1) * interval,
          text: t
        }));
      }

      const safeW = canvas2KWidth * 0.84;
      const safeH = canvas2KHeight * 0.84;
      let maxLineChars = 1;
      rawLines.forEach(l => { if (l.text.length > maxLineChars) maxLineChars = l.text.length; });
      const numLines = Math.max(rawLines.length, 1);

      const baseGlyphW = safeW / (maxLineChars * 1.15);
      const baseGlyphH = safeH / (numLines * 1.4);
      let glyphSize = Math.floor(Math.min(baseGlyphW, baseGlyphH) * scaleMultiplier);
      glyphSize = Math.max(32, Math.min(glyphSize, 180));

      scrollContent.style.gap = `${Math.floor(glyphSize * 0.34)}px`;

      for (let idx = 0; idx < rawLines.length; idx++) {
        const cueData = rawLines[idx];
        applyStatusText.textContent = `렌더링 진행 중: (${idx + 1} / ${rawLines.length}) 자막 행 생성 중...`;

        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const chars = cueData.text.split('');
        chars.forEach(ch => {
          if (ch === ' ' || ch === '\t') {
            const sp = document.createElement('div');
            sp.style.width = `${Math.floor(glyphSize * 0.45)}px`;
            lineRow.appendChild(sp);
            return;
          }
          const gCanvas = renderHandTypographyGlyph(ch, Math.floor(glyphSize * 1.25), options);
          gCanvas.className = 'word-glyph';
          gCanvas.style.width = `${glyphSize}px`;
          gCanvas.style.height = `${glyphSize}px`;
          lineRow.appendChild(gCanvas);
        });

        scrollContent.appendChild(lineRow);

        cueTimelineEvents.push({
          index: idx,
          text: cueData.text,
          start: cueData.start,
          end: cueData.end,
          element: lineRow,
          glyphSize: glyphSize,
          options: options,
          landed: false
        });

        if (idx % 2 === 0) await new Promise(r => setTimeout(r, 15));
      }

      totalDurationMs = cueTimelineEvents[cueTimelineEvents.length - 1].end + 1200;
      timeSlider.max = totalDurationMs;
      timeSlider.value = 0;
      updateTime(0);

      btnApply.disabled = false;
      btnPlay.disabled = false;
      btnReset.disabled = false;
      btnApply.textContent = "⚡ 설정 적용 및 2K 렌더링";
      applyStatusText.textContent = `✓ 렌더링 완료 (${rawLines.length}개 자막 준비됨). [시연 시작]을 누르세요.`;
      applyStatusText.style.color = '#55db88';
      setTimeout(() => { applyStatusText.style.color = '#a2a8ba'; }, 3500);
    }

    btnApply.addEventListener('click', executeBuildVisualization);

    /* -------------------------------------------------------------
       7. 재생 루프 및 트랜지션
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let currentCue = null;

      for (let i = 0; i < cueTimelineEvents.length; i++) {
        const cue = cueTimelineEvents[i];

        if (currMs >= cue.start) {
          if (!cue.landed) {
            cue.element.classList.add('landed');
            cue.landed = true;
          }
        } else {
          if (cue.landed) {
            cue.element.classList.remove('landed');
            cue.landed = false;
          }
        }

        if (currMs >= cue.start && currMs < cue.end) {
          currentCue = cue;
        }
      }

      // 화면 중앙 한 문장 실시간 타이핑 포커스
      if (currentCue) {
        if (activeCueIdx !== currentCue.index) {
          activeCueIdx = currentCue.index;
          centerFocusWrap.innerHTML = '';

          const centerSize = Math.min(180, Math.floor(currentCue.glyphSize * 1.55));
          const chars = currentCue.text.split('');
          chars.forEach(ch => {
            if (ch === ' ') {
              const sp = document.createElement('div');
              sp.style.width = `${Math.floor(centerSize * 0.45)}px`;
              centerFocusWrap.appendChild(sp);
              return;
            }
            const gCanvas = renderHandTypographyGlyph(ch, Math.floor(centerSize * 1.25), currentCue.options);
            gCanvas.style.width = `${centerSize}px`;
            gCanvas.style.height = `${centerSize}px`;
            gCanvas.style.filter = 'drop-shadow(3px 6px 10px rgba(0,0,0,0.35))';
            centerFocusWrap.appendChild(gCanvas);
          });

          centerFocusWrap.classList.remove('active');
          void centerFocusWrap.offsetWidth;
          centerFocusWrap.classList.add('active');
        }
      } else {
        centerFocusWrap.classList.remove('active');
        activeCueIdx = -1;
      }

      // 마지막 자막 종료 시: 풀컬러/먹선 완성 트랜지션 및 낙관 완성
      if (cueTimelineEvents.length > 0) {
        const lastCue = cueTimelineEvents[cueTimelineEvents.length - 1];
        if (currMs >= lastCue.end) {
          poemScroll.classList.add('completed');
          centerFocusWrap.classList.remove('active');
        } else {
          poemScroll.classList.remove('completed');
        }
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (cueTimelineEvents.length === 0) {
        executeBuildVisualization().then(() => startPlayback());
        return;
      }
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       8. 제어 버튼 리스너
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      for (let i = 0; i < cueTimelineEvents.length; i++) {
        cueTimelineEvents[i].element.classList.remove('landed');
        cueTimelineEvents[i].landed = false;
      }
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    window.addEventListener('DOMContentLoaded', () => {
      executeBuildVisualization();
    });
  </script>
</body>
</html>
