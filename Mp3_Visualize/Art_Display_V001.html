<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>형상 왜곡 캘리그라피 시화(詩畫) 생성기</title>
  <!-- 전통 캘리그라피 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@700&family=Yuji+Boku&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0d0e12;
      --panel-bg: #14161d;
      --accent-gold: #d4af37;
      --accent-red: #b83b3b;
      --paper-cream: #f4eee1;
      --ink-black: #111113;
      --ink-shadow: rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 설정 패널 */
    #control-panel {
      width: 360px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.2);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s ease;
    }

    #control-panel.collapsed {
      transform: translateX(-360px);
    }

    .panel-title {
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #a0a5b5;
      margin-bottom: 6px;
      display: block;
    }

    select, textarea, input[type="file"], input[type="range"], button {
      width: 100%;
      padding: 10px 12px;
      background: #1e222d;
      border: 1px solid #32394a;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }

    .file-box {
      background: #181b24;
      padding: 12px;
      border-radius: 6px;
      border: 1px dashed #40485d;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0d0e12;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover {
      background: #ebd06e;
      transform: translateY(-1px);
    }

    button.btn-sub {
      background: transparent;
      border: 1px solid #444c60;
      cursor: pointer;
    }

    /* 사이드바 토글 버튼 */
    #toggle-panel {
      position: absolute;
      left: 360px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s ease;
    }

    #control-panel.collapsed + #toggle-panel {
      left: 0;
    }

    /* 메인 뷰포트 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1b1e28 0%, #0a0b0e 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 화면 중앙 활성 왜곡 글자 (타이핑 하이라이트) */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #center-canvas-wrap {
      width: 280px;
      height: 280px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-canvas-wrap.active {
      opacity: 1;
      transform: scale(1.08);
    }

    /* 배경 수묵화풍 한지 족자 (시화 그림 완성 화폭) */
    #poem-scroll {
      position: relative;
      width: 820px;
      height: 620px;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 80% 20%, rgba(200, 180, 150, 0.2) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 80%, rgba(180, 160, 130, 0.25) 0%, transparent 70%);
      border-radius: 4px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(160, 140, 100, 0.3);
      border: 12px solid #221d17;
      overflow: hidden;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #poem-scroll.completed {
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.4), inset 0 0 80px rgba(160, 140, 100, 0.3);
      transform: scale(1.02);
    }

    /* 시화 텍스트 레이아웃 컨테이너 */
    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 52px;
    }

    /* 화폭 위에 배치되는 개별 왜곡 글자 요소 */
    .word-glyph {
      width: 52px;
      height: 52px;
      display: inline-block;
      opacity: 0;
      transform: scale(3) rotate(-8deg);
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(1px 2px 3px var(--ink-shadow));
    }

    .word-glyph.landed {
      opacity: 0.92;
      transform: scale(1) rotate(0deg);
    }

    /* 붉은 낙관 인장 */
    #red-seal {
      position: absolute;
      right: 40px;
      bottom: 35px;
      width: 54px;
      height: 54px;
      border: 3px solid var(--accent-red);
      border-radius: 6px;
      color: var(--accent-red);
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(15deg);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.85;
      transform: scale(1) rotate(0deg);
    }

    /* 하단 타임라인 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(20, 22, 29, 0.85);
      padding: 10px 22px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #aaa;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <!-- 컨트롤 패널 -->
  <aside id="control-panel">
    <div class="panel-title">
      <h1>詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 변형 형상 선택 -->
      <div class="form-group">
        <label for="shape-type">글자가 변형될 형상 (Shape)</label>
        <select id="shape-type">
          <option value="hand">손바닥 (Hand - 손가락/손바닥 실루엣)</option>
          <option value="star">별 (Star - 5갈래 꼭짓점 왜곡)</option>
          <option value="oval">타원 (Oval - 유려한 둥근 알 형태)</option>
          <option value="rect">전서 사각 (Seal Box - 묵직한 돌인장 사각)</option>
          <option value="heart">하트 (Heart - 상단 홈과 뾰족한 끝)</option>
        </select>
      </div>

      <!-- 왜곡 강도 조절 -->
      <div class="form-group">
        <label for="warp-intensity">형상 왜곡 강도: <span id="warp-val">100%</span></label>
        <input type="range" id="warp-intensity" min="30" max="150" value="100">
      </div>

      <!-- SRT 자막 파일 -->
      <div class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
      </div>

      <!-- 배경 음원 (선택) -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <!-- 직접 텍스트 입력 (SRT 없을 시) -->
      <div class="form-group">
        <label for="direct-text">직접 글 입력 (자막 미업로드 시 적용)</label>
        <textarea id="direct-text">하늘과 바람과
별과 시

내 모든 삶이
빛나는 형상이 되리라</textarea>
      </div>

      <!-- 동작 제어 -->
      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시화 시연 시작</button>
        <button class="btn-sub" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-panel">◀</div>

  <!-- 메인 뷰포트 -->
  <main id="viewport">
    <!-- 화면 정중앙 실시간 타이핑 왜곡 글자 -->
    <div id="center-stage">
      <div id="center-canvas-wrap"></div>
    </div>

    <!-- 완성될 시화 화폭 (족자) -->
    <div id="poem-scroll">
      <div id="scroll-content"></div>
      <div id="red-seal">千古<br>詩心</div>
    </div>

    <!-- 재생 진행바 -->
    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 2D 메쉬 왜곡 기형(FFD) 수학적 알고리즘
       입력: 사각 영역 (u, v) ∈ [-1, 1]
       출력: 선택된 형상의 윤곽으로 휘어진 (x', y')
       ------------------------------------------------------------- */
    const ShapeDeformers = {
      // 1. 손바닥 (Hand): 하단 손목, 엄지손가락 돌출, 상단 4개 손가락 봉우리
      hand: (u, v, strength) => {
        let x = u;
        let y = v;

        // 하단 손목 수축 (v: -1 -> -0.3)
        if (v < -0.3) {
          const wristFactor = 0.45 + 0.55 * ((v + 1) / 0.7);
          x *= wristFactor;
        }

        // 상단 손가락 4개 분기 (v: 0.1 -> 1.0)
        if (v > 0.1) {
          const fingerHeight = 
            0.22 * Math.sin((u + 0.9) * 4.2) + 
            0.15 * Math.cos((u - 0.2) * 5.0);
          y += fingerHeight * Math.pow((v - 0.1) / 0.9, 1.5) * strength;
        }

        // 좌측 엄지손가락 외곽 확장 (u < -0.2 && v: -0.3 ~ 0.4)
        if (u < -0.1 && v > -0.4 && v < 0.35) {
          const thumbPush = Math.sin(((v + 0.4) / 0.75) * Math.PI) * 0.42 * strength;
          x -= thumbPush;
        }

        return { x: x * 0.9, y: y * 0.9 };
      },

      // 2. 별 (Star): 5개 꼭짓점 반경 모듈레이션
      star: (u, v, strength) => {
        const r = Math.sqrt(u * u + v * v);
        const theta = Math.atan2(v, u);

        // 5각 별 반경 수식
        const starMod = 0.55 + 0.45 * Math.pow(Math.max(0, Math.cos(5 * theta - Math.PI / 2)), 1.2);
        const targetR = r * (1 + (starMod - 0.7) * 1.3 * strength);

        return {
          x: targetR * Math.cos(theta),
          y: targetR * Math.sin(theta)
        };
      },

      // 3. 타원 (Oval): 스퀘어클 -> 타원 매핑
      oval: (u, v, strength) => {
        const s = strength;
        const x = u * Math.sqrt(Math.max(0, 1 - (v * v) / 2)) * (0.85 + 0.15 * (1 - s));
        const y = v * Math.sqrt(Math.max(0, 1 - (u * u) / 2)) * 1.25;
        return { x, y };
      },

      // 4. 전서 사각 (Seal Rect): 인장 돌의 볼록한 테두리와 귀접이(Chamfer)
      rect: (u, v, strength) => {
        const p = 0.18 * strength;
        const x = u * (1 - p * (v * v));
        const y = v * (1 - p * (u * u));
        return { x: x * 0.92, y: y * 0.92 };
      },

      // 5. 하트 (Heart): 상단 파임 홈과 하단 뾰족한 끝
      heart: (u, v, strength) => {
        let x = u * (1 - 0.35 * (v + 1) * 0.5);
        let y = v;

        // 상단 V자 파임
        if (v > 0) {
          y -= Math.pow(1 - Math.abs(u), 1.8) * 0.45 * strength;
        }
        // 하단 뾰족한 모서리
        if (v < 0) {
          x *= (1 + v * 0.65 * strength);
        }

        return { x: x * 0.95, y: y * 1.05 };
      }
    };

    /* -------------------------------------------------------------
       2. 오프스크린 삼각 메쉬 왜곡 렌더러 (텍스처 베이킹)
       ------------------------------------------------------------- */
    function renderWarpedGlyphCanvas(char, shapeKey, intensity, targetSize = 240) {
      const srcCanvas = document.createElement('canvas');
      const srcSize = 256;
      srcCanvas.width = srcSize;
      srcCanvas.height = srcSize;
      const sctx = srcCanvas.getContext('2d');

      // 1. 일반 폰트로 텍스처 소스 생성 (완전한 붓글씨)
      sctx.fillStyle = '#111113';
      sctx.font = `bold ${srcSize * 0.72}px 'Nanum Brush Script', cursive`;
      sctx.textAlign = 'center';
      sctx.textBaseline = 'middle';
      sctx.fillText(char, srcSize / 2, srcSize / 2);

      // 2. 출력용 왜곡 캔버스 생성
      const dstCanvas = document.createElement('canvas');
      dstCanvas.width = targetSize;
      dstCanvas.height = targetSize;
      const dctx = dstCanvas.getContext('2d');

      const gridN = 14; // 메쉬 격자 밀도
      const deformer = ShapeDeformers[shapeKey] || ShapeDeformers.hand;
      const strength = intensity / 100;

      // 격자 정점 생성
      const vertices = [];
      for (let j = 0; j <= gridN; j++) {
        const row = [];
        const vNorm = (j / gridN) * 2 - 1; // -1 ~ 1 (아래에서 위로)
        for (let i = 0; i <= gridN; i++) {
          const uNorm = (i / gridN) * 2 - 1; // -1 ~ 1 (좌에서 우로)
          
          // 형상 왜곡 좌표 연산
          const deformed = deformer(uNorm, -vNorm, strength); // 캔버스 y축 반전 고려

          row.push({
            u: (i / gridN) * srcSize,
            v: (j / gridN) * srcSize,
            x: (deformed.x * 0.45 + 0.5) * targetSize,
            y: (deformed.y * 0.45 + 0.5) * targetSize
          });
        }
        vertices.push(row);
      }

      // 3. 아핀 변환 삼각 분할 렌더링
      for (let j = 0; j < gridN; j++) {
        for (let i = 0; i < gridN; i++) {
          const p00 = vertices[j][i];
          const p10 = vertices[j][i + 1];
          const p01 = vertices[j + 1][i];
          const p11 = vertices[j + 1][i + 1];

          drawTexturedTriangle(dctx, srcCanvas, p00, p10, p01);
          drawTexturedTriangle(dctx, srcCanvas, p10, p11, p01);
        }
      }

      return dstCanvas;
    }

    // Canvas 2D 아핀 변환을 통한 텍스처 삼각형 매핑
    function drawTexturedTriangle(ctx, img, p0, p1, p2) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.closePath();
      ctx.clip();

      const denom = (p0.u * (p1.v - p2.v) - p1.u * (p0.v - p2.v) + p2.u * (p0.v - p1.v));
      if (Math.abs(denom) > 0.001) {
        const a = -(p0.v * (p1.x - p2.x) - p1.v * (p0.x - p2.x) + p2.v * (p0.x - p1.x)) / denom;
        const b = (p0.u * (p1.x - p2.x) - p1.u * (p0.x - p2.x) + p2.u * (p0.x - p1.x)) / denom;
        const c = (p0.u * (p1.v * p2.x - p2.v * p1.x) - p1.u * (p0.v * p2.x - p2.v * p0.x) + p2.u * (p0.v * p1.x - p1.v * p0.x)) / denom;

        const d = -(p0.v * (p1.y - p2.y) - p1.v * (p0.y - p2.y) + p2.v * (p0.y - p1.y)) / denom;
        const e = (p0.u * (p1.y - p2.y) - p1.u * (p0.y - p2.y) + p2.u * (p0.y - p1.y)) / denom;
        const f = (p0.u * (p1.v * p2.y - p2.v * p1.y) - p1.u * (p0.v * p2.y - p2.v * p0.y) + p2.u * (p0.v * p1.y - p1.v * p0.y)) / denom;

        ctx.transform(a, d, b, e, c, f);
        ctx.drawImage(img, 0, 0);
      }
      ctx.restore();
    }

    /* -------------------------------------------------------------
       3. 시화 타임라인 및 SRT 데이터 관리
       ------------------------------------------------------------- */
    const shapeTypeSelect = document.getElementById('shape-type');
    const warpIntensityInput = document.getElementById('warp-intensity');
    const warpValLabel = document.getElementById('warp-val');
    const srtInput = document.getElementById('srt-input');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');
    const directTextInput = document.getElementById('direct-text');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const poemScroll = document.getElementById('poem-scroll');
    const centerWrap = document.getElementById('center-canvas-wrap');

    let timelineEvents = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let currentActiveIdx = -1;

    // SRT 파서
    function parseSRT(text) {
      const regex = /(\d+)\s*\n(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s*\n([\s\S]*?)(?=\n\s*\n|\s*$)/g;
      const cues = [];
      let m;

      function toMs(t) {
        const p = t.replace(',', '.').split(':');
        return (parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2])) * 1000;
      }

      while ((m = regex.exec(text)) !== null) {
        cues.push({
          start: toMs(m[2]),
          end: toMs(m[3]),
          text: m[4].replace(/\r/g, '').trim()
        });
      }
      return cues;
    }

    // 시화 데이터 구성 및 왜곡 글자 캔버스 베이킹
    function prepareVisualization() {
      stopPlayback();
      scrollContent.innerHTML = '';
      centerWrap.innerHTML = '';
      centerWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      timelineEvents = [];

      const shape = shapeTypeSelect.value;
      const intensity = parseFloat(warpIntensityInput.value);

      let lines = [];
      let isFromSRT = false;

      if (srtInput.files.length > 0 && srtCuesData.length > 0) {
        isFromSRT = true;
        // SRT 자막 줄 단위 구성
        lines = srtCuesData.map(c => c.text);
      } else {
        // 직접 입력 텍스트 행 분리
        lines = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
      }

      let globalCharIndex = 0;
      const defaultCharInterval = 280;

      // 시화 화폭에 각 행과 글자 요소 DOM 구축
      lines.forEach((lineText, lineIdx) => {
        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const chars = lineText.split('');
        chars.forEach((char) => {
          if (char === ' ') {
            const space = document.createElement('div');
            space.style.width = '18px';
            lineRow.appendChild(space);
            return;
          }

          // 해당 글자를 지정된 형상으로 완전히 왜곡시킨 캔버스 베이킹
          const bakedCanvas = renderWarpedGlyphCanvas(char, shape, intensity, 120);
          bakedCanvas.className = 'word-glyph';
          lineRow.appendChild(bakedCanvas);

          // 타이밍 계산
          let triggerTime = 0;
          if (isFromSRT) {
            const cue = srtCuesData[lineIdx];
            const lineDuration = cue.end - cue.start;
            triggerTime = cue.start + (chars.indexOf(char) / chars.length) * lineDuration;
          } else {
            triggerTime = globalCharIndex * defaultCharInterval;
          }

          timelineEvents.push({
            index: globalCharIndex,
            char: char,
            element: bakedCanvas,
            triggerTime: triggerTime,
            shape: shape,
            intensity: intensity,
            landed: false
          });

          globalCharIndex++;
        });

        scrollContent.appendChild(lineRow);
      });

      if (timelineEvents.length > 0) {
        if (isFromSRT) {
          totalDurationMs = srtCuesData[srtCuesData.length - 1].end + 1200;
        } else {
          totalDurationMs = globalCharIndex * defaultCharInterval + 2500;
        }
      }

      timeSlider.max = totalDurationMs;
      updateTime(0);
    }

    let srtCuesData = [];
    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCuesData = parseSRT(evt.target.result);
        prepareVisualization();
      };
      reader.readAsText(file, 'utf-8');
    });

    /* -------------------------------------------------------------
       4. 재생 루프 및 타이핑 애니메이션 연출
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let activeEvt = null;

      for (let i = 0; i < timelineEvents.length; i++) {
        const ev = timelineEvents[i];
        if (currMs >= ev.triggerTime) {
          if (!ev.landed) {
            ev.element.classList.add('landed');
            ev.landed = true;
          }
          // 최근 600ms 이내에 트리거된 글자를 중앙 활성 포커스로 설정
          if (currMs - ev.triggerTime < 750) {
            activeEvt = ev;
          }
        } else {
          if (ev.landed) {
            ev.element.classList.remove('landed');
            ev.landed = false;
          }
        }
      }

      // 화면 중앙 왜곡 글자 캘리그라피 연출
      if (activeEvt) {
        if (currentActiveIdx !== activeEvt.index) {
          currentActiveIdx = activeEvt.index;
          centerWrap.innerHTML = '';

          // 중앙에 크게 보일 왜곡 캔버스 베이킹 (260px)
          const largeCanvas = renderWarpedGlyphCanvas(
            activeEvt.char, 
            activeEvt.shape, 
            activeEvt.intensity, 
            260
          );
          centerWrap.appendChild(largeCanvas);

          centerWrap.classList.remove('active');
          void centerWrap.offsetWidth; // Reflow
          centerWrap.classList.add('active');
        }
      } else {
        centerWrap.classList.remove('active');
        currentActiveIdx = -1;
      }

      // 마지막에 도달하면 중앙 포커스를 닫고 시화 족자 및 낙관 완성
      if (currMs >= totalDurationMs - 1200) {
        poemScroll.classList.add('completed');
        centerWrap.classList.remove('active');
      } else {
        poemScroll.classList.remove('completed');
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (timelineEvents.length === 0) prepareVisualization();
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시화 시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       5. 컨트롤러 이벤트 리스너
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      prepareVisualization();
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    shapeTypeSelect.addEventListener('change', prepareVisualization);
    warpIntensityInput.addEventListener('input', (e) => {
      warpValLabel.textContent = `${e.target.value}%`;
      prepareVisualization();
    });

    directTextInput.addEventListener('input', () => {
      if (srtInput.files.length === 0) prepareVisualization();
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    // 사이드바 토글
    const panel = document.getElementById('control-panel');
    const toggleBtn = document.getElementById('toggle-panel');
    toggleBtn.addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      toggleBtn.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
    });

    // 초기 로딩 시 빌드
    window.addEventListener('DOMContentLoaded', () => {
      prepareVisualization();
      updateFrame(0);
    });
  </script>
</body>
</html>
