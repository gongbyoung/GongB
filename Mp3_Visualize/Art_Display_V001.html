<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 詩畫 손가락 캘리그라피 타이포그래피 생성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #c0292b;
      --paper-cream: #f4edd9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 설정 사이드바 */
    #sidebar {
      width: 440px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-440px);
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .apply-action-box {
      background: #191c28;
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }

    button.btn-apply {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 800;
      font-size: 0.98rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    button.btn-apply:hover:not(:disabled) {
      background: #ebd274;
      transform: translateY(-1px);
    }

    button.btn-apply:disabled {
      background: #444a59;
      color: #8f96a8;
      cursor: not-allowed;
    }

    #apply-status-text {
      font-size: 0.8rem;
      text-align: center;
      color: #a2a8ba;
    }

    .form-group label {
      font-size: 0.84rem;
      color: #a2a8ba;
      margin-bottom: 5px;
      display: block;
      font-weight: bold;
    }

    select, textarea, input[type="file"], button {
      width: 100%;
      padding: 9px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .slider-number-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-number-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .slider-number-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      background: #1b1e2a;
      border: 1px solid #333a4d;
      border-radius: 6px;
      color: var(--accent-gold);
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: bold;
      text-align: right;
      outline: none;
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.76rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover:not(:disabled) {
      background: #ebd274;
    }

    button.btn-primary:disabled {
      background: #444a59;
      color: #777;
      cursor: not-allowed;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 440px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 뷰포트 반응형 스케일러 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 고정 화폭 */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 80px 120px;
    }

    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 120px 80px;
    }

    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 100%;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scroll-line.landed {
      opacity: 1;
      transform: scale(1);
    }

    /* 단어별 래퍼 */
    .word-group {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* 글자 기본: 흐린 회색 비활성화 */
    .scroll-line .word-glyph {
      display: inline-block;
      flex-shrink: 0;
      filter: grayscale(100%) opacity(30%);
      transition: filter 1.2s ease, transform 0.8s ease;
    }

    /* 마지막 자막 완료 시: 선명한 살결 및 먹선 트랜지션 */
    #poem-scroll.completed .scroll-line .word-glyph {
      filter: grayscale(0%) opacity(100%) drop-shadow(3px 6px 12px rgba(0, 0, 0, 0.35));
    }

    #poem-scroll.completed {
      box-shadow: 0 0 100px rgba(212, 175, 55, 0.5), inset 0 0 140px rgba(150, 130, 90, 0.3);
    }

    /* 화면 중앙 실시간 타이핑 포커스 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-focus-wrap {
      padding: 24px 44px;
      border-radius: 18px;
      background: rgba(244, 237, 217, 0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 75px rgba(212, 175, 55, 0.5);
      opacity: 0;
      transform: scale(0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-focus-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 낙관 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.94;
      transform: scale(1) rotate(0deg);
    }

    /* 타임라인 바 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 설정 적용 액션 박스 -->
      <div class="apply-action-box">
        <button class="btn-apply" id="btn-apply">⚡ 설정 적용 및 2K 렌더링</button>
        <div id="apply-status-text">설정을 조절한 후 버튼을 누르면 일괄 반영됩니다.</div>
      </div>

      <!-- 캔버스 규격 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 해상도)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- 손가락 스타일 단일 옵션 -->
      <div class="form-group">
        <label for="finger-style-select">손가락 캘리그램 스타일</label>
        <select id="finger-style-select">
          <option value="slender" selected>섬섬옥수 (가늘고 우아한 수인 서예)</option>
          <option value="chubby">통통한 손 (도톰하고 묵직한 살결 손)</option>
        </select>
      </div>

      <!-- 획 굵기 조정 -->
      <div class="form-group">
        <label>획 굵기 조정</label>
        <div class="slider-number-row">
          <input type="range" id="stroke-width-range" min="3" max="22" value="9">
          <input type="number" id="stroke-width-num" min="3" max="22" value="9">
        </div>
      </div>

      <!-- 글자 크기 배율 -->
      <div class="form-group">
        <label>기본 글자 크기 배율 (%)</label>
        <div class="slider-number-row">
          <input type="range" id="glyph-scale-range" min="40" max="150" value="90">
          <input type="number" id="glyph-scale-num" min="40" max="150" value="90">
        </div>
      </div>

      <!-- 캘리그라피 강조 효과 -->
      <div class="form-group">
        <label for="emphasis-mode">캘리그라피 강조 효과 (단어 크기 변화)</label>
        <select id="emphasis-mode">
          <option value="none" selected>없음 (균일한 크기)</option>
          <option value="random">랜덤 단어 강조</option>
          <option value="first">문장 첫 단어 강조</option>
          <option value="last">문장 마지막 단어 강조</option>
        </select>
      </div>
      <div class="form-group">
        <label>강조 단어 확대 배율 (배)</label>
        <div class="slider-number-row">
          <input type="range" id="emphasis-scale-range" min="1.0" max="1.8" value="1.2" step="0.1">
          <input type="number" id="emphasis-scale-num" min="1.0" max="1.8" value="1.2" step="0.1">
        </div>
      </div>

      <!-- 자간 / 줄간격 조정 -->
      <div class="form-group">
        <label>자간 (글자 사이 간격, px)</label>
        <div class="slider-number-row">
          <input type="range" id="letter-spacing-range" min="-2" max="20" value="6">
          <input type="number" id="letter-spacing-num" min="-2" max="20" value="6">
        </div>
      </div>

      <div class="form-group">
        <label>줄간격 (문장 사이 간격, px)</label>
        <div class="slider-number-row">
          <input type="range" id="line-spacing-range" min="10" max="60" value="20">
          <input type="number" id="line-spacing-num" min="10" max="60" value="20">
        </div>
      </div>

      <!-- 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (한 줄이 한 문장)</label>
        <textarea id="direct-text">한없이 나가는 눈길은
수평선 저쪽까지
깃폭처럼 퍼덕인다</textarea>
      </div>

      <!-- 배경 음악 -->
      <div class="file-box">
        <label for="audio-input">bg 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <main id="viewport">
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <div id="scroll-content"></div>
        <div id="red-seal">千古<br>詩心</div>

        <div id="center-stage">
          <div id="center-focus-wrap"></div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    function bindSliderNumberLight(rangeId, numId) {
      const rangeEl = document.getElementById(rangeId);
      const numEl = document.getElementById(numId);
      rangeEl.addEventListener('input', () => { numEl.value = rangeEl.value; });
      numEl.addEventListener('input', () => { rangeEl.value = numEl.value; });
    }
    bindSliderNumberLight('glyph-scale-range', 'glyph-scale-num');
    bindSliderNumberLight('stroke-width-range', 'stroke-width-num');
    bindSliderNumberLight('emphasis-scale-range', 'emphasis-scale-num');
    bindSliderNumberLight('letter-spacing-range', 'letter-spacing-num');
    bindSliderNumberLight('line-spacing-range', 'line-spacing-num');

    /* -------------------------------------------------------------
       [팔뚝~손가락 + 손바닥 오각형 수인 버전] 캘리그램 렌더러
       - '통통한 손'과 '섬섬옥수' 가독성 최적화 및 뭉침 방지
       ------------------------------------------------------------- */
    function renderHandCalligramGlyph(char, targetSize, options) {
      const { fingerStyle, customStrokeWidth } = options;
      const isChubby = (fingerStyle === 'chubby');
      const baseSize = 256;
      
      // 통통한 손일 때 획이 너무 두꺼워져서 뭉개지는 현상을 방지하도록 안전 범위 설정
      let strokeVal = customStrokeWidth !== undefined ? customStrokeWidth : (isChubby ? 11 : 8);
      if (isChubby && strokeVal > 14) strokeVal = 14;

      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      // 1. 뼈대 서예 렌더링
      const tmp = document.createElement('canvas');
      tmp.width = baseSize; tmp.height = baseSize;
      const tctx = tmp.getContext('2d');

      tctx.textAlign = 'center';
      tctx.textBaseline = 'middle';
      tctx.font = `bold ${baseSize * 0.72}px 'Nanum Brush Script', cursive`;

      tctx.lineWidth = strokeVal;
      tctx.strokeStyle = '#000000';
      tctx.lineJoin = 'round';
      tctx.lineCap = 'round';
      tctx.strokeText(char, baseSize / 2, baseSize / 2);
      tctx.fillStyle = '#000000';
      tctx.fillText(char, baseSize / 2, baseSize / 2);

      // 2. 살결 그라데이션 채색 마스크
      const skinCanvas = document.createElement('canvas');
      skinCanvas.width = baseSize; skinCanvas.height = baseSize;
      const sctx = skinCanvas.getContext('2d');
      sctx.drawImage(tmp, 0, 0);
      sctx.globalCompositeOperation = 'source-in';

      const skinGrad = sctx.createLinearGradient(0, 0, baseSize, baseSize);
      if (isChubby) {
        // 통통한 손은 좀 더 도톰하고 부드러운 살결 톤
        skinGrad.addColorStop(0, '#ffebd0');
        skinGrad.addColorStop(0.5, '#f5cca8');
        skinGrad.addColorStop(1, '#e2ab86');
      } else {
        // 섬섬옥수는 우아한 연한 살결 톤
        skinGrad.addColorStop(0, '#fdebd0');
        skinGrad.addColorStop(0.5, '#edd1be');
        skinGrad.addColorStop(1, '#d8ad93');
      }
      sctx.fillStyle = skinGrad;
      sctx.fillRect(0, 0, baseSize, baseSize);

      // 3. 수묵 먹선 윤곽 및 살결 합성
      const outCanvas = document.createElement('canvas');
      outCanvas.width = baseSize; outCanvas.height = baseSize;
      const octx = outCanvas.getContext('2d');

      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.font = `bold ${baseSize * 0.72}px 'Nanum Brush Script', cursive`;
      octx.lineWidth = strokeVal + (isChubby ? 2.0 : 2.5);
      octx.strokeStyle = '#22150e';
      octx.lineJoin = 'round';
      octx.lineCap = 'round';
      octx.strokeText(char, baseSize / 2, baseSize / 2);
      octx.drawImage(skinCanvas, 0, 0);

      // 4. 'ㅇ', 'ㅎ' 및 동그란 자소 형태는 손바닥을 모은 수인 형태로 렌더링
      if (char === 'ㅇ' || char === 'ㅎ' || char === '이' || char === '한') {
        const cx = baseSize / 2, cy = baseSize * 0.55;
        const radius = baseSize * 0.24;

        octx.save();
        octx.beginPath();
        octx.arc(cx, cy, radius * 1.15, 0, Math.PI * 2);
        octx.clip();
        octx.clearRect(0, 0, baseSize, baseSize);
        octx.restore();

        octx.save();
        octx.beginPath();
        octx.moveTo(cx, cy - radius);
        octx.lineTo(cx + radius * 0.8, cy - radius * 0.4);
        octx.lineTo(cx + radius * 0.6, cy + radius * 0.8);
        octx.lineTo(cx - radius * 0.6, cy + radius * 0.8);
        octx.lineTo(cx - radius * 0.8, cy - radius * 0.4);
        octx.closePath();

        octx.fillStyle = skinGrad;
        octx.fill();
        octx.strokeStyle = '#22150e';
        octx.lineWidth = 2.2;
        octx.stroke();

        octx.strokeStyle = 'rgba(120, 80, 60, 0.4)';
        octx.lineWidth = 1.3;
        octx.beginPath();
        octx.moveTo(cx - radius * 0.3, cy - radius * 0.2);
        octx.quadraticCurveTo(cx, cy, cx + radius * 0.3, cy - radius * 0.2);
        octx.stroke();

        octx.restore();
      }

      ctx.drawImage(outCanvas, 0, 0, targetSize, targetSize);
      return canvas;
    }

    /* -------------------------------------------------------------
       SRT 파서 및 2K 반응형 스케일러
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join(' ').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      if (ratioSelect.value === '16:9') {
        canvas2KWidth = 2560; canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440; canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      scaler.style.transform = `scale(${Math.min(scaleX, scaleY, 1.0)})`;
    }

    window.addEventListener('resize', updateViewportScale);

    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const fingerStyleSelect = document.getElementById('finger-style-select');

    const btnApply = document.getElementById('btn-apply');
    const applyStatusText = document.getElementById('apply-status-text');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const centerFocusWrap = document.getElementById('center-focus-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt';
    let srtCues = [];
    let cueTimelineEvents = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let activeCueIdx = -1;

    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      applyStatusText.textContent = "자막 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      applyStatusText.textContent = "직접 입력 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          applyStatusText.textContent = `자막 ${srtCues.length}개 준비됨. [적용 버튼]을 누르세요.`;
          currentMode = 'srt';
          tabSrt.classList.add('active');
          tabDirect.classList.remove('active');
          sectionSrt.style.display = 'block';
          sectionDirect.style.display = 'none';
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 형식을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    function getOptions() {
      return {
        fingerStyle: fingerStyleSelect.value,
        customStrokeWidth: parseFloat(document.getElementById('stroke-width-range').value),
        emphasisMode: document.getElementById('emphasis-mode').value,
        emphasisScale: parseFloat(document.getElementById('emphasis-scale-range').value),
        letterSpacing: parseInt(document.getElementById('letter-spacing-range').value, 10),
        lineSpacing: parseInt(document.getElementById('line-spacing-range').value, 10)
      };
    }

    async function executeBuildVisualization() {
      stopPlayback();
      applyCanvasResolution();

      btnApply.disabled = true;
      btnPlay.disabled = true;
      btnReset.disabled = true;
      btnApply.textContent = "⏳ 2K 렌더링 진행 중...";
      applyStatusText.textContent = "팔뚝부터 손끝까지의 수묵 캘리그램을 2K 화폭에 렌더링 중입니다...";

      await new Promise(resolve => setTimeout(resolve, 50));

      scrollContent.innerHTML = '';
      centerFocusWrap.innerHTML = '';
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      cueTimelineEvents = [];

      const options = getOptions();
      const scaleMultiplier = parseFloat(document.getElementById('glyph-scale-range').value) / 100;

      let rawLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          rawLines = [
            { start: 0, end: 3200, text: "한없이 나가는 눈길은" },
            { start: 3200, end: 6400, text: "수평선 저쪽까지" },
            { start: 6400, end: 9600, text: "깃폭처럼 퍼덕인다" }
          ];
        } else {
          rawLines = srtCues;
        }
      } else {
        const textArr = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
        const interval = 3000;
        rawLines = textArr.map((t, idx) => ({
          start: idx * interval,
          end: (idx + 1) * interval,
          text: t
        }));
      }

      const safeW = canvas2KWidth * 0.78; // 여유 공간 확보 (화면 밖 나감 방지)
      const baseGlyphSize = Math.floor(95 * scaleMultiplier);
      scrollContent.style.gap = `${options.lineSpacing}px`;

      for (let idx = 0; idx < rawLines.length; idx++) {
        const cueData = rawLines[idx];
        applyStatusText.textContent = `렌더링 진행 중: (${idx + 1} / ${rawLines.length}) 자막 행 생성 중...`;

        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const words = cueData.text.split(/\s+/).filter(w => w.length > 0);
        
        let targetEmphasisIdx = -1;
        if (options.emphasisMode === 'random' && words.length > 0) {
          targetEmphasisIdx = Math.floor(Math.random() * words.length);
        } else if (options.emphasisMode === 'first' && words.length > 0) {
          targetEmphasisIdx = 0;
        } else if (options.emphasisMode === 'last' && words.length > 0) {
          targetEmphasisIdx = words.length - 1;
        }

        let currentLineWidth = 0;
        let currentWordGroup = document.createElement('div');
        currentWordGroup.className = 'word-group';
        currentWordGroup.style.gap = `${options.letterSpacing}px`;
        lineRow.appendChild(currentWordGroup);

        words.forEach((word, wIdx) => {
          const isEmphasized = (wIdx === targetEmphasisIdx);
          const currentWordFactor = isEmphasized ? options.emphasisScale : 1.0;
          const wordGlyphs = [];

          word.split('').forEach(ch => {
            const gSize = Math.floor(baseGlyphSize * currentWordFactor);
            const gCanvas = renderHandCalligramGlyph(ch, Math.floor(gSize * 1.25), options);
            gCanvas.className = 'word-glyph';
            gCanvas.style.width = `${gSize}px`;
            gCanvas.style.height = `${gSize}px`;
            wordGlyphs.push({ canvas: gCanvas, size: gSize });
          });

          const wordApproxWidth = word.length * (baseGlyphSize * currentWordFactor) + (word.length - 1) * options.letterSpacing;

          // 폭 초과 시 다음 줄로 확실히 개행
          if (currentLineWidth + wordApproxWidth > safeW && currentWordGroup.children.length > 0) {
            const newLineRow = document.createElement('div');
            newLineRow.className = 'scroll-line';
            scrollContent.appendChild(newLineRow);

            currentWordGroup = document.createElement('div');
            currentWordGroup.className = 'word-group';
            currentWordGroup.style.gap = `${options.letterSpacing}px`;
            newLineRow.appendChild(currentWordGroup);
            currentLineWidth = 0;
          }

          const wordWrapper = document.createElement('div');
          wordWrapper.className = 'word-group';
          wordWrapper.style.gap = `${options.letterSpacing}px`;
          wordGlyphs.forEach(wg => wordWrapper.appendChild(wg.canvas));

          const spaceEl = document.createElement('div');
          spaceEl.style.width = `${Math.floor(baseGlyphSize * 0.4)}px`;

          currentWordGroup.appendChild(wordWrapper);
          currentWordGroup.appendChild(spaceEl);
          currentLineWidth += wordApproxWidth + (baseGlyphSize * 0.4);
        });

        scrollContent.appendChild(lineRow);

        cueTimelineEvents.push({
          index: idx,
          text: cueData.text,
          start: cueData.start,
          end: cueData.end,
          element: lineRow,
          glyphSize: baseGlyphSize,
          options: options,
          landed: false
        });

        if (idx % 2 === 0) await new Promise(r => setTimeout(r, 15));
      }

      totalDurationMs = cueTimelineEvents[cueTimelineEvents.length - 1].end + 1200;
      timeSlider.max = totalDurationMs;
      timeSlider.value = 0;
      updateTime(0);

      btnApply.disabled = false;
      btnPlay.disabled = false;
      btnReset.disabled = false;
      btnApply.textContent = "⚡ 설정 적용 및 2K 렌더링";
      applyStatusText.textContent = `✓ 렌더링 완료 (${rawLines.length}개 자막 준비됨). [시연 시작]을 누르세요.`;
      applyStatusText.style.color = '#55db88';
      setTimeout(() => { applyStatusText.style.color = '#a2a8ba'; }, 3500);
    }

    btnApply.addEventListener('click', executeBuildVisualization);

    function updateFrame(currMs) {
      let currentCue = null;

      for (let i = 0; i < cueTimelineEvents.length; i++) {
        const cue = cueTimelineEvents[i];

        if (currMs >= cue.start) {
          if (!cue.landed) {
            cue.element.classList.add('landed');
            cue.landed = true;
          }
        } else {
          if (cue.landed) {
            cue.element.classList.remove('landed');
            cue.landed = false;
          }
        }

        if (currMs >= cue.start && currMs < cue.end) {
          currentCue = cue;
        }
      }

      if (currentCue) {
        if (activeCueIdx !== currentCue.index) {
          activeCueIdx = currentCue.index;
          centerFocusWrap.innerHTML = '';

          const centerSize = Math.min(180, Math.floor(currentCue.glyphSize * 1.55));
          const chars = currentCue.text.split('');
          chars.forEach(ch => {
            if (ch === ' ') {
              const sp = document.createElement('div');
              sp.style.width = `${Math.floor(centerSize * 0.45)}px`;
              centerFocusWrap.appendChild(sp);
              return;
            }
            const gCanvas = renderHandCalligramGlyph(ch, Math.floor(centerSize * 1.25), currentCue.options);
            gCanvas.style.width = `${centerSize}px`;
            gCanvas.style.height = `${centerSize}px`;
            gCanvas.style.filter = 'drop-shadow(3px 6px 10px rgba(0,0,0,0.35))';
            centerFocusWrap.appendChild(gCanvas);
          });

          centerFocusWrap.classList.remove('active');
          void centerFocusWrap.offsetWidth;
          centerFocusWrap.classList.add('active');
        }
      } else {
        centerFocusWrap.classList.remove('active');
        activeCueIdx = -1;
      }

      if (cueTimelineEvents.length > 0) {
        const lastCue = cueTimelineEvents[cueTimelineEvents.length - 1];
        if (currMs >= lastCue.end) {
          poemScroll.classList.add('completed');
          centerFocusWrap.classList.remove('active');
        } else {
          poemScroll.classList.remove('completed');
        }
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (cueTimelineEvents.length === 0) {
        executeBuildVisualization().then(() => startPlayback());
        return;
      }
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      for (let i = 0; i < cueTimelineEvents.length; i++) {
        cueTimelineEvents[i].element.classList.remove('landed');
        cueTimelineEvents[i].landed = false;
      }
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    window.addEventListener('DOMContentLoaded', () => {
      executeBuildVisualization();
    });
  </script>
</body>
</html>
