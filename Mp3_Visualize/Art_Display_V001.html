<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 詩畫 손바닥 캘리그라피 타이포그래피 생성기</title>
  <!-- 직각 전각 서체, 캘리그라피, 명조 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #c0292b;
      --paper-cream: #f4edd9;
      --ink-black: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 조작 사이드바 */
    #sidebar {
      width: 420px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-420px);
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* 설정 적용 액션 박스 */
    .apply-action-box {
      background: #191c28;
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }

    button.btn-apply {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 800;
      font-size: 0.98rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    button.btn-apply:hover:not(:disabled) {
      background: #ebd274;
      transform: translateY(-1px);
    }

    button.btn-apply:disabled {
      background: #444a59;
      color: #8f96a8;
      cursor: not-allowed;
    }

    #apply-status-text {
      font-size: 0.8rem;
      text-align: center;
      color: #a2a8ba;
    }

    .form-group label {
      font-size: 0.82rem;
      color: #a2a8ba;
      margin-bottom: 4px;
      display: block;
      font-weight: bold;
    }

    .slider-number-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-number-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .slider-number-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      background: #1b1e2a;
      border: 1px solid #333a4d;
      border-radius: 6px;
      color: var(--accent-gold);
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: bold;
      text-align: right;
      outline: none;
    }

    select, textarea, input[type="file"], button {
      width: 100%;
      padding: 8px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .control-sub-box {
      background: #171922;
      border: 1px solid #282e3d;
      border-radius: 6px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .control-sub-box .sub-title {
      font-size: 0.82rem;
      color: var(--accent-gold);
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #bbb;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.76rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover:not(:disabled) {
      background: #ebd274;
    }

    button.btn-primary:disabled {
      background: #444a59;
      color: #777;
      cursor: not-allowed;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 420px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 뷰포트 반응형 스케일러 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 고정 그림판 (화폭) */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 80px 120px;
    }

    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 120px 80px;
    }

    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scroll-line.landed {
      opacity: 1;
      transform: scale(1);
    }

    /* 박힌 글자 기본 상태: 흐린 회색 비활성화 톤 */
    .scroll-line .word-glyph {
      display: inline-block;
      flex-shrink: 0;
      filter: grayscale(100%) opacity(28%);
      transition: filter 1.2s ease, transform 0.8s ease;
    }

    /* 마지막 자막 박힌 후: 풀컬러(온화한 손바닥 색상/칠흑색) 트랜지션 */
    #poem-scroll.completed .scroll-line .word-glyph {
      filter: grayscale(0%) opacity(100%) drop-shadow(3px 6px 10px rgba(0, 0, 0, 0.35));
    }

    #poem-scroll.completed {
      box-shadow: 0 0 100px rgba(212, 175, 55, 0.5), inset 0 0 140px rgba(150, 130, 90, 0.3);
    }

    /* 화면 중앙 실시간 타이핑 포커스 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-focus-wrap {
      padding: 24px 44px;
      border-radius: 18px;
      background: rgba(244, 237, 217, 0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 75px rgba(212, 175, 55, 0.5);
      opacity: 0;
      transform: scale(0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-focus-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 낙관 인장 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.94;
      transform: scale(1) rotate(0deg);
    }

    /* 타임라인 바 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 설정 적용 액션 박스 -->
      <div class="apply-action-box">
        <button class="btn-apply" id="btn-apply">⚡ 설정 적용 및 2K 렌더링</button>
        <div id="apply-status-text">설정을 조절한 후 버튼을 누르면 일괄 반영됩니다.</div>
      </div>

      <!-- 캔버스 규격 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 해상도)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- 형상 선택 -->
      <div class="form-group">
        <label for="shape-type">시화 형상 스타일</label>
        <select id="shape-type">
          <option value="hand" selected>✋ 손바닥 일체형 폰트 (손목·손바닥 바탕 + 유기적 손가락)</option>
          <option value="star">★ 별 (갇힌 구멍 & 세로획 상단 정밀 각인)</option>
          <option value="oval">⬭ 와이드 타원 (가로로 뚱뚱한 2.2:1 뱃지 글자)</option>
          <option value="rect">■ 사각 인장 (전각 전서체 - 직각 꽉 채움)</option>
        </select>
      </div>

      <!-- [사각 인장 옵션] -->
      <div class="control-sub-box" id="box-seal-options" style="display: none;">
        <div class="sub-title">사각 인장 도장 전용 설정</div>
        <div class="form-group">
          <label for="seal-carve-mode">각법 (도장 형식)</label>
          <select id="seal-carve-mode">
            <option value="yang">양각 (陽刻 - 붉은 테두리 + 붉은 글자)</option>
            <option value="eum">음각 (陰刻 - 사각 덩어리 파내기, 여백 無)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="seal-color-mode">인장 색상</label>
          <select id="seal-color-mode">
            <option value="red">전통 주사위 인주 (朱肉, 붉은색)</option>
            <option value="black">수묵 먹물 (墨, 칠흑색)</option>
          </select>
        </div>
      </div>

      <!-- 1. 글자 크기 배율 -->
      <div class="form-group">
        <label>글자 크기 배율 (%)</label>
        <div class="slider-number-row">
          <input type="range" id="glyph-scale-range" min="50" max="180" value="100">
          <input type="number" id="glyph-scale-num" min="50" max="180" value="100">
        </div>
      </div>

      <!-- 2. 글자 필압 조절 -->
      <div class="control-sub-box">
        <div class="sub-title">글자 획 두께 조절</div>
        <div class="form-group">
          <label>손바닥 볼륨 / 획 두께 (px)</label>
          <div class="slider-number-row">
            <input type="range" id="text-stroke-range" min="0" max="14" value="4" step="0.5">
            <input type="number" id="text-stroke-num" min="0" max="14" value="4" step="0.5">
          </div>
        </div>
      </div>

      <!-- 3. 테두리 점선 가이드 설정 -->
      <div class="control-sub-box">
        <div class="sub-title">형상 테두리 가이드 설정</div>
        <label class="checkbox-row">
          <input type="checkbox" id="show-outline" checked>
          <span>형상 외곽선(점선) 표시 (끄면 글자만 보임)</span>
        </label>
      </div>

      <!-- 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (한 줄이 한 문장)</label>
        <textarea id="direct-text">바다
바람이 분다
시간은 흘러간다</textarea>
      </div>

      <!-- 배경 음악 -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <main id="viewport">
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <div id="scroll-content"></div>
        <div id="red-seal">千古<br>詩心</div>

        <div id="center-stage">
          <div id="center-focus-wrap"></div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 슬라이더 <-> 숫자 인풋 가벼운 동기화
       ------------------------------------------------------------- */
    function bindSliderNumberLight(rangeId, numId) {
      const rangeEl = document.getElementById(rangeId);
      const numEl = document.getElementById(numId);
      rangeEl.addEventListener('input', () => { numEl.value = rangeEl.value; });
      numEl.addEventListener('input', () => { rangeEl.value = numEl.value; });
    }
    bindSliderNumberLight('glyph-scale-range', 'glyph-scale-num');
    bindSliderNumberLight('text-stroke-range', 'text-stroke-num');

    function createPRNG(seed) {
      let s = seed;
      return function() {
        const x = Math.sin(s++) * 10000;
        return x - Math.floor(x);
      };
    }

    /* -------------------------------------------------------------
       2. [핵심] 자연스러운 손바닥 일체형 렌더러 (No Severed Fingers)
       기저에 손목-손바닥 살이 받치고, 그 위로 손가락이 유기적으로 이어짐
       ------------------------------------------------------------- */

    // [손바닥 베이스 렌더링]: 손목과 도톰한 손바닥 면
    function drawPalmBase(ctx, x, y, w, h) {
      ctx.save();
      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#f9dfcf');
      grad.addColorStop(0.5, '#edd0be');
      grad.addColorStop(1, '#dbad93');

      ctx.beginPath();
      // 손목에서 시작해 둥근 손바닥 살을 형성
      ctx.moveTo(x + w * 0.25, y + h);
      ctx.bezierCurveTo(x - w * 0.05, y + h * 0.75, x + w * 0.05, y + h * 0.25, x + w * 0.35, y + h * 0.15);
      ctx.bezierCurveTo(x + w * 0.65, y + h * 0.1, x + w * 0.95, y + h * 0.35, x + w * 0.9, y + h * 0.75);
      ctx.bezierCurveTo(x + w * 0.85, y + h * 0.95, x + w * 0.75, y + h, x + w * 0.55, y + h);
      ctx.closePath();

      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = '#261914';
      ctx.lineWidth = Math.max(2.2, w * 0.05);
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 단정한 손바닥 손금선 (자연스러운 2줄 라인)
      ctx.strokeStyle = '#c68d71';
      ctx.lineWidth = Math.max(1.4, w * 0.03);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.25, y + h * 0.45);
      ctx.bezierCurveTo(x + w * 0.45, y + h * 0.55, x + w * 0.65, y + h * 0.45, x + w * 0.75, y + h * 0.35);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + w * 0.30, y + h * 0.65);
      ctx.bezierCurveTo(x + w * 0.50, y + h * 0.70, x + w * 0.70, y + h * 0.60, x + w * 0.80, y + h * 0.55);
      ctx.stroke();

      ctx.restore();
    }

    // [손바닥과 매끄럽게 연결되는 유기적 손가락 획 (절단면 없음)]
    function drawConnectedFinger(ctx, p1, p2, width, showNail = true) {
      ctx.save();
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 1) { ctx.restore(); return; }

      const angle = Math.atan2(dy, dx);
      ctx.translate(p1.x, p1.y);
      ctx.rotate(angle);

      const r = width * 0.5;
      const grad = ctx.createLinearGradient(0, -r, 0, r);
      grad.addColorStop(0, '#fce4d6');
      grad.addColorStop(0.5, '#edd0be');
      grad.addColorStop(1, '#dbad93');

      ctx.beginPath();
      // 손바닥에서 부드럽게 퍼져나오는 밑동 (절단선 없이 유기적으로 퍼짐)
      ctx.moveTo(0, -r * 1.15);
      ctx.bezierCurveTo(len * 0.35, -r * 0.95, len * 0.75, -r * 0.85, len - r, -r * 0.7);
      ctx.arc(len - r, 0, r * 0.7, -Math.PI / 2, Math.PI / 2);
      ctx.bezierCurveTo(len * 0.75, r * 0.85, len * 0.35, r * 0.95, 0, r * 1.15);
      ctx.closePath();

      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = '#261914';
      ctx.lineWidth = Math.max(2.2, width * 0.13);
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 단정한 둥근 손톱
      if (showNail) {
        ctx.save();
        const nailL = width * 0.48;
        const nailW = width * 0.38;
        const nailX = len - r - nailL * 0.15;

        ctx.beginPath();
        ctx.ellipse(nailX, 0, nailL * 0.42, nailW * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff9f2';
        ctx.fill();
        ctx.strokeStyle = '#261914';
        ctx.lineWidth = Math.max(1.3, width * 0.08);
        ctx.stroke();
        ctx.restore();
      }

      // 징그럽지 않은 은은한 마디선 1개
      ctx.strokeStyle = '#261914';
      ctx.lineWidth = Math.max(1.3, width * 0.08);
      ctx.beginPath();
      ctx.arc(len * 0.55, 0, r * 0.55, -Math.PI / 3, Math.PI / 3);
      ctx.stroke();

      ctx.restore();
    }

    // [두 손 모은 'ㅇ' 자형]: 손목과 두 손바닥이 온전히 마주 닿아 따뜻한 원을 형성
    function drawCuppedHands(ctx, cx, cy, rx, ry, strokeWidth) {
      ctx.save();
      const gradL = ctx.createLinearGradient(cx - rx * 1.5, cy, cx, cy);
      gradL.addColorStop(0, '#dbad93');
      gradL.addColorStop(0.6, '#edd0be');
      gradL.addColorStop(1, '#f9dfcf');

      // 좌측 손바닥 & 손
      ctx.beginPath();
      ctx.moveTo(cx, cy - ry);
      ctx.bezierCurveTo(cx - rx * 1.4, cy - ry * 0.7, cx - rx * 1.4, cy + ry * 0.7, cx, cy + ry);
      ctx.bezierCurveTo(cx - rx * 0.55, cy + ry * 0.65, cx - rx * 0.55, cy - ry * 0.65, cx, cy - ry);
      ctx.fillStyle = gradL;
      ctx.fill();
      ctx.strokeStyle = '#261914';
      ctx.lineWidth = Math.max(2.2, strokeWidth * 0.14);
      ctx.stroke();

      // 우측 손바닥 & 손
      const gradR = ctx.createLinearGradient(cx + rx * 1.5, cy, cx, cy);
      gradR.addColorStop(0, '#dbad93');
      gradR.addColorStop(0.6, '#edd0be');
      gradR.addColorStop(1, '#f9dfcf');

      ctx.beginPath();
      ctx.moveTo(cx, cy - ry);
      ctx.bezierCurveTo(cx + rx * 1.4, cy - ry * 0.7, cx + rx * 1.4, cy + ry * 0.7, cx, cy + ry);
      ctx.bezierCurveTo(cx + rx * 0.55, cy + ry * 0.65, cx + rx * 0.55, cy - ry * 0.65, cx, cy - ry);
      ctx.fillStyle = gradR;
      ctx.fill();
      ctx.strokeStyle = '#261914';
      ctx.lineWidth = Math.max(2.2, strokeWidth * 0.14);
      ctx.stroke();

      // 손끝 손톱 및 손목 연결점
      ctx.fillStyle = '#fff9f2';
      ctx.strokeStyle = '#261914';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.ellipse(cx - 3, cy - ry + 3, 3.5, 2.5, -0.2, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx + 3, cy - ry + 3, 3.5, 2.5, 0.2, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.restore();
    }

    // [손바닥 일체형 한글 음절 렌더러]
    function renderHandFingerGlyph(char, targetSize, options) {
      const { textStroke, showOutline } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const s = targetSize;
      const code = char.charCodeAt(0);

      // 점선 가이드 테두리
      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.45)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(targetSize * 0.05, targetSize * 0.05, targetSize * 0.9, targetSize * 0.9);
        ctx.restore();
      }

      if (code < 0xAC00 || code > 0xD7A3) {
        // 문장부호 등
        drawPalmBase(ctx, s * 0.3, s * 0.5, s * 0.4, s * 0.4);
        drawConnectedFinger(ctx, { x: s * 0.45, y: s * 0.6 }, { x: s * 0.55, y: s * 0.3 }, s * 0.16, true);
        return canvas;
      }

      const SIndex = code - 0xAC00;
      const LIndex = Math.floor(SIndex / 588);
      const VIndex = Math.floor((SIndex % 588) / 28);
      const TIndex = SIndex % 28;

      const fw = Math.max(16, s * (0.13 + (textStroke * 0.007)));
      const isVertical = [0, 1, 2, 3, 4, 5, 6, 7, 20].includes(VIndex);
      const hasJong = (TIndex > 0);

      // 1. [손바닥 기저 배치 (Palm Foundation)]: 글자 전체를 받쳐주어 잘린 손가락 느낌을 원천 배제
      if (hasJong) {
        drawPalmBase(ctx, s * 0.18, s * 0.62, s * 0.64, s * 0.34);
      } else {
        if (isVertical) {
          drawPalmBase(ctx, s * 0.12, s * 0.52, s * 0.48, s * 0.42);
        } else {
          drawPalmBase(ctx, s * 0.22, s * 0.56, s * 0.56, s * 0.38);
        }
      }

      // 레이아웃 영역 분할
      let choBox, jungBox, jongBox;
      if (!hasJong) {
        if (isVertical) {
          choBox = { x: s * 0.08, y: s * 0.10, w: s * 0.45, h: s * 0.52 };
          jungBox = { x: s * 0.54, y: s * 0.08, w: s * 0.38, h: s * 0.82 };
        } else {
          choBox = { x: s * 0.18, y: s * 0.08, w: s * 0.64, h: s * 0.46 };
          jungBox = { x: s * 0.10, y: s * 0.56, w: s * 0.80, h: s * 0.36 };
        }
      } else {
        if (isVertical) {
          choBox = { x: s * 0.08, y: s * 0.06, w: s * 0.45, h: s * 0.46 };
          jungBox = { x: s * 0.54, y: s * 0.05, w: s * 0.38, h: s * 0.52 };
          jongBox = { x: s * 0.16, y: s * 0.58, w: s * 0.68, h: s * 0.36 };
        } else {
          choBox = { x: s * 0.18, y: s * 0.06, w: s * 0.64, h: s * 0.34 };
          jungBox = { x: s * 0.10, y: s * 0.42, w: s * 0.80, h: s * 0.26 };
          jongBox = { x: s * 0.16, y: s * 0.66, w: s * 0.68, h: s * 0.30 };
        }
      }

      // 자음 렌더링
      function drawConsonant(cIdx, b) {
        const { x, y, w, h } = b;
        const bw = fw * (b.w / s * 1.65);

        // ㅇ (두 손 모은 손바닥)
        if (cIdx === 11) {
          drawCuppedHands(ctx, x + w * 0.5, y + h * 0.5, w * 0.36, h * 0.40, bw);
          return;
        }
        // ㄱ
        if (cIdx === 0 || cIdx === 1) {
          drawConnectedFinger(ctx, { x: x + w * 0.15, y: y + h * 0.28 }, { x: x + w * 0.82, y: y + h * 0.28 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.82, y: y + h * 0.28 }, { x: x + w * 0.78, y: y + h * 0.88 }, bw, true);
          return;
        }
        // ㄴ
        if (cIdx === 2) {
          drawConnectedFinger(ctx, { x: x + w * 0.25, y: y + h * 0.15 }, { x: x + w * 0.25, y: y + h * 0.80 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.25, y: y + h * 0.80 }, { x: x + w * 0.88, y: y + h * 0.80 }, bw, true);
          return;
        }
        // ㄷ
        if (cIdx === 3 || cIdx === 4) {
          drawConnectedFinger(ctx, { x: x + w * 0.18, y: y + h * 0.24 }, { x: x + w * 0.82, y: y + h * 0.24 }, bw, true);
          drawConnectedFinger(ctx, { x: x + w * 0.24, y: y + h * 0.24 }, { x: x + w * 0.24, y: y + h * 0.80 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.24, y: y + h * 0.80 }, { x: x + w * 0.85, y: y + h * 0.80 }, bw, true);
          return;
        }
        // ㄹ
        if (cIdx === 5) {
          drawConnectedFinger(ctx, { x: x + w * 0.18, y: y + h * 0.20 }, { x: x + w * 0.82, y: y + h * 0.20 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.82, y: y + h * 0.20 }, { x: x + w * 0.82, y: y + h * 0.50 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.82, y: y + h * 0.50 }, { x: x + w * 0.22, y: y + h * 0.50 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.22, y: y + h * 0.50 }, { x: x + w * 0.22, y: y + h * 0.82 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.22, y: y + h * 0.82 }, { x: x + w * 0.86, y: y + h * 0.82 }, bw, true);
          return;
        }
        // ㅁ
        if (cIdx === 6) {
          drawConnectedFinger(ctx, { x: x + w * 0.20, y: y + h * 0.20 }, { x: x + w * 0.20, y: y + h * 0.82 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.20, y: y + h * 0.22 }, { x: x + w * 0.80, y: y + h * 0.22 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.80, y: y + h * 0.22 }, { x: x + w * 0.80, y: y + h * 0.82 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.20, y: y + h * 0.82 }, { x: x + w * 0.85, y: y + h * 0.82 }, bw, true);
          return;
        }
        // ㅂ
        if (cIdx === 7 || cIdx === 8) {
          drawConnectedFinger(ctx, { x: x + w * 0.22, y: y + h * 0.15 }, { x: x + w * 0.22, y: y + h * 0.82 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.78, y: y + h * 0.15 }, { x: x + w * 0.78, y: y + h * 0.82 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.22, y: y + h * 0.50 }, { x: x + w * 0.78, y: y + h * 0.50 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.22, y: y + h * 0.82 }, { x: x + w * 0.82, y: y + h * 0.82 }, bw, true);
          return;
        }
        // ㅅ
        if (cIdx === 9 || cIdx === 10) {
          drawConnectedFinger(ctx, { x: x + w * 0.50, y: y + h * 0.20 }, { x: x + w * 0.18, y: y + h * 0.85 }, bw, true);
          drawConnectedFinger(ctx, { x: x + w * 0.50, y: y + h * 0.26 }, { x: x + w * 0.84, y: y + h * 0.85 }, bw, true);
          return;
        }
        // ㅈ, ㅊ
        if (cIdx === 12 || cIdx === 13 || cIdx === 14) {
          if (cIdx === 14) drawConnectedFinger(ctx, { x: x + w * 0.40, y: y + h * 0.08 }, { x: x + w * 0.60, y: y + h * 0.14 }, bw * 0.8, true);
          drawConnectedFinger(ctx, { x: x + w * 0.18, y: y + h * 0.24 }, { x: x + w * 0.82, y: y + h * 0.24 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.50, y: y + h * 0.26 }, { x: x + w * 0.20, y: y + h * 0.85 }, bw, true);
          drawConnectedFinger(ctx, { x: x + w * 0.50, y: y + h * 0.30 }, { x: x + w * 0.82, y: y + h * 0.85 }, bw, true);
          return;
        }
        // ㅎ
        if (cIdx === 18) {
          drawConnectedFinger(ctx, { x: x + w * 0.38, y: y + h * 0.08 }, { x: x + w * 0.62, y: y + h * 0.14 }, bw * 0.8, true);
          drawConnectedFinger(ctx, { x: x + w * 0.16, y: y + h * 0.28 }, { x: x + w * 0.84, y: y + h * 0.28 }, bw, true);
          drawCuppedHands(ctx, x + w * 0.5, y + h * 0.65, w * 0.30, h * 0.28, bw);
          return;
        }

        // 기본 자음
        drawConnectedFinger(ctx, { x: x + w * 0.5, y: y + h * 0.2 }, { x: x + w * 0.2, y: y + h * 0.8 }, bw, true);
        drawConnectedFinger(ctx, { x: x + w * 0.5, y: y + h * 0.2 }, { x: x + w * 0.8, y: y + h * 0.8 }, bw, true);
      }

      // 모음 렌더링
      function drawVowel(vIdx, b) {
        const { x, y, w, h } = b;
        const bw = fw * 0.95;

        // ㅣ
        if (vIdx === 20) {
          drawConnectedFinger(ctx, { x: x + w * 0.5, y: y + h * 0.1 }, { x: x + w * 0.5, y: y + h * 0.9 }, bw, true);
          return;
        }
        // ㅏ
        if (vIdx === 0 || vIdx === 2) {
          drawConnectedFinger(ctx, { x: x + w * 0.4, y: y + h * 0.08 }, { x: x + w * 0.4, y: y + h * 0.92 }, bw, true);
          drawConnectedFinger(ctx, { x: x + w * 0.4, y: y + h * 0.45 }, { x: x + w * 0.88, y: y + h * 0.45 }, bw, true);
          if (vIdx === 2) drawConnectedFinger(ctx, { x: x + w * 0.4, y: y + h * 0.65 }, { x: x + w * 0.88, y: y + h * 0.65 }, bw, true);
          return;
        }
        // ㅓ
        if (vIdx === 4 || vIdx === 6) {
          drawConnectedFinger(ctx, { x: x + w * 0.12, y: y + h * 0.45 }, { x: x + w * 0.60, y: y + h * 0.45 }, bw, false);
          if (vIdx === 6) drawConnectedFinger(ctx, { x: x + w * 0.12, y: y + h * 0.65 }, { x: x + w * 0.60, y: y + h * 0.65 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.60, y: y + h * 0.08 }, { x: x + w * 0.60, y: y + h * 0.92 }, bw, true);
          return;
        }
        // ㅡ
        if (vIdx === 18) {
          drawConnectedFinger(ctx, { x: x + w * 0.1, y: y + h * 0.5 }, { x: x + w * 0.9, y: y + h * 0.5 }, bw, true);
          return;
        }
        // ㅗ, ㅛ
        if (vIdx === 8 || vIdx === 12) {
          drawConnectedFinger(ctx, { x: x + w * 0.5, y: y + h * 0.15 }, { x: x + w * 0.5, y: y + h * 0.65 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.08, y: y + h * 0.65 }, { x: x + w * 0.92, y: y + h * 0.65 }, bw, true);
          return;
        }
        // ㅜ, ㅠ
        if (vIdx === 13 || vIdx === 17) {
          drawConnectedFinger(ctx, { x: x + w * 0.08, y: y + h * 0.35 }, { x: x + w * 0.92, y: y + h * 0.35 }, bw, false);
          drawConnectedFinger(ctx, { x: x + w * 0.5, y: y + h * 0.35 }, { x: x + w * 0.5, y: y + h * 0.88 }, bw, true);
          return;
        }

        drawConnectedFinger(ctx, { x: x + w * 0.5, y: y + h * 0.1 }, { x: x + w * 0.5, y: y + h * 0.9 }, bw, true);
        drawConnectedFinger(ctx, { x: x + w * 0.1, y: y + h * 0.5 }, { x: x + w * 0.9, y: y + h * 0.5 }, bw, true);
      }

      // 초성, 중성, 종성 렌더링
      drawConsonant(LIndex, choBox);
      drawVowel(VIndex, jungBox);

      if (hasJong) {
        const jongMap = [0, 0, 1, 0, 2, 2, 2, 3, 5, 5, 5, 5, 5, 5, 5, 5, 6, 7, 7, 9, 10, 11, 12, 14, 15, 16, 17, 18];
        drawConsonant(jongMap[TIndex], jongBox);
      }

      return canvas;
    }

    /* -------------------------------------------------------------
       3. 별(Star) 자형 분석 & 각인 렌더러
       ------------------------------------------------------------- */
    function drawStylizedStar(ctx, cx, cy, baseR, seed, color = '#111115', isSmall = false) {
      const rnd = createPRNG(seed);
      ctx.save();
      const rot = rnd() * Math.PI * 2;
      const scale = isSmall ? (0.42 + rnd() * 0.25) : (0.75 + rnd() * 0.45);
      const r = Math.max(2.8, baseR * scale);
      const points = (rnd() > 0.5) ? 4 : 5;
      const innerRatio = (points === 4) ? (0.22 + rnd() * 0.12) : (0.42 + rnd() * 0.15);

      ctx.translate(cx, cy);
      ctx.rotate(rot);

      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const angle = (i * Math.PI) / points - Math.PI / 2;
        const dist = (i % 2 === 0) ? r : r * innerRatio;
        const px = Math.cos(angle) * dist;
        const py = Math.sin(angle) * dist;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();

      if (!isSmall && r > 6.5) {
        ctx.strokeStyle = '#f4edd9';
        ctx.lineWidth = 1.0;
        ctx.stroke();
      }
      ctx.restore();
    }

    function detectEnclosedHoles(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      const visited = new Uint8Array(w * h);
      const queue = [];

      for (let x = 0; x < w; x++) {
        if (data[x * 4 + 3] <= 60) { visited[x] = 1; queue.push(x); }
        const b = (h - 1) * w + x;
        if (data[b * 4 + 3] <= 60) { visited[b] = 1; queue.push(b); }
      }
      for (let y = 0; y < h; y++) {
        const l = y * w;
        if (data[l * 4 + 3] <= 60 && !visited[l]) { visited[l] = 1; queue.push(l); }
        const r = y * w + (w - 1);
        if (data[r * 4 + 3] <= 60 && !visited[r]) { visited[r] = 1; queue.push(r); }
      }

      let head = 0;
      while (head < queue.length) {
        const idx = queue[head++];
        const neighbors = [idx - 1, idx + 1, idx - w, idx + w];
        for (let i = 0; i < 4; i++) {
          const n = neighbors[i];
          if (n >= 0 && n < w * h && !visited[n] && data[n * 4 + 3] <= 60) {
            visited[n] = 1;
            queue.push(n);
          }
        }
      }

      const holeLabels = new Int32Array(w * h);
      let curLabel = 0;
      const holes = [];

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          if (data[idx * 4 + 3] <= 60 && !visited[idx] && holeLabels[idx] === 0) {
            curLabel++;
            const comp = [];
            const q = [idx];
            holeLabels[idx] = curLabel;
            let qh = 0;

            while (qh < q.length) {
              const cIdx = q[qh++];
              comp.push({ x: cIdx % w, y: Math.floor(cIdx / w) });
              const nbs = [cIdx - 1, cIdx + 1, cIdx - w, cIdx + w];
              for (let k = 0; k < 4; k++) {
                const n = nbs[k];
                if (n >= 0 && n < w * h && !visited[n] && holeLabels[n] === 0 && data[n * 4 + 3] <= 60) {
                  holeLabels[n] = curLabel;
                  q.push(n);
                }
              }
            }

            if (comp.length >= 20) {
              let sumX = 0, sumY = 0;
              let minX = w, maxX = 0, minY = h, maxY = 0;
              for (const p of comp) {
                sumX += p.x; sumY += p.y;
                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
              }
              holes.push({
                cx: sumX / comp.length,
                cy: sumY / comp.length,
                radius: Math.min(maxX - minX, maxY - minY) * 0.45
              });
            }
          }
        }
      }
      return holes;
    }

    function renderStarGlyph(char, targetSize, options) {
      const { textStroke, showOutline } = options;
      const baseSize = 256;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const tmp = document.createElement('canvas');
      tmp.width = baseSize;
      tmp.height = baseSize;
      const tctx = tmp.getContext('2d');
      tctx.textAlign = 'center';
      tctx.textBaseline = 'middle';
      tctx.font = `bold ${baseSize * 0.74}px 'Nanum Brush Script', cursive`;

      if (textStroke > 0) {
        tctx.lineWidth = textStroke * 2.2;
        tctx.strokeStyle = '#111115';
        tctx.lineJoin = 'round';
        tctx.strokeText(char, baseSize / 2, baseSize / 2);
      }
      tctx.fillStyle = '#111115';
      tctx.fillText(char, baseSize / 2, baseSize / 2);

      const holes = detectEnclosedHoles(tctx, baseSize, baseSize);

      ctx.drawImage(tmp, 0, 0, targetSize, targetSize);
      const scale = targetSize / baseSize;
      const charSeed = char.charCodeAt(0) * 17;

      // 갇힌 구멍 안쪽에만 별 각인 (랜덤 변형 & 회전)
      holes.forEach((hole, hIdx) => {
        drawStylizedStar(
          ctx,
          hole.cx * scale,
          hole.cy * scale,
          hole.radius * scale * 0.95,
          charSeed + hIdx * 31,
          '#111115',
          false
        );
      });

      // 세로 모음(ㅓ, ㅏ, ㅣ 등) 꼭대기에 아주 작은 별
      const code = char.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        const V = Math.floor(((code - 0xAC00) % 588) / 28);
        if ([0, 1, 2, 3, 4, 5, 6, 7, 20].includes(V)) {
          drawStylizedStar(ctx, targetSize * 0.76, targetSize * 0.16, targetSize * 0.045, charSeed + 83, '#111115', true);
        }
      }

      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.45)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(targetSize * 0.06, targetSize * 0.06, targetSize * 0.88, targetSize * 0.88);
        ctx.restore();
      }
      return canvas;
    }

    /* -------------------------------------------------------------
       4. 타원 & 사각 인장 렌더러
       ------------------------------------------------------------- */
    function renderWideOvalGlyph(char, targetSize, options) {
      const { textStroke, showOutline } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const cx = targetSize / 2, cy = targetSize / 2;
      const rx = targetSize * 0.46, ry = targetSize * 0.22;

      if (showOutline) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.48)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${targetSize * 0.65}px 'Nanum Brush Script', cursive`;
      ctx.translate(cx, cy);
      ctx.scale(1.25, 0.68);

      if (textStroke > 0) {
        ctx.lineWidth = textStroke * 2;
        ctx.strokeStyle = '#111115';
        ctx.strokeText(char, 0, 0);
      }
      ctx.fillStyle = '#111115';
      ctx.fillText(char, 0, 0);
      ctx.restore();
      return canvas;
    }

    function renderSquareSealGlyph(char, targetSize, options) {
      const { textStroke, carveMode, colorMode, showOutline } = options;
      const primaryColor = (colorMode === 'red') ? '#c0292b' : '#111115';
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const pad = Math.floor(targetSize * 0.08);
      const borderW = Math.max(3, Math.floor(targetSize * 0.055));
      const innerX = pad + borderW + 2, innerY = pad + borderW + 2;
      const innerW = targetSize - (innerX * 2);

      const raw = document.createElement('canvas');
      raw.width = innerW; raw.height = innerW;
      const rctx = raw.getContext('2d');
      rctx.textAlign = 'center'; rctx.textBaseline = 'middle';
      rctx.font = `bold ${innerW * 0.86}px 'Black Han Sans', sans-serif`;

      if (textStroke > 0) {
        rctx.lineWidth = textStroke * 2.2;
        rctx.strokeStyle = '#000';
        rctx.strokeText(char, innerW / 2, innerH / 2);
      }
      rctx.fillStyle = '#000';
      rctx.fillText(char, innerW / 2, innerH / 2);

      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.5)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(pad, pad, targetSize - pad * 2, targetSize - pad * 2);
        ctx.restore();
      }

      if (carveMode === 'eum') {
        ctx.fillStyle = primaryColor;
        ctx.fillRect(pad, pad, targetSize - pad * 2, targetSize - pad * 2);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(raw, innerX, innerY);
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.lineWidth = borderW;
        ctx.strokeStyle = primaryColor;
        ctx.strokeRect(pad + borderW / 2, pad + borderW / 2, targetSize - pad * 2 - borderW, targetSize - pad * 2 - borderW);

        const tint = document.createElement('canvas');
        tint.width = innerW; tint.height = innerW;
        const tctx = tint.getContext('2d');
        tctx.drawImage(raw, 0, 0);
        tctx.globalCompositeOperation = 'source-in';
        tctx.fillStyle = primaryColor;
        tctx.fillRect(0, 0, innerW, innerW);
        ctx.drawImage(tint, innerX, innerY);
      }
      return canvas;
    }

    // 마스터 형상 렌더러 분기
    function renderGlyphByShape(char, shapeKey, targetSize, options) {
      if (shapeKey === 'hand') return renderHandFingerGlyph(char, targetSize, options);
      if (shapeKey === 'star') return renderStarGlyph(char, targetSize, options);
      if (shapeKey === 'oval') return renderWideOvalGlyph(char, targetSize, options);
      if (shapeKey === 'rect') return renderSquareSealGlyph(char, targetSize, options);
      return renderHandFingerGlyph(char, targetSize, options);
    }

    /* -------------------------------------------------------------
       5. SRT 파서
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join(' ').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    /* -------------------------------------------------------------
       6. 2K 뷰포트 반응형 스케일러
       ------------------------------------------------------------- */
    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      if (ratioSelect.value === '16:9') {
        canvas2KWidth = 2560; canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440; canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      scaler.style.transform = `scale(${Math.min(scaleX, scaleY, 1.0)})`;
    }

    window.addEventListener('resize', updateViewportScale);

    /* -------------------------------------------------------------
       7. 비동기 일괄 렌더링 & 도킹 타임라인
       ------------------------------------------------------------- */
    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const shapeTypeSelect = document.getElementById('shape-type');
    const boxSealOptions = document.getElementById('box-seal-options');
    const sealCarveMode = document.getElementById('seal-carve-mode');
    const sealColorMode = document.getElementById('seal-color-mode');
    const showOutlineCheck = document.getElementById('show-outline');

    const btnApply = document.getElementById('btn-apply');
    const applyStatusText = document.getElementById('apply-status-text');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const centerFocusWrap = document.getElementById('center-focus-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt';
    let srtCues = [];
    let cueTimelineEvents = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let activeCueIdx = -1;

    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      applyStatusText.textContent = "자막 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      applyStatusText.textContent = "직접 입력 모드로 변경됨. [적용 버튼]을 누르세요.";
    });

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          applyStatusText.textContent = `자막 ${srtCues.length}개 준비됨. [적용 버튼]을 누르세요.`;
          currentMode = 'srt';
          tabSrt.classList.add('active');
          tabDirect.classList.remove('active');
          sectionSrt.style.display = 'block';
          sectionDirect.style.display = 'none';
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 형식을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    shapeTypeSelect.addEventListener('change', () => {
      boxSealOptions.style.display = (shapeTypeSelect.value === 'rect') ? 'flex' : 'none';
    });

    function getOptions() {
      return {
        textStroke: parseFloat(document.getElementById('text-stroke-range').value),
        showOutline: showOutlineCheck.checked,
        carveMode: sealCarveMode.value,
        colorMode: sealColorMode.value
      };
    }

    async function executeBuildVisualization() {
      stopPlayback();
      applyCanvasResolution();
      boxSealOptions.style.display = (shapeTypeSelect.value === 'rect') ? 'flex' : 'none';

      btnApply.disabled = true;
      btnPlay.disabled = true;
      btnReset.disabled = true;
      btnApply.textContent = "⏳ 2K 렌더링 진행 중...";
      applyStatusText.textContent = "손바닥 일체형 자형을 분석하고 고해상도 화폭에 렌더링 중입니다...";

      await new Promise(resolve => setTimeout(resolve, 50));

      scrollContent.innerHTML = '';
      centerFocusWrap.innerHTML = '';
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      cueTimelineEvents = [];

      const shape = shapeTypeSelect.value;
      const options = getOptions();
      const scaleMultiplier = parseFloat(document.getElementById('glyph-scale-range').value) / 100;

      let rawLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          rawLines = [
            { start: 0, end: 3200, text: "바다" },
            { start: 3200, end: 6400, text: "바람이 분다" },
            { start: 6400, end: 9600, text: "시간은 흘러간다" }
          ];
        } else {
          rawLines = srtCues;
        }
      } else {
        const textArr = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
        const interval = 3000;
        rawLines = textArr.map((t, idx) => ({
          start: idx * interval,
          end: (idx + 1) * interval,
          text: t
        }));
      }

      const safeW = canvas2KWidth * 0.84;
      const safeH = canvas2KHeight * 0.84;
      let maxLineChars = 1;
      rawLines.forEach(l => { if (l.text.length > maxLineChars) maxLineChars = l.text.length; });
      const numLines = Math.max(rawLines.length, 1);

      const baseGlyphW = safeW / (maxLineChars * 1.15);
      const baseGlyphH = safeH / (numLines * 1.4);
      let glyphSize = Math.floor(Math.min(baseGlyphW, baseGlyphH) * scaleMultiplier);
      glyphSize = Math.max(32, Math.min(glyphSize, 180));

      scrollContent.style.gap = `${Math.floor(glyphSize * 0.32)}px`;

      for (let idx = 0; idx < rawLines.length; idx++) {
        const cueData = rawLines[idx];
        applyStatusText.textContent = `렌더링 진행 중: (${idx + 1} / ${rawLines.length}) 자막 행 생성 중...`;

        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const chars = cueData.text.split('');
        chars.forEach(ch => {
          if (ch === ' ' || ch === '\t') {
            const sp = document.createElement('div');
            sp.style.width = `${Math.floor(glyphSize * 0.45)}px`;
            lineRow.appendChild(sp);
            return;
          }
          const gCanvas = renderGlyphByShape(ch, shape, Math.floor(glyphSize * 1.25), options);
          gCanvas.className = 'word-glyph';
          gCanvas.style.width = `${glyphSize}px`;
          gCanvas.style.height = `${glyphSize}px`;
          lineRow.appendChild(gCanvas);
        });

        scrollContent.appendChild(lineRow);

        cueTimelineEvents.push({
          index: idx,
          text: cueData.text,
          start: cueData.start,
          end: cueData.end,
          element: lineRow,
          glyphSize: glyphSize,
          shape: shape,
          options: options,
          landed: false
        });

        if (idx % 2 === 0) await new Promise(r => setTimeout(r, 15));
      }

      totalDurationMs = cueTimelineEvents[cueTimelineEvents.length - 1].end + 1200;
      timeSlider.max = totalDurationMs;
      timeSlider.value = 0;
      updateTime(0);

      btnApply.disabled = false;
      btnPlay.disabled = false;
      btnReset.disabled = false;
      btnApply.textContent = "⚡ 설정 적용 및 2K 렌더링";
      applyStatusText.textContent = `✓ 렌더링 완료 (${rawLines.length}개 자막 준비됨). [시연 시작]을 누르세요.`;
      applyStatusText.style.color = '#55db88';
      setTimeout(() => { applyStatusText.style.color = '#a2a8ba'; }, 3500);
    }

    btnApply.addEventListener('click', executeBuildVisualization);

    /* -------------------------------------------------------------
       8. 재생 루프 및 트랜지션
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let currentCue = null;

      for (let i = 0; i < cueTimelineEvents.length; i++) {
        const cue = cueTimelineEvents[i];

        if (currMs >= cue.start) {
          if (!cue.landed) {
            cue.element.classList.add('landed');
            cue.landed = true;
          }
        } else {
          if (cue.landed) {
            cue.element.classList.remove('landed');
            cue.landed = false;
          }
        }

        if (currMs >= cue.start && currMs < cue.end) {
          currentCue = cue;
        }
      }

      // 화면 중앙 타이핑 포커스 연출
      if (currentCue) {
        if (activeCueIdx !== currentCue.index) {
          activeCueIdx = currentCue.index;
          centerFocusWrap.innerHTML = '';

          const centerSize = Math.min(180, Math.floor(currentCue.glyphSize * 1.55));
          const chars = currentCue.text.split('');
          chars.forEach(ch => {
            if (ch === ' ') {
              const sp = document.createElement('div');
              sp.style.width = `${Math.floor(centerSize * 0.45)}px`;
              centerFocusWrap.appendChild(sp);
              return;
            }
            const gCanvas = renderGlyphByShape(ch, currentCue.shape, Math.floor(centerSize * 1.25), currentCue.options);
            gCanvas.style.width = `${centerSize}px`;
            gCanvas.style.height = `${centerSize}px`;
            gCanvas.style.filter = 'drop-shadow(3px 6px 10px rgba(0,0,0,0.35))';
            centerFocusWrap.appendChild(gCanvas);
          });

          centerFocusWrap.classList.remove('active');
          void centerFocusWrap.offsetWidth;
          centerFocusWrap.classList.add('active');
        }
      } else {
        centerFocusWrap.classList.remove('active');
        activeCueIdx = -1;
      }

      // 마지막 자막 종료 시: 풀컬러/칠흑색 완성 트랜지션 및 낙관 완성
      if (cueTimelineEvents.length > 0) {
        const lastCue = cueTimelineEvents[cueTimelineEvents.length - 1];
        if (currMs >= lastCue.end) {
          poemScroll.classList.add('completed');
          centerFocusWrap.classList.remove('active');
        } else {
          poemScroll.classList.remove('completed');
        }
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (cueTimelineEvents.length === 0) {
        executeBuildVisualization().then(() => startPlayback());
        return;
      }
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       9. 제어 버튼 리스너
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      for (let i = 0; i < cueTimelineEvents.length; i++) {
        cueTimelineEvents[i].element.classList.remove('landed');
        cueTimelineEvents[i].landed = false;
      }
      centerFocusWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    window.addEventListener('DOMContentLoaded', () => {
      executeBuildVisualization();
    });
  </script>
</body>
</html>
