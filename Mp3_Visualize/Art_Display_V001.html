<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2K 핸드-게슈탈트 시화 엔진</title>
  <style>
    :root { --gold: #d4af37; --bg: #0d0e12; --skin: #f5d1b5; }
    body { background: var(--bg); color: #eee; font-family: 'Nanum Myeongjo', serif; margin:0; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 400px; background: #1a1c26; border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    .group { background: #252836; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #3d4155; }
    h3 { color: var(--gold); font-size: 0.95rem; margin: 0 0 12px 0; border-bottom: 1px solid #444; padding-bottom: 5px; }
    input[type="range"], input[type="number"], select, textarea { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box; margin-bottom: 10px; }
    .btn-main { width: 100%; padding: 14px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 1rem; color: #000; }
    #viewport { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #canvas-container { transform-origin: center; position: relative; }
    canvas { background: #fdf6e9; display: block; box-shadow: 0 0 100px rgba(0,0,0,1); }
    #loading { position: absolute; inset:0; background: rgba(0,0,0,0.9); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; color: var(--gold); }
  </style>
</head>
<body>

<aside id="sidebar">
  <h2 style="color:var(--gold); text-align:center;">✋ 핸드-게슈탈트 2K</h2>
  <div class="group">
    <h3>1. 손 디자인 디테일</h3>
    <label style="font-size:0.8rem;">피부색</label>
    <input type="color" id="skin-color" value="#f5d1b5">
    <label style="font-size:0.8rem;">손가락 굵기</label>
    <input type="range" id="f-thick" min="15" max="35" value="24">
  </div>
  <div class="group">
    <h3>2. 배치 설정</h3>
    <input type="number" id="gap-x" value="220" placeholder="자간">
    <input type="number" id="gap-y" value="300" placeholder="줄간">
  </div>
  <div class="group">
    <h3>3. 문장 입력</h3>
    <textarea id="text-input" style="height:100px;">한없이 나가는 눈길은&#10;수평선 저쪽까지</textarea>
  </div>
  <button class="btn-main" id="btn-bake">⚡ 2K 핸드-폰트 생성</button>
</aside>

<main id="viewport">
  <div id="loading"><h3>손으로 글자를 빚는 중...</h3></div>
  <div id="canvas-container"><canvas id="main-canvas"></canvas></div>
</main>

<script>
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = 2560, H = 1440;
canvas.width = W; canvas.height = H;

let bakedData = [];

/**
 * 이미지 속 부드러운 손가락 획 그리기
 */
function drawOrganicFinger(ctx, x1, y1, x2, y2, thick, color) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const dist = Math.hypot(x2 - x1, y2 - y1);
    
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(angle);

    // 1. 검은색 외곽선 (이미지 특징)
    ctx.lineCap = "round";
    ctx.strokeStyle = "#2c1a10";
    ctx.lineWidth = thick + 3;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dist, 0); ctx.stroke();

    // 2. 피부색 채우기
    ctx.strokeStyle = color;
    ctx.lineWidth = thick;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dist, 0); ctx.stroke();

    // 3. 관절 주름 (이미지 속 얇은 세로줄)
    ctx.strokeStyle = "rgba(44, 26, 16, 0.3)";
    ctx.lineWidth = 1.5;
    [0.3, 0.6].forEach(p => {
        ctx.beginPath();
        ctx.moveTo(dist * p, -thick * 0.3);
        ctx.lineTo(dist * p, thick * 0.3);
        ctx.stroke();
    });

    // 4. 손톱 (끝부분 디테일)
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(dist - 6, 0, thick * 0.3, thick * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

/**
 * 합장 형태(ㅇ, ㅁ의 곡선) 그리기
 */
function drawJoinedHands(ctx, x, y, size, color) {
    ctx.save();
    ctx.translate(x, y);
    // 두 손이 마주보며 곡선을 만드는 형태
    for(let i=0; i<2; i++) {
        ctx.save();
        ctx.scale(i === 0 ? 1 : -1, 1);
        ctx.translate(size * 0.15, 0);
        // 부드럽게 굽은 손가락 표현
        const cpX = size * 0.5, cpY = -size * 0.8;
        drawOrganicFinger(ctx, 0, size * 0.4, size * 0.1, -size * 0.4, size * 0.6, color);
        ctx.restore();
    }
    ctx.restore();
}

/**
 * 글자 분석 및 핸드-게슈탈트 베이킹
 */
async function bakeArt() {
    const loading = document.getElementById('loading');
    loading.style.display = 'flex';
    await new Promise(r => setTimeout(r, 50));

    ctx.fillStyle = "#fdf6e9";
    ctx.fillRect(0, 0, W, H);

    const text = document.getElementById('text-input').value;
    const lines = text.split('\n');
    const skin = document.getElementById('skin-color').value;
    const thick = parseInt(document.getElementById('f-thick').value);
    const gapX = parseInt(document.getElementById('gap-x').value);
    const gapY = parseInt(document.getElementById('gap-y').value);

    // 골격 추출용 가상 캔버스
    const tCanvas = document.createElement('canvas');
    const tCtx = tCanvas.getContext('2d');
    tCanvas.width = 400; tCanvas.height = 400;

    lines.forEach((line, lIdx) => {
        const chars = line.split('');
        chars.forEach((char, cIdx) => {
            if(char.trim() === "") return;

            const x = (W/2) - (line.length * gapX / 2) + (cIdx * gapX);
            const y = (H/2) - (lines.length * gapY / 2) + (lIdx * gapY);

            tCtx.clearRect(0,0,400,400);
            tCtx.fillStyle = "black";
            // 이미지처럼 유기적인 획을 위해 굵은 고딕 뼈대 사용
            tCtx.font = `bold 280px "Arial", sans-serif`;
            tCtx.textAlign = "center"; tCtx.textBaseline = "middle";
            tCtx.fillText(char, 200, 200);

            const imgData = tCtx.getImageData(0,0,400,400).data;
            
            // ㅇ, ㅁ, ㅎ 등 동그란 부분 감지 로직 (단순화)
            const isRound = "ㅇㅁㅎㅂㅇ".includes(char);

            if(isRound) {
                drawJoinedHands(ctx, x, y, thick * 2, skin);
            }

            // 나머지 획들을 유기적인 손가락으로 채움
            for(let py=20; py<380; py+=45) {
                for(let px=20; px<380; px+=45) {
                    if(imgData[(py*400 + px)*4 + 3] > 128) {
                        const targetX = x + (px - 200);
                        const targetY = y + (py - 200);
                        // 랜덤하게 굽은 각도를 주어 이미지의 '손 맛'을 살림
                        const randAng = (Math.random() - 0.5) * 0.5;
                        drawOrganicFinger(ctx, targetX, targetY, targetX + 40, targetY + 10, thick, skin);
                    }
                }
            }
        });
    });

    loading.style.display = 'none';
}

document.getElementById('btn-bake').addEventListener('click', bakeArt);

function resizer() {
    const s = Math.min((window.innerWidth-450)/W, window.innerHeight/H) * 0.9;
    document.getElementById('canvas-container').style.transform = `scale(${s})`;
}
window.onresize = resizer; resizer();
window.onload = bakeArt;
</script>
</body>
</html>
