<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팔 타이포그래피 웹 에디터 (프로토타입)</title>
    <style>
        body { font-family: sans-serif; background-color: #f4ebd9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; gap: 20px; width: 100%; max-width: 1200px; }
        .input-area { width: 30%; display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 100%; height: 300px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; resize: none; }
        button { padding: 10px; background-color: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #555; }
        
        .canvas-area { width: 70%; background-color: #fff; border: 2px solid #333; border-radius: 8px; padding: 20px; min-height: 400px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 15px; overflow-y: auto; max-height: 80vh; }
        
        /* 팔 모양을 흉내 낸 CSS 클래스 (실제로는 이미지로 대체됩니다) */
        .arm-stroke { background-color: #e8b494; border: 2px solid #333; border-radius: 10px; position: relative; }
        .arm-vertical { width: 15px; height: 60px; }
        .arm-horizontal { width: 60px; height: 15px; }
        .arm-circle { width: 40px; height: 40px; border-radius: 50%; border: 6px solid #e8b494; background: transparent; }
        
        .syllable { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 80px; height: 80px; position: relative; margin-bottom: 10px; }
        
        /* 한글 조합을 위한 CSS Grid 레이아웃 (초성/중성/종성) */
        .jamo-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; gap: 2px; }
        .choseong { grid-column: 1 / 2; grid-row: 1 / 2; display: flex; justify-content: center; align-items: flex-end; }
        .jungseong { grid-column: 2 / 3; grid-row: 1 / 3; display: flex; justify-content: flex-start; align-items: center; }
        .jongseong { grid-column: 1 / 2; grid-row: 2 / 3; display: flex; justify-content: center; align-items: flex-start; }
    </style>
</head>
<body>

    <h2>팔 타이포그래피 자동 조합기</h2>
    <div class="container">
        <div class="input-area">
            <p>여기에 SRT 자막 텍스트를 붙여넣으세요:</p>
            <textarea id="srtInput">1
00:00:01,000 --> 00:00:04,000
친애하는 나의 손님들

2
00:00:05,000 --> 00:00:08,000
숲속에서 제왕처럼</textarea>
            <button onclick="renderTypography()">팔 타이포그래피 생성하기</button>
            <p style="font-size: 12px; color: #666;">* 현재는 팔 이미지 대신 CSS 도형으로 임시 구현된 상태입니다.</p>
        </div>
        
        <div class="canvas-area" id="outputCanvas">
            <!-- 여기에 결과물이 렌더링됩니다 -->
        </div>
    </div>

    <script>
        // 임시 자모 데이터베이스 (실제로는 사용자님의 팔 이미지 경로가 들어갑니다)
        const jamoAssets = {
            'ㄱ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:20px;"></div><div class="arm-stroke arm-vertical" style="height:40px; margin-left:25px;"></div>',
            'ㄴ': '<div class="arm-stroke arm-vertical" style="height:40px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:-15px; margin-left:15px;"></div>',
            'ㅇ': '<div class="arm-circle"></div>',
            'ㅎ': '<div class="arm-stroke arm-horizontal" style="width:30px; margin-bottom:5px;"></div><div class="arm-circle" style="width:20px; height:20px;"></div>',
            'ㅏ': '<div class="arm-stroke arm-vertical" style="height:60px;"></div><div class="arm-stroke arm-horizontal" style="width:20px; margin-top:-40px; margin-left:15px;"></div>',
            'ㅗ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-top:20px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-top:-20px;"></div>',
            'ㅜ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:20px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-bottom:-20px;"></div>',
            'ㅣ': '<div class="arm-stroke arm-vertical" style="height:60px;"></div>',
            'ㄷ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-vertical" style="height:30px; margin-left:-25px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:25px;"></div>',
            'ㄹ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-left:25px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:5px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-left:-25px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:5px;"></div>',
            'ㅁ': '<div class="arm-stroke arm-vertical" style="height:40px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-left:-15px;"></div><div class="arm-stroke arm-vertical" style="height:40px; margin-left:15px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:-15px; margin-left:-15px;"></div>',
            'ㅂ': '<div class="arm-stroke arm-vertical" style="height:40px;"></div><div class="arm-stroke arm-vertical" style="height:40px; margin-left:5px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:-15px; margin-left:-5px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:25px; margin-left:-5px;"></div>',
            'ㅅ': '<div class="arm-stroke arm-vertical" style="height:40px; transform: rotate(45deg);"></div><div class="arm-stroke arm-vertical" style="height:40px; transform: rotate(-45deg); margin-left:-10px;"></div>',
            'ㅈ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-vertical" style="height:40px; transform: rotate(45deg); margin-left:-10px;"></div><div class="arm-stroke arm-vertical" style="height:40px; transform: rotate(-45deg); margin-left:-10px;"></div>',
            'ㅊ': '<div class="arm-stroke arm-horizontal" style="width:20px; margin-bottom:5px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-vertical" style="height:40px; transform: rotate(45deg); margin-left:-10px;"></div><div class="arm-stroke arm-vertical" style="height:40px; transform: rotate(-45deg); margin-left:-10px;"></div>',
            'ㅋ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-vertical" style="height:40px; margin-left:25px;"></div>',
            'ㅌ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-vertical" style="height:30px; margin-left:-25px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:25px;"></div>',
            'ㅍ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:5px;"></div><div class="arm-stroke arm-vertical" style="height:30px; margin-left:-20px;"></div><div class="arm-stroke arm-vertical" style="height:30px; margin-left:20px;"></div><div class="arm-stroke arm-horizontal" style="width:40px; margin-top:25px;"></div>',
            'ㅠ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:20px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-bottom:-20px; margin-left:-15px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-bottom:-20px; margin-left:15px;"></div>',
            'ㅡ': '<div class="arm-stroke arm-horizontal" style="width:40px;"></div>',
            'ㅢ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:20px;"></div><div class="arm-stroke arm-vertical" style="height:60px; margin-left:20px;"></div>',
            'ㅐ': '<div class="arm-stroke arm-vertical" style="height:60px; margin-right:10px;"></div><div class="arm-stroke arm-vertical" style="height:60px;"></div><div class="arm-stroke arm-horizontal" style="width:15px; margin-top:-40px; margin-left:-15px;"></div>',
            'ㅔ': '<div class="arm-stroke arm-vertical" style="height:60px; margin-right:5px;"></div><div class="arm-stroke arm-vertical" style="height:60px;"></div><div class="arm-stroke arm-horizontal" style="width:15px; margin-top:-40px; margin-left:0px;"></div>',
            'ㅓ': '<div class="arm-stroke arm-vertical" style="height:60px;"></div><div class="arm-stroke arm-horizontal" style="width:20px; margin-top:-40px; margin-right:15px;"></div>',
            'ㅕ': '<div class="arm-stroke arm-vertical" style="height:60px;"></div><div class="arm-stroke arm-horizontal" style="width:20px; margin-top:-40px; margin-right:15px;"></div><div class="arm-stroke arm-horizontal" style="width:20px; margin-top:-40px; margin-right:15px;"></div>',
            'ㅑ': '<div class="arm-stroke arm-vertical" style="height:60px;"></div><div class="arm-stroke arm-horizontal" style="width:20px; margin-top:-40px; margin-left:15px;"></div><div class="arm-stroke arm-horizontal" style="width:20px; margin-top:-40px; margin-left:15px;"></div>',
            'ㅛ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-top:20px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-top:-20px; margin-left:-15px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-top:-20px; margin-left:15px;"></div>',
            'ㅘ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-top:20px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-top:-20px;"></div><div class="arm-stroke arm-vertical" style="height:60px; margin-left:20px;"></div>',
            'ㅝ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:20px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-bottom:-20px;"></div><div class="arm-stroke arm-vertical" style="height:60px; margin-left:20px;"></div>',
            'ㅞ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:20px;"></div><div class="arm-stroke arm-vertical" style="height:20px; margin-bottom:-20px;"></div><div class="arm-stroke arm-vertical" style="height:60px; margin-left:20px;"></div><div class="arm-stroke arm-vertical" style="height:60px; margin-left:5px;"></div>',
            'ㅟ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-bottom:20px;"></div><div class="arm-stroke arm-vertical" style="height:60px; margin-left:20px;"></div><div class="arm-stroke arm-vertical" style="height:60px;"></div>',
            'ㅚ': '<div class="arm-stroke arm-horizontal" style="width:40px; margin-top:20px;"></div><div class="arm-stroke arm-vertical" style="height:60px; margin-left:20px;"></div>'
        };

        // 한글 자모 분리 함수 (초성, 중성, 종성)
        function decomposeHangul(char) {
            const CHOSEONG = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
            const JUNGSEONG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
            const JONGSEONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

            const code = char.charCodeAt(0) - 0xAC00;
            if (code < 0 || code > 11171) return null; // 한글이 아님

            const cho = Math.floor(code / 588);
            const jung = Math.floor((code % 588) / 28);
            const jong = code % 28;

            return {
                choseong: CHOSEONG[cho],
                jungseong: JUNGSEONG[jung],
                jongseong: JONGSEONG[jong]
            };
        }

        // SRT 텍스트 파싱 및 렌더링
        function renderTypography() {
            const srtText = document.getElementById('srtInput').value;
            const outputCanvas = document.getElementById('outputCanvas');
            outputCanvas.innerHTML = ''; // 초기화

            // SRT에서 시간 정보와 숫자 제거, 순수 텍스트만 추출
            const lines = srtText.split('\n');
            const textLines = lines.filter(line => {
                const trimmed = line.trim();
                return trimmed !== '' && !trimmed.includes('-->') && !/^\d+$/.test(trimmed);
            });

            const fullText = textLines.join(' ');

            // 각 글자를 순회하며 렌더링
            for (let i = 0; i < fullText.length; i++) {
                const char = fullText[i];
                const jamo = decomposeHangul(char);

                if (jamo) {
                    const syllableDiv = document.createElement('div');
                    syllableDiv.className = 'syllable';
                    
                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'jamo-grid';

                    // 초성
                    const choDiv = document.createElement('div');
                    choDiv.className = 'choseong';
                    choDiv.innerHTML = jamoAssets[jamo.choseong] || `<span>${jamo.choseong}</span>`;
                    gridDiv.appendChild(choDiv);

                    // 중성
                    const jungDiv = document.createElement('div');
                    jungDiv.className = 'jungseong';
                    jungDiv.innerHTML = jamoAssets[jamo.jungseong] || `<span>${jamo.jungseong}</span>`;
                    gridDiv.appendChild(jungDiv);

                    // 종성 (받침이 있는 경우)
                    if (jamo.jongseong) {
                        const jongDiv = document.createElement('div');
                        jongDiv.className = 'jongseong';
                        jongDiv.innerHTML = jamoAssets[jamo.jongseong] || `<span>${jamo.jongseong}</span>`;
                        gridDiv.appendChild(jongDiv);
                    }

                    syllableDiv.appendChild(gridDiv);
                    outputCanvas.appendChild(syllableDiv);
                } else if (char.trim() !== '') {
                    // 한글이 아닌 경우 (영어, 숫자, 띄어쓰기 등)
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.style.fontSize = '40px';
                    span.style.margin = '10px';
                    outputCanvas.appendChild(span);
                }
            }
        }

        // 페이지 로드 시 자동 실행
        window.onload = renderTypography;
    </script>
</body>
</html>
