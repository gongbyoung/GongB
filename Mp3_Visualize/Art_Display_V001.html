<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2K 핸드-제스처 시화 마스터 엔진</title>
  <style>
    :root { --gold: #d4af37; --bg: #0d0e12; --skin: #f5d1b5; --outline: #2c1a10; }
    body { background: var(--bg); color: #eee; font-family: 'Nanum Myeongjo', serif; margin:0; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 420px; background: #1a1c26; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    .group { background: #252836; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #3d4155; }
    h3 { color: var(--gold); font-size: 0.95rem; margin: 0 0 12px 0; border-bottom: 1px solid #444; padding-bottom: 5px; }
    label { display: block; font-size: 0.8rem; color: #aaa; margin: 10px 0 5px; }
    
    input[type="range"], input[type="number"], select, textarea { 
      width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box;
    }
    
    .btn-main { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 1rem; color: #000; transition: 0.2s; margin-top: 10px; }
    .btn-main:hover { background: #fff; }

    #viewport { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #canvas-container { transform-origin: center; position: relative; }
    canvas { background: #fdf6e9; display: block; box-shadow: 0 0 120px rgba(0,0,0,1); }
    
    #loading { position: absolute; inset:0; background: rgba(0,0,0,0.9); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; color: var(--gold); }
  </style>
</head>
<body>

<aside id="sidebar">
  <h2 style="color:var(--gold); text-align:center;">✋ HAND-GESTURE 2K</h2>
  
  <div class="group">
    <h3>1. 손(Hand) 표현 설정</h3>
    <label>피부톤 선택</label>
    <input type="color" id="skin-color" value="#f5d1b5">
    <label>손가락 굵기</label>
    <input type="range" id="f-thick" min="15" max="40" value="26">
    <label>마디 주름 선명도</label>
    <input type="range" id="joint-val" min="0" max="100" value="85">
  </div>

  <div class="group">
    <h3>2. 배치 및 크기</h3>
    <label>자간 / 줄간격</label>
    <div style="display:flex; gap:10px;">
      <input type="number" id="gap-x" value="250">
      <input type="number" id="gap-y" value="350">
    </div>
    <label>글자 전체 크기</label>
    <input type="range" id="f-size" min="0.5" max="2.5" step="0.1" value="1.3">
  </div>

  <div class="group">
    <h3>3. 데이터 소스</h3>
    <textarea id="text-input" style="height:100px;">한없이 나가는 눈길은&#10;합장하듯 모은 손</textarea>
    <label>SRT 파일 (선택)</label>
    <input type="file" id="srt-file" accept=".srt">
  </div>

  <button class="btn-main" id="btn-render">⚡ 2K 핸드-제스처 생성</button>
  <button class="btn-main" id="btn-play" style="background:#fff;">▶ 시연 시작</button>
</aside>

<main id="viewport">
  <div id="loading"><h3>손가락 마디마디 글자를 빚는 중...</h3><h2 id="load-pct">0%</h2></div>
  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
  </div>
</main>

<script>
/**
 * HAND-GESTURE CALLIGRAPHY ENGINE
 */
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = 2560, H = 1440;
canvas.width = W; canvas.height = H;

let bakedData = [];
let isPlaying = false;
let startTime = 0;

// [도구] 손가락 한 개 그리기 (이미지의 미학 반영)
function drawFinger(ctx, x1, y1, x2, y2, thick, color, isThumb = false) {
    const dist = Math.hypot(x2 - x1, y2 - y1);
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const jointVal = document.getElementById('joint-val').value / 100;

    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(angle);

    // 1. 외곽선 (진한 테두리)
    ctx.lineCap = "round";
    ctx.strokeStyle = "#2c1a10";
    ctx.lineWidth = thick + 5;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dist, 0); ctx.stroke();

    // 2. 피부색 채우기
    ctx.strokeStyle = color;
    ctx.lineWidth = thick;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dist, 0); ctx.stroke();

    // 3. 관절 및 마디 주름 (얇은 라인)
    if(jointVal > 0.1) {
        ctx.strokeStyle = "rgba(44, 26, 16, 0.3)";
        ctx.lineWidth = 2;
        const jPos = isThumb ? [0.5] : [0.35, 0.7];
        jPos.forEach(p => {
            ctx.beginPath();
            ctx.moveTo(dist * p, -thick * 0.35);
            ctx.lineTo(dist * p, thick * 0.35);
            ctx.stroke();
        });
    }

    // 4. 손톱 (끝부분 하이라이트)
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(dist - 5, 0, thick * 0.25, thick * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// [도구] 합장 제스처 (ㅇ 표현 전용)
function drawPrayingCircle(ctx, x, y, size, thick, color) {
    ctx.save();
    ctx.translate(x, y);
    // 왼쪽 손바닥과 구부러진 손가락
    drawFinger(ctx, -size*0.4, size*0.5, 0, -size*0.7, thick, color);
    // 오른쪽 손바닥 (대칭)
    ctx.scale(-1, 1);
    drawFinger(ctx, -size*0.4, size*0.5, 0, -size*0.7, thick, color);
    ctx.restore();
}

// [도구] 주먹 제스처 (ㅁ, ㅂ 등 폐쇄형)
function drawFist(ctx, x, y, size, thick, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.strokeStyle = "#2c1a10";
    ctx.lineWidth = 4;
    
    // 주먹 덩어리
    ctx.beginPath();
    ctx.roundRect(-size*0.6, -size*0.5, size*1.2, size, size*0.2);
    ctx.fill(); ctx.stroke();
    
    // 접힌 마디 표현
    ctx.strokeStyle = "rgba(44, 26, 16, 0.3)";
    for(let i=0; i<3; i++) {
        ctx.beginPath();
        ctx.moveTo(-size*0.3 + i*size*0.3, -size*0.2);
        ctx.lineTo(-size*0.3 + i*size*0.3, size*0.4);
        ctx.stroke();
    }
    ctx.restore();
}

// [핵심] 한글을 분석하여 제스처로 렌더링
async function renderArt() {
    const loading = document.getElementById('loading');
    const loadPct = document.getElementById('load-pct');
    loading.style.display = 'flex';
    bakedData = [];

    const text = document.getElementById('text-input').value;
    const lines = text.split('\n');
    const skin = document.getElementById('skin-color').value;
    const thick = parseInt(document.getElementById('f-thick').value);
    const scale = parseFloat(document.getElementById('f-size').value);
    const gapX = parseInt(document.getElementById('gap-x').value) * scale;
    const gapY = parseInt(document.getElementById('gap-y').value) * scale;

    // 뼈대 추출용 임시 캔버스
    const tCanvas = document.createElement('canvas');
    const tCtx = tCanvas.getContext('2d', {willReadFrequently: true});
    tCanvas.width = 400; tCanvas.height = 400;

    let charCount = 0;
    for(let l=0; l<lines.length; l++) {
        const line = lines[l];
        for(let c=0; c<line.length; c++) {
            const char = line[c];
            if(char.trim() === "") { charCount++; continue; }

            loadPct.innerText = `${Math.round((charCount/text.length)*100)}%`;

            const x = (W/2) - (line.length * gapX / 2) + (c * gapX);
            const y = (H/2) - (lines.length * gapY / 2) + (l * gapY);

            tCtx.clearRect(0,0,400,400);
            tCtx.fillStyle = "black";
            tCtx.font = `bold 280px "Nanum Gothic", sans-serif`;
            tCtx.textAlign = "center"; tCtx.textBaseline = "middle";
            tCtx.fillText(char, 200, 200);

            const imgData = tCtx.getImageData(0,0,400,400).data;
            const segments = [];
            const step = 45; 

            // 특정 자소별 제스처 판별
            const isRound = "ㅇㅎ".includes(char);
            const isBox = "ㅁㅂㅍ".includes(char);

            for(let py=20; py<380; py+=step) {
                for(let px=20; px<380; px+=step) {
                    if(imgData[(py*400 + px)*4 + 3] > 128) {
                        segments.push({px: px-200, py: py-200});
                    }
                }
            }

            bakedData.push({ char, x, y, segments, isRound, isBox, start: charCount * 400, skin, thick: thick * scale });
            charCount++;
            if(charCount % 5 === 0) await new Promise(r => setTimeout(r, 10));
        }
    }

    loading.style.display = 'none';
    renderFrame(0);
}

function renderFrame(time) {
    ctx.fillStyle = "#fdf6e9";
    ctx.fillRect(0, 0, W, H);

    bakedData.forEach(item => {
        if(time < item.start) return;
        const progress = Math.min(1, (time - item.start) / 600);
        ctx.save();
        ctx.globalAlpha = progress;

        const {x, y, skin, thick, isRound, isBox, segments} = item;

        // 1. 제스처 매핑 우선순위
        if(isRound) {
            drawPrayingCircle(ctx, x, y, thick * 3, thick, skin);
        } else if(isBox) {
            drawFist(ctx, x, y, thick * 4, thick, skin);
        }

        // 2. 나머지 획들은 유기적으로 연결된 손가락 배치
        segments.forEach((seg, i) => {
            const next = segments[i+1] || {px: seg.px + 30, py: seg.py};
            // 글자의 꺾임이나 긴 선을 손가락 한마디씩 표현
            drawFinger(ctx, x + seg.px, y + seg.py, x + next.px, y + next.py, thick, skin);
        });

        ctx.restore();
    });

    drawSeal(W - 250, H - 250);
}

function drawSeal(x, y) {
    ctx.save();
    ctx.strokeStyle = "#c0292b"; ctx.lineWidth = 10;
    ctx.strokeRect(x, y, 160, 160);
    ctx.fillStyle = "#c0292b"; ctx.font = "bold 45px 'Nanum Myeongjo'";
    ctx.textAlign = "center";
    ctx.fillText("詩心", x+80, y+70); ctx.fillText("掌中", x+80, y+125);
    ctx.restore();
}

// 애니메이션 실행
function loop() {
    if(!isPlaying) return;
    renderFrame(performance.now() - startTime);
    requestAnimationFrame(loop);
}

document.getElementById('btn-render').addEventListener('click', renderArt);
document.getElementById('btn-play').addEventListener('click', () => {
    isPlaying = true;
    startTime = performance.now();
    loop();
});

function resizer() {
    const s = Math.min((window.innerWidth-450)/W, window.innerHeight/H) * 0.9;
    document.getElementById('canvas-container').style.transform = `scale(${s})`;
}
window.onresize = resizer; resizer();
window.onload = renderArt;
</script>
</body>
</html>
