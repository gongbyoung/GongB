<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 핸드-제스처 시화 생성기</title>
  <style>
    :root { --gold: #d4af37; --bg: #0d0e12; --skin: #f2d1b9; --shadow: #3a251a; }
    body { background: var(--bg); color: #eee; font-family: 'Nanum Myeongjo', serif; margin:0; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 420px; background: #1a1c26; border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    .group { background: #252836; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #3d4155; }
    h3 { color: var(--gold); font-size: 0.95rem; margin: 0 0 12px 0; border-bottom: 1px solid #444; padding-bottom: 5px; }
    label { display: block; font-size: 0.8rem; color: #aaa; margin: 10px 0 5px; }
    
    input[type="range"], input[type="number"], select, textarea { 
      width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box;
    }
    
    .btn-main { width: 100%; padding: 14px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; font-size: 1rem; color: #000; transition: 0.2s; }
    .btn-main:hover { background: #fff; }

    #viewport { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #canvas-container { transform-origin: center; position: relative; box-shadow: 0 0 100px rgba(0,0,0,1); }
    canvas { background: #f4eee0; display: block; }
    
    #loading { position: absolute; inset:0; background: rgba(0,0,0,0.9); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; color: var(--gold); }
    
    #timeline { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 70%; background: rgba(0,0,0,0.85); padding: 15px 25px; border-radius: 40px; display: flex; align-items: center; gap: 20px; border: 1px solid #555; }
    #time-slider { flex: 1; accent-color: var(--gold); cursor: pointer; }
    #time-txt { font-family: monospace; font-size: 1.1rem; min-width: 80px; text-align: center; color: var(--gold); }
  </style>
</head>
<body>

<aside id="sidebar">
  <h2 style="color:var(--gold); text-align:center;">✋ 핸드-제스처 2K 시화</h2>
  
  <div class="group">
    <h3>1. 손(Hand) 디자인 설정</h3>
    <label>피부색 설정</label>
    <input type="color" id="skin-color" value="#f2d1b9">
    <label>손가락 굵기 / 마디 표현</label>
    <input type="range" id="f-thick" min="10" max="30" value="18">
    <input type="range" id="joint-strength" min="0" max="100" value="70">
  </div>

  <div class="group">
    <h3>2. 배치 및 간격</h3>
    <label>자간 / 줄간격 (Hand Spacing)</label>
    <div style="display:flex; gap:10px;">
      <input type="number" id="gap-x" value="200">
      <input type="number" id="gap-y" value="280">
    </div>
    <label>전체 크기 배율</label>
    <input type="range" id="global-scale" min="0.5" max="2" step="0.1" value="1.0">
  </div>

  <div class="group">
    <h3>3. 데이터 소스</h3>
    <textarea id="text-input" style="height:100px;">합장하듯 모은 손이&#10;시가 되어 피어난다</textarea>
    <label>SRT 파일 불러오기</label>
    <input type="file" id="srt-file" accept=".srt">
  </div>

  <button class="btn-main" id="btn-bake">⚡ 2K 핸드-폰트 베이킹</button>
  <button class="btn-main" id="btn-play" style="background:#fff; margin-top:8px;">▶ 시연 시작</button>
</aside>

<main id="viewport">
  <div id="loading"><h3>손으로 글자를 빚는 중...</h3><h2 id="load-pct">0%</h2></div>
  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
  </div>
  <div id="timeline">
    <span id="time-txt">00:00</span>
    <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
  </div>
</main>

<script>
/**
 * HAND-GESTURE FONT ENGINE
 */
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = 2560, H = 1440;
canvas.width = W; canvas.height = H;

let bakedData = [];
let isPlaying = false;
let startTime = 0;
let totalDuration = 5000;
let srtData = [];

// [제스처 1] 손가락 획 (검지, 중지 등 직선)
function drawFinger(ctx, x1, y1, x2, y2, thick, color, isThumb = false) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const dist = Math.hypot(x2 - x1, y2 - y1);
    
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(angle);

    // 외곽선
    ctx.lineCap = "round";
    ctx.strokeStyle = "#3a251a";
    ctx.lineWidth = thick + 4;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dist, 0); ctx.stroke();

    // 피부
    let grad = ctx.createLinearGradient(0, -thick/2, 0, thick/2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.5, "#fff5f0");
    grad.addColorStop(1, "#d4b3a0");
    ctx.strokeStyle = grad;
    ctx.lineWidth = thick;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dist, 0); ctx.stroke();

    // 마디(Joints)
    ctx.strokeStyle = "rgba(58, 37, 26, 0.2)";
    ctx.lineWidth = 1.5;
    const joints = isThumb ? [0.5] : [0.33, 0.66];
    joints.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(dist * p, -thick * 0.4);
        ctx.lineTo(dist * p, thick * 0.4);
        ctx.stroke();
    });

    // 손톱(Nail)
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(dist - 5, 0, thick*0.3, thick*0.4, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
}

// [제스처 2] 주먹 (닫힌 공간 ㅁ, ㅇ의 중심 등)
function drawFist(ctx, x, y, size, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.strokeStyle = "#3a251a";
    ctx.lineWidth = 3;
    
    // 주먹 덩어리
    ctx.beginPath();
    ctx.roundRect(-size/2, -size/2, size, size, size/4);
    ctx.fill(); ctx.stroke();

    // 접힌 손가락 라인
    ctx.strokeStyle = "rgba(0,0,0,0.2)";
    for(let i=0; i<3; i++) {
        ctx.beginPath();
        ctx.moveTo(-size/2 + (i+1)*size/4, -size/4);
        ctx.lineTo(-size/2 + (i+1)*size/4, size/2);
        ctx.stroke();
    }
    ctx.restore();
}

// [제스처 3] 합장 (열린 원이나 큰 폐쇄형 ㅇ)
function drawPrayingHands(ctx, x, y, size, color) {
    ctx.save();
    ctx.translate(x, y);
    
    // 두 손이 마주보는 형태
    for(let side of [-1, 1]) {
        ctx.save();
        ctx.scale(side, 1);
        ctx.translate(size*0.1, 0);
        ctx.rotate(-0.2);
        drawFinger(ctx, 0, -size/2, 0, size/2, size/3, color);
        ctx.restore();
    }
    ctx.restore();
}

// [핵심] 한글 자소를 핸드 제스처로 변환
async function bakeArt() {
    const loading = document.getElementById('loading');
    const loadPct = document.getElementById('load-pct');
    loading.style.display = 'flex';
    bakedData = [];

    const text = document.getElementById('text-input').value;
    const lines = text.split('\n');
    const skin = document.getElementById('skin-color').value;
    const thick = parseInt(document.getElementById('f-thick').value);
    const scale = parseFloat(document.getElementById('global-scale').value);
    const gapX = parseInt(document.getElementById('gap-x').value) * scale;
    const gapY = parseInt(document.getElementById('gap-y').value) * scale;

    const tCanvas = document.createElement('canvas');
    const tCtx = tCanvas.getContext('2d', {willReadFrequently: true});
    tCanvas.width = 400; tCanvas.height = 400;

    let charIdx = 0;
    for(let l=0; l<lines.length; l++) {
        const line = lines[l];
        const chars = line.split('');
        for(let c=0; c<chars.length; c++) {
            const char = chars[c];
            if(char.trim() === "") { charIdx++; continue; }

            loadPct.innerText = `${Math.round((charIdx/text.length)*100)}%`;

            // 자소 분석 (임시 드로잉)
            tCtx.clearRect(0,0,400,400);
            tCtx.fillStyle = "black";
            tCtx.font = `bold 300px "Nanum Gothic"`;
            tCtx.textAlign = "center"; tCtx.textBaseline = "middle";
            tCtx.fillText(char, 200, 200);

            const imgData = tCtx.getImageData(0,0,400,400).data;
            const strokes = [];
            
            // 픽셀 스캔을 통한 골격 추출 (단순화된 알고리즘)
            for(let y=20; y<380; y+=40) {
                for(let x=20; x<380; x+=40) {
                    if(imgData[(y*400 + x)*4 + 3] > 128) {
                        strokes.push({x: x-200, y: y-200});
                    }
                }
            }

            const timeStart = srtData.length > 0 ? (srtData[charIdx]?.start || 0) : charIdx * 450;
            
            bakedData.push({
                char, 
                x: (W/2) - (chars.length*gapX/2) + (c*gapX), 
                y: (H/2) - (lines.length*gapY/2) + (l*gapY),
                strokes,
                start: timeStart,
                skin, thick: thick * scale
            });

            charIdx++;
            if(charIdx % 3 === 0) await new Promise(r => setTimeout(r, 10));
        }
    }

    totalDuration = bakedData.length > 0 ? bakedData[bakedData.length-1].start + 2000 : 5000;
    document.getElementById('time-slider').max = totalDuration;
    loading.style.display = 'none';
    renderFrame(0);
}

function renderFrame(time) {
    ctx.fillStyle = "#f4eee0";
    ctx.fillRect(0, 0, W, H);

    bakedData.forEach(item => {
        if(time < item.start) return;
        const progress = Math.min(1, (time - item.start) / 800);
        ctx.globalAlpha = progress;

        const {x, y, strokes, skin, thick, char} = item;
        
        // 한글 특성에 따른 제스처 매핑
        // 1. 폐쇄형 자소(ㅇ, ㅁ)나 복잡한 부분은 주먹이나 합장 사용
        if("ㅇㅁㅎㅂ".includes(char[0]) || strokes.length > 20) {
            drawPrayingHands(ctx, x, y, thick * 4, skin);
        }

        // 2. 일반적인 획은 손가락으로 구성
        strokes.forEach((pt, i) => {
            const next = strokes[i+1] || pt;
            const dist = Math.hypot(next.x - pt.x, next.y - pt.y);
            
            if(dist < 60 && dist > 5) {
                // 검지/중지류 획
                drawFinger(ctx, x + pt.x, y + pt.y, x + next.x, y + next.y, thick, skin);
            } else if(i % 5 === 0) {
                // 짧은 획은 엄지처럼
                drawFinger(ctx, x + pt.x, y + pt.y, x + pt.x + 20, y + pt.y + 10, thick * 1.2, skin, true);
            }
        });
    });

    ctx.globalAlpha = 1;
    drawSeal(W - 250, H - 250);
}

function drawSeal(x, y) {
    ctx.save();
    ctx.strokeStyle = "#c0292b"; ctx.lineWidth = 10;
    ctx.strokeRect(x, y, 160, 160);
    ctx.fillStyle = "#c0292b"; ctx.font = "bold 40px 'Nanum Myeongjo'";
    ctx.textAlign = "center";
    ctx.fillText("手製", x+80, y+70); ctx.fillText("詩心", x+80, y+125);
    ctx.restore();
}

// 애니메이션 시스템
function loop() {
    if(!isPlaying) return;
    const elapsed = performance.now() - startTime;
    if(elapsed > totalDuration) { isPlaying = false; return; }

    renderFrame(elapsed);
    document.getElementById('time-slider').value = elapsed;
    updateTimeTxt(elapsed);
    requestAnimationFrame(loop);
}

function updateTimeTxt(ms) {
    const s = Math.floor(ms/1000);
    document.getElementById('time-txt').innerText = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
}

document.getElementById('btn-bake').addEventListener('click', bakeArt);
document.getElementById('btn-play').addEventListener('click', () => {
    isPlaying = !isPlaying;
    if(isPlaying) {
        startTime = performance.now() - parseFloat(document.getElementById('time-slider').value);
        loop();
    }
});

document.getElementById('time-slider').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    renderFrame(v);
    updateTimeTxt(v);
    if(isPlaying) startTime = performance.now() - v;
});

// SRT 처리
document.getElementById('srt-file').addEventListener('change', (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
        const blocks = ev.target.result.split('\n\n');
        srtData = blocks.map(b => {
            const lines = b.split('\n');
            if(lines.length < 3) return null;
            const t = lines[1].split(' --> ')[0].split(':');
            return { start: (parseInt(t[0])*3600 + parseInt(t[1])*60 + parseFloat(t[2].replace(',','.'))) * 1000 };
        }).filter(x => x);
        alert("SRT 로드 완료!");
    };
    reader.readAsText(e.target.files[0]);
});

function resizer() {
    const s = Math.min((window.innerWidth-450)/W, window.innerHeight/H) * 0.9;
    document.getElementById('canvas-container').style.transform = `scale(${s})`;
}
window.onresize = resizer; resizer();
window.onload = bakeArt;
</script>
</body>
</html>
