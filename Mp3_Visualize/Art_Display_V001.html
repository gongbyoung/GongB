<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 시화(詩畫) 캘리그라피 생성기</title>
  <!-- 전통 캘리그라피 및 명조 한글 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #b33939;
      --paper-cream: #f4edd9;
      --ink-black: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 설정 사이드바 */
    #sidebar {
      width: 380px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-380px);
    }

    .panel-header {
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #a2a8ba;
      margin-bottom: 6px;
      display: block;
      font-weight: bold;
    }

    select, textarea, input[type="file"], input[type="range"], button {
      width: 100%;
      padding: 10px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 8px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 10px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 12px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.78rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover {
      background: #ebd274;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 380px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 메인 뷰포트 (반응형 핏 스케일러) */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 고정 해상도 캔버스 스테이지 래퍼 */
    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 실제 화폭 (16:9 / 9:16) */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    /* 16:9 모드 (2560 x 1440) */
    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 90px 140px;
    }

    /* 9:16 모드 (1440 x 2560) */
    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 140px 90px;
    }

    #poem-scroll.completed {
      box-shadow: 0 0 100px rgba(212, 175, 55, 0.45), inset 0 0 140px rgba(150, 130, 90, 0.3);
    }

    /* 캔버스 내부 안전 영역 컨테이너 (글자가 절대 밖으로 나가지 못함) */
    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* 화폭에 박히는 왜곡 글자 캔버스 */
    .word-glyph {
      display: inline-block;
      opacity: 0;
      transform: scale(2.8);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.4));
      flex-shrink: 0;
    }

    .word-glyph.landed {
      opacity: 0.94;
      transform: scale(1);
    }

    /* 화면 중앙 실시간 캘리그라피 타이핑 강조 포커스 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-canvas-wrap {
      width: 580px;
      height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 50px rgba(212, 175, 55, 0.55));
      opacity: 0;
      transform: scale(0.65);
      transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-canvas-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 2K 붉은 낙관 인장 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.9;
      transform: scale(1) rotate(0deg);
    }

    /* 하단 타임라인 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <!-- 좌측 조작 패널 -->
  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 캔버스 비율 및 2K 해상도 설정 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 고정 해상도)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- 왜곡 형상 선택 -->
      <div class="form-group">
        <label for="shape-type">글자 왜곡 형상</label>
        <select id="shape-type">
          <option value="hand">손바닥 (Hand - 손가락/손바닥 실루엣)</option>
          <option value="star">별 (Star - 5갈래 꼭짓점 방사 왜곡)</option>
          <option value="oval">타원 (Oval - 유려한 달걀형 곡선)</option>
          <option value="rect">전서 사각 (Square Seal - 돌인장 테두리)</option>
          <option value="heart">하트 (Heart - 상단 홈과 하단 뾰족형)</option>
        </select>
      </div>

      <!-- 왜곡 강도 -->
      <div class="form-group">
        <label for="warp-intensity">왜곡 강도: <span id="warp-val">100%</span></label>
        <input type="range" id="warp-intensity" min="30" max="150" value="100">
      </div>

      <!-- 텍스트 소스 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 텍스트 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (줄바꿈 지원)</label>
        <textarea id="direct-text">하늘과 바람과
별과 시

내 모든 삶이
빛나는 형상이 되리라</textarea>
      </div>

      <!-- 배경 음악 파일 -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <!-- 동작 버튼 -->
      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <!-- 메인 반응형 뷰포트 -->
  <main id="viewport">
    <!-- 화면 중앙에 2K 캔버스를 축소/확대하여 맞춰주는 스케일러 -->
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <!-- 엄격한 내부 배치 영역 (글자가 밖으로 안 나감) -->
        <div id="scroll-content"></div>
        <div id="red-seal">千古<br>詩心</div>

        <!-- 2K 내부 정중앙 활성 타이핑 글자 -->
        <div id="center-stage">
          <div id="center-canvas-wrap"></div>
        </div>
      </div>
    </div>

    <!-- 재생 진행 컨트롤 -->
    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 정방향 2D 왜곡 방정식 (Shape Deformers)
       ------------------------------------------------------------- */
    const ShapeDeformers = {
      hand: (u, v, strength) => {
        let x = u, y = v;
        if (v < -0.1) {
          const finger = 0.22 * Math.sin((u + 0.9) * 4.2) + 0.15 * Math.cos((u - 0.2) * 5.0);
          y -= finger * Math.pow(Math.abs(v + 0.1) / 0.9, 1.4) * strength;
        }
        if (u < -0.1 && v > -0.35 && v < 0.4) {
          x -= Math.sin(((v + 0.35) / 0.75) * Math.PI) * 0.42 * strength;
        }
        if (v > 0.3) {
          x *= Math.max(0.4, 1 - 0.45 * ((v - 0.3) / 0.7) * strength);
        }
        return { x: x * 0.9, y: y * 0.9 };
      },
      star: (u, v, strength) => {
        const r = Math.sqrt(u * u + v * v);
        const theta = Math.atan2(v, u);
        const mod = 0.58 + 0.42 * Math.pow(Math.max(0, Math.cos(5 * theta + Math.PI / 2)), 1.3);
        const modR = r * (1 + (mod - 0.7) * 1.35 * strength);
        return { x: modR * Math.cos(theta), y: modR * Math.sin(theta) };
      },
      oval: (u, v, strength) => {
        const s = strength;
        return {
          x: u * Math.sqrt(Math.max(0, 1 - (v * v) / 2)) * (0.85 + 0.15 * (1 - s)),
          y: v * Math.sqrt(Math.max(0, 1 - (u * u) / 2)) * 1.25
        };
      },
      rect: (u, v, strength) => {
        const p = 0.16 * strength;
        return { x: u * (1 - p * (v * v)) * 0.92, y: v * (1 - p * (u * u)) * 0.92 };
      },
      heart: (u, v, strength) => {
        let x = u * (1 - 0.35 * (1 - v) * 0.5);
        let y = v;
        if (v < 0) y += Math.pow(1 - Math.abs(u), 1.8) * 0.45 * strength;
        if (v > 0) x *= Math.max(0.1, 1 - v * 0.65 * strength);
        return { x: x * 0.95, y: y * 1.05 };
      }
    };

    /* -------------------------------------------------------------
       2. 2D 삼각 아핀 변환 메쉬 렌더러 (정방향 및 2K 초고해상도 렌더링)
       ------------------------------------------------------------- */
    function renderWarpedGlyphCanvas(char, shapeKey, intensity, targetSize = 180) {
      const srcCanvas = document.createElement('canvas');
      const srcSize = 320;
      srcCanvas.width = srcSize;
      srcCanvas.height = srcSize;
      const sctx = srcCanvas.getContext('2d');

      sctx.fillStyle = '#111115';
      sctx.font = `bold ${srcSize * 0.74}px 'Nanum Brush Script', cursive`;
      sctx.textAlign = 'center';
      sctx.textBaseline = 'middle';
      sctx.fillText(char, srcSize / 2, srcSize / 2);

      const dstCanvas = document.createElement('canvas');
      dstCanvas.width = targetSize;
      dstCanvas.height = targetSize;
      const dctx = dstCanvas.getContext('2d');

      const gridN = 14;
      const deformer = ShapeDeformers[shapeKey] || ShapeDeformers.hand;
      const strength = intensity / 100;
      const vertices = [];

      for (let j = 0; j <= gridN; j++) {
        const row = [];
        const vNorm = (j / gridN) * 2 - 1;
        for (let i = 0; i <= gridN; i++) {
          const uNorm = (i / gridN) * 2 - 1;
          const def = deformer(uNorm, vNorm, strength);
          row.push({
            u: (i / gridN) * srcSize,
            v: (j / gridN) * srcSize,
            x: (def.x * 0.45 + 0.5) * targetSize,
            y: (def.y * 0.45 + 0.5) * targetSize
          });
        }
        vertices.push(row);
      }

      for (let j = 0; j < gridN; j++) {
        for (let i = 0; i < gridN; i++) {
          const p00 = vertices[j][i];
          const p10 = vertices[j][i + 1];
          const p01 = vertices[j + 1][i];
          const p11 = vertices[j + 1][i + 1];
          drawTexturedTriangle(dctx, srcCanvas, p00, p10, p01);
          drawTexturedTriangle(dctx, srcCanvas, p10, p11, p01);
        }
      }
      return dstCanvas;
    }

    function drawTexturedTriangle(ctx, img, p0, p1, p2) {
      const D = (p1.u - p0.u) * (p2.v - p0.v) - (p2.u - p0.u) * (p1.v - p0.v);
      if (Math.abs(D) < 0.0001) return;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.closePath();
      ctx.clip();

      const a = ((p1.x - p0.x) * (p2.v - p0.v) - (p2.x - p0.x) * (p1.v - p0.v)) / D;
      const c = (-(p1.x - p0.x) * (p2.u - p0.u) + (p2.x - p0.x) * (p1.u - p0.u)) / D;
      const e = p0.x - a * p0.u - c * p0.v;

      const b = ((p1.y - p0.y) * (p2.v - p0.v) - (p2.y - p0.y) * (p1.v - p0.v)) / D;
      const d = (-(p1.y - p0.y) * (p2.u - p0.u) + (p2.y - p0.y) * (p1.u - p0.u)) / D;
      const f = p0.y - b * p0.u - d * p0.v;

      ctx.transform(a, b, c, d, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    /* -------------------------------------------------------------
       3. SRT 견고한 파서
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join('\n').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    /* -------------------------------------------------------------
       4. 반응형 뷰포트 스케일러 & 캔버스 비율 관리
       ------------------------------------------------------------- */
    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      const ratio = ratioSelect.value;
      if (ratio === '16:9') {
        canvas2KWidth = 2560;
        canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440;
        canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      // 뷰포트 내부 여백 60px 확보
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      const finalScale = Math.min(scaleX, scaleY, 1.0); // 최대 1.0배(2K 원본 크기)

      scaler.style.transform = `scale(${finalScale})`;
    }

    window.addEventListener('resize', updateViewportScale);
    ratioSelect.addEventListener('change', () => {
      applyCanvasResolution();
      buildVisualization();
    });

    /* -------------------------------------------------------------
       5. 캔버스 내부 안전 영역 자동 배치 엔진 (In-Canvas Containment)
       ------------------------------------------------------------- */
    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const shapeTypeSelect = document.getElementById('shape-type');
    const warpIntensityInput = document.getElementById('warp-intensity');
    const warpValLabel = document.getElementById('warp-val');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const centerWrap = document.getElementById('center-canvas-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt';
    let srtCues = [];
    let timelineEvents = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let currentActiveIdx = -1;

    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      buildVisualization();
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      buildVisualization();
    });

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          currentMode = 'srt';
          tabSrt.click();
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 파일을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    function buildVisualization() {
      stopPlayback();
      scrollContent.innerHTML = '';
      centerWrap.innerHTML = '';
      centerWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      timelineEvents = [];

      const shape = shapeTypeSelect.value;
      const intensity = parseFloat(warpIntensityInput.value);

      let textLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          textLines = ["SRT 파일을 업로드하거나", "직접 글 입력을 선택해주세요"];
        } else {
          textLines = srtCues.map(c => c.text);
        }
      } else {
        textLines = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
      }

      // 캔버스 크기 대비 안전 영역 계산 (82% 가용 영역)
      const safeWidth = canvas2KWidth * 0.82;
      const safeHeight = canvas2KHeight * 0.82;

      // 최대 글자 수 및 라인 수 파악
      let maxLineChars = 1;
      textLines.forEach(line => {
        if (line.length > maxLineChars) maxLineChars = line.length;
      });
      const numLines = Math.max(textLines.length, 1);

      // 글자가 화면 밖으로 절대 나가지 않도록 하는 동적 Glyph 크기 산출
      const maxGlyphW = safeWidth / (maxLineChars * 1.08);
      const maxGlyphH = safeHeight / (numLines * 1.35);
      
      // 2K 해상도에 최적화된 글자 크기 결정
      let dynamicGlyphSize = Math.floor(Math.min(maxGlyphW, maxGlyphH));
      // 상하한선 클램프 (2K 기준 최소 38px, 최대 150px)
      dynamicGlyphSize = Math.max(38, Math.min(dynamicGlyphSize, 150));
      const lineGap = Math.floor(dynamicGlyphSize * 0.35);

      scrollContent.style.gap = `${lineGap}px`;

      let globalCharIdx = 0;
      const defaultInterval = 280;

      textLines.forEach((lineText, lineIdx) => {
        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const chars = lineText.split('');
        chars.forEach((char, charIdx) => {
          if (char === ' ' || char === '\t') {
            const space = document.createElement('div');
            space.style.width = `${Math.floor(dynamicGlyphSize * 0.45)}px`;
            space.style.flexShrink = '0';
            lineRow.appendChild(space);
            return;
          }

          // 2K 고해상도 베이킹 (선명도 유지를 위해 1.4배 오버샘플링)
          const glyphCanvas = renderWarpedGlyphCanvas(
            char, 
            shape, 
            intensity, 
            Math.floor(dynamicGlyphSize * 1.4)
          );
          glyphCanvas.className = 'word-glyph';
          glyphCanvas.style.width = `${dynamicGlyphSize}px`;
          glyphCanvas.style.height = `${dynamicGlyphSize}px`;
          lineRow.appendChild(glyphCanvas);

          // 트리거 타임코드 연산
          let triggerTime = 0;
          if (currentMode === 'srt' && srtCues.length > 0) {
            const cue = srtCues[lineIdx];
            const dur = cue.end - cue.start;
            triggerTime = cue.start + (charIdx / chars.length) * dur;
          } else {
            triggerTime = globalCharIdx * defaultInterval;
          }

          timelineEvents.push({
            index: globalCharIdx,
            char: char,
            element: glyphCanvas,
            triggerTime: triggerTime,
            shape: shape,
            intensity: intensity,
            landed: false
          });

          globalCharIdx++;
        });

        scrollContent.appendChild(lineRow);
      });

      if (timelineEvents.length > 0) {
        if (currentMode === 'srt' && srtCues.length > 0) {
          totalDurationMs = srtCues[srtCues.length - 1].end + 1200;
        } else {
          totalDurationMs = globalCharIdx * defaultInterval + 2500;
        }
      }

      timeSlider.max = totalDurationMs;
      updateTime(0);
    }

    /* -------------------------------------------------------------
       6. 재생 프레임 렌더러
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let activeEvt = null;

      for (let i = 0; i < timelineEvents.length; i++) {
        const ev = timelineEvents[i];
        if (currMs >= ev.triggerTime) {
          if (!ev.landed) {
            ev.element.classList.add('landed');
            ev.landed = true;
          }
          if (currMs - ev.triggerTime < 750) {
            activeEvt = ev;
          }
        } else {
          if (ev.landed) {
            ev.element.classList.remove('landed');
            ev.landed = false;
          }
        }
      }

      // 화면 중앙 캘리그라피 타이핑 하이라이트 (2K 기준 540px 초대형 캔버스)
      if (activeEvt) {
        if (currentActiveIdx !== activeEvt.index) {
          currentActiveIdx = activeEvt.index;
          centerWrap.innerHTML = '';

          const bigGlyph = renderWarpedGlyphCanvas(
            activeEvt.char,
            activeEvt.shape,
            activeEvt.intensity,
            540
          );
          centerWrap.appendChild(bigGlyph);

          centerWrap.classList.remove('active');
          void centerWrap.offsetWidth;
          centerWrap.classList.add('active');
        }
      } else {
        centerWrap.classList.remove('active');
        currentActiveIdx = -1;
      }

      // 마지막에 도달하면 완성
      if (currMs >= totalDurationMs - 1200 && timelineEvents.length > 0) {
        poemScroll.classList.add('completed');
        centerWrap.classList.remove('active');
      } else {
        poemScroll.classList.remove('completed');
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (timelineEvents.length === 0) buildVisualization();
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       7. UI 컨트롤러 리스너
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      buildVisualization();
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    shapeTypeSelect.addEventListener('change', buildVisualization);
    warpIntensityInput.addEventListener('input', (e) => {
      warpValLabel.textContent = `${e.target.value}%`;
      buildVisualization();
    });

    directTextInput.addEventListener('input', () => {
      if (currentMode === 'direct') buildVisualization();
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyCanvasResolution();
      buildVisualization();
      updateFrame(0);
    });
  </script>
</body>
</html>
