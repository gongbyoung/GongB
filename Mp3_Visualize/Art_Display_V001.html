<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 일자일장(一字一掌) 시화 생성기</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #d4af37; --bg: #0a0b0e; --paper: #f2e8d5; }
    body { background: var(--bg); color: #eee; font-family: 'Nanum Myeongjo', serif; margin:0; display: flex; height: 100vh; overflow: hidden; }
    
    /* 사이드바 UI */
    #sidebar { width: 450px; background: #161821; border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    .group { background: #1f222e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
    h3 { color: var(--gold); font-size: 1rem; margin: 0 0 10px 0; border-bottom: 1px solid #444; padding-bottom: 5px; }
    label { display: block; font-size: 0.8rem; color: #bbb; margin: 8px 0 4px; }
    input[type="range"], input[type="number"], select { width: 100%; accent-color: var(--gold); }
    .row { display: flex; gap: 10px; }
    
    .btn-apply { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; font-size: 1.1rem; transition: 0.3s; }
    .btn-apply:hover { background: #fff; }
    
    /* 메인 뷰포트 */
    #viewport { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    #canvas-container { transform-origin: center; position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.8); }
    canvas { background: var(--paper); display: block; }
    
    #loading { position: absolute; inset:0; background: rgba(0,0,0,0.8); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
  </style>
</head>
<body>

<aside id="sidebar">
  <h2 style="color:var(--gold); text-align:center;">✋ 일자일장(一字一掌) 2K</h2>
  
  <div class="group">
    <h3>1. 획 디자인 (Feature 1, 2, 3)</h3>
    <label>손가락 획 곡률 (직선 ↔ 곡선)</label>
    <input type="range" id="curve" min="0" max="100" value="40">
    
    <label>필압 (시작-중간-끝 두께)</label>
    <div class="row">
      <input type="number" id="p-start" value="3" title="시작">
      <input type="number" id="p-mid" value="15" title="중간">
      <input type="number" id="p-end" value="5" title="끝">
    </div>
    
    <label>수묵 번짐 & 갈필 효과</label>
    <div class="row">
      <input type="range" id="bleed" min="0" max="20" value="4" title="번짐">
      <input type="range" id="dry" min="0" max="100" value="30" title="갈필">
    </div>
  </div>

  <div class="group">
    <h3>2. 문장 레이아웃 (Feature 4, 6, 10)</h3>
    <label>전체 배치 모양</label>
    <select id="layout-shape">
      <option value="rect">기본 사각형 (격자)</option>
      <option value="tri">삼각형 (▲)</option>
      <option value="rev-tri">역삼각형 (▼)</option>
      <option value="dia">마름모 (◆)</option>
      <option value="circle">원형 (●)</option>
    </select>
    
    <label>배치 중심점 (X, Y %)</label>
    <div class="row">
      <input type="number" id="center-x" value="50">
      <input type="number" id="center-y" value="50">
    </div>
    
    <label>자간 / 줄간격</label>
    <div class="row">
      <input type="number" id="char-gap" value="60">
      <input type="number" id="line-gap" value="80">
    </div>
  </div>

  <div class="group">
    <h3>3. 개별 글자 조절 (Feature 5, 7, 8, 9)</h3>
    <label>글자 전체 굵기 배율</label>
    <input type="range" id="global-thick" min="0.5" max="3" step="0.1" value="1.2">
    
    <label>한 글자 크기 (Hand Size)</label>
    <input type="range" id="hand-size" min="50" max="300" value="150">
    
    <label>글자 가로/세로 비율 (%)</label>
    <div class="row">
      <input type="number" id="aspect-w" value="100">
      <input type="number" id="aspect-h" value="110">
    </div>
    
    <button id="btn-random-big" style="width:100%; margin-top:10px; font-size:0.8rem;">임의 글자 강조(확대) 랜덤 설정</button>
  </div>

  <div class="group">
    <h3>4. 데이터 소스</h3>
    <textarea id="text-input" style="width:100%; height:80px; background:#000; color:#fff; border:1px solid #444;">하늘과 바람과 별과 시&#10;내 모든 삶이&#10;빛나는 형상이 되리라</textarea>
    <label>SRT 파일 업로드</label>
    <input type="file" id="srt-file" accept=".srt">
  </div>

  <button class="btn-apply" id="btn-render">⚡ 2K 시화 베이킹 시작</button>
  <button class="btn-apply" style="background:#fff; color:#000;" id="btn-play">▶ 시연(애니메이션) 시작</button>
</aside>

<main id="viewport">
  <div id="loading"><p>수묵 렌더링 중...</p></div>
  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
  </div>
</main>

<script>
/**
 * [일자일장 엔진] 핵심 로직
 */
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = 2560, H = 1440; // 2K QHD 고정
canvas.width = W; canvas.height = H;

let srtData = [];
let bakedCharacters = []; // 각 글자(손바닥형) 렌더링 데이터
let isPlaying = false;
let currentTime = 0;

// [기능 1, 2] 수묵 느낌의 필압 획 그리기 함수
function drawTaperedStroke(ctx, x1, y1, x2, y2, cp1x, cp1y, opts) {
    const { startW, midW, endW, color } = opts;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(cp1x, cp1y, x2, y2);
    
    // 필압 시뮬레이션: 선을 여러 번 겹쳐 그려 중간을 두껍게 만듦
    ctx.lineWidth = midW;
    ctx.lineCap = "round";
    ctx.strokeStyle = color;
    ctx.stroke();
    
    // 시작과 끝을 가늘게 (간단한 구현을 위해 끝점에 작은 원)
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = startW;
    ctx.stroke();
    ctx.restore();
}

// [핵심] 한 글자를 손바닥 모양으로 그리는 함수
function drawHandLetter(char, x, y, size, opts, isBig) {
    const s = size / 100;
    const finalSize = isBig ? size * 1.8 : size;
    const thick = opts.globalThick;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(opts.aspectW, opts.aspectH);

    // 1. 손가락 5개 획 그리기 (Feature 1, 2, 3)
    const fingerColor = "rgba(10,10,15,0.95)";
    const fBase = { startW: opts.pStart * thick, midW: opts.pMid * thick, endW: opts.pEnd * thick, color: fingerColor };
    
    // 엄지부터 새끼손가락까지 좌표 계산
    for (let i = 0; i < 5; i++) {
        const angle = (-150 + i * 35) * (Math.PI / 180);
        const fx = Math.cos(angle) * (60 * s);
        const fy = Math.sin(angle) * (80 * s);
        const cpX = Math.cos(angle) * (30 * s) + (opts.curve - 50) * 0.2;
        const cpY = Math.sin(angle) * (30 * s);
        
        drawTaperedStroke(ctx, 0, 10 * s, fx, fy, cpX, cpY, fBase);
    }

    // 2. 손바닥 베이스 획
    ctx.beginPath();
    ctx.arc(0, 15 * s, 25 * s, 0, Math.PI, false);
    ctx.lineWidth = opts.pMid * thick;
    ctx.stroke();

    // 3. 중앙 글자 배치 (Feature 7, 8, 9)
    ctx.font = `bold ${45 * s}px 'Nanum Brush Script'`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    // 번짐 효과 (Feature 3)
    if (opts.bleed > 0) {
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowBlur = opts.bleed;
    }
    
    ctx.fillStyle = "#111";
    ctx.fillText(char, 0, -5 * s);
    
    // 갈필 효과 (Feature 3)
    if (opts.dry > 20) {
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = 1;
        for(let j=0; j<3; j++) {
            ctx.beginPath();
            ctx.moveTo(-20*s, -10*s + (Math.random()*20*s));
            ctx.lineTo(20*s, -10*s + (Math.random()*20*s));
            ctx.stroke();
        }
    }

    ctx.restore();
}

// [기능 4, 10] 모양틀 배치 엔진
function getLayoutPosition(index, total, layout, gapX, gapY, centerX, centerY) {
    let px = 0, py = 0;
    const colCount = Math.ceil(Math.sqrt(total * 1.7));
    const r = index / total;

    switch(layout) {
        case 'tri':
            const rowT = Math.floor(Math.sqrt(index * 2));
            px = (index - (rowT * (rowT + 1) / 2)) * gapX - (rowT * gapX / 2);
            py = rowT * gapY;
            break;
        case 'rev-tri':
            const rowRT = Math.floor(Math.sqrt((total - index) * 2));
            px = (index % (rowRT+1)) * gapX - (rowRT * gapX / 2);
            py = (Math.sqrt(total) - rowRT) * gapY;
            break;
        case 'circle':
            const ang = r * Math.PI * 2;
            const dist = Math.sqrt(index) * gapX * 0.8;
            px = Math.cos(ang) * dist;
            py = Math.sin(ang) * dist;
            break;
        case 'dia':
            const side = Math.sqrt(total);
            px = ((index % side) - (index / side)) * gapX * 0.7;
            py = ((index % side) + (index / side)) * gapY * 0.5;
            break;
        default: // rect
            px = (index % colCount - colCount/2) * gapX;
            py = (Math.floor(index / colCount) - colCount/4) * gapY;
    }
    return { x: px + centerX, y: py + centerY };
}

// [베이킹] 모든 설정을 적용하여 2K 캔버스에 그리기
async function renderAll() {
    document.getElementById('loading').style.display = 'flex';
    await new Promise(r => setTimeout(r, 50));

    ctx.fillStyle = "#f2e8d5"; // 배경
    ctx.fillRect(0, 0, W, H);
    
    // 종이 질감 미세하게 추가
    for(let i=0; i<3000; i++) {
        ctx.fillStyle = `rgba(100,80,50,${Math.random()*0.03})`;
        ctx.fillRect(Math.random()*W, Math.random()*H, 2, 2);
    }

    const text = document.getElementById('text-input').value.replace(/\n/g, ' ');
    const chars = text.split('').filter(c => c.trim().length > 0);
    
    const opts = {
        curve: parseInt(document.getElementById('curve').value),
        pStart: parseInt(document.getElementById('p-start').value),
        pMid: parseInt(document.getElementById('p-mid').value),
        pEnd: parseInt(document.getElementById('p-end').value),
        bleed: parseInt(document.getElementById('bleed').value),
        dry: parseInt(document.getElementById('dry').value),
        globalThick: parseFloat(document.getElementById('global-thick').value),
        aspectW: parseInt(document.getElementById('aspect-w').value) / 100,
        aspectH: parseInt(document.getElementById('aspect-h').value) / 100,
    };

    const layout = document.getElementById('layout-shape').value;
    const gapX = parseInt(document.getElementById('char-gap').value);
    const gapY = parseInt(document.getElementById('line-gap').value);
    const cX = W * (parseInt(document.getElementById('center-x').value)/100);
    const cY = H * (parseInt(document.getElementById('center-y').value)/100);
    const handSize = parseInt(document.getElementById('hand-size').value);

    bakedCharacters = [];
    chars.forEach((char, i) => {
        const pos = getLayoutPosition(i, chars.length, layout, gapX, gapY, cX, cY);
        // 베이킹 데이터 저장 (애니메이션용)
        bakedCharacters.push({ char, x: pos.x, y: pos.y, size: handSize, isBig: Math.random() > 0.9 });
        // 즉시 그리기
        drawHandLetter(char, pos.x, pos.y, handSize, opts, bakedCharacters[i].isBig);
    });

    drawSeal(W-300, H-300);
    document.getElementById('loading').style.display = 'none';
}

function drawSeal(x, y) {
    ctx.save();
    ctx.strokeStyle = "#c0292b"; ctx.lineWidth = 10;
    ctx.strokeRect(x, y, 160, 160);
    ctx.fillStyle = "#c0292b";
    ctx.font = "bold 45px 'Nanum Myeongjo'";
    ctx.textAlign = "center";
    ctx.fillText("詩心", x+80, y+70);
    ctx.fillText("掌中", x+80, y+125);
    ctx.restore();
}

// 재생 및 반응형 설정
document.getElementById('btn-render').addEventListener('click', renderAll);
function resizer() {
    const s = Math.min((window.innerWidth-480)/W, window.innerHeight/H) * 0.9;
    document.getElementById('canvas-container').style.transform = `scale(${s})`;
}
window.onresize = resizer; resizer();
window.onload = renderAll;

</script>
</body>
</html>
