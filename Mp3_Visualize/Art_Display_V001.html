<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K Ultimate Calligraphy Art Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #d4af37; --bg: #0d0e12; --panel: #1a1c26; }
    body { background: var(--bg); color: #fff; font-family: 'Nanum Myeongjo', serif; margin:0; display: flex; height: 100vh; overflow: hidden; }
    
    /* 사이드바 - 설정 최적화 */
    #sidebar { width: 420px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; z-index: 10; }
    .scroll-box { padding: 20px; overflow-y: auto; flex: 1; }
    .section { margin-bottom: 20px; padding: 15px; background: #252836; border-radius: 8px; border: 1px solid #3d4155; }
    h3 { color: var(--gold); font-size: 1rem; margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 8px; }
    
    label { display: block; font-size: 0.8rem; margin: 10px 0 5px; color: #aaa; }
    .row { display: flex; gap: 10px; align-items: center; }
    input[type="range"] { flex: 1; accent-color: var(--gold); }
    input[type="number"], select, textarea { background: #000; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; font-size: 0.85rem; }
    
    .btn-main { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; color: #000; }
    
    /* 뷰포트 - 2K 캔버스 영역 */
    #viewport { flex: 1; position: relative; background: radial-gradient(circle, #222, #000); display: flex; align-items: center; justify-content: center; }
    #canvas-scaler { transform-origin: center; position: relative; }
    #main-canvas { background: #f4edd9; box-shadow: 0 0 50px rgba(0,0,0,1); }
    
    /* 타임라인 컨트롤 */
    #timeline { position: absolute; bottom: 20px; width: 80%; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 40px; display: flex; align-items: center; gap: 15px; }
    #time-slider { flex: 1; }
    
    #loading-overlay { position: absolute; inset:0; background: rgba(0,0,0,0.7); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
  </style>
</head>
<body>

<aside id="sidebar">
  <div class="scroll-box">
    <h2 style="color:var(--gold); text-align:center;">詩畫 2K ENGINE</h2>
    
    <div class="section">
      <h3>1. 소스 및 모양틀 (Shape)</h3>
      <label>모양 선택</label>
      <select id="shape-type" style="width:100%">
        <option value="hand">✋ 손바닥 캘리그램</option>
        <option value="star">★ 별 (Star)</option>
        <option value="circle">● 원형/타원</option>
        <option value="triangle">▲ 삼각형</option>
        <option value="diamond">◆ 마름모</option>
        <option value="rect">■ 사각형 (꽉 채움)</option>
        <option value="custom">📁 PNG 업로드</option>
      </select>
      <input type="file" id="png-upload" accept="image/png" style="display:none; margin-top:10px;">
      
      <label>SRT 업로드</label>
      <input type="file" id="srt-upload" accept=".srt">
    </div>

    <div class="section">
      <h3>2. 획 & 필압 (Stroke Design)</h3>
      <label>획의 곡률 (직선 ↔ 곡선)</label>
      <input type="range" id="stroke-curve" min="0" max="100" value="40">
      
      <label>필압 (시작-중간-끝 두께)</label>
      <div class="row">
        <input type="number" id="p-start" value="2" style="width:50px;">
        <input type="number" id="p-mid" value="12" style="width:50px;">
        <input type="number" id="p-end" value="4" style="width:50px;">
      </div>
      
      <label>번짐(Bleeding) & 갈필(Dry)</label>
      <div class="row">
        <input type="range" id="ink-bleed" min="0" max="15" value="3">
        <input type="range" id="ink-dry" min="0" max="100" value="30">
      </div>
      <label>전체 굵기 배율</label>
      <input type="range" id="global-thick" min="1" max="50" value="10">
    </div>

    <div class="section">
      <h3>3. 문장 배치 (Layout)</h3>
      <label>배치 중심 위치 (X, Y %)</label>
      <div class="row">
        <input type="number" id="center-x" value="50" min="0" max="100">
        <input type="number" id="center-y" value="50" min="0" max="100">
      </div>
      
      <label>자간 / 줄간격</label>
      <div class="row">
        <input type="number" id="char-gap" value="5">
        <input type="number" id="line-gap" value="15">
      </div>
      
      <label>글자 가로/세로 비율 (%)</label>
      <div class="row">
        <input type="number" id="aspect-w" value="100" step="5">
        <input type="number" id="aspect-h" value="100" step="5">
      </div>
      
      <button class="btn-main" id="btn-render-all">⚡ 설정 적용 및 2K 베이킹</button>
    </div>
    
    <button class="btn-main" style="background:#fff" id="btn-play">▶ 시연 시작</button>
  </div>
</aside>

<main id="viewport">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="load-msg">2K 고해상도 처리 중...</p>
  </div>
  
  <div id="canvas-scaler">
    <canvas id="main-canvas"></canvas>
  </div>

  <div id="timeline">
    <span id="time-display">00:00</span>
    <input type="range" id="time-slider" min="0" max="100" value="0">
  </div>
</main>

<script>
/**
 * 고해상도 시화 엔진 스크립트
 */
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = 2560, H = 1440; // 2K QHD
canvas.width = W; canvas.height = H;

// 가상 마스크 캔버스 (글자 배치 계산용)
const maskCanvas = document.createElement('canvas');
const mctx = maskCanvas.getContext('2d');
maskCanvas.width = 1000; maskCanvas.height = 1000;

let srtData = [];
let bakedCards = []; // 자막별 렌더링된 결과 저장
let isPlaying = false;
let currentTime = 0;
let customImg = null;

// [1] 마스크 그리기 (모양틀 구현)
function drawMask(shape) {
    mctx.clearRect(0,0,1000,1000);
    mctx.fillStyle = "black";
    mctx.beginPath();
    const cx = 500, cy = 500;

    if(shape === 'hand') {
        mctx.arc(cx, cy + 100, 150, 0, Math.PI*2); // 손바닥
        for(let i=0; i<5; i++) { // 손가락
            mctx.ellipse(300 + i*100, 400 - (i==2?50:0), 40, 200, (i-2)*0.2, 0, Math.PI*2);
        }
    } else if(shape === 'star') {
        for(let i=0; i<10; i++) {
            let r = i % 2 === 0 ? 400 : 180;
            let a = Math.PI * 2 * i / 10 - Math.PI/2;
            mctx.lineTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
        }
    } else if(shape === 'triangle') {
        mctx.moveTo(cx, 100); mctx.lineTo(100, 900); mctx.lineTo(900, 900);
    } else if(shape === 'diamond') {
        mctx.moveTo(cx, 100); mctx.lineTo(900, cy); mctx.lineTo(cx, 900); mctx.lineTo(100, cy);
    } else if(shape === 'circle') {
        mctx.arc(cx, cy, 400, 0, Math.PI*2);
    } else if(shape === 'rect') {
        mctx.rect(100, 100, 800, 800);
    } else if(shape === 'custom' && customImg) {
        mctx.drawImage(customImg, 0, 0, 1000, 1000);
    }
    mctx.fill();
}

// [2] 캘리그라피 글자 하나 그리기 (필압/번짐 엔진)
function drawCalliChar(char, x, y, size, opts) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(opts.aspectW, opts.aspectH);
    
    // 수묵 번짐 효과
    if(opts.bleed > 0) {
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.shadowBlur = opts.bleed;
    }

    ctx.font = `bold ${size}px 'Nanum Brush Script'`;
    ctx.fillStyle = "#111";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    // 필압 구현 (중첩 스트로크)
    ctx.strokeStyle = "#111";
    ctx.lineWidth = opts.pMid;
    ctx.lineJoin = "round";
    ctx.strokeText(char, 0, 0);
    ctx.fillText(char, 0, 0);

    // 갈필(Dry Brush) 효과 - 미세 선 깎기
    if(opts.dry > 10) {
        ctx.globalCompositeOperation = "destination-out";
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.lineWidth = 1;
        for(let i=0; i<5; i++) {
            ctx.beginPath();
            ctx.moveTo(-size/2, (Math.random()-0.5)*size);
            ctx.lineTo(size/2, (Math.random()-0.5)*size);
            ctx.stroke();
        }
    }
    ctx.restore();
}

// [3] 전체 렌더링 시스템 (베이킹)
async function bakeAll() {
    const overlay = document.getElementById('loading-overlay');
    overlay.style.display = 'flex';
    
    const shape = document.getElementById('shape-type').value;
    drawMask(shape);
    const maskData = mctx.getImageData(0,0,1000,1000).data;

    const opts = {
        pMid: parseFloat(document.getElementById('p-mid').value),
        bleed: parseFloat(document.getElementById('ink-bleed').value),
        dry: parseFloat(document.getElementById('ink-dry').value),
        aspectW: parseFloat(document.getElementById('aspect-w').value)/100,
        aspectH: parseFloat(document.getElementById('aspect-h').value)/100,
        curve: parseFloat(document.getElementById('stroke-curve').value)
    };

    bakedCards = [];
    const rawText = srtData.length > 0 ? srtData : [{start:0, end:5000, text: "샘플 문장입니다."}];

    for(let i=0; i<rawText.length; i++) {
        const cue = rawText[i];
        const offCanvas = document.createElement('canvas');
        offCanvas.width = W; offCanvas.height = H;
        const octx = offCanvas.getContext('2d');

        // 이 캔버스에 해당 자막의 모양틀 배치
        const chars = cue.text.split('');
        const centerX = W * (parseFloat(document.getElementById('center-x').value)/100);
        const centerY = H * (parseFloat(document.getElementById('center-y').value)/100);

        chars.forEach((char, idx) => {
            // 마스크에서 유효 좌표 찾기
            let found = false;
            let tx, ty;
            for(let attempt=0; attempt<50; attempt++) {
                let rx = Math.floor(Math.random()*1000);
                let ry = Math.floor(Math.random()*1000);
                if(maskData[(ry*1000 + rx)*4 + 3] > 128) {
                    tx = (rx - 500) * 1.5 + centerX;
                    ty = (ry - 500) * 1.5 + centerY;
                    found = true; break;
                }
            }
            if(found) {
                // 실제 그리기는 메인이 아닌 각 카드의 offCanvas에 기록
                // (여기서는 단순화를 위해 메인 그리기 함수를 활용하거나 복사)
                drawCalliCharOnContext(octx, char, tx, ty, 100 + Math.random()*50, opts);
            }
        });

        bakedCards.push({ ...cue, canvas: offCanvas });
        await new Promise(r => setTimeout(r, 10)); // UI 프리징 방지
    }

    overlay.style.display = 'none';
    alert("베이킹 완료! 시연 시작을 누르세요.");
}

function drawCalliCharOnContext(targetCtx, char, x, y, size, opts) {
    targetCtx.save();
    targetCtx.translate(x, y);
    targetCtx.scale(opts.aspectW, opts.aspectH);
    targetCtx.font = `bold ${size}px 'Nanum Brush Script'`;
    targetCtx.fillStyle = "#111";
    targetCtx.textAlign = "center";
    targetCtx.fillText(char, 0, 0);
    targetCtx.restore();
}

// [4] 애니메이션 루프 (시연 엔진)
function animate() {
    if(!isPlaying) return;

    ctx.fillStyle = "#f4edd9"; // 한지 배경
    ctx.fillRect(0,0,W,H);

    let activeCount = 0;
    bakedCards.forEach(card => {
        if(currentTime >= card.start) {
            // 시간이 지난 카드는 화면에 그림 (도킹 완료)
            ctx.globalAlpha = Math.min(1, (currentTime - card.start) / 1000);
            ctx.drawImage(card.canvas, 0, 0);
            activeCount++;
        }
    });

    // 낙관 및 마무리
    if(activeCount === bakedCards.length) drawSeal(W-250, H-250);

    currentTime += 16; // 약 60fps
    document.getElementById('time-slider').value = currentTime;
    requestAnimationFrame(animate);
}

// [기타 기능들]
document.getElementById('btn-render-all').addEventListener('click', bakeAll);
document.getElementById('btn-play').addEventListener('click', () => {
    isPlaying = !isPlaying;
    if(isPlaying) animate();
});

document.getElementById('shape-type').addEventListener('change', (e) => {
    if(e.target.value === 'custom') document.getElementById('png-upload').click();
});

document.getElementById('png-upload').addEventListener('change', (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
        customImg = new Image();
        customImg.src = ev.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
});

// SRT 파서 및 타임라인 설정 (기존 1000줄 코드의 로직 통합)
document.getElementById('srt-upload').addEventListener('change', (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
        const raw = ev.target.result;
        // 간단 SRT 파서
        const blocks = raw.split('\n\n');
        srtData = blocks.map(b => {
            const lines = b.split('\n');
            if(lines.length < 3) return null;
            const timeLine = lines[1];
            const text = lines.slice(2).join(' ');
            const [start, end] = timeLine.split(' --> ').map(t => {
                const parts = t.split(':');
                return (parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseFloat(parts[2].replace(',','.'))) * 1000;
            });
            return { start, end, text };
        }).filter(x => x);
        document.getElementById('time-slider').max = srtData[srtData.length-1].end;
    };
    reader.readAsText(e.target.files[0]);
});

function drawSeal(x, y) {
    ctx.save();
    ctx.strokeStyle = "#c0292b"; ctx.lineWidth = 10;
    ctx.strokeRect(x, y, 150, 150);
    ctx.fillStyle = "#c0292b"; ctx.font = "bold 40px 'Nanum Myeongjo'";
    ctx.textAlign = "center";
    ctx.fillText("詩畵", x+75, y+65); ctx.fillText("千古", x+75, y+115);
    ctx.restore();
}

// 초기 뷰포트 조절
function resizer() {
    const s = Math.min((window.innerWidth-450)/W, window.innerHeight/H) * 0.9;
    document.getElementById('canvas-scaler').style.transform = `scale(${s})`;
}
window.onresize = resizer; resizer();
</script>
</body>
</html>
