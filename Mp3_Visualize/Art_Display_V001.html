<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 詩畫 캘리그라피 생성기 (형상 일체화 폰트 엔진)</title>
  <!-- 직각 전각 서체, 두꺼운 한글 폰트, 캘리그라피 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #c0292b;
      --paper-cream: #f4edd9;
      --ink-black: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 좌측 설정 사이드바 */
    #sidebar {
      width: 410px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-410px);
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .form-group label {
      font-size: 0.82rem;
      color: #a2a8ba;
      margin-bottom: 4px;
      display: block;
      font-weight: bold;
    }

    /* 슬라이더 + 숫자 직접 입력 */
    .slider-number-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-number-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .slider-number-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      background: #1b1e2a;
      border: 1px solid #333a4d;
      border-radius: 6px;
      color: var(--accent-gold);
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: bold;
      text-align: right;
      outline: none;
    }

    .slider-number-row input[type="number"]:focus {
      border-color: var(--accent-gold);
    }

    select, textarea, input[type="file"], button {
      width: 100%;
      padding: 8px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .control-sub-box {
      background: #171922;
      border: 1px solid #282e3d;
      border-radius: 6px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .control-sub-box .sub-title {
      font-size: 0.82rem;
      color: var(--accent-gold);
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #bbb;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.76rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover {
      background: #ebd274;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 410px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 반응형 뷰포트 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 고정 화폭 */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 90px 140px;
    }

    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 140px 90px;
    }

    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .scroll-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      width: 100%;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scroll-line.landed {
      opacity: 1;
      transform: scale(1);
    }

    /* 박힌 문장 기본: 흐린 회색 비활성화 톤 */
    .scroll-line .word-glyph {
      display: inline-block;
      flex-shrink: 0;
      filter: grayscale(100%) opacity(30%);
      transition: filter 1.2s ease, transform 0.8s ease;
    }

    /* 마지막 자막 박힌 후 전체 칠흑색 먹물 완성 트랜지션 */
    #poem-scroll.completed .scroll-line .word-glyph {
      filter: grayscale(0%) opacity(95%) drop-shadow(2px 3px 5px rgba(0, 0, 0, 0.38));
    }

    /* 화면 중앙 한 문장 전체 타이핑 포커스 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #center-sentence-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px 44px;
      border-radius: 16px;
      background: rgba(244, 237, 217, 0.94);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 70px rgba(212, 175, 55, 0.5);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-sentence-wrap.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* 낙관 인장 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.92;
      transform: scale(1) rotate(0deg);
    }

    /* 타임라인 바 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- 캔버스 규격 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 해상도)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- 형상 선택 -->
      <div class="form-group">
        <label for="shape-type">글자 왜곡 형상</label>
        <select id="shape-type">
          <option value="hand" selected>✋ 손바닥 (손가락·엄지 꽉 채움 글자)</option>
          <option value="oval">⬭ 타원 (가로로 뚱뚱한 와이드 타원 글자)</option>
          <option value="rect">■ 사각 인장 (전각 전서체 - 직각 꽉 채움)</option>
          <option value="star">★ 별 (글자 획 위 별 문양 각인)</option>
        </select>
      </div>

      <!-- [사각 인장 옵션] -->
      <div class="control-sub-box" id="box-seal-options" style="display: none;">
        <div class="sub-title">사각 인장 전용 설정</div>
        <div class="form-group">
          <label for="seal-carve-mode">각법 (도장 형식)</label>
          <select id="seal-carve-mode">
            <option value="yang">양각 (陽刻 - 붉은 테두리 + 붉은 글자)</option>
            <option value="eum">음각 (陰刻 - 사각 덩어리 파내기, 여백 無)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="seal-color-mode">인장 색상</label>
          <select id="seal-color-mode">
            <option value="red">전통 주사위 인주 (朱肉, 붉은색)</option>
            <option value="black">수묵 먹물 (墨, 칠흑색)</option>
          </select>
        </div>
      </div>

      <!-- 1. 글자 크기 배율 -->
      <div class="form-group">
        <label>글자 크기 배율 (%)</label>
        <div class="slider-number-row">
          <input type="range" id="glyph-scale-range" min="50" max="180" value="100">
          <input type="number" id="glyph-scale-num" min="50" max="180" value="100">
        </div>
      </div>

      <!-- 2. 연속 획(필압) 조절 -->
      <div class="control-sub-box">
        <div class="sub-title">연속 획(필압) 조절</div>
        <div class="form-group">
          <label>시작 획 (기필) 두께 (px)</label>
          <div class="slider-number-row">
            <input type="range" id="stroke-start-range" min="0" max="16" value="4" step="0.5">
            <input type="number" id="stroke-start-num" min="0" max="16" value="4" step="0.5">
          </div>
        </div>
        <div class="form-group">
          <label>중간 획 (행필) 두께 (px)</label>
          <div class="slider-number-row">
            <input type="range" id="stroke-mid-range" min="0" max="16" value="2" step="0.5">
            <input type="number" id="stroke-mid-num" min="0" max="16" value="2" step="0.5">
          </div>
        </div>
        <div class="form-group">
          <label>끝 획 (수필) 두께 (px)</label>
          <div class="slider-number-row">
            <input type="range" id="stroke-end-range" min="0" max="16" value="5" step="0.5">
            <input type="number" id="stroke-end-num" min="0" max="16" value="5" step="0.5">
          </div>
        </div>
      </div>

      <!-- 3. 테두리 점선 가이드 옵션 -->
      <div class="control-sub-box">
        <div class="sub-title">형상 테두리 가이드 설정</div>
        <label class="checkbox-row">
          <input type="checkbox" id="show-outline" checked>
          <span>형상 테두리(점선) 표시 (끄면 글자만 보임)</span>
        </label>
      </div>

      <!-- 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (한 줄이 한 문장)</label>
        <textarea id="direct-text">그대는 바람 보고 꾸짖는 구려
그대 머리는 슬픈 듯 흔들거리고
달빛 아래 흐르는 물결처럼</textarea>
      </div>

      <!-- 배경 음악 -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <main id="viewport">
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <div id="scroll-content"></div>
        <div id="red-seal">千古<br>詩心</div>

        <div id="center-stage">
          <div id="center-sentence-wrap"></div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 슬라이더 <-> 숫자 인풋 양방향 바인딩
       ------------------------------------------------------------- */
    function bindSliderNumber(rangeId, numId, callback) {
      const rangeEl = document.getElementById(rangeId);
      const numEl = document.getElementById(numId);
      rangeEl.addEventListener('input', () => {
        numEl.value = rangeEl.value;
        if (callback) callback();
      });
      numEl.addEventListener('input', () => {
        rangeEl.value = numEl.value;
        if (callback) callback();
      });
    }

    /* -------------------------------------------------------------
       2. 고속 2D EDT SDF 필압 팽창 엔진
       ------------------------------------------------------------- */
    function computeEDT1D(f, n, d) {
      const v = new Int32Array(n);
      const z = new Float32Array(n + 1);
      let k = 0;
      v[0] = 0; z[0] = -1e6; z[1] = 1e6;

      for (let q = 1; q < n; q++) {
        let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) {
          k--;
          s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        }
        k++; v[k] = q; z[k] = s; z[k + 1] = 1e6;
      }

      k = 0;
      for (let q = 0; q < n; q++) {
        while (z[k + 1] < q) k++;
        d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
      }
    }

    function generateSDFDilatedGlyph(char, targetW, targetH, strokeStart, strokeMid, strokeEnd, fontName) {
      const off = document.createElement('canvas');
      off.width = targetW;
      off.height = targetH;
      const ctx = off.getContext('2d');

      ctx.fillStyle = '#111115';
      ctx.font = fontName;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(char, targetW / 2, targetH / 2);

      const maxStroke = Math.max(strokeStart, strokeMid, strokeEnd);
      if (maxStroke <= 0.2) return off;

      const imgData = ctx.getImageData(0, 0, targetW, targetH);
      const data = imgData.data;
      const f = new Float32Array(targetW * targetH);

      for (let i = 0; i < targetW * targetH; i++) {
        f[i] = (data[i * 4 + 3] > 100) ? 0 : 1e6;
      }

      const colIn = new Float32Array(targetH);
      const colOut = new Float32Array(targetH);
      const g = new Float32Array(targetW * targetH);

      for (let x = 0; x < targetW; x++) {
        for (let y = 0; y < targetH; y++) colIn[y] = f[y * targetW + x];
        computeEDT1D(colIn, targetH, colOut);
        for (let y = 0; y < targetH; y++) g[y * targetW + x] = colOut[y];
      }

      const rowIn = new Float32Array(targetW);
      const rowOut = new Float32Array(targetW);
      const dist = new Float32Array(targetW * targetH);

      for (let y = 0; y < targetH; y++) {
        for (let x = 0; x < targetW; x++) rowIn[x] = g[y * targetW + x];
        computeEDT1D(rowIn, targetW, rowOut);
        for (let x = 0; x < targetW; x++) dist[y * targetW + x] = Math.sqrt(rowOut[x]);
      }

      for (let y = 0; y < targetH; y++) {
        const v = y / targetH;
        let R = 0;
        if (v < 0.5) {
          const t = v / 0.5;
          const s = t * t * (3 - 2 * t);
          R = strokeStart * (1 - s) + strokeMid * s;
        } else {
          const t = (v - 0.5) / 0.5;
          const s = t * t * (3 - 2 * t);
          R = strokeMid * (1 - s) + strokeEnd * s;
        }

        const offset = y * targetW;
        for (let x = 0; x < targetW; x++) {
          const idx = (offset + x) * 4;
          const d = dist[offset + x];
          if (d <= R) {
            const alpha = Math.min(1.0, Math.max(0.0, (R - d + 0.5)));
            data[idx] = 17;
            data[idx + 1] = 17;
            data[idx + 2] = 21;
            data[idx + 3] = Math.max(data[idx + 3], Math.floor(alpha * 255));
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return off;
    }

    // 픽셀 바운딩 박스 검출
    function getGlyphBoundingBox(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, maxX = 0, minY = h, maxY = 0;
      let hasPixel = false;

      for (let y = 0; y < h; y++) {
        const row = y * w;
        for (let x = 0; x < w; x++) {
          if (data[(row + x) * 4 + 3] > 30) {
            hasPixel = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!hasPixel) return { minX: 0, maxX: w, minY: 0, maxY: h, w, h };
      return { minX, maxX, minY, maxY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
    }

    /* -------------------------------------------------------------
       3. 손바닥 모양 일체화 워핑 엔진 (Stop Hand Full-Warp)
       글자 획 자체가 4개 손가락과 엄지, 손바닥 면을 가득 채움
       ------------------------------------------------------------- */
    function drawStopHandVectorPath(ctx, size) {
      const s = size / 500;
      ctx.beginPath();
      // 손목 하단 중앙
      ctx.moveTo(180 * s, 465 * s);
      // 우측 손바닥 외곽선
      ctx.bezierCurveTo(130 * s, 440 * s, 95 * s, 340 * s, 95 * s, 260 * s);
      // 1. 소지 (새끼손가락)
      ctx.lineTo(95 * s, 175 * s);
      ctx.bezierCurveTo(95 * s, 140 * s, 132 * s, 140 * s, 132 * s, 175 * s);
      ctx.lineTo(132 * s, 230 * s);
      // 2. 약지
      ctx.lineTo(152 * s, 110 * s);
      ctx.bezierCurveTo(152 * s, 75 * s, 195 * s, 75 * s, 195 * s, 110 * s);
      ctx.lineTo(195 * s, 210 * s);
      // 3. 중지 (가장 높음)
      ctx.lineTo(215 * s, 75 * s);
      ctx.bezierCurveTo(215 * s, 40 * s, 262 * s, 40 * s, 262 * s, 75 * s);
      ctx.lineTo(262 * s, 210 * s);
      // 4. 검지
      ctx.lineTo(282 * s, 130 * s);
      ctx.bezierCurveTo(282 * s, 95 * s, 325 * s, 95 * s, 325 * s, 130 * s);
      ctx.lineTo(325 * s, 280 * s);
      // 5. 엄지손가락 (우측으로 돌출)
      ctx.bezierCurveTo(345 * s, 260 * s, 405 * s, 285 * s, 415 * s, 325 * s);
      ctx.bezierCurveTo(425 * s, 365 * s, 385 * s, 405 * s, 335 * s, 385 * s);
      // 손목으로 복귀
      ctx.bezierCurveTo(310 * s, 440 * s, 255 * s, 470 * s, 180 * s, 465 * s);
      ctx.closePath();
    }

    // 사각 그리드 (u, v) -> 손바닥 실루엣 좌표 매핑 함수
    function mapPointToHandGeometry(uNorm, vNorm) {
      // u: -1(좌) ~ +1(우), v: -1(상) ~ +1(하)
      let x = uNorm;
      let y = vNorm;

      // 상단 손가락 4개 봉우리 프로필 매핑 (v < 0)
      if (vNorm < 0) {
        // 4개 손가락의 Y높이 변조
        const fingerWave = 
          0.32 * Math.sin((uNorm + 0.85) * 4.4) + 
          0.18 * Math.cos((uNorm - 0.2) * 5.2);
        const fingerPull = Math.pow(Math.abs(vNorm), 1.3);
        y -= fingerWave * fingerPull * 0.9;
      }

      // 우측 엄지손가락 외곽 확장 (u > 0 && v: -0.2 ~ 0.5)
      if (uNorm > 0.0 && vNorm > -0.25 && vNorm < 0.5) {
        const thumbPeak = Math.sin(((vNorm + 0.25) / 0.75) * Math.PI) * 0.45;
        x += thumbPeak;
      }

      // 하단 손목 수축 (v > 0.2)
      if (vNorm > 0.2) {
        const wristTaper = 1 - 0.48 * ((vNorm - 0.2) / 0.8);
        x *= Math.max(0.42, wristTaper);
      }

      return {
        x: x * 0.44 + 0.5,
        y: y * 0.44 + 0.5
      };
    }

    function renderStopHandGlyph(char, targetSize, options) {
      const { strokeStart, strokeMid, strokeEnd, showOutline } = options;
      const srcSize = 320;

      // 1. 글자 획을 아주 굵고 힘있는 서체로 꽉 차게 렌더링
      const raw = generateSDFDilatedGlyph(
        char,
        srcSize,
        srcSize,
        strokeStart,
        strokeMid,
        strokeEnd,
        `bold ${srcSize * 0.88}px 'Black Han Sans', sans-serif`
      );

      // Bounding Box 검출 후 캔버스 전체에 꽉 차도록 사전 팽창
      const bbox = getGlyphBoundingBox(raw.getContext('2d'), srcSize, srcSize);
      const stretchedCanvas = document.createElement('canvas');
      stretchedCanvas.width = srcSize;
      stretchedCanvas.height = srcSize;
      const sctx = stretchedCanvas.getContext('2d');
      sctx.drawImage(raw, bbox.minX, bbox.minY, bbox.w, bbox.h, 0, 0, srcSize, srcSize);

      const dstCanvas = document.createElement('canvas');
      dstCanvas.width = targetSize;
      dstCanvas.height = targetSize;
      const dctx = dstCanvas.getContext('2d');

      // [요청 반영] 테두리 점선 가이드 표시
      if (showOutline) {
        dctx.save();
        drawStopHandVectorPath(dctx, targetSize);
        dctx.strokeStyle = 'rgba(180, 150, 100, 0.5)';
        dctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        dctx.setLineDash([5, 5]); // 점선 표시
        dctx.stroke();
        dctx.restore();
      }

      // 16x16 메쉬를 통해 글자 획을 손가락 4개와 엄지, 손목으로 꽉 채움
      const gridN = 16;
      const vertices = [];
      for (let j = 0; j <= gridN; j++) {
        const row = [];
        const vNorm = (j / gridN) * 2 - 1;
        for (let i = 0; i <= gridN; i++) {
          const uNorm = (i / gridN) * 2 - 1;
          const pt = mapPointToHandGeometry(uNorm, vNorm);
          row.push({
            u: (i / gridN) * srcSize,
            v: (j / gridN) * srcSize,
            x: pt.x * targetSize,
            y: pt.y * targetSize
          });
        }
        vertices.push(row);
      }

      // 손바닥 실루엣 내부로 클리핑하여 단정하게 정돈
      dctx.save();
      drawStopHandVectorPath(dctx, targetSize);
      dctx.clip();

      for (let j = 0; j < gridN; j++) {
        for (let i = 0; i < gridN; i++) {
          drawTriangleSeamFree(dctx, stretchedCanvas, vertices[j][i], vertices[j][i + 1], vertices[j + 1][i]);
          drawTriangleSeamFree(dctx, stretchedCanvas, vertices[j][i + 1], vertices[j + 1][i + 1], vertices[j + 1][i]);
        }
      }
      dctx.restore();

      return dstCanvas;
    }

    /* -------------------------------------------------------------
       4. 가로로 뚱뚱한 와이드 타원 글자 렌더러 (Wide Oval 2.2:1)
       글자 획 자체가 가로 타원형으로 꽉 채워짐
       ------------------------------------------------------------- */
    function renderWideOvalGlyph(char, targetSize, options) {
      const { strokeStart, strokeMid, strokeEnd, showOutline } = options;
      const srcSize = 320;

      const raw = generateSDFDilatedGlyph(
        char,
        srcSize,
        srcSize,
        strokeStart,
        strokeMid,
        strokeEnd,
        `bold ${srcSize * 0.88}px 'Black Han Sans', sans-serif`
      );

      const bbox = getGlyphBoundingBox(raw.getContext('2d'), srcSize, srcSize);
      const stretchedCanvas = document.createElement('canvas');
      stretchedCanvas.width = srcSize;
      stretchedCanvas.height = srcSize;
      const sctx = stretchedCanvas.getContext('2d');
      sctx.drawImage(raw, bbox.minX, bbox.minY, bbox.w, bbox.h, 0, 0, srcSize, srcSize);

      const dstCanvas = document.createElement('canvas');
      dstCanvas.width = targetSize;
      dstCanvas.height = targetSize;
      const dctx = dstCanvas.getContext('2d');

      const cx = targetSize / 2;
      const cy = targetSize / 2;
      const rx = targetSize * 0.46; // 가로 와이드 2.2 : 1
      const ry = targetSize * 0.22;

      // 점선 가이드 테두리
      if (showOutline) {
        dctx.save();
        dctx.beginPath();
        dctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        dctx.strokeStyle = 'rgba(180, 150, 100, 0.55)';
        dctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        dctx.setLineDash([5, 5]); // 점선
        dctx.stroke();
        dctx.restore();
      }

      // 사각 격자를 가로 뚱뚱한 타원 영역 전체로 매핑
      const gridN = 16;
      const vertices = [];
      for (let j = 0; j <= gridN; j++) {
        const row = [];
        const vNorm = (j / gridN) * 2 - 1;
        for (let i = 0; i <= gridN; i++) {
          const uNorm = (i / gridN) * 2 - 1;
          // Elliptic Squircle Mapping
          const xSquircle = uNorm * Math.sqrt(Math.max(0, 1 - (vNorm * vNorm) / 2));
          const ySquircle = vNorm * Math.sqrt(Math.max(0, 1 - (uNorm * uNorm) / 2));

          row.push({
            u: (i / gridN) * srcSize,
            v: (j / gridN) * srcSize,
            x: cx + xSquircle * rx,
            y: cy + ySquircle * ry
          });
        }
        vertices.push(row);
      }

      dctx.save();
      dctx.beginPath();
      dctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      dctx.clip();

      for (let j = 0; j < gridN; j++) {
        for (let i = 0; i < gridN; i++) {
          drawTriangleSeamFree(dctx, stretchedCanvas, vertices[j][i], vertices[j][i + 1], vertices[j + 1][i]);
          drawTriangleSeamFree(dctx, stretchedCanvas, vertices[j][i + 1], vertices[j + 1][i + 1], vertices[j + 1][i]);
        }
      }
      dctx.restore();

      return dstCanvas;
    }

    /* -------------------------------------------------------------
       5. 사각 인장 렌더러 (직각 전서체 & 점선 가이드 지원)
       ------------------------------------------------------------- */
    function renderSquaredSealGlyph(char, targetSize, options) {
      const { strokeStart, strokeMid, strokeEnd, carveMode, colorMode, showOutline } = options;
      const primaryColor = (colorMode === 'red') ? '#c0292b' : '#111115';
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const pad = Math.floor(targetSize * 0.08);
      const borderW = Math.max(3, Math.floor(targetSize * 0.055));
      const innerX = pad + borderW + 2;
      const innerY = pad + borderW + 2;
      const innerW = targetSize - (innerX * 2);
      const innerH = targetSize - (innerY * 2);

      const raw = generateSDFDilatedGlyph(
        char,
        innerW,
        innerH,
        strokeStart,
        strokeMid,
        strokeEnd,
        `bold ${innerH * 0.85}px 'Black Han Sans', sans-serif`
      );

      const bbox = getGlyphBoundingBox(raw.getContext('2d'), innerW, innerH);

      // 점선 가이드 테두리
      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.55)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(pad, pad, targetSize - pad * 2, targetSize - pad * 2);
        ctx.restore();
      }

      if (carveMode === 'eum') {
        ctx.fillStyle = primaryColor;
        ctx.fillRect(pad, pad, targetSize - pad * 2, targetSize - pad * 2);

        const mask = document.createElement('canvas');
        mask.width = targetSize;
        mask.height = targetSize;
        const mctx = mask.getContext('2d');
        mctx.drawImage(raw, bbox.minX, bbox.minY, bbox.w, bbox.h, innerX, innerY, innerW, innerH);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(mask, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
      } else {
        const tint = document.createElement('canvas');
        tint.width = innerW;
        tint.height = innerH;
        const tctx = tint.getContext('2d');
        tctx.drawImage(raw, bbox.minX, bbox.minY, bbox.w, bbox.h, 0, 0, innerW, innerH);
        tctx.globalCompositeOperation = 'source-in';
        tctx.fillStyle = primaryColor;
        tctx.fillRect(0, 0, innerW, innerH);

        ctx.drawImage(tint, innerX, innerY);
      }
      return canvas;
    }

    /* -------------------------------------------------------------
       6. 별 문양 각인 렌더러
       ------------------------------------------------------------- */
    function renderStarEmbellishedGlyph(char, targetSize, options) {
      const { strokeStart, strokeMid, strokeEnd, showOutline } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const raw = generateSDFDilatedGlyph(
        char,
        targetSize,
        targetSize,
        strokeStart,
        strokeMid,
        strokeEnd,
        `bold ${targetSize * 0.76}px 'Nanum Brush Script', cursive`
      );

      ctx.drawImage(raw, 0, 0);

      // 별 문양 오버레이 각인
      ctx.save();
      const starR = targetSize * 0.085;
      ctx.translate(targetSize * 0.28, targetSize * 0.24);
      ctx.rotate(-0.15);
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * starR, -Math.sin((18 + i * 72) * Math.PI / 180) * starR);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (starR * 0.45), -Math.sin((54 + i * 72) * Math.PI / 180) * (starR * 0.45));
      }
      ctx.closePath();
      ctx.fillStyle = '#111115';
      ctx.fill();
      ctx.strokeStyle = '#f4edd9';
      ctx.lineWidth = Math.max(1.2, targetSize * 0.015);
      ctx.stroke();
      ctx.restore();

      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = 'rgba(180, 150, 100, 0.55)';
        ctx.lineWidth = Math.max(1.8, targetSize * 0.016);
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(targetSize * 0.08, targetSize * 0.08, targetSize * 0.84, targetSize * 0.84);
        ctx.restore();
      }

      return canvas;
    }

    function renderUniversalGlyph(char, shapeKey, targetSize, options) {
      if (shapeKey === 'hand') return renderStopHandGlyph(char, targetSize, options);
      if (shapeKey === 'oval') return renderWideOvalGlyph(char, targetSize, options);
      if (shapeKey === 'rect') return renderSquaredSealGlyph(char, targetSize, options);
      if (shapeKey === 'star') return renderStarEmbellishedGlyph(char, targetSize, options);
      return renderStopHandGlyph(char, targetSize, options);
    }

    // 메쉬 매핑 이음새 소멸 렌더러
    function drawTriangleSeamFree(ctx, img, p0, p1, p2) {
      const D = (p1.u - p0.u) * (p2.v - p0.v) - (p2.u - p0.u) * (p1.v - p0.v);
      if (Math.abs(D) < 0.0001) return;

      const cx = (p0.x + p1.x + p2.x) / 3;
      const cy = (p0.y + p1.y + p2.y) / 3;
      const expand = 0.65;

      function pushOut(p) {
        const dx = p.x - cx, dy = p.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        return { x: p.x + (dx / len) * expand, y: p.y + (dy / len) * expand };
      }

      const ep0 = pushOut(p0), ep1 = pushOut(p1), ep2 = pushOut(p2);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ep0.x, ep0.y);
      ctx.lineTo(ep1.x, ep1.y);
      ctx.lineTo(ep2.x, ep2.y);
      ctx.closePath();
      ctx.clip();

      const a = ((p1.x - p0.x) * (p2.v - p0.v) - (p2.x - p0.x) * (p1.v - p0.v)) / D;
      const c = (-(p1.x - p0.x) * (p2.u - p0.u) + (p2.x - p0.x) * (p1.u - p0.u)) / D;
      const e = p0.x - a * p0.u - c * p0.v;
      const b = ((p1.y - p0.y) * (p2.v - p0.v) - (p2.y - p0.y) * (p1.v - p0.v)) / D;
      const d = (-(p1.y - p0.y) * (p2.u - p0.u) + (p2.y - p0.y) * (p1.u - p0.u)) / D;
      const f = p0.y - b * p0.u - d * p0.v;

      ctx.transform(a, b, c, d, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    /* -------------------------------------------------------------
       7. SRT 파서
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join(' ').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    /* -------------------------------------------------------------
       8. 뷰포트 반응형 스케일러
       ------------------------------------------------------------- */
    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      if (ratioSelect.value === '16:9') {
        canvas2KWidth = 2560; canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440; canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      const finalScale = Math.min(scaleX, scaleY, 1.0);
      scaler.style.transform = `scale(${finalScale})`;
    }

    window.addEventListener('resize', updateViewportScale);
    ratioSelect.addEventListener('change', () => {
      applyCanvasResolution();
      buildVisualization();
    });

    /* -------------------------------------------------------------
       9. 타임라인 빌더 및 문장 단위 트랜지션
       ------------------------------------------------------------- */
    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const shapeTypeSelect = document.getElementById('shape-type');
    const boxSealOptions = document.getElementById('box-seal-options');
    const sealCarveMode = document.getElementById('seal-carve-mode');
    const sealColorMode = document.getElementById('seal-color-mode');
    const showOutlineCheck = document.getElementById('show-outline');

    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const centerSentenceWrap = document.getElementById('center-sentence-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt';
    let srtCues = [];
    let sentenceCues = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let activeSentenceIdx = -1;

    bindSliderNumber('glyph-scale-range', 'glyph-scale-num', buildVisualization);
    bindSliderNumber('stroke-start-range', 'stroke-start-num', buildVisualization);
    bindSliderNumber('stroke-mid-range', 'stroke-mid-num', buildVisualization);
    bindSliderNumber('stroke-end-range', 'stroke-end-num', buildVisualization);

    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      buildVisualization();
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      buildVisualization();
    });

    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          currentMode = 'srt';
          tabSrt.click();
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 파일을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    function getOptions() {
      return {
        strokeStart: parseFloat(document.getElementById('stroke-start-range').value),
        strokeMid: parseFloat(document.getElementById('stroke-mid-range').value),
        strokeEnd: parseFloat(document.getElementById('stroke-end-range').value),
        showOutline: showOutlineCheck.checked,
        carveMode: sealCarveMode.value,
        colorMode: sealColorMode.value
      };
    }

    function buildVisualization() {
      stopPlayback();
      boxSealOptions.style.display = (shapeTypeSelect.value === 'rect') ? 'flex' : 'none';

      scrollContent.innerHTML = '';
      centerSentenceWrap.innerHTML = '';
      centerSentenceWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      sentenceCues = [];

      const shape = shapeTypeSelect.value;
      const options = getOptions();
      const scaleMultiplier = parseFloat(document.getElementById('glyph-scale-range').value) / 100;

      let rawLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          rawLines = [{ start: 0, end: 3500, text: "그대는 바람 보고 꾸짖는 구려" }, { start: 3500, end: 7000, text: "그대 머리는 슬픈 듯 흔들거리고" }];
        } else {
          rawLines = srtCues;
        }
      } else {
        const textArr = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
        const interval = 3000;
        rawLines = textArr.map((t, idx) => ({
          start: idx * interval,
          end: (idx + 1) * interval,
          text: t
        }));
      }

      const safeWidth = canvas2KWidth * 0.84;
      const safeHeight = canvas2KHeight * 0.84;

      let maxLineChars = 1;
      rawLines.forEach(l => { if (l.text.length > maxLineChars) maxLineChars = l.text.length; });
      const numLines = Math.max(rawLines.length, 1);

      const baseGlyphW = safeWidth / (maxLineChars * 1.15);
      const baseGlyphH = safeHeight / (numLines * 1.4);
      let glyphSize = Math.floor(Math.min(baseGlyphW, baseGlyphH) * scaleMultiplier);
      glyphSize = Math.max(32, Math.min(glyphSize, 180));

      scrollContent.style.gap = `${Math.floor(glyphSize * 0.32)}px`;

      rawLines.forEach((cueData, lineIdx) => {
        const lineRow = document.createElement('div');
        lineRow.className = 'scroll-line';

        const chars = cueData.text.split('');
        chars.forEach(char => {
          if (char === ' ' || char === '\t') {
            const space = document.createElement('div');
            space.style.width = `${Math.floor(glyphSize * 0.45)}px`;
            lineRow.appendChild(space);
            return;
          }

          const glyphCanvas = renderUniversalGlyph(char, shape, Math.floor(glyphSize * 1.3), options);
          glyphCanvas.className = 'word-glyph';
          glyphCanvas.style.width = `${glyphSize}px`;
          glyphCanvas.style.height = `${glyphSize}px`;
          lineRow.appendChild(glyphCanvas);
        });

        scrollContent.appendChild(lineRow);

        sentenceCues.push({
          index: lineIdx,
          text: cueData.text,
          start: cueData.start,
          end: cueData.end,
          lineElement: lineRow,
          glyphSize: glyphSize,
          shape: shape,
          options: options,
          landed: false
        });
      });

      totalDurationMs = sentenceCues[sentenceCues.length - 1].end + 1200;
      timeSlider.max = totalDurationMs;
      updateTime(0);
    }

    /* -------------------------------------------------------------
       10. 재생 및 문장 단위 트랜지션 루프
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let currentCue = null;

      for (let i = 0; i < sentenceCues.length; i++) {
        const cue = sentenceCues[i];

        if (currMs >= cue.start) {
          if (!cue.landed) {
            cue.lineElement.classList.add('landed');
            cue.landed = true;
          }
        } else {
          if (cue.landed) {
            cue.lineElement.classList.remove('landed');
            cue.landed = false;
          }
        }

        if (currMs >= cue.start && currMs < cue.end) {
          currentCue = cue;
        }
      }

      // 화면 중앙 한 문장 타이핑 포커스
      if (currentCue) {
        if (activeSentenceIdx !== currentCue.index) {
          activeSentenceIdx = currentCue.index;
          centerSentenceWrap.innerHTML = '';

          const centerSize = Math.min(180, Math.floor(currentCue.glyphSize * 1.55));
          const chars = currentCue.text.split('');
          chars.forEach(char => {
            if (char === ' ') {
              const sp = document.createElement('div');
              sp.style.width = `${Math.floor(centerSize * 0.45)}px`;
              centerSentenceWrap.appendChild(sp);
              return;
            }

            const bigGlyph = renderUniversalGlyph(char, currentCue.shape, Math.floor(centerSize * 1.3), currentCue.options);
            bigGlyph.style.width = `${centerSize}px`;
            bigGlyph.style.height = `${centerSize}px`;
            bigGlyph.style.filter = 'drop-shadow(2px 4px 6px rgba(0,0,0,0.3))';
            centerSentenceWrap.appendChild(bigGlyph);
          });

          centerSentenceWrap.classList.remove('active');
          void centerSentenceWrap.offsetWidth;
          centerSentenceWrap.classList.add('active');
        }
      } else {
        centerSentenceWrap.classList.remove('active');
        activeSentenceIdx = -1;
      }

      // 마지막 자막 이후: 칠흑색 먹물 완성 트랜지션
      const lastCue = sentenceCues[sentenceCues.length - 1];
      if (currMs >= lastCue.end) {
        poemScroll.classList.add('completed');
        centerSentenceWrap.classList.remove('active');
      } else {
        poemScroll.classList.remove('completed');
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (sentenceCues.length === 0) buildVisualization();
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       11. 이벤트 등록
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      buildVisualization();
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    shapeTypeSelect.addEventListener('change', buildVisualization);
    sealCarveMode.addEventListener('change', buildVisualization);
    sealColorMode.addEventListener('change', buildVisualization);
    showOutlineCheck.addEventListener('change', buildVisualization);

    directTextInput.addEventListener('input', () => {
      if (currentMode === 'direct') buildVisualization();
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyCanvasResolution();
      buildVisualization();
      updateFrame(0);
    });
  </script>
</body>
</html>
