<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Hand-Morph Calligraphy Tapestry & MP4 Recorder</title>
    <!-- 정통 붓글씨 및 캘리그라피 서체 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Brush+Script&family=Yeon+Sung&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0b0b0d;
            color: #eee;
            font-family: 'Nanum Brush Script', cursive;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 상단 관제탑 컨트롤 바 */
        #control-panel {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 24, 0.94);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 7px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .btn {
            background: #28282e;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }
        .btn:hover {
            background: #3c3c46;
        }
        .btn-primary {
            background: #b5894b;
            color: #120e09;
            font-weight: 700;
            border: none;
        }
        .btn-primary:hover {
            background: #caa062;
        }
        .btn-record {
            background: #a93226;
            color: #fff;
            border: 1px solid #c0392b;
            font-weight: 700;
        }
        .btn-record.recording {
            background: #e74c3c;
            animation: pulseRecord 1.2s infinite;
        }
        @keyframes pulseRecord {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }
        .btn-preview.active {
            background: #7d6608;
            color: #fff;
            border-color: #b7950b;
        }
        .text-input {
            background: #1c1c22;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 8px;
            border-radius: 12px;
            font-size: 12px;
            width: 80px;
            outline: none;
            text-align: center;
        }
        .text-input:focus {
            border-color: #b5894b;
        }
        select.font-select {
            background: #28282e;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 8px;
            border-radius: 14px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #bbb;
        }
        .slider-group input[type="range"] {
            width: 65px;
            cursor: pointer;
            accent-color: #b5894b;
        }
        .file-label {
            font-size: 12px;
            color: #bbb;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
        #time-display {
            font-size: 12px;
            font-family: monospace;
            color: #888;
            min-width: 75px;
            text-align: center;
        }
        #preview-badge {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(150, 45, 34, 0.88);
            color: #fff;
            padding: 5px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-family: sans-serif;
            letter-spacing: 1px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <button id="btn-play" class="btn btn-primary">▶ 재생</button>
        <button id="btn-record" class="btn btn-record" title="0초부터 완성까지 자동 녹화 후 MP4 저장">🎬 녹화하며 재생 (MP4)</button>
        <button id="btn-preview" class="btn btn-preview">👁️ 최종본 미리보기</button>
        <button id="btn-reset" class="btn">처음으로</button>

        <input type="text" id="title-input" class="text-input" value="갑판 위" placeholder="제목">
        <input type="text" id="author-input" class="text-input" value="정지용 詩" placeholder="글쓴이">

        <select id="font-select" class="font-select">
            <option value="'Nanum Brush Script', cursive" selected>나눔 붓글씨체</option>
            <option value="'East Sea Dokdo', cursive">독도 필묵체</option>
            <option value="'Yeon Sung', cursive">연성체</option>
        </select>

        <div class="slider-group" title="손가락 글자 크기 미세 조절">
            <span>크기</span>
            <input type="range" id="scale-slider" min="0.7" max="1.35" step="0.02" value="1.0">
        </div>
        
        <label class="file-label btn" title="MP3 오디오 파일 선택">
            🎵 MP3
            <input type="file" id="audio-input" accept="audio/*">
        </label>
        
        <label class="file-label btn" title="SRT 자막 파일 선택">
            📜 SRT
            <input type="file" id="srt-input" accept=".srt">
        </label>

        <span id="time-display">00:00 / 00:00</span>
    </div>

    <div id="preview-badge">손가락 획 유기적 변형 캘리그라피 최종본 모드</div>
    <div id="canvas-container"></div>

    <script>
        const DEFAULT_DEMO_SRT = `
1
00:00:01,000 --> 00:00:03,800
나가는 눈길은 수평선 저쪽까지 깃폭처럼 퍼덕이고

2
00:00:04,100 --> 00:00:07,000
바나나 껍질로 바다를 놀려대노니

3
00:00:07,300 --> 00:00:10,200
설마 죽을라구요 굽어보는 물굽이

4
00:00:10,500 --> 00:00:13,300
그대는 바람 보고 꾸짖는 철없는 짓

5
00:00:13,600 --> 00:00:16,500
치마폭에 싸서 날려 보낸다

6
00:00:16,800 --> 00:00:19,600
하이야 솟구치는 백열의 숨결

7
00:00:19,900 --> 00:00:22,700
배는 화물창 짐승처럼 짖으며 물길을 가르고

8
00:00:23,000 --> 00:00:25,900
검은 해적 같은 외딴 섬이 지나간다

9
00:00:26,200 --> 00:00:29,200
흩어져 날으는 갈매기 떼 날개 뒤로 짠 바람이 분다

10
00:00:29,500 --> 00:00:32,500
발자국마다 고운 피가 고이고

11
00:00:32,800 --> 00:00:35,800
별 하나에 추억과 사랑을 실어 보낸다

12
00:00:36,100 --> 00:00:39,000
쉬이 아침이 오면 바다는 푸른 먹물이 되고

13
00:00:39,300 --> 00:00:43,000
우리의 모든 노래는 지면 위에 영원히 남으리라
        `.trim();

        function parseSRT(data) {
            const pattern = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\n{2,}|\n*$)/g;
            const list = [];
            let match;
            function toSeconds(t) {
                const p = t.replace(',', '.').split(':');
                return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
            }
            while ((match = pattern.exec(data)) !== null) {
                list.push({
                    index: parseInt(match[1]),
                    startTime: toSeconds(match[2]),
                    endTime: toSeconds(match[3]),
                    text: match[4].replace(/\r?\n/g, ' ').trim()
                });
            }
            return list;
        }

        class HandMorphTapestryEngine {
            constructor(container) {
                this.container = container;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.container.appendChild(this.canvas);

                this.audioCtx = null;
                this.audioElement = new Audio();
                this.audioElement.crossOrigin = "anonymous";
                this.analyser = null;
                this.audioSource = null;
                this.audioStreamDest = null;
                this.freqData = null;
                this.isDemoMode = true;

                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.isRecording = false;
                this.recordHoldFrames = 0;

                this.currentTime = 0;
                this.duration = 45;
                this.isPlaying = false;
                this.isPreviewMode = false;

                this.titleText = "갑판 위";
                this.authorText = "정지용 詩";
                this.userFontScale = 1.0;

                this.srtList = [];
                this.charItems = [];
                this.isLayoutCalculated = false;

                this.allFinished = false;
                this.finalInkProgress = 0;
                this.currentFont = "'Nanum Brush Script', cursive";

                this.a4Rect = { x: 0, y: 0, w: 0, h: 0 };
                this.centerOval = { cx: 0, cy: 0, rx: 0, ry: 0 };

                this.paperNoise = document.createElement('canvas');
                this.buildPaperNoise();

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => {
                    this.resize();
                    this.buildPaperNoise();
                });

                document.fonts.ready.then(() => {
                    this.isLayoutCalculated = false;
                });

                this.loadSRT(DEFAULT_DEMO_SRT);
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            resize() {
                const w = this.canvas.width = window.innerWidth;
                const h = this.canvas.height = window.innerHeight;

                const a4Aspect = 1 / 1.4142;
                let paperH = h * 0.90;
                let paperW = paperH * a4Aspect;

                if (paperW > w * 0.90) {
                    paperW = w * 0.90;
                    paperH = paperW / a4Aspect;
                }

                this.a4Rect = {
                    x: (w - paperW) / 2,
                    y: (h - paperH) / 2,
                    w: paperW,
                    h: paperH
                };

                this.centerOval = {
                    cx: this.a4Rect.x + this.a4Rect.w / 2,
                    cy: this.a4Rect.y + this.a4Rect.h / 2,
                    rx: this.a4Rect.w * 0.25,
                    ry: this.a4Rect.h * 0.145
                };

                this.isLayoutCalculated = false;
            }

            buildPaperNoise() {
                this.paperNoise.width = 256;
                this.paperNoise.height = 256;
                const pctx = this.paperNoise.getContext('2d');
                const img = pctx.createImageData(256, 256);
                for (let i = 0; i < img.data.length; i += 4) {
                    const grain = (Math.random() - 0.5) * 18;
                    img.data[i] = 247 + grain;
                    img.data[i + 1] = 244 + grain;
                    img.data[i + 2] = 237 + grain;
                    img.data[i + 3] = 255;
                }
                pctx.putImageData(img, 0, 0);
            }

            loadSRT(text) {
                this.srtList = parseSRT(text);
                if (this.srtList.length > 0) {
                    this.duration = this.srtList[this.srtList.length - 1].endTime + 3.5;
                }
                this.reset();
            }

            setFont(fontStr) {
                this.currentFont = fontStr;
                this.isLayoutCalculated = false;
            }

            setFontScale(scale) {
                this.userFontScale = scale;
                this.isLayoutCalculated = false;
            }

            togglePreview() {
                this.isPreviewMode = !this.isPreviewMode;
                const badge = document.getElementById('preview-badge');
                const btn = document.getElementById('btn-preview');
                if (this.isPreviewMode) {
                    badge.style.display = 'block';
                    btn.classList.add('active');
                } else {
                    badge.style.display = 'none';
                    btn.classList.remove('active');
                    if (!this.allFinished) {
                        this.finalInkProgress = 0;
                    }
                }
            }

            computeLayout() {
                if (!this.srtList || this.srtList.length === 0) return;

                const allCharacters = [];
                this.srtList.forEach(line => {
                    const str = line.text.replace(/\s+/g, '');
                    for (let i = 0; i < str.length; i++) {
                        allCharacters.push({
                            char: str[i],
                            lineIndex: line.index,
                            startTime: line.startTime,
                            endTime: line.endTime,
                            charIndexInLine: i,
                            lineTotalChars: str.length
                        });
                    }
                });

                const totalN = allCharacters.length;
                if (totalN === 0) return;

                const a4 = this.a4Rect;
                const pad = a4.w * 0.04;
                const minX = a4.x + pad;
                const maxX = a4.x + a4.w - pad;
                const minY = a4.y + pad;
                const maxY = a4.y + a4.h - pad;

                const cx = this.centerOval.cx;
                const cy = this.centerOval.cy;
                const rx = this.centerOval.rx * 1.08;
                const ry = this.centerOval.ry * 1.08;

                const totalArea = (maxX - minX) * (maxY - minY) - (Math.PI * rx * ry);
                const idealSpacing = Math.sqrt(totalArea / totalN);

                const particles = [];
                for (let i = 0; i < totalN; i++) {
                    let px, py, safe = false, tries = 0;
                    while (!safe && tries < 150) {
                        px = minX + Math.random() * (maxX - minX);
                        py = minY + Math.random() * (maxY - minY);
                        const q = Math.pow((px - cx) / rx, 2) + Math.pow((py - cy) / ry, 2);
                        if (q >= 1.05) safe = true;
                        tries++;
                    }
                    particles.push({
                        x: px,
                        y: py,
                        vx: 0,
                        vy: 0,
                        baseAngle: ((i * 37) % 60 - 30) * (Math.PI / 180)
                    });
                }

                // 물리적 반발 완화
                const iterations = 80;
                for (let iter = 0; iter < iterations; iter++) {
                    const temp = 1.0 - (iter / iterations);
                    const repulseR = idealSpacing * 1.35;

                    for (let i = 0; i < totalN; i++) {
                        const p1 = particles[i];
                        let fx = 0, fy = 0;

                        for (let j = 0; j < totalN; j++) {
                            if (i === j) continue;
                            const p2 = particles[j];
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const d = Math.hypot(dx, dy) || 0.001;
                            if (d < repulseR) {
                                const repulse = ((repulseR - d) / repulseR) * 14 * temp;
                                fx += (dx / d) * repulse;
                                fy += (dy / d) * repulse;
                            }
                        }

                        const ex = (p1.x - cx) / rx;
                        const ey = (p1.y - cy) / ry;
                        const ovalDist = Math.hypot(ex, ey);
                        if (ovalDist < 1.15) {
                            const push = (1.15 - ovalDist) * 35 * temp;
                            const ang = Math.atan2(ey, ex);
                            fx += Math.cos(ang) * push;
                            fy += Math.sin(ang) * push;
                        }

                        const wallDist = idealSpacing * 0.8;
                        if (p1.x < minX + wallDist) fx += (minX + wallDist - p1.x) * 0.35 * temp;
                        if (p1.x > maxX - wallDist) fx -= (p1.x - (maxX - wallDist)) * 0.35 * temp;
                        if (p1.y < minY + wallDist) fy += (minY + wallDist - p1.y) * 0.35 * temp;
                        if (p1.y > maxY - wallDist) fy -= (p1.y - (maxY - wallDist)) * 0.35 * temp;

                        p1.vx = (p1.vx + fx) * 0.45;
                        p1.vy = (p1.vy + fy) * 0.45;
                        p1.x += p1.vx;
                        p1.y += p1.vy;

                        p1.x = Math.max(minX, Math.min(maxX, p1.x));
                        p1.y = Math.max(minY, Math.min(maxY, p1.y));
                    }
                }

                particles.sort((a, b) => {
                    const angA = Math.atan2(a.y - cy, a.x - cx);
                    const angB = Math.atan2(b.y - cy, b.x - cx);
                    const distA = Math.hypot(a.x - cx, a.y - cy);
                    const distB = Math.hypot(b.x - cy, b.y - cy);
                    return (angA + distA * 0.008) - (angB + distB * 0.008);
                });

                this.charItems = [];
                for (let i = 0; i < totalN; i++) {
                    const p = particles[i];
                    let minD = 9999;
                    for (let j = 0; j < totalN; j++) {
                        if (i === j) continue;
                        const d = Math.hypot(p.x - particles[j].x, p.y - particles[j].y);
                        if (d < minD) minD = d;
                    }

                    const safeSize = Math.max(16, minD * 1.05 * this.userFontScale);

                    this.charItems.push({
                        char: allCharacters[i].char,
                        code: allCharacters[i].char.charCodeAt(0),
                        lineIndex: allCharacters[i].lineIndex,
                        startTime: allCharacters[i].startTime,
                        endTime: allCharacters[i].endTime,
                        charIndexInLine: allCharacters[i].charIndexInLine,
                        lineTotalChars: allCharacters[i].lineTotalChars,
                        targetX: p.x,
                        targetY: p.y,
                        targetAngle: p.baseAngle,
                        targetSize: safeSize,
                        state: 'WAITING',
                        flyProgress: 0,
                        originX: 0,
                        originY: 0
                    });
                }

                this.isLayoutCalculated = true;
            }

            setupAudio(file) {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                this.audioElement.src = URL.createObjectURL(file);
                if (!this.audioSource) {
                    this.audioSource = this.audioCtx.createMediaElementSource(this.audioElement);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64;

                    this.audioStreamDest = this.audioCtx.createMediaStreamDestination();
                    this.audioSource.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                    this.audioSource.connect(this.audioStreamDest);

                    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                }
                this.isDemoMode = false;
                this.audioElement.onloadedmetadata = () => {
                    this.duration = this.audioElement.duration;
                };
            }

            startAutoRecording() {
                if (this.isRecording) {
                    this.stopRecording();
                    return;
                }

                this.reset();
                this.recordHoldFrames = 0;

                const canvasStream = this.canvas.captureStream(60);
                const combinedTracks = [...canvasStream.getVideoTracks()];

                if (this.audioStreamDest && this.audioStreamDest.stream.getAudioTracks().length > 0) {
                    combinedTracks.push(this.audioStreamDest.stream.getAudioTracks()[0]);
                }

                const stream = new MediaStream(combinedTracks);

                const mimeTypes = [
                    'video/mp4;codecs=avc1.4d401f,mp4a.40.2',
                    'video/mp4;codecs=avc1',
                    'video/mp4',
                    'video/webm;codecs=h264',
                    'video/webm'
                ];

                let selectedMime = '';
                for (const mime of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mime)) {
                        selectedMime = mime;
                        break;
                    }
                }

                try {
                    this.mediaRecorder = new MediaRecorder(stream, {
                        mimeType: selectedMime,
                        videoBitsPerSecond: 16000000
                    });
                } catch (e) {
                    this.mediaRecorder = new MediaRecorder(stream);
                }

                this.recordedChunks = [];
                this.mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) this.recordedChunks.push(e.data);
                };

                this.mediaRecorder.onstop = () => {
                    const ext = (selectedMime && selectedMime.includes('mp4')) ? 'mp4' : 'webm';
                    const blob = new Blob(this.recordedChunks, { type: selectedMime || 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `${this.titleText}_hand_morph_art.${ext}`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 300);
                };

                this.mediaRecorder.start(250);
                this.isRecording = true;

                const btn = document.getElementById('btn-record');
                btn.innerText = "⏹️ 녹화 중... (자동 완료)";
                btn.classList.add('recording');

                this.play();
            }

            stopRecording() {
                if (!this.isRecording) return;
                this.isRecording = false;
                if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
                    this.mediaRecorder.stop();
                }
                const btn = document.getElementById('btn-record');
                btn.innerText = "🎬 녹화하며 재생 (MP4)";
                btn.classList.remove('recording');
            }

            play() {
                if (this.isPreviewMode) this.togglePreview();
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;
                if (!this.isDemoMode) {
                    this.audioElement.play();
                }
            }

            pause() {
                this.isPlaying = false;
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                }
            }

            reset() {
                this.currentTime = 0;
                this.isPlaying = false;
                this.allFinished = false;
                this.finalInkProgress = 0;
                this.recordHoldFrames = 0;
                if (this.isPreviewMode) this.togglePreview();
                if (!this.isDemoMode) {
                    this.audioElement.pause();
                    this.audioElement.currentTime = 0;
                }
                this.computeLayout();
            }

            getRMS() {
                if (!this.isPlaying) return 0;
                if (!this.isDemoMode && this.analyser) {
                    this.analyser.getByteFrequencyData(this.freqData);
                    let sum = 0;
                    for (let i = 0; i < this.freqData.length; i++) sum += this.freqData[i];
                    return (sum / this.freqData.length) / 255;
                } else {
                    return (Math.sin(this.currentTime * 4.2) * 0.5 + 0.5) * 0.35;
                }
            }

            easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            /**
             * [스타일 3: 절차적 손가락 스켈레톤 캘리그래피 렌더링 엔진]
             * 글자 중심 획과 다섯 손가락 관절, 손톱, 손바닥 손금 줄기 합성
             */
            drawHandMorphedGlyph(ctx, item, x, y, size, angle, color, alpha, progress, rms, isHero = false) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                const code = item.code || 44032;
                // 글자 고유 형태 시드값
                const seedA = (code * 17) % 100 / 100;
                const seedB = (code * 31) % 100 / 100;
                const seedC = (code * 47) % 100 / 100;

                // 음압 반응형 관절 호흡 계수
                const flex = isHero ? (rms * 0.45) : 0;

                // --- 1. 코어 캘리그라피 한글 텍스트 렌더링 ---
                ctx.font = `bold ${size}px ${this.currentFont}`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                if (progress > 0.05) {
                    ctx.shadowColor = `rgba(10, 10, 15, ${0.28 * progress})`;
                    ctx.shadowBlur = 2.5 * progress;
                }
                ctx.fillText(item.char, 0, 0);

                // --- 2. 손목 및 손바닥 밑둥 획 (Wrist & Palm Root) ---
                const wristW = size * 0.28;
                const wristH = size * 0.45;
                ctx.lineWidth = Math.max(1.8, size * 0.08);

                ctx.beginPath();
                ctx.moveTo(-wristW * 0.6, size * 0.35);
                ctx.quadraticCurveTo(-wristW * 0.3, size * 0.35 + wristH * 0.7, 0, size * 0.35 + wristH);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(wristW * 0.6, size * 0.35);
                ctx.quadraticCurveTo(wristW * 0.3, size * 0.35 + wristH * 0.7, 0, size * 0.35 + wristH);
                ctx.stroke();

                // 손금 주름선 (Palm crease lines)
                ctx.lineWidth = Math.max(1.0, size * 0.035);
                ctx.beginPath();
                ctx.moveTo(-wristW * 0.4, size * 0.22);
                ctx.quadraticCurveTo(0, size * 0.32, wristW * 0.5, size * 0.24);
                ctx.stroke();

                // --- 3. 다섯 손가락 관절 및 손톱 스플라인 렌더링 ---
                const fingerConfigs = [
                    // 엄지 (Thumb: 좌하단으로 꺾여 나옴)
                    {
                        startX: -size * 0.32, startY: size * 0.15,
                        ctrlX: -size * (0.65 + seedA * 0.15 + flex), ctrlY: size * (0.12 - flex),
                        endX: -size * (0.85 + seedB * 0.15 + flex), endY: -size * (0.05 + flex),
                        thick: size * 0.11, nailR: size * 0.065
                    },
                    // 검지 (Index: 좌상단)
                    {
                        startX: -size * 0.22, startY: -size * 0.25,
                        ctrlX: -size * (0.35 + seedB * 0.12), ctrlY: -size * (0.65 + flex),
                        endX: -size * (0.42 + seedC * 0.15), endY: -size * (0.88 + flex * 1.2),
                        thick: size * 0.095, nailR: size * 0.055
                    },
                    // 중지 (Middle: 가장 높게 중앙 상단)
                    {
                        startX: 0, startY: -size * 0.35,
                        ctrlX: size * (seedA * 0.15 - 0.075), ctrlY: -size * (0.75 + flex),
                        endX: size * (seedB * 0.12 - 0.06), endY: -size * (1.05 + flex * 1.3),
                        thick: size * 0.10, nailR: size * 0.06
                    },
                    // 약지 (Ring: 우상단)
                    {
                        startX: size * 0.22, startY: -size * 0.26,
                        ctrlX: size * (0.38 + seedC * 0.12), ctrlY: -size * (0.62 + flex),
                        endX: size * (0.48 + seedA * 0.15), endY: -size * (0.86 + flex * 1.1),
                        thick: size * 0.09, nailR: size * 0.052
                    },
                    // 새끼 (Pinky: 우측으로 앙증맞게 뻗음)
                    {
                        startX: size * 0.35, startY: -size * 0.05,
                        ctrlX: size * (0.65 + seedB * 0.15 + flex), ctrlY: -size * (0.32 + flex),
                        endX: size * (0.82 + seedC * 0.15 + flex), endY: -size * (0.48 + flex),
                        thick: size * 0.075, nailR: size * 0.045
                    }
                ];

                fingerConfigs.forEach(f => {
                    // 손가락 줄기 획 (베지에 곡선)
                    ctx.lineWidth = f.thick;
                    ctx.beginPath();
                    ctx.moveTo(f.startX, f.startY);
                    ctx.quadraticCurveTo(f.ctrlX, f.ctrlY, f.endX, f.endY);
                    ctx.stroke();

                    // 관절 마디 부풀림 (Knuckle swellings)
                    const midX = (f.startX + f.ctrlX * 2 + f.endX) / 4;
                    const midY = (f.startY + f.ctrlY * 2 + f.endY) / 4;
                    ctx.lineWidth = Math.max(1.2, f.thick * 0.32);
                    ctx.beginPath();
                    ctx.arc(midX, midY, f.thick * 0.55, 0, Math.PI * 2);
                    ctx.stroke();

                    // 손톱 윤곽선 (Fingernail arc)
                    ctx.lineWidth = Math.max(1.0, f.thick * 0.28);
                    ctx.beginPath();
                    ctx.arc(f.endX, f.endY, f.nailR, 0, Math.PI * 2);
                    ctx.stroke();
                });

                ctx.restore();
            }

            loop() {
                if (this.isPlaying && !this.isPreviewMode) {
                    if (this.isDemoMode) {
                        this.currentTime += 1 / 60;
                        if (this.currentTime >= this.duration) {
                            this.currentTime = this.duration;
                        }
                    } else {
                        this.currentTime = this.audioElement.currentTime;
                    }
                }

                if (!this.isLayoutCalculated) {
                    this.computeLayout();
                }

                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.renderBackground(ctx);

                const rms = this.getRMS();

                // 글자 상태 전이
                this.charItems.forEach(item => {
                    if (this.currentTime < item.startTime) {
                        item.state = 'WAITING';
                        item.flyProgress = 0;
                    } else if (this.currentTime >= item.startTime && this.currentTime <= item.endTime) {
                        item.state = 'ACTIVE';
                        item.flyProgress = 0;
                    } else if (this.currentTime > item.endTime) {
                        if (item.state === 'ACTIVE' || item.state === 'WAITING') {
                            item.state = 'FLYING';
                            item.flyProgress = 0;
                        } else if (item.state === 'FLYING') {
                            item.flyProgress += 0.038;
                            if (item.flyProgress >= 1.0) {
                                item.flyProgress = 1.0;
                                item.state = 'STAMPED';
                            }
                        }
                    }
                });

                // 모든 자막 글자가 지면에 완전히 박혔는지 체크
                const totalCharsCount = this.charItems.length;
                const stampedCount = this.charItems.filter(it => it.state === 'STAMPED').length;
                const isAllStamped = (totalCharsCount > 0 && stampedCount === totalCharsCount);

                if (isAllStamped) {
                    this.allFinished = true;
                }

                // 흑색 손가락 트랜지션 (곡 진행 중 0 유지 -> 마지막 자막 안착 후 0 -> 1)
                if (this.isPreviewMode) {
                    // 미리보기 모드일 때만 먹빛 강제
                } else if (this.allFinished) {
                    this.finalInkProgress = Math.min(1.0, this.finalInkProgress + 0.007);
                    
                    if (this.finalInkProgress >= 1.0 && this.isRecording) {
                        this.recordHoldFrames++;
                        if (this.recordHoldFrames > 90) {
                            this.isPlaying = false;
                            this.stopRecording();
                        }
                    }
                } else {
                    this.finalInkProgress = 0;
                }

                // 1. 지면 안착 레이어 (손가락 획 유기적 변형)
                this.renderStampedLayer(ctx, rms);

                // 2. 날아가는 레이어
                if (!this.isPreviewMode) {
                    this.renderFlyingLayer(ctx, rms);
                }

                // 3. 중앙 타원 영역 (제목/글쓴이 및 실시간 히어로 타이핑 가사)
                this.renderCenterOvalZone(ctx, rms);

                this.updateUI();
                requestAnimationFrame(this.loop);
            }

            renderBackground(ctx) {
                ctx.fillStyle = "#0a0a0c";
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                ctx.save();
                ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
                ctx.shadowBlur = 45;
                ctx.shadowOffsetY = 18;

                ctx.fillStyle = "#f6f3ea";
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();

                ctx.save();
                ctx.globalCompositeOperation = "multiply";
                ctx.globalAlpha = 0.52;
                const ptrn = ctx.createPattern(this.paperNoise, 'repeat');
                ctx.fillStyle = ptrn;
                ctx.fillRect(this.a4Rect.x, this.a4Rect.y, this.a4Rect.w, this.a4Rect.h);
                ctx.restore();
            }

            renderCenterOvalZone(ctx, rms) {
                const oval = this.centerOval;
                const progress = this.isPreviewMode ? 1.0 : this.finalInkProgress;

                ctx.save();

                // 타원 내부 정돈된 여백 마스크
                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx * 1.03, oval.ry * 1.03, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#f6f3ea";
                ctx.fill();

                const borderAlpha1 = 0.12 + (0.35 - 0.12) * progress;
                const borderAlpha2 = 0.05 + (0.15 - 0.05) * progress;

                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx, oval.ry, 0, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(40, 40, 45, ${borderAlpha1})`;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(oval.cx, oval.cy, oval.rx * 0.96, oval.ry * 0.96, 0, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(40, 40, 45, ${borderAlpha2})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // 상단: 제목 / 글쓴이 / 낙관
                const titleY = oval.cy - oval.ry * 0.48;
                const authorY = oval.cy - oval.ry * 0.16;

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                const titleAlpha = 0.20 + (0.95 - 0.20) * progress;
                const titleGrey = Math.floor(190 - (190 - 16) * progress);
                ctx.font = `bold ${oval.ry * 0.32}px ${this.currentFont}`;
                ctx.fillStyle = `rgba(${titleGrey}, ${titleGrey}, ${titleGrey}, ${titleAlpha})`;
                if (progress > 0) {
                    ctx.shadowColor = `rgba(0,0,0,${0.25 * progress})`;
                    ctx.shadowBlur = 3 * progress;
                }
                ctx.fillText(this.titleText, oval.cx - oval.rx * 0.10, titleY);

                const authorAlpha = 0.18 + (0.80 - 0.18) * progress;
                const authorGrey = Math.floor(190 - (190 - 60) * progress);
                ctx.font = `500 ${oval.ry * 0.18}px 'Gowun Batang', serif`;
                ctx.fillStyle = `rgba(${authorGrey}, ${authorGrey}, ${authorGrey}, ${authorAlpha})`;
                ctx.shadowBlur = 0;
                ctx.fillText(this.authorText, oval.cx - oval.rx * 0.12, authorY);

                const sealS = oval.ry * 0.24;
                const sealX = oval.cx + (oval.rx * 0.36);
                const sealY = authorY - sealS * 0.5;

                const sealR = Math.floor(190 + (158 - 190) * progress);
                const sealG = Math.floor(190 + (42 - 190) * progress);
                const sealB = Math.floor(190 + (43 - 190) * progress);
                const sealAlpha = 0.20 + (1.0 - 0.20) * progress;

                ctx.fillStyle = `rgba(${sealR}, ${sealG}, ${sealB}, ${sealAlpha})`;
                ctx.fillRect(sealX, sealY, sealS, sealS);

                ctx.strokeStyle = `rgba(${Math.floor(sealR * 0.8)}, ${Math.floor(sealG * 0.8)}, ${Math.floor(sealB * 0.8)}, ${sealAlpha})`;
                ctx.lineWidth = 1;
                ctx.strokeRect(sealX, sealY, sealS, sealS);

                ctx.fillStyle = `rgba(246, 243, 234, ${0.4 + 0.6 * progress})`;
                ctx.font = `bold ${sealS * 0.45}px serif`;
                ctx.fillText("心", sealX + sealS * 0.5, sealY + sealS * 0.35);
                ctx.fillText("印", sealX + sealS * 0.5, sealY + sealS * 0.75);

                // 하단: 실시간 손가락 획 타이핑 가사
                if (!this.isPreviewMode) {
                    const activeChars = this.charItems.filter(it => it.state === 'ACTIVE');
                    if (activeChars.length > 0) {
                        const curLine = this.srtList.find(l => l.index === activeChars[0].lineIndex);
                        if (curLine) {
                            const lyricY = oval.cy + oval.ry * 0.40;
                            const beat = 1.0 + (rms * 0.24);

                            let lyricFontSize = Math.max(34, this.a4Rect.w * 0.052 * beat);
                            ctx.font = `bold ${lyricFontSize}px ${this.currentFont}`;

                            const lineElapsed = this.currentTime - curLine.startTime;
                            const lineDuration = Math.max(0.1, curLine.endTime - curLine.startTime);
                            const typeDuration = lineDuration * 0.65;
                            const typeProgress = Math.min(1.0, lineElapsed / typeDuration);
                            const visibleCharsCount = Math.max(1, Math.min(curLine.text.length, Math.floor(typeProgress * curLine.text.length) + 1));

                            const maxW = oval.rx * 1.82;
                            const measuredW = ctx.measureText(curLine.text).width;
                            if (measuredW > maxW) {
                                lyricFontSize *= (maxW / measuredW);
                                ctx.font = `bold ${lyricFontSize}px ${this.currentFont}`;
                            }

                            const charWidth = (measuredW / curLine.text.length);
                            const startX = oval.cx - (measuredW / 2);

                            for (let i = 0; i < visibleCharsCount; i++) {
                                const cxPos = startX + (i * charWidth) + (charWidth / 2);
                                const targetCharItem = activeChars.find(it => it.charIndexInLine === i);

                                if (targetCharItem) {
                                    targetCharItem.originX = cxPos;
                                    targetCharItem.originY = lyricY;

                                    // 활성 가사 글자마다 손가락 관절 호흡 렌더링
                                    this.drawHandMorphedGlyph(
                                        ctx, targetCharItem, cxPos, lyricY,
                                        lyricFontSize, 0, "#0a0a0c", 1.0, 1.0, rms, true
                                    );
                                }
                            }
                        }
                    }
                }

                ctx.restore();
            }

            renderStampedLayer(ctx, rms) {
                const progress = this.isPreviewMode ? 1.0 : this.finalInkProgress;

                this.charItems.forEach(item => {
                    const isVisible = this.isPreviewMode || item.state === 'STAMPED';
                    if (isVisible) {
                        const alpha = 0.18 + (0.96 - 0.18) * progress;
                        const grey = Math.floor(190 - (190 - 16) * progress);
                        const color = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;

                        this.drawHandMorphedGlyph(
                            ctx, item, item.targetX, item.targetY,
                            item.targetSize, item.targetAngle, color, alpha, progress, 0, false
                        );
                    }
                });
            }

            renderFlyingLayer(ctx, rms) {
                this.charItems.forEach(item => {
                    if (item.state === 'FLYING') {
                        const t = this.easeOutCubic(item.flyProgress);

                        const startX = item.originX || this.centerOval.cx;
                        const startY = item.originY || (this.centerOval.cy + this.centerOval.ry * 0.40);

                        const curX = startX + (item.targetX - startX) * t;
                        const curY = startY + (item.targetY - startY) * t;
                        const curAngle = item.targetAngle * t;

                        const startSize = this.centerOval.ry * 0.32;
                        const curSize = startSize + (item.targetSize - startSize) * t;

                        const alpha = 1.0 - (1.0 - 0.18) * t;
                        const grey = Math.floor(16 + (190 - 16) * t);
                        const color = `rgba(${grey}, ${grey}, ${grey}, ${alpha})`;

                        this.drawHandMorphedGlyph(
                            ctx, item, curX, curY, curSize, curAngle,
                            color, alpha, 0, 0, false
                        );
                    }
                });
            }

            updateUI() {
                const fmt = (s) => {
                    const m = Math.floor(s / 60);
                    const sec = Math.floor(s % 60);
                    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                };
                document.getElementById('time-display').innerText = 
                    `${fmt(this.currentTime)} / ${fmt(this.duration)}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const engine = new HandMorphTapestryEngine(container);

            const btnPlay = document.getElementById('btn-play');
            const btnRecord = document.getElementById('btn-record');
            const btnPreview = document.getElementById('btn-preview');
            const btnReset = document.getElementById('btn-reset');
            const fontSelect = document.getElementById('font-select');
            const scaleSlider = document.getElementById('scale-slider');
            const titleInput = document.getElementById('title-input');
            const authorInput = document.getElementById('author-input');
            const audioInput = document.getElementById('audio-input');
            const srtInput = document.getElementById('srt-input');

            btnPlay.addEventListener('click', () => {
                if (engine.isPlaying) {
                    engine.pause();
                    btnPlay.innerText = "▶ 재생";
                } else {
                    engine.play();
                    btnPlay.innerText = "⏸ 일시정지";
                }
            });

            btnRecord.addEventListener('click', () => {
                engine.startAutoRecording();
            });

            btnPreview.addEventListener('click', () => {
                engine.togglePreview();
            });

            btnReset.addEventListener('click', () => {
                engine.reset();
                btnPlay.innerText = "▶ 재생";
            });

            scaleSlider.addEventListener('input', (e) => {
                engine.setFontScale(parseFloat(e.target.value));
            });

            titleInput.addEventListener('input', (e) => {
                engine.titleText = e.target.value;
            });

            authorInput.addEventListener('input', (e) => {
                engine.authorText = e.target.value;
            });

            fontSelect.addEventListener('change', (e) => {
                engine.setFont(e.target.value);
            });

            audioInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    engine.setupAudio(f);
                    btnPlay.innerText = "▶ MP3 재생";
                }
            });

            srtInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        engine.loadSRT(evt.target.result);
                        btnPlay.innerText = "▶ 재생";
                    };
                    reader.readAsText(f);
                }
            });
        });
    </script>
</body>
</html>
