<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K 손바닥 시화(詩畫) 캘리그라피 생성기</title>
  <!-- 전통 캘리그라피 및 명조 한글 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090c;
      --panel-bg: #13151c;
      --accent-gold: #d4af37;
      --accent-red: #c0292b;
      --paper-cream: #f4edd9;
      --ink-black: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Nanum Myeongjo', serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 사이드바 */
    #sidebar {
      width: 420px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-420px);
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      font-family: 'Nanum Brush Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .panel-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* 설정 적용 액션 배너 */
    .apply-action-box {
      background: #191c28;
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }

    button.btn-apply {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 800;
      font-size: 0.98rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    button.btn-apply:hover:not(:disabled) {
      background: #ebd274;
      transform: translateY(-1px);
    }

    button.btn-apply:disabled {
      background: #444a59;
      color: #8f96a8;
      cursor: not-allowed;
      transform: none;
    }

    #apply-status-text {
      font-size: 0.8rem;
      text-align: center;
      color: #a2a8ba;
    }

    .form-group label {
      font-size: 0.82rem;
      color: #a2a8ba;
      margin-bottom: 4px;
      display: block;
      font-weight: bold;
    }

    /* 슬라이더 + 숫자 직접 입력 */
    .slider-number-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-number-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .slider-number-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      background: #1b1e2a;
      border: 1px solid #333a4d;
      border-radius: 6px;
      color: var(--accent-gold);
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: bold;
      text-align: right;
      outline: none;
    }

    .slider-number-row input[type="number"]:focus {
      border-color: var(--accent-gold);
    }

    select, textarea, input[type="file"], button {
      width: 100%;
      padding: 8px 12px;
      background: #1b1e2a;
      border: 1px solid #2e3548;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .control-sub-box {
      background: #171922;
      border: 1px solid #282e3d;
      border-radius: 6px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .control-sub-box .sub-title {
      font-size: 0.82rem;
      color: var(--accent-gold);
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #bbb;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .mode-tabs {
      display: flex;
      border: 1px solid #333a4d;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #191c26;
      border: none;
      color: #8f96a8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0b0c10;
    }

    .file-box {
      background: #171a24;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #3a4259;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.76rem;
      color: #55db88;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary {
      background: var(--accent-gold);
      color: #0b0c10;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover:not(:disabled) {
      background: #ebd274;
    }

    button.btn-primary:disabled {
      background: #444a59;
      color: #777;
      cursor: not-allowed;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid #444d66;
      cursor: pointer;
    }

    #toggle-sidebar {
      position: absolute;
      left: 420px;
      top: 24px;
      width: 32px;
      height: 38px;
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed + #toggle-sidebar {
      left: 0;
    }

    /* 반응형 뷰포트 */
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #181b24 0%, #050608 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-viewport-scaler {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2K 고정 그림판 */
    #poem-scroll {
      position: relative;
      background: var(--paper-cream);
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(195, 170, 130, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(180, 155, 120, 0.32) 0%, transparent 70%);
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 140px rgba(150, 130, 90, 0.3);
      border: 24px solid #1a1510;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.8s ease;
    }

    #poem-scroll.ratio-16-9 {
      width: 2560px;
      height: 1440px;
      padding: 80px 120px;
    }

    #poem-scroll.ratio-9-16 {
      width: 1440px;
      height: 2560px;
      padding: 120px 80px;
    }

    /* 도킹된 손바닥 갤러리 */
    #scroll-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 36px;
      position: relative;
      z-index: 10;
    }

    .docked-palm-card {
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6) translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .docked-palm-card.landed {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* 박힌 손바닥 기본 상태: 흐린 회색 톤 */
    .docked-palm-card canvas {
      filter: grayscale(100%) opacity(28%);
      transition: filter 1.2s ease, transform 0.8s ease;
    }

    /* 마지막 자막 박힌 후 전체 칠흑색 먹물 완성 트랜지션 */
    #poem-scroll.completed .docked-palm-card canvas {
      filter: grayscale(0%) opacity(95%) drop-shadow(4px 8px 12px rgba(0, 0, 0, 0.45));
    }

    #poem-scroll.completed {
      box-shadow: 0 0 100px rgba(212, 175, 55, 0.5), inset 0 0 140px rgba(150, 130, 90, 0.3);
    }

    /* 화면 중앙 실시간 손바닥 타이핑 포커스 */
    #center-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-palm-wrap {
      padding: 30px;
      border-radius: 20px;
      background: rgba(244, 237, 217, 0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 80px rgba(212, 175, 55, 0.55);
      opacity: 0;
      transform: scale(0.65);
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #center-palm-wrap.active {
      opacity: 1;
      transform: scale(1.06);
    }

    /* 낙관 인장 */
    #red-seal {
      position: absolute;
      border: 6px solid var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      opacity: 0;
      transform: scale(2.5) rotate(10deg);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    #poem-scroll.ratio-16-9 #red-seal {
      right: 90px;
      bottom: 80px;
      width: 110px;
      height: 110px;
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    #poem-scroll.ratio-9-16 #red-seal {
      right: 90px;
      bottom: 120px;
      width: 120px;
      height: 120px;
      font-size: 2.4rem;
      letter-spacing: 4px;
    }

    #poem-scroll.completed #red-seal {
      opacity: 0.94;
      transform: scale(1) rotate(0deg);
    }

    /* 타임라인 바 */
    #timeline-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      min-width: 480px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(19, 21, 28, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 80;
    }

    #time-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #time-text {
      font-size: 0.85rem;
      font-family: monospace;
      color: #bbb;
      min-width: 95px;
    }
  </style>
</head>
<body>

  <!-- 조작 사이드바 -->
  <aside id="sidebar">
    <div class="panel-header">
      <h1>2K 詩畫 캘리그라피</h1>
    </div>

    <div class="panel-body">
      <!-- [핵심 추가] 설정 적용 및 렌더링 진행 버튼 -->
      <div class="apply-action-box">
        <button class="btn-apply" id="btn-apply">⚡ 설정 적용 및 2K 렌더링</button>
        <div id="apply-status-text">설정을 조절한 후 버튼을 눌러 적용하세요.</div>
      </div>

      <!-- 캔버스 규격 -->
      <div class="form-group">
        <label for="ratio-select">캔버스 규격 (2K 고정)</label>
        <select id="ratio-select">
          <option value="16:9">16 : 9 가로형 (2560 × 1440, QHD)</option>
          <option value="9:16">9 : 16 세로형 (1440 × 2560, 숏폼/릴스)</option>
        </select>
      </div>

      <!-- 형상 스타일 선택 -->
      <div class="form-group">
        <label for="shape-type">시화 형상 스타일</label>
        <select id="shape-type">
          <option value="hand" selected>✋ 손바닥 캘리그램 (문장 + 5손가락 먹물 붓질)</option>
          <option value="oval">⬭ 와이드 타원 뱃지 (문장 + 수묵 띠)</option>
          <option value="rect">■ 사각 인장 (전각 전서체 - 직각 꽉 채움)</option>
          <option value="star">★ 별 문양 각인 (문장 + 판타지 별)</option>
        </select>
      </div>

      <!-- [사각 인장 옵션] -->
      <div class="control-sub-box" id="box-seal-options" style="display: none;">
        <div class="sub-title">사각 인장 도장 전용 설정</div>
        <div class="form-group">
          <label for="seal-carve-mode">각법 (도장 형식)</label>
          <select id="seal-carve-mode">
            <option value="yang">양각 (陽刻 - 붉은 테두리 + 붉은 글자)</option>
            <option value="eum">음각 (陰刻 - 사각 덩어리 파내기, 여백 無)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="seal-color-mode">인장 색상</label>
          <select id="seal-color-mode">
            <option value="red">전통 주사위 인주 (朱肉, 붉은색)</option>
            <option value="black">수묵 먹물 (墨, 칠흑색)</option>
          </select>
        </div>
      </div>

      <!-- 1. 손바닥 시화 크기 배율 -->
      <div class="form-group">
        <label>손바닥 시화 크기 배율 (%)</label>
        <div class="slider-number-row">
          <input type="range" id="glyph-scale-range" min="50" max="180" value="100">
          <input type="number" id="glyph-scale-num" min="50" max="180" value="100">
        </div>
      </div>

      <!-- 2. 글자 필압 조절 -->
      <div class="control-sub-box">
        <div class="sub-title">문장 글씨(손바닥 안쪽) 필압 조절</div>
        <div class="form-group">
          <label>글자 획 두께 (px)</label>
          <div class="slider-number-row">
            <input type="range" id="text-stroke-range" min="1" max="14" value="4" step="0.5">
            <input type="number" id="text-stroke-num" min="1" max="14" value="4" step="0.5">
          </div>
        </div>
      </div>

      <!-- 3. 손가락 수묵 붓질 두께 조절 -->
      <div class="control-sub-box">
        <div class="sub-title">손가락 붓질(외곽 수묵 획) 조절</div>
        <div class="form-group">
          <label>손가락 붓질 두께 (px)</label>
          <div class="slider-number-row">
            <input type="range" id="finger-brush-range" min="8" max="42" value="22" step="1">
            <input type="number" id="finger-brush-num" min="8" max="42" value="22" step="1">
          </div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="show-splatter" checked>
          <span>수묵 먹물 튀김(비백·갈필 스플래터) 효과</span>
        </label>
      </div>

      <!-- 모드 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-srt">SRT 자막 모드</button>
        <button class="mode-tab" id="tab-direct">직접 입력 모드</button>
      </div>

      <!-- SRT 업로드 -->
      <div id="section-srt" class="file-box">
        <label for="srt-input">SRT 자막 파일 업로드</label>
        <input type="file" id="srt-input" accept=".srt">
        <div id="srt-status" class="status-badge">파일을 선택해주세요.</div>
      </div>

      <!-- 직접 텍스트 입력 -->
      <div id="section-direct" class="form-group" style="display: none;">
        <label for="direct-text">직접 글 입력 (한 줄이 손바닥 한 개)</label>
        <textarea id="direct-text">동글동글 굴러오는 짠 바람에
뺨마다 고운 피가 고이고
하늘과 바람과 별과 시
내 모든 삶이 빛나는 형상이 되리라</textarea>
      </div>

      <!-- 배경 음악 -->
      <div class="file-box">
        <label for="audio-input">배경 음악 (선택 사항)</label>
        <input type="file" id="audio-input" accept="audio/*">
        <audio id="bg-audio" style="display: none;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-play">시연 시작</button>
        <button class="btn-secondary" id="btn-reset">초기화</button>
      </div>
    </div>
  </aside>

  <div id="toggle-sidebar">◀</div>

  <main id="viewport">
    <div id="canvas-viewport-scaler">
      <div id="poem-scroll" class="ratio-16-9">
        <div id="scroll-content"></div>
        <div id="red-seal">千古<br>詩心</div>

        <div id="center-stage">
          <div id="center-palm-wrap"></div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <span id="time-text">00:00 / 00:00</span>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
    </div>
  </main>

  <script>
    /* -------------------------------------------------------------
       1. 슬라이더 <-> 숫자 인풋 가벼운 양방향 동기화 (렌더링 호출 안 함)
       ------------------------------------------------------------- */
    function bindSliderNumberLight(rangeId, numId) {
      const rangeEl = document.getElementById(rangeId);
      const numEl = document.getElementById(numId);
      rangeEl.addEventListener('input', () => { numEl.value = rangeEl.value; });
      numEl.addEventListener('input', () => { rangeEl.value = numEl.value; });
    }

    bindSliderNumberLight('glyph-scale-range', 'glyph-scale-num');
    bindSliderNumberLight('text-stroke-range', 'text-stroke-num');
    bindSliderNumberLight('finger-brush-range', 'finger-brush-num');

    /* -------------------------------------------------------------
       2. 수묵 갈필 및 테이퍼드 곡선 렌더러
       ------------------------------------------------------------- */
    function drawTaperedCalliStroke(ctx, pts, startW, midW, endW, color = '#111115') {
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const count = pts.length;
      if (count < 2) return;

      for (let i = 0; i < count - 1; i++) {
        const p0 = pts[i];
        const p1 = pts[i + 1];
        const t = i / (count - 1);
        let w = (t < 0.5) 
          ? startW * (1 - t * 2) + midW * (t * 2)
          : midW * (1 - (t - 0.5) * 2) + endW * ((t - 0.5) * 2);

        ctx.beginPath();
        ctx.lineWidth = Math.max(1, w);
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        if (w > 6 && i % 2 === 0) {
          ctx.beginPath();
          ctx.lineWidth = Math.max(1, w * 0.28);
          ctx.moveTo(p0.x + (Math.random() - 0.5) * w * 0.6, p0.y + (Math.random() - 0.5) * w * 0.6);
          ctx.lineTo(p1.x + (Math.random() - 0.5) * w * 0.6, p1.y + (Math.random() - 0.5) * w * 0.6);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    /* -------------------------------------------------------------
       3. 손바닥 시화 캘리그램 렌더러 (Image 2 스타일)
       ------------------------------------------------------------- */
    function renderPalmCalligram(sentence, targetSize, options) {
      const { textStroke, fingerBrush, showSplatter } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const s = targetSize / 600;
      const brushW = fingerBrush * s;

      // 1. 엄지손가락
      const thumbPts = [
        { x: 175 * s, y: 390 * s },
        { x: 130 * s, y: 340 * s },
        { x: 80 * s,  y: 280 * s },
        { x: 70 * s,  y: 220 * s },
        { x: 85 * s,  y: 195 * s },
        { x: 110 * s, y: 200 * s },
        { x: 155 * s, y: 250 * s }
      ];
      drawTaperedCalliStroke(ctx, thumbPts, brushW * 0.8, brushW * 1.35, brushW * 0.3);

      // 2. 검지손가락
      const indexPts = [
        { x: 190 * s, y: 210 * s },
        { x: 195 * s, y: 130 * s },
        { x: 210 * s, y: 75 * s },
        { x: 225 * s, y: 65 * s },
        { x: 240 * s, y: 78 * s },
        { x: 245 * s, y: 140 * s }
      ];
      drawTaperedCalliStroke(ctx, indexPts, brushW * 0.85, brushW * 1.3, brushW * 0.3);

      // 3. 중지손가락
      const middlePts = [
        { x: 330 * s, y: 190 * s },
        { x: 345 * s, y: 110 * s },
        { x: 360 * s, y: 55 * s },
        { x: 380 * s, y: 45 * s },
        { x: 400 * s, y: 60 * s },
        { x: 410 * s, y: 130 * s }
      ];
      drawTaperedCalliStroke(ctx, middlePts, brushW * 0.9, brushW * 1.45, brushW * 0.3);

      // 4. 약지손가락
      const ringPts = [
        { x: 420 * s, y: 170 * s },
        { x: 440 * s, y: 120 * s },
        { x: 465 * s, y: 85 * s },
        { x: 485 * s, y: 95 * s },
        { x: 495 * s, y: 150 * s }
      ];
      drawTaperedCalliStroke(ctx, ringPts, brushW * 0.85, brushW * 1.3, brushW * 0.3);

      // 5. 새끼손가락 & 우측 손바닥 테두리
      const pinkyPts = [
        { x: 495 * s, y: 170 * s },
        { x: 525 * s, y: 190 * s },
        { x: 535 * s, y: 250 * s },
        { x: 520 * s, y: 340 * s },
        { x: 480 * s, y: 430 * s },
        { x: 430 * s, y: 490 * s }
      ];
      drawTaperedCalliStroke(ctx, pinkyPts, brushW * 0.9, brushW * 1.5, brushW * 0.4);

      // 6. 손목 하단 받침 먹선
      const wristPts = [
        { x: 430 * s, y: 490 * s },
        { x: 360 * s, y: 535 * s },
        { x: 260 * s, y: 545 * s },
        { x: 200 * s, y: 510 * s },
        { x: 175 * s, y: 440 * s }
      ];
      drawTaperedCalliStroke(ctx, wristPts, brushW * 1.2, brushW * 1.5, brushW * 0.5);

      // 7. 수묵 먹물 스플래터
      if (showSplatter) {
        ctx.fillStyle = '#111115';
        const splatters = [
          { x: 205 * s, y: 55 * s, r: 2.5 * s },
          { x: 228 * s, y: 48 * s, r: 1.8 * s },
          { x: 375 * s, y: 35 * s, r: 3.2 * s },
          { x: 405 * s, y: 40 * s, r: 2.0 * s },
          { x: 490 * s, y: 75 * s, r: 2.2 * s },
          { x: 65 * s,  y: 195 * s, r: 2.5 * s },
          { x: 540 * s, y: 220 * s, r: 2.8 * s },
          { x: 515 * s, y: 450 * s, r: 2.0 * s }
        ];
        splatters.forEach(sp => {
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 8. 손바닥 중심부 문장 캘리그라피 배치
      const words = sentence.trim().split(/\s+/);
      let lines = [];
      if (words.length <= 2) {
        lines = [words.join(' ')];
      } else if (words.length <= 4) {
        lines = [words.slice(0, 2).join(' '), words.slice(2).join(' ')];
      } else if (words.length <= 6) {
        lines = [
          words.slice(0, 2).join(' '),
          words.slice(2, 4).join(' '),
          words.slice(4).join(' ')
        ];
      } else {
        const mid = Math.ceil(words.length / 4);
        lines = [
          words.slice(0, mid).join(' '),
          words.slice(mid, mid * 2).join(' '),
          words.slice(mid * 2, mid * 3).join(' '),
          words.slice(mid * 3).join(' ')
        ];
      }

      const maxLineLen = Math.max(...lines.map(l => l.length));
      const fontSize = Math.floor(Math.min(
        (260 * s) / (maxLineLen * 0.85),
        (250 * s) / (lines.length * 1.15)
      ));

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${fontSize}px 'Black Han Sans', 'Nanum Brush Script', sans-serif`;

      const centerX = 320 * s;
      const centerY = 330 * s;
      const lineH = fontSize * 1.15;
      const totalH = lines.length * lineH;
      const startY = centerY - (totalH / 2) + (lineH / 2);

      lines.forEach((lineText, idx) => {
        const y = startY + idx * lineH;
        const angle = (idx - lines.length / 2) * 0.035;

        ctx.save();
        ctx.translate(centerX, y);
        ctx.rotate(angle);

        if (textStroke > 1) {
          ctx.lineWidth = textStroke * s * 1.8;
          ctx.strokeStyle = '#111115';
          ctx.lineJoin = 'round';
          ctx.strokeText(lineText, 0, 0);
        }
        ctx.fillStyle = '#111115';
        ctx.fillText(lineText, 0, 0);
        ctx.restore();
      });

      ctx.restore();
      return canvas;
    }

    /* -------------------------------------------------------------
       4. 기타 형상 렌더러
       ------------------------------------------------------------- */
    function renderWideOvalCalligram(sentence, targetSize, options) {
      const { textStroke, fingerBrush } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const cx = targetSize / 2;
      const cy = targetSize / 2;
      const rx = targetSize * 0.44;
      const ry = targetSize * 0.22;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.lineWidth = fingerBrush * 0.7;
      ctx.strokeStyle = '#111115';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fontSize = Math.floor(Math.min(targetSize * 0.09, (rx * 1.6) / sentence.length * 1.2));
      ctx.font = `bold ${fontSize}px 'Nanum Brush Script', cursive`;
      if (textStroke > 1) {
        ctx.lineWidth = textStroke * 1.5;
        ctx.strokeStyle = '#111115';
        ctx.strokeText(sentence, cx, cy);
      }
      ctx.fillStyle = '#111115';
      ctx.fillText(sentence, cx, cy);
      ctx.restore();

      return canvas;
    }

    function renderSquareSealCalligram(sentence, targetSize, options) {
      const { carveMode, colorMode } = options;
      const primaryColor = (colorMode === 'red') ? '#c0292b' : '#111115';
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const pad = targetSize * 0.08;
      const innerW = targetSize - pad * 2;

      if (carveMode === 'eum') {
        ctx.fillStyle = primaryColor;
        ctx.fillRect(pad, pad, innerW, innerW);
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.lineWidth = Math.max(3, targetSize * 0.045);
        ctx.strokeStyle = primaryColor;
        ctx.strokeRect(pad, pad, innerW, innerW);
        ctx.fillStyle = primaryColor;
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const words = sentence.split(' ');
      const fontSize = Math.floor(Math.min(innerW * 0.2, (innerW * 0.85) / Math.max(...words.map(w => w.length))));
      ctx.font = `bold ${fontSize}px 'Black Han Sans', sans-serif`;

      const lineH = fontSize * 1.2;
      const startY = (targetSize / 2) - ((words.length * lineH) / 2) + lineH / 2;

      words.forEach((w, i) => {
        ctx.fillText(w, targetSize / 2, startY + i * lineH);
      });

      return canvas;
    }

    function renderStarCalligram(sentence, targetSize, options) {
      const { fingerBrush } = options;
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');

      const cx = targetSize / 2;
      const cy = targetSize / 2;
      const r = targetSize * 0.42;

      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (18 + i * 72) * Math.PI / 180;
        const ai = (54 + i * 72) * Math.PI / 180;
        ctx.lineTo(cx + Math.cos(a) * r, cy - Math.sin(a) * r);
        ctx.lineTo(cx + Math.cos(ai) * (r * 0.45), cy - Math.sin(ai) * (r * 0.45));
      }
      ctx.closePath();
      ctx.lineWidth = fingerBrush * 0.6;
      ctx.strokeStyle = '#111115';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fontSize = Math.floor(targetSize * 0.08);
      ctx.font = `bold ${fontSize}px 'Nanum Brush Script', cursive`;
      ctx.fillStyle = '#111115';
      ctx.fillText(sentence, cx, cy);
      ctx.restore();

      return canvas;
    }

    function renderShapeArtwork(sentence, shapeKey, targetSize, options) {
      if (shapeKey === 'hand') return renderPalmCalligram(sentence, targetSize, options);
      if (shapeKey === 'oval') return renderWideOvalCalligram(sentence, targetSize, options);
      if (shapeKey === 'rect') return renderSquareSealCalligram(sentence, targetSize, options);
      if (shapeKey === 'star') return renderStarCalligram(sentence, targetSize, options);
      return renderPalmCalligram(sentence, targetSize, options);
    }

    /* -------------------------------------------------------------
       5. SRT 파서
       ------------------------------------------------------------- */
    function parseSRTRobust(rawText) {
      const clean = rawText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = clean.split(/\n\n+/);
      const cues = [];

      function timeToMs(str) {
        const parts = str.trim().replace(',', '.').split(':');
        if (parts.length < 3) return 0;
        const secParts = parts[2].split('.');
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(secParts[0], 10) || 0;
        const ms = parseInt(secParts[1] || '0', 10);
        return (h * 3600 + m * 60 + s) * 1000 + ms;
      }

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        let timeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].includes('-->')) { timeIdx = i; break; }
        }
        if (timeIdx !== -1 && lines.length > timeIdx + 1) {
          const tParts = lines[timeIdx].split('-->');
          const start = timeToMs(tParts[0]);
          const end = timeToMs(tParts[1]);
          const text = lines.slice(timeIdx + 1).join(' ').trim();
          if (text && !isNaN(start) && !isNaN(end) && end > start) {
            cues.push({ start, end, text });
          }
        }
      });
      return cues;
    }

    /* -------------------------------------------------------------
       6. 2K 뷰포트 반응형 스케일러
       ------------------------------------------------------------- */
    const viewport = document.getElementById('viewport');
    const scaler = document.getElementById('canvas-viewport-scaler');
    const poemScroll = document.getElementById('poem-scroll');
    const ratioSelect = document.getElementById('ratio-select');

    let canvas2KWidth = 2560;
    let canvas2KHeight = 1440;

    function applyCanvasResolution() {
      if (ratioSelect.value === '16:9') {
        canvas2KWidth = 2560; canvas2KHeight = 1440;
        poemScroll.className = 'ratio-16-9';
      } else {
        canvas2KWidth = 1440; canvas2KHeight = 2560;
        poemScroll.className = 'ratio-9-16';
      }
      updateViewportScale();
    }

    function updateViewportScale() {
      const availableW = viewport.clientWidth - 70;
      const availableH = viewport.clientHeight - 70;
      const scaleX = availableW / canvas2KWidth;
      const scaleY = availableH / canvas2KHeight;
      const finalScale = Math.min(scaleX, scaleY, 1.0);
      scaler.style.transform = `scale(${finalScale})`;
    }

    window.addEventListener('resize', updateViewportScale);

    /* -------------------------------------------------------------
       7. 비동기 렌더링 엔진 (버튼 클릭 시 일괄 실행 & UI 블로킹 해제)
       ------------------------------------------------------------- */
    const tabSrt = document.getElementById('tab-srt');
    const tabDirect = document.getElementById('tab-direct');
    const sectionSrt = document.getElementById('section-srt');
    const sectionDirect = document.getElementById('section-direct');
    const srtInput = document.getElementById('srt-input');
    const srtStatus = document.getElementById('srt-status');
    const directTextInput = document.getElementById('direct-text');
    const shapeTypeSelect = document.getElementById('shape-type');
    const boxSealOptions = document.getElementById('box-seal-options');
    const sealCarveMode = document.getElementById('seal-carve-mode');
    const sealColorMode = document.getElementById('seal-color-mode');
    const showSplatterCheck = document.getElementById('show-splatter');

    const btnApply = document.getElementById('btn-apply');
    const applyStatusText = document.getElementById('apply-status-text');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const timeSlider = document.getElementById('time-slider');
    const timeText = document.getElementById('time-text');
    const scrollContent = document.getElementById('scroll-content');
    const centerPalmWrap = document.getElementById('center-palm-wrap');
    const audioInput = document.getElementById('audio-input');
    const bgAudio = document.getElementById('bg-audio');

    let currentMode = 'srt';
    let srtCues = [];
    let artworkCues = [];
    let totalDurationMs = 8000;
    let isPlaying = false;
    let startTime = 0;
    let animId = null;
    let activeCueIdx = -1;

    // 모드 탭 전환 (단순 UI 표시 변경, 즉시 렌더링 X)
    tabSrt.addEventListener('click', () => {
      currentMode = 'srt';
      tabSrt.classList.add('active');
      tabDirect.classList.remove('active');
      sectionSrt.style.display = 'block';
      sectionDirect.style.display = 'none';
      applyStatusText.textContent = "자막 모드로 변경되었습니다. [적용 버튼]을 눌러 렌더링하세요.";
    });

    tabDirect.addEventListener('click', () => {
      currentMode = 'direct';
      tabDirect.classList.add('active');
      tabSrt.classList.remove('active');
      sectionSrt.style.display = 'none';
      sectionDirect.style.display = 'block';
      applyStatusText.textContent = "직접 입력 모드로 변경되었습니다. [적용 버튼]을 눌러 렌더링하세요.";
    });

    // SRT 파일 선택 (파싱만 수행, 렌더링은 적용 버튼에서)
    srtInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        srtCues = parseSRTRobust(evt.target.result);
        if (srtCues.length > 0) {
          srtStatus.textContent = `✓ ${file.name} (${srtCues.length}개 자막 로드 완료)`;
          srtStatus.style.color = '#55db88';
          applyStatusText.textContent = `자막 ${srtCues.length}개 준비됨. 아래 [적용 버튼]을 눌러 렌더링하세요.`;
          currentMode = 'srt';
          tabSrt.classList.add('active');
          tabDirect.classList.remove('active');
          sectionSrt.style.display = 'block';
          sectionDirect.style.display = 'none';
        } else {
          srtStatus.textContent = `⚠ 자막 파싱 실패. SRT 형식을 확인해주세요.`;
          srtStatus.style.color = '#ff6b6b';
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    shapeTypeSelect.addEventListener('change', () => {
      boxSealOptions.style.display = (shapeTypeSelect.value === 'rect') ? 'flex' : 'none';
    });

    function getOptions() {
      return {
        textStroke: parseFloat(document.getElementById('text-stroke-range').value),
        fingerBrush: parseFloat(document.getElementById('finger-brush-range').value),
        showSplatter: showSplatterCheck.checked,
        carveMode: sealCarveMode.value,
        colorMode: sealColorMode.value
      };
    }

    // [핵심] 비동기 일괄 렌더링 함수
    async function executeBuildVisualization() {
      stopPlayback();
      applyCanvasResolution();
      boxSealOptions.style.display = (shapeTypeSelect.value === 'rect') ? 'flex' : 'none';

      // 1. UI 잠금 및 로딩 상태 표기
      btnApply.disabled = true;
      btnPlay.disabled = true;
      btnReset.disabled = true;
      btnApply.textContent = "⏳ 2K 렌더링 진행 중...";
      applyStatusText.textContent = "고해상도 손바닥 시화를 생성하고 화폭에 배치하는 중입니다...";

      // UI 렌더링 프레임 확보
      await new Promise(resolve => setTimeout(resolve, 60));

      scrollContent.innerHTML = '';
      centerPalmWrap.innerHTML = '';
      centerPalmWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      artworkCues = [];

      const shape = shapeTypeSelect.value;
      const options = getOptions();
      const scaleMultiplier = parseFloat(document.getElementById('glyph-scale-range').value) / 100;

      let rawLines = [];
      if (currentMode === 'srt') {
        if (srtCues.length === 0) {
          rawLines = [
            { start: 0, end: 3200, text: "동글동글 굴러오는 짠 바람에" },
            { start: 3200, end: 6500, text: "뺨마다 고운 피가 고이고" }
          ];
        } else {
          rawLines = srtCues;
        }
      } else {
        const textArr = directTextInput.value.split('\n').filter(l => l.trim().length > 0);
        const interval = 3000;
        rawLines = textArr.map((t, idx) => ({
          start: idx * interval,
          end: (idx + 1) * interval,
          text: t
        }));
      }

      // 화폭 배치 규격 계산
      const count = rawLines.length;
      let cols = Math.ceil(Math.sqrt(count * (canvas2KWidth / canvas2KHeight)));
      cols = Math.max(1, Math.min(cols, count));
      const rows = Math.ceil(count / cols);

      const maxCardW = (canvas2KWidth * 0.82) / cols - 36;
      const maxCardH = (canvas2KHeight * 0.82) / rows - 36;
      let cardSize = Math.floor(Math.min(maxCardW, maxCardH) * scaleMultiplier);
      cardSize = Math.max(160, Math.min(cardSize, 560));

      // 2. 비동기 청크 렌더링 (각 자막마다 순차 베이킹)
      for (let idx = 0; idx < rawLines.length; idx++) {
        const cueData = rawLines[idx];
        applyStatusText.textContent = `렌더링 진행 중: (${idx + 1} / ${rawLines.length}) 문장 베이킹 중...`;

        // 캔버스 생성
        const cardDiv = document.createElement('div');
        cardDiv.className = 'docked-palm-card';
        cardDiv.style.width = `${cardSize}px`;
        cardDiv.style.height = `${cardSize}px`;

        const palmCanvas = renderShapeArtwork(cueData.text, shape, cardSize, options);
        cardDiv.appendChild(palmCanvas);
        scrollContent.appendChild(cardDiv);

        artworkCues.push({
          index: idx,
          text: cueData.text,
          start: cueData.start,
          end: cueData.end,
          cardElement: cardDiv,
          shape: shape,
          options: options,
          landed: false
        });

        // 3개마다 비동기 딜레이를 주어 브라우저 프리징 완전 차단
        if (idx % 2 === 0) {
          await new Promise(resolve => setTimeout(resolve, 15));
        }
      }

      totalDurationMs = artworkCues[artworkCues.length - 1].end + 1200;
      timeSlider.max = totalDurationMs;
      timeSlider.value = 0;
      updateTime(0);

      // 3. 렌더링 완료 후 UI 복구
      btnApply.disabled = false;
      btnPlay.disabled = false;
      btnReset.disabled = false;
      btnApply.textContent = "⚡ 설정 적용 및 2K 렌더링";
      applyStatusText.textContent = `✓ 총 ${rawLines.length}개의 손바닥 시화 렌더링 완료! [시연 시작]을 누르세요.`;
      applyStatusText.style.color = '#55db88';
      setTimeout(() => { applyStatusText.style.color = '#a2a8ba'; }, 3500);
    }

    // 적용 버튼 클릭 이벤트 등록
    btnApply.addEventListener('click', executeBuildVisualization);

    /* -------------------------------------------------------------
       8. 애니메이션 재생 루프 및 화폭 도킹 연출
       ------------------------------------------------------------- */
    function updateFrame(currMs) {
      let currentCue = null;

      for (let i = 0; i < artworkCues.length; i++) {
        const cue = artworkCues[i];

        if (currMs >= cue.start) {
          if (!cue.landed) {
            cue.cardElement.classList.add('landed');
            cue.landed = true;
          }
        } else {
          if (cue.landed) {
            cue.cardElement.classList.remove('landed');
            cue.landed = false;
          }
        }

        if (currMs >= cue.start && currMs < cue.end) {
          currentCue = cue;
        }
      }

      // 화면 중앙 큼직한 손바닥 시화 타이핑 연출
      if (currentCue) {
        if (activeCueIdx !== currentCue.index) {
          activeCueIdx = currentCue.index;
          centerPalmWrap.innerHTML = '';

          const bigPalm = renderShapeArtwork(currentCue.text, currentCue.shape, 520, currentCue.options);
          bigPalm.style.filter = 'drop-shadow(4px 10px 18px rgba(0,0,0,0.4))';
          centerPalmWrap.appendChild(bigPalm);

          centerPalmWrap.classList.remove('active');
          void centerPalmWrap.offsetWidth;
          centerPalmWrap.classList.add('active');
        }
      } else {
        centerPalmWrap.classList.remove('active');
        activeCueIdx = -1;
      }

      // 마지막 자막 이후: 화폭 전체가 칠흑색 먹물로 변하며 낙관 인장 완성
      if (artworkCues.length > 0) {
        const lastCue = artworkCues[artworkCues.length - 1];
        if (currMs >= lastCue.end) {
          poemScroll.classList.add('completed');
          centerPalmWrap.classList.remove('active');
        } else {
          poemScroll.classList.remove('completed');
        }
      }

      timeSlider.value = currMs;
      updateTime(currMs);
    }

    function runLoop() {
      if (!isPlaying) return;

      let currMs;
      if (bgAudio.src && !bgAudio.paused) {
        currMs = bgAudio.currentTime * 1000;
      } else {
        currMs = performance.now() - startTime;
      }

      if (currMs >= totalDurationMs) {
        updateFrame(totalDurationMs);
        stopPlayback();
        return;
      }

      updateFrame(currMs);
      animId = requestAnimationFrame(runLoop);
    }

    function startPlayback() {
      if (artworkCues.length === 0) {
        executeBuildVisualization().then(() => startPlayback());
        return;
      }
      isPlaying = true;
      btnPlay.textContent = '일시 정지';

      const offset = parseFloat(timeSlider.value);
      startTime = performance.now() - offset;

      if (bgAudio.src) {
        bgAudio.currentTime = offset / 1000;
        bgAudio.play().catch(() => {});
      }

      animId = requestAnimationFrame(runLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      btnPlay.textContent = '시연 시작';
      if (animId) cancelAnimationFrame(animId);
      if (bgAudio.src) bgAudio.pause();
    }

    function updateTime(ms) {
      function pad(n) { return n < 10 ? '0' + n : n; }
      const cSec = Math.floor(ms / 1000);
      const tSec = Math.floor(totalDurationMs / 1000);
      timeText.textContent = `${pad(Math.floor(cSec / 60))}:${pad(cSec % 60)} / ${pad(Math.floor(tSec / 60))}:${pad(tSec % 60)}`;
    }

    /* -------------------------------------------------------------
       9. 재생 컨트롤 및 초기화
       ------------------------------------------------------------- */
    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      timeSlider.value = 0;
      // 단순 타임라인 리셋만 수행 (무거운 재렌더링 X)
      for (let i = 0; i < artworkCues.length; i++) {
        artworkCues[i].cardElement.classList.remove('landed');
        artworkCues[i].landed = false;
      }
      centerPalmWrap.classList.remove('active');
      poemScroll.classList.remove('completed');
      updateFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isPlaying) {
        startTime = performance.now() - val;
        if (bgAudio.src) bgAudio.currentTime = val / 1000;
      }
      updateFrame(val);
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgAudio.src = URL.createObjectURL(file);
    });

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(updateViewportScale, 310);
    });

    // 시작 시 1회 기본 빌드 실행
    window.addEventListener('DOMContentLoaded', () => {
      executeBuildVisualization();
    });
  </script>
</body>
</html>
